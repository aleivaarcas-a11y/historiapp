/* Un mundo único: estuco, teselas y pintura de programa de juegos. Tema oscuro fijo alrededor del juego. */
:root{
  --ink:#2a1d12;--panel:#f3ead6;--plaster:#ece1c8;--line:#8a6a44;--ocre:#a8642a;--gold:#c99a3b;--red:#8e2a1e;--muted:#6f5639;--paper:#fffaf0;--ground:#1d150d;
  --display:"Cinzel","Trajan Pro",Georgia,serif;--body:"Alegreya",Georgia,"Times New Roman",serif;--mono:"Courier New",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ground);overflow:hidden;font-family:var(--body);color:var(--ink)}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas#c{display:block;background:#2b2015;touch-action:none}
#panel{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,14,8,.58);z-index:5;padding:12px}
.box{background:var(--panel);border:3px solid var(--line);max-width:1080px;width:100%;max-height:94vh;overflow:auto;padding:22px 26px;box-shadow:0 10px 40px #000a;position:relative;outline:10px solid #3b2a1a}
.box.narrow{max-width:760px}
.box::before{content:"";position:absolute;left:0;right:0;top:0;height:9px;background:repeating-linear-gradient(90deg,#8a6a44 0 9px,#f3ead6 9px 13px,#2a1d12 13px 22px,#f3ead6 22px 26px)}
h1,h2,h3{margin:.25em 0 .45em;font-weight:normal;text-wrap:balance}
h1{font-family:var(--display);font-size:25px;letter-spacing:.04em}
h2{font-family:var(--display);font-size:17px;letter-spacing:.03em}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);margin-top:16px;font-family:var(--body);font-weight:700}
p{line-height:1.5;margin:.5em 0;max-width:75ch}
.row{display:flex;gap:14px;flex-wrap:wrap}
.col{flex:1 1 320px;min-width:0}
.card{border:2px solid #c7ad83;background:var(--paper);padding:12px 14px;flex:1 1 230px;min-width:0}
.card.sel{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.card.fac{cursor:pointer;text-align:center}
.card.fac canvas{display:block;margin:4px auto}
button{font-family:inherit;font-size:15px;padding:8px 14px;border:2px solid var(--ink);background:#f0dfb8;cursor:pointer;color:var(--ink);margin:2px 0}
button:hover{background:#ffeec8}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button.big{font-size:17px;padding:10px 20px;background:var(--ink);color:#f6efdf}
button.big:hover{background:#4a3420}
button.on{background:var(--ink);color:#f6efdf}
button:disabled{opacity:.4;cursor:default}
input,select{font-family:inherit;font-size:15px;padding:6px 8px;border:2px solid var(--line);background:var(--paper);color:var(--ink);min-width:180px;max-width:100%}
label{font-size:13px;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:14px;margin:6px 0;font-variant-numeric:tabular-nums}
td,th{border-bottom:1px solid #d9c6a0;padding:4px 6px;text-align:left;vertical-align:middle}
th{font-weight:normal;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
tr.me td{background:#efe0bd;font-weight:bold}
.bar{display:inline-block;height:8px;background:#d9c6a0;width:58px;vertical-align:middle;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:#6b4a26}
.bar.inv i{background:repeating-linear-gradient(45deg,#6b4a26 0 3px,#a07a4c 3px 6px)}
.num{display:inline-block;width:2.2em;text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
.muted{color:var(--muted);font-size:13px}
.lock{color:#7a3a20;font-size:13px;font-style:italic}
.warn{background:#f6dcc8;border-left:4px solid var(--red);padding:6px 10px;font-size:14px}
.neg{color:var(--red)}
.tag{display:inline-block;font-size:12px;padding:1px 6px;border:1px solid var(--line);margin-left:4px;font-style:normal;vertical-align:middle;font-family:var(--body)}
.tag.th{background:#efe0bd}.tag.tc{background:var(--ink);color:#f6efdf;border-color:var(--ink)}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:9px;background:#e5d6b4;border:1px solid #c7ad83;margin:2px 4px 2px 0;cursor:help}
.note{font-size:13.5px;color:#5a3f22;border-left:3px solid var(--gold);padding-left:10px;margin:10px 0}
.tabs{margin:10px 0 8px;display:flex;flex-wrap:wrap;gap:4px}.tabs button{font-size:14px;padding:6px 11px;margin:0}
.hdr{display:flex;gap:14px;align-items:center;flex-wrap:wrap}

.slot.full{border-style:solid;background:#efe0bd}

@media (max-width:620px){.box{padding:18px 16px}.logo{font-size:38px}.hcard canvas{width:84px;height:56px}.lang{position:static;justify-content:flex-end}}

/* ---------- aspecto romano: mármol, pórfido, bronce, mosaico y tabula ansata ---------- */

#panel{background:radial-gradient(ellipse at center,rgba(40,14,20,.55),rgba(14,8,6,.78))}
.box{background:
  linear-gradient(118deg,transparent 0 22%,rgba(140,128,110,.06) 22.3% 22.6%,transparent 23% 61%,rgba(150,136,118,.05) 61.2% 61.4%,transparent 62%),
  linear-gradient(32deg,transparent 0 40%,rgba(160,148,128,.05) 40.2% 40.4%,transparent 41%),
  radial-gradient(ellipse at 25% 15%,#fbf9f4,var(--marble) 45%,var(--marble2));
  border:3px solid var(--bronze);outline:8px solid #2a1810;box-shadow:inset 0 0 0 1px var(--bronzeL),0 10px 40px #000a}
.box::before{height:10px;background:repeating-linear-gradient(90deg,var(--porph) 0 9px,var(--marble) 9px 12px,var(--bronze) 12px 21px,var(--marble) 21px 24px,#2a1d12 24px 33px,var(--marble) 33px 36px)}
h1,h2,.logo,.ed-h,.titulus .lat,th,.tabs button,button.big,.kpis b,.progress span{font-family:var(--display)}
h1{color:var(--porph2);font-weight:600;letter-spacing:.06em}
h2{color:var(--porph2);font-weight:600}
h3{font-family:var(--display);font-weight:600;color:var(--bronzeD);letter-spacing:.12em}
th{letter-spacing:.06em;color:var(--bronzeD)}
button{background:linear-gradient(#fbf8f1,#e8dfcc);border:2px solid var(--bronzeD);box-shadow:inset 0 0 0 1px #fffdf7,0 2px 0 rgba(94,63,24,.45);color:var(--ink)}
button:hover{background:linear-gradient(#fffdf8,#efe7d6)}
button.big,button.on{background:linear-gradient(var(--porph),var(--porph2));color:var(--leaf);border-color:var(--bronzeL);box-shadow:inset 0 0 0 1px rgba(236,208,138,.45),0 2px 0 #2a0c10;letter-spacing:.04em}

.slot{border-color:var(--bronze)}.slot.full{background:linear-gradient(#f5ead0,#e9dbb7)}
tr.me td{background:#ecdcc0}
.bar i{background:var(--bronzeD)}
.ask{border-color:var(--bronze);background:linear-gradient(#fdfaf2,#f4ecdb)}
.cer{background:linear-gradient(var(--porph),var(--porph2));color:#f6ead0;border:2px solid var(--bronzeL)}
.titulus{background:linear-gradient(#efe9dc,#e3dac7);border:6px double var(--bronze)}
.progress span{border-color:var(--bronze);min-width:30px;width:auto;padding:0 6px}
.progress .done{background:linear-gradient(var(--porph),var(--porph2));color:var(--leaf);border-color:var(--bronzeL)}
.kpis b{font-weight:600}
/* tabula ansata: la placa de bronce con orejas de cola de milano */
.ansata{position:relative;display:inline-block;margin:4px 30px;padding:4px 22px;background:linear-gradient(#e2bd75,#b88a45 55%,#9a6f36);border:2px solid var(--bronzeD);color:#2a1608;font-family:var(--display);font-weight:600;letter-spacing:.18em;box-shadow:inset 0 0 0 2px rgba(255,236,190,.55),0 3px 0 rgba(42,22,8,.45);text-shadow:0 1px 0 rgba(255,240,205,.6)}
.ansata::before,.ansata::after{content:"";position:absolute;top:50%;width:26px;height:74%;transform:translateY(-50%);background:linear-gradient(#d4ac63,#9a6f36);border:0}
.ansata::before{left:-26px;clip-path:polygon(100% 0,0 50%,100% 100%)}
.ansata::after{right:-26px;clip-path:polygon(0 0,100% 50%,0 100%)}
.logo.ansata{font-size:46px;letter-spacing:.22em;padding:2px 18px 2px 28px;margin:12px 30px 6px}

/* la fila de botones principales queda a la vista aunque la ventana se desplace */
.act{position:sticky;bottom:-22px;z-index:4;margin:8px -26px -22px;padding:12px 26px 14px;background:linear-gradient(rgba(243,234,214,0),var(--panel) 12px);max-width:none}

/* centro de la cuadra: cabecera, salidas y pestañas */
.hubexit{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;margin:6px 0 0}.hubexit button{margin:0}
.lgs{display:flex;gap:4px}

const CODEX={
 circo:{t:'El circo romano',k:'H',g:'Los circos',x:'Los circos eran recintos muy alargados, con un extremo recto para las cocheras de salida (carceres) y otro curvo, y una barrera central que dividía la pista en dos, de modo que la forma del edificio era la forma de la carrera (Tema 4). Bell (2020, p. 4) cuenta más de cincuenta fuera de Roma, diecinueve de ellos en Hispania (doce confirmados), con longitudes que van de 269 a más de 500 metros. Era el edificio de espectáculo más caro de levantar, y en los cimientos del de Arles se emplearon unos 25.000 pinos y robles (Bell, 2020, pp. 4-5).'},
 tarraco:{t:'El circo de Tarraco',k:'H',g:'Los circos',x:'El circo de Tarraco se construyó en el siglo I d. C. en el centro de la ciudad, unido al santuario del culto imperial, y llegó a ocupar casi el veinte por ciento del área urbana (Bell, 2020, p. 4). Su pista medía 290 metros de longitud por 67 de anchura, mucho menos que las de Mérida o Toledo, y una fachada de 325 metros con 56 arcos daba a la vía Augusta (Ruiz de Arbulo y Gris, 2021, pp. 201 y 205). Los carceres formaban dos grupos de seis a los lados de la tribuna del organizador (p. 197). Por su tamaño, los autores proponen que quizá solo acogió carreras menores, con uno o dos carros por cada facción (p. 205).'},
 maximo:{t:'El Circo Máximo',k:'H',g:'Los circos',x:'El Circo Máximo, en el valle entre el Aventino y el Palatino, fue el edificio de espectáculos más grande de Roma. Medía unos 621 metros de largo por 140 de ancho (Tema 4), aunque Bell (2020, p. 3) le da unos 580 por 140 en la fase de Trajano, y su pista medía 580 metros por 79 (Ruiz de Arbulo y Gris, 2021, p. 205). Acogía unos 150.000 espectadores según Dionisio de Halicarnaso, o incluso 250.000 (Bell, 2020, p. 3), y doce carros cabían en la salida. A diferencia del Coliseo, no tenía toldo, y el público sufría el sol (Bell, 2014, p. 499).'},
 carceres:{t:'Carceres',k:'H',g:'La carrera',x:'Los carceres eran las doce cocheras de salida, en el extremo recto del circo. Cada carro esperaba en el puesto que le había tocado por sorteo (Bell, 2020, pp. 10-11), y al sonar la señal los tentores accionaban el sistema que abría las doce puertas a la vez (Nelis-Clément, 2002, p. 302).'},
 mappa:{t:'La mappa',k:'H',g:'La carrera',x:'La salida la daba quien pagaba los juegos, que dejaba caer desde su palco un pañuelo blanco, la mappa (Bell, 2020, p. 11), un privilegio que otorgaba gran fama (Ruiz de Arbulo y Gris, 2021, p. 197). Como los aurigas no veían la mappa desde los carceres, se recurría a los músicos, y en particular al tubicen, el trompetero (Nelis-Clément, 2002, p. 289).'},
 euripus:{t:'Spina o euripus',k:'H',g:'La carrera',x:'La barrera central se llamaba propiamente euripus, aunque hoy se la conoce más como spina (Bell, 2014, p. 493), y llevaba estanques de agua (Ruiz de Arbulo y Gris, 2021, p. 197). Era también un espacio sagrado, puesto que allí estaba el santuario de Conso, el dios arcaico de las primeras carreras (Bell, 2020, pp. 5-7), y Tertuliano decía que cada adorno de la pista era un templo (Tema 4).'},
 metae:{t:'Las metas',k:'H',g:'La carrera',x:'Las metas eran los postes cónicos de cada extremo de la barrera, alrededor de los cuales giraban los carros. En siete vueltas había que rodearlas trece veces, y allí ocurrían la mayoría de los accidentes (Bell, 2020, p. 13).'},
 ova:{t:'Huevos y delfines',k:'H',g:'La carrera',x:'El público seguía la carrera por los contadores de la barrera, siete huevos en un extremo y siete delfines en el otro, que se bajaban en cada vuelta (Bell, 2014, p. 494). Según Tertuliano, los huevos eran de Cástor y Pólux y los delfines honraban a Neptuno (Tema 4). Un señalero con banderolas junto a la primera meta indicaba en cada vuelta el color del carro que iba en cabeza (Nelis-Clément, 2002, p. 283).'},
 alba:{t:'Alba linea',k:'H',g:'La carrera',x:'Unos jueces confirmaban el orden de llegada sobre una línea de yeso, la alba linea (Ruiz de Arbulo y Gris, 2021, p. 197).'},
 vueltas:{t:'Siete vueltas',k:'H',g:'La carrera',x:'Las carreras eran de siete vueltas en sentido contrario a las agujas del reloj, unos cinco kilómetros en ocho o nueve minutos a unos 35 km/h de media, cifras de Junkelmann que Bell matiza (Bell, 2020, p. 12). Fauquet calcula 5.335 metros y doce minutos y 48 segundos a unos 25 km/h (Nelis-Clément, 2002, p. 280). En los juegos seculares las vueltas se redujeron de siete a cinco para poder correr cien carreras (Nelis-Clément, 2002, p. 299, n. 133).'},
 naufragium:{t:'Naufragium',k:'H',g:'La carrera',x:'Los choques y vuelcos se llamaban naufragia, y aparecen en la mayoría de las imágenes, de modo que eran frecuentes y gustaban al público (Bell, 2014, p. 495). Provocar el naufragium del rival era incluso una táctica tolerada por el reglamento (Nelis-Clément, 2002, p. 301). Los asistentes de pista tenían apenas un minuto para despejar antes de que volvieran los carros (Bell, 2020, p. 13), y los stratores retiraban a los aurigas heridos (Ruiz de Arbulo y Gris, 2021, p. 198).'},
 riendas:{t:'Riendas a la cintura',k:'H',g:'Los aurigas',x:'Los aurigas romanos, como los etruscos y a diferencia de los griegos, se ataban las riendas a la cintura y dominaban el carro con el peso del cuerpo, con más riesgo de ser arrastrados si volcaban. Para ese caso llevaban un cuchillo con el que cortarlas, además de casco acolchado, túnica gruesa con bandas de cuero en el pecho y polainas, las fasciae crurales (Bell, 2020, pp. 17-18). Thuillier (2003, p. 303) habla de una técnica de conducción «tan típicamente etrusca y romana».'},
 tiros:{t:'Bigas, trigas y cuadrigas',k:'H',g:'Los caballos',x:'En el circo corrían bigas (dos caballos), trigas (tres) y, sobre todo, cuadrigas (cuatro) (Bell, 2020, p. 11). La triga la heredó Roma de los etruscos, y se conocen carreras de hasta diez caballos, pruebas de habilidad excepcionales (Tema 4). En los juegos seculares de Septimio Severo cada facción presentaba dos cuadrigas y dos bigas (Thuillier, 1989, p. 47).'},
 guia:{t:'¿Qué caballo guiaba el viraje?',k:'H',g:'Los caballos',x:'En la cuadriga iban dos caballos uncidos al yugo en el centro (iugales) y dos sujetos por rienda a los lados (funales). Bell (2020, pp. 21-22) señala como el más importante al caballo experimentado del interior izquierdo, el introiugus. Thuillier (2003, pp. 296-297) apunta en cambio al funalis de la izquierda, al que un sparsor refresca en un mosaico de Madrid, porque era el más importante para pasar las metas. El debate sigue abierto, y en el juego eliges tú qué puesto guía.'},
 auriga:{t:'Auriga y agitator',k:'H',g:'Los aurigas',x:'Auriga y agitator no eran sinónimos. El auriga era un conductor de bigas menos experimentado, y el agitator, un conductor de cuadrigas de mayor rango (Bell, 2020, p. 16), puesto que solo los cocheros más expertos llevaban la cuadriga (Nelis-Clément, 2002, p. 273). Quien ganaba con cuadriga ascendía de categoría (Bell, 2014, p. 495). Por eso en el juego tu auriga empieza con bigas y tiene que ganar para que le confíen una cuadriga.'},
 facciones:{t:'Las facciones',k:'H',g:'Las facciones',x:'Las facciones eran empresas. Desde el Principado, o quizá desde finales de la República, alquilaban al organizador los caballos, los aurigas y el material, y la palabra factio designaba los colores y las cuadras, no a los grupos de aficionados (Nelis-Clément, 2002, pp. 266-267). Al frente estaba el dominus factionis, un hombre de negocios del orden ecuestre que negociaba sus servicios y sus precios con quien pagaba los juegos (p. 267). Cada facción mantenía cientos de entrenadores, mozos, médicos y ayudantes (Bell, 2014, p. 495), y sus establos estaban en el Campo de Marte, a uno o dos kilómetros del circo (Bell, 2020, p. 10).'},
 colores:{t:'Cuatro colores',k:'H',g:'Las facciones',x:'Las facciones eran cuatro, blancos (albata), rojos (russata), verdes (prasina) y azules (veneta). Domiciano añadió un dorado y un púrpura que duraron lo que su reinado (Bell, 2020, p. 9; Nelis-Clément, 2002, p. 267). Verdes y azules fueron los más populares (Bell, 2020, p. 9), y Plinio el Joven se burlaba de un público que seguía ciegamente a sus colores, hasta el punto de que si los equipos cambiaran de color los aficionados cambiarían de bando (Crowther, 1996, p. 448).'},
 alianzas:{t:'Alianzas entre colores',k:'H',g:'Las facciones',x:'Las facciones se aliaban por parejas, aunque los autores no coinciden en cuáles. Bell (2020, p. 9) afirma que los verdes iban con los rojos y los azules con los blancos. Thuillier (2003, pp. 306-308), a partir de tres mosaicos de Madrid, sostiene que predominaba la alianza de azules y rojos frente a la de blancos y verdes, y recuerda que las tablillas de maldición muestran también otras combinaciones. En Roma el juego te deja elegir con qué lectura corres.'},
 familia:{t:'La familia quadrigaria',k:'H',g:'Las facciones',x:'La inscripción del columbario de la familia de Tito Ateyo Capitón, de época augustea, es la lista más completa del personal de una cuadra, con doce oficios (Nelis-Clément, 2002, p. 267). Recoge seis aurigas y, entre otros, al sutor, al sellarius, al tentor, al morator, al sparsor, al medicus y al conditor (Bell, 2020, p. 10). Como solo nombra a los muertos de la familia, no dice cuántas personas tenía una facción (Nelis-Clément, 2002, p. 268).'},
 sparsor:{t:'El sparsor',k:'H',g:'Las facciones',x:'El sparsor tenía por oficio echar agua a la cabeza de los caballos durante la carrera para refrescarlos (Nelis-Clément, 2002, p. 280). Thuillier (2003, p. 306) defiende que no era un personaje menor, puesto que tenía un rango apreciable en la jerarquía del circo por los peligros que corría a pie de pista.'},
 hortator:{t:'El hortator',k:'H',g:'Las facciones',x:'El hortator iba a caballo y su tarea era animar a los caballos y al auriga de su cuadra durante la carrera (Nelis-Clément, 2002, p. 281).'},
 conditor:{t:'El conditor',k:'H',g:'Las facciones',x:'El conditor de la facción se encargaba de la alimentación y de la cría de los caballos (Nelis-Clément, 2002, p. 300). El altar de L. Avilio Dionisio, conditor de los rojos, muestra a los caballos Aquilón, con 130 victorias, 88 segundos puestos y 37 terceros, e Hirpino, con 114 victorias, y el monumento presume más de la fama de los caballos que de los méritos del difunto (Bell, 2020, p. 24).'},
 medicus:{t:'El medicus',k:'H',g:'Las facciones',x:'El medicus figura en la lista de la familia quadrigaria de Capitón (Bell, 2020, p. 10), y cada facción tenía médicos entre su personal (Bell, 2014, p. 495; Ruiz de Arbulo y Gris, 2021, p. 199).'},
 caballos:{t:'Los caballos de carreras',k:'H',g:'Los caballos',x:'Los caballos de carreras eran sobre todo machos de entre 135 y 155 cm, que empezaban a correr a los cinco años según Plinio y podían competir hasta los veinte (Bell, 2020, pp. 21-22). Un día de juegos exigía del orden de 700 a 800 caballos, procedentes de yeguadas privadas e imperiales de Hispania, Sicilia, Tesalia, el norte de África y Capadocia, con preferencia por los africanos en el primer Imperio (Bell, 2020, p. 21).'},
 nombres:{t:'Nombres de caballos',k:'H',g:'Los caballos',x:'Bell (2020, p. 23) habla de cerca de 600 nombres de caballos conservados, ordenables en seis categorías (habilidad, aspecto, origen, expectativas, comportamiento y afecto), mientras que Ruiz de Arbulo y Gris (2021, p. 200) dicen conocer más de mil. En el juego, Aquilón e Hirpino son nombres documentados (Bell, 2020, p. 24); los demás están inventados a imitación de esas categorías.'},
 condicion:{t:'Esclavos de la pista',k:'H',g:'Los aurigas',x:'Los aurigas eran esclavos, libertos o romanos de muy baja condición. De unos 230 catalogados solo uno había nacido libre, P. Elio Guta Calpurniano (Nelis-Clément, 2002, p. 274), y de los conocidos con estatuto seguro, 66 eran esclavos y 14 libertos (Bell, 2014, p. 496). Pese a su fama, ocupaban el último escalón de la sociedad (Nelis-Clément, 2002, p. 276). Bell (2014) los daba por infames ante la ley, y Bell (2020, pp. 14-15) corrige esa idea como un mito moderno, puesto que los juristas no les imponían restricciones legales (Tema 4).'},
 ninos:{t:'Aurigas niños',k:'H',g:'Los aurigas',x:'Los aurigas empezaban de niños. El mauritano Crescens tenía trece años cuando ganó su primera carrera con cuadriga, en 115 d. C. (Nelis-Clément, 2002, p. 273), y Sexto Vistilio Heleno, traspasado de los verdes a los azules con su entrenador, murió a los trece (Bell, 2014, p. 497).'},
 traspasos:{t:'Traspasos',k:'H',g:'Los aurigas',x:'Los aurigas cambiaban de facción como agentes libres, incluso siendo esclavos (Bell, 2020, pp. 16-17). Los traspasos eran frecuentes, y Muscloso llegó a correr sucesivamente en las cuatro facciones (Nelis-Clément, 2002, p. 275).'},
 diocles:{t:'Diocles',k:'H',g:'Los aurigas',x:'Diocles, un liberto de Lusitania, corrió veinticuatro años, de 122 a 146 d. C., participó en 4.257 carreras, quedó segundo en 2.900 y ganó 1.462, y se retiró a los cuarenta y dos años (Bell, 2020, pp. 18-19). Su inscripción suma 35.863.120 sestercios en premios, casi treinta y seis veces el censo de un senador (Tema 4). Bell (2020, p. 19) lo compara con Tiger Woods y lo tiene quizá por el deportista mejor pagado de la historia, aunque la fortuna de Séneca se calcula en 300 millones (Nelis-Clément, 2002, p. 275).'},
 miliarios:{t:'Los miliarios',k:'H',g:'Los aurigas',x:'Los miliarios, los aurigas que pasaron de mil victorias, formaban un grupo cerrado con Diocles, Guta Calpurniano, Escorpo y Pompeyo Muscloso (Bell, 2020, p. 19). Escorpo murió a los veintisiete años tras más de dos mil victorias (Tema 4), y Marcial se quejaba de que ganara quince bolsas de oro en una hora (Nelis-Clément, 2002, p. 277).'},
 premios:{t:'Premios',k:'H',g:'El dinero',x:'Para las cuadrigas, el primer premio normal (pura) parece haber sido de 20.000 sestercios, y los de seis o siete caballos valían de 30.000 a 50.000 (Bell, 2020, p. 19). Thuillier (1989, p. 48) da grandes premios de 30.000 a 60.000 sestercios a partir de la inscripción de Diocles, y en los juegos seculares de Severo el tercer puesto de cuadrigas cobraba 4.000. En provincias bastaba mucho menos, y en Auzia 135 denarios alcanzaron para seis carreras (Nelis-Clément, 2002, p. 294).'},
 sestercio:{t:'El sestercio',k:'H',g:'El dinero',x:'Los romanos llevaban sus cuentas en sestercios (HS), y cuatro sestercios hacían un denario de plata. La mejor vara de medir es la paga de un legionario, unos 1.400 sestercios al año en el siglo I d. C., mientras que para ser senador hacía falta un patrimonio de un millón (Tema 4). En el juego, cada cifra lleva al lado su equivalencia en años de paga de un legionario.'},
 editor:{t:'El editor',k:'H',g:'El dinero',x:'El magistrado que organizaba unos juegos, el editor, recibía dinero público y solía añadir el suyo. La ley de la colonia de Urso, del 44 a. C., obligaba a sus duunviros a dar cuatro días de espectáculos con 2.000 sestercios públicos y otros 2.000 de su bolsillo (Tema 4). A cambio recibía reconocimiento, el intercambio que Paul Veyne llamó evergetismo. El editor pagaba a las facciones, que actuaban como contratistas (Bell, 2020, pp. 9-10).'},
 calendario:{t:'Los ludi circenses',k:'H',g:'Roma',x:'Siete fiestas del calendario religioso del Estado incluían juegos circenses anuales, los Megalenses, los Cereales, los Florales, los Apolinares, los Romanos, los de la Victoria y los Plebeyos (Bell, 2020, p. 5). En el apogeo del Imperio había 175 días de ludi, de los que 64 eran de carreras (Crowther, 1996, p. 445). Un registro de mediados del siglo IV da unas 24 carreras por jornada y unos 66 días de juegos al año, aunque es un dato tardío que no vale para todas las épocas (Bell, 2020, p. 9).'},
 pompa:{t:'Pompa y pulvinar',k:'H',g:'Roma',x:'La procesión circense, la pompa circensis, llevaba las imágenes doradas de los dioses hasta el pulvinar, donde presidían los juegos junto al emperador, de modo que los dioses eran imaginados como espectadores (Bell, 2020, p. 7). Durante el Imperio el pulvinar pasó a ser la tribuna del emperador (Ruiz de Arbulo y Gris, 2021, p. 197).'},
 victoria:{t:'La ceremonia de la victoria',k:'H',g:'La carrera',x:'El vencedor daba una vuelta conmemorativa, subía a la tribuna de los jueces a recoger la palma, la corona y la bolsa, y probablemente hacía una libación a los dioses, mientras una trompeta anunciaba su victoria (Bell, 2020, p. 12). En Roma, a diferencia de Olimpia, se proclamaba vencedor al auriga y no al dueño de los caballos (Nelis-Clément, 2002, p. 265).'},
 tipos:{t:'Tipos de carrera',k:'H',g:'La carrera',x:'Había carreras de dos, tres o cuatro equipos, carreras en las que cada facción presentaba un solo auriga (certamina singularum), de mayor rango, y el diversium, en el que dos aurigas se intercambiaban la cuadriga tras la carrera anterior (Bell, 2020, p. 13). Las de más prestigio enfrentaban a cuatro cuadrigas, con cada facción presentando su mejor auriga y su mejor tiro (Nelis-Clément, 2002, p. 272). Cuatro escuderías alineaban cuatro, ocho o doce carros (Ruiz de Arbulo y Gris, 2021, p. 197).'},
 nica:{t:'NICA y defixiones',k:'H',g:'La afición',x:'Los aficionados llevaban anillos y amuletos con la imagen de su auriga o con fórmulas como NICA PRASINE, «¡vence, verde!» (Bell, 2020, p. 18). Otros encargaban tablillas de maldición (defixiones), láminas de plomo que invocaban a los demonios contra un auriga o sus caballos y se enterraban en las salidas o en la pista, sobre todo en el norte de África (Bell, 2014, p. 500). En el juego, la tablilla no tiene ningún efecto sobre la carrera.'},
 aficion:{t:'La afición',k:'H',g:'La afición',x:'La pasión por las carreras alcanzaba a todas las edades, sexos y clases sociales (Bell, 2014, p. 499). En el funeral de Félix, auriga de los rojos, un aficionado se arrojó a la pira (Bell, 2014, p. 492), y los padres vestían a sus hijos con chaquetitas verdes (p. 501). En el circo, a diferencia del teatro y del anfiteatro, hombres y mujeres podían sentarse juntos (p. 500). Amiano Marcelino llamó al Circo Máximo el templo, la casa y la asamblea de la plebe, mientras que Plinio el Joven presumía de no compartir ese gusto (p. 499).'},
 tarracoAurigas:{t:'Fusco y Eutiques',k:'H',g:'Los circos',x:'En Tarraco se conservan dos epitafios de aurigas. El de Fusco, de los azules, lo pagaron sus seguidores, que se llaman a sí mismos «bene amantes». El de Eutiques, un esclavo que murió de enfermedad a los veintidós años cuando ya se atrevía con las cuadrigas, lamenta no haber alcanzado la gloria de morir en el circo (Ruiz de Arbulo y Gris, 2021, p. 199), y Bell (2020, p. 18) lo fecha en 104 d. C.'},
 caligula:{t:'Arena de colores',k:'H',g:'Roma',x:'Calígula mandó espolvorear la arena del circo para volverla roja y verde, con plomo y cobre en polvo según Bell (2020, p. 11) o con minio y malaquita según Thuillier, que sigue a Suetonio.'},
 constantinopla:{t:'Constantinopla',k:'H',g:'Roma',x:'En Occidente la última carrera atestiguada es de 549 (Nelis-Clément, 2002, p. 298), mientras que en Constantinopla las carreras siguieron durante siglos, con azules y verdes al frente. En 532, en la revuelta Nika («vence»), azules y verdes se unieron y aclamaron a otro emperador, y la represión terminó con unos treinta mil muertos en el hipódromo (Tema 4).'},
 panem:{t:'Pan y carreras',k:'H',g:'Roma',x:'La fórmula «pan y circo» nació como reproche. El poeta Juvenal escribió, hacia el siglo II d. C., que la plebe, que antes repartía mandos y legiones, ya solo deseaba dos cosas, pan y carreras (Tema 4).'},
 iconografia:{t:'Cómo se representaba al vencedor',k:'H',g:'Los aurigas',x:'En los mosaicos de Madrid estudiados por Thuillier (2003, p. 299), el auriga vencedor lleva casco con carrilleras levantadas, un corsé de tiras de cuero en V alrededor del cuello, la palma en la mano izquierda y el látigo en la derecha, la iconografía convencional de la que hay decenas de ejemplos. El auriga verde del tercer tablero muestra además las riendas atadas a la cintura (p. 303).'},
 peticion:{t:'Pedir en la grada',k:'H',g:'Roma',x:'El circo era también un lugar para pedir. El público aprovechaba la presencia del emperador para reclamar a gritos, por ejemplo, una rebaja de impuestos, y él respondía allí mismo (Tema 4; Bell, 2020, pp. 7-9). Crowther (1996, p. 445) recuerda que anfiteatros, teatros y circos funcionaban como asambleas del pueblo.'},
 tarracoCiudad:{t:'Tarraco y Augusto',k:'H',g:'Los circos',x:'Augusto residió dos años en Tarraco durante las guerras cántabras, y el concilio provincial, que se reunía cada año en la ciudad para el culto imperial, defendía los intereses de las élites de la provincia (Ruiz de Arbulo y Gris, 2021, p. 200). En las fiestas del culto imperial bajaban hacia el circo doscientos o trescientos delegados provinciales (p. 207). La grada tenía tres filas bajas, un pasillo y cinco filas altas, sobre un podio de 2,5 metros con barandilla (pp. 204 y 206).'},
 /* convenciones del juego */
 cPrecios:{t:'Precios de caballos y salarios',k:'C',g:'Convenciones del juego',x:'Las fuentes de clase no dan precios de caballos de carreras romanos ni salarios del personal de una cuadra, de modo que las cifras del mercado, de los sueldos y del mantenimiento son convenciones del juego. Se han ajustado para que Tarraco sea modesta y Roma mueva premios del orden de los 20.000 sestercios que da Bell (2020, p. 19).'},
 cYeguadas:{t:'Perfil de las yeguadas',k:'C',g:'Convenciones del juego',x:'Las cinco yeguadas son las que citan las fuentes (Bell, 2020, p. 21), pero el perfil de cada una (más velocidad, más aguante o mejor guía) es una convención del juego.'},
 cTriga:{t:'El tercer caballo de la triga',k:'C',g:'Convenciones del juego',x:'Nuestras fuentes de clase no dicen dónde iba el tercer caballo de la triga. El juego te deja engancharlo por fuera o por dentro y calcula su tirón según el lado, como hipótesis que puedes probar en la pista.'},
 cPista:{t:'Medidas de la spina',k:'C',g:'Convenciones del juego',x:'Las medidas de las pistas de Tarraco (290 × 67 m) y del Circo Máximo (580 × 79 m) salen de Ruiz de Arbulo y Gris (2021, p. 205). La longitud de la barrera, el número de vueltas de cada carrera y la velocidad de los caballos son convenciones ajustadas para que una carrera quepa en unos minutos de clase.'},
 cRasgos:{t:'Rasgos de los caballos',k:'C',g:'Convenciones del juego',x:'Los rasgos de cada caballo (bueno en la cuerda, rápido en la salida, se asusta con el polvo, fogoso…) y el desboque por abuso del látigo son convenciones del juego. Se inspiran en las categorías de nombres que recoge Bell (2020, p. 23), entre ellas la habilidad y el comportamiento.'},
 cAurigas:{t:'Varios aurigas y el miedo',k:'C',g:'Convenciones del juego',x:'Que la cuadra tenga hasta tres aurigas se apoya en la familia quadrigaria de Capitón, con seis aurigas (Bell, 2020, p. 10), y en los aurigas que empezaban a los trece años (Nelis-Clément, 2002, p. 273). El miedo tras un naufragium y sus efectos son convenciones del juego.'},
 cMiliario:{t:'El miliario del juego',k:'C',g:'Convenciones del juego',x:'Los miliarios reales pasaron de mil victorias (Bell, 2020, p. 19). Como una partida no da para tanto, el juego llama «miliario de la cuadra» al auriga que llega a cincuenta, a escala.'},
 cAscenso:{t:'Ascensos, prestigio y libertad',k:'C',g:'Convenciones del juego',x:'Que el auriga pase a la cuadriga tras ganar con biga se apoya en Bell (2014, p. 495) y Bell (2020, p. 16), pero el número de victorias exigido, la escala de prestigio, el precio de la libertad y la invitación a Roma son convenciones del juego.'}

/* Codex: id -> {t: title, x: text} */
const CODEX_EN={
 circo:{t:'The Roman circus',x:'Circuses were very elongated enclosures, with one straight end for the starting gates (carceres), one curved end, and a central barrier that divided the track in two, so that the shape of the building was the shape of the race (Tema 4). Bell (2020, p. 4) counts more than fifty outside Rome, nineteen of them in Hispania (twelve confirmed), with lengths ranging from 269 to more than 500 metres. It was the most expensive entertainment building to erect, and some 25,000 pines and oaks were used in the foundations of the circus at Arles (Bell, 2020, pp. 4-5).'},
 tarraco:{t:'The circus of Tarraco',x:'The circus of Tarraco was built in the 1st century AD in the centre of the city, joined to the sanctuary of the imperial cult, and came to occupy almost twenty per cent of the urban area (Bell, 2020, p. 4). Its track measured 290 metres in length by 67 in width, much less than those of Mérida or Toledo, and a façade of 325 metres with 56 arches faced the Via Augusta (Ruiz de Arbulo & Gris, 2021, pp. 201 and 205). The carceres formed two groups of six on either side of the organiser’s tribune (p. 197). Because of its size, the authors suggest that it may have hosted only minor races, with one or two chariots per faction (p. 205).'},
 maximo:{t:'The Circus Maximus',x:'The Circus Maximus, in the valley between the Aventine and the Palatine, was the largest entertainment building in Rome. It measured about 621 metres long by 140 wide (Tema 4), although Bell (2020, p. 3) gives it about 580 by 140 in the Trajanic phase, and its track measured 580 metres by 79 (Ruiz de Arbulo & Gris, 2021, p. 205). It held some 150,000 spectators according to Dionysius of Halicarnassus, or even 250,000 (Bell, 2020, p. 3), and twelve chariots fitted at the start. Unlike the Colosseum, it had no awning, and the crowd suffered in the sun (Bell, 2014, p. 499).'},
 carceres:{t:'Carceres',x:'The carceres were the twelve starting gates at the straight end of the circus. Each chariot waited in the stall it had been allotted by lot (Bell, 2020, pp. 10-11), and when the signal sounded the tentores worked the mechanism that opened all twelve gates at once (Nelis-Clément, 2002, p. 302).'},
 mappa:{t:'The mappa',x:'The start was given by the person who paid for the games, who dropped a white cloth, the mappa, from his box (Bell, 2020, p. 11), a privilege that brought great fame (Ruiz de Arbulo & Gris, 2021, p. 197). As the charioteers could not see the mappa from the carceres, musicians were used, in particular the tubicen, the trumpeter (Nelis-Clément, 2002, p. 289).'},
 euripus:{t:'Spina or euripus',x:'The central barrier was properly called the euripus, although today it is better known as the spina (Bell, 2014, p. 493), and it carried water basins (Ruiz de Arbulo & Gris, 2021, p. 197). It was also a sacred space, since it held the sanctuary of Consus, the archaic god of the first races (Bell, 2020, pp. 5-7), and Tertullian said that every ornament of the track was a temple (Tema 4).'},
 metae:{t:'The turning posts',x:'The metae were the conical posts at each end of the barrier, around which the chariots turned. In seven laps they had to be rounded thirteen times, and most accidents happened there (Bell, 2020, p. 13).'},
 ova:{t:'Eggs and dolphins',x:'The crowd followed the race by the lap counters on the barrier, seven eggs at one end and seven dolphins at the other, which were lowered at each lap (Bell, 2014, p. 494). According to Tertullian, the eggs belonged to Castor and Pollux and the dolphins honoured Neptune (Tema 4). A signaller with small flags beside the first meta showed on each lap the colour of the leading chariot (Nelis-Clément, 2002, p. 283).'},
 alba:{t:'Alba linea',x:'Judges confirmed the order of arrival on a line of chalk, the alba linea (Ruiz de Arbulo & Gris, 2021, p. 197).'},
 vueltas:{t:'Seven laps',x:'Races were run over seven laps anticlockwise, about five kilometres in eight or nine minutes at an average of about 35 km/h, figures from Junkelmann that Bell qualifies (Bell, 2020, p. 12). Fauquet calculates 5,335 metres and twelve minutes 48 seconds at about 25 km/h (Nelis-Clément, 2002, p. 280). At the Secular Games the laps were reduced from seven to five so that a hundred races could be run (Nelis-Clément, 2002, p. 299, n. 133).'},
 naufragium:{t:'Naufragium',x:'Crashes and overturns were called naufragia, and they appear in most images, which means they were frequent and pleased the crowd (Bell, 2014, p. 495). Causing a rival’s naufragium was even a tactic tolerated by the rules (Nelis-Clément, 2002, p. 301). Track attendants had barely a minute to clear the track before the chariots came round again (Bell, 2020, p. 13), and the stratores removed injured charioteers (Ruiz de Arbulo & Gris, 2021, p. 198).'},
 riendas:{t:'Reins round the waist',x:'Roman charioteers, like the Etruscans and unlike the Greeks, tied the reins round their waist and controlled the chariot with their body weight, with a greater risk of being dragged if they overturned. For that case they carried a knife to cut them, as well as a padded helmet, a thick tunic with leather bands across the chest, and leg wrappings, the fasciae crurales (Bell, 2020, pp. 17-18). Thuillier (2003, p. 303) speaks of a driving technique “so typically Etruscan and Roman”.'},
 tiros:{t:'Bigae, trigae and quadrigae',x:'In the circus there were races for bigae (two horses), trigae (three) and, above all, quadrigae (four) (Bell, 2020, p. 11). Rome inherited the triga from the Etruscans, and races with up to ten horses are known, as exceptional tests of skill (Tema 4). At the Secular Games of Septimius Severus each faction entered two quadrigae and two bigae (Thuillier, 1989, p. 47).'},
 guia:{t:'Which horse led the turn?',x:'In the quadriga two horses were yoked in the centre (iugales) and two were attached by traces on the outside (funales). Bell (2020, pp. 21-22) identifies the most important as the experienced inside left horse, the introiugus. Thuillier (2003, pp. 296-297), on the other hand, points to the left funalis, which a sparsor cools down in a mosaic in Madrid, because it was the most important for rounding the metae. The debate remains open, and in the game you choose which position leads.'},
 auriga:{t:'Auriga and agitator',x:'Auriga and agitator were not synonyms. The auriga was a less experienced driver of bigae, and the agitator a higher-ranking driver of quadrigae (Bell, 2020, p. 16), since only the most expert drivers handled the quadriga (Nelis-Clément, 2002, p. 273). Whoever won with a quadriga rose in rank (Bell, 2014, p. 495). That is why in the game your charioteer starts with bigae and has to win before being trusted with a quadriga.'},
 facciones:{t:'The factions',x:'The factions were businesses. From the Principate, or perhaps from the late Republic, they hired out horses, charioteers and equipment to the organiser, and the word factio referred to the colours and the stables, not to the groups of supporters (Nelis-Clément, 2002, pp. 266-267). At their head was the dominus factionis, a businessman of the equestrian order who negotiated his services and prices with the person paying for the games (p. 267). Each faction kept hundreds of trainers, grooms, doctors and assistants (Bell, 2014, p. 495), and their stables were in the Campus Martius, one or two kilometres from the circus (Bell, 2020, p. 10).'},
 colores:{t:'Four colours',x:'There were four factions, the Whites (albata), Reds (russata), Greens (prasina) and Blues (veneta). Domitian added a gold and a purple faction that lasted as long as his reign (Bell, 2020, p. 9; Nelis-Clément, 2002, p. 267). Greens and Blues were the most popular (Bell, 2020, p. 9), and Pliny the Younger mocked a crowd that followed its colours blindly, to the point that if the teams changed colours the supporters would change sides (Crowther, 1996, p. 448).'},
 alianzas:{t:'Alliances between colours',x:'The factions formed alliances in pairs, although authors disagree about which. Bell (2020, p. 9) states that the Greens went with the Reds and the Blues with the Whites. Thuillier (2003, pp. 306-308), on the basis of three mosaics in Madrid, argues that the alliance of Blues and Reds against Whites and Greens predominated, and notes that curse tablets also show other combinations. In Rome the game lets you choose which reading you race with.'},
 familia:{t:'The familia quadrigaria',x:'The inscription from the columbarium of the household of Titus Ateius Capito, from the Augustan period, is the most complete list of the staff of a stable, with twelve trades (Nelis-Clément, 2002, p. 267). It records six charioteers and, among others, the sutor, the sellarius, the tentor, the morator, the sparsor, the medicus and the conditor (Bell, 2020, p. 10). As it names only the dead of the household, it does not tell us how many people a faction had (Nelis-Clément, 2002, p. 268).'},
 sparsor:{t:'The sparsor',x:'The sparsor’s job was to throw water over the horses’ heads during the race to cool them down (Nelis-Clément, 2002, p. 280). Thuillier (2003, p. 306) argues that he was no minor figure, since he held a considerable rank in the circus hierarchy because of the dangers he faced on foot at the edge of the track.'},
 hortator:{t:'The hortator',x:'The hortator rode on horseback and his task was to urge on the horses and the charioteer of his stable during the race (Nelis-Clément, 2002, p. 281).'},
 conditor:{t:'The conditor',x:'The conditor of the faction was in charge of feeding and breeding the horses (Nelis-Clément, 2002, p. 300). The altar of L. Avilius Dionysius, conditor of the Reds, shows the horses Aquilo, with 130 victories, 88 second places and 37 third places, and Hirpinus, with 114 victories, and the monument boasts more of the horses’ fame than of the merits of the deceased (Bell, 2020, p. 24).'},
 medicus:{t:'The medicus',x:'The medicus appears in the list of Capito’s familia quadrigaria (Bell, 2020, p. 10), and each faction had doctors among its staff (Bell, 2014, p. 495; Ruiz de Arbulo & Gris, 2021, p. 199).'},
 caballos:{t:'Racehorses',x:'Racehorses were mostly males of between 135 and 155 cm, which began racing at five years old according to Pliny and could compete until the age of twenty (Bell, 2020, pp. 21-22). A day of games required something like 700 to 800 horses, which came from private and imperial stud farms in Hispania, Sicily, Thessaly, North Africa and Cappadocia, with a preference for African horses in the early Empire (Bell, 2020, p. 21).'},
 nombres:{t:'Horse names',x:'Bell (2020, p. 23) mentions about 600 surviving horse names, which can be sorted into six categories (skill, appearance, origin, expectations, behaviour and affection), whereas Ruiz de Arbulo and Gris (2021, p. 200) say that more than a thousand are known. In the game, Aquilo and Hirpinus are documented names (Bell, 2020, p. 24); the others are invented in imitation of those categories.'},
 condicion:{t:'Slaves of the track',x:'Charioteers were slaves, freedmen or Romans of very low status. Of some 230 catalogued, only one had been born free, P. Aelius Gutta Calpurnianus (Nelis-Clément, 2002, p. 274), and of those known with a secure status, 66 were slaves and 14 freedmen (Bell, 2014, p. 496). Despite their fame, they stood on the lowest rung of society (Nelis-Clément, 2002, p. 276). Bell (2014) considered them legally infamous, and Bell (2020, pp. 14-15) corrects that idea as a modern myth, since the jurists imposed no legal restrictions on them (Tema 4).'},
 ninos:{t:'Child charioteers',x:'Charioteers started as children. The Mauretanian Crescens was thirteen when he won his first quadriga race, in AD 115 (Nelis-Clément, 2002, p. 273), and Sextus Vistilius Helenus, transferred from the Greens to the Blues together with his trainer, died at thirteen (Bell, 2014, p. 497).'},
 traspasos:{t:'Transfers',x:'Charioteers moved between factions as free agents, even when they were slaves (Bell, 2020, pp. 16-17). Transfers were frequent, and Musclosus went on to race in turn for all four factions (Nelis-Clément, 2002, p. 275).'},
 diocles:{t:'Diocles',x:'Diocles, a freedman from Lusitania, raced for twenty-four years, from AD 122 to 146, took part in 4,257 races, came second in 2,900 and won 1,462, and retired at the age of forty-two (Bell, 2020, pp. 18-19). His inscription adds up to 35,863,120 sesterces in prize money, almost thirty-six times the census qualification of a senator (Tema 4). Bell (2020, p. 19) compares him with Tiger Woods and regards him as perhaps the best-paid athlete in history, although Seneca’s fortune is estimated at 300 million (Nelis-Clément, 2002, p. 275).'},
 miliarios:{t:'The miliarii',x:'The miliarii, the charioteers who passed a thousand victories, formed a closed group with Diocles, Gutta Calpurnianus, Scorpus and Pompeius Musclosus (Bell, 2020, p. 19). Scorpus died at the age of twenty-seven after more than two thousand victories (Tema 4), and Martial complained that he won fifteen bags of gold in one hour (Nelis-Clément, 2002, p. 277).'},
 premios:{t:'Prizes',x:'For quadrigae, the normal first prize (pura) seems to have been 20,000 sesterces, and races for six or seven horses were worth 30,000 to 50,000 (Bell, 2020, p. 19). Thuillier (1989, p. 48) gives major prizes of 30,000 to 60,000 sesterces on the basis of the inscription of Diocles, and at the Secular Games of Severus third place in the quadriga races earned 4,000. In the provinces much less was enough, and at Auzia 135 denarii were sufficient for six races (Nelis-Clément, 2002, p. 294).'},
 sestercio:{t:'The sestertius',x:'The Romans kept their accounts in sesterces (HS), and four sesterces made one silver denarius. The best yardstick is a legionary’s pay, about 1,400 sesterces a year in the 1st century AD, whereas becoming a senator required property worth one million (Tema 4). In the game, each figure is shown next to its equivalent in years of a legionary’s pay.'},
 editor:{t:'The editor',x:'The magistrate who organised a set of games, the editor, received public money and usually added his own. The law of the colony of Urso, of 44 BC, obliged its duumvirs to give four days of shows with 2,000 sesterces of public money and another 2,000 from their own pocket (Tema 4). In return he received recognition, the exchange that Paul Veyne called euergetism. The editor paid the factions, which acted as contractors (Bell, 2020, pp. 9-10).'},
 calendario:{t:'The ludi circenses',x:'Seven festivals of the state religious calendar included annual circus games: the Megalenses, the Cereales, the Florales, the Apollinares, the Romani, the Victoriae and the Plebeii (Bell, 2020, p. 5). At the height of the Empire there were 175 days of ludi, of which 64 were for races (Crowther, 1996, p. 445). A record from the mid-4th century gives about 24 races per day and about 66 days of games a year, although it is a late figure that does not hold for every period (Bell, 2020, p. 9).'},
 pompa:{t:'Pompa and pulvinar',x:'The circus procession, the pompa circensis, carried the gilded images of the gods to the pulvinar, where they presided over the games beside the emperor, so that the gods were imagined as spectators (Bell, 2020, p. 7). Under the Empire the pulvinar became the emperor’s tribune (Ruiz de Arbulo & Gris, 2021, p. 197).'},
 victoria:{t:'The victory ceremony',x:'The winner made a commemorative lap, went up to the judges’ tribune to collect the palm, the crown and the purse, and probably made a libation to the gods, while a trumpet announced his victory (Bell, 2020, p. 12). In Rome, unlike at Olympia, the charioteer was proclaimed the winner, and the owner of the horses was not (Nelis-Clément, 2002, p. 265).'},
 tipos:{t:'Types of race',x:'There were races for two, three or four teams, races in which each faction entered a single higher-ranking charioteer (certamina singularum), and the diversium, in which two charioteers swapped quadrigae after the previous race (Bell, 2020, p. 13). The most prestigious races pitted four quadrigae against each other, with each faction entering its best charioteer and its best team (Nelis-Clément, 2002, p. 272). Four stables lined up four, eight or twelve chariots (Ruiz de Arbulo & Gris, 2021, p. 197).'},
 nica:{t:'NICA and defixiones',x:'Supporters wore rings and amulets with the image of their charioteer or with formulas such as NICA PRASINE, “win, Green!” (Bell, 2020, p. 18). Others commissioned curse tablets (defixiones), lead sheets that called on demons against a charioteer or his horses and were buried at the starting gates or in the track, above all in North Africa (Bell, 2014, p. 500). In the game, the tablet has no effect at all on the race.'},
 aficion:{t:'The supporters',x:'The passion for racing reached all ages, sexes and social classes (Bell, 2014, p. 499). At the funeral of Felix, a charioteer of the Reds, a supporter threw himself onto the pyre (Bell, 2014, p. 492), and parents dressed their children in little green jackets (p. 501). In the circus, unlike the theatre and the amphitheatre, men and women could sit together (p. 500). Ammianus Marcellinus called the Circus Maximus the temple, the home and the assembly of the plebs, whereas Pliny the Younger boasted of not sharing that taste (p. 499).'},
 tarracoAurigas:{t:'Fuscus and Eutyches',x:'Two epitaphs of charioteers survive in Tarraco. That of Fuscus, of the Blues, was paid for by his supporters, who call themselves “bene amantes”. That of Eutyches, a slave who died of illness at twenty-two when he was already venturing to drive quadrigae, laments that he did not attain the glory of dying in the circus (Ruiz de Arbulo & Gris, 2021, p. 199), and Bell (2020, p. 18) dates it to AD 104.'},
 caligula:{t:'Coloured sand',x:'Caligula had the sand of the circus sprinkled to turn it red and green, with powdered lead and copper according to Bell (2020, p. 11), or with minium and malachite according to Thuillier, who follows Suetonius.'},
 constantinopla:{t:'Constantinople',x:'In the West the last attested race dates from 549 (Nelis-Clément, 2002, p. 298), whereas in Constantinople races continued for centuries, with the Blues and Greens at the forefront. In 532, in the Nika revolt (“win”), Blues and Greens joined forces and acclaimed another emperor, and the repression ended with some thirty thousand dead in the hippodrome (Tema 4).'},
 panem:{t:'Bread and races',x:'The formula “bread and circuses” began as a reproach. The poet Juvenal wrote, around the 2nd century AD, that the plebs, who once handed out commands and legions, now longed for only two things, bread and races (Tema 4).'},
 iconografia:{t:'How the winner was depicted',x:'In the Madrid mosaics studied by Thuillier (2003, p. 299), the winning charioteer wears a helmet with raised cheek-pieces, a corset of leather strips in a V around the neck, the palm in his left hand and the whip in his right, the conventional iconography of which there are dozens of examples. The Green charioteer on the third panel also shows the reins tied round his waist (p. 303).'},
 peticion:{t:'Making demands from the stands',x:'The circus was also a place for making demands. The crowd took advantage of the emperor’s presence to call out for, say, a tax reduction, and he answered on the spot (Tema 4; Bell, 2020, pp. 7-9). Crowther (1996, p. 445) notes that amphitheatres, theatres and circuses functioned as assemblies of the people.'},
 tarracoCiudad:{t:'Tarraco and Augustus',x:'Augustus resided for two years in Tarraco during the Cantabrian Wars, and the provincial council, which met every year in the city for the imperial cult, defended the interests of the provincial elites (Ruiz de Arbulo & Gris, 2021, p. 200). During the festivals of the imperial cult, two or three hundred provincial delegates came down towards the circus (p. 207). The stands had three lower rows, a walkway and five upper rows, on a podium 2.5 metres high with a railing (pp. 204 and 206).'},
 /* game conventions */
 cPrecios:{t:'Horse prices and wages',x:'The class sources give no prices for Roman racehorses and no wages for the staff of a stable, so the figures for the market, wages and upkeep are game conventions. They have been adjusted so that Tarraco is modest and Rome offers prizes of the order of the 20,000 sesterces given by Bell (2020, p. 19).'},
 cYeguadas:{t:'Stud farm profiles',x:'The five stud farms are those cited by the sources (Bell, 2020, p. 21), but the profile of each one (more speed, more stamina or better leading) is a game convention.'},
 cTriga:{t:'The third horse of the triga',x:'Our class sources do not say where the third horse of the triga was placed. The game lets you hitch it on the outside or the inside and calculates its pull according to the side, as a hypothesis you can test on the track.'},
 cPista:{t:'Spina measurements',x:'The track measurements of Tarraco (290 × 67 m) and the Circus Maximus (580 × 79 m) come from Ruiz de Arbulo and Gris (2021, p. 205). The length of the barrier, the number of laps in each race and the speed of the horses are conventions adjusted so that a race fits into a few minutes of class.'},
 cRasgos:{t:'Horse traits',x:'The traits of each horse (good on the inside line, quick at the start, frightened by dust, spirited…) and bolting from overuse of the whip are game conventions. They are inspired by the name categories recorded by Bell (2020, p. 23), among them skill and behaviour.'},
 cAurigas:{t:'Several charioteers and fear',x:'Allowing the stable up to three charioteers rests on Capito’s familia quadrigaria, with six charioteers (Bell, 2020, p. 10), and on the charioteers who began at thirteen (Nelis-Clément, 2002, p. 273). Fear after a naufragium and its effects are game conventions.'},
 cMiliario:{t:'The game’s miliarius',x:'The real miliarii passed a thousand victories (Bell, 2020, p. 19). As a single game does not allow for that many, the game uses the title “miliarius of the stable” for the charioteer who reaches fifty, as a scaled-down version.'},
 cAscenso:{t:'Promotion, prestige and freedom',x:'Moving the charioteer up to the quadriga after winning with a biga rests on Bell (2014, p. 495) and Bell (2020, p. 16), but the number of victories required, the prestige scale, the price of freedom and the invitation to Rome are game conventions.'}
};

Object.assign(CODEX,{
 etrCarros:{t:'Carreras de carros etruscas',k:'H',g:'Etruria',x:'Las carreras de carros fueron una de las actividades predilectas de los etruscos, que preferían las bigas a las cuadrigas y usaban también la triga, el carro de tres caballos que Roma heredó de ellos (Tema 4). El auriga etrusco se distinguía del griego en tres cosas, puesto que se ataba las riendas a la cintura, llevaba una túnica corta y un casco frente a la túnica larga del auriga griego, y no competía desnudo. Las riendas a la cintura multiplicaban el riesgo en caso de accidente, si bien le permitían conducir con una sola mano y usar el látigo con la otra, lo que aumentaba la espectacularidad (Tema 4). Mantener caballos y aurigas era muy caro, de modo que la carrera exhibía la riqueza de quien la costeaba (Tema 4).'},
 etrBigas:{t:'La Tumba de las Bigas',k:'H',g:'Etruria',x:'En la Tumba de las Bigas de Tarquinia, hacia 500 a. C., los espectadores nobles se sientan en gradas de madera con toldos, hombres y mujeres mezclados, y una mujer ocupa el primer plano de la tribuna (Tema 4). En Olimpia, en cambio, la mujer casada tenía prohibido incluso presenciar los Juegos. Las etruscas ocupaban la grada y, según Thuillier, no se las ve jamás compitiendo; algunos autores suponen que llegaron a presidir los juegos, y que ejercieran como jueces es solo una hipótesis que las fuentes no confirman (Tema 4). La grada mostraba así en público el rango de sus familias, también a través de sus mujeres (Tema 4).'},
 desultores:{t:'Desultores',k:'H',g:'Etruria',x:'Los desultores eran jinetes acróbatas que saltaban de un caballo a otro en plena carrera, y fueron la modalidad ecuestre más representada en Etruria (Tema 4). Las carreras de caballos con jinete se documentan sobre todo en las placas de Murlo, hacia 600 a. C., y después apenas vuelven a representarse. Roma apenas conoció la carrera de jinetes, y fueron los etruscos quienes le legaron la pareja de carros y desultores (Tema 4).'},
 etrHerencia:{t:'Lo que el circo heredó de Etruria',k:'H',g:'Etruria',x:'Según Livio, el primer rey etrusco de Roma hizo traer caballos y púgiles sobre todo de Etruria, y Roma conservó la triga, los desultores y las riendas atadas a la cintura (Tema 4). Las gradas de madera con toldos de la Tumba de las Bigas coinciden con lo que los historiadores antiguos cuentan de las primeras gradas del Circo Máximo, que en un principio fue un recinto de madera atribuido a los reyes etruscos (Tema 4). Conviene, con todo, no exagerar la deuda, puesto que Briquel recuerda que la tradición romana situaba ya el rapto de las sabinas, episodio legendario de la fundación, en unos juegos ecuestres (Tema 4). Lo que Roma heredó de Etruria fue, a la postre, el espectador antes que el atleta, porque los ciudadanos romanos se habrían avergonzado de actuar en público (Tema 4).'},
 troia:{t:'El juego de Troya',k:'H',g:'Roma',x:'En Etruria existía una modalidad ecuestre llamada troia, un juego de habilidad a caballo en el que los jinetes recorrían un laberinto de curvas, como muestra un vaso del siglo VII a. C. hallado en Tragliatella (Tema 4). Es el antecedente probable del juego de Troya romano, reservado a los niños de la nobleza, que desfilaban y evolucionaban en escuadras en el Circo Máximo, y las fuentes recuerdan piernas rotas (Tema 4). Junto a las carreras de carros, el juego de Troya figuraba entre los juegos públicos que se ofrecían en el circo (Tema 4).'},
 consualia:{t:'Conso y las Consualia',k:'H',g:'Roma',x:'Las carreras de carros son la práctica más antigua del espectáculo romano. Para muchos autores antiguos, la primera fiesta deportiva de Roma fueron las Consualia, unos juegos ecuestres en honor de un dios arcaico, Conso, en los que la tradición situaba el rapto de las sabinas (Tema 4). Según el escritor cristiano Tertuliano, a finales del siglo II d. C. el altar de Conso seguía bajo tierra junto a las metas del Circo Máximo, los delfines echaban agua en honor de Neptuno y el gran obelisco estaba consagrado al Sol (Tema 4). Esa lista muestra que el circo seguía siendo un espacio sagrado, y por eso Tertuliano lo condenaba como un lugar de idolatría (Tema 4).'},
 maximoHistoria:{t:'De la madera al mármol',k:'H',g:'Los circos',x:'El Circo Máximo fue en un principio un recinto de madera, atribuido a los reyes etruscos, y se renovó sucesivamente con materiales nobles como la piedra o el mármol (Tema 4). La spina tenía elementos decorativos de gran calidad, entre ellos un obelisco egipcio traído por Augusto que hoy se levanta en la Piazza del Popolo (Tema 4). El edificio llegó incluso a la moneda, y un sestercio de Trajano acuñado hacia 103-111 d. C. lleva el Circo Máximo en el reverso (Tema 4).'},
 formaRomana:{t:'Un edificio romano',k:'H',g:'Los circos',x:'El circo fue una de las instalaciones deportivas más importantes de las ciudades romanas, aunque solo se construía en las principales urbes del Imperio, y junto al anfiteatro y al teatro formaba la tríada de grandes instalaciones destinadas a entretener al pueblo romano (Tema 4). Durante mucho tiempo se dijo que imitaba al hipódromo griego, si bien Olimpia fue el único hipódromo griego con instalaciones construidas, de modo que su forma es romana (Tema 4). Su actividad principal eran las carreras de carros, aunque en él se celebraban otros espectáculos públicos, y la spina solía llevar una decoración ostentosa de obeliscos, estatuas y contadores de vueltas (Tema 4).'},
 hispania:{t:'El circo en Hispania',k:'H',g:'Los circos',x:'Bell (2020, p. 4) cuenta diecinueve circos en Hispania, doce de ellos confirmados, y la pista de Tarraco era mucho menor que las de Mérida o Toledo (Ruiz de Arbulo y Gris, 2021, pp. 201 y 205). Hispania figuraba además entre las regiones cuyas yeguadas surtían de caballos al circo (Bell, 2020, p. 21), y de Lusitania procedía Diocles (Bell, 2020, pp. 18-19). Se conservan también imágenes hispanas de las carreras, como el mosaico de las carreras del circo de Barcino, del siglo IV d. C., con los nombres de los caballos, hoy en el Museo de Arqueología de Cataluña, o el mosaico de los Aurigas del Museo Nacional de Arte Romano de Mérida (Tema 4).'},
 faccionesDueno:{t:'Las facciones cambian de dueño',k:'H',g:'Las facciones',x:'Las facciones nacieron como agentes independientes en la República y pasaron al control del emperador en el Imperio tardío (Tema 4). Sus cuadras, las stabula, estaban en el Campo de Marte, a uno o dos kilómetros del Circo Máximo (Bell, 2020, p. 10). Las facciones daban además a sus seguidores unos colores que estos seguían ciegamente, de modo que el circo servía a la identidad y era a la vez un negocio que alimentaba a empresas de caballos (Tema 4).'},
 apuestas:{t:'Apostar en la grada',k:'H',g:'La afición',x:'La pasión por el circo se medía también en dinero, puesto que se apostaba en la grada, y el poeta Juvenal censura a un pretor que perdió su fortuna apostando en los mismos juegos que él organizaba (Tema 4). Las tablillas de maldición eran láminas de plomo grabadas por magos, que invocaban a los demonios para que lisiaran o mataran a un auriga o a sus caballos y se enterraban junto a las puertas de salida o en la pista. Probablemente las pagaban los seguidores más fieles de otra facción, sobre todo los que tenían dinero en juego (Tema 4).'},
 tertuliano:{t:'Tertuliano contra el circo',k:'H',g:'Roma',x:'Los escritores cristianos atacaron los espectáculos con otro argumento, la idolatría. Tertuliano escribió hacia el 197-200 d. C. Sobre los espectáculos (De spectaculis), que es para Arredondo (2008) la crítica antigua más completa que conservamos. Llamó al cortejo que abría los juegos «cortejo de Satán» (pompa diaboli), recordó que el circo estaba dedicado al Sol y reprochó al público su descontrol, con las apuestas y la euforia por el auriga vencedor (Tema 4). La Iglesia no pudo cerrar los espectáculos, porque su crítica se dirigía a los propios fieles y no tenía poder para cerrar los recintos (Tema 4).'},
 finOccidente:{t:'El final de las carreras en Occidente',k:'H',g:'Roma',x:'En Occidente ninguna ley puso fin a los espectáculos, y cada uno siguió su propia cronología (Tema 4). Los combates de gladiadores fueron los primeros en desaparecer, probablemente hacia 440, mientras que las cacerías y las carreras duraron más, porque tras la caída del Imperio de Occidente en 476 los reyes de Italia, primero Odoacro y desde 493 los ostrogodos, mantuvieron los juegos, y allí la última cacería documentada es de 523 y la última carrera, de 549 (Tema 4). Jiménez Sánchez juzga exagerado el peso del cristianismo en el final de la gladiatura y pone por delante su coste (Tema 4), y Stocking (2021) coincide en que el cristianismo no fue la causa principal del final del deporte antiguo. El espectáculo vivía del dinero de las élites, y en Occidente se apagó cuando las élites cristianas llevaron su generosidad a la caridad y a las iglesias (Tema 4).'},
 hipodromo:{t:'El hipódromo de Constantinopla',k:'H',g:'Roma',x:'En Constantinopla el emperador presidía las carreras desde su palco, y el hipódromo era, tras el palacio y la gran iglesia de Santa Sofía, el tercer centro de la vida política, donde el pueblo pedía y aclamaba (Tema 4). En la revuelta Nika de 532, Azules y Verdes incendiaron además buena parte de la ciudad. La base del obelisco de Teodosio, en la actual plaza del Hipódromo de Estambul, muestra hacia 390 d. C. al emperador y a su corte en el palco (Tema 4). El circo sobrevivió allí a la arena porque el hipódromo seguía siendo el lugar donde el pueblo hablaba con su emperador (Tema 4).'},
 ludiMunera:{t:'Ludi circenses y munera',k:'H',g:'Roma',x:'Los romanos no tenían un término equivalente a nuestro «deporte» y hablaban de ludi y de munera (Tema 4). Los ludi eran los juegos públicos del calendario religioso, ofrecidos a los dioses y pagados en origen por el Estado, y comprendían las carreras del circo (ludi circenses) y las representaciones teatrales (ludi scaenici), mientras que el munus dependía de la voluntad, y del bolsillo, de quien lo ofrecía. La élite política y económica ofrecía estos espectáculos a la plebe de forma regular y gratuita para ganarse su favor, y así el espectáculo estaba abierto a todos, mientras que el pan solo llegaba a los inscritos en los repartos (Tema 4). A lo largo del Imperio los días de juegos se multiplicaron, con 65 bajo Augusto, 80 bajo Tiberio y 176 en el siglo IV, de los que solo 10 eran de gladiadores (Tema 4).'},
 cuentas:{t:'Las cuentas del circo',k:'H',g:'El dinero',x:'El sestercio era una pieza de latón, el oricalco, de unos 33 milímetros y 26 gramos en época de Trajano (Bell, 2020). El presupuesto anual de los Ludi Romani, en 51 d. C., era de 760.000 sestercios, unos 543 años de paga de un legionario, si bien esas cifras proceden de inscripciones y leyes de fechas distintas y la comparación es orientativa (Tema 4). Conviene no comparar sin más cifras de siglos distintos, porque entre la ley de Urso y las leyes de Marco Aurelio hay más de dos siglos de inflación (Dunkle, 2013), y a finales del siglo III una hiperinflación encareció los juegos (Vamplew, 2022).'},
 fortuna:{t:'La fortuna de Diocles',k:'H',g:'El dinero',x:'La inscripción de Diocles es un balance contable en piedra que suma 35.863.120 sestercios en premios, el sueldo de unos 25.000 años de un legionario (Tema 4). Aun descontando la parte de la facción, se calcula que le quedaron al menos tres millones y medio de sestercios (Tema 4). Los mejores aurigas se convertían en ídolos de masas con estatuas en Roma, y un esclavo de la pista podía morir joven o comprarse la libertad y un balance en mármol, un salario de superestrella en un oficio que la élite despreciaba (Tema 4).'},
 gradaOrdenada:{t:'La grada ordenada',k:'H',g:'La afición',x:'Augusto ordenó por ley el reparto de los asientos en teatros, anfiteatros y circos, la lex Iulia theatralis, de modo que cada grupo social tenía su sector y la grada reproducía la jerarquía de la ciudad (Tema 4). El emperador ocupaba su palco, los senadores las primeras filas, los caballeros las siguientes y detrás el resto de ciudadanos con toga. Los acomodadores, los dissignatores, impedían a un plebeyo ocupar las filas reservadas, y así ir a los juegos era ver y ser visto en el sitio de cada uno (Tema 4).'},
 fuentes:{t:'Ben-Hur y las fuentes',k:'H',g:'Roma',x:'Roma nos habla con textos abundantes, si bien casi todos los autores que describen los espectáculos pertenecen a la élite y escriben para criticarlos (Tema 4). Las inscripciones dan lo que los textos callan, como las carreras de los aurigas con sus victorias y sus años, y los mosaicos y los relieves muestran el equipo y el gesto. Las imágenes modernas, como el circo de Ben-Hur, la película de William Wyler de 1959, gobiernan todavía lo que imaginamos, de modo que conviene distinguir siempre lo que dice la fuente antigua de lo que añadió la moderna (Tema 4).'}
});

Object.assign(CODEX_EN,{
 etrCarros:{t:'Etruscan chariot races',x:'Chariot racing was one of the favourite activities of the Etruscans, who preferred bigae to quadrigae and also used the triga, the three-horse chariot that Rome inherited from them (Tema 4). The Etruscan charioteer differed from the Greek in three ways, since he tied the reins round his waist, wore a short tunic and a helmet instead of the long tunic of the Greek charioteer, and did not compete naked. Reins round the waist multiplied the risk in an accident, although they allowed him to drive with one hand and use the whip with the other, which made the race more spectacular (Tema 4). Keeping horses and charioteers was very expensive, so the race displayed the wealth of whoever paid for it (Tema 4).'},
 etrBigas:{t:'The Tomb of the Bigae',x:'In the Tomb of the Bigae at Tarquinia, around 500 BC, noble spectators sit on wooden stands with awnings, men and women mixed, and a woman occupies the foreground of the tribune (Tema 4). At Olympia, by contrast, married women were forbidden even to watch the Games. Etruscan women occupied the stands and, according to Thuillier, they are never seen competing; some authors suppose that they came to preside over the games, and that they acted as judges is only a hypothesis that the sources do not confirm (Tema 4). The stands thus displayed the rank of their families in public, through their women as well (Tema 4).'},
 desultores:{t:'Desultores',x:'The desultores were acrobatic riders who leapt from one horse to another in mid-race, and they were the equestrian event most often depicted in Etruria (Tema 4). Horse races with riders are documented above all on the Murlo plaques, around 600 BC, and afterwards they are hardly depicted again. Rome barely knew the ridden horse race, and it was the Etruscans who bequeathed to it the pairing of chariots and desultores (Tema 4).'},
 etrHerencia:{t:'What the circus inherited from Etruria',x:'According to Livy, the first Etruscan king of Rome had horses and boxers brought mainly from Etruria, and Rome kept the triga, the desultores and the reins tied round the waist (Tema 4). The wooden stands with awnings in the Tomb of the Bigae match what ancient historians tell us about the first stands of the Circus Maximus, which was originally a wooden enclosure attributed to the Etruscan kings (Tema 4). The debt should not be exaggerated, however, since Briquel points out that Roman tradition already placed the rape of the Sabine women, a legendary episode of the foundation, at a set of equestrian games (Tema 4). What Rome inherited from Etruria was, in the end, the spectator before the athlete, because Roman citizens would have been ashamed to perform in public (Tema 4).'},
 troia:{t:'The Troy game',x:'In Etruria there was an equestrian event called troia, a game of skill on horseback in which the riders followed a labyrinth of curves, as a 7th-century BC vase found at Tragliatella shows (Tema 4). It is the probable forerunner of the Roman Troy game, reserved for boys of the nobility, who paraded and manoeuvred in squadrons in the Circus Maximus, and the sources recall broken legs (Tema 4). Alongside chariot racing, the Troy game was one of the public games offered in the circus (Tema 4).'},
 consualia:{t:'Consus and the Consualia',x:'Chariot racing is the oldest practice of Roman spectacle. For many ancient authors, Rome’s first sporting festival was the Consualia, equestrian games in honour of an archaic god, Consus, at which tradition placed the rape of the Sabine women (Tema 4). According to the Christian writer Tertullian, at the end of the 2nd century AD the altar of Consus still lay underground beside the metae of the Circus Maximus, the dolphins spouted water in honour of Neptune and the great obelisk was consecrated to the Sun (Tema 4). That list shows that the circus was still a sacred space, which is why Tertullian condemned it as a place of idolatry (Tema 4).'},
 maximoHistoria:{t:'From wood to marble',x:'The Circus Maximus was originally a wooden enclosure, attributed to the Etruscan kings, and it was successively rebuilt in noble materials such as stone and marble (Tema 4). The spina carried decorative elements of high quality, among them an Egyptian obelisk brought by Augustus that stands today in the Piazza del Popolo (Tema 4). The building even reached the coinage, and a sestertius of Trajan struck around AD 103-111 shows the Circus Maximus on its reverse (Tema 4).'},
 formaRomana:{t:'A Roman building',x:'The circus was one of the most important sporting facilities of Roman cities, although it was built only in the main cities of the Empire, and together with the amphitheatre and the theatre it formed the triad of great buildings intended to entertain the Roman people (Tema 4). For a long time it was said to imitate the Greek hippodrome, although Olympia was the only Greek hippodrome with built facilities, so its form is Roman (Tema 4). Its main activity was chariot racing, although other public shows were also held in it, and the spina usually carried an ostentatious decoration of obelisks, statues and lap counters (Tema 4).'},
 hispania:{t:'The circus in Hispania',x:'Bell (2020, p. 4) counts nineteen circuses in Hispania, twelve of them confirmed, and the track of Tarraco was much smaller than those of Mérida or Toledo (Ruiz de Arbulo & Gris, 2021, pp. 201 and 205). Hispania was also among the regions whose stud farms supplied horses to the circus (Bell, 2020, p. 21), and Diocles came from Lusitania (Bell, 2020, pp. 18-19). Hispanic images of the races also survive, such as the mosaic of the races in the circus of Barcino, from the 4th century AD, with the names of the horses, now in the Museu d’Arqueologia de Catalunya, or the Charioteers mosaic in the National Museum of Roman Art in Mérida (Tema 4).'},
 faccionesDueno:{t:'The factions change hands',x:'The factions began as independent agents under the Republic and passed under the emperor’s control in the late Empire (Tema 4). Their stables, the stabula, were in the Campus Martius, one or two kilometres from the Circus Maximus (Bell, 2020, p. 10). The factions also gave their supporters colours that they followed blindly, so the circus served identity and was at the same time a business that kept horse companies going (Tema 4).'},
 apuestas:{t:'Betting in the stands',x:'The passion for the circus was also measured in money, since people bet in the stands, and the poet Juvenal censures a praetor who lost his fortune betting on the very games he was organising (Tema 4). Curse tablets were lead sheets engraved by magicians, which called on demons to maim or kill a charioteer or his horses and were buried beside the starting gates or in the track. They were probably paid for by the most loyal supporters of another faction, above all those who had money at stake (Tema 4).'},
 tertuliano:{t:'Tertullian against the circus',x:'Christian writers attacked the shows with a different argument, idolatry. Tertullian wrote On the Spectacles (De spectaculis) around AD 197-200, which for Arredondo (2008) is the most complete ancient critique that survives. He called the procession that opened the games the “procession of Satan” (pompa diaboli), recalled that the circus was dedicated to the Sun and reproached the crowd for its lack of restraint, with the betting and the euphoria over the winning charioteer (Tema 4). The Church could not close the shows, because its criticism was aimed at the faithful themselves and it had no power to close the venues (Tema 4).'},
 finOccidente:{t:'The end of racing in the West',x:'In the West no law put an end to the shows, and each followed its own chronology (Tema 4). Gladiatorial combat was the first to disappear, probably around 440, whereas beast hunts and races lasted longer, because after the fall of the Western Empire in 476 the kings of Italy, first Odoacer and from 493 the Ostrogoths, kept up the games, and there the last documented hunt dates from 523 and the last race from 549 (Tema 4). Jiménez Sánchez considers the weight of Christianity in the end of gladiatorial combat exaggerated and puts its cost first (Tema 4), and Stocking (2021) agrees that Christianity was not the main cause of the end of ancient sport. The spectacle lived on the money of the elites, and in the West it faded when the Christian elites turned their generosity to charity and the churches (Tema 4).'},
 hipodromo:{t:'The hippodrome of Constantinople',x:'In Constantinople the emperor presided over the races from his box, and the hippodrome was, after the palace and the great church of Hagia Sophia, the third centre of political life, where the people made demands and acclaimed (Tema 4). In the Nika revolt of 532, the Blues and Greens also set fire to much of the city. The base of the obelisk of Theodosius, in today’s Hippodrome Square in Istanbul, shows the emperor and his court in the box around AD 390 (Tema 4). There the circus outlived the arena because the hippodrome was still the place where the people spoke to their emperor (Tema 4).'},
 ludiMunera:{t:'Ludi circenses and munera',x:'The Romans had no term equivalent to our “sport” and spoke of ludi and munera (Tema 4). The ludi were the public games of the religious calendar, offered to the gods and originally paid for by the State, and they included the circus races (ludi circenses) and theatrical performances (ludi scaenici), whereas the munus depended on the will, and the purse, of whoever offered it. The political and economic elite offered these shows to the plebs regularly and free of charge to win their favour, so the spectacle was open to everyone, whereas bread reached only those registered for the distributions (Tema 4). Over the course of the Empire the days of games multiplied, with 65 under Augustus, 80 under Tiberius and 176 in the 4th century, of which only 10 were for gladiators (Tema 4).'},
 cuentas:{t:'The circus accounts',x:'The sestertius was a brass coin, of orichalcum, about 33 millimetres and 26 grams in Trajan’s time (Bell, 2020). The annual budget of the Ludi Romani, in AD 51, was 760,000 sesterces, some 543 years of a legionary’s pay, although these figures come from inscriptions and laws of different dates and the comparison is only approximate (Tema 4). Figures from different centuries should not simply be compared, because between the law of Urso and the laws of Marcus Aurelius there are more than two centuries of inflation (Dunkle, 2013), and at the end of the 3rd century hyperinflation made the games more expensive (Vamplew, 2022).'},
 fortuna:{t:'The fortune of Diocles',x:'The inscription of Diocles is a balance sheet in stone that adds up to 35,863,120 sesterces in prize money, the pay of some 25,000 years of a legionary (Tema 4). Even after deducting the faction’s share, it is estimated that he was left with at least three and a half million sesterces (Tema 4). The best charioteers became idols of the masses with statues in Rome, and a slave of the track could die young or buy his freedom and a balance sheet in marble, a superstar’s salary in a trade that the elite despised (Tema 4).'},
 gradaOrdenada:{t:'The ordered stands',x:'Augustus regulated by law the distribution of seats in theatres, amphitheatres and circuses, the lex Iulia theatralis, so that each social group had its sector and the stands reproduced the hierarchy of the city (Tema 4). The emperor occupied his box, the senators the front rows, the equites the next ones and behind them the rest of the citizens in togas. The ushers, the dissignatores, prevented a plebeian from taking the reserved rows, and so going to the games meant seeing and being seen in one’s own place (Tema 4).'},
 fuentes:{t:'Ben-Hur and the sources',x:'Rome speaks to us through abundant texts, although almost all the authors who describe the shows belong to the elite and write to criticise them (Tema 4). Inscriptions give what the texts leave out, such as the careers of charioteers with their victories and their years, and mosaics and reliefs show the equipment and the gesture. Modern images, such as the circus in Ben-Hur, William Wyler’s 1959 film, still govern what we imagine, so we should always distinguish what the ancient source says from what the modern one added (Tema 4).'}
});
