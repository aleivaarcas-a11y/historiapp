Object.assign(CODEX,{
 cAguante:{t:'Aguante y látigo',k:'C',g:'Convenciones del juego',x:'El reparto del esfuerzo de los caballos a lo largo de la carrera es una convención del juego. Cada caballo rinde entero mientras su aguante está por encima de la reserva y, por debajo, se apaga deprisa. El látigo da un tirón que gasta aguante: rinde entero en las rectas, rinde la mitad en la curva, donde además abre la caja, y apenas sirve con el tiro agotado. Correr en el rebufo de otro carro ahorra aguante, retener lo recupera y el sparsor, que echaba agua a los caballos durante la carrera (Nelis-Clément, 2002, p. 280), devuelve una parte. La marca blanca de cada barra señala el aguante que hace falta para terminar la carrera.'},
 cEditor:{t:'El favor del editor',k:'C',g:'Convenciones del juego',x:'El dominus factionis negociaba sus servicios y sus precios con quien pagaba los juegos (Nelis-Clément, 2002, p. 267), y en eso se apoya la opción de pedir más tarifa. El favor del editor, la probabilidad de que acepte y la posibilidad de que retire la oferta son convenciones del juego. Un naufragium no resta favor porque los choques gustaban al público (Bell, 2014, p. 495).'},
 cEntreno:{t:'El entrenamiento de los caballos',k:'C',g:'Convenciones del juego',x:'Cada facción mantenía entrenadores, mozos y médicos (Bell, 2014, p. 495), pero las fuentes de clase no describen cómo se entrenaba a un caballo de carreras. Los planes de entrenamiento entre jornadas, sus efectos y el riesgo de lesión al entrenar cansado son convenciones del juego.'},
 cRival:{t:'El rival con nombre',k:'C',g:'Convenciones del juego',x:'El rival que reaparece en tus carreras y su marcador son una convención del juego, pensada para que cada carrera tenga una historia. Algunos rivales llevan nombres de aurigas documentados, como Escorpo o Guta (Bell, 2020, p. 19), que aquí corren como personajes de juego y fuera de su época. Que un rival derrotado pida el traspaso se inspira en los cambios frecuentes de facción (Nelis-Clément, 2002, p. 275).'},
 cObjetivo:{t:'Los objetivos de la facción',k:'C',g:'Convenciones del juego',x:'Al frente de cada facción estaba el dominus factionis, un hombre de negocios del orden ecuestre (Nelis-Clément, 2002, p. 267). Que fije a tu cuadra un objetivo por temporada, con un premio si lo cumples y una parte mayor de los ingresos si fallas, es una convención del juego.'},
 cRoce:{t:'Rozar la meta',k:'C',g:'Convenciones del juego',x:'Las metas eran el punto más peligroso de la carrera, donde ocurrían casi todos los accidentes (Bell, 2020, p. 13). Que pasar muy cerca de ellas sin chocar dé un pequeño impulso y anime a la grada es una convención del juego, que premia el riesgo que corrían los aurigas al ceñirse a la meta.'}
});
Object.assign(CODEX_EN,{
 cAguante:{t:'Stamina and the whip',x:'How the horses spread their effort over the race is a game convention. Each horse pulls at full strength while its stamina stays above the reserve and fades quickly below it. The whip gives a burst that costs stamina: it pays in full on the straights, pays half in the turn, where it also swings the car out, and does almost nothing for a spent team. Running in another chariot’s slipstream saves stamina, holding back recovers it, and the sparsor, who threw water on the horses during the race (Nelis-Clément, 2002, p. 280), gives some back. The white mark on each bar shows the stamina you need to finish the race.'},
 cEditor:{t:'The editor’s favour',x:'The dominus factionis negotiated his services and prices with whoever paid for the games (Nelis-Clément, 2002, p. 267), which is the basis for the option to ask for a higher fee. The editor’s favour, the chance that he agrees and the possibility that he withdraws the offer are game conventions. A crash does not cost favour because crashes pleased the crowd (Bell, 2014, p. 495).'},
 cEntreno:{t:'Training the horses',x:'Each faction employed trainers, grooms and doctors (Bell, 2014, p. 495), but our class sources do not describe how a racehorse was trained. The training plans between race days, their effects and the risk of injury when training tired are game conventions.'},
 cRival:{t:'The named rival',x:'The rival who keeps turning up in your races, and his score against you, are a game convention meant to give each race a story. Some rivals bear the names of documented charioteers, such as Scorpus or Gutta (Bell, 2020, p. 19), who race here as game characters and out of their time. A beaten rival asking for a transfer draws on how often charioteers changed faction (Nelis-Clément, 2002, p. 275).'},
 cObjetivo:{t:'The faction’s goals',x:'Each faction was headed by the dominus factionis, a businessman of equestrian rank (Nelis-Clément, 2002, p. 267). His setting your stable one goal per season, with a reward if you meet it and a larger cut of your income if you fail, is a game convention.'},
 cRoce:{t:'Hugging the post',x:'The turning posts were the most dangerous point of the race, where almost all accidents happened (Bell, 2020, p. 13). That passing very close to them without hitting them gives a small boost and stirs the crowd is a game convention, rewarding the risk charioteers took when they hugged the post.'}

/* ---------- sprites en estilo mosaico ----------

const SPR={cache:{},PPM:32};

/* pasa un dibujo a teselas: cada celda toma su color medio y se separa con una junta.
   opt.edge: color con que se oscurecen las teselas del borde de la figura (contorno nítido);
   opt.mortar: color de la junta (si no, la junta es el propio color oscurecido) */
function mosaicize(src,tile,grout,jit,seed,opt){
  opt=opt||{};
  const w=src.width,h=src.height,d=src.getContext('2d').getImageData(0,0,w,h).data;
  const nx=Math.ceil(w/tile),ny=Math.ceil(h/tile),cols=new Float32Array(nx*ny*3),on=new Uint8Array(nx*ny);
  const r=rng(seed||7),thr=opt.thr||110;
  for(let ty=0;ty<ny;ty++){const y0=ty*tile,y1=Math.min(h,y0+tile);
    for(let tx=0;tx<nx;tx++){const x0=tx*tile,x1=Math.min(w,x0+tile);let R=0,G=0,B=0,A=0;
      for(let yy=y0;yy<y1;yy++){let i=(yy*w+x0)*4;for(let xx=x0;xx<x1;xx++,i+=4){const a=d[i+3];if(a){R+=d[i]*a;G+=d[i+1]*a;B+=d[i+2]*a;A+=a}}}
      if(A<thr*tile*tile)continue;const id=ty*nx+tx;on[id]=1;cols[id*3]=R/A;cols[id*3+1]=G/A;cols[id*3+2]=B/A}}

  const gi=grout>0?Math.max(1,Math.round(grout)):0;
  for(let ty=0;ty<ny;ty++)for(let tx=0;tx<nx;tx++){
    const id=ty*nx+tx;if(!on[id])continue;let cr=cols[id*3],cg=cols[id*3+1],cb=cols[id*3+2];
    if(E){const em=tx>0&&on[id-1]&&tx<nx-1&&on[id+1]&&ty>0&&on[id-nx]&&ty<ny-1&&on[id+nx];
      if(!em){cr+=(E[0]-cr)*ek;cg+=(E[1]-cg)*ek;cb+=(E[2]-cb)*ek}}
    const j=1+(r()-0.5)*jit,jr=j*(1+(r()-0.5)*jit*0.25),x=tx*tile,y=ty*tile;
    const R2=cr*jr,G2=cg*j,B2=cb*j;

      const ox=r()<0.5?0:gi,oy=r()<0.5?0:gi;put(x+ox,y+oy,x+ox+tile-gi,y+oy+tile-gi,R2,G2,B2);

/* curva suave (Catmull-Rom) que pasa por todos los puntos */
function splinePath(c,pts,closed){
  const n=pts.length,P=i=>closed?pts[(i+n)%n]:pts[clamp(i,0,n-1)];
  c.moveTo(pts[0][0],pts[0][1]);
  for(let i=0;i<(closed?n:n-1);i++){const p0=P(i-1),p1=P(i),p2=P(i+1),p3=P(i+2);
    c.bezierCurveTo(p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6,p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6,p2[0],p2[1])}

/* miembro afilado: polilínea con anchura variable [[x,y,w],...] */
function limbPath(c,pts){
  const L=[],Rr=[];
  for(let i=0;i<pts.length;i++){const a=pts[Math.max(0,i-1)],b=pts[Math.min(pts.length-1,i+1)];let dx=b[0]-a[0],dy=b[1]-a[1];const m=Math.hypot(dx,dy)||1;dx/=m;dy/=m;const w=pts[i][2]/2;
    L.push([pts[i][0]-dy*w,pts[i][1]+dx*w]);Rr.push([pts[i][0]+dy*w,pts[i][1]-dx*w])}
  const all=L.concat(Rr.reverse());c.beginPath();splinePath(c,all,true);

/* paleta de cada capa: crin, contorno, borde de luz */
function coatPal(coat){
  const lum=lumHex(coat);
  const mane={'#7a4a26':'#1e140d','#a3612c':'#6e3612','#b9b3a8':'#6c665e','#2b241f':'#120d0a','#e8e2d4':'#b8ae9a','#c49a5c':'#2a1d12','#8d6a5a':'#2a1d16'}[coat]||(lum>0.6?'#7d7568':'#1f1610');
  const out=lum>0.62?'#4a3e31':lum<0.25?'#0b0705':'#1d120a';
  return {lum,mane,out,
    dark:lum>0.62?shade(coat,-0.26):shade(coat,-0.42),
    mid:coat,
    light:lum<0.25?shade(coat,0.32):lum>0.62?shade(coat,0.45):shade(coat,0.3),
    rim:lum<0.25?shade(coat,0.42):null,
    hoof:lum>0.62?'#3a3128':'#16100b'};
}
const WHITE_MARK='#f4efe3';
/* caballo visto desde arriba; x hacia delante, origen en el centro del cuerpo.
   Galope de cuatro tiempos (posterior izq., posterior der., anterior izq., anterior der.) */
function drawHorseTop(c,k,coat,mark,ph){
  const P=coatPal(coat),t=((ph/(Math.PI*2))%1+1)%1,TAU=Math.PI*2;
  // estirón y recogida del cuerpo, cabeceo y leve balanceo
  const st=1+0.04*Math.cos(TAU*(t-0.42)),hb=0.07*Math.cos(TAU*(t-0.5)),sway=0.015*Math.sin(TAU*t);
  const sm=(a,b,x)=>{const u=clamp((x-a)/(b-a),0,1);return u*u*(3-2*u)};
  const X=x=>(x*st+hb*sm(0.75,1.45,x))*k,Y=y=>y*k;
  c.lineCap='round';c.lineJoin='round';
  // --- patas: cortas, casi ocultas bajo el cuerpo; asoman delante del pecho y detrás de la grupa
  const legPos=(off,fore)=>{const p=((t-off)%1+1)%1,S=0.42;let d,lift;
    const a=fore?1.0:0.32,b=fore?-0.22:-0.86;
    if(p<S){d=a+(b-a)*(p/S);lift=0}else{const q=(p-S)/(1-S),e=q*q*(3-2*q);d=b+(a-b)*e;lift=Math.sin(q*Math.PI)}
    return {d,lift}};
  const legs=[[-0.78,-1,0.00,false],[-0.78,1,0.12,false],[0.56,-1,0.37,true],[0.56,1,0.49,true]];
  for(const [ax,sd,off,fore] of legs){const {d,lift}=legPos(off,fore);
    const ay=sd*0.17,dd=d*(1-lift*0.5),fx=ax+dd,ext=clamp(fore?(fx-0.9)/0.5:(-1.08-fx)/0.5,0,1),fy=sd*(0.16+0.12*ext);
    const kx=ax+dd*0.55,ky=sd*(0.17+0.05*ext);
    const pts=[[X(ax),Y(ay),0.2*k],[X(kx),Y(ky),0.14*k],[X(fx),Y(fy),0.11*k]];
    c.fillStyle=P.out;c.strokeStyle=P.out;c.lineWidth=0.07*k;limbPath(c,pts);c.fill();c.stroke();
    c.fillStyle=P.lum>0.62?P.dark:P.lum<0.25?P.rim:P.mid;limbPath(c,pts);c.fill();
    const ux=Math.sign(fx-kx)||1,hx=X(fx)+ux*0.04*k,hy=Y(fy);
    if(mark.socks&&(fore?sd<0:true)){c.fillStyle=WHITE_MARK;c.beginPath();c.arc(X(fx),hy,0.07*k,0,7);c.fill()}
    c.fillStyle=P.hoof;c.beginPath();c.ellipse(hx,hy,0.08*k,0.065*k,0,0,7);c.fill();

  const tw=s=>Math.sin(TAU*t+s);
  const tail=[[X(-1.1),0,0.2*k],[X(-1.38),Y(0.05*tw(0)),0.24*k],[X(-1.66),Y(0.12*tw(0.9)),0.2*k],[X(-1.92),Y(0.18*tw(1.8)),0.12*k],[X(-2.08),Y(0.22*tw(2.5)),0.05*k]];
  c.fillStyle=P.out;c.strokeStyle=P.out;c.lineWidth=0.07*k;limbPath(c,tail);c.fill();c.stroke();
  c.fillStyle=P.mane;limbPath(c,tail);c.fill();
  c.strokeStyle=shade(P.mane,P.lum>0.6?-0.2:0.28);c.lineWidth=0.03*k;
  c.beginPath();c.moveTo(X(-1.2),0);c.quadraticCurveTo(X(-1.6),Y(0.1*tw(0.6)),X(-1.95),Y(0.17*tw(1.8)));c.stroke();
  // --- cuerpo: grupa y barril se estiran y recogen; cuello y cabeza cabecean
  const tex=horseBodyTex(coat,mark,k),oy=-0.75*k;
  const cut=1.06,sx=(2.15-1.3)*k,sw=(1.3+cut)*k;
  c.drawImage(tex,sx,0,sw,tex.height,-1.3*k*st,oy,sw*st,tex.height);

/* cuerpo en pose neutra (silueta, modelado, crin, orejas y arnés); se cachea y cada cuadro lo estira */
function drawHorseBody(c,k,coat,mark){

      if(Math.hypot(Math.abs(c.x)-g.sx,c.y)<18)r.glossary('metae');

          if(Math.hypot(c.x,c.y-sy)<7&&c.sparsorLap[key]!==c.lapsDone){c.sparsorLap[key]=c.lapsDone;for(const h of c.horses)h.st=Math.min(h.stMax,h.st+TUNING.sparsorGain);
            for(let i=0;i<14;i++)splash.push({x:c.x+(R()-.5)*2,y:c.y+(R()-.5)*2,vx:(R()-.5)*6,vy:(R()-.5)*6,life:0.7});SFX.splash();r.glossary('sparsor')}}

    else if(p.cutT>TUNING.cutWindow||p.ai){p.cutOpen=false;p.cut=!!p.ai;if(!p.ai){r.flash(p,L('Arrastrado por el tiro','Dragged by the team'),L('el auriga se lesiona','the charioteer is injured'));SFX.thud(1)}}

/* ---------- fantasmas: se graba el carro del jugador y se reproduce en otra carrera ----------
   10 muestras por segundo desde que cae la mappa: x, y (decímetros), rumbo y apertura de la caja (centésimas).
   Se guardan con deltas en base 36 para que una carrera de dos minutos ocupe unos 8 KB. */
const GHOST_HZ=10;

function ghostRecStep(r,dt){
  const P=r.players[0];if(!r.rec||!P||!r.started)return;
  if(P.finished&&r.rec.closed)return;
  r.rec.acc+=dt;
  while(r.rec.acc>=1/GHOST_HZ){r.rec.acc-=1/GHOST_HZ;r.rec.pts.push([Math.round(P.x*10),Math.round(P.y*10),Math.round(normA(P.h)*100),Math.round(P.sw*100)]);if(P.finished)r.rec.closed=true}
}
function ghostEncode(pts){
  const out=[];let prev=[0,0,0,0];

  return out.join(',');
}

  const a=String(str||'').split(',').map(v=>parseInt(v,36));const pts=[];let prev=[0,0,0,0];

  const c=makeCar({tiro:data.tiro,fac:data.fac||'A',name:data.alias||L('Fantasma','Ghost'),horses,guide:0,x:pts[0][0]/10,y:pts[0][1]/10});
  c.ghost={pts,alias:data.alias||'',grupo:data.grupo||'',t:data.t,mine:!!data.mine};c.h=pts[0][2]/100;

}

  if(!r.ghosts)return;const tt=Math.max(0,r.t-r.goT);

    const a=P[i],b=P[j];const ox=c.x,oy=c.y;

const cv=document.getElementById('c'),cx=cv.getContext('2d');

/* si la pantalla es más ancha que 16:9 se ve más pista a los lados, nunca menos por delante */
const viewK=()=>VW/Math.min(VW,VH*16/9);
addEventListener('resize',resize);resize();
const cam={x:0,y:0,span:60,a:0,roll:0};
function camUpdate(){

/* ---------- sonido ---------- */
let AC=null,master=null,crowdG=null,rumbleG=null,noiseBuf=null,muted=false;
function audioInit(){
  if(AC)return;
  try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:0.5;master.connect(AC.destination);
    const buf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*0.5;noiseBuf=buf;
    const src=AC.createBufferSource();src.buffer=buf;src.loop=true;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=550;f.Q.value=0.5;crowdG=AC.createGain();crowdG.gain.value=0.03;src.connect(f);f.connect(crowdG);crowdG.connect(master);src.start();
    // retumbar de los cascos cercanos: ruido grave continuo cuyo volumen sigue a los carros que hay alrededor
    const s2=AC.createBufferSource();s2.buffer=buf;s2.loop=true;const f2=AC.createBiquadFilter();f2.type='lowpass';f2.frequency.value=140;rumbleG=AC.createGain();rumbleG.gain.value=0;s2.connect(f2);f2.connect(rumbleG);rumbleG.connect(master);s2.start(0,0.7);
  }catch(e){AC=null}
}
function burst(dur,freq,gain,type='lowpass'){if(!AC||muted)return;const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;const g=AC.createGain();g.gain.setValueAtTime(gain,AC.currentTime);g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);s.connect(f);f.connect(g);g.connect(master);s.start();s.stop(AC.currentTime+dur+0.02)}
function tone(freq,t0,dur,gain,type='sawtooth'){if(!AC||muted)return;const o=AC.createOscillator();o.type=type;o.frequency.value=freq;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=1800;const g=AC.createGain();const t=AC.currentTime+t0;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+0.04);g.gain.setValueAtTime(gain,t+dur-0.05);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(f);f.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.02)}
const SFX={
  hoof(v,n=2){for(let i=0;i<Math.min(n,4);i++)setTimeout(()=>burst(0.045,170+v*9+i*25,0.07),i*28)},
  crash(k=1){burst(0.6,500,0.7*k);burst(0.3,1800,0.3*k,'highpass')},
  thud(k){burst(0.15,180,0.5*k)},
  whip(){burst(0.035,4200,0.42,'highpass');setTimeout(()=>burst(0.05,2400,0.18,'bandpass'),35)},
  gates(){for(let i=0;i<6;i++)setTimeout(()=>burst(0.12,320,0.22),i*45)},
  pass(){tone(392,0,0.12,0.07,'triangle');tone(523,0.1,0.18,0.07,'triangle')},
  boost(){burst(0.25,900,0.18,'bandpass')},
  splash(){burst(0.35,1400,0.22,'bandpass')},
  tuba(){[[233,0,0.35],[311,0.36,0.35],[349,0.72,0.6]].forEach(([f,t,d])=>tone(f,t,d,0.16))},
  fanfare(){[[349,0,0.25],[440,0.26,0.25],[523,0.52,0.55],[440,1.1,0.25],[523,1.36,0.8]].forEach(([f,t,d])=>tone(f,t,d,0.14))},
  crowd(k){if(!AC||!crowdG)return;crowdG.gain.cancelScheduledValues(AC.currentTime);crowdG.gain.setValueAtTime(0.03+0.18*k,AC.currentTime);crowdG.gain.exponentialRampToValueAtTime(0.03,AC.currentTime+2.5)},
  ambient(r){if(!AC||!rumbleG||muted)return;const P=r.players[0];if(!P)return;let k=0;for(const c of r.cars){if(c===P||c.crashed)continue;const d=Math.hypot(c.x-P.x,c.y-P.y);if(d<24)k+=(1-d/24)*clamp(c.v/15,0,1)}
    k+=clamp(P.v/16,0,1)*0.6;rumbleG.gain.setTargetAtTime(Math.min(0.22,k*0.07),AC.currentTime,0.15)}
};
function setMute(m){muted=m;if(master)master.gain.value=m?0:0.5;if(m&&rumbleG)rumbleG.gain.value=0}

/* ---------- entrada ---------- */
const keys={};let paused=false;
addEventListener('keydown',e=>{
  audioInit();
  if(document.activeElement&&['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
  keys[e.code]=true;
  if(MODE==='race'&&race&&!race.attract){
    if(e.code==='KeyP')paused=!paused;
    if(e.code==='KeyV')toggleCam();
    if(e.code==='KeyT')setAJ('shake',!AJ.shake);
    if(e.code==='Escape'){if(paused){paused=false;abortRace()}else paused=true}
  }
  if(e.code==='KeyM')setMute(!muted);
});
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('blur',()=>{if(MODE==='race'&&race&&!race.attract)paused=true});
function toggleCam(){if(!race||race.attract)return;race.camMode=race.camMode==='giro'?'fija':'giro';store(KEY.cam,race.camMode)}
function readInputs(){
  const r=race;if(!r||r.attract)return;
  const p=r.players[0];if(!p||p.ai)return;const i=p.inp;
  i.s=(keys.ArrowLeft||keys.KeyA?-1:0)+(keys.ArrowRight||keys.KeyD?1:0)+(touchState.left?-1:0)+(touchState.right?1:0)+(JOY.id!=null?JOY.s:0);
  i.w=(keys.ArrowUp||keys.KeyW||touchState.whip)?1:0;i.b=(keys.ArrowDown||keys.KeyS||touchState.hold)?1:0;i.p=(keys.Space||touchState.peso)?1:0;i.c=(keys.KeyC||touchState.cut)?1:0;
  i.s=clamp(i.s,-1,1);
}
cv.addEventListener('pointerdown',e=>{
  audioInit();
  if(e.pointerType==='touch')TOUCH=true;
  touchHit(e,true);
});
cv.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')touchHit(e,true)});
cv.addEventListener('pointerup',e=>touchHit(e,false));
cv.addEventListener('pointercancel',e=>touchHit(e,false));
const touchOwner={};
/* joystick analógico flotante para las riendas: aparece donde se apoya el pulgar en la mitad izquierda */
const JOY={id:null,bx:0,by:0,x:0,y:0,s:0,R:60};
function joyStart(e,x,y){const r=race;if(!r||r.attract||paused||x>VW*0.42||y<VH*0.3)return false;JOY.id=e.pointerId;JOY.bx=x;JOY.by=y;JOY.x=x;JOY.y=y;JOY.s=0;JOY.R=58*DPR*clamp(VH/DPR/390,0.9,1.3);return true}
function joyMove(x,y){const dx=x-JOY.bx,dy=y-JOY.by,d=Math.hypot(dx,dy),m=Math.min(d,JOY.R);JOY.x=JOY.bx+(d?dx/d*m:0);JOY.y=JOY.by+(d?dy/d*m:0);const v=(JOY.x-JOY.bx)/JOY.R;JOY.s=Math.abs(v)<0.12?0:clamp((Math.abs(v)-0.12)/0.78,0,1)*Math.sign(v)}
function drawJoy(ctx){if(!TOUCH||!race||race.attract)return;const k=clamp(VH/DPR/390,0.9,1.3),R=58*DPR*k,on=JOY.id!=null;
  const bx=on?JOY.bx:(SAFE.l+86*k)*DPR,by=on?JOY.by:VH-(SAFE.b+92*k)*DPR,kx=on?JOY.x:bx,ky=on?JOY.y:by;
  ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=on?0.9:0.55;
  ctx.fillStyle='rgba(30,20,12,.35)';ctx.beginPath();ctx.arc(bx,by,R,0,7);ctx.fill();ctx.strokeStyle='#e6d6b6';ctx.lineWidth=2.5*DPR;ctx.stroke();
  ctx.strokeStyle='rgba(230,214,182,.6)';ctx.lineWidth=1.5*DPR;for(const sd of [-1,1]){ctx.beginPath();ctx.moveTo(bx+sd*R*0.62,by-R*0.18);ctx.lineTo(bx+sd*R*0.8,by);ctx.lineTo(bx+sd*R*0.62,by+R*0.18);ctx.stroke()}
  const g=ctx.createRadialGradient(kx-R*0.12,ky-R*0.12,2,kx,ky,R*0.45);g.addColorStop(0,'#fbf3df');g.addColorStop(1,'#c9a76a');ctx.fillStyle=g;ctx.beginPath();ctx.arc(kx,ky,R*0.42,0,7);ctx.fill();ctx.strokeStyle='#7a5a2e';ctx.lineWidth=2*DPR;ctx.stroke();
  ctx.restore()}
function touchHit(e,down){
  if(!TOUCH)return;
  const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*VW,y=(e.clientY-r.top)/r.height*VH;
  if(!down){if(JOY.id===e.pointerId){JOY.id=null;JOY.s=0}for(const k in touchOwner)if(touchOwner[k]===e.pointerId){touchState[k]=false;delete touchOwner[k]}return}
  if(JOY.id===e.pointerId){joyMove(x,y);return}
  if(down&&e.type==='pointerdown'){for(const k of ['pausa','camara','salir','seguir','temblor']){const b=tbtn[k];if(b&&x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){
    if(k==='pausa')paused=true;else if(k==='seguir')paused=false;else if(k==='temblor')setAJ('shake',!AJ.shake);else if(k==='salir'){paused=false;abortRace()}else toggleCam();return}}
    {let onBtn=false;for(const k in tbtn){if(k==='left'||k==='right')continue;const b=tbtn[k];if(b&&x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h)onBtn=true}if(!onBtn&&joyStart(e,x,y))return}}
  for(const k in tbtn){if(['pausa','camara','salir','seguir','temblor','left','right'].includes(k))continue;const b=tbtn[k];const inside=x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h;
    if(inside){touchState[k]=true;touchOwner[k]=e.pointerId}else if(touchOwner[k]===e.pointerId){touchState[k]=false;delete touchOwner[k]}}
}

/* ---------- red: resultados y fantasmas, solo dentro de Historiapp ----------
   Usa el mismo Apps Script del ranking de Historiapp (acciones cq_*), de modo que el alumno se identifica
   con su alta del ranking y el profesor recibe los resultados en una pestaña «Cuadrigas» de su hoja. */
const NET_URL='https://script.google.com/macros/s/AKfycbzjxo9QvXjWabkFGm3MtbgTJWV1OMT372TAD7n-iTSoSR7av2KMpYBb3LhRfXvWt36GeA/exec';
const GRUPOS_HD=['1ºA','1ºB','1ºTAMA','1ºEnglish'];
function rankingId(){try{const r=JSON.parse(localStorage.getItem('historiapp.ranking')||'null');if(r&&r.uid&&!r.retirado)return r}catch(e){}return null}
/* identidad para los resultados: la del ranking o, si el alumno no está apuntado, la que da una vez en el juego */
function netIdentity(){
  const r=rankingId();if(r)return {uid:r.uid,alias:r.alias,grupo:r.grupo,nombre:r.nombre,apellido1:r.apellido1,apellido2:r.apellido2||'',ranking:true};
  const a=load('cuadrigas.alumno');return a&&a.uid?Object.assign({ranking:false},a):null;
}
const netReady=()=>IN_APP&&!!rankingId();      // los fantasmas piden alias moderado: solo con ranking
function newUid(){try{return Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>b.toString(36).padStart(2,'0')).join('')}catch(e){return (Date.now().toString(36)+Math.random().toString(36).slice(2)).replace(/[^a-z0-9]/g,'').slice(0,24)}}
async function netPost(body){const r=await fetch(NET_URL,{method:'POST',keepalive:true,headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});return r.json()}
async function netGet(q){const r=await fetch(NET_URL+'?'+new URLSearchParams(q).toString());return r.json()}
async function netGhostList(circ,tiro){const j=await netGet({accion:'cq_lista',pista:circ,tiro});return j&&j.ok?j.lista:[]}
async function netGhostGet(id){const j=await netGet({accion:'cq_fantasma',id});return j&&j.ok?j:null}
async function netGhostUpload(g){const me=netIdentity();if(!me||!me.ranking)return {ok:false};
  return netPost({accion:'cq_fantasma',uid:me.uid,alias:me.alias,grupo:me.grupo,pista:g.circ,tiro:g.tiro,vueltas:CRONO_LAPS[g.circ],t:g.t,datos:g.d})}
/* resultados: cola local que se reintenta hasta que el servidor confirma */
function sendResult(modo,detalle,extra){
  if(!IN_APP)return;const me=netIdentity();if(!me)return;
  const q=load('cuadrigas.pendientes')||[];
  q.push(Object.assign({accion:'cq_resultado',uid:me.uid,nombre:me.nombre,apellido1:me.apellido1,apellido2:me.apellido2,grupo:me.grupo,modo,detalle,idioma:LANG,cuando:new Date().toISOString(),id:newUid()},extra||{}));
  store('cuadrigas.pendientes',q.slice(-40));flushResults();
}
let FLUSHING=false;
async function flushResults(){
  if(!IN_APP||FLUSHING)return;const q=load('cuadrigas.pendientes')||[];if(!q.length)return;FLUSHING=true;
  try{for(const item of q.slice()){const j=await netPost(item);if(j&&(j.ok||j.err==='duplicado')){const cur=load('cuadrigas.pendientes')||[];store('cuadrigas.pendientes',cur.filter(x=>x.id!==item.id))}else if(j&&j.err&&j.err!=='red'){/* rechazo del servidor: se descarta para no insistir */const cur=load('cuadrigas.pendientes')||[];store('cuadrigas.pendientes',cur.filter(x=>x.id!==item.id))}}}
  catch(e){}finally{FLUSHING=false}
}
setTimeout(flushResults,3000);
addEventListener('online',flushResults);
/* alta mínima para quien no está en el ranking: nombre, apellido y grupo, una sola vez */
function needIdentity(){return IN_APP&&!netIdentity()}

  <div class="row"><label>${L('Nombre','First name')}<br><input id="idn" maxlength="40"></label><label>${L('Primer apellido','Surname')}<br><input id="ida" maxlength="40"></label>
  <label>${L('Grupo','Group')}<br><select id="idg"><option value="">${L('Elige tu grupo','Choose your group')}</option>${GRUPOS_HD.map(g=>`<option>${g}</option>`).join('')}</select></label></div>

  if([5,15,30,60].includes(best)&&!G.hitos['fans'+best])ev.push({k:'fans',n:best});
  if(G.aurigas.length<3&&G.totalJ>=3&&!G.hitos.mozo&&R()<0.5)ev.push({k:'mozo'});
  if(G.stage==='roma'&&G.aurigas.length<3&&G.prestige>=60&&R()<0.15)ev.push({k:'fichaje',fac:pick(FACS.filter(f=>f!==G.fac))});
  if(R()<0.08)ev.push({k:'defixio'});
  if(G.stage==='roma'&&!G.hitos.caligula&&R()<0.25)ev.push({k:'caligula'});
  if(G.stage==='roma'&&!G.hitos.plinio&&R()<0.2)ev.push({k:'plinio'});
}

/* ---------- gestión ampliada (v3): favor del editor, entrenamiento, rival con nombre y objetivos de la facción ----------
   Todo lo de este archivo es convención del juego (códice: cEditor, cEntreno, cRival, cObjetivo), apoyada en
   Nelis-Clément (2002, p. 267) para la negociación del dominus factionis y en Bell (2014, p. 495) para el personal. */

/* favor del editor */
const feeMul=()=>0.85+clamp(G.favor==null?50:G.favor,0,100)/333;
function favorAdd(n){G.favor=clamp((G.favor==null?50:G.favor)+n,0,100)}
function negotiate(i){
  const o=G.offers[i];if(!o||o.neg||o.withdrawn)return;o.neg=true;unlock('cEditor');unlock('editor');
  const p=clamp(0.3+G.favor/200+G.prestige/400,0.2,0.85);
  if(R()<p){o.fee=Math.round(o.fee*1.3/10)*10;o.negOk=true;favorAdd(-5);logG(L(`El editor sube la tarifa de ${o.title}`,`The editor raises the fee for ${o.title}`))}
  else{o.withdrawn=true;favorAdd(-10);if(offerSel===i){offerSel=null;slots=[]}logG(L(`El editor da ${o.title} a otra cuadra`,`The editor gives ${o.title} to another stable`))}
  saveG();hub('jornada');
}

/* entrenamiento entre jornadas */
const PLANES={
  descanso:{es:'Descanso',en:'Rest',des:'Recupera más cansancio.',den:'Recovers more fatigue.'},
  vel:{es:'Velocidad',en:'Speed',des:'Series cortas. Puede subir la velocidad.',den:'Short sprints. May raise speed.'},
  agu:{es:'Aguante',en:'Stamina',des:'Trabajo largo. Puede subir el aguante.',den:'Long work. May raise stamina.'},
  gui:{es:'Viraje',en:'Turning',des:'Giros alrededor de la meta. Puede mejorar la guía.',den:'Turns around the post. May improve leading.'}
};
const planName=k=>L(PLANES[k].es,PLANES[k].en);
function setPlan(id,k){const h=G.horses.find(x=>x.id===id);if(h){h.plan=k;if(k!=='descanso')unlock('cEntreno');saveG();hub('establo')}}
function applyTraining(){
  const out=[];
  for(const h of G.horses){
    const k=h.plan||'descanso';
    if(k==='descanso'||h.inj>0){h.fat=clamp(h.fat-8,0,100);continue}
    if(h.age<4)continue;
    let ch=h.age<=8?0.6:h.age<=12?0.35:0.12;if(G.staff.doctor)ch+=0.2;
    h.fat=clamp(h.fat+12,0,100);
    if(R()<ch&&h[k]<99){h[k]++;out.push(L(`${h.name} mejora en ${planName(k).toLowerCase()} (+1)`,`${h.name} improves in ${planName(k).toLowerCase()} (+1)`))}
    if(h.fat>80&&R()<0.1*((h.traits||[]).includes('fragil')?1.8:1)){h.inj=G.staff.medicus?1:2;out.push(L(`${h.name} se ha lesionado entrenando cansado`,`${h.name} got injured training while tired`));horseHist(h,L('lesionado en el entrenamiento','injured in training'))}
  }
  G.lastTraining=out;return out;
}

/* el rival con nombre */
function nemesisFor(r){const N=G.nemesis;if(!N||N.stage!==G.stage)return null;return r.cars.find(c=>c.nemesis)||null}
function injectNemesis(r){
  const N=G.nemesis;if(!N||N.stage!==G.stage||r.type==='diversium')return null;
  const c=r.cars.find(c=>!c.isPlayer&&c.fac===N.fac);if(!c)return null;
  c.name=N.name;c.nemesis=true;const sk=clamp(N.skill,0.4,0.97);
  c.ai=makeAI(sk,{startR:c.ai.startR,R:c.ai.R});c.traits.hab=Math.round(sk*10);c.traits.agr=Math.max(c.traits.agr,6);
  unlock('cRival');return c;
}
function nemesisAfterRace(r,pos,notes){
  const P=r.players[0];const N=G.nemesis;
  const nc=r.cars.find(c=>c.nemesis);
  if(N&&nc){
    const mine=P.crashed?99:placeOf(r,P),his=nc.crashed?99:placeOf(r,nc);
    if(mine<his){N.l++;G.prestige=clamp(G.prestige+2,0,100);notes.push(L(`Has quedado por delante de ${N.name}, tu rival de los ${fName(N.fac)} (${N.l} a ${N.w}). La grada lo celebra (+2 de prestigio).`,`You finished ahead of ${N.name}, your ${fName(N.fac)} rival (${N.l} to ${N.w}). The crowd cheers (+2 prestige).`))}
    else if(his<mine){N.w++;N.skill=Math.min(0.97,N.skill+0.01);notes.push(L(`${N.name}, de los ${fName(N.fac)}, ha vuelto a quedar por delante (${N.w} a ${N.l}).`,`${N.name} of the ${fName(N.fac)} finished ahead again (${N.w} to ${N.l}).`))}
    if(N.l-N.w>=3){notes.push(L(`${N.name} pide el traspaso a otra facción después de tantas derrotas contra tu cuadra. Los aurigas cambiaban de facción con frecuencia (Nelis-Clément, 2002, p. 275).`,`${N.name} asks to move to another faction after so many defeats by your stable. Charioteers often changed factions (Nelis-Clément, 2002, p. 275).`));hito('nem'+G.totalJ,L(`Derrota la rivalidad de ${N.name}`,`Wins the rivalry with ${N.name}`));G.prestige=clamp(G.prestige+4,0,100);G.nemesis=null;unlock('traspasos')}
    return;
  }
  if(N&&N.stage===G.stage)return;
  // nace una rivalidad: el rival que te gana, o el segundo si ganas tú
  const cand=r.order.find(c=>!c.isPlayer&&c.fac!==G.fac&&!r.friends(P,c));
  if(cand&&(pos!==1||R()<0.5)&&G.totalJ>=1){
    G.nemesis={name:cand.name,fac:cand.fac,skill:clamp((cand.traits.hab||6)/10+0.05,0.5,0.95),w:pos===1?0:1,l:pos===1?1:0,stage:G.stage};
    unlock('cRival');
    notes.push(L(`Nace una rivalidad: ${cand.name}, de los ${fName(cand.fac)}, buscará cruzarse contigo en las próximas carreras.`,`A rivalry is born: ${cand.name} of the ${fName(cand.fac)} will seek you out in the coming races.`));
  }
}

/* objetivos de la facción para la temporada */
const OBJ={
  victorias:{n:o=>G.stage==='roma'?3:2,es:n=>`Ganar ${n} carreras esta temporada`,en:n=>`Win ${n} races this season`},
  podios:{n:()=>4,es:n=>`Terminar en el podio ${n} veces`,en:n=>`Finish on the podium ${n} times`},
  limpio:{n:()=>0,es:()=>'Terminar la temporada sin ningún naufragium',en:()=>'Finish the season without a single crash'},
  cuadriga:{n:()=>1,es:()=>'Ganar una carrera con cuadriga',en:()=>'Win a race with a quadriga'},
  triga:{n:()=>1,es:()=>'Ganar una carrera con triga',en:()=>'Win a race with a triga'},
  rival:{n:()=>2,es:n=>`Quedar ${n} veces por delante de tu rival`,en:n=>`Finish ahead of your rival ${n} times`},
  caja:{n:()=>G.stage==='roma'?20000:1500,es:n=>`Ganar al menos ${fmt(n)} HS de caja en la temporada`,en:n=>`Grow the funds by at least ${fmt(n)} HS this season`}
};
function objText(o){if(!o)return '';const D=OBJ[o.k];return L(D.es(o.n),D.en(o.n))}
function ensureObjective(){
  if(G.objetivo&&G.objetivo.season===G.season)return;
  const A=G.aurigas;const ks=['victorias','podios','limpio','caja'];
  if(A.some(a=>a.rank==='agitator'||a.wins>=4))ks.push('cuadriga');else if(A.some(a=>a.wins>=2))ks.push('triga');
  if(G.nemesis&&G.nemesis.stage===G.stage)ks.push('rival');
  const k=pick(ks);const n=OBJ[k].n();
  const reward=Math.round((G.stage==='roma'?12000:900)/10)*10;
  G.objetivo={k,n,p:0,season:G.season,reward,ok:null,lostL0:G.nemesis?G.nemesis.l:0};unlock('cObjetivo');
}
function objectiveAfterRace(pos,res,offer,crashed){
  const o=G.objetivo;if(!o||o.season!==G.season||o.ok!=null)return;
  if(o.k==='victorias'&&pos===1)o.p++;
  if(o.k==='podios'&&pos&&pos<=3)o.p++;
  if(o.k==='limpio'&&crashed)o.p++;
  if(o.k==='cuadriga'&&pos===1&&offer.tiro==='cuadriga')o.p++;
  if(o.k==='triga'&&pos===1&&offer.tiro==='triga')o.p++;
  if(o.k==='rival')o.p=G.nemesis?G.nemesis.l-o.lostL0:o.p;
  if(o.k==='caja')o.p=G.money-G.season0.money;
}
function objectiveDone(o){return o.k==='limpio'?o.p===0:o.p>=o.n}
function evaluateObjective(s){
  const o=G.objetivo;if(!o||o.season!==s.season)return;
  if(o.k==='caja')o.p=G.money-G.season0.money;
  o.ok=objectiveDone(o);
  if(o.ok){G.money+=o.reward;G.prestige=clamp(G.prestige+5,0,100);G.facCut=0.20;s.obj=L(`Objetivo cumplido: ${objText(o)}. El dominus paga ${hsTxt(o.reward)} y la cuadra gana prestigio.`,`Goal achieved: ${objText(o)}. The dominus pays ${hsTxt(o.reward)} and the stable gains prestige.`)}
  else{G.prestige=clamp(G.prestige-4,0,100);G.facCut=0.25;s.obj=L(`Objetivo no cumplido: ${objText(o)}. La facción se quedará el 25 % en lugar del 20 % la próxima temporada.`,`Goal missed: ${objText(o)}. The faction will keep 25% instead of 20% next season.`)}
  G.objHist.push({season:o.season,txt:objText(o),ok:o.ok});logG(s.obj);
}
function objProgressHTML(){
  const o=G.objetivo;if(!o)return '';
  const done=objectiveDone(o);const prog=o.k==='limpio'?(o.p?L('ya has sufrido un naufragium','you have already crashed'):L('de momento, ninguno','none so far')):o.k==='caja'?`${hsTxt(G.money-G.season0.money)} / ${hsTxt(o.n)}`:`${o.p} / ${o.n}`;
  return `<div class="obj"><span>${L('Objetivo del dominus factionis','Goal from the dominus factionis')}</span><b>${esc(objText(o))}</b><span>${prog}${done&&o.k!=='limpio'?' · '+L('conseguido','achieved'):''} · ${L('premio','reward')} ${hs(o.reward)}</span></div>`;
}

  if(!ready.length)return `<p>${L('Todos tus aurigas están lesionados. La cuadra no corre, aunque paga el mantenimiento','All your charioteers are injured. The stable does not race, but still pays upkeep')} (${hs(upkeepCost())}).</p><button class="big" onclick="restDay()">${L('Pasar la jornada','Skip the day')}</button>`;
  if(A.inj>0){G.aurSel=ready[0].id}
  let h=objProgressHTML();
  if(G.lastTraining&&G.lastTraining.length)h+=`<p class="note">${L('Entrenamiento de la última jornada','Last day’s training')}: ${G.lastTraining.map(esc).join(' · ')}.</p>`;
  if(G.nemesis&&G.nemesis.stage===G.stage)h+=`<p class="note">★ ${L(`Tu rival: ${esc(G.nemesis.name)}, de los ${fName(G.nemesis.fac)}. Te ha ganado ${G.nemesis.w} veces y tú a él ${G.nemesis.l}. Correrá en las carreras en que su facción presente carro.`,`Your rival: ${esc(G.nemesis.name)} of the ${fName(G.nemesis.fac)}. He has beaten you ${G.nemesis.w} times and you him ${G.nemesis.l}. He races whenever his faction fields a chariot.`)}</p>`;

  G.offers.forEach((o,i)=>{const T=TUNING.tiros[o.tiro];const nh=availHorses().length;const can=canTiro(o.tiro);const ok=can.ok&&nh>=T.n;
    h+=`<div class="offer ${offerSel===i?'sel':''}"><h2>${esc(o.title)}</h2><p>${tiroName(o.tiro)} · ${T.n} ${L('caballos','horses')} · ${o.laps} ${L('vueltas','laps')} · ${o.nPerFac*4} ${L('carros','chariots')}</p>
    <p>${L('Tarifa','Fee')} ${hs(o.fee)} · ${L('Premio','Prize')} ${hs(o.prize)}</p><p class="muted">${esc(o.desc)}</p>
    ${o.withdrawn?`<p class="lock">${L('El editor se la ha dado a otra cuadra.','The editor gave it to another stable.')}</p>`:ok?`<button onclick="chooseOffer(${i})">${L('Elegir','Choose')}</button> ${o.neg?`<span class="muted">${o.negOk?L('tarifa negociada','fee negotiated'):''}</span>`:`<button onclick="negotiate(${i})" title="${esc(L('Puedes pedir más, aunque el editor puede ofenderse y dársela a otra cuadra.','You can ask for more, though the editor may take offence and give it to another stable.'))}">${L('Pedir más tarifa','Ask for a higher fee')}</button>`}`:`<p class="lock">${can.ok?L('Faltan caballos sanos.','Not enough fit horses.'):esc(can.why)}</p>`}</div>`});
  h+=`</div><p class="muted">${L('Al pedir más tarifa, el editor acepta con más facilidad si tu cuadra tiene su favor y prestigio; si se ofende, retira la oferta y su favor baja. El favor sube al correr y, sobre todo, al ganar.','When you ask for a higher fee, the editor is more likely to agree if your stable has his favour and prestige; if offended, he withdraws the offer and his favour drops. Favour rises when you race and above all when you win.')}</p></div><p class="muted">${L('Mantenimiento de la jornada','Upkeep for the day')}: ${hs(upkeepCost())} · <button onclick="restDay()">${L('Descansar esta jornada','Rest this day')}</button></p>`;
  if(offerSel!=null)h+=engancheHTML();

function slotNames(t){
  if(t==='biga')return [L('izquierda','left'),L('derecha','right')];
  if(t==='triga')return trigaSide==='der'?[L('iugal izq.','left yoke'),L('iugal der.','right yoke'),L('tercero, por fuera','third, outside')]:[L('tercero, por dentro','third, inside'),L('iugal izq.','left yoke'),L('iugal der.','right yoke')];
  return [L('funalis izq.','left trace'),L('iugal izq. (introiugus)','left yoke (introiugus)'),L('iugal der.','right yoke'),L('funalis der.','right trace')];
}
function guideIdx(t){return t==='biga'?0:t==='triga'?(trigaSide==='der'?0:1):guideSel}
function engancheHTML(){

  let h=`<h3>${L('Quién conduce','Who drives')}</h3><div class="row">`+G.aurigas.map(a=>{const c=canTiro(o.tiro,a);return `<div class="mini ${G.aurSel===a.id?'sel':''} ${a.inj||!c.ok?'off':''}" ${a.inj||!c.ok?'':`onclick="G.aurSel=${a.id};hub()"`}><canvas data-ap="${a.id}" width="56" height="56"></canvas><div><b>${esc(a.name)}</b><br><span class="muted">${a.age} ${L('años','yrs')} · ${a.rank} · ${a.wins} v.${a.miedo>20?' · '+L('con miedo','scared'):''}${a.inj?' · '+L('lesionado','injured'):''}${!c.ok?' · '+L('sin rango','not qualified'):''}</span></div></div>`}).join('')+`</div>`;
  if(o.type==='diversium')return h+`<h3>Diversium</h3><p>${L('En el diversium tu auriga corre con la cuadriga de otra cuadra y esa cuadra corre con la tuya, de modo que gana quien mejor conduce caballos ajenos (Bell, 2020, p. 13).','In the diversium your charioteer drives another stable’s quadriga and that stable drives yours, so the winner is whoever best drives someone else’s horses (Bell, 2020, p. 13).')}</p>
    <p>${L('Puesto de guía','Lead position')}: <button class="${guideSel===1?'on':''}" onclick="guideSel=1;hub()">introiugus (Bell, 2020)</button> <button class="${guideSel===0?'on':''}" onclick="guideSel=0;hub()">funalis (Thuillier, 2003)</button></p>
    <p class="act"><button class="big" onclick="preRace()">${L('Ver a los rivales','See the rivals')}</button></p>`;
  if(slots.length!==T.n)slots=new Array(T.n).fill(null);

  if(o.tiro==='cuadriga')h+=`<p class="note">${L('◆ ¿Qué caballo guía el viraje? Bell (2020, pp. 21-22) señala al iugal interior izquierdo (introiugus) y Thuillier (2003, pp. 296-297) al funalis izquierdo. Elige tu lectura:','◆ Which horse leads the turn? Bell (2020, pp. 21-22) points to the inner left yoke horse (introiugus) and Thuillier (2003, pp. 296-297) to the left trace horse. Choose your reading:')} <button class="${guideSel===1?'on':''}" onclick="guideSel=1;hub()">introiugus</button> <button class="${guideSel===0?'on':''}" onclick="guideSel=0;hub()">funalis</button></p>`;
  if(o.tiro==='triga')h+=`<p class="note">${L('Las fuentes de clase no dicen dónde iba el tercer caballo de la triga (convención del juego). Pruébalo:','Our class sources do not say where the triga’s third horse went (game convention). Try it:')} <button class="${trigaSide==='der'?'on':''}" onclick="trigaSide='der';slots=[];autoFill()">${L('por fuera, a la derecha','outside, on the right')}</button> <button class="${trigaSide==='izq'?'on':''}" onclick="trigaSide='izq';slots=[];autoFill()">${L('por dentro, a la izquierda','inside, on the left')}</button></p>`;
  h+=`<div class="slots">`+slots.map((id,i)=>{const H=G.horses.find(x=>x.id===id);return `<div class="slot ${H?'full':''}" onclick="slots[${i}]=null;hub()"><small>${names[i]}${i===gi?' · '+L('guía','lead')+' ◆':''}</small>${H?`<canvas data-hp="${H.id}" width="72" height="48"></canvas><span>${esc(H.name)}</span>`:L('vacío','empty')}</div>`}).join('')+`</div>`;
  const risky=slots.map(id=>G.horses.find(x=>x.id===id)).filter(H=>H&&injRisk(H)>0);
  if(risky.length)h+=`<p class="warn">${L('Cuidado','Careful')}: ${risky.map(H=>`${esc(H.name)} (${L('riesgo de lesión','injury risk')} ${Math.round(injRisk(H)*100)} %)`).join(', ')}. ${L('Un caballo cansado puede romperse.','A tired horse can break down.')}</p>`;
  h+=`<div class="hgrid">`+G.horses.filter(H=>!slots.includes(H.id)).map(H=>horseCard(H,true)).join('')+`</div>`;
  h+=`<p class="act"><button onclick="autoFill()">${L('Enganche automático','Auto harness')}</button> <button class="big" ${slots.every(x=>x)?'':'disabled'} onclick="preRace()">${L('Ver a los rivales','See the rivals')}</button></p>`;
  return h;
}
function horseCard(H,pickable){
  const state=H.age<5?L('potro','foal'):H.inj?L('lesionado','injured'):'';
  const risk=injRisk(H);
  return `<div class="hcard ${H.inj||H.age<5?'off':''}"><canvas data-hp="${H.id}" width="150" height="100"></canvas><div class="hc-b"><h3>${esc(H.name)} ${state?`<span class="tag">${state}</span>`:''}</h3>
  <div class="muted">${H.age} ${L('años','yrs')} · ${studName(H.stud)} · ${coatName(H.coat)}</div><div class="chips">${(H.traits||[]).map(chip).join('')}</div>
  <div class="stats"><span>${L('Velocidad','Speed')}</span>${bar(H.vel)}<span>${L('Aguante','Stamina')}</span>${bar(H.agu)}<span>${L('Guía','Lead')}</span>${bar(H.gui)}<span>${L('Cansancio','Fatigue')}</span>${bar(H.fat,true)}</div>
  <div class="muted">${H.wins||0} ${L('victorias','wins')} · ${H.races||0} ${L('carreras','races')}${risk?` · <b>${L('riesgo','risk')} ${Math.round(risk*100)} %</b>`:''}</div>
  ${pickable&&!H.inj&&H.age>=5?`<button onclick="placeH(${H.id})">${L('Enganchar','Harness')}</button>`:''}</div></div>`;
}
function chooseOffer(i){offerSel=i;slots=[];autoFill()}
function placeH(id){const i=slots.indexOf(null);if(i>=0)slots[i]=id;hub()}
function autoFill(){
  const o=G.offers[offerSel],T=TUNING.tiros[o.tiro];slots=new Array(T.n).fill(null);
  const av=availHorses().sort((a,b)=>(b.vel+b.agu-b.fat*1.8)-(a.vel+a.agu-a.fat*1.8)).slice(0,T.n);
  if(av.length<T.n)return hub();
  const gi=guideIdx(o.tiro);const g=[...av].sort((a,b)=>b.gui-a.gui)[0];slots[gi]=g.id;
  let k=0;for(let i=0;i<T.n;i++){if(slots[i])continue;while(av[k].id===g.id)k++;slots[i]=av[k++].id}
  const A=curAur();if(!canTiro(o.tiro,A).ok){const b=G.aurigas.find(a=>!a.inj&&canTiro(o.tiro,a).ok);if(b)G.aurSel=b.id}
  hub();
}
let pendingOffer=null,pendingDefixio=false,raceAur=null;

  const A=curAur();raceAur=A;
  setSeed((Date.now()%999983)+G.totalJ*7);

  if(nem)h+=`<p class="note">★ ${L(`Corre tu rival, ${esc(nem.name)}, de los ${fName(nem.fac)} (${G.nemesis.w} a ${G.nemesis.l}). Es agresivo y se crece contigo.`,`Your rival ${esc(nem.name)} of the ${fName(nem.fac)} is racing (${G.nemesis.w} to ${G.nemesis.l}). He is aggressive and raises his game against you.`)}</p>`;
  if(race.alliance)h+=`<p class="note">${L('Alianzas de esta carrera','Alliances in this race')}: ${race.alliance.map(p=>p.map(fName).join(L(' con ',' with '))).join(' · ')}. ${L('Tus aliados no te cierran el paso y van a por el enemigo que te aprieta.','Your allies will not block you and will go after an enemy who crowds you.')}</p>`;

function pickQuiz(n){
  const done=new Set(G.quiz.filter(q=>q.ok).map(q=>q.i));
  let pool=QUIZ.map((q,i)=>i).filter(i=>!done.has(i)&&G.codex[QUIZ[i][2]]);
  if(pool.length<n)pool=pool.concat(QUIZ.map((q,i)=>i).filter(i=>!done.has(i)&&!pool.includes(i)));
  return shuffle(pool).slice(0,n);
}

function codexHTML(all){

function registroTxt(){
  const Ls=[];const d=new Date();
  Ls.push(L('CVADRIGAE · Registro de actividad','CVADRIGAE · Activity record'));Ls.push(`${L('Fecha','Date')}: ${d.toLocaleString(LANG==='en'?'en-GB':'es-ES')}`);
  const camp=load(KEY.campana);
  if(camp&&camp.done){Ls.push('');Ls.push(L('CLASE DE VEINTE MINUTOS','TWENTY-MINUTE LESSON'));Ls.push(`  ${L('Alumno','Student')}: ${camp.student||'—'} · ${camp.date}`);camp.results.forEach((r,i)=>Ls.push(`  ${i+1}. ${r.title}: ${r.pos?ord(r.pos):'naufragium'} · ${r.time} · ${L('pregunta','question')} ${r.ok?L('bien','right'):L('mal','wrong')}${r.choice?` · ${L('elección','choice')}: ${r.choice}`:''}`));Ls.push(`  ${L('Código de verificación','Verification code')}: ${camp.ver}`)}
  if(G){
    const A=curAur();Ls.push('');Ls.push(L('CARRERA PROFESIONAL','CAREER'));Ls.push(`${L('Alumno','Student')}: ${G.student||L('(sin nombre)','(no name)')}`);Ls.push(`${L('Cuadra','Stable')}: ${fName(G.fac)} · ${G.stage==='roma'?L('Roma','Rome'):'Tarraco'} · ${L('temporada','season')} ${G.season}, ${L('jornada','day')} ${G.jornada}`);
    G.aurigas.forEach(a=>Ls.push(`${L('Auriga','Charioteer')}: ${a.name}, ${a.status}, ${a.rank} · ${a.races} ${L('carreras','races')}, ${a.wins} ${L('victorias','wins')}, ${a.crashes} naufragios`));
    Ls.push(`${L('Caja','Funds')}: ${hsTxt(G.money)} · ${L('prestigio','prestige')} ${Math.round(G.prestige)} · ${L('favor del editor','editor’s favour')} ${Math.round(G.favor||0)}`);
    (G.objHist||[]).forEach(o=>Ls.push(`${L('Objetivo de la temporada','Season goal')} ${o.season}: ${o.txt} · ${o.ok?L('cumplido','achieved'):L('no cumplido','missed')}`));
    if(G.nemesis)Ls.push(`${L('Rival','Rival')}: ${G.nemesis.name} (${fName(G.nemesis.fac)}) · ${G.nemesis.w}-${G.nemesis.l}`);
    if(G.alliance)Ls.push(`${L('Lectura de las alianzas elegida','Chosen reading of the alliances')}: ${G.alliance==='bell'?'Bell (2020)':'Thuillier (2003)'}`);
    const ok=G.quiz.filter(q=>q.ok).length;Ls.push('');Ls.push(`${L('PREGUNTAS','QUESTIONS')}: ${ok} ${L('correctas de','correct out of')} ${G.quiz.length}`);
    G.quiz.forEach(q=>Ls.push(`  [${q.ok?L('bien','right'):L('mal','wrong')}] ${quizItem(q.i)[0]}`));
    const cod=Object.keys(G.codex).filter(k=>CODEX[k]);Ls.push('');Ls.push(`${L('CÓDICE','CODEX')}: ${cod.length} ${L('de','of')} ${Object.keys(CODEX).length}`);Ls.push('  '+cod.map(k=>codexEntry(k).t).join(' · '));
    Ls.push('');Ls.push(L('HITOS','MILESTONES'));Object.values(G.hitos).filter(v=>typeof v==='string').forEach(v=>Ls.push('  '+v));
    Ls.push('');Ls.push(L('DIARIO DE LA CUADRA','STABLE DIARY'));G.log.forEach(l=>Ls.push(`  [${l.j}] ${l.t}`));
  }
  const cr=load(KEY.clase)||[];

  return Ls.join('\n');

  return {circuit:m[1]==='T'?'tarraco':'maximo',tiro:{B:'biga',T:'triga',C:'cuadriga'}[m[2]],laps:+m[3],seed:+m[4],code:m[0]};
}

/* ---------- la clase de veinte minutos: cinco carreras encadenadas ---------- */
const CAMP=[
 {id:'c1',circuit:'tarraco',tiro:'biga',nPer:1,laps:2,level:0,skill:0.3,q:0,
  t:['1. La primera biga en Tarraco','1. The first biga in Tarraco'],
  x:['El circo romano era un recinto muy alargado, con un extremo recto para las cocheras de salida (carceres) y otro curvo, y una barrera central que dividía la pista, de modo que la forma del edificio era la forma de la carrera (Tema 4). El de Tarraco tenía una pista de 290 por 67 metros (Ruiz de Arbulo y Gris, 2021, p. 205). Tu auriga es un esclavo joven y empieza con biga, el tiro de los menos experimentados (Bell, 2020, p. 16).','The Roman circus was a very long building, with a straight end for the starting stalls (carceres) and a curved one, and a central barrier dividing the track, so the shape of the building was the shape of the race (Tema 4). The track at Tarraco measured 290 by 67 metres (Ruiz de Arbulo & Gris, 2021, p. 205). Your charioteer is a young slave and starts with a biga, the team of the less experienced (Bell, 2020, p. 16).'],
  tip:['Espera a que caiga la mappa, gira siempre a la izquierda alrededor de la meta y carga el peso (Espacio) en el viraje.','Wait for the mappa to fall, always turn left around the turning post, and lean in (Space) through the turn.']},
 {id:'c2',circuit:'tarraco',tiro:'biga',nPer:2,laps:2,level:0,skill:0.36,q:8,
  t:['2. Dos bigas por facción','2. Two bigae per faction'],
  x:['Las facciones eran empresas que alquilaban caballos, aurigas y material a quien pagaba los juegos, y su personal incluía oficios como el sparsor, que echaba agua a la cabeza de los caballos durante la carrera (Nelis-Clément, 2002, pp. 266 y 280). En esta carrera corren ocho bigas, dos por facción, lo máximo que admitía la pista de Tarraco según Ruiz de Arbulo y Gris (2021, p. 205).','The factions were businesses that hired out horses, charioteers and equipment to whoever paid for the games, and their staff included trades like the sparsor, who threw water on the horses’ heads during the race (Nelis-Clément, 2002, pp. 266 and 280). Eight bigae race here, two per faction, the most the Tarraco track could take according to Ruiz de Arbulo & Gris (2021, p. 205).'],
  decision:{k:'sparsor',q:['¿Contratas un sparsor para esta carrera?','Do you hire a sparsor for this race?'],opts:[['Sí, que refresque a mis caballos','Yes, let him cool my horses'],['No, prefiero ahorrar','No, I would rather save money']]},
  tip:['Si contratas al sparsor, pasa pegado a la barrera en las rectas: tus caballos recuperan aguante.','If you hire the sparsor, run close to the barrier on the straights: your horses recover stamina.']},
 {id:'c3',circuit:'tarraco',tiro:'triga',nPer:1,laps:2,level:1,skill:0.42,q:36,
  t:['3. La triga, una herencia etrusca','3. The triga, an Etruscan legacy'],
  x:['Roma heredó la triga de los etruscos, aunque en el circo fue mucho menos frecuente que la cuadriga (Tema 4). Nuestras fuentes de clase no dicen dónde se enganchaba el tercer caballo, así que el juego te deja probar las dos posibilidades. Es una convención declarada, y sirve para pensar cómo un detalle técnico cambia la conducción.','Rome inherited the triga from the Etruscans, though in the circus it was far less common than the quadriga (Tema 4). Our class sources do not say where the third horse was harnessed, so the game lets you try both options. It is a declared convention, and it helps you think about how a technical detail changes the driving.'],
  decision:{k:'triga',q:['¿Dónde enganchas el tercer caballo?','Where do you harness the third horse?'],opts:[['Por fuera, a la derecha','Outside, on the right'],['Por dentro, a la izquierda','Inside, on the left']]},
  tip:['Con el tercer caballo por fuera, el tiro se va hacia la barrera en las rectas: corrige con suavidad.','With the third horse outside, the team drifts toward the barrier on the straights: correct gently.']},
 {id:'c4',circuit:'tarraco',tiro:'cuadriga',nPer:1,laps:2,level:1,skill:0.48,q:34,
  t:['4. La cuadriga y el agitator','4. The quadriga and the agitator'],
  x:['Solo los cocheros más experimentados, los agitatores, llevaban la cuadriga (Nelis-Clément, 2002, p. 273). Iba con dos caballos uncidos al yugo en el centro (iugales) y dos sujetos por rienda a los lados (funales). En el viraje, que siempre era a la izquierda, mandaba un caballo de la izquierda, aunque los autores no se ponen de acuerdo en cuál: Bell (2020, pp. 21-22) señala al iugal interior (introiugus) y Thuillier (2003, pp. 296-297) al funalis.','Only the most experienced drivers, the agitatores, handled the quadriga (Nelis-Clément, 2002, p. 273). It had two horses yoked in the centre (iugales) and two attached by traces on the outside (funales). In the turn, always to the left, a left-hand horse led, though scholars disagree which one: Bell (2020, pp. 21-22) points to the inner yoke horse (introiugus) and Thuillier (2003, pp. 296-297) to the trace horse.'],
  decision:{k:'guia',q:['¿Qué caballo guía tu viraje?','Which horse leads your turn?'],opts:[['El introiugus, como propone Bell','The introiugus, as Bell proposes'],['El funalis izquierdo, como propone Thuillier','The left trace horse, as Thuillier proposes']]},
  tip:['La cuadriga responde tarde: empieza a girar antes de llegar a la meta y no abuses del látigo.','The quadriga responds late: start turning before you reach the post and do not overuse the whip.']},
 {id:'c5',circuit:'maximo',tiro:'cuadriga',nPer:3,laps:2,level:1,skill:0.42,q:13,
  t:['5. El Circo Máximo','5. The Circus Maximus'],
  x:['El Circo Máximo, entre el Aventino y el Palatino, acogía unos 150.000 espectadores según Dionisio de Halicarnaso (Bell, 2020, p. 3), y su pista medía 580 por 79 metros (Ruiz de Arbulo y Gris, 2021, p. 205). Allí corrían doce carros, tres por facción, y las facciones se aliaban por parejas. Diocles, el auriga más famoso, ganó 1.462 de sus 4.257 carreras y reunió 35.863.120 sestercios (Bell, 2020, pp. 18-19). Una carrera real tenía siete vueltas; aquí corres dos.','The Circus Maximus, between the Aventine and the Palatine, held about 150,000 spectators according to Dionysius of Halicarnassus (Bell, 2020, p. 3), and its track measured 580 by 79 metres (Ruiz de Arbulo & Gris, 2021, p. 205). Twelve chariots raced there, three per faction, and the factions allied in pairs. Diocles, the most famous charioteer, won 1,462 of his 4,257 races and amassed 35,863,120 sesterces (Bell, 2020, pp. 18-19). A real race had seven laps; here you run two.'],
  decision:{k:'alianza',q:['¿Con qué lectura de las alianzas corres?','Which reading of the alliances do you race with?'],opts:[['Bell (2020): verdes con rojos y azules con blancos','Bell (2020): Greens with Reds, Blues with Whites'],['Thuillier (2003): azules con rojos y blancos con verdes','Thuillier (2003): Blues with Reds, Whites with Greens']]},
  tip:['Tus aliados no te cierran y van a por el enemigo que te aprieta. Cuidado con los restos de los naufragios.','Your allies will not block you and will go after an enemy crowding you. Watch out for wrecks.']}
];
let CS=null;
function campaignStart(){
  rerender=campaignStart;
  if(needIdentity())return show(`${langBtn()}<h1>${L('Clase de veinte minutos','Twenty-minute lesson')}</h1>${identityForm(campaignStart)}<p class="act"><button onclick="titleScreen()">${L('Volver','Back')}</button></p>`,'narrow');
  const me=netIdentity();
  show(`${langBtn()}<h1>${L('Clase de veinte minutos','Twenty-minute lesson')}</h1><p>${L('Cinco carreras, de una biga en Tarraco a doce cuadrigas en el Circo Máximo. Antes de cada carrera leerás un párrafo breve y tomarás una decisión; después, responderás una pregunta. Al final copiarás tu registro para el profesor.','Five races, from a biga in Tarraco to twelve quadrigae in the Circus Maximus. Before each race you will read a short paragraph and make a decision; afterwards you will answer a question. At the end you will copy your record for your teacher.')}</p>
  <div class="row"><label>${L('Tu nombre','Your name')}<br><input id="cpn" maxlength="40" value="${me?esc((me.nombre+' '+me.apellido1).trim()):''}"></label></div><p id="cperr" class="lock"></p>
  <p class="act"><button onclick="titleScreen()">${L('Volver','Back')}</button> <button class="big" onclick="campaignBegin()">${L('Empezar','Start')}</button></p>`,'narrow');
}
function campaignBegin(){
  const n=document.getElementById('cpn').value.trim();if(!n){document.getElementById('cperr').textContent=L('Escribe tu nombre.','Write your name.');return}
  CS={student:n,step:0,results:[],choices:{},date:new Date().toLocaleString(LANG==='en'?'en-GB':'es-ES'),done:false};store(KEY.campana,CS);SHOW_HELP=true;campaignIntro();
}
function campaignIntro(){
  rerender=campaignIntro;const C=CAMP[CS.step];
  let h=`<div class="progress">${CAMP.map((c,i)=>`<span class="${i<CS.step?'done':i===CS.step?'now':''}">${ROM(i+1)}</span>`).join('')}</div><h1>${L(...C.t)}</h1><p>${L(...C.x)}</p>`;
  if(C.decision){h+=`<h3>${L(...C.decision.q)}</h3><div class="qopts">${C.decision.opts.map((o,i)=>`<button class="${CS.choices[C.decision.k]===i?'on':''}" onclick="CS.choices['${C.decision.k}']=${i};campaignIntro()">${L(...o)}</button>`).join('')}</div>`}
  if(CS.step<2)h+=`<p class="note">${L('El látigo gasta el aguante de los caballos. Guárdalo para las rectas y para la última vuelta: si el aguante baja de la marca blanca de su barra, el tiro se apaga y no llega a la meta.','The whip uses up the horses’ stamina. Save it for the straights and the last lap: if stamina drops below the white mark on its bar, the team fades before the finish.')}</p>`;
  h+=`<p class="note">${L(...C.tip)}</p><p class="act"><button class="big" ${C.decision&&CS.choices[C.decision.k]==null?'disabled':''} onclick="campaignRace()">${L('A los carceres','To the starting gates')}</button></p>`;
  show(h,'narrow');
}
function campaignRace(){
  const C=CAMP[CS.step];setSeed(2026+CS.step*101);
  const T=TUNING.tiros[C.tiro];const horses=[];for(let i=0;i<T.n;i++)horses.push(makeHorse(C.level+1,{rival:true,age:7}));
  let trigaSide2='der',guide=0,alliance=null;const staff={};
  if(C.decision){const v=CS.choices[C.decision.k];
    if(C.decision.k==='sparsor'&&v===0)staff.sparsor=true;
    if(C.decision.k==='triga')trigaSide2=v===0?'der':'izq';
    if(C.decision.k==='alianza')alliance=v===0?[['P','R'],['V','A']]:[['V','R'],['A','P']];
    if(C.decision.k==='guia')guide=v===0?1:0;}
  // en el Circo Máximo todas las facciones llevan su sparsor, también la tuya
  if(C.circuit==='maximo')staff.sparsor=true;
  if(C.tiro==='triga')guide=trigaSide2==='der'?0:1;
  if(C.tiro==='cuadriga'&&C.decision&&C.decision.k!=='guia')guide=1;
  setupRace({circuit:C.circuit,tiro:C.tiro,laps:C.laps,nPerFac:C.nPer,level:C.level,skill:C.skill,label:L(...C.t),type:'campana',alliance,rivalSparsor:C.circuit==='maximo',
    humans:[{pl:1,fac:'V',name:CS.student.split(' ')[0],tiro:C.tiro,horses,guide,trigaSide:trigaSide2,pericia:55,staff,hortator:false}],onEnd:campaignEnd});
  hide();MODE='race';paused=false;
}
function campaignEnd(r){
  MODE='result';const C=CAMP[CS.step];const p=r.players[0];const pos=p.finished?r.order.indexOf(p)+1:0;const time=p.finished?timeStr(p.finishT-r.goT):'—';
  const q=quizItem(C.q);const opts=shuffle(q[1].map((t,k)=>({t,ok:k===0})));window._qopts=opts;
  const dec=C.decision?L(...C.decision.opts[CS.choices[C.decision.k]]):'';
  CS.results[CS.step]={title:L(...C.t),pos,time,ok:null,choice:dec};store(KEY.campana,CS);
  const fr=pick(QFRAMES);
  show(`<div class="progress">${CAMP.map((c,i)=>`<span class="${i<=CS.step?'done':''}">${ROM(i+1)}</span>`).join('')}</div><h1>${pos===1?'<span class="ansata">NICA</span>':pos?L(`Has entrado ${ord(pos)}`,`You finished ${ord(pos)}`):'Naufragium'}</h1><p>${L('Tiempo','Time')}: ${time}${p.crashed?' · '+esc(p.why||''):''}</p>
  <div class="ask" id="ask"><h3>${L(...fr)}</h3><p class="q">${esc(q[0])}</p><div class="qopts">${opts.map((o,k)=>`<button onclick="campaignAnswer(${k})">${esc(o.t)}</button>`).join('')}</div></div>
  <p class="act"><button class="big" id="cnext" disabled onclick="campaignNext()">${CS.step<CAMP.length-1?L('Siguiente carrera','Next race'):L('Terminar','Finish')}</button> <button onclick="campaignRetry()">${L('Repetir esta carrera','Retry this race')}</button></p>`,'narrow');
}
function campaignAnswer(k){
  const C=CAMP[CS.step],q=quizItem(C.q),o=window._qopts[k];if(CS.results[CS.step].ok!=null)return;CS.results[CS.step].ok=o.ok;store(KEY.campana,CS);if(o.ok)hxp(10,L('pregunta acertada','correct answer'));
  const E=codexEntry(q[2]);
  document.getElementById('ask').innerHTML=`<h3>${o.ok?L('Correcto','Correct'):L('No es esa','Not quite')}</h3>${o.ok?'':`<p>${L('La respuesta es','The answer is')}: <b>${esc(q[1][0])}</b>.</p>`}<div class="cdx"><b>${esc(E.t)}</b> ${tagK(E.k)}<p>${esc(E.x)}</p></div>`;
  document.getElementById('cnext').disabled=false;
}
function campaignRetry(){race=null;campaignRace()}
function campaignNext(){race=null;startAttract();CS.step++;store(KEY.campana,CS);if(CS.step>=CAMP.length)return campaignSummary();campaignIntro()}
function campaignAbort(){race=null;startAttract();campaignIntro()}
function campaignSummary(){
  rerender=campaignSummary;CS.done=true;
  const sig=CS.results.map(r=>`${r.pos}|${r.time}|${r.ok?1:0}`).join(';');
  CS.ver=verCode('CAMPANA',CS.student,sig,CS.results.filter(r=>r.ok).length);store(KEY.campana,CS);
  const ok=CS.results.filter(r=>r.ok).length,wins=CS.results.filter(r=>r.pos===1).length;
  if(!CS.sent){CS.sent=true;hxp(100,L('clase completa','lesson complete'));sendResult('campana',CS.results.map((r,i)=>`${i+1}: ${r.pos?r.pos+'º':'naufragium'} ${r.time} ${r.ok?'bien':'mal'}${r.choice?' ('+r.choice+')':''}`).join(' | '),{aciertos:ok,preguntas:CS.results.length,victorias:wins});store(KEY.campana,CS)}
  show(`<h1>${L('Fin de la clase','End of the lesson')}</h1><div class="titulus"><div class="lat">${esc(CS.student.toUpperCase().replace(/U/g,'V'))} · AVRIGA</div><div>${L(`${wins} victorias en 5 carreras · ${ok} respuestas correctas de 5`,`${wins} wins in 5 races · ${ok} correct answers out of 5`)}</div></div>
  <table><tr><th>${L('Carrera','Race')}</th><th>${L('Puesto','Pos.')}</th><th>${L('Tiempo','Time')}</th><th>${L('Decisión','Decision')}</th><th>${L('Pregunta','Question')}</th></tr>${CS.results.map(r=>`<tr><td>${esc(r.title)}</td><td>${r.pos?ord(r.pos):'naufragium'}</td><td>${r.time}</td><td>${esc(r.choice||'—')}</td><td>${r.ok?L('bien','right'):L('mal','wrong')}</td></tr>`).join('')}</table>
  ${IN_APP?sentNote():`<p>${L('Código de verificación','Verification code')}: <b class="ver">${CS.ver}</b></p>
  <p>${L('Copia el registro y pégalo en la tarea del Campus Virtual.','Copy the record and paste it into the course task.')}</p>`}
  <p class="act"><button class="big" onclick="copyReg(this)">${L('Copiar el registro','Copy the record')}</button> <button onclick="titleScreen()">${L('Portada','Title')}</button></p><pre class="reg" id="regtxt">${esc(registroTxt())}</pre>`);
}

/* ---------- bucle principal ---------- */
let last=performance.now(),acc=0,hoofT=0;
/* la carrera pide el teléfono en horizontal; los menús se leen en cualquier orientación */
let racingCls=null;const rotEl=document.getElementById('rot');
function racingState(){const rc=!!(MODE==='race'&&race&&!race.attract);if(rc!==racingCls){racingCls=rc;document.body.classList.toggle('racing',rc)}
  if(rc&&!paused&&rotEl&&innerHeight>innerWidth&&innerWidth<=900)paused=true}
function frame(now){
  const d=Math.min(0.05,(now-last)/1000);last=now;racingState();
  if(race){
    const run=(MODE==='race'&&!paused)||(race.attract&&(MODE==='title'||MODE==='menu'));
    if(run){
      readInputs();acc+=d*(race.slowT>0?race.slowK:1);
      while(acc>=TUNING.dt){updateRace(TUNING.dt);acc-=TUNING.dt;if(!race||race.done)break}
      if(race){updateParticles(d);
        if(!race.attract){hoofT-=d;const p=race.players[0];if(p&&p.v>1&&hoofT<=0){SFX.hoof(p.v,p.horses.length);hoofT=clamp(2.2/p.v,0.09,0.4)}SFX.ambient(race)}
        if(race.attract&&race.done)startAttract();
      }
    }else acc=0;
  }
  if(race)drawWorld();else{cx.setTransform(1,0,0,1,0,0);cx.fillStyle='#2b2015';cx.fillRect(0,0,VW,VH)}
  requestAnimationFrame(frame);
}
titleScreen();
requestAnimationFrame(frame);

/* ganchos de prueba (no afectan al juego) */
window.__cq={TUNING,CODEX,QUIZ,get race(){return race},get G(){return G},set G(v){G=v},get MODE(){return MODE},setupRace,makeHorse,makeCar,stepCar,setSeed,
  ff(auto=true,secs=900){const r=race;if(!r)return 'no race';if(auto)for(const p of r.players)if(!p.ai)p.ai=makeAI(0.85,{startR:10,R:12});let t=0;while(race===r&&!r.done&&t<secs){updateRace(TUNING.dt);t+=TUNING.dt}return {done:r.done,t,mode:MODE}},
  /* una carrera de la clase de veinte minutos con el jugador en piloto automático y una estrategia; para medir el equilibrio */
  simCamp(i,strat,seed,o={}){
    const C=CAMP[i];setSeed(seed);const T=TUNING.tiros[C.tiro];const horses=[];for(let k=0;k<T.n;k++)horses.push(makeHorse(C.level+1,{rival:true,age:7}));
    let ended=null;const alliance=C.circuit==='maximo'?[['P','R'],['V','A']]:null;
    setupRace({circuit:C.circuit,tiro:C.tiro,laps:C.laps,nPerFac:C.nPer,level:C.level,skill:C.skill,type:'campana',alliance,rivalSparsor:C.circuit==='maximo',
      humans:[{pl:1,fac:'V',name:'bot',tiro:C.tiro,horses,guide:C.tiro==='cuadriga'?1:0,pericia:55,staff:o.staff||(C.circuit==='maximo'?{sparsor:true}:{}),auto:true}],onEnd:r=>{ended=r}});
    const r=race,p=r.players[0];p.ai=makeAI(strat.skill||0.7,{startR:strat.R||11,R:strat.R||11});p.ai.strat=strat;p.ai.aggr=0.3;
    let t=0,minSt=1,taps=0,lw=0;while(!ended&&t<400){updateRace(TUNING.dt);t+=TUNING.dt;const a=p.horses.reduce((s,h)=>s+h.st,0)/p.horses.length;minSt=Math.min(minSt,a);if(p.inp.w&&!lw)taps++;lw=p.inp.w}
    const pos=p.finished?r.order.indexOf(p)+1:0;race=null;
    return {pos,n:r.cars.length,t:p.finished?+(p.finishT-r.goT).toFixed(1):null,crash:p.crashed?(p.why||'x'):'',minSt:+minSt.toFixed(2),taps,bolt:0};
  },
  simulate(o){
    const T=TUNING.tiros[o.tiro];const hs=[];for(let i=0;i<T.n;i++)hs.push(makeHorse(o.level||3,{rival:true}));
    let ended=null;
    setupRace({circuit:o.circuit||'tarraco',tiro:o.tiro,laps:o.laps||2,nPerFac:o.nPerFac||1,level:o.level||3,skill:o.skill||0.62,alliance:o.alliance||null,
      humans:[{pl:1,fac:'V',name:'auto',tiro:o.tiro,horses:hs,guide:o.tiro==='cuadriga'?1:0,pericia:60,auto:true,staff:o.staff||{}}],onEnd:r=>{ended=r}});
    const r=race;let t=0;const laps=[];let prev=0;
    while(!ended&&t<(o.secs||600)){updateRace(TUNING.dt);t+=TUNING.dt;const p=r.players[0];if(p.lapsDone>prev){laps.push(+r.t.toFixed(1));prev=p.lapsDone}}
    return {ended:!!ended,laps,cars:r.cars.map(c=>({fac:c.fac,pl:c.pl,fin:c.finished,t:c.finished?+(c.finishT-r.goT).toFixed(1):null,crash:c.crashed,why:c.why||''}))};
  }};
