<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<meta name="copyright" content="© Diseñado y Creado por Alejandro Leiva Arcas">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>Taurocatapsia</title>
<style>
:root{--cal:#f3e8cf;--ocre:#b4472b;--ocreD:#86301b;--azul:#2c6a96;--azulD:#1d3c58;--amar:#dca23a;--negro:#231a14;--serif:"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#2a1d14;overflow:hidden;font-family:var(--serif);color:var(--negro);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#st{position:fixed;pointer-events:none}
#st > *{pointer-events:auto}
button{font-family:var(--serif);cursor:pointer;-webkit-appearance:none;appearance:none}
.btn{min-height:44px;padding:8px 18px;border-radius:8px;border:2px solid var(--negro);background:var(--cal);color:var(--negro);font-size:16px;font-weight:600;box-shadow:0 3px 0 var(--negro);letter-spacing:.02em}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--negro)}
.btn.pri{background:var(--ocre);color:#fff8ea}
.btn.az{background:var(--azul);color:#fff8ea}
.btn[disabled]{opacity:.45;pointer-events:none}
.top{position:absolute;left:1.4%;right:1.4%;top:5.2%;display:flex;gap:8px;align-items:center;pointer-events:none}
.top > *{pointer-events:auto}
.top .sp{flex:1}
.chip{min-height:44px;min-width:44px;padding:0 12px;border-radius:22px;border:2px solid var(--negro);background:rgba(243,232,207,.92);font-size:15px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.chip.on{background:var(--negro);color:var(--cal)}
/* marcas de las estancias */
.spot{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;opacity:.92;border-radius:50%;border:2.5px solid var(--negro);background:radial-gradient(circle,#fff8ea 0 28%,var(--ocre) 29% 52%,#fff8ea 53% 60%,var(--azul) 61%);box-shadow:0 0 0 0 rgba(220,162,58,.8);animation:pulse 1.8s infinite;font-size:0}
.spot b{position:absolute;right:-10px;top:-10px;min-width:22px;height:22px;border-radius:11px;background:var(--negro);color:var(--cal);font:700 13px/22px var(--serif);text-align:center;padding:0 4px}
.spot.seen{animation:none;background:radial-gradient(circle,#fff8ea 0 30%,#8a7a5c 31% 58%,#fff8ea 59%)}
.spot.seen b{background:var(--azul)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(220,162,58,.85)}70%{box-shadow:0 0 0 16px rgba(220,162,58,0)}100%{box-shadow:0 0 0 0 rgba(220,162,58,0)}}
/* barra inferior de la estancia */
.bar{position:absolute;left:0;right:0;bottom:6.4%;display:flex;align-items:center;gap:12px;padding:0 1.6%;pointer-events:none}
.bar > *{pointer-events:auto}
.bar .tt{background:rgba(243,232,207,.95);border:2px solid var(--negro);border-radius:10px;padding:6px 14px;min-width:0;flex:1;box-shadow:0 3px 0 var(--negro)}
.bar .tt b{display:block;font-size:19px;color:var(--ocreD);font-variant:small-caps;letter-spacing:.04em;line-height:1.1}
.bar .tt small{display:block;font-size:13px;opacity:.85}
.dots{display:flex;gap:5px;margin-top:3px}.dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--negro);background:transparent}.dots i.ok{background:var(--negro)}.dots i.now{background:var(--amar)}
.rinfo{min-width:0;flex:0 1 auto;max-width:46%;background:rgba(243,232,207,.95);border:2px solid var(--negro);border-radius:10px;padding:5px 12px;box-shadow:0 3px 0 var(--negro);display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;overflow:hidden}
.rinfo b{font-size:18px;color:var(--ocreD);font-variant:small-caps;letter-spacing:.04em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.rinfo small{flex-basis:100%;font-size:12.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rinfo .dots{margin:0}
.top .nx{flex:0 0 auto}
/* tarjetas */
.veil{position:absolute;inset:0;background:rgba(35,26,20,.35);display:flex;align-items:center;justify-content:center;padding:6.5% 3% 8%}
.card{position:relative;background:#f6ecd6;border:3px solid var(--negro);border-radius:12px;box-shadow:0 6px 0 var(--negro),0 18px 40px rgba(0,0,0,.35);width:min(620px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.card::before{content:"";display:block;height:14px;flex:0 0 14px;background:repeating-linear-gradient(90deg,var(--amar) 0 18px,var(--negro) 18px 20px,var(--amar) 20px 26px,var(--ocre) 26px 34px);border-bottom:2px solid var(--negro)}
.card .in{padding:12px 20px 4px;overflow:auto;-webkit-overflow-scrolling:touch}
.card h2{margin:0 0 2px;font-size:22px;color:var(--ocreD);font-variant:small-caps;letter-spacing:.03em;line-height:1.15}
.card .sub{font-size:13px;opacity:.8;margin-bottom:6px}
.card p{margin:6px 0;font-size:16px;line-height:1.42}
.card .act{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;padding:8px 20px 14px}
.card.side{width:min(560px,58%)}
.card.wide{width:min(980px,100%)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card p.sm{font-size:14px;line-height:1.35;margin:2px 0 6px}
.opt small{font-size:12.5px;opacity:.85}
.card p.cr{font-size:14px;line-height:1.4}
.opts{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.opt{min-height:46px;text-align:left;padding:8px 14px;border-radius:8px;border:2px solid var(--negro);background:#fffaf0;font-size:16px;line-height:1.25;display:flex;gap:10px;align-items:center}
.opt i{font-style:normal;font-weight:700;width:24px;height:24px;flex:0 0 24px;border-radius:50%;border:2px solid var(--negro);display:flex;align-items:center;justify-content:center;font-size:14px}
.opt.ok{background:#d9e8f3;border-color:var(--azulD)}.opt.ok i{background:var(--azul);color:#fff;border-color:var(--azulD)}
.opt.no{background:#f8dcc6;border-color:var(--ocreD)}.opt.no i{background:var(--ocre);color:#fff}
.opt.chk.on{background:#efe0b8}
.fb{font-size:15px;line-height:1.4;padding:8px 12px;border-radius:8px;border:2px dashed var(--negro);margin:6px 0}
.ficha{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 14px;border-radius:21px;border:2px solid var(--azulD);background:var(--azul);color:#fff;font:600 14px var(--serif);margin:6px 0 2px}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--azulD);margin-bottom:2px}
/* portada */
.title{position:absolute;left:0;right:0;top:13%;text-align:center;pointer-events:none}
.title h1{margin:0;font-size:calc(var(--s,1)*70px);letter-spacing:.14em;color:#fff3d6;text-shadow:0 3px 0 var(--negro),0 0 18px rgba(0,0,0,.35);font-weight:700}
.title p{margin:4px 0 0;font-size:calc(var(--s,1)*22px);color:#fff3d6;text-shadow:0 2px 0 var(--negro);font-style:italic}
.menu{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);display:flex;gap:12px;flex-wrap:wrap;justify-content:center;width:92%}
.menu .btn{font-size:18px;padding:10px 22px}
/* arena */
.hud{position:absolute;left:1.6%;right:1.6%;top:5.4%;display:flex;gap:8px;align-items:flex-start;pointer-events:none}
.hud > *{pointer-events:auto}
.pane{background:rgba(243,232,207,.94);border:2px solid var(--negro);border-radius:10px;padding:5px 12px;font-size:15px;line-height:1.2;box-shadow:0 3px 0 var(--negro)}
.pane b{color:var(--ocreD)}
.hint{position:absolute;left:50%;top:22%;transform:translateX(-50%);background:var(--negro);color:var(--cal);padding:8px 16px;border-radius:22px;font-size:17px;pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .3s}
.hint.on{opacity:1}
.big{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%) scale(.6);font-size:calc(var(--s,1)*58px);font-weight:700;letter-spacing:.06em;color:#fff3d6;text-shadow:0 3px 0 var(--negro),0 0 14px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:transform .25s cubic-bezier(.3,1.6,.5,1),opacity .2s;white-space:nowrap}
.big.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.grades{display:flex;gap:10px;margin:6px 0}
.grades span{flex:1;border:2px solid var(--negro);border-radius:8px;padding:6px;text-align:center;font-size:14px;background:#fffaf0}
.grades span b{display:block;font-size:22px;line-height:1}
.ros{font-size:30px;letter-spacing:6px}
.rot{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#2a1d14;color:#f3e8cf;font-size:20px;text-align:center;padding:24px}
.rot b{font-size:56px;display:block;animation:rr 2.2s ease-in-out infinite}
@keyframes rr{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-width:900px){.rot{display:flex}}
.toast{position:absolute;left:50%;top:15%;transform:translate(-50%,-12px);opacity:0;background:var(--amar);color:var(--negro);border:2px solid var(--negro);padding:6px 16px;border-radius:20px;font-weight:700;transition:all .25s;pointer-events:none;z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0)}
.copy{position:fixed;right:max(8px,env(safe-area-inset-right));bottom:max(4px,env(safe-area-inset-bottom));font:11px system-ui,sans-serif;color:rgba(243,232,207,.75);pointer-events:none;z-index:60}
@media (max-height:430px){
  .card p{font-size:14.5px;line-height:1.36;margin:4px 0}.card h2{font-size:19px}.card .in{padding:8px 16px 2px}.card .act{padding:6px 16px 10px}
  .opt{min-height:40px;font-size:14.5px;padding:6px 10px}.opts{gap:6px}
  .bar .tt b{font-size:16px}.bar .tt small{font-size:12px}.btn{font-size:15px;padding:6px 14px}
  .spot{width:38px;height:38px;margin:-19px 0 0 -19px}
  .rinfo small{display:none}.rinfo{padding:4px 10px}.rinfo b{font-size:15px}
  .veil{padding:5.6% 2% 6.5%}
  .card.wide .sm,.card .nota{display:none}.card.wide .opts{margin:4px 0;gap:5px}.card.wide h2{margin-bottom:4px}.card.wide .opt{min-height:44px}
}
@media (prefers-reduced-motion:reduce){.spot{animation:none}.big{transition:none}}

.chip{white-space:nowrap}
.opts.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-height:430px){.card.epi p{font-size:13.6px;line-height:1.32;margin:3px 0}.opts.g2 .opt{min-height:42px;font-size:14px}.card h2[style]{font-size:16px!important}}
</style>
</head>
<body>
<canvas id="cv" aria-label="Taurocatapsia"></canvas>
<div id="st"></div>
<div class="rot" id="rot"><b>📱</b><span id="rotT">Gira el dispositivo para jugar</span></div>
<script>
/* Taurocatapsia · contenido. Todo procede del texto de pantalla de las fichas H3·01 a H3·17 del Tema 3 (Historiapp, tema03.json).
   En las preguntas, la primera opción es la correcta; el juego las baraja. */
const ROOMS = [
 { id:'entrada', scene:'entrada',
   t:{es:'La llegada a Cnoso',en:'Arriving at Knossos'},
   sub:{es:'Creta, hacia 1950-1375 a. C.',en:'Crete, c. 1950–1375 BC'},
   spots:[
    {x:300,y:250,ficha:['introduccion-historica','H3·03'],
     t:{es:'Un nombre puesto por un arqueólogo',en:'A name given by an archaeologist'},
     p:{es:['La cultura minoica debe su nombre a Arthur Evans, el arqueólogo británico que excavó el palacio de Cnoso desde 1900 y la bautizó a partir del mito griego del rey Minos.','Su civilización floreció en la Edad del Bronce, hacia 1950-1450 a. C.'],
        en:['Minoan culture owes its name to Arthur Evans, the British archaeologist who excavated the palace of Knossos from 1900 and named it after the Greek myth of King Minos.','The civilisation flourished in the Bronze Age, c. 1950–1450 BC.']}},
    {x:760,y:300,ficha:['introduccion-historica','H3·03'],
     t:{es:'Palacios sin murallas',en:'Palaces without walls'},
     p:{es:['Creta es una isla montañosa entre Grecia, Egipto y Asia Menor. Su relieve fragmentado la protegía y permitió que convivieran varios palacios, como Cnoso, Festo o Malia.','Los palacios se organizan en torno a un gran patio central y carecen de murallas. Evans imaginó una «Pax Minoica», hipótesis que hoy debe matizarse: las primeras armas del Egeo son cretenses y había preparación para la guerra.'],
        en:['Crete is a mountainous island between Greece, Egypt and Asia Minor. Its broken relief protected it and allowed several palaces to coexist, such as Knossos, Phaistos or Malia.','The palaces are arranged around a great central court and have no walls. Evans imagined a «Pax Minoica», a view that must now be qualified: the earliest weapons of the Aegean are Cretan and there was preparation for war.']}},
    {x:1040,y:470,ficha:['introduccion-historica','H3·03'],
     t:{es:'Tres escrituras y un silencio deportivo',en:'Three scripts and a sporting silence'},
     p:{es:['En Creta se usaron el jeroglífico cretense y el lineal A, que siguen sin descifrar, y el lineal B, que es griego micénico y se empleó sobre todo para la contabilidad del palacio.','Ninguna de las tres ha dejado un solo texto sobre deporte.'],
        en:['Crete used Cretan hieroglyphic and Linear A, both still undeciphered, and Linear B, which is Mycenaean Greek and served mainly for palace accounting.','None of the three has left a single text about sport.']}}
   ],
   qs:[
    {q:{es:'¿De dónde viene el nombre de «cultura minoica»?',en:'Where does the name «Minoan culture» come from?'},
     o:{es:['De Arthur Evans, que la bautizó por el mito del rey Minos','Del nombre que los cretenses daban a su isla','De una inscripción en lineal B'],
        en:['From Arthur Evans, who named it after the myth of King Minos','From the name the Cretans gave their island','From an inscription in Linear B']}},
    {q:{es:'¿Por qué hay que matizar la «Pax Minoica» de Evans?',en:'Why must Evans\'s «Pax Minoica» be qualified?'},
     o:{es:['Las primeras armas del Egeo son cretenses y había preparación para la guerra','Los palacios tenían grandes murallas','Creta vivía en guerra permanente con Egipto'],
        en:['The earliest Aegean weapons are Cretan and there was preparation for war','The palaces had great walls','Crete was permanently at war with Egypt']}}
   ]},
 { id:'almacenes', scene:'procesion',
   t:{es:'El corredor de la Procesión',en:'The Corridor of the Procession'},
   sub:{es:'Sociedad, poder y economía',en:'Society, power and economy'},
   spots:[
    {x:330,y:400,ficha:['sociedad-poder-y-economia','H3·04'],
     t:{es:'Lo que administraba el palacio',en:'What the palace managed'},
     p:{es:['El palacio almacenaba y administraba parte de los excedentes agrícolas, con los que sostenía a quienes dependían de él.','Hoy se descarta que repartiera toda la producción de la isla o controlara todo su comercio.'],
        en:['The palace stored and managed part of the agricultural surplus, with which it supported those who depended on it.','It is now ruled out that it redistributed all the island\'s produce or controlled all its trade.']}},
    {x:690,y:200,ficha:['sociedad-poder-y-economia','H3·04'],
     t:{es:'Palacio y templo a la vez',en:'Palace and temple at once'},
     p:{es:['Creta no levantó templos monumentales, de ahí que el palacio fuera también el centro religioso de la comunidad, además de residencia y almacén.','Hacia 1950 a. C. surgió una nueva clase dirigente, que se reconoce en el paso de los enterramientos colectivos a los individuales.'],
        en:['Crete raised no monumental temples, so the palace was also the religious centre of the community, as well as a residence and a store.','Around 1950 BC a new ruling class emerged, recognisable in the shift from collective to individual burials.']}},
    {x:1010,y:330,ficha:['sociedad-poder-y-economia','H3·04'],
     t:{es:'¿Hubo reyes?',en:'Were there kings?'},
     p:{es:['Se discute si en Creta existieron reyes absolutos como los de Egipto o Mesopotamia: apenas se conservan representaciones regias.','El arte recoge, en cambio, escenas de una élite refinada. El deporte pudo ser una forma más de exhibir su prestigio, siempre unido al rito.'],
        en:['It is debated whether Crete had absolute kings like those of Egypt or Mesopotamia: hardly any royal images survive.','Art shows instead the scenes of a refined elite. Sport may have been one more way of displaying its prestige, always bound to ritual.']}}
   ],
   qs:[
    {q:{es:'¿Qué era el palacio minoico, además de residencia?',en:'Besides a residence, what was the Minoan palace?'},
     o:{es:['Almacén y centro religioso de la comunidad','Una fortaleza militar amurallada','Un mercado sin funciones religiosas'],
        en:['A store and the religious centre of the community','A walled military fortress','A market with no religious role']}},
    {q:{es:'¿Qué cambio delata, hacia 1950 a. C., una nueva clase dirigente?',en:'What change reveals a new ruling class around 1950 BC?'},
     o:{es:['El paso de los enterramientos colectivos a los individuales','La construcción de murallas en los palacios','La aparición de la moneda'],
        en:['The shift from collective to individual burials','The building of walls around the palaces','The appearance of coinage']}}
   ]},
 { id:'damas', scene:'damas',
   t:{es:'El corredor de las damas',en:'The corridor of the ladies'},
   sub:{es:'La mujer minoica, hacia 1750-1450 a. C.',en:'Minoan women, c. 1750–1450 BC'},
   spots:[
    {x:340,y:300,ficha:['la-mujer-minoica','H3·05'],
     t:{es:'Leer los colores de la pintura',en:'Reading the colours of the painting'},
     p:{es:['Para reconocer a las mujeres hay que leer los códigos de esta pintura. El más evidente es el color de la piel, una convención heredada de Egipto que pinta en blanco a la mujer y en rojo al varón.'],
        en:['To recognise women we must read the codes of this painting. The most obvious is skin colour, a convention inherited from Egypt that paints women white and men red.']}},
    {x:700,y:250,ficha:['la-mujer-minoica','H3·05'],
     t:{es:'Mujeres a la vista de todos',en:'Women in public view'},
     p:{es:['En la pintura minoica las mujeres aparecen con una visibilidad y participación públicas notables, algo que no sucedió en las ciudades griegas posteriores (con excepción, quizá, de Esparta).','Como espectadoras, disfrutan de actividades públicas junto a los varones e incluso ocupan lugares de honor. Las principales divinidades minoicas eran femeninas.'],
        en:['In Minoan painting women appear with a remarkable public visibility and participation, something that did not happen in the later Greek cities (except, perhaps, Sparta).','As spectators they enjoy public events alongside men and even occupy places of honour. The main Minoan deities were female.']}},
    {x:1020,y:420,ficha:['la-mujer-minoica','H3·05'],
     t:{es:'La danza de la arboleda sagrada',en:'The dance in the sacred grove'},
     p:{es:['Hacia 1600 a. C. las mujeres bailan ante una multitud en la danza de la arboleda sagrada, un acto que los estudios vinculan al culto a la naturaleza, concebida como divinidad femenina, y a los ritos de iniciación.'],
        en:['Around 1600 BC women dance before a crowd in the dance in the sacred grove, an act that scholars link to the cult of nature, conceived as a female deity, and to initiation rites.']}}
   ],
   qs:[
    {q:{es:'En la pintura minoica, ¿qué distingue a la mujer del varón?',en:'In Minoan painting, what distinguishes women from men?'},
     o:{es:['La piel blanca, una convención heredada de Egipto','El pelo corto','Que siempre aparece sentada'],
        en:['White skin, a convention inherited from Egypt','Short hair','That she always appears seated']}},
    {q:{es:'¿Dónde se concentra el protagonismo femenino en el arte minoico?',en:'Where is female prominence concentrated in Minoan art?'},
     o:{es:['En el espectáculo y en el culto','En la guerra y la caza','En el comercio marítimo'],
        en:['In spectacle and cult','In war and hunting','In maritime trade']}}
   ]},
 { id:'frescos', scene:'frescos',
   t:{es:'La sala de las imágenes',en:'The hall of images'},
   sub:{es:'Actividades físico-deportivas de los cretenses',en:'Physical and sporting activities of the Cretans'},
   spots:[
    {x:250,y:270,ficha:['actividades-fisico-deportivas-de-los-cre','H3·06'],
     t:{es:'Lo que dicen las imágenes',en:'What the images tell'},
     p:{es:['Todo lo que sabemos del deporte minoico procede de imágenes. Se conocen unos cien objetos con escenas deportivas (frescos, vasos de piedra y sellos) de hacia 1750-1450 a. C.','Casi todos representan el salto del toro; entre un 10 y un 20 % muestran combates sin armas.'],
        en:['All we know of Minoan sport comes from images. Some hundred objects with sporting scenes are known (frescoes, stone vessels and seals) from c. 1750–1450 BC.','Almost all show bull-leaping; between 10 and 20 % show unarmed combat.']}},
    {x:640,y:300,ficha:['pugilato','H3·08'],
     t:{es:'Los niños púgiles de Akrotiri',en:'The boxing boys of Akrotiri'},
     p:{es:['En Akrotiri (Tera), sepultada por el volcán a finales del siglo XVII a. C., dos niños de entre seis y diez años boxean con un solo guante en la mano derecha.','El vencedor lleva collar, pulseras y pendientes, y su rival viste con sencillez: el juego marcaba ya la jerarquía entre los hijos de la élite.'],
        en:['At Akrotiri (Thera), buried by the volcano at the end of the 17th century BC, two boys aged six to ten box with a single glove on the right hand.','The winner wears a necklace, bracelets and earrings, while his rival is plainly dressed: the game already marked rank among the children of the elite.']}},
    {x:1030,y:300,ficha:['el-riton-de-los-boxeadores','H3·09'],

const PAL = { cal:'#efe2c4', ocre:'#b4472b', ocreD:'#86301b', azul:'#2c6a96', azulD:'#1d3c58', amar:'#dca23a', negro:'#231a14', blanco:'#f8f1df' };
function rng(seed){ let s = seed >>> 0 || 1; return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return ((s >>> 0) % 100000) / 100000; }; }

/* ---------- carga de imágenes bajo demanda ---------- */
const IMGDIR = 'toro/';
const IMG = {};
function img(name){
  if (!IMG[name]){ const i = new Image(); i.decoding = 'async'; i.onload = () => { i.ok = true; }; i.src = IMGDIR + name + '.webp'; IMG[name] = i; }
  return IMG[name];
}
const ready = (...n) => n.every(k => img(k).ok);

/* ---------- enlucido ---------- */
let PLASTER = null;
function plaster(){
  if (PLASTER) return PLASTER;
  const w = 640, h = 360, c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
  g.fillStyle = '#ece0c6'; g.fillRect(0, 0, w, h);
  const im = g.getImageData(0, 0, w, h), d = im.data, R = rng(7);
  for (let i = 0; i < d.length; i += 4){ const n = (R() - .5)*16; d[i] += n; d[i+1] += n; d[i+2] += n*.8; }
  g.putImageData(im, 0, 0);
  for (let k = 0; k < 30; k++){ const x = R()*w, y = R()*h, r = 20 + R()*90, gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, `rgba(${R() < .5 ? '120,95,60' : '255,250,238'},${.05 + R()*.05})`); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(x - r, y - r, 2*r, 2*r); }
  g.strokeStyle = 'rgba(80,55,30,.18)'; g.lineWidth = .8;
  for (let k = 0; k < 14; k++){ let x = R()*w, y = R()*h, a = R()*6.28; g.beginPath(); g.moveTo(x, y); for (let i = 0; i < 8; i++){ a += (R() - .5)*1.1; x += Math.cos(a)*10; y += Math.sin(a)*10; g.lineTo(x, y); } g.stroke(); }
  return (PLASTER = c);
}
/* banda del propio fresco de Cnoso (piedras pintadas entre filetes), repetida a lo ancho */
function band(g, y, h, flip){
  const b = img('banda'); if (!b.ok){ g.fillStyle = '#8a6a48'; g.fillRect(0, y, 1280, h); return; }
  const w = b.naturalWidth*h/b.naturalHeight; g.save(); if (flip){ g.translate(0, 2*y + h); g.scale(1, -1); }
  for (let x = 0; x < 1280; x += w - 1) g.drawImage(b, x, y, w, h); g.restore();

/* lámina enmarcada: la imagen ajustada dentro de la caja, con paspartú y sombra */
function panel(g, name, box, cap){
  const i = img(name); let [x, y, w, h] = box;
  const capH = cap ? 30 : 0; h -= capH;
  let iw = w, ih = h;
  if (i.ok){ const r = i.naturalWidth/i.naturalHeight; if (w/h > r){ iw = h*r; } else { ih = w/r; } }
  const ix = x + (w - iw)/2, iy = y + (h - ih)/2;
  g.save(); g.shadowColor = 'rgba(30,18,8,.45)'; g.shadowBlur = 18; g.shadowOffsetY = 6;
  g.fillStyle = '#f7efdc'; g.fillRect(ix - 9, iy - 9, iw + 18, ih + 18); g.restore();
  g.strokeStyle = PAL.negro; g.lineWidth = 2; g.strokeRect(ix - 9, iy - 9, iw + 18, ih + 18);
  g.strokeStyle = PAL.ocre; g.lineWidth = 1.5; g.strokeRect(ix - 4, iy - 4, iw + 8, ih + 8);
  if (i.ok) g.drawImage(i, ix, iy, iw, ih); else { g.fillStyle = '#d9cbb0'; g.fillRect(ix, iy, iw, ih); }
  if (cap){ g.fillStyle = 'rgba(35,26,20,.9)'; g.font = 'italic 18px "Palatino Linotype",Palatino,Georgia,serif'; g.textAlign = 'center'; g.textBaseline = 'top';
    let t = cap; const mw = Math.max(w, iw + 40); while (g.measureText(t).width > mw && t.length > 10) t = t.slice(0, -2); if (t !== cap) t += '…'; g.fillText(t, ix + iw/2, iy + ih + 13); }
  return [ix, iy, iw, ih];
}

function rosette(g, x, y, r, petal, core){
  g.save(); g.translate(x, y);
  for (let i = 0; i < 8; i++){ g.rotate(Math.PI/4); g.beginPath(); g.ellipse(0, -r*.55, r*.22, r*.5, 0, 0, 6.283); g.fillStyle = petal || PAL.ocre; g.fill(); g.strokeStyle = PAL.negro; g.lineWidth = 1.2; g.stroke(); }

const ease = t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2)/2;

}
function finale(){
  if (!S.done){ S.done = true; S.epi = true; save(); if (!S.xpF.fin){ S.xpF.fin = 1; HIST.xp(100); } }
  clearUI(); SCN = 'titulo'; MODE = 'title'; topBar();
  const tot = S.fiestas.reduce((a, b) => a + b, 0);
  const v = card(`<div class="in"><h2>${t('fin')}</h2><p>${t('fin2')}</p><div class="ros">${'✿'.repeat(tot)}<span style="opacity:.25">${'✿'.repeat(9 - tot)}</span></div><p>${t('aclam')}: <b>${S.best}</b></p></div>
    <div class="act">${HIST.inside ? `<button class="btn" data-h>${t('volver')}</button>` : ''}<button class="btn az" data-f>${t('libre')}</button><button class="btn pri" data-t>${t('menu')}</button></div>`);
  const h = v.querySelector('[data-h]'); if (h) h.onclick = () => HIST.back();
  v.querySelector('[data-f]').onclick = () => arenaSetup(); v.querySelector('[data-t]').onclick = () => showTitle();
}

/* ---------- entrada ---------- */
cv.addEventListener('pointerdown', e => { if (MODE === 'arena'){ e.preventDefault(); au(); tapArena(); } });
st.addEventListener('pointerdown', e => { if (MODE === 'arena' && (e.target === st || e.target.classList.contains('hud'))){ au(); tapArena(); } });
addEventListener('keydown', e => { if (MODE === 'arena' && (e.code === 'Space' || e.code === 'Enter')){ e.preventDefault(); au(); tapArena(); } });
document.addEventListener('gesturestart', e => e.preventDefault());

resize(); showTitle(); requestAnimationFrame(t0 => { last = t0; requestAnimationFrame(frame); });
window.TORO = { get A(){ return A; }, S:() => S, enterRoom, arenaSetup, startFiesta, showEpilogue, tapArena };
})();
