án de Tera»","en":"When? “Eruption of the Thera volcano”"},"o":[{"es":"h. 1628 a. C.","en":"c. 1628 BC"},{"es":"h. 1600 a. C.","en":"c. 1600 BC"},{"es":"finales del siglo XVII a. C.","en":"late 17th century BC"},{"es":"h. 1550-1500 a. C.","en":"c. 1550-1500 BC"}],"x":{"es":"Durante décadas se explicó con ella el fin de la Creta minoica. Hoy sabemos que fue unos ciento cincuenta años anterior al final de los palacios y que, si bien cubrió de ceniza el este de la isla, Creta se rehízo.","en":"For decades it was used to explain the end of Minoan Crete. Today we know it came some 150 years before the end of the palaces and that, although it covered the east of the island with ash, Crete recovered."},"s":"T3 · línea del tiempo"},{"id":"fec-ege-akrotiri","k":"cro","f":"C","t":3,"q":{"es":"¿Cuándo? «Fresco de los niños púgiles de Akrotiri»","en":"When? “Boxing Boys fresco of Akrotiri”"},"o":[{"es":"finales del siglo XVII a. C.","en":"late 17th century BC"},{"es":"h. 1628 a. C.","en":"c. 1628 BC"},{"es":"h. 1550-1500 a. C.","en":"c. 1550-1500 BC"},{"es":"h. 1600 a. C.","en":"c. 1600 BC"}],"x":{"es":"Dos niños de entre seis y diez años boxean con un solo guante, en una de las escenas deportivas más antiguas del Egeo. El vencedor lleva collar, pulseras y pendientes y su rival viste con sencillez, de modo que el juego marcaba ya la jerarquía entre los hijos de la élite.","en":"Two boys aged six to ten box with a single glove, in one of the oldest sporting scenes of the Aegean. The winner wears a necklace, bracelets and earrings and his opponent is simply dressed, so the game already marked the hierarchy among the children of the elite."},"s":"T3 · línea del tiempo"},{"id":"fec-ege-riton","k":"cro","f":"C","t":3,"q":{"es":"¿Cuándo? «Ritón de los boxeadores de Hagia Triada»","en":"When? “Boxer Rhyton of Hagia Triada”"},"o":[{"es":"h. 1550-1500 a. C.","en":"c. 1550-1500 BC"},{"es":"h. 1628 a. C.","en":"c. 1628 BC"},{"es":"finales del siglo XVII a. C.","en":"late 17th century BC"},{"es":"h. 1600 a. C.","en":"c. 1600 BC"}],"x":{"es":"Vaso de piedra de unos 46 cm para las libaciones, con cuatro bandas en relieve de púgiles adultos y del salto del toro. Su equipo cambia de una banda a otra, señal de un entrenamiento sistemático con reglas.","en":"Stone vessel about 46 cm high for libations, with four relief bands of adult boxers and bull-leaping. Their equipment changes from band to band, a sign of systematic rule-based training."},"s":"T3 · línea del tiempo"},{"id":"fec-ege-cnoso","k":"cro","f":"C","t":3,"q":{"es":"¿Cuándo? «Los micénicos toman Cnoso»","en":"When? “The Mycenaeans take Knossos”"},"o":[{"es":"h. 1450 a. C.","en":"c. 1450 BC"},{"es":"h. 1600 a. C.","en":"c. 1600 BC"},{"es":"h. 1628 a. C.","en":"c. 1628 BC"},{"es":"h. 1375 a. C.","en":"c. 1375 BC"}],"x":{"es":"Ardieron casi todos los palacios de Creta salvo el de Cnoso, que pasó a manos de los micénicos. Durante unos setenta y cinco años fue el único palacio de la isla, y la taurocatapsia siguió bajo dominio micénico.","en":"Almost all the palaces of Crete burned except Knossos, which passed to the Mycenaeans. For some seventy-five years it was the island's only palace, and bull-leaping continued under Mycenaean rule."},"s":"T3 · línea del tiempo"},{"id":"fec-ege-fincnoso","k":"cro","f":"C","t":3,"q":{"es":"¿Cuándo? «Arde el palacio de Cnoso»","en":"When? “The palace of Knossos burns”"},"o":[{"es":"h. 1375 a. C.","en":"c. 1375 BC"},{"es":"h. 1450 a. C.","en":"c. 1450 BC"},{"es":"h. 1550-1500 a. C.","en":"c. 1550-1500 BC"},{"es":"1200-1150 a. C.","en":"1200-1150 BC"}],"x":{"es":"Con él terminó la Creta de los palacios. El salto del toro continuó, no obstante, en la Grecia continental hasta la caída de los palacios micénicos.","en":"With it palatial Crete came to an end. Bull-leaping nevertheless continued in mainland Greece until the fall of the Mycenaean palaces."},"s":"T3 · línea del tiempo"},{"id":"fec-ege-colapso","k":"cro","f":"C","t":3,"q":{"es":"¿Cuándo? «Arden los palacios micénicos»","en":"When? “The Mycenaean palaces burn”"},"o":[{"es":"1200-1150 a. C.","en":"1200-1150 BC"},{"es":"h. 1375 a. C.","en":"c. 1375 BC"},{"es":"h. 1450 a. C.","en":"c. 1450 BC"},{"es":"h. 950 a. C.","en":"c. 950 BC"}],"x":{"es":"Cline (2015) habla de una «tormenta perfecta» de terremotos, sequía, gentes desplazadas, revueltas y ataques de los «pueblos del mar». Con la caída del palacio, Grecia se quedó cuatro siglos sin escribir y sin quien pagara los carros, la caza señorial y los púgiles a sueldo.","en":"Cline (2015) speaks of a 'perfect storm' of earthquakes, drought, displaced peoples, revolts and attacks by the 'Sea Peoples'. With the fall of the palace, Greece went four centuries without writing and without anyone to pay for chariots, lordly hunting and paid boxers."},"s":"T3 · línea del tiempo"},{"id":"fec-gre-lefkandi","k":"cro","f":"C","t":3,"q":{"es":"¿Cuándo? «Tumba del gran señor de Lefkandi»","en":"When? “Tomb of the great lord of Lefkandi”"},"o":[{"es":"h. 950 a. C.","en":"c. 950 BC"},{"es":"884 a. C. (leyenda)","en":"884 BC (legend)"},{"es":"776 a. C.","en":"776 BC"},{"es":"h. 740-725 a. C.","en":"c. 740-725 BC"}],"x":{"es":"Un gran señor fue incinerado y enterrado bajo un túmulo con sus armas y sus caballos sacrificados, como Patroclo en la Ilíada. El funeral de un jefe era la ocasión de exhibir el prestigio de la élite.","en":"A great lord was cremated and buried under a tumulus with his weapons and sacrificed horses, like Patroclus in the Iliad. A chieftain's funeral was the occasion to display the prestige of the elite."},"s":"T3 · línea del tiempo"},{"id":"fec-gre-ifito","k":"cro","f":"C","t":3,"q":{"es":"¿Cuándo? «Tregua de Ífito, según la leyenda»","en":"When? “Truce of Iphitos, according to legend”"},"o":[{"es":"884 a. C. (leyenda)","en":"884 BC (legend)"},{"es":"h. 950 a. C.","en":"c. 950 BC"},{"es":"776 a. C.","en":"776 BC"},{"es":"h. 740-725 a. C.","en":"c. 740-725 BC"}],"x":{"es":"Los autores antiguos situaban el origen del olimpismo en un pacto de tregua del rey Ífito de Élide con Esparta y Pisa. El relato procede de un autor del siglo II d. C., más de mil años posterior, y pertenece a la leyenda.","en":"Ancient authors placed the origin of the Olympic Games in a truce made by King Iphitos of Elis with Sparta and Pisa. The story comes from a second-century AD author, more than a thousand years later, and belongs to legend."},"s":"T3 · línea del tiempo"},{"id":"fec-gre-776","k":"cro","f":"C","t":3,"q":{"es":"¿Cuándo? «Corebo de Élide, primer vencedor registrado»","en":"When? “Koroibos of Elis, first recorded victor”"},"o":[{"es":"776 a. C.","en":"776 BC"},{"es":"h. 725-675 a. C.","en":"c. 725-675 BC"},{"es":"h. 700 a. C.","en":"c. 700 BC"},{"es":"884 a. C. (leyenda)","en":"884 BC (legend)"}],"x":{"es":"La lista de vencedores que escribió Hipias a partir de la tradición oral se inicia con Corebo, ganador del stádion. Es poco fiable en sus primeros siglos, y la tradición sitúa en este año los primeros Juegos.","en":"The victor list that Hippias wrote from oral tradition begins with Koroibos, winner of the stadion. It is unreliable for its first centuries, and tradition places the first Games in this year."},"s":"T3 · línea del tiempo"},{"id":"fec-gre-dipilon","k":"cro","f":"C","t":3,"q":{"es":"¿Cuándo? «Enócoe del Dipilón»","en":"When? “Dipylon oinochoe”"},"o":[{"es":"h. 740-725 a. C.","en":"c. 740-725 BC"},{"es":"h. 700 a. C.","en":"c. 700 BC"},{"es":"720 a. C.","en":"720 BC"},{"es":"h. 725-675 a. C.","en":"c. 725-675 BC"}],"x":{"es":"En el siglo VIII a. C. regresa la escritura con el alfabeto fenicio. Esta jarra de vino lleva una de las inscripciones griegas más antiguas, que la declara premio del mejor bailarín de un concurso.","en":"In the eighth century BC writing returns with the Phoenician alphabet. This wine jug bears one of the oldest Greek inscriptions, which declares it the prize for the best dancer in a contest."},"s":"T3 · línea del tiempo"},{"id":"fec-gre-orsipo","k":"cro","f":"C","t":3,"q":{"es":"¿Cuándo? «Orsipo de Mégara corre desnudo»","en":"When? “Orsippos of Megara runs naked”"},"o":[{"es":"720 a. C.","en":"720 BC"},{"es":"h. 725-675 a. C.","en":"c. 725-675 BC"},{"es":"h. 700 a. C.","en":"c. 700 BC"},{"es":"h. 740-725 a. C.","en":"c. 740-725 BC"}],"x":{"es":"Hasta entonces se competía con perizoma. El cambio tardó más de un siglo en generalizarse y se mantuvo hasta el final del olimpismo, salvo en las pruebas hípicas.","en":"Until then athletes competed in the perizoma. The change took more than a century to become general and lasted until the end of the Games, except in the equestrian events."},"s":"T3 · línea del tiempo"},{"id":"fec-gre-iliada","k":"cro","f":"C","t":3,"q":{"es":"¿Cuándo? «Se fijan los poemas homéricos»","en":"When? “The Homeric poems are fixed”"},"o":[{"es":"h. 725-675 a. C.","en":"c. 725-675 BC"},{"es":"h. 740-725 a. C.","en":"c. 740-725 BC"},{"es":"h. 700 a. C.","en":"c. 700 BC"},{"es":"720 a. C.","en":"720 BC"}],"x":{"es":"El canto 23 de la Ilíada narra los juegos fúnebres de Patroclo, ocho pruebas en las que compiten casi solo príncipes. La trama se sitúa en el siglo XIII a. C., pero retrata la sociedad de los basileis de los siglos IX y VIII a. C.","en":"Book 23 of the Iliad narrates the funeral games of Patroclus, eight events in which almost only princes compete. The plot is set in the 13th century BC, but it portrays the society of the basileis of the ninth and eighth centuries BC."},"s":"T3 · línea del tiempo"},{"id":"fec-gre-estadio","k":"cro","f":"C","t":3,"q":{"es":"¿Cuándo? «Primer estadio de Olimpia»","en":"When? “First stadium at Olympia”"},"o":[{"es":"h. 700 a. C.","en":"c. 700 BC"},{"es":"h. 725-675 a. C.","en":"c. 725-675 BC"},{"es":"h. 740-725 a. C.","en":"c. 740-725 BC"},{"es":"720 a. C.","en":"720 BC"}],"x":{"es":"El santuario de Zeus había nacido a finales del siglo XI a. C., y durante siglos recibió figurillas de animales y trípodes de bronce sin relación con el atletismo. Primero fue el rito, después la distinción de las élites y al final el certamen.","en":"The sanctuary of Zeus had been founded at the end of the 11th century BC, and for centuries it received animal figurines and bronze tripods unrelated to athletics. First came the rite, then the distinction of the elites and finally the contest."},"s":"T3 · línea del tiempo"},{"id":"fec-gre-solon","k":"cro","f":"C","t":3,"q":{"es":"¿Cuándo? «Reformas de Solón en Atenas»","en":"When? “Reforms of Solon in Athens”"},"o":[{"es":"594/593 a. C.","en":"594/593 BC"},{"es":"564 a. C.","en":"564 BC"},{"es":"h. 580 a. C.","en":"c. 580 BC"},{"es":"h. 700 a. C.","en":"c. 700 BC"}],"x":{"es":"Junto a las de Clístenes (508 a. C.), abren paso a la democracia. En la época arcaica se fijan el programa de Olimpia y el circuito panhelénico, de modo que casi todo el deporte griego se configura entonces.","en":"Together with those of Cleisthenes (508 BC), they open the way to democracy. In the Archaic period the Olympic programme and the Panhellenic circuit are fixed, so almost all Greek sport takes shape then."},"s":"T3 · línea del tiempo"},{"id":"fec-gre-hereos","k":"cro","f":"C","t":3,"q":{"es":"¿Cuándo? «Se instituyen los Juegos Hereos»","en":"When? “The Heraia are established”"},"o":[{"es":"h. 580 a. C.","en":"c. 580 BC"},{"es":"564 a. C.","en":"564 BC"},{"es":"594/593 a. C.","en":"594/593 BC"},{"es":"480 a. C.","en":"480 BC"}],"x":{"es":"Carrera de muchachas solteras en honor de Hera, de unos 160 m, en el estadio de Olimpia y en tres categorías de edad. La ganadora recibía, como los varones, una corona de olivo.","en":"Race of unmarried girls in honour of Hera, about 160 m long, in the stadium of Olympia and in three age categories. The winner received, like the men, an olive wreath."},"s":"T3 · línea del tiempo"},{"id":"fec-gre-arriquion","k":"cro","f":"C","t":3,"q":{"es":"¿Cuándo? «Arriquión, coronado muerto»","en":"When? “Arrhichion, crowned in death”"},"o":[{"es":"564 a. C.","en":"564 BC"},{"es":"h. 580 a. C.","en":"c. 580 BC"},{"es":"594/593 a. C.","en":"594/593 BC"},{"es":"480 a. C.","en":"480 BC"}],"x":{"es":"Buscaba su tercera corona seguida y murió asfixiado en la final de pancracio mientras dislocaba el pie de su rival, que se rindió. Los jueces coronaron su cadáver.","en":"He was seeking his third successive wreath and died of strangulation in the pankration final while dislocating his opponent's foot; the opponent conceded. The judges crowned his corpse."},"s":"T3 · línea del tiempo"},{"id":"fec-gre-480","k":"cro","f":"C","t":3,"q":{"es":"¿Cuándo? «Olimpiada durante la invasión de Jerjes»","en":"When? “An Olympiad during Xerxes's invasion”"},"o":[{"es":"480 a. C.","en":"480 BC"},{"es":"420 a. C.","en":"420 BC"},{"es":"564 a. C.","en":"564 BC"},{"es":"388 a. C.","en":"388 BC"}],"x":{"es":"La 75.ª Olimpiada se celebró mientras Leónidas resistía en las Termópilas. La ekecheiría no implicaba una paz general ni frenaba las guerras en toda Grecia.","en":"The 75th Olympiad was held while Leonidas held out at Thermopylae. The ekecheiria implied no general peace and did not halt wars throughout Greece."},"s":"T3 · línea del tiempo"},{"id":"fec-gre-esparta","k":"cro","f":"C","t":3,"q":{"es":"¿Cuándo? «Esparta, multada y excluida»","en":"When? “Sparta fined and excluded”"},"o":[{"es":"420 a. C.","en":"420 BC"},{"es":"396 a. C.","en":"396 BC"},{"es":"388 a. C.","en":"388 BC"},{"es":"338 a. C.","en":"338 BC"}],"x":{"es":"Durante la Guerra del Peloponeso, Élide multó a Esparta con 200.000 dracmas, 200 por soldado, por enviar tropas a Lepreo durante la tregua. Los espartanos no pagaron y fueron excluidos de esa edición.","en":"During the Peloponnesian War, Elis fined Sparta 200,000 drachmas, 200 per soldier, for sending troops to Lepreon during the truce. The Spartans did not pay and were excluded from that edition."},"s":"T3 · línea del tiempo"},{"id":"fec-gre-cinisca","k":"cro","f":"C","t":3,"q":{"es":"¿Cuándo? «Cinisca gana la cuadriga»","en":"When? “Kyniska wins the four-horse chariot race”"},"o":[{"es":"396 a. C.","en":"396 BC"},{"es":"364 a. C.","en":"364 BC"},{"es":"388 a. C.","en":"388 BC"},{"es":"420 a. C.","en":"420 BC"}],"x":{"es":"En las pruebas hípicas la corona era para el dueño de las monturas, de modo que hubo campeonas olímpicas aunque las mujeres tenían vetado el acceso a Olimpia.","en":"In the equestrian events the wreath went to the owner of the horses, so there were female Olympic champions although women were barred from Olympia."},"s":"T3 · línea del tiempo"},{"id":"fec-gre-zanes","k":"cro","f":"C","t":3,"q":{"es":"¿Cuándo? «Los primeros zanes»","en":"When? “The first Zanes”"},"o":[{"es":"388 a. C.","en":"388 BC"},{"es":"396 a. C.","en":"396 BC"},{"es":"364 a. C.","en":"364 BC"},{"es":"420 a. C.","en":"420 BC"}],"x":{"es":"Seis estatuas de Zeus pagadas con las multas a un púgil que compró a sus rivales y a los tres que aceptaron su dinero. Llevaban el nombre del infractor en el pedestal.","en":"Six statues of Zeus paid for with the fines of a boxer who bought his rivals and of the three who took his money. They bore the offender's name on the pedestal."},"s":"T3 · línea del tiempo"},{"id":"fec-gre-anolimpiada","k":"cro","f":"C","t":3,"q":{"es":"¿Cuándo? «Batalla en el Altis: la anolimpiada»","en":"When? “Battle in the Altis: the anolympiad”"},"o":[{"es":"364 a. C.","en":"364 BC"},{"es":"388 a. C.","en":"388 BC"},{"es":"396 a. C.","en":"396 BC"},{"es":"338 a. C.","en":"338 BC"}],"x":{"es":"Durante el pentatlón de la 104.ª Olimpiada, arcadios y eleos combatieron en el recinto sagrado. Al recuperar la administración, Élide registró la edición como «no-olimpiada», aunque respetó los triunfos individuales.","en":"During the pentathlon of the 104th Olympiad, Arcadians and Eleans fought in the sacred precinct. On regaining control, Elis recorded the edition as a 'non-Olympiad', although it respected the individual victories."},"s":"T3 · línea del tiempo"},{"id":"fec-gre-queronea","k":"cro","f":"C","t":3,"q":{"es":"¿Cuándo? «Batalla de Queronea»","en":"When? “Battle of Chaeronea”"},"o":[{"es":"338 a. C.","en":"338 BC"},{"es":"364 a. C.","en":"364 BC"},{"es":"396 a. C.","en":"396 BC"},{"es":"388 a. C.","en":"388 BC"}],"x":{"es":"Filipo II de Macedonia vence y termina el dominio de Atenas y Esparta. De la época clásica procede la mayoría de los testimonios sobre atletas y gimnasios, incluso sobre siglos anteriores, y hay que leerlos con cuidado.","en":"Philip II of Macedon wins and the dominance of Athens and Sparta ends. Most of the evidence on athletes and gymnasia, even about earlier centuries, comes from the Classical period and must be read with care."},"s":"T3 · línea del tiempo"},{"id":"fec-gre-corinto","k":"cro","f":"C","t":3,"q":{"es":"¿Cuándo? «Grecia queda bajo el dominio de Roma»","en":"When? “Greece falls under Roman rule”"},"o":[{"es":"146 a. C.","en":"146 BC"},{"es":"338 a. C.","en":"338 BC"},{"es":"364 a. C.","en":"364 BC"},{"es":"67 d. C.","en":"AD 67"}],"x":{"es":"Tras perder la batalla de Corinto, Grecia pasa a depender de Roma, y Olimpia de sus generales y, más tarde, de sus emperadores.","en":"After losing the battle of Corinth, Greece comes to depend on Rome, and Olympia on its generals and, later, its emperors."},"s":"T3 · línea del tiempo"},{"id":"fec-gre-neron","k":"cro","f":"C","t":3,"q":{"es":"¿Cuándo? «Nerón compite en Olimpia»","en":"When? “Nero competes at Olympia”"},"o":[{"es":"67 d. C.","en":"AD 67"},{"es":"h. 150 d. C.","en":"c. AD 150"},{"es":"146 a. C.","en":"146 BC"},{"es":"393 d. C.","en":"AD 393"}],"x":{"es":"Hizo aplazar dos años la Olimpiada, añadió el carro de diez caballos y concursos de tragedia y música, se cayó del carro y fue proclamado vencedor tras pagar a los jueces. Tras su muerte, Élide borró aquella Olimpiada.","en":"He had the Olympiad postponed two years, added the ten-horse chariot race and contests in tragedy and music, fell from the chariot and was proclaimed victor after paying the judges. After his death, Elis struck that Olympiad from the record."},"s":"T3 · línea del tiempo"},{"id":"fec-gre-ninfeo","k":"cro","f":"C","t":3,"q":{"es":"¿Cuándo? «Ninfeo de Herodes Ático»","en":"When? “Nymphaeum of Herodes Atticus”"},"o":[{"es":"h. 150 d. C.","en":"c. AD 150"},{"es":"67 d. C.","en":"AD 67"},{"es":"393 d. C.","en":"AD 393"},{"es":"435 d. C.","en":"AD 435"}],"x":{"es":"El benefactor griego costeó un acueducto con su fuente monumental para el santuario. Hacia 170, mientras declinaba el deporte, Olimpia vivió su máximo apogeo arquitectónico.","en":"The Greek benefactor paid for an aqueduct with its monumental fountain for the sanctuary. By c. 170, while sport declined, Olympia reached its architectural peak."},"s":"T3 · línea del tiempo"},{"id":"fec-gre-393","k":"cro","f":"C","t":3,"q":{"es":"¿Cuándo? «La ley de Teodosio I contra los cultos paganos»","en":"When? “Theodosius I's law against pagan cults”"},"o":[{"es":"393 d. C.","en":"AD 393"},{"es":"435 d. C.","en":"AD 435"},{"es":"h. 150 d. C.","en":"c. AD 150"},{"es":"67 d. C.","en":"AD 67"}],"x":{"es":"Durante más de un siglo se fechó en ella el final de los Juegos. Remijsen (2015) comprobó que no los menciona y que el vínculo lo estableció un cronista del siglo XI; en 399 un poeta de la corte aún esperaba ver a los vencedores de Olimpia.","en":"For more than a century the end of the Games was dated to it. Remijsen (2015) showed that it does not mention them and that the link was made by an 11th-century chronicler; in 399 a court poet still hoped to see the Olympic victors."},"s":"T3 · línea del tiempo"},{"id":"fec-gre-435","k":"cro","f":"C","t":3,"q":{"es":"¿Cuándo? «Constitución de Teodosio II contra los templos»","en":"When? “Constitution of Theodosius II against the temples”"},"o":[{"es":"435 d. C.","en":"AD 435"},{"es":"393 d. C.","en":"AD 393"},{"es":"h. 150 d. C.","en":"c. AD 150"},{"es":"67 d. C.","en":"AD 67"}],"x":{"es":"Según Arrechea et al. (2019), pudo desencadenar el incendio del templo de Zeus, y tras ello los Juegos no volvieron a celebrarse en Olimpia. Hacia 420-440 la estatua de Zeus se había llevado a Constantinopla.","en":"According to Arrechea et al. (2019), it may have triggered the fire that destroyed the temple of Zeus, after which the Games were no longer held at Olympia. C. 420-440 the statue of Zeus had been taken to Constantinople."},"s":"T3 · línea del tiempo"},{"id":"cur-1","k":"cur","f":"C","t":1,"q":{"es":"¿A qué época pertenece esta curiosidad: «Neandertales con oído de surfista»?","en":"Which period does this curiosity belong to: “Neanderthals with surfer's ear”?"},"o":[{"es":"Prehistoria","en":"Prehistory"},{"es":"Mesopotamia","en":"Mesopotamia"},{"es":"Grecia arcaica","en":"Archaic Greece"},{"es":"Grecia clásica","en":"Classical Greece"}],"x":{"es":"Trece de los veintitrés neandertales estudiados en 2019 por Erik Trinkaus y su equipo, que vivieron hace más de 40 000 años, tenían exostosis en el conducto auditivo, el crecimiento óseo que se conoce como «oído de surfista» y que hoy se asocia al agua fría. Los autores creen que pescaban y se mojaban más de lo que se pensaba, aunque no descartan otras causas (Trinkaus et al., 2019).","en":"Thirteen of the twenty-three Neanderthals studied in 2019 by Erik Trinkaus and his team, who lived more than 40,000 years ago, had exostoses in the ear canal, the bony growth known as «surfer's ear» and now linked to cold water. The authors think they fished and got wet more often than was believed, although they do not rule out other causes (Trinkaus et al., 2019)."},"s":"Historiapp · curiosidad 1"},{"id":"cur-2","k":"cur","f":"C","t":1,"q":{"es":"¿A qué época pertenece esta curiosidad: «Diez mujeres bailando en Cogul»?","en":"Which period does this curiosity belong to: “Ten women dancing at Cogul”?"},"o":[{"es":"Prehistoria","en":"Prehistory"},{"es":"Mesopotamia","en":"Mesopotamia"},{"es":"Grecia clásica","en":"Classical Greece"},{"es":"Hititas","en":"Hittites"}],"x":{"es":"En 1908 el párroco de Cogul (Lleida), Ramon Huguet, dio a conocer las pinturas de la Roca dels Moros, un abrigo pintado y repintado entre el 7000 y el 100 a. C. Su escena más original reúne a diez mujeres con largas faldas acampanadas en torno a una figura masculina desnuda, leída desde entonces como una danza ritual (Enciclopèdia Catalana, s. f.).","en":"In 1908 the parish priest of Cogul (Lleida), Ramon Huguet, made known the paintings of the Roca dels Moros, a rock shelter painted and repainted between 7000 and 100 BC. Its most original scene gathers ten women in long bell-shaped skirts around a naked male figure, read ever since as a ritual dance (Enciclopèdia Catalana, n.d.)."},"s":"Historiapp · curiosidad 2"},{"id":"cur-3","k":"cur","f":"C","t":1,"q":{"es":"¿A qué época pertenece esta curiosidad: «Nadadores pintados en pleno Sáhara»?","en":"Which period does this curiosity belong to: “Swimmers painted in the Sahara”?"},"o":[{"es":"Prehistoria","en":"Prehistory"},{"es":"Mesopotamia","en":"Mesopotamia"},{"es":"Grecia clásica","en":"Classical Greece"},{"es":"Grecia arcaica","en":"Archaic Greece"}],"x":{"es":"En octubre de 1933 el explorador húngaro László Almásy encontró en Wadi Sura, en el desierto occidental de Egipto, unas pinturas neolíticas de hacia el 6500 a. C. con figuras tendidas que él interpretó como nadadores. Aquel Sáhara recibía lluvias de monzón y tenía agua. La cueva inspiró una escena de la novela y la película «El paciente inglés» (Bradshaw Foundation, s. f.).","en":"In October 1933 the Hungarian explorer László Almásy found Neolithic paintings from around 6500 BC at Wadi Sura, in Egypt's Western Desert, with prone figures he read as swimmers. That Sahara received monsoon rains and had water. The cave inspired a scene in the novel and film «The English Patient» (Bradshaw Foundation, n.d.)."},"s":"Historiapp · curiosidad 3"},{"id":"cur-4","k":"cur","f":"C","t":1,"q":{"es":"¿A qué época pertenece esta curiosidad: «Patines de hueso para ahorrar energía»?","en":"Which period does this curiosity belong to: “Bone skates to save energy”?"},"o":[{"es":"Prehistoria","en":"Prehistory"},{"es":"Mesopotamia","en":"Mesopotamia"},{"es":"Hititas","en":"Hittites"},{"es":"Grecia arcaica","en":"Archaic Greece"}],"x":{"es":"Los primeros patines, usados en el norte de Europa desde hace unos 5000 años, eran huesos de animal atados al pie. Unos voluntarios probaron réplicas y avanzaron a 1,2 metros por segundo, y los cálculos indican que en Finlandia, con su red de lagos helados, patinar pudo ahorrar hasta un 10 % de la energía de los desplazamientos invernales (Formenti y Minetti, 2008).","en":"The first skates, used in northern Europe from about 5,000 years ago, were animal bones tied to the foot. Volunteers who tested replicas moved at 1.2 metres per second, and calculations suggest that in Finland, with its dense network of frozen lakes, skating could save up to 10% of the energy spent on winter travel (Formenti & Minetti, 2008)."},"s":"Historiapp · curiosidad 4"},{"id":"cur-5","k":"cur","f":"C","t":2,"q":{"es":"¿A qué época pertenece esta curiosidad: «El rey que corrió 320 kilómetros»?","en":"Which period does this curiosity belong to: “The king who ran 320 kilometres”?"},"o":[{"es":"Mesopotamia","en":"Mesopotamia"},{"es":"Prehistoria","en":"Prehistory"},{"es":"Grecia clásica","en":"Classical Greece"},{"es":"Nubia y Persia","en":"Nubia and Persia"}],"x":{"es":"Shulgi, rey de Ur entre 2094 y 2047 a. C., hizo cantar en sus himnos que había corrido en un solo día de Nippur a Ur y vuelta, unos 320 kilómetros, para asistir a las fiestas de las dos ciudades. Los mismos himnos lo presentan como luchador imbatible, porque ningún documento oficial iba a registrar la derrota de un rey (Crowther, 2007, pp. 17-18).","en":"Shulgi, king of Ur from 2094 to 2047 BC, had his hymns proclaim that he had run from Nippur to Ur and back in a single day, about 320 kilometres, to attend the festivals of both cities. The same hymns present him as an unbeatable wrestler, since no official record would ever register a king's defeat (Crowther, 2007, pp. 17-18)."},"s":"Historiapp · curiosidad 5"},{"id":"cur-6","k":"cur","f":"C","t":2,"q":{"es":"¿A qué época pertenece esta curiosidad: «Un mulo contra un asno en Sumer»?","en":"Which period does this curiosity belong to: “A mule against a donkey in Sumer”?"},"o":[{"es":"Mesopotamia","en":"Mesopotamia"},{"es":"Prehistoria","en":"Prehistory"},{"es":"Nubia y Persia","en":"Nubia and Persia"},{"es":"Grecia arcaica","en":"Archaic Greece"}],"x":{"es":"Una tablilla de Girsu de época de Ur III (siglo XXI a. C.) anota el pan entregado a unos viajeros que fueron «a hacer competir un mulo con un asno». Entre ellos iban el hijo y el guardián del sugal-mah, al que se traduce como jefe del Estado. Jorge Hernández, que la estudió, cree que la prueba servía para evaluar animales para la administración más que para divertirse (Hernández, 2011, pp. 75-80).","en":"A Ur III tablet from Girsu (21st century BC) records the bread handed to some travellers who went «to make a mule compete with a donkey». Among them were the son and the guard of the sugal-mah, a title rendered as head of state. Jorge Hernández, who studied it, believes the contest served to assess animals for the administration rather than to entertain (Hernández, 2011, pp. 75-80)."},"s":"Historiapp · curiosidad 6"},{"id":"cur-7","k":"cur","f":"C","t":2,"q":{"es":"¿A qué época pertenece esta curiosidad: «El arquero que perdía se desnudaba»?","en":"Which period does this curiosity belong to: “The losing archer stripped naked”?"},"o":[{"es":"Hititas","en":"Hittites"},{"es":"Egipto","en":"Egypt"},{"es":"Persia","en":"Persia"},{"es":"Roma","en":"Rome"}],"x":{"es":"Un texto hitita antiguo describe un concurso de tiro con arco ante el rey en el que el ganador recibía vino y el perdedor debía desnudarse y llevar agua a los demás. En una fiesta de primavera, además, los guardias del rey corrían una carrera cuyo premio era un cargo de la corte, el de «portador de las riendas del carro real» (Crowther, 2007, p. 20).","en":"An early Hittite text describes an archery contest before the king in which the winner received wine and the loser had to strip naked and carry water for the others. At a spring festival the king's bodyguards also ran a footrace whose prize was a court office, «holder of the king's chariot reins» (Crowther, 2007, p. 20)."},"s":"Historiapp · curiosidad 7"},{"id":"cur-8","k":"cur","f":"C","t":2,"q":{"es":"¿A qué época pertenece esta curiosidad: «Saltar hasta la ventana de la princesa»?","en":"Which period does this curiosity belong to: “Leaping up to the princess's window”?"},"o":[{"es":"Egipto","en":"Egypt"},{"es":"Hititas","en":"Hittites"},{"es":"Persia","en":"Persia"},{"es":"Roma","en":"Rome"}],"x":{"es":"En el cuento egipcio del «Príncipe predestinado», copiado en un papiro de comienzos de la dinastía XIX (siglo XIII a. C.), el príncipe de Naharin promete a su única hija a quien alcance de un salto su ventana, a unos treinta y siete metros del suelo. Tras meses de intentos de los jóvenes nobles del país, lo consigue un príncipe egipcio que ocultaba quién era (Decker, 1992, pp. 109-110).","en":"In the Egyptian tale of «The Doomed Prince», copied on a papyrus from the early Nineteenth Dynasty (13th century BC), the prince of Naharin promises his only daughter to whoever can leap up to her window, some thirty-seven metres above the ground. After months of attempts by the local noble youths, an Egyptian prince who had hidden his identity succeeds (Decker, 1992, pp. 109-110)."},"s":"Historiapp · curiosidad 8"},{"id":"cur-9","k":"cur","f":"C","t":2,"q":{"es":"¿A qué época pertenece esta curiosidad: «El arco que ningún persa podía tensar»?","en":"Which period does this curiosity belong to: “The bow no Persian could draw”?"},"o":[{"es":"Nubia y Persia","en":"Nubia and Persia"},{"es":"Grecia clásica","en":"Classical Greece"},{"es":"Grecia micénica","en":"Mycenaean Greece"},{"es":"Grecia arcaica","en":"Archaic Greece"}],"x":{"es":"Hacia el 525 a. C., según Heródoto, el rey persa Cambises envió espías al rey de los etíopes, al sur de Egipto. El rey destensó un arco enorme, se lo dio para Cambises y advirtió que los persas no le atacaran hasta que pudieran tensar uno igual con su misma facilidad. En Persia solo Esmerdis, hermano de Cambises, logró abrirlo dos dedos (Heródoto, 1921, 3.21, 3.30).","en":"Around 525 BC, according to Herodotus, the Persian king Cambyses sent spies to the king of the Ethiopians, south of Egypt. The king unstrung a huge bow, handed it over for Cambyses and warned that the Persians should not attack him until they could draw such a bow as easily as he did. In Persia only Smerdis, Cambyses' brother, managed to draw it two fingers' breadth (Herodotus, 1921, 3.21, 3.30)."},"s":"Historiapp · curiosidad 9"},{"id":"cur-10","k":"cur","f":"C","t":2,"q":{"es":"¿A qué época pertenece esta curiosidad: «Los remeros de Sidón ante Jerjes»?","en":"Which period does this curiosity belong to: “The oarsmen of Sidon before Xerxes”?"},"o":[{"es":"Persia","en":"Persia"},{"es":"Egipto","en":"Egypt"},{"es":"Hititas","en":"Hittites"},{"es":"Roma","en":"Rome"}],"x":{"es":"En 480 a. C., camino de Grecia, Jerjes hizo que los de Abidos le levantaran un trono de piedra blanca en una colina para contemplar su ejército y su flota. Quiso ver competir a las naves y la regata la ganaron los fenicios de Sidón. Heródoto anota que el rey quedó complacido con la carrera y con su expedición (Heródoto, 1922, 7.44).","en":"In 480 BC, on his way to Greece, Xerxes had the people of Abydos build him a throne of white stone on a hill so that he could survey his army and fleet. He wished to see the ships compete, and the race was won by the Phoenicians of Sidon. Herodotus notes that the king was pleased with the race and with his expedition (Herodotus, 1922, 7.44)."},"s":"Historiapp · curiosidad 10"},{"id":"cur-11","k":"cur","f":"C","t":3,"q":{"es":"¿A qué época pertenece esta curiosidad: «Un carro tallado sobre una tumba»?","en":"Which period does this curiosity belong to: “A chariot carved above a grave”?"},"o":[{"es":"Grecia micénica","en":"Mycenaean Greece"},{"es":"Grecia clásica","en":"Classical Greece"},{"es":"Grecia arcaica","en":"Archaic Greece"},{"es":"Grecia helenística","en":"Hellenistic Greece"}],"x":{"es":"Sobre las tumbas de fosa del círculo A de Micenas, del siglo XVI a. C., se alzaban estelas de piedra, y en una de ellas un auriga de pie guía un carro tirado por caballos al galope. Algunos especialistas han propuesto que la escena une la carrera de carros con los juegos en honor del difunto, una conexión que el relieve por sí solo no permite asegurar (Crowther, 2007, p. 40).","en":"Above the shaft graves of Grave Circle A at Mycenae, from the 16th century BC, stood stone stelae, and on one of them a standing charioteer drives a chariot pulled by galloping horses. Some scholars have suggested that the scene links chariot racing with games held in honour of the dead, a connection the relief alone cannot confirm (Crowther, 2007, p. 40)."},"s":"Historiapp · curiosidad 11"},{"id":"cur-12","k":"cur","f":"C","t":3,"q":{"es":"¿A qué época pertenece esta curiosidad: «El náufrago que calló a los feacios»?","en":"Which period does this curiosity belong to: “The castaway who silenced the Phaeacians”?"},"o":[{"es":"Grecia arcaica","en":"Archaic Greece"},{"es":"Nubia y Persia","en":"Nubia and Persia"},{"es":"Prehistoria","en":"Prehistory"},{"es":"Grecia clásica","en":"Classical Greece"}],"x":{"es":"En el canto VIII de la «Odisea», de hacia el 725 a. C., los feacios celebran juegos y el joven Euríalo se burla de Ulises, al que compara con un capitán mercante que solo piensa en cargas y ganancias. Ulises, aún vestido, coge un disco más pesado que los de ellos y lo lanza más allá de todas las marcas. Para Euríalo, quien vivía del comercio no era atleta (Miller, 2004, pp. 13-14).","en":"In Book VIII of the «Odyssey», from around 725 BC, the Phaeacians hold games and young Euryalus mocks Odysseus, comparing him to a merchant captain who thinks only of cargoes and profits. Odysseus, still in his clothes, picks up a discus heavier than theirs and hurls it beyond every mark. For Euryalus, a man who lived by trade was no athlete (Miller, 2004, pp. 13-14)."},"s":"Historiapp · curiosidad 12"},{"id":"cur-13","k":"cur","f":"C","t":3,"q":{"es":"¿A qué época pertenece esta curiosidad: «Campeón olímpico y golpista»?","en":"Which period does this curiosity belong to: “Olympic champion and coup plotter”?"},"o":[{"es":"Grecia arcaica","en":"Archaic Greece"},{"es":"Nubia y Persia","en":"Nubia and Persia"},{"es":"Grecia micénica","en":"Mycenaean Greece"},{"es":"Prehistoria","en":"Prehistory"}],"x":{"es":"Cilón, ateniense de familia rica, ganó el diaulo en Olimpia en 640 a. C. y se casó con la hija de Teágenes, tirano de Mégara. El oráculo de Delfos le aconsejó actuar durante la gran fiesta de Zeus, y en la olimpiada de 632 a. C. ocupó la Acrópolis con tropas de su suegro. El pueblo ateniense lo sitió, él escapó y sus amigos murieron (Golden, 2004, p. 46).","en":"Cylon, an Athenian from a wealthy family, won the diaulos at Olympia in 640 BC and married the daughter of Theagenes, tyrant of Megara. The Delphic oracle advised him to act during the great festival of Zeus, and in the Olympiad of 632 BC he seized the Acropolis with his father-in-law's troops. The Athenian people besieged him, he escaped and his friends were killed (Golden, 2004, p. 46)."},"s":"Historiapp · curiosidad 13"},{"id":"cur-14","k":"cur","f":"C","t":3,"q":{"es":"¿A qué época pertenece esta curiosidad: «Perdió la boda bailando»?","en":"Which period does this curiosity belong to: “He danced away his wedding”?"},"o":[{"es":"Grecia arcaica","en":"Archaic Greece"},{"es":"Nubia y Persia","en":"Nubia and Persia"},{"es":"Grecia clásica","en":"Classical Greece"},{"es":"Prehistoria","en":"Prehistory"}],"x":{"es":"Clístenes, tirano de Sición, ganó la carrera de cuadrigas en Olimpia hacia el 572 a. C. y aprovechó el triunfo para convocar a los pretendientes de su hija Agarista, a los que tuvo un año corriendo y luchando en su ciudad. En el banquete final, el favorito Hipoclides bailó sobre una mesa con las piernas al aire, y el tirano le dijo que había perdido la boda bailando (Miller, 2004, p. 97; Heródoto, 1922, 6.129).","en":"Cleisthenes, tyrant of Sicyon, won the four-horse chariot race at Olympia around 572 BC and used the victory to summon suitors for his daughter Agariste, whom he kept running and wrestling in his city for a year. At the final banquet the favourite, Hippocleides, danced on a table with his legs in the air, and the tyrant told him he had danced away his marriage (Miller, 2004, p. 97; Herodotus, 1922, 6.129)."},"s":"Historiapp · curiosidad 14"},{"id":"cur-15","k":"cur","f":"C","t":3,"q":{"es":"¿A qué época pertenece esta curiosidad: «Milón cargó con su propia estatua»?","en":"Which period does this curiosity belong to: “Milo carried his own statue”?"},"o":[{"es":"Grecia arcaica","en":"Archaic Greece"},{"es":"Nubia y Persia","en":"Nubia and Persia"},{"es":"Grecia clásica","en":"Classical Greece"},{"es":"Grecia helenística","en":"Hellenistic Greece"}],"x":{"es":"Milón de Crotona ganó seis veces la lucha en Olimpia, una de ellas en categoría infantil en 536 a. C., y se contaba que él mismo llevó a hombros su estatua hasta el santuario. En 512 a. C. buscó la séptima corona y la perdió ante Timasiteo, un paisano más joven que se negó a agarrarse con él (Miller, 2004, p. 111).","en":"Milo of Croton won the wrestling at Olympia six times, once in the boys' category in 536 BC, and it was said that he carried his own statue into the sanctuary on his shoulders. In 512 BC he sought a seventh crown and lost it to Timasitheus, a younger fellow citizen who refused to come to grips with him (Miller, 2004, p. 111)."},"s":"Historiapp · curiosidad 15"},{"id":"cur-16","k":"cur","f":"C","t":3,"q":{"es":"¿A qué época pertenece esta curiosidad: «La estatua juzgada por homicidio»?","en":"Which period does this curiosity belong to: “The statue tried for murder”?"},"o":[{"es":"Grecia clásica","en":"Classical Greece"},{"es":"Grecia arcaica","en":"Archaic Greece"},{"es":"Grecia micénica","en":"Mycenaean Greece"},{"es":"Nubia y Persia","en":"Nubia and Persia"}],"x":{"es":"Teágenes de Tasos, campeón olímpico de pugilato en 480 y de pancracio en 476 a. C., sumó según la tradición 1400 victorias. Muerto el atleta, un enemigo azotaba cada noche su estatua hasta que esta cayó sobre él y lo mató. La ciudad juzgó a la estatua y la arrojó al mar, aunque después la recuperó y veneró a Teágenes como sanador (Miller, 2004, pp. 113-114).","en":"Theagenes of Thasos, Olympic boxing champion in 480 and pankration champion in 476 BC, was credited with 1,400 victories. After his death an enemy flogged his statue every night until it fell on him and killed him. The city tried the statue and threw it into the sea, though it later recovered it and worshipped Theagenes as a healer (Miller, 2004, pp. 113-114)."},"s":"Historiapp · curiosidad 16"},{"id":"cur-17","k":"cur","f":"C","t":3,"q":{"es":"¿A qué época pertenece esta curiosidad: «Azotado por atar una cinta»?","en":"Which period does this curiosity belong to: “Flogged for tying a ribbon”?"},"o":[{"es":"Grecia clásica","en":"Classical Greece"},{"es":"Grecia arcaica","en":"Archaic Greece"},{"es":"Grecia micénica","en":"Mycenaean Greece"},{"es":"Mesopotamia","en":"Mesopotamia"}],"x":{"es":"En 420 a. C. Esparta estaba excluida de los Juegos de Olimpia, y el espartano Licas inscribió su carro a nombre del pueblo de Beocia. Cuando ganó, se acercó al auriga y le ató la cinta de vencedor para dejar claro que el carro era suyo, y por ello fue azotado en público. Los registros de Élide dieron la victoria a los tebanos (Miller, 2004, pp. 186-187).","en":"In 420 BC Sparta was barred from the Olympic Games, so the Spartan Lichas entered his chariot in the name of the Boeotian people. When it won, he went up to the charioteer and tied the victor's ribbon on him to make clear that the chariot was his, and for this he was publicly flogged. The Elean records gave the victory to the Thebans (Miller, 2004, pp. 186-187)."},"s":"Historiapp · curiosidad 17"},{"id":"cur-18","k":"cur","f":"C","t":3,"q":{"es":"¿A qué época pertenece esta curiosidad: «Una bailarina con escudo en Cotiora»?","en":"Which period does this curiosity belong to: “A dancing girl with a shield at Cotyora”?"},"o":[{"es":"Grecia clásica","en":"Classical Greece"},{"es":"Nubia y Persia","en":"Nubia and Persia"},{"es":"Mesopotamia","en":"Mesopotamia"},{"es":"Grecia arcaica","en":"Archaic Greece"}],"x":{"es":"En 400 a. C., durante la retirada de los mercenarios griegos que contó Jenofonte, sus jefes agasajaron en Cotiora a unos embajadores paflagonios con danzas armadas. La última la bailó una muchacha con un escudo ligero, que ejecutó la pírrica con gracia. Los invitados preguntaron si también las mujeres combatían con ellos, y los griegos respondieron que ellas habían puesto en fuga al rey de su campamento (Jenofonte, 1922, 6.1.11-13; Golden, 2004, p. 142).","en":"In 400 BC, during the retreat of the Greek mercenaries described by Xenophon, their generals entertained some Paphlagonian envoys at Cotyora with armed dances. The last was performed by a girl with a light shield, who danced the pyrrhic with grace. The guests asked whether women also fought alongside them, and the Greeks replied that these were the ones who had put the king to flight from his camp (Xenophon, 1922, 6.1.11-13; Golden, 2004, p. 142)."},"s":"Historiapp · curiosidad 18"},{"id":"cur-19","k":"cur","f":"C","t":3,"q":{"es":"¿A qué época pertenece esta curiosidad: «El cretense que corrió para Éfeso»?","en":"Which period does this curiosity belong to: “The Cretan who ran for Ephesus”?"},"o":[{"es":"Grecia clásica","en":"Classical Greece"},{"es":"Nubia y Persia","en":"Nubia and Persia"},{"es":"Grecia arcaica","en":"Archaic Greece"},{"es":"Grecia micénica","en":"Mycenaean Greece"}],"x":{"es":"Sotades ganó el dólico, la carrera larga, en Olimpia en 384 a. C. y fue proclamado cretense, como era. En los Juegos siguientes volvió a ganar, pero aceptó dinero de Éfeso para anunciarse como efesio, y los cretenses lo castigaron con el destierro. Poco después un cómico ateniense lo nombraba como ejemplo de quien corre mucho (Miller, 2004, p. 182; Golden, 2004, p. 155).","en":"Sotades won the dolichos, the long race, at Olympia in 384 BC and was proclaimed a Cretan, as he was. At the next Games he won again but took money from Ephesus to be announced as an Ephesian, and the Cretans punished him with exile. Shortly afterwards an Athenian comic poet named him as the model of someone who runs a lot (Miller, 2004, p. 182; Golden, 2004, p. 155)."},"s":"Historiapp · curiosidad 19"},{"id":"cur-20","k":"cur","f":"C","t":3,"q":{"es":"¿A qué época pertenece esta curiosidad: «Diógenes contra las fatigas»?","en":"Which period does this curiosity belong to: “Diogenes against hardship”?"},"o":[{"es":"Grecia clásica","en":"Classical Greece"},{"es":"Grecia micénica","en":"Mycenaean Greece"},{"es":"Nubia y Persia","en":"Nubia and Persia"},{"es":"Mesopotamia","en":"Mesopotamia"}],"x":{"es":"Hacia el 358 a. C. el filósofo cínico Diógenes acudió a los Juegos Ístmicos y, cuando le preguntaron si iba a ver las pruebas, contestó que iba a competir. Su rival eran las fatigas, imbatibles para los glotones y vencibles para los hombres flacos, con cintura de avispa. Lo contó Dion de Prusa cuatro siglos después, de modo que el retrato puede reflejar una época u otra (Miller, 2004, pp. 99-101).","en":"Around 358 BC the Cynic philosopher Diogenes went to the Isthmian Games and, when asked whether he had come to watch, replied that he had come to compete. His opponent was hardship, unbeatable for gluttons and beatable by lean men with waists like wasps. Dio of Prusa told the story four centuries later, so the portrait may reflect either age (Miller, 2004, pp. 99-101)."},"s":"Historiapp · curiosidad 20"},{"id":"cur-21","k":"cur","f":"C","t":3,"q":{"es":"¿A qué época pertenece esta curiosidad: «La cortesana que ganó en Olimpia»?","en":"Which period does this curiosity belong to: “The courtesan who won at Olympia”?"},"o":[{"es":"Grecia helenística","en":"Hellenistic Greece"},{"es":"Grecia micénica","en":"Mycenaean Greece"},{"es":"Grecia arcaica","en":"Archaic Greece"},{"es":"Grecia clásica","en":"Classical Greece"}],"x":{"es":"Belistiche, cortesana del rey Ptolomeo II de Egipto, ganó dos veces en Olimpia, en el 268 y el 264 a. C., con carros de caballos de su propiedad, y una de esas victorias llegó en la nueva carrera de carros tirados por dos potros. Las mujeres tenían vetado competir, pero el triunfo hípico era del dueño de los caballos (Pausanias, 1926, 5.8.11; Connected Contests, s. f.).","en":"Belistiche, a courtesan of King Ptolemy II of Egypt, won twice at Olympia, in 268 and 264 BC, with chariots and horses she owned, and one of those victories came in the new race for chariots drawn by two foals. Women were barred from competing, but an equestrian victory belonged to the owner of the horses (Pausanias, 1926, 5.8.11; Connected Contests, n.d.)."},"s":"Historiapp · curiosidad 21"},{"id":"cur-22","k":"cur","f":"C","t":3,"q":{"es":"¿A qué época pertenece esta curiosidad: «Quién no podía entrar en el gimnasio»?","en":"Which period does this curiosity belong to: “Who was kept out of the gymnasium”?"},"o":[{"es":"Grecia helenística","en":"Hellenistic Greece"},{"es":"Grecia micénica","en":"Mycenaean Greece"},{"es":"Grecia arcaica","en":"Archaic Greece"},{"es":"Nubia y Persia","en":"Nubia and Persia"}],"x":{"es":"La ley del gimnasio de Berea, en Macedonia, grabada en piedra entre el 200 y el 165 a. C., prohibía ungirse y entrenar allí a esclavos, libertos y sus hijos, prostitutos, borrachos, enfermos mentales y a quien tuviera un oficio en el mercado. El gimnasiarca que lo consintiera pagaba mil dracmas. El gimnasio formaba a la élite de ciudadanos y marcaba quién pertenecía a ella (Kouklidis, 2019, pp. 42-43).","en":"The gymnasium law of Beroia, in Macedonia, carved in stone between 200 and 165 BC, forbade slaves, freedmen and their sons, male prostitutes, drunkards, the mentally ill and anyone who plied a trade in the market from anointing themselves and training there. A gymnasiarch who allowed it paid a thousand drachmas. The gymnasium shaped the citizen elite and marked who belonged to it (Kouklidis, 2019, pp. 42-43)."},"s":"Historiapp · curiosidad 22"},{"id":"cur-23","k":"cur","f":"C","t":4,"q":{"es":"¿A qué época pertenece esta curiosidad: «Séneca vivía encima de un gimnasio»?","en":"Which period does this curiosity belong to: “Seneca lived above a gym”?"},"o":[{"es":"Roma","en":"Rome"},{"es":"Egipto","en":"Egypt"},{"es":"Persia","en":"Persia"},{"es":"Hititas","en":"Hittites"}],"x":{"es":"Hacia el 63 d. C. el cordobés Séneca contó a su amigo Lucilio que vivía encima de unos baños. Oía gruñir a quienes levantaban pesas de plomo, el golpe de la mano del masajista, al jugador de pelota que contaba en voz alta, al depilador que pregonaba su oficio y a los vendedores de salchichas y dulces. Las termas eran gimnasio, mercado y lugar de reunión (Séneca, 1917, Ep. 56.1-2).","en":"Around AD 63 Seneca, born in Corduba, told his friend Lucilius that he lived right above a bathhouse. He heard men grunting as they lifted lead weights, the slap of the masseur's hand, the ball player counting aloud, the hair plucker crying his trade and the sellers of sausages and pastries. The baths were gym, market and meeting place in one (Seneca, 1917, Ep. 56.1-2)."},"s":"Historiapp · curiosidad 23"},{"id":"cur-24","k":"cur","f":"C","t":4,"q":{"es":"¿A qué época pertenece esta curiosidad: «El púgil que ganaba sin dar golpes»?","en":"Which period does this curiosity belong to: “The boxer who won without throwing punches”?"},"o":[{"es":"Roma","en":"Rome"},{"es":"Persia","en":"Persia"},{"es":"Egipto","en":"Egypt"},{"es":"Hititas","en":"Hittites"}],"x":{"es":"En el siglo I d. C. el orador Dion de Prusa elogió al púgil Melancomas, invicto, según él, desde que empezó a competir en los Juegos Píticos. Aguantaba dos días seguidos con la guardia alta y obligaba a sus rivales a rendirse antes de recibir un golpe y antes de darlo, porque no veía valentía en herir ni en ser herido (Dion Crisóstomo, 1939, pp. 365-367).","en":"In the 1st century AD the orator Dio of Prusa praised the boxer Melancomas, undefeated, he said, from the moment he began competing at the Pythian Games. He could keep his guard up for two days in a row and made rivals give up before he took a blow or landed one, since he saw no courage in wounding or being wounded (Dio Chrysostom, 1939, pp. 365-367)."},"s":"Historiapp · curiosidad 24"},{"id":"cur-25","k":"cur","f":"C","t":4,"q":{"es":"¿A qué época pertenece esta curiosidad: «Una tumba para el caballo del emperador»?","en":"Which period does this curiosity belong to: “A tomb for the emperor's horse”?"},"o":[{"es":"Roma","en":"Rome"},{"es":"Persia","en":"Persia"},{"es":"Egipto","en":"Egypt"},{"es":"Hititas","en":"Hittites"}],"x":{"es":"Adriano, emperador entre el 117 y el 138 d. C., fue un cazador apasionado. Según Dion Casio, se rompió la clavícula cazando, estuvo a punto de quedar lisiado de una pierna y dio a una ciudad que fundó en Misia el nombre de Hadrianoterae, «cacerías de Adriano». Cuando murió Borístenes, su caballo de caza favorito, le hizo una tumba con lápida e inscripción (Dion Casio, 1925, p. 443).","en":"Hadrian, emperor from AD 117 to 138, was a passionate hunter. According to Cassius Dio, he broke his collarbone hunting, nearly maimed a leg and gave a city he founded in Mysia the name Hadrianotherae, 'Hadrian's hunts'. When Borysthenes, his favourite hunting horse, died, he gave it a tomb with a slab and an inscription (Cassius Dio, 1925, p. 443)."},"s":"Historiapp · curiosidad 25"},{"id":"cur-26","k":"cur","f":"C","t":4,"q":{"es":"¿A qué época pertenece esta curiosidad: «Tres caídas pactadas por 3.800 dracmas»?","en":"Which period does this curiosity belong to: “Three agreed falls for 3,800 drachmas”?"},"o":[{"es":"Roma","en":"Rome"},{"es":"Persia","en":"Persia"},{"es":"Egipto","en":"Egypt"},{"es":"Hititas","en":"Hittites"}],"x":{"es":"En el 267 d. C., antes de la final de lucha juvenil de los Grandes Antinoeia, en Egipto, el padre de Nicantinoo se comprometió por contrato a pagar 3.800 dracmas al rival, Demetrio, a cambio de que «cayera tres veces y cediera». Si Demetrio se echaba atrás y ganaba, pagaría tres talentos. Es el contrato de amaño entre atletas más antiguo que se conoce (Jarus, 2014).","en":"In AD 267, before the boys' wrestling final at the Great Antinoeia in Egypt, the father of Nicantinous agreed by contract to pay 3,800 silver drachmas to the opponent, Demetrius, if he would 'fall three times and yield'. If Demetrius backed out and won, he would owe three talents. It is the earliest known written match-fixing contract between ancient athletes (Jarus, 2014)."},"s":"Historiapp · curiosidad 26"},{"id":"cur-27","k":"cur","f":"C","t":4,"q":{"es":"¿A qué época pertenece esta curiosidad: «El último campeón olímpico de la Antigüedad»?","en":"Which period does this curiosity belong to: “The last Olympic champion of antiquity”?"},"o":[{"es":"Roma","en":"Rome"},{"es":"Persia","en":"Persia"},{"es":"Egipto","en":"Egypt"},{"es":"Hititas","en":"Hittites"}],"x":{"es":"Una placa de bronce con nombres de vencedores, hallada en Olimpia en 1994, permitió conocer al último campeón olímpico antiguo identificado, el púgil ateniense Marco Aurelio Zopiro, que ganó en el 385 d. C. Para entonces el cristianismo era ya la religión dominante del Imperio, y pocos años después los Juegos en honor de Zeus dejaron de celebrarse tras más de once siglos (Ebert, 1997; Connected Contests, s. f.).","en":"A bronze plaque bearing victors' names, found at Olympia in 1994, revealed the last identified ancient Olympic champion, the Athenian boxer Marcus Aurelius Zopyros, who won in AD 385. By then Christianity was the dominant religion of the Empire, and a few years later the Games in honour of Zeus ceased after more than eleven centuries (Ebert, 1997; Connected Contests, n.d.)."},"s":"Historiapp · curiosidad 27"},{"id":"cur-28","k":"cur","f":"C","t":4,"q":{"es":"¿A qué época pertenece esta curiosidad: «Un senador a la caza de caballos hispanos»?","en":"Which period does this curiosity belong to: “A senator hunting for Spanish horses”?"},"o":[{"es":"Roma","en":"Rome"},{"es":"Egipto","en":"Egypt"},{"es":"Persia","en":"Persia"},{"es":"Hititas","en":"Hittites"}],"x":{"es":"Entre el 399 y el 401 d. C. el senador Símaco escribió carta tras carta a criadores y funcionarios para traer a Roma caballos de carreras de Hispania, que consideraba los mejores, para los juegos de su hijo Memio. Envió agentes y pidió permisos del correo imperial para acelerar su viaje. Pagar el espectáculo era la forma de mostrar el rango de la familia (Blázquez, 2010, pp. 418-419).","en":"Between AD 399 and 401 the senator Symmachus wrote letter after letter to breeders and officials to bring racehorses from Hispania, which he held to be the best, to Rome for his son Memmius's games. He sent agents and asked for imperial post permits to speed their journey. Paying for the show was how the family displayed its rank (Blázquez, 2010, pp. 418-419)."},"s":"Historiapp · curiosidad 28"}];

}

const BOT_P = [.45, .65, .85];
const KIND = { glo: { es: 'Glosario', en: 'Glossary' }, cro: { es: 'Cronología', en: 'Chronology' }, img: { es: 'Imagen', en: 'Image' }, rel: { es: 'Relaciona', en: 'Match' },
  mit: { es: 'Mito o realidad', en: 'Myth or fact' }, cur: { es: 'Curiosidad', en: 'Curiosity' }, fue: { es: 'Fuente', en: 'Source' }, vf: { es: 'Verdadero o falso', en: 'True or false' } };
function ask(p, fam, opt = {}) {
  return new Promise(res => {
    const q = drawQ(fam); const f = FAMS[FI[fam]]; p.asked++;
    const head = $('qhead'); head.style.background = `linear-gradient(90deg, ${f.col}, ${f.col}cc)`;
    const kind = KIND[q.k || (q.vf !== undefined ? 'vf' : '')]; head.innerHTML = `<img src="${glyphURL(fam)}" alt=""><span>${opt.final ? t('finalQ') + ' · ' : ''}${L(f)}</span><span class="tg">${kind ? L(kind) + ' · ' : ''}${t('tema')(q.t)}</span>`;
    // pregunta de quesito y pregunta final: marco dorado y cinta con el quesito en juego
    const special = opt.hq || opt.final; $('qcard').classList.toggle('hq', !!special); const bd = $('qbadge');
    if (special) { const has = opt.hq && p.w[fam]; bd.style.display = 'flex'; bd.innerHTML = `<svg viewBox="0 0 40 40" class="wsv"><path d="M20 20 L20 3 A17 17 0 0 1 34.7 11.5 Z" fill="${f.col}" stroke="#fff6d8" stroke-width="2" stroke-linejoin="round"/><circle cx="20" cy="20" r="17" fill="none" stroke="#f0d58c" stroke-width="2"/></svg><span>${opt.final ? (LANG === 'es' ? 'Pregunta final: si aciertas, ganas la partida' : 'Final question: answer it right to win the game') : has ? (LANG === 'es' ? 'Pregunta de quesito · ya tienes este quesito' : 'Wedge question · you already have this wedge') : (LANG === 'es' ? 'Pregunta de quesito · acierta y te lo llevas' : 'Wedge question · answer it right to win it')}</span>`; }
    else bd.style.display = 'none';
    $('qwho').textContent = p.bot ? t('botThinks')(p.name) : t('answers')(p.name);
    const isVF = q.vf !== undefined;
    $('qtext').innerHTML = (isVF ? `<span style="color:var(--gold2);font-size:.8em">${t('vf')}</span><br>` : '') + esc(L(q.q)) + (q.quote ? `<blockquote class="quote">${esc(L(q.quote))}</blockquote>` : '');
    const im = $('qimg'); if (q.img) { im.src = q.img; im.style.display = 'block'; $('qcap').textContent = L(q.cap); } else { im.style.display = 'none'; im.removeAttribute('src'); $('qcap').textContent = ''; }
    const res$ = $('qres'); res$.style.display = 'none'; const row = $('qrow'); row.innerHTML = ''; const ops = $('qopts'); ops.innerHTML = '';
    // opciones: índice 0 = correcta (MC); en VF la correcta es q.vf
    let opts; if (isVF) opts = [{ txt: t('v'), ok: q.vf === true }, { txt: t('f'), ok: q.vf === false }];
    else opts = shuffle(q.o.map((o, i) => ({ txt: L(o) || o.es, ok: i === 0 })));
    const correctTxt = opts.find(o => o.ok).txt;
    const finish = ok => {
      // 19-10-2026: memoria común de fallos de Historiapp (solo actúa dentro de la app; la correcta va la primera)
      if (!p.bot && window.HAPP_REPASO) try {
        const qe = (q.q && q.q.es) || q.q, qn = (q.q && (q.q.en || q.q.es)) || q.q, ce = q.quote ? ' «' + (q.quote.es || q.quote) + '»' : '', cn = q.quote ? ' “' + (q.quote.en || q.quote.es || q.quote) + '”' : '';
        const qq = isVF ? { es: '¿Verdadero o falso? ' + qe + ce, en: 'True or false? ' + qn + cn } : { es: qe + ce, en: qn + cn };
        if (ok) HAPP_REPASO.acierto(qq);
        else HAPP_REPASO.fallo('trivium', qq, isVF ? (q.vf ? { es: ['Verdadero', 'Falso'], en: ['True', 'False'] } : { es: ['Falso', 'Verdadero'], en: ['False', 'True'] }) : { es: q.o.map(o => o.es || o), en: q.o.map(o => o.en || o.es || o) }, null, q.t);
      } catch (e) {}
      if (ok) { p.right++; sfx.ok(); if (!p.bot) { const xp = addXP(10, true); if (xp) toast(t('ok'), t('xp')(xp), 1200); } } else sfx.ko();
      res$.style.display = 'block'; res$.style.borderLeftColor = ok ? '#8fe0a0' : '#ff9c8f';

      res$.querySelector('.ex').innerHTML = `<p><b>${t('theAns')}:</b> ${esc(correctTxt)}</p>${L(q.x) ? `<p>${esc(L(q.x))}</p>` : ''}`;

      row.appendChild(btn(t('cont2'), 'gold', go));
      const humansLeft = G.players.some(o => !o.bot); const auto = p.bot ? setTimeout(go, (FAST() ? 1400 : 3200) * TURBO) : (!humansLeft ? setTimeout(go, 1500 * TURBO) : 0);
      setTimeout(() => res$.scrollIntoView({ block: 'nearest', behavior: 'smooth' }), 50);
    };
    const markOpts = (chosen) => [...ops.children].forEach((b, i) => { b.disabled = true; if (opts[i].ok) b.classList.add('ok'); else if (i === chosen) b.classList.add('ko'); else b.classList.add('dim'); });
    const classic = G.mode === 'cla' && !p.bot;
    if (!classic) {
      opts.forEach((o, i) => { const b = document.createElement('button'); b.className = 'opt'; b.innerHTML = `<span class="k">${isVF ? (i ? 'F' : 'V') : 'ABCD'[i]}</span><span>${esc(o.txt)}</span>`; b.onclick = () => { if (p.bot) return; markOpts(i); finish(o.ok); }; ops.appendChild(b); });
      if (p.bot) { const ok = Math.random() < BOT_P[p.lvl ?? 1] + (opt.final ? -.05 : 0) - (G.dif === 'alta' ? .08 : 0); setTimeout(() => { const i = ok ? opts.findIndex(o => o.ok) : opts.findIndex(o => !o.ok); markOpts(i); finish(ok); }, (FAST() ? 700 : 1700) * TURBO); }
    } else {
      row.appendChild(btn(t('show'), 'gold', () => {
        row.innerHTML = ''; res$.style.display = 'block'; res$.style.borderLeftColor = 'var(--gold)'; res$.querySelector('h3').textContent = t('didOk');
        res$.querySelector('.ex').innerHTML = `<p><b>${t('theAns')}:</b> ${esc(correctTxt)}</p>${L(q.x) ? `<p>${esc(L(q.x))}</p>` : ''}`; res$.querySelector('.src').textContent = t('src') + ': ' + q.s;
        row.appendChild(btn('✅ ' + t('yes'), 'gold', () => { res$.style.display = 'none'; finish(true); })); row.appendChild(btn('❌ ' + t('no'), '', () => { res$.style.display = 'none'; finish(false); }));
      }));

}

// ------------------------------------------------------------------ máquina
function botPick(p, dests) {
  let best = null, bs = -1;
  for (const id of dests.keys()) {
    const n = N[id]; let s = Math.random() * 3;
    if (n.type === 'hub') s += hasAll(p) ? 1000 : 25;
    else if (n.type === 'hq') s += p.w[n.fam] ? 12 : 80;
    else if (n.type === 'roll') s += 35;
    else s += 15;
    if (hasAll(p) && n.type !== 'hub') { const d = hubDist(id); s += 40 - d * 5; }
    if (!hasAll(p) && n.type !== 'hq') { const near = nearestMissingHQ(p, id); s += Math.max(0, 12 - near * 2); }
    if (s > bs) { bs = s; best = id; }
  }
  return best;
}
function bfs(from) { const d = new Array(N.length).fill(1e9); d[from] = 0; const q = [from]; while (q.length) { const x = q.shift(); for (const y of ADJ[x]) if (d[y] > d[x] + 1) { d[y] = d[x] + 1; q.push(y); } } return d; }
const DIST = N.map((_, i) => bfs(i));
const hubDist = id => DIST[id][0];
function nearestMissingHQ(p, id) { let m = 99; N.forEach((n, j) => { if (n.type === 'hq' && !p.w[n.fam]) m = Math.min(m, DIST[id][j]); }); return m; }

  let xp = 0; if (!p.bot) xp += addXP(G.players.some(o => o.bot) ? 100 : 30); else if (G.players.some(o => !o.bot)) xp += addXP(30);
  const c = $('dlgCard');
  c.innerHTML = `<h2 style="text-align:center">🏆 ${t('win')(esc(p.name))}</h2><p style="text-align:center">${t('winSub')}</p>${xp ? `<p style="text-align:center;color:var(--gold2)">${t('xp')(xp)}</p>` : ''}<div id="stats"></div><div class="row"></div>`;
  G.players.forEach(o => { const d = document.createElement('div'); d.className = 'stat'; const cv = document.createElement('canvas'); pieCanvas(cv, o, 44); d.appendChild(cv); d.insertAdjacentHTML('beforeend', `<div><b>${esc(o.name)}</b><br><small>${t('stats')(o.right, o.asked)} · ${t('wedges')(nW(o))}</small></div>`); $('stats').appendChild(d); });

}
