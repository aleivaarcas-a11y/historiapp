"Cyrus II, in 550 BC"},{"es":"Darío I, en 500 a. C.","en":"Darius I, in 500 BC"},{"es":"Rostam, en el siglo X","en":"Rostam, in the 10th century"}]},{"id":"happ-quiz-t2-12","f":"C","t":2,"q":{"es":"¿Cuál fue la aportación cultural decisiva de los fenicios?","en":"What was the Phoenicians' decisive cultural contribution?"},"x":{"es":"El sistema nació hacia 1800 a. C. entre trabajadores semitas del Sinaí; los fenicios lo fijaron en 22 consonantes y lo distribuyeron en sus barcos.","en":"The system arose around 1800 BC among Semitic workers in Sinai; the Phoenicians fixed it at 22 consonants and distributed it in their ships."},"s":"T2 · 2.3.1","o":[{"es":"Fijar y difundir el alfabeto de 22 signos","en":"Fixing and spreading the 22-sign alphabet"},{"es":"Inventar la brújula","en":"Inventing the compass"},{"es":"Crear los Juegos Olímpicos","en":"Creating the Olympic Games"},{"es":"Introducir el caballo en el Mediterráneo","en":"Introducing the horse to the Mediterranean"}]},{"id":"happ-quiz-t2-13","f":"F","t":2,"q":{"es":"¿Por qué las naves fenicias de los relieves de Sargón II se llamaron hippoi?","en":"Why were the Phoenician ships in Sargon II's reliefs called hippoi?"},"x":{"es":"El mascarón de proa fue una de las principales innovaciones fenicias a la náutica. Transportaban madera de cedro remolcando troncos por la costa.","en":"The figurehead was one of the main Phoenician innovations in seafaring. The ships carried cedar, towing logs along the coast."},"s":"T2 · 2.3.2","o":[{"es":"Por la cabeza de caballo tallada en la proa","en":"For the horse head carved on the bow"},{"es":"Porque transportaban caballos a Egipto","en":"Because they carried horses to Egypt"},{"es":"Por la rapidez con que cruzaban el mar","en":"For how fast they crossed the sea"},{"es":"Por el nombre del puerto de Tiro","en":"For the name of the port of Tyre"}]},{"id":"happ-quiz-t2-14","f":"F","t":2,"q":{"es":"¿Qué porcentaje de las figuritas de Kharayeb representa a niños?","en":"What percentage of the Kharayeb figurines depict children?"},"x":{"es":"De 16.400 fragmentos, un 35 % son niños y un 22 % mujeres. Las figuras permiten ordenar una secuencia de juego por edades.","en":"Of 16,400 fragments, 35 % are children and 22 % women. The figures allow a sequence of play by age to be ordered."},"s":"T2 · 2.3.3","o":[{"es":"35 %","en":"35 %"},{"es":"22 %","en":"22 %"},{"es":"50 %","en":"50 %"},{"es":"5 %","en":"5 %"}]},{"id":"happ-quiz-t2-15","f":"S","t":2,"q":{"es":"¿Qué lleva a los persas a estatalizar la educación de los jóvenes?","en":"What leads the Persians to place young people's education under the state?"},"x":{"es":"El imperio se construye en treinta años sobre decenas de pueblos; la educación tiene como fin impedir que los hijos de los persas dejen de serlo.","en":"The empire was built in thirty years over dozens of peoples; education aimed to stop the sons of Persians from ceasing to be Persian."},"s":"T2 · 2.2.3","o":[{"es":"Gobernar decenas de pueblos con una minoría persa dispersa","en":"Ruling dozens of peoples with a scattered Persian minority"},{"es":"Preparar atletas para competir con Grecia","en":"Training athletes to compete with Greece"},{"es":"Formar una casta de sacerdotes guerreros","en":"Training a caste of warrior priests"},{"es":"Imitar la educación egipcia del kap","en":"Copying the Egyptian education of the kap"}]},{"id":"happ-card-t2-0","f":"F","t":2,"q":{"es":"La Piedra Rosetta fue descifrada por Champollion en 1822.","en":"The Rosetta Stone was deciphered by Champollion in 1822."},"x":{"es":"Hallada por las tropas napoleónicas en 1799, contiene el mismo texto en jeroglífico, demótico y griego antiguo: el apoyo de un grupo de sacerdotes al monarca.","en":"Found by Napoleon's troops in 1799, it carries the same text in hieroglyphic, demotic and ancient Greek: a group of priests' support for the king."},"s":"T2 · 2.1.1","vf":true},{"id":"happ-card-t2-1","f":"F","t":2,"q":{"es":"La prótesis perteneció a un soldado que perdió el pie en combate.","en":"The prosthesis belonged to a soldier who lost his foot in battle."},"x":{"es":"Perteneció a una mujer noble de 50 a 60 años que perdió el dedo gordo del pie, probablemente por complicaciones de la diabetes. Es la prótesis funcional más antigua conocida y se conserva en la Universidad de Basilea.","en":"It belonged to a noblewoman aged 50 to 60 who lost her big toe, probably through complications of diabetes. It is the oldest known functional prosthesis and is kept at the University of Basel."},"s":"T2 · 2.1.1","vf":false,"img":"../img/t2/protesis_dedo.jpg","cap":{"es":"Prótesis de madera, Luxor, h. 600 a. C.","en":"Wooden prosthesis, Luxor, c. 600 BC"}},{"id":"happ-card-t2-2","f":"S","t":2,"q":{"es":"Los escribas eran la única clase que sabía leer y escribir.","en":"Scribes were the only class that could read and write."},"x":{"es":"Llevaban cuentas, censos e impuestos. Por encima estaban el faraón y la aristocracia (visir, clero, nomarcas); por debajo, artesanos, ejército y el pueblo llano.","en":"They kept accounts, censuses and taxes. Above them were the pharaoh and the aristocracy (vizier, clergy, nomarchs); below, craftsmen, the army and the common people."},"s":"T2 · 2.1.1","vf":true},{"id":"happ-card-t2-3","f":"S","t":2,"q":{"es":"Estas actividades servían para amenizar fiestas sagradas y banquetes de las élites.","en":"These activities served to enliven sacred festivals and elite banquets."},"x":{"es":"Bailes, música y acrobacias formaban los espectáculos públicos, una de las dos grandes categorías de actividad física egipcia junto a los ejercicios militares. Las ejecutaban profesionales del pueblo llano.","en":"Dance, music and acrobatics formed the public spectacles, one of the two great categories of Egyptian physical activity alongside military exercises. They were performed by professionals from the common people."},"s":"T2 · 2.1.1","vf":true,"img":"../img/t2/musicas_bailarinas.jpg","cap":{"es":"Músicas y bailarinas, pintura mural del Imperio Nuevo","en":"Musicians and dancers, New Kingdom wall painting"}},{"id":"happ-card-t2-4","f":"S","t":2,"q":{"es":"Esta escena pertenece al ceremonial del Heb-Sed.","en":"This scene belongs to the Heb-Sed ceremonial."},"x":{"es":"El Heb-Sed es la fiesta de jubileo que renovaba el poder del faraón, celebrada a los treinta años de reinado y repetida después cada tres. Hay 314 testimonios.","en":"The Heb-Sed is the jubilee festival that renewed the pharaoh's power, held after thirty years of reign and repeated every three years thereafter. There are 314 attestations."},"s":"T2 · 2.1.2","vf":true,"img":"../img/t2/seti_pilar_djed.jpg","cap":{"es":"Seti I erigiendo un pilar Djed, Abidos, h. 1280 a. C.","en":"Seti I raising a Djed pillar, Abydos, c. 1280 BC"}},{"id":"happ-card-t2-5","f":"P","t":2,"q":{"es":"La figura que corre junto al toro Apis es un faraón varón.","en":"The figure running beside the Apis bull is a male pharaoh."},"x":{"es":"Es la reina Hatshepsut realizando la carrera del Heb-Sed en el año 16 de su reinado (h. 1485 a. C.). Las mujeres que gobernaban también debían mostrar su fortaleza física.","en":"It is Queen Hatshepsut performing the Heb-Sed run in year 16 of her reign (c. 1485 BC). Ruling women also had to display their physical strength."},"s":"T2 · 2.1.2","vf":false,"img":"../img/t2/hatshepsut_hebsed.jpg","cap":{"es":"Capilla roja de Karnak, dinastía XVIII","en":"Red Chapel of Karnak, 18th Dynasty"}},{"id":"happ-card-t2-6","f":"L","t":2,"q":{"es":"La zona marcada es el Gran Patio del Sur, con la pista de la carrera del Heb-Sed.","en":"The marked area is the Great South Court, with the Heb-Sed race track."},"x":{"es":"La pista era una recta de 55 m coronada por dos mojones semicirculares; el circuito completo sumaba 140 m y se corría de norte a sur y de sur a norte, simbolizando la unión de los dos reinos.","en":"The track was a 55 m straight ending in two semicircular markers; the full circuit was 140 m, run north to south and south to north, symbolising the union of the two kingdoms."},"s":"T2 · 2.1.2","vf":true,"img":"../img/t2/saqqara_planta.jpg","cap":{"es":"Planta del complejo funerario de Dyeser, Saqqara","en":"Plan of Djoser's funerary complex, Saqqara"}},{"id":"happ-card-t2-7","f":"L","t":2,"q":{"es":"En este patio se celebraban carreras de carros.","en":"Chariot races were held in this court."},"x":{"es":"Aquí corría el faraón a pie durante el Heb-Sed. En Egipto no se atestiguan carreras de carros: el carro se usó para la guerra y la caza.","en":"Here the pharaoh ran on foot during the Heb-Sed. Chariot races are not attested in Egypt: the chariot was used for war and hunting."},"s":"T2 · 2.1.2","vf":false,"img":"../img/t2/saqqara_patio_sur.jpg","cap":{"es":"Patio sur de Saqqara con la pirámide escalonada","en":"South court of Saqqara with the Step Pyramid"}},{"id":"happ-card-t2-8","f":"F","t":2,"q":{"es":"Piezas como esta servían de diana en el tiro con arco real.","en":"Pieces like this served as targets in royal archery."},"x":{"es":"Los lingotes de cobre bruto eran mercancía del comercio mediterráneo. El rey disparaba contra ellos para demostrar que su fuerza seguía intacta y el orden del mundo (ma'at) garantizado.","en":"Raw copper ingots were goods traded across the Mediterranean. The king shot at them to show that his strength remained intact and the world order (ma'at) guaranteed."},"s":"T2 · 2.1.2","vf":true,"img":"../img/t2/lingote_cobre.jpg","cap":{"es":"Lingote de cobre, Chipre, h. 1600 a. C. (27,4 kg)","en":"Copper ingot, Cyprus, c. 1600 BC (27.4 kg)"}},{"id":"happ-card-t2-9","f":"C","t":2,"q":{"es":"El arco compuesto es una invención egipcia del Imperio Antiguo.","en":"The composite bow is an Egyptian invention of the Old Kingdom."},"x":{"es":"Lo fabricaban los hicsos; los egipcios lo adoptan tras las guerras contra ellos y florece en el Imperio Nuevo. Se elabora con varias partes, frente al arco simple de una sola pieza de madera.","en":"It was made by the Hyksos; the Egyptians adopted it after the wars against them and it flourished in the New Kingdom. It is built from several parts, unlike the single-piece wooden self bow."},"s":"T2 · 2.1.2","vf":false},{"id":"happ-card-t2-10","f":"M","t":2,"q":{"es":"El carro egipcio se usaba sobre todo en carreras de competición.","en":"The Egyptian chariot was mainly used in competitive races."},"x":{"es":"Tirado por dos caballos, se usó para la guerra y la caza, nunca en carreras. Pesaba unos 24 kg, alcanzaba 38 km/h y tenía chasis de fresno o acacia, cuerpo de piel de cabra y ruedas de un metro con 4 o 6 radios.","en":"Drawn by two horses, it was used for war and hunting, never for racing. It weighed about 24 kg, reached 38 km/h and had an ash or acacia frame, a goatskin body and one-metre wheels with 4 or 6 spokes."},"s":"T2 · 2.1.2","vf":false},{"id":"happ-card-t2-11","f":"F","t":2,"q":{"es":"Este relieve documenta una carrera de carros.","en":"This relief documents a chariot race."},"x":{"es":"Es una escena de batalla. Los faraones dejaron registros extraordinarios de caza y guerra con el carro, pero no hay constancia de carreras.","en":"It is a battle scene. Pharaohs left extraordinary records of hunting and war with the chariot, but there is no evidence of races."},"s":"T2 · 2.1.2","vf":false,"img":"../img/t2/ramses_kadesh.jpg","cap":{"es":"Ramsés II en Kadesh, Abu Simbel, h. 1274 a. C.","en":"Ramesses II at Kadesh, Abu Simbel, c. 1274 BC"}},{"id":"happ-card-t2-12","f":"S","t":2,"q":{"es":"La caza en las marismas estuvo siempre abierta a todo el pueblo.","en":"Marsh hunting was always open to all the people."},"x":{"es":"Al principio estaba reservada a la realeza; a partir del Imperio Antiguo se abre a la corte y la alta aristocracia. En las tumbas de los nobles se representa a mayor tamaño que cualquier otra actividad.","en":"At first it was reserved for royalty; from the Old Kingdom it opened to the court and the high aristocracy. In nobles' tombs it is depicted larger than any other activity."},"s":"T2 · 2.1.3","vf":false},{"id":"happ-card-t2-13","f":"M","t":2,"q":{"es":"Estos objetos se usaban para cazar aves en las marismas.","en":"These objects were used to hunt birds in the marshes."},"x":{"es":"La caza en las marismas combinaba aves con arco o bastón arrojadizo, mamíferos y arponeo de peces, con perros amaestrados en cotos privados.","en":"Marsh hunting combined birds with bow or throwing stick, mammals and fish spearing, with trained dogs on private reserves."},"s":"T2 · 2.1.3","vf":true,"img":"../img/t2/bastones_arrojadizos.jpg","cap":{"es":"Bastones arrojadizos de Tutankamón, h. 1325 a. C.","en":"Throwing sticks of Tutankhamun, c. 1325 BC"}},{"id":"happ-card-t2-14","f":"F","t":2,"q":{"es":"La escena muestra al noble cazando aves con bastón arrojadizo.","en":"The scene shows the noble hunting birds with a throwing stick."},"x":{"es":"Que la caza aparezca a mayor tamaño que cualquier otra actividad en las tumbas de los nobles indica el valor simbólico que tenía para la aristocracia.","en":"That hunting appears larger than any other activity in nobles' tombs points to its symbolic value for the aristocracy."},"s":"T2 · 2.1.3","vf":true,"img":"../img/t2/caza_aves_baston.jpg","cap":{"es":"Tumba tebana, Sheikh Abd el-Qurna, h. 1400 a. C.","en":"Theban tomb, Sheikh Abd el-Qurna, c. 1400 BC"}},{"id":"happ-card-t2-15","f":"F","t":2,"q":{"es":"Este jeroglífico significa «natación».","en":"This hieroglyph means 'swimming'."},"x":{"es":"La autobiografía de Khety de Siut afirma que el rey le permitió recibir lecciones de natación junto a sus hijos, lo que acredita una enseñanza reglada con maestro y grupo.","en":"The autobiography of Khety of Siut states that the king allowed him to take swimming lessons with his children, which attests to formal teaching with an instructor and a group."},"s":"T2 · 2.1.3","vf":true,"img":"../img/t2/jeroglifico_natacion.jpg","cap":{"es":"Jeroglífico","en":"Hieroglyph"}},{"id":"happ-card-t2-16","f":"M","t":2,"q":{"es":"Las representaciones egipcias permiten afirmar que ya se nadaba a crol y a braza.","en":"Egyptian depictions prove that crawl and breaststroke were already swum."},"x":{"es":"Algunos autores han querido reconocer esos estilos, pero otros advierten de que la técnica antigua no puede equipararse a la moderna.","en":"Some authors have tried to identify those strokes, but others warn that ancient technique cannot be equated with modern strokes."},"s":"T2 · 2.1.3","vf":false},{"id":"happ-card-t2-17","f":"M","t":2,"q":{"es":"Esta arma pertenece al ejército profesional del Imperio Nuevo.","en":"This weapon belongs to the professional army of the New Kingdom."},"x":{"es":"Es de la dinastía XII, en el Imperio Medio (h. 1981-1802 a. C.). El ejército profesional permanente llega después, con el Imperio Nuevo, tras la ocupación hicsa.","en":"It dates from the 12th Dynasty, in the Middle Kingdom (c. 1981-1802 BC). The permanent professional army came later, with the New Kingdom, after the Hyksos occupation."},"s":"T2 · 2.1.4","vf":false,"img":"../img/t2/hacha_batalla.jpg","cap":{"es":"Hacha de batalla, dinastía XII, Metropolitan Museum","en":"Battle axe, 12th Dynasty, Metropolitan Museum"}},{"id":"happ-card-t2-18","f":"M","t":2,"q":{"es":"El khopesh es una espada curva de bronce.","en":"The khopesh is a curved bronze sword."},"x":{"es":"Mide 57,5 cm y formaba parte del equipo del soldado del Imperio Nuevo junto al arco compuesto, la lanza corta y el escudo de madera reforzado con cuero.","en":"It measures 57.5 cm and was part of the New Kingdom soldier's kit, alongside the composite bow, short spear and leather-reinforced wooden shield."},"s":"T2 · 2.1.4","vf":true},{"id":"happ-card-t2-19","f":"F","t":2,"q":{"es":"Estas piezas proceden del Metropolitan Museum de Nueva York.","en":"These pieces are held in the Metropolitan Museum, New York."},"x":{"es":"Los modelos funerarios del Imperio Medio son una fuente indirecta sobre el armamento egipcio antes del ejército profesional.","en":"Middle Kingdom funerary models are an indirect source on Egyptian weaponry before the professional army."},"s":"T2 · 2.1.4","vf":true,"img":"../img/t2/escudo_lanzas_modelo.jpg","cap":{"es":"Escudo, estuche y lanzas modelo, dinastía XII","en":"Model shield, case and spears, 12th Dynasty"}},{"id":"happ-card-t2-20","f":"S","t":2,"q":{"es":"La corona azul la usaban los faraones del Imperio Nuevo en campaña.","en":"The blue crown was worn by New Kingdom pharaohs on campaign."},"x":{"es":"El equipo incluía túnica de cuero con placas de bronce, protección de tiras de lino, arco compuesto, khopesh, lanza corta y escudos de madera o fibra vegetal.","en":"The kit included a leather tunic with bronze plates, linen strip protection, composite bow, khopesh, short spear and wooden or plant-fibre shields."},"s":"T2 · 2.1.4","vf":true},{"id":"happ-card-t2-21","f":"M","t":2,"q":{"es":"Los luchadores de Beni Hasan competían con ropa de soldado y casco.","en":"The Beni Hasan wrestlers competed in soldiers' clothing and helmets."},"x":{"es":"Competían desnudos salvo por un cinturón de tela, y las 219 parejas se distinguen por el color de la piel, marrón oscuro y claro, con proyecciones sobre el hombro, volteos de cadera y llaves de brazo.","en":"They competed naked except for a cloth belt, and the 219 pairs are told apart by skin colour, dark and light brown, with shoulder throws, hip throws and arm locks."},"s":"T2 · 2.1.4","vf":false,"img":"../img/t2/beni_hasan_lucha.jpg","cap":{"es":"Tumba de Baqet III, Beni Hasan, h. 2000 a. C.","en":"Tomb of Baqet III, Beni Hasan, c. 2000 BC"}},{"id":"happ-card-t2-22","f":"L","t":2,"q":{"es":"Las tumbas de Beni Hasan pertenecen a nomarcas del Imperio Nuevo.","en":"The Beni Hasan tombs belong to New Kingdom nomarchs."},"x":{"es":"Son del Imperio Medio (dinastías XI-XII, h. 2000 a. C.), de los príncipes del Nomo del Antílope. La lucha es el deporte más abundante en el registro egipcio.","en":"They date from the Middle Kingdom (11th-12th Dynasties, c. 2000 BC), princes of the Antelope Nome. Wrestling is the most abundant sport in the Egyptian record."},"s":"T2 · 2.1.4","vf":false},{"id":"happ-card-t2-23","f":"S","t":2,"q":{"es":"La esgrima de bastón (tahtib) la practicaban exclusivamente soldados.","en":"Stick fencing (tahtib) was practised exclusively by soldiers."},"x":{"es":"El faldellín militar aparece en todas las fuentes. Bastones de unos 100 cm con cazoleta, y protectores de cuero en frente, barbilla y antebrazo. También se celebraban combates rituales ante el faraón.","en":"The military kilt appears in every source. Sticks of about 100 cm with a hand guard, and leather protectors on forehead, chin and forearm. Ritual bouts were also held before the pharaoh."},"s":"T2 · 2.1.4","vf":true},{"id":"happ-card-t2-24","f":"M","t":2,"q":{"es":"El boxeo está tan documentado en Egipto como la lucha.","en":"Boxing is as well documented in Egypt as wrestling."},"x":{"es":"Su presencia es marginal: la única evidencia indiscutible son seis parejas de púgiles con los puños sin protección en la tumba de Kheruef, vestidos con faldellín de soldado.","en":"Its presence is marginal: the only indisputable evidence is six pairs of bare-fisted boxers in the tomb of Kheruef, wearing soldiers' kilts."},"s":"T2 · 2.1.4","vf":false},{"id":"happ-card-t2-25","f":"F","t":2,"q":{"es":"Este ostracon muestra un combate de esgrima con palos entre dos soldados.","en":"This ostracon shows a stick-fencing bout between two soldiers."},"x":{"es":"Caliza de 8,7 x 8,7 cm dibujada en negro y rojo, con dos soldados con coraza y faldellín (1295-1069 a. C.).","en":"Limestone, 8.7 x 8.7 cm, drawn in black and red, with two soldiers in cuirass and kilt (1295-1069 BC)."},"s":"T2 · 2.1.4","vf":true,"img":"../img/t2/ostracon_esgrima.jpg","cap":{"es":"Ostracon de Deir el-Medina, época ramésida, Louvre","en":"Ostracon from Deir el-Medina, Ramesside period, Louvre"}},{"id":"happ-card-t2-26","f":"F","t":2,"q":{"es":"El relieve recoge tiro con arco, esgrima con palos y lucha.","en":"The relief records archery, stick fencing and wrestling."},"x":{"es":"Los combates se celebraban en tres contextos: preparación militar, ceremonias en presencia del rey y cultos religiosos (Decker, 1992).","en":"Bouts took place in three contexts: military training, ceremonies in the king's presence and religious cults (Decker, 1992)."},"s":"T2 · 2.1.4","vf":true,"img":"../img/t2/medinet_habu_calco.jpg","cap":{"es":"Calco de Medinet Habu, templo de Ramsés III, h. 1170 a. C.","en":"Tracing from Medinet Habu, temple of Ramesses III, c. 1170 BC"}},{"id":"happ-card-t2-27","f":"M","t":2,"q":{"es":"La carrera de la estela de Taharqa se corrió de un tirón, sin ningún descanso.","en":"The race on the stela of Taharqa was run in one go, without any rest."},"x":{"es":"En el año 6 de Taharqa (h. 685 a. C.) las tropas de élite corrieron 50 km nocturnos en 4 horas, tuvieron un descanso reglamentario de 2 horas y cubrieron otros 50 km de vuelta.","en":"In Taharqa's 6th year (c. 685 BC) the elite troops ran 50 km by night in 4 hours, had a compulsory 2-hour rest and covered another 50 km on the way back."},"s":"T2 · 2.1.4","vf":false},{"id":"happ-card-t2-28","f":"M","t":2,"q":{"es":"Las justas de pescadores tenían reglamento y árbitro.","en":"Fishermen's jousts had rules and a referee."},"x":{"es":"No había reglamento ni árbitro; las reglas se pactaban sobre la marcha. El objetivo era hacer caer al agua a la tripulación contraria con las pértigas o el agarre directo.","en":"There were no rules or referee; rules were agreed on the spot. The aim was to knock the rival crew into the water with poles or direct grappling."},"s":"T2 · 2.1.5","vf":false},{"id":"happ-card-t2-29","f":"S","t":2,"q":{"es":"La justa de pescadores era un pasatiempo de la aristocracia.","en":"The fishermen's joust was a pastime of the aristocracy."},"x":{"es":"Pertenece al pueblo llano y es una de sus pocas prácticas documentadas, con dos a cuatro tripulaciones en canoas de papiro de tres a seis hombres cada una.","en":"It belongs to the common people and is one of their few documented practices, with two to four crews in papyrus canoes of three to six men each."},"s":"T2 · 2.1.5","vf":false},{"id":"happ-card-t2-30","f":"S","t":2,"q":{"es":"El senet solo lo jugaban hombres.","en":"Senet was played only by men."},"x":{"es":"Lo jugaban las élites de ambos sexos, y es la única práctica egipcia en la que la mujer aparece en igualdad con el hombre. Su nombre viene de snt, «pasar» o «cruzar», y el tablero tenía 30 casillas en tres filas de diez.","en":"It was played by the elites of both sexes, and it is the only Egyptian practice in which women appear on an equal footing with men. Its name comes from snt, “to pass” or “to cross”, and the board had 30 squares in three rows of ten."},"s":"T2 · 2.1.6","vf":false},{"id":"happ-card-t2-31","f":"M","t":2,"q":{"es":"Para mover las fichas se usaban dados cúbicos.","en":"Cubic dice were used to move the pieces."},"x":{"es":"Se sacaban palos o huesos de animal marcados con números de un saco. Las fichas avanzaban en zigzag de la casilla 1 a la 30.","en":"Marked sticks or animal bones were drawn from a bag. Pieces advanced in a zigzag from square 1 to 30."},"s":"T2 · 2.1.6","vf":false},{"id":"happ-card-t2-32","f":"S","t":2,"q":{"es":"En la iconografía egipcia los juegos de pelota aparecen practicados casi exclusivamente por mujeres y niñas.","en":"In Egyptian iconography ball games appear almost exclusively played by women and girls."},"x":{"es":"Juegos malabares, a caballito, pases rítmicos con palmadas o lanzamientos altos con recepciones acrobáticas.","en":"Juggling, piggy-back games, rhythmic passes with clapping or high throws with acrobatic catches."},"s":"T2 · 2.1.6","vf":true},{"id":"happ-card-t2-33","f":"M","t":2,"q":{"es":"Las pelotas egipcias se hacían principalmente de cuerda apretada, cuero y lino.","en":"Egyptian balls were mostly made of tightly wound cord, leather and linen."},"x":{"es":"Se han hallado numerosas pelotas en tumbas. El British Museum conserva una pelota-sonajero hueca de lino con piedrecillas dentro, de época romana.","en":"Many balls have been found in tombs. The British Museum keeps a hollow linen rattle-ball with pebbles inside, from the Roman period."},"s":"T2 · 2.1.6","vf":true},{"id":"happ-card-t2-34","f":"C","t":2,"q":{"es":"El imperio aqueménida lo fundó Darío I en el 330 a. C.","en":"The Achaemenid empire was founded by Darius I in 330 BC."},"x":{"es":"Lo fundó Ciro II en el 550 a. C., tras derrotar a los medos, y en tres generaciones se extendió del Egeo al Indo. El 330 a. C. marca, por el contrario, su final.","en":"It was founded by Cyrus II in 550 BC, after defeating the Medes, and within three generations it stretched from the Aegean to the Indus. The year 330 BC marks, on the contrary, its end."},"s":"T2 · 2.2.1","vf":false},{"id":"happ-card-t2-35","f":"F","t":2,"q":{"es":"Del deporte persa antiguo se conservan descripciones escritas por los propios persas.","en":"Descriptions of ancient Persian sport written by Persians themselves survive."},"x":{"es":"No se conserva ninguna, y las principales fuentes son griegas (Heródoto, Jenofonte y Estrabón). La más extensa sobre la educación persa es la Ciropedia de Jenofonte.","en":"None survive, and the main sources are Greek (Herodotus, Xenophon and Strabo). The longest on Persian education is Xenophon's Cyropaedia."},"s":"T2 · 2.2.1","vf":false},{"id":"happ-card-t2-36","f":"S","t":2,"q":{"es":"En Persia la legitimidad del rey se demostraba con el cuerpo, a través del arco y la caza.","en":"In Persia the king's legitimacy was shown through the body, by means of the bow and the hunt."},"x":{"es":"Ambas prácticas se ejecutan ante una multitud, exigen años de entrenamiento y su resultado depende solo del rey. Nadie le gana.","en":"Both practices are performed before a crowd, require years of training and their outcome depends on the king alone. Nobody beats him."},"s":"T2 · 2.2.2","vf":true},{"id":"happ-card-t2-37","f":"S","t":2,"q":{"es":"Según Heródoto, los jóvenes persas aprendían a montar, disparar el arco y decir la verdad.","en":"According to Herodotus, young Persians learned to ride, shoot the bow and tell the truth."},"x":{"es":"De los cinco a los veinte años; Estrabón alarga la formación hasta los veinticuatro. Según Jenofonte era masculina y obligatoria, asumida por el Estado.","en":"From the age of five to twenty; Strabo extends training to twenty-four. According to Xenophon it was male and compulsory, run by the state."},"s":"T2 · 2.2.3","vf":true},{"id":"happ-card-t2-38","f":"P","t":2,"q":{"es":"El pahlavan es un luchador profesional que aparece en el mundo persa a partir del siglo X.","en":"The pahlavan is a professional wrestler who appears in the Persian world from the tenth century."},"x":{"es":"«El campeón», que se gana la vida con su cuerpo, surge cuando ya no hay rey ni nobleza de a caballo a quienes servir y la vida se organiza en la ciudad y el bazar.","en":"'The champion', who earns his living with his body, emerges once there is no king or mounted nobility to serve and life is organised around the city and the bazaar."},"s":"T2 · 2.2.3","vf":true},{"id":"happ-card-t2-39","f":"L","t":2,"q":{"es":"La puerta del zurkhaneh es deliberadamente baja para obligar a agacharse al entrar.","en":"The zurkhaneh door is deliberately low so that one must bow to enter."},"x":{"es":"«La casa de fuerza» es una sala abovedada con foso central de arcilla, sin fachada ni carteles, en los callejones del bazar. La primera lección es de humildad.","en":"'The house of strength' is a vaulted hall with a central clay pit, with no façade or signs, in the bazaar's alleys. The first lesson is humility."},"s":"T2 · 2.2.3","vf":true},{"id":"happ-card-t2-40","f":"M","t":2,"q":{"es":"En el zurkhaneh la sesión se ejecuta al ritmo de música en directo.","en":"In the zurkhaneh the session is performed to live music."},"x":{"es":"Entre diez y veinte hombres siguen al atleta más consumado desde el centro del foso: calentamiento, tablones, flexiones al compás del tambor y volteo de mazas por detrás de los hombros.","en":"Ten to twenty men follow the most accomplished athlete from the centre of the pit: warm-up, boards, push-ups to the drum and swinging clubs behind the shoulders."},"s":"T2 · 2.2.3","vf":true},{"id":"happ-card-t2-41","f":"M","t":2,"q":{"es":"El jereed es un deporte de jabalina a caballo para entrenar el ataque y la huida.","en":"Jereed is a mounted javelin sport for training attack and retreat."},"x":{"es":"Desde el siglo XI. Dos equipos de ocho a diez jinetes; uno lanza y huye al galope mientras los rivales lo persiguen con jabalinas de madera sin punta.","en":"From the eleventh century. Two teams of eight to ten riders; one throws and gallops off while rivals chase him with blunt wooden javelins."},"s":"T2 · 2.2.4","vf":true},{"id":"happ-card-t2-42","f":"C","t":2,"q":{"es":"El jereed es el antecesor directo del polo moderno.","en":"Jereed is the direct ancestor of modern polo."},"x":{"es":"El antecesor del polo es el chovgan, deporte colectivo a caballo con pelota y taco consolidado en el periodo sasánida. El jereed es un juego de jabalina.","en":"Polo's ancestor is chovgan, a mounted team game with ball and mallet consolidated in the Sasanian period. Jereed is a javelin game."},"s":"T2 · 2.2.4","vf":false},{"id":"happ-card-t2-43","f":"C","t":2,"q":{"es":"Fenicia llegó a constituir un Estado unificado con un solo rey.","en":"Phoenicia became a unified state under a single king."},"x":{"es":"Fueron ciudades-estado independientes y a menudo rivales (Biblos, Sidón, Tiro), cada una con su rey, su flota y su moneda, aunque compartían lengua y religión.","en":"They were independent and often rival city-states (Byblos, Sidon, Tyre), each with its own king, fleet and coinage, although they shared language and religion."},"s":"T2 · 2.3.1","vf":false},{"id":"happ-card-t2-44","f":"L","t":2,"q":{"es":"Cartago significa «ciudad vieja» en fenicio.","en":"Carthage means “old city” in Phoenician."},"x":{"es":"Qart-ḥadašt significa «ciudad nueva». La fundaron colonos de Tiro, y hacia el 227 a. C. Asdrúbal fundó una segunda en la actual Cartagena, la Carthago Nova de los romanos.","en":"Qart-ḥadašt means “new city”. It was founded by settlers from Tyre, and around 227 BC Hasdrubal founded a second one at present-day Cartagena, the Romans' Carthago Nova."},"s":"T2 · 2.3.1","vf":false},{"id":"happ-card-t2-45","f":"C","t":2,"q":{"es":"El alfabeto fue inventado por los fenicios.","en":"The alphabet was invented by the Phoenicians."},"x":{"es":"Nació hacia 1800 a. C. entre trabajadores semitas de las minas del Sinaí. Los fenicios lo heredaron, lo fijaron en 22 signos consonánticos y lo difundieron por el Mediterráneo.","en":"It arose around 1800 BC among Semitic workers in the Sinai mines. The Phoenicians inherited it, fixed it at 22 consonantal signs and spread it across the Mediterranean."},"s":"T2 · 2.3.1","vf":false},{"id":"happ-card-t2-46","f":"C","t":2,"q":{"es":"Los fenicios se guiaban en el mar por la Osa Mayor, igual que los griegos.","en":"The Phoenicians steered by the Great Bear, like the Greeks."},"x":{"es":"Se guiaban por la Osa Menor, más próxima al polo y por tanto más estable que la Osa Mayor que usaban los griegos. La navegación fue su actividad por excelencia, como refleja esta nave de guerra sobre un hipocampo.","en":"They steered by the Little Bear, closer to the pole and therefore steadier than the Great Bear used by the Greeks. Seafaring was their defining activity, as this warship above a hippocamp shows."},"s":"T2 · 2.3.1","vf":false},{"id":"happ-card-t2-47","f":"M","t":2,"q":{"es":"El trirreme Olympias reconstruido en 1987 llevaba 170 remeros en tres niveles.","en":"The trireme Olympias, reconstructed in 1987, carried 170 rowers on three levels."},"x":{"es":"Arqueología experimental para contrastar a Tucídides: remos de 12 kg y turnos de remo y descanso. Tucídides decía que una nave cubría 340 km en 24 h a unos 14 km/h.","en":"Experimental archaeology to test Thucydides: 12 kg oars and rowing and rest shifts. Thucydides said a ship covered 340 km in 24 h at about 14 km/h."},"s":"T2 · 2.3.2","vf":true},{"id":"happ-card-t2-48","f":"F","t":2,"q":{"es":"El pecio Mazarrón 2 se extrajo del agua en 2024, desmontado en 22 piezas.","en":"The Mazarrón 2 wreck was lifted from the water in 2024, dismantled into 22 pieces."},"x":{"es":"Barco mercante costero de 8,15 m de eslora, fechado entre finales del siglo VII y el primer tercio del VI a. C., a cuarenta minutos de la facultad.","en":"Coastal merchant vessel 8.15 m long, dated between the late seventh and the first third of the sixth century BC, forty minutes from the faculty."},"s":"T2 · 2.3.2","vf":true},{"id":"happ-card-t2-49","f":"F","t":2,"q":{"es":"Mazarrón 1 conserva el casco casi entero.","en":"Mazarrón 1 preserves the hull almost complete."},"x":{"es":"De Mazarrón 1 (1988) se conserva sobre todo la quilla, de casi cuatro metros. El casco casi entero es el de Mazarrón 2 (1995).","en":"Of Mazarrón 1 (1988) mainly the keel survives, nearly four metres long. The almost complete hull is Mazarrón 2 (1995)."},"s":"T2 · 2.3.2","vf":false},{"id":"happ-card-t2-50","f":"F","t":2,"q":{"es":"Kharayeb es el único conjunto que muestra cuerpos fenicios en actividad lúdica.","en":"Kharayeb is the only assemblage showing Phoenician bodies at play."},"x":{"es":"16.400 fragmentos, con un 35 % de niños y un 22 % de mujeres. Entre los 2 y 4 años juegan con pájaros y perros; entre los 5 y 8 el perro es sustituido por una pelota.","en":"16,400 fragments, 35 % children and 22 % women. Aged 2 to 4 they play with birds and dogs; aged 5 to 8 the dog is replaced by a ball."},"s":"T2 · 2.3.3","vf":true},{"id":"happ-card-t2-51","f":"M","t":2,"q":{"es":"Este objeto servía para lanzar jabalinas.","en":"This object was used to throw javelins."},"x":{"es":"Es un estrígil, instrumento curvo para raspar el aceite y el sudor del cuerpo tras el ejercicio. Aparece entre los materiales de Kharayeb.","en":"It is a strigil, a curved tool for scraping oil and sweat from the body after exercise. It appears among the Kharayeb material."},"s":"T2 · 2.3.3","vf":false,"img":"../img/t2/estrigil.jpg","cap":{"es":"Estrígil","en":"Strigil"}},{"id":"happ-card-t2-52","f":"S","t":2,"q":{"es":"Las prácticas corporales femeninas fenicias están documentadas sobre todo en el ámbito funerario y ritual.","en":"Phoenician women's bodily practices are documented mainly in funerary and ritual contexts."},"x":{"es":"Músicas, bailarinas y plañideras en procesiones y enterramientos. La pátera muestra una danza ritual femenina ante una diosa.","en":"Musicians, dancers and mourners in processions and burials. The patera shows a female ritual dance before a goddess."},"s":"T2 · 2.3.3","vf":true},{"id":"happ-card-t2-53","f":"M","t":2,"q":{"es":"Entre las llaves pintadas en Beni Hasan abundan los puñetazos y los mordiscos.","en":"Punches and bites are common among the holds painted at Beni Hasan."},"x":{"es":"Aparecen proyecciones sobre el hombro, volteos de cadera, tirones y zancadillas, mientras que faltan de forma sistemática los puñetazos, los mordiscos y las luxaciones severas, lo que apunta a un límite no escrito del combate (Decker, 1992).","en":"The paintings show shoulder throws, hip throws, pulls and trips, whereas punches, bites and severe joint locks are systematically absent, which points to an unwritten limit on the fight (Decker, 1992)."},"s":"T2 · 2.1.4","vf":false},{"id":"happ-card-t2-54","f":"C","t":2,"q":{"es":"Egipto contó con un ejército profesional permanente desde el Imperio Antiguo.","en":"Egypt had a permanent professional army from the Old Kingdom onwards."},"x":{"es":"El ejército profesional aparece a partir del Imperio Nuevo, tras la ocupación hicsa, y se convierte en el segundo gran productor de imágenes deportivas del registro egipcio después de la corte.","en":"The professional army appears from the New Kingdom onwards, after the Hyksos occupation, and becomes the second great producer of sporting images in the Egyptian record after the court."},"s":"T2 · 2.1.4","vf":false},{"id":"happ-card-t2-55","f":"F","t":2,"q":{"es":"El análisis de carbono-14 sitúa Mazarrón 2 en el primer tercio del siglo VI a. C.","en":"Carbon-14 analysis places Mazarrón 2 in the first third of the 6th century BC."},"x":{"es":"El barco apareció en 1995 con el casco casi entero y hoy se conserva en el Museo Nacional de Arqueología Subacuática, en Cartagena, mientras que de Mazarrón 1, hallado en 1988, queda sobre todo la quilla.","en":"The boat was found in 1995 with its hull almost intact and is now kept in the National Museum of Underwater Archaeology in Cartagena, whereas mostly the keel survives of Mazarrón 1, found in 1988."},"s":"T2 · 2.3.2","vf":true},{"id":"happ-card-t2-56","f":"F","t":2,"q":{"es":"Está demostrado que el barco lo construyeron carpinteros fenicios.","en":"It is proven that the boat was built by Phoenician carpenters."},"x":{"es":"La atribución sigue abierta: Negueruela lo lee como fenicio por el ensamblaje de mortaja y lengüeta, mientras que Pomey y Guerrero lo atribuyen a carpinteros locales que conocían esa técnica, de modo que documenta sobre todo un contacto técnico entre tradiciones.","en":"The attribution remains open: Negueruela reads it as Phoenician because of its mortise-and-tenon joinery, whereas Pomey and Guerrero attribute it to local carpenters who knew that technique, so it mainly documents technical contact between traditions."},"s":"T2 · 2.3.2","vf":false},{"id":"happ-card-t2-57","f":"F","t":2,"q":{"es":"Las monedas y los cuencos de metal están entre las principales fuentes para conocer a los fenicios.","en":"Coins and metal bowls are among the main sources for knowing the Phoenicians."},"x":{"es":"No se conserva ninguna descripción de actividad física escrita por un fenicio, y casi todo lo demás llega de griegos y romanos, que eran a la vez sus rivales comerciales.","en":"No description of physical activity written by a Phoenician survives, and almost everything else comes from Greeks and Romans, who were also their commercial rivals."},"s":"T2 · 2.3.1","vf":true},{"id":"happ-card-t2-58","f":"M","t":2,"q":{"es":"Los bastones de la esgrima egipcia medían unos dos metros y los esgrimistas no llevaban ninguna protección.","en":"Egyptian fencing sticks were about two metres long and fencers wore no protection at all."},"x":{"es":"Medían alrededor de un metro, con pequeñas guardias para proteger la mano, y los esgrimistas llevaban protectores de cuero en la frente, el mentón y el antebrazo (Decker, 1992).","en":"They were about a metre long, with small guards to protect the hand, and fencers wore leather protectors on the forehead, chin and forearm (Decker, 1992)."},"s":"T2 · 2.1.4","vf":false},{"id":"happ-card-t2-59","f":"S","t":2,"q":{"es":"Además de servir a la instrucción militar, se celebraban combates rituales de esgrima ante el faraón que simbolizaban su regeneración.","en":"Besides military training, ritual fencing bouts were held before the pharaoh to symbolise his regeneration."},"x":{"es":"Es el caso del combate que enmarca la erección del pilar Djed en el jubileo de Amenofis III, y Decker (1992) documenta también combates ofrecidos como parte del ceremonial ante embajadores extranjeros.","en":"One example is the bout that frames the raising of the Djed pillar at the jubilee of Amenhotep III, and Decker (1992) also documents bouts staged as part of the ceremonial before foreign ambassadors."},"s":"T2 · 2.1.4","vf":true},{"id":"happ-card-t2-60","f":"M","t":2,"q":{"es":"El kabbadeh es un arco de hierro con anillas que se balancea durante la sesión.","en":"The kabbadeh is an iron bow with rings that is swung during the session."},"x":{"es":"Forma parte de un orden fijo, con calentamiento, tablones, flexiones al compás del tambor, mazas, giro sobre sí mismo y kabbadeh, y la lucha cerraba la sesión.","en":"It belongs to a fixed sequence of warm-up, boards, push-ups to the drum, clubs, spinning and kabbadeh, and wrestling closed the session."},"s":"T2 · 2.2.3","vf":true},{"id":"happ-card-t2-61","f":"M","t":2,"q":{"es":"En el zurkhaneh cada atleta hace las flexiones a su propio ritmo y sin música.","en":"In the zurkhaneh each athlete does push-ups at his own pace and without music."},"x":{"es":"Se hacen al compás del tambor, y toda la sesión la dirige desde el centro del foso el atleta más consumado de la casa, al ritmo de la música en directo.","en":"They are done to the beat of the drum, and the whole session is led from the centre of the pit by the most accomplished athlete of the house, to live music."},"s":"T2 · 2.2.3","vf":false},{"id":"happ-card-t2-62","f":"S","t":2,"q":{"es":"La lucha que cerraba la sesión se hacía delante de todos para que la derrota fuera pública.","en":"The wrestling that closed the session was held in front of everyone so that defeat would be public."},"x":{"es":"Se practicaba en parejas apartadas del resto, y a menudo se separaba a los contendientes antes de la proyección decisiva para ahorrar a uno de ellos la humillación de perder (Krawietz, 2013).","en":"It was practised in pairs away from the others, and the contenders were often separated before the decisive throw to spare one of them the humiliation of losing (Krawietz, 2013)."},"s":"T2 · 2.2.3","vf":false},{"id":"happ-card-t2-63","f":"F","t":2,"q":{"es":"La Piedra Rosetta contiene tres textos distintos, uno en cada escritura.","en":"The Rosetta Stone contains three different texts, one in each script."},"x":{"es":"Reproduce un mismo decreto sacerdotal en jeroglífico, demótico y griego, y esa triple redacción del mismo texto es la que permitió a Champollion descifrar la escritura egipcia en 1822.","en":"It reproduces a single priestly decree in hieroglyphic, Demotic and Greek, and that triple version of the same text is what allowed Champollion to decipher Egyptian writing in 1822."},"s":"T2 · 2.1.1","vf":false},{"id":"happ-card-t2-64","f":"C","t":2,"q":{"es":"Los egipcios fechaban los acontecimientos con una era continua, como nuestro calendario.","en":"The Egyptians dated events using a continuous era, as our calendar does."},"x":{"es":"Fechaban por año de reinado del monarca, de modo que la cronología se reconstruye sumando reinados a partir de las listas reales.","en":"They dated by the regnal year of the king, so the chronology is reconstructed by adding up reigns from the king lists."},"s":"T2 · 2.1.1","vf":false},{"id":"happ-card-t2-65","f":"F","t":2,"q":{"es":"La iconografía es la fuente más abundante sobre el deporte egipcio.","en":"Iconography is the most abundant source on Egyptian sport."},"x":{"es":"Reúne cerca de dos mil escenas catalogadas en relieves y pinturas de tumba, aunque casi todas proceden de tumbas de la aristocracia, que decidía qué quedaba registrado.","en":"It comprises some two thousand catalogued scenes in reliefs and tomb paintings, although almost all come from aristocratic tombs, whose owners decided what was recorded."},"s":"T2 · 2.1.1","vf":true},{"id":"happ-card-t2-66","f":"C","t":2,"q":{"es":"El egipcio antiguo tenía una palabra general equivalente a «deporte».","en":"Ancient Egyptian had a general word equivalent to “sport”."},"x":{"es":"No hay un término general atestiguado, y el más cercano, sejeméj-ib, significa «hacer que el corazón olvide» y designa la diversión (Cannuyer, 2002, citado en Decker, 2021).","en":"No general term is attested, and the closest, sekhemekh-ib, means “to make the heart forget” and refers to amusement (Cannuyer, 2002, cited in Decker, 2021)."},"s":"T2 · 2.1.1","vf":false},{"id":"happ-card-t2-67","f":"F","t":2,"q":{"es":"Los púgiles de la tumba de Kheruef visten el faldellín de los soldados.","en":"The boxers in the tomb of Kheruef wear the soldiers' kilt."},"x":{"es":"Son seis parejas a puño desnudo, y Decker (1992) observa que varias posturas copian a los danzantes pintados enfrente, de lo que deduce que el artista no conocía bien el pugilato.","en":"There are six bare-fisted pairs, and Decker (1992) notes that several postures copy the dancers painted opposite, from which he infers that the artist did not know boxing well."},"s":"T2 · 2.1.4","vf":true,"img":"../img/t2/boxeo_dibujo.jpg","cap":{"es":"Dibujo de dos púgiles egipcios","en":"Drawing of two Egyptian boxers"}},{"id":"happ-card-t2-68","f":"M","t":2,"q":{"es":"Entre los juegos de pelota egipcios se documentan malabares con hasta tres bolas.","en":"Juggling with up to three balls is among the documented Egyptian ball games."},"x":{"es":"El catálogo incluye también el juego a caballito con lanzamientos entre parejas montadas, los pases rítmicos con palmadas y los lanzamientos altos recogidos en el aire, a veces sobre una sola pierna.","en":"The repertoire also includes piggyback games with throws between mounted pairs, rhythmic passes with hand-claps and high throws caught in the air, sometimes standing on one leg."},"s":"T2 · 2.1.6","vf":true},{"id":"happ-quiz-t3-0","f":"F","t":3,"q":{"es":"¿Qué escritura de Creta corresponde al griego micénico?","en":"Which Cretan script corresponds to Mycenaean Greek?"},"x":{"es":"El lineal B se usó sobre todo para la contabilidad del palacio. Ninguna escritura cretense dejó textos sobre deporte.","en":"Linear B was used mainly for palace accounting. No Cretan script left texts about sport."},"s":"T3 · 3.1","o":[{"es":"El lineal B","en":"Linear B"},{"es":"El lineal A","en":"Linear A"},{"es":"El jeroglífico cretense","en":"Cretan hieroglyphic"},{"es":"La escritura del Disco de Festo","en":"The script of the Phaistos Disc"}]},{"id":"happ-quiz-t3-1","f":"F","t":3,"q":{"es":"¿Qué representan casi todas las escenas deportivas minoicas?","en":"What do almost all Minoan sporting scenes depict?"},"x":{"es":"De unos cien objetos, casi todos muestran el salto del toro y entre un 10 y un 20 % combates sin armas.","en":"Of some hundred objects, almost all show bull-leaping and 10 to 20% unarmed combat."},"s":"T3 · 3.1","o":[{"es":"El salto del toro","en":"Bull-leaping"},{"es":"La carrera a pie","en":"The foot race"},{"es":"La carrera de carros","en":"Chariot racing"},{"es":"La natación","en":"Swimming"}]},{"id":"happ-quiz-t3-2","f":"P","t":3,"q":{"es":"¿Quién gobernaba los reinos micénicos?","en":"Who ruled the Mycenaean kingdoms?"},"x":{"es":"El wanax gobernaba desde palacios fortificados como Micenas o Tirinto.","en":"The wanax ruled from fortified palaces such as Mycenae or Tiryns."},"s":"T3 · 3.1","o":[{"es":"El wanax","en":"The wanax"},{"es":"Los basileis","en":"The basileis"},{"es":"Los helanódicas","en":"The Hellanodikai"},{"es":"El arconte","en":"The archon"}]},{"id":"happ-quiz-t3-3","f":"F","t":3,"q":{"es":"¿Qué texto narra los juegos fúnebres de Patroclo?","en":"Which text narrates the funeral games of Patroclus?"},"x":{"es":"Aquiles organiza ocho pruebas premiadas con calderos, trípodes, caballos, bueyes y mujeres, y actúa como juez.","en":"Achilles organises eight events rewarded with cauldrons, tripods, horses, oxen and women, and acts as judge."},"s":"T3 · 3.1","o":[{"es":"El canto 23 de la Ilíada","en":"Book 23 of the Iliad"},{"es":"La Odisea","en":"The Odyssey"},{"es":"Las Historias de Heródoto","en":"Herodotus's Histories"},{"es":"Una oda de Píndaro","en":"An ode by Pindar"}]},{"id":"happ-quiz-t3-4","f":"S","t":3,"q":{"es":"¿Cuánto cobraba un paidotriba corriente en Atenas?","en":"How much did an ordinary trainer charge in Athens?"},"x":{"es":"Una familia de cuatro vivía con media dracma diaria, y a la clase se sumaban el aceite y las horas sin trabajar.","en":"A family of four lived on half a drachma a day, and oil and hours without work were added to the fee."},"s":"T3 · 3.2.1","o":[{"es":"De 10 a 15 dracmas por alumno y año","en":"10 to 15 drachmas per pupil a year"},{"es":"100 dracmas al año","en":"100 drachmas a year"},{"es":"1.200 dracmas","en":"1,200 drachmas"},{"es":"Nada, era un servicio público","en":"Nothing, it was a public service"}]},{"id":"happ-quiz-t3-5","f":"L","t":3,"q":{"es":"¿Qué polis administraba el santuario de Olimpia?","en":"Which polis administered the sanctuary of Olympia?"},"x":{"es":"Élide controlaba la admisión, fijaba el reglamento y nombraba entre sus ciudadanos a los jueces.","en":"Elis controlled admission, set the rules and appointed the judges from among its citizens."},"s":"T3 · 3.2.4","o":[{"es":"Élide","en":"Elis"},{"es":"Pisa","en":"Pisa"},{"es":"Esparta","en":"Sparta"},{"es":"Atenas","en":"Athens"}]},{"id":"happ-quiz-t3-6","f":"M","t":3,"q":{"es":"¿Qué eran los tetras?","en":"What was the tetrad?"},"x":{"es":"Preparación, esfuerzo total, relajación y esfuerzo moderado. Filóstrato los criticó por excesivos.","en":"Preparation, all-out effort, relaxation and moderate effort. Philostratus criticised it as excessive."},"s":"T3 · 3.2.3","o":[{"es":"Un microciclo de entrenamiento de cuatro días","en":"A four-day training microcycle"},{"es":"Una dieta de cuatro días sin cereales","en":"A four-day diet without cereals"},{"es":"Una carrera de relevos de cuatro estadios","en":"A relay race over four stades"},{"es":"Un tribunal de cuatro helanódicas","en":"A tribunal of four Hellanodikai"}]},{"id":"happ-quiz-t3-7","f":"S","t":3,"q":{"es":"¿Cuánto duraba la concentración obligatoria en Élide?","en":"How long did the compulsory gathering at Elis last?"},"x":{"es":"De una luna llena a la siguiente, bajo la vigilancia de los helanódicas. Servía para filtrar a los aspirantes.","en":"From one full moon to the next, under the watch of the Hellanodikai. It served to filter the candidates."},"s":"T3 · 3.2.4","o":[{"es":"Treinta días","en":"Thirty days"},{"es":"Una semana","en":"One week"},{"es":"Tres meses","en":"Three months"},{"es":"Un año","en":"One year"}]},{"id":"happ-quiz-t3-8","f":"C","t":3,"q":{"es":"¿Qué título recibía quien vencía en Olimpia, Delfos, el Istmo y Nemea?","en":"What title did someone who won at Olympia, Delphi, the Isthmus and Nemea receive?"},"x":{"es":"«Vencedor del circuito» panhelénico.","en":"'Victor of the Panhellenic circuit'."},"s":"T3 · 3.2.4","o":[{"es":"Periodonikes","en":"Periodonikes"},{"es":"Áristos","en":"Aristos"},{"es":"Helanódica","en":"Hellanodikes"},{"es":"Espondóforo","en":"Spondophoros"}]},{"id":"happ-quiz-t3-9","f":"L","t":3,"q":{"es":"¿Cuánto medía la pista del estadio de Olimpia?","en":"How long was the track of the stadium of Olympia?"},"x":{"es":"Un estadio eran 600 pies, y como el pie variaba de una ciudad a otra, la pista de Olimpia medía 192,27 m.","en":"A stadion was 600 feet, and since the foot varied from city to city, the track at Olympia measured 192.27 m."},"s":"T3 · 3.2.5","o":[{"es":"192,27 metros","en":"192.27 metres"},{"es":"384,56 metros","en":"384.56 metres"},{"es":"600 metros","en":"600 metres"},{"es":"100 metros","en":"100 metres"}]},{"id":"happ-quiz-t3-10","f":"M","t":3,"q":{"es":"¿Cuántas victorias daban el triunfo en el pentatlón?","en":"How many victories gave the win in the pentathlon?"},"x":{"es":"Es la regla mejor documentada. La lucha cerraba siempre la prueba.","en":"It is the best-documented rule. Wrestling always closed the event."},"s":"T3 · 3.2.5","o":[{"es":"Tres de cinco","en":"Three out of five"},{"es":"Dos de cinco","en":"Two out of five"},{"es":"Las cinco","en":"All five"},{"es":"Cuatro de cinco","en":"Four out of five"}]},{"id":"happ-quiz-t3-11","f":"M","t":3,"q":{"es":"¿Cómo se vencía en la lucha?","en":"How was a wrestling bout won?"},"x":{"es":"Contaba la caída que tocaba el suelo con cadera, espalda u hombros.","en":"A fall counted when the hip, back or shoulders touched the ground."},"s":"T3 · 3.2.5","o":[{"es":"Sumando tres caídas","en":"By scoring three falls"},{"es":"Por fuera de combate","en":"By knockout"},{"es":"Por puntos de los jueces","en":"On the judges' points"},{"es":"Al caer la noche","en":"When night fell"}]},{"id":"happ-quiz-t3-12","f":"P","t":3,"q":{"es":"¿Quién murió en la final de pancracio de 564 a. C. y fue coronado?","en":"Who died in the pankration final of 564 BC and was crowned?"},"x":{"es":"Murió asfixiado mientras dislocaba el pie de su rival, que se rindió. Los jueces coronaron su cadáver.","en":"He died of strangulation while dislocating his opponent's foot; the opponent conceded. The judges crowned his corpse."},"s":"T3 · 3.2.5","o":[{"es":"Arriquión","en":"Arrhichion"},{"es":"Milón de Crotona","en":"Milo of Croton"},{"es":"Corebo de Élide","en":"Koroibos of Elis"},{"es":"Orsipo de Mégara","en":"Orsippos of Megara"}]},{"id":"happ-quiz-t3-13","f":"P","t":3,"q":{"es":"¿Quién ganó la carrera de cuadrigas de 396 a. C.?","en":"Who won the four-horse chariot race of 396 BC?"},"x":{"es":"La corona de la hípica era para el dueño de las monturas, aunque fuera una mujer.","en":"The equestrian wreath went to the owner of the horses, even if she was a woman."},"s":"T3 · 3.2.5","o":[{"es":"Cinisca, princesa espartana","en":"Kyniska, a Spartan princess"},{"es":"Calipátira, madre de Rodas","en":"Kallipateira, a mother from Rhodes"},{"es":"Alcibíades, general ateniense","en":"Alcibiades, an Athenian general"},{"es":"Arriquión, pancratista de Figalia","en":"Arrhichion, a pankratiast from Phigalia"}]},{"id":"happ-quiz-t3-14","f":"S","t":3,"q":{"es":"¿Con qué se pagaban los zanes?","en":"What paid for the Zanes?"},"x":{"es":"Los seis primeros se pagaron en 388 a. C. con las multas a un púgil que compró a sus rivales y a los tres que aceptaron su dinero.","en":"The first six were paid for in 388 BC with the fines of a boxer who bought his rivals and of the three who took his money."},"s":"T3 · 3.2.6","o":[{"es":"Con las multas a los infractores","en":"With the fines of offenders"},{"es":"Con el tesoro de Élide","en":"With the treasury of Elis"},{"es":"Con donativos de los vencedores","en":"With donations from victors"},{"es":"Con la venta de entradas","en":"With ticket sales"}]},{"id":"happ-quiz-t3-15","f":"P","t":3,"q":{"es":"Según la tradición, ¿cuántas coronas trajo Nerón de Grecia?","en":"According to tradition, how many wreaths did Nero bring back from Greece?"},"x":{"es":"Hizo aplazar la Olimpiada, añadió pruebas nuevas y ganó todas aquellas en las que se inscribió.","en":"He had the Olympiad postponed, added new events and won every one he entered."},"s":"T3 · 3.2.7","o":[{"es":"1.808","en":"1,808"},{"es":"1.208","en":"1,208"},{"es":"3.000","en":"3,000"},{"es":"2.120","en":"2,120"}]},{"id":"happ-quiz-t3-16","f":"C","t":3,"q":{"es":"¿Por qué terminaron los Juegos de Olimpia, según Remijsen (2015)?","en":"Why did the Olympic Games end, according to Remijsen (2015)?"},"x":{"es":"En los siglos IV y V las familias ricas financiaron las carreras de carros del circo, con más público y más rédito social.","en":"In the fourth and fifth centuries wealthy families funded chariot races in the circus, with larger crowds and greater social return."},"s":"T3 · 3.2.7","o":[{"es":"Porque las élites dejaron de costearlos y prefirieron las carreras del circo","en":"Because the elites stopped funding them and preferred circus races"},{"es":"Por una ley de Teodosio I que los prohibió en 393","en":"Because of a law of Theodosius I banning them in 393"},{"es":"Porque un terremoto destruyó el estadio de Olimpia","en":"Because an earthquake destroyed the stadium at Olympia"},{"es":"Porque la invasión de los godos arrasó el santuario","en":"Because the Gothic invasion razed the sanctuary"}]},{"id":"happ-card-t3-0","f":"L","t":3,"q":{"es":"Creta tuvo varios palacios a la vez, como Cnoso, Festo o Malia.","en":"Crete had several palaces at the same time, such as Knossos, Phaistos and Malia."},"x":{"es":"La geografía y el relieve fragmentados de la isla le dieron protección natural y propiciaron la convivencia de varios palacios. Es algo inusual en un territorio tan reducido.","en":"The fragmented geography and relief of the island gave it natural protection and allowed several palaces to coexist. This is unusual in such a small territory."},"s":"T3 · 3.1","vf":true},{"id":"happ-card-t3-1","f":"L","t":3,"q":{"es":"Los palacios minoicos estaban rodeados de grandes murallas.","en":"The Minoan palaces were surrounded by great walls."},"x":{"es":"Se organizaban en torno a un gran patio central y carecían de murallas. Esa ausencia llevó a Evans a imaginar una «Pax Minoica», hipótesis que hoy debe matizarse, puesto que las primeras armas del Egeo son cretenses.","en":"They were arranged around a large central court and had no walls. That absence led Evans to imagine a 'Pax Minoica', a hypothesis that must be qualified today, since the first weapons of the Aegean are Cretan."},"s":"T3 · 3.1","vf":false},{"id":"happ-card-t3-2","f":"F","t":3,"q":{"es":"Las escrituras cretenses nos han dejado textos que describen el deporte minoico.","en":"The Cretan scripts have left us texts that describe Minoan sport."},"x":{"es":"El jeroglífico cretense y el lineal A siguen sin descifrar, y el lineal B se empleó sobre todo para la contabilidad del palacio. Ninguna de las tres ha dejado un solo texto sobre deporte, de ahí que todo lo que sabemos proceda de imágenes.","en":"Cretan hieroglyphic and Linear A remain undeciphered, and Linear B was used mainly for palace accounting. None of the three has left a single text about sport, which is why everything we know comes from images."},"s":"T3 · 3.1","vf":false},{"id":"happ-card-t3-3","f":"S","t":3,"q":{"es":"En Creta el palacio era también el centro religioso de la comunidad.","en":"In Crete the palace was also the religious centre of the community."},"x":{"es":"Creta no levantó templos monumentales, de modo que el palacio reunía el culto, la residencia y el almacén en torno a un gran patio central.","en":"Crete built no monumental temples, so the palace brought together worship, residence and storage around a large central court."},"s":"T3 · 3.1","vf":true},{"id":"happ-card-t3-4","f":"F","t":3,"q":{"es":"La pintura minoica pinta en blanco a la mujer y en rojo al varón.","en":"Minoan painting depicts women in white and men in red."},"x":{"es":"Es una convención heredada de Egipto y el código más evidente para reconocer a las mujeres en los frescos.","en":"It is a convention inherited from Egypt and the most obvious code for recognising women in the frescoes."},"s":"T3 · 3.1","vf":true},{"id":"happ-card-t3-5","f":"S","t":3,"q":{"es":"La danza de la arboleda sagrada muestra a mujeres que bailan ante una multitud.","en":"The dance in the sacred grove shows women dancing before a crowd."},"x":{"es":"Los estudios vinculan este acto al culto a la naturaleza, concebida como divinidad femenina, y a los ritos de iniciación.","en":"Scholars link this act to the worship of nature, conceived as a female deity, and to initiation rites."},"s":"T3 · 3.1","vf":true},{"id":"happ-card-t3-6","f":"F","t":3,"q":{"es":"El arte minoico representa cuerpos pesados y macizos, propios de la fuerza.","en":"Minoan art depicts heavy, massive bodies built for strength."},"x":{"es":"Muestra figuras gráciles, estilizadas, de cintura estrecha y dinámicas, como este pescador. Esa visión sugiere que la élite cretense valoraba la agilidad, la destreza y la belleza del cuerpo en acción.","en":"It shows graceful, slender, narrow-waisted and dynamic figures, like this fisherman. That vision suggests that the Cretan elite valued agility, skill and the beauty of the body in action."},"s":"T3 · 3.1","vf":false},{"id":"happ-card-t3-7","f":"M","t":3,"q":{"es":"Los niños púgiles de Akrotiri llevan un guante en cada mano.","en":"The boxing boys of Akrotiri wear a glove on each hand."},"x":{"es":"Boxean con un solo guante en la mano derecha, con cinturón y taparrabos, y llevan la cabeza rapada salvo algunos mechones, el peinado de los muchachos de familia privilegiada.","en":"They box with a single glove on the right hand, with a belt and loincloth, and their heads are shaved except for a few locks, the hairstyle of boys from privileged families."},"s":"T3 · 3.1","vf":false,"img":"../img/t3/ninos_pugiles_akrotiri.jpg","cap":{"es":"Fresco de los niños púgiles, Akrotiri, finales del siglo XVII a. C.","en":"Boxing Boys fresco, Akrotiri, late 17th century BC"}},{"id":"happ-card-t3-8","f":"F","t":3,"q":{"es":"El niño con collar, pulseras y pendientes se lee como el vencedor del combate.","en":"The boy wearing a necklace, bracelets and earrings is read as the winner of the bout."},"x":{"es":"Su rival viste con sencillez. ¿Qué nos dice esa diferencia? Que el juego marcaba ya la jerarquía entre los hijos de la élite.","en":"His opponent is simply dressed. What does that difference tell us? That the game already marked the hierarchy among the children of the elite."},"s":"T3 · 3.1","vf":true,"img":"../img/t3/ninos_pugiles_akrotiri.jpg","cap":{"es":"Fresco de los niños púgiles, Akrotiri, finales del siglo XVII a. C.","en":"Boxing Boys fresco, Akrotiri, late 17th century BC"}},{"id":"happ-card-t3-9","f":"F","t":3,"q":{"es":"El ritón de Hagia Triada es un vaso de piedra para las libaciones decorado con escenas deportivas.","en":"The Hagia Triada rhyton is a stone vessel for libations decorated with sporting scenes."},"x":{"es":"Mide unos 46 cm, servía para las ofrendas líquidas a los dioses y es el único vaso de su clase con escenas deportivas que se conserva casi entero.","en":"It is about 46 cm high, was used for liquid offerings to the gods and is the only vessel of its kind with sporting scenes that survives almost complete."},"s":"T3 · 3.1","vf":true,"img":"../img/t3/riton_boxeadores.jpg","cap":{"es":"Ritón de los boxeadores, Hagia Triada, hacia 1550-1500 a. C.","en":"Boxer Rhyton, Hagia Triada, c. 1550-1500 BC"}},{"id":"happ-card-t3-10","f":"M","t":3,"q":{"es":"Los púgiles del ritón son niños que aprenden a combatir.","en":"The boxers on the rhyton are children learning to fight."},"x":{"es":"Son adultos, esbeltos pero musculados, con la melena del aristócrata minoico. Sus cascos, guantes, botas y vendajes cambian de una banda a otra, señal de un entrenamiento sistemático con reglas para cada modalidad.","en":"They are adults, slender but muscular, with the long hair of the Minoan aristocrat. Their helmets, gloves, boots and bandages change from one band to another, a sign of systematic training with rules for each discipline."},"s":"T3 · 3.1","vf":false,"img":"../img/t3/riton_boxeadores_bandas.jpg","cap":{"es":"Desarrollo de las cuatro bandas del ritón de Hagia Triada","en":"The four registers of the Hagia Triada rhyton"}},{"id":"happ-card-t3-11","f":"L","t":3,"q":{"es":"Casi todas las imágenes de taurocatapsia cretense proceden del palacio de Cnoso.","en":"Almost all images of Cretan bull-leaping come from the palace of Knossos."},"x":{"es":"Proceden de su fresco y de sus sellos oficiales, de ahí que el salto se convirtiera en emblema del poder de ese centro palacial.","en":"They come from its fresco and its official seals, which is why the leap became the emblem of the power of that palatial centre."},"s":"T3 · 3.1","vf":true},{"id":"happ-card-t3-12","f":"S","t":3,"q":{"es":"Hoy está demostrado que en Cnoso saltaban mujeres.","en":"It is now proven that women leapt at Knossos."},"x":{"es":"Nueve de los dieciséis saltadores conservados tienen la piel blanca, si bien otras hipótesis leen ese color como una marca de edad o de función social entre varones. La presencia de mujeres no puede afirmarse ni descartarse.","en":"Nine of the sixteen surviving leapers have white skin, although other hypotheses read that colour as a mark of age or social role among men. The presence of women can be neither affirmed nor ruled out."},"s":"T3 · 3.1","vf":false},{"id":"happ-card-t3-13","f":"P","t":3,"q":{"es":"Evans reconstruyó un salto que empezaba agarrando los cuernos del toro.","en":"Evans reconstructed a leap that began by grasping the bull's horns."},"x":{"es":"Según Evans (1930), el saltador aprovechaba la embestida para tomar impulso. Younger (1995) propuso después que el salto más frecuente fuera en picado.","en":"According to Evans (1930), the leaper used the bull's charge to gain momentum. Younger (1995) later proposed that the most frequent leap was the diving leap."},"s":"T3 · 3.1","vf":true},{"id":"happ-card-t3-14","f":"M","t":3,"q":{"es":"Según Younger (1995), el salto en picado es el esquema más frecuente del salto del toro.","en":"According to Younger (1995), the diving leap is the most frequent scheme of bull-leaping."},"x":{"es":"Reúne una treintena de ejemplos frente a las pocas imágenes, más antiguas, que encajan con la reconstrucción de Evans.","en":"He gathers some thirty examples against the few, older images that fit Evans's reconstruction."},"s":"T3 · 3.1","vf":true},{"id":"happ-card-t3-15","f":"M","t":3,"q":{"es":"En el salto en picado el saltador terminaba sentado sobre el lomo del toro.","en":"In the diving leap the leaper ended up sitting on the bull's back."},"x":{"es":"Tras apoyar las manos en los hombros del animal y arquear el cuerpo, daba una voltereta hacia atrás y caía de pie detrás del toro.","en":"After placing his hands on the animal's shoulders and arching his body, he made a backward somersault and landed on his feet behind the bull."},"s":"T3 · 3.1","vf":false},{"id":"happ-card-t3-16","f":"F","t":3,"q":{"es":"Las tazas de Vafio muestran la captura de toros con una red y con una vaca como señuelo.","en":"The Vapheio cups show bulls being captured with a net and with a cow as a decoy."},"x":{"es":"El salto era solo la parte más vistosa de un ciclo que empezaba con la captura del toro, una empresa colectiva y peligrosa.","en":"The leap was only the most spectacular part of a cycle that began with the capture of the bull, a collective and dangerous undertaking."},"s":"T3 · 3.1","vf":true,"img":"../img/t3/tazas_vafio.jpg","cap":{"es":"Tazas de oro de Vafio (Laconia), hacia 1750-1450 a. C.","en":"Gold cups from Vapheio (Laconia), c. 1750-1450 BC"}},{"id":"happ-card-t3-17","f":"F","t":3,"q":{"es":"Las imágenes minoicas unen el salto con la muerte del toro.","en":"Minoan images link the leap with the death of the bull."},"x":{"es":"Se especula con que la taurocatapsia terminara en el sacrificio y el banquete, si bien las imágenes minoicas no unen el salto con la muerte del animal.","en":"It has been speculated that bull-leaping ended in sacrifice and a banquet, although Minoan images do not link the leap with the animal's death."},"s":"T3 · 3.1","vf":false},{"id":"happ-card-t3-18","f":"C","t":3,"q":{"es":"Las cuatro lecturas del salto del toro se excluyen entre sí.","en":"The four readings of bull-leaping are mutually exclusive."},"x":{"es":"El salto pudo ser, a la vez y en el mismo acto, ofrenda a los dioses, paso a la edad adulta, emblema del palacio y exhibición de destreza ante la comunidad.","en":"The leap could be, at once and in the same act, an offering to the gods, a passage to adulthood, an emblem of the palace and a display of skill before the community."},"s":"T3 · 3.1","vf":false},{"id":"happ-card-t3-19","f":"L","t":3,"q":{"es":"Festo tenía un área teatral con una grada para espectadores en pie.","en":"Phaistos had a theatral area with steps for standing spectators."},"x":{"es":"La grada tiene nueve escalones. Sea cual sea el lugar del salto, el deporte cretense tenía vocación de espectáculo público ligado a los centros del poder.","en":"The steps number nine. Wherever the leap took place, Cretan sport was meant as a public spectacle tied to the centres of power."},"s":"T3 · 3.1","vf":true},{"id":"happ-card-t3-20","f":"C","t":3,"q":{"es":"La erupción del volcán de Tera acabó de inmediato con los palacios cretenses.","en":"The eruption of the Thera volcano immediately ended the Cretan palaces."},"x":{"es":"La erupción se produjo hacia 1628 a. C., unos ciento cincuenta años antes del final de los palacios. Cubrió de ceniza el este de la isla, pero Creta se rehízo y llegó próspera a su última etapa.","en":"The eruption took place c. 1628 BC, some 150 years before the end of the palaces. It covered the east of the island with ash, but Crete recovered and reached its last stage in prosperity."},"s":"T3 · 3.1","vf":false},{"id":"happ-card-t3-21","f":"C","t":3,"q":{"es":"Hacia 1450-1375 a. C. Cnoso fue el único palacio de Creta, en manos de los micénicos.","en":"C. 1450-1375 BC Knossos was the only palace in Crete, in the hands of the Mycenaeans."},"x":{"es":"Durante esos setenta y cinco años la taurocatapsia siguió practicándose bajo dominio micénico, hasta que el palacio ardió hacia 1375 a. C.","en":"During those seventy-five years bull-leaping continued under Mycenaean rule, until the palace burned c. 1375 BC."},"s":"T3 · 3.1","vf":true},{"id":"happ-card-t3-22","f":"F","t":3,"q":{"es":"La enócoe del Dipilón lleva una inscripción que la declara premio de un concurso de baile.","en":"The Dipylon oinochoe bears an inscription declaring it the prize of a dancing contest."},"x":{"es":"Es una de las inscripciones griegas más antiguas, escrita con el alfabeto tomado de los fenicios, y premia al mejor bailarín.","en":"It is one of the oldest Greek inscriptions, written in the alphabet taken from the Phoenicians, and rewards the best dancer."},"s":"T3 · 3.1","vf":true},{"id":"happ-card-t3-23","f":"S","t":3,"q":{"es":"En el mundo micénico el carro y la caza del jabalí estaban reservados al señor.","en":"In the Mycenaean world the chariot and the boar hunt were reserved for the lord."},"x":{"es":"El pugilato, en cambio, quedaba a cargo de púgiles pagados que animaban los banquetes y los funerales del señor.","en":"Boxing, by contrast, was left to paid boxers who entertained at the lord's banquets and funerals."},"s":"T3 · 3.1","vf":true},{"id":"happ-card-t3-24","f":"C","t":3,"q":{"es":"Grecia fue un Estado unificado con capital en Olimpia.","en":"Greece was a unified state with its capital at Olympia."},"x":{"es":"Grecia nunca fue un Estado unificado. Sus cientos de poleis compartían lengua, dioses y santuarios, y Olimpia, en el territorio de Élide, era de todos los griegos aunque la gobernara Élide.","en":"Greece was never a unified state. Its hundreds of poleis shared language, gods and sanctuaries, and Olympia, in the territory of Elis, belonged to all Greeks although Elis governed it."},"s":"T3 · 3.2.1","vf":false},{"id":"happ-card-t3-25","f":"S","t":3,"q":{"es":"Hacia 500 a. C. la mayoría de los habitantes de Atenas eran ciudadanos varones adultos.","en":"C. 500 BC most of the inhabitants of Athens were adult male citizens."},"x":{"es":"De unos 175.000 habitantes, solo unos 25.000 eran ciudadanos varones adultos. La ley distinguía además entre ciudadanos, metecos y esclavos, y a estos últimos les vedaba el deporte.","en":"Of some 175,000 inhabitants, only about 25,000 were adult male citizens. The law also distinguished citizens, metics and slaves, and barred the last from sport."},"s":"T3 · 3.2.1","vf":false},{"id":"happ-card-t3-26","f":"F","t":3,"q":{"es":"El frontón muestra los preparativos de la carrera de carros de Pélope y Enómao.","en":"The pediment shows the preparations for the chariot race of Pelops and Oinomaos."},"x":{"es":"Pélope gana la carrera al rey de Pisa, una de las dos versiones más repetidas de la fundación de los Juegos junto a la de Heracles.","en":"Pelops wins the race against the king of Pisa, one of the two most repeated versions of the founding of the Games together with that of Heracles."},"s":"T3 · 3.2.2","vf":true,"img":"../img/t3/fronton_oriental_zeus.jpg","cap":{"es":"Frontón oriental del templo de Zeus, Olimpia, mediados del siglo V a. C.","en":"East pediment of the temple of Zeus, Olympia, mid-5th century BC"}},{"id":"happ-card-t3-27","f":"L","t":3,"q":{"es":"El túmulo que los griegos veneraban como tumba de Pélope era de época micénica.","en":"The tumulus the Greeks venerated as the tomb of Pelops dated from the Mycenaean period."},"x":{"es":"Era prehistórico, de mediados del III milenio a. C. De los relatos de fundación solo es cierto el escenario.","en":"It was prehistoric, from the middle iri and preserved its paintings?"},"x":{"es":"La erupción del volcán sepultó Akrotiri bajo la ceniza a finales del siglo XVII a. C.","en":"The volcanic eruption buried Akrotiri under ash at the end of the 17th century BC."},"s":"T3 · 11","o":[{"es":"La erupción del volcán","en":"The volcanic eruption"},{"es":"El incendio de los micénicos","en":"The Mycenaean fire"},{"es":"Un terremoto en toda Creta","en":"An earthquake across Crete"},{"es":"Una gran inundación del mar","en":"A great flood from the sea"}]},{"id":"mono-Q-8-2","f":"F","t":3,"q":{"es":"En el fresco de Akrotiri, ¿qué distingue al niño vencedor?","en":"In the Akrotiri fresco, what marks out the winning boy?"},"x":{"es":"El vencedor lleva collar, pulseras y pendientes y su rival viste con sencillez, de modo que el juego marcaba ya la jerarquía.","en":"The winner wears a necklace, bracelets and earrings while his rival is plainly dressed, so the game already marked hierarchy."},"s":"T3 · 11","o":[{"es":"Sus joyas","en":"His jewellery"},{"es":"Un casco de bronce con cresta","en":"A crested bronze helmet"},{"es":"Una corona de olivo en la cabeza","en":"An olive wreath on his head"},{"es":"Un manto de color púrpura","en":"A purple cloak"}]},{"id":"mono-Q-9-0","f":"M","t":3,"q":{"es":"¿Cómo se llama el salto sobre un toro vivo y a la carrera?","en":"What is the name of leaping over a live, charging bull?"},"x":{"es":"La taurocatapsia es la práctica más representada del arte minoico.","en":"Taurokathapsia (bull-leaping) is the most frequently depicted practice in Minoan art."},"s":"T3 · 14","o":[{"es":"Taurocatapsia","en":"Taurokathapsia"},{"es":"Kottabos","en":"Kottabos"},{"es":"Pancracio","en":"Pankration"},{"es":"Hoplitódromo","en":"Hoplitodromos"}]},{"id":"mono-Q-9-1","f":"S","t":3,"q":{"es":"¿Por qué muchos estudios ven mujeres entre los saltadores de Cnoso?","en":"Why do many studies see women among the leapers of Knossos?"},"x":{"es":"Nueve de los dieciséis tienen la piel blanca que el arte egeo daba a la oca arcaica la dieta era ligera, la misma de cualquier griego. El pan con miel y la leche de cabra son ya de época romana.","en":"In the Archaic period the diet was light, the same as any Greek's. Bread with honey and goat's milk belong to the Roman period."},"s":"T3 · Pentatlón","o":[{"es":"Higos secos, queso fresco y harina de trigo","en":"Dried figs, fresh cheese and wheat flour"},{"es":"Carne de buey asada y pan de cebada","en":"Roast beef and barley bread"},{"es":"Pan con miel, aceitunas y leche de cabra","en":"Bread with honey, olives and goat’s milk"},{"es":"Pescado salado, lentejas y vino puro","en":"Salted fish, lentils and unmixed wine"}]},{"id":"penta-12","f":"S","t":3,"q":{"es":"¿Qué decía la dieta del atleta sobre su posición social?","en":"What did the athlete's diet say about his social position?"},"x":{"es":"La dieta reflejaba el acceso social al deporte griego: el gasto en carne estaba al alcance de muy pocos.","en":"The diet reflected social access to Greek sport: spending on meat was within reach of very few."},"s":"T3 · Pentatlón","o":[{"es":"Comer carne a diario era caro, y el cuerpo del atleta exhibía ese gasto","en":"Eating meat daily was expensive, and the athlete's body displayed that expense"},{"es":"Nada, porque la dieta la pagaba la ciudad a todos los atletas","en":"Nothing, since the city paid for every athlete’s diet"},{"es":"Que los atletas venían de familias pobres y comían lo que podían","en":"That athletes came from poor families and ate what they could"},{"es":"Que solo los esclavos de las palestras comían carne a diario","en":"That only the palaestra slaves ate meat every day"}]},{"id":"penta-14","f":"S","t":3,"q":{"es":"¿Qué establecía la ekecheiría?","en":"What did the ekecheiria establish?"},"x":{"es":"La ekecheiría no frenaba las guerras en Grecia, y los Juegos no se suspendían por causas bélicas.","en":"The ekecheiria did not stop wars in Greece, and the Games were not suspended for war."},"s":"T3 · Pentatlón","o":[{"es":"Prohibía la entrada de ejércitos en Élide y garantizaba el paso seguro de los peregrinos","en":"It barred armies from Elis and guaranteed pilgrims safe passage"},{"es":"Imponía una paz general en toda Grecia mientras duraban los Juegos","en":"It imposed a general peace across Greece while the Games lasted"},{"es":"Suspendía todas las guerras entre griegos durante un año completo","en":"It suspended all wars between Greeks for a whole year"},{"es":"Obligaba a cada polis a enviar al menos un atleta a cada edición","en":"It obliged every polis to send at least one athlete to each festival"}]},{"id":"penta-15","f":"S","t":3,"q":{"es":"¿Por qué Élide sumó más vencedores que ninguna otra ciudad?","en":"Why did Elis have more victors than any other city?"},"x":{"es":"Unos sabios egipcios dudaban de unos Juegos con atletas eleos, aunque la causa puede ser la cercanía más que la parcialidad.","en":"Some Egyptian sages doubted Games with Elean athletes, although the cause may be closeness rather than bias."},"s":"T3 · Pentatlón","o":[{"es":"Puede deberse a la ventaja de la cercanía geográfica","en":"It may be due to the advantage of geographical closeness"},{"es":"Está probado que sus jueces hacían trampas","en":"It is proven that its judges cheated"},{"es":"Porque solo podían competir los eleos","en":"Because only Eleans could compete"},{"es":"Porque Élide pagaba a sus atletas","en":"Because Elis paid its athletes"}]},{"id":"penta-16","f":"S","t":3,"q":{"es":"¿Qué tres tipos de sanción había en Olimpia?","en":"What three kinds of penalty were there at Olympia?"},"x":{"es":"Todas las imponían los helanódicas, y podían recurrirse ante el Consejo Olímpico.","en":"All were imposed by the Hellanodikai and could be appealed to the Olympic Council."},"s":"T3 · Pentatlón","o":[{"es":"Castigo corporal, expulsión y sanciones económicas","en":"Corporal punishment, expulsion and fines"},{"es":"Cárcel, destierro y pena de muerte","en":"Prison, exile and death"},{"es":"Amonestación, tarjeta
