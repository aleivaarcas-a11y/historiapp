<script>
/* Guardar y salir a Historiapp. Común a todos los juegos de la app; lo inserta guardar_salir.py.
   Configuración en window.HAPP_GS = { volver, pos, fijo, visible }.
   - El juego define window.HAPP_GUARDAR() con lo que haya que guardar de la partida en curso.
   - Se guarda al pulsar el botón y también al salir de la página por cualquier otra vía (pagehide y
     visibilitychange), de modo que el progreso no se pierde aunque se cierre la app.
   - window.HAPP_SALIR(href) guarda, avisa y vuelve a Historiapp; los botones propios del juego lo usan. */
(function () {
  'use strict';
  var C = window.HAPP_GS || {};

  /* ---------- Sonido y pausa (revisión del 13-10-2026) ----------
     - Se anotan todos los AudioContext que crea el juego para poder despertarlos y dormirlos.
     - En iPhone el sonido solo arranca dentro de un toque «completo» (touchend o click), y tras salir de la app
       el contexto queda «interrumpido» y el juego ya no suena: se reanuda en cualquier toque posterior.
     - Con audioSession 'playback' (iPhone con iOS 16.4 o posterior) el juego suena aunque el móvil esté en silencio.
     - Al ocultar la app (bloquear el móvil, cambiar de app) se pausa el juego (HAPP_PAUSA o el evento blur que ya
       escuchan los juegos), se duerme el sonido y se paran las músicas; al volver, se reanudan. */
  var ctxs = [], oculto = false, dormidos = [], parados = [];
  try {
    var AC0 = window.AudioContext || window.webkitAudioContext;
    if (AC0 && !AC0.__happ) {
      var ACW = function (o) { var c = o === undefined ? new AC0() : new AC0(o); ctxs.push(c); return c; };
      ACW.prototype = AC0.prototype; ACW.__happ = true;
      window.AudioContext = ACW; if (window.webkitAudioContext) window.webkitAudioContext = ACW;
    }
  } catch (e) {}
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  function despertar() {
    if (oculto) return;
    ctxs.forEach(function (c) { try { if (c.state === 'suspended' || c.state === 'interrupted') c.resume(); } catch (e) {} });
  }
  ['touchend', 'click', 'pointerup', 'keydown'].forEach(function (ev) { addEventListener(ev, despertar, { capture: true, passive: true }); });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') {
      if (oculto) return; oculto = true;
      try { if (typeof window.HAPP_PAUSA === 'function') window.HAPP_PAUSA(); else window.dispatchEvent(new Event('blur')); } catch (e) {}
      ctxs.forEach(function (c) { try { if (c.state === 'running') { c.suspend(); dormidos.push(c); } } catch (e) {} });
      try { document.querySelectorAll('audio,video').forEach(function (m) { if (!m.paused) { try { m.pause(); parados.push(m); } catch (e) {} } }); } catch (e) {}
    } else {
      oculto = false;
      dormidos.splice(0).forEach(function (c) { try { c.resume(); } catch (e) {} });
      parados.splice(0).forEach(function (m) { try { var r = m.play(); if (r && r.catch) r.catch(function () {}); } catch (e) {} });
    }
  });
  var lang = null;
  try { lang = localStorage.getItem('historiapp.lang'); } catch (e) {}
  if (lang !== 'es' && lang !== 'en') lang = String(document.documentElement.lang || navigator.language || 'es').slice(0, 2) === 'en' ? 'en' : 'es';
  var TX = lang === 'en'
    ? { b: 'Save & exit', a: 'Save the game and go back to Historiapp', ok: 'Game saved' }
    : { b: 'Guardar y salir', a: 'Guardar la partida y volver a Historiapp', ok: 'Partida guardada' };
  window.HAPP_GS_TX = TX;
  function guardar() { try { if (typeof window.HAPP_GUARDAR === 'function') window.HAPP_GUARDAR(); } catch (e) {} }
  var yendo = false, aviso = null;
  function salir(href) {
    if (yendo) return; yendo = true;
    guardar();
    if (aviso) aviso.classList.add('on');
    var v = href || (typeof C.volver === 'function' ? C.volver() : C.volver) || '../';
    setTimeout(function () { location.href = v; }, 500);
  }
  window.HAPP_SALIR = salir;
  addEventListener('pagehide', guardar);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') guardar(); });
  var css = '.hgs{position:fixed;z-index:2147482999;display:none;align-items:center;gap:6px;min-height:40px;margin:0;padding:0 13px;border-radius:20px;' +
    'background:rgba(12,10,8,.76);color:#fff;border:1px solid rgba(255,255,255,.5);font:600 13px/1 system-ui,-apple-system,"Segoe UI",sans-serif;' +
    'box-shadow:0 3px 10px rgba(0,0,0,.35);cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;white-space:nowrap}' +
    '.hgs.on{display:inline-flex}.hgs:active{transform:translateY(1px)}' +
    '.hgs-ok{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(.9);opacity:0;z-index:2147483003;pointer-events:none;padding:12px 22px;border-radius:24px;' +
    'background:#EDAB00;color:#1b1406;font:700 17px/1 system-ui,-apple-system,"Segoe UI",sans-serif;box-shadow:0 6px 18px rgba(0,0,0,.45);transition:opacity .2s,transform .2s}' +
    '.hgs-ok.on{opacity:1;transform:translate(-50%,-50%) scale(1)}';
  function build() {
    var st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
    aviso = document.createElement('div'); aviso.className = 'hgs-ok'; aviso.setAttribute('role', 'status'); aviso.textContent = '✓ ' + TX.ok; document.body.appendChild(aviso);
    if (C.fijo === false) return;
    var b = document.createElement('button'); b.type = 'button'; b.className = 'hgs';
    b.innerHTML = '<span aria-hidden="true">💾</span><span>' + TX.b + '</span>'; b.setAttribute('aria-label', TX.a); b.title = TX.a;
    var pos = C.pos || { top: 'max(8px, env(safe-area-inset-top))', right: 'max(10px, env(safe-area-inset-right))' };
    for (var k in pos) b.style[k] = pos[k];
    ['pointerdown', 'touchstart', 'mousedown'].forEach(function (ev) { b.addEventListener(ev, function (e) { e.stopPropagation(); }, { passive: true }); });
    b.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); salir(); });
    document.body.appendChild(b);
    var ver = function () { var on = true; try { on = !C.visible || !!C.visible(); } catch (e) {} b.classList.toggle('on', on); };
    ver(); setInterval(ver, 300);
  }
  if (document.body) build(); else document.addEventListener('DOMContentLoaded', build);

  /* ---------- Giro de pantalla (13-10-2026) ----------
     En algunos Android e iPhone el aviso de girar desaparece pero el juego queda mal dibujado o en blanco:
     el navegador lanza el evento resize antes de dar las medidas definitivas y el juego se dibuja con las viejas.
     1. Se limita la densidad de píxeles a 2 (en pantallas de 3 los lienzos ocupan más del doble de memoria
        y algunos móviles recargan o cuelgan la página al girar).
     2. Tras cada giro se vuelve a avisar al juego del cambio de tamaño cuando las medidas ya son las buenas.
     3. Si el juego se abrió en la orientación equivocada (C.orient 'h' o 'v'), al ponerlo en la buena se recarga
        una vez, con la partida guardada antes, para que arranque con las medidas correctas. */
  try { if ((window.devicePixelRatio || 1) > 2) Object.defineProperty(window, 'devicePixelRatio', { get: function () { return 2; }, configurable: true }); } catch (e) {}
  var portrait = function () { return window.innerHeight > window.innerWidth; };
  var buena = function () { return !C.orient || (C.orient === 'h' ? !portrait() : portrait()); };
  var malAlCargar = !!C.orient && !buena();
  var avisando = false, giroT = [], ultimo = '';
  function avisar() {
    var m = window.innerWidth + 'x' + window.innerHeight;
    avisando = true;
    try { window.dispatchEvent(new Event('resize')); } catch (e) {}
    try { if (window.visualViewport) window.visualViewport.dispatchEvent(new Event('resize')); } catch (e) {}
    avisando = false;
    ultimo = m;
  }
  function recargarSiHaceFalta() {
    if (!malAlCargar || !buena()) return;
    var k = 'happ.giro.' + location.pathname, ahora = Date.now(), antes = 0;
    try { antes = +sessionStorage.getItem(k) || 0; } catch (e) {}
    if (ahora - antes < 20000) return;
    try { sessionStorage.setItem(k, String(ahora)); } catch (e) {}
    malAlCargar = false; guardar(); location.reload();
  }
  function giro() {
    if (avisando) return;
    giroT.forEach(clearTimeout);
    giroT = [120, 350, 700, 1200].map(function (t, i, a) {
      return setTimeout(function () { avisar(); if (i === a.length - 1) recargarSiHaceFalta(); }, t);
    });
  }
  addEventListener('orientationchange', giro);
  addEventListener('resize', function () { if (!avisando) giro(); });
  try { if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', giro); } catch (e) {}
  addEventListener('pageshow', function (e) { if (e.persisted) giro(); });

  /* ---------- Orientación bloqueada y zoom (13-10-2026) ----------
     4. Historiapp instalada en Android hereda la orientación vertical de la app: aunque el alumno gire el móvil,
        la pantalla no gira y el aviso de girar no se va. Dentro de la app instalada, el juego pide su orientación
        con screen.orientation.lock (Android lo permite en apps instaladas; iPhone no lo necesita).
     5. iPhone agranda la letra al poner el móvil en horizontal y amplía la pantalla al tocar un campo de texto
        con letra de menos de 16 px; como los juegos no dejan pellizcar, la pantalla se quedaba grande.
        Se fija el tamaño de letra, los campos pasan a 16 px y el zoom vuelve a 1 al salir del campo o al girar. */
  function bloquear() {
    if (!C.orient) return;
    try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock(C.orient === 'h' ? 'landscape' : 'portrait').catch(function () {}); } catch (e) {}
  }
  bloquear();
  addEventListener('pointerdown', bloquear, { capture: true, passive: true, once: true });
  addEventListener('pageshow', bloquear);
  addEventListener('pagehide', function () { try { screen.orientation.unlock(); } catch (e) {} });
  var vm = document.querySelector('meta[name="viewport"]'), vmBase = vm ? vm.getAttribute('content') : '';
  function sinZoom() {
    if (!vm || (window.visualViewport && Math.abs(window.visualViewport.scale - 1) < 0.01)) return;
    vm.setAttribute('content', vmBase.replace(/,?\s*maximum-scale=[^,]*/g, '') + ',maximum-scale=1');
    setTimeout(function () { vm.setAttribute('content', vmBase); }, 400);
  }
  document.addEventListener('focusout', function (e) { var t = e.target && e.target.tagName; if (t === 'INPUT' || t === 'SELECT' || t === 'TEXTAREA') setTimeout(sinZoom, 60); }, true);
  addEventListener('orientationchange', function () { setTimeout(sinZoom, 400); });
  var st2 = document.createElement('style');
  st2.textContent = 'html{-webkit-text-size-adjust:100%!important;text-size-adjust:100%!important}@media (pointer:coarse){input,select,textarea{font-size:16px!important}}';
  (document.head || document.documentElement).appendChild(st2);
})();
</script>

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14100c">
<title>Trivium · Historia del Deporte</title>
<style>
:root{--bg:#14100c;--ink:#f4ead6;--mute:#c9b99a;--gold:#d8b25a;--gold2:#f0d58c;--panel:rgba(26,20,14,.92);--line:rgba(216,178,90,.35);
  --cpy:22px;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);--sal:env(safe-area-inset-left);--sar:env(safe-area-inset-right)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'Alegreya Sans',system-ui,sans-serif;font-weight:500;touch-action:none;user-select:none;-webkit-user-select:none}
#c3d{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.btn{min-height:46px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(#3a2c1c,#241a10);color:var(--ink);font-weight:700;font-size:16px;letter-spacing:.02em;box-shadow:0 2px 0 #0008,inset 0 1px 0 #fff2}
.btn:active{transform:translateY(1px)}
.btn.gold{background:linear-gradient(#f0d58c,#b98d34);color:#2a1c08;border-color:#f6e3a8}
.btn.big{font-size:20px;min-height:58px;padding:12px 28px;font-family:Cinzel,serif}
.btn:disabled{opacity:.45;pointer-events:none}
.ic{width:1.25em;height:1.25em;vertical-align:-.25em;display:inline-block}
/* barra superior */
#top{position:fixed;left:0;right:0;top:0;padding:calc(6px + var(--sat)) calc(8px + var(--sar)) 6px calc(8px + var(--sal));display:flex;gap:6px;align-items:flex-start;pointer-events:none;z-index:5}
#players{display:flex;flex-wrap:wrap;gap:6px;flex:1;pointer-events:auto}
.pl{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:30px;background:var(--panel);border:1px solid #0000;font-size:14px;line-height:1.1;max-width:190px}
.pl.on{border-color:var(--gold2);box-shadow:0 0 0 2px #f0d58c55,0 0 14px #f0d58c55}
.pl canvas{width:34px;height:34px;flex:none}
.pl b{display:block;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.pl small{color:var(--mute);font-size:12px}
#tbtns{display:flex;gap:6px;pointer-events:auto}
#tbtns .btn{min-height:44px;min-width:44px;padding:8px 12px;font-size:15px}
/* panel de acción */
#act{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--cpy) + 8px + var(--sab));width:min(640px,calc(100% - 16px));background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 12px;z-index:5;box-shadow:0 6px 24px #0009;display:none}
#act.show{display:block}
#msg{font-size:16px;text-align:center;margin:2px 0 8px;min-height:22px}
#msg b{color:var(--gold2)}
#acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.dest{display:flex;align-items:center;gap:8px;min-height:46px;padding:6px 12px 6px 8px;border-radius:12px;border:2px solid #fff3;background:#00000055;font-weight:700;font-size:15px}
.dest .sw{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
.dest .sw img{width:24px;height:24px}
.dest small{display:block;font-weight:500;color:var(--mute);font-size:12px}
/* ventanas */
.ov{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:calc(10px + var(--sat)) 10px calc(var(--cpy) + 10px + var(--sab));background:rgba(8,6,4,.55);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.ov.show{display:flex}
.card{width:min(560px,100%);max-height:100%;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:linear-gradient(#2b2117,#1c150e);border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 60px #000c;padding:18px}
.card h2{font-family:Cinzel,serif;font-weight:700;color:var(--gold2);margin:0 0 10px;font-size:22px;letter-spacing:.04em}
.card p{line-height:1.45;margin:.5em 0}
.card .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
/* pregunta */
#qcard{padding:0;overflow:hidden auto}
#qcard.hq{border:2px solid var(--gold2);box-shadow:0 0 0 4px #f0d58c40,0 0 46px #f0d58c70,0 20px 60px #000c}
#qbadge{display:none;align-items:center;gap:10px;padding:9px 16px;background:linear-gradient(90deg,#b98d34,#f0d58c,#b98d34);color:#2a1c08;font-family:Cinzel,serif;font-weight:700;font-size:15px;letter-spacing:.03em}
#qbadge .wsv{width:30px;height:30px;flex:none;filter:drop-shadow(0 1px 1px #0006)}
#qhead{display:flex;align-items:center;gap:10px;padding:12px 16px;color:#fff;font-weight:800;font-size:17px;text-shadow:0 1px 2px #0008}
#qhead img{width:34px;height:34px;filter:drop-shadow(0 1px 1px #0008)}
#qhead .tg{margin-left:auto;font-size:13px;font-weight:700;background:#0005;border-radius:20px;padding:3px 10px}
#qbody{padding:14px 18px 18px}
#qtext{font-size:20px;line-height:1.35;font-weight:700;margin:4px 0 12px}
blockquote.quote{margin:10px 0 0;padding:10px 14px;border-left:3px solid var(--gold);background:#0004;border-radius:8px;font-style:italic;font-weight:500;font-size:.85em;line-height:1.4}
#qimg{display:block;max-width:100%;max-height:220px;margin:0 auto 6px;border-radius:10px;border:1px solid var(--line)}
#qcap{text-align:center;color:var(--mute);font-size:13px;margin-bottom:10px}
#qopts{display:grid;gap:8px}
.opt{min-height:50px;text-align:left;padding:10px 14px;border-radius:12px;border:1px solid #fff2;background:#ffffff0d;font-size:17px;font-weight:700;display:flex;gap:10px;align-items:center}
.opt .k{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#0006;font-family:Cinzel,serif;flex:none}
.opt.ok{background:#2f6b3a;border-color:#8fe0a0}
.opt.ko{background:#7a2b25;border-color:#ff9c8f}
.opt.dim{opacity:.5}
#qres{display:none;margin-top:12px;padding:12px 14px;border-radius:12px;background:#00000055;border-left:4px solid var(--gold)}
#qres h3{margin:0 0 4px;font-size:18px}
#qres .src{color:var(--mute);font-size:13px;margin-top:6px}
#qwho{color:var(--mute);font-size:14px;margin-bottom:4px}
/* menú inicial */
#menu .card{width:min(620px,100%)}
#title{text-align:center;margin:0 0 4px}
#title .t{font-family:Cinzel,serif;font-size:clamp(38px,9vw,60px);font-weight:700;letter-spacing:.12em;color:var(--gold2);text-shadow:0 2px 0 #0009,0 0 24px #d8b25a55;line-height:1}
#title .s{color:var(--mute);font-size:15px;letter-spacing:.06em;margin-top:4px}
#fams{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}
.fam{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:5px 6px;border-radius:10px;color:#fff;text-shadow:0 1px 2px #0009;line-height:1.1}
.fam img{width:22px;height:22px;flex:none}
.prow{display:flex;gap:6px;align-items:center;margin:6px 0;flex-wrap:wrap}
.prow canvas{width:40px;height:40px;flex:none;cursor:pointer}
.prow input{flex:1;min-width:110px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:#0006;color:var(--ink);padding:8px 10px;font:inherit;font-weight:700;font-size:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{min-height:44px;padding:6px 10px;font-size:14px;font-weight:700;color:var(--mute)}
.seg button.on{background:var(--gold);color:#2a1c08}
.lbl{font-family:Cinzel,serif;color:var(--gold);font-size:14px;letter-spacing:.06em;margin:14px 0 4px}
.chk{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:4px 10px;border:1px solid var(--line);border-radius:10px;margin:2px;font-weight:700;font-size:15px}
.chk.on{background:#d8b25a33;border-color:var(--gold2)}
.x{min-width:44px;min-height:44px;border-radius:10px;border:1px solid var(--line);font-size:18px}
#tags{position:fixed;inset:0;pointer-events:none;z-index:3}
.tag{position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;border:2.5px solid #fff;box-shadow:0 2px 6px #000a,0 0 0 1px #0008;font-family:Cinzel,serif}
.tag.on{border-color:#ffe08a;box-shadow:0 0 0 3px #ffe08a88,0 0 14px #ffe08a;width:32px;height:32px;font-size:17px}
#toast{position:fixed;left:50%;top:calc(70px + var(--sat));transform:translateX(-50%);z-index:30;background:var(--panel);border:1px solid var(--gold2);border-radius:14px;padding:10px 18px;text-align:center;display:none;box-shadow:0 8px 30px #000a;max-width:90vw}
#toast b{display:block;font-family:Cinzel,serif;color:var(--gold2);font-size:19px}
#cpy{position:fixed;right:calc(8px + var(--sar));bottom:calc(3px + var(--sab));font-size:9.5px;color:var(--mute);opacity:.55;white-space:nowrap;z-index:4;text-align:right;max-width:min(70vw,520px);line-height:1.2;pointer-events:none}
.rules h3{font-family:Cinzel,serif;color:var(--gold);font-size:16px;margin:14px 0 4px}
.rules li{margin:4px 0;line-height:1.4}
.stat{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #fff1}
.stat canvas{width:44px;height:44px}
@media (max-width:560px){.pl{padding:3px 8px 3px 3px;font-size:13px}.pl canvas{width:28px;height:28px}.pl b{max-width:70px}#qtext{font-size:18px}.opt{font-size:16px}#fams{grid-template-columns:repeat(2,1fr)}#tbtns .lbtxt{display:none}}
@media (max-height:520px) and (min-aspect-ratio:13/10){#act{left:auto;right:calc(8px + var(--sar));transform:none;width:min(330px,40vw);max-height:calc(100% - 70px);overflow:auto}#acts .dest{width:100%}}
@media (max-height:480px){#act{padding:6px 10px}#msg{margin:0 0 4px;font-size:15px}.dest{min-height:44px}blockquote.quote{margin:10px 0 0;padding:10px 14px;border-left:3px solid var(--gold);background:#0004;border-radius:8px;font-style:italic;font-weight:500;font-size:.85em;line-height:1.4}
#qimg{max-height:120px}}

<script>
/* HAPP_REPASO · memoria común de fallos de Historiapp (18-10-2026, plan de mejoras, apartado 4).
   Todos los juegos comparten origen con la app, así que escriben en la misma clave del aparato: historiapp.repaso.
   Cada pregunta fallada vuelve al día siguiente; si se acierta, a los 3, a los 7 y a los 21 días, y después sale del repaso.
   Uso en un juego (solo actúa dentro de Historiapp):
     HAPP_REPASO.fallo('cuadrigas', {es:'¿…?', en:'…?'}, {es:[correcta, …], en:[correcta, …]}, 'ficha-id', 4);
     HAPP_REPASO.acierto({es:'¿…?', en:'…?'});
   La opción correcta va SIEMPRE la primera; la app las baraja al preguntar. */
window.HAPP_REPASO = (function(){
  var K = 'historiapp.repaso', DAY = 864e5, GAPS = [1, 3, 7, 21], MAX = 400;
  function inside(){ try { if (!/\/juegos\//.test(location.pathname)) return false; for (var i = 0; i < localStorage.length; i++) if (localStorage.key(i).indexOf('historiapp.') === 0) return true; } catch (e) {} return false; }
  function load(){ try { var d = JSON.parse(localStorage.getItem(K)); if (d && d.items) return d; } catch (e) {} return {v:1, items:{}}; }
  function save(d){ try { localStorage.setItem(K, JSON.stringify(d)); } catch (e) {} }
  function idOf(q){ var s = String(q && (q.es || q) || ''), h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return 'q' + (h >>> 0).toString(36); }
  function norm(o){ if (Array.isArray(o)) return {es:o}; return o || {es:[]}; }
  return {
    activo: inside,
    fallo: function(game, q, o, ficha, tema){
      if (!inside() || !q) return; if (typeof q === 'string') q = {es:q};
      var d = load(), id = idOf(q), it = d.items[id] || {g:game, q:q, o:norm(o), f:ficha || null, t:tema || null, box:0, n:0};
      it.box = 0; it.n = (it.n || 0) + 1; it.due = Date.now() + DAY; it.g = game; it.last = Date.now(); d.items[id] = it;
      var ids = Object.keys(d.items); if (ids.length > MAX){ ids.sort(function(a, b){ return (d.items[a].last || 0) - (d.items[b].last || 0); }); for (var i = 0; i < ids.length - MAX; i++) delete d.items[ids[i]]; }
      save(d);
    },
    acierto: function(q){
      if (!inside() || !q) return; if (typeof q === 'string') q = {es:q};
      var d = load(), id = idOf(q), it = d.items[id]; if (!it || it.due > Date.now()) return;
      it.box = (it.box || 0) + 1; if (it.box >= GAPS.length) delete d.items[id]; else it.due = Date.now() + GAPS[it.box] * DAY;
      save(d);
    },
    pendientes: function(){ var d = load(), now = Date.now(), out = []; for (var k in d.items) if (d.items[k].due <= now) out.push(Object.assign({id:k}, d.items[k])); return out; },
    total: function(){ return Object.keys(load().items).length; }
  };
})();

</script>

uropean long bones…"},"x":{"es":"Análisis de 1.842 esqueletos: la caída arranca entre el 5000 y el 2000 a. C. y se detiene en la Edad del Hierro y época romana.","en":"Analysis of 1,842 skeletons: the decline starts between 5000 and 2000 BC and stops in the Iron Age and Roman period."},"s":"T1 · 1.3","o":[{"es":"Cae desde el Neolítico y se estabiliza en época romana","en":"Falls from the Neolithic and stabilises in Roman times"},{"es":"Aumenta de forma continua hasta hoy","en":"Rises steadily until today"},{"es":"Se mantiene igual desde el Paleolítico","en":"Has stayed the same since the Palaeolithic"},{"es":"Sube en el Neolítico y cae con Roma","en":"Rises in the Neolithic and falls with Rome"}]},{"id":"happ-card-t1-0","f":"C","t":1,"q":{"es":"En estos Juegos se disputó por primera vez el 800 m lisos femenino.","en":"These Games saw the first ever women's 800 m race."},"x":{"es":"Ámsterdam 1928 acogió la primera final olímpica de 800 m femeninos. Todas las atletas terminaron y se batió el récord mundial, si bien las crónicas sobre desmayos sirvieron para vetar las pruebas femeninas de más de 200 m hasta Roma 1960.","en":"Amsterdam 1928 hosted the first Olympic women's 800 m final. Every athlete finished and a world record was set, although press stories about fainting were used to ban women's events over 200 m until Rome 1960."},"s":"T1 · 1.1","vf":true,"img":"../img/t1/cartel_amsterdam_1928.jpg","cap":{"es":"Cartel de los JJ. OO. de Ámsterdam, 1928","en":"Poster of the Amsterdam Olympic Games, 1928"}},{"id":"happ-card-t1-1","f":"P","t":1,"q":{"es":"La corredora de la imagen fue la primera mujer en terminar el maratón de Boston.","en":"The runner in the picture was the first woman to finish the Boston Marathon."},"x":{"es":"Es Kathrine Switzer, que corrió con dorsal en 1967 y fue famosa porque un organizador intentó expulsarla de la carrera. Bobbi Gibb ya lo había terminado en 1966, escondida entre unos arbustos hasta la salida.","en":"This is Kathrine Switzer, who ran with a bib in 1967 and became famous when an official tried to drag her off the course. Bobbi Gibb had already finished it in 1966, having hidden in the bushes before the start."},"s":"T1 · 1.1","vf":false,"img":"../img/t1/switzer_boston_1967.jpg","cap":{"es":"Maratón de Boston, 1967","en":"Boston Marathon, 1967"}},{"id":"happ-card-t1-2","f":"P","t":1,"q":{"es":"Esta atleta ganó el maratón olímpico con 38 años.","en":"This athlete won the Olympic marathon at the age of 38."},"x":{"es":"Constantina Dita-Tomescu venció en Pekín con 2 h 26 min. Comparado con las 4 h 20 min de Switzer en 1967, el dato muestra cuánto cambió el maratón femenino en cuatro décadas.","en":"Constantina Dita-Tomescu won in Beijing in 2 h 26 min. Compared with Switzer's 4 h 20 min in 1967, the figure shows how much women's marathon running changed in four decades."},"s":"T1 · 1.1","vf":true,"img":"../img/t1/dita_pekin_2008.jpg","cap":{"es":"Maratón olímpico, Pekín 2008","en":"Olympic marathon, Beijing 2008"}},{"id":"happ-card-t1-3","f":"F","t":1,"q":{"es":"Este informe es una fuente indirecta.","en":"This report is an indirect source."},"x":{"es":"Es una fuente directa, porque fue producida por el propio Comité con la intención de registrar lo sucedido. Por su temporalidad es además una fuente primaria.","en":"It is a direct source, since the Committee produced it with the intention of recording what happened. In terms of timing it is also a primary source."},"s":"T1 · 1.1","vf":false,"img":"../img/t1/report_amsterdam_1928.jpg","cap":{"es":"Informe oficial de los JJ. OO. de 1928","en":"Official Report of the 1928 Olympic Games"}},{"id":"happ-card-t1-4","f":"F","t":1,"q":{"es":"Esta pintura etrusca es un ejemplo de fuente indirecta.","en":"This Etruscan painting is an example of an indirect source."},"x":{"es":"La pintura funeraria no se hizo para registrar la historia, de modo que el historiador tiene que interpretarla. Muestra a un hombre corriendo o bailando en la necrópolis de Monterozzi.","en":"The tomb painting was not made to record history, so the historian has to interpret it. It shows a man running or dancing, in the Monterozzi necropolis."},"s":"T1 · 1.1","vf":true,"img":"../img/t1/tumba_augures.jpg","cap":{"es":"Tumba de los Augures, Tarquinia, h. 530-520 a. C.","en":"Tomb of the Augurs, Tarquinia, c. 530-520 BC"}},{"id":"happ-card-t1-5","f":"F","t":1,"q":{"es":"Esta pintura egipcia es una fuente secundaria.","en":"This Egyptian painting is a secondary source."},"x":{"es":"Fue producida por la propia sociedad estudiada, de modo que es una fuente primaria. Según su intención es indirecta, porque no se pintó para registrar la historia.","en":"It was produced by the society under study, so it is a primary source. By intention it is indirect, because it was not painted to record history."},"s":"T1 · 1.1","vf":false,"img":"../img/t1/jirafa_rekhmire.jpg","cap":{"es":"Tumba de Rekhmire, Egipto, h. 1500 a. C.","en":"Tomb of Rekhmire, Egypt, c. 1500 BC"}},{"id":"happ-card-t1-6","f":"F","t":1,"q":{"es":"Es una fuente primaria para el estudio de los juegos medievales.","en":"It is a primary source for the study of medieval games."},"x":{"es":"El manuscrito fue elaborado en la Castilla del siglo XIII, la misma sociedad que describe. Por eso es primaria, frente a un libro actual sobre el mismo tema, que sería secundaria.","en":"The manuscript was made in thirteenth-century Castile, the same society it describes. That makes it primary, unlike a present-day book on the same topic, which would be secondary."},"s":"T1 · 1.1","vf":true,"img":"../img/t1/libro_juegos_alfonso_x.jpg","cap":{"es":"Libro de los Juegos de Alfonso X, 1283","en":"Book of Games of Alfonso X, 1283"}},{"id":"happ-card-t1-7","f":"F","t":1,"q":{"es":"Este libro es una fuente primaria.","en":"This book is a primary source."},"x":{"es":"Se escribió en 2004 sobre épocas muy anteriores, por lo que es una fuente secundaria. Procede de la tesis doctoral de José Luis Salvador y es uno de los compendios más completos en castellano.","en":"It was written in 2004 about much earlier periods, so it is a secondary source. It grew out of José Luis Salvador's doctoral thesis and is one of the most complete surveys in Spanish."},"s":"T1 · 1.1","vf":false,"img":"../img/t1/salvador_deporte_occidente.jpg","cap":{"es":"Salvador, J. L. (2004). El deporte en Occidente","en":"Salvador, J. L. (2004). El deporte en Occidente"}},{"id":"happ-card-t1-8","f":"C","t":1,"q":{"es":"La aparición de la escritura marca el paso de la Prehistoria a la Historia.","en":"The appearance of writing marks the passage from Prehistory to History."},"x":{"es":"La escritura surge en Sumeria a finales del IV milenio a. C. A partir de ahí se abren los cuatro grandes periodos: Edad Antigua, Media, Moderna y Contemporánea.","en":"Writing appears in Sumer at the end of the fourth millennium BC. From then on the four great periods begin: Ancient, Medieval, Modern and Contemporary."},"s":"T1 · 1.1","vf":true},{"id":"happ-card-t1-9","f":"F","t":1,"q":{"es":"La ciencia auxiliar que estudia estos restos es la numismática.","en":"The auxiliary science that studies these remains is numismatics."},"x":{"es":"Es la arqueología, que investiga las culturas pasadas a través de restos materiales. La numismática estudia monedas y medallas, como el real de a ocho que aparece en la misma diapositiva.","en":"It is archaeology, which investigates past cultures through material remains. Numismatics studies coins and medals, such as the Spanish piece of eight shown on the same slide."},"s":"T1 · 1.1","vf":false},{"id":"happ-card-t1-10","f":"F","t":1,"q":{"es":"La epigrafía es la ciencia que trabaja con este tipo de restos materiales.","en":"Epigraphy is the science that works with this kind of material remains."},"x":{"es":"La epigrafía estudia inscripciones sobre materiales duraderos. Las estatuas, edificaciones y artefactos son campo de la arqueología.","en":"Epigraphy studies inscriptions on durable materials. Statues, buildings and artefacts belong to archaeology."},"s":"T1 · 1.1","vf":false},{"id":"happ-card-t1-11","f":"P","t":1,"q":{"es":"Para Huizinga, el juego es anterior a la cultura.","en":"For Huizinga, play is older than culture."},"x":{"es":"Huizinga sostiene que la sociedad nace jugando. El juego se desarrolla dentro de un círculo mágico, un recinto con reglas propias que fuera no valdrían.","en":"Huizinga holds that society is born through play. Play unfolds inside a magic circle, a space with its own rules that would not apply outside it."},"s":"T1 · 1.2","vf":true},{"id":"happ-card-t1-12","f":"P","t":1,"q":{"es":"Para Elias y Dunning el impulso deportivo es un producto de la sociedad.","en":"For Elias and Dunning the sporting impulse is a product of society."},"x":{"es":"Justo al revés que Huizinga. A medida que las sociedades europeas rebajaron su tolerancia a la violencia, el deporte se convirtió en un descontrol controlado de las emociones.","en":"The opposite of Huizinga. As European societies lowered their tolerance of violence, sport became a controlled de-controlling of emotions."},"s":"T1 · 1.2","vf":true},{"id":"happ-card-t1-13","f":"P","t":1,"q":{"es":"En esta obra se proponen las tres culturas corporales.","en":"This book proposes the three body cultures."},"x":{"es":"Guttmann propone los siete rasgos del deporte moderno: secularismo, igualdad, especialización, racionalización, burocratización, cuantificación y récord. Las tres culturas corporales son de Eichberg.","en":"Guttmann proposes the seven characteristics of modern sport: secularism, equality, specialisation, rationalisation, bureaucratisation, quantification and the record. The three body cultures belong to Eichberg."},"s":"T1 · 1.2","vf":false,"img":"../img/t1/guttmann_ritual_record.jpg","cap":{"es":"Guttmann, A. (1978). From Ritual to Record","en":"Guttmann, A. (1978). From Ritual to Record"}},{"id":"happ-card-t1-14","f":"P","t":1,"q":{"es":"Eichberg sostiene que los siete rasgos de Guttmann describen bien la cultura del rendimiento y no ven las otras dos.","en":"Eichberg argues that Guttmann's seven characteristics describe achievement culture well and miss the other two."},"x":{"es":"Las tres culturas corporales son rendimiento, disciplina y forma física, y fiesta popular. Las tres conviven en cualquier sociedad, y medir el pasado solo con los siete rasgos lo describe siempre por lo que le falta.","en":"The three body cultures are achievement, discipline and fitness, and popular festivity. All three coexist in any society, and measuring the past only with the seven characteristics always describes it by what it lacks."},"s":"T1 · 1.2","vf":true},{"id":"happ-card-t1-15","f":"C","t":1,"q":{"es":"La bipedestación se explica por una única causa adaptativa.","en":"Bipedalism is explained by a single adaptive cause."},"x":{"es":"Fue un fenómeno multicausal en el que intervinieron varias ventajas adaptativas. Marca el inicio de la Humanidad.","en":"It was a multi-causal phenomenon in which several adaptive advantages played a part. It marks the beginning of humankind."},"s":"T1 · 1.3","vf":false},{"id":"happ-card-t1-16","f":"P","t":1,"q":{"es":"Diem y Popplow consideran la danza la primera expresión de la cultura física.","en":"Diem and Popplow regard dance as the first expression of physical culture."},"x":{"es":"Es la teoría cultural (Alemania Occidental). Popplow distingue danzas de naturaleza erótica, mágica y guerrera, y sitúa el juego como subsuelo de todas ellas.","en":"This is the cultural theory (West Germany). Popplow distinguishes erotic, magical and warlike dances, and places play as the ground beneath all of them."},"s":"T1 · 1.3","vf":true},{"id":"happ-card-t1-17","f":"P","t":1,"q":{"es":"Maslow dibujó esta pirámide en su artículo de 1943.","en":"Maslow drew this pyramid in his 1943 article."},"x":{"es":"La jerarquía es de 1943, pero la representación piramidal se difundió con posterioridad. Sirve para ordenar las teorías sobre el origen del ejercicio, desde la supervivencia hasta lo lúdico.","en":"The hierarchy dates from 1943, but the pyramid diagram spread later. It helps to order the theories on the origin of exercise, from survival to play."},"s":"T1 · 1.3","vf":false},{"id":"happ-card-t1-18","f":"P","t":1,"q":{"es":"Blanchard y Cheska aplicaron el método arqueológico al deporte primitivo.","en":"Blanchard and Cheska applied the archaeological method to primitive sport."},"x":{"es":"Aplicaron el método antropológico: recopilaron en 1985 la información sobre pueblos sin escritura ni Estado para catalogar sus formas de deporte mediante analogía etnográfica.","en":"They applied the anthropological method: in 1985 they gathered the information on peoples without writing or a state to catalogue their forms of sport through ethnographic analogy."},"s":"T1 · 1.3","vf":false},{"id":"happ-card-t1-19","f":"C","t":1,"q":{"es":"La analogía etnográfica informa de cómo vivía exactamente el hombre prehistórico.","en":"Ethnographic analogy tells us exactly how prehistoric humans lived."},"x":{"es":"Informa de qué funciones puede desempeñar la actividad física en sociedades sin escritura ni Estado. De ahí salen ejes como la identidad social o la preparación para la supervivencia.","en":"It tells us what functions physical activity can perform in societies without writing or a state. From that come axes such as social identity or preparation for survival."},"s":"T1 · 1.3","vf":false},{"id":"happ-card-t1-20","f":"C","t":1,"q":{"es":"Los Juegos Esquimales son un caso de estudio del método antropológico.","en":"The Eskimo Games are a case study of the anthropological method."},"x":{"es":"Los World Eskimo-Indian Olympics conservan pruebas ligadas a la supervivencia y a las tradiciones culturales, y permiten observar en vivo funciones que el registro arqueológico no muestra.","en":"The World Eskimo-Indian Olympics preserve events linked to survival and cultural tradition, and let us observe functions that the archaeological record does not show."},"s":"T1 · 1.3","vf":true},{"id":"happ-card-t1-21","f":"F","t":1,"q":{"es":"Se sabe con certeza que este objeto era un juguete.","en":"We know for certain that this object was a toy."},"x":{"es":"Podría ser un juguete o un objeto votivo o mágico. El registro arqueológico prehistórico es escaso y los materiales admiten interpretaciones distintas según el historiador.","en":"It could be a toy or a votive or magical object. The prehistoric archaeological record is scarce and the materials allow different interpretations depending on the historian."},"s":"T1 · 1.3","vf":false},{"id":"happ-card-t1-22","f":"F","t":1,"q":{"es":"Estas bolas son del Paleolítico.","en":"These balls date from the Palaeolithic."},"x":{"es":"Son del Neolítico tardío, hacia 3200-2500 a. C. Aparecen por toda Escocia y se han interpretado como canicas, proyectiles o representaciones de cuerpos celestes.","en":"They are Late Neolithic, c. 3200-2500 BC. They appear all over Scotland and have been read as marbles, projectiles or representations of celestial bodies."},"s":"T1 · 1.3","vf":false,"img":"../img/t1/canicas_orcadas.jpg","cap":{"es":"Bolas de piedra, Islas Orcadas","en":"Carved stone balls, Orkney"}},{"id":"happ-card-t1-23","f":"F","t":1,"q":{"es":"La escena representa la recolección de miel.","en":"The scene shows honey gathering."},"x":{"es":"Es arte rupestre levantino, con una cronología discutida, posiblemente entre el 10.000 y el 5.000 a. C. Muestra el rastro que dejó el trabajo del cuerpo.","en":"It is Levantine rock art, with a disputed chronology, possibly between 10,000 and 5,000 BC. It shows the trace left by the working body."},"s":"T1 · 1.3","vf":true,"img":"../img/t1/cueva_arana_miel.jpg","cap":{"es":"Cueva de la Araña, Bicorp (Valencia)","en":"Cueva de la Araña, Bicorp (Valencia)"}},{"id":"happ-card-t1-24","f":"L","t":1,"q":{"es":"Este abrigo está en la provincia de Castellón.","en":"This rock shelter is in the province of Castellón."},"x":{"es":"Está en Castellote (Teruel). Representa también una recolección de miel, dentro del arte rupestre levantino.","en":"It is in Castellote (Teruel). It also depicts honey gathering, within Levantine rock art."},"s":"T1 · 1.3","vf":false,"img":"../img/t1/barranco_gomez_miel.jpg","cap":{"es":"Abrigo del Barranco Gómez","en":"Barranco Gómez rock shelter"}},{"id":"happ-card-t1-25","f":"F","t":1,"q":{"es":"Es el bumerán más antiguo conocido y está tallado en marfil de mamut.","en":"It is the oldest known boomerang and is carved from mammoth ivory."},"x":{"es":"La pieza no pudo datarse directamente, de modo que se fechó el nivel en el que apareció, entre 40.300 y 37.300 a. C. (Talamo et al., 2025).","en":"The piece could not be dated directly, so the layer in which it appeared was dated, between 40,300 and 37,300 BC (Talamo et al., 2025)."},"s":"T1 · 1.3","vf":true,"img":"../img/t1/bumeran_oblazowa.jpg","cap":{"es":"Cueva de Obłazowa, Polonia","en":"Obłazowa Cave, Poland"}},{"id":"happ-card-t1-26","f":"F","t":1,"q":{"es":"Esta escena de caza pertenece al arte paleolítico franco-cantábrico.","en":"This hunting scene belongs to Franco-Cantabrian Palaeolithic art."},"x":{"es":"Es arte rupestre levantino, con figuras humanas en movimiento y cronología discutida, posiblemente entre el 10.000 y el 5.000 a. C.","en":"It is Levantine rock art, with human figures in motion and a disputed chronology, possibly between 10,000 and 5,000 BC."},"s":"T1 · 1.3","vf":false,"img":"../img/t1/valltorta_caza.jpg","cap":{"es":"Barranco de la Valltorta (Castellón)","en":"Valltorta gorge (Castellón)"}},{"id":"happ-card-t1-27","f":"L","t":1,"q":{"es":"Las cometas del desierto eran estructuras defensivas frente a invasores.","en":"Desert kites were defensive structures against invaders."},"x":{"es":"Son trampas de caza: dos muros largos convergentes que funcionan como un embudo para conducir a los animales a un recinto o foso.","en":"They are hunting traps: two long converging walls acting as a funnel to drive animals into an enclosure or pit."},"s":"T1 · 1.3","vf":false},{"id":"happ-card-t1-28","f":"L","t":1,"q":{"es":"Hay más de 6.000 cometas catalogadas desde Arabia hasta Asia Central.","en":"More than 6,000 kites have been catalogued from Arabia to Central Asia."},"x":{"es":"Su uso se extendió durante milenios. Las evidencias más antiguas de uso proceden del sureste de Jordania (Tarawneh et al., 2026).","en":"Their use lasted for millennia. The earliest evidence of use comes from south-eastern Jordan (Tarawneh et al., 2026)."},"s":"T1 · 1.3","vf":true},{"id":"happ-card-t1-29","f":"S","t":1,"q":{"es":"La resistencia del fémur y la tibia cae a partir del Neolítico y deja de cambiar en época romana.","en":"Femur and tibia strength falls from the Neolithic onwards and stops changing in Roman times."},"x":{"es":"El estudio de 1.842 esqueletos europeos muestra una caída que arranca entre el 5000 y el 2000 a. C. y se detiene en la Edad del Hierro y época romana, ligada a la adopción de la agricultura.","en":"The study of 1,842 European skeletons shows a decline starting between 5000 and 2000 BC and stopping in the Iron Age and Roman period, linked to the adoption of farming."},"s":"T1 · 1.3","vf":true},{"id":"happ-card-t1-30","f":"S","t":1,"q":{"es":"Las mujeres del Neolítico tenían húmeros más resistentes que las remeras de élite actuales.","en":"Neolithic women had stronger humeri than today's elite rowers."},"x":{"es":"Macintosh et al. (2017) hallaron húmeros entre un 11 y un 16 % más resistentes que los de las remeras de Cambridge, que entrenaban dos veces al día.","en":"Macintosh et al. (2017) found humeri 11 to 16 % stronger than those of Cambridge rowers who trained twice a day."},"s":"T1 · 1.3","vf":true},{"id":"happ-card-t1-31","f":"S","t":1,"q":{"es":"Este útil se asocia al trabajo manual femenino que explica la fuerza de los brazos en el Neolítico.","en":"This tool is linked to the female manual labour that explains arm strength in the Neolithic."},"x":{"es":"Moler grano a mano durante horas es una de las tareas que Macintosh et al. relacionan con la rigidez del húmero en las mujeres agricultoras centroeuropeas.","en":"Grinding grain by hand for hours is one of the tasks Macintosh et al. link to humeral rigidity in Central European farming women."},"s":"T1 · 1.3","vf":true,"img":"../img/t1/molino_de_mano.jpg","cap":{"es":"Molino de mano neolítico","en":"Neolithic hand mill"}},{"id":"happ-card-t1-32","f":"F","t":1,"q":{"es":"Esta escena de arte rupestre levantino tiene una datación exacta y segura.","en":"This Levantine rock-art scene has an exact and secure date."},"x":{"es":"Su cronología sigue discutida, posiblemente entre el 10.000 y el 5.000 a. C., igual que la del panel de la Cueva de la Araña, que muestra la misma actividad de subsistencia.","en":"Its chronology is still debated, possibly between 10,000 and 5,000 BC, like that of the Cueva de la Araña panel, which shows the same subsistence activity."},"s":"T1 · 1.3","vf":false,"img":"../img/t1/barranco_gomez_detalle.jpg","cap":{"es":"Recolección de miel. Abrigo del Barranco Gómez (Castellote, Teruel)","en":"Honey gathering. Barranco Gómez rock shelter (Castellote, Teruel)"}},{"id":"happ-card-t1-33","f":"F","t":1,"q":{"es":"La fecha de 40.300-37.300 a. C. se obtuvo datando directamente el bumerán.","en":"The date of 40,300-37,300 BC was obtained by dating the boomerang itself."},"x":{"es":"La pieza no pudo datarse de forma directa, de modo que la fecha corresponde al estrato arqueológico en que apareció (Talamo et al., 2025). Aun así, es el bumerán más antiguo que se conoce.","en":"The piece could not be dated directly, so the date belongs to the archaeological layer in which it was found (Talamo et al., 2025). Even so, it is the oldest known boomerang."},"s":"T1 · 1.3","vf":false},{"id":"happ-card-t1-34","f":"F","t":1,"q":{"es":"Una estatua como esta es objeto de estudio de la arqueología, una de las ciencias auxiliares de la Historia.","en":"A statue like this is studied by archaeology, one of the auxiliary sciences of History."},"x":{"es":"La arqueología interroga los restos materiales de sociedades que no dejaron textos sobre sí mismas y, junto a la numismática, la paleografía o la epigrafía, forma parte de las ciencias auxiliares de la Historia.","en":"Archaeology questions the material remains of societies that left no texts about themselves and, together with numismatics, palaeography and epigraphy, is one of the auxiliary sciences of History."},"s":"T1 · 1.1","vf":true,"img":"../img/t1/moai_ladera.jpg","cap":{"es":"Moái de la Isla de Pascua excavado hasta la base","en":"Easter Island moai excavated down to its base"}},{"id":"happ-card-t1-35","f":"P","t":1,"q":{"es":"La ganadora, Lina Radke, batió el récord del mundo.","en":"The winner, Lina Radke, set a world record."},"x":{"es":"Las nueve atletas que tomaron la salida terminaron la carrera y Radke batió el récord mundial (Robinson, 2018). El desplome que repitieron durante décadas los manuales lo inventó la prensa de la época.","en":"All nine athletes who started finished the race and Radke set a world record (Robinson, 2018). The collapse repeated for decades in textbooks was invented by the press of the time."},"s":"T1 · 1.1","vf":true,"img":"../img/t1/report_800m_ganadoras.jpg","cap":{"es":"Report oficial de Ámsterdam 1928. Ganadoras de los 800 m","en":"Official report of Amsterdam 1928. Winners of the 800 m"}},{"id":"happ-card-t1-36","f":"M","t":1,"q":{"es":"Varias corredoras abandonaron la final exhaustas antes de llegar a la meta.","en":"Several runners dropped out of the final exhausted before reaching the line."},"x":{"es":"Nueve atletas tomaron la salida y las nueve terminaron. El bulo del desplome, difundido por cronistas como John Tunis, sirvió al COI para vetar las pruebas femeninas de más de 200 m hasta Roma 1960.","en":"Nine athletes started and all nine finished. The collapse hoax, spread by reporters such as John Tunis, was used by the IOC to ban women's events over 200 m until Rome 1960."},"s":"T1 · 1.1","vf":false,"img":"../img/t1/report_800m_resultados.jpg","cap":{"es":"Report oficial de Ámsterdam 1928. Resultados de la final de 800 m","en":"Official report of Amsterdam 1928. Results of the 800 m final"}},{"id":"happ-card-t1-37","f":"S","t":1,"q":{"es":"Está demostrado que en la Prehistoria la caza era cosa de hombres y la pesca, del grupo entero.","en":"It is proven that in Prehistory hunting was for men and fishing for the whole group."},"x":{"es":"Esa división se dio por supuesta durante décadas, pero no está probada para ninguna de las dos actividades. La investigación reciente documenta muchas más mujeres cazadoras de lo que suponía el modelo del «hombre cazador» (Anderson et al., 2023; Haas et al., 2020).","en":"That division was taken for granted for decades, but it is not proven for either activity. Recent research documents far more women hunters than the “man the hunter” model assumed (Anderson et al., 2023; Haas et al., 2020)."},"s":"T1 · 1.3","vf":false},{"id":"happ-card-t1-38","f":"M","t":1,"q":{"es":"El propulsor y la azagaya forman parte de los útiles de caza prehistóricos.","en":"The spear-thrower and dart are among the prehistoric hunting tools."},"x":{"es":"Junto al arco y la flecha, la jabalina, la honda y el bumerán, y a estrategias como la persecución, el acecho o la emboscada, sitúan en la Prehistoria un adiestramiento corporal ligado a la supervivencia.","en":"Together with the bow and arrow, the javelin, the sling and the boomerang, and strategies such as pursuit, stalking and ambush, they place in Prehistory a bodily training linked to survival."},"s":"T1 · 1.3","vf":true},{"id":"happ-card-t1-39","f":"P","t":1,"q":{"es":"Para Carr, el método histórico consiste sobre todo en acumular datos verificados.","en":"For Carr, the historical method consists mainly of accumulating verified data."},"x":{"es":"Carr lo resume en tres operaciones, conocer un hecho, interpretarlo dentro de una pregunta y elaborar con él una conclusión razonada (Carr, 1961/2010, p. 60), y corrige así a Ranke, que creía que los hechos hablan por sí solos.","en":"Carr sums it up in three operations, knowing a fact, interpreting it within a question and drawing a reasoned conclusion from it (Carr, 1961/2010, p. 60), thereby correcting Ranke, who believed that facts speak for themselves."},"s":"T1 · 1.1","vf":false},{"id":"happ-card-t1-40","f":"P","t":1,"q":{"es":"Corrió el maratón olímpico y su tiempo quedó registrado de forma oficial.","en":"She ran the Olympic marathon and her time was officially recorded."},"x":{"es":"Corrió casi todo el recorrido al día siguiente de la carrera masculina, pero no la dejaron entrar al estadio ni se registró su tiempo, de modo que quedó fuera del archivo oficial por decisión ajena.","en":"She ran almost the whole course the day after the men's race, but she was not allowed into the stadium and her time was not recorded, so she was left out of the official record by someone else's decision."},"s":"T1 · 1.1","vf":false,"img":"../img/t1/revithi.jpg","cap":{"es":"Stamata Revithi, Atenas 1896","en":"Stamata Revithi, Athens 1896"}},{"id":"happ-card-t1-41","f":"P","t":1,"q":{"es":"Muchas organizaciones la consideran la primera mujer en completar un maratón con registro formal de tiempo.","en":"Many organisations regard her as the first woman to complete a marathon with a formally recorded time."},"x":{"es":"Completó en 1964 el maratón de la Isla de Wight, en Inglaterra, en 3 h 27 min.","en":"In 1964 she completed the Isle of Wight marathon, in England, in 3 h 27 min."},"s":"T1 · 1.1","vf":true,"img":"../img/t1/greig.jpg","cap":{"es":"Dale Greig, 1964","en":"Dale Greig, 1964"}},{"id":"happ-card-t1-42","f":"P","t":1,"q":{"es":"Corrió el maratón de Boston con dorsal oficial.","en":"She ran the Boston Marathon with an official bib."},"x":{"es":"La organización rechazó su inscripción alegando que las mujeres «no estaban fisiológicamente capacitadas» (Jutel, 2003). Corrió escondida entre los arbustos de la salida y sin dorsal, y terminó un año antes que Switzer.","en":"The organisers rejected her entry, claiming that women were “not physiologically able” (Jutel, 2003). She ran after hiding in the bushes at the start, without a bib, and finished a year before Switzer."},"s":"T1 · 1.1","vf":false,"img":"../img/t1/gibb.jpg","cap":{"es":"Bobbi Gibb, Boston 1966","en":"Bobbi Gibb, Boston 1966"}},{"id":"happ-card-t1-43","f":"F","t":1,"q":{"es":"Una fuente primaria es la que elabora la propia sociedad que se investiga, en su propio tiempo.","en":"A primary source is one produced by the society under study, in its own time."},"x":{"es":"La secundaria la interpreta después, a veces siglos más tarde. Este criterio atiende a la cercanía temporal, mientras que el de fuente directa o indirecta atiende a la intención de quien la produjo.","en":"A secondary source interprets it later, sometimes centuries afterwards. This criterion looks at closeness in time, whereas direct and indirect sources are distinguished by the intention of whoever produced them."},"s":"T1 · 1.1","vf":true},{"id":"happ-card-t1-44","f":"F","t":1,"q":{"es":"Es una fuente secundaria sobre el ocio medieval.","en":"It is a secondary source on medieval leisure."},"x":{"es":"Se terminó en Sevilla en 1283, en la misma época que documenta, así que es una fuente primaria. Es, además, el tratado europeo más antiguo dedicado al ajedrez.","en":"It was completed in Seville in 1283, in the very period it documents, so it is a primary source. It is also the oldest European treatise devoted to chess."},"s":"T1 · 1.1","vf":false,"img":"../img/t1/libro_juegos_pagina.jpg","cap":{"es":"Libro de los juegos de Alfonso X el Sabio, 1283","en":"Alfonso X the Wise's Book of Games, 1283"}},{"id":"happ-card-t1-45","f":"C","t":1,"q":{"es":"La periodización clásica toma la aparición de la escritura como frontera entre la Prehistoria y la Historia.","en":"Classical periodisation takes the appearance of writing as the boundary between Prehistory and History."},"x":{"es":"Esa frontera se sitúa en Sumeria, a finales del IV milenio a. C., y es la que ilustra la tablilla sumeria con escritura cuneiforme.","en":"That boundary lies in Sumer, at the end of the 4th millennium BC, and it is illustrated by the Sumerian tablet with cuneiform writing."},"s":"T1 · 1.1","vf":true},{"id":"happ-card-t1-46","f":"C","t":1,"q":{"es":"Esta división en edades sirve igual para cualquier civilización del mundo.","en":"This division into ages works equally well for any civilisation in the world."},"x":{"es":"Es una convención europea cómoda de manejar, aunque sus hitos pertenecen a la historia del Mediterráneo y dicen muy poco de sociedades que marchaban con su propio reloj, como China o la América precolombina.","en":"It is a convenient European convention, although its milestones belong to Mediterranean history and say very little about societies that kept their own time, such as China or pre-Columbian America."},"s":"T1 · 1.1","vf":false,"img":"../img/t1/edades_historia.jpg","cap":{"es":"Las edades de la Historia","en":"The ages of History"}},{"id":"happ-card-t1-47","f":"C","t":1,"q":{"es":"El enfoque diacrónico congela un momento concreto y estudia sus conexiones internas.","en":"The diachronic approach freezes a particular moment and studies its internal connections."},"x":{"es":"Eso es el enfoque sincrónico. El diacrónico sigue un fenómeno a lo largo del tiempo, por ejemplo cómo la lucha pasa del rito de iniciación al deporte reglado.","en":"That is the synchronic approach. The diachronic one follows a phenomenon over time, for example how wrestling moves from initiation rite to regulated sport."},"s":"T1 · 1.1","vf":false},{"id":"happ-card-t1-48","f":"C","t":1,"q":{"es":"Estudiar qué significaba el gimnasio en la Atenas del siglo V a. C. para su educación, su política y su religión es un análisis sincrónico.","en":"Studying what the gymnasium meant in 5th-century BC Athens for its education, politics and religion is a synchronic analysis."},"x":{"es":"El enfoque sincrónico se detiene en un momento y analiza sus conexiones internas. Ninguna de las dos miradas basta por sí sola, y el historiador alterna entre ellas según lo que quiera comprender.","en":"The synchronic approach stops at one moment and analyses its internal connections. Neither view is enough on its own, and historians switch between them depending on what they want to understand."},"s":"T1 · 1.1","vf":true},{"id":"happ-card-t1-49","f":"C","t":1,"q":{"es":"La historia de las actividades físicas estudia el deporte en sus relaciones con las culturas pasadas y contemporáneas.","en":"The history of physical activities studies sport in its relations with past and present cultures."},"x":{"es":"Así la define la asignatura (Pérez y Verdes, 1998), de modo que el deporte se estudia como parte de la cultura de la sociedad que lo practica y no como una simple lista de hechos.","en":"That is how the course defines it (Pérez & Verdes, 1998), so sport is studied as part of the culture of the society that practises it and not as a mere list of events."},"s":"T1 · 1.1","vf":true},{"id":"happ-card-t1-50","f":"C","t":1,"q":{"es":"El diccionario recoge también un sentido de deporte como recreación o pasatiempo, sin competición.","en":"The dictionary also records a sense of sport as recreation or pastime, without competition."},"x":{"es":"La primera acepción habla de actividad física con competición, entrenamiento y normas, y la segunda, de recreación, pasatiempo o ejercicio al aire libre, la misma tensión que separa el enfoque cerrado del abierto.","en":"The first sense refers to physical activity with competition, training and rules, and the second to recreation, pastime or outdoor exercise, the same tension that separates the narrow and broad approaches."},"s":"T1 · 1.2","vf":true},{"id":"happ-card-t1-51","f":"C","t":1,"q":{"es":"Un partido profesional de fútbol encaja en el enfoque cerrado del deporte.","en":"A professional football match fits the narrow approach to sport."},"x":{"es":"El enfoque cerrado entiende el deporte como actividad física reglada, competitiva e institucionalizada que busca el máximo rendimiento.","en":"The narrow approach understands sport as regulated, competitive and institutionalised physical activity that seeks maximum performance."},"s":"T1 · 1.2","vf":true},{"id":"happ-card-t1-52","f":"C","t":1,"q":{"es":"Para el enfoque cerrado, esta actividad es deporte.","en":"Under the narrow approach, this activity counts as sport."},"x":{"es":"Solo cabe en el enfoque abierto de la Carta Europea del Deporte (Consejo de Europa, 1992), que incluye toda actividad, organizada o no, dirigida a la expresión o a la mejora física o psíquica.","en":"It only fits the broad approach of the European Sports Charter (Council of Europe, 1992), which includes any activity, organised or not, aimed at physical or mental expression or improvement."},"s":"T1 · 1.2","vf":false},{"id":"happ-card-t1-53","f":"C","t":1,"q":{"es":"La Prehistoria es la etapa más corta y mejor documentada de la historia humana.","en":"Prehistory is the shortest and best-documented stage of human history."},"x":{"es":"Es, con enorme diferencia, la más larga y la peor documentada, porque carece de escritura y porque la madera, la fibra o la cuerda se conservan muy raramente (Kretchmar et al., 2017).","en":"It is by far the longest and the worst documented, because it has no writing and because wood, fibre and cord very rarely survive (Kretchmar et al., 2017)."},"s":"T1 · 1.3","vf":false},{"id":"happ-card-t1-54","f":"M","t":1,"q":{"es":"Para Eichel, el lanzamiento de la jabalina está entre los ejercicios corporales más antiguos, de hace unos 70.000 años.","en":"For Eichel, javelin throwing is among the oldest bodily exercises, some 70,000 years old."},"x":{"es":"Eichel sostiene que el ejercicio corporal nace del trabajo, de modo que al cazador le siguen el arpón del pescador y, hace unos 24.000 años, el arco (Betancor y Vilanou, 1995, p. 37).","en":"Eichel argues that bodily exercise arises from work, so the hunter is followed by the fisherman's harpoon and, some 24,000 years ago, by the bow (Betancor y Vilanou, 1995, p. 37)."},"s":"T1 · 1.3","vf":true},{"id":"happ-card-t1-55","f":"M","t":1,"q":{"es":"Los World Eskimo-Indian Olympics nacieron en 1961 para mantener vivas las prácticas corporales de estas comunidades.","en":"The World Eskimo-Indian Olympics were founded in 1961 to keep these communities' bodily practices alive."},"x":{"es":"Los fundaron comunidades inuit de Alaska, Canadá y Groenlandia, con pruebas como la sogatira, la patada a un pie o la danza del tambor, frente a la homogeneización del deporte occidental (Kretchmar et al., 2017).","en":"They were founded by Inuit communities from Alaska, Canada and Greenland, with events such as tug-of-war, the one-foot high kick and the drum dance, in response to the homogenisation of Western sport (Kretchmar et al., 2017)."},"s":"T1 · 1.3","vf":true},{"id":"happ-card-t1-56","f":"F","t":1,"q":{"es":"Una escena pintada como esta es siempre un documento fiel de una actividad real.","en":"A painted scene like this is always a faithful record of a real activity."},"x":{"es":"Hay que distinguir qué documenta una actividad real y qué es convención estilística o símbolo, y además su cronología es discutida, posiblemente entre el 10.000 y el 5.000 a. C.","en":"We must distinguish what records a real activity from what is stylistic convention or symbol, and its chronology is also debated, possibly between 10,000 and 5,000 BC."},"s":"T1 · 1.3","vf":false,"img":"../img/t1/levantino_ciervos.jpg","cap":{"es":"Escena de caza de ciervos. Arte rupestre levantino","en":"Deer-hunting scene. Levantine rock art"}},{"id":"happ-quiz-t2-0","f":"M","t":2,"q":{"es":"¿Cuál era la disciplina favorita del deporte real egipcio?","en":"What was the favourite discipline of Egyptian royal sport?"},"x":{"es":"Florece en el Imperio Nuevo con el arco compuesto; sirve para que el rey, y nadie más, demuestre que su fuerza sigue intacta.","en":"It flourished in the New Kingdom with the composite bow; it lets the king, and no one else, show that his strength remains intact."},"s":"T2 · 2.1.2","o":[{"es":"Tiro con arco sobre dianas de cobre","en":"Archery at copper targets"},{"es":"Lucha ante la corte del palacio","en":"Wrestling before the palace court"},{"es":"Carreras de carros en el hipódromo","en":"Chariot races in the hippodrome"},{"es":"Natación en el Nilo durante la crecida","en":"Swimming in the Nile during the flood"}]},{"id":"happ-quiz-t2-1","f":"S","t":2,"q":{"es":"¿Cada cuánto se repetía el Heb-Sed tras el primer jubileo?","en":"How often was the Heb-Sed repeated after the first jubilee?"},"x":{"es":"Se celebraba a los treinta años de reinado y luego cada tres. Ramsés II celebró trece o catorce en 66 años.","en":"It was held after thirty years of reign and then every three. Ramesses II held thirteen or fourteen in 66 years."},"s":"T2 · 2.1.2","o":[{"es":"Cada tres años","en":"Every three years"},{"es":"Cada año","en":"Every year"},{"es":"Cada diez años","en":"Every ten years"},{"es":"Cada treinta años","en":"Every thirty years"}]},{"id":"happ-quiz-t2-2","f":"L","t":2,"q":{"es":"¿Qué longitud tenía el circuito completo de la carrera del Heb-Sed en Saqqara?","en":"How long was the full Heb-Sed race circuit at Saqqara?"},"x":{"es":"Recta de 55 m con dos mojones semicirculares; el circuito completo sumaba 140 m, corridos de norte a sur y de sur a norte.","en":"A 55 m straight with two semicircular markers; the full circuit was 140 m, run north to south and south to north."},"s":"T2 · 2.1.2","o":[{"es":"140 m","en":"140 m"},{"es":"55 m","en":"55 m"},{"es":"400 m","en":"400 m"},{"es":"1 km","en":"1 km"}]},{"id":"happ-quiz-t2-3","f":"P","t":2,"q":{"es":"¿Quién acuñó el concepto de Pharao ludens?","en":"Who coined the concept of Pharao ludens?"},"x":{"es":"Siguiendo a Huizinga, describe a un soberano cuya función se ejerce, en parte, jugando.","en":"Following Huizinga, it describes a ruler whose office is exercised, in part, through play."},"s":"T2 · 2.1.2","o":[{"es":"Erik Hornung (1982)","en":"Erik Hornung (1982)"},{"es":"Wolfgang Decker (1992)","en":"Wolfgang Decker (1992)"},{"es":"Johan Huizinga (1938)","en":"Johan Huizinga (1938)"},{"es":"Allen Guttmann (2004)","en":"Allen Guttmann (2004)"}]},{"id":"happ-quiz-t2-4","f":"C","t":2,"q":{"es":"¿Cuándo surge el ejército profesional permanente egipcio?","en":"When does the Egyptian standing professional army emerge?"},"x":{"es":"Levas obligatorias de jóvenes campesinos alojados en campamentos de hasta 5.000 soldados; el Estado premiaba el servicio con tierras.","en":"Compulsory levies of young peasants housed in camps of up to 5,000 soldiers; the state rewarded service with land."},"s":"T2 · 2.1.4","o":[{"es":"En el Imperio Nuevo, tras la ocupación hicsa","en":"In the New Kingdom, after the Hyksos occupation"},{"es":"En el Imperio Antiguo, con las pirámides","en":"In the Old Kingdom, with the pyramids"},{"es":"En el Imperio Medio, con Beni Hasan","en":"In the Middle Kingdom, with Beni Hasan"},{"es":"Bajo dominio persa","en":"Under Persian rule"}]},{"id":"happ-quiz-t2-5","f":"M","t":2,"q":{"es":"¿Cuáles son las tres modalidades de combate egipcias?","en":"What are the three Egyptian combat disciplines?"},"x":{"es":"Decker (1992) las ordena en tres contextos: preparación militar, ceremonias ante el rey y cultos religiosos.","en":"Decker (1992) orders them by three contexts: military training, ceremonies before the king and religious cults."},"s":"T2 · 2.1.4","o":[{"es":"Lucha, tahtib y boxeo","en":"Wrestling, tahtib and boxing"},{"es":"Lucha, esgrima con espada y tiro","en":"Wrestling, sword fencing and shooting"},{"es":"Boxeo, pancracio y lucha","en":"Boxing, pankration and wrestling"},{"es":"Tahtib, jereed y buzkashi","en":"Tahtib, jereed and buzkashi"}]},{"id":"happ-quiz-t2-6","f":"F","t"
