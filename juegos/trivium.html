ás allá de la corona de olivo.","en":"In the classical period Olympia gave no material prizes beyond the olive crown."},"s":"T3 · Pentatlón","o":[{"es":"Una corona de olivo","en":"An olive crown"},{"es":"80 ánforas de aceite","en":"80 amphorae of oil"},{"es":"500 dracmas","en":"500 drachmas"},{"es":"Un escudo de bronce","en":"A bronze shield"}]},{"id":"penta-24","f":"S","t":3,"q":{"es":"¿Qué recibía en muchas ciudades el vencedor olímpico a su regreso?","en":"What did an Olympic victor receive in many cities on his return?"},"x":{"es":"Además le levantaban estatuas, y en época romana quedaba exento de impuestos.","en":"Statues were also raised to him, and in Roman times he was exempt from taxes."},"s":"T3 · Pentatlón","o":[{"es":"Manutención gratuita de por vida y asiento de honor en los espectáculos","en":"Free meals for life and a seat of honour at the shows"},{"es":"Un cargo vitalicio de helanódica y una estatua en la Altis","en":"A lifelong post as Hellanodikes and a statue in the Altis"},{"es":"La exención del servicio militar y de los impuestos de la polis","en":"Exemption from military service and from the city’s taxes"},{"es":"Una parcela de tierra en Élide y una pensión anual en plata","en":"A plot of land in Elis and a yearly pension in silver"}]},{"id":"penta-25","f":"S","t":3,"q":{"es":"¿Qué recibía probablemente el vencedor del estadio en las Panateneas?","en":"What did the stadion winner at the Panathenaia probably receive?"},"x":{"es":"Valían unas 1.247 dracmas, más de un año de jornal de un artesano cualificado.","en":"They were worth some 1,247 drachmas, more than a year's pay for a skilled craftsman."},"s":"T3 · Pentatlón","o":[{"es":"80 ánforas de aceite, unos 2.900 litros","en":"80 amphorae of oil, about 2,900 litres"},{"es":"Una corona de olivo y una estatua","en":"An olive wreath and a statue"},{"es":"40 ánforas de vino, unos 1.500 litros","en":"40 amphorae of wine, about 1,500 litres"},{"es":"Un trípode de bronce y un caballo","en":"A bronze tripod and a horse"}]},{"id":"penta-26","f":"S","t":3,"q":{"es":"¿Quién elegía a los atletas que iban a Olimpia?","en":"Who chose the athletes who went to Olympia?"},"x":{"es":"Las ciudades no elegían a sus atletas ni solían costear su viaje ni su entrenamiento.","en":"Cities did not choose their athletes, nor did they usually pay for their journey or training."},"s":"T3 · Pentatlón","o":[{"es":"Nadie: cada atleta acudía por iniciativa propia","en":"Nobody: each athlete came on his own initiative"},{"es":"La asamblea de cada polis, por votación","en":"Each city’s assembly, by vote"},{"es":"Los helanódicas, por invitación a cada polis","en":"The Hellanodikai, by invitation to each polis"},{"es":"El oráculo de Delfos, tras consultar al dios","en":"The oracle of Delphi, after consulting the god"}]},{"id":"penta-27","f":"S","t":3,"q":{"es":"¿Por qué Olimpia quedaba en manos de las familias acomodadas?","en":"Why did Olympia stay in the hands of well-off families?"},"x":{"es":"Ninguna norma excluía al pobre, pero ninguna ciudad costeaba la preparación.","en":"No rule excluded the poor, but no city paid for the preparation."},"s":"T3 · Pentatlón","o":[{"es":"Porque competir exigía tiempo libre, un entrenador y dinero para viajar","en":"Because competing required free time, a trainer and money to travel"},{"es":"Porque una ley de Élide prohibía inscribirse a los jornaleros","en":"Because a law of Elis barred day labourers from entering"},{"es":"Porque solo los nobles podían ser ciudadanos en las polis griegas","en":"Because only nobles could be citizens in the Greek poleis"},{"es":"Porque había que pagar una inscripción muy alta al santuario","en":"Because a very high entry fee had to be paid to the sanctuary"}]},{"id":"penta-29","f":"F","t":3,"q":{"es":"¿Cómo se garantizaba la igualdad en el disco?","en":"How was fairness guaranteed in the discus?"},"x":{"es":"Un viajero del siglo II d. C. vio en Olimpia los tres discos del pentatlón guardados en un edificio de ofrendas.","en":"A traveller of the 2nd century AD saw the three pentathlon discuses at Olympia, kept in a treasury."},"s":"T3 · Pentatlón","o":[{"es":"En cada prueba todos lanzaban el mismo disco el mismo día","en":"In each contest everyone threw the same discus on the same day"},{"es":"Cada atleta llevaba su disco, pesado por los jueces","en":"Each athlete brought his own discus, weighed by the judges"},{"es":"Había un disco oficial único para todos los juegos","en":"There was a single official discus for all games"},{"es":"Se lanzaba de tres en tres con discos sorteados","en":"Throwers went in threes with drawn discuses"}]},{"id":"penta-30","f":"M","t":3,"q":{"es":"¿Qué medían y pesaban los discos conservados?","en":"What size and weight are the surviving discuses?"},"x":{"es":"No había un modelo oficial único, y muchos eran para entrenar en el gimnasio.","en":"There was no single official model, and many were for training in the gymnasium."},"s":"T3 · Pentatlón","o":[{"es":"De 17 a 35 cm y de 1,5 a 6,5 kg, con una media de 2,5 kg","en":"17 to 35 cm and 1.5 to 6.5 kg, averaging 2.5 kg"},{"es":"Todos de 22 cm y 2 kg, con un modelo oficial","en":"All 22 cm and 2 kg, to an official model"},{"es":"De 40 a 60 cm y de 8 a 12 kg, de piedra","en":"40 to 60 cm and 8 to 12 kg, made of stone"},{"es":"De 10 a 15 cm y menos de 1 kg, de madera","en":"10 to 15 cm and under 1 kg, made of wood"}]},{"id":"penta-31","f":"M","t":3,"q":{"es":"¿Qué eran las halteras?","en":"What were the halteres?"},"x":{"es":"Medían entre 12 y 30 cm, y el saltador las llevaba en las manos.","en":"They were 12 to 30 cm long, and the jumper held them in his hands."},"s":"T3 · Pentatlón","o":[{"es":"Pesos de piedra, plomo o bronce, de 1,4 a 4,5 kg, para el salto","en":"Weights of stone, lead or bronze, 1.4 to 4.5 kg, for the jump"},{"es":"Las bolas del lanzamiento de peso, de bronce macizo","en":"The shot-put balls, of solid bronze"},{"es":"Unas sandalias lastradas con plomo para saltar más","en":"Sandals weighted :"T1 · 1.2 · glosario"},{"id":"glo-t1-31","k":"glo","f":"C","t":1,"quote":{"es":"Rasgo de Guttmann: competir contra quien no está presente; exige medir con un patrón, archivar y creer en la mejora indefinida.","en":"Guttmann characteristic: competing against someone who is not present; it requires a standard measure, an archive and belief in indefinite improvement."},"q":{"es":"¿Qué término del glosario corresponde a esta definición?","en":"Which glossary term matches this definition?"},"o":[{"es":"Récord","en":"Record"},{"es":"Paidiá","en":"Paidia"},{"es":"Athlos","en":"Athlos"},{"es":"Juego","en":"Game / play"}],"x":{"es":"","en":""},"s":"T1 · 1.2 · glosario"},{"id":"glo-t1-32","k":"glo","f":"C","t":1,"quote":{"es":"Según Eichberg, tres formas que conviven en toda sociedad: rendimiento, disciplina y forma física, y fiesta popular.","en":"According to Eichberg, three forms coexisting in every society: achievement, discipline and fitness, and popular festivity."},"q":{"es":"¿Qué término del glosario corresponde a esta definición?","en":"Which glossary term matches this definition?"},"o":[{"es":"Culturas corporales","en":"Body cultures"},{"es":"Actividad física","en":"Physical activity"},{"es":"Descontrol controlado","en":"Controlled de-controlling"},{"es":"Educación física","en":"Physical education"}],"x":{"es":"","en":""},"s":"T1 · 1.2 · glosario"},{"id":"glo-t1-33","k":"glo","f":"C","t":1,"quote":{"es":"Método antropológico que usa pueblos sin escritura ni Estado para conocer qué funciones puede tener la actividad física en ese tipo de sociedades.","en":"Anthropological method that uses peoples without writing or a state to learn what functions physical activity can have in such societies."},"q":{"es":"¿Qué término del glosario corresponde a esta definición?","en":"Which glossary term matches this definition?"},"o":[{"es":"Analogía etnográfica","en":"Ethnographic analogy"},{"es":"Cometa del desierto","en":"Desert kite"},{"es":"Arte rupestre levantino","en":"Levantine rock art"},{"es":"Teoría pedagógica","en":"Pedagogical theory"}],"x":{"es":"","en":""},"s":"T1 · 1.3 · glosario"},{"id":"glo-t1-34","k":"glo","f":"C","t":1,"quote":{"es":"Marcha erguida cuyo surgimiento, multicausal, marca el inicio de la Humanidad.","en":"Upright walking whose multi-causal emergence marks the beginning of humankind."},"q":{"es":"¿Qué término del glosario corresponde a esta definición?","en":"Which glossary term matches this definition?"},"o":[{"es":"Bipedestación","en":"Bipedalism"},{"es":"Teoría cultural","en":"Cultural theory"},{"es":"Teoría pedagógica","en":"Pedagogical theory"},{"es":"Cuantificación","en":"Quantification"}],"x":{"es":"","en":""},"s":"T1 · 1.3 · glosario"},{"id":"glo-t1-35","k":"glo","f":"M","t":1,"quote":{"es":"Pinturas del arco mediterráneo peninsular con figuras humanas en movimiento (caza, recolección de miel); cronología discutida, posiblemente 10.000-5.000 a. C.","en":"Paintings of the Iberian Mediterranean arc with human figures in motion (hunting, honey gathering); disputed chronology, possibly 10,000-5,000 BC."},"q":{"es":"¿Qué término del glosario corresponde a esta definición?","en":"Which glossary term matches this definition?"},"o":[{"es":"Arte rupestre levantino","en":"Levantine rock art"},{"es":"Cometa del desierto","en":"Desert kite"},{"es":"Teoría cultural","en":"Cultural theory"},{"es":"Teoría pedagógica","en":"Pedagogical theory"}],"x":{"es":"","en":""},"s":"T1 · 1.3 · glosario"},{"id":"glo-t1-36","k":"glo","f":"M","t":1,"quote":{"es":"Trampa de caza formada por dos muros convergentes en embudo que conducen a los animales a un recinto o foso.","en":"Hunting trap formed by two converging funnel-shaped walls driving animals into an enclosure or pit."},"q":{"es":"¿Qué término del glosario corresponde a esta definición?","en":"Which glossary term matches this definition?"},"o":[{"es":"Cometa del desierto","en":"Desert kite"},{"es":"Teoría pedagógica","en":"Pedagogical theory"},{"es":"Arte rupestre levantino"," · 1.1 · fuentes"},{"id":"fue-t1-3","k":"fue","f":"F","t":1,"quote":{"es":"«Actividad física reglada, competitiva e institucionalizada que busca el máximo rendimiento».","en":"'Regulated, competitive and institutionalised physical activity seeking maximum performance.'"},"q":{"es":"¿Qué enfoque del deporte describe esta definición?","en":"Which approach to sport does this definition describe?"},"o":[{"es":"Enfoque cerrado","en":"Narrow approach"},{"es":"Enfoque abierto","en":"Broad approach"},{"es":"Enfoque diacrónico","en":"Diachronic approach"},{"es":"Enfoque sincrónico","en":"Synchronic approach"}],"x":{"es":"Es el enfoque cerrado. El abierto, recogido en la Carta Europea del Deporte (1992), incluye todas las formas de actividad, organizadas o no, orientadas a la expresión o la mejora física o psíquica.","en":"It is the narrow approach. The broad one, set out in the European Sports Charter (1992), includes all forms of activity, organised or not, aimed at physical or mental expression or improvement."},"s":"T1 · 1.2 · fuentes"},{"id":"fue-t1-4","k":"fue","f":"F","t":1,"quote":{"es":"«Cuanto más contenida está una sociedad, más necesita lugares donde emocionarse con permiso».","en":"'The more restrained a society is, the more it needs places where it can get excited with permission.'"},"q":{"es":"¿A qué autores corresponde esta idea?","en":"Which authors does this idea belong to?"},"o":[{"es":"Elias y Dunning","en":"Elias & Dunning"},{"es":"Blanchard y Cheska","en":"Blanchard & Cheska"},{"es":"Van Dalen, Mitchell y Bennett","en":"Van Dalen, Mitchell & Bennett"},{"es":"Diem y Popplow","en":"Diem & Popplow"}],"x":{"es":"Resume la tesis de Deporte y ocio en el proceso de la civilización: el deporte como descontrol controlado de las emociones en sociedades que han monopolizado la violencia en el Estado.","en":"It sums up the thesis of Quest for Excitement: sport as a controlled de-controlling of emotions in societies where the state has monopolised violence."},"s":"T1 · 1.2 · fuentes"},{"id":"fue-t1-5","k":"fue","f":"F","t":1,"quote":{"es":"«Para que exista un récord hacen falta tres cosas a la vez: medir con un patrón, archivar el resultado y creer en la mejora indefinida».","en":"'For a record to exist three things are needed at once: measuring against a standard, archiving the result and believing in indefinite improvement.'"},"q":{"es":"¿De qué marco teórico procede esta idea?","en":"Which theoretical framework does this idea come from?"},"o":[{"es":"Los siete rasgos de Guttmann","en":"Guttmann's seven characteristics"},{"es":"Las tres culturas corporales de Eichberg","en":"Eichberg's three body cultures"},{"es":"El círculo mágico de Huizinga","en":"Huizinga's magic circle"},{"es":"La teoría marxista de Eichel","en":"Eichel's Marxist theory"}],"x":{"es":"El récord es el séptimo rasgo del deporte moderno según Guttmann: competir contra quien no está presente.","en":"The record is Guttmann's seventh characteristic of modern sport: competing against someone who is not present."},"s":"T1 · 1.2 · fuentes"},{"id":"fue-t1-6","k":"fue","f":"F","t":1,"quote":{"es":"«Los ejercicios corporales tienen una función primigenia dentro del proceso productivo y sirven para mejorar el rendimiento del trabajo».","en":"'Bodily exercises have a primal function within the productive process and serve to improve work performance.'"},"q":{"es":"¿Qué teoría sobre el origen del ejercicio expresa este texto?","en":"Which theory on the origin of exercise does this text express?"},"o":[{"es":"Teoría laboral-bélica o marxista (Eichel)","en":"Labour-war or Marxist theory (Eichel)"},{"es":"Teoría biológica (Neuendorff)","en":"Biological theory (Neuendorff)"},{"es":"Teoría cultural (Diem y Popplow)","en":"Cultural theory (Diem and Popplow)"},{"es":"Teoría pedagógica (Van Dalen)","en":"Pedagogical theory (Van Dalen)"}],"x":{"es":"Eichel (1969, Alemania Oriental) distingue entre movimientos comunes al animal y ejercicios exclusivos del hombre, ligados a la caza y, después, a la reunión social de los agricultores.","en":"Eichel (1969, East Germany) distinguishes between movements shared with animals and exercises exclusive to humans, linked to hunting and, later, to the social gatherings of farmers."},"s":"T1 · 1.3 · fuentes"},{"id":"fue-t1-7","k":"fue","f":"F","t":1,"quote":{"es":"«Un grupo de 14 mujeres adultas que caminaban juntas al mismo ritmo, acompañadas de dos varones adultos y un niño, a 1,5 m/s».","en":"'A group of 14 adult women walking together at the same pace, accompanied by two adult men and a child, at 1.5 m/s.'"},"q":{"es":"¿De qué yacimiento procede esta lectura de huellas?","en":"Which site does this footprint reading come from?"},"o":[{"es":"Engare Sero, Tanzania","en":"Engare Sero, Tanzania"},{"es":"Willandra Lakes, Australia","en":"Willandra Lakes, Australia"},{"es":"Schöningen, Alemania","en":"Schöningen, Germany"},{"es":"Obłazowa, Polonia","en":"Obłazowa, Poland"}],"x":{"es":"Hatala et al. (2020) interpretan las más de 400 huellas de Engare Sero como forrajeo cooperativo con división sexual del trabajo, hacia 17.000 a. C.","en":"Hatala et al. (2020) read the more than 400 Engare Sero footprints as cooperative foraging with a sexual division of labour, c. 17,000 BC."},"s":"T1 · 1.3 · fuentes"},{"id":"mit-t1-0","k":"mit","f":"S","t":1,"vf":false,"q":{"es":"La historia es el simple relato de los hechos que han sucedido en el pasado.","en":"History is simply the account of the events that happened in the past."},"x":{"es":"Es una creencia errónea. La historia es una herramienta analítica que aplica el método científico para interpretar hechos y obtener conclusiones razonadas y críticas.","en":"This is a mistaken belief. History is an analytical tool that applies the scientific method to interpret facts and reach reasoned, critical conclusions."},"s":"T1 · 1.1 · mitos"},{"id":"mit-t1-1","k":"mit","f":"S","t":1,"vf":false,"q":{"es":"En el 800 m femenino de 1928 varias atletas se desmayaron en la línea de meta.","en":"In the 1928 women's 800 m several athletes fainted at the finish line."},"x":{"es":"Así lo contaron algunas crónicas de prensa, pero todas las atletas terminaron y se estableció un récord mundial vigente hasta 1944 (English, 2019).","en":"Some press reports said so, but every athlete finished and a world record was set that stood until 1944 (English, 2019)."},"s":"T1 · 1.1 · mitos"},{"id":"mit-t1-2","k":"mit","f":"S","t":1,"vf":false,"q":{"es":"Kathrine Switzer fue la primera mujer en terminar el maratón de Boston.","en":"Kathrine Switzer was the first woman to finish the Boston Marathon."},"x":{"es":"Bobbi Gibb lo terminó en 1966, un año antes que Switzer, aunque sin dorsal. Switzer fue la primera en correrlo inscrita oficialmente.","en":"Bobbi Gibb finished it in 1966, a year before Switzer, though without a bib. Switzer was the first to run it officially registered."},"s":"T1 · 1.1 · mitos"},{"id":"mit-t1-3","k":"mit","f":"S","t":1,"vf":false,"q":{"es":"Los antiguos griegos tenían una palabra equivalente a «deporte».","en":"The ancient Greeks had a word equivalent to 'sport'."},"x":{"es":"Tenían cuatro términos distintos: agón, athlos, gymnastiké y paidiá. La palabra deporte adquiere su significado actual en el siglo XIX.","en":"They had four different terms: agon, athlos, gymnastike and paidia. The word sport acquires its present meaning in the nineteenth century."},"s":"T1 · 1.2 · mitos"},{"id":"mit-t1-4","k":"mit","f":"S","t":1,"vf":true,"q":{"es":"La palabra «deporte» procede del latín deportare, «llevar fuera».","en":"The word 'deporte' comes from the Latin deportare, 'to carry away'."},"x":{"es":"En latín tardío el verbo reflexivo se deportare significaba distraerse; pasó al occitano deportar y al francés antiguo desport (Olivera y Torrebadella, 2015).","en":"In late Latin the reflexive se deportare meant to amuse oneself; it passed into Occitan deportar and Old French desport (Olivera & Torrebadella, 2015)."},"s":"T1 · 1.2 · mitos"},{"id":"mit-t1-5","k":"mit","f":"S","t":1,"vf":false,"q":{"es":"En la Prehistoria existió el deporte reglado.","en":"Regulated sport existed in Prehistory."},"x":{"es":"Hubo que esperar a la Edad Antigua para el deporte reglado, si bien las actividades físicas con función más allá de lo corpóreo acompañan al ser humano desde su origen.","en":"Regulated sport had to wait until Antiquity, although physical activities with a function beyond the body have accompanied humans since their origin."},"s":"T1 · 1.3 · mitos"},{"id":"mit-t1-6","k":"mit","f":"M","t":1,"vf":false,"q":{"es":"Está demostrado que en el Paleolítico la caza correspondía a los varones y la pesca al grupo entero.","en":"It is proven that in the Palaeolithic hunting was for men and fishing for the whole group."},"x":{"es":"Durante décadas se dio por supuesto, pero hoy esa división no está demostrada para ninguna de las dos actividades y el debate sigue abierto (Anderson et al., 2023).","en":"For decades it was assumed, but today that division is not proven for either activity and the debate remains open (Anderson et al., 2023)."},"s":"T1 · 1.3 · mitos"},{"id":"mit-t1-7","k":"mit","f":"S","t":1,"vf":false,"q":{"es":"Está demostrado que un hombre prehistórico de Willandra corría tan rápido como un finalista olímpico de 100 m.","en":"It is proven that a prehistoric man at Willandra ran as fast as an Olympic 100 m finalist."},"x":{"es":"Webb estimó en 2007 unos 37 km/h para el rastro T8, pero Ruiz y Torices (2013) cuestionaron la precisión de esas estimaciones a partir de huellas fósiles.","en":"Webb estimated about 37 km/h for track T8 in 2007, but Ruiz and Torices (2013) questioned the accuracy of such estimates from fossil trackways."},"s":"T1 · 1.3 · mitos"},{"id":"mit-t1-8","k":"mit","f":"S","t":1,"vf":true,"q":{"es":"La Prehistoria ocupa el 99 % de nuestro desarrollo como especie.","en":"Prehistory covers 99 % of our development as a species."},"x":{"es":"La escasez de fuentes hace difícil describir qué actividades realizaba el ser humano prehistórico, de ahí las tres aproximaciones: teorías, método antropológico y método arqueológico.","en":"The scarcity of sources makes it hard to describe what prehistoric humans did, hence the three approaches: theories, the anthropological method and the archaeological method."},"s":"T1 · 1.3 · mitos"},{"id":"mit-t1-9","k":"mit","f":"S","t":1,"vf":false,"q":{"es":"Las mujeres del Neolítico tenían menos fuerza en los brazos que las atletas actuales.","en":"Neolithic women had weaker arms than today's athletes."},"x":{"es":"Sus húmeros eran entre un 11 y un 16 % más resistentes que los de las remeras de élite de Cambridge (Macintosh et al., 2017).","en":"Their humeri were 11 to 16 % stronger than those of elite Cambridge rowers (Macintosh et al., 2017)."},"s":"T1 · 1.3 · mitos"},{"id":"mit-t1-10","k":"mit","f":"S","t":1,"vf":true,"q":{"es":"Las armas de madera más antiguas conservadas son las lanzas neandertales de Schöningen.","en":"The oldest surviving wooden weapons are the Neanderthal spears from Schöningen."},"x":{"es":"El yacimiento de la Baja Sajonia conserva 187 artefactos de madera, con al menos veinte armas de caza, fechados hacia 200.000 a. C. (Hutson et al., 2025).","en":"The Lower Saxony site preserves 187 wooden artefacts, with at least twenty hunting weapons, dated to c. 200,000 BC (Hutson et al., 2025)."},"s":"T1 · 1.3 · mitos"},{"id":"mit-t1-11","k":"mit","f":"S","t":1,"vf":false,"q":{"es":"Para Huizinga, el juego es un producto de la sociedad.","en":"For Huizinga, play is a product of society."},"x":{"es":"Es al revés: para Huizinga el juego precede a la sociedad. Quienes lo consideran fabricado por la sociedad son Elias y Dunning.","en":"It is the other way round: for Huizinga play precedes society. Elias and Dunning are the ones who regard it as manufactured by society."},"s":"T1 · 1.2 · mitos"},{"id":"rel-t1-0-0","k":"rel","f":"P","t":1,"q":{"es":"Teorías y autores. ¿Qué corresponde a «Neuendorff (1930)»?","en":"Theor enta sus capacidades como don divino y repite punto por punto el esquema egipcio: la superioridad física del soberano legitima el trono.","en":"Darius I (522-486 BC) presents his abilities as a divine gift and repeats the Egyptian scheme point by point: the ruler's physical superiority legitimises the throne."},"s":"T2 · 2.2.2 · fuentes"},{"id":"fue-t2-1","k":"fue","f":"F","t":2,"quote":{"es":"«Disparó contra una diana de tres dedos y la perforó con la primera flecha, de modo que 7/9 del astil salieron por la cara contraria».","en":"'He shot at a target three fingers thick and pierced it with the first arrow, so that 7/9 of the shaft came out the other side.'"},"q":{"es":"¿A qué rey se refiere esta inscripción?","en":"Which king does this inscription refer to?"},"o":[{"es":"Amenofis II","en":"Amenhotep II"},{"es":"Tutmosis III","en":"Thutmose III"},{"es":"Ciro II","en":"Cyrus II"},{"es":"Seti I","en":"Seti I"}],"x":{"es":"Inscripción de Medamud. Amenofis II es la única excepción en tres milenios: los presentes intentaron disparar sin éxito, lo que confirma el dogma del victor perpetuus.","en":"Medamud inscription. Amenhotep II is the only exception in three millennia: those present tried to shoot without success, which confirms the victor perpetuus dogma."},"s":"T2 · 2.1.2 · fuentes"},{"id":"fue-t2-2","k":"fue","f":"F","t":2,"quote":{"es":"«Los jóvenes son educados desde los cinco a los veinte años en tres aspectos: montar a caballo, disparar el arco y decir la verdad».","en":"'The boys are taught from the age of five to twenty three things only: to ride, to shoot the bow and to tell the truth.'"},"q":{"es":"¿Qué autor describe así la educación persa?","en":"Which author describes Persian education this way?"},"o":[{"es":"Heródoto","en":"Herodotus"},{"es":"Jenofonte","en":"Xenophon"},{"es":"Estrabón","en":"Strabo"},{"es":"Tucídides","en":"Thucydides"}],"x":{"es":"Heródoto, Historia 1.136. Estrabón alarga después la formación hasta los veinticuatro años y Jenofonte la describe como masculina y obligatoria.","en":"Herodotus, Histories 1.136. Strabo later extends training to twenty-four and Xenophon describes it as male and compulsory."},"s":"T2 · 2.2.3 · fuentes"},{"id":"fue-t2-3","k":"fue","f":"F","t":2,"quote":{"es":"«Quería a sus caballos y se regocijaba con ellos. Su empeño constante era entrenarlos, conocer su naturaleza y ser experto en controlarlos».","en":"'He loved his horses and rejoiced in them. His constant effort was to train them, to know their nature and to be expert in controlling them.'"},"q":{"es":"¿De qué fuente procede este texto?","en":"Which source does this text come from?"},"o":[{"es":"Estela de la Esfinge (Amenofis II)","en":"Sphinx Stela (Amenhotep II)"},{"es":"Ciropedia (Jenofonte)","en":"Cyropaedia (Xenophon)"},{"es":"Estela de Taharqa","en":"Taharqa Stela"},{"es":"Autobiografía de Khety de Siut","en":"Autobiography of Khety of Siut"}],"x":{"es":"Losa de 3,6 x 2,2 m que describe al príncipe entrenando caballos en Menfis y haciéndolos dar vueltas junto a la Gran Esfinge contemplando las pirámides.","en":"Slab of 3.6 x 2.2 m describing the prince training horses at Memphis and driving them round by the Great Sphinx gazing at the pyramids."},"s":"T2 · 2.1.2 · fuentes"},{"id":"fue-t2-4","k":"fue","f":"F","t":2,"quote":{"es":"«Unos 50 km de Menfis al oasis de El Fayum durante la noche, cubiertos en 4 horas con llegada al amanecer, un descanso reglamentario de 2 horas y otros 50 km de regreso».","en":"'Some 50 km from Memphis to the Fayum oasis by night, covered in 4 hours arriving at dawn, a regulation 2-hour rest and another 50 km back.'"},"q":{"es":"¿Qué documento relata esta prueba?","en":"Which document recounts this event?"},"o":[{"es":"Estela de Taharqa","en":"Taharqa Stela"},{"es":"Relieve de Sahure","en":"Sahure relief"},{"es":"Estela de la Esfinge","en":"Sphinx Stela"},{"es":"Piedra Rosetta","en":"Rosetta Stone"}],"x":{"es":"Hallada en la ruta del desierto entre Menfis y Dahshur; año 6 de Taharqa (h. 685 a. C.). Participaron tropas de élite en cinco secciones (Pruett, 2026).","en":"Found on the desert route between Memphis and Dahshur; year 6 of Taharqa (c. 685 BC). Elite troops in five sections took part (Pruett, 2026)."},"s":"T2 · 2.1.4 · fuentes"},{"id":"fue-t2-5","k":"fue","f":"F","t":2,"quote":{"es":"«Una tripulación de remeros se alimentaba a base de tortas de cebada y vino, y dormía por turnos mientras otro grupo remaba».","en":"'A crew of rowers lived on barley cakes and wine, and slept in shifts while another group rowed.'"},"q":{"es":"¿Quién describe así la vida de los remeros?","en":"Who describes rowers' life this way?"},"o":[{"es":"Tucídides","en":"Thucydides"},{"es":"Heródoto","en":"Herodotus"},{"es":"Homero","en":"Homer"},{"es":"Jean Chardin","en":"Jean Chardin"}],"x":{"es":"Tucídides (460-396 a. C.) dejó escrito que una nave cubría 340 km en 24 h. El trirreme Olympias (1987) permitió contrastarlo mediante arqueología experimental.","en":"Thucydides (460-396 BC) wrote that a ship covered 340 km in 24 h. The trireme Olympias (1987) allowed this to be tested through experimental archaeology."},"s":"T2 · 2.3.2 · fuentes"},{"id":"fue-t2-6","k":"fue","f":"F","t":2,"quote":{"es":"«El rey le permitió recibir lecciones de natación junto a sus hijos».","en":"'The king allowed him to take swimming lessons with his children.'"},"q":{"es":"¿De qué fuente procede esta afirmación?","en":"Which source does this statement come from?"},"o":[{"es":"Autobiografía de Khety de Siut","en":"Autobiography of Khety of Siut"},{"es":"Cuento de Sinuhé","en":"Tale of Sinuhe"},{"es":"Estela de la Esfinge de Guiza","en":"Sphinx Stela at Giza"},{"es":"Estela de Taharqa en Dahshur","en":"Stela of Taharqa at Dahshur"}],"x":{"es":"Nomarca del Primer Periodo Intermedio. La frase acredita una enseñanza reglada con maestro y grupo dentro del kap, y convierte nadar en destreza de élite.","en":"Nomarch of the First Intermediate Period. The sentence attests to formal teaching with an instructor and a group inside the kap, making swimming an elite skill."},"s":"T2 · 2.1.3 · fuentes"},{"id":"fue-t2-7","k":"fue","f":"F","t":2,"quote":{"es":"«Traer a pie doce flechas, una a una, desde un pilar situado a legua y media de la puerta del palacio».","en":"'To fetch twelve arrows on foot, one by one, from a pillar a league and a half from the palace gate.'"},"q":{"es":"¿A qué prueba se refiere este viajero?","en":"Which test does this traveller refer to?"},"o":[{"es":"El chatir de Isfahán","en":"The chatir of Isfahan"},{"es":"La carrera del Heb-Sed","en":"The Heb-Sed run"},{"es":"El buzkashi","en":"Buzkashi"},{"es":"La carrera de Taharqa","en":"Taharqa's run"}],"x":{"es":"Descrita por Jean Chardin en Voyages en Perse. Doce idas y doce vueltas, unos 174 km, para seleccionar a los mensajeros reales safávidas.","en":"Described by Jean Chardin in Voyages en Perse. Twelve trips out and back, some 174 km, to select Safavid royal messengers."},"s":"T2 · 2.2.4 · fuentes"},{"id":"fue-t2-8","k":"fue","f":"F","t":2,"quote":{"es":"«Los instructores dividían a los jóvenes en grupos de cincuenta y les hacían correr una distancia de entre treinta y cuarenta estadios».","en":"'The instructors divided the youths into groups of fifty and made them run a distance of thirty to forty stades.'"},"q":{"es":"¿Qué autor aporta este dato sobre Persia?","en":"Which author gives this detail about Persia?"},"o":[{"es":"Estrabón","en":"Strabo"},{"es":"Heródoto","en":"Herodotus"},{"es":"Jenofonte","en":"Xenophon"},{"es":"Tucídides","en":"Thucydides"}],"x":{"es":"Estrabón, Geografía 15.3.18: entre cinco y siete kilómetros, con el rey presente ofreciendo premios. Las carreras quedan dentro de la formación militar.","en":"Strabo, Geography 15.3.18: five to seven kilometres, with the king present offering prizes. Races belong within military training."},"s":"T2 · 2.2.4 · fuentes"},{"id":"mit-t2-0","k":"mit","f":"P","t":2,"vf":false,"q":{"es":"El faraón competía en certámenes abiertos contra otros atletas.","en":"The pharaoh competed in open contests against other athletes."},"x":{"es":"Tenía prohibido competir en pruebas de resultado incierto: como garante del ma'at no podía ser derrotado en público. Compite solo, sin rival (victor perpetuus).","en":"He was forbidden to compete in events of uncertain outcome: as guarantor of ma'at he could not be defeated in public. He competes alone, without a rival (victor perpetuus)."},"s":"T2 · 2.1.1 · mitos"},{"id":"mit-t2-1","k":"mit","f":"S","t":2,"vf":false,"q":{"es":"En el antiguo Egipto existía una palabra equivalente a «deporte».","en":"Ancient Egypt had a word equivalent to 'sport'."},"x":{"es":"Se usaba el concepto de śḫmḫ-ib, «divertir el corazón» o «hacer olvidar al corazón», ligado a la salud y el bienestar.","en":"The concept used was śḫmḫ-ib, 'to delight the heart' or 'to make the heart forget', linked to health and wellbeing."},"s":"T2 · 2.1.1 · mitos"},{"id":"mit-t2-2","k":"mit","f":"M","t":2,"vf":false,"q":{"es":"Las marcas de tiro con arco de los reyes del Imperio Nuevo son físicamente posibles.","en":"The New Kingdom kings' archery feats are physically possible."},"x":{"es":"Decker y Klauck (1974) simularon el disparo contra planchas de cobre con arcos modernos y las flechas penetraron solo unos milímetros. Cada rey supera al anterior y ninguno falla.","en":"Decker and Klauck (1974) simulated shooting at copper plates with modern bows and the arrows penetrated only a few millimetres. Each king outdoes the last and none ever fails."},"s":"T2 · 2.1.2 · mitos"},{"id":"mit-t2-3","k":"mit","f":"M","t":2,"vf":false,"q":{"es":"En Egipto se celebraban carreras de carros.","en":"Chariot races were held in Egypt."},"x":{"es":"El carro se usó para la guerra y la caza. No se atestiguan carreras de carros.","en":"The chariot was used for war and hunting. Chariot races are not attested."},"s":"T2 · 2.1.2 · mitos"},{"id":"mit-t2-4","k":"mit","f":"S","t":2,"vf":true,"q":{"es":"Las competiciones egipcias tenían reglas formales y árbitros.","en":"Egyptian competitions had formal rules and referees."},"x":{"es":"Algunos relieves muestran árbitros provistos de trompetas en los deportes de combate, con intencionalidad de juego limpio.","en":"Some reliefs show referees with trumpets in combat sports, with an intention of fair play."},"s":"T2 · 2.1.1 · mitos"},{"id":"mit-t2-5","k":"mit","f":"S","t":2,"vf":true,"q":{"es":"Las mujeres egipcias tenían los mismos derechos básicos que los hombres de su clase.","en":"Egyptian women had the same basic rights as men of their class."},"x":{"es":"Podían poseer y heredar bienes, comprar, vender, litigar y testar. Excepcionalmente llegaron al trono, como Hatshepsut o Cleopatra VII.","en":"They could own and inherit property, buy, sell, litigate and make wills. Exceptionally they reached the throne, like Hatshepsut or Cleopatra VII."},"s":"T2 · 2.1.1 · mitos"},{"id":"mit-t2-6","k":"mit","f":"S","t":2,"vf":false,"q":{"es":"El juego del aro egipcio es el antecedente del hockey.","en":"The Egyptian hoop game is the forerunner of hockey."},"x":{"es":"Se ha comparado erróneamente: no se juega con pelota ni parece un deporte de equipo. Solo hay una representación en toda la historia de Egipto (Beni Hasan).","en":"It has been wrongly compared: it is not played with a ball nor does it seem a team sport. There is only one depiction in all of Egyptian history (Beni Hasan)."},"s":"T2 · 2.1.6 · mitos"},{"id":"mit-t2-7","k":"mit","f":"S","t":2,"vf":false,"q":{"es":"El pueblo llano egipcio es el grupo mejor documentado en el deporte.","en":"The Egyptian common people are the best documented group in sport."},"x":{"es":"Casi todo el deporte egipcio procede de tumbas de realeza y aristocracia. El pueblo llano está mucho peor documentado y tenía poco tiempo de ocio.","en":"Almost all Egyptian sport comes from royal and aristocratic tombs. The common people are far less documented and had little leisure time."},"s":"T2 · 2.1.5 · mitos"},{"id":"mit-t2-8","k":"mit","f":"P","t":2,"vf":true,"q":{"es":"El deporte faraónico se apaga cuando Egipto pierde la independencia política.","en":"Pharaonic sport dies out when Egypt loses political independence."},"x":{"es":"Dependía del rey como garante del orden y de un Estado que grabara sus proezas. Con persas, macedonios y romanos esa estructura desaparece; sobreviven las prácticas que nunca dependieron de ella.","en":"It depended on the king as guarantor of order and on a state that recorded his feats. Under Persians, Macedonians and Romans that structure vanishes; the practices that never depended on it survive."},"s":"T2 · 2.1.6 · mitos"},{"id":"mit-t2-9","k":"mit","f":"M","t":2,"vf":false,"q":{"es":"Los persas inventaron la caza del león como liturgia de Estado.","en":"The Persians invented lion hunting as a state liturgy."},"x":{"es":"La heredaron de los reyes asirios al conquistarlos. Lo nuevo fue el paradeisos, el parque cercado y abastecido de animales.","en":"They inherited it from the Assyrian kings on conquering them. What was new was the paradeisos, the enclosed park stocked with animals."},"s":"T2 · 2.2.2 · mitos"},{"id":"mit-t2-10","k":"mit","f":"L","t":2,"vf":false,"q":{"es":"El zurkhaneh tiene un origen clandestino demostrado como resistencia a las invasiones.","en":"The zurkhaneh has a proven clandestine origin as resistance to invasions."},"x":{"es":"Es una leyenda construida a partir de los rasgos del edificio (sin fachada ni carteles, lejos de las calles principales). El posible origen resistente es una hipótesis.","en":"It is a legend built from the building's features (no façade or signs, away from main streets). The possible resistance origin is a hypothesis."},"s":"T2 · 2.2.3 · mitos"},{"id":"mit-t2-11","k":"mit","f":"S","t":2,"vf":false,"q":{"es":"De los fenicios se conserva alguna descripción de actividad física escrita por ellos mismos.","en":"Some description of physical activity written by the Phoenicians themselves survives."},"x":{"es":"Su literatura se ha perdido casi por completo. Lo que sabemos procede de sus rivales, griegos y romanos, con un sesgo fácil de rastrear desde la Odisea.","en":"Their literature is almost entirely lost. What we know comes from their rivals, Greeks and Romans, with a bias easy to trace from the Odyssey onwards."},"s":"T2 · 2.3.1 · mitos"},{"id":"mit-t2-12","k":"mit","f":"S","t":2,"vf":false,"q":{"es":"La ausencia de fuentes fenicias demuestra que no practicaban actividades físicas.","en":"The absence of Phoenician sources proves they did not practise physical activities."},"x":{"es":"Lo que falta es un tipo de fuente: no hubo Estado que grabara proezas ni rey que exhibiera su cuerpo. Kharayeb muestra cuerpos jugando en cuanto aparece un registro.","en":"What is missing is a type of source: there was no state to record feats nor a king who needed to display his body. Kharayeb shows bodies at play as soon as a record appears."},"s":"T2 · 2.3.3 · mitos"},{"id":"mit-t2-13","k":"mit","f":"S","t":2,"vf":false,"q":{"es":"Los griegos navegaban guiándose por la Osa Menor, igual que los fenicios.","en":"The Greeks navigated by the Little Bear, like the Phoenicians."},"x":{"es":"Los griegos usaban la Osa Mayor; los fenicios la Osa Menor, mucho más próxima al polo, lo que les daba una ventaja técnica al mantener el rumbo.","en":"The Greeks used the Great Bear; the Phoenicians the Little Bear, much closer to the pole, which gave them a technical advantage in holding course."},"s":"T2 · 2.3.2 · mitos"},{"id":"rel-t2-0-0","k":"rel","f":"S","t":2,"q":{"es":"Práctica, grupo y función en Egipto. ¿Qué corresponde a «Tiro con arco sobre lingotes»?","en":"Practice, group and function in Egypt. What goes with “Archery at copper ingots”?"},"o":[{"es":"Faraón: demostrar que el ma'at sigue garantizado","en":"Pharaoh: showing that ma'at is still guaranteed"},{"es":"Aristocracia: privilegio y prestigio","en":"Aristocracy: privilege and prestige"},{"es":"Ejército: preparación para la guerra","en":"Army: pre s Juegos no se suspendieron por la guerra.","en":"Some Greek deserters told the Persians that their compatriots were at Olympia, in 480 BC, competing for a mere olive wreath. The Games were not suspended because of the war."},"s":"T3 · 3.2.2 · fuentes"},{"id":"fue-t3-1","k":"fue","f":"F","t":3,"quote":{"es":"«…abierto a cualquier griego que quisiera acceder».","en":"'…open to any Greek who wished to enter.'"},"q":{"es":"¿A qué se refiere Heródoto con estas palabras?","en":"What does Herodotus refer to with these words?"},"o":[{"es":"Al santuario de Olimpia","en":"The sanctuary of Olympia"},{"es":"Al gimnasio de Atenas","en":"The gymnasium of Athens"},{"es":"A la ciudadanía espartana","en":"Spartan citizenship"},{"es":"Al palacio de Cnoso","en":"The palace of Knossos"}],"x":{"es":"Olimpia era de todos los griegos, si bien lo administraba una sola polis, Élide, que controlaba la admisión, fijaba el reglamento y nombraba al personal.","en":"Olympia belonged to all Greeks, although a single polis, Elis, administered it, controlling admission, setting the rules and appointing the staff."},"s":"T3 · 3.2.4 · fuentes"},{"id":"fue-t3-2","k":"fue","f":"F","t":3,"quote":{"es":"«Poda para poda… hétoimoi… ápite».","en":"'Poda para poda… hetoimoi… apite.'"},"q":{"es":"¿Qué recogen estas tres voces?","en":"What do these three calls record?"},"o":[{"es":"La salida de las carreras a pie en Olimpia","en":"The start of the foot races at Olympia"},{"es":"El juramento de los atletas ante Zeus","en":"The athletes' oath before Zeus"},{"es":"La proclamación de la tregua","en":"The proclamation of the truce"},{"es":"El final del combate de pancracio","en":"The end of the pankration bout"}],"x":{"es":"«Pie junto a pie», «¡listos!» y «¡partid!». En Olimpia la salida se daba de viva voz hasta el siglo IV a. C.","en":"'Foot by foot', 'ready!' and 'go!'. At Olympia the start was given by voice until the fourth century BC."},"s":"T3 · 3.2.5 · fuentes"},{"id":"fue-t3-3","k":"fue","f":"F","t":3,"quote":{"es":"«Los atletas más bellos».","en":"'The most beautiful athletes.'"},"q":{"es":"¿A quiénes llamaba así Aristóteles?","en":"Whom did Aristotle call this?"},"o":[{"es":"A los pentatletas","en":"The pentathletes"},{"es":"A los pancratistas","en":"The pankratiasts"},{"es":"A los aurigas","en":"The charioteers"},{"es":"A los corredores de dólico","en":"The dolichos runners"}],"x":{"es":"El pentatlón premiaba la versatilidad, puesto que había que dominar cinco pruebas muy distintas. Filóstrato los llamaba «los mejor proporcionados».","en":"The pentathlon rewarded versatility, since one had to master five very different events. Philostratus called them 'the best proportioned'."},"s":"T3 · 3.2.5 · fuentes"},{"id":"fue-t3-4","k":"fue","f":"F","t":3,"quote":{"es":"«Nalgas blancas» y «nalgas oscuras».","en":"'White buttocks' and 'dark buttocks'."},"q":{"es":"¿Qué distinguían los griegos con estas expresiones coloquiales?","en":"What did the Greeks distinguish with these colloquial expressions?"},"o":[{"es":"A los cobardes y poco viriles frente a los valientes","en":"Cowards and the unmanly versus the brave"},{"es":"A los atletas de Esparta frente a los de Atenas","en":"Athletes from Sparta versus those from Athens"},{"es":"A los esclavos frente a los metecos","en":"Slaves versus metics"},{"es":"A los muchachos frente a los hombres","en":"Boys versus men"}],"x":{"es":"Como se entrenaba desnudo y al sol, el moreno uniforme delataba a quien disponía de ocio. En la palestra el cuerpo decía a qué grupo pertenecía cada uno.","en":"Because training was done naked and in the sun, an even tan revealed who had leisure. In the palaestra the body told which group each man belonged to."},"s":"T3 · 3.2.4 · fuentes"},{"id":"fue-t3-5","k":"fue","f":"F","t":3,"quote":{"es":"«Ato y encadeno los tendones, las partes del cuerpo, la mente y la inteligencia de los corredores para que no tengan fuerza […] y queden en último lugar».","en":"'I bind and chain the tendons, the limbs, the mind and the intelligence of the runners so that they have no strength […] and come last.'"},"q":{"es":"¿De dónde procede este texto?","en":"Where does this text come from?"},"o":[{"es":"De unas tablillas de plomo con maldiciones halladas en Nemea","en":"From lead curse tablets found at Nemea"},{"es":"De la inscripción de un zan pagado por un púgil","en":"From the inscription on a Zanes paid by a boxer"},{"es":"De una oda de Píndaro a un vencedor de Nemea","en":"From an ode of Pindar to a Nemean victor"},{"es":"Del reglamento de los helanódicas de Olimpia","en":"From the rules of the Hellanodikai at Olympia"}],"x":{"es":"Son del siglo III a. C. y aparecieron enrolladas y perforadas. Los atletas recurrían a la magia para hechizar a sus rivales antes de la prueba.","en":"They date from the third century BC and were found rolled up and pierced. Athletes resorted to magic to bewitch their rivals before the contest."},"s":"T3 · 3.2.6 · fuentes"},{"id":"fue-t3-6","k":"fue","f":"F","t":3,"quote":{"es":"«Verbena, mercado, acróbatas, diversión, ladrones».","en":"'Fair, market, acrobats, fun, thieves.'"},"q":{"es":"¿Qué describía así un comediógrafo ateniense a comienzos del siglo III a. C.?","en":"What did an Athenian comic playwright describe in these words in the early third century BC?"},"o":[{"es":"El ambiente de Olimpia durante los Juegos","en":"The atmosphere at Olympia during the Games"},{"es":"El ágora de Atenas en día de asamblea","en":"The Athenian agora on an assembly day"},{"es":"El Circo Máximo durante unos juegos","en":"The Circus Maximus during the games"},{"es":"La procesión de las Panateneas","en":"The procession of the Panathenaea"}],"x":{"es":"En época helenística los valores fundacionales se debilitaron y el festival ganó aire de espectáculo, un proceso que Roma aceleró.","en":"In the Hellenistic period the founding values weakened and the festival took on the air of a spectacle, a process that Rome accelerated."},"s":"T3 · 3.2.7 · fuentes"},{"id":"mit-t3-0","k":"mit","f":"L","t":3,"vf":false,"q":{"es":"Los palacios cretenses no tenían murallas porque Creta fue una isla sin guerras.","en":"The Cretan palaces had no walls because Crete was an island without wars."},"x":{"es":"Las primeras armas del Egeo son cretenses, había preparación para la guerra y algunos centros tuvieron fortificaciones. La «Pax Minoica» de Evans debe matizarse.","en":"The first weapons of the Aegean are Cretan, there was preparation for war and some centres had fortifications. Evans's 'Pax Minoica' must be qualified."},"s":"T3 · 3.1 · mitos"},{"id":"mit-t3-1","k":"mit","f":"S","t":3,"vf":false,"q":{"es":"Los minoicos competían por premios, como muestran sus imágenes.","en":"The Minoans competed for prizes, as their images show."},"x":{"es":"Ningún objeto representa un premio ni una lista de vencedores. El deporte servía para la iniciación, el culto y el prestigio de las grandes casas.","en":"No object shows a prize or a list of victors. Sport served initiation, worship and the prestige of the great houses."},"s":"T3 · 3.1 · mitos"},{"id":"mit-t3-2","k":"mit","f":"M","t":3,"vf":false,"q":{"es":"Los toros del salto eran uros salvajes.","en":"The bulls in the leap were wild aurochs."},"x":{"es":"El pelaje moteado de los toros de Cnoso solo se da en animales domésticos, de modo que no eran tan fieros como se ha propuesto.","en":"The spotted coat of the Knossos bulls occurs only in domestic animals, so they were not as fierce as has been suggested."},"s":"T3 · 3.1 · mitos"},{"id":"mit-t3-3","k":"mit","f":"L","t":3,"vf":false,"q":{"es":"La erupción de Tera puso fin a la Creta de los palacios.","en":"The eruption of Thera ended palatial Crete."},"x":{"es":"Fue hacia 1628 a. C., unos ciento cincuenta años antes del final. Hoy la tesis más aceptada atribuye la destrucción de hacia 1450 a. C. a las invasiones micénicas.","en":"It happened c. 1628 BC, some 150 years before the end. Today the most accepted thesis attributes the destruction of c. 1450 BC to the Mycenaean invasions."},"s":"T3 · 3.1 · mitos"},{"id":"mit-t3-4","k":"mit","f":"S","t":3,"vf":false,"q":{"es":"La tregua sagrada detenía todas las guerras de Grecia durante los Juegos.","en":"The sacred truce stopped all wars in Greece during the Games."},"x":{"es":"Protegía el territorio de Élide y a los peregrinos. La Olimpiada de 480 a. C. se celebró mientras Leónidas resistía en las Termópilas.","en":"It protected the territory of Elis and the pilgrims. The Olympiad of 480 BC was held while Leonidas held out at Thermopylae."},"s":"T3 · 3.2.2 · mitos"},{"id":"mit-t3-5","k":"mit","f":"S","t":3,"vf":false,"q":{"es":"Los Juegos de Olimpia continúan los juegos de la época micénica.","en":"The Olympic Games continue the games of the Mycenaean period."},"x":{"es":"Más de mil años de vacío separan el túmulo prehistórico del santuario de Zeus, nacido a finales del siglo XI a. C. No hubo continuidad.","en":"More than a thousand years separate the prehistoric tumulus from the sanctuary of Zeus, founded at the end of the 11th century BC. There was no continuity."},"s":"T3 · 3.2.2 · mitos"},{"id":"mit-t3-6","k":"mit","f":"S","t":3,"vf":false,"q":{"es":"Está probado que los Juegos empezaron en 776 a. C.","en":"It is proven that the Games began in 776 BC."},"x":{"es":"Es la fecha de una lista de vencedores compilada hacia 400 a. C. y poco fiable en sus primeros siglos. Se han propuesto también 884 (leyenda) y 704 a. C. (arqueología).","en":"It is the date of a list of victors compiled c. 400 BC and unreliable for its first centuries. Dates of 884 (legend) and 704 BC (archaeology) have also been proposed."},"s":"T3 · 3.2.2 · mitos"},{"id":"mit-t3-7","k":"mit","f":"S","t":3,"vf":false,"q":{"es":"Las ciudades griegas seleccionaban y pagaban a sus atletas.","en":"Greek cities selected and paid their athletes."},"x":{"es":"Cada atleta acudía por iniciativa propia y costeaba entrenador, dieta, viaje y el mes en Élide. Ástilo llegó a cambiar de patria deportiva.","en":"Each athlete went on his own initiative and paid for coach, diet, travel and the month at Elis. Astylos even changed his sporting homeland."},"s":"T3 · 3.2.3 · mitos"},{"id":"mit-t3-8","k":"mit","f":"S","t":3,"vf":false,"q":{"es":"Como Olimpia solo daba una corona de olivo, el atleta no ganaba dinero.","en":"Since Olympia gave only an olive wreath, the athlete earned no money."},"x":{"es":"Su ciudad lo recibía con estatuas, manutención y premios: Solón daba 500 dracmas al ateniense vencedor en Olimpia.","en":"His city welcomed him with statues, maintenance and rewards: Solon gave 500 drachmas to any Athenian who won at Olympia."},"s":"T3 · 3.2.4 · mitos"},{"id":"mit-t3-9","k":"mit","f":"M","t":3,"vf":false,"q":{"es":"Está demostrado que la carrera de hoplitas preparaba para la guerra.","en":"It is proven that the hoplite race was preparation for war."},"x":{"es":"Su utilidad militar se discute: Mann (2021) no halla fuentes en ese sentido antes del siglo IV a. C. y Spivey (2021) cree que premiaba al corredor aislado y no la cohesión de la falange.","en":"Its military usefulness is debated: Mann (2021) finds no sources to that effect before the fourth century BC and Spivey (2021) thinks it rewarded the lone runner, not the cohesion of the phalanx."},"s":"T3 · 3.2.5 · mitos"},{"id":"mit-t3-10","k":"mit","f":"M","t":3,"vf":false,"q":{"es":"Los griegos medían y registraban las marcas del salto, la jabalina y el disco.","en":"The Greeks measured and recorded the marks in the jump, javelin and discus."},"x":{"es":"Solo se marcaba con una estaca el mejor intento, que se movía si otro lo superaba. No sabemos si sus marcas eran comparables a las actuales.","en":"Only the best attempt was marked with a stake, moved if someone bettered it. We do not know whether their marks were comparable to today's."},"s":"T3 · 3.2.5 · mitos"},{"id":"mit-t3-11","k":"mit","f":"S","t":3,"vf":false,"q":{"es":"Los combates griegos tenían categorías de peso, como el boxeo actual.","en":"Greek combat sports had weight classes, like modern boxing."},"x":{"es":"Solo había categorías de edad, sin asaltos ni descansos, de ahí que llevaran ventaja el más resistente y el más pesado.","en":"There were only age categories, with no rounds or breaks, which is why the most enduring and heaviest had the advantage."},"s":"T3 · 3.2.5 · mitos"},{"id":"mit-t3-12","k":"mit","f":"S","t":3,"vf":true,"q":{"es":"Hubo campeonas olímpicas aunque las mujeres casadas no podían entrar en Olimpia.","en":"There were female Olympic champions although married women could not enter Olympia."},"x":{"es":"En la hípica la corona era para el dueño de las monturas, y Cinisca de Esparta ganó la cuadriga en 396 a. C.","en":"In the equestrian events the wreath went to the owner, and Kyniska of Sparta won the four-horse chariot race in 396 BC."},"s":"T3 · 3.2.6 · mitos"},{"id":"mit-t3-13","k":"mit","f":"L","t":3,"vf":false,"q":{"es":"Ninguna mujer corrió nunca en el estadio de Olimpia.","en":"No woman ever ran in the stadium of Olympia."},"x":{"es":"En los Juegos Hereos, desde hacia 580 a. C., muchachas solteras corrían unos 160 m en el estadio en honor de Hera.","en":"In the Heraia, from c. 580 BC, unmarried girls ran about 160 m in the stadium in honour of Hera."},"s":"T3 · 3.2.6 · mitos"},{"id":"mit-t3-14","k":"mit","f":"S","t":3,"vf":false,"q":{"es":"Teodosio I prohibió los Juegos Olímpicos en 393 d. C.","en":"Theodosius I banned the Olympic Games in AD 393."},"x":{"es":"Remijsen (2015) comprobó que esa ley no menciona los Juegos; el vínculo lo estableció un cronista del siglo XI. Los Juegos se apagaron porque las élites dejaron de costearlos.","en":"Remijsen (2015) showed that this law does not mention the Games; the link was made by an 11th-century chronicler. The Games faded because the elites stopped paying for them."},"s":"T3 · 3.2.7 · mitos"},{"id":"rel-t3-0-0","k":"rel","f":"S","t":3,"q":{"es":"Las cuatro lecturas del salto del toro. ¿Qué corresponde a «Lectura ritual»?","en":"The four readings of bull as y castigos en Olimpia. ¿Qué corresponde a «Mentir a los jueces»?","en":"Offences and punishments at Olympia. What goes with “Lying to the judges”?"},"o":[{"es":"Expulsión de los Juegos","en":"Expulsion from the Games"},{"es":"Multa que costeaba un zan","en":"Fine that paid for a Zan"},{"es":"Azotes de los mastigóforos","en":"Flogging by the mastigophoroi"},{"es":"Pena de muerte desde un monte cercano","en":"Death penalty from a nearby mountain"}],"x":{"es":"","en":""},"s":"T3 · 3.2.6 · relaciona"},{"id":"rel-t3-4-2","k":"rel","f":"S","t":3,"q":{"es":"Faltas y castigos en Olimpia. ¿Qué corresponde a «Soborno»?","en":"Offences and punishments at Olympia. What goes with “Bribery”?"},"o":[{"es":"Multa que costeaba un zan","en":"Fine that paid for a Zan"},{"es":"Expulsión de los Juegos","en":"Expulsion from the Games"},{"es":"Azotes de los mastigóforos","en":"Flogging by the mastigophoroi"},{"es":"Pena de muerte desde un monte cercano","en":"Death penalty from a nearby mountain"}],"x":{"es":"","en":""},"s":"T3 · 3.2.6 · relaciona"},{"id":"rel-t3-4-3","k":"rel","f":"S","t":3,"q":{"es":"Faltas y castigos en Olimpia. ¿Qué corresponde a «Mujer casada en el festival»?","en":"Offences and punishments at Olympia. What goes with “Married woman at the festival”?"},"o":[{"es":"Pena de muerte desde un monte cercano","en":"Death penalty from a nearby mountain"},{"es":"Azotes de los mastigóforos","en":"Flogging by the mastigophoroi"},{"es":"Expulsión de los Juegos","en":"Expulsion from the Games"},{"es":"Multa que costeaba un zan","en":"Fine that paid for a Zan"}],"x":{"es":"","en":""},"s":"T3 · 3.2.6 · relaciona"},{"id":"lin-egi-unif","k":"cro","f":"C","t":2,"q":{"es":"¿Por qué las fechas más antiguas de Egipto se dan como aproximadas?","en":"Why are the earliest Egyptian dates given as approximate?"},"o":[{"es":"Porque se fechaba por año de reinado, sin era continua, y la cronología se suma con las listas reales","en":"Because dating was by regnal year, with no continuous era, and the chronology is added up from the king lists"},{"es":"Porque los egipcios no tenían calendario y fechaban por las crecidas del Nilo","en":"Because the Egyptians had no calendar and dated by the Nile floods"},{"es":"Porque todas las fechas proceden de autores griegos muy posteriores","en":"Because all the dates come from much later Greek authors"},{"es":"Porque los templos con las listas se destruyeron en época romana","en":"Because the temples with the lists were destroyed in Roman times"}],"x":{"es":"La unificación de Egipto abre la etapa de las primeras dinastías y de las primeras pirámides. Los egipcios fechaban por año de reinado, sin una era continua, de manera que la cronología se reconstruye sumando los reinados a partir de las listas reales, y por eso las fechas más antiguas se dan siempre como aproximadas.","en":"The unification of Egypt opens the age of the first dynasties and the first pyramids. The Egyptians dated by regnal year, with no continuous era, so the chronology is rebuilt by adding up reigns from the king lists, and that is why the earliest dates are always given as approximate."},"s":"T2 · diap. 9 · Veldmeijer e Ikram (2018); Lull (2006)"},{"id":"lin-egi-dyeser","k":"cro","f":"C","t":2,"q":{"es":"¿Qué simbolizaba correr de norte a sur y de sur a norte?","en":"What did running from north to south and from south to north symbolise?"},"o":[{"es":"La unión de los dos reinos","en":"The union of the two kingdoms"},{"es":"El recorrido del sol","en":"The course of the sun"},{"es":"La crecida del Nilo","en":"The Nile flood"},{"es":"La victoria sobre los hicsos","en":"The victory over the Hyksos"}],"x":{"es":"El elemento central del Heb-Sed era la carrera del faraón, de obligada realización, que se corría en el patio sur del recinto de la pirámide de Saqqara. La pista era una recta de 55 metros coronada por dos mojones semicirculares, el circuito completo sumaba 140 metros y se recorría de norte a sur y de sur a norte.","en":"The central element of the Heb-Sed was the pharaoh's run, which had to be performed, in the southern court of the precinct of the pyramid of Saqqara. The track was a 55-metre straight crowned by two semicircular markers, the full circuit came to 140 metres, and it was run from north to south and from south to north."},"s":"T2 · diap. 19 · Decker (1992); Caravaca (2017)"},{"id":"lin-egi-piramide","k":"cro","f":"C","t":2,"q":{"es":"¿Qué testimonio deportivo pertenece, como la Gran Pirámide, al Imperio Antiguo?","en":"Which sporting evidence belongs, like the Great Pyramid, to the Old Kingdom?"},"o":[{"es":"El relieve de las competiciones de Sahure","en":"The relief of Sahure's competitions"},{"es":"La lucha de las tumbas de Beni Hasan","en":"The wrestling in the tombs of Beni Hasan"},{"es":"La estela de la carrera de Taharqa","en":"The stela of Taharqa’s race"},{"es":"El tiro con arco de Amenofis II","en":"The archery of Amenhotep II"}],"x":{"es":"La Gran Pirámide sirve de referencia para situar el Imperio Antiguo, la etapa en la que se consolida el culto, el sacerdocio gana control y se levantan las grandes obras. A esa misma etapa pertenece el relieve de las competiciones de obreros de Sahure.","en":"The Great Pyramid is a reference point for the Old Kingdom, the period in which the cult is consolidated, the priesthood gains control and the great works are raised. The relief of Sahure's workers' competitions belongs to the same period."},"s":"T2 · diap. 48 · Crowther (2007)"},{"id":"lin-egi-sahure","k":"cro","f":"C","t":2,"q":{"es":"¿Qué cuatro elementos básicos del deporte aparecen de golpe en la fiesta de Sahure?","en":"Which four basic elements of sport appear all at once at Sahure's festival?"},"o":[{"es":"Varias pruebas, público, un motivo festivo y recompensas","en":"Several events, an audience, a festive occasion and rewards"},{"es":"Reglamento escrito, árbitro, estadio y cronómetro","en":"Written rules, a referee, a stadium and timing"},{"es":"Atletas profesionales, apuestas, entrenadores y federación","en":"Professional athletes, betting, coaches and a federation"},{"es":"Un rey que compite, sacerdotes, música y danza","en":"A competing king, priests, music and dance"}],"x":{"es":"Un relieve de la calzada de la pirámide de Sahure reúne tiro con arco, esgrima de bastón, lucha y una regata, organizadas para las fiestas por la terminación del templo funerario y la pirámide. Compiten los obreros y los soldados que han levantado la obra, hay premios para los vencedores y el rey está presente sin competir.","en":"A relief from the causeway of Sahure's pyramid brings together archery, stick fencing, wrestling and a boat race, held for the festivities marking the completion of the king's funerary temple and pyramid. The workers and soldiers who built the monument compete, there are prizes for the winners, and the king is present without competing."},"s":"T2 · diap. 41 · Decker y Förster (2011)"},{"id":"lin-egi-justas","k":"cro","f":"M","t":2,"q":{"es":"¿Cuál era el objetivo de la justa de pescadores?","en":"What was the aim of the fishermen's joust?"},"o":[{"es":"Hacer caer al agua a la tripulación contraria","en":"To knock the opposing crew into the water"},{"es":"Llegar el primero a la orilla contraria","en":"Reaching the opposite bank first"},{"es":"Pescar más peces que la barca rival","en":"Catching more fish than the rival boat"},{"es":"Romper la pértiga del contrario","en":"Breaking the opponent’s pole"}],"x":{"es":"Se enfrentaban de dos a cuatro tripulaciones en canoas de juncos de papiro: los de popa timoneaban y los de proa empujaban a los rivales con las pértigas de navegación. No había reglamento ni árbitro, y para Guttmann es uno de los mejores ejemplos de cómo un trabajo cotidiano puede derivar en una disciplina deportiva de equipo.","en":"Two to four crews faced each other in papyrus-reed canoes: those at the stern steered and those at the bow pushed their rivals with the punting poles. There were no rules and no referee, and for Guttmann it is one of the best examples of how everyday work can give rise to a team sport."},"s":"T2 · diap. 39 · Guttmann (2004)"},{"id":"lin-egi-benihasan","k":"cro","f":"C","t":2,"q":{"es":"¿Qué proporción de los combates de Beni Hasan se libra en el suelo?","en":"What proportion of the Beni Hasan bouts is fought on the ground?"},"o":[{"es":"Solo el 2 %","en":"Only 2%"},{"es":"La mitad","en":"Half"},{"es":"Tres de cada cuatro","en":"Three in four"},{"es":"Ninguno","en":"None"}],"x":{"es":"Las pinturas murales de los príncipes de Beni Hasan muestran 219 parejas de luchadores con un amplio repertorio de llaves, proyecciones, volteos, zancadillas y presas, sin puñetazos ni mordiscos. Se competía desnudo salvo un pequeño cinturón, y está documentada la presencia de árbitros.","en":"The wall paintings of the princes of Beni Hasan show 219 pairs of wrestlers with a wide repertoire of holds, throws, trips and leg grabs, with no punches or bites. Wrestlers competed naked except for a small belt, and the presence of referees is documented."},"s":"T2 · diap. 31 · Decker (2021)"},{"id":"lin-egi-hicsos","k":"cro","f":"C","t":2,"q":{"es":"¿Qué llega a Egipto con los hicsos?","en":"What reached Egypt with the Hyksos?"},"o":[{"es":"El carro ligero y el arco compuesto","en":"The light chariot and the composite bow"},{"es":"El calendario solar y el reloj de agua","en":"The solar calendar and the water clock"},{"es":"La lucha reglada y el senet","en":"Regulated wrestling and senet"},{"es":"La moneda y el alfabeto","en":"Coinage and the alphabet"}],"x":{"es":"Durante el Segundo Periodo Intermedio los hicsos dominan el norte de Egipto, y con ellos llegan el carro ligero y el arco compuesto, que los egipcios comienzan a fabricar tras las guerras contra ellos. Su expulsión abre el Imperio Nuevo.","en":"During the Second Intermediate Period the Hyksos rule the north of Egypt, and with them come the light chariot and the composite bow, which the Egyptians begin to make after the wars against them. Their expulsion opens the New Kingdom."},"s":"T2 · diap. 9 · Veldmeijer e Ikram (2018); Cook (2018)"},{"id":"lin-egi-hatshepsut","k":"cro","f":"C","t":2,"q":{"es":"¿Qué testimonia el Heb-Sed de Hatshepsut?","en":"What does Hatshepsut's Heb-Sed show?"},"o":[{"es":"Que las mujeres que gobernaban también debían mostrar su fortaleza física","en":"That women who ruled also had to display their physical strength"},{"es":"Que el Heb-Sed se reservaba a las reinas desde el Imperio Antiguo","en":"That the Heb-Sed had been reserved for queens since the Old Kingdom"},{"es":"Que las mujeres de la corte competían contra los soldados","en":"That the women of the court competed against the soldiers"},{"es":"Que el rito se abolió durante el Imperio Nuevo por su reinado","en":"That the rite was abolished in the New Kingdom because of her reign"}],"x":{"es":"En la Capilla Roja de Karnak aparece la reina Hatshepsut, acompañada del toro Apis, realizando el Heb-Sed en el año dieciséis de su reinado, a los cuarenta años. Los egiptólogos explican el adelanto porque sumó sus años como gran esposa real y regente antes de ser nombrada faraón.","en":"In the Red Chapel at Karnak, Queen Hatshepsut, accompanied by the Apis bull, performs the Heb-Sed in the sixteenth year of her reign, at the age of forty. Egyptologists explain the early date by suggesting that she counted her years as great royal wife and regent before being named pharaoh."},"s":"T2 · diap. 19 · Camilo (2024)"},{"id":"lin-egi-tutmosis","k":"cro","f":"C","t":2,"q":{"es":"¿Para qué se utilizaba principalmente el carro en Egipto?","en":"What was the chariot mainly used for in Egypt?"},"o":[{"es":"Para la guerra y la caza; no se atestiguan carreras de carros","en":"For war and hunting; no chariot races are attested"},{"es":"Para las carreras del hipódromo real de Tebas","en":"For the races in the royal hippodrome of Thebes"},{"es":"Para el transporte de piedra a las obras del rey","en":"For carrying stone to the king’s building sites"},{"es":"Para las procesiones del Heb-Sed y la caza","en":"For the Heb-Sed processions and hunting"}],"x":{"es":"Los faraones dejaron registros extraordinarios de sus hazañas de caza en carro, y de Tutmosis III se registró que abatió 120 toros salvajes en una hora y siete leones «en un abrir y cerrar de ojos». Su nombre abre también la tabla de marcas reales de tiro con arco del Imperio Nuevo.","en":"The pharaohs left extraordinary records of their chariot hunts, and Thutmose III was recorded as killing 120 wild bulls in one hour and seven lions “in the blink of an eye”. His name also heads the table of New Kingdom royal archery records."},"s":"T2 · diap. 23 · Serrano (2021); Futrell y Scanlon (2021)"},{"id":"lin-egi-amenofis","k":"cro","f":"C","t":2,"q":{"es":"¿Qué se deduce de las marcas imposibles de los reyes?","en":"What can be deduced from the kings' impossible records?"},"o":[{"es":"Que una fuente puede ser formalmente impecable y materialmente falsa","en":"That a source can be formally flawless and materially false"},{"es":"Que los egipcios tenían arcos más potentes que los actuales","en":"That the Egyptians had bows more powerful than today's"},{"es":"Que las dianas eran de madera","en":"That the targets were made of wood"},{"es":"Que los reyes entrenaban a diario con la tropa","en":"That the kings trained daily with the troops"}],"x":{"es":"En la tabla de marcas reales del Imperio Nuevo cada rey supera al anterior y ninguno falla jamás, y Amenofis II llega a atravesar del todo una diana de cuatro dedos de grosor. Decker y Klauck simularon el disparo con arcos y flechas modernos contra planchas de cobre y las flechas penetraron solo unos milímetros.","en":"In the table of New Kingdom royal records each king outdoes the previous one and none ever fails, and Amenhotep II even pierces right through a target four fingers thick. Decker and Klauck simulated the shot with modern bows and arrows against copper plates, and the arrows penetrated only a few millimetres."},"s":"T2 · diap. 22 · Decker y Klauck (1974); Futrell y Scanlon (2021)"},{"id":"lin-egi-tutankamon","k":"cro","f":"C","t":2,"q":{"es":"¿Qué alcance tenía el arco compuesto frente al arco simple?","en":"What range did the composite bow have compared with the simple bow?"},"o":[{"es":"Hasta 300 metros frente a 150","en":"Up to 300 metres against 150"},{"es":"El mismo alcance, pero más precisión","en":"The same range but more accuracy"},{"es":"Hasta 1.000 metros frente a 300","en":"Up to 1,000 metres against 300"},{"es":"Menos alcance, pero más fuerza","en":"Less range but more power"}],"x":{"es":"El arco compuesto se elaboraba con un núcleo de madera reforzado con cuerno y tendones unidos con cola, que podía tardar un año en secar. Era más ligero y manejable en los carros de guerra y lanzaba flechas hasta 300 metros. Uno de ellos, de la tumba de Tutankamón, se conserva en el Museo Egipcio de El Cairo.","en":"The composite bow was made from a wooden core reinforced with horn and sinew joined with glue, which could take a year to dry. It was lighter and easier to handle on war chariots and shot arrows up to 300 metres. One of them, from Tutankhamun's tomb, is kept in the Egyptian Museum in Cairo."},"s":"T2 · diap. 21 · Cook (2018)"},{"id":"lin-egi-ramses","k":"cro","f":"C","t":2,"q":{"es":"¿Qué representaba el disparo de flechas hacia los cuatro puntos cardinales?","en":"What did shooting arrows towards the four cardinal points represent?"},"o":[{"es":"El dominio del rey sobre todo el reino","en":"The king's dominion over the whole kingdom"},{"es":"La caza de los animales sagrados","en":"The hunting of sacred animals"},{"es":"La guerra contra los hicsos","en":"The war against the Hyksos"},{"es":"El paso de las estaciones","en":"The passing of the seasons"}],"x":{"es":"El Heb-Sed, la fiesta del jubileo más importante de Egipto, renovaba el poder del faraón a los treinta años de reinado y se repetía cada tres. Ramsés II celebró catorce. El ceremonial incluía la doble coronación, el disparo de flechas hacia los cuatro puntos cardinales y el alzamiento del pilar Djed.","en":"The Heb-Sed, the most important jubilee festival in Egypt, renewed the pharaoh's power after thirty years of reign and was repeated every three years. Ramesses II celebrated fourteen. The ceremony included the double coronation, shooting arrows towards the four cardinal points and raising the Djed pillar."},"s":"T2 · diap. 18 · Caravaca (2017); Flammini (2003)"},{"id":"lin-egi-taharqa","k":"cro","f":"M","t":2,"q":{"es":"¿En qué se aparta Taharqa del dogma real durante la carrera?","en":"How does Taharqa depart from the royal dogma during the run?"},"o":[{"es":"Desmontó del carro y corrió a pie junto a sus soldados","en":"He got down from his chariot and ran on foot with his soldiers"},{"es":"Ganó la carrera ante sus súbditos desde su carro real","en":"He won the race before his subjects from his royal chariot"},{"es":"Prohibió correr a los nubios y solo dejó a los egipcios","en":"He banned Nubians from running and only allowed Egyptians"},{"es":"Corrió solo, sin la tropa, para no arriesgar una derrota","en":"He ran alone, without the troops, so as not to risk defeat"}],"x":{"es":"La estela del año seis del rey nubio Taharqa describe una prueba de las tropas de élite: unos 50 kilómetros de Menfis al Fayum durante la noche, dos horas de descanso y otros 50 de regreso, cien kilómetros en unas nueve horas. El vencedor y los siguientes recibieron premios y el honor de comer junto a la guardia real.","en":"The stela from the sixth year of the Nubian king Taharqa describes a test for the elite troops: about 50 kilometres from Memphis to the Fayum by night, a two-hour rest and another 50 back, a hundred kilometres in some nine hours. The winner and those who followed received prizes and the honour of dining with the royal guard."},"s":"T2 · diap. 36 · Pruett (2026)"},{"id":"lin-egi-persas","k":"cro","f":"C","t":2,"q":{"es":"¿De qué dos cosas dependía el deporte de los faraones?","en":"What two things did the sport of the pharaohs depend on?"},"o":[{"es":"Del rey como garante del orden del mundo y de un Estado capaz de medir y grabar sus proezas","en":"The king as guarantor of the world order and a state able to measure and record his feats"},{"es":"De los Juegos Olímpicos y de los atletas griegos que viajaban a Egipto","en":"The Olympic Games and the Greek athletes who travelled to Egypt"},{"es":"Del ejército nubio y de los mercenarios persas al servicio del faraón","en":"The Nubian army and the Persian mercenaries serving the pharaoh"},{"es":"De los sacerdotes de Amón y del comercio de caballos con Fenicia","en":"The priests of Amun and the horse trade with Phoenicia"}],"x":{"es":"Egipto pasa a manos persas, y más tarde macedónicas y romanas. El deporte faraónico dependía de dos cosas, el rey como garante del orden del mundo y un Estado capaz de medir sus proezas y grabarlas en piedra, y las dos empiezan a desaparecer.","en":"Egypt passes into Persian hands, and later Macedonian and Roman ones. Pharaonic sport depended on two things, the king as guarantor of the world order and a state able to measure his feats and carve them in stone, and both begin to disappear."},"s":"T2 · diap. 47 · Decker (1992)"},{"id":"lin-egi-alejandro","k":"cro","f":"C","t":2,"q":{"es":"¿Cuántas dinastías egipcias se cuentan, sin las dos extranjeras?","en":"How many Egyptian dynasties are counted, not including the two foreign ones?"},"o":[{"es":"Treinta y una","en":"Thirty-one"},{"es":"Veintiséis","en":"Twenty-six"},{"es":"Treinta y tres","en":"Thirty-three"},{"es":"Dieciocho","en":"Eighteen"}],"x":{"es":"Alejandro Magno conquista Egipto en el 332 a. C. y abre la época grecorromana. La cronología egipcia cuenta treinta y una dinastías propias, más dos extranjeras, la macedónica y la ptolemaica.","en":"Alexander the Great conquers Egypt in 332 BC and opens the Graeco-Roman period. Egyptian chronology counts thirty-one native dynasties, plus two foreign ones, the Macedonian and the Ptolemaic."},"s":"T2 · diap. 9 · Veldmeijer e Ikram (2018)"},{"id":"lin-egi-roma","k":"cro","f":"C","t":2,"q":{"es":"¿Qué práctica egipcia llega hasta hoy, convertida en un acto folclórico?","en":"Which Egyptian practice survives today as a folk performance?"},"o":[{"es":"La esgrima de bastón","en":"Stick fencing"},{"es":"El tiro con arco sobre cobre","en":"Archery at copper targets"},{"es":"La carrera del Heb-Sed","en":"The Heb-Sed run"},{"es":"La caza en carro","en":"Chariot hunting"}],"x":{"es":"Con la pérdida definitiva de la independencia y la conversión de Egipto en provincia romana desaparece la estructura ideológica y religiosa que justificaba las demostraciones físicas del rey. Sobreviven las prácticas que nunca dependieron del palacio: las que nacen del trabajo y del juego duran mucho más que las que el poder inventa.","en":"With the final loss of independence and Egypt's conversion into a Roman province, the ideological and religious structure that justified the king's physical displays disappears. The practices that never depended on the palace survive: those born of work and play last much longer than those invented by power."},"s":"T2 · diap. 47 · Decker (1992)"},{"id":"lin-per-ciro","k":"cro","f":"C","t":2,"q":{"es":"¿Cuáles son los cuatro pilares que mantienen unido el imperio aqueménida?","en":"What are the four pillars holding the Achaemenid Empire together?"},"o":[{"es":"La caballería, el arco, la educación y la gestión de la distancia","en":"Cavalry, the bow, education and the management of distance"},{"es":"La flota, el comercio marítimo, la escritura y la moneda","en":"The fleet, sea trade, writing and coinage"},{"es":"El templo, el palacio real, el ejército y los juegos","en":"The temple, the royal palace, the army and the games"},{"es":"La lucha, el polo, la caza del león y la carrera","en":"Wrestling, polo, lion hunting and running"}],"x":{"es":"El origen de Persia se fija cuando Ciro II derrota a los medos y funda el imperio aqueménida, que en tres generaciones se extiende del Egeo al Indo. Cuatro pilares lo mantienen unido: la caballería, el arco, la educación y la gestión de la distancia, con satrapías, caminos y postas.","en":"The origin of Persia is placed when Cyrus II defeats the Medes and founds the Achaemenid Empire, which within three generations stretches from the Aegean to the Indus. Four pillars hold it together: cavalry, the bow, education and the management of distance, with satrapies, roads and staging posts."},"s":"T2 · diap. 52 · Briant (2002)"},{"id":"lin-per-dario","k":"cro","f":"C","t":2,"q":{"es":"¿Por qué la semejanza con el modelo egipcio puede leerse como un préstamo cultural?","en":"Why can the likeness to the Egyptian model be read as a cultural borrowing?"},"o":[{"es":"Porque Darío I reinó también sobre Egipto","en":"Because Darius I also ruled over Egypt"},{"es":"Porque Darío se educó en Tebas","en":"Because Darius was educated in Thebes"},{"es":"Porque el texto lo escribieron escribas griegos","en":"Because Greek scribes wrote the text"},{"es":"Porque copia la estela de Taharqa","en":"Because it copies the Taharqa stela"}],"x":{"es":"En Naqsh-e Rostam, Darío I mandó grabar en su tumba que su cuerpo es fuerte y está adiestrado, y que es buen jinete, buen arquero y buen lancero, capacidades que el dios persa depositó sobre él. Nunca aparece como luchador, porque un rey no puede permitirse ser derrotado delante de sus súbditos.","en":"At Naqsh-e Rostam, Darius I had it carved on his tomb that his body is strong and trained, and that he is a good horseman, a good archer and a good spearman, abilities placed in him by the Persian god. He never appears as a wrestler, because a king cannot afford to be defeated in front of his subjects."},"s":"T2 · diap. 57 · Alcock (2001)"},{"id":"lin-per-jerjes","k":"cro","f":"C","t":2,"q":{"es":"¿Qué es común a los seis periodos de la historia persa?","en":"What do the six periods of Persian history have in common?"},"o":[{"es":"El mundo equino, el tiro con arco y la lucha","en":"The world of the horse, archery and wrestling"},{"es":"El zurkhaneh, el polo y la natación","en":"The zurkhaneh, polo and swimming"},{"es":"Los Juegos Olímpicos y la lucha griega","en":"The Olympic Games and Greek wrestling"},{"es":"La escuela del Estado y la carrera","en":"The state school and running"}],"x":{"es":"El imperio de Ciro, Darío y Jerjes, el de Maratón y las Termópilas, es solo la primera de seis etapas, y entre la primera y la última Persia median dos mil quinientos años. Lo común a los seis periodos es estable: el mundo equino, el tiro con arco y la lucha.","en":"The empire of Cyrus, Darius and Xerxes, that of Marathon and Thermopylae, is only the first of six stages, and two and a half thousand years separate the first Persia from the last. What the six periods share is stable: the world of the horse, archery and wrestling."},"s":"T2 · diap. 53 · Jacobs y Rollinger (2021)"},{"id":"lin-per-persepolis","k":"cro","f":"C","t":2,"q":{"es":"¿A qué etapas pertenece la mayor parte del deporte persa?","en":"To which stages does most Persian sport belong?"},"o":[{"es":"A las cinco posteriores a los aqueménidas","en":"To the five after the Achaemenids"},{"es":"Solo a la etapa aqueménida","en":"Only to the Achaemenid stage"},{"es":"A las dos anteriores a Ciro II","en":"To the two before Cyrus II"},{"es":"A la época de Jerjes y Darío","en":"To the time of Xerxes and Darius"}],"x":{"es":"El imperio aqueménida termina con la destrucción de su capital, Persépolis, por Alejandro Magno. La meseta irania, no obstante, seguirá produciendo deporte durante los veintitrés siglos posteriores, y el deporte persa pertenece en su mayoría a las cinco etapas que vienen después.","en":"The Achaemenid Empire ends with the destruction of its capital, Persepolis, by Alexander the Great. The Iranian plateau, however, will go on producing sport for the next twenty-three centuries, and most Persian sport belongs to the five stages that follow."},"s":"T2 · diap. 52 · Briant (2002)"},{"id":"lin-per-sasanidas","k":"cro","f":"C","t":2,"q":{"es":"¿De qué imperio fueron contemporáneos los sasánidas?","en":"Which empire were the Sasanians contemporary with?"},"o":[{"es":"De Bizancio","en":"Byzantium"},{"es":"Del Egipto faraónico","en":"Pharaonic Egypt"},{"es":"De los aqueménidas","en":"The Achaemenids"},{"es":"De los safávidas","en":"The Safavids"}],"x":{"es":"Los sasánidas forman el último imperio persa antes del islam, contemporáneo de Bizancio. Con ellos se consolida el chovgan, el juego a caballo del que deriva el polo moderno.","en":"The Sasanians form the last Persian empire before Islam, contemporary with Byzantium. Under them chovgan, the game on horseback from which modern polo derives, becomes established."},"s":"T2 · diap. 53 · Chehabi y Guttmann (2002)"},{"id":"lin-per-polo","k":"cro","f":"M","t":2,"q":{"es":"¿Con qué dinastía se consolida el chovgan?","en":"Under which dynasty does chovgan become established?"},"o":[{"es":"Con la sasánida","en":"The Sasanian"},{"es":"Con la aqueménida","en":"The Achaemenid"},{"es":"Con la safávida","en":"The Safavid"},{"es":"Con la ptolemaica","en":"The Ptolemaic"}],"x":{"es":"El chovgan es el primer deporte colectivo a caballo con pelota y taco, y de él deriva el polo moderno. Se cree que pudo practicarlo la dinastía parta, pero es durante el periodo sasánida cuando se consolida el juego.","en":"Chovgan is the first team sport on horseback with ball and stick, and modern polo derives from it. The Parthian dynasty may have played it, but it is during the Sasanian period that the game becomes established."},"s":"T2 · diap. 70 · Chehabi y Guttmann (2002)"},{"id":"lin-per-arabes","k":"cro","f":"C","t":2,"q":{"es":"¿Qué conserva Persia tras la conquista árabe?","en":"What does Persia keep after the Arab conquest?"},"o":[{"es":"Su lengua","en":"Its language"},{"es":"Su religión zoroástrica","en":"Its Zoroastrian religion"},{"es":"Su d
