inastía sasánida","en":"Its Sasanian dynasty"},{"es":"Su capital en Persépolis","en":"Its capital at Persepolis"}],"x":{"es":"La conquista árabe abre la Persia islámica. Persia conserva su lengua, y es la época de Avicena y de Ferdousí.","en":"The Arab conquest opens Islamic Persia. Persia keeps its language, and this is the age of Avicenna and Ferdowsi."},"s":"T2 · diap. 53 · Chehabi y Guttmann (2002)"},{"id":"lin-per-texto","k":"cro","f":"M","t":2,"q":{"es":"¿Cómo se lograban los tantos en el chovgan?","en":"How were points scored in chovgan?"},"o":[{"es":"Haciendo pasar la pelota entre dos pilares de madera o piedra","en":"By sending the ball between two pillars of wood or stone"},{"es":"Derribando al jinete rival con el mazo antes de la meta","en":"By knocking the rival rider down with the mallet before the goal"},{"es":"Llevando la pelota en la mano hasta la línea de fondo","en":"By carrying the ball in the hand to the end line"},{"es":"Lanzando la pelota contra una diana de cobre en el muro","en":"By throwing the ball at a copper target on the wall"}],"x":{"es":"El reglamento exacto del chovgan se desconoce. Se golpeaba la pelota al galope, agachándose por debajo del cuello del caballo porque el mazo era corto, y había una variante nocturna con pelotas prendidas en fuego.","en":"The exact rules of chovgan are unknown. The ball was struck at the gallop, ducking below the horse's neck because the mallet was short, and there was a night version played with flaming balls."},"s":"T2 · diap. 70 · Chehabi y Guttmann (2002)"},{"id":"lin-per-safavidas","k":"cro","f":"C","t":2,"q":{"es":"¿De qué etapa europea es contemporánea la Persia safávida y qajar?","en":"Which European period is Safavid and Qajar Persia contemporary with?"},"o":[{"es":"De la Edad Moderna y la Revolución Industrial","en":"The early modern period and the Industrial Revolution"},{"es":"De la Antigüedad clásica y del Imperio romano","en":"Classical Antiquity and the Roman Empire"},{"es":"De la Alta Edad Media y las cruzadas","en":"The early Middle Ages and the Crusades"},{"es":"Del Renacimiento y la Reforma protestante","en":"The Renaissance and the Protestant Reformation"}],"x":{"es":"La etapa safávida y qajar es contemporánea de la Edad Moderna europea y de la Revolución Industrial. A ella pertenece la prueba de los correos reales, el chatir de Isfahán.","en":"The Safavid and Qajar stage is contemporary with the European early modern period and the Industrial Revolution. The test of the royal messengers, the chatir of Isfahan, belongs to it."},"s":"T2 · diap. 53 · Floor (2023)"},{"id":"lin-per-shater","k":"cro","f":"C","t":2,"q":{"es":"¿Qué función tenían los shatir?","en":"What was the role of the shatir?"},"o":[{"es":"Llevar mensajes y correr delante del caballo del rey para alertar de peligros","en":"Carrying messages and running ahead of the king's horse to warn of danger"},{"es":"Jugar al chovgan en la corte como campeones del rey","en":"Playing chovgan at court as the king’s champions"},{"es":"Entrenar a los luchadores del zurkhaneh de la capital","en":"Training the wrestlers of the capital’s zurkhaneh"},{"es":"Custodiar los caballos reales durante las campañas","en":"Guarding the royal horses during campaigns"}],"x":{"es":"Los shatir eran los mensajeros reales de la corte persa, que transportaban mensajes o corrían delante del caballo del monarca para alertar de posibles peligros. Pertenecer a este cuerpo era un inmenso honor, y para entrar había que superar una prueba de larga distancia.","en":"The shatir were the royal messengers of the Persian court, who carried messages or ran ahead of the monarch's horse to warn of danger. Belonging to this corps was a great honour, and entry required passing a long-distance test."},"s":"T2 · diap. 68 · Floor (2023)"},{"id":"lin-per-chardin","k":"cro","f":"C","t":2,"q":{"es":"¿Cuánto tardó el vencedor de 1667 en superar la prueba?","en":"How long did the 1667 winner take to complete the test?"},"o":[{"es":"Catorce horas","en":"Fourteen hours"},{"es":"Cuatro horas","en":"Four hours"},{"es":"Dos días","en":"Two days"},{"es":"Nueve horas","en":"Nine hours"}],"x":{"es":"El aspirante debía traer a pie doce flechas, una a una, desde un pilar situado a legua y media del palacio de Isfahán, unos 174 kilómetros entre la salida y la puesta del sol. Ese día era fiesta pública, y un comerciante francés que presenció la prueba en 1667 anotó el tiempo del vencedor.","en":"The candidate had to bring back on foot twelve arrows, one by one, from a pillar a league and a half from the palace of Isfahan, some 174 kilometres between sunrise and sunset. The day was a public holiday, and a French merchant who watched the test in 1667 noted the winner's time."},"s":"T2 · diap. 68 · Chardin (1811); Floor (2023)"},{"id":"lin-per-zurkhaneh","k":"cro","f":"L","t":2,"q":{"es":"¿Qué hay de la leyenda de un origen clandestino del zurkhaneh frente a árabes y mongoles?","en":"What about the legend of a clandestine origin of the zurkhaneh against Arabs and Mongols?"},"o":[{"es":"Es falsa: nunca fue un recinto secreto","en":"It is false: it was never a secret place"},{"es":"Está probada por fuentes aqueménidas","en":"It is proven by Achaemenid sources"},{"es":"Explica por qué se jugaba de noche","en":"It explains why it was played at night"},{"es":"Procede de la Ciropedia","en":"It comes from the Cyropaedia"}],"x":{"es":"El zurkhaneh, «la casa de fuerza», es una sala abovedada con un foso central de arcilla blanda y una puerta deliberadamente baja, de manera que la primera lección, la de humildad, se da antes de entrar. Estaba inserto en la vida de los barrios y funcionaba también como instancia de autoridad vecinal.","en":"The zurkhaneh, the “house of strength”, is a domed hall with a sunken central pit of soft clay and a deliberately low door, so that the first lesson, humility, is given before entering. It was embedded in neighbourhood life and also served as a local authority."},"s":"T2 · diap. 64 · Mohammadi et al. (2023); Krawietz (2013)"},{"id":"lin-fen-cartago","k":"cro","f":"C","t":2,"q":{"es":"¿Dónde se emplaza Cartago?","en":"Where does Carthage lie?"},"o":[{"es":"En el punto medio del trayecto entre Tiro y Cádiz","en":"Halfway along the route between Tyre and Cádiz"},{"es":"En la desembocadura del Nilo, frente a Egipto","en":"At the mouth of the Nile, facing Egypt"},{"es":"En la costa de Cerdeña, junto a sus minas","en":"On the coast of Sardinia, by its mines"},{"es":"En el estrecho, frente a la isla de Cádiz","en":"At the strait, facing the island of Cádiz"}],"x":{"es":"La expansión fenicia alcanza el norte de África, Malta, Sicilia occidental, Cerdeña, las Baleares y el sur de la península ibérica con factorías y puertos seguros. Entre ellos destaca Cartago, fundada por colonos de Tiro en el actual Túnez, según la tradición en el 814 a. C.","en":"Phoenician expansion reaches North Africa, Malta, western Sicily, Sardinia, the Balearics and the south of the Iberian Peninsula with trading posts and safe harbours. Among them Carthage stands out, founded by settlers from Tyre in present-day Tunisia, according to tradition in 814 BC."},"s":"T2 · diap. 79 · López-Ruiz y Doak (2019); Docter et al. (2008)"},{"id":"lin-fen-sargon","k":"cro","f":"C","t":2,"q":{"es":"¿Por qué los griegos llamaron hippoi a estas naves fenicias?","en":"Why did the Greeks call these Phoenician ships hippoi?"},"o":[{"es":"Por la cabeza de caballo tallada en la proa","en":"Because of the horse's head carved on the prow"},{"es":"Porque transportaban caballos","en":"Because they carried horses"},{"es":"Porque eran tan rápidas como un caballo","en":"Because they were as fast as a horse"},{"es":"Por el nombre de su constructor","en":"After the name of their builder"}],"x":{"es":"La actividad física fenicia que sí admite documentación es el trabajo. Los relieves del palacio de Sargón II en Dur-Sharrukin muestran pequeñas embarcaciones a remo que remolcan troncos de cedro, con una cabeza de caballo tallada en la proa.","en":"The Phoenician physical activity that can be documented is work. The reliefs of Sargon II's palace at Dur-Sharrukin show small rowing boats towing cedar logs, with a horse's head carved on the prow."},"s":"T2 · diap. 83 · Casson (1971)"},{"id":"lin-fen-mazarron","k":"cro","f":"C","t":2,"q":{"es":"¿Qué carga llevaba el pecio Mazarrón 2?","en":"What cargo did the Mazarrón 2 ship carry?"},"o":[{"es":"Unos 2.800 kilos de lingotes de plomo","en":"Some 2,800 kilos of lead ingots"},{"es":"Unas 300 ánforas de vino griego","en":"Some 300 amphorae of Greek wine"},{"es":"Troncos de cedro del Líbano","en":"Cedar trunks from Lebanon"},{"es":"Unos 900 kilos de lingotes de cobre","en":"Some 900 kilos of copper ingots"}],"x":{"es":"La mejor prueba material de la navegación fenicia está a cuarenta minutos de la facultad. Mazarrón 2 apareció en 1995 con el casco casi entero, mide 8,15 metros y se sacó del agua en 2024, desmontado en veintidós piezas. Hoy se conserva en el Museo Nacional de Arqueología Subacuática, en Cartagena.","en":"The best material evidence of Phoenician seafaring lies forty minutes from the faculty. Mazarrón 2 was found in 1995 with its hull almost complete, is 8.15 metres long and was raised in 2024, dismantled into twenty-two pieces. It is now kept in the National Museum of Underwater Archaeology in Cartagena."},"s":"T2 · diap. 86 · De Juan y Sabio (2025)"},{"id":"lin-fen-persas","k":"cro","f":"C","t":2,"q":{"es":"¿Qué ciudad hereda la red de factorías cuando Tiro es sometida?","en":"Which city inherits the network of trading posts when Tyre is subdued?"},"o":[{"es":"Cartago","en":"Carthage"},{"es":"Sidón","en":"Sidon"},{"es":"Cádiz","en":"Cádiz"},{"es":"Biblos","en":"Byblos"}],"x":{"es":"Cuando Tiro es sometida, Cartago hereda la red de factorías gracias a su riqueza y a su posición central en la ruta, y pasa a dirigirla por su cuenta. Lo que había nacido como empresa comercial dependiente de Oriente se convierte en una potencia autónoma.","en":"When Tyre is subdued, Carthage inherits the network of trading posts thanks to its wealth and central position on the route, and comes to run it on its own. What had begun as a trading venture dependent on the East becomes an independent power."},"s":"T2 · diap. 79 · López-Ruiz y Doak (2019)"},{"id":"lin-fen-kharayeb","k":"cro","f":"C","t":2,"q":{"es":"Entre los 5 y los 8 años, ¿qué sustituye al perro en las figuritas?","en":"Between the ages of 5 and 8, what replaces the dog in the figurines?"},"o":[{"es":"Una pelota, el paso del juego libre al juego reglado","en":"A ball, the step from free play to rule-based play"},{"es":"Un estrígil, el aseo tras el ejercicio","en":"A strigil, cleaning after exercise"},{"es":"Un arco, el paso de la caza a la guerra","en":"A bow, the step from hunting to war"},{"es":"Un caballo, el juego de la élite fenicia","en":"A horse, the game of the Phoenician elite"}],"x":{"es":"El santuario de Kharayeb, en el interior de Tiro, ha dado 16.400 fragmentos de terracota, y las figuras de niños suponen el 35 %. Ordenan una secuencia por edades: de los 2 a los 4 años juegan con pájaros y perros, y de los 12 a los 14 aparecen con estrígil y frasco de aceite, necesarios para entrenar en el gimnasio.","en":"The sanctuary of Kharayeb, inland from Tyre, has yielded 16,400 terracotta fragments, and figures of children make up 35% of them. They set out a sequence by age: from 2 to 4, children play with birds and dogs, and from 12 to 14 they appear with a strigil and an oil flask, needed for training in the gymnasium."},"s":"T2 · diap. 89 · Castiglione (2020)"},{"id":"lin-fen-cartagena","k":"cro","f":"C","t":2,"q":{"es":"¿Por qué se eligió el enclave de Cartagena?","en":"Why was the site of Cartagena chosen?"},"o":[{"es":"Por sus puertos, su laguna y sus minas de plata","en":"For its harbours, its lagoon and its silver mines"},{"es":"Por sus bosques de cedro y sus astilleros","en":"For its cedar forests and its shipyards"},{"es":"Por estar frente a Tiro en la ruta del estaño","en":"For facing Tyre on the tin route"},{"es":"Por sus salinas y su santuario de Melqart","en":"For its salt pans and its sanctuary of Melqart"}],"x":{"es":"Cartago significa en fenicio «ciudad nueva», Qart-ḥadašt. Seiscientos años después, Asdrúbal el Bello estableció en la actual Cartagena una segunda Qart-ḥadašt, que los romanos tradujeron por Carthago Nova.","en":"Carthage means “new city” in Phoenician, Qart-ḥadašt. Six hundred years later, Hasdrubal the Fair founded a second Qart-ḥadašt in present-day Cartagena, which the Romans translated as Carthago Nova."},"s":"T2 · diap. 79 · López-Ruiz y Doak (2019)"},{"id":"lin-fen-diotimo","k":"cro","f":"C","t":2,"q":{"es":"¿En qué prueba vence Diótimo de Sidón?","en":"In which event does Diotimus of Sidon win?"},"o":[{"es":"En la carrera de carros de los Juegos Nemeos","en":"The chariot race at the Nemean Games"},{"es":"En la lucha de los Juegos Olímpicos","en":"In the wrestling at the Olympic Games"},{"es":"En la regata de los juegos de Cartago","en":"In the boat race at the games of Carthage"},{"es":"En el pancracio de los Juegos Píticos","en":"In the pankration at the Pythian Games"}],"x":{"es":"Las ciudades fenicias carecieron de un Estado que grabara proezas, de un rey que exhibiera su cuerpo y de un santuario común donde inscribir vencedores, de modo que lo que falta es un tipo de fuente. En la etapa final, con la influencia helena, los registros griegos recogen a fenicios vencedores en sus juegos.","en":"The Phoenician cities lacked a state that carved feats in stone, a king who displayed his body and a common sanctuary where victors were inscribed, so what is missing is a type of source. In the final stage, under Greek influence, Greek records list Phoenician victors in their games."},"s":"T2 · diap. 91 · Remijsen (2015)"},{"id":"lin-fen-destruccion","k":"cro","f":"C","t":2,"q":{"es":"¿Qué disputó Cartago a Roma?","en":"What did Carthage contest with Rome?"},"o":[{"es":"El dominio del Mediterráneo occidental","en":"Control of the western Mediterranean"},{"es":"Las minas de oro de Egipto","en":"The gold mines of Egypt"},{"es":"El control de Persia","en":"Control of Persia"},{"es":"La organización de los Juegos Olímpicos","en":"The running of the Olympic Games"}],"x":{"es":"Roma destruye Cartago y pone fin a la potencia autónoma que, a la postre, le había disputado el dominio del Mediterráneo occidental.","en":"Rome destroys Carthage and puts an end to the independent power that had ultimately contested its control of the western Mediterranean."},"s":"T2 · diap. 79 · Futrell (2006)"},{"id":"lin-fen-helix","k":"cro","f":"C","t":2,"q":{"es":"¿En qué disciplina vence Aurelio Hélix en Olimpia?","en":"In which discipline does Aurelius Helix win at Olympia?"},"o":[{"es":"En la lucha","en":"Wrestling"},{"es":"En la carrera de carros","en":"The chariot race"},{"es":"En el estadio","en":"The stadion"},{"es":"En el lanzamiento de disco","en":"The discus"}],"x":{"es":"Aurelio Hélix, «el fenicio», vence en Olimpia a comienzos del siglo III d. C. La presencia de atletas fenicios en unos juegos ajenos resulta muy interesante para analizar el deporte griego, el contenido del próximo tema.","en":"Aurelius Helix, “the Phoenician”, wins at Olympia in the early third century AD. The presence of Phoenician athletes at someone else's games is very revealing for the study of Greek sport, the subject of the next unit."},"s":"T2 · diap. 91 · Golden (2004)"},{"id":"lin-ege-clase","k":"cro","f":"C","t":3,"q":{"es":"¿En qué se reconoce la nueva clase dirigente cretense?","en":"How is the new Cretan ruling class recognised?"},"o":[{"es":"En el paso de los enterramientos colectivos a los individuales","en":"In the shift from collective to individual burials"},{"es":"En la construcción de templos monumentales en las ciudades","en":"In the building of monumental temples in the cities"},{"es":"En las primeras listas de vencedores de los juegos fúnebres","en":"In the first lists of victors at funeral games"},{"es":"En la aparición de murallas alrededor de los palacios","en":"In the appearance of walls around the palaces"}],"x":{"es":"Se reconoce en el paso de los enterramientos colectivos a los individuales, y con ella aparece un grupo estable de sacerdotes. Los palacios fueron residencia, almacén y centro religioso, puesto que Creta no levantó templos monumentales.","en":"It can be recognised in the shift from collective to individual burials, and with it a stable group of priests appears. The palaces were residence, storehouse and religious centre, since Crete built no monumental temples."},"s":"T3 · diap. 7 · Shapland (2022); Schoep (2010)"},{"id":"lin-ege-salto","k":"cro","f":"M","t":3,"q":{"es":"¿De dónde proceden casi todas las imágenes de taurocatapsia?","en":"Where do almost all images of bull-leaping come from?"},"o":[{"es":"Del palacio de Cnoso","en":"The palace of Knossos"},{"es":"De la tumba de Vafio","en":"The tomb of Vapheio"},{"es":"De la acrópolis de Micenas","en":"The acropolis of Mycenae"},{"es":"De la ciudad de Akrotiri","en":"The town of Akrotiri"}],"x":{"es":"El salto sobre un toro vivo y a la carrera se practicó sobre todo en torno al palacio de Cnoso, en fiestas que reunían a la comunidad. Con los palacios adquirió su grandeza escénica y ritual, y se convirtió en emblema del poder de Cnoso.","en":"The leap over a live, charging bull was practised above all around the palace of Knossos, at festivals that gathered the community. With the palaces it acquired its scenic and ritual grandeur and became the emblem of Knossos's power."},"s":"T3 · diap. 14 · Shapland (2022); McInerney (2011); Soar (2014)"},{"id":"lin-ege-danza","k":"cro","f":"C","t":3,"q":{"es":"¿Con qué vinculan los estudios la danza de la arboleda sagrada?","en":"What do scholars link the dance in the sacred grove with?"},"o":[{"es":"Con el culto a la naturaleza y los ritos de iniciación","en":"The worship of nature and initiation rites"},{"es":"Con los juegos fúnebres de los señores","en":"With the lords’ funeral games"},{"es":"Con la preparación militar de los jóvenes","en":"With the military training of the young"},{"es":"Con las fiestas de la cosecha en el palacio","en":"With the harvest festivals in the palace"}],"x":{"es":"En el fresco de Cnoso las mujeres bailan ante una multitud, en un acto que los estudios vinculan al culto a la naturaleza, concebida como divinidad femenina, y a los ritos de iniciación.","en":"In the Knossos fresco women dance before a crowd, in an act that scholars link to the worship of nature, conceived as a female deity, and to initiation rites."},"s":"T3 · diap. 8 · Newman (2017); Scanlon (2014)"},{"id":"lin-ege-tera","k":"cro","f":"L","t":3,"q":{"es":"¿Acabó la erupción de Tera con los palacios cretenses?","en":"Did the eruption of Thera end the Cretan palaces?"},"o":[{"es":"No, fue unos ciento cincuenta años anterior a su final","en":"No, it came some 150 years before their end"},{"es":"Sí, los destruyó de inmediato con el terremoto","en":"Yes, the earthquake destroyed them at once"},{"es":"Sí, el maremoto arrasó Cnoso ese mismo año","en":"Yes, the tsunami razed Knossos that same year"},{"es":"No, fue unos cien años posterior a su final","en":"No, it came some 100 years after their end"}],"x":{"es":"Durante décadas se explicó con ella el fin de la Creta minoica. Hoy sabemos que fue unos ciento cincuenta años anterior al final de los palacios y que, si bien cubrió de ceniza el este de la isla, Creta se rehízo.","en":"For decades it was used to explain the end of Minoan Crete. Today we know it came some 150 years before the end of the palaces and that, although it covered the east of the island with ash, Crete recovered."},"s":"T3 · diap. 20 · Crowther (2007); Kyle (2015); Rutter (2014)"},{"id":"lin-ege-akrotiri","k":"cro","f":"C","t":3,"q":{"es":"¿Por qué se ha conservado el fresco de Akrotiri?","en":"Why has the Akrotiri fresco survived?"},"o":[{"es":"Porque la ceniza del volcán sepultó la ciudad","en":"Because the volcano's ash buried the city"},{"es":"Porque se guardó en una tumba real de Cnoso","en":"Because it was kept in a royal tomb at Knossos"},{"es":"Porque se pintó en el interior de una cueva","en":"Because it was painted inside a cave"},{"es":"Porque el mar cubrió la ciudad tras el terremoto","en":"Because the sea covered the town after the earthquake"}],"x":{"es":"Dos niños de entre seis y diez años boxean con un solo guante, en una de las escenas deportivas más antiguas del Egeo. El vencedor lleva collar, pulseras y pendientes y su rival viste con sencillez, de modo que el juego marcaba ya la jerarquía entre los hijos de la élite.","en":"Two boys aged six to ten box with a single glove, in one of the oldest sporting scenes of the Aegean. The winner wears a necklace, bracelets and earrings and his opponent is simply dressed, so the game already marked the hierarchy among the children of the elite."},"s":"T3 · diap. 11 · Younger (2021); Rutter (2014)"},{"id":"lin-ege-riton","k":"cro","f":"C","t":3,"q":{"es":"¿Para qué servía un ritón?","en":"What was a rhyton used for?"},"o":[{"es":"Para las libaciones a los dioses","en":"For libations to the gods"},{"es":"Para guardar los premios","en":"To keep prizes"},{"es":"Para medir las carreras","en":"To measure races"},{"es":"Para el aceite de los atletas","en":"For athletes' oil"}],"x":{"es":"Vaso de piedra de unos 46 cm para las libaciones, con cuatro bandas en relieve de púgiles adultos y del salto del toro. Su equipo cambia de una banda a otra, señal de un entrenamiento sistemático con reglas.","en":"Stone vessel about 46 cm high for libations, with four relief bands of adult boxers and bull-leaping. Their equipment changes from band to band, a sign of systematic rule-based training."},"s":"T3 · diap. 12 · Rutter (2014); Koehl (1986)"},{"id":"lin-ege-cnoso","k":"cro","f":"M","t":3,"q":{"es":"¿Qué ocurrió con la taurocatapsia tras la toma micénica de Cnoso?","en":"What happened to bull-leaping after the Mycenaean seizure of Knossos?"},"o":[{"es":"Siguió practicándose bajo dominio micénico","en":"It continued under Mycenaean rule"},{"es":"Se prohibió en cuanto llegaron los micénicos","en":"It was banned as soon as the Mycenaeans arrived"},{"es":"Se trasladó a los santuarios del continente","en":"It moved to the sanctuaries of the mainland"},{"es":"Se convirtió en una prueba de los juegos fúnebres","en":"It became an event of the funeral games"}],"x":{"es":"Ardieron casi todos los palacios de Creta salvo el de Cnoso, que pasó a manos de los micénicos. Durante unos setenta y cinco años fue el único palacio de la isla, y la taurocatapsia siguió bajo dominio micénico.","en":"Almost all the palaces of Crete burned except Knossos, which passed to the Mycenaeans. For some seventy-five years it was the island's only palace, and bull-leaping continued under Mycenaean rule."},"s":"T3 · diap. 20 · Crowther (2007); Kyle (2015); Rutter (2014)"},{"id":"lin-ege-fincnoso","k":"cro","f":"M","t":3,"q":{"es":"¿Dónde continuó el salto del toro tras el incendio de Cnoso?","en":"Where did bull-leaping continue after the burning of Knossos?"},"o":[{"es":"En la Grecia continental micénica","en":"In Mycenaean mainland Greece"},{"es":"En el Egipto del Imperio Nuevo","en":"In New Kingdom Egypt"},{"es":"En las islas Cícladas","en":"In the Cycladic islands"},{"es":"En la Anatolia de los hititas","en":"In Hittite Anatolia"}],"x":{"es":"Con él terminó la Creta de los palacios. El salto del toro continuó, no obstante, en la Grecia continental hasta la caída de los palacios micénicos.","en":"With it palatial Crete came to an end. Bull-leaping nevertheless continued in mainland Greece until the fall of the Mycenaean palaces."},"s":"T3 · diap. 20 · Crowther (2007); Kyle (2015); Rutter (2014)"},{"id":"lin-ege-colapso","k":"cro","f":"L","t":3,"q":{"es":"¿Cómo explica Cline (2015) la caída de los palacios?","en":"How does Cline (2015) explain the fall of the palaces?"},"o":[{"es":"Como una «tormenta perfecta» de varias causas","en":"As a 'perfect storm' of several causes"},{"es":"Por la erupción del volcán de Tera","en":"Because of the eruption of Thera"},{"es":"Por una invasión persa desde Asia","en":"Because of a Persian invasion from Asia"},{"es":"Por una gran epidemia en los palacios","en":"Because of a great epidemic in the palaces"}],"x":{"es":"Cline (2015) habla de una «tormenta perfecta» de terremotos, sequía, gentes desplazadas, revueltas y ataques de los «pueblos del mar». Con la caída del palacio, Grecia se quedó cuatro siglos sin escribir y sin quien pagara los carros, la caza señorial y los púgiles a sueldo.","en":"Cline (2015) speaks of a 'perfect storm' of earthquakes, drought, displaced peoples, revolts and attacks by the 'Sea Peoples'. With the fall of the palace, Greece went four centuries without writing and without anyone to pay for chariots, lordly hunting and paid boxers."},"s":"T3 · diap. 22 · Cline (2015); Perry (2014); Potter (2012); Rutter (2014)"},{"id":"lin-gre-lefkandi","k":"cro","f":"C","t":3,"q":{"es":"¿Con qué relato homérico se compara la tumba de Lefkandi?","en":"Which Homeric story is the Lefkandi tomb compared with?"},"o":[{"es":"El funeral de Patroclo","en":"The funeral of Patroclus"},{"es":"El regreso de Ulises","en":"The return of Odysseus"},{"es":"La carrera de Pélope","en":"The race of Pelops"},{"es":"La tregua de Ífito","en":"The truce of Iphitos"}],"x":{"es":"Un gran señor fue incinerado y enterrado bajo un túmulo con sus armas y sus caballos sacrificados, como Patroclo en la Ilíada. El funeral de un jefe era la ocasión de exhibir el prestigio de la élite.","en":"A great lord was cremated and buried under a tumulus with his weapons and sacrificed horses, like Patroclus in the Iliad. A chieftain's funeral was the occasion to display the prestige of the elite."},"s":"T3 · diap. 23 · Verde Castro (2011); Roller (1981)"},{"id":"lin-gre-ifito","k":"cro","f":"C","t":3,"q":{"es":"¿Por qué se considera legendaria la fecha de 884 a. C.?","en":"Why is the date of 884 BC considered legendary?"},"o":[{"es":"Porque procede de un autor más de mil años posterior","en":"Because it comes from an author over a thousand years later"},{"es":"Porque la confirma una inscripción del santuario","en":"Because an inscription from the sanctuary confirms it"},{"es":"Porque figura en el canto 23 de la Ilíada","en":"Because it appears in book 23 of the Iliad"},{"es":"Porque la recoge una lista de vencedores del siglo VIII a. C.","en":"Because an eighth-century BC list of victors records it"}],"x":{"es":"Los autores antiguos situaban el origen del olimpismo en un pacto de tregua del rey Ífito de Élide con Esparta y Pisa. El relato procede de un autor del siglo II d. C., más de mil años posterior, y pertenece a la leyenda.","en":"Ancient authors placed the origin of the Olympic Games in a truce made by King Iphitos of Elis with Sparta and Pisa. The story comes from a second-century AD author, more than a thousand years later, and belongs to legend."},"s":"T3 · diap. 39 · Nielsen (2023); Bromberg (2023); Christesen et al. (2021); Heródoto (1989)"},{"id":"lin-gre-776","k":"cro","f":"C","t":3,"q":{"es":"¿En qué prueba venció Corebo?","en":"In which event did Koroibos win?"},"o":[{"es":"El stádion","en":"The stadion"},{"es":"El pancracio","en":"The pankration"},{"es":"La cuadriga","en":"The four-horse chariot"},{"es":"El pentatlón","en":"The pentathlon"}],"x":{"es":"La lista de vencedores que escribió Hipias a partir de la tradición oral se inicia con Corebo, ganador del stádion. Es poco fiable en sus primeros siglos, y la tradición sitúa en este año los primeros Juegos.","en":"The victor list that Hippias wrote from oral tradition begins with Koroibos, winner of the stadion. It is unreliable for its first centuries, and tradition places the first Games in this year."},"s":"T3 · diap. 44 · Christesen (2007); Crowther (2003)"},{"id":"lin-gre-dipilon","k":"cro","f":"C","t":3,"q":{"es":"¿Qué premiaba la enócoe del Dipilón?","en":"What did the Dipylon oinochoe reward?"},"o":[{"es":"Al mejor bailarín de un concurso","en":"The best dancer in a contest"},{"es":"Al vencedor de la carrera del estadio","en":"The winner of the stadion race"},{"es":"Al mejor auriga de los juegos fúnebres","en":"The best charioteer at the funeral games"},{"es":"Al mejor cantor de un banquete","en":"The best singer at a banquet"}],"x":{"es":"En el siglo VIII a. C. regresa la escritura con el alfabeto fenicio. Esta jarra de vino lleva una de las inscripciones griegas más antiguas, que la declara premio del mejor bailarín de un concurso.","en":"In the eighth century BC writing returns with the Phoenician alphabet. This wine jug bears one of the oldest Greek inscriptions, which declares it the prize for the best dancer in a contest."},"s":"T3 · diap. 22 · Cline (2015); Perry (2014); Potter (2012); Rutter (2014)"},{"id":"lin-gre-orsipo","k":"cro","f":"C","t":3,"q":{"es":"¿Cuánto tardó en generalizarse la desnudez atlética?","en":"How long did athletic nudity take to become general?"},"o":[{"es":"Más de un siglo","en":"More than a century"},{"es":"Una sola edición","en":"A single edition"},{"es":"Diez años","en":"Ten years"},{"es":"Nunca se generalizó","en":"It never became general"}],"x":{"es":"Hasta entonces se competía con perizoma. El cambio tardó más de un siglo en generalizarse y se mantuvo hasta el final del olimpismo, salvo en las pruebas hípicas.","en":"Until then athletes competed in the perizoma. The change took more than a century to become general and lasted until the end of the Games, except in the equestrian events."},"s":"T3 · diap. 59 · McDonnell (1991); Christesen (2012); Garrison (2010)"},{"id":"lin-gre-iliada","k":"cro","f":"C","t":3,"q":{"es":"¿Qué sociedad retratan los juegos de la Ilíada?","en":"Which society do the games of the Iliad portray?"},"o":[{"es":"La de los basileis de los siglos IX y VIII a. C.","en":"That of the basileis of the ninth and eighth centuries BC"},{"es":"La de los palacios micénicos del siglo XIII a. C.","en":"That of the Mycenaean palaces of the thirteenth century BC"},{"es":"La de la Atenas democrática del siglo V a. C.","en":"That of democratic Athens in the fifth century BC"},{"es":"La de las colonias griegas del siglo VI a. C.","en":"That of the Greek colonies of the sixth century BC"}],"x":{"es":"El canto 23 de la Ilíada narra los juegos fúnebres de Patroclo, ocho pruebas en las que compiten casi solo príncipes. La trama se sitúa en el siglo XIII a. C., pero retrata la sociedad de los basileis de los siglos IX y VIII a. C.","en":"Book 23 of the Iliad narrates the funeral games of Patroclus, eight events in which almost only princes compete. The plot is set in the 13th century BC, but it portrays the society of the basileis of the ninth and eighth centuries BC."},"s":"T3 · diap. 23 · Verde Castro (2011); Roller (1981)"},{"id":"lin-gre-estadio","k":"cro","f":"C","t":3,"q":{"es":"¿Qué fue primero en Olimpia, según la arqueología?","en":"What came first at Olympia, according to archaeology?"},"o":[{"es":"El rito","en":"The rite"},{"es":"El certamen atlético","en":"The athletic contest"},{"es":"El estadio","en":"The stadium"},{"es":"La lista de vencedores","en":"The victor list"}],"x":{"es":"El santuario de Zeus había nacido a finales del siglo XI a. C., y durante siglos recibió figurillas de animales y trípodes de bronce sin relación con el atletismo. Primero fue el rito, después la distinción de las élites y al final el certamen.","en":"The sanctuary of Zeus had been founded at the end of the 11th century BC, and for centuries it received animal figurines and bronze tripods unrelated to athletics. First came the rite, then the distinction of the elites and finally the contest."},"s":"T3 · diap. 41 · Kyrieleis (2003); Sinn (2021); Kyle (2015)"},{"id":"lin-gre-solon","k":"cro","f":"C","t":3,"q":{"es":"¿En qué época se configura casi todo el deporte griego?","en":"In which period does almost all Greek sport take shape?"},"o":[{"es":"En la arcaica","en":"The Archaic"},{"es":"En la Edad Oscura","en":"The Dark Age"},{"es":"En la helenística","en":"The Hellenistic"},{"es":"En la romana","en":"The Roman"}],"x":{"es":"Junto a las de Clístenes (508 a. C.), abren paso a la democracia. En la época arcaica se fijan el programa de Olimpia y el circuito panhelénico, de modo que casi todo el deporte griego se configura entonces.","en":"Together with those of Cleisthenes (508 BC), they open the way to democracy. In the Archaic period the Olympic programme and the Panhellenic circuit are fixed, so almost all Greek sport takes shape then."},"s":"T3 · diap. 29 · Pomeroy et al. (2001)"},{"id":"lin-gre-hereos","k":"cro","f":"C","t":3,"q":{"es":"¿Quiénes corrían en los Juegos Hereos?","en":"Who ran in the Heraia?"},"o":[{"es":"Muchachas solteras","en":"Unmarried girls"},{"es":"Mujeres casadas","en":"Married women"},{"es":"Sacerdotisas de Deméter","en":"Priestesses of Demeter"},{"es":"Esclavas","en":"Slave women"}],"x":{"es":"Carrera de muchachas solteras en honor de Hera, de unos 160 m, en el estadio de Olimpia y en tres categorías de edad. La ganadora recibía, como los varones, una corona de olivo.","en":"Race of unmarried girls in honour of Hera, about 160 m long, in the stadium of Olympia and in three age categories. The winner received, like the men, an olive wreath."},"s":"T3 · diap. 102 · García Romero (2015); Serwint (1993)"},{"id":"lin-gre-arriquion","k":"cro","f":"C","t":3,"q":{"es":"¿Qué hicieron los jueces con Arriquión?","en":"What did the judges do with Arrhichion?"},"o":[{"es":"Coronaron su cadáver","en":"Crowned his corpse"},{"es":"Lo descalificaron","en":"Disqualified him"},{"es":"Declararon nulo el combate","en":"Declared the bout void"},{"es":"Coronaron a su rival","en":"Crowned his opponent"}],"x":{"es":"Buscaba su tercera corona seguida y murió asfixiado en la final de pancracio mientras dislocaba el pie de su rival, que se rindió. Los jueces coronaron su cadáver.","en":"He was seeking his third successive wreath and died of strangulation in the pankration final while dislocating his opponent's foot; the opponent conceded. The judges crowned his corpse."},"s":"T3 · diap. 91 · Miller (2004b); Brophy (1978); Filóstrato (1996)"},{"id":"lin-gre-480","k":"cro","f":"C","t":3,"q":{"es":"¿Detenía la tregua olímpica las guerras de Grecia?","en":"Did the Olympic truce stop the wars of Greece?"},"o":[{"es":"No, protegía Élide, el santuario y a los peregrinos","en":"No, it protected Elis, the sanctuary and the pilgrims"},{"es":"Sí, imponía la paz en todas las polis griegas","en":"Yes, it imposed peace on every Greek polis"},{"es":"Sí, pero solo en las polis del Peloponeso","en":"Yes, but only in the cities of the Peloponnese"},{"es":"Solo detenía las guerras contra los persas","en":"It only halted the wars against the Persians"}],"x":{"es":"La 75.ª Olimpiada se celebró mientras Leónidas resistía en las Termópilas. La ekecheiría no implicaba una paz general ni frenaba las guerras en toda Grecia.","en":"The 75th Olympiad was held while Leonidas held out at Thermopylae. The ekecheiria implied no general peace and did not halt wars throughout Greece."},"s":"T3 · diap. 39 · Nielsen (2023); Bromberg (2023); Christesen et al. (2021); Heródoto (1989)"},{"id":"lin-gre-esparta","k":"cro","f":"C","t":3,"q":{"es":"¿Por qué fue multada Esparta en 420 a. C.?","en":"Why was Sparta fined in 420 BC?"},"o":[{"es":"Por enviar tropas durante la tregua","en":"For sending troops during the truce"},{"es":"Por sobornar a los jueces del estadio","en":"For bribing the judges of the stadium"},{"es":"Por inscribir a mujeres en la cuadriga","en":"For entering women in the chariot race"},{"es":"Por enviar a un atleta que no era ciudadano","en":"For sending an athlete who was not a citizen"}],"x":{"es":"Durante la Guerra del Peloponeso, Élide multó a Esparta con 200.000 dracmas, 200 por soldado, por enviar tropas a Lepreo durante la tregua. Los espartanos no pagaron y fueron excluidos de esa edición.","en":"During the Peloponnesian War, Elis fined Sparta 200,000 drachmas, 200 per soldier, for sending troops to Lepreon during the truce. The Spartans did not pay and were excluded from that edition."},"s":"T3 · diap. 40 · Waterfield (2018)"},{"id":"lin-gre-cinisca","k":"cro","f":"C","t":3,"q":{"es":"¿Por qué pudo vencer Cinisca?","en":"Why could Kyniska win?"},"o":[{"es":"Porque la corona era para el dueño de los caballos","en":"Because the wreath went to the owner of the horses"},{"es":"Porque condujo ella misma el carro en el hipódromo","en":"Because she drove the chariot herself in the hippodrome"},{"es":"Porque se disfrazó de auriga para competir","en":"Because she disguised herself as a charioteer to compete"},{"es":"Porque era sacerdotisa de Deméter en Olimpia","en":"Because she was the priestess of Demeter at Olympia"}],"x":{"es":"En las pruebas hípicas la corona era para el dueño de las monturas, de modo que hubo campeonas olímpicas aunque las mujeres tenían vetado el acceso a Olimpia.","en":"In the equestrian events the wreath went to the owner of the horses, so there were female Olympic champions although women were barred from Olympia."},"s":"T3 · diap. 94 · García Romero (2015); Nicholson (2021); Papakonstantinou (2019)"},{"id":"lin-gre-zanes","k":"cro","f":"C","t":3,"q":{"es":"¿Con qué se pagaron los primeros zanes?","en":"What paid for the first Zanes?"},"o":[{"es":"Con las multas por soborno","en":"With fines for bribery"},{"es":"Con el botín de una guerra","en":"With war booty"},{"es":"Con donativos de Esparta","en":"With donations from Sparta"},{"es":"Con el tesoro de Zeus","en":"With the treasury of Zeus"}],"x":{"es":"Seis estatuas de Zeus pagadas con las multas a un púgil que compró a sus rivales y a los tres que aceptaron su dinero. Llevaban el nombre del infractor en el pedestal.","en":"Six statues of Zeus paid for with the fines of a boxer who bought his rivals and of the three who took his money. They bore the offender's name on the pedestal."},"s":"T3 · diap. 104 · Bertolín Cebrián (2020); Buraselis (2017); Kyle (2015)"},{"id":"lin-gre-anolimpiada","k":"cro","f":"C","t":3,"q":{"es":"¿Cómo registró Élide la edición de 364 a. C.?","en":"How did Elis record the edition of 364 BC?"},"o":[{"es":"Como anolimpiada","en":"As an anolympiad"},{"es":"Como la mejor de su historia","en":"As the best in its history"},{"es":"Como olimpiada espartana","en":"As a Spartan Olympiad"},{"es":"No la registró en absoluto","en":"It did not record it at all"}],"x":{"es":"Durante el pentatlón de la 104.ª Olimpiada, arcadios y eleos combatieron en el recinto sagrado. Al recuperar la administración, Élide registró la edición como «no-olimpiada», aunque respetó los triunfos individuales.","en":"During the pentathlon of the 104th Olympiad, Arcadians and Eleans fought in the sacred precinct. On regaining control, Elis recorded the edition as a 'non-Olympiad', although it respected the individual victories."},"s":"T3 · diap. 40 · Waterfield (2018)"},{"id":"lin-gre-queronea","k":"cro","f":"C","t":3,"q":{"es":"¿Quién venció en Queronea?","en":"Who won at Chaeronea?"},"o":[{"es":"Filipo II de Macedonia","en":"Philip II of Macedon"},{"es":"Jerjes","en":"Xerxes"},{"es":"Leónidas","en":"Leonidas"},{"es":"Alejandro de Élide","en":"Alexander of Elis"}],"x":{"es":"Filipo II de Macedonia vence y termina el dominio de Atenas y Esparta. De la época clásica procede la mayoría de los testimonios sobre atletas y gimnasios, incluso sobre siglos anteriores, y hay que leerlos con cuidado.","en":"Philip II of Macedon wins and the dominance of Athens and Sparta ends. Most of the evidence on athletes and gymnasia, even about earlier centuries, comes from the Classical period and must be read with care."},"s":"T3 · diap. 29 · Pomeroy et al. (2001)"},{"id":"lin-gre-corinto","k":"cro","f":"C","t":3,"q":{"es":"¿De quién dependió Olimpia desde 146 a. C.?","en":"On whom did Olympia depend from 146 BC?"},"o":[{"es":"De los generales y emperadores romanos","en":"Roman generals and emperors"},{"es":"De los reyes de Macedonia y su corte","en":"The kings of Macedon and their court"},{"es":"De la liga de ciudades del Peloponeso","en":"The league of cities of the Peloponnese"},{"es":"De los tiranos de Siracusa","en":"The tyrants of Syracuse"}],"x":{"es":"Tras perder la batalla de Corinto, Grecia pasa a depender de Roma, y Olimpia de sus generales y, más tarde, de sus emperadores.","en":"After losing the battle of Corinth, Greece comes to depend on Rome, and Olympia on its generals and, later, its emperors."},"s":"T3 · diap. 29 · Pomeroy et al. (2001)"},{"id":"lin-gre-neron","k":"cro","f":"C","t":3,"q":{"es":"¿Qué revela el episodio de Nerón?","en":"What does the Nero episode reveal?"},"o":[{"es":"Que el agón se había convertido en exhibición del poder del emperador","en":"That the agon had become a display of the emperor's power"},{"es":"Que Roma respetaba las reglas griegas y competía como un griego más","en":"That Rome respected Greek rules and competed like any Greek"},{"es":"Que el pancracio se había convertido en la prueba favorita de Roma","en":"That the pankration had become Rome’s favourite event"},{"es":"Que los helanódicas seguían siendo jueces incorruptibles","en":"That the Hellanodikai were still incorruptible judges"}],"x":{"es":"Hizo aplazar dos años la Olimpiada, añadió el carro de diez caballos y concursos de tragedia y música, se cayó del carro y fue proclamado vencedor tras pagar a los jueces. Tras su muerte, Élide borró aquella Olimpiada.","en":"He had the Olympiad postponed two years, added the ten-horse chariot race and contests in tragedy and music, fell from the chariot and was proclaimed victor after paying the judges. After his death, Elis struck that Olympiad from the record."},"s":"T3 · diap. 108 · Durántez Corral (2010)"},{"id":"lin-gre-ninfeo","k":"cro","f":"C","t":3,"q":{"es":"¿Qué costeó Herodes Ático en Olimpia?","en":"What did Herodes Atticus pay for at Olympia?"},"o":[{"es":"Un acueducto con una fuente monumental","en":"An aqueduct with a monumental fountain"},{"es":"Un nuevo estadio de piedra para 40.000 espectadores","en":"A new stone stadium for 40,000 spectators"},{"es":"Las estatuas de bronce de los zanes","en":"The bronze statues of the Zanes"},{"es":"Una restauración del templo de Hera","en":"A restoration of the temple of Hera"}],"x":{"es":"El benefactor griego costeó un acueducto con su fuente monumental para el santuario. Hacia 170, mientras declinaba el deporte, Olimpia vivió su máximo apogeo arquitectónico.","en":"The Greek benefactor paid for an aqueduct with its monumental fountain for the sanctuary. By c. 170, while sport declined, Olympia reached its architectural peak."},"s":"T3 · diap. 107 · Kyle (2015); Spivey (2005)"},{"id":"lin-gre-393","k":"cro","f":"C","t":3,"q":{"es":"¿Menciona la ley de 393 los Juegos Olímpicos?","en":"Does the law of 393 mention the Olympic Games?"},"o":[{"es":"No","en":"No"},{"es":"Sí, los prohíbe expresamente","en":"Yes, it expressly bans them"},{"es":"Sí, los traslada a Roma","en":"Yes, it moves them to Rome"},{"es":"Sí, los reduce a un día","en":"Yes, it reduces them to one day"}],"x":{"es":"Durante más de un siglo se fechó en ella el final de los Juegos. Remijsen (2015) comprobó que no los menciona y que el vínculo lo estableció un cronista del siglo XI; en 399 un poeta de la corte aún esperaba ver a los vencedores de Olimpia.","en":"For more than a century the end of the Games was dated to it. Remijsen (2015) showed that it does not mention them and that the link was made by an 11th-century chronicler; in 399 a court poet still hoped to see the Olympic victors."},"s":"T3 · diap. 109 · Remijsen (2015); Spivey (2005); Arrechea et al. (2019)"},{"id":"lin-gre-435","k":"cro","f":"C","t":3,"q":{"es":"¿Qué pudo desencadenar la constitución de 435?","en":"What may the constitution of 435 have triggered?"},"o":[{"es":"El incendio del templo de Zeus","en":"The fire at the temple of Zeus"},{"es":"La restauración de los Juegos","en":"The restoration of the Games"},{"es":"La fundación de Élide","en":"The foundation of Elis"},{"es":"La llegada de Nerón","en":"Nero's arrival"}],"x":{"es":"Según Arrechea et al. (2019), pudo desencadenar el incendio del templo de Zeus, y tras ello los Juegos no volvieron a celebrarse en Olimpia. Hacia 420-440 la estatua de Zeus se había llevado a Constantinopla.","en":"According to Arrechea et al. (2019), it may have triggered the fire that destroyed the temple of Zeus, after which the Games were no longer held at Olympia. C. 420-440 the statue of Zeus had been taken to Constantinople."},"s":"T3 · diap. 109 · Remijsen (2015); Spivey (2005); Arrechea et al. (2019)"},{"id":"fec-egi-unif","k":"cro","f":"C","t":2,"q":{"es":"¿Cuándo? «Unificación del Estado egipcio»","en":"When? “Unification of the Egyptian state”"},"o":[{"es":"h. 3050 a. C.","en":"c. 3050 BC"},{"es":"h. 2650 a. C.","en":"c. 2650 BC"},{"es":"2496-2483 a. C.","en":"2496-2483 BC"},{"es":"h. 2560 a. C.","en":"c. 2560 BC"}],"x":{"es":"La unificación de Egipto abre la etapa de las primeras dinastías y de las primeras pirámides. Los egipcios fechaban por año de reinado, sin una era continua, de manera que la cronología se reconstruye sumando los reinados a partir de las listas reales, y por eso las fechas más antiguas se dan siempre como aproximadas.","en":"The unification of Egypt opens the age of the first dynasties and the first pyramids. The Egyptians dated by regnal year, with no continuous era, so the chronology is rebuilt by adding up reigns from the king lists, and that is why the earliest dates are always given as approximate."},"s":"T2 · línea del tiempo"},{"id":"fec-egi-dyeser","k":"cro","f":"C","t":2,"q":{"es":"¿Cuándo? «La pista del Heb-Sed en Saqqara»","en":"When? “The Heb-Sed track at Saqqara”"},"o":[{"es":"h. 2650 a. C.","en":"c. 2650 BC"},{"es":"h. 2560 a. C.","en":"c. 2560 BC"},{"es":"dinastía V, h. 2400 a. C.","en":"5th Dynasty, c. 2400 BC"},{"es":"h. 3050 a. C.","en":"c. 3050 BC"}],"x":{"es":"El elemento central del Heb-Sed era la carrera del faraón, de obligada realización, que se corría en el patio sur del recinto de la pirámide de Saqqara. La pista era una recta de 55 metros coronada por dos mojones semicirculares, el circuito completo sumaba 140 metros y se recorría de norte a sur y de sur a norte.","en":"The central element of the Heb-Sed was the pharaoh's run, which had to be performed, in the southern court of the precinct of the pyramid of Saqqara. The track was a 55-metre straight crowned by two semicircular markers, the full circuit came to 140 metres, and it was run from north to south and from south to north."},"s":"T2 · línea del tiempo"},{"id":"fec-egi-piramide","k":"cro","f":"C","t":2,"q":{"es":"¿Cuándo? «Gran Pirámide de Guiza»","en":"When? “Great Pyramid of Giza”"},"o":[{"es":"h. 2560 a. C.","en":"c. 2560 BC"},{"es":"h. 2650 a. C.","en":"c. 2650 BC"},{"es":"2496-2483 a. C.","en":"2496-2483 BC"},{"es":"dinastía V, h. 2400 a. C.","en":"5th Dynasty, c. 2400 BC"}],"x":{"es":"La Gran Pirámide sirve de referencia para situar el Imperio Antiguo, la etapa en la que se consolida el culto, el sacerdocio gana control y se levantan las grandes obras. A esa misma etapa pertenece el relieve de las competiciones de obreros de Sahure.","en":"The Great Pyramid is a reference point for the Old Kingdom, the period in which the cult is consolidated, the priesthood gains control and the great works are raised. The relief of Sahure's workers' competitions belongs to the same period."},"s":"T2 · línea del tiempo"},{"id":"fec-egi-sahure","k":"cro","f":"C","t":2,"q":{"es":"¿Cuándo? «Las competiciones de obreros de Sahure»","en":"When? “Sahure's workers' competitions”"},"o":[{"es":"2496-2483 a. C.","en":"2496-2483 BC"},{"es":"h. 2560 a. C.","en":"c. 2560 BC"},{"es":"dinastía V, h. 2400 a. C.","en":"5th Dynasty, c. 2400 BC"},{"es":"h. 2650 a. C.","en":"c. 2650 BC"}],"x":{"es":"Un relieve de la calzada de la pirámide de Sahure reúne tiro con arco, esgrima de bastón, lucha y una regata, organizadas para las fiestas por la terminación del templo funerario y la pirámide. Compiten los obreros y los soldados que han levantado la obra, hay premios para los vencedores y el rey está presente sin competir.","en":"A relief from the causeway of Sahure's pyramid brings together archery, stick fencing, wrestling and a boat race, held for the festivities marking the completion of the king's funerary temple and pyramid. The workers and soldiers who built the monument compete, there are prizes for the winners, and the king is present without competing."},"s":"T2 · línea del tiempo"},{"id":"fec-egi-justas","k":"cro","f":"C","t":2,"q":{"es":"¿Cuándo? «Las justas de pescadores»","en":"When? “The fishermen's jousts”"},"o":[{"es":"dinastía V, h. 2400 a. C.","en":"5th Dynasty, c. 2400 BC"},{"es":"2496-2483 a. C.","en":"2496-2483 BC"},{"es":"h. 2560 a. C.","en":"c. 2560 BC"},{"es":"h. 2650 a. C.","en":"c. 2650 BC"}],"x":{"es":"Se enfrentaban de dos a cuatro tripulaciones en canoas de juncos de papiro: los de popa timoneaban y los de proa empujaban a los rivales con las pértigas de navegación. No había reglamento ni árbitro, y para Guttmann es uno de los mejores ejemplos de cómo un trabajo cotidiano puede derivar en una disciplina deportiva de equipo.","en":"Two to four crews faced each other in papyrus-reed canoes: those at the stern steered and those at the bow pushed their rivals with the punting poles. There were no rules and no referee, and for Guttmann it is one of the best examples of how everyday work can give rise to a team sport."},"s":"T2 · línea del tiempo"},{"id":"fec-egi-benihasan","k":"cro","f":"C","t":2,"q":{"es":"¿Cuándo? «La lucha de Beni Hasan»","en":"When? “The Beni Hasan wrestling”"},"o":[{"es":"h. 2000 a. C.","en":"c. 2000 BC"},{"es":"dinastía V, h. 2400 a. C.","en":"5th Dynasty, c. 2400 BC"},{"es":"1549 a. C.","en":"1549 BC"},{"es":"h. 1464 a. C.","en":"c. 1464 BC"}],"x":{"es":"Las pinturas murales de los príncipes de Beni Hasan muestran 219 parejas de luchadores con un amplio repertorio de llaves, proyecciones, volteos, zancadillas y presas, sin puñetazos ni mordiscos. Se competía desnudo salvo un pequeño cinturón, y está documentada la presencia de árbitros.","en":"The wall paintings of the princes of Beni Hasan show 219 pairs of wrestlers with a wide repertoire of holds, throws, trips and leg grabs, with no punches or bites. Wrestlers competed naked except for a small belt, and the presence of referees is documented."},"s":"T2 · línea del tiempo"},{"id":"fec-egi-hicsos","k":"cro","f":"C","t":2,"q":{"es":"¿Cuándo? «Expulsión de los hicsos»","en":"When? “Expulsion of the Hyksos”"},"o":[{"es":"1549 a. C.","en":"1549 BC"},{"es":"1479-1425 a. C.","en":"1479-1425 BC"},{"es":"1428-1397 a. C.","en":"1428-1397 BC"},{"es":"h. 1330 a. C.","en":"c. 1330 BC"}],"x":{"es":"Durante el Segundo Periodo Intermedio los hicsos dominan el norte de Egipto, y con ellos llegan el carro ligero y el arco compuesto, que los egipcios comienzan a fabricar tras las guerras contra ellos. Su expulsión abre el Imperio Nuevo.","en":"During the Second Intermediate Period the Hyksos rule the north of Egypt, and with them come the light chariot and the composite bow, which the Egyptians begin to make after the wars against them. Their expulsion opens the New Kingdom."},"s":"T2 · línea del tiempo"},{"id":"fec-egi-hatshepsut","k":"cro","f":"C","t":2,"q":{"es":"¿Cuándo? «Hatshepsut corre el Heb-Sed»","en":"When? “Hatshepsut runs the Heb-Sed”"},"o":[{"es":"h. 1464 a. C.","en":"c. 1464 BC"},{"es":"1479-1425 a. C.","en":"1479-1425 BC"},{"es":"1549 a. C.","en":"1549 BC"},{"es":"h. 1330 a. C.","en":"c. 1330 BC"}],"x":{"es":"En la Capilla Roja de Karnak aparece la reina Hatshepsut, acompañada del toro Apis, realizando el Heb-Sed en el año dieciséis de su reinado, a los cuarenta años. Los egiptólogos explican el adelanto porque sumó sus años como gran esposa real y regente antes de ser nombrada faraón.","en":"In the Red Chapel at Karnak, Queen Hatshepsut, accompanied by the Apis bull, performs the Heb-Sed in the sixteenth year of her reign, at the age of forty. Egyptologists explain the early date by suggesting that she counted her years as great royal wife and regent before being named pharaoh."},"s":"T2 · línea del tiempo"},{"id":"fec-egi-tutmosis","k":"cro","f":"C","t":2,"q":{"es":"¿Cuándo? «Las cacerías de Tutmosis III»","en":"When? “The hunts of Thutmose III”"},"o":[{"es":"1479-1425 a. C.","en":"1479-1425 BC"},{"es":"h. 1464 a. C.","en":"c. 1464 BC"},{"es":"1428-1397 a. C.","en":"1428-1397 BC"},{"es":"1549 a. C.","en":"1549 BC"}],"x":{"es":"Los faraones dejaron registros extraordinarios de sus hazañas de caza en carro, y de Tutmosis III se registró que abatió 120 toros salvajes en una hora y siete leones «en un abrir y cerrar de ojos». Su nombre abre también la tabla de marcas reales de tiro con arco del Imperio Nuevo.","en":"The pharaohs left extraordinary records of their chariot hunts, and Thutmose III was recorded as killing 120 wild bulls in one hour and seven lions “in the blink of an eye”. His name also heads the table of New Kingdom royal archery records."},"s":"T2 · línea del tiempo"},{"id":"fec-egi-amenofis","k":"cro","f":"C","t":2,"q":{"es":"¿Cuándo? «Las marcas imposibles de Amenofis II»","en":"When? “Amenhotep II's impossible records”"},"o":[{"es":"1428-1397 a. C.","en":"1428-1397 BC"},{"es":"1479-1425 a. C.","en":"1479-1425 BC"},{"es":"h. 1464 a. C.","en":"c. 1464 BC"},{"es":"1279-1212 a. C.","en":"1279-1212 BC"}],"x":{"es":"En la tabla de marcas reales del Imperio Nuevo cada rey supera al anterior y ninguno falla jamás, y Amenofis II llega a atravesar del todo una diana de cuatro dedos de grosor. Decker y Klauck simularon el disparo con arcos y flechas modernos contra planchas de cobre y las flechas penetraron solo unos milímetros.","en":"In the table of New Kingdom royal records each king outdoes the previous one and none ever fails, and Amenhotep II even pierces right through a target four fingers thick. Decker and Klauck simulated the shot with modern bows and arrows against copper plates, and the arrows penetrated only a few millimetres."},"s":"T2 · línea del tiempo"},{"id":"fec-egi-tutankamon","k":"cro","f":"C","t":2,"q":{"es":"¿Cuándo? «El arco compuesto de Tutankamón»","en":"When? “Tutankhamun's composite bow”"},"o":[{"es":"h. 1330 a. C.","en":"c. 1330 BC"},{"es":"1279-1212 a. C.","en":"1279-1212 BC"},{"es":"h. 1464 a. C.","en":"c. 1464 BC"},{"es":"1479-1425 a. C.","en":"1479-1425 BC"}],"x":{"es":"El arco compuesto se elaboraba con un núcleo de madera reforzado con cuerno y tendones unidos con cola, que podía tardar un año en secar. Era más ligero y manejable en los carros de guerra y lanzaba flechas hasta 300 metros. Uno de ellos, de la tumba de Tutankamón, se conserva en el Museo Egipcio de El Cairo.","en":"The composite bow was made from a wooden core reinforced with horn and sinew joined with glue, which could take a year to dry. It was lighter and easier to handle on war chariots and shot arrows up to 300 metres. One of them, from Tutankhamun's tomb, is kept in the Egyptian Museum in Cairo."},"s":"T2 · línea del tiempo"},{"id":"fec-egi-ramses","k":"cro","f":"C","t":2,"q":{"es":"¿Cuándo? «Los catorce jubileos de Ramsés II»","en":"When? “The fourteen jubilees of Ramesses II”"},"o":[{"es":"1279-1212 a. C.","en":"1279-1212 BC"},{"es":"h. 1330 a. C.","en":"c. 1330 BC"},{"es":"1428-1397 a. C.","en":"1428-1397 BC"},{"es":"h. 1464 a. C.","en":"c. 1464 BC"}],"x":{"es":"El Heb-Sed, la fiesta del jubileo más importante de Egipto, renovaba el poder del faraón a los treinta años de reinado y se repetía cada tres. Ramsés II celebró catorce. El ceremonial incluía la doble coronación, el disparo de flechas hacia los cuatro puntos cardinales y el alzamiento del pilar Djed.","en":"The Heb-Sed, the most important jubilee festival in Egypt, renewed the pharaoh's power after thirty years of reign and was repeated every three years. Ramesses II celebrated fourteen. The ceremony included the double coronation, shooting arrows towards the four cardinal points and raising the Djed pillar."},"s":"T2 · línea del tiempo"},{"id":"fec-egi-taharqa","k":"cro","f":"C","t":2,"q":{"es":"¿Cuándo? «La carrera de fondo de Taharqa»","en":"When? “Taharqa's long-distance run”"},"o":[{"es":"685/684 a. C.","en":"685/684 BC"},{"es":"h. 610-580 a. C.","en":"c. 610-580 BC"},{"es":"721-705 a. C.","en":"721-705 BC"},{"es":"814 a. C. (tradición)","en":"814 BC (tradition)"}],"x":{"es":"La estela del año seis del rey nubio Taharqa describe una prueba de las tropas de élite: unos 50 kilómetros de Menfis al Fayum durante la noche, dos horas de descanso y otros 50 de regreso, cien kilómetros en unas nueve horas. El vencedor y los siguientes recibieron premios y el honor de comer junto a la guardia real.","en":"The stela from the sixth year of the Nubian king Taharqa describes a test for the elite troops: about 50 kilometres from Memphis to the Fayum by night, a two-hour rest and another 50 back, a hundred kilometres in some nine hours. The winner and those who followed received prizes and the honour of dining with the royal guard."},"s":"T2 · línea del tiempo"},{"id":"fec-egi-persas","k":"cro","f":"C","t":2,"q":{"es":"¿Cuándo? «Conquista persa de Egipto»","en":"When? “Persian conquest of Egypt”"},"o":[{"es":"525 a. C.","en":"525 BC"},{"es":"539 a. C.","en":"539 BC"},{"es":"reinado 521-486 a. C.","en":"reign 521-486 BC"},{"es":"h. 610-580 a. C.","en":"c. 610-580 BC"}],"x":{"es":"Egipto pasa a manos persas, y más tarde macedónicas y romanas. El deporte faraónico dependía de dos cosas, el rey como garante del orden del mundo y un Estado capaz de medir sus proezas y grabarlas en piedra, y las dos empiezan a desaparecer.","en":"Egypt passes into Persian hands, and later Macedonian and Roman ones. Pharaonic sport depended on two things, the king as guarantor of the world order and a state able to measure his feats and carve them in stone, and both begin to disappear."},"s":"T2 · línea del tiempo"},{"id":"fec-egi-alejandro","k":"cro","f":"C","t":2,"q":{"es":"¿Cuándo? «Alejandro conquista Egipto»","en":"When? “Alexander conquers Egypt”"},"o":[{"es":"332 a. C.","en":"332 BC"},{"es":"330 a. C.","en":"330 BC"},{"es":"época helenística","en":"Hellenistic period"},{"es":"h. 223 a. C.","en":"c. 223 BC"}],"x":{"es":"Alejandro Magno conquista Egipto en el 332 a. C. y abre la época grecorromana. La cronología egipcia cuenta treinta y una dinastías propias, más dos extranjeras, la macedónica y la ptolemaica.","en":"Alexander the Great conquers Egypt in 332 BC and opens the Graeco-Roman period. Egyptian chronology counts thirty-one native dynasties, plus two foreign ones, the Macedonian and the Ptolemaic."},"s":"T2 · línea del tiempo"},{"id":"fec-egi-roma","k":"cro","f":"C","t":2,"q":{"es":"¿Cuándo? «Egipto, provincia romana»","en":"When? “Egypt becomes a Roman province”"},"o":[{"es":"30 a. C.","en":"30 BC"},{"es":"146 a. C.","en":"146 BC"},{"es":"h. 200 a. C.","en":"c. 200 BC"},{"es":"h. 223 a. C.","en":"c. 223 BC"}],"x":{"es":"Con la pérdida definitiva de la independencia y la conversión de Egipto en provincia romana desaparece la estructura ideológica y religiosa que justificaba las demostraciones físicas del rey. Sobreviven las prácticas que nunca dependieron del palacio: las que nacen del trabajo y del juego duran mucho más que las que el poder inventa.","en":"With the final loss of independence and Egypt's conversion into a Roman province, the ideological and religious structure that justified the king's physical displays disappears. The practices that never depended on the palace survive: those born of work and play last much longer than those invented by power."},"s":"T2 · línea del tiempo"},{"id":"fec-per-ciro","k":"cro","f":"C","t":2,"q":{"es":"¿Cuándo? «Ciro II funda el imperio aqueménida»","en":"When? “Cyrus II founds the Achaemenid Empire”"},"o":[{"es":"550 a. C.","en":"550 BC"},{"es":"h. 610-580 a. C.","en":"c. 610-580 BC"},{"es":"525 a. C.","en":"525 BC"},{"es":"reinado 521-486 a. C.","en":"reign 521-486 BC"}],"x":{"es":"El origen de Persia se fija cuando Ciro II derrota a los medos y funda el imperio aqueménida, que en tres generaciones se extiende del Egeo al Indo. Cuatro pilares lo mantienen unido: la caballería, el arco, la educación y la gestión de la distancia, con satrapías, caminos y postas.","en":"The origin of Persia is placed when Cyrus II defeats the Medes and founds the Achaemenid Empire, which within three generations stretches from the Aegean to the Indus. Four pillars hold it together: cavalry, the bow, education and the management of distance, with satrapies, roads and staging posts."},"s":"T2 · línea del tiempo"},{"id":"fec-per-dario","k":"cro","f":"C","t":2,"q":{"es":"¿Cuándo? «El cuerpo de Darío I, escrito en piedra»","en":"When? “The body of Darius I, written in stone”"},"o":[{"es":"reinado 521-486 a. C.","en":"reign 521-486 BC"},{"es":"480 a. C.","en":"480 BC"},{"es":"525 a. C.","en":"525 BC"},{"es":"539 a. C.","en":"539 BC"}],"x":{"es":"En Naqsh-e Rostam, Darío I mandó grabar en su tumba que su cuerpo es fuerte y está adiestrado, y que es buen jinete, buen arquero y buen lancero, capacidades que el dios persa depositó sobre él. Nunca aparece como luchador, porque un rey no puede permitirse ser derrotado delante de sus súbditos.","en":"At Naqsh-e Rostam, Darius I had it carved on his tomb that his body is strong and trained, and that he is a good horseman, a good archer and a good spearman, abilities placed in him by the Persian god. He never appears as a wrestler, because a king cannot afford to be defeated in front of his subjects."},"s":"T2 · línea del tiempo"},{"id":"fec-per-jerjes","k":"cro","f":"C","t":2,"q":{"es":"¿Cuándo? «Jerjes invade Grecia»","en":"When? “Xerxes invades Greece”"},"o":[{"es":"480 a. C.","en":"480 BC"},{"es":"reinado 521-486 a. C.","en":"reign 521-486 BC"},{"es":"539 a. C.","en":"539 BC"},{"es":"525 a. C.","en":"525 BC"}],"x":{"es":"El imperio de Ciro, Darío y Jerjes, el de Maratón y las Termópilas, es solo la primera de seis etapas, y entre la primera y la última Persia median dos mil quinientos años. Lo común a los seis periodos es estable: el mundo equino, el tiro con arco y la lucha.","en":"The empire of Cyrus, Darius and Xerxes, that of Marathon and Thermopylae, is only the first of six stages, and two and a half thousand years separate the first Persia from the last. What the six periods share is stable: the world of the horse, archery and wrestling."},"s":"T2 · línea del tiempo"},{"id":"fec-per-persepolis","k":"cro","f":"C","t":2,"q":{"es":"¿Cuándo? «Alejandro destruye Persépolis»","en":"When? “Alexander destroys Persepolis”"},"o":[{"es":"330 a. C.","en":"330 BC"},{"es":"332 a. C.","en":"332 BC"},{"es":"época helenística","en":"Hellenistic period"},{"es":"h. 223 a. C.","en":"c. 223 BC"}],"x":{"es":"El imperio aqueménida termina con la destrucción de su capital, Persépolis, por Alejandro Magno. La meseta irania, no obstante, seguirá produciendo deporte durante los veintitrés siglos posteriores, y el deporte persa pertenece en su mayoría a las cinco etapas que vienen después.","en":"The Achaemenid Empire ends with the destruction of its capital, Persepolis, by Alexander the Great. The Iranian plateau, however, will go on producing sport for the next twenty-three centuries, and most Persian sport belongs to the five stages that follow."},"s":"T2 · línea del tiempo"},{"id":"fec-per-sasanidas","k":"cro","f":"C","t":2,"q":{"es":"¿Cuándo? «Comienza la dinastía sasánida»","en":"When? “The Sasanian dynasty begins”"},"o":[{"es":"224 d. C.","en":"AD 224"},{"es":"desde el siglo III","en":"from the 3rd century"},{"es":"h. 213-217 d. C.","en":"c. AD 213-217"},{"es":"30 a. C.","en":"30 BC"}],"x":{"es":"Los sasánidas forman el último imperio persa antes del islam, contemporáneo de Bizancio. Con ellos se consolida el chovgan, el juego a caballo del que deriva el polo moderno.","en":"The Sasanians form the last Persian empire before Islam, contemporary with Byzantium. Under them chovgan, the game on horseback from which modern polo derives, becomes established."},"s":"T2 · línea del tiempo"},{"id":"fec-per-polo","k":"cro","f":"C","t":2,"q":{"es":"¿Cuándo? «El chovgan en la corte sasánida»","en":"When? “Chovgan at the Sasanian court”"},"o":[{"es":"desde el siglo III","en":"from the 3rd century"},{"es":"224 d. C.","en":"AD 224"},{"es":"h. 213-217 d. C.","en":"c. AD 213-217"},{"es":"30 a. C.","en":"30 BC"}],"x":{"es":"El chovgan es el primer deporte colectivo a caballo con pelota y taco, y de él deriva el polo moderno. Se cree que pudo practicarlo la dinastía parta, pero es durante el periodo sasánida cuando se consolida el juego.","en":"Chovgan is the first team sport on horseback with ball and stick, and modern polo derives from it. The Parthian dynasty may have played it, but it is during the Sasanian period that the game becomes established."},"s":"T2 · línea del tiempo"},{"id":"fec-per-arabes","k":"cro","f":"C","t":2,"q":{"es":"¿Cuándo? «Conquista árabe de Persia»","en":"When? “Arab conquest of Persia”"},"o":[{"es":"650 d. C.","en":"AD 650"},{"es":"siglo VII","en":"7th century"},{"es":"224 d. C.","en":"AD 224"},{"es":"h. 213-217 d. C.","en":"c. AD 213-217"}],"x":{"es":"La conquista árabe abre la Persia islámica. Persia conserva su lengua, y es la época de Avicena y de Ferdousí.","en":"The Arab conquest opens Islamic Persia. Persia keeps its language, and this is the age of Avicenna and Ferdowsi."},"s":"T2 · línea del tiempo"},{"id":"fec-per-texto","k":"cro","f":"C","t":2,"q":{"es":"¿Cuándo? «Primer texto sobre el polo»","en":"When? “The first text on polo”"},"o":[{"es":"siglo VII","en":"7th century"},{"es":"650 d. C.","en":"AD 650"},{"es":"desde el siglo III","en":"from the 3rd century"},{"es":"224 d. C.","en":"AD 224"}],"x":{"es":"El reglamento exacto del chovgan se desconoce. Se golpeaba la pelota al galope, agachándose por debajo del cuello del caballo porque el mazo era corto, y había una variante nocturna con pelotas prendidas en fuego.","en":"The exact rules of chovgan are unknown. The ball was struck at the gallop, ducking below the horse's neck because the mallet was short, and there was a night version played with flaming balls."},"s":"T2 · línea del tiempo"},{"id":"fec-per-safavidas","k":"cro","f":"C","t":2,"q":{"es":"¿Cuándo? «Comienza la dinastía safávida»","en":"When? “The Safavid dynasty begins”"},"o":[{"es":"1501 d. C.","en":"AD 1501"},{"es":"1587","en":"1587"},{"es":"1667","en":"1667"},{"es":"finales del siglo XVII","en":"late 17th century"}],"x":{"es":"La etapa safávida y qajar es contemporánea de la Edad Moderna europea y de la Revolución Industrial. A ella pertenece la prueba de los correos reales, el chatir de Isfahán.","en":"The Safavid and Qajar stage is contemporary with the European early modern period and the Industrial Revolution. The test of the royal messengers, the chatir of Isfahan, belongs to it."},"s":"T2 · línea del tiempo"},{"id":"fec-per-shater","k":"cro","f":"C","t":2,"q":{"es":"¿Cuándo? «La carrera del corredor Shater Ali»","en":"When? “The run of Shater Ali”"},"o":[{"es":"1587","en":"1587"},{"es":"1501 d. C.","en":"AD 1501"},{"es":"finales del siglo XVII","en":"late 17th century"},{"es":"1667","en":"1667"}],"x":{"es":"Los shatir eran los mensajeros reales de la corte persa, que transportaban mensajes o corrían delante del caballo del monarca para alertar de posibles peligros. Pertenecer a este cuerpo era un inmenso honor, y para entrar había que superar una prueba de larga distancia.","en":"The shatir were the royal messengers of the Persian court, who carried messages or ran ahead of the monarch's horse to warn of danger. Belonging to this corps was a great honour, and entry required passing a long-distance test."},"s":"T2 · línea del tiempo"},{"id":"fec-per-chardin","k":"cro","f":"C","t":2,"q":{"es":"¿Cuándo? «La prueba del chatir en Isfahán»","en":"When? “The chatir test in Isfahan”"},"o":[{"es":"1667","en":"1667"},{"es":"finales del siglo XVII","en":"late 17th century"},{"es":"1587","en":"1587"},{"es":"1501 d. C.","en":"AD 1501"}],"x":{"es":"El aspirante debía traer a pie doce flechas, una a una, desde un pilar situado a legua y media del palacio de Isfahán, unos 174 kilómetros entre la salida y la puesta del sol. Ese día era fiesta pública, y un comerciante francés que presenció la prueba en 1667 anotó el tiempo del vencedor.","en":"The candidate had to bring back on foot twelve arrows, one by one, from a pillar a league and a half from the palace of Isfahan, some 174 kilometres between sunrise and sunset. The day was a public holiday, and a French merchant who watched the test in 1667 noted the winner's time."},"s":"T2 · línea del tiempo"},{"id":"fec-per-zurkhaneh","k":"cro","f":"C","t":2,"q":{"es":"¿Cuándo? «Primeras noticias del zurkhaneh»","en":"When? “First reports of the zurkhaneh”"},"o":[{"es":"finales del siglo XVII","en":"late 17th century"},{"es":"1667","en":"1667"},{"es":"1501 d. C.","en":"AD 1501"},{"es":"1587","en":"1587"}],"x":{"es":"El zurkhaneh, «la casa de fuerza», es una sala abovedada con un foso central de arcilla blanda y una puerta deliberadamente baja, de manera que la primera lección, la de humildad, se da antes de entrar. Estaba inserto en la vida de los barrios y funcionaba también como instancia de autoridad vecinal.","en":"The zurkhaneh, the “house of strength”, is a domed hall with a sunken central pit of soft clay and a deliberately low door, so that the first lesson, humility, is given before entering. It was embedded in neighbourhood life and also served as a local authority."},"s":"T2 · línea del tiempo"},{"id":"fec-fen-cartago","k":"cro","f":"C","t":2,"q":{"es":"¿Cuándo? «Fundación de Cartago»","en":"When? “Foundation of Carthage”"},"o":[{"es":"814 a. C. (tradición)","en":"814 BC (tradition)"},{"es":"721-705 a. C.","en":"721-705 BC"},{"es":"685/684 a. C.","en":"685/684 BC"},{"es":"h. 610-580 a. C.","en":"c. 610-580 BC"}],"x":{"es":"La expansión fenicia alcanza el norte de África, Malta, Sicilia occidental, Cerdeña, las Baleares y el sur de la península ibérica con factorías y puertos seguros. Entre ellos destaca Cartago, fundada por colonos de Tiro en el actual Túnez, según la tradición en el 814 a. C.","en":"Phoenician expansion reaches North Africa, Malta, western Sicily, Sardinia, the Balearics and the south of the Iberian Peninsula with trading posts and safe harbours. Among them Carthage stands out, founded by settlers from Tyre in present-day Tunisia, according to tradition in 814 BC."},"s":"T2 · línea del tiempo"},{"id":"fec-fen-sargon","k":"cro","f":"C","t":2,"q":{"es":"¿Cuándo? «Las naves de Sargón II»","en":"When? “The ships of Sargon II”"},"o":[{"es":"721-705 a. C.","en":"721-705 BC"},{"es":"685/684 a. C.","en":"685/684 BC"},{"es":"h. 610-580 a. C.","en":"c. 610-580 BC"},{"es":"814 a. C. (tradición)","en":"814 BC (tradition)"}],"x":{"es":"La actividad física fenicia que sí admite documentación es el trabajo. Los relieves del palacio de Sargón II en Dur-Sharrukin muestran pequeñas embarcaciones a remo que remolcan troncos de cedro, con una cabeza de caballo tallada en la proa.","en":"The Phoenician physical activity that can be documented is work. The reliefs of Sargon II's palace at Dur-Sharrukin show small rowing boats towing cedar logs, with a horse's head carved on the prow."},"s":"T2 · línea del tiempo"},{"id":"fec-fen-mazarron","k":"cro","f":"C","t":2,"q":{"es":"¿Cuándo? «El pecio Mazarrón 2»","en":"When? “The Mazarrón 2 shipwreck”"},"o":[{"es":"h. 610-580 a. C.","en":"c. 610-580 BC"},{"es":"539 a. C.","en":"539 BC"},{"es":"550 a. C.","en":"550 BC"},{"es":"480 a. C.","en":"480 BC"}],"x":{"es":"La mejor prueba material de la navegación fenicia está a cuarenta minutos de la facultad. Mazarrón 2 apareció en 1995 con el casco casi entero, mide 8,15 metros y se sacó del agua en 2024, desmontado en veintidós piezas. Hoy se conserva en el Museo Nacional de Arqueología Subacuática, en Cartagena.","en":"The best material evidence of Phoenician seafaring lies forty minutes from the faculty. Mazarrón 2 was found in 1995 with its hull almost complete, is 8.15 metres long and was raised in 2024, dismantled into twenty-two pieces. It is now kept in the National Museum of Underwater Archaeology in Cartagena."},"s":"T2 · línea del tiempo"},{"id":"fec-fen-persas","k":"cro","f":"C","t":2,"q":{"es":"¿Cuándo? «El Levante pasa a Persia»","en":"When? “The Levant passes to Persia”"},"o":[{"es":"539 a. C.","en":"539 BC"},{"es":"525 a. C.","en":"525 BC"},{"es":"reinado 521-486 a. C.","en":"reign 521-486 BC"},{"es":"550 a. C.","en":"550 BC"}],"x":{"es":"Cuando Tiro es sometida, Cartago hereda la red de factorías gracias a su riqueza y a su posición central en la ruta, y pasa a dirigirla por su cuenta. Lo que había nacido como empresa comercial dependiente de Oriente se convierte en una potencia autónoma.","en":"When Tyre is subdued, Carthage inherits the network of trading posts thanks to its wealth and central position on the route, and comes to run it on its own. What had begun as a trading venture dependent on the East becomes an independent power."},"s":"T2 · línea del tiempo"},{"id":"fec-fen-kharayeb","k":"cro","f":"C","t":2,"q":{"es":"¿Cuándo? «Los niños de Kharayeb»","en":"When? “The children of Kharayeb”"},"o":[{"es":"época helenística","en":"Hellenistic period"},{"es":"h. 223 a. C.","en":"c. 223 BC"},{"es":"h. 200 a. C.","en":"c. 200 BC"},{"es":"330 a. C.","en":"330 BC"}],"x":{"es":"El santuario de Kharayeb, en el interior de Tiro, ha dado 16.400 fragmentos de terracota, y las figuras de niños suponen el 35 %. Ordenan una secuencia por edades: de los 2 a los 4 años juegan con pájaros y perros, y de los 12 a los 14 aparecen con estrígil y frasco de aceite, necesarios para entrenar en el gimnasio.","en":"The sanctuary of Kharayeb, inland from Tyre, has yielded 16,400 terracotta fragments, and figures of children make up 35% of them. They set out a sequence by age: from 2 to 4, children play with birds and dogs, and from 12 to 14 they appear with a strigil and an oil flask, needed for training in the gymnasium."},"s":"T2 · línea del tiempo"},{"id":"fec-fen-cartagena","k":"cro","f":"C","t":2,"q":{"es":"¿Cuándo? «Fundación de Cartagena»","en":"When? “Foundation of Cartagena”"},"o":[{"es":"h. 223 a. C.","en":"c. 223 BC"},{"es":"época helenística","en":"Hellenistic period"},{"es":"h. 200 a. C.","en":"c. 200 BC"},{"es":"146 a. C.","en":"146 BC"}],"x":{"es":"Cartago significa en fenicio «ciudad nueva», Qart-ḥadašt. Seiscientos años después, Asdrúbal el Bello estableció en la actual Cartagena una segunda Qart-ḥadašt, que los romanos tradujeron por Carthago Nova.","en":"Carthage means “new city” in Phoenician, Qart-ḥadašt. Six hundred years later, Hasdrubal the Fair founded a second Qart-ḥadašt in present-day Cartagena, which the Romans translated as Carthago Nova."},"s":"T2 · línea del tiempo"},{"id":"fec-fen-diotimo","k":"cro","f":"C","t":2,"q":{"es":"¿Cuándo? «Diótimo de Sidón vence en Nemea»","en":"When? “Diotimus of Sidon wins at Nemea”"},"o":[{"es":"h. 200 a. C.","en":"c. 200 BC"},{"es":"h. 223 a. C.","en":"c. 223 BC"},{"es":"época helenística","en":"Hellenistic period"},{"es":"146 a. C.","en":"146 BC"}],"x":{"es":"Las ciudades fenicias carecieron de un Estado que grabara proezas, de un rey que exhibiera su cuerpo y de un santuario común donde inscribir vencedores, de modo que lo que falta es un tipo de fuente. En la etapa final, con la influencia helena, los registros griegos recogen a fenicios vencedores en sus juegos.","en":"The Phoenician cities lacked a state that carved feats in stone, a king who displayed his body and a common sanctuary where victors were inscribed, so what is missing is a type of source. In the final stage, under Greek influence, Greek records list Phoenician victors in their games."},"s":"T2 · línea del tiempo"},{"id":"fec-fen-destruccion","k":"cro","f":"C","t":2,"q":{"es":"¿Cuándo? «Roma destruye Cartago»","en":"When? “Rome destroys Carthage”"},"o":[{"es":"146 a. C.","en":"146 BC"},{"es":"h. 200 a. C.","en":"c. 200 BC"},{"es":"h. 223 a. C.","en":"c. 223 BC"},{"es":"época helenística","en":"Hellenistic period"}],"x":{"es":"Roma destruye Cartago y pone fin a la potencia autónoma que, a la postre, le había disputado el dominio del Mediterráneo occidental.","en":"Rome destroys Carthage and puts an end to the independent power that had ultimately contested its control of the western Mediterranean."},"s":"T2 · línea del tiempo"},{"id":"fec-fen-helix","k":"cro","f":"C","t":2,"q":{"es":"¿Cuándo? «Aurelio Hélix en Olimpia»","en":"When? “Aurelius Helix at Olympia”"},"o":[{"es":"h. 213-217 d. C.","en":"c. AD 213-217"},{"es":"desde el siglo III","en":"from the 3rd century"},{"es":"224 d. C.","en":"AD 224"},{"es":"30 a. C.","en":"30 BC"}],"x":{"es":"Aurelio Hélix, «el fenicio», vence en Olimpia a comienzos del siglo III d. C. La presencia de atletas fenicios en unos juegos ajenos resulta muy interesante para analizar el deporte griego, el contenido del próximo tema.","en":"Aurelius Helix, “the Phoenician”, wins at Olympia in the early third century AD. The presence of Phoenician athletes at someone else's games is very revealing for the study of Greek sport, the subject of the next unit."},"s":"T2 · línea del tiempo"},{"id":"fec-ege-clase","k":"cro","f":"C","t":3,"q":{"es":"¿Cuándo? «Surge una nueva clase dirigente en Creta»","en":"When? “A new ruling class emerges in Crete”"},"o":[{"es":"h. 1950 a. C.","en":"c. 1950 BC"},{"es":"h. 1750-1450 a. C.","en":"c. 1750-1450 BC"},{"es":"h. 1550-1500 a. C.","en":"c. 1550-1500 BC"},{"es":"h. 1628 a. C.","en":"c. 1628 BC"}],"x":{"es":"Se reconoce en el paso de los enterramientos colectivos a los individuales, y con ella aparece un grupo estable de sacerdotes. Los palacios fueron residencia, almacén y centro religioso, puesto que Creta no levantó templos monumentales.","en":"It can be recognised in the shift from collective to individual burials, and with it a stable group of priests appears. The palaces were residence, storehouse and religious centre, since Crete built no monumental temples."},"s":"T3 · línea del tiempo"},{"id":"fec-ege-salto","k":"cro","f":"C","t":3,"q":{"es":"¿Cuándo? «Época de los grandes palacios: la taurocatapsia»","en":"When? “Age of the great palaces: bull-leaping”"},"o":[{"es":"h. 1750-1450 a. C.","en":"c. 1750-1450 BC"},{"es":"h. 1550-1500 a. C.","en":"c. 1550-1500 BC"},{"es":"h. 1628 a. C.","en":"c. 1628 BC"},{"es":"h. 1600 a. C.","en":"c. 1600 BC"}],"x":{"es":"El salto sobre un toro vivo y a la carrera se practicó sobre todo en torno al palacio de Cnoso, en fiestas que reunían a la comunidad. Con los palacios adquirió su grandeza escénica y ritual, y se convirtió en emblema del poder de Cnoso.","en":"The leap over a live, charging bull was practised above all around the palace of Knossos, at festivals that gathered the community. With the palaces it acquired its scenic and ritual grandeur and became the emblem of Knossos's power."},"s":"T3 · línea del tiempo"},{"id":"fec-ege-danza","k":"cro","f":"C","t":3,"q":{"es":"¿Cuándo? «Danza en la arboleda sagrada»","en":"When? “Dance in the sacred grove”"},"o":[{"es":"h. 1600 a. C.","en":"c. 1600 BC"},{"es":"finales del siglo XVII a. C.","en":"late 17th century BC"},{"es":"h. 1550-1500 a. C.","en":"c. 1550-1500 BC"},{"es":"h. 1628 a. C.","en":"c. 1628 BC"}],"x":{"es":"En el fresco de Cnoso las mujeres bailan ante una multitud, en un acto que los estudios vinculan al culto a la naturaleza, concebida como divinidad femenina, y a los ritos de iniciación.","en":"In the Knossos fresco women dance before a crowd, in an act that scholars link to the worship of nature, conceived as a female deity, and to initiation rites."},"s":"T3 · línea del tiempo"},{"id":"fec-ege-tera","k":"cro","f":"C","t":3,"q":{"es":"¿Cuándo? «Erupción del volc
