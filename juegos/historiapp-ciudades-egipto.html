do de la corte", "en": "A salary from the court"}, {"es": "De enseñar a los hijos de la nobleza en la escuela del Estado", "en": "Teaching the sons of the nobility in the State school"}], "explain": {"es": "El pahlavan vive de pelear en público, de exhibirse y obtener algún dinero y de proteger a quien lo contrata.", "en": "The pahlavan lives on fighting in public, displaying himself to earn some money, and protecting whoever hires him."}, "id": "t2q207"}, {"slide": 62, "tags": ["persia", "lucha", "zurkhaneh"], "q": {"es": "¿Dónde se celebraban habitualmente los combates de los pahlavans?", "en": "Where were pahlavan bouts usually held?"}, "o": [{"es": "En fiestas y plazas, entre barrios rivales", "en": "At festivals and squares, between rival quarters"}, {"es": "En la corte, ante el rey y los embajadores extranjeros", "en": "At court, before the king and foreign ambassadors"}, {"es": "En los paradeisos", "en": "In the paradeisos"}], "explain": {"es": "Los combates se celebraban en fiestas y plazas, muchas veces entre barrios rivales de la misma ciudad.", "en": "Bouts were held at festivals and in squares, often between rival quarters of the same city."}, "id": "t2q208"}, {"slide": 62, "tags": ["persia", "lucha"], "q": {"es": "¿Cuál de estos valores formaba parte del código del gremio de los pahlavans?", "en": "Which of these values was part of the pahlavan guild's code?"}, "o": [{"es": "La protección del débil", "en": "Protection of the weak"}, {"es": "La obediencia ciega al sátrapa de la provincia", "en": "Blind obedience to the provincial satrap"}, {"es": "La victoria a cualquier precio", "en": "Victory at any price"}], "explain": {"es": "El gremio impone un código de lealtad, honestidad, humildad y protección del débil.", "en": "The guild imposed a code: loyalty, honesty, humility and protection of the weak."}, "id": "t2q209"}, {"slide": 62, "tags": ["persia", "lucha"], "q": {"es": "¿En qué acabó pervirtiéndose el oficio de pahlavan?", "en": "How did the pahlavan trade become corrupted?"}, "o": [{"es": "En pequeña delincuencia y matonería", "en": "Into petty crime and thuggery"}, {"es": "En espectáculos de pago controlados por los califas de Medina", "en": "Into paid shows controlled by the caliphs of Medina"}, {"es": "En un cuerpo de policía", "en": "Into a police force"}], "explain": {"es": "Muchos pahlavans acabaron viviendo de la pequeña delincuencia y de la matonería, al servicio de los ciudadanos pudientes.", "en": "Many pahlavans ended up living off petty crime and thuggery, in the service of wealthier citizens."}, "id": "t2q210"}, {"slide": 62, "tags": ["persia", "educacion"], "q": {"es": "Tras la caída de la corte sasánida, ¿a qué espacio se vincula la nueva educación corporal?", "en": "After the fall of the Sasanian court, which space is the new bodily education tied to?"}, "o": [{"es": "A la ciudad y las calles del bazar", "en": "The city and the bazaar streets"}, {"es": "A las mezquitas", "en": "The mosques"}, {"es": "Al ejército del califa y a sus campamentos", "en": "The caliph's army and its military camps"}], "explain": {"es": "Con la corte desaparece el cuerpo entrenado en la nobleza y surge una educación corporal más vinculada a la ciudad y a las calles del bazar.", "en": "With the court disappears the body trained within the nobility, and a bodily education tied to the city and the bazaar streets emerges."}, "id": "t2q211"}, {"slide": 63, "tags": ["persia", "zurkhaneh"], "q": {"es": "¿Qué significa zurkhaneh?", "en": "What does zurkhaneh mean?"}, "o": [{"es": "La casa de fuerza", "en": "The house of strength"}, {"es": "El lugar de educación", "en": "The place of education"}, {"es": "El campeón", "en": "The champion"}], "explain": {"es": "El zurkhaneh, «la casa de fuerza», es una sala abovedada con un foso central hundido de arcilla blanda.", "en": "The zurkhaneh, «the house of strength», is a vaulted hall with a sunken central pit of soft clay."}, "id": "t2q212"}, {"slide": 63, "tags": ["persia", "zurkhaneh"], "q": {"es": "¿Por qué la puerta del zurkhaneh es deliberadamente baja?", "en": "Why is the zurkhaneh door deliberately low?"}, "o": [{"es": "Para dar una lección de humildad", "en": "To teach a lesson in humility"}, {"es": "Para impedir la entrada de los invasores mongoles", "en": "To keep out the Mongol invaders"}, {"es": "Para conservar el calor", "en": "To keep the heat in"}], "explain": {"es": "La puerta es baja para que quien pasa tenga que agacharse; la primera lección es la de humildad y se da antes de entrar.", "en": "The door is low so that whoever passes has to stoop; the first lesson is one of humility, given before entering."}, "id": "t2q213"}, {"slide": 63, "tags": ["persia", "zurkhaneh"], "q": {"es": "¿Qué dice la diapositiva sobre el supuesto carácter secreto del zurkhaneh?", "en": "What does the slide say about the supposedly secret nature of the zurkhaneh?"}, "o": [{"es": "Es una leyenda; nunca fue secreto", "en": "It is a legend; it was never secret"}, {"es": "Que fue un centro clandestino de resistencia contra árabes y mongoles", "en": "That it was a clandestine centre of resistance against Arabs and Mongols"}, {"es": "Que solo lo fue en época mongola", "en": "That it was only secret in the Mongol era"}], "explain": {"es": "Los rasgos del edificio forjaron la leyenda de un trasfondo clandestino, pero nunca se trató de un recinto secreto.", "en": "The building's features forged the legend of a clandestine background, but it was never a secret precinct."}, "id": "t2q214"}, {"slide": 63, "tags": ["persia", "zurkhaneh", "politica"], "q": {"es": "¿Qué función social cumplía el zurkhaneh en los barrios urbanos?", "en": "What social role did the zurkhaneh play in urban quarters?"}, "o": [{"es": "Instancia de autoridad vecinal", "en": "A neighbourhood authority"}, {"es": "Escuela religiosa para los hijos de la nobleza de la corte", "en": "A religious school for the sons of court nobility"}, {"es": "Mercado de caballos", "en": "A horse market"}], "explain": {"es": "Los zurkhaneh mantenían el orden a través de sus hombres fuertes, de modo que la sala funcionaba también como instancia de autoridad vecinal.", "en": "The zurkhaneh kept order through their strongmen, so the hall also functioned as an instance of neighbourhood authority."}, "id": "t2q215"}, {"slide": 64, "tags": ["persia", "zurkhaneh"], "q": {"es": "¿Quién dirige la sesión del zurkhaneh desde el centro del foso?", "en": "Who leads the zurkhaneh session from the centre of the pit?"}, "o": [{"es": "El atleta más consumado de la casa", "en": "The house's most accomplished athlete"}, {"es": "Un instructor enviado por el Estado", "en": "An instructor sent by the State"}, {"es": "El jefe del gremio, llegado desde la corte real", "en": "The guild chief, come from the royal court"}], "explain": {"es": "Los hombres se ejercitan dirigidos desde el centro del foso por el atleta más consumado de cada casa, al compás de la música en directo.", "en": "The men exercise led from the centre of the pit by the most accomplished athlete of each house, to live music."}, "id": "t2q216"}, {"slide": 64, "tags": ["persia", "zurkhaneh"], "q": {"es": "¿Qué es el kabbadeh?", "en": "What is the kabbadeh?"}, "o": [{"es": "Un arco de hierro con anillas", "en": "An iron bow with rings"}, {"es": "Un tablón pesado de madera para levantar tumbado", "en": "A heavy wooden board lifted lying down"}, {"es": "Una maza", "en": "A club"}], "explain": {"es": "Uno de los ejercicios es el balanceo sobre la cabeza de un arco de hierro (kabbadeh) con anillas ensartadas en la cadena.", "en": "One exercise is swinging above the head an iron bow (kabbadeh) with rings threaded on its chain."}, "id": "t2q217"}, {"slide": 64, "tags": ["persia", "zurkhaneh", "lucha"], "q": {"es": "¿Hasta cuándo fue la lucha el acto culminante de la sesión del zurkhaneh?", "en": "Until when was wrestling the culminating act of the zurkhaneh session?"}, "o": [{"es": "Hasta los años cuarenta del siglo XX", "en": "Until the 1940s"}, {"es": "Hasta la conquista árabe", "en": "Until the Arab conquest"}, {"es": "Hasta la llegada de los safávidas al poder", "en": "Until the Safavids came to power"}], "explain": {"es": "La lucha fue el acto culminante de la sesión hasta los años cuarenta del siglo XX.", "en": "Wrestling was the culminating act of the session until the 1940s."}, "id": "t2q218"}, {"slide": 64, "tags": ["persia", "zurkhaneh", "lucha"], "q": {"es": "¿Por qué la lucha del zurkhaneh se hacía en parejas y aparte?", "en": "Why was zurkhaneh wrestling done in pairs and apart?"}, "o": [{"es": "Para evitar la vergüenza de perder ante los compañeros", "en": "To avoid the shame of losing before companions"}, {"es": "Porque el foso era demasiado pequeño para todos", "en": "Because the pit was too small for everyone"}, {"es": "Porque así lo exigía el código del gremio de los pahlavans", "en": "Because the code of the pahlavan guild required it"}], "explain": {"es": "La lucha se realizaba en parejas, aparte, para evitar la vergüenza de ser derrotado ante los compañeros.", "en": "Wrestling took place in pairs, apart, to avoid the shame of being defeated in front of one's companions."}, "id": "t2q219"}, {"slide": 65, "tags": ["persia"], "q": {"es": "¿Qué consecuencia tuvo la conquista árabe del 651 para el cuerpo como símbolo de excelencia?", "en": "What consequence did the Arab conquest of 651 have for the body as a symbol of excellence?"}, "o": [{"es": "Se muda a la ciudad", "en": "It moves to the city"}, {"es": "Desaparece por completo de la cultura persa", "en": "It disappears entirely from Persian culture"}, {"es": "Pasa al clero", "en": "It passes to the clergy"}], "explain": {"es": "La conquista árabe del 651 acaba con la corte, y el cuerpo como símbolo de excelencia se muda a la ciudad.", "en": "The Arab conquest of 651 ends the court, and the body as a symbol of excellence moves to the city."}, "id": "t2q220"}, {"slide": 67, "tags": ["persia", "carrera", "educacion"], "q": {"es": "Según Estrabón, ¿en grupos de cuántos jóvenes se organizaban las carreras de los aqueménidas?", "en": "According to Strabo, in groups of how many youths were Achaemenid races organised?"}, "o": [{"es": "Cincuenta", "en": "Fifty"}, {"es": "Diez", "en": "Ten"}, {"es": "Doscientos", "en": "Two hundred"}], "explain": {"es": "Estrabón cuenta que los instructores dividían a los jóvenes en grupos de cincuenta.", "en": "Strabo relates that instructors divided the young into groups of fifty."}, "id": "t2q221"}, {"slide": 67, "tags": ["persia", "carrera"], "q": {"es": "¿Qué distancia recorrían en carrera los jóvenes persas según Estrabón?", "en": "What distance did young Persians run according to Strabo?"}, "o": [{"es": "Entre cinco y siete kilómetros", "en": "Between five and seven kilometres"}, {"es": "Unos ciento setenta y cuatro kilómetros", "en": "About one hundred and seventy-four kilometres"}, {"es": "Un estadio", "en": "One stadion"}], "explain": {"es": "Los jóvenes seguían una carrera de entre treinta y cuarenta estadios griegos, entre cinco y siete kilómetros.", "en": "The young ran between thirty and forty Greek stadia, between five and seven kilometres."}, "id": "t2q222"}, {"slide": 67, "tags": ["persia", "carrera", "politica"], "q": {"es": "¿Por qué se deduce que el rey asistía a las carreras de los jóvenes aqueménidas?", "en": "Why is it inferred that the king attended the races of Achaemenid youths?"}, "o": [{"es": "Porque ofrecía premios al vencedor", "en": "Because he offered prizes to the winner"}, {"es": "Porque lo muestran los relieves del friso de los arqueros de Susa", "en": "Because the reliefs of the Frieze of the Archers at Susa show him"}, {"es": "Porque corría con ellos", "en": "Because he ran with them"}], "explain": {"es": "El rey debería estar presente puesto que Estrabón indica que el monarca ofrecía premios al vencedor.", "en": "The king must have been present, since Strabo indicates that the monarch offered prizes to the winner."}, "id": "t2q223"}, {"slide": 67, "tags": ["persia", "carrera", "ejercito"], "q": {"es": "¿En qué marco quedan encuadradas las carreras aqueménidas?", "en": "Within what framework do Achaemenid races fall?"}, "o": [{"es": "La formación militar", "en": "Military training"}, {"es": "Un calendario fijo de festivales religiosos", "en": "A fixed calendar of religious festivals"}, {"es": "El culto funerario", "en": "Funerary cult"}], "explain": {"es": "Las carreras parecen quedar encuadradas dentro de la formación militar y no siguen un calendario fijo.", "en": "Races seem to fall within military training and follow no fixed calendar."}, "id": "t2q224"}, {"slide": 68, "tags": ["persia", "carrera"], "q": {"es": "¿Qué eran los shatir de la corte persa?", "en": "What were the shatir of the Persian court?"}, "o": [{"es": "Mensajeros reales", "en": "Royal messengers"}, {"es": "Luchadores profesionales del bazar", "en": "Professional wrestlers of the bazaar"}, {"es": "Guardias de palacio", "en": "Palace guards"}], "explain": {"es": "Los shatir eran los mensajeros reales o correos de la corte persa, que llevaban mensajes o corrían delante del caballo del monarca.", "en": "The shatir were the royal messengers or couriers of the Persian court, who carried messages or ran ahead of the monarch's horse."}, "id": "t2q225"}, {"slide": 68, "tags": ["persia", "carrera"], "q": {"es": "¿En qué consistía la prueba del chatir?", "en": "What did the chatir test consist of?"}, "o": [{"es": "Traer a pie doce flechas, una a una", "en": "Bringing back twelve arrows on foot, one by one"}, {"es": "Disparar doce flechas a caballo al galope contra una diana", "en": "Shooting twelve arrows at the gallop at a target"}, {"es": "Cruzar un río", "en": "Crossing a river"}], "explain": {"es": "La prueba consistía en traer a pie doce flechas, una a una, desde un pilar situado a legua y media de la puerta del palacio de Isfahán.", "en": "The test consisted of bringing back on foot twelve arrows, one at a time, from a pillar a league and a half from the gate of the palace of Isfahan."}, "id": "t2q226"}, {"slide": 68, "tags": ["persia", "carrera"], "q": {"es": "¿Qué distancia total suponía la prueba del chatir?", "en": "What total distance did the chatir test involve?"}, "o": [{"es": "Unos 174 kilómetros", "en": "About 174 kilometres"}, {"es": "Unos 42 kilómetros", "en": "About 42 kilometres"}, {"es": "Entre cinco y siete kilómetros", "en": "Between five and seven kilometres"}], "explain": {"es": "Doce idas y doce vueltas sumaban treinta y seis leguas, unos ciento setenta y cuatro kilómetros.", "en": "Twelve outward and twelve return trips added up to thirty-six leagues, some one hundred and seventy-four kilometres."}, "id": "t2q227"}, {"slide": 68, "tags": ["persia", "carrera", "espectaculo"], "q": {"es": "¿Qué se hacía el día de la prueba del chatir para que los ciudadanos asistieran?", "en": "What was done on the day of the chatir test so that citizens could attend?"}, "o": [{"es": "Se declaraba fiesta pública", "en": "A public holiday was declared"}, {"es": "Se repartía dinero entre los asistentes del bazar", "en": "Money was handed out to those attending from the bazaar"}, {"es": "Se cerraba el palacio", "en": "The palace was closed"}], "explain": {"es": "Ese día se declaraba fiesta pública para que todos pudieran asistir y animar a los participantes.", "en": "That day was declared a public holiday so that everyone could attend and cheer the participants."}, "id": "t2q228"}, {"slide": 68, "tags": ["persia", "carrera"], "q": {"es": "¿Cuánto tardó el vencedor de 1667 en completar el chatir, según un comerciante francés?", "en": "How long did the 1667 winner take to complete the chatir, according to a French merchant?"}, "o": [{"es": "Catorce horas", "en": "Fourteen hours"}, {"es": "Doce horas", "en": "Twelve hours"}, {"es": "Veinticuatro horas", "en": "Twenty-four hours"}], "explain": {"es": "Según un comerciante francés que lo presenció en 1667, el vencedor tardó catorce horas, a un ritmo de 4:50 min/km.", "en": "According to a French merchant who witnessed it in 1667, the winner took fourteen hours, at a pace of 4:50 min/km."}, "id": "t2q229"}, {"slide": 69, "tags": ["persia", "nobleza"], "q": {"es": "¿Por qué las prácticas hípicas persas quedaban restringidas a la aristocracia?", "en": "Why were Persian equestrian practices restricted to the aristocracy?"}, "o": [{"es": "Por el coste de mantener un caballo", "en": "Because of the cost of keeping a horse"}, {"es": "Porque una ley prohibía montar a los campesinos y artesanos", "en": "Because a law forbade peasants and craftsmen to ride"}, {"es": "Por motivos religiosos", "en": "For religious reasons"}], "explain": {"es": "Un caballo requiere cría, forraje, cuadra, adiestramiento y personal, y ese coste restringe la práctica a quienes pueden asumirlo.", "en": "A horse requires breeding, fodder, stabling, training and staff, and that upkeep restricts the practice to those who can afford it."}, "id": "t2q230"}, {"slide": 69, "tags": ["persia", "polo", "nobleza"], "q": {"es": "Según la diapositiva, ¿para qué juega el cortesano al chovgan?", "en": "According to the slide, why does the courtier play chovgan?"}, "o": [{"es": "Para hacerse ver por el rey", "en": "To be seen by the king"}, {"es": "Para demostrar su autoridad como jefe local", "en": "To show his authority as a local chief"}, {"es": "Para ganar dinero", "en": "To earn money"}], "explain": {"es": "El chovgan lo juega el cortesano para hacerse ver por el rey.", "en": "Chovgan is played by the courtier to be seen by the king."}, "id": "t2q231"}, {"slide": 69, "tags": ["persia", "ejercito"], "q": {"es": "¿Qué práctica persa usa el ejército para adiestrar a su caballería?", "en": "Which Persian practice does the army use to train its cavalry?"}, "o": [{"es": "El jereed", "en": "Jereed"}, {"es": "El buzkashi", "en": "Buzkashi"}, {"es": "El chatir", "en": "The chatir"}], "explain": {"es": "El jereed lo practica el ejército para adiestrar a su caballería.", "en": "Jereed is practised by the army to train its cavalry."}, "id": "t2q232"}, {"slide": 69, "tags": ["persia", "politica"], "q": {"es": "¿Qué busca el jefe local que paga una partida de buzkashi, según esta diapositiva?", "en": "According to this slide, what does the local chief who pays for a buzkashi match seek?"}, "o": [{"es": "Demostrar su autoridad", "en": "To show his authority"}, {"es": "Entrenar a sus jinetes para la guerra contra las tribus vecinas", "en": "To train his riders for war with neighbouring tribes"}, {"es": "Agradar al rey", "en": "To please the king"}], "explain": {"es": "El buzkashi lo paga el jefe local para demostrar que tiene la autoridad suficiente para organizar un evento.", "en": "Buzkashi is paid for by the local chief to show that he has enough authority to organise an event."}, "id": "t2q233"}, {"slide": 70, "tags": ["persia", "polo"], "q": {"es": "¿Qué deporte moderno deriva del chovgan?", "en": "Which modern sport derives from chovgan?"}, "o": [{"es": "El polo", "en": "Polo"}, {"es": "El hockey", "en": "Hockey"}, {"es": "El críquet", "en": "Cricket"}], "explain": {"es": "El chovgan es el primer deporte colectivo a caballo con pelota y taco, del cual deriva el polo moderno.", "en": "Chovgan is the first team sport on horseback with ball and mallet, from which modern polo derives."}, "id": "t2q234"}, {"slide": 70, "tags": ["persia", "polo"], "q": {"es": "¿Desde qué periodo se consolida el juego del chovgan?", "en": "From which period does the game of chovgan become established?"}, "o": [{"es": "Sasánida", "en": "Sasanian"}, {"es": "Aqueménida", "en": "Achaemenid"}, {"es": "Safávida", "en": "Safavid"}], "explain": {"es": "Se cree que pudo jugarse con los partos, pero es durante el periodo sasánida en adelante cuando se consolida.", "en": "It may have been played under the Parthians, but it is from the Sasanian period onwards that it becomes established."}, "id": "t2q235"}, {"slide": 70, "tags": ["persia", "polo"], "q": {"es": "¿Por qué el jinete de chovgan debía agacharse por debajo del cuello del caballo?", "en": "Why did the chovgan rider have to stoop below the horse's neck?"}, "o": [{"es": "Porque el mazo era corto", "en": "Because the mallet was short"}, {"es": "Para esquivar las pelotas encendidas del juego nocturno", "en": "To dodge the burning balls of the night game"}, {"es": "Por norma del juego", "en": "Because of a rule"}], "explain": {"es": "La mecánica consistía en golpear la pelota al galope agachándose por debajo del cuello del equino porque el mazo era de dimensiones cortas.", "en": "The mechanics consisted of striking the ball at the gallop, stooping below the horse's neck because the mallet was short."}, "id": "t2q236"}, {"slide": 70, "tags": ["persia", "polo"], "q": {"es": "¿Cómo se lograban tantos en el chovgan?", "en": "How were points scored in chovgan?"}, "o": [{"es": "Pasando la pelota entre dos pilares", "en": "Driving the ball between two pillars"}, {"es": "Derribando al jinete rival con el mazo", "en": "Knocking the rival rider down with the mallet"}, {"es": "Llevando la pelota a mano", "en": "Carrying the ball by hand"}], "explain": {"es": "El juego consistía en lograr tantos atravesando la pelota entre dos pilares de madera o piedra.", "en": "The aim was to score by driving the ball between two wooden or stone pillars."}, "id": "t2q237"}, {"slide": 70, "tags": ["persia", "polo"], "q": {"es": "¿Por qué se sospecha que las normas del chovgan podían ajustarse según el momento?", "en": "Why is it suspected that chovgan rules could be adjusted to the moment?"}, "o": [{"es": "Porque se desconoce el reglamento exacto", "en": "Because the exact rules are unknown"}, {"es": "Porque cada rey publicaba un reglamento propio al subir al trono", "en": "Because each king issued his own rules on taking the throne"}, {"es": "Porque no había árbitro", "en": "Because there was no referee"}], "explain": {"es": "Se desconoce el reglamento exacto, por lo que se sospecha que las normas podían ajustarse; hay partidos de cinco jinetes por bando en el siglo XVI y de quince a veinte en el XVII.", "en": "The exact rules are unknown, so it is suspected they could be adjusted; there are matches of five a side in the 16th century and fifteen to twenty in the 17th."}, "id": "t2q238"}, {"slide": 71, "tags": ["persia", "polo", "ejercito"], "q": {"es": "¿Cuál era la finalidad del chovgan según la diapositiva?", "en": "What was the purpose of chovgan according to the slide?"}, "o": [{"es": "Servir como entrenamiento bélico", "en": "To serve as military training"}, {"es": "Entretener a las mujeres de la corte durante las fiestas", "en": "To entertain the women of the court during festivals"}, {"es": "Honrar a los muertos", "en": "To honour the dead"}], "explain": {"es": "La finalidad del chovgan era servir como entrenamiento bélico para adiestrar la agilidad, la destreza y la toma rápida de decisiones.", "en": "The purpose of chovgan was to serve as military training to develop agility, skill and quick decision-making."}, "id": "t2q239"}, {"slide": 71, "tags": ["persia", "polo", "ejercito"], "q": {"es": "¿Qué pretendía replicar el chovgan?", "en": "What did chovgan aim to replicate?"}, "o": [{"es": "Las condiciones cambiantes de una batalla", "en": "The changing conditions of a battle"}, {"es": "Una cacería de leones dentro del paradeisos real", "en": "A lion hunt inside the royal paradeisos"}, {"es": "Una carrera de postas", "en": "A relay race"}], "explain": {"es": "La intención era replicar las condiciones cambiantes de un campo de batalla para que los jinetes controlaran sus monturas.", "en": "The intention was to replicate the changing conditions of a battlefield so riders could control their mounts."}, "id": "t2q240"}, {"slide": 71, "tags": ["persia", "polo", "politica"], "q": {"es": "¿Qué rey mandó construir en Isfahán la plaza Naqsh-e Jahán como plaza mayor y campo de juego?", "en": "Which king had the Naqsh-e Jahan square built in Isfahan as main square and playing field?"}, "o": [{"es": "Abbás I", "en": "Abbas I"}, {"es": "Cosroes II", "en": "Khosrow II"}, {"es": "Darío I", "en": "Darius I"}], "explain": {"es": "En 1598 el rey Abbás I mandó construir en Isfahán la plaza Naqsh-e Jahán, con un balcón en palacio para ver los partidos.", "en": "In 1598 King Abbas I had the Naqsh-e Jahan square built in Isfahan, with a palace balcony to watch the matches."}, "id": "t2q241"}, {"slide": 71, "tags": ["persia", "polo"], "q": {"es": "¿Qué recomendaban diversos tratados para jugar al chovgan?", "en": "What did various treatises recommend when playing chovgan?"}, "o": [{"es": "Jugar con prudencia para evitar colisiones", "en": "Playing with prudence to avoid collisions"}, {"es": "Jugar solo de noche con pelotas encendidas cerca de acantilados", "en": "Playing only at night with burning balls near cliffs"}, {"es": "Jugar a pie", "en": "Playing on foot"}], "explain": {"es": "Para evitar daños en caballos o jinetes, diversos tratados recomendaban jugarlo con prudencia para evitar colisiones fatales.", "en": "To avoid harm to horses or riders, various treatises recommended playing with prudence to avoid fatal collisions."}, "id": "t2q242"}, {"slide": 72, "tags": ["persia", "ejercito"], "q": {"es": "¿Qué es el jereed?", "en": "What is jereed?"}, "o": [{"es": "Un deporte de jabalina a caballo", "en": "A sport of javelin on horseback"}, {"es": "Un juego de pelota a caballo con mazos de madera", "en": "A ball game on horseback with wooden mallets"}, {"es": "Una carrera a pie", "en": "A foot race"}], "explain": {"es": "El jereed es un deporte de jabalina a caballo diseñado para entrenar el ataque y la huida en la guerra.", "en": "Jereed is a sport of javelin on horseback designed to train attack and flight in war."}, "id": "t2q243"}, {"slide": 72, "tags": ["persia", "ejercito"], "q": {"es": "¿Desde cuándo se desarrolla el jereed?", "en": "From when does jereed develop?"}, "o": [{"es": "Desde el siglo XI", "en": "From the 11th century"}, {"es": "Desde el siglo V d. C.", "en": "From the 5th century AD"}, {"es": "Desde 1598", "en": "From 1598"}], "explain": {"es": "Desde el siglo XI en adelante se desarrolló otro deporte hípico de naturaleza militar, el jereed.", "en": "From the 11th century onwards another equestrian sport of a military nature developed, jereed."}, "id": "t2q244"}, {"slide": 72, "tags": ["persia"], "q": {"es": "En el jereed, ¿qué acción resta puntos?", "en": "In jereed, which action loses points?"}, "o": [{"es": "Golpear al caballo", "en": "Hitting the horse"}, {"es": "Coger al vuelo una jabalina del rival que lo persigue", "en": "Catching in the air a javelin of the chasing rival"}, {"es": "Volver a su posición", "en": "Returning to one's position"}], "explain": {"es": "Golpear al caballo, caer o lanzar desde una zona prohibida restan puntos; coger una lanza en el aire o regresar sin ser interceptado los suma.", "en": "Hitting the horse, falling or throwing from a forbidden zone lose points; catching a javelin in the air or returning uninterrupted scores."}, "id": "t2q245"}, {"slide": 72, "tags": ["persia"], "q": {"es": "¿Con qué nombre se practica hoy el jereed en Turquía?", "en": "Under what name is jereed practised today in Turkey?"}, "o": [{"es": "Cirit", "en": "Cirit"}, {"es": "Chovgan", "en": "Chovgan"}, {"es": "Buzkashi", "en": "Buzkashi"}], "explain": {"es": "Hoy se practica sobre todo en Turquía bajo el nombre de cirit, con unos cincuenta clubes en nueve provincias.", "en": "Today it is practised above all in Turkey under the name cirit, with some fifty clubs in nine provinces."}, "id": "t2q246"}, {"slide": 72, "tags": ["persia", "ejercito"], "q": {"es": "¿Cómo eran las jabalinas que se lanzaban durante la persecución en el jereed?", "en": "What were the javelins thrown during the chase in jereed like?"}, "o": [{"es": "De madera y sin punta", "en": "Wooden and blunt"}, {"es": "De hierro con punta afilada", "en": "Iron with a sharp point"}, {"es": "Prendidas en fuego", "en": "Set on fire"}], "explain": {"es": "Durante la «caza», el equipo perseguidor lanza unas jabalinas de madera sin punta al rival.", "en": "During the «chase», the pursuing team throws blunt wooden javelins at the rival."}, "id": "t2q247"}, {"slide": 73, "tags": ["persia"], "q": {"es": "¿Por qué compiten los jinetes en el buzkashi?", "en": "What do riders fight over in buzkashi?"}, "o": [{"es": "Por el cuerpo de una cabra o ternero", "en": "The body of a goat or calf"}, {"es": "Por una pelota de madera mayor que un huevo", "en": "A wooden ball larger than an egg"}, {"es": "Por una flecha", "en": "An arrow"}], "explain": {"es": "El buzkashi enfrenta a jinetes que se disputan el cuerpo de una cabra o de un ternero descabezado hasta una meta.", "en": "Buzkashi pits riders against each other over the body of a headless goat or calf, carried to a goal."}, "id": "t2q248"}, {"slide": 73, "tags": ["persia"], "q": {"es": "¿Qué sostenía el buzkashi tradicional, que no tenía reglamento ni árbitro?", "en": "What held together traditional buzkashi, which had no rules or referee?"}, "o": [{"es": "Un juramento de juego limpio", "en": "An oath of fair play"}, {"es": "La vigilancia del ejército del sátrapa", "en": "The supervision of the satrap's army"}, {"es": "Un gremio", "en": "A guild"}], "explain": {"es": "El juego se sostenía por un compromiso de juego limpio, y no podía jugar quien no hiciera ese juramento inicial.", "en": "The game rested on a commitment to fair play, and anyone who did not take that initial oath was barred."}, "id": "t2q249"}, {"slide": 73, "tags": ["persia", "politica"], "q": {"es": "¿Qué hace único al buzkashi según la diapositiva?", "en": "What makes buzkashi unique according to the slide?"}, "o": [{"es": "Quién lo organiza", "en": "Who organises it"}, {"es": "La distancia que recorren los jinetes durante la partida", "en": "The distance the riders cover during the match"}, {"es": "Su antigüedad", "en": "Its age"}], "explain": {"es": "Lo que hace único a este deporte es quién lo organiza: un señor o patrón que corre con todos los gastos.", "en": "What makes this sport unique is who organises it: a lord or patron who bears all the costs."}, "id": "t2q250"}, {"slide": 73, "tags": ["persia", "politica"], "q": {"es": "¿Qué arriesga el patrón que organiza una partida de buzkashi?", "en": "What does the patron who organises a buzkashi match risk?"}, "o": [{"es": "Un fracaso público", "en": "A public failure"}, {"es": "La pérdida de sus caballos y de sus tierras", "en": "The loss of his horses and his lands"}, {"es": "Una multa del rey", "en": "A fine from the king"}], "explain": {"es": "El patrón busca demostrar su autoridad logrando que un acontecimiento caótico acabe sin incidentes, arriesgándose a un fracaso público.", "en": "The patron seeks to prove his authority by making a chaotic event end without incident, at the risk of public failure."}, "id": "t2q251"}, {"slide": 73, "tags": ["persia"], "q": {"es": "¿Quién promovió en los años sesenta una versión reglamentada del buzkashi?", "en": "Who promoted a regulated version of buzkashi in the 1960s?"}, "o": [{"es": "El Comité Olímpico afgano", "en": "The Afghan Olympic Committee"}, {"es": "La federación soviética de deportes ecuestres de Tayikistán", "en": "The Soviet equestrian federation of Tajikistan"}, {"es": "El rey de Irán", "en": "The king of Iran"}], "explain": {"es": "En la década de 1960 el Comité Olímpico afgano promovió una versión reglamentada y más suave, con terrenos acotados, protecciones y equipos.", "en": "In the 1960s the Afghan Olympic Committee promoted a regulated, softer version with marked fields, protective gear and teams."}, "id": "t2q252"}, {"slide": 78, "tags": ["fenicia", "politica"], "q": {"es": "¿Cómo se organizaba políticamente Fenicia?", "en": "How was Phoenicia organised politically?"}, "o": [{"es": "En ciudades-estado independientes", "en": "In independent city-states"}, {"es": "En un reino unificado con capital en Tiro y sátrapas", "en": "In a unified kingdom with its capital at Tyre and satraps"}, {"es": "En satrapías", "en": "In satrapies"}], "explain": {"es": "Fenicia estaba ocupada por ciudades-estado independientes y a menudo rivales que nunca constituyeron un Estado unificado.", "en": "Phoenicia was occupied by independent, often rival city-states that never formed a unified State."}, "id": "t2q253"}, {"slide": 78, "tags": ["fenicia"], "q": {"es": "¿Cuál de estas ciudades destacó entre las ciudades-estado fenicias?", "en": "Which of these cities stood out among the Phoenician city-states?"}, "o": [{"es": "Sidón", "en": "Sidon"}, {"es": "Nínive", "en": "Nineveh"}, {"es": "Persépolis", "en": "Persepolis"}], "explain": {"es": "Entre las ciudades-estado fenicias destacaron Biblos, Sidón y Tiro.", "en": "Among the Phoenician city-states, Byblos, Sidon and Tyre stood out."}, "id": "t2q254"}, {"slide": 78, "tags": ["fenicia", "navegacion"], "q": {"es": "¿Qué hecho permitió la expansión fenicia a partir del siglo XI a. C.?", "en": "What made Phoenician expansion possible from the 11th century BC?"}, "o": [{"es": "El derrumbe de los imperios del Bronce final", "en": "The collapse of the Late Bronze Age empires"}, {"es": "La invención de la vela cuadrada y del remo doble", "en": "The invention of the square sail and the double oar"}, {"es": "Una alianza con Egipto", "en": "An alliance with Egypt"}], "explain": {"es": "La expansión arranca de una debilidad ajena, el derrumbe de los grandes imperios del Bronce final, que dejó el Mediterráneo oriental sin flotas rivales.", "en": "The expansion starts from someone else's weakness, the collapse of the Late Bronze Age empires, which left the eastern Mediterranean without rival fleets."}, "id": "t2q255"}, {"slide": 78, "tags": ["fenicia", "comercio"], "q": {"es": "¿Qué carencia se presenta como el motor de la expansión fenicia?", "en": "What shortfall is presented as the engine of Phoenician expansion?"}, "o": [{"es": "Una agricultura insuficiente", "en": "Insufficient agriculture"}, {"es": "La falta de madera para construir sus barcos", "en": "The lack of timber to build their ships"}, {"es": "La falta de puertos", "en": "The lack of harbours"}], "explain": {"es": "La franja cultivable era estrecha y la agricultura nunca llegó a sostener a la población; esa carencia es el motor de todo lo que vino después.", "en": "The cultivable strip was narrow and agriculture never sustained the population; that shortfall is the engine of everything that followed."}, "id": "t2q256"}, {"slide": 78, "tags": ["fenicia", "comercio"], "q": {"es": "¿Qué recurso tenía Fenicia que ni Egipto ni Mesopotamia producían?", "en": "What resource did Phoenicia have that neither Egypt nor Mesopotamia produced?"}, "o": [{"es": "Madera de cedro y ciprés", "en": "Cedar and cypress timber"}, {"es": "Oro", "en": "Gold"}, {"es": "Plata del suroeste de la Península Ibérica", "en": "Silver from the south-west of the Iberian Peninsula"}], "explain": {"es": "Fenicia disponía de madera de cedro y ciprés, que ni Egipto ni Mesopotamia producen, si bien ambos la necesitan para mástiles, quillas y vigas.", "en": "Phoenicia had cedar and cypress timber, which neither Egypt nor Mesopotamia produces, although both need it for masts, keels and beams."}, "id": "t2q257"}, {"slide": 78, "tags": ["fenicia", "comercio"], "q": {"es": "¿Para qué necesitaba Tiro la plata del suroeste de la Península Ibérica?", "en": "Why did Tyre need the silver of the south-west of the Iberian Peninsula?"}, "o": [{"es": "Para pagar el tributo neoasirio", "en": "To pay the Neo-Assyrian tribute"}, {"es": "Para acuñar la moneda común de todas las ciudades fenicias", "en": "To mint the common coinage of all Phoenician cities"}, {"es": "Para sus templos", "en": "For its temples"}], "explain": {"es": "La expansión marítima tenía como destino la plata del suroeste peninsular, que Tiro precisaba para el tributo exigido por el imperio neoasirio.", "en": "The maritime expansion was aimed at the silver of the south-west of the Iberian Peninsula, which Tyre needed for the tribute demanded by the Neo-Assyrian Empire."}, "id": "t2q258"}, {"slide": 79, "tags": ["fenicia", "colonias", "puerto"], "q": {"es": "¿Dónde se construían siempre los asentamientos fenicios?", "en": "Where were Phoenician settlements always built?"}, "o": [{"es": "Junto a islotes, desembocaduras o fondeaderos", "en": "By islets, river mouths or anchorages"}, {"es": "En lo alto de montañas alejadas de la costa y de los ríos", "en": "On mountain tops far from the coast and rivers"}, {"es": "En valles interiores", "en": "In inland valleys"}], "explain": {"es": "Se construían cerca de un islote o una punta de fácil defensa, la desembocadura de un río o un fondeadero abrigado.", "en": "They were built near an islet or easily defended headland, a river mouth or a sheltered anchorage."}, "id": "t2q259"}, {"slide": 79, "tags": ["fenicia", "colonias"], "q": {"es": "¿Quién fundó Cartago?", "en": "Who founded Carthage?"}, "o": [{"es": "Colonos de Tiro", "en": "Settlers from Tyre"}, {"es": "Colonos de Biblos", "en": "Settlers from Byblos"}, {"es": "Asdrúbal el Bello con mercenarios", "en": "Hasdrubal the Fair with mercenaries"}], "explain": {"es": "Cartago fue fundada por colonos de Tiro en el actual Túnez.", "en": "Carthage was founded by settlers from Tyre in present-day Tunisia."}, "id": "t2q260"}, {"slide": 79, "tags": ["fenicia", "colonias"], "q": {"es": "Según la tradición, ¿en qué año se fundó Cartago?", "en": "According to tradition, in what year was Carthage founded?"}, "o": [{"es": "814 a. C.", "en": "814 BC"}, {"es": "539 a. C.", "en": "539 BC"}, {"es": "1800 a. C.", "en": "1800 BC"}], "explain": {"es": "Según la tradición, Cartago se fundó en el 814 a. C.", "en": "According to tradition, Carthage was founded in 814 BC."}, "id": "t2q261"}, {"slide": 79, "tags": ["fenicia", "colonias"], "q": {"es": "¿Qué significa Cartago en fenicio?", "en": "What does Carthage mean in Phoenician?"}, "o": [{"es": "Ciudad nueva", "en": "New city"}, {"es": "Puerto seguro", "en": "Safe harbour"}, {"es": "Casa del rey de Tiro", "en": "House of the king of Tyre"}], "explain": {"es": "Cartago significa en fenicio «ciudad nueva», Qart-ḥadašt.", "en": "Carthage means «new city» in Phoenician, Qart-ḥadašt."}, "id": "t2q262"}, {"slide": 79, "tags": ["fenicia", "colonias", "comercio"], "q": {"es": "¿Por qué Cartago hereda la red de factorías cuando Tiro es sometida?", "en": "Why does Carthage inherit the network of trading posts when Tyre is subdued?"}, "o": [{"es": "Por su riqueza y su posición central en la ruta", "en": "Because of its wealth and central position on the route"}, {"es": "Porque Roma se la cedió tras vencer en las Guerras Púnicas", "en": "Because Rome handed it over after winning the Punic Wars"}, {"es": "Por un tratado con Asiria", "en": "Through a treaty with Assyria"}], "explain": {"es": "Cuando Tiro es sometida, Cartago hereda la red de factorías gracias a su riqueza y a su posición central en la ruta.", "en": "When Tyre is subdued, Carthage inherits the network of trading posts thanks to its wealth and central position on the route."}, "id": "t2q263"}, {"slide": 79, "tags": ["fenicia", "colonias"], "q": {"es": "¿Quién estableció hacia el 223 a. C. una segunda Qart-ḥadašt en la actual Cartagena?", "en": "Who established around 223 BC a second Qart-ḥadašt in present-day Cartagena?"}, "o": [{"es": "Asdrúbal el Bello", "en": "Hasdrubal the Fair"}, {"es": "Los colonos de Tiro", "en": "The settlers from Tyre"}, {"es": "Los romanos", "en": "The Romans"}], "explain": {"es": "Hacia el 223 a. C., Asdrúbal el Bello estableció en la actual Cartagena una segunda Qart-ḥadašt; los romanos la llamaron Carthago Nova.", "en": "Around 223 BC, Hasdrubal the Fair established a second Qart-ḥadašt in present-day Cartagena; the Romans called it Carthago Nova."}, "id": "t2q264"}, {"slide": 80, "tags": ["fenicia", "politica"], "q": {"es": "¿Qué limitaba el poder del rey hereditario en las ciudades fenicias?", "en": "What limited the power of the hereditary king in Phoenician cities?"}, "o": [{"es": "Un consejo de ancianos y una asamblea", "en": "A council of elders and an assembly"}, {"es": "El gran sacerdote del templo de Tiro y los sátrapas", "en": "The high priest of Tyre's temple and the satraps"}, {"es": "El ejército", "en": "The army"}], "explain": {"es": "El poder del rey estaba limitado por un consejo de ancianos de las grandes familias mercantiles y por una asamblea de ciudadanos.", "en": "The king's power was limited by a council of elders from the great merchant families and by an assembly of citizens."}, "id": "t2q265"}, {"slide": 80, "tags": ["fenicia", "templo", "comercio"], "q": {"es": "¿Qué funciones cumplía a la vez el templo fenicio?", "en": "What functions did the Phoenician temple fulfil at once?"}, "o": [{"es": "Santuario, banco y garante de tratados", "en": "Sanctuary, bank and guarantor of treaties"}, {"es": "Escuela, gimnasio y lugar de enterramiento de los reyes", "en": "School, gymnasium and burial place of the kings"}, {"es": "Palacio y cuartel", "en": "Palace and barracks"}], "explain": {"es": "El templo funcionaba a la vez como santuario, como banco y como garante de los tratados.", "en": "The temple functioned at once as sanctuary, as bank and as guarantor of treaties."}, "id": "t2q266"}, {"slide": 80, "tags": ["fenicia"], "q": {"es": "¿Dónde nació hacia el 1800 a. C. el sistema que daría lugar al alfabeto?", "en": "Where was the system that would give rise to the alphabet born around 1800 BC?"}, "o": [{"es": "En las minas de turquesa del Sinaí", "en": "In the turquoise mines of Sinai"}, {"es": "En los templos de Tiro y de Sidón", "en": "In the temples of Tyre and Sidon"}, {"es": "En el puerto de Cartago, en el actual Túnez", "en": "In the port of Carthage, in present-day Tunisia"}], "explain": {"es": "El sistema nació hacia el 1800 a. C. entre trabajadores semitas de las minas de turquesa del Sinaí egipcio.", "en": "The system was born around 1800 BC among Semitic workers in the turquoise mines of Egyptian Sinai."}, "id": "t2q267"}, {"slide": 80, "tags": ["fenicia"], "q": {"es": "¿En cuántos signos consonánticos fijaron los fenicios el alfabeto?", "en": "At how many consonantal signs did the Phoenicians fix the alphabet?"}, "o": [{"es": "Veintidós", "en": "Twenty-two"}, {"es": "Treinta", "en": "Thirty"}, {"es": "Cuarenta y ocho", "en": "Forty-eight"}], "explain": {"es": "Los fenicios lo heredaron, lo fijaron en veintidós signos consonánticos y lo distribuyeron por el Mediterráneo.", "en": "The Phoenicians inherited it, fixed it at twenty-two consonantal signs and spread it around the Mediterranean."}, "id": "t2q268"}, {"slide": 80, "tags": ["fenicia"], "q": {"es": "¿De qué signo fenicio procede nuestra letra A?", "en": "Which Phoenician sign does our letter A come from?"}, "o": [{"es": "Una cabeza de buey", "en": "An ox head"}, {"es": "Una casa", "en": "A house"}, {"es": "La proa de un barco con cabeza de caballo", "en": "A ship's prow with a horse's head"}], "explain": {"es": "Una cabeza de buey, ʾalp, pasó a valer por su primer sonido; al invertir los griegos el sentido de la lectura, acabó girada hasta convertirse en nuestra A.", "en": "An ox head, ʾalp, came to stand for its first sound; when the Greeks reversed the reading direction it ended up turned round to become our A."}, "id": "t2q269"}, {"slide": 80, "tags": ["fenicia"], "q": {"es": "¿Cómo se explica que los griegos invirtieran el sentido de la escritura fenicia?", "en": "How is the Greeks' reversal of the direction of Phoenician writing explained?"}, "o": [{"es": "Por el soporte", "en": "By the medium"}, {"es": "Por una reforma religiosa ordenada por el oráculo de Delfos", "en": "By a religious reform ordered by the oracle of Delphi"}, {"es": "Por error", "en": "By mistake"}], "explain": {"es": "El cambio se explica por el soporte: labrar en piedra con el cincel en la izquierda favorece avanzar hacia la izquierda, y escribir con tinta hacia la derecha evita arrastrar lo escrito.", "en": "The change is explained by the medium: carving stone with the chisel in the left hand favours moving left, and writing in ink to the right avoids smudging."}, "id": "t2q270"}, {"slide": 81, "tags": ["fenicia"], "q": {"es": "¿De quién procede casi todo lo que sabemos de los fenicios?", "en": "From whom does almost everything we know of the Phoenicians come?"}, "o": [{"es": "De griegos y romanos", "en": "Greeks and Romans"}, {"es": "De sus propias crónicas reales", "en": "Their own royal chronicles"}, {"es": "De los persas, que gobernaron sus ciudades", "en": "The Persians, who ruled their cities"}], "explain": {"es": "Su literatura se ha perdido y lo que sabemos procede de sus rivales o competidores comerciales, griegos y romanos.", "en": "Their literature has been lost, and what we know comes from their rivals or commercial competitors, Greeks and Romans."}, "id": "t2q271"}, {"slide": 81, "tags": ["fenicia"], "q": {"es": "¿Cómo aparecen los fenicios en la Odisea?", "en": "How do the Phoenicians appear in the Odyssey?"}, "o": [{"es": "Como buenos marinos, pero piratas y embusteros", "en": "As good sailors, but pirates and liars"}, {"es": "Como hábiles artesanos", "en": "As skilled craftsmen"}, {"es": "Como un pueblo rudo y hostil derrotado en las Guerras Púnicas", "en": "As a rough, hostile people defeated in the Punic Wars"}], "explain": {"es": "En la Odisea pasan a ser buenos marinos, aunque descritos como piratas ávaros, embusteros y propensos al engaño.", "en": "In the Odyssey they become good sailors, though described as greedy pirates, liars and prone to deceit."}, "id": "t2q272"}, {"slide": 81, "tags": ["fenicia"], "q": {"es": "¿De quién adquieren los fenicios el estereotipo de pueblo rudo y hostil?", "en": "From whom do the Phoenicians acquire the stereotype of a rough, hostile people?"}, "o": [{"es": "De los romanos", "en": "The Romans"}, {"es": "De Homero en la Ilíada", "en": "Homer in the Iliad"}, {"es": "De los asirios", "en": "The Assyrians"}], "explain": {"es": "El estereotipo de pueblo rudo y hostil lo adquieren de los romanos por los conflictos con Cartago en las Guerras Púnicas.", "en": "They acquire the stereotype of a rough, hostile people from the Romans, owing to the conflicts with Carthage in the Punic Wars."}, "id": "t2q273"}, {"slide": 81, "tags": ["fenicia"], "q": {"es": "¿Cuál de estos es uno de los problemas materiales para estudiar a los fenicios?", "en": "Which of these is one of the material problems in studying the Phoenicians?"}, "o": [{"es": "Sus ciudades siguen habitadas", "en": "Their cities are still inhabited"}, {"es": "Sus textos están en una lengua que nadie ha descifrado todavía", "en": "Their texts are in a language nobody has yet deciphered"}, {"es": "No usaban madera", "en": "They did not use wood"}], "explain": {"es": "Las ciudades fenicias continúan habitadas y edificadas sobre sí mismas, por lo que no admiten excavación en extensión.", "en": "The Phoenician cities remain inhabited and built over themselves, so they do not allow extensive excavation."}, "id": "t2q274"}, {"slide": 81, "tags": ["fenicia", "comercio"], "q": {"es": "¿Qué conclusión se extrae del análisis de monedas y cuencos de metal fenicios?", "en": "What conclusion follows from analysing Phoenician coins and metal bowls?"}, "o": [{"es": "Ha llegado antes su trabajo que su deporte", "en": "Their work has reached us before their sport"}, {"es": "Practicaban los mismos deportes que los griegos en sus juegos", "en": "They practised the same sports as the Greeks at their games"}, {"es": "No tenían religión", "en": "They had no religion"}], "explain": {"es": "De esas piezas se desprende una conclusión importante: de los fenicios ha llegado antes su trabajo que su deporte.", "en": "These pieces yield an important conclusion: of the Phoenicians, their work has reached us before their sport."}, "id": "t2q275"}, {"slide": 83, "tags": ["fenicia", "remo"], "q": {"es": "¿Cuál es la actividad física fenicia que sí admite documentación?", "en": "Which Phoenician physical activity can be documented?"}, "o": [{"es": "El trabajo", "en": "Work"}, {"es": "La lucha en los santuarios", "en": "Wrestling in sanctuaries"}, {"es": "La caza", "en": "Hunting"}], "explain": {"es": "La actividad física fenicia que sí admite documentación es el trabajo.", "en": "The Phoenician physical activity that can be documented is work."}, "id": "t2q276"}, {"slide": 83, "tags": ["fenicia", "remo"], "q": {"es": "¿Qué muestran los relieves del palacio de Sargón II en Dur-Sharrukin?", "en": "What do the reliefs of the palace of Sargon II at Dur-Sharrukin show?"}, "o": [{"es": "Barcas a remo que remolcan troncos de cedro", "en": "Rowing boats towing cedar logs"}, {"es": "Galeras de guerra fenicias en combate contra la flota griega", "en": "Phoenician war galleys fighting the Greek fleet"}, {"es": "Remeros comiendo", "en": "Rowers eating"}], "explain": {"es": "Los relieves representan pequeñas embarcaciones a remo que transportan madera de cedro remolcando los troncos por la costa.", "en": "The reliefs depict small rowing boats carrying cedar wood, towing the logs along the coast."}, "id": "t2q277"}, {"slide": 83, "tags": ["fenicia", "navegacion"], "q": {"es": "¿Por qué los griegos llamaron hippoi a ciertas barcas fenicias?", "en": "Why did the Greeks call certain Phoenician boats hippoi?"}, "o": [{"es": "Por la cabeza de caballo de su proa", "en": "For the horse's head on their prow"}, {"es": "Porque transportaban caballos de Persia hasta Grecia", "en": "Because they carried horses from Persia to Greece"}, {"es": "Por su velocidad", "en": "For their speed"}], "explain": {"es": "Lo más llamativo de estas naves es la cabeza de caballo tallada en la parte delantera, por lo que los griegos las llamaron hippoi, «caballos».", "en": "The most striking feature is the horse's head carved at the front, so the Greeks called them hippoi, «horses»."}, "id": "t2q278"}, {"slide": 83, "tags": ["fenicia", "remo", "navegacion"], "q": {"es": "¿Cuándo usaba los remos el buque de carga fenicio?", "en": "When did the Phoenician cargo ship use its oars?"}, "o": [{"es": "En maniobras de puerto o emergencias", "en": "For harbour manoeuvres or emergencies"}, {"es": "Durante toda la travesía, con la tripulación bogando a la vez", "en": "Throughout the crossing, with the whole crew rowing together"}, {"es": "Nunca", "en": "Never"}], "explain": {"es": "El buque de carga navegaba a vela y reservaba sus tres o cuatro remos por banda para entrar y salir de puerto o para una emergencia.", "en": "The cargo ship sailed and kept its three or four oars a side for manoeuvring in and out of harbour or for emergencies."}, "id": "t2q279"}, {"slide": 84, "tags": ["fenicia", "remo"], "q": {"es": "Según Tucídides, ¿de qué se alimentaba una tripulación de remeros?", "en": "According to Thucydides, what did a crew of rowers live on?"}, "o": [{"es": "Tortas de cebada y vino", "en": "Barley cakes and wine"}, {"es": "Frutos secos, piñones y aceitunas", "en": "Dried fruit, pine nuts and olives"}, {"es": "Pescado salado y agua", "en": "Salted fish and water"}], "explain": {"es": "Tucídides escribió que una tripulación de remeros se alimentaba a base de tortas de cebada y vino y dormía por turnos.", "en": "Thucydides wrote that a crew of rowers lived on barley cakes and wine and slept in shifts."}, "id": "t2q280"}, {"slide": 84, "tags": ["fenicia", "remo"], "q": {"es": "¿Qué velocidad sostenida lograron los remeros de la nave reconstruida?", "en": "What sustained speed did the rowers of the reconstructed ship achieve?"}, "o": [{"es": "Entre 6 y 9 km/h", "en": "Between 6 and 9 km/h"}, {"es": "Unos 14 km/h", "en": "About 14 km/h"}, {"es": "Más de 20 km/h con mar en calma", "en": "Over 20 km/h in calm seas"}], "explain": {"es": "Los resultados arrojaron velocidades sostenidas de no más de 6 a 9 km/h, por debajo de los 14 km/h que se deducían de Tucídides.", "en": "The results gave sustained speeds of no more than 6 to 9 km/h, below the 14 km/h implied by Thucydides."}, "id": "t2q281"}, {"slide": 84, "tags": ["fenicia", "remo"], "q": {"es": "¿Qué ritmo de descanso necesitaban los remeros en el experimento?", "en": "What rest pattern did the rowers need in the experiment?"}, "o": [{"es": "20 minutos cada 40 de actividad", "en": "20 minutes every 40 of activity"}, {"es": "Una hora cada cinco horas de remo continuo", "en": "One hour every five hours of continuous rowing"}, {"es": "Ninguno", "en": "None"}], "explain": {"es": "Los remeros soportaban jornadas de hasta cinco horas con descansos de 20 minutos cada 40 de actividad.", "en": "The rowers endured days of up to five hours with 20-minute rests every 40 minutes of activity."}, "id": "t2q282"}, {"slide": 85, "tags": ["fenicia", "navegacion"], "q": {"es": "¿Por qué constelación se guiaban los fenicios para navegar?", "en": "Which constellation did the Phoenicians steer by?"}, "o": [{"es": "La Osa Menor", "en": "Ursa Minor"}, {"es": "La Osa Mayor", "en": "Ursa Major"}, {"es": "La constelación de Orión", "en": "The constellation of Orion"}], "explain": {"es": "Los griegos gobernaban el rumbo por la Osa Mayor, mientras que los fenicios lo hacían por la Osa Menor.", "en": "The Greeks steered by Ursa Major, whereas the Phoenicians steered by Ursa Minor."}, "id": "t2q283"}, {"slide": 85, "tags": ["fenicia", "navegacion"], "q": {"es": "¿Por qué guiarse por la Osa Menor daba ventaja a los fenicios?", "en": "Why did steering by Ursa Minor give the Phoenicians an advantage?"}, "o": [{"es": "Porque apenas se desplaza durante la noche", "en": "Because it barely moves during the night"}, {"es": "Porque brilla más que la Osa Mayor en el Mediterráneo occidental", "en": "Because it shines brighter than Ursa Major in the western Mediterranean"}, {"es": "Porque se ve también de día", "en": "Because it is also visible by day"}], "explain": {"es": "La Osa Menor, más próxima al punto fijo del cielo, apenas se desplaza, de manera que quien se guía por ella conserva el rumbo.", "en": "Ursa Minor, closer to the fixed point of the sky, barely moves, so whoever steers by it keeps the course."}, "id": "t2q284"}, {"slide": 85, "tags": ["fenicia", "navegacion"], "q": {"es": "¿Cuántos tripulantes llevaban los hippoi?", "en": "How many crew did the hippoi carry?"}, "o": [{"es": "Entre dos y cinco", "en": "Between two and five"}, {"es": "Entre seis y veinte", "en": "Between six and twenty"}, {"es": "Ciento setenta", "en": "One hundred and seventy"}], "explain": {"es": "Las tripulaciones rondaban entre seis y veinte hombres en las naves de carga (golahs) y entre dos y cinco en los hippoi.", "en": "Crews ranged from six to twenty men on cargo ships (golahs) and from two to five on the hippoi."}, "id": "t2q285"}, {"slide": 85, "tags": ["fenicia", "navegacion"], "q": {"es": "¿Qué temporada de navegación seguían los fenicios?", "en": "What sailing season did the Phoenicians follow?"}, "o": [{"es": "De la primavera al comienzo del otoño", "en": "From spring to early autumn"}, {"es": "Todo el año, también en invierno", "en": "All year round, including winter"}, {"es": "Solo durante los meses fríos del invierno", "en": "Only during the cold winter months"}], "explain": {"es": "La temporada iba de la primavera al comienzo del otoño; fuera de ella el viento y el mal tiempo hacían la travesía inasumible.", "en": "The season ran from spring to early autumn; outside it wind and bad weather made the crossing untenable."}, "id": "t2q286"}, {"slide": 85, "tags": ["fenicia", "navegacion", "puerto"], "q": {"es": "¿Por qué la temporada de navegación condicionaba la vida de una ciudad portuaria?", "en": "Why did the sailing season shape the life of a port city?"}, "o": [{"es": "Fijaba cuándo se cobraba y cuándo se pasaba hambre", "en": "It set when money came in and when people went hungry"}, {"es": "Marcaba las fiestas religiosas del año", "en": "It marked the religious festivals of the year"}, {"es": "Decidía cuándo se reunía la asamblea de ciudadanos para elegir al rey", "en": "It decided when the citizens' assembly met to choose the king"}], "explain": {"es": "La temporada fija cuándo salen y regresan las flotas, cuándo se cobra y cuándo se pasa hambre.", "en": "The season fixes when fleets leave and return, when money comes in and when people go hungry."}, "id": "t2q287"}, {"slide": 86, "tags": ["fenicia", "navegacion"], "q": {"es": "¿Dónde se localizaron los pecios fenicios de Mazarrón?", "en": "Where were the Phoenician shipwrecks of Mazarrón found?"}, "o": [{"es": "En la playa de la Isla, junto a la orilla", "en": "On the beach of La Isla, near the shore"}, {"es": "En alta mar, frente a la costa de Cartagena", "en": "On the high seas, off the coast of Cartagena"}, {"es": "En el puerto de Cádiz", "en": "In the port of Cadiz"}], "explain": {"es": "En la playa de la Isla de Mazarrón, a escasos metros de la orilla, se localizaron dos pequeños barcos mercantes costeros hundidos.", "en": "On the beach of Isla de Mazarrón, a few metres from the shore, two small sunken coastal merchant ships were found."}, "id": "t2q288"}, {"slide": 86, "tags": ["fenicia", "navegacion"], "q": {"es": "¿Con qué iban cosidas entre sí las piezas del casco de Mazarrón 2?", "en": "What were the hull pieces of Mazarrón 2 sewn together with?"}, "o": [{"es": "Cuerda de esparto", "en": "Esparto cord"}, {"es": "Clavos de bronce", "en": "Bronze nails"}, {"es": "Tiras de cuero de buey", "en": "Strips of ox leather"}], "explain": {"es": "Las piezas del casco, de ciprés, pino, higuera y olivo, van cosidas entre sí con cuerda de esparto.", "en": "The hull pieces, of cypress, pine, fig and olive, are sewn together with esparto cord."}, "id": "t2q289"}, {"slide": 86, "tags": ["fenicia", "comercio"], "q": {"es": "¿Qué carga principal llevaba Mazarrón 2?", "en": "What main cargo did Mazarrón 2 carry?"}, "o": [{"es": "Lingotes de plomo", "en": "Lead ingots"}, {"es": "Ánforas de vino", "en": "Wine amphorae"}, {"es": "Troncos de cedro del Líbano", "en": "Cedar logs from Lebanon"}], "explain": {"es": "Dentro llevaba unos 2.800 kilos de lingotes de plomo procedentes de las minas de Cartagena y Mazarrón.", "en": "Inside it carried some 2,800 kilos of lead ingots from the mines of Cartagena and Mazarrón."}, "id": "t2q290"}, {"slide": 86, "tags": ["fenicia", "navegacion"], "q": {"es": "¿Dónde se conserva hoy el pecio Mazarrón 2?", "en": "Where is the Mazarrón 2 wreck kept today?"}, "o": [{"es": "En el Museo Nacional de Arqueología Subacuática", "en": "In the National Museum of Underwater Archaeology"}, {"es": "En la playa, donde apareció", "en": "On the beach, where it appeared"}, {"es": "En el Museo del Louvre, junto a los relieves de Sargón II", "en": "In the Louvre Museum, next to the reliefs of Sargon II in Paris"}], "explain": {"es": "Se sacó del agua en 2024 y hoy se conserva en el Museo Nacional de Arqueología Subacuática, en Cartagena.", "en": "It was lifted from the water in 2024 and is now kept at the National Museum of Underwater Archaeology, in Cartagena."}, "id": "t2q291"}, {"slide": 89, "tags": ["fenicia", "juego", "religion"], "q": {"es": "¿De qué santuario procede el único conjunto de objetos que muestra cuerpos fenicios jugando?", "en": "Which sanctuary yields the only set of objects showing Phoenician bodies at play?"}, "o": [{"es": "Kharayeb", "en": "Kharayeb"}, {"es": "Biblos", "en": "Byblos"}, {"es": "Naqsh-e Rostam", "en": "Naqsh-e Rostam"}], "explain": {"es": "El único conjunto procede del santuario de Kharayeb, en el interior de Tiro, y se compone de figuritas de barro cocido.", "en": "The only set comes from the sanctuary of Kharayeb, in the hinterland of Tyre, and consists of fired-clay figurines."}, "id": "t2q292"}, {"slide": 89, "tags": ["fenicia", "juego"], "q": {"es": "¿Qué porcentaje de las figuritas de Kharayeb representa a niños?", "en": "What percentage of the Kharayeb figurines depict children?"}, "o": [{"es": "35 %", "en": "35%"}, {"es": "22 %", "en": "22%"}, {"es": "Más del 50 %", "en": "Over 50%"}], "explain": {"es": "Las figuras de niños suponen el 35 % de las piezas y las de mujeres, el 22 %.", "en": "Figures of children make up 35% of the pieces and those of women, 22%."}, "id": "t2q293"}, {"slide": 89, "tags": ["fenicia", "juego"], "q": {"es": "¿Cómo se ha interpretado la sustitución del perro por una pelota en las figuras de 5 a 8 años?", "en": "How has the replacement of the dog by a ball in the figures aged 5 to 8 been interpreted?"}, "o": [{"es": "Como el paso del juego libre al reglado", "en": "As the move from free to rule-governed play"}, {"es": "Como el inicio del servicio militar de los niños de la élite", "en": "As the start of military service for elite boys"}, {"es": "Como un rito funerario", "en": "As a funerary rite"}], "explain": {"es": "Entre los 5 y los 8 años el perro es sustituido por una pelota, lo que se ha interpretado como el paso del juego libre al juego reglado.", "en": "Between 5 and 8 the dog is replaced by a ball, interpreted as the passage from free play to rule-governed play."}, "id": "t2q294"}, {"slide": 89, "tags": ["fenicia", "juego", "educacion"], "q": {"es": "¿Con qué objetos aparecen las figuras de muchachos de 12 a 14 años en Kharayeb?", "en": "With what objects do the figures of boys aged 12 to 14 appear at Kharayeb?"}, "o": [{"es": "Estrígil y frasco de aceite", "en": "Strigil and oil flask"}, {"es": "Pájaros y perros", "en": "Birds and dogs"}, {"es": "Arco y flechas para cazar ciervos", "en": "Bow and arrows for hunting deer"}], "explain": {"es": "Entre los 12 y 14 años aparecen con estrígil y frasco de aceite, dos elementos necesarios para entrenar en el gimnasio.", "en": "Between 12 and 14 they appear with a strigil and an oil flask, two items needed for training in the gymnasium."}, "id": "t2q295"}, {"slide": 89, "tags": ["fenicia", "religion", "juego"], "q": {"es": "¿Cómo se han interpretado las figuritas de Kharayeb?", "en": "How have the Kharayeb figurines been interpreted?"}, "o": [{"es": "Como ofrendas por ritos de paso", "en": "As offerings for rites of passage"}, {"es": "Como juguetes que los niños de Tiro llevaban al gimnasio", "en": "As toys that Tyrian children took to the gymnasium"}, {"es": "Como trofeos", "en": "As trophies"}], "explain": {"es": "Las figuras se han interpretado como ofrendas sagradas que marcaban ritos de paso de la infancia a la adultez.", "en": "The figures have been interpreted as sacred offerings marking rites of passage from childhood to adulthood."}, "id": "t2q296"}, {"slide": 90, "tags": ["fenicia", "mujeres", "funerario"], "q": {"es": "¿En qué ámbito están documentadas las prácticas corporales femeninas fenicias?", "en": "In what sphere are Phoenician female bodily practices documented?"}, "o": [{"es": "Solo en el funerario", "en": "Only the funerary"}, {"es": "En el gimnasio y en los santuarios de las ciudades", "en": "The gymnasium and the city sanctuaries"}, {"es": "En la navegación", "en": "Seafaring"}], "explain": {"es": "Las prácticas corporales femeninas están documentadas exclusivamente en el ámbito funerario.", "en": "Female bodily practices are documented exclusively in the funerary sphere."}, "id": "t2q297"}, {"slide": 90, "tags": ["fenicia", "mujeres", "funerario"], "q": {"es": "¿Qué papel tenían las mujeres en la procesión fúnebre fenicia?", "en": "What role did women have in the Phoenician funeral procession?"}, "o": [{"es": "Músicos o bailarinas", "en": "Musicians or dancers"}, {"es": "Portadoras de ofrendas de comida y de armas", "en": "Bearers of offerings of food and weapons"}, {"es": "Sacerdotisas", "en": "Priestesses"}], "explain": {"es": "Las mujeres participaban como músicos o bailarinas en la procesión que acompañaba al difunto y durante el enterramiento.", "en": "Women took part as musicians or dancers in the procession accompanying the deceased and during the burial."}, "id": "t2q298"}, {"slide": 90, "tags": ["fenicia", "mujeres", "funerario"], "q": {"es": "¿Qué se especula sobre los funerales de las familias de élite fenicias?", "en": "What is speculated about the funerals of Phoenician elite families?"}, "o": [{"es": "Que participaban músicas profesionales", "en": "That professional female musicians took part"}, {"es": "Que se celebraban carreras de carros en honor del difunto", "en": "That chariot races were held in honour of the deceased"}, {"es": "Que no había música", "en": "That there was no music"}], "explain": {"es": "Se especula que en los funerales de las familias de élite participaban músicos femeninos profesionales.", "en": "It is speculated that professional female musicians took part in the funerals of elite families."}, "id": "t2q299"}, {"slide": 91, "tags": ["fenicia"], "q": {"es": "Según la diapositiva, ¿qué falta ante todo para conocer el deporte fenicio?", "en": "According to the slide, what is above all missing to know Phoenician sport?"}, "o": [{"es": "Un tipo de fuente", "en": "A type of source"}, {"es": "La práctica misma, que nunca existió", "en": "The practice itself, which never existed"}, {"es": "Interés de los historiadores", "en": "Interest from historians"}], "explain": {"es": "Lo que falta es, ante todo, un tipo de fuente, circunstancia que en modo alguno acredita la ausencia de práctica.", "en": "What is missing is, above all, a type of source, a circumstance that in no way proves the absence of practice."}, "id": "t2q300"}, {"slide": 91, "tags": ["fenicia", "politica"], "q": {"es": "¿Cuál de estos elementos, que en otras civilizaciones dejó registro deportivo, faltó en las ciudades fenicias?", "en": "Which of these elements, which left sporting records in other civilisations, was lacking in the Phoenician cities?"}, "o": [{"es": "Un santuario común donde inscribir vencedores", "en": "A common sanctuary to inscribe victors"}, {"es": "Puertos", "en": "Harbours"}, {"es": "Templos que funcionaban como bancos y garantes de tratados", "en": "Temples that worked as banks and guarantors of treaties"}], "explain": {"es": "Las ciudades fenicias carecieron de un Estado que grabara proezas, de un rey que exhibiera su cuerpo y de un santuario común donde inscribir vencedores.", "en": "The Phoenician cities lacked a State to carve feats, a king to display his body and a common sanctuary in which to inscribe victors."}, "id": "t2q301"}, {"slide": 91, "tags": ["fenicia", "juegos_griegos", "carro"], "q": {"es": "¿Qué fenicio venció en la carrera de carros de los Juegos Nemeos hacia el 200 a. C.?", "en": "Which Phoenician won the chariot race at the Nemean Games around 200 BC?"}, "o": [{"es": "Diótimo de Sidón", "en": "Diotimus of Sidon"}, {"es": "Aurelio Hélix", "en": "Aurelius Helix"}, {"es": "Asdrúbal el Bello de Cartago", "en": "Hasdrubal the Fair of Carthage"}], "explain": {"es": "Los registros griegos recogen a Diótimo de Sidón, vencedor en la carrera de carros de los Juegos Nemeos hacia el 200 a. C.", "en": "Greek records list Diotimus of Sidon, victor in the chariot race at the Nemean Games around 200 BC."}, "id": "t2q302"}, {"slide": 91, "tags": ["fenicia", "juegos_griegos", "lucha"], "q": {"es": "¿En qué prueba venció Aurelio Hélix «el fenicio» en Olimpia?", "en": "In which event did Aurelius Helix «the Phoenician» win at Olympia?"}, "o": [{"es": "Lucha", "en": "Wrestling"}, {"es": "Carrera de carros", "en": "Chariot race"}, {"es": "Carrera a pie del estadio", "en": "The stadion foot race"}], "explain": {"es": "Aurelio Hélix «el fenicio» fue vencedor de lucha en Olimpia a comienzos del siglo III d. C.", "en": "Aurelius Helix «the Phoenician» was wrestling victor at Olympia at the start of the 3rd century AD."}, "id": "t2q303"}, {"slide": 91, "tags": ["fenicia", "politica"], "q": {"es": "¿Qué pregunta plantea Fenicia, inversa a la conclusión sobre Egipto?", "en": "What question does Phoenicia raise, the reverse of the conclusion on Egypt?"}, "o": [{"es": "Qué sucede si nadie quiere dejar escritas las prácticas", "en": "What happens if nobody wants to record the practices"}, {"es": "Por qué el deporte dura más que el poder", "en": "Why sport outlasts power"}, {"es": "Por qué los fenicios despreciaron el deporte que practicaban sus vecinos", "en": "Why the Phoenicians despised the sport practised by their neighbours"}], "explain": {"es": "En Egipto las prácticas que el poder inventa duran lo que ese poder; Fenicia plantea qué sucede cuando no hay nadie interesado en dejarlas por escrito.", "en": "In Egypt the practices power invents last as long as that power; Phoenicia asks what happens when nobody is interested in writing them down."}, "id": "t2q304"}];
