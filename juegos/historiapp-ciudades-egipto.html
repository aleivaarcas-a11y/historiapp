 and playing field. Safavid period."}}, {"q": {"es": "¿Cuál fue la aportación cultural decisiva de los fenicios?", "en": "What was the Phoenicians' decisive cultural contribution?"}, "o": [{"es": "Fijar y difundir el alfabeto de 22 signos", "en": "Fixing and spreading the 22-sign alphabet"}, {"es": "Inventar la brújula", "en": "Inventing the compass"}, {"es": "Crear los Juegos Olímpicos", "en": "Creating the Olympic Games"}, {"es": "Introducir el caballo en todo el Mediterráneo", "en": "Introducing the horse across the Mediterranean"}], "a": 0, "explain": {"es": "El sistema nació hacia 1800 a. C. entre trabajadores semitas del Sinaí; los fenicios lo fijaron en 22 consonantes y lo distribuyeron en sus barcos.", "en": "The system arose around 1800 BC among Semitic workers in Sinai; the Phoenicians fixed it at 22 consonants and distributed it in their ships."}}, {"q": {"es": "¿Por qué las naves fenicias de los relieves de Sargón II se llamaron hippoi?", "en": "Why were the Phoenician ships in Sargon II's reliefs called hippoi?"}, "o": [{"es": "Por la cabeza de caballo tallada en la proa", "en": "For the horse head carved on the bow"}, {"es": "Porque transportaban caballos para el ejército asirio", "en": "Because they carried horses for the Assyrian army"}, {"es": "Por su velocidad", "en": "For their speed"}, {"es": "Por el nombre de su puerto", "en": "After their home port"}], "a": 0, "explain": {"es": "El mascarón de proa fue una de las principales innovaciones fenicias a la náutica. Transportaban madera de cedro remolcando troncos por la costa.", "en": "The figurehead was one of the main Phoenician innovations in seafaring. The ships carried cedar, towing logs along the coast."}}, {"q": {"es": "¿Qué porcentaje de las figuritas de Kharayeb representa a niños?", "en": "What percentage of the Kharayeb figurines depict children?"}, "o": [{"es": "35 %", "en": "35 %"}, {"es": "22 %", "en": "22 %"}, {"es": "50 %", "en": "50 %"}, {"es": "5 %", "en": "5 %"}], "a": 0, "explain": {"es": "De 16.400 fragmentos, un 35 % son niños y un 22 % mujeres. Las figuras permiten ordenar una secuencia de juego por edades.", "en": "Of 16,400 fragments, 35 % are children and 22 % women. The figures allow a sequence of play by age to be ordered."}}, {"q": {"es": "¿Qué lleva a los persas a estatalizar la educación de los jóvenes?", "en": "What leads the Persians to place young people's education under the state?"}, "o": [{"es": "Gobernar decenas de pueblos con una minoría persa dispersa", "en": "Ruling dozens of peoples with a scattered Persian minority"}, {"es": "Preparar atletas capaces de competir con los griegos en Olimpia", "en": "Preparing athletes able to compete with the Greeks at Olympia"}, {"es": "La escasez de caballos", "en": "The scarcity of horses"}, {"es": "La influencia egipcia", "en": "Egyptian influence"}], "a": 0, "explain": {"es": "El imperio se construye en treinta años sobre decenas de pueblos; la educación tiene como fin impedir que los hijos de los persas dejen de serlo.", "en": "The empire was built in thirty years over dozens of peoples; education aimed to stop the sons of Persians from ceasing to be Persian."}}, {"q": {"es": "«Su cuerpo es fuerte y está adiestrado de manos y de pies; como jinete es buen jinete, como arquero es buen arquero y como lancero es buen lancero, a pie y a caballo».<br><small>¿De qué rey habla este texto grabado en su tumba?</small>", "en": "'His body is strong and trained in hands and feet; as a horseman he is a good horseman, as a bowman a good bowman, as a spearman a good spearman, on foot and on horseback.'<br><small>Which king does this text carved on his tomb speak of?</small>"}, "o": [{"es": "Darío I, Naqsh-e Rostam", "en": "Darius I, Naqsh-e Rostam"}, {"es": "Amenofis II, Medamud", "en": "Amenhotep II, Medamud"}, {"es": "Ramsés II, templo de Abu Simbel", "en": "Ramesses II, Abu Simbel temple"}, {"es": "Taharqa, Menfis", "en": "Taharqa, Memphis"}], "a": 0, "explain": {"es": "Darío I (522-486 a. C.) presenta sus capacidades como don divino y repite punto por punto el esquema egipcio: la superioridad física del soberano legitima el trono.", "en": "Darius I (522-486 BC) presents his abilities as a divine gift and repeats the Egyptian scheme point by point: the ruler's physical superiority legitimises the throne."}}, {"q": {"es": "«Disparó contra una diana de tres dedos y la perforó con la primera flecha, de modo que 7/9 del astil salieron por la cara contraria».<br><small>¿A qué rey se refiere esta inscripción?</small>", "en": "'He shot at a target three fingers thick and pierced it with the first arrow, so that 7/9 of the shaft came out the other side.'<br><small>Which king does this inscription refer to?</small>"}, "o": [{"es": "Amenofis II", "en": "Amenhotep II"}, {"es": "Tutmosis III", "en": "Thutmose III"}, {"es": "Ciro II", "en": "Cyrus II"}, {"es": "Seti I", "en": "Seti I"}], "a": 0, "explain": {"es": "Inscripción de Medamud. Amenofis II es la única excepción en tres milenios: los presentes intentaron disparar sin éxito, lo que confirma el dogma del victor perpetuus.", "en": "Medamud inscription. Amenhotep II is the only exception in three millennia: those present tried to shoot without success, which confirms the victor perpetuus dogma."}}, {"q": {"es": "«Los jóvenes son educados desde los cinco a los veinte años en tres aspectos: montar a caballo, disparar el arco y decir la verdad».<br><small>¿Qué autor describe así la educación persa?</small>", "en": "'The boys are taught from the age of five to twenty three things only: to ride, to shoot the bow and to tell the truth.'<br><small>Which author describes Persian education this way?</small>"}, "o": [{"es": "Heródoto", "en": "Herodotus"}, {"es": "Jenofonte", "en": "Xenophon"}, {"es": "Estrabón", "en": "Strabo"}, {"es": "Tucídides", "en": "Thucydides"}], "a": 0, "explain": {"es": "Heródoto, Historia 1.136. Estrabón alarga después la formación hasta los veinticuatro años y Jenofonte la describe como masculina y obligatoria.", "en": "Herodotus, Histories 1.136. Strabo later extends training to twenty-four and Xenophon describes it as male and compulsory."}}, {"q": {"es": "«Quería a sus caballos y se regocijaba con ellos. Su empeño constante era entrenarlos, conocer su naturaleza y ser experto en controlarlos».<br><small>¿De qué fuente procede este texto?</small>", "en": "'He loved his horses and rejoiced in them. His constant effort was to train them, to know their nature and to be expert in controlling them.'<br><small>Which source does this text come from?</small>"}, "o": [{"es": "Estela de la Esfinge (Amenofis II)", "en": "Sphinx Stela (Amenhotep II)"}, {"es": "Ciropedia (Jenofonte)", "en": "Cyropaedia (Xenophon)"}, {"es": "Estela de Taharqa", "en": "Taharqa Stela"}, {"es": "Autobiografía de Khety, nomarca de Siut", "en": "Autobiography of Khety, nomarch of Siut"}], "a": 0, "explain": {"es": "Losa de 3,6 x 2,2 m que describe al príncipe entrenando caballos en Menfis y haciéndolos dar vueltas junto a la Gran Esfinge contemplando las pirámides.", "en": "Slab of 3.6 x 2.2 m describing the prince training horses at Memphis and driving them round by the Great Sphinx gazing at the pyramids."}}, {"q": {"es": "«Unos 50 km de Menfis al oasis de El Fayum durante la noche, cubiertos en 4 horas con llegada al amanecer, un descanso reglamentario de 2 horas y otros 50 km de regreso».<br><small>¿Qué documento relata esta prueba?</small>", "en": "'Some 50 km from Memphis to the Fayum oasis by night, covered in 4 hours arriving at dawn, a regulation 2-hour rest and another 50 km back.'<br><small>Which document recounts this event?</small>"}, "o": [{"es": "Estela de Taharqa", "en": "Taharqa Stela"}, {"es": "Relieve de Sahure", "en": "Sahure relief"}, {"es": "Estela de la Esfinge", "en": "Sphinx Stela"}, {"es": "Piedra Rosetta", "en": "Rosetta Stone"}], "a": 0, "explain": {"es": "Hallada en la ruta del desierto entre Menfis y Dahshur; año 6 de Taharqa (h. 685 a. C.). Participaron tropas de élite en cinco secciones (Pruett, 2026).", "en": "Found on the desert route between Memphis and Dahshur; year 6 of Taharqa (c. 685 BC). Elite troops in five sections took part (Pruett, 2026)."}}, {"q": {"es": "«Una tripulación de remeros se alimentaba a base de tortas de cebada y vino, y dormía por turnos mientras otro grupo remaba».<br><small>¿Quién describe así la vida de los remeros?</small>", "en": "'A crew of rowers lived on barley cakes and wine, and slept in shifts while another group rowed.'<br><small>Who describes rowers' life this way?</small>"}, "o": [{"es": "Tucídides", "en": "Thucydides"}, {"es": "Heródoto", "en": "Herodotus"}, {"es": "Homero", "en": "Homer"}, {"es": "Jean Chardin", "en": "Jean Chardin"}], "a": 0, "explain": {"es": "Tucídides (460-396 a. C.) dejó escrito que una nave cubría 340 km en 24 h. El trirreme Olympias (1987) permitió contrastarlo mediante arqueología experimental.", "en": "Thucydides (460-396 BC) wrote that a ship covered 340 km in 24 h. The trireme Olympias (1987) allowed this to be tested through experimental archaeology."}}, {"q": {"es": "«El rey le permitió recibir lecciones de natación junto a sus hijos».<br><small>¿De qué fuente procede esta afirmación?</small>", "en": "'The king allowed him to take swimming lessons with his children.'<br><small>Which source does this statement come from?</small>"}, "o": [{"es": "Autobiografía de Khety de Siut", "en": "Autobiography of Khety of Siut"}, {"es": "Historia de Sinuhé, del Imperio Medio", "en": "Story of Sinuhe, from the Middle Kingdom"}, {"es": "Estela de la Esfinge", "en": "Sphinx Stela"}, {"es": "Ciclo de Horus y Seth", "en": "Cycle of Horus and Seth"}], "a": 0, "explain": {"es": "Nomarca del Primer Periodo Intermedio. La frase acredita una enseñanza reglada con maestro y grupo dentro del kap, y convierte nadar en destreza de élite.", "en": "Nomarch of the First Intermediate Period. The sentence attests to formal teaching with an instructor and a group inside the kap, making swimming an elite skill."}}, {"q": {"es": "«Traer a pie doce flechas, una a una, desde un pilar situado a legua y media de la puerta del palacio».<br><small>¿A qué prueba se refiere este viajero?</small>", "en": "'To fetch twelve arrows on foot, one by one, from a pillar a league and a half from the palace gate.'<br><small>Which test does this traveller refer to?</small>"}, "o": [{"es": "El chatir de Isfahán", "en": "The chatir of Isfahan"}, {"es": "La carrera del Heb-Sed", "en": "The Heb-Sed run"}, {"es": "El buzkashi", "en": "Buzkashi"}, {"es": "La carrera de Taharqa", "en": "Taharqa's run"}], "a": 0, "explain": {"es": "Descrita por Jean Chardin en Voyages en Perse. Doce idas y doce vueltas, unos 174 km, para seleccionar a los mensajeros reales safávidas.", "en": "Described by Jean Chardin in Voyages en Perse. Twelve trips out and back, some 174 km, to select Safavid royal messengers."}}, {"q": {"es": "«Los instructores dividían a los jóvenes en grupos de cincuenta y les hacían correr una distancia de entre treinta y cuarenta estadios».<br><small>¿Qué autor aporta este dato sobre Persia?</small>", "en": "'The instructors divided the youths into groups of fifty and made them run a distance of thirty to forty stades.'<br><small>Which author gives this detail about Persia?</small>"}, "o": [{"es": "Estrabón", "en": "Strabo"}, {"es": "Heródoto", "en": "Herodotus"}, {"es": "Jenofonte", "en": "Xenophon"}, {"es": "Tucídides", "en": "Thucydides"}], "a": 0, "explain": {"es": "Estrabón, Geografía 15.3.18: entre cinco y siete kilómetros, con el rey presente ofreciendo premios. Las carreras quedan dentro de la formación militar.", "en": "Strabo, Geography 15.3.18: five to seven kilometres, with the king present offering prizes. Races belong within military training."}}, {"q": {"es": "¿Verdadero o falso? El faraón competía en certámenes abiertos contra otros atletas.", "en": "True or false? The pharaoh competed in open contests against other athletes."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 1, "explain": {"es": "Tenía prohibido competir en pruebas de resultado incierto: como garante del ma'at no podía ser derrotado en público. Compite solo, sin rival (victor perpetuus).", "en": "He was forbidden to compete in events of uncertain outcome: as guarantor of ma'at he could not be defeated in public. He competes alone, without a rival (victor perpetuus)."}}, {"q": {"es": "¿Verdadero o falso? En el antiguo Egipto existía una palabra equivalente a «deporte».", "en": "True or false? Ancient Egypt had a word equivalent to 'sport'."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 1, "explain": {"es": "Se usaba el concepto de śḫmḫ-ib, «divertir el corazón» o «hacer olvidar al corazón», ligado a la salud y el bienestar.", "en": "The concept used was śḫmḫ-ib, 'to delight the heart' or 'to make the heart forget', linked to health and wellbeing."}}, {"q": {"es": "¿Verdadero o falso? Las marcas de tiro con arco de los reyes del Imperio Nuevo son físicamente posibles.", "en": "True or false? The New Kingdom kings' archery feats are physically possible."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 1, "explain": {"es": "Decker y Klauck (1974) simularon el disparo contra planchas de cobre con arcos modernos y las flechas penetraron solo unos milímetros. Cada rey supera al anterior y ninguno falla.", "en": "Decker and Klauck (1974) simulated shooting at copper plates with modern bows and the arrows penetrated only a few millimetres. Each king outdoes the last and none ever fails."}}, {"q": {"es": "¿Verdadero o falso? En Egipto se celebraban carreras de carros.", "en": "True or false? Chariot races were held in Egypt."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 1, "explain": {"es": "El carro se usó para la guerra y la caza. No se atestiguan carreras de carros.", "en": "The chariot was used for war and hunting. Chariot races are not attested."}}, {"q": {"es": "¿Verdadero o falso? Las competiciones egipcias tenían reglas formales y árbitros.", "en": "True or false? Egyptian competitions had formal rules and referees."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 0, "explain": {"es": "Algunos relieves muestran árbitros provistos de trompetas en los deportes de combate, con intencionalidad de juego limpio.", "en": "Some reliefs show referees with trumpets in combat sports, with an intention of fair play."}}, {"q": {"es": "¿Verdadero o falso? Las mujeres egipcias tenían los mismos derechos básicos que los hombres de su clase.", "en": "True or false? Egyptian women had the same basic rights as men of their class."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 0, "explain": {"es": "Podían poseer y heredar bienes, comprar, vender, litigar y testar. Excepcionalmente llegaron al trono, como Hatshepsut o Cleopatra VII.", "en": "They could own and inherit property, buy, sell, litigate and make wills. Exceptionally they reached the throne, like Hatshepsut or Cleopatra VII."}}, {"q": {"es": "¿Verdadero o falso? El juego del aro egipcio es el antecedente del hockey.", "en": "True or false? The Egyptian hoop game is the forerunner of hockey."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 1, "explain": {"es": "Se ha comparado erróneamente: no se juega con pelota ni parece un deporte de equipo. Solo hay una representación en toda la historia de Egipto (Beni Hasan).", "en": "It has been wrongly compared: it is not played with a ball nor does it seem a team sport. There is only one depiction in all of Egyptian history (Beni Hasan)."}}, {"q": {"es": "¿Verdadero o falso? El pueblo llano egipcio es el grupo mejor documentado en el deporte.", "en": "True or false? The Egyptian common people are the best documented group in sport."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 1, "explain": {"es": "Casi todo el deporte egipcio procede de tumbas de realeza y aristocracia. El pueblo llano está mucho peor documentado y tenía poco tiempo de ocio.", "en": "Almost all Egyptian sport comes from royal and aristocratic tombs. The common people are far less documented and had little leisure time."}}, {"q": {"es": "¿Verdadero o falso? El deporte faraónico se apaga cuando Egipto pierde la independencia política.", "en": "True or false? Pharaonic sport dies out when Egypt loses political independence."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 0, "explain": {"es": "Dependía del rey como garante del orden y de un Estado que grabara sus proezas. Con persas, macedonios y romanos esa estructura desaparece; sobreviven las prácticas que nunca dependieron de ella.", "en": "It depended on the king as guarantor of order and on a state that recorded his feats. Under Persians, Macedonians and Romans that structure vanishes; the practices that never depended on it survive."}}, {"q": {"es": "¿Verdadero o falso? Los persas inventaron la caza del león como liturgia de Estado.", "en": "True or false? The Persians invented lion hunting as a state liturgy."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 1, "explain": {"es": "La heredaron de los reyes asirios al conquistarlos. Lo nuevo fue el paradeisos, el parque cercado y abastecido de animales.", "en": "They inherited it from the Assyrian kings on conquering them. What was new was the paradeisos, the enclosed park stocked with animals."}}, {"q": {"es": "¿Verdadero o falso? El zurkhaneh tiene un origen clandestino demostrado como resistencia a las invasiones.", "en": "True or false? The zurkhaneh has a proven clandestine origin as resistance to invasions."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 1, "explain": {"es": "Es una leyenda construida a partir de los rasgos del edificio (sin fachada ni carteles, lejos de las calles principales). El posible origen resistente es una hipótesis.", "en": "It is a legend built from the building's features (no façade or signs, away from main streets). The possible resistance origin is a hypothesis."}}, {"q": {"es": "¿Verdadero o falso? De los fenicios se conserva alguna descripción de actividad física escrita por ellos mismos.", "en": "True or false? Some description of physical activity written by the Phoenicians themselves survives."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 1, "explain": {"es": "Su literatura se ha perdido casi por completo. Lo que sabemos procede de sus rivales, griegos y romanos, con un sesgo fácil de rastrear desde la Odisea.", "en": "Their literature is almost entirely lost. What we know comes from their rivals, Greeks and Romans, with a bias easy to trace from the Odyssey onwards."}}, {"q": {"es": "¿Verdadero o falso? La ausencia de fuentes fenicias demuestra que no practicaban actividades físicas.", "en": "True or false? The absence of Phoenician sources proves they did not practise physical activities."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 1, "explain": {"es": "Lo que falta es un tipo de fuente: no hubo Estado que grabara proezas ni rey que exhibiera su cuerpo. Kharayeb muestra cuerpos jugando en cuanto aparece un registro.", "en": "What is missing is a type of source: there was no state to record feats nor a king who needed to display his body. Kharayeb shows bodies at play as soon as a record appears."}}, {"q": {"es": "¿Verdadero o falso? Los griegos navegaban guiándose por la Osa Menor, igual que los fenicios.", "en": "True or false? The Greeks navigated by the Little Bear, like the Phoenicians."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 1, "explain": {"es": "Los griegos usaban la Osa Mayor; los fenicios la Osa Menor, mucho más próxima al polo, lo que les daba una ventaja técnica al mantener el rumbo.", "en": "The Greeks used the Great Bear; the Phoenicians the Little Bear, much closer to the pole, which gave them a technical advantage in holding course."}}, {"q": {"es": "¿Verdadero o falso? La Piedra Rosetta fue descifrada por Champollion en 1822.", "en": "True or false? The Rosetta Stone was deciphered by Champollion in 1822."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 0, "explain": {"es": "Hallada por las tropas napoleónicas en 1799, contiene el mismo texto en jeroglífico, demótico y griego antiguo: el apoyo de un grupo de sacerdotes al monarca.", "en": "Found by Napoleon's troops in 1799, it carries the same text in hieroglyphic, demotic and ancient Greek: a group of priests' support for the king."}}, {"q": {"es": "¿Verdadero o falso? La prótesis perteneció a un soldado que perdió el pie en combate.", "en": "True or false? The prosthesis belonged to a soldier who lost his foot in battle."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 1, "explain": {"es": "Perteneció a una mujer noble de 50 a 60 años que perdió el dedo gordo del pie, probablemente por complicaciones de la diabetes. Es la prótesis funcional más antigua conocida y se conserva en la Universidad de Basilea.", "en": "It belonged to a noblewoman aged 50 to 60 who lost her big toe, probably through complications of diabetes. It is the oldest known functional prosthesis and is kept at the University of Basel."}}, {"q": {"es": "¿Verdadero o falso? Los escribas eran la única clase que sabía leer y escribir.", "en": "True or false? Scribes were the only class that could read and write."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 0, "explain": {"es": "Llevaban cuentas, censos e impuestos. Por encima estaban el faraón y la aristocracia (visir, clero, nomarcas); por debajo, artesanos, ejército y el pueblo llano.", "en": "They kept accounts, censuses and taxes. Above them were the pharaoh and the aristocracy (vizier, clergy, nomarchs); below, craftsmen, the army and the common people."}}, {"q": {"es": "¿Verdadero o falso? Estas actividades servían para amenizar fiestas sagradas y banquetes de las élites.", "en": "True or false? These activities served to enliven sacred festivals and elite banquets."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 0, "explain": {"es": "Bailes, música y acrobacias formaban los espectáculos públicos, una de las dos grandes categorías de actividad física egipcia junto a los ejercicios militares. Las ejecutaban profesionales del pueblo llano.", "en": "Dance, music and acrobatics formed the public spectacles, one of the two great categories of Egyptian physical activity alongside military exercises. They were performed by professionals from the common people."}}, {"q": {"es": "¿Verdadero o falso? Esta escena pertenece al ceremonial del Heb-Sed.", "en": "True or false? This scene belongs to the Heb-Sed ceremonial."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 0, "explain": {"es": "El Heb-Sed es la fiesta de jubileo que renovaba el poder del faraón, celebrada a los treinta años de reinado y repetida después cada tres. Hay 314 testimonios.", "en": "The Heb-Sed is the jubilee festival that renewed the pharaoh's power, held after thirty years of reign and repeated every three years thereafter. There are 314 attestations."}}, {"q": {"es": "¿Verdadero o falso? La figura que corre junto al toro Apis es un faraón varón.", "en": "True or false? The figure running beside the Apis bull is a male pharaoh."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 1, "explain": {"es": "Es la reina Hatshepsut realizando la carrera del Heb-Sed en el año 16 de su reinado (h. 1485 a. C.). Las mujeres que gobernaban también debían mostrar su fortaleza física.", "en": "It is Queen Hatshepsut performing the Heb-Sed run in year 16 of her reign (c. 1485 BC). Ruling women also had to display their physical strength."}}, {"q": {"es": "¿Verdadero o falso? La zona marcada es el Gran Patio del Sur, con la pista de la carrera del Heb-Sed.", "en": "True or false? The marked area is the Great South Court, with the Heb-Sed race track."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 0, "explain": {"es": "La pista era una recta de 55 m coronada por dos mojones semicirculares; el circuito completo sumaba 140 m y se corría de norte a sur y de sur a norte, simbolizando la unión de los dos reinos.", "en": "The track was a 55 m straight ending in two semicircular markers; the full circuit was 140 m, run north to south and south to north, symbolising the union of the two kingdoms."}}, {"q": {"es": "¿Verdadero o falso? En este patio se celebraban carreras de carros.", "en": "True or false? Chariot races were held in this court."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 1, "explain": {"es": "Aquí corría el faraón a pie durante el Heb-Sed. En Egipto no se atestiguan carreras de carros: el carro se usó para la guerra y la caza.", "en": "Here the pharaoh ran on foot during the Heb-Sed. Chariot races are not attested in Egypt: the chariot was used for war and hunting."}}, {"q": {"es": "¿Verdadero o falso? Piezas como esta servían de diana en el tiro con arco real.", "en": "True or false? Pieces like this served as targets in royal archery."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 0, "explain": {"es": "Los lingotes de cobre bruto eran mercancía del comercio mediterráneo. El rey disparaba contra ellos para demostrar que su fuerza seguía intacta y el orden del mundo (ma'at) garantizado.", "en": "Raw copper ingots were goods traded across the Mediterranean. The king shot at them to show that his strength remained intact and the world order (ma'at) guaranteed."}}, {"q": {"es": "¿Verdadero o falso? El arco compuesto es una invención egipcia del Imperio Antiguo.", "en": "True or false? The composite bow is an Egyptian invention of the Old Kingdom."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 1, "explain": {"es": "Lo fabricaban los hicsos; los egipcios lo adoptan tras las guerras contra ellos y florece en el Imperio Nuevo. Se elabora con varias partes, frente al arco simple de una sola pieza de madera.", "en": "It was made by the Hyksos; the Egyptians adopted it after the wars against them and it flourished in the New Kingdom. It is built from several parts, unlike the single-piece wooden self bow."}}, {"q": {"es": "¿Verdadero o falso? El carro egipcio se usaba sobre todo en carreras de competición.", "en": "True or false? The Egyptian chariot was mainly used in competitive races."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 1, "explain": {"es": "Tirado por dos caballos, se usó para la guerra y la caza, nunca en carreras. Pesaba unos 24 kg, alcanzaba 38 km/h y tenía chasis de fresno o acacia, cuerpo de piel de cabra y ruedas de un metro con 4 o 6 radios.", "en": "Drawn by two horses, it was used for war and hunting, never for racing. It weighed about 24 kg, reached 38 km/h and had an ash or acacia frame, a goatskin body and one-metre wheels with 4 or 6 spokes."}}, {"q": {"es": "¿Verdadero o falso? Este relieve documenta una carrera de carros.", "en": "True or false? This relief documents a chariot race."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 1, "explain": {"es": "Es una escena de batalla. Los faraones dejaron registros extraordinarios de caza y guerra con el carro, pero no hay constancia de carreras.", "en": "It is a battle scene. Pharaohs left extraordinary records of hunting and war with the chariot, but there is no evidence of races."}}, {"q": {"es": "¿Verdadero o falso? La caza en las marismas estuvo siempre abierta a todo el pueblo.", "en": "True or false? Marsh hunting was always open to all the people."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 1, "explain": {"es": "Al principio estaba reservada a la realeza; a partir del Imperio Antiguo se abre a la corte y la alta aristocracia. En las tumbas de los nobles se representa a mayor tamaño que cualquier otra actividad.", "en": "At first it was reserved for royalty; from the Old Kingdom it opened to the court and the high aristocracy. In nobles' tombs it is depicted larger than any other activity."}}, {"q": {"es": "¿Verdadero o falso? Estos objetos se usaban para cazar aves en las marismas.", "en": "True or false? These objects were used to hunt birds in the marshes."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 0, "explain": {"es": "La caza en las marismas combinaba aves con arco o bastón arrojadizo, mamíferos y arponeo de peces, con perros amaestrados en cotos privados.", "en": "Marsh hunting combined birds with bow or throwing stick, mammals and fish spearing, with trained dogs on private reserves."}}, {"q": {"es": "¿Verdadero o falso? La escena muestra al noble cazando aves con bastón arrojadizo.", "en": "True or false? The scene shows the noble hunting birds with a throwing stick."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 0, "explain": {"es": "Que la caza aparezca a mayor tamaño que cualquier otra actividad en las tumbas de los nobles indica el valor simbólico que tenía para la aristocracia.", "en": "That hunting appears larger than any other activity in nobles' tombs points to its symbolic value for the aristocracy."}}, {"q": {"es": "¿Verdadero o falso? Este jeroglífico significa «natación».", "en": "True or false? This hieroglyph means 'swimming'."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 0, "explain": {"es": "La autobiografía de Khety de Siut afirma que el rey le permitió recibir lecciones de natación junto a sus hijos, lo que acredita una enseñanza reglada con maestro y grupo.", "en": "The autobiography of Khety of Siut states that the king allowed him to take swimming lessons with his children, which attests to formal teaching with an instructor and a group."}}, {"q": {"es": "¿Verdadero o falso? Las representaciones egipcias permiten afirmar que ya se nadaba a crol y a braza.", "en": "True or false? Egyptian depictions prove that crawl and breaststroke were already swum."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 1, "explain": {"es": "Algunos autores han querido reconocer esos estilos, pero otros advierten de que la técnica antigua no puede equipararse a la moderna.", "en": "Some authors have tried to identify those strokes, but others warn that ancient technique cannot be equated with modern strokes."}}, {"q": {"es": "¿Verdadero o falso? Esta arma pertenece al ejército profesional del Imperio Nuevo.", "en": "True or false? This weapon belongs to the professional army of the New Kingdom."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 1, "explain": {"es": "Es de la dinastía XII, en el Imperio Medio (h. 1981-1802 a. C.). El ejército profesional permanente llega después, con el Imperio Nuevo, tras la ocupación hicsa.", "en": "It dates from the 12th Dynasty, in the Middle Kingdom (c. 1981-1802 BC). The permanent professional army came later, with the New Kingdom, after the Hyksos occupation."}}, {"q": {"es": "¿Verdadero o falso? El khopesh es una espada curva de bronce.", "en": "True or false? The khopesh is a curved bronze sword."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 0, "explain": {"es": "Mide 57,5 cm y formaba parte del equipo del soldado del Imperio Nuevo junto al arco compuesto, la lanza corta y el escudo de madera reforzado con cuero.", "en": "It measures 57.5 cm and was part of the New Kingdom soldier's kit, alongside the composite bow, short spear and leather-reinforced wooden shield."}}, {"q": {"es": "¿Verdadero o falso? Estas piezas proceden del Metropolitan Museum de Nueva York.", "en": "True or false? These pieces are held in the Metropolitan Museum, New York."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 0, "explain": {"es": "Los modelos funerarios del Imperio Medio son una fuente indirecta sobre el armamento egipcio antes del ejército profesional.", "en": "Middle Kingdom funerary models are an indirect source on Egyptian weaponry before the professional army."}}, {"q": {"es": "¿Verdadero o falso? La corona azul la usaban los faraones del Imperio Nuevo en campaña.", "en": "True or false? The blue crown was worn by New Kingdom pharaohs on campaign."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 0, "explain": {"es": "El equipo incluía túnica de cuero con placas de bronce, protección de tiras de lino, arco compuesto, khopesh, lanza corta y escudos de madera o fibra vegetal.", "en": "The kit included a leather tunic with bronze plates, linen strip protection, composite bow, khopesh, short spear and wooden or plant-fibre shields."}}, {"q": {"es": "¿Verdadero o falso? Los luchadores de Beni Hasan competían con ropa de soldado y casco.", "en": "True or false? The Beni Hasan wrestlers competed in soldiers' clothing and helmets."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 1, "explain": {"es": "Competían desnudos salvo por un cinturón de tela, y las 219 parejas se distinguen por el color de la piel, marrón oscuro y claro, con proyecciones sobre el hombro, volteos de cadera y llaves de brazo.", "en": "They competed naked except for a cloth belt, and the 219 pairs are told apart by skin colour, dark and light brown, with shoulder throws, hip throws and arm locks."}}, {"q": {"es": "¿Verdadero o falso? Las tumbas de Beni Hasan pertenecen a nomarcas del Imperio Nuevo.", "en": "True or false? The Beni Hasan tombs belong to New Kingdom nomarchs."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 1, "explain": {"es": "Son del Imperio Medio (dinastías XI-XII, h. 2000 a. C.), de los príncipes del Nomo del Antílope. La lucha es el deporte más abundante en el registro egipcio.", "en": "They date from the Middle Kingdom (11th-12th Dynasties, c. 2000 BC), princes of the Antelope Nome. Wrestling is the most abundant sport in the Egyptian record."}}, {"q": {"es": "¿Verdadero o falso? La esgrima de bastón (tahtib) la practicaban exclusivamente soldados.", "en": "True or false? Stick fencing (tahtib) was practised exclusively by soldiers."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 0, "explain": {"es": "El faldellín militar aparece en todas las fuentes. Bastones de unos 100 cm con cazoleta, y protectores de cuero en frente, barbilla y antebrazo. También se celebraban combates rituales ante el faraón.", "en": "The military kilt appears in every source. Sticks of about 100 cm with a hand guard, and leather protectors on forehead, chin and forearm. Ritual bouts were also held before the pharaoh."}}, {"q": {"es": "¿Verdadero o falso? El boxeo está tan documentado en Egipto como la lucha.", "en": "True or false? Boxing is as well documented in Egypt as wrestling."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 1, "explain": {"es": "Su presencia es marginal: la única evidencia indiscutible son seis parejas de púgiles con los puños sin protección en la tumba de Kheruef, vestidos con faldellín de soldado.", "en": "Its presence is marginal: the only indisputable evidence is six pairs of bare-fisted boxers in the tomb of Kheruef, wearing soldiers' kilts."}}, {"q": {"es": "¿Verdadero o falso? Este ostracon muestra un combate de esgrima con palos entre dos soldados.", "en": "True or false? This ostracon shows a stick-fencing bout between two soldiers."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 0, "explain": {"es": "Caliza de 8,7 x 8,7 cm dibujada en negro y rojo, con dos soldados con coraza y faldellín (1295-1069 a. C.).", "en": "Limestone, 8.7 x 8.7 cm, drawn in black and red, with two soldiers in cuirass and kilt (1295-1069 BC)."}}, {"q": {"es": "¿Verdadero o falso? El relieve recoge tiro con arco, esgrima con palos y lucha.", "en": "True or false? The relief records archery, stick fencing and wrestling."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 0, "explain": {"es": "Los combates se celebraban en tres contextos: preparación militar, ceremonias en presencia del rey y cultos religiosos (Decker, 1992).", "en": "Bouts took place in three contexts: military training, ceremonies in the king's presence and religious cults (Decker, 1992)."}}, {"q": {"es": "¿Verdadero o falso? La carrera de la estela de Taharqa se corrió de un tirón, sin ningún descanso.", "en": "True or false? The race on the stela of Taharqa was run in one go, without any rest."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 1, "explain": {"es": "En el año 6 de Taharqa (h. 685 a. C.) las tropas de élite corrieron 50 km nocturnos en 4 horas, tuvieron un descanso reglamentario de 2 horas y cubrieron otros 50 km de vuelta.", "en": "In Taharqa's 6th year (c. 685 BC) the elite troops ran 50 km by night in 4 hours, had a compulsory 2-hour rest and covered another 50 km on the way back."}}, {"q": {"es": "¿Verdadero o falso? Las justas de pescadores tenían reglamento y árbitro.", "en": "True or false? Fishermen's jousts had rules and a referee."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 1, "explain": {"es": "No había reglamento ni árbitro; las reglas se pactaban sobre la marcha. El objetivo era hacer caer al agua a la tripulación contraria con las pértigas o el agarre directo.", "en": "There were no rules or referee; rules were agreed on the spot. The aim was to knock the rival crew into the water with poles or direct grappling."}}, {"q": {"es": "¿Verdadero o falso? La justa de pescadores era un pasatiempo de la aristocracia.", "en": "True or false? The fishermen's joust was a pastime of the aristocracy."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 1, "explain": {"es": "Pertenece al pueblo llano y es una de sus pocas prácticas documentadas, con dos a cuatro tripulaciones en canoas de papiro de tres a seis hombres cada una.", "en": "It belongs to the common people and is one of their few documented practices, with two to four crews in papyrus canoes of three to six men each."}}, {"q": {"es": "¿Verdadero o falso? El senet solo lo jugaban hombres.", "en": "True or false? Senet was played only by men."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 1, "explain": {"es": "Lo jugaban las élites de ambos sexos, y es la única práctica egipcia en la que la mujer aparece en igualdad con el hombre. Su nombre viene de snt, «pasar» o «cruzar», y el tablero tenía 30 casillas en tres filas de diez.", "en": "It was played by the elites of both sexes, and it is the only Egyptian practice in which women appear on an equal footing with men. Its name comes from snt, “to pass” or “to cross”, and the board had 30 squares in three rows of ten."}}, {"q": {"es": "¿Verdadero o falso? Para mover las fichas se usaban dados cúbicos.", "en": "True or false? Cubic dice were used to move the pieces."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 1, "explain": {"es": "Se sacaban palos o huesos de animal marcados con números de un saco. Las fichas avanzaban en zigzag de la casilla 1 a la 30.", "en": "Marked sticks or animal bones were drawn from a bag. Pieces advanced in a zigzag from square 1 to 30."}}, {"q": {"es": "¿Verdadero o falso? En la iconografía egipcia los juegos de pelota aparecen practicados casi exclusivamente por mujeres y niñas.", "en": "True or false? In Egyptian iconography ball games appear almost exclusively played by women and girls."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 0, "explain": {"es": "Juegos malabares, a caballito, pases rítmicos con palmadas o lanzamientos altos con recepciones acrobáticas.", "en": "Juggling, piggy-back games, rhythmic passes with clapping or high throws with acrobatic catches."}}, {"q": {"es": "¿Verdadero o falso? Las pelotas egipcias se hacían principalmente de cuerda apretada, cuero y lino.", "en": "True or false? Egyptian balls were mostly made of tightly wound cord, leather and linen."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 0, "explain": {"es": "Se han hallado numerosas pelotas en tumbas. El British Museum conserva una pelota-sonajero hueca de lino con piedrecillas dentro, de época romana.", "en": "Many balls have been found in tombs. The British Museum keeps a hollow linen rattle-ball with pebbles inside, from the Roman period."}}, {"q": {"es": "¿Verdadero o falso? El imperio aqueménida lo fundó Darío I en el 330 a. C.", "en": "True or false? The Achaemenid empire was founded by Darius I in 330 BC."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 1, "explain": {"es": "Lo fundó Ciro II en el 550 a. C., tras derrotar a los medos, y en tres generaciones se extendió del Egeo al Indo. El 330 a. C. marca, por el contrario, su final.", "en": "It was founded by Cyrus II in 550 BC, after defeating the Medes, and within three generations it stretched from the Aegean to the Indus. The year 330 BC marks, on the contrary, its end."}}, {"q": {"es": "¿Verdadero o falso? Del deporte persa antiguo se conservan descripciones escritas por los propios persas.", "en": "True or false? Descriptions of ancient Persian sport written by Persians themselves survive."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 1, "explain": {"es": "No se conserva ninguna, y las principales fuentes son griegas (Heródoto, Jenofonte y Estrabón). La más extensa sobre la educación persa es la Ciropedia de Jenofonte.", "en": "None survive, and the main sources are Greek (Herodotus, Xenophon and Strabo). The longest on Persian education is Xenophon's Cyropaedia."}}, {"q": {"es": "¿Verdadero o falso? En Persia la legitimidad del rey se demostraba con el cuerpo, a través del arco y la caza.", "en": "True or false? In Persia the king's legitimacy was shown through the body, by means of the bow and the hunt."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 0, "explain": {"es": "Ambas prácticas se ejecutan ante una multitud, exigen años de entrenamiento y su resultado depende solo del rey. Nadie le gana.", "en": "Both practices are performed before a crowd, require years of training and their outcome depends on the king alone. Nobody beats him."}}, {"q": {"es": "¿Verdadero o falso? Según Heródoto, los jóvenes persas aprendían a montar, disparar el arco y decir la verdad.", "en": "True or false? According to Herodotus, young Persians learned to ride, shoot the bow and tell the truth."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 0, "explain": {"es": "De los cinco a los veinte años; Estrabón alarga la formación hasta los veinticuatro. Según Jenofonte era masculina y obligatoria, asumida por el Estado.", "en": "From the age of five to twenty; Strabo extends training to twenty-four. According to Xenophon it was male and compulsory, run by the state."}}, {"q": {"es": "¿Verdadero o falso? El pahlavan es un luchador profesional que aparece en el mundo persa a partir del siglo X.", "en": "True or false? The pahlavan is a professional wrestler who appears in the Persian world from the tenth century."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 0, "explain": {"es": "«El campeón», que se gana la vida con su cuerpo, surge cuando ya no hay rey ni nobleza de a caballo a quienes servir y la vida se organiza en la ciudad y el bazar.", "en": "'The champion', who earns his living with his body, emerges once there is no king or mounted nobility to serve and life is organised around the city and the bazaar."}}, {"q": {"es": "¿Verdadero o falso? La puerta del zurkhaneh es deliberadamente baja para obligar a agacharse al entrar.", "en": "True or false? The zurkhaneh door is deliberately low so that one must bow to enter."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 0, "explain": {"es": "«La casa de fuerza» es una sala abovedada con foso central de arcilla, sin fachada ni carteles, en los callejones del bazar. La primera lección es de humildad.", "en": "'The house of strength' is a vaulted hall with a central clay pit, with no façade or signs, in the bazaar's alleys. The first lesson is humility."}}, {"q": {"es": "¿Verdadero o falso? En el zurkhaneh la sesión se ejecuta al ritmo de música en directo.", "en": "True or false? In the zurkhaneh the session is performed to live music."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 0, "explain": {"es": "Entre diez y veinte hombres siguen al atleta más consumado desde el centro del foso: calentamiento, tablones, flexiones al compás del tambor y volteo de mazas por detrás de los hombros.", "en": "Ten to twenty men follow the most accomplished athlete from the centre of the pit: warm-up, boards, push-ups to the drum and swinging clubs behind the shoulders."}}, {"q": {"es": "¿Verdadero o falso? El jereed es un deporte de jabalina a caballo para entrenar el ataque y la huida.", "en": "True or false? Jereed is a mounted javelin sport for training attack and retreat."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 0, "explain": {"es": "Desde el siglo XI. Dos equipos de ocho a diez jinetes; uno lanza y huye al galope mientras los rivales lo persiguen con jabalinas de madera sin punta.", "en": "From the eleventh century. Two teams of eight to ten riders; one throws and gallops off while rivals chase him with blunt wooden javelins."}}, {"q": {"es": "¿Verdadero o falso? El jereed es el antecesor directo del polo moderno.", "en": "True or false? Jereed is the direct ancestor of modern polo."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 1, "explain": {"es": "El antecesor del polo es el chovgan, deporte colectivo a caballo con pelota y taco consolidado en el periodo sasánida. El jereed es un juego de jabalina.", "en": "Polo's ancestor is chovgan, a mounted team game with ball and mallet consolidated in the Sasanian period. Jereed is a javelin game."}}, {"q": {"es": "¿Verdadero o falso? Fenicia llegó a constituir un Estado unificado con un solo rey.", "en": "True or false? Phoenicia became a unified state under a single king."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 1, "explain": {"es": "Fueron ciudades-estado independientes y a menudo rivales (Biblos, Sidón, Tiro), cada una con su rey, su flota y su moneda, aunque compartían lengua y religión.", "en": "They were independent and often rival city-states (Byblos, Sidon, Tyre), each with its own king, fleet and coinage, although they shared language and religion."}}, {"q": {"es": "¿Verdadero o falso? Cartago significa «ciudad vieja» en fenicio.", "en": "True or false? Carthage means “old city” in Phoenician."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 1, "explain": {"es": "Qart-ḥadašt significa «ciudad nueva». La fundaron colonos de Tiro, y hacia el 227 a. C. Asdrúbal fundó una segunda en la actual Cartagena, la Carthago Nova de los romanos.", "en": "Qart-ḥadašt means “new city”. It was founded by settlers from Tyre, and around 227 BC Hasdrubal founded a second one at present-day Cartagena, the Romans' Carthago Nova."}}, {"q": {"es": "¿Verdadero o falso? El alfabeto fue inventado por los fenicios.", "en": "True or false? The alphabet was invented by the Phoenicians."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 1, "explain": {"es": "Nació hacia 1800 a. C. entre trabajadores semitas de las minas del Sinaí. Los fenicios lo heredaron, lo fijaron en 22 signos consonánticos y lo difundieron por el Mediterráneo.", "en": "It arose around 1800 BC among Semitic workers in the Sinai mines. The Phoenicians inherited it, fixed it at 22 consonantal signs and spread it across the Mediterranean."}}, {"q": {"es": "¿Verdadero o falso? Los fenicios se guiaban en el mar por la Osa Mayor, igual que los griegos.", "en": "True or false? The Phoenicians steered by the Great Bear, like the Greeks."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 1, "explain": {"es": "Se guiaban por la Osa Menor, más próxima al polo y por tanto más estable que la Osa Mayor que usaban los griegos. La navegación fue su actividad por excelencia, como refleja esta nave de guerra sobre un hipocampo.", "en": "They steered by the Little Bear, closer to the pole and therefore steadier than the Great Bear used by the Greeks. Seafaring was their defining activity, as this warship above a hippocamp shows."}}, {"q": {"es": "¿Verdadero o falso? El trirreme Olympias reconstruido en 1987 llevaba 170 remeros en tres niveles.", "en": "True or false? The trireme Olympias, reconstructed in 1987, carried 170 rowers on three levels."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 0, "explain": {"es": "Arqueología experimental para contrastar a Tucídides: remos de 12 kg y turnos de remo y descanso. Tucídides decía que una nave cubría 340 km en 24 h a unos 14 km/h.", "en": "Experimental archaeology to test Thucydides: 12 kg oars and rowing and rest shifts. Thucydides said a ship covered 340 km in 24 h at about 14 km/h."}}, {"q": {"es": "¿Verdadero o falso? El pecio Mazarrón 2 se extrajo del agua en 2024, desmontado en 22 piezas.", "en": "True or false? The Mazarrón 2 wreck was lifted from the water in 2024, dismantled into 22 pieces."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 0, "explain": {"es": "Barco mercante costero de 8,15 m de eslora, fechado entre finales del siglo VII y el primer tercio del VI a. C., a cuarenta minutos de la facultad.", "en": "Coastal merchant vessel 8.15 m long, dated between the late seventh and the first third of the sixth century BC, forty minutes from the faculty."}}, {"q": {"es": "¿Verdadero o falso? Mazarrón 1 conserva el casco casi entero.", "en": "True or false? Mazarrón 1 preserves the hull almost complete."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 1, "explain": {"es": "De Mazarrón 1 (1988) se conserva sobre todo la quilla, de casi cuatro metros. El casco casi entero es el de Mazarrón 2 (1995).", "en": "Of Mazarrón 1 (1988) mainly the keel survives, nearly four metres long. The almost complete hull is Mazarrón 2 (1995)."}}, {"q": {"es": "¿Verdadero o falso? Kharayeb es el único conjunto que muestra cuerpos fenicios en actividad lúdica.", "en": "True or false? Kharayeb is the only assemblage showing Phoenician bodies at play."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 0, "explain": {"es": "16.400 fragmentos, con un 35 % de niños y un 22 % de mujeres. Entre los 2 y 4 años juegan con pájaros y perros; entre los 5 y 8 el perro es sustituido por una pelota.", "en": "16,400 fragments, 35 % children and 22 % women. Aged 2 to 4 they play with birds and dogs; aged 5 to 8 the dog is replaced by a ball."}}, {"q": {"es": "¿Verdadero o falso? Este objeto servía para lanzar jabalinas.", "en": "True or false? This object was used to throw javelins."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 1, "explain": {"es": "Es un estrígil, instrumento curvo para raspar el aceite y el sudor del cuerpo tras el ejercicio. Aparece entre los materiales de Kharayeb.", "en": "It is a strigil, a curved tool for scraping oil and sweat from the body after exercise. It appears among the Kharayeb material."}}, {"q": {"es": "¿Verdadero o falso? Las prácticas corporales femeninas fenicias están documentadas sobre todo en el ámbito funerario y ritual.", "en": "True or false? Phoenician women's bodily practices are documented mainly in funerary and ritual contexts."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 0, "explain": {"es": "Músicas, bailarinas y plañideras en procesiones y enterramientos. La pátera muestra una danza ritual femenina ante una diosa.", "en": "Musicians, dancers and mourners in processions and burials. The patera shows a female ritual dance before a goddess."}}, {"q": {"es": "¿Verdadero o falso? Entre las llaves pintadas en Beni Hasan abundan los puñetazos y los mordiscos.", "en": "True or false? Punches and bites are common among the holds painted at Beni Hasan."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 1, "explain": {"es": "Aparecen proyecciones sobre el hombro, volteos de cadera, tirones y zancadillas, mientras que faltan de forma sistemática los puñetazos, los mordiscos y las luxaciones severas, lo que apunta a un límite no escrito del combate (Decker, 1992).", "en": "The paintings show shoulder throws, hip throws, pulls and trips, whereas punches, bites and severe joint locks are systematically absent, which points to an unwritten limit on the fight (Decker, 1992)."}}, {"q": {"es": "¿Verdadero o falso? Egipto contó con un ejército profesional permanente desde el Imperio Antiguo.", "en": "True or false? Egypt had a permanent professional army from the Old Kingdom onwards."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 1, "explain": {"es": "El ejército profesional aparece a partir del Imperio Nuevo, tras la ocupación hicsa, y se convierte en el segundo gran productor de imágenes deportivas del registro egipcio después de la corte.", "en": "The professional army appears from the New Kingdom onwards, after the Hyksos occupation, and becomes the second great producer of sporting images in the Egyptian record after the court."}}, {"q": {"es": "¿Verdadero o falso? El análisis de carbono-14 sitúa Mazarrón 2 en el primer tercio del siglo VI a. C.", "en": "True or false? Carbon-14 analysis places Mazarrón 2 in the first third of the 6th century BC."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 0, "explain": {"es": "El barco apareció en 1995 con el casco casi entero y hoy se conserva en el Museo Nacional de Arqueología Subacuática, en Cartagena, mientras que de Mazarrón 1, hallado en 1988, queda sobre todo la quilla.", "en": "The boat was found in 1995 with its hull almost intact and is now kept in the National Museum of Underwater Archaeology in Cartagena, whereas mostly the keel survives of Mazarrón 1, found in 1988."}}, {"q": {"es": "¿Verdadero o falso? Está demostrado que el barco lo construyeron carpinteros fenicios.", "en": "True or false? It is proven that the boat was built by Phoenician carpenters."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 1, "explain": {"es": "La atribución sigue abierta: Negueruela lo lee como fenicio por el ensamblaje de mortaja y lengüeta, mientras que Pomey y Guerrero lo atribuyen a carpinteros locales que conocían esa técnica, de modo que documenta sobre todo un contacto técnico entre tradiciones.", "en": "The attribution remains open: Negueruela reads it as Phoenician because of its mortise-and-tenon joinery, whereas Pomey and Guerrero attribute it to local carpenters who knew that technique, so it mainly documents technical contact between traditions."}}, {"q": {"es": "¿Verdadero o falso? Las monedas y los cuencos de metal están entre las principales fuentes para conocer a los fenicios.", "en": "True or false? Coins and metal bowls are among the main sources for knowing the Phoenicians."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 0, "explain": {"es": "No se conserva ninguna descripción de actividad física escrita por un fenicio, y casi todo lo demás llega de griegos y romanos, que eran a la vez sus rivales comerciales.", "en": "No description of physical activity written by a Phoenician survives, and almost everything else comes from Greeks and Romans, who were also their commercial rivals."}}, {"q": {"es": "¿Verdadero o falso? Los bastones de la esgrima egipcia medían unos dos metros y los esgrimistas no llevaban ninguna protección.", "en": "True or false? Egyptian fencing sticks were about two metres long and fencers wore no protection at all."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 1, "explain": {"es": "Medían alrededor de un metro, con pequeñas guardias para proteger la mano, y los esgrimistas llevaban protectores de cuero en la frente, el mentón y el antebrazo (Decker, 1992).", "en": "They were about a metre long, with small guards to protect the hand, and fencers wore leather protectors on the forehead, chin and forearm (Decker, 1992)."}}, {"q": {"es": "¿Verdadero o falso? Además de servir a la instrucción militar, se celebraban combates rituales de esgrima ante el faraón que simbolizaban su regeneración.", "en": "True or false? Besides military training, ritual fencing bouts were held before the pharaoh to symbolise his regeneration."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 0, "explain": {"es": "Es el caso del combate que enmarca la erección del pilar Djed en el jubileo de Amenofis III, y Decker (1992) documenta también combates ofrecidos como parte del ceremonial ante embajadores extranjeros.", "en": "One example is the bout that frames the raising of the Djed pillar at the jubilee of Amenhotep III, and Decker (1992) also documents bouts staged as part of the ceremonial before foreign ambassadors."}}, {"q": {"es": "¿Verdadero o falso? El kabbadeh es un arco de hierro con anillas que se balancea durante la sesión.", "en": "True or false? The kabbadeh is an iron bow with rings that is swung during the session."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 0, "explain": {"es": "Forma parte de un orden fijo, con calentamiento, tablones, flexiones al compás del tambor, mazas, giro sobre sí mismo y kabbadeh, y la lucha cerraba la sesión.", "en": "It belongs to a fixed sequence of warm-up, boards, push-ups to the drum, clubs, spinning and kabbadeh, and wrestling closed the session."}}, {"q": {"es": "¿Verdadero o falso? En el zurkhaneh cada atleta hace las flexiones a su propio ritmo y sin música.", "en": "True or false? In the zurkhaneh each athlete does push-ups at his own pace and without music."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 1, "explain": {"es": "Se hacen al compás del tambor, y toda la sesión la dirige desde el centro del foso el atleta más consumado de la casa, al ritmo de la música en directo.", "en": "They are done to the beat of the drum, and the whole session is led from the centre of the pit by the most accomplished athlete of the house, to live music."}}, {"q": {"es": "¿Verdadero o falso? La lucha que cerraba la sesión se hacía delante de todos para que la derrota fuera pública.", "en": "True or false? The wrestling that closed the session was held in front of everyone so that defeat would be public."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 1, "explain": {"es": "Se practicaba en parejas apartadas del resto, y a menudo se separaba a los contendientes antes de la proyección decisiva para ahorrar a uno de ellos la humillación de perder (Krawietz, 2013).", "en": "It was practised in pairs away from the others, and the contenders were often separated before the decisive throw to spare one of them the humiliation of losing (Krawietz, 2013)."}}, {"q": {"es": "¿Verdadero o falso? La Piedra Rosetta contiene tres textos distintos, uno en cada escritura.", "en": "True or false? The Rosetta Stone contains three different texts, one in each script."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 1, "explain": {"es": "Reproduce un mismo decreto sacerdotal en jeroglífico, demótico y griego, y esa triple redacción del mismo texto es la que permitió a Champollion descifrar la escritura egipcia en 1822.", "en": "It reproduces a single priestly decree in hieroglyphic, Demotic and Greek, and that triple version of the same text is what allowed Champollion to decipher Egyptian writing in 1822."}}, {"q": {"es": "¿Verdadero o falso? Los egipcios fechaban los acontecimientos con una era continua, como nuestro calendario.", "en": "True or false? The Egyptians dated events using a continuous era, as our calendar does."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 1, "explain": {"es": "Fechaban por año de reinado del monarca, de modo que la cronología se reconstruye sumando reinados a partir de las listas reales.", "en": "They dated by the regnal year of the king, so the chronology is reconstructed by adding up reigns from the king lists."}}, {"q": {"es": "¿Verdadero o falso? La iconografía es la fuente más abundante sobre el deporte egipcio.", "en": "True or false? Iconography is the most abundant source on Egyptian sport."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 0, "explain": {"es": "Reúne cerca de dos mil escenas catalogadas en relieves y pinturas de tumba, aunque casi todas proceden de tumbas de la aristocracia, que decidía qué quedaba registrado.", "en": "It comprises some two thousand catalogued scenes in reliefs and tomb paintings, although almost all come from aristocratic tombs, whose owners decided what was recorded."}}, {"q": {"es": "¿Verdadero o falso? El egipcio antiguo tenía una palabra general equivalente a «deporte».", "en": "True or false? Ancient Egyptian had a general word equivalent to “sport”."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 1, "explain": {"es": "No hay un término general atestiguado, y el más cercano, sejeméj-ib, significa «hacer que el corazón olvide» y designa la diversión (Cannuyer, 2002, citado en Decker, 2021).", "en": "No general term is attested, and the closest, sekhemekh-ib, means “to make the heart forget” and refers to amusement (Cannuyer, 2002, cited in Decker, 2021)."}}, {"q": {"es": "¿Verdadero o falso? Los púgiles de la tumba de Kheruef visten el faldellín de los soldados.", "en": "True or false? The boxers in the tomb of Kheruef wear the soldiers' kilt."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 0, "explain": {"es": "Son seis parejas a puño desnudo, y Decker (1992) observa que varias posturas copian a los danzantes pintados enfrente, de lo que deduce que el artista no conocía bien el pugilato.", "en": "There are six bare-fisted pairs, and Decker (1992) notes that several postures copy the dancers painted opposite, from which he infers that the artist did not know boxing well."}}, {"q": {"es": "¿Verdadero o falso? Entre los juegos de pelota egipcios se documentan malabares con hasta tres bolas.", "en": "True or false? Juggling with up to three balls is among the documented Egyptian ball games."}, "o": [{"es": "Verdadero", "en": "True"}, {"es": "Falso", "en": "False"}], "a": 0, "explain": {"es": "El catálogo incluye también el juego a caballito con lanzamientos entre parejas montadas, los pases rítmicos con palmadas y los lanzamientos altos recogidos en el aire, a veces sobre una sola pierna.", "en": "The repertoire also includes piggyback games with throws between mounted pairs, rhythmic passes with hand-claps and high throws caught in the air, sometimes standing on one leg."}}, {"q": {"es": "¿Qué significa «Ma'at»?", "en": "What does \"Ma'at\" mean?"}, "o": [{"es": "Orden cósmico del que el faraón es garante.", "en": "Cosmic order of which the pharaoh is the guarantor."}, {"es": "Enfrentamiento entre tripulaciones de canoas de papiro para hacer caer al agua a los rivales, sin reglamento ni árbitro.", "en": "Contest between papyrus-canoe crews to knock rivals into the water, with no rules or referee."}, {"es": "Instrumento curvo para raspar aceite y sudor del cuerpo tras el ejercicio.", "en": "Curved tool for scraping oil and sweat from the body after exercise."}], "a": 0}, {"q": {"es": "¿Qué significa «Akhet, Peret, Shemu»?", "en": "What does \"Akhet, Peret, Shemu\" mean?"}, "o": [{"es": "Las tres estaciones egipcias: inundación, siembra y cosecha.", "en": "The three Egyptian seasons: flood, sowing and harvest."}, {"es": "Recinto palaciego donde se criaban y educaban los príncipes y los hijos de la alta nobleza, incluida la instrucción física.", "en": "Palace enclosure where princes and sons of the high nobility were raised and educated, including physical training."}, {"es": "«Casa de fuerza»: gimnasio abovedado con foso central en el bazar donde se entrena al ritmo de la música.", "en": "'House of strength': vaulted gymnasium with a central pit in the bazaar where training follows live music."}], "a": 0}, {"q": {"es": "¿Qué significa «Nomarca»?", "en": "What does \"Nomarch\" mean?"}, "o": [{"es": "Gobernador de provincia que gana autonomía cuando el poder central se debilita.", "en": "Provincial governor who gains autonomy when central power weakens."}, {"es": "Prueba safávida de larga distancia para escoger mensajeros reales: traer doce flechas, una a una, desde un pilar lejano al palacio de Isfahán.", "en": "Safavid long-distance test for choosing royal messengers: fetching twelve arrows, one by one, from a distant pillar to the palace of Isfahan."}, {"es": "«Caballos»: nombre griego de las naves fenicias con mascarón de proa en forma de cabeza de caballo.", "en": "'Horses': Greek name for Phoenician ships with a horse-head figurehead."}], "a": 0}, {"q": {"es": "¿Qué significa «Śḫmḫ-ib (sejeméj-ib)»?", "en": "What does \"Śḫmḫ-ib (sekhemekh-ib)\" mean?"}, "o": [{"es": "«Divertir el corazón» o «hacer olvidar al corazón»: concepto egipcio próximo a lo que hoy llamamos deporte.", "en": "'To delight the heart' or 'to make the heart forget': Egyptian concept close to what we now call sport."}, {"es": "Pueblo cuya ocupación de Egipto en el Segundo Periodo Intermedio provocó la creación del ejército profesional.", "en": "People whose occupation of Egypt in the Second Intermediate Period prompted the creation of the professional army."}, {"es": "Orden cósmico del que el faraón es garante.", "en": "Cosmic order of which the pharaoh is the guarantor."}], "a": 0}, {"q": {"es": "¿Qué significa «Victor perpetuus»?", "en": "What does \"Victor perpetuus\" mean?"}, "o": [{"es": "Principio por el que el faraón es siempre vencedor por definición teológica; compite solo, sin rival.", "en": "Principle whereby the pharaoh is always victorious by theological definition; he competes alone, without a rival."}, {"es": "Santuario del interior de Tiro con 16.400 fragmentos de terracota, único conjunto de cuerpos fenicios en actividad lúdica.", "en": "Sanctuary inland from Tyre with 16,400 terracotta fragments, the only assemblage of Phoenician bodies at play."}, {"es": "Enfrentamiento entre tripulaciones de canoas de papiro para hacer caer al agua a los rivales, sin reglamento ni árbitro.", "en": "Contest between papyrus-canoe crews to knock rivals into the water, with no rules or referee."}], "a": 0}, {"q": {"es": "¿Qué significa «Pharao ludens»?", "en": "What does \"Pharao ludens\" mean?"}, "o": [{"es": "Concepto acuñado por Erik Hornung (1982) para un soberano cuya función se ejerce, en parte, jugando.", "en": "Concept coined by Erik Hornung (1982) for a ruler whose office is exercised, in part, through play."}, {"es": "Enfrentamiento entre tripulaciones de canoas de papiro para hacer caer al agua a los rivales, sin reglamento ni árbitro.", "en": "Contest between papyrus-canoe crews to knock rivals into the water, with no rules or referee."}, {"es": "Pueblo cuya ocupación de Egipto en el Segundo Periodo Intermedio provocó la creación del ejército profesional.", "en": "People whose occupation of Egypt in the Second Intermediate Period prompted the creation of the professional army."}], "a": 0}, {"q": {"es": "¿Qué significa «Heb-Sed»?", "en": "What does \"Heb-Sed\" mean?"}, "o": [{"es": "Fiesta de jubileo que renueva el poder del faraón; su elemento central es la carrera real.", "en": "Jubilee festival renewing the pharaoh's power; its central element is the royal run."}, {"es": "Santuario del interior de Tiro con 16.400 fragmentos de terracota, único conjunto de cuerpos fenicios en actividad lúdica.", "en": "Sanctuary inland from Tyre with 16,400 terracotta fragments, the only assemblage of Phoenician bodies at play."}, {"es": "«Ciudad nueva» en fenicio: nombre de Cartago y de la actual Cartagena.", "en": "'New city' in Phoenician: the name of Carthage and of present-day Cartagena."}], "a": 0}, {"q": {"es": "¿Qué significa «Pilar Djed»?", "en": "What does \"Djed pillar\" mean?"}, "o": [{"es": "Pilar que el faraón erige durante el ceremonial del Heb-Sed.", "en": "Pillar the pharaoh raises during the Heb-Sed ceremonial."}, {"es": "Dos barcos mercantes fenicios hallados en la playa de la Isla (1988 y 1995); Mazarrón 2 se extrajo en 2024.", "en": "Two Phoenician merchant ships found at Playa de la Isla (1988 and 1995); Mazarrón 2 was lifted in 2024."}, {"es": "Prueba safávida de larga distancia para escoger mensajeros reales: traer doce flechas, una a una, desde un pilar lejano al palacio de Isfahán.", "en": "Safavid long-distance test for choosing royal messengers: fetching twelve arrows, one by one, from a distant pillar to the palace of Isfahan."}], "a": 0}, {"q": {   { y: -2000, add: [], req: ['cuarteles:2'], rival: R_ED('Beni Hasan', 'Beni Hasan', 6), slide: 31, tags: ['lucha'],

  { y: -1650, add: [], req: ['cuarteles:2', 'kap:2'], rival: R_ED('Los hicsos', 'The Hyksos', 6), slide: 9, tags: ['ejercito', 'carro', 'arco'],

  { y: -1549, add: ['tiro'], req: ['galeria_tiro'], rival: R_ED('Los hicsos', 'The Hyksos', 7), slide: 21, tags: ['arco', 'ejercito'],

  { y: -1464, add: [], req: ['dyeser:2'], rival: R_ED('Los asiáticos', 'The Asiatics', 7), slide: 19, tags: ['mujeres', 'hebsed'],

  { y: -1428, add: ['carro'], req: ['esfinge', 'kap:3'], rival: R_ED('Los asiáticos', 'The Asiatics', 8), slide: 22, tags: ['faraon', 'arco', 'carro'],

    choice: [{ t: { es: 'Disparar contra la diana del rey', en: 'Shoot at the king\'s target' }, glory: 0, res: { es: 'Los presentes comenzaron a disparar sin éxito, reconociendo el poder real. Es la única excepción en tres milenios, y aun así confirma el dogma de la imbatibilidad del rey (diap. 22).', en: 'Those present began to shoot without success, acknowledging the royal power. It is the only exception in three millennia, and even so it confirms the dogma of the king\'s invincibility (slide 22).' } },
      { t: { es: 'Reconocer la marca del rey', en: 'Acknowledge the king\'s mark' }, glory: 5, res: { es: 'La marca sirve para que el rey, y nadie más, demuestre ante testigos que su fuerza sigue intacta. Decker y Klauck (1974) comprobaron que las flechas solo penetran unos milímetros en el cobre: el récord es falso, si bien atestigua una mentalidad de récord (diap. 22).', en: 'The mark serves for the king, and no one else, to show before witnesses that his strength is intact. Decker and Klauck (1974) found that arrows penetrate copper only a few millimetres: the record is false, although it attests a record mentality (slide 22).' } }] },
  { y: -1360, add: ['boxeo'], req: [], rival: R_ED('Nubia', 'Nubia', 8), slide: 34, tags: ['lucha', 'ejercito'],

  { y: -1279, add: [], req: ['dyeser:3'], rival: R_ED('Los asiáticos', 'The Asiatics', 9), slide: 18, tags: ['hebsed', 'faraon'],

  { y: -1170, add: [], req: ['sahure:2', 'kap:3'], rival: R_ED('Libia', 'Libya', 10), slide: 35, tags: ['templo', 'esgrima', 'arco'],

  { y: -685, add: ['fondo'], req: ['cuarteles:3', 'estela_taharqa'], rival: R_ED('Nubia', 'Nubia', 11), slide: 36, tags: ['carrera', 'ejercito'],

  { y: -332, add: [], req: ['gran_piramide'], rival: R_ED('Macedonia', 'Macedonia', 12), slide: 9, tags: ['politica', 'faraon'],

const TW = 64, TH = TW * 0.6;

    if (D.prod) { const cap = D.prod.cap[b.lv - 1]; if (b.store < cap) { b.store = Math.min(cap, b.store + D.prod.rate[b.lv - 1] * (D.sacred ? 1 + bon('temple') : 1) * dt); ch = true; } }

function startPlace(p) {

  let x = Math.max(0, Math.min(N - w, c.x - (w >> 1))), y = Math.max(0, Math.min(N - 3 - h, c.y - (h >> 1)));
  if (p.move == null && !p.decor && PLOTS[p.k] && free(PLOTS[p.k][0], PLOTS[p.k][1], w, h)) { x = PLOTS[p.k][0]; y = PLOTS[p.k][1]; }
  else if (p.move == null) { // spiral search for the nearest free spot (as in CoC, the new building appears where it fits)
    outer: for (let r = 0; r < N; r++) for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue; const xx = x + dx, yy = y + dy;
      if (xx >= 0 && yy >= 0 && xx + w <= N && yy + h <= N && free(xx, yy, w, h)) { x = xx; y = yy; break outer; } }
  }
  PLACE = Object.assign({ x, y }, p);
  $('#plTxt').textContent = L('Arrastra o toca para colocar', 'Drag or tap to place'); $('#placebar').classList.add('on'); document.body.classList.add('placing'); redraw();
}

function trainLv(kind) { const b = S.buildings.find(b => BUILDINGS[b.k].train && BUILDINGS[b.k].train.kind === kind); return b ? b.lv : 0; }
// Sede de cada prueba (ev.venue); si aún no existe, una sede provisional (ev.alt, por ejemplo en Olimpia la pista junto al altar, diap. 40-41) que puntúa menos
function venueOf(ev) { if (!lvOf(ev.venue) && ev.alt && lvOf(ev.alt)) return { k: 'alt', lv: 1, m: .75, name: ev.altName }; const lv = Math.max(1, lvOf(ev.venue)); const V = BUILDINGS[ev.venue].venue; return { k: ev.venue, lv, m: V ? V[lv - 1] : [1, 1.5, 2][lv - 1] || 1 }; }
function canHold(ev) { return lvOf(ev.venue) >= 1 || (!!ev.alt && lvOf(ev.alt) >= 1); }
function needTxt(ev) { return L('Necesita ', 'Needs ') + T(BUILDINGS[ev.venue].name) + (ev.alt ? L(' o ', ' or ') + T(BUILDINGS[ev.alt].name) : ''); }
function athleteBonus(ev) { const a = readyA(ev.need[0])[0]; return a ? a.lv - 1 : 0; }
function myPower(ev) { const tl = trainLv(ev.need[0]); const v = venueOf(ev); return 2 + 2 * tl + (v.lv - 1) + athleteBonus(ev) + legendsFor(ev).reduce((a, l) => a + l.b, 0) + (ev.bonus || 0); } // ev.bonus: ventaja fija de algunas pruebas (en Olimpia, caballos y carros de élite, diap. 90)
function evQuestion(ev) {
  const fb = (BUILDINGS[ev.venue].q || [])[0];
  if (!ev.year || ev.noYearQ) return pickQ(ev.qtags || [ev.k, ev.venue], fb);
  const others = shuffle(EVENTS.filter(e => e.year && e.year !== ev.year)).slice(0, 2); const yy = e => (e.ad || (e.y != null && e.y > 0)) ? { es: e.year + ' d. C.', en: 'AD ' + e.year } : { es: e.year + ' a. C.', en: e.year + ' BC' };
  return { q: CITY.tx.evYearQ(ev), slide: ev.slide, o: [yy(ev), ...others.map(yy)], a: 0, explain: ev.fact };
}
const fmtY = y => y < 0 ? L(-y + ' a. C.', -y + ' BC') : L(y + ' d. C.', 'AD ' + y);
function edNow() { return EDITIONS[Math.min(S.ol.i, EDITIONS.length - 1)]; }
function inProgram(ev, E) { return ev.y != null && ev.y <= E.y && (ev.until == null || E.y <= ev.until); }
function programDone(ev) { const d = S.ol.i - 1; return d < 0 ? ev.k === EVENTS[0].k : ev.y != null && ev.y <= EDITIONS[Math.min(d, EDITIONS.length - 1)].y; }

async function runGames(list, ctx) {

// ---------- examen de Olimpia: 12 preguntas, primero las falladas ----------
async function exam() {
  const failed = QB.filter(q => S.srs && S.srs[q.id] && S.srs[q.id].box === 0);
  const greek = QB.filter(q => !q.gen && (!CITY.examFilter || CITY.examFilter(q)));
  const pool = shuffle(failed).slice(0, 6); while (pool.length < 12) { const q = greek[Math.floor(Math.random() * greek.length)]; if (!pool.includes(q)) pool.push(q); }
  let ok = 0; for (let i = 0; i < pool.length; i++) if (await ask(pool[i], { head: X('examName') + ` · ${i + 1}/12` })) ok++;
  const pass = ok >= 9; if (pass && !S.exam) { S.exam = 1; happXP(100); }
  sfx(pass ? 'win' : 'bad');
  modal(`<h2>${pass ? L('¡Aprobado!', 'Passed!') : L('Casi', 'Almost')}</h2><p class="role">${ok}/12 ${L('aciertos', 'correct')}. ${pass ? X('examPass') : L('Hacen falta 9. Las que has fallado volverán en el repaso.', 'You need 9. The ones you missed will come back in your review.')}</p>`);
  objectiveCheck(); dirty();
}

function onTap(vx, vy) {

  const t = viewToTile(vx, vy);
  if (PLACE) { const [w, h] = PLACE.decor ? [1, 1] : BUILDINGS[PLACE.k].foot; PLACE.x = Math.max(0, Math.min(N - w, t.x - (w >> 1))); PLACE.y = Math.max(0, Math.min(N - h, t.y - (h >> 1))); redraw(); return; }

  const dd = dAt(t.x, t.y);
  if (dd && (dd.label || dd.k === 'zan')) return decorInfo(dd);
  let b = bAt(t.x, t.y);
  if (!b) { let best = null, bd = 1e9; for (const o of S.buildings) { const [w, h] = BUILDINGS[o.k].foot; const c = worldToView(...Object.values(gridToScreen(o.x + w / 2, o.y + h / 2))); const d = Math.hypot(c.x - vx, c.y - 20 * CAM.z - vy); if (d < bd) { bd = d; best = o; } } if (bd < 50 * CAM.z) b = best; }
  if (b) { const D = BUILDINGS[b.k]; if (D.prod && b.lv && !b.busy && b.store >= 10 && !(TUT && TSTEPS[TUT.i].panel)) return collect(b); return openBuilding(b); }

function dragStart(vx, vy) {

}
