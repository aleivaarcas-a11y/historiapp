<script>
/* Guardar y salir a Historiapp. Común a todos los juegos de la app; lo inserta guardar_salir.py.
   Configuración en window.HAPP_GS = { volver, pos, fijo, visible }.
   - El juego define window.HAPP_GUARDAR() con lo que haya que guardar de la partida en curso.
   - Se guarda al pulsar el botón y también al salir de la página por cualquier otra vía (pagehide y
     visibilitychange), de modo que el progreso no se pierde aunque se cierre la app.
   - window.HAPP_SALIR(href) guarda, avisa y vuelve a Historiapp; los botones propios del juego lo usan. */
(function () {
  'use strict';
  var C = window.HAPP_GS || {};

  /* ---------- Sonido y pausa (revisión del 13-10-2026) ----------
     - Se anotan todos los AudioContext que crea el juego para poder despertarlos y dormirlos.
     - En iPhone el sonido solo arranca dentro de un toque «completo» (touchend o click), y tras salir de la app
       el contexto queda «interrumpido» y el juego ya no suena: se reanuda en cualquier toque posterior.
     - Con audioSession 'playback' (iPhone con iOS 16.4 o posterior) el juego suena aunque el móvil esté en silencio.
     - Al ocultar la app (bloquear el móvil, cambiar de app) se pausa el juego (HAPP_PAUSA o el evento blur que ya
       escuchan los juegos), se duerme el sonido y se paran las músicas; al volver, se reanudan. */
  var ctxs = [], oculto = false, dormidos = [], parados = [];
  try {
    var AC0 = window.AudioContext || window.webkitAudioContext;
    if (AC0 && !AC0.__happ) {
      var ACW = function (o) { var c = o === undefined ? new AC0() : new AC0(o); ctxs.push(c); return c; };
      ACW.prototype = AC0.prototype; ACW.__happ = true;
      window.AudioContext = ACW; if (window.webkitAudioContext) window.webkitAudioContext = ACW;
    }
  } catch (e) {}
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  function despertar() {
    if (oculto) return;
    ctxs.forEach(function (c) { try { if (c.state === 'suspended' || c.state === 'interrupted') c.resume(); } catch (e) {} });
  }
  ['touchend', 'click', 'pointerup', 'keydown'].forEach(function (ev) { addEventListener(ev, despertar, { capture: true, passive: true }); });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') {
      if (oculto) return; oculto = true;
      try { if (typeof window.HAPP_PAUSA === 'function') window.HAPP_PAUSA(); else window.dispatchEvent(new Event('blur')); } catch (e) {}
      ctxs.forEach(function (c) { try { if (c.state === 'running') { c.suspend(); dormidos.push(c); } } catch (e) {} });
      try { document.querySelectorAll('audio,video').forEach(function (m) { if (!m.paused) { try { m.pause(); parados.push(m); } catch (e) {} } }); } catch (e) {}
    } else {
      oculto = false;
      dormidos.splice(0).forEach(function (c) { try { c.resume(); } catch (e) {} });
      parados.splice(0).forEach(function (m) { try { var r = m.play(); if (r && r.catch) r.catch(function () {}); } catch (e) {} });
    }
  });
  var lang = null;
  try { lang = localStorage.getItem('historiapp.lang'); } catch (e) {}
  if (lang !== 'es' && lang !== 'en') lang = String(document.documentElement.lang || navigator.language || 'es').slice(0, 2) === 'en' ? 'en' : 'es';
  var TX = lang === 'en'
    ? { b: 'Save & exit', a: 'Save the game and go back to Historiapp', ok: 'Game saved' }
    : { b: 'Guardar y salir', a: 'Guardar la partida y volver a Historiapp', ok: 'Partida guardada' };
  window.HAPP_GS_TX = TX;
  function guardar() { try { if (typeof window.HAPP_GUARDAR === 'function') window.HAPP_GUARDAR(); } catch (e) {} }
  var yendo = false, aviso = null;
  function salir(href) {
    if (yendo) return; yendo = true;
    guardar();
    if (aviso) aviso.classList.add('on');
    var v = href || (typeof C.volver === 'function' ? C.volver() : C.volver) || '../';
    setTimeout(function () { location.href = v; }, 500);
  }
  window.HAPP_SALIR = salir;
  addEventListener('pagehide', guardar);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') guardar(); });
  var css = '.hgs{position:fixed;z-index:2147482999;display:none;align-items:center;gap:6px;min-height:40px;margin:0;padding:0 13px;border-radius:20px;' +
    'background:rgba(12,10,8,.76);color:#fff;border:1px solid rgba(255,255,255,.5);font:600 13px/1 system-ui,-apple-system,"Segoe UI",sans-serif;' +
    'box-shadow:0 3px 10px rgba(0,0,0,.35);cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;white-space:nowrap}' +
    '.hgs.on{display:inline-flex}.hgs:active{transform:translateY(1px)}' +
    '.hgs-ok{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(.9);opacity:0;z-index:2147483003;pointer-events:none;padding:12px 22px;border-radius:24px;' +
    'background:#EDAB00;color:#1b1406;font:700 17px/1 system-ui,-apple-system,"Segoe UI",sans-serif;box-shadow:0 6px 18px rgba(0,0,0,.45);transition:opacity .2s,transform .2s}' +
    '.hgs-ok.on{opacity:1;transform:translate(-50%,-50%) scale(1)}';
  function build() {
    var st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
    aviso = document.createElement('div'); aviso.className = 'hgs-ok'; aviso.setAttribute('role', 'status'); aviso.textContent = '✓ ' + TX.ok; document.body.appendChild(aviso);
    if (C.fijo === false) return;
    var b = document.createElement('button'); b.type = 'button'; b.className = 'hgs';
    b.innerHTML = '<span aria-hidden="true">💾</span><span>' + TX.b + '</span>'; b.setAttribute('aria-label', TX.a); b.title = TX.a;
    var pos = C.pos || { top: 'max(8px, env(safe-area-inset-top))', right: 'max(10px, env(safe-area-inset-right))' };
    for (var k in pos) b.style[k] = pos[k];
    ['pointerdown', 'touchstart', 'mousedown'].forEach(function (ev) { b.addEventListener(ev, function (e) { e.stopPropagation(); }, { passive: true }); });
    b.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); salir(); });
    document.body.appendChild(b);
    var ver = function () { var on = true; try { on = !C.visible || !!C.visible(); } catch (e) {} b.classList.toggle('on', on); };
    ver(); setInterval(ver, 300);
  }
  if (document.body) build(); else document.addEventListener('DOMContentLoaded', build);

  /* ---------- Giro de pantalla (13-10-2026) ----------
     En algunos Android e iPhone el aviso de girar desaparece pero el juego queda mal dibujado o en blanco:
     el navegador lanza el evento resize antes de dar las medidas definitivas y el juego se dibuja con las viejas.
     1. Se limita la densidad de píxeles a 2 (en pantallas de 3 los lienzos ocupan más del doble de memoria
        y algunos móviles recargan o cuelgan la página al girar).
     2. Tras cada giro se vuelve a avisar al juego del cambio de tamaño cuando las medidas ya son las buenas.
     3. Si el juego se abrió en la orientación equivocada (C.orient 'h' o 'v'), al ponerlo en la buena se recarga
        una vez, con la partida guardada antes, para que arranque con las medidas correctas. */
  try { if ((window.devicePixelRatio || 1) > 2) Object.defineProperty(window, 'devicePixelRatio', { get: function () { return 2; }, configurable: true }); } catch (e) {}
  var portrait = function () { return window.innerHeight > window.innerWidth; };
  var buena = function () { return !C.orient || (C.orient === 'h' ? !portrait() : portrait()); };
  var malAlCargar = !!C.orient && !buena();
  var avisando = false, giroT = [], ultimo = '';
  function avisar() {
    var m = window.innerWidth + 'x' + window.innerHeight;
    avisando = true;
    try { window.dispatchEvent(new Event('resize')); } catch (e) {}
    try { if (window.visualViewport) window.visualViewport.dispatchEvent(new Event('resize')); } catch (e) {}
    avisando = false;
    ultimo = m;
  }
  function recargarSiHaceFalta() {
    if (!malAlCargar || !buena()) return;
    var k = 'happ.giro.' + location.pathname, ahora = Date.now(), antes = 0;
    try { antes = +sessionStorage.getItem(k) || 0; } catch (e) {}
    if (ahora - antes < 20000) return;
    try { sessionStorage.setItem(k, String(ahora)); } catch (e) {}
    malAlCargar = false; guardar(); location.reload();
  }
  function giro() {
    if (avisando) return;
    giroT.forEach(clearTimeout);
    giroT = [120, 350, 700, 1200].map(function (t, i, a) {
      return setTimeout(function () { avisar(); if (i === a.length - 1) recargarSiHaceFalta(); }, t);
    });
  }
  addEventListener('orientationchange', giro);
  addEventListener('resize', function () { if (!avisando) giro(); });
  try { if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', giro); } catch (e) {}
  addEventListener('pageshow', function (e) { if (e.persisted) giro(); });

  /* ---------- Orientación bloqueada y zoom (13-10-2026) ----------
     4. Historiapp instalada en Android hereda la orientación vertical de la app: aunque el alumno gire el móvil,
        la pantalla no gira y el aviso de girar no se va. Dentro de la app instalada, el juego pide su orientación
        con screen.orientation.lock (Android lo permite en apps instaladas; iPhone no lo necesita).
     5. iPhone agranda la letra al poner el móvil en horizontal y amplía la pantalla al tocar un campo de texto
        con letra de menos de 16 px; como los juegos no dejan pellizcar, la pantalla se quedaba grande.
        Se fija el tamaño de letra, los campos pasan a 16 px y el zoom vuelve a 1 al salir del campo o al girar. */
  function bloquear() {
    if (!C.orient) return;
    try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock(C.orient === 'h' ? 'landscape' : 'portrait').catch(function () {}); } catch (e) {}
  }
  bloquear();
  addEventListener('pointerdown', bloquear, { capture: true, passive: true, once: true });
  addEventListener('pageshow', bloquear);
  addEventListener('pagehide', function () { try { screen.orientation.unlock(); } catch (e) {} });
  var vm = document.querySelector('meta[name="viewport"]'), vmBase = vm ? vm.getAttribute('content') : '';
  function sinZoom() {
    if (!vm || (window.visualViewport && Math.abs(window.visualViewport.scale - 1) < 0.01)) return;
    vm.setAttribute('content', vmBase.replace(/,?\s*maximum-scale=[^,]*/g, '') + ',maximum-scale=1');
    setTimeout(function () { vm.setAttribute('content', vmBase); }, 400);
  }
  document.addEventListener('focusout', function (e) { var t = e.target && e.target.tagName; if (t === 'INPUT' || t === 'SELECT' || t === 'TEXTAREA') setTimeout(sinZoom, 60); }, true);
  addEventListener('orientationchange', function () { setTimeout(sinZoom, 400); });
  var st2 = document.createElement('style');
  st2.textContent = 'html{-webkit-text-size-adjust:100%!important;text-size-adjust:100%!important}@media (pointer:coarse){input,select,textarea{font-size:16px!important}}';
  (document.head || document.documentElement).appendChild(st2);
})();
</script>

:root{--ink:#2b1d0e;--paper:#f6ecd6;--gold:#e0a83a;--gold2:#a8701c;--red:#b8442f;--blue:#3f6f95;--gfont:Lilita,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#b9ad93;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
#map{position:fixed;inset:0;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:6px;padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) 0 max(8px,env(safe-area-inset-left));pointer-events:none;z-index:5}
.res{display:flex;flex-wrap:wrap;gap:6px;pointer-events:auto}
.chip{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 10px 0 4px;border-radius:17px;background:linear-gradient(#3b2a18,#21170c);color:#ffe9b0;border:2px solid #c99a3c;box-shadow:0 2px 0 #0006;font:16px/1 var(--gfont)}
.chip i{font-style:normal;width:26px;height:26px;border-radius:13px;background:#f3e2b5;display:grid;place-items:center;font-size:15px}
.chip small{font:11px/1 system-ui;opacity:.8}
.tbtn{display:flex;gap:6px;pointer-events:auto;align-items:center}
.ib{min-width:44px;height:44px;border-radius:12px;background:linear-gradient(#f6ecd6,#dcc79c);border:2px solid #7b5a2b;box-shadow:0 3px 0 #5b3f1a;font:17px var(--gfont)}
.happSave{display:inline-flex;align-items:center;gap:5px;min-height:44px;padding:0 12px;border-radius:12px;background:linear-gradient(#3a2a18,#1d140b);color:#ffe9b0;border:2px solid #c99a3c;font:15px/1 var(--gfont);box-shadow:0 3px 0 #000a}
@media (max-width:520px){.happSave span{display:none}.chip small{display:none}}
.obj{position:fixed;left:max(8px,env(safe-area-inset-left));top:calc(max(8px,env(safe-area-inset-top)) + 84px);max-width:min(300px,62vw);background:rgba(246,236,214,.94);border:2px solid #7b5a2b;border-radius:12px;padding:6px 10px;z-index:4;box-shadow:0 3px 0 #0003}
@media (min-width:700px){.obj{top:calc(max(8px,env(safe-area-inset-top)) + 46px)}}
.obj small{display:block;font:11px system-ui;color:#7b5a2b}.obj b{font:15px/1.2 var(--gfont)}
.bot{position:fixed;right:max(10px,env(safe-area-inset-right));bottom:max(26px,calc(env(safe-area-inset-bottom) + 20px));display:flex;gap:10px;z-index:5}
.big{width:76px;height:76px;border-radius:18px;background:linear-gradient(#f2c35a,#c68a24);border:3px solid #6e4710;box-shadow:0 5px 0 #6e4710,0 8px 14px #0005;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#2b1a05;font:14px var(--gfont)}
.big i{font-style:normal;font-size:30px;line-height:1}.big.red{background:linear-gradient(#e0715a,#a8392a);border-color:#5e1c12;box-shadow:0 5px 0 #5e1c12,0 8px 14px #0005;color:#fff}
.big.blue{background:linear-gradient(#78a7cc,#3f6f95);border-color:#1f3a52;box-shadow:0 5px 0 #1f3a52,0 8px 14px #0005;color:#fff}
.big:active,.btn:active,.ib:active{transform:translateY(3px);box-shadow:none}
.placebar{position:fixed;left:50%;bottom:max(26px,calc(env(safe-area-inset-bottom) + 20px));transform:translate(-50%,160%);display:flex;align-items:center;gap:10px;background:rgba(43,29,14,.9);color:#ffe9b0;padding:8px 10px 8px 16px;border-radius:30px;z-index:6;transition:transform .2s;font:15px var(--gfont)}
.placebar.on{transform:translate(-50%,0)}
.placing .bot,.placing .obj{display:none}
.rb{width:52px;height:52px;border-radius:26px;font-size:24px;color:#fff;border:3px solid #0006}.rb.yes{background:#4f8d3a}.rb.no{background:#a8392a}
.mbg{position:fixed;inset:0;background:rgba(20,12,4,.45);display:grid;place-items:center;z-index:20;opacity:0;transition:opacity .18s;padding:12px}
.mbg.on{opacity:1}
.modal{position:relative;width:min(440px,100%);max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);overflow:auto;background:var(--paper);border:3px solid #7b5a2b;border-radius:18px;padding:16px 16px 14px;box-shadow:0 8px 0 #5b3f1a,0 16px 30px #0007;touch-action:pan-y;-webkit-user-select:text;user-select:text}
.modal.wide{width:min(620px,100%)}
.modal .x{position:absolute;right:8px;top:8px;width:44px;height:44px;border-radius:12px;background:#b8442f;color:#fff;font:20px var(--gfont);border:2px solid #5e1c12}
h2{font:24px/1.1 var(--gfont);margin:2px 50px 8px 0;color:#4a2e0e}h3{font:18px var(--gfont);margin:14px 0 6px;color:#4a2e0e}

  function inApp(){ try{ return /\/juegos\//.test(location.pathname) && !!localStorage.getItem('historiapp.progress'); }catch(e){ return false; } }
  function level(){ try{ if(!inApp()) return null; var p=JSON.parse(localStorage.getItem('historiapp.progress')); var xp=(p&&p.xp)||0, l=0; for(var i=0;i<LEVEL_XP.length;i++) if(xp>=LEVEL_XP[i]) l=i; return {lv:l+1,xp:xp,next:LEVEL_XP[l+1]||null,nextLv:l+2}; }catch(e){ return null; } }
  function list(g){ return ALL.filter(function(r){return r.game===g;}); }
  function has(g,k){ var L=level(); var r=ALL.find(function(x){return x.game===g&&x.k===k;}); return !!(L&&r&&L.lv>=r.lv); }
  function nuevas(g){ var L=level(); if(!L) return []; var key=g+'.rw_vistas', seen=[]; try{ seen=JSON.parse(localStorage.getItem(key))||[]; }catch(e){}
    var n=list(g).filter(function(r){ return L.lv>=r.lv && seen.indexOf(r.k)<0; }); try{ localStorage.setItem(key,JSON.stringify(seen.concat(n.map(function(r){return r.k;})))); }catch(e){} return n; }
  function proxima(g){ var L=level(); if(!L) return null; return list(g).find(function(r){return r.lv>L.lv;})||null; }
  return {ALL:ALL,LEVEL_XP:LEVEL_XP,level:level,list:list,has:has,nuevas:nuevas,proxima:proxima,xpFor:function(lv){return LEVEL_XP[lv-1];}};

/* HAPP_REPASO · memoria común de fallos de Historiapp (18-10-2026, plan de mejoras, apartado 4).
   Todos los juegos comparten origen con la app, así que escriben en la misma clave del aparato: historiapp.repaso.
   Cada pregunta fallada vuelve al día siguiente; si se acierta, a los 3, a los 7 y a los 21 días, y después sale del repaso.
   Uso en un juego (solo actúa dentro de Historiapp):
     HAPP_REPASO.fallo('cuadrigas', {es:'¿…?', en:'…?'}, {es:[correcta, …], en:[correcta, …]}, 'ficha-id', 4);
     HAPP_REPASO.acierto({es:'¿…?', en:'…?'});
   La opción correcta va SIEMPRE la primera; la app las baraja al preguntar. */
window.HAPP_REPASO = (function(){
  var K = 'historiapp.repaso', DAY = 864e5, GAPS = [1, 3, 7, 21], MAX = 400;
  function inside(){ try { if (!/\/juegos\//.test(location.pathname)) return false; for (var i = 0; i < localStorage.length; i++) if (localStorage.key(i).indexOf('historiapp.') === 0) return true; } catch (e) {} return false; }
  function load(){ try { var d = JSON.parse(localStorage.getItem(K)); if (d && d.items) return d; } catch (e) {} return {v:1, items:{}}; }
  function save(d){ try { localStorage.setItem(K, JSON.stringify(d)); } catch (e) {} }
  function idOf(q){ var s = String(q && (q.es || q) || ''), h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return 'q' + (h >>> 0).toString(36); }
  function norm(o){ if (Array.isArray(o)) return {es:o}; return o || {es:[]}; }
  return {
    activo: inside,
    fallo: function(game, q, o, ficha, tema){
      if (!inside() || !q) return; if (typeof q === 'string') q = {es:q};
      var d = load(), id = idOf(q), it = d.items[id] || {g:game, q:q, o:norm(o), f:ficha || null, t:tema || null, box:0, n:0};
      it.box = 0; it.n = (it.n || 0) + 1; it.due = Date.now() + DAY; it.g = game; it.last = Date.now(); d.items[id] = it;
      var ids = Object.keys(d.items); if (ids.length > MAX){ ids.sort(function(a, b){ return (d.items[a].last || 0) - (d.items[b].last || 0); }); for (var i = 0; i < ids.length - MAX; i++) delete d.items[ids[i]]; }
      save(d);
    },
    acierto: function(q){
      if (!inside() || !q) return; if (typeof q === 'string') q = {es:q};
      var d = load(), id = idOf(q), it = d.items[id]; if (!it || it.due > Date.now()) return;
      it.box = (it.box || 0) + 1; if (it.box >= GAPS.length) delete d.items[id]; else it.due = Date.now() + GAPS[it.box] * DAY;
      save(d);
    },
    pendientes: function(){ var d = load(), now = Date.now(), out = []; for (var k in d.items) if (d.items[k].due <= now) out.push(Object.assign({id:k}, d.items[k])); return out; },
    total: function(){ return Object.keys(load().items).length; }
  };
})();

 "Migrate to the Phoenician coastal cities"}, {"es": "Entrenar en los campamentos del ejército", "en": "Train in the army camps"}], "explain": {"es": "Con la tierra bajo el agua, buena parte del campesinado se empleaba por turnos en las obras del Estado.", "en": "With the land under water, much of the peasantry was employed in shifts on State works."}, "id": "t2q014"}, {"slide": 9, "tags": ["egipto"], "q": {"es": "¿Cómo se componía el año civil egipcio?", "en": "How was the Egyptian civil year made up?"}, "o": [{"es": "12 meses de 30 días y 5 epagómenos", "en": "12 months of 30 days plus 5 epagomenal days"}, {"es": "13 meses lunares de 28 días cada uno", "en": "13 lunar months of 28 days each, with no extra days"}, {"es": "10 meses de 36 días y 5 días sin nombre", "en": "10 months of 36 days and 5 unnamed days"}], "explain": {"es": "El año civil tenía doce meses de treinta días más cinco epagómenos festivos.", "en": "The civil year had twelve months of thirty days plus five epagomenal festival days."}, "id": "t2q015"}, {"slide": 9, "tags": ["egipto", "religion"], "q": {"es": "¿Qué función tenía el ciclo festivo en el calendario egipcio?", "en": "What function did the festival cycle have in the Egyptian calendar?"}, "o": [{"es": "Medir y renovar el orden cósmico", "en": "Measuring and renewing the cosmic order"}, {"es": "Fijar los plazos de pago a los mercaderes", "en": "Setting the payment deadlines for merchants"}, {"es": "Señalar las fechas de las campañas militares", "en": "Marking the dates of military campaigns"}], "explain": {"es": "En el primer calendario solar documentado, el ciclo festivo medía, controlaba y renovaba el orden cósmico.", "en": "In the first documented solar calendar, the festival cycle measured, controlled and renewed the cosmic order."}, "id": "t2q016"}, {"slide": 9, "tags": ["egipto", "faraon"], "q": {"es": "¿Cómo fechaban los egipcios los acontecimientos?", "en": "How did the Egyptians date events?"}, "o": [{"es": "Por año de reinado", "en": "By regnal year"}, {"es": "Desde la fundación de Menfis, como era continua", "en": "From the founding of Memphis, as a continuous era"}, {"es": "Por las crecidas del Nilo numeradas desde Narmer", "en": "By Nile floods numbered from Narmer"}], "explain": {"es": "Se fechaba por año de reinado, sin era continua; la cronología se suma a partir de las listas reales.", "en": "Dates were given by regnal year, with no continuous era; chronology is added up from the king lists."}, "id": "t2q017"}, {"slide": 9, "tags": ["egipto", "faraon"], "q": {"es": "¿Cuántas dinastías egipcias se cuentan, sin las dos extranjeras?", "en": "How many Egyptian dynasties are counted, leaving aside the two foreign ones?"}, "o": [{"es": "Treinta y una", "en": "Thirty-one"}, {"es": "Veinticinco dinastías", "en": "Twenty-five dynasties"}, {"es": "Dieciocho dinastías", "en": "Eighteen dynasties"}], "explain": {"es": "Hay un total de treinta y una dinastías egipcias más dos extranjeras (macedónica y ptolemaica).", "en": "There are thirty-one Egyptian dynasties in all, plus two foreign ones (Macedonian and Ptolemaic)."}, "id": "t2q018"}, {"slide": 9, "tags": ["egipto", "carro", "arco"], "q": {"es": "¿En qué periodo llegan a Egipto el carro ligero y el arco compuesto?", "en": "In which period do the light chariot and the composite bow reach Egypt?"}, "o": [{"es": "Segundo Periodo Intermedio", "en": "Second Intermediate Period"}, {"es": "Imperio Antiguo, con las grandes obras", "en": "Old Kingdom, with the great works"}, {"es": "Época grecorromana, con Alejandro", "en": "Graeco-Roman Period, with Alexander"}], "explain": {"es": "En el Segundo Periodo Intermedio (1650-1549 a. C.) los hicsos dominan el norte y llegan el carro ligero y el arco compuesto.", "en": "In the Second Intermediate Period (1650-1549 BC) the Hyksos dominate the north and the light chariot and composite bow arrive."}, "id": "t2q019"}, {"slide": 9, "tags": ["egipto", "nobleza"], "q": {"es": "¿Qué ocurre en el Primer Periodo Intermedio?", "en": "What happens in the First Intermediate Period?"}, "o": [{"es": "Los nomarcas ganan autonomía", "en": "The nomarchs gain autonomy"}, {"es": "Alejandro Magno conquista el país", "en": "Alexander the Great conquers the country"}, {"es": "Akhenatón traslada la capital a Amarna", "en": "Akhenaten moves the capital to Amarna"}], "explain": {"es": "En el Primer Periodo Intermedio (2195-2066 a. C.) el poder central se fragmenta y los nomarcas ganan autonomía.", "en": "In the First Intermediate Period (2195-2066 BC) central power fragments and the nomarchs gain autonomy."}, "id": "t2q020"}, {"slide": 9, "tags": ["egipto", "religion"], "q": {"es": "¿Quiénes imponen el culto a Atón y trasladan la capital a Amarna?", "en": "Who imposed the cult of Aten and moved the capital to Amarna?"}, "o": [{"es": "Akhenatón y Nefertiti", "en": "Akhenaten and Nefertiti"}, {"es": "Ramsés II y su esposa Nefertari", "en": "Ramesses II and his wife Nefertari"}, {"es": "Hatshepsut y Tutmosis III", "en": "Hatshepsut and Thutmose III"}], "explain": {"es": "En el Imperio Nuevo, Akhenatón y Nefertiti imponen el culto a Atón y trasladan la capital a Amarna.", "en": "In the New Kingdom, Akhenaten and Nefertiti imposed the cult of Aten and moved the capital to Amarna."}, "id": "t2q021"}, {"slide": 9, "tags": ["egipto"], "q": {"es": "¿Quién fundó la dinastía griega que reinó desde Alejandría hasta Cleopatra VII?", "en": "Who founded the Greek dynasty that reigned from Alexandria down to Cleopatra VII?"}, "o": [{"es": "Ptolomeo, general de Alejandro", "en": "Ptolemy, Alexander's general"}, {"es": "Julio César tras anexionar el país", "en": "Julius Caesar after annexing the country"}, {"es": "Taharqa, rey de origen nubio", "en": "Taharqa, a king of Nubian origin"}], "explain": {"es": "A la muerte de Alejandro, su general Ptolomeo funda una dinastía griega que reina desde Alejandría hasta Cleopatra VII.", "en": "On Alexander's death his general Ptolemy founded a Greek dynasty that reigned from Alexandria down to Cleopatra VII."}, "id": "t2q022"}, {"slide": 10, "tags": ["egipto", "faraon"], "q": {"es": "En la pirámide social, ¿qué es la ma'at de la que el faraón es garante?", "en": "In the social pyramid, what is the ma'at that the pharaoh guarantees?"}, "o": [{"es": "El orden del mundo", "en": "The order of the world"}, {"es": "El tesoro de los templos del país", "en": "The treasury of the country's temples"}, {"es": "La crecida anual del río Nilo", "en": "The annual flood of the River Nile"}], "explain": {"es": "El faraón es dios encarnado y garante del orden del mundo (ma'at).", "en": "The pharaoh is god incarnate and guarantor of the order of the world (ma'at)."}, "id": "t2q023"}, {"slide": 10, "tags": ["egipto", "nobleza"], "q": {"es": "¿Quién dirigía la administración en nombre del faraón?", "en": "Who ran the administration in the pharaoh's name?"}, "o": [{"es": "El visir", "en": "The vizier"}, {"es": "El sumo sacerdote de Atón", "en": "The high priest of Aten"}, {"es": "El jefe de los escribas reales", "en": "The head of the royal scribes"}], "explain": {"es": "El visir dirige la administración en nombre del faraón.", "en": "The vizier runs the administration in the pharaoh's name."}, "id": "t2q024"}, {"slide": 10, "tags": ["egipto", "educacion"], "q": {"es": "¿Cuál era la vía de ascenso social en el Egipto antiguo según la pirámide social?", "en": "According to the social pyramid, what was the route to social advancement in ancient Egypt?"}, "o": [{"es": "Ser escriba", "en": "Being a scribe"}, {"es": "Alistarse como mercenario extranjero", "en": "Enlisting as a foreign mercenary"}, {"es": "Trabajar las tierras del templo", "en": "Working the temple lands"}], "explain": {"es": "Los escribas eran la única clase que sabía leer y escribir, y ser escriba era la vía de ascenso social.", "en": "Scribes were the only class that could read and write, and being a scribe was the route to social advancement."}, "id": "t2q025"}, {"slide": 10, "tags": ["egipto"], "q": {"es": "¿Qué papel tuvo la esclavitud de prisioneros en la economía egipcia?", "en": "What role did the enslavement of prisoners play in the Egyptian economy?"}, "o": [{"es": "Existió, pero nunca fue la base productiva", "en": "It existed but was never the productive base"}, {"es": "Fue la base de todo el trabajo agrícola del país", "en": "It was the basis of all farm work in the country"}, {"es": "Sustituyó al campesinado en las obras", "en": "It replaced the peasantry on State works"}], "explain": {"es": "Hubo servidumbre y esclavitud de prisioneros de guerra, pero nunca fueron la base productiva, que era el campesinado.", "en": "There was serfdom and enslavement of prisoners of war, but they were never the productive base, which was the peasantry."}, "id": "t2q026"}, {"slide": 11, "tags": ["egipto", "mujeres"], "q": {"es": "¿Qué derechos tenían ante la ley las mujeres egipcias?", "en": "What rights did Egyptian women have before the law?"}, "o": [{"es": "Los mismos que los hombres de su clase", "en": "The same basic rights as men of their class"}, {"es": "Solo los que les concedía su marido o su padre", "en": "Only those granted by their husband or their own father"}, {"es": "Ninguno fuera del ámbito religioso", "en": "None outside the religious sphere"}], "explain": {"es": "Ante la ley, las mujeres egipcias tenían los mismos derechos básicos que los hombres de su misma clase social.", "en": "Before the law, Egyptian women had the same basic rights as men of their own social class."}, "id": "t2q027"}, {"slide": 11, "tags": ["egipto", "mujeres"], "q": {"es": "¿Cómo funcionaba el matrimonio en el Egipto antiguo?", "en": "How did marriage work in ancient Egypt?"}, "o": [{"es": "Como contrato, con divorcio posible", "en": "As a contract, with divorce possible"}, {"es": "Como un rito religioso indisoluble para siempre", "en": "As an indissoluble religious rite for life"}, {"es": "Como una compra de la esposa por el marido", "en": "As a purchase of the wife by the husband"}], "explain": {"es": "El matrimonio funcionaba como contrato, con reparto de bienes y divorcio posible.", "en": "Marriage worked as a contract, with division of property and the possibility of divorce."}, "id": "t2q028"}, {"slide": 11, "tags": ["egipto", "mujeres", "funerario"], "q": {"es": "¿Cuál es el título femenino más frecuente en las tumbas egipcias?", "en": "What is the most frequent female title in Egyptian tombs?"}, "o": [{"es": "Señora de la casa", "en": "Lady of the house"}, {"es": "Sacerdotisa de Hathor", "en": "Priestess of Hathor"}, {"es": "Gran esposa real", "en": "Great royal wife"}], "explain": {"es": "El título más frecuente en las tumbas es «señora de la casa».", "en": "The most frequent title in the tombs is «lady of the house»."}, "id": "t2q029"}, {"slide": 11, "tags": ["egipto", "mujeres", "religion"], "q": {"es": "¿De qué culto se documentan sobre todo sacerdotisas?", "en": "Of which cult are priestesses mainly documented?"}, "o": [{"es": "Hathor", "en": "Hathor"}, {"es": "Atón, culto impuesto en Amarna", "en": "Aten, the cult imposed at Amarna"}, {"es": "Montu, dios de la guerra", "en": "Montu, god of war"}], "explain": {"es": "Fuera de la casa se documentan sacerdotisas, sobre todo del culto de Hathor.", "en": "Outside the house, priestesses are documented, above all of the cult of Hathor."}, "id": "t2q030"}, {"slide": 11, "tags": ["egipto", "mujeres", "faraon"], "q": {"es": "¿Qué dos mujeres cita la diapositiva como ejemplos excepcionales de llegada al trono?", "en": "Which two women does the slide cite as exceptional examples of reaching the throne?"}, "o": [{"es": "Hatshepsut y Cleopatra VII", "en": "Hatshepsut and Cleopatra VII"}, {"es": "Nefertiti y Nefertari", "en": "Nefertiti and Nefertari"}, {"es": "Nefertari y la reina de Kheruef", "en": "Nefertari and Kheruef's queen"}], "explain": {"es": "Excepcionalmente llegan al trono, como Hatshepsut en la dinastía XVIII o Cleopatra VII al final de la historia egipcia.", "en": "Exceptionally they reach the throne, as did Hatshepsut in the 18th Dynasty or Cleopatra VII at the end of Egyptian history."}, "id": "t2q031"}, {"slide": 12, "tags": ["egipto"], "q": {"es": "¿Cuál es la fuente más abundante y rica para el deporte egipcio?", "en": "What is the most abundant and richest source for Egyptian sport?"}, "o": [{"es": "La iconografía", "en": "Iconography"}, {"es": "La literatura de cuentos y mitos", "en": "Literature of tales and myths"}, {"es": "Los materiales hallados en las tumbas", "en": "Equipment found in tombs"}], "explain": {"es": "La iconografía es la fuente más abundante y rica porque permite visualizar los cuerpos en movimiento.", "en": "Iconography is the most abundant and richest source since it allows us to see bodies in motion."}, "id": "t2q032"}, {"slide": 12, "tags": ["egipto"], "q": {"es": "¿Con qué precaución hay que leer las estelas reales y las inscripciones monumentales?", "en": "With what caution should royal stelae and monumental inscriptions be read?"}, "o": [{"es": "Con cautela ante la exageración de proezas", "en": "Wary of exaggerated feats"}, {"es": "Con dudas sobre la fecha, que nunca aparece en ellas", "en": "Doubting the date, which never appears in them"}, {"es": "Sabiendo que las escribían viajeros extranjeros", "en": "Knowing that foreign travellers wrote them"}], "explain": {"es": "Los textos oficiales sirven para cuantificar y datar, pero hay que tener cautela con la exageración de proezas de reyes respecto a sus antecesores.", "en": "Official texts serve to quantify and date, but caution is needed with the exaggeration of kings' feats relative to their predecessors."}, "id": "t2q033"}, {"slide": 12, "tags": ["egipto"], "q": {"es": "¿Qué aportan obras literarias como La Historia de Sinuhé?", "en": "What do literary works such as The Story of Sinuhe provide?"}, "o": [{"es": "Contexto y acceso a la mentalidad egipcia", "en": "Context and access to the Egyptian mentality"}, {"es": "Cifras exactas de las marcas deportivas reales", "en": "Exact figures of royal sporting records"}, {"es": "Planos de los estadios egipcios", "en": "Plans of the Egyptian stadiums and running tracks"}], "explain": {"es": "Aunque escasos, cuentos y mitos como La Historia de Sinuhé aportan contextualización y una aproximación a la mentalidad egipcia.", "en": "Although scarce, tales and myths such as The Story of Sinuhe provide context and an approach to the Egyptian mentality."}, "id": "t2q034"}, {"slide": 12, "tags": ["egipto", "estadio"], "q": {"es": "¿Qué se sabe de los espacios construidos para el deporte en Egipto?", "en": "What is known about spaces built for sport in Egypt?"}, "o": [{"es": "No se conserva ninguno exclusivo", "en": "No exclusively sporting space survives"}, {"es": "Se conservan varios estadios junto a los templos", "en": "Several stadiums survive next to the temples"}, {"es": "Solo se conserva un hipódromo en Menfis", "en": "Only one hippodrome survives at Memphis"}], "explain": {"es": "En todo el Antiguo Egipto no se conserva ningún espacio construido únicamente para el deporte; las prácticas se integraban en cotos, estanques o caminos.", "en": "In the whole of Ancient Egypt no space built solely for sport survives; practice took place in hunting grounds, pools or tracks."}, "id": "t2q035"}, {"slide": 12, "tags": ["egipto"], "q": {"es": "¿Cuántas escenas deportivas egipcias hay catalogadas aproximadamente?", "en": "Roughly how many Egyptian sporting scenes have been catalogued?"}, "o": [{"es": "Cerca de dos mil", "en": "Nearly two thousand"}, {"es": "Unas trescientas catorce", "en": "About three hundred and fourteen"}, {"es": "Más de veinte mil escenas", "en": "More than twenty thousand scenes"}], "explain": {"es": "El corpus deportivo egipcio es el más abundante de la Antigüedad, con cerca de dos mil escenas catalogadas.", "en": "The Egyptian sporting corpus is the most abundant of Antiquity, with nearly two thousand scenes catalogued."}, "id": "t2q036"}, {"slide": 13, "tags": ["egipto"], "q": {"es": "¿Qué significaba literalmente el concepto egipcio śḫmḫ-ib?", "en": "What did the Egyptian concept śḫmḫ-ib literally mean?"}, "o": [{"es": "Divertir el corazón", "en": "To entertain the heart"}, {"es": "Fortalecer el brazo del guerrero", "en": "To strengthen the warrior's arm"}, {"es": "Vencer siempre al enemigo", "en": "To always defeat the enemy"}], "explain": {"es": "En lugar de una palabra para «deporte», se usaba śḫmḫ-ib, que significaba «divertir el corazón» o «hacer olvidar al corazón».", "en": "Instead of a word for «sport», śḫmḫ-ib was used, meaning «to entertain the heart» or «to make the heart forget»."}, "id": "t2q037"}, {"slide": 13, "tags": ["egipto", "religion"], "q": {"es": "¿Qué finalidad tenían los bailes, la música y las acrobacias dentro de los espectáculos públicos?", "en": "What was the purpose of dancing, music and acrobatics within public spectacles?"}, "o": [{"es": "Amenizar las fiestas sagradas", "en": "Enlivening sacred festivals"}, {"es": "Entrenar a los soldados para el combate", "en": "Training soldiers for combat"}, {"es": "Seleccionar a los futuros escribas", "en": "Selecting future scribes"}], "explain": {"es": "Bailes, música y acrobacias tenían como fin amenizar las fiestas sagradas en templos y recintos sagrados.", "en": "Dancing, music and acrobatics enlivened the sacred festivals held in temples and sacred precincts."}, "id": "t2q038"}, {"slide": 13, "tags": ["egipto", "ejercito", "educacion"], "q": {"es": "¿Qué función cumplía la educación física dentro de los ejercicios militares?", "en": "What function did physical education serve within military exercises?"}, "o": [{"es": "Preparar al ejército para la guerra", "en": "Preparing the army for war"}, {"es": "Divertir a los nobles en sus banquetes", "en": "Entertaining nobles at their banquets"}, {"es": "Renovar el poder del faraón cada tres años", "en": "Renewing the pharaoh's power every three years"}], "explain": {"es": "La educación física preparaba al ejército para la guerra, en campamentos de entrenamiento estructurados.", "en": "Physical education prepared the army for war, in structured training camps."}, "id": "t2q039"}, {"slide": 13, "tags": ["egipto", "caza", "nobleza"], "q": {"es": "¿Qué diferencia señala la diapositiva entre la caza de la élite y la de los campesinos?", "en": "What difference does the slide point out between elite and peasant hunting?"}, "o": [{"es": "Pasatiempo para unos, necesidad para otros", "en": "A pastime for some, a necessity for others"}, {"es": "Los campesinos cazaban con carro y los nobles a pie", "en": "Peasants hunted by chariot and nobles on foot"}, {"es": "Solo los campesinos podían pescar en las marismas", "en": "Only peasants could fish in the marshes"}], "explain": {"es": "La caza era un pasatiempo de la élite en cotos privados; para los campesinos, una necesidad.", "en": "Hunting was an elite pastime on private preserves; for peasants, it was a necessity."}, "id": "t2q040"}, {"slide": 13, "tags": ["egipto", "juego"], "q": {"es": "¿Qué prácticas se suman a las tres grandes categorías de actividad física egipcia?", "en": "Which practices are added to the three main categories of Egyptian physical activity?"}, "o": [{"es": "Deporte obrero, juegos de mesa e infantiles", "en": "Workers' sport, board and children's games"}, {"es": "Carreras de carros, juegos olímpicos y banquetes", "en": "Chariot races, Olympic games and court banquets"}, {"es": "Gladiadores y naumaquias", "en": "Gladiators and naumachiae"}], "explain": {"es": "A la clasificación se suman el deporte obrero, los juegos de mesa y los juegos infantiles.", "en": "Workers' sport, board games and children's games are added to the classification."}, "id": "t2q041"}, {"slide": 14, "tags": ["egipto", "lucha"], "q": {"es": "¿Qué indica la presencia de árbitros con trompetas en algunos relieves?", "en": "What does the presence of referees with trumpets in some reliefs indicate?"}, "o": [{"es": "Reglas formales y juego limpio", "en": "Formal rules and fair play"}, {"es": "Que los combates eran solo ceremonias fúnebres", "en": "That bouts were only funeral ceremonies"}, {"es": "Que el faraón competía en los combates", "en": "That the pharaoh fought in the bouts"}], "explain": {"es": "Las competiciones estaban sujetas a reglas formales e intencionalidad de juego limpio; algunos relieves muestran árbitros con trompetas.", "en": "Competitions were subject to formal rules and an intention of fair play; some reliefs show referees with trumpets."}, "id": "t2q042"}, {"slide": 14, "tags": ["egipto", "politica"], "q": {"es": "¿Frente a qué pueblos aparecen siempre vencedores los egipcios en sus representaciones?", "en": "Against which peoples are the Egyptians always shown victorious in their depictions?"}, "o": [{"es": "Nubios, libios y asiáticos", "en": "Nubians, Libyans and Asiatics"}, {"es": "Persas, fenicios y griegos", "en": "Persians, Phoenicians and Greeks"}, {"es": "Hicsos, romanos y macedonios", "en": "Hyksos, Romans and Macedonians"}], "explain": {"es": "En las representaciones los egipcios se muestran siempre venciendo a nubios, libios y asiáticos, como propaganda.", "en": "In depictions the Egyptians are always shown defeating Nubians, Libyans and Asiatics, as propaganda."}, "id": "t2q043"}, {"slide": 14, "tags": ["egipto", "mujeres"], "q": {"es": "¿En qué disciplinas participaban activamente las mujeres egipcias?", "en": "In which disciplines did Egyptian women take an active part?"}, "o": [{"es": "Acrobacia, malabares, danza, natación", "en": "Acrobatics, juggling, dance, swimming"}, {"es": "Lucha, boxeo y esgrima de bastón entre soldados", "en": "Wrestling, boxing and stick-fencing among soldiers"}, {"es": "Tiro con arco desde el carro y caza mayor", "en": "Archery from the chariot and big-game hunting"}], "explain": {"es": "Las mujeres participaban en disciplinas de agilidad, ritmo y flexibilidad, como la gimnasia acrobática, los malabares, las danzas o la natación.", "en": "Women took part in disciplines of agility, rhythm and flexibility, such as acrobatic gymnastics, juggling, dance or swimming."}, "id": "t2q044"}, {"slide": 14, "tags": ["egipto", "mujeres", "nobleza"], "q": {"es": "¿Qué excepción señala la diapositiva sobre el adiestramiento físico de las mujeres?", "en": "What exception does the slide note about women's physical training?"}, "o": [{"es": "Reinas y princesas lo recibían en privado", "en": "Queens and princesses received it privately"}, {"es": "Las campesinas formaban parte del ejército", "en": "Peasant women served in the army"}, {"es": "Las sacerdotisas competían en la lucha pública", "en": "Priestesses competed in public wrestling bouts"}], "explain": {"es": "Aunque no aparecen en deportes de combate, algunas reinas y princesas recibían en privado adiestramiento físico e incluso militar.", "en": "Although not depicted in combat sports, some queens and princesses received physical and even military training in private."}, "id": "t2q045"}, {"slide": 15, "tags": ["egipto", "nobleza"], "q": {"es": "¿Qué condicionaba principalmente el acceso a las prácticas físicas en Egipto?", "en": "What mainly conditioned access to physical practices in Egypt?"}, "o": [{"es": "La estratificación social", "en": "Social stratification"}, {"es": "La edad y el estado de salud", "en": "Age and state of health"}, {"es": "La región del Nilo donde se vivía", "en": "The region of the Nile where one lived"}], "explain": {"es": "Las prácticas estaban condicionadas por la estratificación social, que fomentaba o restringía una actividad por cuestión de nacimiento.", "en": "Practices were conditioned by social stratification, which encouraged or restricted an activity as a matter of birth."}, "id": "t2q046"}, {"slide": 15, "tags": ["egipto", "nobleza", "espectaculo"], "q": {"es": "¿Qué hacían los nobles en las celebraciones sagradas, según la diapositiva?", "en": "What did nobles do at sacred celebrations, according to the slide?"}, "o": [{"es": "Acudir como espectadores", "en": "Attend as spectators"}, {"es": "Competir en carreras de carros", "en": "Compete in chariot races"}, {"es": "Arbitrar los combates de lucha", "en": "Referee the wrestling bouts"}], "explain": {"es": "Los nobles solían acudir como espectadores a las celebraciones sagradas o celebraban sus propios banquetes con bailarinas, músicos y acróbatas.", "en": "Nobles usually attended sacred celebrations as spectators or held their own banquets with dancers, musicians and acrobats."}, "id": "t2q047"}, {"slide": 15, "tags": ["egipto", "educacion", "natacion"], "q": {"es": "¿Qué incluía la instrucción física de la educación cortesana (kap)?", "en": "What did the physical instruction of court education (kap) include?"}, "o": [{"es": "Natación, lucha, arco y armas", "en": "Swimming, wrestling, archery and weapons"}, {"es": "Danza, música, malabares y acrobacias de templo", "en": "Dance, music, juggling and temple acrobatics"}, {"es": "Justas náuticas y regatas de obreros", "en": "Water jousts and workers' boat races"}], "explain": {"es": "Los hijos de reyes y alta nobleza recibían instrucción en natación, lucha, tiro con arco y manejo de armas para la guerra.", "en": "The sons of kings and the high nobility received instruction in swimming, wrestling, archery and weapons handling for war."}, "id": "t2q048"}, {"slide": 17, "tags": ["egipto", "faraon"], "q": {"es": "¿Quién acuñó en 1982 el concepto de Pharao Ludens?", "en": "Who coined the concept of Pharao Ludens in 1982?"}, "o": [{"es": "Erik Hornung", "en": "Erik Hornung"}, {"es": "Johan Huizinga, en Homo ludens", "en": "Johan Huizinga, in Homo ludens"}, {"es": "Wolfgang Decker y Klauck", "en": "Wolfgang Decker and Klauck"}], "explain": {"es": "Siguiendo a Huizinga, en 1982 el egiptólogo Erik Hornung acuñó el concepto de Pharao Ludens.", "en": "Following Huizinga, in 1982 the Egyptologist Erik Hornung coined the concept of Pharao Ludens."}, "id": "t2q049"}, {"slide": 17, "tags": ["egipto", "faraon"], "q": {"es": "¿Qué describe el concepto de Pharao Ludens?", "en": "What does the concept of Pharao Ludens describe?"}, "o": [{"es": "Un rey que ejerce su función jugando", "en": "A king who rules partly through play"}, {"es": "Un faraón aficionado a los juegos de mesa", "en": "A pharaoh fond of board games"}, {"es": "Un rey que organiza juegos para el pueblo", "en": "A king who organises games for the people"}], "explain": {"es": "Pharao Ludens describe a un soberano cuya función se ejerce, en parte, jugando.", "en": "Pharao Ludens describes a sovereign whose office is exercised, in part, through play."}, "id": "t2q050"}, {"slide": 17, "tags": ["egipto", "faraon", "religion"], "q": {"es": "¿Por qué necesitaba el faraón una fuerza física abrumadora?", "en": "Why did the pharaoh need overwhelming physical strength?"}, "o": [{"es": "Era garante de vida y prosperidad", "en": "He guaranteed life and prosperity"}, {"es": "Debía dirigir personalmente cada batalla", "en": "He had to lead every battle in person"}, {"es": "Debía vencer en los juegos de los nomarcas", "en": "He had to win the nomarchs' games"}], "explain": {"es": "La razón es política y religiosa: si el faraón es garante de la vida y la prosperidad de sus súbditos, necesita una fuerza física abrumadora.", "en": "The reason is political and religious: if the pharaoh guarantees his subjects' life and prosperity, he needs overwhelming physical strength."}, "id": "t2q051"}, {"slide": 17, "tags": ["egipto", "faraon"], "q": {"es": "¿Qué significa victor perpetuus?", "en": "What does victor perpetuus mean?"}, "o": [{"es": "Vencedor perpetuo", "en": "Perpetual victor"}, {"es": "Primer atleta del reino", "en": "First athlete of the kingdom"}, {"es": "Señor de las Dos Tierras", "en": "Lord of the Two Lands"}], "explain": {"es": "El principio de victor perpetuus significa «vencedor perpetuo»: el faraón es siempre victorioso por definición teológica.", "en": "The principle of victor perpetuus means «perpetual victor»: the pharaoh is always victorious by theological definition."}, "id": "t2q052"}, {"slide": 17, "tags": ["egipto", "faraon"], "q": {"es": "¿Cuántas referencias a una derrota real se conservan en tres milenios?", "en": "How many references to a royal defeat survive across three millennia?"}, "o": [{"es": "Ninguna", "en": "None"}, {"es": "Una, la de Amenofis II en Medamud", "en": "One, that of Amenhotep II at Medamud"}, {"es": "Tres, todas del Tercer Periodo Intermedio", "en": "Three, all from the Third Intermediate Period"}], "explain": {"es": "En tres milenios no se conserva una sola referencia a una derrota real.", "en": "In three millennia not a single reference to a royal defeat survives."}, "id": "t2q053"}, {"slide": 17, "tags": ["egipto", "faraon"], "q": {"es": "¿A quién afectaba el tabú sobre la competición?", "en": "Whom did the taboo on competition affect?"}, "o": [{"es": "Solo al faraón", "en": "Only the pharaoh"}, {"es": "A todos los egipcios libres", "en": "All free Egyptians"}, {"es": "A los sacerdotes y a los escribas", "en": "Priests and scribes"}], "explain": {"es": "La prohibición de competir afecta solo al faraón; el egipcio corriente podía competir.", "en": "The ban on competing affects only the pharaoh; the ordinary Egyptian could compete."}, "id": "t2q054"}, {"slide": 17, "tags": ["egipto", "faraon"], "q": {"es": "¿Por qué el faraón no podía participar en una competición, según su definición?", "en": "Why could the pharaoh not take part in a competition, given its definition?"}, "o": [{"es": "No tiene iguales ni admite incertidumbre", "en": "He has no equals and admits no uncertainty"}, {"es": "La competición era un rito exclusivo de los dioses", "en": "Competition was a rite reserved for the gods"}, {"es": "Las leyes de Persia se lo impedían", "en": "The laws of Persia forbade it"}], "explain": {"es": "La competición identifica al mejor entre iguales y en condiciones inciertas; el faraón carece de iguales y no admite incertidumbres.", "en": "Competition identifies the best among equals under uncertain conditions; the pharaoh has no equals and admits no uncertainty."}, "id": "t2q055"}, {"slide": 18, "tags": ["egipto", "hebsed", "faraon"], "q": {"es": "¿Para qué servía la fiesta del Heb-Sed?", "en": "What was the Heb-Sed festival for?"}, "o": [{"es": "Para renovar el poder del faraón", "en": "To renew the pharaoh's power"}, {"es": "Para celebrar la llegada de la crecida del Nilo", "en": "To celebrate the arrival of the Nile flood"}, {"es": "Para coronar al heredero en vida del rey", "en": "To crown the heir during the king's life"}], "explain": {"es": "El Heb-Sed es la fiesta del jubileo más importante de Egipto y sirve para renovar el poder del faraón.", "en": "The Heb-Sed is Egypt's most important jubilee festival and serves to renew the pharaoh's power."}, "id": "t2q056"}, {"slide": 18, "tags": ["egipto", "hebsed"], "q": {"es": "¿Cuándo se celebraba por primera vez el Heb-Sed y cada cuánto se repetía?", "en": "When was the Heb-Sed first celebrated and how often was it repeated?"}, "o": [{"es": "A los 30 años de reinado; luego cada tres", "en": "At 30 years of reign; then every three"}, {"es": "Al primer año de reinado; luego cada diez años", "en": "In the first year of reign; then every ten years"}, {"es": "A los 16 años de reinado; luego cada año", "en": "At 16 years of reign; then every year"}], "explain": {"es": "Se celebraba cumplidos los treinta años de reinado y se repetía después cada tres.", "en": "It was celebrated on completing thirty years of reign and repeated every three years thereafter."}, "id": "t2q057"}, {"slide": 18, "tags": ["egipto", "hebsed"], "q": {"es": "¿Cuántos testimonios del Heb-Sed se conservan?", "en": "How many attestations of the Heb-Sed survive?"}, "o": [{"es": "314", "en": "314"}, {"es": "Unos dos mil", "en": "About two thousand"}, {"es": "Catorce testimonios", "en": "Fourteen attestations"}], "explain": {"es": "Lejos de ser algo testimonial, el Heb-Sed está representado en numerosos registros, con 314 testimonios.", "en": "Far from a token affair, the Heb-Sed is depicted in numerous records, with 314 attestations."}, "id": "t2q058"}, {"slide": 18, "tags": ["egipto", "hebsed", "faraon"], "q": {"es": "¿Qué faraón destaca por haber celebrado catorce jubileos?", "en": "Which pharaoh stands out for celebrating fourteen jubilees?"}, "o": [{"es": "Ramsés II", "en": "Ramesses II"}, {"es": "Amenofis II, el atleta ideal", "en": "Amenhotep II, the ideal athlete"}, {"es": "Tutmosis III, el gran conquistador", "en": "Thutmose III, the great conqueror"}], "explain": {"es": "Destaca Ramsés II, con catorce jubileos a lo largo de su reinado.", "en": "Ramesses II stands out, with fourteen jubilees during his reign."}, "id": "t2q059"}, {"slide": 18, "tags": ["egipto", "hebsed", "arco"], "q": {"es": "¿Qué simbolizaba el disparo de flechas hacia los cuatro puntos cardinales en el Heb-Sed?", "en": "What did shooting arrows towards the four cardinal points symbolise in the Heb-Sed?"}, "o": [{"es": "El dominio sobre todo el reino", "en": "Dominion over the whole kingdom"}, {"es": "La unión del Alto y el Bajo Egipto", "en": "The union of Upper and Lower Egypt"}, {"es": "La resurrección del rey en el más allá", "en": "The king's resurrection in the afterlife"}], "explain": {"es": "El disparo de flechas hacia los cuatro puntos cardinales ejemplificaba el dominio sobre todo el reino.", "en": "Shooting arrows towards the four cardinal points exemplified dominion over the whole kingdom."}, "id": "t2q060"}, {"slide": 18, "tags": ["egipto", "hebsed", "religion"], "q": {"es": "¿Qué reproducía y representaba el pilar Djed alzado en el Heb-Sed?", "en": "What did the Djed pillar raised in the Heb-Sed reproduce and represent?"}, "o": [{"es": "La columna de Osiris; estabilidad del Estado", "en": "Osiris's backbone; the State's stability"}, {"es": "El cetro de Horus; la victoria sobre los nubios", "en": "Horus's sceptre; victory over the Nubians"}, {"es": "El mástil de una barca; el viaje por el Nilo", "en": "A boat's mast; the journey along the Nile"}], "explain": {"es": "El pilar Djed reproducía la columna vertebral de Osiris y representaba la estabilidad y resistencia del Estado.", "en": "The Djed pillar reproduced the backbone of Osiris and represented the stability and endurance of the State."}, "id": "t2q061"}, {"slide": 19, "tags": ["egipto", "hebsed", "carrera"], "q": {"es": "¿Dónde se realizaba la carrera del faraón en el Heb-Sed?", "en": "Where did the pharaoh's Heb-Sed run take place?"}, "o": [{"es": "En el patio sur del recinto de Saqqara", "en": "In the south court of the Saqqara precinct"}, {"es": "En la avenida de esfinges del templo de Karnak", "en": "In the avenue of sphinxes of the temple of Karnak"}, {"es": "En la calzada de la pirámide de Sahure", "en": "On the causeway of Sahure's pyramid"}], "explain": {"es": "La carrera se realizaba en el patio sur del recinto sagrado de la pirámide de Saqqara.", "en": "The run took place in the southern court of the sacred precinct of the pyramid of Saqqara."}, "id": "t2q062"}, {"slide": 19, "tags": ["egipto", "hebsed", "carrera"], "q": {"es": "¿Qué distancia sumaba el circuito completo de la carrera del Heb-Sed?", "en": "What distance did the full Heb-Sed race circuit cover?"}, "o": [{"es": "140 m", "en": "140 m"}, {"es": "55 metros en recta", "en": "55 metres straight"}, {"es": "Unos 100 km", "en": "About 100 km"}], "explain": {"es": "La pista era una recta de 55 metros con dos mojones semicirculares, y el circuito completo sumaba 140 m.", "en": "The track was a 55-metre straight with two semicircular markers, and the full circuit came to 140 m."}, "id": "t2q063"}, {"slide": 19, "tags": ["egipto", "hebsed", "carrera"], "q": {"es": "¿Qué simbolizaba correr de norte a sur y de sur a norte en el Heb-Sed?", "en": "What did running north to south and south to north symbolise in the Heb-Sed?"}, "o": [{"es": "La unión de los dos reinos", "en": "The union of the two kingdoms"}, {"es": "El curso anual del sol por el cielo", "en": "The sun's yearly course through the sky"}, {"es": "La victoria sobre nubios y asiáticos", "en": "Victory over Nubians and Asiatics"}], "explain": {"es": "La carrera iba de norte a sur y de sur a norte simbolizando la unión de los dos reinos.", "en": "The run went north to south and south to north, symbolising the union of the two kingdoms."}, "id": "t2q064"}, {"slide": 19, "tags": ["egipto", "hebsed", "religion"], "q": {"es": "¿Qué animal sagrado acompaña a menudo al rey en la carrera del Heb-Sed?", "en": "Which sacred animal often accompanies the king in the Heb-Sed run?"}, "o": [{"es": "El toro Apis", "en": "The bull Apis"}, {"es": "El halcón de Horus", "en": "The falcon of Horus"}, {"es": "Un perro de caza amaestrado", "en": "A trained hunting dog"}], "explain": {"es": "En muchas representaciones el rey va acompañado del toro sagrado Apis, quizá para marcar el paso o recibir su potencia mágica.", "en": "In many depictions the king is accompanied by the sacred bull Apis, perhaps to set the pace or convey its magical power."}, "id": "t2q065"}, {"slide": 19, "tags": ["egipto", "hebsed", "mujeres"], "q": {"es": "¿Cómo explican los egiptólogos que Hatshepsut celebrara el Heb-Sed en su año 16?", "en": "How do Egyptologists explain Hatshepsut celebrating the Heb-Sed in her year 16?"}, "o": [{"es": "Sumó sus años como esposa y regente", "en": "She counted her years as wife and regent"}, {"es": "Adelantó la fiesta por una grave enfermedad", "en": "She brought it forward because of a serious illness"}, {"es": "Celebró el jubileo de su padre fallecido", "en": "She held her late father's jubilee"}], "explain": {"es": "Para entender el adelanto, los egiptólogos sugieren que Hatshepsut sumó sus años como gran esposa real y regente antes de ser faraón.", "en": "To explain the early date, Egyptologists suggest Hatshepsut counted her years as great royal wife and regent before becoming pharaoh."}, "id": "t2q066"}, {"slide": 19, "tags": ["egipto", "hebsed", "mujeres", "templo"], "q": {"es": "¿Dónde se encuentra la representación de Hatshepsut corriendo el Heb-Sed?", "en": "Where is the depiction of Hatshepsut running the Heb-Sed?"}, "o": [{"es": "Capilla Roja, Karnak", "en": "Red Chapel, Karnak"}, {"es": "Templo de Abu Simbel, en Nubia", "en": "Temple of Abu Simbel, in Nubia"}, {"es": "Tumba de Kheruef, Tebas occidental", "en": "Tomb of Kheruef, western Thebes"}], "explain": {"es": "La representación de Hatshepsut corriendo junto a Apis se encuentra en la capilla roja del templo de Karnak.", "en": "The depiction of Hatshepsut running beside Apis is in the Red Chapel of the temple of Karnak."}, "id": "t2q067"}, {"slide": 19, "tags": ["egipto", "hebsed", "mujeres"], "q": {"es": "¿Qué testimonia que Hatshepsut corriera el Heb-Sed?", "en": "What does Hatshepsut running the Heb-Sed testify?"}, "o": [{"es": "Que las reinas también debían mostrar fuerza", "en": "That queens too had to show their strength"}, {"es": "Que las mujeres competían contra los hombres en público", "en": "That women competed against men in public contests"}, {"es": "Que el Heb-Sed era un rito solo femenino", "en": "That the Heb-Sed was a rite for women only"}], "explain": {"es": "Este hecho testimonia que las mujeres también debían mostrar su fortaleza física del mismo modo que los gobernantes varones.", "en": "This testifies that women too had to display their physical strength in the same way as male rulers."}, "id": "t2q068"}, {"slide": 20, "tags": ["egipto", "hebsed", "piramide"], "q": {"es": "¿En qué complejo funerario de Saqqara se sitúa la pista de la carrera del Heb-Sed?", "en": "In which funerary complex at Saqqara is the Heb-Sed race track located?"}, "o": [{"es": "El de Dyeser", "en": "That of Djoser"}, {"es": "El de Sahure, en Abusir", "en": "That of Sahure, at Abusir"}, {"es": "El de Tutankamón, en Tebas", "en": "That of Tutankhamun, at Thebes"}], "explain": {"es": "El plano del complejo funerario de Dyeser, en Saqqara, marca el Gran Patio del Sur con los mojones de la pista del Heb-Sed.", "en": "The plan of Djoser's funerary complex at Saqqara marks the Great South Court with the markers of the Heb-Sed track."}, "id": "t2q069"}, {"slide": 21, "tags": ["egipto", "arco", "faraon"], "q": {"es": "¿Cuál fue la disciplina favorita del deporte real?", "en": "What was the favourite discipline of royal sport?"}, "o": [{"es": "Tiro con arco sobre lingotes de cobre", "en": "Archery at copper ingots"}, {"es": "La lucha con los príncipes de Beni Hasan", "en": "Wrestling with the princes of Beni Hasan"}, {"es": "La natación en los estanques del palacio", "en": "Swimming in the palace pools"}], "explain": {"es": "La disciplina favorita del deporte real fue el tiro con arco usando lingotes de cobre como dianas.", "en": "The favourite discipline of royal sport was archery using copper ingots as targets."}, "id": "t2q070"}, {"slide": 21, "tags": ["egipto", "arco", "comercio"], "q": {"es": "¿Para qué se usaban originalmente los lingotes de cobre que servían de diana?", "en": "What were the copper ingots used as targets originally used for?"}, "o": [{"es": "Para comerciar", "en": "For trade"}, {"es": "Para forjar espadas khepesh", "en": "For forging khepesh swords"}, {"es": "Para revestir los carros", "en": "For plating chariots"}], "explain": {"es": "Los lingotes eran piezas de cobre bruto que se usaban para comerciar en el Mediterráneo oriental.", "en": "The ingots were pieces of raw copper used for trade in the eastern Mediterranean."}, "id": "t2q071"}, {"slide": 21, "tags": ["egipto", "arco"], "q": {"es": "¿De quién aprendieron los egipcios a fabricar el arco compuesto?", "en": "From whom did the Egyptians learn to make the composite bow?"}, "o": [{"es": "De los hicsos", "en": "The Hyksos"}, {"es": "De los nubios de Kush", "en": "The Nubians of Kush"}, {"es": "De los persas", "en": "The Persians"}], "explain": {"es": "El arco compuesto lo fabricaban los hicsos, y los egipcios comienzan a fabricarlo tras las guerras contra ellos.", "en": "The composite bow was made by the Hyksos, and the Egyptians began to manufacture it after the wars against them."}, "id": "t2q072"}, {"slide": 21, "tags": ["egipto", "arco"], "q": {"es": "¿Qué diferencia de fabricación hay entre el arco simple y el compuesto?", "en": "What manufacturing difference is there between the simple and composite bow?"}, "o": [{"es": "Una pieza frente a varias", "en": "One piece against several"}, {"es": "Uno era de bronce y el otro de hierro forjado", "en": "One was bronze and the other wrought iron"}, {"es": "Uno usaba cuerda de lino y el otro de cuero", "en": "One used a linen string and the other leather"}], "explain": {"es": "El arco simple se hacía de una sola pieza de madera; el compuesto, de varias partes (madera, cuerno y tendones unidos con cola).", "en": "The simple bow was made of a single piece of wood; the composite from several parts (wood, horn and sinew bound with glue)."}, "id": "t2q073"}, {"slide": 21, "tags": ["egipto", "arco", "ejercito"], "q": {"es": "¿Qué alcance tenía el arco compuesto frente al simple?", "en": "What range did the composite bow have compared with the simple one?"}, "o": [{"es": "300 m frente a 150 m", "en": "300 m against 150 m"}, {"es": "150 metros frente a 50 metros", "en": "150 metres against 50 metres"}, {"es": "500 metros frente a 300 metros", "en": "500 metres against 300 metres"}], "explain": {"es": "El arco compuesto permitía lanzar flechas hasta 300 metros, frente a los 150 del arco simple.", "en": "The composite bow allowed arrows to be shot up to 300 metres, against the 150 of the simple bow."}, "id": "t2q074"}, {"slide": 21, "tags": ["egipto", "arco", "carro"], "q": {"es": "¿Por qué el arco compuesto fue una revolución militar?", "en": "Why was the composite bow a military revolution?"}, "o": [{"es": "Era ligero y manejable en el carro", "en": "It was light and handy on the chariot"}, {"es": "Permitía disparar dos flechas a la vez", "en": "It allowed two arrows to be shot at once"}, {"es": "No necesitaba cola orgánica para fabricarse", "en": "It needed no organic glue to make"}], "explain": {"es": "Fue una revolución militar porque era más ligero y compacto, más manejable en los carros de guerra.", "en": "It was a military revolution because it was lighter and more compact, easier to handle on war chariots."}, "id": "t2q075"}, {"slide": 22, "tags": ["egipto", "arco", "faraon"], "q": {"es": "¿Qué patrón siguen las marcas de tiro con arco de los reyes del Imperio Nuevo?", "en": "What pattern do the archery records of New Kingdom kings follow?"}, "o": [{"es": "Cada rey supera al anterior", "en": "Each king beats the previous one"}, {"es": "Las marcas bajan con cada nuevo reinado", "en": "Records fall with each new reign"}, {"es": "Todos los reyes logran la misma marca", "en": "All kings achieve the same record"}], "explain": {"es": "Cada rey supera al anterior y ninguno falla jamás.", "en": "Each king surpasses the previous one and none ever fails."}, "id": "t2q076"}, {"slide": 22, "tags": ["egipto", "arco"], "q": {"es": "¿Qué resultado obtuvieron Decker y Klauck (1974) al simular los disparos?", "en": "What result did Decker and Klauck (1974) obtain when simulating the shots?"}, "o": [{"es": "Las flechas penetraron solo milímetros", "en": "Arrows penetrated only millimetres"}, {"es": "Las flechas atravesaron cuatro planchas", "en": "Arrows went through four plates"}, {"es": "Los arcos modernos se rompieron al tensarlos", "en": "The modern bows broke as soon as they were drawn"}], "explain": {"es": "Simularon el disparo con arcos y flechas modernos contra planchas de cobre y las flechas penetraron solo unos milímetros.", "en": "They simulated the shot with modern bows and arrows against copper plates and the arrows penetrated only a few millimetres."}, "id": "t2q077"}, {"slide": 22, "tags": ["egipto", "arco", "faraon"], "q": {"es": "¿Qué rey igualó con exactitud la marca de su padre Tutmosis III?", "en": "Which king exactly equalled the record of his father Thutmose III?"}, "o": [{"es": "Amenofis II", "en": "Amenhotep II"}, {"es": "Tutankamón", "en": "Tutankhamun"}, {"es": "Ramsés II, el de Kadesh", "en": "Ramesses II of Kadesh"}], "explain": {"es": "La única excepción es Amenofis II, que iguala con exactitud la marca de su padre Tutmosis III, con lo que la devalúa.", "en": "The only exception is Amenhotep II, who exactly equals the record of his father Thutmose III, thereby devaluing it."}, "id": "t2q078"}, {"slide": 22, "tags": ["egipto", "arco"], "q": {"es": "¿Qué lección metodológica extrae la diapositiva de las marcas imposibles?", "en": "What methodological lesson does the slide draw from the impossible records?"}, "o": [{"es": "Una fuente impecable puede ser falsa", "en": "A flawless source can be false"}, {"es": "Las estelas reales son siempre fiables en cifras", "en": "Royal stelae are always reliable on figures"}, {"es": "La iconografía es menos fiable que la arqueología", "en": "Iconography is less reliable than archaeology"}], "explain": {"es": "Una fuente puede ser formalmente impecable y materialmente falsa; aun así atestigua que la mentalidad de récord estaba presente.", "en": "A source can be formally impeccable and materially false; even so it attests that the record mentality was present."}, "id": "t2q079"}, {"slide": 22, "tags": ["egipto", "arco", "religion"], "q": {"es": "¿Dónde se halló la inscripción de Amenofis II que reta a los presentes a atravesar la diana?", "en": "Where was the inscription of Amenhotep II challenging those present to pierce the target found?"}, "o": [{"es": "En Medamud, santuario de Montu", "en": "At Medamud, a sanctuary of Montu"}, {"es": "En Abidos, templo de Osiris", "en": "At Abydos, temple of Osiris"}, {"es": "En Guiza, junto a la Gran Esfinge", "en": "At Giza, right beside the Great Sphinx"}], "explain": {"es": "La inscripción se halló en Medamud, junto a Luxor, en un santuario del dios de la guerra Montu.", "en": "The inscription was found at Medamud, near Luxor, in a sanctuary of the war god Montu."}, "id": "t2q080"}, {"slide": 22, "tags": ["egipto", "arco", "faraon"], "q": {"es": "¿Por qué el reto de Amenofis II en Medamud confirma igualmente el dogma real?", "en": "Why does Amenhotep II's challenge at Medamud still confirm the royal dogma?"}, "o": [{"es": "Los presentes no lograron atravesar la diana", "en": "Those present failed to pierce the target"}, {"es": "Amenofis II se negó a disparar delante de testigos", "en": "Amenhotep II refused to shoot before witnesses"}, {"es": "Un sacerdote declaró nula la prueba", "en": "A priest declared the trial void"}], "explain": {"es": "Los presentes dispararon sin éxito, reconociendo el poder real; la imbatibilidad se confirma por la incapacidad de los rivales.", "en": "Those present shot without success, acknowledging royal power; invincibility is confirmed through the rivals' inability."}, "id": "t2q081"}, {"slide": 23, "tags": ["egipto", "carro"], "q": {"es": "¿Qué características tenían los carros egipcios frente a los de otras culturas?", "en": "What features did Egyptian chariots have compared with those of other cultures?"}, "o": [{"es": "Ligeros, flexibles y veloces", "en": "Light, flexible and fast"}, {"es": "Pesados, blindados y de cuatro ruedas", "en": "Heavy, armoured and four-wheeled"}, {"es": "Tirados por bueyes y muy estables", "en": "Ox-drawn and very stable"}], "explain": {"es": "A diferencia de otras culturas, las máquinas egipcias eran ligeras, flexibles y veloces.", "en": "Unlike those of other cultures, the Egyptian machines were light, flexible and fast."}, "id": "t2q082"}, {"slide": 23, "tags": ["egipto", "carro"], "q": {"es": "¿Qué velocidad máxima alcanzaba un carro egipcio tirado por dos caballos?", "en": "What top speed did an Egyptian chariot drawn by two horses reach?"}, "o": [{"es": "38 km/h", "en": "38 km/h"}, {"es": "Unos 60 km/h", "en": "About 60 km/h"}, {"es": "Unos 24 km/h", "en": "About 24 km/h"}], "explain": {"es": "Con un peso de unos 24 kg y tirado por dos caballos, alcanzaba una velocidad máxima de 38 km/h.", "en": "Weighing about 24 kg and drawn by two horses, it reached a top speed of 38 km/h."}, "id": "t2q083"}, {"slide": 23, "tags": ["egipto", "carro"], "q": {"es": "¿Con qué material se cubría el cuerpo del carro egipcio?", "en": "With what material was the body of the Egyptian chariot covered?"}, "o": [{"es": "Piel de cabra", "en": "Goatskin"}, {"es": "Placas de bronce", "en": "Bronze plates"}, {"es": "Tiras de lino grueso", "en": "Thick linen strips"}], "explain": {"es": "El chasis era de fresno o acacia y el cuerpo del carro estaba cubierto por piel de cabra.", "en": "The chassis was of ash or acacia and the body of the chariot was covered in goatskin."}, "id": "t2q084"}, {"slide": 23, "tags": ["egipto", "carro", "faraon"], "q": {"es": "¿Sobre qué príncipe heredero es una fuente principal la Estela de la Esfinge?", "en": "On which crown prince is the Sphinx Stela a main source?"}, "o": [{"es": "Amenofis II", "en": "Amenhotep II"}, {"es": "Tutmosis III", "en": "Thutmose III"}, {"es": "Seti I, padre de Ramsés", "en": "Seti I, father of Ramesses"}], "explain": {"es": "La Estela de la Esfinge es una de las principales fuentes sobre Amenofis II siendo aún heredero, de quien dice que quería a sus caballos.", "en": "The Sphinx Stela is one of the main sources on Amenhotep II while still heir, of whom it says he loved his horses."}, "id": "t2q085"}, {"slide": 23, "tags": ["egipto", "carro", "piramide"], "q": {"es": "¿Dónde entrenaba sus caballos el príncipe según la Estela de la Esfinge?", "en": "Where did the prince train his horses according to the Sphinx Stela?"}, "o": [{"es": "Junto a la Gran Esfinge", "en": "By the Great Sphinx"}, {"es": "En el patio sur de Saqqara", "en": "In the south court of Saqqara"}, {"es": "En los campamentos de Medinet Habu", "en": "In the camps of Medinet Habu"}], "explain": {"es": "El príncipe ajustó los aparejos en Menfis, paró en la Gran Esfinge y allí hacía dar vueltas a los caballos contemplando las pirámides.", "en": "The prince fitted the harness at Memphis, stopped at the Great Sphinx and there drove the horses round, contemplating the pyramids."}, "id": "t2q086"}, {"slide": 23, "tags": ["egipto", "carro", "caza", "faraon"], "q": {"es": "¿Qué hazaña de caza se registró de Tutmosis III?", "en": "What hunting feat was recorded of Thutmose III?"}, "o": [{"es": "120 toros salvajes en una hora", "en": "120 wild bulls in an hour"}, {"es": "102 leones en sus diez primeros años", "en": "102 lions in his first ten years"}, {"es": "56 toros salvajes en un solo día", "en": "56 wild bulls in a single day"}], "explain": {"es": "De Tutmosis III se registró que abatió 120 toros salvajes en una hora y siete leones; las otras cifras son de Amenofis III.", "en": "Thutmose III was recorded as bringing down 120 wild bulls in an hour and seven lions; the other figures belong to Amenhotep III."}, "id": "t2q087"}, {"slide": 23, "tags": ["egipto", "carro", "caza", "ejercito"], "q": {"es": "¿Para qué se usó principalmente el carro en Egipto?", "en": "What was the chariot mainly used for in Egypt?"}, "o": [{"es": "Guerra y caza", "en": "War and hunting"}, {"es": "Carreras en el hipódromo de Menfis", "en": "Races in the hippodrome of Memphis"}, {"es": "Transporte de piedra para las pirámides", "en": "Hauling stone for the pyramids"}], "explain": {"es": "El carro fue utilizado principalmente para la guerra y la caza. No se atestiguan carreras de carros.", "en": "The chariot was used mainly for war and hunting. No chariot races are attested."}, "id": "t2q088"}, {"slide": 25, "tags": ["egipto", "caza", "nobleza"], "q": {"es": "¿Desde cuándo se abre el privilegio real de la caza a la corte y la alta aristocracia?", "en": "From when was the royal privilege of hunting opened to the court and high aristocracy?"}, "o": [{"es": "Desde el Imperio Antiguo", "en": "From the Old Kingdom"}, {"es": "Desde el Imperio Nuevo, con el carro", "en": "From the New Kingdom, with the chariot"}, {"es": "Desde la Baja Época persa", "en": "From the Persian Late Period"}], "explain": {"es": "Al principio la caza estaba reservada a la realeza; a partir del Imperio Antiguo se abre a la corte y la alta aristocracia.", "en": "At first hunting was reserved for royalty; from the Old Kingdom it was opened to the court and the high aristocracy."}, "id": "t2q089"}, {"slide": 25, "tags": ["egipto", "caza"], "q": {"es": "¿Qué combinaba la caza en las marismas?", "en": "What did hunting in the marshes combine?"}, "o": [{"es": "Aves, mamíferos y arponeo de peces", "en": "Birds, mammals and harpooning fish"}, {"es": "Leones y toros cazados desde el carro", "en": "Lions and bulls hunted from the chariot"}, {"es": "Solo la pesca con red desde barcas", "en": "Only net fishing from boats"}], "explain": {"es": "La caza en las marismas combinaba la captura de aves con arco o bastón arrojadizo, la de mamíferos y el arponeo de peces.", "en": "Marsh hunting combined catching birds with bow or throwing stick, catching mammals and harpooning fish."}, "id": "t2q090"}, {"slide": 25, "tags": ["egipto", "caza", "funerario", "tumba"], "q": {"es": "¿Qué indica que las escenas de caza aparezcan a mayor tamaño en las tumbas nobles?", "en": "What does the larger size of hunting scenes in noble tombs indicate?"}, "o": [{"es": "La importancia que tuvo la caza en vida", "en": "The importance hunting held in life"}, {"es": "Que el difunto murió durante una cacería", "en": "That the deceased died during a hunt"}, {"es": "Que la caza era obligatoria para la nobleza", "en": "That hunting was compulsory for nobles"}], "explain": {"es": "Que las escenas de caza se representen a tamaño mayor que cualquier otra actividad es el mejor indicio de su importancia en vida.", "en": "That hunting scenes are depicted larger than any other activity is the best indication of their importance in life."}, "id": "t2q091"}, {"slide": 25, "tags": ["egipto", "caza", "funerario", "mujeres"], "q": {"es": "¿Qué significado tiene la esposa engalanada que acompaña al señor en la escena de caza?", "en": "What does the finely dressed wife beside the lord in the hunting scene signify?"}, "o": [{"es": "Fertilidad y resurrección", "en": "Fertility and resurrection"}, {"es": "La riqueza comercial de la familia", "en": "The family's commercial wealth"}, {"es": "La victoria del rey sobre sus enemigos", "en": "The king's victory over his enemies"}], "explain": {"es": "La esposa ataviada con sus mejores galas funciona como imagen de fertilidad y resurrección, y la caza garantiza la regeneración del difunto.", "en": "The wife in her finest attire works as an image of fertility and resurrection, and the hunt guarantees the regeneration of the deceased."}, "id": "t2q092"}, {"slide": 26, "tags": ["egipto", "educacion", "palacio"], "q": {"es": "¿A qué se refiere el término kap?", "en": "What does the term kap refer to?"}, "o": [{"es": "Al recinto palaciego donde se criaban los príncipes", "en": "The palace precinct where princes were raised"}, {"es": "A los cuarteles y campamentos de hasta 5000 soldados", "en": "The barracks and camps of up to 5,000 soldiers"}, {"es": "A la escuela de escribas del templo", "en": "The temple scribe school"}], "explain": {"es": "El kap es el recinto palaciego donde se criaban los hijos del rey y de la alta nobleza, y la instrucción que recibían.", "en": "The kap is the palace precinct where the children of the king and high nobility were raised, and the instruction they received."}, "id": "t2q093"}, {"slide": 26, "tags": ["egipto", "natacion", "nobleza"], "q": {"es": "¿Qué recoge la autobiografía de Khety de Siut?", "en": "What does the autobiography of Khety of Siut record?"}, "o": [{"es": "Lecciones de natación con los hijos del rey", "en": "Swimming lessons with the king's children"}, {"es": "Una victoria suya en la carrera ritual del Heb-Sed", "en": "His own victory in the ritual Heb-Sed run of the king"}, {"es": "Su caza de 102 leones en diez años", "en": "His hunt of 102 lions in ten years"}], "explain": {"es": "La autobiografía de la tumba de Khety de Siut recoge que el rey le permitió recibir lecciones de natación junto a sus hijos.", "en": "The autobiography in Khety of Siut's tomb records that the king allowed him to take swimming lessons with his own children."}, "id": "t2q094"}, {"slide": 26, "tags": ["egipto", "natacion", "educacion"], "q": {"es": "¿Por qué es valiosa la frase de Khety sobre la natación?", "en": "Why is Khety's statement about swimming valuable?"}, "o": [{"es": "Acredita una enseñanza reglada", "en": "It attests organised teaching"}, {"es": "Prueba que solo el faraón sabía nadar", "en": "It proves only the pharaoh could swim"}, {"es": "Describe la primera regata de la historia", "en": "It describes history's first boat race"}], "explain": {"es": "La frase acredita una enseñanza reglada con un maestro y con un grupo.", "en": "The statement attests organised teaching with a master and a group."}, "id": "t2q095"}, {"slide": 26, "tags": ["egipto", "natacion"], "q": {"es": "¿Qué debate existe sobre los estilos de natación en las representaciones egipcias?", "en": "What debate exists about swimming strokes in Egyptian depictions?"}, "o": [{"es": "Si se ven crol y braza", "en": "Whether crawl and breaststroke appear"}, {"es": "Si nadaban solo las mujeres o también los hombres", "en": "Whether only women swam or men too"}, {"es": "Si la natación formaba parte del Heb-Sed", "en": "Whether swimming was part of the Heb-Sed"}], "explain": {"es": "Algunos autores reconocen el crol y la braza, si bien otros advierten de que la técnica antigua no puede equipararse a la moderna.", "en": "Some authors recognise the crawl and breaststroke, although others warn that ancient technique cannot be equated with modern."}, "id": "t2q096"}, {"slide": 26, "tags": ["egipto", "educacion", "carrera"], "q": {"es": "¿Con qué fin se sometía a los «Niñ
