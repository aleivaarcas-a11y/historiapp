os del Kap» a una rigurosa preparación corporal?", "en": "For what purpose did the «Children of the Kap» undergo rigorous bodily preparation?"}, "o": [{"es": "Corregir la pereza y formar líderes", "en": "Correcting laziness and forming leaders"}, {"es": "Prepararse para competir en Olimpia", "en": "Preparing to compete in the games at Olympia"}, {"es": "Ganar premios en los juegos de obreros", "en": "Winning prizes in workers' games"}], "explain": {"es": "La preparación corporal buscaba corregir la pereza e inculcar disciplina, para formar líderes y gobernantes fuertes.", "en": "Bodily preparation aimed to correct laziness and instil discipline, to form strong leaders and rulers."}, "id": "t2q097"}, {"slide": 28, "tags": ["egipto", "ejercito"], "q": {"es": "¿Qué trauma histórico impulsó la creación del ejército profesional permanente?", "en": "What historical trauma drove the creation of the permanent professional army?"}, "o": [{"es": "La ocupación de los hicsos", "en": "The Hyksos occupation"}, {"es": "La conquista de Alejandro Magno", "en": "Alexander the Great's conquest"}, {"es": "La anexión del país por Roma", "en": "Rome's annexation of the country"}], "explain": {"es": "El ejército profesional surge en el Imperio Nuevo tras el trauma de la ocupación de los hicsos en el II Periodo Intermedio.", "en": "The professional army arose in the New Kingdom after the trauma of the Hyksos occupation in the Second Intermediate Period."}, "id": "t2q098"}, {"slide": 28, "tags": ["egipto", "ejercito"], "q": {"es": "¿Cómo se reclutaban las tropas del ejército egipcio?", "en": "How were the troops of the Egyptian army recruited?"}, "o": [{"es": "Por levas obligatorias de campesinos", "en": "By compulsory levies of peasants"}, {"es": "Solo entre hijos de la alta nobleza", "en": "Only among sons of the high nobility"}, {"es": "Mediante concursos atléticos públicos", "en": "Through public athletic contests"}], "explain": {"es": "Las tropas se reclutaban mediante levas obligatorias entre hombres jóvenes de origen campesino.", "en": "Troops were recruited through compulsory levies among young men of peasant origin."}, "id": "t2q099"}, {"slide": 28, "tags": ["egipto", "ejercito"], "q": {"es": "¿Qué capacidad podían tener los cuarteles y campamentos de entrenamiento?", "en": "What capacity could the barracks and training camps have?"}, "o": [{"es": "Hasta 5000 soldados", "en": "Up to 5,000 soldiers"}, {"es": "Hasta 300 soldados", "en": "Up to 300 soldiers"}, {"es": "Hasta 50000 soldados", "en": "Up to 50,000 soldiers"}], "explain": {"es": "Los cuarteles y campamentos tenían capacidad de hasta 5.000 soldados.", "en": "The barracks and camps had capacity for up to 5,000 soldiers."}, "id": "t2q100"}, {"slide": 28, "tags": ["egipto", "ejercito", "carro", "nobleza"], "q": {"es": "¿En qué cuerpo se alistaban los jóvenes aristócratas?", "en": "In which corps did young aristocrats enlist?"}, "o": [{"es": "Carros de guerra", "en": "War chariots"}, {"es": "Arqueros de infantería", "en": "Infantry archers"}, {"es": "La guardia del templo de Amón", "en": "The guard of Amun's temple"}], "explain": {"es": "Los jóvenes de la aristocracia se alistaban en el cuerpo de carros de guerra aportando sus propios caballos.", "en": "Young aristocrats enlisted in the chariot corps, bringing their own horses."}, "id": "t2q101"}, {"slide": 28, "tags": ["egipto", "ejercito"], "q": {"es": "¿Con qué premiaba el Estado el servicio tras las campañas?", "en": "How did the State reward service after campaigns?"}, "o": [{"es": "Tierra, ganado y sirvientes", "en": "Land, livestock and servants"}, {"es": "Collares de oro y un banquete real", "en": "Gold collars and a royal banquet"}, {"es": "Un cargo de escriba en la corte", "en": "A scribe's post at court"}], "explain": {"es": "Tras las campañas, el Estado premiaba con parcelas de unas 3 hectáreas, ganado y sirvientes.", "en": "After campaigns, the State rewarded service with plots of about 3 hectares, livestock and servants."}, "id": "t2q102"}, {"slide": 29, "tags": ["egipto", "ejercito", "esgrima"], "q": {"es": "¿Qué arma egipcia era el khepesh?", "en": "What Egyptian weapon was the khepesh?"}, "o": [{"es": "Una espada curva de bronce", "en": "A curved bronze sword"}, {"es": "Un arco compuesto para el carro", "en": "A composite bow for the chariot"}, {"es": "Una lanza corta de infantería", "en": "A short infantry spear"}], "explain": {"es": "El equipamiento del soldado incluía la espada curva de bronce (khepesh).", "en": "The soldier's equipment included the curved bronze sword (khepesh)."}, "id": "t2q103"}, {"slide": 30, "tags": ["egipto", "lucha"], "q": {"es": "¿Cuáles son las actividades físicas mejor documentadas de Egipto?", "en": "Which are the best documented physical activities of Egypt?"}, "o": [{"es": "Los deportes de combate", "en": "Combat sports"}, {"es": "Los juegos de pelota de las niñas", "en": "Girls' ball games"}, {"es": "Las carreras de fondo militares", "en": "Military long-distance runs"}], "explain": {"es": "Los deportes de combate son las actividades físicas mejor documentadas de Egipto.", "en": "Combat sports are the best documented physical activities of Egypt."}, "id": "t2q104"}, {"slide": 30, "tags": ["egipto", "lucha", "religion"], "q": {"es": "¿Según qué criterio ordena Decker (1992) los combates egipcios?", "en": "By what criterion does Decker (1992) arrange Egyptian bouts?"}, "o": [{"es": "Por contexto de práctica", "en": "By context of practice"}, {"es": "Por el arma que se utilizaba en cada uno", "en": "By the weapon used in each"}, {"es": "Por la dinastía en que aparecen", "en": "By the dynasty in which they appear"}], "explain": {"es": "Decker ordena los combates según tres contextos, la preparación militar, las ceremonias ante el rey y los cultos religiosos.", "en": "Decker arranges the bouts by three contexts: military training, ceremonies before the king and religious cults."}, "id": "t2q105"}, {"slide": 30, "tags": ["egipto", "lucha", "esgrima"], "q": {"es": "¿Qué tres modalidades de combate se practicaban en Egipto?", "en": "Which three forms of combat were practised in Egypt?"}, "o": [{"es": "Lucha, tahtib y boxeo", "en": "Wrestling, tahtib and boxing"}, {"es": "Lucha, pancracio y carrera armada", "en": "Wrestling, pankration and armed race"}, {"es": "Boxeo, tiro con honda y jabalina", "en": "Boxing, slinging and javelin"}], "explain": {"es": "Se practicaban tres modalidades, la lucha cuerpo a cuerpo, la esgrima con bastones (tahtib) y el boxeo.", "en": "Three forms were practised: hand-to-hand wrestling, stick-fencing (tahtib) and boxing."}, "id": "t2q106"}, {"slide": 31, "tags": ["egipto", "lucha", "tumba"], "q": {"es": "¿Cuántas parejas de luchadores aparecen en las pinturas de Beni Hasan?", "en": "How many pairs of wrestlers appear in the Beni Hasan paintings?"}, "o": [{"es": "219", "en": "219"}, {"es": "314", "en": "314 pairs"}, {"es": "Seis", "en": "Six pairs"}], "explain": {"es": "En las pinturas murales de los príncipes de Beni Hasan aparecen 219 parejas de luchadores.", "en": "The wall paintings of the princes of Beni Hasan show 219 pairs of wrestlers."}, "id": "t2q107"}, {"slide": 31, "tags": ["egipto", "lucha"], "q": {"es": "¿Cómo vestían los luchadores egipcios al competir?", "en": "How did Egyptian wrestlers dress to compete?"}, "o": [{"es": "Desnudos con un cinturón de tela", "en": "Naked with a cloth belt"}, {"es": "Con faldellín militar y casco de cuero", "en": "In military kilt and leather helmet"}, {"es": "Con túnica de lino hasta las rodillas", "en": "In a knee-length linen tunic"}], "explain": {"es": "Se competía desnudo salvo por un pequeño cinturón de tela.", "en": "They competed naked except for a small cloth belt."}, "id": "t2q108"}, {"slide": 31, "tags": ["egipto", "lucha"], "q": {"es": "¿Qué técnicas están ausentes en las representaciones de lucha egipcia?", "en": "Which techniques are absent from depictions of Egyptian wrestling?"}, "o": [{"es": "Puñetazos, mordiscos y luxaciones", "en": "Punches, bites and dislocations"}, {"es": "Proyecciones sobre el hombro, volteos de cadera y llaves de brazo", "en": "Shoulder throws, hip throws and arm locks"}, {"es": "Zancadillas y presas a las piernas", "en": "Trips and leg grips"}], "explain": {"es": "Hay llaves de proyección, volteos, zancadillas y presas; por el contrario, faltan puñetazos, mordiscos o luxaciones severas.", "en": "There are throws, trips and grips; by contrast, punches, bites or severe dislocations are absent."}, "id": "t2q109"}, {"slide": 31, "tags": ["egipto", "lucha"], "q": {"es": "¿Qué porcentaje de la lucha representada transcurre en el suelo?", "en": "What percentage of the depicted wrestling takes place on the ground?"}, "o": [{"es": "El 2 %", "en": "2%"}, {"es": "El 50 %", "en": "50%"}, {"es": "El 20 %", "en": "20%"}], "explain": {"es": "Solo el 2 % es combate en el suelo, priorizándose el derribo desde pie.", "en": "Only 2% is fighting on the ground, priority being given to takedowns from standing."}, "id": "t2q110"}, {"slide": 31, "tags": ["egipto", "lucha"], "q": {"es": "¿Cómo interpreta Decker la frase «haz lo que quieras» del árbitro en la tumba de Neheri?", "en": "How does Decker interpret the referee's phrase «do what you will» in the tomb of Neheri?"}, "o": [{"es": "Permiso para aprovechar la ventaja", "en": "Permission to exploit an advantage"}, {"es": "Una orden de detener el combate de inmediato", "en": "An order to stop the bout at once and separate them"}, {"es": "Un insulto al luchador derrotado", "en": "An insult to the beaten wrestler"}], "explain": {"es": "Decker propone que quizá un luchador está a punto de dominar al otro y recibe permiso para aprovechar su ventaja como le parezca.", "en": "Decker proposes that perhaps one wrestler is about to overpower the other and is given permission to exploit his advantage as he sees fit."}, "id": "t2q111"}, {"slide": 31, "tags": ["egipto", "lucha", "tumba"], "q": {"es": "¿Qué reproducen algunos jeroglíficos hallados junto a escenas de lucha?", "en": "What do some hieroglyphs found beside wrestling scenes reproduce?"}, "o": [{"es": "Burlas y desafíos de los luchadores", "en": "Wrestlers' taunts and challenges"}, {"es": "Las reglas oficiales del combate escritas por el rey", "en": "The official rules of the bout written by the king"}, {"es": "Los nombres de los premios ganados", "en": "The names of prizes won"}], "explain": {"es": "En algunas tumbas hay jeroglíficos con burlas y desafíos como «te agarro de la pierna».", "en": "Some tombs have hieroglyphs with taunts and challenges such as «I grab you by the leg»."}, "id": "t2q112"}, {"slide": 32, "tags": ["egipto", "lucha", "tumba"], "q": {"es": "¿De qué periodo son las pinturas de lucha de las tumbas de los nomarcas de Beni Hasan?", "en": "From which period are the wrestling paintings in the nomarchs' tombs at Beni Hasan?"}, "o": [{"es": "Imperio Medio", "en": "Middle Kingdom"}, {"es": "Imperio Nuevo, dinastía XVIII", "en": "New Kingdom, 18th Dynasty"}, {"es": "Época ramésida, dinastía XX", "en": "Ramesside period, 20th Dynasty"}], "explain": {"es": "Las cámaras pintadas de Beni Hasan con las parejas de luchadores son del Imperio Medio, dinastías XI-XII, hacia 2000 a. C.", "en": "The painted chambers of Beni Hasan with the pairs of wrestlers date from the Middle Kingdom, 11th-12th Dynasties, c. 2000 BC."}, "id": "t2q113"}, {"slide": 34, "tags": ["egipto", "esgrima", "ejercito"], "q": {"es": "¿Qué delata que el tahtib lo practicaban exclusivamente soldados?", "en": "What betrays that tahtib was practised exclusively by soldiers?"}, "o": [{"es": "El faldellín militar", "en": "The military kilt"}, {"es": "El uso de espadas khepesh", "en": "The use of khepesh swords"}, {"es": "Las inscripciones de los cuarteles", "en": "The barracks inscriptions"}], "explain": {"es": "La esgrima era exclusiva de soldados, como delata el faldellín militar en todas las fuentes.", "en": "Fencing was exclusive to soldiers, as the military kilt in every source betrays."}, "id": "t2q114"}, {"slide": 34, "tags": ["egipto", "esgrima"], "q": {"es": "¿Qué protecciones llevaban los esgrimistas de tahtib?", "en": "What protection did tahtib fencers wear?"}, "o": [{"es": "Cuero en frente, barbilla y antebrazo", "en": "Leather on forehead, chin and forearm"}, {"es": "Cascos de bronce y escudos de madera", "en": "Bronze helmets and reinforced wooden shields"}, {"es": "Ninguna, combatían con el cuerpo desnudo", "en": "None, they fought bare-bodied"}], "explain": {"es": "Los esgrimistas llevaban protectores de cuero en la frente, la barbilla y el antebrazo.", "en": "The fencers wore leather protectors on the forehead, chin and forearm."}, "id": "t2q115"}, {"slide": 34, "tags": ["egipto", "esgrima", "faraon"], "q": {"es": "¿Qué simbolizaban los combates rituales de esgrima ante el faraón?", "en": "What did ritual fencing bouts before the pharaoh symbolise?"}, "o": [{"es": "Juventud y regeneración del monarca", "en": "Youth and regeneration of the monarch"}, {"es": "La derrota de los hicsos en el Segundo Periodo", "en": "The defeat of the Hyksos in the Second Period"}, {"es": "La unión de los dos reinos", "en": "The union of the two kingdoms of Egypt"}], "explain": {"es": "Los combates rituales ante el faraón simbolizaban la juventud y la regeneración del monarca.", "en": "Ritual bouts before the pharaoh symbolised the youth and regeneration of the monarch."}, "id": "t2q116"}, {"slide": 34, "tags": ["egipto", "lucha", "tumba"], "q": {"es": "¿Dónde está la única evidencia indiscutible de boxeo en Egipto?", "en": "Where is the only indisputable evidence of boxing in Egypt?"}, "o": [{"es": "En la tumba de Kheruef", "en": "In the tomb of Kheruef"}, {"es": "En las tumbas de Beni Hasan", "en": "In the tombs of Beni Hasan"}, {"es": "En la tumba de Neferhotep", "en": "In the tomb of Neferhotep"}], "explain": {"es": "La única evidencia indiscutible de boxeo está en la tumba de Kheruef, en Tebas occidental, con seis parejas de púgiles.", "en": "The only indisputable evidence of boxing is in the tomb of Kheruef, in western Thebes, with six pairs of boxers."}, "id": "t2q117"}, {"slide": 34, "tags": ["egipto", "lucha"], "q": {"es": "¿Qué sugiere la técnica de guardia alta de los púgiles egipcios?", "en": "What does the high-guard technique of Egyptian boxers suggest?"}, "o": [{"es": "Golpes a la cabeza o un estilo performativo", "en": "Head strikes or a performative style"}, {"es": "Que solo se golpeaba al cuerpo del rival, nunca a la cabeza", "en": "That only the opponent's body was struck"}, {"es": "Que se combatía con guantes de cuero", "en": "That bouts were fought with leather gloves"}], "explain": {"es": "La guardia alta sugiere un estilo arcaico dirigido a la cabeza o, al contrario, una disciplina estilizada y performativa, próxima a la danza.", "en": "The high guard suggests an archaic style aimed at the head or, on the contrary, a stylised, performative discipline close to dance."}, "id": "t2q118"}, {"slide": 35, "tags": ["egipto", "esgrima", "lucha", "templo"], "q": {"es": "¿Qué escenas se calcaron en la sala hipóstila del templo de Ramsés III en Medinet Habu?", "en": "Which scenes were traced in the hypostyle hall of Ramesses III's temple at Medinet Habu?"}, "o": [{"es": "Arco, esgrima con palos y lucha", "en": "Archery, stick-fencing and wrestling"}, {"es": "Caza en las marismas y arponeo de peces", "en": "Marsh hunting and the harpooning of fish"}, {"es": "Senet, pelota y juego del aro", "en": "Senet, ball and hoop game"}], "explain": {"es": "El calco de Medinet Habu reproduce escenas de tiro con arco, esgrima con palos y lucha.", "en": "The Medinet Habu tracing reproduces scenes of archery, stick-fencing and wrestling."}, "id": "t2q119"}, {"slide": 36, "tags": ["egipto", "carrera", "faraon"], "q": {"es": "¿Qué rey de origen nubio dejó una estela sobre carreras de fondo?", "en": "Which king of Nubian origin left a stela on long-distance running?"}, "o": [{"es": "Taharqa", "en": "Taharqa"}, {"es": "Sahure, de la dinastía V", "en": "Sahure, of the 5th Dynasty"}, {"es": "Amenofis III, el cazador", "en": "Amenhotep III, the hunter"}], "explain": {"es": "Una estela atribuida al rey de procedencia nubia Taharqa aporta una de las evidencias más relevantes sobre carreras de fondo.", "en": "A stela attributed to the Nubian-born king Taharqa provides one of the most relevant pieces of evidence on long-distance running."}, "id": "t2q120"}, {"slide": 36, "tags": ["egipto", "carrera", "ejercito"], "q": {"es": "¿Qué recorrido hicieron los corredores de Taharqa en la primera fase, de noche?", "en": "What route did Taharqa's runners cover in the first stage, at night?"}, "o": [{"es": "De Menfis a El Fayum", "en": "From Memphis to the Fayum"}, {"es": "De Tebas a Abidos por la ruta del desierto", "en": "From Thebes to Abydos by the desert route"}, {"es": "De Menfis a Saqqara", "en": "From Memphis to Saqqara"}], "explain": {"es": "La prueba cubrió unos 50 km de Menfis al oasis de El Fayum durante la noche, en 4 horas.", "en": "The event covered some 50 km from Memphis to the Fayum oasis at night, in 4 hours."}, "id": "t2q121"}, {"slide": 36, "tags": ["egipto", "carrera"], "q": {"es": "¿Qué distancia total y tiempo de carrera recoge la estela de Taharqa?", "en": "What total distance and running time does Taharqa's stela record?"}, "o": [{"es": "100 km en unas 9 horas", "en": "100 km in about 9 hours"}, {"es": "50 km en unas 2 horas por la noche", "en": "50 km in about 2 hours during the night"}, {"es": "140 km en unas 4 horas", "en": "140 km in about 4 hours"}], "explain": {"es": "En total, 100 km en unas 9 horas de carrera, comparables a los footmen británicos y a los ultramaratonianos modernos.", "en": "In all, 100 km in about 9 hours of running, comparable to British footmen and modern ultramarathon runners."}, "id": "t2q122"}, {"slide": 36, "tags": ["egipto", "carrera", "faraon"], "q": {"es": "¿En qué se aparta Taharqa del dogma real durante la carrera?", "en": "How does Taharqa depart from the royal dogma during the run?"}, "o": [{"es": "Corrió un tramo junto a sus soldados", "en": "He ran a stretch beside his soldiers"}, {"es": "Compitió y perdió ante un soldado nubio", "en": "He competed and lost to a Nubian soldier"}, {"es": "Prohibió que hubiera premios para el vencedor", "en": "He banned prizes for the winner"}], "explain": {"es": "A diferencia del dogma real, Taharqa acompañó en carro e incluso desmontó para correr a pie junto a sus soldados en un tramo.", "en": "In contrast to the royal dogma, Taharqa followed in his chariot and even dismounted to run on foot alongside his soldiers on one stretch."}, "id": "t2q123"}, {"slide": 36, "tags": ["egipto", "carrera", "ejercito"], "q": {"es": "Además de medir la preparación de las tropas, ¿qué otra función tuvo la carrera de Taharqa?", "en": "Besides measuring the troops' readiness, what other function did Taharqa's run have?"}, "o": [{"es": "Integrar tropa egipcia y nubia", "en": "Integrating Egyptian and Nubian troops"}, {"es": "Elegir al nuevo visir del reino", "en": "Choosing a new vizier for the whole kingdom"}, {"es": "Celebrar el fin de una gran pirámide", "en": "Celebrating the end of a great pyramid"}], "explain": {"es": "La prueba funcionaba también como maniobra de integración de la tropa nativa egipcia junto con los guerreros nubios.", "en": "The event also worked as an exercise in integrating native Egyptian troops with the Nubian warriors."}, "id": "t2q124"}, {"slide": 36, "tags": ["egipto", "carrera"], "q": {"es": "¿Qué recibieron el vencedor y los siguientes en llegar en la carrera de Taharqa?", "en": "What did the winner and the next finishers receive in Taharqa's run?"}, "o": [{"es": "Premios y un banquete con la guardia real", "en": "Prizes and a banquet with the royal guard"}, {"es": "Tierras de 3 hectáreas y ganado en la región de Nubia", "en": "Plots of 3 hectares and livestock in Nubia"}, {"es": "El mando de un carro de guerra", "en": "Command of a war chariot"}], "explain": {"es": "El vencedor y los siguientes recibieron premios y el honor de comer en un banquete junto a la guardia real.", "en": "The winner and those who followed received prizes and the honour of eating at a banquet with the royal guard."}, "id": "t2q125"}, {"slide": 38, "tags": ["egipto", "nobleza"], "q": {"es": "¿Por qué el pueblo llano está peor documentado en el deporte egipcio?", "en": "Why are the common people more poorly documented in Egyptian sport?"}, "o": [{"es": "Casi todo procede de tumbas de élite", "en": "Almost everything comes from elite tombs"}, {"es": "Porque los campesinos tenían prohibido el deporte", "en": "Because peasants were banned from sport"}, {"es": "Porque sus papiros se perdieron en Alejandría", "en": "Because their papyri were lost in Alexandria"}], "explain": {"es": "Casi todo el deporte egipcio procede de tumbas de la realeza y la aristocracia; los registros del pueblo llano son escasos.", "en": "Almost all Egyptian sport comes from royal and aristocratic tombs; records of the common people are scarce."}, "id": "t2q126"}, {"slide": 38, "tags": ["egipto"], "q": {"es": "Además de la escasez de fuentes, ¿qué limitaba el ocio del pueblo llano?", "en": "Besides the scarcity of sources, what limited the common people's leisure?"}, "o": [{"es": "La falta de tiempo", "en": "Lack of time"}, {"es": "Una ley que prohibía reunirse", "en": "A law forbidding gatherings"}, {"es": "La falta de espacios abiertos junto al Nilo", "en": "Lack of open spaces by the Nile"}], "explain": {"es": "Las jornadas laborales eran largas y duras y dejaban poco margen para el ocio; el ciclo del río imponía cuándo trabajar.", "en": "Working days were long and hard and left little room for leisure; the river cycle dictated when to work."}, "id": "t2q127"}, {"slide": 38, "tags": ["egipto", "remo"], "q": {"es": "¿De qué dos contextos laborales surgen las prácticas deportivas del pueblo llano?", "en": "From which two work contexts do the common people's sporting practices arise?"}, "o": [{"es": "Pértigas de las barcas y fin de obras", "en": "Boat poles and completion of works"}, {"es": "La cosecha del trigo y el pastoreo de ganado", "en": "The wheat harvest and the herding of livestock"}, {"es": "El comercio de cobre y la minería", "en": "Copper trade and mining"}], "explain": {"es": "Las prácticas residen en el manejo de las pértigas de las barcas y en las competiciones de obreros al terminar una gran obra.", "en": "The practices lie in handling boat poles and in the workers' competitions on completing a great work."}, "id": "t2q128"}, {"slide": 39, "tags": ["egipto", "remo", "navegacion"], "q": {"es": "¿Cuál era el objetivo de las justas de pescadores?", "en": "What was the aim of the fishermen's jousts?"}, "o": [{"es": "Tirar al agua a la tripulación rival", "en": "Knocking the rival crew into the water"}, {"es": "Llegar antes que nadie a la otra orilla", "en": "Reaching the far bank of the river first"}, {"es": "Pescar el mayor número de peces", "en": "Catching the most fish"}], "explain": {"es": "El objetivo era hacer caer al agua a la tripulación contraria.", "en": "The aim was to knock the opposing crew into the water."}, "id": "t2q129"}, {"slide": 39, "tags": ["egipto", "remo"], "q": {"es": "¿Qué función tenían los hombres de proa en las justas de pescadores?", "en": "What role did the men at the bow have in the fishermen's jousts?"}, "o": [{"es": "Empujar al rival con pértigas", "en": "Push the rival with poles"}, {"es": "Timonear y mantener estable la canoa", "en": "Steer and keep the canoe stable"}, {"es": "Arbitrar y pactar las reglas del combate", "en": "Referee and agree the rules of the bout"}], "explain": {"es": "Los de popa timoneaban y daban estabilidad; los de proa usaban las pértigas para empujar y desequilibrar a los rivales.", "en": "Those at the stern steered and kept stability; those at the bow used the poles to push and unbalance the rivals."}, "id": "t2q130"}, {"slide": 39, "tags": ["egipto", "remo"], "q": {"es": "¿Cómo se regulaban las justas de pescadores?", "en": "How were the fishermen's jousts regulated?"}, "o": [{"es": "Reglas pactadas sobre la marcha", "en": "Rules agreed as they went"}, {"es": "Con un árbitro con trompeta", "en": "By a referee with a trumpet"}, {"es": "Con un reglamento escrito por el faraón", "en": "By a code written by the pharaoh"}], "explain": {"es": "No había reglamento ni árbitro; las reglas se pactaban sobre la marcha.", "en": "There were no rules and no referee; the rules were agreed as they went along."}, "id": "t2q131"}, {"slide": 39, "tags": ["egipto", "remo"], "q": {"es": "¿Qué se considera posiblemente la primera retirada deportiva documentada?", "en": "What is considered possibly the first documented sporting withdrawal?"}, "o": [{"es": "Una tripulación que rehúsa un desafío", "en": "A crew refusing a challenge"}, {"es": "Un luchador de Beni Hasan que abandona herido", "en": "A Beni Hasan wrestler who withdraws injured"}, {"es": "Un corredor de Taharqa agotado", "en": "An exhausted runner of Taharqa"}], "explain": {"es": "Hay una única escena donde una tripulación se niega a aceptar el desafío de una barca vecina, posiblemente la primera retirada deportiva documentada.", "en": "A single scene shows a crew refusing a neighbouring boat's challenge, possibly the first documented sporting withdrawal."}, "id": "t2q132"}, {"slide": 39, "tags": ["egipto", "remo"], "q": {"es": "¿Por qué destaca Guttmann (2004) las justas de pescadores?", "en": "Why does Guttmann (2004) highlight the fishermen's jousts?"}, "o": [{"es": "Un trabajo deriva en deporte de equipo", "en": "Work turns into a team sport"}, {"es": "Son el origen directo del remo olímpico", "en": "They are the direct origin of Olympic rowing"}, {"es": "Fueron el deporte favorito de los faraones", "en": "They were the pharaohs' favourite sport"}], "explain": {"es": "Para Guttmann es uno de los mejores ejemplos de cómo un trabajo cotidiano puede derivar en una disciplina deportiva de equipo.", "en": "For Guttmann it is one of the best examples of how everyday work can give rise to a team sporting discipline."}, "id": "t2q133"}, {"slide": 40, "tags": ["egipto", "remo", "tumba"], "q": {"es": "¿En qué necrópolis está la tumba de Ny-ankh-nesut con una justa de pescadores?", "en": "In which necropolis is the tomb of Ny-ankh-nesut with a fishermen's joust?"}, "o": [{"es": "Saqqara", "en": "Saqqara"}, {"es": "Beni Hasan", "en": "Beni Hasan"}, {"es": "Deir el-Medina", "en": "Deir el-Medina"}], "explain": {"es": "La justa de pescadores con pértigas procede de la tumba de Ny-ankh-nesut, en Saqqara, del Imperio Antiguo.", "en": "The fishermen's joust with poles comes from the tomb of Ny-ankh-nesut at Saqqara, Old Kingdom."}, "id": "t2q134"}, {"slide": 41, "tags": ["egipto", "piramide", "lucha", "esgrima"], "q": {"es": "¿Qué competiciones reúne el relieve de la calzada de la pirámide de Sahure?", "en": "Which competitions does the relief from Sahure's pyramid causeway bring together?"}, "o": [{"es": "Arco, esgrima, lucha y regata", "en": "Archery, fencing, wrestling, boat race"}, {"es": "Carrera de carros, natación y caza de leones", "en": "Chariot race, swimming and lion hunting"}, {"es": "Justas, senet, pelota y danzas", "en": "Jousts, senet, ball and dances"}], "explain": {"es": "El relieve reúne competiciones de tiro con arco, esgrima de bastón, lucha y una regata.", "en": "The relief brings together archery, stick-fencing, wrestling and a boat race."}, "id": "t2q135"}, {"slide": 41, "tags": ["egipto", "piramide", "templo"], "q": {"es": "¿Con qué motivo se organizaron las competiciones del relieve de Sahure?", "en": "For what occasion were the competitions in the Sahure relief organised?"}, "o": [{"es": "Terminar el templo y la pirámide", "en": "Completing the temple and pyramid"}, {"es": "El trigésimo aniversario del reinado", "en": "The thirtieth anniversary of the reign"}, {"es": "La victoria sobre los hicsos", "en": "The victory over the Hyksos"}], "explain": {"es": "Se organizaron para las fiestas por la terminación del templo funerario y la pirámide del rey.", "en": "They were organised for the festivities marking the completion of the king's funerary temple and pyramid."}, "id": "t2q136"}, {"slide": 41, "tags": ["egipto", "ejercito"], "q": {"es": "¿Quiénes compiten en las pruebas del relieve de Sahure y qué premios reciben probablemente?", "en": "Who competes in the events of the Sahure relief, and what prizes do they probably receive?"}, "o": [{"es": "Obreros y soldados; collares de oro", "en": "Workers and soldiers; gold collars"}, {"es": "Príncipes del kap; tierras y ganado", "en": "Princes of the kap; land and livestock"}, {"es": "Nomarcas de Beni Hasan; carros de guerra", "en": "Beni Hasan nomarchs; war chariots"}], "explain": {"es": "Compiten los obreros y soldados que han levantado la obra; hay premios, seguramente collares de oro.", "en": "The workers and soldiers who raised the work compete; there are prizes, most likely gold collars."}, "id": "t2q137"}, {"slide": 41, "tags": ["egipto", "faraon", "espectaculo"], "q": {"es": "¿Qué papel tiene el rey en las competiciones de obreros según Decker y Förster (2011)?", "en": "What role does the king have in the workers' competitions according to Decker and Förster (2011)?"}, "o": [{"es": "Asiste sin competir", "en": "He attends without competing"}, {"es": "Compite y vence en todas las pruebas", "en": "He competes and wins every event"}, {"es": "Hace de árbitro con trompeta", "en": "He referees with a trumpet"}], "explain": {"es": "El rey está presente sin competir; a menudo asistía como espectador o mantenía una relación pasiva con los acontecimientos.", "en": "The king is present without competing; he often attended as a spectator or kept a passive relationship with the events."}, "id": "t2q138"}, {"slide": 41, "tags": ["egipto", "espectaculo"], "q": {"es": "¿Qué cuatro elementos básicos para el desarrollo del deporte aparecen con las competiciones de obreros?", "en": "Which four basic elements for the development of sport appear with the workers' competitions?"}, "o": [{"es": "Pruebas, público, fiesta y premios", "en": "Events, audience, festivity, rewards"}, {"es": "Árbitros, reglamento escrito, estadio y entrenadores", "en": "Referees, written rules, stadium and coaches"}, {"es": "Profesionales, apuestas, calendario y federación", "en": "Professionals, betting, calendar and federation"}], "explain": {"es": "Con ellas aparecen varias pruebas, público, un motivo festivo y recompensas.", "en": "With them appear several events, an audience, a festive occasion and rewards."}, "id": "t2q139"}, {"slide": 42, "tags": ["egipto", "mujeres", "religion"], "q": {"es": "¿Quiénes ejecutaban mayoritariamente las danzas en Egipto?", "en": "Who mostly performed dances in Egypt?"}, "o": [{"es": "Profesionales, casi todas mujeres", "en": "Professionals, nearly all women"}, {"es": "Sacerdotes varones del culto a Osiris", "en": "Male priests of the cult of Osiris"}, {"es": "Los príncipes del kap en sus fiestas", "en": "The princes of the kap at their feasts"}], "explain": {"es": "La danza era ejecutada por profesionales, en su inmensa mayoría mujeres.", "en": "Dance was performed by professionals, the vast majority of them women."}, "id": "t2q140"}, {"slide": 42, "tags": ["egipto", "funerario"], "q": {"es": "¿Qué función tenían las danzas en los contextos funerarios?", "en": "What function did dances have in funerary contexts?"}, "o": [{"es": "Estimular la resurrección del difunto", "en": "Stimulating the deceased's resurrection"}, {"es": "Espantar a los ladrones de tumbas de la necrópolis", "en": "Scaring off the tomb robbers of the necropolis"}, {"es": "Anunciar el comienzo de la crecida", "en": "Announcing the start of the flood"}], "explain": {"es": "En contextos funerarios, los bailes servían para estimular la resurrección del difunto.", "en": "In funerary contexts, dances served to stimulate the resurrection of the deceased."}, "id": "t2q141"}, {"slide": 42, "tags": ["egipto", "palacio", "templo"], "q": {"es": "Según la diapositiva, ¿qué dos vías permitían prosperar en la cerrada sociedad egipcia?", "en": "According to the slide, what two routes allowed people to prosper in closed Egyptian society?"}, "o": [{"es": "La escritura y el cuerpo", "en": "Writing and the body"}, {"es": "El comercio y la navegación", "en": "Trade and seafaring"}, {"es": "La guerra y el sacerdocio", "en": "War and the priesthood"}], "explain": {"es": "Gracias a sus habilidades motrices podían prosperar socialmente, algo que solo ofrecen la escritura y el cuerpo.", "en": "Thanks to their motor skills they could rise socially, something offered only by writing and the body."}, "id": "t2q142"}, {"slide": 42, "tags": ["egipto", "palacio"], "q": {"es": "¿Qué obtenían quienes entraban en los cuerpos de danza o acrobacia de templos y palacios?", "en": "What did those who joined temple and palace troupes of dance or acrobatics gain?"}, "o": [{"es": "Mejor dieta, hogar y seguridad", "en": "Better diet, home and security"}, {"es": "Tierras de 3 hectáreas y ganado", "en": "Plots of 3 hectares and livestock"}, {"es": "El título de señora de la casa", "en": "The title of lady of the house"}], "explain": {"es": "Formar parte de esos cuerpos les dotaba de mejor dieta, hogar y seguridad para ellos y sus familias.", "en": "Joining those troupes gave them a better diet, a home and security for themselves and their families."}, "id": "t2q143"}, {"slide": 43, "tags": ["egipto"], "q": {"es": "¿Qué ejercicios acrobáticos son los más comunes en las fuentes egipcias?", "en": "Which acrobatic exercises are most common in Egyptian sources?"}, "o": [{"es": "Rondadas y flip adelante", "en": "Round-offs and forward flip"}, {"es": "Saltos sobre toros y volteretas atrás", "en": "Bull-leaping and back somersaults"}, {"es": "Equilibrios en barras paralelas", "en": "Balances on parallel bars"}], "explain": {"es": "Hay numerosas pruebas gráficas de ejercicios acrobáticos, siendo las rondadas o el «flip» hacia adelante los más comunes.", "en": "There is abundant graphic evidence of acrobatics, the most common being round-offs and the forward «flip»."}, "id": "t2q144"}, {"slide": 43, "tags": ["egipto", "juego"], "q": {"es": "¿Con qué materiales se hacían las pelotas de los malabares?", "en": "With what materials were juggling balls made?"}, "o": [{"es": "Cerámica, madera y cuero", "en": "Pottery, wood and leather"}, {"es": "Bronce, cobre y marfil", "en": "Bronze, copper and ivory"}, {"es": "Papiro trenzado, lino y fayenza", "en": "Plaited papyrus, linen and faience"}], "explain": {"es": "Los malabares se realizaban con pelotas de diferentes tamaños y materiales (cerámica, madera y cuero).", "en": "Juggling was done with balls of different sizes and materials (pottery, wood and leather)."}, "id": "t2q145"}, {"slide": 45, "tags": ["egipto", "juego"], "q": {"es": "¿Qué significa el nombre egipcio del senet?", "en": "What does the Egyptian name of senet mean?"}, "o": [{"es": "Pasar o cruzar", "en": "To pass or to cross"}, {"es": "Divertir el corazón", "en": "To entertain the heart"}, {"es": "Casa del Renacimiento", "en": "House of Rebirth"}], "explain": {"es": "Senet viene del egipcio snt, «pasar» o «cruzar».", "en": "Senet comes from the Egyptian snt, «to pass» or «to cross»."}, "id": "t2q146"}, {"slide": 45, "tags": ["egipto", "juego", "mujeres"], "q": {"es": "¿Qué singularidad tiene el senet en cuanto a la mujer?", "en": "What is distinctive about senet as regards women?"}, "o": [{"es": "Ahí la mujer aparece igual al hombre", "en": "There women appear equal to men"}, {"es": "Estaba prohibido a las mujeres de la élite", "en": "It was forbidden to elite women"}, {"es": "Solo lo jugaban sacerdotisas de Hathor", "en": "Only priestesses of Hathor played it"}], "explain": {"es": "Jugado por las élites de ambos sexos, es la única práctica donde la mujer aparece en igualdad con el hombre.", "en": "Played by elites of both sexes, it is the only practice in which women appear on equal terms with men."}, "id": "t2q147"}, {"slide": 45, "tags": ["egipto", "juego"], "q": {"es": "¿Cómo era el tablero de senet?", "en": "What was the senet board like?"}, "o": [{"es": "30 casillas en tres filas de diez", "en": "30 squares in three rows of ten"}, {"es": "64 casillas dispuestas en ocho filas de ocho", "en": "64 squares set out in eight rows of eight"}, {"es": "20 casillas en dos filas de diez", "en": "20 squares in two rows of ten"}], "explain": {"es": "Es un juego de dos jugadores en un tablero de 30 casillas en tres filas de diez.", "en": "It is a two-player game on a board of 30 squares in three rows of ten."}, "id": "t2q148"}, {"slide": 45, "tags": ["egipto", "juego"], "q": {"es": "En el senet, ¿qué ocurría al caer en la casilla 27 (Agua)?", "en": "In senet, what happened on landing on square 27 (Water)?"}, "o": [{"es": "Se volvía a la casilla 15", "en": "The piece went back to 15"}, {"es": "Se ganaba directamente la partida", "en": "The game was won outright by that player"}, {"es": "Se obtenía un buen augurio", "en": "A good omen was obtained"}], "explain": {"es": "La 27 (Agua) simbolizaba ahogarse y devolvía a la 15; la 26 (Casa de la Belleza) daba buen augurio.", "en": "Square 27 (Water) symbolised drowning and sent the piece back to 15; 26 (House of Beauty) brought a good omen."}, "id": "t2q149"}, {"slide": 45, "tags": ["egipto", "juego", "funerario", "religion"], "q": {"es": "¿Por qué aparece el senet en ajuares funerarios y en el Libro de los Muertos?", "en": "Why does senet appear in burial goods and the Book of the Dead?"}, "o": [{"es": "Su recorrido simbolizaba la resurrección", "en": "Its journey symbolised resurrection"}, {"es": "Era el pasatiempo favorito de los sacerdotes", "en": "It was the priests' favourite pastime"}, {"es": "Servía para fechar los años de reinado", "en": "It was used to date regnal years"}], "explain": {"es": "El senet aparece en ajuares y en el Libro de los Muertos porque el viaje de las fichas simbolizaba la resurrección de los fallecidos.", "en": "Senet appears in burial goods and the Book of the Dead because the journey of the pieces symbolised the resurrection of the deceased."}, "id": "t2q150"}, {"slide": 46, "tags": ["egipto", "juego", "mujeres"], "q": {"es": "Según la iconografía, ¿quiénes practicaban casi en exclusiva los juegos de pelota?", "en": "According to iconography, who almost exclusively played ball games?"}, "o": [{"es": "Mujeres y niñas", "en": "Women and girls"}, {"es": "Soldados en los cuarteles", "en": "Soldiers in the barracks"}, {"es": "Príncipes del kap", "en": "Princes of the kap"}], "explain": {"es": "En la iconografía, los juegos de pelota aparecen practicados casi de forma exclusiva por mujeres y niñas jóvenes.", "en": "In iconography, ball games appear practised almost exclusively by women and young girls."}, "id": "t2q151"}, {"slide": 46, "tags": ["egipto", "juego"], "q": {"es": "¿De qué materiales eran mayormente las pelotas halladas en tumbas egipcias?", "en": "What were the balls found in Egyptian tombs mostly made of?"}, "o": [{"es": "Cuerda, cuero y lino", "en": "Cord, leather and linen"}, {"es": "Madera de acacia y bronce", "en": "Acacia wood and bronze"}, {"es": "Piedra caliza pulida", "en": "Polished limestone blocks"}], "explain": {"es": "Se han hallado numerosas pelotas de diferentes tamaños y materiales, mayormente cuerda apretada, cuero y lino.", "en": "Numerous balls have been found, mostly of tightly wound cord, leather and linen."}, "id": "t2q152"}, {"slide": 46, "tags": ["egipto", "juego"], "q": {"es": "¿Cuántas representaciones del juego del aro se conocen en toda la historia de Egipto?", "en": "How many depictions of the hoop game are known in the whole history of Egypt?"}, "o": [{"es": "Una", "en": "One"}, {"es": "Unas doscientas", "en": "About two hundred"}, {"es": "Catorce", "en": "Fourteen"}], "explain": {"es": "Del juego del aro solo aparece una representación en toda la historia de Egipto.", "en": "Only one depiction of the hoop game appears in the whole history of Egypt."}, "id": "t2q153"}, {"slide": 46, "tags": ["egipto", "juego"], "q": {"es": "¿Por qué es errónea la comparación del juego del aro con el hockey?", "en": "Why is the comparison of the hoop game with hockey mistaken?"}, "o": [{"es": "No usa pelota ni parece de equipo", "en": "No ball, and no apparent team"}, {"es": "Se jugaba a caballo y con lanzas largas", "en": "It was played on horseback with long spears"}, {"es": "Solo lo jugaban niñas pequeñas", "en": "Only little girls played it"}], "explain": {"es": "Se ha comparado erróneamente con el hockey, ya que no se juega con pelota ni aparentemente es un deporte de equipo.", "en": "It has been wrongly compared with hockey, since it is not played with a ball and does not appear to be a team sport."}, "id": "t2q154"}, {"slide": 47, "tags": ["egipto", "faraon", "politica"], "q": {"es": "¿De qué dos cosas dependía el deporte del Egipto faraónico?", "en": "On which two things did sport in pharaonic Egypt depend?"}, "o": [{"es": "El rey garante y un Estado que registra", "en": "A guarantor king and a recording State"}, {"es": "El comercio de cobre y las colonias fenicias", "en": "The copper trade and Phoenician colonies"}, {"es": "Los juegos griegos y los gimnasios", "en": "Greek games and gymnasia"}], "explain": {"es": "Dependía del rey como garante del orden del mundo y de un Estado capaz de medir sus proezas y grabarlas en piedra.", "en": "It depended on the king as guarantor of world order and a State able to measure his feats and carve them in stone."}, "id": "t2q155"}, {"slide": 47, "tags": ["egipto", "provincias"], "q": {"es": "¿Qué hecho del 30 a. C. hace desaparecer la estructura que justificaba las demostraciones físicas reales?", "en": "Which event of 30 BC made the structure that justified royal physical displays vanish?"}, "o": [{"es": "Egipto pasa a provincia romana", "en": "Egypt becomes a Roman province"}, {"es": "La conquista de Alejandro Magno", "en": "Alexander the Great's conquest"}, {"es": "La llegada de los hicsos al norte del país", "en": "The arrival of the Hyksos in the north"}], "explain": {"es": "Con la pérdida de la independencia y la conversión de Egipto en provincia del Imperio Romano (30 a. C.), esa estructura desapareció.", "en": "With the loss of independence and Egypt's conversion into a Roman province (30 BC), that structure vanished."}, "id": "t2q156"}, {"slide": 47, "tags": ["egipto", "esgrima"], "q": {"es": "¿Qué práctica egipcia sobrevive hoy como acto folclórico?", "en": "Which Egyptian practice survives today as a folk performance?"}, "o": [{"es": "La esgrima de bastón", "en": "Stick-fencing"}, {"es": "La carrera del Heb-Sed", "en": "The Heb-Sed run"}, {"es": "El tiro sobre dianas de cobre", "en": "Shooting at copper targets"}], "explain": {"es": "La esgrima de bastón llega al Egipto de hoy, convertida en un acto folclórico sin atribución militar.", "en": "Stick-fencing reaches today's Egypt, turned into a folk performance without military attribution."}, "id": "t2q157"}, {"slide": 47, "tags": ["egipto", "juego"], "q": {"es": "¿Qué prácticas duran más según la conclusión de la diapositiva?", "en": "Which practices last longer according to the slide's conclusion?"}, "o": [{"es": "Las nacidas del trabajo y del juego", "en": "Those born of work and play"}, {"es": "Las que el poder inventa y perpetúa", "en": "Those power invents and perpetuates"}, {"es": "Las grabadas en piedra en las estelas reales", "en": "Those carved in stone on royal stelae"}], "explain": {"es": "Las prácticas que el poder inventa duran lo que dura el poder; las que nacen del trabajo y del juego duran mucho más.", "en": "The practices that power invents last as long as that power; those born of work and play last far longer."}, "id": "t2q158"}, {"slide": 52, "tags": ["persia"], "q": {"es": "¿Qué rasgo, el más duradero de Persia, procede de las estepas de Asia Central vecinas de la meseta irania?", "en": "Which feature, Persia's most enduring one, comes from the Central Asian steppes bordering the Iranian plateau?"}, "o": [{"es": "El caballo", "en": "The horse"}, {"es": "El carro de guerra", "en": "The war chariot"}, {"es": "El arco compuesto de los nómadas", "en": "The composite bow of the nomads"}], "explain": {"es": "La meseta limita con las estepas de Asia Central, donde se domesticó por primera vez el caballo, y de ahí llega a Persia su rasgo más duradero.", "en": "The plateau borders the steppes of Central Asia, where the horse was first domesticated, and from there Persia acquires its most enduring feature."}, "id": "t2q159"}, {"slide": 52, "tags": ["persia", "politica"], "q": {"es": "¿Qué acontecimiento fija el origen de Persia en el año 550 a. C.?", "en": "What event fixes the origin of Persia in 550 BC?"}, "o": [{"es": "Ciro II derrota a los medos", "en": "Cyrus II defeats the Medes"}, {"es": "Darío I conquista Egipto y el Indo", "en": "Darius I conquers Egypt and the Indus"}, {"es": "Jerjes funda la capital en Persépolis", "en": "Xerxes founds the capital at Persepolis"}], "explain": {"es": "El origen de Persia se fija en el 550 a. C., cuando Ciro II derrota a los medos y funda el imperio aqueménida.", "en": "The origin of Persia is fixed in 550 BC, when Cyrus II defeats the Medes and founds the Achaemenid Empire."}, "id": "t2q160"}, {"slide": 52, "tags": ["persia", "politica"], "q": {"es": "Según la diapositiva, ¿cuál de estos elementos figura entre los cuatro pilares que mantenían unido el imperio persa?", "en": "According to the slide, which of these is one of the four pillars that held the Persian Empire together?"}, "o": [{"es": "La gestión de la distancia", "en": "The management of distance"}, {"es": "La flota de guerra del Egeo", "en": "The war fleet of the Aegean"}, {"es": "Una religión común impuesta a todos", "en": "A common religion imposed on all"}], "explain": {"es": "Cuatro pilares mantienen unido el territorio, que son la caballería, el arco, la educación y la gestión de la distancia.", "en": "Four pillars hold the territory together: cavalry, the bow, education and the management of distance."}, "id": "t2q161"}, {"slide": 52, "tags": ["persia", "politica"], "q": {"es": "¿Cómo se llamaban las provincias del imperio persa y quién las gobernaba?", "en": "What were the provinces of the Persian Empire called, and who governed them?"}, "o": [{"es": "Satrapías, gobernadas por sátrapas", "en": "Satrapies, governed by satraps"}, {"es": "Nomos, gobernados por nomarcas", "en": "Nomes, governed by nomarchs"}, {"es": "Ciudades-estado, gobernadas por consejos de ancianos", "en": "City-states, governed by councils of elders"}], "explain": {"es": "El imperio se divide en satrapías gobernadas por sátrapas, nobles persas nombrados directamente por el monarca.", "en": "The empire is divided into satrapies governed by satraps, Persian nobles appointed directly by the monarch."}, "id": "t2q162"}, {"slide": 52, "tags": ["persia", "ejercito"], "q": {"es": "¿Qué eran los Inmortales?", "en": "Who were the Immortals?"}, "o": [{"es": "Un cuerpo permanente de diez mil soldados que acompañaba al rey", "en": "A permanent corps of ten thousand soldiers accompanying the king"}, {"es": "Los sacerdotes encargados del culto al dios persa en la corte de Persépolis", "en": "The priests in charge of the cult of the Persian god at the court of Persepolis"}, {"es": "Los nobles nombrados para gobernar las provincias", "en": "The nobles appointed to govern the provinces"}], "explain": {"es": "Los reyes ejercían su autoridad en persona y los acompañaba un cuerpo permanente de diez mil soldados, los llamados Inmortales.", "en": "The kings exercised their authority in person and were accompanied by a permanent corps of ten thousand soldiers, the so-called Immortals."}, "id": "t2q163"}, {"slide": 52, "tags": ["persia", "politica"], "q": {"es": "¿Qué hecho marca el fin del imperio aqueménida?", "en": "What event marks the end of the Achaemenid Empire?"}, "o": [{"es": "La destrucción de Persépolis por Alejandro Magno", "en": "The destruction of Persepolis by Alexander the Great"}, {"es": "La conquista árabe y la llegada del islam a la meseta", "en": "The Arab conquest and the arrival of Islam on the plateau"}, {"es": "La derrota persa en la batalla de Maratón", "en": "The Persian defeat at the battle of Marathon"}], "explain": {"es": "El fin del imperio llega con la destrucción de su capital, Persépolis, por Alejandro Magno en el 330 a. C.", "en": "The end of the empire comes with the destruction of its capital, Persepolis, by Alexander the Great in 330 BC."}, "id": "t2q164"}, {"slide": 53, "tags": ["persia"], "q": {"es": "¿En cuántas etapas divide la diapositiva la historia de Persia?", "en": "Into how many stages does the slide divide the history of Persia?"}, "o": [{"es": "Seis", "en": "Six"}, {"es": "Tres", "en": "Three"}, {"es": "Cuatro", "en": "Four"}], "explain": {"es": "El imperio de Ciro II, Darío y Jerjes es solo la primera de seis etapas.", "en": "The empire of Cyrus II, Darius and Xerxes is only the first of six stages."}, "id": "t2q165"}, {"slide": 53, "tags": ["persia", "lucha", "arco"], "q": {"es": "¿Qué tienen en común los seis periodos de la historia persa en materia deportiva?", "en": "What do the six periods of Persian history have in common in terms of sport?"}, "o": [{"es": "Mundo equino, tiro con arco y lucha", "en": "The horse, archery and wrestling"}, {"es": "Natación, remo y carreras a pie por el desierto", "en": "Swimming, rowing and foot races across the desert"}, {"es": "Carros, caza del león y esgrima", "en": "Chariots, lion hunting and fencing"}], "explain": {"es": "Lo común a los seis periodos es estable, puesto que en todos aparecen el mundo equino, el tiro con arco y la lucha.", "en": "What the six periods have in common is stable: the world of the horse, archery and wrestling."}, "id": "t2q166"}, {"slide": 53, "tags": ["persia"], "q": {"es": "Según la diapositiva, ¿qué es lo que se transforma de un periodo persa a otro?", "en": "According to the slide, what changes from one Persian period to another?"}, "o": [{"es": "Quién practica, para qué y qué significa", "en": "Who practises, for what and what it means"}, {"es": "Los deportes practicados, que cambian por completo en cada etapa", "en": "The sports practised, which change completely in each stage"}, {"es": "Solo la lengua de las fuentes", "en": "Only the language of the sources"}], "explain": {"es": "Lo que se transforma es quién realiza estas actividades, para qué y qué significan.", "en": "What changes is who performs these activities, for what purpose and what they mean."}, "id": "t2q167"}, {"slide": 53, "tags": ["persia", "religion"], "q": {"es": "¿Qué periodo persa es el último imperio antes del islam y contemporáneo de Bizancio?", "en": "Which Persian period is the last empire before Islam and contemporary with Byzantium?"}, "o": [{"es": "Sasánida", "en": "Sasanian"}, {"es": "Seléucida y parto", "en": "Seleucid and Parthian"}, {"es": "Safávida y qajar", "en": "Safavid and Qajar"}], "explain": {"es": "El periodo sasánida (224-651 d. C.) es el último imperio persa antes del islam, contemporáneo de Bizancio.", "en": "The Sasanian period (AD 224-651) is the last Persian empire before Islam, contemporary with Byzantium."}, "id": "t2q168"}, {"slide": 53, "tags": ["persia"], "q": {"es": "¿Qué periodo persa, entre 1501 y 1925, es contemporáneo de la Edad Moderna europea y la Revolución Industrial?", "en": "Which Persian period, between 1501 and 1925, is contemporary with the European early modern period and the Industrial Revolution?"}, "o": [{"es": "Safávida y qajar", "en": "Safavid and Qajar"}, {"es": "Islámico", "en": "Islamic"}, {"es": "Seléucida y parto", "en": "Seleucid and Parthian"}], "explain": {"es": "La etapa safávida y qajar (1501-1925) es contemporánea de la Edad Moderna europea y de la Revolución Industrial.", "en": "The Safavid and Qajar stage (1501-1925) is contemporary with the European early modern period and the Industrial Revolution."}, "id": "t2q169"}, {"slide": 53, "tags": ["persia"], "q": {"es": "¿Cuántos años median entre la primera y la última Persia, según la diapositiva?", "en": "How many years lie between the first and the last Persia, according to the slide?"}, "o": [{"es": "Unos dos mil quinientos", "en": "About two thousand five hundred"}, {"es": "Unos ochocientos años", "en": "About eight hundred years"}, {"es": "Algo más de tres mil quinientos", "en": "Somewhat over three thousand five hundred"}], "explain": {"es": "Entre la primera y la última Persia median dos mil quinientos años.", "en": "Between the first and the last Persia lie two thousand five hundred years."}, "id": "t2q170"}, {"slide": 54, "tags": ["persia"], "q": {"es": "¿Qué se conserva del deporte iranio antiguo escrito por un persa?", "en": "What survives of ancient Iranian sport written by a Persian?"}, "o": [{"es": "Ninguna descripción", "en": "No description"}, {"es": "Un tratado de educación física", "en": "A treatise on physical education"}, {"es": "Varias crónicas de la corte", "en": "Several court chronicles"}], "explain": {"es": "Del deporte iranio antiguo no se conserva ninguna descripción escrita por un persa.", "en": "No description of ancient Iranian sport written by a Persian survives."}, "id": "t2q171"}, {"slide": 54, "tags": ["persia", "educacion"], "q": {"es": "¿Qué autor griego explica en su Historia la educación física juvenil persa?", "en": "Which Greek author explains the physical education of Persian youth in his Histories?"}, "o": [{"es": "Heródoto", "en": "Herodotus"}, {"es": "Tucídides", "en": "Thucydides"}, {"es": "Jenofonte", "en": "Xenophon"}], "explain": {"es": "Heródoto, en su obra Historia, explica la educación física juvenil persa.", "en": "Herodotus, in his Histories, explains the physical education of Persian youth."}, "id": "t2q172"}, {"slide": 54, "tags": ["persia"], "q": {"es": "¿Cuál es la fuente más extensa sobre la vida y la formación de Ciro II?", "en": "What is the most extensive source on the life and training of Cyrus II?"}, "o": [{"es": "La Ciropedia de Jenofonte", "en": "Xenophon's Cyropaedia"}, {"es": "La Geografía de Estrabón", "en": "Strabo's Geography"}, {"es": "Las tablillas administrativas de Persépolis", "en": "The administrative tablets of Persepolis"}], "explain": {"es": "La fuente más extensa es la Ciropedia o Educación de Ciro, escrita por Jenofonte hacia el 370 a. C.", "en": "The most extensive source is the Cyropaedia or Education of Cyrus, written by Xenophon around 370 BC."}, "id": "t2q173"}, {"slide": 54, "tags": ["persia"], "q": {"es": "¿Quién era Jenofonte?", "en": "Who was Xenophon?"}, "o": [{"es": "Un militar ateniense, discípulo de Sócrates", "en": "An Athenian soldier, disciple of Socrates"}, {"es": "Un sátrapa persa que escribía en griego para la corte", "en": "A Persian satrap who wrote in Greek for the court"}, {"es": "Un geógrafo de época romana", "en": "A geographer of the Roman period"}], "explain": {"es": "La Ciropedia la escribió Jenofonte, militar ateniense y discípulo de Sócrates.", "en": "The Cyropaedia was written by Xenophon, an Athenian soldier and disciple of Socrates."}, "id": "t2q174"}, {"slide": 54, "tags": ["persia"], "q": {"es": "¿Por qué conviene leer la Ciropedia con cautela?", "en": "Why should the Cyropaedia be read with caution?"}, "o": [{"es": "Es ficción con intención política, escrita por un griego para griegos", "en": "It is fiction with political intent, by a Greek for Greeks"}, {"es": "Es una traducción tardía de un original persa perdido", "en": "It is a late translation of a lost Persian original"}, {"es": "Porque Jenofonte nunca conoció a ningún persa y solo copió lo que había escrito Heródoto", "en": "Because Xenophon never met any Persian and only copied what Herodotus had written"}], "explain": {"es": "La Ciropedia es una obra de ficción con intención política y pedagógica, escrita por un griego, en griego, para griegos, tras décadas de enemistad militar.", "en": "The Cyropaedia is a work of fiction with a political and pedagogical intent, written by a Greek, in Greek, for Greeks, after decades of military enmity."}, "id": "t2q175"}, {"slide": 54, "tags": ["persia", "caza"], "q": {"es": "Además de los autores griegos, ¿qué fuentes persas se conservan sobre el deporte antiguo?", "en": "Besides the Greek authors, which Persian sources survive on ancient sport?"}, "o": [{"es": "Tablillas, inscripciones reales y relieves", "en": "Tablets, royal inscriptions and reliefs"}, {"es": "Reglamentos de juegos escritos en papiro", "en": "Rules of games written on papyrus"}, {"es": "Listas de vencedores de los concursos atléticos de la corte", "en": "Lists of victors of the court's athletic contests"}], "explain": {"es": "Se cuenta con tablillas administrativas de Persépolis, inscripciones reales que hablan del cuerpo del monarca y relieves que lo muestran cazando.", "en": "There are administrative tablets of Persepolis, royal inscriptions that speak of the monarch's body, and reliefs showing him hunting."}, "id": "t2q176"}, {"slide": 56, "tags": ["persia", "faraon", "politica"], "q": {"es": "¿Por qué el rey persa estaba obligado a demostrar con su cuerpo que merecía el trono?", "en": "Why was the Persian king obliged to prove with his body that he deserved the throne?"}, "o": [{"es": "Porque su legitimidad divina debía hacerse visible", "en": "Because his divine legitimacy had to be made visible"}, {"es": "Porque lo elegía una asamblea de guerreros tras un concurso atlético", "en": "Because an assembly of warriors chose him after an athletic contest"}, {"es": "Porque así lo exigían los sátrapas", "en": "Because the satraps demanded it"}], "explain": {"es": "El rey gobierna porque la divinidad lo ha designado, y una legitimidad de ese tipo hay que hacerla visible.", "en": "The king rules because the divinity has appointed him, and legitimacy of that kind has to be made visible."}, "id": "t2q177"}, {"slide": 56, "tags": ["persia", "arco", "caza"], "q": {"es": "¿Qué dos prácticas convierte la monarquía persa en una cuestión de Estado?", "en": "Which two practices does the Persian monarchy turn into a matter of State?"}, "o": [{"es": "El arco y la caza", "en": "The bow and the hunt"}, {"es": "La lucha y la carrera de carros", "en": "Wrestling and the chariot race"}, {"es": "La natación y la esgrima", "en": "Swimming and fencing"}], "explain": {"es": "De ahí salen las dos prácticas que la monarquía convierte en una cuestión de Estado: el arco y la caza.", "en": "From this come the two practices that the monarchy turns into a matter of State: the bow and the hunt."}, "id": "t2q178"}, {"slide": 56, "tags": ["persia", "arco", "caza"], "q": {"es": "¿Cuál es la razón principal por la que el rey elige el arco y la caza para exhibirse?", "en": "What is the main reason the king chooses the bow and the hunt to display himself?"}, "o": [{"es": "El resultado depende solo del rey", "en": "The result depends only on the king"}, {"es": "Son las prácticas más baratas y fáciles de organizar en la corte", "en": "They are the cheapest and easiest practices to organise at court"}, {"es": "Las impuso la religión", "en": "Religion imposed them"}], "explain": {"es": "Las dos se ejecutan ante una multitud, exigen años de entrenamiento y, sobre todo, en ellas el resultado depende únicamente del propio rey.", "en": "Both are performed before a crowd, demand years of training and, above all, in both the result depends solely on the king himself."}, "id": "t2q179"}, {"slide": 56, "tags": ["persia", "faraon"], "q": {"es": "¿Cuánto tiempo separa el modelo aqueménida del cuerpo real del de los sasánidas, según la diapositiva?", "en": "How much time separates the Achaemenid model of the royal body from that of the Sasanians, according to the slide?"}, "o": [{"es": "Unos ochocientos años", "en": "About eight hundred years"}, {"es": "Unos dos mil años", "en": "About two thousand years"}, {"es": "Unos ciento cincuenta años", "en": "About one hundred and fifty years"}], "explain": {"es": "Se verá qué queda del mecanismo ochocientos años más tarde, con los sasánidas, otra línea dinástica y otra religión.", "en": "We shall see what remains of the mechanism eight hundred years later, under the Sasanians, with another dynastic line and religion."}, "id": "t2q180"}, {"slide": 57, "tags": ["persia", "faraon", "tumba"], "q": {"es": "¿Dónde mandó grabar Darío I el texto en que habla de su propio cuerpo?", "en": "Where did Darius I have the text about his own body carved?"}, "o": [{"es": "En la fachada de su tumba en Naqsh-e Rostam", "en": "On the façade of his tomb at Naqsh-e Rostam"}, {"es": "En las murallas del palacio de Susa", "en": "On the walls of the palace of Susa"}, {"es": "En un templo de Egipto dedicado a su propia coronación", "en": "In an Egyptian temple dedicated to his own coronation"}], "explain": {"es": "En Naqsh-e Rostam, cerca de Persépolis, Darío I mandó grabar un texto en la fachada de su propia tumba.", "en": "At Naqsh-e Rostam, near Persepolis, Darius I had a text carved on the façade of his own tomb."}, "id": "t2q181"}, {"slide": 57, "tags": ["persia", "faraon", "religion"], "q": {"es": "¿A quién atribuye la inscripción de Darío I sus capacidades físicas?", "en": "To whom does the inscription of Darius I attribute his physical abilities?"}, "o": [{"es": "Al dios persa", "en": "To the Persian god"}, {"es": "A sus instructores de juventud en la escuela del Estado", "en": "To his youth instructors in the State school"}, {"es": "A su padre", "en": "To his father"}], "explain": {"es": "El texto aclara que son capacidades que el dios persa depositó sobre él; la superioridad física del soberano se presenta como don divino.", "en": "The text makes clear that these are capacities the Persian god bestowed on him; the sovereign's physical superiority is a divine gift."}, "id": "t2q182"}, {"slide": 57, "tags": ["persia", "faraon", "lucha"], "q": {"es": "¿En qué faceta física nunca aparece el rey en la inscripción de Darío I?", "en": "In what physical role does the king never appear in the inscription of Darius I?"}, "o": [{"es": "Luchador", "en": "Wrestler"}, {"es": "Jinete", "en": "Horseman"}, {"es": "Cazador a caballo", "en": "Mounted hunter"}], "explain": {"es": "El rey aparece como jinete, arquero, lancero y cazador, pero nunca como luchador cuerpo a cuerpo.", "en": "The king appears as horseman, archer, spearman and hunter, but never as a hand-to-hand wrestler."}, "id": "t2q183"}, {"slide": 57, "tags": ["persia", "lucha", "faraon"], "q": {"es": "¿Por qué la inscripción de Darío I omite la lucha?", "en": "Why does the inscription of Darius I leave out wrestling?"}, "o": [{"es": "Su resultado es incierto y el rey no puede ser derrotado", "en": "Its result is uncertain and the king cannot be beaten"}, {"es": "La lucha estaba prohibida por la religión persa", "en": "Wrestling was forbidden by Persian religion"}, {"es": "Era un deporte de origen griego que los persas despreciaban", "en": "It was a sport of Greek origin that the Persians despised"}], "explain": {"es": "La lucha puede arrojar un resultado incierto, y un rey no puede permitirse ser derrotado delante de sus súbditos; es el mismo tabú del faraón victor perpetuus.", "en": "Wrestling can yield an uncertain result, and a king cannot afford to be defeated before his subjects; it is the same taboo as the pharaoh's victor perpetuus."}, "id": "t2q184"}, {"slide": 57, "tags": ["persia", "faraon"], "q": {"es": "¿Qué explica, según la diapositiva, que el texto de Darío I repita el esquema egipcio?", "en": "According to the slide, what explains why Darius I's text repeats the Egyptian scheme?"}, "o": [{"es": "Darío I reinó también sobre Egipto", "en": "Darius I also reigned over Egypt"}, {"es": "Lo redactaron escribas egipcios contratados por la corte", "en": "It was written by Egyptian scribes hired by the court"}, {"es": "Ambos pueblos tenían el mismo dios", "en": "Both peoples had the same god"}], "explain": {"es": "Darío I reinó también sobre Egipto, por lo que la similitud puede tomarse como un préstamo cultural.", "en": "Darius I also reigned over Egypt, so the similarity can be taken as a cultural borrowing."}, "id": "t2q185"}, {"slide": 57, "tags": ["persia", "faraon"], "q": {"es": "¿Qué valor tiene la inscripción de Darío I como fuente?", "en": "What value does the inscription of Darius I have as a source?"}, "o": [{"es": "Es la única fuente persa primaria sobre el cuerpo del rey", "en": "It is the only Persian primary source on the king's body"}, {"es": "Es una copia tardía hecha por autores griegos", "en": "It is a late copy made by Greek authors"}, {"es": "Es la crónica de unos juegos reales celebrados en Persépolis cada año", "en": "It is the chronicle of royal games held every year at Persepolis"}], "explain": {"es": "Es la única fuente persa primaria directa y en primera persona sobre el cuerpo del rey.", "en": "It is the only direct, first-person Persian primary source on the king's body."}, "id": "t2q186"}, {"slide": 58, "tags": ["persia", "caza", "paradeisos"], "q": {"es": "¿Qué eran los paradeisos?", "en": "What were the paradeisos?"}, "o": [{"es": "Grandes parques cercados y abastecidos de animales", "en": "Great enclosed parks stocked with animals"}, {"es": "Jardines de palacio para el descanso", "en": "Palace gardens for rest"}, {"es": "Templos dedicados a la diosa de la caza en las capitales del imperio", "en": "Temples dedicated to the goddess of hunting in the capitals of the empire"}], "explain": {"es": "Para cazar se crean los paradeisos, grandes parques cercados y abastecidos de animales.", "en": "For hunting they create the paradeisos, great enclosed parks stocked with animals."}, "id": "t2q187"}, {"slide": 58, "tags": ["persia", "paradeisos"], "q": {"es": "¿Qué palabra castellana procede del término iranio paradeisos, a través del griego?", "en": "Which English word comes from the Iranian term paradeisos, via Greek?"}, "o": [{"es": "Paraíso", "en": "Paradise"}, {"es": "Parque", "en": "Park"}, {"es": "Parámetro", "en": "Parameter"}], "explain": {"es": "De esa palabra irania, a través del griego, procede nuestro «paraíso».", "en": "From that Iranian word, via Greek, comes our «paradise»."}, "id": "t2q188"}, {"slide": 58, "tags": ["persia", "caza"], "q": {"es": "¿De quién heredan los persas la caza del león como liturgia de Estado?", "en": "From whom do the Persians inherit the lion hunt as a State liturgy?"}, "o": [{"es": "De los reyes asirios", "en": "From the Assyrian kings"}, {"es": "De los faraones egipcios", "en": "From the Egyptian pharaohs"}, {"es": "De los medos derrotados por Ciro II", "en": "From the Medes defeated by Cyrus II"}], "explain": {"es": "Los reyes asirios habían convertido la caza del león en una liturgia de Estado; al conquistarlos, los persas heredan la práctica.", "en": "The Assyrian kings had turned the lion hunt into a State liturgy; on conquering them, the Persians inherit the practice."}, "id": "t2q189"}, {"slide": 58, "tags": ["persia", "caza", "nobleza"], "q": {"es": "¿Cuál de estas funciones cumplía la caza real persa según la diapositiva?", "en": "Which of these functions did the Persian royal hunt fulfil, according to the slide?"}, "o": [{"es": "El control simbólico de la naturaleza", "en": "Symbolic control of nature"}, {"es": "La obtención de carne para el ejército en campaña", "en": "Obtaining meat for the army on campaign"}, {"es": "El comercio de pieles", "en": "The trade in hides"}], "explain": {"es": "La caza cumplía cuatro funciones a la vez, que eran el adiestramiento militar, la escenificación del poder, el control simbólico de la naturaleza y el aprendizaje de los jóvenes nobles.", "en": "The hunt fulfilled four functions: military training, staging of power, symbolic control of nature and training of young nobles."}, "id": "t2q190"}, {"slide": 58, "tags": ["persia", "caza"], "q": {"es": "¿Qué le ocurrió a Darío I durante una cacería?", "en": "What happened to Darius I during a hunt?"}, "o": [{"es": "Se mutiló un pie al bajar del caballo", "en": "He maimed a foot when dismounting"}, {"es": "Lo salvó de unos leones uno de sus súbditos", "en": "One of his subjects saved him from some lions"}, {"es": "Fue asesinado", "en": "He was murdered"}], "explain": {"es": "Darío I se mutiló un pie al bajarse del caballo demasiado deprisa; fue Artajerjes II quien fue salvado de los leones y Esmerdis quien fue asesinado.", "en": "Darius I maimed a foot by dismounting too quickly; it was Artaxerxes II who was saved from lions and Smerdis who was murdered."}, "id": "t2q191"}, {"slide": 58, "tags": ["persia", "caza", "nobleza"], "q": {"es": "¿Por qué Artajerjes I mandó decapitar al cortesano Megabizo?", "en": "Why did Artaxerxes I order the courtier Megabyzus to be beheaded?"}, "o": [{"es": "Por matar un león antes que el rey", "en": "For killing a lion before the king"}, {"es": "Por huir de los leones y dejar solo al rey durante la cacería", "en": "For fleeing the lions and leaving the king alone during the hunt"}, {"es": "Por cazar fuera del coto", "en": "For hunting outside the park"}], "explain": {"es": "El rey se reservaba el derecho de cazar primero; Megabizo arrojó su lanza primero a un león y el rey ordenó decapitarlo.", "en": "The king reserved the right to hunt first; Megabyzus threw his spear at a lion first and the king ordered him beheaded."}, "id": "t2q192"}, {"slide": 58, "tags": ["persia", "caza", "politica"], "q": {"es": "¿Cómo se ha interpretado la ausencia de episodios de caza en las fuentes persas con el paso del tiempo?", "en": "How has the absence of hunting episodes in the Persian sources been interpreted over time?"}, "o": [{"es": "Como signo de decadencia de la monarquía", "en": "As a sign of the monarchy's decline"}, {"es": "Como prueba de que la caza se prohibió", "en": "As proof that hunting was banned"}, {"es": "Como resultado de la desaparición de los leones en la meseta irania", "en": "As the result of lions disappearing from the Iranian plateau"}], "explain": {"es": "Con el tiempo, la ausencia en las fuentes de episodios de caza se ha leído como signo de decadencia de la monarquía.", "en": "Over time, the absence of hunting episodes in the sources has been read as a sign of the decline of the monarchy."}, "id": "t2q193"}, {"slide": 60, "tags": ["persia", "educacion", "arco"], "q": {"es": "Según Heródoto, ¿en qué tres aspectos se educaba a los jóvenes persas?", "en": "According to Herodotus, in what three things were young Persians educated?"}, "o": [{"es": "Montar, disparar el arco y decir la verdad", "en": "Riding, shooting the bow and telling the truth"}, {"es": "Leer, luchar y nadar", "en": "Reading, wrestling and swimming"}, {"es": "Cazar leones, remar y cantar poesía épica en la corte", "en": "Hunting lions, rowing and singing epic poetry at court"}], "explain": {"es": "Heródoto escribe que los jóvenes persas son educados de los cinco a los veinte años en montar a caballo, disparar el arco y decir la verdad.", "en": "Herodotus writes that young Persians are educated from five to twenty in riding a horse, shooting the bow and telling the truth."}, "id": "t2q194"}, {"slide": 60, "tags": ["persia", "educacion"], "q": {"es": "¿Hasta qué edad alarga Estrabón la formación de los jóvenes persas?", "en": "Up to what age does Strabo extend the training of young Persians?"}, "o": [{"es": "Veinticuatro años", "en": "Twenty-four"}, {"es": "Veinte años", "en": "Twenty"}, {"es": "Hasta los treinta y cinco años", "en": "Up to thirty-five years"}], "explain": {"es": "Estrabón, tres siglos después de Heródoto, alarga la formación hasta los veinticuatro años.", "en": "Strabo, three centuries after Herodotus, extends the training to the age of twenty-four."}, "id": "t2q195"}, {"slide": 60, "tags": ["persia", "educacion", "politica"], "q": {"es": "¿Cuál era el fin de la educación en el imperio aqueménida?", "en": "What was the purpose of education in the Achaemenid Empire?"}, "o": [{"es": "Impedir que los hijos de los persas dejaran de serlo", "en": "To keep the sons of Persians Persian"}, {"es": "Integrar a los pueblos conquistados en el ejército", "en": "To integrate conquered peoples into the army"}, {"es": "Formar a los escribas que necesitaban las satrapías del imperio", "en": "To train the scribes the empire's satrapies needed"}], "explain": {"es": "El imperio lo gobierna una minoría persa dispersa, y la educación tiene como fin impedir que los hijos de los persas dejen de serlo.", "en": "The empire is governed by a scattered Persian minority, and the purpose of education is to prevent the sons of Persians from ceasing to be Persian."}, "id": "t2q196"}, {"slide": 60, "tags": ["persia", "educacion", "mujeres"], "q": {"es": "Según Jenofonte, ¿cómo era la educación persa?", "en": "According to Xenophon, what was Persian education like?"}, "o": [{"es": "Masculina y obligatoria", "en": "Male and compulsory"}, {"es": "Voluntaria y abierta a ambos sexos", "en": "Voluntary and open to both sexes"}, {"es": "Privada y reservada a los hijos del rey", "en": "Private and reserved for the king's sons"}], "explain": {"es": "Según Jenofonte la educación persa era masculina y obligatoria, y el Estado asumía la competencia de formar a los jóvenes.", "en": "According to Xenophon, Persian education was male and compulsory, and the State took on the task of training the young."}, "id": "t2q197"}, {"slide": 60, "tags": ["persia", "educacion"], "q": {"es": "¿Qué prueba debían superar los jóvenes persas hacia los doce años?", "en": "What test did young Persians have to pass around the age of twelve?"}, "o": [{"es": "Un examen de resistencia en entornos hostiles", "en": "An endurance test in hostile surroundings"}, {"es": "Una carrera ante el rey para obtener un premio en oro", "en": "A race before the king to win a prize in gold"}, {"es": "Un combate de lucha", "en": "A wrestling bout"}], "explain": {"es": "Hacia los 12 años se realiza un examen de resistencia física y mental en entornos remotos y hostiles, con temperaturas extremas, poca comida y ríos que cruzar sin mojar las armas.", "en": "Around age 12 there is a test of physical and mental endurance in remote, hostile surroundings, with extreme temperatures, little food and rivers to cross without wetting weapons."}, "id": "t2q198"}, {"slide": 60, "tags": ["persia", "educacion", "ejercito"], "q": {"es": "¿Qué etapa de la educación persa correspondía al ingreso en el servicio militar?", "en": "Which stage of Persian education corresponded to entry into military service?"}, "o": [{"es": "De los 16 a los 24 años", "en": "Ages 16 to 24"}, {"es": "De los 6 a los 16 años", "en": "Ages 6 to 16"}, {"es": "Desde los 24 años hasta los 30", "en": "From age 24 to age 30"}], "explain": {"es": "De los 16 a los 24 años se ingresa en el servicio militar; al completar el dominio de armas el joven queda incorporado como guerrero.", "en": "From 16 to 24 comes entry into military service; on mastering weapons the young man is incorporated as a warrior."}, "id": "t2q199"}, {"slide": 61, "tags": ["persia", "educacion", "nobleza"], "q": {"es": "¿A quién se limitaba la educación del cuerpo organizada en época sasánida?", "en": "To whom was the organised education of the body limited in the Sasanian period?"}, "o": [{"es": "A la élite", "en": "The elite"}, {"es": "A todos los varones libres del imperio", "en": "All free men of the empire"}, {"es": "A los campesinos", "en": "The peasants"}], "explain": {"es": "La educación del cuerpo organizada quedaba limitada a la élite frente a una mayoría campesina en gran parte analfabeta.", "en": "The organised education of the body was limited to the elite, while a peasant majority remained largely illiterate."}, "id": "t2q200"}, {"slide": 61, "tags": ["persia", "educacion"], "q": {"es": "¿Qué significa frahangestān?", "en": "What does frahangestān mean?"}, "o": [{"es": "Lugar de educación", "en": "Place of education"}, {"es": "Casa de fuerza", "en": "House of strength"}, {"es": "Parque cercado de caza", "en": "Enclosed hunting park"}], "explain": {"es": "El niño noble empezaba la escuela, el frahangestān («lugar de educación»), entre los cinco y los siete años.", "en": "The noble boy started school, the frahangestān («place of education»), between the ages of five and seven."}, "id": "t2q201"}, {"slide": 61, "tags": ["persia", "educacion", "polo"], "q": {"es": "¿Qué práctica física aprendía el niño noble sasánida junto a la equitación y el arco?", "en": "Which physical practice did the Sasanian noble boy learn along with riding and archery?"}, "o": [{"es": "El juego de pelota a caballo", "en": "The ball game on horseback"}, {"es": "La natación en los ríos de la meseta", "en": "Swimming in the rivers of the plateau"}, {"es": "La lucha", "en": "Wrestling"}], "explain": {"es": "Aprendía a escribir, memorizaba los textos religiosos y se ejercitaba en la equitación, el tiro con arco y el juego de pelota a caballo.", "en": "He learned to write, memorised religious texts and practised riding, archery and the ball game on horseback."}, "id": "t2q202"}, {"slide": 61, "tags": ["persia", "educacion", "juego"], "q": {"es": "¿Qué juegos de tablero completaban la formación del noble sasánida?", "en": "Which board games completed the training of the Sasanian noble?"}, "o": [{"es": "Ajedrez y backgammon", "en": "Chess and backgammon"}, {"es": "Senet y mehen", "en": "Senet and mehen"}, {"es": "Dados y tabas de hueso", "en": "Dice and bone knucklebones"}], "explain": {"es": "La formación se completaba con música, canto y juegos de tablero como el ajedrez y el backgammon.", "en": "The training was completed with music, singing and board games such as chess and backgammon."}, "id": "t2q203"}, {"slide": 61, "tags": ["persia", "caza", "nobleza"], "q": {"es": "¿Qué rey sasánida aparece en la caza del ciervo de Taq-e Bostan?", "en": "Which Sasanian king appears in the deer hunt at Taq-e Bostan?"}, "o": [{"es": "Cosroes II", "en": "Khosrow II"}, {"es": "Artajerjes II", "en": "Artaxerxes II"}, {"es": "Ciro II", "en": "Cyrus II"}], "explain": {"es": "En la imagen, Cosroes II (590-628) entra en la cacería a caballo bajo un parasol mientras los ciervos huyen.", "en": "In the image, Khosrow II (590-628) rides into the hunt under a parasol while the deer flee."}, "id": "t2q204"}, {"slide": 61, "tags": ["persia", "educacion", "nobleza"], "q": {"es": "¿Para qué servía la formación física del joven noble sasánida?", "en": "What was the physical training of the young Sasanian noble for?"}, "o": [{"es": "Para ganarse un sitio en la corte", "en": "To earn a place at court"}, {"es": "Para competir en juegos públicos con premios en metálico", "en": "To compete in public games for cash prizes"}, {"es": "Para ingresar en el clero", "en": "To join the clergy"}], "explain": {"es": "¿Para qué servía todo ello? Para ganarse un sitio en la corte, donde el rey seguía exhibiendo su cuerpo en la caza.", "en": "What was all this for? To earn a place at court, where the king went on displaying his body in the hunt."}, "id": "t2q205"}, {"slide": 62, "tags": ["persia", "lucha"], "q": {"es": "¿Qué significa pahlavan?", "en": "What does pahlavan mean?"}, "o": [{"es": "El campeón", "en": "The champion"}, {"es": "El mensajero", "en": "The messenger"}, {"es": "El inmortal", "en": "The immortal"}], "explain": {"es": "Un texto del siglo X documenta por primera vez al pahlavan, «el campeón», un luchador profesional.", "en": "A 10th-century text documents for the first time the pahlavan, «the champion», a professional wrestler."}, "id": "t2q206"}, {"slide": 62, "tags": ["persia", "lucha"], "q": {"es": "¿De qué vivía el pahlavan?", "en": "What did the pahlavan live on?"}, "o": [{"es": "De pelear en público y proteger a quien lo contrata", "en": "Fighting in public and protecting whoever hires him"}, {"es": "De un suel
