<script>
/* Guardar y salir a Historiapp. Común a todos los juegos de la app; lo inserta guardar_salir.py.
   Configuración en window.HAPP_GS = { volver, pos, fijo, visible }.
   - El juego define window.HAPP_GUARDAR() con lo que haya que guardar de la partida en curso.
   - Se guarda al pulsar el botón y también al salir de la página por cualquier otra vía (pagehide y
     visibilitychange), de modo que el progreso no se pierde aunque se cierre la app.
   - window.HAPP_SALIR(href) guarda, avisa y vuelve a Historiapp; los botones propios del juego lo usan. */
(function () {
  'use strict';
  var C = window.HAPP_GS || {};

  /* ---------- Sonido y pausa (revisión del 13-10-2026) ----------
     - Se anotan todos los AudioContext que crea el juego para poder despertarlos y dormirlos.
     - En iPhone el sonido solo arranca dentro de un toque «completo» (touchend o click), y tras salir de la app
       el contexto queda «interrumpido» y el juego ya no suena: se reanuda en cualquier toque posterior.
     - Con audioSession 'playback' (iPhone con iOS 16.4 o posterior) el juego suena aunque el móvil esté en silencio.
     - Al ocultar la app (bloquear el móvil, cambiar de app) se pausa el juego (HAPP_PAUSA o el evento blur que ya
       escuchan los juegos), se duerme el sonido y se paran las músicas; al volver, se reanudan. */
  var ctxs = [], oculto = false, dormidos = [], parados = [];
  try {
    var AC0 = window.AudioContext || window.webkitAudioContext;
    if (AC0 && !AC0.__happ) {
      var ACW = function (o) { var c = o === undefined ? new AC0() : new AC0(o); ctxs.push(c); return c; };
      ACW.prototype = AC0.prototype; ACW.__happ = true;
      window.AudioContext = ACW; if (window.webkitAudioContext) window.webkitAudioContext = ACW;
    }
  } catch (e) {}
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  function despertar() {
    if (oculto) return;
    ctxs.forEach(function (c) { try { if (c.state === 'suspended' || c.state === 'interrupted') c.resume(); } catch (e) {} });
  }
  ['touchend', 'click', 'pointerup', 'keydown'].forEach(function (ev) { addEventListener(ev, despertar, { capture: true, passive: true }); });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') {
      if (oculto) return; oculto = true;
      try { if (typeof window.HAPP_PAUSA === 'function') window.HAPP_PAUSA(); else window.dispatchEvent(new Event('blur')); } catch (e) {}
      ctxs.forEach(function (c) { try { if (c.state === 'running') { c.suspend(); dormidos.push(c); } } catch (e) {} });
      try { document.querySelectorAll('audio,video').forEach(function (m) { if (!m.paused) { try { m.pause(); parados.push(m); } catch (e) {} } }); } catch (e) {}
    } else {
      oculto = false;
      dormidos.splice(0).forEach(function (c) { try { c.resume(); } catch (e) {} });
      parados.splice(0).forEach(function (m) { try { var r = m.play(); if (r && r.catch) r.catch(function () {}); } catch (e) {} });
    }
  });
  var lang = null;
  try { lang = localStorage.getItem('historiapp.lang'); } catch (e) {}
  if (lang !== 'es' && lang !== 'en') lang = String(document.documentElement.lang || navigator.language || 'es').slice(0, 2) === 'en' ? 'en' : 'es';
  var TX = lang === 'en'
    ? { b: 'Save & exit', a: 'Save the game and go back to Historiapp', ok: 'Game saved' }
    : { b: 'Guardar y salir', a: 'Guardar la partida y volver a Historiapp', ok: 'Partida guardada' };
  window.HAPP_GS_TX = TX;
  function guardar() { try { if (typeof window.HAPP_GUARDAR === 'function') window.HAPP_GUARDAR(); } catch (e) {} }
  var yendo = false, aviso = null;
  function salir(href) {
    if (yendo) return; yendo = true;
    guardar();
    if (aviso) aviso.classList.add('on');
    var v = href || (typeof C.volver === 'function' ? C.volver() : C.volver) || '../';
    setTimeout(function () { location.href = v; }, 500);
  }
  window.HAPP_SALIR = salir;
  addEventListener('pagehide', guardar);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') guardar(); });
  var css = '.hgs{position:fixed;z-index:2147482999;display:none;align-items:center;gap:6px;min-height:40px;margin:0;padding:0 13px;border-radius:20px;' +
    'background:rgba(12,10,8,.76);color:#fff;border:1px solid rgba(255,255,255,.5);font:600 13px/1 system-ui,-apple-system,"Segoe UI",sans-serif;' +
    'box-shadow:0 3px 10px rgba(0,0,0,.35);cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;white-space:nowrap}' +
    '.hgs.on{display:inline-flex}.hgs:active{transform:translateY(1px)}' +
    '.hgs-ok{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(.9);opacity:0;z-index:2147483003;pointer-events:none;padding:12px 22px;border-radius:24px;' +
    'background:#EDAB00;color:#1b1406;font:700 17px/1 system-ui,-apple-system,"Segoe UI",sans-serif;box-shadow:0 6px 18px rgba(0,0,0,.45);transition:opacity .2s,transform .2s}' +
    '.hgs-ok.on{opacity:1;transform:translate(-50%,-50%) scale(1)}';
  function build() {
    var st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
    aviso = document.createElement('div'); aviso.className = 'hgs-ok'; aviso.setAttribute('role', 'status'); aviso.textContent = '✓ ' + TX.ok; document.body.appendChild(aviso);
    if (C.fijo === false) return;
    var b = document.createElement('button'); b.type = 'button'; b.className = 'hgs';
    b.innerHTML = '<span aria-hidden="true">💾</span><span>' + TX.b + '</span>'; b.setAttribute('aria-label', TX.a); b.title = TX.a;
    var pos = C.pos || { top: 'max(8px, env(safe-area-inset-top))', right: 'max(10px, env(safe-area-inset-right))' };
    for (var k in pos) b.style[k] = pos[k];
    ['pointerdown', 'touchstart', 'mousedown'].forEach(function (ev) { b.addEventListener(ev, function (e) { e.stopPropagation(); }, { passive: true }); });
    b.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); salir(); });
    document.body.appendChild(b);
    var ver = function () { var on = true; try { on = !C.visible || !!C.visible(); } catch (e) {} b.classList.toggle('on', on); };
    ver(); setInterval(ver, 300);
  }
  if (document.body) build(); else document.addEventListener('DOMContentLoaded', build);

  /* ---------- Giro de pantalla (13-10-2026) ----------
     En algunos Android e iPhone el aviso de girar desaparece pero el juego queda mal dibujado o en blanco:
     el navegador lanza el evento resize antes de dar las medidas definitivas y el juego se dibuja con las viejas.
     1. Se limita la densidad de píxeles a 2 (en pantallas de 3 los lienzos ocupan más del doble de memoria
        y algunos móviles recargan o cuelgan la página al girar).
     2. Tras cada giro se vuelve a avisar al juego del cambio de tamaño cuando las medidas ya son las buenas.
     3. Si el juego se abrió en la orientación equivocada (C.orient 'h' o 'v'), al ponerlo en la buena se recarga
        una vez, con la partida guardada antes, para que arranque con las medidas correctas. */
  try { if ((window.devicePixelRatio || 1) > 2) Object.defineProperty(window, 'devicePixelRatio', { get: function () { return 2; }, configurable: true }); } catch (e) {}
  var portrait = function () { return window.innerHeight > window.innerWidth; };
  var buena = function () { return !C.orient || (C.orient === 'h' ? !portrait() : portrait()); };
  var malAlCargar = !!C.orient && !buena();
  var avisando = false, giroT = [], ultimo = '';
  function avisar() {
    var m = window.innerWidth + 'x' + window.innerHeight;
    avisando = true;
    try { window.dispatchEvent(new Event('resize')); } catch (e) {}
    try { if (window.visualViewport) window.visualViewport.dispatchEvent(new Event('resize')); } catch (e) {}
    avisando = false;
    ultimo = m;
  }
  function recargarSiHaceFalta() {
    if (!malAlCargar || !buena()) return;
    var k = 'happ.giro.' + location.pathname, ahora = Date.now(), antes = 0;
    try { antes = +sessionStorage.getItem(k) || 0; } catch (e) {}
    if (ahora - antes < 20000) return;
    try { sessionStorage.setItem(k, String(ahora)); } catch (e) {}
    malAlCargar = false; guardar(); location.reload();
  }
  function giro() {
    if (avisando) return;
    giroT.forEach(clearTimeout);
    giroT = [120, 350, 700, 1200].map(function (t, i, a) {
      return setTimeout(function () { avisar(); if (i === a.length - 1) recargarSiHaceFalta(); }, t);
    });
  }
  addEventListener('orientationchange', giro);
  addEventListener('resize', function () { if (!avisando) giro(); });
  try { if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', giro); } catch (e) {}
  addEventListener('pageshow', function (e) { if (e.persisted) giro(); });

  /* ---------- Orientación bloqueada y zoom (13-10-2026) ----------
     4. Historiapp instalada en Android hereda la orientación vertical de la app: aunque el alumno gire el móvil,
        la pantalla no gira y el aviso de girar no se va. Dentro de la app instalada, el juego pide su orientación
        con screen.orientation.lock (Android lo permite en apps instaladas; iPhone no lo necesita).
     5. iPhone agranda la letra al poner el móvil en horizontal y amplía la pantalla al tocar un campo de texto
        con letra de menos de 16 px; como los juegos no dejan pellizcar, la pantalla se quedaba grande.
        Se fija el tamaño de letra, los campos pasan a 16 px y el zoom vuelve a 1 al salir del campo o al girar. */
  function bloquear() {
    if (!C.orient) return;
    try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock(C.orient === 'h' ? 'landscape' : 'portrait').catch(function () {}); } catch (e) {}
  }
  bloquear();
  addEventListener('pointerdown', bloquear, { capture: true, passive: true, once: true });
  addEventListener('pageshow', bloquear);
  addEventListener('pagehide', function () { try { screen.orientation.unlock(); } catch (e) {} });
  var vm = document.querySelector('meta[name="viewport"]'), vmBase = vm ? vm.getAttribute('content') : '';
  function sinZoom() {
    if (!vm || (window.visualViewport && Math.abs(window.visualViewport.scale - 1) < 0.01)) return;
    vm.setAttribute('content', vmBase.replace(/,?\s*maximum-scale=[^,]*/g, '') + ',maximum-scale=1');
    setTimeout(function () { vm.setAttribute('content', vmBase); }, 400);
  }
  document.addEventListener('focusout', function (e) { var t = e.target && e.target.tagName; if (t === 'INPUT' || t === 'SELECT' || t === 'TEXTAREA') setTimeout(sinZoom, 60); }, true);
  addEventListener('orientationchange', function () { setTimeout(sinZoom, 400); });
  var st2 = document.createElement('style');
  st2.textContent = 'html{-webkit-text-size-adjust:100%!important;text-size-adjust:100%!important}@media (pointer:coarse){input,select,textarea{font-size:16px!important}}';
  (document.head || document.documentElement).appendChild(st2);
})();
</script>

<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.spot.seen{animation:none;background:radial-gradient(circle,#fff8ea 0 30%,#8a7a5c 31% 58%,#fff8ea 59%)}

@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(220,162,58,.85)}70%{box-shadow:0 0 0 16px rgba(220,162,58,0)}100%{box-shadow:0 0 0 0 rgba(220,162,58,0)}}

.bar{position:absolute;left:0;right:0;bottom:6.4%;display:flex;align-items:center;gap:12px;padding:0 1.6%;pointer-events:none}

.dots{display:flex;gap:5px;margin-top:3px}.dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--negro);background:transparent}.dots i.ok{background:var(--negro)}.dots i.now{background:var(--amar)}
.rinfo{min-width:0;flex:0 1 auto;max-width:46%;background:rgba(243,232,207,.95);border:2px solid var(--negro);border-radius:10px;padding:5px 12px;box-shadow:0 3px 0 var(--negro);display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;overflow:hidden}
.rinfo b{font-size:18px;color:var(--ocreD);font-variant:small-caps;letter-spacing:.04em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.rinfo small{flex-basis:100%;font-size:12.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.top .nx{flex:0 0 auto}

.card::before{content:"";display:block;height:14px;flex:0 0 14px;background:repeating-linear-gradient(90deg,var(--amar) 0 18px,var(--negro) 18px 20px,var(--amar) 20px 26px,var(--ocre) 26px 34px);border-bottom:2px solid var(--negro)}
.card .in{padding:12px 20px 4px;overflow:auto;-webkit-overflow-scrolling:touch}
.card h2{margin:0 0 2px;font-size:22px;color:var(--ocreD);font-variant:small-caps;letter-spacing:.03em;line-height:1.15}

.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card p.sm{font-size:14px;line-height:1.35;margin:2px 0 6px}
.opt small{font-size:12.5px;opacity:.85}
.card p.cr{font-size:14px;line-height:1.4}
.opts{display:flex;flex-direction:column;gap:8px;margin:8px 0}

.opt.ok{background:#d9e8f3;border-color:var(--azulD)}.opt.ok i{background:var(--azul);color:#fff;border-color:var(--azulD)}

.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--azulD);margin-bottom:2px}
/* portada */
.title{position:absolute;left:0;right:0;top:13%;text-align:center;pointer-events:none}
.title h1{margin:0;font-size:calc(var(--s,1)*70px);letter-spacing:.14em;color:#fff3d6;text-shadow:0 3px 0 var(--negro),0 0 18px rgba(0,0,0,.35);font-weight:700}

.hud > *{pointer-events:auto}

.hint.on{opacity:1}
.big{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%) scale(.6);font-size:calc(var(--s,1)*58px);font-weight:700;letter-spacing:.06em;color:#fff3d6;text-shadow:0 3px 0 var(--negro),0 0 14px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:transform .25s cubic-bezier(.3,1.6,.5,1),opacity .2s;white-space:nowrap}

}
@media (prefers-reduced-motion:reduce){.spot{animation:none}.big{transition:none}}

:root{--paper:#f4ecda;--ink:#1a140f}
.card{background:#f7f0e0}
.card::before{background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 9px),var(--paper);border-bottom:2px solid var(--ink)}

function touchUI(on){
  if (!pad){
    pad = $(`<div id="pad"><div id="tjz"></div><div id="tdp"><b></b><i data-k="up">▲</i><i data-k="down">▼</i><i data-k="left">◀</i><i data-k="right">▶</i></div>
      <button class="tb tb-a" data-k="jab"><b>A</b><small></small></button><button class="tb tb-s" data-k="over"><b>S</b><small></small></button>
      <button class="tb tb-d" data-k="guard"><b>D</b><small></small></button></div>`);
    document.body.appendChild(pad);
    // cruceta fija (sustituye al joystick porque con él no entraban bien los combos): el pulgar se desliza de una flecha a otra sin levantarse
    const jz = pad.querySelector('#tjz'), dp = pad.querySelector('#tdp'), on4 = {left:false, right:false, up:false, down:false}; let jId = null;
    const show = () => { for (const k in on4) dp.querySelector(`i[data-k="${k}"]`).classList.toggle('on', on4[k] && k !== 'up'); JOY.nx = (on4.right ? 1 : 0) - (on4.left ? 1 : 0); JOY.ny = (on4.down ? 1 : 0) - (on4.up ? 1 : 0); };
    const rest = () => { jId = null; for (const k in on4) on4[k] = false; JOY.on = false; show(); };
    const upd = (cx, cy) => { const r = dp.getBoundingClientRect(), R = r.width/2 || 69, dx = cx - (r.left + R), dy = cy - (r.top + R), d = Math.hypot(dx, dy); JOY.on = true;
      if (d < R*.2){ for (const k in on4) on4[k] = false; return show(); }
      const ux = dx/d, uy = dy/d; on4.left = ux < -(on4.left ? .3 : .38); on4.right = ux > (on4.right ? .3 : .38); on4.up = uy < -(on4.up ? .45 : .55); on4.down = uy > (on4.down ? .45 : .55); show(); };
    jz.addEventListener('pointerdown', e => { if (jId !== null) return; e.preventDefault(); au(); try { jz.setPointerCapture(e.pointerId); } catch (_) {} jId = e.pointerId; upd(e.clientX, e.clientY); });
    jz.addEventListener('pointermove', e => { if (e.pointerId === jId) upd(e.clientX, e.clientY); });
    const end = e => { if (e.pointerId !== jId) return; rest(); };
    for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) jz.addEventListener(ev, end);
    pad.querySelectorAll('.tb').forEach(b => {
      b.addEventListener('pointerdown', e => { e.preventDefault(); au(); try { b.setPointerCapture(e.pointerId); } catch (_) {} const k = b.dataset.k; b.classList.add('down'); if (k === 'guard') KEYS.guard = true; else PRESS[k] = true; if (navigator.vibrate && k === 'jab') try { navigator.vibrate(6); } catch (_) {} });
      const up = () => { b.classList.remove('down'); if (b.dataset.k === 'guard') KEYS.guard = false; };
      for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) b.addEventListener(ev, up);
      b.addEventListener('contextmenu', e => e.preventDefault()); });
    pad.rest = rest;
  }
  const lbl = {jab:'bA', over:'bS', guard:'bD'}; pad.querySelectorAll('.tb').forEach(b => b.querySelector('small').textContent = t(lbl[b.dataset.k]));
  pad.classList.toggle('on', !!on && TOUCH); if (!on){ KEYS.guard = false; JOY.on = false; } else pad.rest && pad.rest();
}
let TOUCH = (window.matchMedia && matchMedia('(pointer:coarse)').matches) || ('ontouchstart' in window && navigator.maxTouchPoints > 0);
addEventListener('touchstart', () => { if (!TOUCH){ TOUCH = true; if (MODE === 'fight' && A && !A.over && !paused) touchUI(true); } }, {passive:true});

/* ---------- pantallas ---------- */
let paused = false;
function fightUI(){
  const pb = $(`<button class="chip pz" aria-label="${t('pausa')}">❚❚</button>`); pb.onclick = () => pause(); st.appendChild(pb);
  touchUI(true);
}
function pause(){
  if (paused || !A || A.over) return; paused = true; touchUI(false); Object.keys(KEYS).forEach(k => KEYS[k] = false);
  const v = card(`<div class="in"><h2>${t('pausa')}</h2><p class="lg">${L(B.t)}</p></div><div class="act col g2">
    <button class="btn pri" data-c>${t('reanudar')}</button><button class="btn" data-h>${t('como')}</button><button class="btn" data-m>${EMB ? t('palacio') : t('salir')}</button>${HIST.inside && !EMB ? `<button class="btn" data-b>${t('volver')}</button>` : ''}</div>`, 'pz2');
  v.querySelector('[data-c]').onclick = () => { v.remove(); paused = false; last = performance.now(); touchUI(true); };
  v.querySelector('[data-h]').onclick = () => { howTo(() => {}); };
  v.querySelector('[data-m]').onclick = () => { v.remove(); paused = false; if (EMB) post({type:'quit'}); else showTitle(); };
  const hb = v.querySelector('[data-b]'); if (hb) hb.onclick = () => HIST.back();
}
addEventListener('blur', () => { if (MODE === 'fight' && A && !A.over && A.ready <= 0 && TOUCH) pause(); });

function showTitle(){
  MODE = 'title'; A = null; fx.length = 0; clearUI(); touchUI(false); rerender = showTitle; makeDemo(3); topBar();
  st.appendChild($(`<div class="title"><h1>${S.lang === 'es' ? 'PÚGILES' : 'BOXERS'}</h1><p>${t('sub')}</p></div>`));
  const m = $('<div class="menu"></div>');
  const next = Math.min(S.open, BOUTS.length) - 1, started = S.stars.some(x => x > 0);
  const b1 = $(`<button class="btn pri">${started && !S.done ? t('seguir') : t('jugar')}</button>`); b1.onclick = () => { SFX.tap(); intro(S.done ? 0 : Math.max(0, next)); };
  const b2 = $(`<button class="btn">${t('libre')}</button>`); b2.onclick = () => { SFX.tap(); pickBout(); };
  const b3 = $(`<button class="btn">${t('como')}</button>`); b3.onclick = () => { SFX.tap(); howTo(() => {}); };
  m.append(b1, b2, b3); st.appendChild(m);
}
function howTo(done){
  const v = card(`<div class="in"><h2>${t('howT')}</h2><div class="hwc">${UI[S.lang].how.map(p => `<p class="hw">${p}</p>`).join('')}</div></div><div class="act"><button class="btn pri" data-x>OK</button></div>`, 'wide how');
  v.querySelector('[data-x]').onclick = () => { SFX.tap(); v.remove(); done(); };
}
function pickBout(){
  const v = card(`<div class="in"><h2>${t('libre')}</h2><div class="opts g2">${BOUTS.map((b, i) => `<button class="opt"${i >= S.open ? ' disabled' : ''} data-i="${i}"><i>${i + 1}</i><span><b>${L(b.t)}</b><br><small>${i >= S.open ? t('bloq') : L(b.lugar)}</small></span><em class="stars">${'✦'.repeat(S.stars[i])}${'✧'.repeat(3 - S.stars[i])}</em></button>`).join('')}</div></div>
    <div class="act"><button class="btn" data-x>${EMB ? t('palacio') : t('menu')}</button></div>`, 'wide');
  v.querySelectorAll('[data-i]').forEach(b => b.onclick = () => { if (+b.dataset.i >= S.open) return; SFX.tap(); v.remove(); A_free = true; intro(+b.dataset.i); });
  v.querySelector('[data-x]').onclick = () => { SFX.tap(); if (EMB) post({type:'quit'}); else v.remove(); };
}
function freeHome(){ MODE = 'title'; A = null; fx.length = 0; clearUI(); touchUI(false); rerender = freeHome; makeDemo(3); topBar(); pickBout(); }
let A_free = false;
function intro(i){
  MODE = 'intro'; A = null; fx.length = 0; clearUI(); touchUI(false); rerender = () => intro(i); makeDemo(i); topBar();
  const b = BOUTS[i];
  const v = card(`<div class="in"><span class="tag">${t('combate', {a:i + 1, b:BOUTS.length})}</span><h2>${L(b.t)}</h2><p class="sub">${L(b.lugar)}</p>${L(b.intro).map(p => `<p>${p}</p>`).join('')}${fichaBtn(b.ficha)}</div>
    <div class="act"><button class="btn" data-m>${EMB ? (FREE ? t('libre') : t('palacio')) : t('menu')}</button><button class="btn pri" data-g>${t('aCombatir')}</button></div>`, 'side');
  bindFicha(v);
  v.querySelector('[data-m]').onclick = () => { SFX.tap(); A_free = false; if (EMB){ if (FREE) freeHome(); else post({type:'quit'}); } else showTitle(); };
  v.querySelector('[data-g]').onclick = () => { au(); SFX.tap(); startBout(i); };
}
function result(){
  const won = A.winner === A.P, i = A.i, b = B, P0 = A.P;
  MODE = 'end'; clearUI(); touchUI(false); rerender = () => {};
  let stars = 0;
  if (won){ stars = b.mode === 'toques' ? (A.R.touches <= 1 ? 3 : A.R.touches <= 3 ? 2 : 1) : (P0.hp > 55 ? 3 : P0.hp > 25 ? 2 : 1);
    if (stars > S.stars[i]) S.stars[i] = stars; if (S.open < i + 2) S.open = Math.min(BOUTS.length, i + 2);
    if (!S.xpF['b' + i]){ S.xpF['b' + i] = 1; HIST.xp(20); } save(); }
  const isLast = i === BOUTS.length - 1;
  const m = Math.floor(A.time/60), s = Math.floor(A.time % 60);
  const mid = (A.P.x + A.R.x)/2;
  const v = card(`<div class="in"><span class="tag">${L(b.t)}</span><h2>${won ? t('gana') : t('pierde')}</h2>
    ${won ? `<p class="stars big2">${'✦'.repeat(stars)}${'✧'.repeat(3 - stars)}</p>` : ''}
    <div class="grades"><span><b>${P0.stats.hits}</b>${t('golpes')}</span><span><b>${P0.stats.dodges}</b>${t('esquivas')}</span><span><b>${P0.stats.counters}</b>${t('contras')}</span><span><b>${m}:${String(s).padStart(2, '0')}</b>${t('tiempo')}</span></div>
    <p>${won ? L(b.win) : (b.mode === 'toques' ? t('perdidoT') : t('perdido'))}</p>${won ? fichaBtn(b.ficha) : ''}</div>
    <div class="act">${EMB ? (FREE ? `<button class="btn" data-m>${t('palacio')}</button><button class="btn" data-o>${t('otro')}</button><button class="btn pri" data-r>${t('repetir')}</button>` : won ? `<button class="btn" data-r>${t('repetir')}</button><button class="btn pri" data-k>${t('continuar')} ›</button>` : `<button class="btn" data-m>${t('palacio')}</button><button class="btn pri" data-r>${t('repetir')}</button>`) : `<button class="btn" data-m>${t('menu')}</button><button class="btn" data-r>${t('repetir')}</button>${won && !A_free ? `<button class="btn pri" data-n>${isLast ? t('fin') : t('siguiente')}</button>` : ''}`}</div>`, mid > 0 ? 'side left' : 'side'); v.classList.add('lite');
  bindFicha(v);
  const mb = v.querySelector('[data-m]'); if (mb) mb.onclick = () => { SFX.tap(); A_free = false; if (EMB) post({type:'quit', i, won}); else showTitle(); };
  v.querySelector('[data-r]').onclick = () => { SFX.tap(); startBout(i); };
  const ob = v.querySelector('[data-o]'); if (ob) ob.onclick = () => { SFX.tap(); freeHome(); };
  const kb = v.querySelector('[data-k]'); if (kb) kb.onclick = () => { SFX.tap(); post({type:'bout', i, won:true, stars}); };
  if (EMB) post({type:'result', i, won, stars});
  const n = v.querySelector('[data-n]'); if (n) n.onclick = () => { SFX.tap(); if (isLast) finale(); else intro(i + 1); };
}
function finale(){
  MODE = 'end'; clearUI(); rerender = finale;
  if (!S.done){ S.done = true; save(); if (!S.xpF.fin){ S.xpF.fin = 1; save(); HIST.xp(60); } }
  const v = card(`<div class="in"><h2>${L(FINAL.t)}</h2>${L(FINAL.p).map(p => `<p>${p}</p>`).join('')}${fichaBtn(FINAL.ficha)}</div>
    <div class="act">${HIST.inside ? `<button class="btn" data-h>${t('volver')}</button>` : ''}<button class="btn pri" data-m>${t('menu')}</button></div>`, A && (A.P.x + A.R.x)/2 > 0 ? 'side left' : 'side'); v.classList.add('lite');
  bindFicha(v); const h = v.querySelector('[data-h]'); if (h) h.onclick = () => HIST.back();
  v.querySelector('[data-m]').onclick = () => { SFX.tap(); showTitle(); };
}

/* ---------- arranque ---------- */
resize(); if (EMB){ if (FREE) freeHome(); else intro(Math.max(0, Math.min(BOUTS.length - 1, +QP.get('b') || 0))); } else showTitle(); requestAnimationFrame(frame);
window.__pug = {set slow(v){ slow = v; }, get A(){ return A; }, startBout, KEYS, PRESS, get MODE(){ return MODE; }};
})();

</script>
</body>
