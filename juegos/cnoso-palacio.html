<style>

:root{--cal:#f3e8cf;--ocre:#b4472b;--ocreD:#86301b;--azul:#2c6a96;--azulD:#1d3c58;--amar:#dca23a;--negro:#231a14;--serif:"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#2a1d14;overflow:hidden;font-family:var(--serif);color:var(--negro);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#st{position:fixed;pointer-events:none}
#st > *{pointer-events:auto}
button{font-family:var(--serif);cursor:pointer;-webkit-appearance:none;appearance:none}
.btn{min-height:44px;padding:8px 18px;border-radius:8px;border:2px solid var(--negro);background:var(--cal);color:var(--negro);font-size:16px;font-weight:600;box-shadow:0 3px 0 var(--negro);letter-spacing:.02em}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--negro)}
.btn.pri{background:var(--ocre);color:#fff8ea}
.btn.az{background:var(--azul);color:#fff8ea}
.btn[disabled]{opacity:.45;pointer-events:none}
.top{position:absolute;left:1.4%;right:1.4%;top:5.2%;display:flex;gap:8px;align-items:center;pointer-events:none}
.top > *{pointer-events:auto}
.top .sp{flex:1}
.chip{min-height:44px;min-width:44px;padding:0 12px;border-radius:22px;border:2px solid var(--negro);background:rgba(243,232,207,.92);font-size:15px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.chip.on{background:var(--negro);color:var(--cal)}
/* marcas de las estancias */
.spot{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;opacity:.92;border-radius:50%;border:2.5px solid var(--negro);background:radial-gradient(circle,#fff8ea 0 28%,var(--ocre) 29% 52%,#fff8ea 53% 60%,var(--azul) 61%);box-shadow:0 0 0 0 rgba(220,162,58,.8);animation:pulse 1.8s infinite;font-size:0}
.spot b{position:absolute;right:-10px;top:-10px;min-width:22px;height:22px;border-radius:11px;background:var(--negro);color:var(--cal);font:700 13px/22px var(--serif);text-align:center;padding:0 4px}
.spot.seen{animation:none;background:radial-gradient(circle,#fff8ea 0 30%,#8a7a5c 31% 58%,#fff8ea 59%)}
.spot.seen b{background:var(--azul)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(220,162,58,.85)}70%{box-shadow:0 0 0 16px rgba(220,162,58,0)}100%{box-shadow:0 0 0 0 rgba(220,162,58,0)}}
/* barra inferior de la estancia */
.bar{position:absolute;left:0;right:0;bottom:6.4%;display:flex;align-items:center;gap:12px;padding:0 1.6%;pointer-events:none}
.bar > *{pointer-events:auto}
.bar .tt{background:rgba(243,232,207,.95);border:2px solid var(--negro);border-radius:10px;padding:6px 14px;min-width:0;flex:1;box-shadow:0 3px 0 var(--negro)}
.bar .tt b{display:block;font-size:19px;color:var(--ocreD);font-variant:small-caps;letter-spacing:.04em;line-height:1.1}
.bar .tt small{display:block;font-size:13px;opacity:.85}
.dots{display:flex;gap:5px;margin-top:3px}.dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--negro);background:transparent}.dots i.ok{background:var(--negro)}.dots i.now{background:var(--amar)}
.rinfo{min-width:0;flex:0 1 auto;max-width:46%;background:rgba(243,232,207,.95);border:2px solid var(--negro);border-radius:10px;padding:5px 12px;box-shadow:0 3px 0 var(--negro);display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;overflow:hidden}
.rinfo b{font-size:18px;color:var(--ocreD);font-variant:small-caps;letter-spacing:.04em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.rinfo small{flex-basis:100%;font-size:12.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rinfo .dots{margin:0}
.top .nx{flex:0 0 auto}
/* tarjetas */
.veil{position:absolute;inset:0;background:rgba(35,26,20,.35);display:flex;align-items:center;justify-content:center;padding:6.5% 3% 8%}
.card{position:relative;background:#f6ecd6;border:3px solid var(--negro);border-radius:12px;box-shadow:0 6px 0 var(--negro),0 18px 40px rgba(0,0,0,.35);width:min(620px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.card::before{content:"";display:block;height:14px;flex:0 0 14px;background:repeating-linear-gradient(90deg,var(--amar) 0 18px,var(--negro) 18px 20px,var(--amar) 20px 26px,var(--ocre) 26px 34px);border-bottom:2px solid var(--negro)}
.card .in{padding:12px 20px 4px;overflow:auto;-webkit-overflow-scrolling:touch}
.card h2{margin:0 0 2px;font-size:22px;color:var(--ocreD);font-variant:small-caps;letter-spacing:.03em;line-height:1.15}
.card .sub{font-size:13px;opacity:.8;margin-bottom:6px}
.card p{margin:6px 0;font-size:16px;line-height:1.42}
.card .act{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;padding:8px 20px 14px}
.card.side{width:min(560px,58%)}
.card.wide{width:min(980px,100%)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card p.sm{font-size:14px;line-height:1.35;margin:2px 0 6px}
.opt small{font-size:12.5px;opacity:.85}
.card p.cr{font-size:14px;line-height:1.4}
.opts{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.opt{min-height:46px;text-align:left;padding:8px 14px;border-radius:8px;border:2px solid var(--negro);background:#fffaf0;font-size:16px;line-height:1.25;display:flex;gap:10px;align-items:center}
.opt i{font-style:normal;font-weight:700;width:24px;height:24px;flex:0 0 24px;border-radius:50%;border:2px solid var(--negro);display:flex;align-items:center;justify-content:center;font-size:14px}
.opt.ok{background:#d9e8f3;border-color:var(--azulD)}.opt.ok i{background:var(--azul);color:#fff;border-color:var(--azulD)}
.opt.no{background:#f8dcc6;border-color:var(--ocreD)}.opt.no i{background:var(--ocre);color:#fff}
.opt.chk.on{background:#efe0b8}
.fb{font-size:15px;line-height:1.4;padding:8px 12px;border-radius:8px;border:2px dashed var(--negro);margin:6px 0}
.ficha{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 14px;border-radius:21px;border:2px solid var(--azulD);background:var(--azul);color:#fff;font:600 14px var(--serif);margin:6px 0 2px}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--azulD);margin-bottom:2px}
/* portada */
.title{position:absolute;left:0;right:0;top:13%;text-align:center;pointer-events:none}
.title h1{margin:0;font-size:calc(var(--s,1)*70px);letter-spacing:.14em;color:#fff3d6;text-shadow:0 3px 0 var(--negro),0 0 18px rgba(0,0,0,.35);font-weight:700}
.title p{margin:4px 0 0;font-size:calc(var(--s,1)*22px);color:#fff3d6;text-shadow:0 2px 0 var(--negro);font-style:italic}
.menu{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);display:flex;gap:12px;flex-wrap:wrap;justify-content:center;width:92%}
.menu .btn{font-size:18px;padding:10px 22px}
/* arena */
.hud{position:absolute;left:1.6%;right:1.6%;top:5.4%;display:flex;gap:8px;align-items:flex-start;pointer-events:none}
.hud > *{pointer-events:auto}
.pane{background:rgba(243,232,207,.94);border:2px solid var(--negro);border-radius:10px;padding:5px 12px;font-size:15px;line-height:1.2;box-shadow:0 3px 0 var(--negro)}
.pane b{color:var(--ocreD)}
.hint{position:absolute;left:50%;top:22%;transform:translateX(-50%);background:var(--negro);color:var(--cal);padding:8px 16px;border-radius:22px;font-size:17px;pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .3s}
.hint.on{opacity:1}
.big{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%) scale(.6);font-size:calc(var(--s,1)*58px);font-weight:700;letter-spacing:.06em;color:#fff3d6;text-shadow:0 3px 0 var(--negro),0 0 14px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:transform .25s cubic-bezier(.3,1.6,.5,1),opacity .2s;white-space:nowrap}
.big.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.grades{display:flex;gap:10px;margin:6px 0}
.grades span{flex:1;border:2px solid var(--negro);border-radius:8px;padding:6px;text-align:center;font-size:14px;background:#fffaf0}
.grades span b{display:block;font-size:22px;line-height:1}
.ros{font-size:30px;letter-spacing:6px}
.rot{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#2a1d14;color:#f3e8cf;font-size:20px;text-align:center;padding:24px}
.rot b{font-size:56px;display:block;animation:rr 2.2s ease-in-out infinite}
@keyframes rr{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-width:900px){.rot{display:flex}}
.toast{position:absolute;left:50%;top:15%;transform:translate(-50%,-12px);opacity:0;background:var(--amar);color:var(--negro);border:2px solid var(--negro);padding:6px 16px;border-radius:20px;font-weight:700;transition:all .25s;pointer-events:none;z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0)}
.copy{position:fixed;right:max(8px,env(safe-area-inset-right));bottom:max(4px,env(safe-area-inset-bottom));font:11px system-ui,sans-serif;color:rgba(243,232,207,.75);pointer-events:none;z-index:60}
@media (max-height:430px){
  .card p{font-size:14.5px;line-height:1.36;margin:4px 0}.card h2{font-size:19px}.card .in{padding:8px 16px 2px}.card .act{padding:6px 16px 10px}
  .opt{min-height:40px;font-size:14.5px;padding:6px 10px}.opts{gap:6px}
  .bar .tt b{font-size:16px}.bar .tt small{font-size:12px}.btn{font-size:15px;padding:6px 14px}
  .spot{width:38px;height:38px;margin:-19px 0 0 -19px}
  .rinfo small{display:none}.rinfo{padding:4px 10px}.rinfo b{font-size:15px}
  .veil{padding:5.6% 2% 6.5%}
  .card.wide .sm,.card .nota{display:none}.card.wide .opts{margin:4px 0;gap:5px}.card.wide h2{margin-bottom:4px}.card.wide .opt{min-height:44px}
}
@media (prefers-reduced-motion:reduce){.spot{animation:none}.big{transition:none}}

.chip{white-space:nowrap}
.opts.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-height:430px){.card.epi p{font-size:13.6px;line-height:1.32;margin:3px 0}.opts.g2 .opt{min-height:42px;font-size:14px}.card h2[style]{font-size:16px!important}}

/* CNOSO */
.gn{font-size:14.5px;margin:6px 0}.act .spc{flex:1}.act .ficha{margin:0}
.title p{display:inline-block;background:rgba(35,26,20,.62);padding:3px 14px;border-radius:14px}
.pugframe{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:40;background:#2a1d14}
.pjrow{display:flex;gap:16px;align-items:flex-start}.pjrow>span{flex:0 0 auto}.pjrow>div{flex:1;min-width:0}
.pjc{display:block;border-radius:4px;box-shadow:0 2px 0 rgba(26,20,15,.5)}
.tlist{display:flex;flex-wrap:wrap;gap:3px 12px;margin:6px 0;font-size:13.5px}.tlist span{opacity:.55}.tlist span.ok{opacity:1;font-weight:700}
.pjchip{padding:0 12px 0 4px;gap:5px}.pjchip canvas{display:block;box-shadow:none}
@media (max-height:430px){.gn{font-size:13px;margin:4px 0}.pjrow{gap:10px}.tlist{font-size:12px;margin:3px 0;gap:2px 10px}.pjchip span{display:none}.pjchip{padding:0 6px}}

/* drama */
.dlg{position:absolute;left:3%;right:3%;bottom:4%;min-height:24%;background:linear-gradient(180deg,rgba(32,22,14,.9),rgba(22,15,9,.94));border:2px solid #c99a52;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 0 0 4px rgba(201,154,82,.18);color:#f3e6c8;padding:14px 22px 16px;cursor:pointer}
.dlg.wp{left:27%}
.dlg .nm{position:absolute;left:14px;top:-18px;background:var(--ocre);color:#fff3d6;border:2px solid #c99a52;border-radius:6px;padding:3px 12px;font-weight:700;font-variant:small-caps;letter-spacing:.06em;font-size:17px}
.dlg .nm:empty{display:none}
.dlg .tx{font-size:20px;line-height:1.45;min-height:2.9em}
.dlg.narr .tx{font-style:italic;color:#e9d8b4}
.dlg .nx{position:absolute;right:16px;bottom:8px;font-style:normal;color:#e3a04a;animation:bob 1s ease-in-out infinite;transition:opacity .2s}
@keyframes bob{50%{transform:translateY(4px)}}
.dlg.opts{cursor:default}.dlg.opts .tx{display:none}
.dlg .ops{display:flex;flex-direction:column;gap:8px}
.dlg .ops .opt{background:rgba(246,236,214,.95);color:var(--negro)}
.dlg .ops .opt:hover{background:#efe0b8}
.pane.scn{font-size:14px;padding:4px 10px;opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}
.card.diario{width:min(760px,100%);background:#f8f1e1}
.card.diario::before{background:repeating-linear-gradient(90deg,var(--azul) 0 18px,var(--negro) 18px 20px,#f8f1e1 20px 26px)}
.card .dtx{font-size:16.5px;line-height:1.5}
.card h3{margin:12px 0 2px;font-size:16px;color:var(--azulD);font-variant:small-caps;letter-spacing:.04em}
.card .code{display:inline-block;font:700 11.5px system-ui,sans-serif;background:var(--azul);color:#fff;border-radius:9px;padding:1px 7px;margin-right:4px;vertical-align:1px}
.ficha.sm{min-height:30px;padding:0 9px;margin:0 0 0 4px;font-size:13px}
.card.diarioL .dtx{font-size:15px;margin:5px 0}
.card .lec{font-size:15px;line-height:1.42;margin:7px 0;padding:6px 10px;border-left:4px solid #c9b48a}
.card .lec.mine{border-color:var(--ocre);background:#f3e2c6}
.qte{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;cursor:pointer}
.qte .qh{background:var(--negro);color:var(--cal);padding:8px 18px;border-radius:22px;font-size:19px;font-weight:700}
.qte .qr{position:relative;width:120px;height:120px}
.qte .qr b{position:absolute;inset:0;border-radius:50%}
.qte .fix{border:6px solid #fff3d6;box-shadow:0 0 0 3px var(--negro),inset 0 0 0 3px var(--negro);background:rgba(180,71,43,.25)}
.qte .mov{border:5px dashed var(--amar);opacity:0}
.qte .qr span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff3d6;font-weight:700;text-shadow:0 2px 0 var(--negro)}
.qte .qs{display:flex;gap:10px}.qte .qs i{width:18px;height:18px;border-radius:50%;border:2px solid #fff3d6;background:rgba(0,0,0,.3)}.qte .qs i.ok{background:var(--amar)}.qte .qs i.no{background:var(--ocre)}
@media (max-height:430px){
 .dlg{padding:10px 16px 10px;min-height:28%}.dlg .tx{font-size:15.5px;line-height:1.38}.dlg .nm{font-size:14px;top:-15px;padding:2px 9px}
 .dlg .ops{gap:5px}.dlg .ops .opt{min-height:40px;font-size:14.5px;padding:5px 10px}
 .card .dtx{font-size:14px;line-height:1.38}.card .lec{font-size:13px;margin:4px 0;padding:4px 8px}.card h3{font-size:14px;margin:8px 0 2px}
 .pane.scn{display:none}.qte .qh{font-size:15px}
}

#game{position:fixed;inset:0}
#st{position:fixed;inset:0;pointer-events:none;z-index:5}
.title-ui{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:#f6ecd6;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.title-ui h1{font-size:clamp(48px,9vw,96px);letter-spacing:.18em;margin:0;font-variant:small-caps}
.title-ui .ts{font-size:clamp(15px,2.2vw,20px);margin:4px 0 18px}
.tbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.lookbtn{position:absolute;right:3%;bottom:7%;font-size:18px;min-height:56px;opacity:0;transform:scale(.8);transition:all .2s;pointer-events:none!important}
.lookbtn.on{opacity:1;transform:scale(1);pointer-events:auto!important}
.lect{border:2px solid var(--negro);border-radius:10px;padding:6px 12px;margin:8px 0;background:#efe2c4;opacity:.8}
.lect.open{background:#fff8ea;opacity:1;border-color:var(--ocreD)}
.lect h3{margin:2px 0;font-size:18px;color:var(--ocreD);font-variant:small-caps}
.lect h3 small{font-size:13px;color:var(--negro);opacity:.7;margin-left:6px}
.opt{text-align:left;width:100%}
.fb p{margin:8px 0 0}
</style>

<script>

/* Taurocatapsia · contenido. Todo procede del texto de pantalla de las fichas H3·01 a H3·17 del Tema 3 (Historiapp, tema03.json).
   En las preguntas, la primera opción es la correcta; el juego las baraja. */
const ROOMS = [
 { id:'entrada', scene:'entrada',
   t:{es:'La llegada a Cnoso',en:'Arriving at Knossos'},
   sub:{es:'Creta, hacia 1950-1375 a. C.',en:'Crete, c. 1950–1375 BC'},
   spots:[
    {x:300,y:250,ficha:['introduccion-historica','H3·03'],
     t:{es:'Un nombre puesto por un arqueólogo',en:'A name given by an archaeologist'},
     p:{es:['La cultura minoica debe su nombre a Arthur Evans, el arqueólogo británico que excavó el palacio de Cnoso desde 1900 y la bautizó a partir del mito griego del rey Minos.','Su civilización floreció en la Edad del Bronce, hacia 1950-1450 a. C.'],
        en:['Minoan culture owes its name to Arthur Evans, the British archaeologist who excavated the palace of Knossos from 1900 and named it after the Greek myth of King Minos.','The civilisation flourished in the Bronze Age, c. 1950–1450 BC.']}},
    {x:760,y:300,ficha:['introduccion-historica','H3·03'],
     t:{es:'Palacios sin murallas',en:'Palaces without walls'},
     p:{es:['Creta es una isla montañosa entre Grecia, Egipto y Asia Menor. Su relieve fragmentado la protegía y permitió que convivieran varios palacios, como Cnoso, Festo o Malia.','Los palacios se organizan en torno a un gran patio central y carecen de murallas. Evans imaginó una «Pax Minoica», hipótesis que hoy debe matizarse: las primeras armas del Egeo son cretenses y había preparación para la guerra.'],
        en:['Crete is a mountainous island between Greece, Egypt and Asia Minor. Its broken relief protected it and allowed several palaces to coexist, such as Knossos, Phaistos or Malia.','The palaces are arranged around a great central court and have no walls. Evans imagined a «Pax Minoica», a view that must now be qualified: the earliest weapons of the Aegean are Cretan and there was preparation for war.']}},
    {x:1040,y:470,ficha:['introduccion-historica','H3·03'],
     t:{es:'Tres escrituras y un silencio deportivo',en:'Three scripts and a sporting silence'},
     p:{es:['En Creta se usaron el jeroglífico cretense y el lineal A, que siguen sin descifrar, y el lineal B, que es griego micénico y se empleó sobre todo para la contabilidad del palacio.','Ninguna de las tres ha dejado un solo texto sobre deporte.'],

   ],
   qs:[
    {q:{es:'¿De dónde viene el nombre de «cultura minoica»?',en:'Where does the name «Minoan culture» come from?'},
     o:{es:['De Arthur Evans, que la bautizó por el mito del rey Minos','Del nombre que los cretenses daban a su isla en lineal A','De una inscripción en lineal B'],
        en:['From Arthur Evans, who named it after the myth of King Minos','From the name the Cretans gave their island in Linear A','From an inscription in Linear B']}},
    {q:{es:'¿Por qué hay que matizar la «Pax Minoica» de Evans?',en:'Why must Evans\'s «Pax Minoica» be qualified?'},
     o:{es:['Las primeras armas del Egeo son cretenses y había preparación para la guerra','Los palacios tenían grandes murallas','Creta vivía en guerra permanente con Egipto y con las ciudades de Anatolia'],
        en:['The earliest Aegean weapons are Cretan and there was preparation for war','The palaces had great walls','Crete lived in permanent war with Egypt and the cities of Anatolia']}}
   ]},
 { id:'almacenes', scene:'procesion',
   t:{es:'El corredor de la Procesión',en:'The Corridor of the Procession'},
   sub:{es:'Sociedad, poder y economía',en:'Society, power and economy'},
   spots:[

 { id:'frescos', scene:'frescos',

        en:['All we know of Minoan sport comes from images. Some hundred objects with sporting scenes are known (frescoes, stone vessels and seals) from c. 1750–1450 BC.','Almost all show bull-leaping; between 10 and 20 % show unarmed combat.']}},

        en:['At Akrotiri (Thera), buried by the volcano at the end of the 17th century BC, two boys aged six to ten box with a single glove on the right hand.','The winner wears a necklace, bracelets and earrings, while his rival is plainly dressed: the game already marked rank among the children of the elite.']}},

        en:['At Hagia Triada, c. 1550–1500 BC, a stone vessel some 46 cm tall used for libations shows adult boxers and bull-leaping in four bands.','Their helmets, gloves and bindings change from band to band, a sign of systematic training with rules. Scholars read it as an image of the initiation rites of young elite men.']}},

        en:['The oldest images, long before the palaces, show several men clinging to a bull, like a collective village game.','With the palaces the leap gained scenic and ritual grandeur. Almost all its images come from Knossos, from its fresco and its official seals: it was an emblem of this palace\'s power.']}}

 { id:'patio', scene:'patio',

     t:{es:'Un patio para la comunidad',en:'A court for the community'},
     p:{es:['El patio central medía entre un cuarto y un tercio de estadio, la medida griega de unos 180-190 metros. En Malia o en Cnoso se conservan encajes para barreras de madera entre las columnas, y los balcones harían de palcos.','Dónde se saltaba sigue en discusión. Evans lo situó en el patio, pero el enlosado era peligroso: muchos estudios prefieren hoy un espacio de tierra junto al palacio.'],

  ['nar', 'Creta. Desde lo alto de una colina, un anciano y un niño miran hacia el valle.', 'Crete. From the top of a hill, an old man and a boy look down into the valley.'],

  {d:['La cultura minoica debe su nombre a Arthur Evans, el arqueólogo británico que excavó el palacio de Cnoso desde 1900 y la bautizó a partir del mito griego del rey Minos. Floreció en la Edad del Bronce, hacia 1950-1450 a. C. Creta es una isla montañosa, y su relieve fragmentado permitió que convivieran varios palacios, como Cnoso, Festo o Malia.',

{cap:2, t:{es:'El corredor de la Procesión', en:'The Corridor of the Procession'}, sub:{es:'Los almacenes y las damas', en:'The stores and the ladies'}, scenes:[

  ['nar', 'El Maestro te deja a la entrada de un largo corredor, pintado con figuras que avanzan en fila. Allí te espera la Sacerdotisa.', 'The Master leaves you at the entrance of a long corridor, painted with figures walking in line. The Priestess is waiting for you there.'],
  ['sac', 'Bienvenido, niño. Esta casa es la tuya, y es también la casa de la diosa.', 'Welcome, child. This house is yours, and it is also the house of the goddess.'],

  {d:['Se discute si en Creta existieron reyes absolutos como los de Egipto o Mesopotamia, puesto que apenas se conservan representaciones regias que permitan afirmarlo. El arte minoico recoge, en cambio, escenas de un refinamiento notable, propias de una élite con medios para encargarlas y costearlas.',

  ['mae', 'Ya no eres un niño. Desde hoy te verán como a un muchacho.', 'You are no longer a child. From today they will see you as a youth.'],
  {d:['Koehl (1986, p. 101) se fija en el peinado. Los niños púgiles llevan la cabeza rapada alrededor de mechones sueltos, y los muchachos del fresco del pescador, algo mayores, ya se han cortado esos mechones. Koehl propone que el corte formara parte de la preparación para la etapa siguiente de un rito de paso. Es una propuesta suya, sin prueba directa en las fuentes.',
      'Koehl (1986, p. 101) attends to the hairstyle. The boy boxers have the head shaved around loose locks, and the youths of the Fisherman fresco, somewhat older, have already cut off those locks. Koehl proposes that the cutting formed part of the preparation for the next stage of a rite of passage. It is his proposal, without direct proof in the sources.'], f:F.pug},
  {act:'fig', f:null}
 ]}
]},
/* ---------------- Capítulo 3 ---------------- */
{cap:3, t:{es:'La sala de las imágenes', en:'The hall of images'}, sub:{es:'El pugilato', en:'Boxing'}, scenes:[
 {id:'3.1', bg:['r_pugiles', 'r_riton', 'r_secuencia', 'r_tazas'], amb:'interior', t:{es:'Las imágenes', en:'The images'}, lines:[
  ['mae', 'Mira estas imágenes. En el palacio, las hazañas se pintan en las paredes, se tallan en los vasos de piedra y se graban en los sellos.', 'Look at these images. In the palace, feats are painted on the walls, carved on stone vessels and engraved on seals.'],
  ['tu', 'Casi todas muestran al toro.', 'Almost all of them show the bull.'],
  ['mae', 'El toro, sí. Y algunas, hombres que luchan sin armas.', 'The bull, yes. And some, men fighting without weapons.'],
  {d:['Todo lo que sabemos del deporte minoico procede de imágenes. Se conocen unos cien objetos con escenas deportivas (frescos, vasos de piedra y sellos) de hacia 1750-1450 a. C. Casi todos representan el salto del toro, y entre un 10 y un 20 % muestran combates sin armas.',
      'All we know of Minoan sport comes from images. Some hundred objects with sporting scenes are known (frescoes, stone vessels and seals) from c. 1750–1450 BC. Almost all show bull-leaping, and between 10 and 20 % show unarmed combat.'], f:F.act}
 ]},
 {id:'3.2', bg:['r_riton'], amb:'interior', t:{es:'El ritón', en:'The rhyton'}, lines:[
  ['nar', 'Junto a un vaso de piedra tallado en bandas te espera un muchacho al que ya conoces.', 'Beside a stone vessel carved in bands, a youth you already know is waiting for you.'],
  {if:'b0', then:[['riv', '¿Te acuerdas de mí? Aquel día te llevaste las joyas. Mira este vaso: yo ya he luchado como los de la banda de arriba.', 'Do you remember me? That day you took the jewels. Look at this vessel: I have already fought like the men in the top band.']],
   else:[['riv', '¿Te acuerdas de mí? Aquel día las joyas fueron para mí. Mira este vaso: yo ya he luchado como los de la banda de arriba.', 'Do you remember me? That day the jewels were mine. Look at this vessel: I have already fought like the men in the top band.']]},
  ['tu', 'En cada banda llevan cosas distintas.', 'In each band they wear different things.'],
  ['riv', 'Unos van con las muñecas vendadas y otros con casco. Se aprende banda a banda. ¿Te atreves?', 'Some have bandaged wrists and others helmets. You learn band by band. Do you dare?'],
  {q:[
   {es:'Aceptar el desafío enseguida', en:'Accept the challenge at once', a:'riv', r:[
    ['riv', 'Así me gusta. Te espero junto a la columna.', 'That is what I like. I will wait for you by the column.']]},
   {es:'Pedir al Maestro que te prepare', en:'Ask the Master to train you', a:'mae', r:[
    ['mae', 'Bien pensado. Antes de pelear, aprende.', 'Well thought. Before you fight, learn.']]}
  ]},
  {d:['En Hagia Triada, hacia 1550-1500 a. C., un vaso de piedra de unos 46 cm para las libaciones, esto es, las ofrendas líquidas a los dioses, muestra en cuatro bandas púgiles adultos y el salto del toro. Sus cascos, guantes, botas y vendajes cambian de una banda a otra, señal de un entrenamiento sistemático con reglas. El vaso es de Hagia Triada, y el juego lo sitúa en Cnoso.',
      'At Hagia Triada, c. 1550–1500 BC, a stone vessel some 46 cm tall used for libations, that is, liquid offerings to the gods, shows adult boxers and bull-leaping in four bands. Their helmets, gloves, boots and bindings change from band to band, a sign of systematic training with rules. The vessel is from Hagia Triada, and the game places it in Knossos.'], f:F.riton}
 ]},
 {id:'3.3', bg:['r_riton'], amb:'interior', t:{es:'La melena', en:'The long hair'}, lines:[
  ['nar', 'Han pasado los años. El pelo te cae ya hasta la cintura.', 'Years have passed. Your hair now falls to your waist.'],
  {act:'stage', s:2},
  {act:'fig', f:'lirios'},
  ['mae', 'Llevas la melena de los hombres de las grandes casas. Te esperan las bandas del vaso.', 'You wear the long hair of the men of the great houses. The bands of the vessel await you.'],
  {d:['Los púgiles del ritón son adultos, esbeltos pero musculados, con la melena hasta la cintura del aristócrata minoico. Koehl (1986, pp. 102-103) observa que es la misma melena de los saltadores del fresco de Cnoso y la identifica como el peinado del varón aristocrático en la plenitud de su vida adulta.',
      'The boxers on the rhyton are adults, slender but muscular, with the waist-length hair of the Minoan aristocrat. Koehl (1986, pp. 102-103) observes that it is the same hair as that of the leapers in the Knossos fresco and identifies it as the hairstyle of the aristocratic male in the fullness of adult life.'], f:F.quien},
  {act:'fig', f:null}
 ]},
 {id:'3.4', bg:['r_riton'], amb:'patio', t:{es:'Pruebas II y III', en:'Trials II and III'}, lines:[
  ['mae', 'Empezarás por la cuarta banda, sin casco y con las muñecas vendadas. El combate termina cuando uno de los dos queda en el suelo.', 'You will begin with the fourth band, without a helmet and with bandaged wrists. The bout ends when one of you is left on the ground.'],
  {act:'bout', i:1},
  ['mae', 'Ahora la tercera banda: casco, protecciones en el antebrazo y manos acolchadas.', 'Now the third band: helmet, forearm guards and padded hands.'],
  {act:'bout', i:2},
  {d:['Kyle (2015, pp. 38-39) describe las cuatro bandas del ritón. En la tercera hay cuatro hombres con casco, protecciones en el antebrazo y manos acolchadas, dos en pie y dos en el suelo; en la cuarta, figuras sin casco y con las muñecas vendadas, dos en guardia y dos derribadas.',
      'Kyle (2015, pp. 38-39) describes the four bands of the rhyton. In the third are four men with helmets, forearm guards and padded hands, two standing and two on the ground; in the fourth, figures without helmets and with bandaged wrists, two on guard and two knocked down.'], f:F.riton}
 ]},
 {id:'3.5', bg:['r_riton'], amb:'patio', t:{es:'Prueba IV', en:'Trial IV'}, lines:[
  ['riv', 'Junto a la columna, como en lo más alto del vaso. Esta vez no es un juego de niños.', 'By the column, as at the top of the vessel. This time it is no children\'s game.'],
  {act:'bout', i:3},
  {if:'win', then:[['riv', 'Me has dejado en el suelo. No lo olvidaré.', 'You have left me on the ground. I will not forget it.']],
   else:[['riv', 'Levántate. El vaso también deja a los vencidos en el suelo.', 'Get up. The vessel also leaves the defeated on the ground.']]},
  {d:['Las columnas de capitel cuadrado de la banda superior indican un contexto palacial, y Soar (2014, pp. 231-232) observa que en otras piezas los boxeadores aparecen junto a columnas, altares y árboles, lo que sugiere un marco oficial y quizá ceremonial. El vencedor se distingue siempre que la pieza lo permite, y los vencidos yacen en el suelo.',
      'The square-capital columns of the top band indicate a palatial setting, and Soar (2014, pp. 231-232) notes that on other pieces boxers appear beside columns, altars and trees, which suggests an official and perhaps ceremonial setting. The victor stands out wherever the piece allows, and the defeated lie on the ground.'], f:F.riton}
 ]},
 {id:'3.6', bg:['r_riton'], amb:'interior', t:{es:'Sin premio', en:'No prize'}, lines:[
  ['nar', 'Nadie se acerca con un regalo y nadie graba tu nombre.', 'No one comes with a gift and no one carves your name.'],
  ['tu', '¿Y qué he ganado?', 'And what have I won?'],
  ['mae', 'Que te hayan visto. ¿A quién ofreces lo que has hecho?', 'That you have been seen. To whom do you offer what you have done?'],
  {q:[
   {es:'A la diosa', en:'To the goddess', p:'rit', a:'sac', r:[['sac', 'Ella lo ha visto. Es suficiente.', 'She has seen it. That is enough.']]},
   {es:'A mi casa', en:'To my house', p:'pod', a:'esc', r:[['esc', 'Tu casa lo anotará en la memoria del palacio.', 'Your house will set it down in the memory of the palace.']]},
   {es:'Al Maestro', en:'To the Master', p:'ini', a:'mae', r:[['mae', 'No es mío. Es tuyo, y es el paso que te tocaba dar.', 'It is not mine. It is yours, and it is the step you had to take.']]},
   {es:'A quienes miraban', en:'To those who watched', p:'atl', a:'riv', r:[['riv', 'Te han visto todos. Eso es lo que cuenta.', 'Everyone saw you. That is what counts.']]}
  ]},
  {d:['Ningún objeto representa un premio ni una lista de vencedores. El deporte servía para la iniciación de los jóvenes de la élite, expresaba la creencia religiosa y exhibía el prestigio de las grandes casas que se disputaban el palacio.',
      'No object shows a prize or a list of winners. Sport served the initiation of young elite men, expressed religious belief and displayed the prestige of the great houses competing for the palace.'], f:F.act}
 ]}
]},
/* ---------------- Capítulo 4 ---------------- */
{cap:4, t:{es:'El santuario y el toro', en:'The shrine and the bull'}, sub:{es:'De la captura al salto', en:'From capture to leap'}, scenes:[
 {id:'4.1', bg:['r_cabeza'], amb:'interior', t:{es:'El santuario', en:'The shrine'}, lines:[
  ['sac', 'Mira este vaso con forma de cabeza de toro. Pronto saltarás sobre uno vivo.', 'Look at this vessel shaped like a bull\'s head. Soon you will leap over a living one.'],
  ['tu', '¿Por qué el toro?', 'Why the bull?'],
  ['sac', 'Porque es el más fuerte de los animales de esta tierra, y lo que se hace con él se hace ante la diosa.', 'Because it is the strongest of the animals of this land, and what is done with it is done before the goddess.'],
  {d:['Ritón de esteatita en forma de cabeza de toro, del Pequeño Palacio de Cnoso, hacia 1550-1500 a. C. Evans vio en el salto una ofrenda a una diosa minoica, y McInerney (2011, pp. 6-8) reúne el contexto religioso del toro (cuernos de consagración, ritones, sacrificio). Shapland (2013, pp. 196-199) sostiene, en cambio, que esa lectura responde más a los presupuestos del siglo XIX que a las pruebas.',
      'Steatite rhyton in the shape of a bull\'s head, from the Little Palace of Knossos, c. 1550–1500 BC. Evans saw the leap as an offering to a Minoan goddess, and McInerney (2011, pp. 6-8) assembles the religious context of the bull (horns of consecration, rhyta, sacrifice). Shapland (2013, pp. 196-199) maintains, however, that this reading owes more to nineteenth-century assumptions than to the evidence.'], f:F.sig}
 ]},
 {id:'4.2', bg:['r_tazasdib', 'r_tazas'], amb:'campo', t:{es:'La captura', en:'The capture'}, lines:[
  ['nar', 'Al amanecer sales al campo con jóvenes de otras casas. Llevan una red y una vaca.', 'At dawn you go out into the countryside with young men of other houses. They carry a net and lead a cow.'],
  ['riv', 'La vaca lo atraerá. Cuando entre en la red, tirad todos a la vez.', 'The cow will draw it in. When it enters the net, all pull at once.'],
  {act:'qte'},
  {if:'vafio', then:[['nar', 'La red se cierra y el toro queda preso entre las cuerdas.', 'The net closes and the bull is caught in the ropes.']],
   else:[['nar', 'El toro rompe por un lado y escapa. Al atardecer, otro grupo vuelve con él atado.', 'The bull breaks through one side and escapes. At dusk, another group returns with it tied.']]},
  {d:['El salto era solo la parte más vistosa de un ciclo que empezaba con la captura del toro, una empresa colectiva y peligrosa. En las tazas de oro de Vafio se ve a unos jóvenes que atrapan a un toro con una red y a otro al que atraen con una vaca como señuelo.',
      'The leap was only the most spectacular part of a cycle that began with the capture of the bull, a dangerous collective enterprise. On the gold cups from Vapheio young men trap one bull in a net and lure another with a cow as a decoy.'], f:F.toro}
 ]},
 {id:'4.3', bg:['titulo'], amb:'interior', t:{es:'Los toros moteados', en:'The spotted bulls'}, lines:[
  ['tu', '¿Morirá el toro después de la fiesta?', 'Will the bull die after the festival?'],
  ['sac', 'Yo creo que la diosa lo recibirá. Pero eso no lo decido yo.', 'I believe the goddess will receive it. But that is not for me to decide.'],
  {q:[
   {es:'Creer a la Sacerdotisa', en:'Believe the Priestess', p:'rit', a:'sac', r:[['sac', 'Entonces mirarás la fiesta con otros ojos.', 'Then you will watch the festival with other eyes.']]},
   {es:'Dudar', en:'Doubt', p:'atl', r:[['tu', 'Yo solo sé que mañana saltaré sobre él.', 'All I know is that tomorrow I will leap over it.']]}
  ]},
  {d:['Durante décadas se pensó que eran uros, el toro salvaje europeo. El pelaje moteado de los toros de Cnoso, sin embargo, solo se da en animales domésticos, de modo que no eran tan fieros como se ha propuesto. Se especula que el salto terminara en sacrificio y banquete, si bien las imágenes minoicas no unen el salto con la muerte del toro.',
      'For decades they were thought to be aurochs, the wild European bull. The spotted coat of the Knossos bulls, however, occurs only in domestic animals, so they were not as fierce as has been claimed. It is speculated that the leap ended in sacrifice and a feast, although Minoan images do not link the leap with the death of the bull.'], f:F.toro}
 ]},
 {id:'4.4', bg:['r_tazasdib', 'r_secuencia', 'titulo'], amb:'interior', t:{es:'De la aldea al palacio', en:'From village to palace'}, lines:[
  ['esc', 'En las aldeas, los hombres se agarran al toro entre muchos. Aquí el salto es otra cosa, porque pertenece al palacio.', 'In the villages, many men cling to the bull together. Here the leap is something else, because it belongs to the palace.'],
  ['esc', 'Si quieres, tu casa puede contar conmigo para la fiesta.', 'If you wish, your house can count on me for the festival.'],
  {q:[
   {es:'Aceptar su apoyo', en:'Accept his support', p:'pod', a:'esc', r:[['esc', 'Bien. Quien salta en Cnoso salta para Cnoso.', 'Good. Whoever leaps in Knossos leaps for Knossos.']]},
   {es:'Rechazarlo', en:'Refuse it', r:[['esc', 'Como quieras. Te estaré mirando.', 'As you wish. I will be watching you.']]}
  ]},
  {d:['Las imágenes más antiguas, muy anteriores a los palacios, muestran a varios hombres agarrados a un toro, como un juego colectivo de aldea. Con los palacios, el salto adquiere grandeza escénica y ritual. Casi todas sus imágenes proceden de Cnoso, de su fresco y de sus sellos oficiales, de modo que se convirtió en emblema del poder de este palacio.',
      'The oldest images, long before the palaces, show several men clinging to a bull, like a collective village game. With the palaces the leap gained scenic and ritual grandeur. Almost all its images come from Knossos, from its fresco and its official seals, so it became an emblem of this palace\'s power.'], f:F.salto}
 ]}
]},
/* ---------------- Capítulo 5 ---------------- */
{cap:5, t:{es:'La fiesta del toro', en:'The bull festival'}, sub:{es:'El salto', en:'The leap'}, scenes:[
 {id:'5.1', bg:['r_patio'], amb:'viento', t:{es:'¿Dónde?', en:'Where?'}, lines:[
  ['mae', 'La fiesta debe hacerse en el gran patio, delante de todos.', 'The festival must be held in the great court, before everyone.'],
  ['esc', '¿Sobre las losas? Ahí resbala el toro, y el saltador también. Mejor la tierra, junto al palacio.', 'On the paving? The bull slips there, and so does the leaper. Better the earth, beside the palace.'],
  {act:'lugar'},
  {d:['El patio central medía entre un cuarto y un tercio de estadio, la medida griega de unos 180-190 metros. En Malia o en Cnoso se conservan encajes para barreras de madera entre las columnas, y los balcones harían de palcos. Dónde se saltaba sigue en discusión. Evans lo situó en el patio, pero el enlosado era peligroso para el toro y para el saltador, y muchos estudios prefieren hoy un espacio de tierra junto al palacio (Kyle, 2015, pp. 41 y 43).',
      'The central court measured between a quarter and a third of a stadion, the Greek measure of some 180–190 metres. At Malia and Knossos sockets for wooden barriers survive between the columns, and the balconies would serve as boxes. Where the leap took place is still debated. Evans placed it in the court, but the paving was dangerous for bull and leaper, and many scholars now prefer an earthen space beside the palace (Kyle, 2015, pp. 41 and 43).'], f:F.esp}
 ]},
 {id:'5.2', bg:['r_grada'], amb:'gentio', t:{es:'La tribuna', en:'The stand'}, lines:[
  ['dam', 'Desde aquí se ve todo. Dime, ¿has visto saltar a alguna muchacha?', 'From here one sees everything. Tell me, have you seen any girl leap?'],
  ['tu', 'En las paredes hay saltadores de piel blanca.', 'On the walls there are leapers with white skin.'],
  ['dam', 'Y blancas nos pintan a nosotras. Piénsalo.', 'And it is us they paint white. Think about it.'],
  {d:['Los saltadores de Cnoso son jóvenes de la élite, a juzgar por sus vestimentas, sus joyas y su melena larga. Nueve de los dieciséis conservados tienen la piel blanca que el arte egeo destinaba a las mujeres. Otras hipótesis ven en el color claro una marca de edad o de función social entre varones, de modo que hoy no puede afirmarse ni descartarse la presencia de mujeres.',
      'The Knossos leapers are young members of the elite, judging by their dress, jewellery and long hair. Nine of the sixteen preserved have the white skin that Aegean art reserved for women. Other views see the pale colour as a mark of age or social role among men, so the presence of women can today be neither affirmed nor ruled out.'], f:F.quien}
 ]},
 {id:'5.3', bg:['r_secuencia'], amb:'gentio', t:{es:'Cómo saltar', en:'How to leap'}, lines:[
  ['riv', 'Entra de cabeza sobre el cuello, apoya las manos en sus hombros y sal con una voltereta.', 'Go in head first over the neck, put your hands on its shoulders and come out with a somersault.'],
  {if:'afRiv', then:[['riv', 'Yo estaré al otro lado para recibirte.', 'I will be on the other side to catch you.']]},
  ['mae', 'Hay quien lo agarra por los cuernos y aprovecha su embestida. Es más difícil.', 'Some grasp it by the horns and use its charge. It is harder.'],
  {if:'afMae', then:[['mae', 'Mírame antes de cada toro. Yo te daré la señal.', 'Look at me before each bull. I will give you the signal.']]},
  {d:['Según Evans (1930), el saltador sujetaba los cuernos y aprovechaba la embestida para tomar impulso. Younger (1995) reúne una treintena de ejemplos del salto en picado, el esquema más frecuente, frente a las pocas imágenes, más antiguas, que encajan con Evans. En picado, el saltador entra de cabeza sobre el cuello, apoya las manos en los hombros del toro con las piernas arriba y sale con una voltereta hasta caer de pie, donde una figura con los brazos extendidos parece recibirle.',
      'According to Evans (1930), the leaper grasped the horns and used the charge for momentum. Younger (1995) gathers some thirty examples of the diving leap, the most frequent scheme, against the few, older images that fit Evans. In the diving leap, the leaper goes in head first over the neck, puts the hands on the bull\'s shoulders with legs raised and comes out with a somersault to land standing, where a figure with outstretched arms seems to receive the leaper.'], f:F.picado},
  {act:'tec'}
 ]},
 {id:'5.4', bg:['titulo'], amb:'gentio', t:{es:'La fiesta', en:'The festival'}, lines:[
  {if:'patio', then:[['nar', 'La comunidad llena el patio central y se apiña tras las barreras de madera.', 'The community fills the central court and crowds behind the wooden barriers.']],
   else:[['nar', 'La comunidad se reúne en la explanada de tierra, junto al palacio.', 'The community gathers on the earthen ground beside the palace.']]},
  ['nar', 'Tres toros. Toda la comunidad te mira.', 'Three bulls. The whole community is watching you.'],
  {act:'fiesta'}
 ]},
 {id:'5.5', bg:['titulo'], amb:'gentio', t:{es:'La aclamación', en:'The acclaim'}, lines:[
  {if:'f3', then:[['nar', 'Has saltado los tres toros. El clamor llega hasta los balcones del palacio.', 'You have leapt all three bulls. The roar reaches the balconies of the palace.']],
   else:[{if:'f1', then:[['nar', 'No todos tus saltos han salido limpios, pero la comunidad reconoce tu valor.', 'Not all your leaps were clean, but the community recognises your courage.']],
          else:[['nar', 'Hoy los toros han podido más. La comunidad guarda silencio, y habrá otras fiestas.', 'Today the bulls were stronger. The community falls silent, and there will be other festivals.']]}]},
  {d:['Ningún objeto minoico representa un premio. Lo que cuenta es la aclamación de la comunidad.', 'No Minoan object shows a prize. What counts is the acclaim of the community.'], f:F.act}
 ]}
]},
/* ---------------- Capítulo 6 ---------------- */
{cap:6, t:{es:'La sala del trono', en:'The throne room'}, sub:{es:'Los finales', en:'The endings'}, scenes:[
 {id:'6.1', bg:['r_trono'], amb:'interior', t:{es:'La sala del trono', en:'The throne room'}, lines:[
  ['nar', 'Tras la fiesta te llaman a la sala del trono. Una voz conocida te espera dentro.', 'After the festival you are called to the throne room. A familiar voice awaits you inside.'],
  {act:'final'}
 ]},
 {id:'6.3', bg:['r_tera', 'r_trono'], amb:'mar', t:{es:'Lo que vino después', en:'What came after'}, lines:[
  {d:['Durante décadas se atribuyó el fin de la Creta minoica a la erupción de Tera, pero se produjo hacia 1628 a. C., unos ciento cincuenta años antes del final de los palacios, y Creta se rehízo.', 'For decades the end of Minoan Crete was blamed on the eruption of Thera, but it happened c. 1628 BC, some hundred and fifty years before the end of the palaces, and Crete recovered.'], f:F.fin},
  {d:['Hacia 1450 a. C. ardieron casi todos los palacios salvo el de Cnoso, que pasó a manos de los micénicos. Hacia 1375 a. C. ardió también Cnoso, y el salto del toro continuó en la Grecia continental hasta la caída de los palacios micénicos.', 'Around 1450 BC almost all the palaces burned except Knossos, which passed to the Mycenaeans. Around 1375 BC Knossos burned too, and bull-leaping continued in mainland Greece until the fall of the Mycenaean palaces.'], f:F.fin},
  {act:'meaning'}
 ]}
]}
];
/* finales (6.2): quién lo cuenta, qué dice y qué añade el diario (H3·15) */
const FINALES = {
  rit:{who:'sac', t:{es:'Has saltado para la diosa. Ella ha visto tu valor, y también lo ha visto la comunidad que la honra.', en:'You have leapt for the goddess. She has seen your courage, and so has the community that honours her.'},
    d:{es:'Lectura ritual. Evans vio en el salto una ofrenda a una diosa minoica, y McInerney (2011, pp. 6-8) reúne el contexto religioso del toro. Su punto débil es que Younger (1995, p. 518) admite que no hay pruebas de que el sacrificio siguiera al salto (citado en Shapland, 2013, p. 197).', en:'Ritual reading. Evans saw in the leap an offering to a Minoan goddess, and McInerney (2011, pp. 6-8) assembles the religious context of the bull. Its weak point is that Younger (1995, p. 518) admits there is no evidence that sacrifice followed the leap (cited in Shapland, 2013, p. 197).'}},
  ini:{who:'mae', t:{es:'Has dejado de ser un muchacho. Las pruebas que empezaron con un guante de niño terminan hoy, delante de todos.', en:'You are no longer a youth. The trials that began with a child\'s glove end today, before everyone.'},
    d:{es:'Lectura iniciática. Koehl (1986, p. 100) relaciona los peinados con grupos de edad y sugiere que las pruebas del ritón de los boxeadores, salto del toro incluido, formaban parte de un ciclo de iniciación aristocrático. Scanlon (2014, pp. 28-59) vincula los juegos del toro con cultos e iniciación.', en:'Initiatory reading. Koehl (1986, p. 100) relates the hairstyles to age groups and suggests that the trials on the Boxer Rhyton, bull-leaping included, formed part of an aristocratic initiation cycle. Scanlon (2014, pp. 28-59) links the bull games with cults and initiation.'}},
  pod:{who:'esc', t:{es:'Tu casa y el palacio han mostrado su fuerza. Hoy todos saben de quién eres y a quién sirves.', en:'Your house and the palace have shown their strength. Today everyone knows whose you are and whom you serve.'},

/* ---------- pugilato: el juego de Púgiles del Cnoso clásico, en un marco ---------- */
let FRAME = null;
function openBout(i){ closeBout(); FRAME = document.createElement('iframe'); FRAME.className = 'pugframe'; FRAME.title = t('combate'); FRAME.src = `cnoso/pugilato.html?b=${i}&lang=${S.lang}`; document.body.appendChild(FRAME); try { FRAME.focus(); } catch (e) {} if (GAME.scene && GAME.scene.input) GAME.scene.input.enabled = false; }
function closeBout(){ if (FRAME){ FRAME.remove(); FRAME = null; } if (GAME.scene && GAME.scene.input) GAME.scene.input.enabled = true; }
addEventListener('message', e => {
  if (!e.data || !e.data.cnoso || (e.origin !== location.origin && location.protocol !== 'file:')) return; const d = e.data;
  if (d.type === 'ficha'){ HIST.ficha(d.id); return; }
  if (d.type === 'result'){ if (d.won){ const first = !S.bouts[d.i]; S.bouts[d.i] = Math.max(S.bouts[d.i] || 0, d.stars || 1); save(); if (first) HIST.xp(20); } return; }
  if (d.type === 'bout' || d.type === 'quit'){ closeBout(); if (d.won && !S.bouts[d.i]){ S.bouts[d.i] = d.stars || 1; save(); } if (GAME.scene && GAME.scene.afterBout) GAME.scene.afterBout(d.i); }
});
