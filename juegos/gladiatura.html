<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Gladiatura · Historiapp</title><style>
:root{--bg:#120d08;--ink:#f3e7cf;--muted:#c9b48e;--panel:rgba(22,15,9,.94);--edge:#8a6a3a;--accent:#e2b552;--accent2:#7fb2e5}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;aspect-ratio:16/9;width:min(100vw,calc(100vh*16/9));max-height:100vh}
#c{width:100%;height:100%;display:block}
#ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,7,4,.6)}
#ov.show{display:flex}
.card{background:var(--panel);border:2px solid var(--edge);border-radius:10px;padding:2% 2.6%;width:min(94%,760px);max-height:96%;overflow:auto;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.card.wide{width:min(98%,1180px)}
.card h1{font-size:clamp(20px,3.2vw,38px);margin:.1em 0;letter-spacing:.06em;color:var(--accent)}
.card h2{font-size:clamp(16px,2.2vw,26px);margin:.1em 0 .4em;color:var(--accent)}
.sub{font-size:clamp(12px,1.5vw,17px);color:var(--muted);margin-bottom:.7em}
.hoja{font-family:"Courier New",monospace;font-size:clamp(11px,1.4vw,16px);border-top:1px solid var(--edge);border-bottom:1px solid var(--edge);padding:.45em 0;margin:.3em 0 .7em;letter-spacing:.04em}
.fact{text-align:left;background:rgba(255,255,255,.04);border-left:4px solid var(--accent);padding:.55em .85em;font-size:clamp(12px,1.4vw,16px);line-height:1.4}
.seal{display:inline-block;font-size:.78em;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--muted);border-radius:4px;padding:.05em .45em;margin-bottom:.3em;color:var(--muted)}
.cite{display:block;color:var(--muted);font-size:.85em;margin-top:.3em;font-style:italic}
.btns{display:flex;gap:10px;justify-content:center;margin-top:.9em;flex-wrap:wrap}
button{font:inherit;font-size:clamp(13px,1.6vw,18px);padding:.5em 1.05em;border-radius:8px;border:2px solid var(--edge);background:#2b1f12;color:var(--ink);cursor:pointer}
button.main{background:var(--accent);color:#1d1408;border-color:#f3d68c;font-weight:bold}
button:focus-visible,.pick:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:left}
.pick{background:rgba(255,255,255,.035);border:2px solid #4a3820;border-radius:8px;padding:6px 8px;cursor:pointer;display:flex;flex-direction:column}
.pick.sel{border-color:var(--accent);background:rgba(226,181,82,.08)}
.pick canvas{width:100%;aspect-ratio:1/1.05;display:block}
.pick h3{margin:.15em 0 .1em;font-size:clamp(14px,1.7vw,20px);color:var(--accent)}
.pick .grp{font-size:clamp(10px,1.1vw,13px);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.pick ul{margin:.3em 0 .2em;padding-left:1.1em;font-size:clamp(10px,1.15vw,13.5px);line-height:1.35}
.pick .src{font-size:clamp(9px,1vw,12px);color:var(--muted);font-style:italic;margin-top:auto}
@media (max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}
#touch{position:absolute;inset:auto 0 0 0;height:30%;display:none;pointer-events:none}
#touch.on{display:block}
.tb{position:absolute;pointer-events:auto;border-radius:50%;border:2px solid rgba(243,231,207,.5);background:rgba(20,14,8,.45);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:clamp(11px,1.6vw,16px);text-align:center;line-height:1.1}
.tb.down{background:rgba(226,181,82,.45)}
#opts{position:absolute;bottom:1.2%;right:1%;display:flex;gap:6px}
#opts button{font-size:clamp(10px,1.1vw,13px);padding:.3em .6em;opacity:.8}

.hubg{display:grid;grid-template-columns:2.05fr 1fr;gap:14px;align-items:start;text-align:left}
.hubb{grid-column:1/-1;display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.hubb button{font-size:clamp(11px,1.25vw,15px);padding:.45em .5em}
.hubb button.main{grid-column:span 2}

/* portada */
.card.title{width:100%;height:100%;max-height:100%;border:none;border-radius:0;padding:0;background:linear-gradient(90deg,rgba(13,9,5,.97) 0%,rgba(13,9,5,.9) 44%,rgba(13,9,5,.62) 100%);box-shadow:none;text-align:left;overflow:hidden}
.tt{display:grid;grid-template-columns:1.02fr 1fr;grid-template-rows:1fr auto;height:100%;padding:3.2% 4% 1.6%;gap:0 4%;font-size:clamp(11px,1.3vw,17px)}
.ttL{display:flex;flex-direction:column;justify-content:center;min-height:0}
.logo{display:flex;align-items:center;gap:.4em;color:var(--accent)}
.logo h1{font-size:clamp(28px,4.6vw,62px)!important;letter-spacing:.14em!important;margin:0!important;line-height:1;text-shadow:0 2px 0 #000,0 0 24px rgba(224,164,86,.25)}
.logo .tag{color:var(--muted);font-style:italic;font-size:1.02em;margin-top:.25em;letter-spacing:.03em}
.laurel{width:3.4em;height:4.6em;flex:none;color:var(--accent);opacity:.9}.laurel.r{transform:scaleX(-1)}
.hello{margin:1em 0 .9em;padding:.55em .8em;border-left:3px solid var(--accent);background:rgba(224,164,86,.07);color:var(--ink);line-height:1.35;max-width:34em}
.mm{display:flex;flex-direction:column;gap:.38em;max-width:30em}
.mi{display:flex;align-items:center;gap:.8em;text-align:left;padding:.5em .8em;border-radius:8px;border:2px solid transparent;background:rgba(255,255,255,.025);font-size:1em;position:relative;transition:background .12s,border-color .12s,transform .12s}
.mi .ic{width:1.9em;height:1.9em;flex:none;color:var(--muted)}.mi .ic svg{width:100%;height:100%}
.mi .mt{display:flex;flex-direction:column;line-height:1.15}.mi b{font-size:1.18em;font-weight:bold}.mi small{color:var(--muted);font-size:.84em;margin-top:.15em}
.mi em{margin-left:auto;font-style:normal;font-size:.72em;letter-spacing:.08em;text-transform:uppercase;border:1.5px solid var(--accent);color:var(--accent);border-radius:20px;padding:.15em .6em;white-space:nowrap}
.mi.on,.mi:focus{background:rgba(224,164,86,.13);border-color:var(--accent);outline:none;transform:translateX(6px)}
.mi.on .ic,.mi:focus .ic{color:var(--accent)}
.mi.on::before{content:'▶';position:absolute;left:-1.1em;color:var(--accent);font-size:.8em}
.ttR{align-self:center;background:rgba(18,12,7,.9);border:2px solid var(--edge);border-radius:12px;padding:1.2em 1.4em;min-height:52%;max-height:100%;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.55);line-height:1.4}
.ttR h3{margin:0 0 .5em;color:var(--accent);font-size:1.35em;letter-spacing:.03em}.ttR p{margin:.4em 0}.mut{color:var(--muted);font-size:.9em}
.ttF{grid-column:1/-1;display:flex;justify-content:space-between;gap:1em;color:var(--muted);font-size:.78em;padding-top:.6em;border-top:1px solid rgba(201,133,63,.3);margin-top:.8em}
kbd{display:inline-block;min-width:1.6em;text-align:center;padding:.05em .4em;margin:0 .08em;border:1.5px solid var(--muted);border-bottom-width:3px;border-radius:5px;background:#2b1f12;color:var(--ink);font:bold .9em Georgia,serif}
.route,.les,.hof{margin:.4em 0;padding:0;list-style:none}
.route li{display:flex;flex-direction:column;padding:.35em 0 .35em .9em;border-left:3px solid var(--edge);margin-left:.3em}.route li span{color:var(--muted);font-size:.9em}
.les{display:grid;grid-template-columns:1fr 1fr;gap:.25em .8em}.les li{display:flex;gap:.5em;align-items:center}.les li::before{content:none}
.les li{color:var(--muted)}.les li.ok{color:var(--ink)}
.hof li{padding:.3em 0;border-bottom:1px solid rgba(201,133,63,.25)}.hof span{display:block;color:var(--muted);font-size:.88em}
.kv{display:grid;grid-template-columns:auto auto auto auto;gap:.2em .9em;margin:.6em 0;align-items:baseline}.kv span{color:var(--muted);font-size:.9em}.kv b{font-size:1.1em}
.pv{display:flex;gap:1.1em;align-items:flex-start}.pvP{flex:none;background:radial-gradient(ellipse at 50% 85%,rgba(224,164,86,.18),transparent 70%);border-radius:10px}.pvT{flex:1;min-width:0}
.pvN{font-size:1.6em;color:var(--accent);font-weight:bold;line-height:1}.pvS{color:var(--muted);font-style:italic;margin-bottom:.4em}.pvL{margin:.3em 0}.pvG{color:var(--muted);font-size:.9em;margin-top:.35em}
.acts{display:flex;flex-wrap:wrap;gap:.2em;align-items:center;margin:.5em 0;font-size:.85em}.acts span{border:1.5px solid #5a4428;border-radius:4px;padding:.1em .45em;color:var(--muted)}.acts span.ok{color:var(--ink);border-color:var(--edge)}.acts span.cur{color:#1d1408;background:var(--accent);border-color:var(--accent);font-weight:bold}.acts i{color:var(--muted);font-style:normal}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:.45em .8em;margin:.5em 0}
.howg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:left}.hb{background:rgba(255,255,255,.035);border:2px solid #4a3820;border-radius:8px;padding:.5em .7em;font-size:clamp(11px,1.2vw,15px);line-height:1.9}.hb h3{margin:0 0 .2em;color:var(--accent);font-size:1.1em;line-height:1.3}
.howk{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:left;margin-top:10px;font-size:clamp(11px,1.2vw,15px);line-height:1.4}.howk>div{border-left:3px solid var(--accent);padding:.3em .7em;background:rgba(224,164,86,.06)}
.opts2{display:flex;flex-direction:column;gap:8px;text-align:left}.orow{display:flex;justify-content:space-between;align-items:center;gap:1em;padding:.45em .7em;border:2px solid #4a3820;border-radius:8px}.orow small{display:block;color:var(--muted);font-size:.85em}.orow button{min-width:8.5em}
.seg{display:inline-flex;gap:4px;flex-wrap:wrap;justify-content:center}.seg button{font-size:clamp(11px,1.3vw,15px);padding:.35em .8em}.seg button.sel{background:var(--accent);color:#1d1408;font-weight:bold;border-color:#f3d68c}
.qgrid{grid-template-columns:repeat(5,1fr)!important}.qp{align-items:center;text-align:center}.qpP{height:132px;display:flex;align-items:flex-end;justify-content:center}.qp .diff{font-size:clamp(9px,1vw,12px);color:var(--muted);margin-top:.2em}.qp.sel h3::before{content:'✓ '}
.pick:focus{outline:3px solid var(--accent2);outline-offset:2px}
/* lecciones */
#tut{position:absolute;top:20%;left:50%;transform:translateX(-50%);width:min(64%,640px);background:rgba(18,12,7,.93);border:2px solid var(--edge);border-radius:10px;padding:.6em 1em .5em;color:var(--ink);font-size:clamp(11px,1.3vw,16px);box-shadow:0 8px 30px rgba(0,0,0,.5);transition:border-color .2s}
#tut.ok{border-color:var(--accent);background:rgba(44,32,14,.95)}
.tutH{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.85em}.dots{display:flex;gap:3px}.dots i{font-style:normal;width:1.45em;height:1.45em;border-radius:50%;border:1.5px solid #5a4428;display:flex;align-items:center;justify-content:center;font-size:.75em}.dots i.ok{border-color:var(--accent);color:var(--accent)}.dots i.cur{background:var(--accent);color:#1d1408;border-color:var(--accent);font-weight:bold}
.tutT{font-size:1.55em;color:var(--accent);font-weight:bold;margin:.15em 0}.tutK{margin:.2em 0 .3em;font-size:1.25em}.tutK span{color:var(--muted);font-size:.8em}.tutD{line-height:1.35}
.tutF{display:flex;justify-content:space-between;align-items:center;margin-top:.45em;color:var(--accent);font-weight:bold}.tutF button{font-size:.8em;padding:.25em .7em;margin-left:6px}
@media (max-width:700px){.tt{grid-template-columns:1fr}.ttR{display:none}.howg,.howk{grid-template-columns:1fr 1fr}.qgrid{grid-template-columns:repeat(3,1fr)!important}}
:root{--panel:rgba(23,17,11,.95);--edge:#c9853f;--accent:#e0a456}
</style></head><body>
<div id="wrap"><div id="stage">
<canvas id="c" width="1280" height="720" aria-label="Duelo de gladiadores"></canvas>
<div id="opts"><button id="bStyle">Estilo</button><button id="bAula">Modo aula</button><button id="bShake">Temblor</button><button id="bSnd">Sonido</button></div>
<div id="ov"><div class="card" id="card"></div></div>
</div></div>
<script>
const INK='#17110b';
const PAL={bronze:'#e0a456',steel:'#efe1c4'};
const M={steel1:'#efe1c4',steel2:'#d8c49e',steel3:'#17110b',bronze1:'#e0a456',bronze2:'#c9853f',bronze3:'#17110b',cloth:'#efe1c4',clothS:'#17110b',leather:'#17110b',pad:'#e8b36a',padS:'#c9853f'};
function ik(ax,ay,bx,by,l1,l2,bend){
  let dx=bx-ax,dy=by-ay,d=Math.hypot(dx,dy); const maxd=l1+l2-.01; if(d>maxd){ bx=ax+dx/d*maxd; by=ay+dy/d*maxd; dx=bx-ax; dy=by-ay; d=maxd; }
  const a=Math.acos(clamp((l1*l1+d*d-l2*l2)/(2*l1*d),-1,1)), base=Math.atan2(dy,dx)+a*bend;
  return {x:ax+Math.cos(base)*l1,y:ay+Math.sin(base)*l1,ex:bx,ey:by};
}
function stroke(pts,w,c){ ctx.strokeStyle=c; ctx.lineWidth=w; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y); for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y); ctx.stroke(); }
function bandsAlong(a,b,n,w,c1,c2){
  const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len;
  for(let i=0;i<n;i++){ const t0=i/n,t1=(i+.82)/n; const x0=a.x+dx*t0,y0=a.y+dy*t0,x1=a.x+dx*t1,y1=a.y+dy*t1;
    ctx.fillStyle=i%2?c2:c1; ctx.beginPath(); ctx.moveTo(x0+nx*w,y0+ny*w); ctx.lineTo(x1+nx*w,y1+ny*w); ctx.lineTo(x1-nx*w,y1-ny*w); ctx.lineTo(x0-nx*w,y0-ny*w); ctx.closePath(); ctx.fill(); }
}
function plate(a,b,w1,w2,c1,c2,c3){
  const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len;
  const g=ctx.createLinearGradient(a.x+nx*w1,a.y+ny*w1,a.x-nx*w1,a.y-ny*w1); g.addColorStop(0,c1); g.addColorStop(.45,c2); g.addColorStop(1,c3);
  ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(a.x+nx*w1,a.y+ny*w1); ctx.quadraticCurveTo((a.x+b.x)/2+nx*(w1+3),(a.y+b.y)/2+ny*(w1+3),b.x+nx*w2,b.y+ny*w2);
  ctx.lineTo(b.x-nx*w2,b.y-ny*w2); ctx.quadraticCurveTo((a.x+b.x)/2-nx*(w1+1),(a.y+b.y)/2-ny*(w1+1),a.x-nx*w1,a.y-ny*w1); ctx.closePath(); ctx.fill();
  ctx.strokeStyle=c3; ctx.lineWidth=1.2; ctx.stroke();
}
function metalGrad(x0,y0,x1,y1,kind){ return kind==='b'?PAL.bronze:PAL.steel; const g=ctx.createLinearGradient(x0,y0,x1,y1); if(kind==='b'){g.addColorStop(0,M.bronze1);g.addColorStop(.5,M.bronze2);g.addColorStop(1,M.bronze3);} else {g.addColorStop(0,M.steel1);g.addColorStop(.5,M.steel2);g.addColorStop(1,M.steel3);} return g; }

function drawFighterAt(f,X,Y,scale){
  const p=poseOf(f), type=f.type;
  ctx.save(); ctx.translate(X,Y);
  
  ctx.scale(f.dir*scale,scale);
  if(f.state==='down'){ ctx.rotate(-1.48); ctx.translate(-70,-24); }
  const L={thigh:46,shin:46,up:36,low:34};
  const shR={x:p.chest.x-6,y:p.chest.y+2}, shL={x:p.chest.x+6,y:p.chest.y+4};
  const hipB={x:p.hip.x-4,y:p.hip.y}, hipF={x:p.hip.x+4,y:p.hip.y};
  const kneeB=ik(hipB.x,hipB.y,p.fb.x,p.fb.y,L.thigh,L.shin,p.kneel?1:-1), kneeF=ik(hipF.x,hipF.y,p.ff.x,p.ff.y,L.thigh,L.shin,-1);
  const elR=ik(shR.x,shR.y,p.hw.x,p.hw.y,L.up,L.low,1), elL=ik(shL.x,shL.y,p.hs.x,p.hs.y,L.up,L.low,1);
  const footB={x:kneeB.ex,y:kneeB.ey}, footF={x:kneeF.ex,y:kneeF.ey}, handR={x:elR.ex,y:elR.ey}, handL={x:elL.ex,y:elL.ey};
  const SW=9;
  // brazo armado (lejano) con manica, y arma
  stroke([shR,elR,handR],SW,INK);
  if(type!=='retiarius'){ bandsAlong(shR,elR,4,7.5,M.pad,M.padS); bandsAlong(elR,handR,4,7,M.pad,M.padS); }
  drawWeapon(type,handR,p.wa);
  // pierna trasera
  stroke([hipB,kneeB,footB],SW,INK); foot(footB); legArmor(type,'back',hipB,kneeB,footB);
  // tronco, cabeza, subligaculum y cinturón
  stroke([p.hip,p.chest],SW+3,INK);
  stroke([p.chest,{x:p.head.x-2,y:p.head.y+10}],SW,INK);
  ctx.fillStyle=INK; ctx.beginPath(); ctx.arc(p.head.x,p.head.y,12,0,7); ctx.fill();
  ctx.fillStyle=M.cloth; ctx.beginPath(); ctx.moveTo(p.hip.x-15,p.hip.y-8); ctx.lineTo(p.hip.x+16,p.hip.y-8); ctx.lineTo(p.hip.x+8,p.hip.y+20); ctx.lineTo(p.hip.x-2,p.hip.y+26); ctx.lineTo(p.hip.x-12,p.hip.y+14); ctx.closePath(); ctx.fill();
  ctx.strokeStyle=M.clothS; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(p.hip.x+2,p.hip.y-6); ctx.lineTo(p.hip.x-1,p.hip.y+22); ctx.stroke();
  const by=p.hip.y-14; ctx.fillStyle=metalGrad(0,by,0,by+12,'b'); roundRect(p.hip.x-17,by,35,12,3); ctx.fill();
  ctx.fillStyle=M.bronze3; for(let i=-12;i<16;i+=8) ctx.fillRect(p.hip.x+i,by+3,4,6);
  if(type==='retiarius'){ drawFace(p.head); ctx.fillStyle=metalGrad(0,0,10,0,'s'); ctx.fillRect(p.hip.x-14,by+2,4,22); } else drawHelmet(type,p.head);
  // pierna delantera
  stroke([hipF,kneeF,footF],SW,INK); foot(footF); legArmor(type,'front',hipF,kneeF,footF);
  // brazo cercano
  stroke([shL,elL,handL],SW,INK);
  if(type==='retiarius'){ bandsAlong(shL,elL,4,7.5,M.pad,M.padS); bandsAlong(elL,handL,4,7,M.pad,M.padS); drawGalerus(shL); if(f.hasNet) drawNetBundle(handL); }
  else drawShield(type,handL);
  if(p.finger) stroke([handL,{x:handL.x+4,y:handL.y-26}],5,INK);
  ctx.restore();
  if(f.flash>0){ ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.fillStyle='rgba(255,240,200,'+(f.flash*2.5)+')'; ctx.fillRect(X-50,Y-230,100,230); ctx.restore(); }
  if(f.netted>0){ ctx.save(); ctx.strokeStyle='rgba(235,225,200,.85)'; ctx.lineWidth=1.5; for(let i=-4;i<=4;i++){ ctx.beginPath(); ctx.moveTo(X+i*12-30,Y-230); ctx.lineTo(X+i*12+30,Y-60); ctx.stroke(); ctx.beginPath(); ctx.moveTo(X+i*12+30,Y-230); ctx.lineTo(X+i*12-30,Y-60); ctx.stroke(); } ctx.restore(); }
}
function foot(ft){ ctx.fillStyle=INK; ctx.beginPath(); ctx.ellipse(ft.x+5,ft.y-3,10,4,0,0,7); ctx.fill(); }
function at(a,b,t){ return {x:lerp(a.x,b.x,t),y:lerp(a.y,b.y,t)}; }
function legArmor(type,which,hip,knee,ft){
  if(type==='thraex'){ // dos ocreae altas hasta la rodilla y fasciae en los muslos
    bandsAlong(at(hip,knee,.15),knee,5,8,M.pad,M.padS);
    plate({x:knee.x,y:knee.y-6},at(knee,ft,.9),10,7,M.bronze1,M.bronze2,M.bronze3);
    ctx.fillStyle=M.bronze2; ctx.beginPath(); ctx.arc(knee.x,knee.y-4,7,0,7); ctx.fill(); ctx.strokeStyle=M.bronze3; ctx.lineWidth=1; ctx.stroke();

  const a=f.ai, L=lvlAI(), I={move:0,adir:'neutral'}; a.t-=DT; a.cd-=DT; a.react-=DT; a.blockT-=DT; a.stepT-=DT;

  const gapH=['high','mid','low'].find(h=>!o.s.cover.includes(h)), H2D={high:'up',mid:'neutral',low:'down'};
  // reacción a un golpe que llega
  const th=o.state==='atk'&&o.f<o.move.s+o.move.a&&adx<reach+110;
  if(th&&o.f<=2&&a.threat!==o.move){ a.threat=o.move; a.react=lerp(.3,.14,L)*rnd(.9,1.2); a.reacted=false; }
  if(!th) a.threat=null;
  const ST=STYLES[a.style||'prudente'];
  const rb=((o.hist||[]).filter(h=>h===(o.move&&o.move.hgt||'push')).length>=3?.15:0)+ST.block;
  if(th&&a.react<=0&&!a.reacted){ a.reacted=true; const r=Math.random(); if(rb>=.15&&o.isPlayer&&Math.random()<.4) floatText(f.x,-262,'te ha leído');
    if(o.move.unblock){ if(r<.3+L*.3) I.dodge=true; }
    else if(r<.08+L*.22+rb*.5){ I.guardPress=true; a.blockT=.3; }
    else if(r<.1+L*.12&&free(f)){ I.push=true; I.adir='back'; } // guardia de contragolpe
    else if(r<.5+L*.3+rb&&(o.move.push||f.s.cover.includes(o.move.hgt)||Math.random()<.5)){ if(!o.move.push) a.blockT=(o.move.s-o.f+o.move.a)/60+.15; else { a.mode='retreat'; a.t=.4; } }
    else if(r<.58){ a.mode='retreat'; a.t=rnd(.3,.5); } }
  if(f.state==='hurt'&&f.zafa&&f.st>=30&&(o.chainN||0)>=2&&Math.random()<L*.006){ I.dodge=true; return I; }
  if(a.blockT>0&&free(f)){ I.guard=true; return I; }
  const wpn=f.disarmed&&FLOOR.find(i=>i.k==='weapon'&&i.owner===f); if(wpn&&free(f)){ I.move=Math.abs(wpn.x-f.x)<30?0:Math.sign(wpn.x-f.x); return I; }
  // proyectiles que llegan
  const inc=PROJ.find(p=>p.owner===o&&Math.sign(f.x-p.x)===Math.sign(p.vx)&&Math.abs(f.x-p.x)<260);
  if(inc&&free(f)&&a.projSeen!==inc){ a.projSeen=inc; const r=Math.random(); if(inc.k!=='net'&&f.s.shH&&r<.35+L*.4) a.blockT=.35; else if(r<.25+L*.35) I.dodge=true; }
  // rival enredado: a por él
  if(o.state==='netted'&&free(f)&&adx<reach+60){ I.atk=true; I.adir=Math.random()<.5?'neutral':H2D[gapH]||'neutral'; return I; }
  if(o.state==='netted'&&free(f)){ I.move=dir; return I; }
  // el reciario sin red va a recogerla
  if(f.s.net&&!f.hasNet&&FLOOR.some(i=>i.k==='net')&&free(f)){ const n=FLOOR.find(i=>i.k==='net'); if(Math.abs(o.x-n.x)>110||adx>220){ I.move=Math.sign(n.x-f.x); return I; } }
  // armas arrojadizas: guardar la distancia y lanzar
  const ranged=f.s.bow||(f.s.jav&&f.javs>0)||(f.s.net&&f.hasNet);
  if(ranged&&free(f)&&adx>140){ const lo=f.s.net?120:250, hi=f.s.net?210:400;
    if(adx<lo&&!((f.x<ARENA.l+120&&-dir<0)||(f.x>ARENA.r-120&&-dir>0))){ I.move=-dir; return I; }
    if(adx>hi){ I.move=dir; return I; }
    if(a.cd<=0&&f.st>20){ a.cd=rnd(.7,1.4)*(1.3-L*.5); if(f.s.bow){ I.atk=true; I.adir=pick(['up','neutral','neutral','down']); } else { I.push=true; I.adir='neutral'; } return I; }
    I.move=0; return I; }
  // encadenar mientras el golpe ha entrado, a veces con ritmo perfecto
  if(f.state==='atk'&&f.connected&&!f.auto&&f.move&&f.chainN<3){ const after=f.f-(f.move.s+f.move.a);
    if(after===1) a.chainAt=Math.random()<.25+L*.45?rnd(1,6)|0:rnd(8,12)|0;
    if(after>=1&&after===a.chainAt&&f.chainN<1+Math.round(L*1.6)+STYLES[a.style||'prudente'].chain&&Math.random()<.3+L*.35){ const sn=sigNext(f); if(sn&&Math.random()<.35+L*.5){ const [k,d]=MIN[sn]; I[k]=true; I.adir=d; } else { I.atk=true; const r=Math.random(); I.adir=f.move.id==='L1'||f.move.id==='L2'?(r<.6?'neutral':H2D[gapH]):(r<.5?H2D[gapH]:'fwd'); } } }
  // romper al que se tapa
  a.gs=o.guard?(a.gs||0)+DT:0;
  if(a.gs>.35&&free(f)&&adx<reach+60&&a.mode!=='attack'&&Math.random()<DT*(1.2+L*3)*ST.push){ a.mode='attack'; a.t=1; const r=Math.random(); a.plan=r<.5?'push':gapH==='low'?'sweep':gapH==='high'?'umbo':'push'; }

  if(f.furor>=100&&free(f)&&adx<reach+70&&Math.random()<.04){ I.spec=true; return I; }
  // castigo
  if(free(f)&&adx<reach+10&&(o.state==='hurt'&&o.stun>.25||o.state==='atk'&&o.f>=o.move.s+o.move.a)&&a.mode!=='attack'&&Math.random()<(.07+L*.18)){ a.mode='attack'; a.plan='combo'; a.n=1; a.t=1; }
  switch(a.mode){
    case 'hold': { const ideal=reach+35; if(a.stepT<=0){ a.stepT=rnd(.3,.7); const r=Math.random(); a.stepDir=adx>ideal+30?dir:adx<ideal-25?-dir:(r<.35?dir:r<.7?-dir:0); }
      I.move=a.stepDir; if((f.x<ARENA.l+120&&-dir<0)||(f.x>ARENA.r-120&&-dir>0)) I.move=dir;
      if(a.cd<=0&&f.st>40){ a.mode='attack'; a.t=1.3; const r=Math.random();
        if(adx>reach+30&&adx<reach+170&&r<.35) a.plan='fwd';
        else if(o.guard&&r<.5) a.plan='push';
        else if(r<STYLES[a.style||'prudente'].feint) a.plan='feint';
        else if(r<.2) a.plan=gapH==='low'?'sweep':gapH==='high'?'umbo':'push';
        else if(r<.5+L*.1) a.plan=SIG[f.type]&&Math.random()<.25+L*.3?'sig':'gap';
        else { a.plan='combo'; a.n=1; } }
      break; }
    case 'attack': {
      const range=a.plan==='fwd'?reach+170:a.plan==='push'||a.plan==='sweep'||a.plan==='umbo'?130:reach-10;
      if(a.plan==='feint'){ if(a.t>1.1&&free(f)&&adx<reach){ I.atk=true; I.adir=pick(['up','neutral','down']); a.cancel=true; } else if(a.cancel&&f.state==='atk'&&f.f>=4){ I.guardPress=true; a.cancel=false; } else I.move=a.t>.9?dir:-dir; if(a.t<.45) end(a); break; }
      if(adx>range&&free(f)){ I.move=dir; if(a.t<=0) end(a); break; }
      if(!free(f)) break;
      if(a.plan==='fwd'){ I.atk=true; I.adir='fwd'; end(a); break; }
      if(a.plan==='push'){ I.push=true; I.adir=adx>150?'fwd':'neutral'; end(a); break; }
      if(a.plan==='sweep'){ I.push=true; I.adir='down'; end(a); break; }
      if(a.plan==='umbo'){ I.push=true; I.adir='up'; end(a); break; }
      if(a.plan==='sig'){ const [k,d]=MIN[SIG[f.type].ids[0]]; I[k]=true; I.adir=d; end(a); break; }
      if(a.plan==='gap'){ I.atk=true; I.adir=Math.random()<.65?H2D[gapH]:'neutral'; end(a); break; }
      I.atk=true; I.adir='neutral'; end(a); break; }
    case 'retreat': I.move=-dir; if((f.x<ARENA.l+120&&-dir<0)||(f.x>ARENA.r-120&&-dir>0)) I.move=0; if(a.t<=0){ a.mode='hold'; } break;
  }
  if(f.st<22&&a.mode!=='retreat'){ a.mode='retreat'; a.t=rnd(.6,1); }
  if(f.hp<=18&&Math.random()<DT*.05) I.yield=true;
  return I;

}

/* ---------- Bucle de tiempo fijo ---------- */

  if(hitstop>0){ hitstop-=el; el=0; } if(bullet>0){ bullet-=el; el*=.3; } else if(slow>0){ slow-=el; el*=.35; }

const Tutor=(function(){

  function intro(){ show(`<h2>El ludus</h2><div class="fact">${esc(cd('El ludus era alojamiento, escuela y empresa. Lo dirigía el lanista, que alquilaba su familia gladiatoria, el conjunto de sus gladiadores, a quien pagaba el munus (Mañas Bastidas, 2011).'))}</div>
      <p style="text-align:left">El lanista Gneo Opimio te mira de arriba abajo. «Aquí comes, duermes y entrenas. Lo que ganes en la arena paga tu comida, tu médico y tus ofrendas. Si te cuidas, subirás. Si no, el editor decidirá por ti.»</p>
      <p style="text-align:left;font-size:.9em;color:var(--muted)">Gneo Opimio y el doctor Calvio son personajes inventados.</p>
      <div class="btns"><button class="main" id="iG">Al patio del ludus</button></div>`);

  /* ---------- el patio del ludus ---------- */
  function bar(v,max,lbl){ const n=10, f=Math.round(clamp(v/max,0,1)*n); return `<span style="letter-spacing:1px;font-family:monospace">${'■'.repeat(f)}${'□'.repeat(n-f)}</span> ${lbl}`; }
  function statusHTML(){ const o=ORIGINS[C.origin], fp=freedomPrice();
    const cond=C.origin==='servus'?`Libertad: peculio ${C.peculium} de ${fp} HS`:C.origin==='damnatus'?`Rudis al año III, libertad al año V ${C.rudis?'· rudis obtenida':''}`:`Contrato: quedan ${C.contract} combates · rescate ${fp} HS`;
    const secs=Object.entries(C.secuelas).filter(([k,v])=>v>0).map(([k,v])=>k+' ×'+v).join(', ');
    return `<div style="text-align:left;font-size:.88em;line-height:1.5">
      <div style="font-size:1.25em;color:var(--accent)"><b>${esc(C.name)}</b> <span style="font-size:.7em;color:var(--muted)">${title()}</span></div>
      <div>${TYPE_ES[C.type].toLowerCase()}${C.fem?' · gladiatrix':''} · ${o.t.toLowerCase()} · acto ${['','I','II','III','IV'][C.act]}</div>
      <div style="color:var(--muted)">${dateTxt()} · ${SEDES[C.sede].name}</div><hr style="border-color:#4a3820">
      <div>Sestercios <b>${C.hs} HS</b></div>
      <div>Fama ${bar(C.fame,100,C.fame)}</div>
      <div>Salud ${bar(C.hp,100,C.hp)}</div>
      <div>Lesiones: ${C.injuries.length?C.injuries.map(j=>esc(j.n)+' ('+j.days+' d'+(j.treated?', tratada':'')+')').join(', '):'ninguna'}</div>
      ${secs?`<div>Secuelas: ${secs}</div>`:''}
      <div>Dieta: ${DIETS[C.diet].n}${C.tonic>0?' · ceniza vegetal '+C.tonic+' d':''}</div>
      <div>Favor: ${Object.entries(GODS).map(([k,g])=>g.n+' '+(C.favor[k]||0)).join(' · ')}</div>
      <div>Vigor ${C.st.vigor} · fuerza ${C.st.fuerza} · aguante ${C.st.aguante} · técnica ${C.st.tecnica}</div>
      <div>Combates ${C.rec.pugnae} · victorias ${C.rec.vict} · derrotas ${C.rec.derrotas}</div>
      <div style="color:var(--accent)">${cond}</div>
      <hr style="border-color:#4a3820"><div style="font-size:.85em;color:var(--muted)">${C.log.slice(0,4).map(esc).join('<br>')}</div></div>`; }
  function actGoal(){ const g=GRAN[C.act]; if(!g) return ''; return 'Meta del acto: '+g.name+' en '+SEDES[g.sede].name+(g.alt?' o '+SEDES[g.alt].name:'')+', con fama '+g.fame+'.'; }
  function hub(){ if(!C||!C.alive){ menu(); return; } if(C.pending&&C.pending.length){ milestone(C.pending.shift()); return; }
    save(); const fp=freedomPrice();
    show(`<div class="hubg">
      <div class="hubmap">${mapSVG()}<div class="sub" style="font-size:.8em;margin:.3em 0 0">Pulsa una ciudad para viajar. ${actGoal()}${opt.aula?' '+esc(CHRONO):''}</div></div>
      <div class="hubst">${statusHTML()}</div>
      <div class="hubb">
        <button class="main" id="hM">Libellus: combatir en ${SEDES[C.sede].name}</button>
        <button id="hT">Entrenar con el doctor</button>
        ${typesFor(C.act).length>1?'<button id="hY">Cambiar de armatura</button>':''}
        <button id="hF">Comedor · dieta</button>
        <button id="hD">Medicina${C.hp<100||C.injuries.length||Object.values(C.secuelas).some(v=>v)?' · curar':''}</button>
        <button id="hG">Templo · favor de los dioses</button>
        <button id="hA">Armería</button>
        <button id="hR">Descansar siete días</button>
        ${(C.origin==='servus'&&C.peculium>=fp)||(C.origin==='auctoratus'&&C.hs>=fp&&C.contract>0)?'<button class="main" id="hL">Comprar la libertad · '+fp+' HS</button>':''}
        ${(C.origin==='damnatus'&&C.rudis)||(C.origin==='auctoratus'&&C.contract<=0)?'<button id="hX">Retirarse de la arena</button>':''}
        <button id="hQ">Guardar y salir</button>
      </div></div>`,true);
    if(q('hY')) q('hY').onclick=armatura; q('hM').onclick=libellus; q('hT').onclick=train; q('hF').onclick=food; q('hD').onclick=medicus; q('hG').onclick=temple; q('hA').onclick=armory;
    q('hR').onclick=()=>{ pass(7); log('descansas una semana'); hub(); }; q('hQ').onclick=()=>{ save(); menu(); };
    if(q('hL')) q('hL').onclick=()=>{ if(C.origin==='servus'){ C.peculium-=fp; C.hs-=fp; } else C.hs-=fp; ending('libertas'); };
    if(q('hX')) q('hX').onclick=()=>ending('retiro');
    document.querySelectorAll('.city').forEach(g=>g.onclick=()=>travel(g.dataset.k)); }

  /* ---------- acciones ---------- */
  function msg(t,back){ show(`<div class="sub" style="font-size:1.05em;color:var(--ink)">${t}</div><div class="btns"><button class="main" id="mOk">Seguir</button></div>`); q('mOk').onclick=back||hub; setTimeout(()=>q('mOk').focus(),30); }
  function spend(c){ if(C.hs<c){ msg('No tienes sestercios suficientes ('+c+' HS).'); return false; } C.hs-=c; if(C.origin==='servus') C.peculium=Math.min(C.peculium,C.hs); return true; }
  function travel(k){ const s=SEDES[k]; if(k===C.sede) return;
    if(C.open[k]){ const c=Math.round(s.cost/2), d=Math.ceil(s.days/2); show(`<h2>${s.name}</h2><div class="fact">${esc(cd(s.txt))}</div><p>Volver aquí cuesta ${c} HS y ${d} días.</p><div class="btns"><button id="tN">Quedarse</button><button class="main" id="tY">Viajar</button></div>`);
      q('tN').onclick=hub; q('tY').onclick=()=>{ if(!spend(c)) return; pass(d); C.sede=k; log('viajas a '+s.name); hub(); }; return; }
    if(s.act>C.act) return msg(`${s.name} está lejos todavía: se abre en el acto ${['','I','II','III','IV'][s.act]} de tu carrera, cuando ganes el gran munus del acto anterior.<div class="fact" style="margin-top:.6em">${esc(cd(s.txt))}</div>`);
    if(C.fame<s.fame) return msg(`La fama no te precede todavía en ${s.name}. Necesitas fama ${s.fame} para que su editor te contrate.<div class="fact" style="margin-top:.6em">${esc(cd(s.txt))}</div>`);
    show(`<h2>Viaje a ${s.name}</h2><div class="fact">${esc(cd(s.txt))}</div><p>${s.act>1&&SEDES[C.sede].reg!==s.reg?'El lanista paga un pasaje en barco.':'El lanista alquila un carro y te acompaña.'} Coste: <b>${s.cost} HS</b> y <b>${s.days} días</b> de camino.</p>
      <div class="btns"><button id="tN">Todavía no</button><button class="main" id="tY">Partir</button></div>`);
    q('tN').onclick=hub; q('tY').onclick=()=>{ if(!spend(s.cost)) return; pass(s.days); C.open[k]=true; C.sede=k; log('llegas a '+s.name); roadEvent(); }; }
  function roadEvent(){ const r=Math.random();
    if(r<.33) msg('En una posada del camino te reconocen y el posadero no os cobra la cena. +2 de fama.',()=>{ C.fame=Math.min(FMAX,C.fame+2); hub(); });
    else if(r<.55) msg('Unos bandidos asaltan el carro en un desfiladero. El lanista paga para que os dejen pasar y te descuenta 80 HS.',()=>{ C.hs=Math.max(0,C.hs-80); if(C.origin==='servus') C.peculium=Math.min(C.peculium,C.hs); hub(); });
    else hub(); }
  function train(){ const D=DIETS[C.diet];
    show(`<h2>El doctor Calvio</h2><div class="sub">Una semana en el palus. Lo que ganas depende de tu dieta (${D.n}: ×${D.xp}) y de tu salud.</div>
      <div class="grid" style="grid-template-columns:repeat(2,1fr)">${Object.entries(TRAIN).map(([k,t])=>{ const lv=C.st[k], c=C.origin==='auctoratus'?60+lv*30:0; return `<div class="pick" data-k="${k}" tabindex="0"><h3>${t} · nivel ${lv}</h3><div class="grp">${TRAIN_D[k]}</div><p style="margin:.3em 0">${bar(C.xp[k],need(lv),C.xp[k]+' / '+need(lv))}</p><p style="margin:.1em 0">${lv>=10?'máximo':(c?c+' HS · ':'')+'7 días'}</p></div>`; }).join('')}</div>
      <div class="btns"><button id="xB">Volver</button></div>`);
    q('xB').onclick=hub; document.querySelectorAll('[data-k]').forEach(e=>e.onclick=()=>{ const k=e.dataset.k, lv=C.st[k]; if(lv>=10) return; if(C.hp<30) return msg('Estás demasiado herido para entrenar. Descansa o visita al medicus.');
      const c=C.origin==='auctoratus'?60+lv*30:0; if(c&&!spend(c)) return; const g=Math.round(26*DIETS[C.diet].xp*(C.hp/100*.5+.5)); const up=gainXP(k,g); pass(7); C.hp=Math.max(10,C.hp-6); log('entrenas '+TRAIN[k].toLowerCase()+(up?' y subes de nivel':'')); hub(); }); }
  function armatura(){ const ts=typesFor(C.act);
    show(`<h2>Cambiar de armatura</h2><div class="sub">El doctor te enseña otra forma de luchar: 300 HS y dos semanas. Lo entrenado y la fama se quedan contigo; la armería empieza de nuevo.</div>
      <div class="grid" style="grid-template-columns:repeat(4,1fr)">${ts.map(t=>`<div class="pick${t===C.type?' sel':''}" data-y="${t}" tabindex="0"><h3>${TYPE_ES[t]}</h3><div class="grp">contra ${PAIRS[t].map(x=>TYPE_ES[x].toLowerCase()).join(' o ')}</div><p style="font-size:.8em;margin:.2em 0">${esc(BIO[t].tip)}</p></div>`).join('')}</div>
      <div class="btns"><button id="yB">Volver</button></div>`,true);
    q('yB').onclick=hub; document.querySelectorAll('[data-y]').forEach(e=>e.onclick=()=>{ const t=e.dataset.y; if(t===C.type) return; if(!spend(300)) return; C.type=t; C.gear={galea:0,escudo:0,ocreae:0,arma:0}; pass(14); log('pasas a combatir como '+TYPE_ES[t].toLowerCase()); hub(); }); }
  function food(){ show(`<h2>Comedor del ludus</h2><div class="sub">La dieta se paga cada semana. Si te quedas sin dinero, vuelves a la ración del ludus.</div>
      <div class="grid" style="grid-template-columns:repeat(3,1fr)">${Object.entries(DIETS).map(([k,d])=>`<div class="pick${C.diet===k?' sel':''}" data-f="${k}" tabindex="0"><h3>${d.n}</h3><div class="grp">${d.c?d.c+' HS por semana':'gratis'}</div><p style="font-size:.88em">${esc(cd(d.d))}</p><p style="font-size:.85em;color:var(--accent)">entrenamiento ×${d.xp} · salud +${d.reg} al día</p></div>`).join('')}</div>
      <div class="fact" style="margin-top:.7em">${esc(cd(TONIC.d))} <b>${TONIC.c} HS</b> <button id="fT" style="font-size:.85em;margin-left:.4em">Comprar</button></div>
      <div class="btns"><button id="fB">Volver</button></div>`);
    q('fB').onclick=hub; q('fT').onclick=()=>{ if(!spend(TONIC.c)) return; C.tonic=60; log('tomas la bebida de ceniza vegetal'); hub(); };
    document.querySelectorAll('[data-f]').forEach(e=>e.onclick=()=>{ C.diet=e.dataset.f; log('cambias a '+DIETS[C.diet].n.toLowerCase()); food(); }); }
  function medicus(){ const half=C.sede==='pergamum'?.5:1; const cHp=Math.round((100-C.hp)*2.5*half), cTr=Math.round(90*half), cGr=Math.round(420*half), cSq=Math.round(650*half);
    const secs=Object.entries(C.secuelas).filter(([k,v])=>v>0);
    show(`<h2>Medicina</h2><div class="sub">${half<1?'En Pérgamo, la escuela de Galeno: el medicus cobra la mitad. ':''}Cada día recuperas salud según tu dieta. Una lesión sin tratar puede curarse mal y dejar secuela para siempre.</div>
      ${opt.aula?`<div class="fact">${esc('Galeno, médico de la escuela de gladiadores de Pérgamo entre el 158 y el 161, perdió dos gladiadores, mientras que su predecesor había perdido sesenta (Bishop, 2017, p. 135).')}</div>`:''}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:left;margin-top:.6em">
        <div class="pick"><h3>Medicus del ludus</h3><div class="grp">cura y venda</div>
          ${C.hp<100?`<button id="dH" style="margin:.3em 0">Curar heridas hasta salud 100 · ${cHp} HS</button>`:'<p>Sin heridas abiertas.</p>'}
          ${C.injuries.filter(j=>!j.treated).map(j=>`<button data-tr="${j.n}" style="margin:.2em 0">Tratar ${j.n} · ${cTr} HS (sin secuela, mitad de días)</button>`).join('')}</div>
        <div class="pick"><h3>Médico griego</h3><div class="grp">caro, pero sabio</div>
          ${C.injuries.map(j=>`<button data-gr="${j.n}" style="margin:.2em 0">Curar ${j.n} del todo · ${cGr} HS</button>`).join('')||'<p>Ninguna lesión que curar.</p>'}
          ${secs.map(([k,v])=>`<button data-sq="${k}" style="margin:.2em 0">Aliviar secuela de ${k} · ${cSq} HS</button>`).join('')}</div></div>
      <div class="btns"><button id="dB">Volver</button></div>`,true);
    q('dB').onclick=hub; if(q('dH')) q('dH').onclick=()=>{ if(!spend(cHp)) return; C.hp=100; pass(1); log('el medicus cura tus heridas'); medicus(); };
    document.querySelectorAll('[data-tr]').forEach(b=>b.onclick=()=>{ if(!spend(cTr)) return; const j=C.injuries.find(x=>x.n===b.dataset.tr); j.treated=true; j.days=Math.ceil(j.days/2); log('el medicus trata la lesión de '+j.n); medicus(); });
    document.querySelectorAll('[data-gr]').forEach(b=>b.onclick=()=>{ if(!spend(cGr)) return; C.injuries=C.injuries.filter(x=>x.n!==b.dataset.gr); pass(2); log('el médico griego cura tu '+b.dataset.gr); medicus(); });
    document.querySelectorAll('[data-sq]').forEach(b=>b.onclick=()=>{ if(!spend(cSq)) return; C.secuelas[b.dataset.sq]--; log('el médico griego alivia la secuela de '+b.dataset.sq); medicus(); }); }
  function temple(){ show(`<h2>Templo · favor de los dioses</h2><div class="sub">El favor sube con las ofrendas y se enfría poco a poco si los olvidas. Cuanto más favor, mayor el efecto en cada combate.</div>
      <div class="grid" style="grid-template-columns:repeat(4,1fr)">${Object.entries(GODS).map(([k,g])=>`<div class="pick" tabindex="0"><h3>${g.n}</h3><div class="grp">${g.e}</div><p style="margin:.3em 0">${bar(C.favor[k],100,C.favor[k])}</p>${g.h&&opt.aula?`<p style="font-size:.8em;color:var(--muted)">${esc(g.h)}</p>`:''}
        <button data-of="${k}" style="margin:.2em 0;font-size:.85em">Ofrenda · 100 HS (+20)</button><button data-ex="${k}" style="margin:.2em 0;font-size:.85em">Exvoto · 280 HS (+50)</button></div>`).join('')}</div>
      <div class="btns"><button id="gB">Volver</button></div>`,true);
    q('gB').onclick=hub;
    document.querySelectorAll('[data-of]').forEach(b=>b.onclick=()=>{ if(!spend(100)) return; const k=b.dataset.of; C.favor[k]=Math.min(100,C.favor[k]+20); log('ofrenda a '+GODS[k].n); temple(); });
    document.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>{ if(!spend(280)) return; const k=b.dataset.ex; C.favor[k]=Math.min(100,C.favor[k]+50); log('exvoto a '+GODS[k].n); temple(); }); }
  function armory(){ const T=TYPES[C.type], wk={gladius:'Gladius',sica:'Sica',trident:'Tridente',spear:'Lanza',lance:'Lanza',pugio:'Puñal',bow:'Arco',javelin:'Jabalinas'}; const nm={galea:T.helmet?'Galea (yelmo)':'Galerus y manica',escudo:T.shH?T.shield[0].toUpperCase()+T.shield.slice(1):(C.type==='retiarius'?'Red':'Brazal'),ocreae:'Ocreae (grebas)',arma:wk[WEAP[C.type]]||'Arma'};
    show(`<h2>Armería</h2><div class="sub">Mejor bronce y mejor hierro. Cada mejora de protección resta un 3 % del daño que recibes; cada mejora del arma suma un 6 % al daño.</div>
      <div class="grid" style="grid-template-columns:repeat(4,1fr)">${Object.keys(nm).map(k=>{ const lv=C.gear[k], c=300*(lv+1); return `<div class="pick" data-a="${k}" tabindex="0"><h3>${nm[k]}</h3><div class="grp">nivel ${lv} de 3</div><p>${lv>=3?'máximo':c+' HS'}</p></div>`; }).join('')}</div>
      <div class="btns"><button id="aB">Volver</button></div>`);
    q('aB').onclick=hub; document.querySelectorAll('[data-a]').forEach(e=>e.onclick=()=>{ const k=e.dataset.a, lv=C.gear[k], c=300*(lv+1); if(lv>=3) return; if(!spend(c)) return; C.gear[k]++; log('mejoras '+nm[k].toLowerCase()); armory(); }); }

  /* ---------- libellus: elegir combate ---------- */
  function rivalFor(tier,rank){ const rt=pick(PAIRS[C.type]); const base=[.3,.42,.52,.6,.66,.72,.77,.82][tier], ai=clamp(base+rank*.06+C.rec.vict*.003,.28,.9);
    const pay=Math.round([1000,1800,3000,4800,6500,8500,11000,14000][tier]*(1+rank*.5)*payMul()/10)*10; const pg=Math.round(rnd(1,4)+tier*3+rank*3);
    return {rt,ai,pay,rname:pick(C.fem?NOMINA_F:APODOS),style:pick(Object.keys(STYLES)),pugnae:pg,vict:Math.round(pg*rnd(.55,.85)),fame:2+tier+rank*2,rank}; }
  function libellus(){ const s=SEDES[C.sede]; if(C.hp<25) return msg('Estás demasiado herido para combatir. Descansa o visita al medicus.');
    const g=GRAN[C.act], gHere=g&&(C.sede===g.sede||C.sede===g.alt), final=gHere&&C.fame>=g.fame;
    let offers=final?[Object.assign(rivalFor(s.tier,2),{ai:g.ai,pay:Math.round((C.act===4?20000:6000+C.act*3000)*payMul()),rname:C.fem?g.boss.replace(/us$/,'a'):g.boss,style:'astuto',boss:true,fame:12})]:[rivalFor(s.tier,0),rivalFor(s.tier,1),rivalFor(s.tier,2)];
    if(!final&&C.fame>=35){ const st=rivalFor(Math.min(7,s.tier+1),2); st.star=true; st.pay=Math.round(st.pay*1.4); st.fame+=4; offers.push(st); }
    if(!final&&C.nemesis&&Math.random()<.4){ const n=rivalFor(s.tier,2); n.rname=C.nemesis; n.nem=true; n.fame+=5; n.ai=Math.min(.88,n.ai+.05); offers[2]=n; }
    const lbl=C.fem?['contra una novata de otro ludus','contra una veterana','contra la favorita de la ciudad']:['contra un tiro de otro ludus','contra un veterano','contra el favorito de la ciudad'];
    const note=gHere&&!final?`<div class="fact">${g.name} solo te llamará con fama ${g.fame} (ahora ${C.fame}).</div>`:'';
    show(`<h2>Libellus muneris · ${s.name}</h2><div class="sub">${esc(cd('Las parejas se fijaban días antes del munus, en un programa pintado en el muro, como el libellus de Pompeya (Mañas Bastidas, 2011).'))}</div>${note}
      <div class="grid" style="grid-template-columns:repeat(${offers.length},1fr)">${offers.map((o,i)=>`<div class="pick" data-i="${i}" tabindex="0"><h3>${o.boss?g.name+(C.act===4?' · tres combates seguidos':''):o.star?'Combate estelar (por tu fama)':o.nem?'Revancha con tu némesis':lbl[i]}</h3><div class="grp">${esc(o.rname)} · ${TYPE_ES[o.rt].toLowerCase()} · ${STYLES[o.style].lbl.split(':')[0]}</div>
        <p style="margin:.3em 0">${o.pugnae} combates · ${o.vict} victorias</p><p style="margin:.2em 0">El editor paga <b>${o.pay} HS</b> al lanista${ORIGINS[C.origin].share?` · tu parte: ${Math.round(o.pay*ORIGINS[C.origin].share)} HS`:''}</p><p style="margin:.2em 0">Fama en juego +${o.fame} · dificultad ${'◆'.repeat(1+Math.round((o.ai-.28)/.12))}</p></div>`).join('')}</div>
      <div class="sub" style="font-size:.8em;margin-top:.5em">Tu fama (${title()}) sube la bolsa un ${Math.round((payMul()-1)*100)} %${C.fame>=35?' y te abre combates estelares':' y con fama 35 te abrirá combates estelares'}.</div>
      <div class="btns"><button id="lB">Volver</button></div>`,true);
    q('lB').onclick=hub; document.querySelectorAll('[data-i]').forEach(e=>e.onclick=()=>cena(offers[+e.dataset.i])); }
  function cena(o){ show(`<h2>La víspera</h2><div class="fact">${esc(cd('La noche anterior al munus, el editor ofrecía a los combatientes la cena libera, la comida sin límite, a menudo en el foro y con el público mirando y hablando con ellos (Dunkle, 2013).'))}</div>
      <p>Comes en el foro de ${SEDES[C.sede].name}. La gente se acerca a mirarte y algunos apuestan ya por ${esc(o.rname)}.</p>
      <div class="btns"><button id="eB">Retirarse del cartel</button><button class="main" id="eG">A la arena</button></div>`);
    q('eB').onclick=hub; q('eG').onclick=()=>fight(o); }
  function fight(o){ const sd=SEDES[C.sede], v=venueByName(sd.venue||sd.name);
    const inj=n=>C.injuries.some(j=>j.n===n);
    const pm={dmgMul:(1+C.st.fuerza*.035+C.gear.arma*.06+fav('mars')*.12)*(inj('brazo')?.85:1)*(1-sec('brazo')*.05),
      regenMul:(1+C.st.aguante*.06+fav('hercules')*.3)*(inj('costillas')?.8:1)*(1-sec('costillas')*.08),
      armor:(C.gear.galea+C.gear.escudo+C.gear.ocreae)*.03,critBonus:Math.round(C.st.tecnica*.6+fav('fortuna')*4),fame:40+C.fame*.3+fav('nemesis')*25};
    const php=Math.round(clamp((C.series?C.hp:C.hp)*(.82+C.st.vigor*.018),10,100)*(inj('pierna')?.9:1)*(1-sec('pierna')*.05));
    window.CM={ptype:C.type,rtype:o.rt,pname:C.name,rname:o.rname,style:o.style,ai:o.ai,venue:v,php,pmods:pm,
      pbio:{status:ORIGINS[C.origin].t.toLowerCase()+' · '+ORIGINS[C.origin].s,pugnae:C.rec.pugnae,vict:C.rec.vict},rbio:{pugnae:o.pugnae,vict:o.vict},
      pfem:C.fem,rfem:C.fem,onEnd:r=>after(o,r)};
    closeOv(); newDuel(); }
  function after(o,r){ const share=ORIGINS[C.origin].share; let t='', dead=false; C.rec.pugnae++; C.lastFight=C.day; pass(1);
    const perf=Math.min(6,Math.round((r.stats.crits||0)*.5+(r.stats.combos||[]).length*.8));
    if(r.stans){ C.rec.stans++; const coins=Math.round(o.pay*.12); C.hs+=coins; if(C.origin==='servus') C.peculium+=coins; C.fame=Math.min(FMAX,C.fame+2); t=`Stantes missi: los dos salís vivos. La grada os lanza monedas: +${coins} HS, +2 fama.`; }
    else if(r.won){ HIST.xp(15,'victoria en la arena'); C.rec.vict++; const mine=Math.round(o.pay*share), coins=Math.round(o.pay*.04*(1+perf*.3)); const gf=o.fame+perf;
      C.hs+=mine+coins; if(C.origin==='servus') C.peculium+=mine+coins; C.fame=Math.min(FMAX,C.fame+gf); if(C.origin==='auctoratus') C.contract=Math.max(0,C.contract-1);
      t=`Victoria sobre ${esc(o.rname)}${r.missio?', que sale vivo con la missio':', al que el editor niega la missio'}. ${mine?`Tu parte de la bolsa: ${mine} HS. `:''}La grada lanza monedas: ${coins} HS. Fama +${gf}.`;
      const st=pick(Object.keys(TRAIN)); if(gainXP(st,12)) t+=` El combate te enseña: sube tu ${TRAIN[st].toLowerCase()}.`;
      if(o.boss){ if(C.act===4){ C.series=(C.series||0)+1; if(C.series>=3){ C.pending.push('trajano'); } else { C.pendingFight=Object.assign({},o,{rname:pick(C.fem?NOMINA_F:['Dacicus','Moesicus','Sarmaticus']),ai:Math.min(.92,o.ai+.02)}); t+=` Combate ${C.series} de 3 del munus de Trajano. Sin descanso: el siguiente te espera.`; } } else { C.pending.push('acto'+(C.act+1)); } }
      if(o.nem){ C.nemesis=null; t+=' Tu némesis no volverá a molestarte.'; }
      else if(o.rank>=2&&!C.nemesis&&Math.random()<.5){ C.nemesis=o.rname; t+=` ${esc(o.rname)} jura que volveréis a veros.`; }
      if(C.fame>=30&&Math.random()<.25){ const k=Object.keys(SEDES).find(k=>!C.open[k]); if(k){ C.open[k]=true; t+=` El editor de ${SEDES[k].name} ha oído hablar de ti y te invita: la ruta queda abierta.`; } } }
    else { C.rec.derrotas++; if(o.boss&&C.act===4) C.series=null; if(C.origin==='auctoratus') C.contract=Math.max(0,C.contract-1);
      if(!r.missio) dead=true;
      else { const lf=Math.max(1,4-perf); C.fame=Math.max(0,C.fame-lf); t=`Has caído, pero la grada gritó missos y el editor te concedió la missio. Fama −${lf}.`; } }
    if(!dead){ C.hp=clamp(Math.round(r.php),5,100); const risk=(C.hp<45?.55:.15)+(r.won||r.stans?0:.4); if(Math.random()<risk*(C.tonic>0?.5:1)){ const n=pick(['brazo','pierna','costillas']); if(!C.injuries.some(j=>j.n===n)){ C.injuries.push({n,days:Math.round(rnd(25,55)),treated:false}); t+=` Sales con una lesión de ${n}: sin tratar puede dejarte secuela.`; } } }
    if(dead){ C.alive=false; save(); hof('mors'); epitaph(o); return; }
    log((r.won?'vence a ':r.stans?'empata con ':'pierde ante ')+o.rname+' en '+SEDES[C.sede].name);
    if(C.origin==='auctoratus'&&C.contract===0) C.pending.push('contrato');
    if(C.pendingFight&&!C.pending.length){ const nf=C.pendingFight; C.pendingFight=null; save(); show(`<h2>Victoria</h2><div class="sub" style="color:var(--ink)">${t}</div><div class="btns"><button class="main" id="sN">Al siguiente combate</button></div>`); q('sN').onclick=()=>fight(nf); return; }
    save(); show(`<h2>${r.won?'Victoria':r.stans?'Stantes missi':'Missus est'}</h2><div class="sub" style="color:var(--ink)">${t}</div>
      <div class="hoja">golpes ${r.stats.hits} · críticos ${r.stats.crits||0} · combos ${(r.stats.combos||[]).length} · sestercios ${C.hs} HS · fama ${C.fame} (${title()})</div>
      <div class="btns"><button class="main" id="aOk">Volver al ludus</button></div>`); q('aOk').onclick=hub; setTimeout(()=>q('aOk').focus(),30); }

  /* ---------- hitos y finales ---------- */
  function milestone(k){ if(/^acto[234]$/.test(k)) HIST.xp(50,'nuevo acto');
    if(k==='acto2'||k==='acto3'||k==='acto4'){ const n=+k.slice(4); C.act=n; const T={2:['Fuera de Hispania','Has ganado el gran munus de Tarraco. Un lanista de la Galia ofrece a Gneo Opimio una suma por tu contrato: Arelate y Nemausus te esperan por mar, y Lepcis Magna al otro lado.'],3:['Las provincias te conocen','Tu nombre corre de Arelate a Lepcis. Se abren Oriente e Italia: Éfeso, Pérgamo, Capua y Pompeya.'],4:['Convocado a Roma','Pompeya te aclama. Llega la llamada al Ludus Magnus, la escuela imperial junto al Anfiteatro Flavio.']}[n];
      const nt=ACT_TYPES[n].map(t=>TYPE_ES[t].toLowerCase()).join(', ');
      show(`<h1>${T[0]}</h1><div class="sub" style="color:var(--ink)">${T[1]}</div>${nt?`<div class="fact">Nuevas armaturas en el ludus: ${nt}.</div>`:''}<div class="btns"><button class="main" id="kOk">Al ludus</button></div>`); q('kOk').onclick=hub; log('empieza el acto '+['','I','II','III','IV'][n]); return; }
    if(k==='trajano'){ C.alive=false; save(); hof('trajano'); HIST.xp(100,'rudis ante Trajano'); show(`<h1>Rudis en el Anfiteatro Flavio</h1><div class="sub" style="color:var(--ink)">Tres combates seguidos y sigues en pie. Trajano levanta la mano y la grada ruge tu nombre: recibes la rudis y la libertad.</div>
      <div class="fact">${esc(cd('En el 107 d.C. Trajano celebró su victoria dacia con un munus de 123 días; según Dión Casio combatieron diez mil gladiadores (Mañas Bastidas, 2011).'))}</div>
      <div class="hoja">${C.rec.pugnae} combates · ${C.rec.vict} victorias · ${C.hs} HS · ${title()}</div>
      <div class="btns"><button class="main" id="nOk">Nueva carrera</button><button id="nM">Menú</button></div>`); q('nOk').onclick=create; q('nM').onclick=menu; return; }
    if(k==='galia'){ show(`<h1>Fuera de Hispania</h1><div class="sub" style="color:var(--ink)">Has ganado el gran munus de Tarraco. Un lanista de la Galia ofrece a Gneo Opimio una suma por tu contrato, y la grada de Arelate ya oye tu nombre.</div>
      <div class="fact">La fase 2 de la carrera (Galia y África, con secutor y reciario) está en construcción. Puedes seguir combatiendo en Hispania y ahorrando para tu libertad.</div><div class="btns"><button class="main" id="kOk">Volver al ludus</button></div>`); q('kOk').onclick=hub; return; }
    if(k==='rudis3'){ show(`<h1>La rudis</h1><div class="sub" style="color:var(--ink)">Tres años en la arena. El lanista te entrega la rudis, la espada de madera que te retira de los combates.</div><div class="fact">${esc(cd('Una ley de Adriano permitía al damnatus ad ludum obtener la rudis a los tres años y la libertad si sobrevivía cinco (Dunkle, 2013).'))}</div>
      <div class="btns"><button id="kR">Retirarse con la rudis</button><button class="main" id="kOk">Seguir combatiendo</button></div>`); q('kOk').onclick=hub; q('kR').onclick=()=>ending('retiro'); return; }
    if(k==='lib5'){ show(`<h1>Libertas</h1><div class="sub" style="color:var(--ink)">Cinco años y sigues vivo. Eres libre.</div><div class="btns"><button class="main" id="kOk">Continuar</button></div>`); q('kOk').onclick=()=>ending('libertas'); return; }
    if(k==='contrato'){ show(`<h2>Fin del contrato</h2><div class="sub" style="color:var(--ink)">Has cumplido tus ocho combates. Gneo Opimio te ofrece renovar por ocho más con una prima de 900 HS.</div>
      <div class="btns"><button id="kX">Retirarse libre</button><button class="main" id="kY">Renovar</button></div>`); q('kX').onclick=()=>ending('libertas'); q('kY').onclick=()=>{ C.contract=8; C.hs+=900; log('renuevas el contrato'); hub(); }; return; }
    hub(); }
  function ending(kind){ C.alive=false; save(); hof(kind); HIST.xp(100,'carrera terminada');
    const t=kind==='libertas'?'Sales del ludus libre.':'Cuelgas las armas y te quedas en el ludus como doctor, enseñando a los que llegan.';
    show(`<h1>${kind==='libertas'?'Libertas':'Retiro'}</h1><div class="sub" style="color:var(--ink)">${t} ${C.rec.pugnae} combates, ${C.rec.vict} victorias, ${C.hs} sestercios y la fama de ${title()}.</div>
      <div class="btns"><button class="main" id="nOk">Nueva carrera</button><button id="nM">Menú</button></div>`); q('nOk').onclick=create; q('nM').onclick=menu; }
  function epitaph(o){ const tp=BIO[C.type].lat;
    show(`<h2>Iugula</h2><div class="sub" style="color:var(--ink)">La grada gritó iugula y el editor negó la missio en ${SEDES[C.sede].name}. ${esc(o.rname)} cumple la sentencia.</div>
      <div style="margin:.6em auto;max-width:340px;background:#c8703a;color:#17110b;border-radius:120px 120px 6px 6px;padding:1.1em .8em .9em;font-family:'Times New Roman',serif;letter-spacing:.14em;line-height:1.5;box-shadow:inset 0 0 0 3px #17110b">
        <div>D · M</div><div style="font-size:1.35em;font-weight:bold">${esc(C.name.toUpperCase())}</div><div>${tp}</div><div>PVGNARVM ${C.rec.pugnae} · VICIT ${C.rec.vict}</div>${C.rec.stans?`<div style="font-size:.85em">STANTES MISSI ${C.rec.stans}</div>`:''}<div style="font-size:.85em">${esc(SEDES[C.sede].name.toUpperCase())}</div></div>
      <div class="sub" style="font-size:.85em">${esc(cd('Más de la mitad de los epitafios latinos de gladiadores registran el número de combates o de victorias (Ceballos, 2003, p. 323).'))}</div>
      <div class="btns"><button class="main" id="nOk">Nueva carrera</button><button id="nM">Menú</button></div>`); q('nOk').onclick=create; q('nM').onclick=menu; }

  return {menu,hub,quick,tutEnd,create,get state(){return C},set state(v){C=v}};
})();

Career.menu();

</script></body></html>
