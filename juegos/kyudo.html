<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1c1612">
<title>Kyūdō · El camino del arco</title>
<style>
:root{
  --washi:#f3e9d2; --washi2:#e9dcbf; --sumi:#1c1612; --sumi2:#2b231c; --bermellon:#b8322a; --indigo:#2d4a6b; --oro:#c9a24a;
  --ok:#2d6aa3; --mal:#d9822b; --tit:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","Songti SC",Georgia,"Times New Roman",serif;
  --txt:Calibri,Carlito,"Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0e0b08;color:var(--washi);font-family:var(--txt);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
#lienzo{position:fixed;inset:0;width:100%;height:100%;display:block}
#papel{position:fixed;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.22}
#vineta{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,rgba(0,0,0,0) 55%,rgba(20,12,6,.55) 100%)}
button{font-family:var(--txt);cursor:pointer}
.oculto{display:none!important}

/* ---------- carga ---------- */
#carga{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#14100c;transition:opacity .6s}
#carga .sello{width:84px;height:84px;border-radius:50%;border:3px solid var(--bermellon);display:flex;align-items:center;justify-content:center;font:700 40px/1 var(--tit);color:var(--bermellon);animation:latir 1.6s ease-in-out infinite}
#carga .barra{width:min(320px,70vw);height:4px;background:#3a2e22;border-radius:2px;overflow:hidden}
#carga .barra i{display:block;height:100%;width:0;background:var(--oro);transition:width .25s}
#carga p{margin:0;font:16px var(--txt);color:#cdbd9c;letter-spacing:.04em}
@keyframes latir{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* ---------- paneles ---------- */
.capa{position:fixed;inset:0;z-index:35;display:flex;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.capa.velo{background:rgba(14,10,7,.55);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.hoja{position:relative;background:var(--washi);color:var(--sumi);border-radius:4px;box-shadow:0 18px 50px rgba(0,0,0,.55),inset 0 0 0 1px rgba(60,40,20,.25);padding:22px 26px;max-width:640px;width:100%;max-height:100%;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.hoja::before{content:"";position:absolute;inset:6px;border:1px solid rgba(120,80,40,.35);pointer-events:none;border-radius:2px}
.hoja h2{font:700 26px/1.15 var(--tit);margin:0 0 6px;color:var(--sumi)}
.hoja h3{font:600 14px/1.2 var(--txt);margin:0 0 10px;letter-spacing:.12em;text-transform:uppercase;color:var(--bermellon)}
.hoja p{font:17px/1.42 var(--txt);margin:0 0 12px}
.hoja .cita{font:16px/1.45 var(--txt);border-left:3px solid var(--bermellon);padding:2px 0 2px 12px;margin:6px 0 10px;color:#3a2e24}
.hoja .fuente{font:13px/1.35 var(--txt);color:#6a5a48;margin:0 0 12px}
.fila{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.btn{min-height:46px;padding:0 20px;border-radius:24px;border:0;font:700 17px/1 var(--txt);letter-spacing:.02em;background:var(--sumi);color:var(--washi);box-shadow:0 3px 0 #000}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
.btn.rojo{background:var(--bermellon);color:#fff;box-shadow:0 3px 0 #6a1712}
.btn.claro{background:transparent;color:var(--sumi);box-shadow:inset 0 0 0 2px var(--sumi)}
.btn[disabled]{opacity:.4}

/* ---------- portada ---------- */
#portada{align-items:flex-end;justify-content:flex-start;background:linear-gradient(90deg,rgba(12,8,5,.78) 0%,rgba(12,8,5,.35) 45%,rgba(0,0,0,0) 70%)}
#portada .bloque{max-width:520px;padding:0 0 4vh 2vw}
#portada .kanji{font:800 clamp(64px,13vh,120px)/.9 var(--tit);color:var(--washi);letter-spacing:.04em;text-shadow:0 4px 24px rgba(0,0,0,.6)}
#portada .kanji b{color:var(--bermellon);font-weight:800}
#portada h1{font:700 clamp(26px,5.4vh,44px)/1.05 var(--tit);margin:8px 0 4px;color:var(--washi)}
#portada .sub{font:clamp(14px,2.6vh,18px)/1.35 var(--txt);color:#e3d3b0;margin:0 0 18px;max-width:440px}
#portada .fila{gap:12px}
#portada .btn{min-height:50px;font-size:18px}
#portada .btn.claro{color:var(--washi);box-shadow:inset 0 0 0 2px rgba(243,233,210,.7)}
#esquina{position:fixed;top:max(10px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));z-index:30;display:flex;gap:8px}
.icono{min-width:46px;height:46px;border-radius:23px;border:1px solid rgba(243,233,210,.45);background:rgba(20,14,9,.62);color:var(--washi);font:700 15px/1 var(--txt);padding:0 12px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#copy{position:fixed;left:max(12px,env(safe-area-inset-left));bottom:max(6px,env(safe-area-inset-bottom));z-index:21;font:12px var(--txt);color:rgba(243,233,210,.6);pointer-events:none}

/* ---------- lámina ---------- */
#lamina .hoja{max-width:860px;display:flex;gap:20px;align-items:center}
#lamina img{max-height:min(68vh,520px);max-width:48%;box-shadow:0 6px 18px rgba(0,0,0,.35);border:8px solid #f7efdc;outline:1px solid #6a5a48}
@media (max-aspect-ratio:1/1){#lamina .hoja{flex-direction:column}#lamina img{max-width:100%}}

/* ---------- pregunta ---------- */
#pregunta .hoja{max-width:720px}
.opciones{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 6px}
@media (max-width:560px){.opciones{grid-template-columns:1fr}}
.op{position:relative;min-height:54px;text-align:left;padding:10px 14px 10px 44px;border-radius:6px;border:2px solid #b9a582;background:#fbf5e6;color:var(--sumi);font:600 16px/1.25 var(--txt)}
.op::before{content:attr(data-l);position:absolute;left:12px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;background:var(--sumi);color:var(--washi);font:700 13px/22px var(--txt);text-align:center}
.op.ok{border-color:var(--ok);background:#e3eef8}
.op.ok::before{content:"✓";background:var(--ok)}
.op.mal{border-color:var(--mal);background:#fbeee0}
.op.mal::before{content:"✗";background:var(--mal)}
.op[disabled]{cursor:default}
.explica{display:none;margin-top:8px;padding:10px 12px;border-radius:6px;background:#efe3c8;font:16px/1.4 var(--txt)}
.explica b{font-weight:700}
.explica.on{display:block}
.conc{display:inline-flex;gap:4px;vertical-align:middle;margin-left:6px}

/* ---------- marcador ---------- */
#hud{position:fixed;top:max(8px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));z-index:10;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;gap:10px}
.placa{background:rgba(20,14,9,.66);border:1px solid rgba(243,233,210,.25);border-radius:6px;padding:7px 10px 8px;min-width:170px;max-width:30vw;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.placa .nom{font:700 16px/1.1 var(--tit);color:var(--washi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.placa .kg{font:12px var(--txt);color:#cdbd9c;margin:0 6px}
.barra2{display:flex;align-items:center;gap:6px;margin-top:5px;font:600 11px/1 var(--txt);color:#cdbd9c;letter-spacing:.06em;text-transform:uppercase}
.barra2 .tubo{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden;position:relative;min-width:80px}
.barra2 .tubo i{position:absolute;left:0;top:0;bottom:0;background:var(--washi);border-radius:4px}
.barra2 .tubo.eq i{background:repeating-linear-gradient(90deg,#e7c66a 0 6px,#cfa94a 6px 9px)}
.barra2 .tubo.bajo i{background:var(--mal)}
.pips{display:flex;gap:4px;margin-top:6px}
.pip{width:12px;height:12px;transform:rotate(45deg);border:1.5px solid var(--oro);background:transparent}
.pip.on{background:var(--oro)}
.placa.der{text-align:right}
.placa.der .barra2{flex-direction:row-reverse}
.placa.der .pips{justify-content:flex-end}
#dia{font:700 14px/1.2 var(--tit);color:var(--washi);background:rgba(20,14,9,.6);border-radius:14px;padding:6px 12px;text-align:center;white-space:nowrap}
#dia small{display:block;font:600 11px var(--txt);color:#cdbd9c;letter-spacing:.06em}

/* ---------- mandos ---------- */
#mandos{position:fixed;inset:auto 0 0 0;z-index:11;pointer-events:none;height:0}
#cruceta{position:fixed;left:max(14px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));width:156px;height:156px;pointer-events:auto;touch-action:none}
#cruceta button{position:absolute;width:56px;height:56px;border-radius:10px;border:1px solid rgba(243,233,210,.5);background:rgba(20,14,9,.55);color:var(--washi);font:700 22px/1 var(--txt);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;flex-direction:column}
#cruceta button small{font:600 9px/1 var(--txt);letter-spacing:.04em;margin-top:2px;opacity:.8;text-transform:uppercase}
#cruceta button.on{background:rgba(243,233,210,.85);color:var(--sumi)}
#cruceta .ar{left:50px;top:0}#cruceta .ab{left:50px;bottom:0}#cruceta .iz{left:0;top:50px}#cruceta .de{right:0;top:50px}
#acciones{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));width:210px;height:150px;pointer-events:auto;touch-action:none}
.acc{position:absolute;border-radius:50%;border:2px solid rgba(243,233,210,.65);background:rgba(20,14,9,.6);color:var(--washi);display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 22px/1 var(--tit);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.acc small{font:700 11px/1 var(--txt);margin-top:4px;letter-spacing:.03em}
.acc.on{background:rgba(243,233,210,.9);color:var(--sumi)}
.acc .cd{position:absolute;inset:-2px;border-radius:50%;background:conic-gradient(rgba(0,0,0,.55) var(--p,0%),transparent 0);pointer-events:none}
#bA{width:84px;height:84px;right:0;bottom:30px}
#bB{width:74px;height:74px;right:92px;bottom:0}
#bC{width:64px;height:64px;right:96px;bottom:84px}

/* ---------- avisos y ceremonia ---------- */
#aviso{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);z-index:12;pointer-events:none;text-align:center;opacity:0;transition:opacity .18s,transform .18s}
#aviso.on{opacity:1;transform:translate(-50%,-50%) scale(1.04)}
#aviso b{display:block;font:800 clamp(30px,7vh,56px)/1 var(--tit);color:var(--washi);text-shadow:0 3px 0 #000,0 0 24px rgba(0,0,0,.6)}
#aviso small{display:block;margin-top:6px;font:700 clamp(14px,2.6vh,19px)/1.2 var(--txt);color:#f0dfb8;text-shadow:0 2px 0 #000}
#guia{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:13;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none;width:min(560px,70vw)}
#guia p{margin:0;font:700 clamp(15px,2.8vh,19px)/1.25 var(--txt);text-align:center;background:rgba(20,14,9,.7);padding:8px 14px;border-radius:18px}
#ritmo{width:100%;height:16px;border-radius:8px;background:rgba(20,14,9,.7);border:1px solid rgba(243,233,210,.4);position:relative;overflow:hidden}
#ritmo .zona{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,rgba(201,162,74,.85) 0 5px,rgba(201,162,74,.5) 5px 10px)}
#ritmo .marca{position:absolute;top:-3px;bottom:-3px;width:5px;margin-left:-2px;background:var(--washi);box-shadow:0 0 6px #000}
#tocar{pointer-events:auto;min-width:200px;min-height:60px;border-radius:30px;border:2px solid var(--washi);background:var(--bermellon);color:#fff;font:800 20px/1 var(--txt);box-shadow:0 4px 0 #5a120d}
#tocar:active{transform:translateY(2px)}
#saltar{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));z-index:14}
#pausaBtn{display:none}



#zona{position:fixed;inset:0;z-index:5;touch-action:none}
#marca{position:fixed;top:max(10px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));z-index:12;display:flex;flex-direction:column;gap:3px;background:rgba(20,14,9,.66);border:1px solid rgba(243,233,210,.25);border-radius:6px;padding:8px 12px;pointer-events:none;font:600 13px/1.3 var(--txt);color:#e3d3b0}
#marca b{font:700 16px/1.2 var(--tit);color:var(--washi)}
.barra-f{display:inline-block;width:80px;height:8px;border-radius:4px;background:rgba(255,255,255,.15);vertical-align:middle;position:relative;overflow:hidden}
.barra-f i{position:absolute;left:0;top:0;bottom:0;background:repeating-linear-gradient(90deg,#e7c66a 0 6px,#cfa94a 6px 9px)}
#mira{position:fixed;left:0;top:0;z-index:11;width:64px;height:64px;border-radius:50%;pointer-events:none;opacity:0;border:2px solid rgba(255,255,255,.9);box-shadow:0 0 0 1px rgba(0,0,0,.6),inset 0 0 0 1px rgba(0,0,0,.5);background:conic-gradient(rgba(255,255,255,.35) var(--t,0%),transparent 0);will-change:transform}
#mira i{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px #000}
#mira.mal{border-color:var(--mal);border-style:dashed}
#trayecto{position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:12;font:800 18px var(--txt);color:var(--mal);text-shadow:0 2px 0 #000;pointer-events:none;opacity:0}
#pasos{position:fixed;left:50%;bottom:max(70px,calc(env(safe-area-inset-bottom) + 64px));transform:translateX(-50%);z-index:13;display:flex;align-items:center;gap:6px;pointer-events:none;background:rgba(20,14,9,.7);padding:6px 12px;border-radius:18px;font:700 14px var(--txt);color:rgba(243,233,210,.55)}
#pasos span.ahora{color:#fff;background:var(--bermellon);padding:3px 9px;border-radius:12px}
#pasos span.hecho{color:var(--washi);text-decoration:line-through;text-decoration-thickness:1px}
#pasos i{font-style:normal;opacity:.6}
.lista-pruebas{display:flex;flex-direction:column;gap:10px;margin:8px 0}
.prueba{display:flex;align-items:center;gap:14px;text-align:left;padding:10px 14px;border-radius:8px;border:2px solid #b9a582;background:#fbf5e6;color:var(--sumi);font:700 17px var(--txt)}
.prueba b{font:800 24px var(--tit);color:var(--bermellon);min-width:36px;text-align:center}
.prueba small{display:block;font:500 13px var(--txt);color:#6a5a48;margin-top:2px}
.prueba.cerrada{opacity:.55}
.juego #esquina{top:auto;bottom:max(10px,env(safe-area-inset-bottom))}
.juego #idiomaBtn{display:none}
.juego #pausaBtn{display:inline-flex;align-items:center;justify-content:center}
.diana-cerca{color:var(--washi)}
.diana-cerca.ya{color:#fff;background:var(--bermellon);border-radius:8px;padding:2px 6px}
#rotar{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#0e0b08;color:var(--washi);font:600 20px/1.3 var(--txt);text-align:center;padding:24px}
#rotar b{font-size:56px;line-height:1;display:block;animation:rot 2.2s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-width:900px){#rotar{display:flex}}
.banzuke{display:flex;gap:8px;margin:10px 0 4px}
.banzuke span{width:30px;height:30px;border-radius:50%;border:2px solid #8a7458;display:flex;align-items:center;justify-content:center;font:800 15px/1 var(--txt);color:#fff}
.banzuke span.g{background:var(--ok);border-color:var(--ok)}
.banzuke span.p{background:var(--mal);border-color:var(--mal)}
.banzuke span.a{border-color:var(--sumi);box-shadow:0 0 0 3px rgba(184,50,42,.35)}
.lista{margin:6px 0 12px;padding-left:20px;font:16px/1.45 var(--txt)}
.lista li{margin-bottom:4px}
.tabla{width:100%;border-collapse:collapse;font:15px/1.3 var(--txt);margin:6px 0 12px}
.tabla td{padding:5px 4px;border-bottom:1px solid rgba(120,80,40,.25)}
.tabla td:last-child{text-align:right;font-weight:700}
.color{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #000}
.color.sel{box-shadow:0 0 0 3px var(--sumi)}
.color[disabled]{opacity:.35}
.happ-in #copy{display:none}
.happ-in .capa.velo{padding-top:max(62px,calc(env(safe-area-inset-top) + 56px))}
.happ-in.combate .happ-bar{display:none!important}
@media (max-height:440px){.hoja{padding:14px 18px}.hoja h2{font-size:21px}.hoja p,.hoja .cita{font-size:15px;margin-bottom:8px}.hoja .fuente{font-size:12px;margin-bottom:6px}.op{min-height:46px;font-size:15px}.btn{min-height:44px;font-size:16px}.banzuke span{width:26px;height:26px}.color{width:34px;height:34px}}
.color[disabled]::after{content:"🔒";font-size:14px}
.combate #copy{display:none}
.lucha #esquina{top:calc(max(8px,env(safe-area-inset-top)) + 50px);right:50%;transform:translateX(50%)}
.lucha #esquina .icono{height:40px;min-width:40px}
#punos{display:flex;align-items:center;gap:10px;background:rgba(20,14,9,.75);padding:6px 14px;border-radius:20px;font:700 15px var(--txt)}
#punos b{width:30px;height:30px;border-radius:50%;border:3px solid var(--washi);display:inline-block}
#punos b.on{background:var(--washi);box-shadow:0 0 14px rgba(255,240,200,.9)}
@media (hover:hover) and (pointer:fine){.acc::after{content:attr(data-tecla);position:absolute;top:-8px;right:-4px;font:700 11px var(--txt);background:var(--washi);color:var(--sumi);border-radius:8px;padding:2px 5px}}
.combate #idiomaBtn{display:none}
</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<div id="papel"></div><div id="vineta"></div>

<div id="carga"><div class="sello">弓</div><div class="barra"><i></i></div><p id="cargaTxt">…</p></div>

<div id="esquina">
  <button class="icono" id="pausaBtn" aria-label="Pausa">❚❚</button>
  <button class="icono" id="idiomaBtn">EN</button>
  <button class="icono" id="sonidoBtn" aria-label="Sonido">♪</button>
</div>

<div id="zona"></div>
<div id="marca" class="oculto"></div>
<div id="mira"><i></i></div><div id="trayecto"></div>
<div id="pasos" class="oculto"></div>
<div id="aviso"><b></b><small></small></div>
<div id="guia" class="oculto"><p id="guiaTxt"></p></div>
<button class="btn claro oculto" id="saltar" style="color:var(--washi);box-shadow:inset 0 0 0 2px rgba(243,233,210,.7)"></button>

<div class="capa oculto" id="portada"><div class="bloque">
  <div class="kanji">弓<b>道</b></div>
  <h1 data-t="titulo"></h1>
  <p class="sub" data-t="subtitulo"></p>
  <div class="fila" id="portadaBtns"></div>
  <p class="sub" id="cuenta" style="margin-top:10px;font-size:13px;opacity:.8"></p>
</div></div>

<div class="capa velo oculto" id="panel"><div class="hoja" id="hoja"></div></div>
<div class="capa velo oculto" id="pregunta"><div class="hoja" id="hojaP"></div></div>
<div class="capa velo oculto" id="lamina"><div class="hoja"><img id="laminaImg" alt=""><div id="laminaTxt"></div></div></div>

<div id="rotar"><b aria-hidden="true">📱</b><span data-t="girar"></span></div>
<div id="copy">© Diseñado y Creado por Alejandro Leiva Arcas</div>

<script>window.HAPP_CFG={tema:5,volver:'../',orient:'h'};
/* Puente con Historiapp. Lo inserta hacer_historiapp.py en la versión <juego>-historiapp.html.
   Configuración en window.HAPP_CFG = { tema, volver, orient, fichas, enlaces, barra, barraEn, barraClase, css }.
   1. Idioma: toma historiapp.lang si existe y lo presenta al juego como navigator.language.

window.MALLAS_SRC="/* Sumo \u00b7 escultura de los cuerpos. Cada figura se esculpe como un campo de distancias con uniones suaves\n   (carne que se funde en la barriga, la papada y los muslos) y se convierte en malla con \u00absurface nets\u00bb.\n   Se genera al cargar, sin descargar modelos, y se ata a un esqueleto de 17 huesos para animarla. */\n(function(root){\n  const V = (x, y, z) => [x, y, z];\n  const sub = (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];\n  const dot = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];\n  const len = a => Math.sqrt(dot(a, a));\n  const clamp = (x, a, b) => x < a ? a : x > b ? b : x;\n  const smoothstep = (a, b, x) => { const t = clamp((x - a)/(b - a), 0, 1); return t*t*(3 - 2*t); };\n\n  // primitivas\n  function ellip(p, c, r){ // aproximaci\u00f3n de distancia a un elipsoide\n    const x = (p[0]-c[0])/r[0], y = (p[1]-c[1])/r[1], z = (p[2]-c[2])/r[2];\n    const k0 = Math.sqrt(x*x + y*y + z*z);\n    const x1 = x/r[0], y1 = y/r[1], z1 = z/r[2];\n    const k1 = Math.sqrt(x1*x1 + y1*y1 + z1*z1);\n    return k1 > 1e-6 ? k0*(k0 - 1)/k1 : -Math.min(r[0], r[1], r[2]);\n  }\n  function cono(p, a, b, ra, rb){ // c\u00e1psula de radio variable (aproximaci\u00f3n)\n    const pa = sub(p, a), ba = sub(b, a);\n    const h = clamp(dot(pa, ba)/dot(ba, ba), 0, 1);\n    const d = [pa[0] - ba[0]*h, pa[1] - ba[1]*h, pa[2] - ba[2]*h];\n    return len(d) - (ra + (rb - ra)*h);\n  }\n  function caja(p, c, h, r){ const qx = Math.abs(p[0]-c[0]) - h[0] + r, qy = Math.abs(p[1]-c[1]) - h[1] + r, qz = Math.abs(p[2]-c[2]) - h[2] + r;\n    return Math.hypot(Math.max(qx, 0), Math.max(qy, 0), Math.max(qz, 0)) + Math.min(Math.max(qx, qy, qz), 0) - r; }\n  function smin(a, b, k){ const h = clamp(.5 + .5*(b - a)/k, 0, 1); return b + (a - b)*h - k*h*(1 - h); }\n  function smax(a, b, k){ return -smin(-a, -b, k); }\n\n  /* ---------------- el cuerpo de un rikishi (sin cabeza) ---------------- */\n  // m: corpulencia (1 normal, 1.2 pesado, .85 joven del sumo antiguo)\n  function esqueleto(m){\n    const sh = .40 + .03*(m - 1);\n    return [\n      { n: 'raiz',     p: -1, o: V(0, 0, 0) },\n      { n: 'pelvis',   p: 0,  o: V(0, .86, 0) },\n      { n: 'lumbar',   p: 1,  o: V(0, 1.04, 0) },\n      { n: 'pecho',    p: 2,  o: V(0, 1.28, 0) },\n      { n: 'cuello',   p: 3,  o: V(0, 1.52, 0) },\n      { n: 'brazoD',   p: 3,  o: V(sh, 1.41, -.02) },  { n: 'codoD', p: 5,  o: V(sh + .21, 1.13, -.02) }, { n: 'manoD', p: 6,  o: V(sh + .37, .88, .0) },\n      { n: 'brazoI',   p: 3,  o: V(-sh, 1.41, -.02) }, { n: 'codoI', p: 8,  o: V(-sh - .21, 1.13, -.02) }, { n: 'manoI', p: 9,  o: V(-sh - .37, .88, .0) },\n      { n: 'musloD',   p: 1,  o: V(.2, .84, 0) },  { n: 'rodillaD', p: 11, o: V(.255, .47, .03) }, { n: 'pieD', p: 12, o: V(.27, .09, 0) },\n      { n: 'musloI',   p: 1,  o: V(-.2, .84, 0) }, { n: 'rodillaI', p: 14, o: V(-.255, .47, .03) }, { n: 'pieI', p: 15, o: V(-.27, .09, 0) }\n    ];\n  }\n\n  function campoCuerpo(m){\n    const H = esqueleto(m), P = i => H[i].o;\n    const b = m, bz = .85 + .15*m;\n    // devuelve [distancia, regi\u00f3n] con regi\u00f3n 0 piel, 1 mawashi\n    return function(p){\n      // tronco\n      let d = ellip(p, V(0, .99, .07*bz), V(.42*b, .41, .41*bz));                       // barriga\n      d = smin(d, ellip(p, V(0, .84, -.01), V(.40*b, .27, .33*bz)), .08);              // bajo vientre y caderas\n      d = smin(d, ellip(p, V(0, 1.27, -.01), V(.41*b, .27, .31*bz)), .09);             // t\u00f3rax\n      d = smin(d, ellip(p, V(0, 1.30, -.09), V(.38*b, .25, .26)), .08);                // espalda\n      d = smin(d, ellip(p, V(0, 1.45, -.04), V(.30*b, .12, .18)), .07);                // trapecios\n      for (const s of [-1, 1]){\n        d = smin(d, ellip(p, V(.155*s, 1.27, .2*bz), V(.15, .135, .11)), .05);          // pectorales ca\u00eddos\n        d = smin(d, ellip(p, V(.155*s, .80, -.19), V(.19, .21, .19)), .06);             // nalgas\n        d = smin(d, ellip(p, V(.3*b*s, 1.0, .02), V(.15, .22, .25*bz)), .08);           // flancos\n      }\n      d = smin(d, cono(p, V(0, 1.42, -.01), V(0, 1.63, 0), .135, .12), .07);            // cuello\n      // piernas\n      let piernas = 1e9;\n      for (const s of [-1, 1]){\n        const k = s > 0 ? 11 : 14;\n        let l = cono(p, P(k), P(k + 1), .22*(.9 + .1*b), .13);\n        l = smin(l, ellip(p, [P(k)[0]*1.05, .64, .02], V(.17*(.9 + .1*b), .2, .19)), .05);  // cu\u00e1driceps\n        l = smin(l, cono(p, P(k + 1), P(k + 2), .12, .07), .04);\n        l = smin(l, ellip(p, [P(k + 1)[0], .32, -.045], V(.1, .13, .1)), .04);          // gemelo\n        const pie = Math.max(cono(p, [P(k + 2)[0], .055, -.05], [P(k + 2)[0]*1.06, .045, .16], .062, .052), -p[1]);\n        l = smin(l, pie, .035);\n        piernas = Math.min(piernas, l);\n      }\n      d = smin(d, piernas, .06);\n      // brazos\n      for (const s of [-1, 1]){\n        const k = s > 0 ? 5 : 8;\n        let a = ellip(p, [P(k)[0]*1.01, 1.405, 0], V(.145, .14, .15));                  // deltoides\n        a = smin(a, cono(p, P(k), P(k + 1), .125, .09), .04);\n        a = smin(a, cono(p, P(k + 1), P(k + 2), .085, .055), .03);\n        const pm = P(k + 2), dir = s;\n        let mano = ellip(p, [pm[0] + .03*dir, pm[1] - .075, pm[2] + .01], V(.036, .085, .058));\n        mano = smin(mano, cono(p, [pm[0] + .01*dir, pm[1] - .03, pm[2] + .04], [pm[0] + .02*dir, pm[1] - .085, pm[2] + .075], .018, .015), .015); // pulgar\n        a = smin(a, mano, .025);\n        d = smin(d, a, .05);\n      }\n      return [d, 0];\n    };\n  }\n\n\n  function campoMawashi(m){\n    const b = m, bz = .85 + .15*m;\n    return function(p){\n      const base = smin(ellip(p, V(0, .84, -.01), V(.40*b, .27, .33*bz)), ellip(p, V(0, .99, .07*bz), V(.42*b, .41, .41*bz)), .08);\n      const nalgas = Math.min(ellip(p, V(.155, .80, -.19), V(.19, .21, .19)), ellip(p, V(-.155, .80, -.19), V(.19, .21, .19)));\n      const flanco = Math.min(ellip(p, V(.3*b, 1.0, .02), V(.15, .22, .25*bz)), ellip(p, V(-.3*b, 1.0, .02), V(.15, .22, .25*bz)));\n      const cad = smin(smin(base, nalgas, .06), flanco, .08) - .024;\n      const yBanda = .865 - .085*clamp(p[2]/.4, -1, 1);   // m\u00e1s baja delante, bajo la barriga\n      const franja = Math.abs(p[1] - yBanda) - .088;\n      const delante = Math.max(Math.abs(p[0]) - .1 - .06*clamp((p[1] - .6)/.2, 0, 1), Math.max(p[1] - yBanda, .6 - p[1]), -p[2] + .05);\n      const detras = Math.max(Math.abs(p[0]) - .05, Math.max(p[1] - yBanda, .66 - p[1]), p[2] + .05);\n      let maw = smax(cad, Math.min(franja, delante, detras), .006);\n      // tira entre las piernas\n      maw = Math.min(maw, smax(cono(p, V(0, .655, -.16), V(0, .63, .19), .075, .075), Math.abs(p[0]) - .075, .005));\n      maw = smin(maw, ellip(p, V(0, .95, -.37*bz), V(.115, .08, .07)), .015);      // nudo trasero\n      return [maw, 1];\n    };\n  }\n\n  /* ---------------- cabezas ---------------- */\n  // tipo 0: rikishi con mo\u00f1o \u014dich\u014d; 1: gy\u014dji de Edo (mo\u00f1o peque\u00f1o); 2: gy\u014dji con eboshi\n  function campoCabeza(tipo, rasgo){\n    rasgo = rasgo || 0;\n    const cara = 1 + .06*rasgo;\n    return function(p){\n      let d = ellip(p, V(0, .135, -.012), V(.104, .118, .116));\n      d = smin(d, ellip(p, V(0, .065, .03), V(.098*cara, .108, .1)), .04);              // cara\n      const g = rasgo < 0 ? .55 : 1;\n      for (const s of [-1, 1]) d = smin(d, ellip(p, V(.058*s, .03, .05), V(.058*cara*g + .02*(1 - g), .058*g + .02*(1 - g), .056*g + .02*(1 - g))), .03); // mofletes\n      d = smin(d, ellip(p, V(0, -.012, .082), V(.046, .036, .04)), .02);               // barbilla\n      if (rasgo >= 0) d = smin(d, ellip(p, V(0, -.032, .04), V(.082*cara, .04, .072)), .03);            // papada\n      d = smin(d, cono(p, V(0, .1, .113), V(0, .064, .132), .011, .019), .012);         // nariz\n      for (const s of [-1, 1]) d = smin(d, ellip(p, V(.017*s, .064, .121), V(.014, .011, .012)), .008); // aletas\n      d = smin(d, ellip(p, V(0, .118, .098), V(.078, .019, .03)), .02);                 // arco de las cejas\n      for (const s of [-1, 1]) d = smax(d, -ellip(p, V(.037*s, .094, .124), V(.023, .011, .016)), .012); // cuencas\n      for (const s of [-1, 1]) d = smin(d, ellip(p, V(.037*s, .093, .111), V(.017, .008, .008)), .004); // p\u00e1rpados\n      d = smin(d, ellip(p, V(0, .031, .111), V(.029, .01, .014)), .008);                // labios\n      d = smax(d, -ellip(p, V(0, .031, .124), V(.024, .0025, .008)), .003);             // comisura\n      for (const s of [-1, 1]) d = smin(d, ellip(p, V(.104*s, .085, -.004), V(.016, .034, .024)), .01); // orejas\n      return [d, 0];\n    };\n  }\n\n\n  function campoPelo(tipo){\n    return function(p){\n      const craneo = smin(ellip(p, V(0, .135, -.012), V(.104, .118, .116)), ellip(p, V(0, .065, .03), V(.098, .108, .1)), .04) - .0045;\n      const ang = Math.abs(Math.atan2(p[0], p[2]));\n      const yPelo = .158 - .045*smoothstep(.5, 1.4, ang) - .085*smoothstep(1.9, 2.7, ang);\n      const oreja = Math.min(ellip(p, V(.104, .085, -.004), V(.028, .05, .036)), ellip(p, V(-.104, .085, -.004), V(.028, .05, .036)));\n      let d = smax(smax(craneo, yPelo - p[1], .004), -oreja, .004);\n      if (tipo === 0){\n        let k = ellip(p, V(0, .246, .02), V(.034, .016, .075));                          // hoja de ginkgo (\u014dich\u014d)\n        k = smin(k, cono(p, V(0, .222, -.05), V(0, .246, -.0), .024, .02), .015);\n        k = smin(k, ellip(p, V(0, .155, -.1), V(.074, .07, .05)), .03);                   // recogido de la nuca\n        d = smin(d, k, .02);\n      } else if (tipo === 3){\n        // pelo solo en los lados y la nuca; coronilla afeitada; mo\u00f1o fino doblado hacia delante\n        d = smax(d, -(ellip(p, V(0, .27, .03), V(.085, .1, .1))), .006);\n        d = smin(d, cono(p, V(0, .2, -.07), V(0, .25, .05), .012, .01), .01);\n      } else if (tipo === 1){\n        d = smin(d, cono(p, V(0, .232, -.03), V(0, .236, .07), .016, .014), .015);\n        d = smin(d, ellip(p, V(0, .2, -.08), V(.055, .04, .04)), .02);\n      } else {\n        d = Math.max(ellip(p, V(0, .27, -.03), V(.085, .13, .1)), .12 - p[1]);             // eboshi\n        d = smin(d, ellip(p, V(0, .36, -.07), V(.06, .05, .06)), .03);\n      }\n      return [d, tipo === 2 ? 5 : 2];\n    };\n  }\n\n  /* ---------------- rasgos pintados en la cara (en coordenadas de la cabeza) ---------------- */\n  function rasgos(p, tipo){\n    if (p[2] < .07) return -1;\n    const x = Math.abs(p[0]), y = p[1];\n    // cejas espesas en arco, como en Kunisada\n    const cy = .117 + .012*Math.cos((x - .038)/.03*1.2) - .004;\n    if (x > .012 && x < .07 && Math.abs(y - cy) < .0065 + .003*smoothstep(.06, .02, x)) return 3;\n    // ojos rasgados\n    const ey = .093 + .006*Math.cos((x - .037)/.02*1.5);\n    if (x > .02 && x < .056 && Math.abs(y - ey) < .0028 && p[2] > .11) return 3;\n    if (Math.hypot(x - .036, y - .092) < .0045 && p[2] > .115) return 3;\n    // labios\n    if (Math.abs(p[0]) < .026 && Math.abs(y - .031) < .0075 && p[2] > .105) return 4;\n    return -1;\n  }\n\n  /* ---------------- surface nets ---------------- */\n  function mallar(campo, min, max, paso, opciones){\n    opciones = opciones || {};\n    const nx = Math.ceil((max[0] - min[0])/paso) + 1, ny = Math.ceil((max[1] - min[1])/paso) + 1, nz = Math.ceil((max[2] - min[2])/paso) + 1;\n    const F = new Float32Array(nx*ny*nz);\n    const id = (i, j, k) => i + nx*(j + ny*k);\n    const p = [0, 0, 0];\n    // primero una rejilla gruesa: solo se afina cerca de la superficie\n    const C = 4, cx = Math.ceil((nx - 1)/C) + 1, cy = Math.ceil((ny - 1)/C) + 1, cz = Math.ceil((nz - 1)/C) + 1;\n    const G = new Float32Array(cx*cy*cz), gid = (i, j, k) => i + cx*(j + cy*k), margen = C*paso*1.6;\n    for (let k = 0; k < cz; k++) for (let j = 0; j < cy; j++) for (let i = 0; i < cx; i++){\n      p[0] = min[0] + i*C*paso; p[1] = min[1] + j*C*paso; p[2] = min[2] + k*C*paso; G[gid(i, j, k)] = campo(p)[0];\n    }\n    for (let k = 0; k < nz;   /* arcilla apisonada del dohyō, con huellas y arena barrida */
  function arcilla(){

  /* paja de arroz trenzada para los tawara */

  /* madera lacada en rojo de los pilares (como en el grabado de 1843) */
  function lacaRoja(){

  /* público pintado al modo del ukiyo-e: cabezas con moño, kimonos en filas */
  function publico(seed, w, h, filas){

    const kim = ['#2d4a6b','#1f3550','#5c3a2a','#3f5b44','#6b4b2e','#20262e','#7a2c24','#4d4a6a','#8a7140','#2f2f2f'];

        g.strokeStyle = 'rgba(10,8,6,.8)'; g.lineWidth = 1.2; g.stroke();
        g.strokeStyle = 'rgba(240,230,210,.55)'; g.lineWidth = 1.4; g.beginPath(); g.moveTo(x - sz*.18, yy + sz*.34); g.lineTo(x, yy + sz*.62); g.lineTo(x + sz*.18, yy + sz*.34); g.stroke();
        g.fillStyle = R() < .85 ? '#e6c9a4' : '#d8b48a'; g.beginPath(); g.ellipse(x, yy, sz*.3, sz*.36, 0, 0, 6.283); g.fill(); g.strokeStyle = 'rgba(30,20,12,.8)'; g.lineWidth = 1; g.stroke();

  /* cielo y pinos como al fondo del grabado */
  function fondo(){

/* Kyūdō · escenarios 3D. Metros, y hacia arriba.
   dōjō: el arquero en el origen, mirando a +z; la diana a 28 m en +x.
   galería: el corredor del Sanjūsangendō, 120 m a lo largo de +x (diapositiva 38).
   pista: el yabusame, un recorrido recto a lo largo de +z con tres dianas a la izquierda (+x). */
const ESC = (() => {
  let renderer, scene, camera, sol, hemi;
  const G = {};
  const DIANA = 28, GAL = { largo: 120, techo: 4.5, ancho: 1.25 }, PISTA = { largo: 230, dianas: [60, 110, 160], lado: 3.2, alto: 1.95 };
  function mat(o){ const m = new THREE.MeshStandardMaterial(Object.assign({ roughness: .85, metalness: 0 }, o)); m.color.convertSRGBToLinear(); if (m.emissive) m.emissive.convertSRGBToLinear(); return m; }
  function basic(o){ const m = new THREE.MeshBasicMaterial(o); if (o.color != null) m.color.convertSRGBToLinear(); return m; }
  function sombras(o, c, r){ o.traverse(m => { if (m.isMesh){ m.castShadow = c; m.receiveShadow = r; } }); return o; }

  function init(canvas){
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(/lowq/.test(location.search) ? .4 : Math.min(window.devicePixelRatio || 1, 2));
    renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;

    camera = new THREE.PerspectiveCamera(46, 16/9, .05, 400);

    sol = new THREE.DirectionalLight(0xfff0d8, 1.5); sol.castShadow = true;
    sol.shadow.mapSize.set(1024, 1024); sol.shadow.bias = -.0005; sol.shadow.normalBias = .02;
    scene.add(sol); scene.add(sol.target);

  function texDiana(){
    const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
    // kasumi-mato: anillos blancos y negros
    const R = [1, .86, .7, .55, .4, .24, .1]; const col = ['#101010', '#f4f1ea', '#101010', '#f4f1ea', '#101010', '#f4f1ea', '#101010'];

    g.strokeStyle = '#8a6a3a'; g.lineWidth = 6; g.beginPath(); g.arc(128, 128, 125, 0, 6.283); g.stroke();

  }
  function texShoji(){
    const c = document.createElement('canvas'); c.width = 256; c.height = 256; const g = c.getContext('2d');
    g.fillStyle = '#efe7d2'; g.fillRect(0, 0, 256, 256);
    g.strokeStyle = '#5a4030'; g.lineWidth = 6; g.strokeRect(3, 3, 250, 250);
    g.lineWidth = 3; for (let i = 1; i < 4; i++){ g.beginPath(); g.moveTo(i*64, 0); g.lineTo(i*64, 256); g.stroke(); } for (let j = 1; j < 6; j++){ g.beginPath(); g.moveTo(0, j*256/6); g.lineTo(256, j*256/6); g.stroke(); }
    const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
  }
  function texCasetones(){
    const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
    g.fillStyle = '#2f5a3a'; g.fillRect(0, 0, 256, 256);
    g.fillStyle = '#c9b48a'; g.fillRect(18, 18, 220, 220);
    g.fillStyle = '#3a6a4a'; g.beginPath(); g.arc(128, 128, 70, 0, 6.283); g.fill();
    g.fillStyle = '#d8c79c'; for (let i = 0; i < 8; i++){ const a = i*Math.PI/4; g.beginPath(); g.ellipse(128 + Math.cos(a)*44, 128 + Math.sin(a)*44, 16, 9, a, 0, 6.283); g.fill(); }
    g.fillStyle = '#b8322a'; g.beginPath(); g.arc(128, 128, 16, 0, 6.283); g.fill();
    const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
  }
  function texRayas(){
    const c = document.createElement('canvas'); c.width = 64; c.height = 256; const g = c.getContext('2d');

  /* ---------- dōjō ---------- */
  const ESC_D = DIANA;
  function texHierba(){ const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d'); x.fillStyle = '#5f7146'; x.fillRect(0, 0, 256, 256);
    for (let i = 0; i < 2600; i++){ x.fillStyle = Math.random() < .5 ? 'rgba(40,60,30,.35)' : 'rgba(140,160,90,.3)'; x.fillRect(Math.random()*256, Math.random()*256, 1 + Math.random()*2, 2 + Math.random()*4); }
    const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(40, 40); return t; }
  function dojo(){
    const g = new THREE.Group();
    const madera = mat({ map: TX.madera('#7a5a3c'), color: 0xd8c4a8 }), oscura = mat({ map: TX.madera('#3e2c1f') });

    campo.rotation.x = -Math.PI/2; campo.position.set(ESC_D - 1.5, .005, 0); g.add(campo);
    const hierba = new THREE.Mesh(new THREE.PlaneGeometry(140, 140), mat({ map: texHierba(), color: 0xffffff, roughness: 1 })); hierba.rotation.x = -Math.PI/2; hierba.position.set(16, 0, 0); g.add(hierba);
    const grava = new THREE.Mesh(new THREE.PlaneGeometry(4, 9), mat({ map: TX.arena(), color: 0xece6d8 })); grava.rotation.x = -Math.PI/2; grava.position.set(2.2, .006, 0); g.add(grava);
    // cerca de bambú a los lados del campo

    for (const z of [-6.5, 6.5]) for (const y of [.5, 1.2]){ const r = new THREE.Mesh(new THREE.CylinderGeometry(.025, .025, ESC_D + 1, 6), bambu); r.rotation.z = Math.PI/2; r.position.set(ESC_D/2 + 1.5, y, z); g.add(r); }

    for (let i = 0; i < 4; i++){ const p = new THREE.Mesh(new THREE.BoxGeometry(.18, 3.4, .18), oscura); p.position.set(-4.3 + i*2.6, 1.85, i % 2 ? 3.4 : -3.4); g.add(p); }
    for (const z of [-3.4, 3.4]) for (const x of [1.4, -4.3]){ const p = new THREE.Mesh(new THREE.BoxGeometry(.18, 3.4, .18), oscura); p.position.set(x, 1.85, z); g.add(p); }
    const techo = new THREE.Mesh(new THREE.BoxGeometry(7.4, .16, 8.2), oscura); techo.position.set(-1.5, 3.6, 0); techo.rotation.z = -.12; g.add(techo);
    const pared = new THREE.Mesh(new THREE.PlaneGeometry(7, 3.3), mat({ map: texShoji(), roughness: .9 })); pared.material.map.repeat.set(4, 1); pared.position.set(-4.4, 1.95, 0); pared.rotation.y = Math.PI/2; g.add(pared);
    // azuchi: talud de arena con tejadillo y las dianas

    const perfil = new THREE.Shape([new THREE.Vector2(.14, 0), new THREE.Vector2(1.05, 2.45), new THREE.Vector2(2.3, 2.45), new THREE.Vector2(3.3, 0)]);
    const tGeo = new THREE.ExtrudeGeometry(perfil, { depth: 9, bevelEnabled: false }); tGeo.translate(0, 0, -4.5);
    const talud = new THREE.Mesh(tGeo, mat({ map: TX.arena(), color: 0xc8b489 })); talud.position.set(DIANA, 0, 0); g.add(talud);
    const tej = new THREE.Mesh(new THREE.BoxGeometry(3, .14, 9), oscura); tej.position.set(DIANA + .6, 3.0, 0); tej.rotation.z = .25; g.add(tej);
    for (const z of [-4.2, 4.2]){ const p = new THREE.Mesh(new THREE.BoxGeometry(.14, 3, .14), oscura); p.position.set(DIANA - .6, 1.5, z); g.add(p); }

  function arbol(k){

  /* ---------- galería del Sanjūsangendō ---------- */
  function galeria(){
    const g = new THREE.Group(), L = GAL.largo, W = GAL.ancho;
    const tabla = TX.madera('#9c8058'); tabla.repeat.set(60, 2);

    suelo.rotation.x = -Math.PI/2; suelo.position.set(L/2, 0, 0); g.add(suelo);

    const verde = mat({ color: 0x2f6a44, roughness: .7 });

/* Sumo · escultura de los cuerpos. Cada figura se esculpe como un campo de distancias con uniones suaves
   (carne que se funde en la barriga, la papada y los muslos) y se convierte en malla con «surface nets».
   Se genera al cargar, sin descargar modelos, y se ata a un esqueleto de 17 huesos para animarla. */
(function(root){
  const V = (x, y, z) => [x, y, z];
  const sub = (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
  const dot = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
  const len = a => Math.sqrt(dot(a, a));
  const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
  const smoothstep = (a, b, x) => { const t = clamp((x - a)/(b - a), 0, 1); return t*t*(3 - 2*t); };

  // primitivas
  function ellip(p, c, r){ // aproximación de distancia a un elipsoide
    const x = (p[0]-c[0])/r[0], y = (p[1]-c[1])/r[1], z = (p[2]-c[2])/r[2];
    const k0 = Math.sqrt(x*x + y*y + z*z);
    const x1 = x/r[0], y1 = y/r[1], z1 = z/r[2];
    const k1 = Math.sqrt(x1*x1 + y1*y1 + z1*z1);
    return k1 > 1e-6 ? k0*(k0 - 1)/k1 : -Math.min(r[0], r[1], r[2]);
  }
  function cono(p, a, b, ra, rb){ // cápsula de radio variable (aproximación)
    const pa = sub(p, a), ba = sub(b, a);
    const h = clamp(dot(pa, ba)/dot(ba, ba), 0, 1);
    const d = [pa[0] - ba[0]*h, pa[1] - ba[1]*h, pa[2] - ba[2]*h];
    return len(d) - (ra + (rb - ra)*h);
  }
  function caja(p, c, h, r){ const qx = Math.abs(p[0]-c[0]) - h[0] + r, qy = Math.abs(p[1]-c[1]) - h[1] + r, qz = Math.abs(p[2]-c[2]) - h[2] + r;
    return Math.hypot(Math.max(qx, 0), Math.max(qy, 0), Math.max(qz, 0)) + Math.min(Math.max(qx, qy, qz), 0) - r; }
  function smin(a, b, k){ const h = clamp(.5 + .5*(b - a)/k, 0, 1); return b + (a - b)*h - k*h*(1 - h); }
  function smax(a, b, k){ return -smin(-a, -b, k); }

  /* ---------------- el cuerpo de un rikishi (sin cabeza) ---------------- */
  // m: corpulencia (1 normal, 1.2 pesado, .85 joven del sumo antiguo)
  function esqueleto(m){
    const sh = .40 + .03*(m - 1);
    return [
      { n: 'raiz',     p: -1, o: V(0, 0, 0) },
      { n: 'pelvis',   p: 0,  o: V(0, .86, 0) },
      { n: 'lumbar',   p: 1,  o: V(0, 1.04, 0) },
      { n: 'pecho',    p: 2,  o: V(0, 1.28, 0) },
      { n: 'cuello',   p: 3,  o: V(0, 1.52, 0) },
      { n: 'brazoD',   p: 3,  o: V(sh, 1.41, -.02) },  { n: 'codoD', p: 5,  o: V(sh + .21, 1.13, -.02) }, { n: 'manoD', p: 6,  o: V(sh + .37, .88, .0) },
      { n: 'brazoI',   p: 3,  o: V(-sh, 1.41, -.02) }, { n: 'codoI', p: 8,  o: V(-sh - .21, 1.13, -.02) }, { n: 'manoI', p: 9,  o: V(-sh - .37, .88, .0) },
      { n: 'musloD',   p: 1,  o: V(.2, .84, 0) },  { n: 'rodillaD', p: 11, o: V(.255, .47, .03) }, { n: 'pieD', p: 12, o: V(.27, .09, 0) },
      { n: 'musloI',   p: 1,  o: V(-.2, .84, 0) }, { n: 'rodillaI', p: 14, o: V(-.255, .47, .03) }, { n: 'pieI', p: 15, o: V(-.27, .09, 0) }
    ];
  }

  function campoCuerpo(m){
    const H = esqueleto(m), P = i => H[i].o;
    const b = m, bz = .85 + .15*m;
    // devuelve [distancia, región] con región 0 piel, 1 mawashi
    return function(p){
      // tronco
      let d = ellip(p, V(0, .99, .07*bz), V(.42*b, .41, .41*bz));                       // barriga
      d = smin(d, ellip(p, V(0, .84, -.01), V(.40*b, .27, .33*bz)), .08);              // bajo vientre y caderas
      d = smin(d, ellip(p, V(0, 1.27, -.01), V(.41*b, .27, .31*bz)), .09);             // tórax
      d = smin(d, ellip(p, V(0, 1.30, -.09), V(.38*b, .25, .26)), .08);                // espalda
      d = smin(d, ellip(p, V(0, 1.45, -.04), V(.30*b, .12, .18)), .07);                // trapecios
      for (const s of [-1, 1]){
        d = smin(d, ellip(p, V(.155*s, 1.27, .2*bz), V(.15, .135, .11)), .05);          // pectorales caídos
        d = smin(d, ellip(p, V(.155*s, .80, -.19), V(.19, .21, .19)), .06);             // nalgas
        d = smin(d, ellip(p, V(.3*b*s, 1.0, .02), V(.15, .22, .25*bz)), .08);           // flancos
      }
      d = smin(d, cono(p, V(0, 1.42, -.01), V(0, 1.63, 0), .135, .12), .07);            // cuello
      // piernas
      let piernas = 1e9;
      for (const s of [-1, 1]){
        const k = s > 0 ? 11 : 14;
        let l = cono(p, P(k), P(k + 1), .22*(.9 + .1*b), .13);
        l = smin(l, ellip(p, [P(k)[0]*1.05, .64, .02], V(.17*(.9 + .1*b), .2, .19)), .05);  // cuádriceps
        l = smin(l, cono(p, P(k + 1), P(k + 2), .12, .07), .04);
        l = smin(l, ellip(p, [P(k + 1)[0], .32, -.045], V(.1, .13, .1)), .04);          // gemelo
        const pie = Math.max(cono(p, [P(k + 2)[0], .055, -.05], [P(k + 2)[0]*1.06, .045, .16], .062, .052), -p[1]);
        l = smin(l, pie, .035);
        piernas = Math.min(piernas, l);
      }
      d = smin(d, piernas, .06);
      // brazos
      for (const s of [-1, 1]){
        const k = s > 0 ? 5 : 8;
        let a = ellip(p, [P(k)[0]*1.01, 1.405, 0], V(.145, .14, .15));                  // deltoides
        a = smin(a, cono(p, P(k), P(k + 1), .125, .09), .04);
        a = smin(a, cono(p, P(k + 1), P(k + 2), .085, .055), .03);
        const pm = P(k + 2), dir = s;
        let mano = ellip(p, [pm[0] + .03*dir, pm[1] - .075, pm[2] + .01], V(.036, .085, .058));
        mano = smin(mano, cono(p, [pm[0] + .01*dir, pm[1] - .03, pm[2] + .04], [pm[0] + .02*dir, pm[1] - .085, pm[2] + .075], .018, .015), .015); // pulgar
        a = smin(a, mano, .025);
        d = smin(d, a, .05);
      }
      return [d, 0];
    };
  }


  function campoMawashi(m){
    const b = m, bz = .85 + .15*m;
    return function(p){
      const base = smin(ellip(p, V(0, .84, -.01), V(.40*b, .27, .33*bz)), ellip(p, V(0, .99, .07*bz), V(.42*b, .41, .41*bz)), .08);
      const nalgas = Math.min(ellip(p, V(.155, .80, -.19), V(.19, .21, .19)), ellip(p, V(-.155, .80, -.19), V(.19, .21, .19)));
      const flanco = Math.min(ellip(p, V(.3*b, 1.0, .02), V(.15, .22, .25*bz)), ellip(p, V(-.3*b, 1.0, .02), V(.15, .22, .25*bz)));
      const cad = smin(smin(base, nalgas, .06), flanco, .08) - .024;
      const yBanda = .865 - .085*clamp(p[2]/.4, -1, 1);   // más baja delante, bajo la barriga
      const franja = Math.abs(p[1] - yBanda) - .088;
      const delante = Math.max(Math.abs(p[0]) - .1 - .06*clamp((p[1] - .6)/.2, 0, 1), Math.max(p[1] - yBanda, .6 - p[1]), -p[2] + .05);
      const detras = Math.max(Math.abs(p[0]) - .05, Math.max(p[1] - yBanda, .66 - p[1]), p[2] + .05);
      let maw = smax(cad, Math.min(franja, delante, detras), .006);
      // tira entre las piernas
      maw = Math.min(maw, smax(cono(p, V(0, .655, -.16), V(0, .63, .19), .075, .075), Math.abs(p[0]) - .075, .005));
      maw = smin(maw, ellip(p, V(0, .95, -.37*bz), V(.115, .08, .07)), .015);      // nudo trasero
      return [maw, 1];
    };
  }

  /* ---------------- cabezas ---------------- */
  // tipo 0: rikishi con moño ōichō; 1: gyōji de Edo (moño pequeño); 2: gyōji con eboshi
  function campoCabeza(tipo, rasgo){
    rasgo = rasgo || 0;
    const cara = 1 + .06*rasgo;
    return function(p){
      let d = ellip(p, V(0, .135, -.012), V(.104, .118, .116));
      d = smin(d, ellip(p, V(0, .065, .03), V(.098*cara, .108, .1)), .04);              // cara
      const g = rasgo < 0 ? .55 : 1;
      for (const s of [-1, 1]) d = smin(d, ellip(p, V(.058*s, .03, .05), V(.058*cara*g + .02*(1 - g), .058*g + .02*(1 - g), .056*g + .02*(1 - g))), .03); // mofletes
      d = smin(d, ellip(p, V(0, -.012, .082), V(.046, .036, .04)), .02);               // barbilla
      if (rasgo >= 0) d = smin(d, ellip(p, V(0, -.032, .04), V(.082*cara, .04, .072)), .03);            // papada
      d = smin(d, cono(p, V(0, .1, .113), V(0, .064, .132), .011, .019), .012);         // nariz
      for (const s of [-1, 1]) d = smin(d, ellip(p, V(.017*s, .064, .121), V(.014, .011, .012)), .008); // aletas
      d = smin(d, ellip(p, V(0, .118, .098), V(.078, .019, .03)), .02);                 // arco de las cejas
      for (const s of [-1, 1]) d = smax(d, -ellip(p, V(.037*s, .094, .124), V(.023, .011, .016)), .012); // cuencas
      for (const s of [-1, 1]) d = smin(d, ellip(p, V(.037*s, .093, .111), V(.017, .008, .008)), .004); // párpados
      d = smin(d, ellip(p, V(0, .031, .111), V(.029, .01, .014)), .008);                // labios
      d = smax(d, -ellip(p, V(0, .031, .124), V(.024, .0025, .008)), .003);             // comisura
      for (const s of [-1, 1]) d = smin(d, ellip(p, V(.104*s, .085, -.004), V(.016, .034, .024)), .01); // orejas
      return [d, 0];
    };
  }


  function campoPelo(tipo){
    return function(p){
      const craneo = smin(ellip(p, V(0, .135, -.012), V(.104, .118, .116)), ellip(p, V(0, .065, .03), V(.098, .108, .1)), .04) - .0045;
      const ang = Math.abs(Math.atan2(p[0], p[2]));
      const yPelo = .158 - .045*smoothstep(.5, 1.4, ang) - .085*smoothstep(1.9, 2.7, ang);
      const oreja = Math.min(ellip(p, V(.104, .085, -.004), V(.028, .05, .036)), ellip(p, V(-.104, .085, -.004), V(.028, .05, .036)));
      let d = smax(smax(craneo, yPelo - p[1], .004), -oreja, .004);
      if (tipo === 0){
        let k = ellip(p, V(0, .246, .02), V(.034, .016, .075));                          // hoja de ginkgo (ōichō)
        k = smin(k, cono(p, V(0, .222, -.05), V(0, .246, -.0), .024, .02), .015);
        k = smin(k, ellip(p, V(0, .155, -.1), V(.074, .07, .05)), .03);                   // recogido de la nuca
        d = smin(d, k, .02);
      } else if (tipo === 3){
        // pelo solo en los lados y la nuca; coronilla afeitada; moño fino doblado hacia delante
        d = smax(d, -(ellip(p, V(0, .27, .03), V(.085, .1, .1))), .006);
        d = smin(d, cono(p, V(0, .2, -.07), V(0, .25, .05), .012, .01), .01);
      } else if (tipo === 1){
        d = smin(d, cono(p, V(0, .232, -.03), V(0, .236, .07), .016, .014), .015);
        d = smin(d, ellip(p, V(0, .2, -.08), V(.055, .04, .04)), .02);
      } else {
        d = Math.max(ellip(p, V(0, .27, -.03), V(.085, .13, .1)), .12 - p[1]);             // eboshi
        d = smin(d, ellip(p, V(0, .36, -.07), V(.06, .05, .06)), .03);
      }
      return [d, tipo === 2 ? 5 : 2];
    };
  }

  /* ---------------- rasgos pintados en la cara (en coordenadas de la cabeza) ---------------- */
  function rasgos(p, tipo){
    if (p[2] < .07) return -1;
    const x = Math.abs(p[0]), y = p[1];
    // cejas espesas en arco, como en Kunisada
    const cy = .117 + .012*Math.cos((x - .038)/.03*1.2) - .004;
    if (x > .012 && x < .07 && Math.abs(y - cy) < .0065 + .003*smoothstep(.06, .02, x)) return 3;
    // ojos rasgados
    const ey = .093 + .006*Math.cos((x - .037)/.02*1.5);
    if (x > .02 && x < .056 && Math.abs(y - ey) < .0028 && p[2] > .11) return 3;
    if (Math.hypot(x - .036, y - .092) < .0045 && p[2] > .115) return 3;
    // labios
    if (Math.abs(p[0]) < .026 && Math.abs(y - .031) < .0075 && p[2] > .105) return 4;

  const tmpV = new THREE.Vector3(), gripP = new THREE.Vector3(), nockP = new THREE.Vector3();

  /* ---------------- entrada táctil: toque, deslizar, mantener ---------------- */
  const ENT = { abajo: false, x0: 0, y0: 0, x: 0, y: 0, t0: 0, cola: [] };
  function enlazar(){
    const z = $('zona');
    z.addEventListener('pointerdown', e => { e.preventDefault(); SND.init(); z.setPointerCapture(e.pointerId); ENT.abajo = true; ENT.x0 = ENT.x = e.clientX; ENT.y0 = ENT.y = e.clientY; ENT.t0 = performance.now(); ENT.cola.push({ tipo: 'abajo' }); });
    z.addEventListener('pointermove', e => { if (!ENT.abajo) return; const dx = e.clientX - ENT.x, dy = e.clientY - ENT.y; ENT.x = e.clientX; ENT.y = e.clientY; ENT.cola.push({ tipo: 'mover', dx, dy }); });
    const up = e => { if (!ENT.abajo) return; ENT.abajo = false; ENT.cola.push({ tipo: 'arriba', dt: performance.now() - ENT.t0, dx: ENT.x - ENT.x0, dy: ENT.y - ENT.y0 }); };
    z.addEventListener('pointerup', up); z.addEventListener('pointercancel', up);
    const K = {};
    addEventListener('keydown', e => {
      if (e.code === 'Space' && !e.repeat && MODO === 'tiro'){ e.preventDefault(); ENT.abajo = true; ENT.t0 = performance.now(); ENT.x0 = ENT.x = 0; ENT.y0 = ENT.y = 0; ENT.cola.push({ tipo: 'abajo' }); }
      if (e.code === 'ArrowUp' && MODO === 'tiro' && TIRO.fase === 'alzar'){ ENT.cola.push({ tipo: 'arriba', dt: 100, dx: 0, dy: -80 }); }
      K[e.code] = true;
      if (e.code === 'Escape' || e.code === 'KeyP'){ if (pausado){ cerrarPanel(); pausado = false; SND.despertar(); } else pausa(); }
    });
    addEventListener('keyup', e => { K[e.code] = false; if (e.code === 'Space' && ENT.abajo && MODO === 'tiro'){ ENT.abajo = false; ENT.cola.push({ tipo: 'arriba', dt: performance.now() - ENT.t0, dx: 0, dy: 0 }); } });
    ticker(dt => { if (MODO !== 'tiro') return; const s = 160*dt; if (K.ArrowLeft) ENT.cola.push({ tipo: 'mover', dx: -s, dy: 0 }); if (K.ArrowRight) ENT.cola.push({ tipo: 'mover', dx: s, dy: 0 }); if (K.ArrowUp && TIRO.fase === 'tensar') ENT.cola.push({ tipo: 'mover', dx: 0, dy: -s }); if (K.ArrowDown) ENT.cola.push({ tipo: 'mover', dx: 0, dy: s }); });
    $('pausaBtn').addEventListener('click', e => { e.stopPropagation(); pausa(); });
    $('sonidoBtn').addEventListener('click', e => { e.stopPropagation(); SND.init(); $('sonidoBtn').textContent = SND.alternar() ? '✕♪' : '♪'; });
    $('sonidoBtn').textContent = SND.mudo ? '✕♪' : '♪';
    $('idiomaBtn').addEventListener('click', e => { e.stopPropagation(); LANG = es() ? 'en' : 'es'; try { localStorage.setItem('kyudo.lang', LANG); } catch (er) {} traducirDOM(); if (MODO === 'portada') portada(); });
    addEventListener('resize', tamano); addEventListener('orientationchange', () => setTimeout(tamano, 250));
    document.addEventListener('visibilitychange', () => { if (document.hidden){ SND.dormir(); if (MODO === 'tiro' && !pausado) pausa(); } else if (!pausado) SND.despertar(); });
    window.HAPP_PAUSA = () => { if (MODO === 'tiro' && !pausado) pausa(); };
    window.HAPP_GUARDAR = () => guardar();
  }

  function cero(modo, altura, eje, valor, origen){
    const guard = { t: TIRO.tiro, m: TIRO.modo, p: TIRO.pitch, y: TIRO.yaw };
    TIRO.tiro = 1; TIRO.modo = modo; TIRO.yaw = 0;
    let lo = -.2, hi = .3;
    for (let i = 0; i < 26; i++){
      const mid = (lo + hi)/2; TIRO.pitch = mid;
      const b = TIRO.base.clone(), lado = new THREE.Vector3().crossVectors(b, new THREE.Vector3(0, 1, 0)).normalize(); b.applyAxisAngle(lado, mid);
      const v = b.multiplyScalar(velocidad()); if (modo === 'yabusame') v.z += 10;
      const r = ARCO.prever(origen, v, eje, valor, 6);
      if (!r || r.p.y < altura) lo = mid; else hi = mid;
    }
    const res = (lo + hi)/2; TIRO.tiro = guard.t; TIRO.modo = guard.m; TIRO.yaw = guard.y; TIRO.pitch = guard.p; return res;
  }
  /* un tiro completo: devuelve una promesa con la flecha disparada (o null si se rompe el orden) */
  function tiro(cfg){
    return new Promise(res => {
      ENT.cola.length = 0;
      Object.assign(TIRO, { activo: true, fase: cfg.ritual ? 'pies' : 'tensar', tiro: 0, sujeta: false, yaw: cfg.yaw0 || 0, pitch: cfg.pitch0 || 0, holdT: 0, sonoT: false, modo: cfg.modo });
      MIRA.plano = cfg.plano;
      if (!TIRO.flecha){ TIRO.flecha = ARCO.crearFlecha(); escena.add(TIRO.flecha); }
      MODO = 'tiro';
      const ordenRoto = txt => { aviso(t('orden'), txt, 1100); SND.fallo(); };
      const fase = f => { TIRO.fase = f; if (cfg.ritual) pasos(f); guia(f === 'pies' ? t('gPies') : f === 'alzar' ? t('gAlzar') : cfg.ritual ? t('gTensar') : (cfg.guia || t('gTension'))); if (cfg.alFase) cfg.alFase(f); };
      fase(TIRO.fase);
      const stop = ticker(dt => {
        if (pausado) return;
        if (cfg.cancelar && cfg.cancelar()){ stop(); TIRO.activo = false; TIRO.sujeta = false; guia(''); res(null); return; }
        while (ENT.cola.length){
          const e = ENT.cola.shift();
          if (TIRO.fase === 'pies'){
            if (e.tipo === 'arriba'){ if (Math.abs(e.dy) < 30){ poseA('pies', 6); SND.madera(); fase('alzar'); } else if (e.dy < -40) ordenRoto(t('ordenPies')); }
          } else if (TIRO.fase === 'alzar'){
            if (e.tipo === 'arriba'){ if (e.dy < -35){ poseA('alzar', 4); SND.tensar(); fase('tensar'); } else if (e.dt > 450) ordenRoto(t('ordenAlzar')); }
          } else if (TIRO.fase === 'tensar'){
            if (e.tipo === 'abajo' && !TIRO.sujeta){ TIRO.sujeta = true; TIRO.holdT = 0; TIRO.tiro = 0; if (cfg.alTensar) cfg.alTensar(); }
            else if (e.tipo === 'mover' && TIRO.sujeta){ const k = cfg.sens || .00045; TIRO.yaw -= e.dx*k; TIRO.pitch -= e.dy*k; TIRO.yaw = Math.max(-cfg.yawMax, Math.min(cfg.yawMax, TIRO.yaw)); TIRO.pitch = Math.max(-.3, Math.min(.45, TIRO.pitch)); }
            else if (e.tipo === 'arriba' && TIRO.sujeta){ soltar(); return; }
          }
        }
        if (TIRO.sujeta && TIRO.fase === 'tensar'){
          poseA(Object.assign({}, FIG.mezcla(FIG.PA[cfg.poseAlzar || 'alzar'], FIG.PA[cfg.poseTensar || 'tensar'], Math.min(1, TIRO.tiro*1.4))), 14);
          if (cfg.alTension) cfg.alTension(TIRO.tiro);
        }
      });
      function soltar(){
        stop();
        const v = velocidad(), dir = direccion(), pos = nockP.clone().lerp(gripP, .5);
        const vel = dir.multiplyScalar(v); if (cfg.modo === 'yabusame') vel.z += 10;
        TIRO.sujeta = false; TIRO.fase = 'soltar'; if (cfg.ritual) pasos('soltar'); guia('');
        poseA(cfg.poseSoltar || 'soltar', 18); SND.cuerda(.85 + .3*TIRO.tiro); setTimeout(() => SND.silbido(), 40);
        cam.temblor = .6;
        P.flechas++; guardar();
        const h = ARCO.disparar(escena, pos, vel, cfg.choque);
        h.tiro = TIRO.tiro;
        TIRO.activo = false; MODO = 'vuelo';
        res(h);
      }
    });
  }

  /* ---------------- I. dōjō ---------------- */
  async function jugarDojo(tk){
    document.body.classList.add('juego');
    let aciertos = 0, centros = 0, n = 0; TIRO.calma = 0;
    const diana = new THREE.Vector3(ESC.DIANA, .32, 0);
    for (let tanda = 1; tanda <= 3; tanda++){
      if (tk !== token) return;
      hud(`<b>${t('tanda', { n: tanda })}</b><span>${t('aciertos')}: ${aciertos}/${n}</span>`);
      camaraA(new THREE.Vector3(-3.4, 2.0, -2.7), new THREE.Vector3(6, .9, 0), 46, 2);
      const ok = await preguntar(sacarPregunta('dojo'), `${t('tanda', { n: tanda })} · ${t('pregunta')}`); if (tk !== token) return;
      if (ok){ TIRO.calma = Math.min(3, TIRO.calma + 1); aviso(t('calma') + ' +1', '', 900); }
      for (let k = 1; k <= 4; k++){
        if (tk !== token) return;
        hud(`<b>${t('tanda', { n: tanda })} · ${t('flecha', { n: k })}</b><span>${t('aciertos')}: ${aciertos}/${n}</span><span>${t('calma')}: ${'◆'.repeat(TIRO.calma)}${'◇'.repeat(3 - TIRO.calma)}</span>`);
        poseA('erguido', 5);
        camaraA(new THREE.Vector3(-3.2, 1.95, -2.6), new THREE.Vector3(8, .9, 0), 46, 2.5);
        const vista = ticker(() => { if (TIRO.fase === 'tensar' && TIRO.sujeta){ const z = TIRO.tiro; cam.pObj.set(-3.2 + 3.0*z, 1.95 - .35*z, -2.6 + 2.4*z); cam.mObj.copy(diana).add(new THREE.Vector3(0, .1*(1 - z), 0)); cam.fovObj = 46 - 39*z; cam.vel = 4; } });
        let resultado = null;
        const pc = cero('dojo', diana.y, 'x', ESC.DIANA, new THREE.Vector3(0, 1.41, .02)) + (Math.random() - .5)*.05;
        const h = await tiro({ ritual: true, modo: 'dojo', yawMax: .12, plano: ['x', ESC.DIANA], sens: .00025, pitch0: pc, yaw0: (Math.random() - .5)*.06,
          choque: (h, a, b) => {
            if (b.x >= ESC.DIANA){
              const tt = (ESC.DIANA - a.x)/(b.x - a.x), y = a.y + (b.y - a.y)*tt, z = a.z + (b.z - a.z)*tt;
              const zd = [-2.2, 0, 2.2].reduce((m, q) => Math.abs(z - q) < Math.abs(z - m) ? q : m, 0);
              const r = Math.hypot(y - diana.y, z - zd);
              h.f.position.set(ESC.DIANA - .02, y, z);
              resultado = r < .18 ? (r < .045 ? 'centro' : 'acierto') : 'fallo'; return resultado;
            }
            if (b.y <= .01){ h.f.position.y = .01; resultado = 'suelo'; return 'suelo'; }
            return null;
          } });
        vista();
        if (tk !== token) return;
        // la cámara sigue a la flecha y mira la diana
        camaraA(new THREE.Vector3(ESC.DIANA - 3.2, 1.0, -1.4), diana.clone(), 34, 2.2);
        await esperarVuelo(h, 2600);
        if (tk !== token) return;
        n++;
        if (resultado === 'centro' || resultado === 'acierto'){ aciertos++; if (resultado === 'centro') centros++; SND.clavar(); aviso(resultado === 'centro' ? t('centro') : t('acierto'), '', 1100); setTimeout(() => SND.ovacion && SND.ovacion(.25), 150); }
        else { SND.arena(); aviso(h.tiro < .6 ? t('debil') : t('fallo'), '', 1000); }
        await espera(1300); if (tk !== token) return;
        ARCO.limpiar();
      }
    }
    fin('dojo', aciertos, aciertos >= 6, [`${t('aciertos')}: ${aciertos} / 12`, `${es() ? 'Al centro' : 'Dead centre'}: ${centros}`]);
  }
  function esperarVuelo(h, max){ return new Promise(r => { let tt = 0; const st = ticker(dt => { tt += dt*1000; if (!h.vivo || tt > max){ st(); r(); } }); }); }

  /* ---------------- II. tōshiya ---------------- */
  async function jugarToshiya(tk){
    document.body.classList.add('juego');
    TIRO.fuerza = 1; TIRO.calma = 0;
    let aciertos = 0, tiros = 0, restante = 90, periodo = 0;
    const G = ESC.GAL;
    const reloj = ticker(dt => { if (MODO === 'tiro' || MODO === 'vuelo'){ restante = Math.max(0, restante - dt); } });
    const marcador = () => hud(`<b>${t('tiempo')}: ${Math.ceil(restante)} s</b><span>${t('aciertos')}: ${aciertos}</span><span>${t('fuerza')}: <i class="barra-f"><i style="width:${Math.round(TIRO.fuerza*100)}%"></i></i></span>`);
    const mt = ticker(marcador);
    camaraA(new THREE.Vector3(-2.3, 1.75, .75), new THREE.Vector3(60, 1.9, 0), 46, 2, true);
    while (restante > 0){
      if (tk !== token){ reloj(); mt(); return; }
      const p = Math.floor((90 - restante)/30);
      if (p > periodo && restante > 1){
        periodo = p;
        MODO = 'pregunta';
        const ok = await preguntar(sacarPregunta('toshiya'), `${t('descanso')} · ${t('pregunta')}`); if (tk !== token){ reloj(); mt(); return; }
        if (ok){ TIRO.fuerza = Math.min(1, TIRO.fuerza + .3); aviso(t('fuerza') + ' +', '', 900); }
      }
      poseA('sentadoS', 6);
      camaraA(new THREE.Vector3(-2.3, 1.75, .75), new THREE.Vector3(60, 1.9, 0), 46, 3);
      const vista = ticker(() => { if (TIRO.fase === 'tensar' && TIRO.sujeta){ const z = TIRO.tiro; cam.pObj.set(-2.3 + 1.1*z, 1.75 - .35*z, .75 - 1.35*z); cam.mObj.set(60, 1.9 + 1.0*z, 0); cam.fovObj = 46 - 10*z; cam.vel = 5; } });
      let res = null;
      const pt = cero('toshiya', .9, 'x', G.largo, new THREE.Vector3(0, .98, .02));
      const h = await tiro({ ritual: false, modo: 'toshiya', yawMax: .02, plano: ['x', G.largo], sens: .00022, pitch0: pt + (Math.random() - .5)*.03, poseAlzar: 'sentadoS', guia: t('gToshiya'), poseTensar: 'sentado', poseSoltar: 'sentadoS',
        choque: (h, a, b) => {
          if (b.y >= G.techo - .04){ h.f.position.y = G.techo - .05; res = 'techo'; return res; }
          if (Math.abs(b.z) > G.ancho - .05){ res = 'pilar'; return res; }
          if (b.y <= .02){ h.f.position.y = .02; res = 'corta'; return res; }
          if (b.x >= G.largo){ res = 'pasa'; return res; }
          return null;
        } });
      vista(); if (tk !== token){ reloj(); mt(); return; }
      if (restante <= 0){ aviso(t('tiempo'), es() ? 'Se acabó el tiempo' : 'Time is up', 900); break; }
      tiros++; TIRO.fuerza = Math.max(.35, TIRO.fuerza - .025);
      if (tiros <= 2){ const sig = ticker(() => { if (h.vivo){ const p2 = h.f.position; cam.pObj.set(p2.x - 4, p2.y + .4, p2.z + .8); cam.mObj.set(p2.x + 10, p2.y, 0); cam.vel = 8; } else sig(); }); }
      await esperarVuelo(h, 2600); if (tk !== token){ reloj(); mt(); return; }
      if (res === 'pasa'){ aciertos++; SND.tambor(); levantarBandera(); aviso(t('pasa'), '', 900); }
      else { if (res === 'techo' || res === 'pilar') SND.madera(); else SND.arena(); aviso(t(res || 'corta'), '', 900); }
      await espera(tiros <= 2 ? 900 : 350);
      if (ARCO.VUELO.length > 6) ARCO.limpiar();
    }
    reloj(); mt(); ARCO.limpiar();
    const porMin = aciertos/1.5, dia = Math.round(porMin*60*24);
    fin('toshiya', aciertos, aciertos >= 8, [`${t('aciertos')}: ${aciertos} (${porMin.toFixed(1)} / min)`, `${t('ritmo')}: ${dia.toLocaleString(es() ? 'es-ES' : 'en-GB')} · ${t('record')}`]);
  }
  function levantarBandera(){
    const bs = ESC.G.banderas; SND.bandera();
    bs.forEach(j => { j.userData.alza = 1; });
    let tt = 0; const st = ticker(dt => { tt += dt; bs.forEach(j => { const a = Math.max(0, 1 - Math.abs(tt - .6)/.6); j.userData.flag.position.y = 1.3 + .5*a; j.userData.palo.position.y = .9 + .5*a; }); if (tt > 1.3) st(); });
  }

  /* ---------------- III. yabusame ---------------- */
  async function jugarYabusame(tk){
    document.body.classList.add('juego');
    TIRO.calma = 0; let aciertos = 0;
    const PI = ESC.PISTA;
    for (let pasada = 1; pasada <= 3; pasada++){
      if (tk !== token) return;
      rig.position.set(0, 0, -6); rig.rotation.y = 0;
      const ojo = () => new THREE.Vector3(rig.position.x, 2.35 + bob, rig.position.z);
      let bob = 0, giro = 0;
      camaraA(ojo().add(new THREE.Vector3(0, 0, -.2)), ojo().add(new THREE.Vector3(0, -.2, 10)), 58, 6, true);
      hud(`<b>${t('pasada', { n: pasada })}</b><span>${t('aciertos')}: ${aciertos}/${(pasada - 1)*3}</span>`);
      const ok = await preguntar(sacarPregunta('yabusame'), `${t('pasada', { n: pasada })} · ${t('pregunta')}`); if (tk !== token) return;
      if (ok){ TIRO.calma = Math.min(3, TIRO.calma + 1); aviso(t('calma') + ' +1', '', 900); }
      const impactos = new Set(); let tirosHechos = 0, enVuelo = 0;
      let corriendo = true, vel = 0, tt = 0, casco = 0;
      const mov = ticker(dt => {
        if (pausado || !corriendo) return;
        tt += dt; vel = Math.min(10, vel + dt*6); rig.position.z += vel*dt;
        bob = Math.abs(Math.sin(tt*Math.PI*2.3))*.09*(vel/10); casco += dt*2.3*2; if (casco >= 1){ casco = 0; SND.casco(); }
        caballo.position.y = -bob*.6; caballo.rotation.x = Math.sin(tt*Math.PI*2.3)*.03;
        const mirarIzq = TIRO.activo && TIRO.sujeta ? 1 : 0; giro += (mirarIzq - giro)*Math.min(1, dt*6);
        const o = ojo(); const dirV = new THREE.Vector3(Math.sin(giro*1.25), -.05, Math.cos(giro*1.25));
        cam.pObj.copy(o); cam.mObj.copy(o).addScaledVector(dirV, 10); cam.vel = 30; cam.fovObj = 58 - 14*giro*TIRO.tiro;
        TIRO.base.set(Math.sin(1.25), 0, Math.cos(1.25)).normalize();
        if (rig.position.z > PI.largo - 20) corriendo = false;
        // aviso de la siguiente diana
        const sig = PI.dianas.find(dz => dz > rig.position.z - 1);
        const dd = sig != null ? sig - rig.position.z : null;
        hud(`<b>${t('pasada', { n: pasada })}</b><span>${t('aciertos')}: ${aciertos + impactos.size}/${(pasada - 1)*3}</span>${dd != null ? `<span class="diana-cerca${dd < 14 ? ' ya' : ''}">◀ ${t('dianaN', { n: PI.dianas.indexOf(sig) + 1 })} · ${Math.max(0, Math.round(dd))} m</span>` : ''}`);
        if (dd != null && dd < 14 && dd > 2 && !TIRO.sujeta && MODO === 'tiro') guia(t('tensaYa')); else if (MODO === 'tiro' && !TIRO.sujeta) guia(t('gTension'));
      });
      // el arquero no se ve (vista desde la silla): el arco va en las manos de la cámara
      while (corriendo && tirosHechos < 3){
        if (tk !== token){ mov(); return; }
        const h = await tiroCaballo(); if (!h) break;
        tirosHechos++; enVuelo++;
        h.onFin = r => { enVuelo--; };
      }
      while (corriendo){ if (tk !== token){ mov(); return; } await espera(120); }
      mov(); ARCO.limpiar();
      aciertos += impactos.size;
      aviso(`${impactos.size} / 3`, t('aciertos'), 1400); await espera(1500);

      function tiroCaballo(){
        return tiro({ ritual: false, modo: 'yabusame', yawMax: .35, pitch0: -.1, cancelar: () => !corriendo || tk !== token, plano: ['x', PI.lado - .03], sens: .0011,
          choque: (h, a, b) => {
            if (b.x >= PI.lado - .03){
              const k = (PI.lado - .03 - a.x)/(b.x - a.x), y = a.y + (b.y - a.y)*k, z = a.z + (b.z - a.z)*k;
              const i = PI.dianas.findIndex(dz => Math.abs(z - dz) < .42 && Math.abs(y - PI.alto) < .36);
              if (i >= 0 && !impactos.has(i)){ impactos.add(i); SND.madera(); SND.ovacion && SND.ovacion(.4); aviso(t('acierto'), '', 900); const d = ESC.G.dianasPista[i]; d.userData.tabla.rotation.z = -.5; setTimeout(() => d.userData.tabla.rotation.z = 0, 3000); return 'acierto'; }
              const dz = PI.dianas.reduce((m, q) => Math.abs(z - q) < Math.abs(z - m) ? q : m, PI.dianas[0]);
              if (Math.abs(z - dz) < 3) { SND.arena(); aviso(Math.abs(y - PI.alto) >= .36 && Math.abs(z - dz) < .42 ? t(y > PI.alto ? 'alto' : 'bajo') : t(z < dz ? 'pronto' : 'tarde'), '', 1000); }
              return 'fallo';
            }
            if (b.y < .02) { aviso(t('fallo'), '', 800); return 'suelo'; }
            return null;
          } });
      }
    }
    fin('yabusame', aciertos, aciertos >= 5, [`${t('aciertos')}: ${aciertos} / 9`]);
  }

  /* ---------------- final de la prueba ---------------- */
  function fin(id, valor, ok, lineas){
    MODO = 'fin'; TIRO.activo = false; guia(''); pasos(null); hud(''); document.body.classList.remove('juego');
    const Pr = PRUEBAS.find(p => p.id === id);
    if (P.mejor[id] == null || valor > P.mejor[id]) P.mejor[id] = valor;
    let extra = '';
    if (ok && !P.hechas[id]){ P.hechas[id] = true; xp(50); if (id === 'yabusame') xp(100); }
    if (ok) xp(Math.min(30, valor*2));
    const todas = PRUEBAS.every(p => P.hechas[p.id]);
    if (todas && id === 'yabusame' && ok) extra = `<h2 style="color:var(--bermellon)">${t('maestro')}</h2><p class="cita">${es() ? 'Con la paz Tokugawa, el arco, la espada y la lucha se convirtieron en un camino (-dō) de formación moral.' : 'Under the Tokugawa peace, archery, swordsmanship and wrestling became a way (-dō) of moral training.'}</p>`;
    guardar();
    const h = panel(`<h3>${Pr.num} · ${L(Pr.titulo)}</h3><h2><span style="font-size:1.3em;color:${ok ? 'var(--ok)' : 'var(--mal)'};margin-right:8px">${ok ? '中' : '外'}</span>${ok ? t('superada') : t('noSuperada')}</h2>
      <ul class="lista">${lineas.map(l => `<li>${l}</li>`).join('')}</ul>${ok ? '' : `<p class="cita">${consejo(id)}</p>`}${extra}`);
    const f = document.createElement('div'); f.className = 'fila';
    const sig = PRUEBAS.find(p => !P.hechas[p.id] && libre(p.id));
    if (ok && sig) f.appendChild(boton(L(sig.titulo) + ' ›', 'rojo', () => prueba(sig.id)));
    f.appendChild(boton(t('repetir'), ok && sig ? 'claro' : 'rojo', () => prueba(id)));
    f.appendChild(boton(t('menu'), 'claro', () => portada()));
    h.appendChild(f);
  }
  function consejo(id){
    if (id === 'dojo') return es() ? 'Tensa del todo antes de soltar: con la cuerda a medias la flecha cae antes de la diana. Y no te quedes demasiado tiempo apuntando, porque el pulso empieza a temblar.' : 'Draw fully before releasing: with the string half-drawn the arrow drops short. And do not stay aiming too long, because your hand starts to shake.';
    if (id === 'toshiya') return es() ? 'La flecha tiene que volar casi recta: si la mira se vuelve naranja con el aviso del techo, baja un poco. Sin tensar del todo no llega a los 120 metros.' : 'The arrow has to fly almost straight: if the sight turns orange with the roof warning, aim a little lower. Without a full draw it will not reach 120 metres.';
    return es() ? 'Empieza a tensar un poco antes de llegar a cada diana y suelta cuando la mira pase por el centro: el caballo no se detiene.' : 'Start drawing a little before each target and release as the sight crosses the centre: the horse does not stop.';
  }

  /* ---------------- pausa ---------------- */
  function pausa(){
    if (MODO !== 'tiro' && MODO !== 'vuelo') return;
    pausado = true; SND.dormir();
    const h = panel(`<h3>${t('pausa')}</h3><h2>${t('titulo')}</h2>`);
    const f = document.createElement('div'); f.className = 'fila';
    f.appendChild(boton(t('seguir'), 'rojo', () => { cerrarPanel(); pausado = false; SND.despertar(); }));
    f.appendChild(boton(t('menu'), 'claro', () => { pausado = false; SND.despertar(); portada(); }));
    if (HAPP && HAPP.inApp) f.appendChild(boton(t('guardarSalir'), 'claro', () => { guardar(); location.href = '../'; }));
    h.appendChild(f);
  }

  /* ---------------- ganchos de prueba ---------------- */
  window.render_game_to_text = () => JSON.stringify({ modo: MODO, pausado, fase: TIRO.fase, tiro: +TIRO.tiro.toFixed(2), sujeta: TIRO.sujeta, yaw: +TIRO.yaw.toFixed(3), pitch: +TIRO.pitch.toFixed(3), calma: TIRO.calma, fuerza: +TIRO.fuerza.toFixed(2), vuelo: ARCO.VUELO.map(h => ({ x: +h.f.position.x.toFixed(1), y: +h.f.position.y.toFixed(2), z: +h.f.position.z.toFixed(2), vivo: h.vivo, r: h.resultado || null })), hechas: P.hechas });
  window.KYUDO = { P, prueba, portada, ENT, TIRO };

  enlazar();
  cargar();
})();
</script>
</body>
</html>
