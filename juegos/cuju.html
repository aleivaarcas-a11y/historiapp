<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#16120e">
<title>Cuju · La prueba de los cien toques</title>
<style>
:root{
  --papel:#f3ead6; --papel2:#e6d9bc; --tinta:#1b1612; --tinta2:#2c241c; --rubia:#b02a20; --indigo:#2f5a52; --oro:#c9a24a; --azafran:#d98a1e;
  --ok:#2d6aa3; --mal:#d9822b;
  --tit:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --txt:Calibri,Carlito,"Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0f0a07;color:var(--papel);font-family:var(--txt);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
#lienzo{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#vineta{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 52%,rgba(0,0,0,0) 58%,rgba(14,8,4,.5) 100%)}
button{font-family:var(--txt);cursor:pointer}
.oculto{display:none!important}

/* carga */
#carga{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#140d09;transition:opacity .6s}
#carga .sello{width:92px;height:92px;border-radius:50%;border:3px solid var(--oro);display:flex;align-items:center;justify-content:center;font:700 34px/1 var(--tit);color:var(--oro);animation:latir 1.6s ease-in-out infinite}
#carga .barra{width:min(320px,70vw);height:4px;background:#3a2a1c;border-radius:2px;overflow:hidden}
#carga .barra i{display:block;height:100%;width:0;background:var(--oro);transition:width .25s}
#carga p{margin:0;font:16px var(--txt);color:#d8c49c;letter-spacing:.04em}
@keyframes latir{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* paneles */
.capa{position:fixed;inset:0;z-index:35;display:flex;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.capa.velo{background:rgba(12,8,5,.55);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.hoja{position:relative;background:var(--papel);color:var(--tinta);border-radius:6px;box-shadow:0 18px 50px rgba(0,0,0,.55),inset 0 0 0 1px rgba(80,50,20,.25);padding:22px 26px;max-width:660px;width:100%;max-height:100%;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.hoja::before{content:"";position:absolute;inset:6px;border:1px solid rgba(158,42,30,.35);border-radius:3px;pointer-events:none}
.hoja::after{content:"";position:absolute;left:14px;right:14px;top:14px;height:6px;background:repeating-linear-gradient(90deg,rgba(176,42,32,.45) 0 10px,transparent 10px 14px,rgba(47,90,82,.4) 14px 18px,transparent 18px 22px);pointer-events:none;border-radius:2px}
.hoja h2{font:700 26px/1.15 var(--tit);margin:8px 0 6px;color:var(--tinta)}
.hoja h3{font:700 13px/1.2 var(--txt);margin:8px 0 8px;letter-spacing:.14em;text-transform:uppercase;color:var(--rubia)}
.hoja p{font:17px/1.42 var(--txt);margin:0 0 12px}
.hoja .cita{font:16px/1.45 var(--txt);border-left:3px solid var(--rubia);padding:2px 0 2px 12px;margin:6px 0 10px;color:#3a2a1e}
.hoja .fuente{font:13px/1.35 var(--txt);color:#6c5a44;margin:0 0 12px}
.hoja .nota{font:14px/1.4 var(--txt);color:#5a4632;background:#eadbb9;border-radius:6px;padding:8px 10px;margin:0 0 12px}
.fila{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.btn{min-height:46px;padding:0 20px;border-radius:24px;border:0;font:700 17px/1 var(--txt);letter-spacing:.02em;background:var(--tinta);color:var(--papel);box-shadow:0 3px 0 #000}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
.btn.rojo{background:var(--rubia);color:#fff;box-shadow:0 3px 0 #561409}
.btn.claro{background:transparent;color:var(--tinta);box-shadow:inset 0 0 0 2px var(--tinta)}
.btn[disabled]{opacity:.4}
.lista{margin:6px 0 12px;padding-left:20px;font:16px/1.45 var(--txt)}
.lista li{margin-bottom:5px}
.tabla{width:100%;border-collapse:collapse;font:15px/1.3 var(--txt);margin:6px 0 12px}
.tabla td{padding:6px 4px;border-bottom:1px solid rgba(120,80,40,.25);vertical-align:top}
.tabla td:first-child{font-weight:700;white-space:nowrap;padding-right:10px}

/* portada */
#portada{align-items:flex-end;justify-content:flex-start;background:linear-gradient(90deg,rgba(12,7,4,.82) 0%,rgba(12,7,4,.4) 46%,rgba(0,0,0,0) 72%)}
#portada .bloque{max-width:540px;padding:0 0 4vh 2vw}
#portada .deva{font:800 clamp(56px,12vh,110px)/1 var(--tit);color:var(--papel);text-shadow:0 4px 24px rgba(0,0,0,.6);letter-spacing:.04em}
#portada .deva b{color:var(--rubia);font-weight:800}
#portada h1{font:700 clamp(24px,5vh,42px)/1.05 var(--tit);margin:8px 0 4px;color:var(--papel)}
#portada .sub{font:clamp(14px,2.6vh,18px)/1.38 var(--txt);color:#e8d6b0;margin:0 0 18px;max-width:460px}
#portada .btn{min-height:50px;font-size:18px}
#portada .btn.claro{color:var(--papel);box-shadow:inset 0 0 0 2px rgba(242,230,204,.7)}
#esquina{position:fixed;top:max(10px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));z-index:30;display:flex;gap:8px}
.icono{min-width:46px;height:46px;border-radius:23px;border:1px solid rgba(242,230,204,.45);background:rgba(20,12,8,.62);color:var(--papel);font:700 15px/1 var(--txt);padding:0 12px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#copy{position:fixed;left:max(12px,env(safe-area-inset-left));bottom:max(6px,env(safe-area-inset-bottom));z-index:21;font:12px var(--txt);color:rgba(242,230,204,.6);pointer-events:none}

/* lámina */
#lamina .hoja{max-width:880px;display:flex;gap:22px;align-items:center}
#lamina img{max-height:min(66vh,480px);max-width:46%;box-shadow:0 6px 18px rgba(0,0,0,.35);border:8px solid #f7efdc;outline:1px solid #6c5a44;image-rendering:auto;background:#fff}
@media (max-aspect-ratio:1/1){#lamina .hoja{flex-direction:column}#lamina img{max-width:100%}}

/* pregunta */
#pregunta .hoja{max-width:740px}
.opciones{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 6px}
@media (max-width:560px){.opciones{grid-template-columns:1fr}}
.op{position:relative;min-height:54px;text-align:left;padding:10px 14px 10px 44px;border-radius:6px;border:2px solid #b9a07a;background:#fbf4e4;color:var(--tinta);font:600 16px/1.25 var(--txt)}
.op::before{content:attr(data-l);position:absolute;left:12px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;background:var(--tinta);color:var(--papel);font:700 13px/22px var(--txt);text-align:center}
.op.ok{border-color:var(--ok);background:#e3eef8}.op.ok::before{content:"✓";background:var(--ok)}
.op.mal{border-color:var(--mal);background:#fbeee0}.op.mal::before{content:"✗";background:var(--mal)}
.op[disabled]{cursor:default}
.explica{display:none;margin-top:8px;padding:10px 12px;border-radius:6px;background:#ecdcba;font:16px/1.4 var(--txt)}
.explica b{font-weight:700}.explica.on{display:block}
.fichas{display:inline-flex;gap:5px;vertical-align:middle}
.ficha{width:14px;height:14px;border-radius:50%;border:2px solid var(--oro);display:inline-block}
.ficha.on{background:var(--oro)}

/* marcador */
#marca{position:fixed;top:max(10px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));z-index:12;display:flex;flex-direction:column;gap:3px;background:rgba(20,14,10,.68);border:1px solid rgba(243,234,214,.25);border-radius:8px;padding:8px 12px;pointer-events:none;font:600 13px/1.3 var(--txt);color:#e6d6b2;min-width:180px}
#marca b{font:700 16px/1.2 var(--tit);color:var(--papel)}
#marca .num{font:800 30px/1 var(--txt);color:var(--papel);letter-spacing:.02em}
#marca .num small{font:700 15px var(--txt);color:#cdbd9c;margin-left:4px}
#marca .barra{height:6px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden;margin:3px 0}
#marca .barra i{display:block;height:100%;background:var(--oro)}
.rombos{letter-spacing:2px;color:var(--oro)}
#tanteo{position:fixed;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:12;display:flex;align-items:center;gap:14px;background:rgba(20,14,10,.72);border:1px solid rgba(243,234,214,.25);border-radius:22px;padding:6px 18px;font:800 26px/1 var(--txt);color:var(--papel);pointer-events:none}
#tanteo span{font:700 13px var(--txt);color:#e6d6b2;letter-spacing:.06em;text-transform:uppercase}
#tanteo .toques{display:flex;gap:4px}#tanteo .toques i{width:10px;height:10px;border-radius:50%;border:2px solid var(--papel)}#tanteo .toques i.on{background:var(--papel)}
/* medidor de alturas junto al jugador */
#medidor{position:fixed;left:0;top:0;z-index:9;width:58px;pointer-events:none;opacity:0;transition:opacity .3s}
#medidor .z{position:absolute;left:8px;right:0;border-radius:6px;border:2px solid rgba(243,234,214,.55);background:rgba(20,14,10,.35);display:flex;align-items:center;justify-content:center;font:800 11px/1 var(--txt);color:rgba(243,234,214,.9);letter-spacing:.03em;text-transform:uppercase}
#medidor .z.aviso{background:rgba(255,255,255,.32);border-color:rgba(255,255,255,.8)}
#medidor .z.on{background:rgba(255,255,255,.88);color:var(--tinta);border-color:#fff;box-shadow:0 0 12px rgba(255,255,255,.7)}
#medidor .z.cabeza{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.12) 0 4px,transparent 4px 8px)}
#medidor .z.rodilla{background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.12) 0 3px,transparent 3px 7px)}
#medidor .bola{position:absolute;left:-9px;width:14px;height:14px;margin:-7px 0 0 0;border-radius:50%;background:#e8a85a;box-shadow:0 0 0 2px #1b1612}
/* mandos */
#cruceta{position:fixed;left:max(14px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));z-index:11;display:flex;gap:12px;touch-action:none}
#cruceta button{width:78px;height:78px;border-radius:14px;border:1px solid rgba(243,234,214,.5);background:rgba(20,14,10,.55);color:var(--papel);font:700 30px/1 var(--txt);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#cruceta button.on{background:rgba(243,234,214,.88);color:var(--tinta)}
#acciones{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));z-index:11;display:flex;gap:12px;align-items:flex-end;touch-action:none}
.acc{border-radius:50%;border:2px solid rgba(243,234,214,.7);background:rgba(20,14,10,.6);color:var(--papel);display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 15px/1.1 var(--txt);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.acc.on{background:rgba(243,234,214,.92);color:var(--tinta)}
#bToque{width:108px;height:108px;font-size:18px}
#bTiro{width:84px;height:84px;background:rgba(176,42,32,.75)}
@media (hover:hover) and (pointer:fine){.acc::after,#cruceta button::after{content:attr(data-tecla);display:block;font:700 10px var(--txt);opacity:.75;margin-top:3px}}
@media (max-height:440px){#cruceta button{width:64px;height:64px}#bToque{width:92px;height:92px}#bTiro{width:72px;height:72px}#marca{min-width:150px;padding:6px 10px}#marca .num{font-size:24px}}
/* avisos */
#aviso{position:fixed;left:50%;top:26%;transform:translate(-50%,-50%);z-index:12;pointer-events:none;text-align:center;opacity:0;transition:opacity .2s,transform .2s}
#aviso.on{opacity:1;transform:translate(-50%,-50%) scale(1.04)}
#aviso b{display:block;font:700 clamp(32px,8vh,64px)/1 var(--tit);color:var(--papel);text-shadow:0 3px 0 #000,0 0 26px rgba(0,0,0,.7)}
#aviso small{display:block;margin-top:8px;font:700 clamp(14px,2.6vh,19px)/1.25 var(--txt);color:#f2dfb4;text-shadow:0 2px 0 #000;max-width:min(560px,80vw)}
#guia{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:13;pointer-events:none;max-width:min(520px,46vw)}
#guia p{margin:0;font:700 clamp(14px,2.6vh,18px)/1.3 var(--txt);text-align:center;background:rgba(20,12,8,.74);padding:8px 14px;border-radius:18px}
#pensando{position:fixed;left:50%;top:max(10px,env(safe-area-inset-top));transform:translateX(-50%);z-index:12;pointer-events:none;font:700 14px var(--txt);background:rgba(20,12,8,.7);padding:6px 14px;border-radius:16px;color:#e8d6b0;opacity:0;transition:opacity .3s}
#pensando.on{opacity:1}
#pensando i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--oro);margin-left:4px;animation:pt 1s infinite}
#pensando i:nth-child(2){animation-delay:.15s}#pensando i:nth-child(3){animation-delay:.3s}
@keyframes pt{0%,100%{opacity:.25}50%{opacity:1}}

.lista-cap{display:flex;flex-direction:column;gap:10px;margin:8px 0}
.capi{display:flex;align-items:center;gap:14px;text-align:left;padding:10px 14px;border-radius:8px;border:2px solid #b9a07a;background:#fbf4e4;color:var(--tinta);font:700 17px var(--txt)}
.capi b{font:700 24px var(--tit);color:var(--rubia);min-width:38px;text-align:center}
.capi small{display:block;font:500 13px var(--txt);color:#6c5a44;margin-top:2px}
.capi.cerrada{opacity:.55}
.selector{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}
.selector button{min-height:44px;padding:0 14px;border-radius:22px;border:2px solid #b9a07a;background:#fbf4e4;color:var(--tinta);font:700 15px var(--txt)}
.selector button.sel{background:var(--tinta);color:var(--papel);border-color:var(--tinta)}
.selector button i{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:6px;box-shadow:0 0 0 2px rgba(0,0,0,.35)}

#rotar{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#0f0a07;color:var(--papel);font:600 20px/1.3 var(--txt);text-align:center;padding:24px}
#rotar b{font-size:56px;line-height:1;display:block;animation:rot 2.2s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-width:900px){#rotar{display:flex}}
.happ-in #copy{display:none}
.happ-in .capa.velo{padding-top:max(62px,calc(env(safe-area-inset-top) + 56px))}
.juego #copy{display:none}
#pausaBtn{display:none}.juego #pausaBtn{display:inline-flex;align-items:center;justify-content:center}
.juego #esquina .idi{display:none}
@media (max-height:440px){.hoja{padding:14px 18px}.hoja h2{font-size:21px}.hoja p,.hoja .cita{font-size:15px;margin-bottom:8px}.hoja .fuente{font-size:12px;margin-bottom:6px}.op{min-height:46px;font-size:15px}.btn{min-height:44px;font-size:16px}
  .icono{height:42px;min-width:42px}}
</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<div id="vineta"></div>

<div id="carga"><div class="sello">蹴鞠</div><div class="barra"><i></i></div><p id="cargaTxt">…</p></div>

<div id="esquina">
  <button class="icono" id="pausaBtn" aria-label="Pausa">❚❚</button>
  <button class="icono idi" id="idiomaBtn">EN</button>
  <button class="icono" id="sonidoBtn" aria-label="Sonido">♪</button>
</div>

<div id="marca" class="oculto"></div>
<div id="tanteo" class="oculto"></div>
<div id="medidor"><div class="z cabeza" data-z="cabeza"></div><div class="z rodilla" data-z="rodilla"></div><div class="z pie" data-z="pie"></div><div class="bola"></div></div>
<div id="cruceta" class="oculto"><button id="bIzq" data-tecla="←" aria-label="Izquierda">◀</button><button id="bDer" data-tecla="→" aria-label="Derecha">▶</button></div>
<div id="acciones" class="oculto"><button class="acc" id="bTiro" data-tecla="K"></button><button class="acc" id="bToque" data-tecla="Espacio"></button></div>
<div id="aviso"><b></b><small></small></div>
<div id="guia" class="oculto"><p id="guiaTxt"></p></div>

<div class="capa oculto" id="portada"><div class="bloque">
  <div class="deva">蹴<b>鞠</b></div>
  <h1 data-t="titulo"></h1>
  <p class="sub" data-t="subtitulo"></p>
  <div class="fila" id="portadaBtns"></div>
</div></div>

<div class="capa velo oculto" id="panel"><div class="hoja" id="hoja"></div></div>
<div class="capa velo oculto" id="pregunta"><div class="hoja" id="hojaP"></div></div>
<div class="capa velo oculto" id="lamina"><div class="hoja"><img id="laminaImg" alt=""><div id="laminaTxt"></div></div></div>

<div id="rotar"><b aria-hidden="true">📱</b><span data-t="girar"></span></div>
<div id="copy">© Diseñado y Creado por Alejandro Leiva Arcas</div>

<script>window.HAPP_CFG={tema:5,volver:'../',orient:'h'};
/* Puente con Historiapp. Lo inserta hacer_historiapp.py en la versión <juego>-historiapp.html.
   Configuración en window.HAPP_CFG = { tema, volver, orient, fichas, enlaces, barra, barraEn, barraClase, css }.
   1. Idioma: toma historiapp.lang si existe y lo presenta al juego como navigator.language.
   2. Sonido: ningún AudioContext ni <audio> suena hasta el primer toque (iOS lo bloquea).
   3. Dentro de la app (carpeta juegos/ y alguna clave historiapp.* en el mismo origen):
      XP en historiapp.progress, botón para volver, enlaces a fichas.
   4. Aviso de girar el dispositivo cuando el juego necesita la otra orientación (C.orient). */
(function () {
  'use strict';
  var C = window.HAPP_CFG || {};
  var inApp = false, lang = null;
  try {
    if (/\/juegos\//.test(location.pathname)) {
      for (var i = 0; i < localStorage.length; i++) {
        if (String(localStorage.key(i)).indexOf('historiapp.') === 0) { inApp = true; break; }
      }
    }
  } catch (e) {}
  try { lang = localStorage.getItem('historiapp.lang'); } catch (e) {}
  if (lang !== 'es' && lang !== 'en') lang = null;
  if (lang) {
    var tag = lang === 'en' ? 'en-GB' : 'es-ES';
    try {
      Object.defineProperty(Navigator.prototype, 'language', { get: function () { return tag; }, configurable: true });
      Object.defineProperty(Navigator.prototype, 'languages', { get: function () { return [tag]; }, configurable: true });
    } catch (e) {}
    try { document.documentElement.lang = lang; } catch (e) {}
  }
  var EN = (lang || (String(navigator.language || 'es').toLowerCase().indexOf('es') === 0 ? 'es' : 'en')) === 'en';
  var T = EN
    ? { back: 'Historiapp', xp: '+{n} XP in Historiapp', rot: 'Rotate your device to play', ficha: 'Read the study sheet' }
    : { back: 'Historiapp', xp: '+{n} XP en Historiapp', rot: 'Gira el dispositivo para jugar', ficha: 'Leer la ficha' };

  /* ---------- Sonido tras el primer toque ---------- */
  var unlocked = false, ctxs = [], pend = [];
  var AC = window.AudioContext || window.webkitAudioContext;
  var origResume = AC && AC.prototype.resume;
  if (AC) {
    var W = function (o) {
      var c = o === undefined ? new AC() : new AC(o);
      ctxs.push(c);
      if (!unlocked) { try { c.suspend(); } catch (e) {} }
      c.resume = function () { return unlocked ? origResume.call(c) : Promise.resolve(); };
      return c;
    };
    W.prototype = AC.prototype;
    try { window.AudioContext = W; if (window.webkitAudioContext) window.webkitAudioContext = W; } catch (e) {}
  }
  var MP = window.HTMLMediaElement && HTMLMediaElement.prototype, origPlay = MP && MP.play;
  if (origPlay) {
    MP.play = function () {
      if (unlocked) return origPlay.apply(this, arguments);
      if (pend.indexOf(this) < 0) pend.push(this);
      return Promise.resolve();
    };
  }
  function unlock() {
    if (unlocked) return;
    unlocked = true;
    ctxs.forEach(function (c) { try { if (c.state !== 'running' && c.state !== 'closed') origResume.call(c); } catch (e) {} });
    pend.splice(0).forEach(function (el) { try { var p = origPlay.call(el); if (p && p.catch) p.catch(function () {}); } catch (e) {} });
  }
  ['pointerdown', 'touchend', 'mousedown', 'keydown'].forEach(function (ev) {

  var toastEl = null, toastT = 0;

    '.happ-bar a,.happ-bar button{pointer-events:auto;display:inline-flex;align-items:center;gap:6px;min-height:44px;min-width:44px;padding:0 14px;border-radius:22px;' +

    'color:#fff;border:1px solid rgba(255,255,255,.45);font:600 14px/1.1 system-ui,-apple-system,"Segoe UI",sans-serif;cursor:pointer;pointer-events:auto}' +
    '.happ-toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;z-index:2147483001;pointer-events:none;' +
    'padding:10px 18px;border-radius:22px;background:#EDAB00;color:#1b1406;font:700 15px/1 system-ui,-apple-system,"Segoe UI",sans-serif;box-shadow:0 6px 18px rgba(0,0,0,.4);' +
    'transition:transform .25s,opacity .25s}' +
    '.happ-toast.on{transform:translate(-50%,0);opacity:1}' +
    '.happ-rot{position:fixed;inset:0;z-index:2147483002;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#0e0b08;color:#f3e6c8;' +
    'font:600 20px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;padding:24px}' +
    '.happ-rot b{font-size:56px;line-height:1;display:block;animation:happrot 2.2s ease-in-out infinite}' +

      for (var k in pos) bar.style[k] = pos[k];
      var a = document.createElement('a'); a.href = C.volver || '../'; a.textContent = '‹ ' + T.back; a.setAttribute('aria-label', EN ? 'Back to Historiapp' : 'Volver a Historiapp');

        b.addEventListener('pointerdown', function (e) { e.stopPropagation(); });

      document.body.appendChild(bar);

    if (C.css) { var st2 = document.createElement('style'); st2.textContent = C.css; document.head.appendChild(st2); }
    // Orientación: C.orient = 'h' | 'v' | función que devuelve 'h', 'v' o null (C.landscape = true equivale a 'h')
    var orient = C.orient || (C.landscape ? 'h' : null);

      var rot = document.createElement('div'); rot.className = 'happ-rot';
      rot.innerHTML = '<b aria-hidden="true">📱</b><span>' + T.rot + '</span>';
      if (inApp) {

window.MALLAS_SRC="/* Sumo \u00b7 escultura de los cuerpos. Cada figura se esculpe como un campo de distancias con uniones suaves\n   (carne que se funde en la barriga, la papada y los muslos) y se convierte en malla con \u00absurface nets\u00bb.\n   Se genera al cargar, sin descargar modelos, y se ata a un esqueleto de 17 huesos para animarla. */\n(function(root){\n  const V = (x, y, z) => [x, y, z];\n  const sub = (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];\n  const dot = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];\n  const len = a => Math.sqrt(dot(a, a));\n  const clamp = (x, a, b) => x < a ? a : x > b ? b : x;\n  const smoothstep = (a, b, x) => { const t = clamp((x - a)/(b - a), 0, 1); return t*t*(3 - 2*t); };\n\n  // primitivas\n  function ellip(p, c, r){ // aproximaci\u00f3n de distancia a un elipsoide\n    const x = (p[0]-c[0])/r[0], y = (p[1]-c[1])/r[1], z = (p[2]-c[2])/r[2];\n    const k0 = Math.sqrt(x*x + y*y + z*z);\n    const x1 = x/r[0], y1 = y/r[1], z1 = z/r[2];\n    const k1 = Math.sqrt(x1*x1 + y1*y1 + z1*z1);\n    return k1 > 1e-6 ? k0*(k0 - 1)/k1 : -Math.min(r[0], r[1], r[2]);\n  }\n  function cono(p, a, b, ra, rb){ // c\u00e1psula de radio variable (aproximaci\u00f3n)\n    const pa = sub(p, a), ba = sub(b, a);\n    const h = clamp(dot(pa, ba)/dot(ba, ba), 0, 1);\n    const d = [pa[0] - ba[0]*h, pa[1] - ba[1]*h, pa[2] - ba[2]*h];\n    return len(d) - (ra + (rb - ra)*h);\n  }\n  function caja(p, c, h, r){ const qx = Math.abs(p[0]-c[0]) - h[0] + r, qy = Math.abs(p[1]-c[1]) - h[1] + r, qz = Math.abs(p[2]-c[2]) - h[2] + r;\n    return Math.hypot(Math.max(qx, 0), Math.max(qy, 0), Math.max(qz, 0)) + Math.min(Math.max(qx, qy, qz), 0) - r; }\n  function smin(a, b, k){ const h = clamp(.5 + .5*(b - a)/k, 0, 1); return b + (a - b)*h - k*h*(1 - h); }\n  function smax(a, b, k){ return -smin(-a, -b, k); }\n\n  /* ---------------- el cuerpo de un rikishi (sin cabeza) ---------------- */\n  // m: corpulencia (1 normal, 1.2 pesado, .85 joven del sumo antiguo)\n  function esqueleto(m){\n    const sh = .40 + .03*(m - 1);\n    return [\n      { n: 'raiz',     p: -1, o: V(0, 0, 0) },\n      { n: 'pelvis',   p: 0,  o: V(0, .86, 0) },\n      { n: 'lumbar',   p: 1,  o: V(0, 1.04, 0) },\n      { n: 'pecho',    p: 2,  o: V(0, 1.28, 0) },\n      { n: 'cuello',   p: 3,  o: V(0, 1.52, 0) },\n      { n: 'brazoD',   p: 3,  o: V(sh, 1.41, -.02) },  { n: 'codoD', p: 5,  o: V(sh + .21, 1.13, -.02) }, { n: 'manoD', p: 6,  o: V(sh + .37, .88, .0) },\n      { n: 'brazoI',   p: 3,  o: V(-sh, 1.41, -.02) }, { n: 'codoI', p: 8,  o: V(-sh - .21, 1.13, -.02) }, { n: 'manoI', p: 9,  o: V(-sh - .37, .88, .0) },\n      { n: 'musloD',   p: 1,  o: V(.2, .84, 0) },  { n: 'rodillaD', p: 11, o: V(.255, .47, .03) }, { n: 'pieD', p: 12, o: V(.27, .09, 0) },\n      { n: 'musloI',   p: 1,  o: V(-.2, .84, 0) }, { n: 'rodillaI', p: 14, o: V(-.255, .47, .03) }, { n: 'pieI', p: 15, o: V(-.27, .09, 0) }\n    ];\n  }\n\n  function campoCuerpo(m){\n    const H = esqueleto(m), P = i => H[i].o;\n    const b = m, bz = .85 + .15*m;\n    // devuelve [distancia, regi\u00f3n] con regi\u00f3n 0 piel, 1 mawashi\n    return function(p){\n      // tronco\n      let d = ellip(p, V(0, .99, .07*bz), V(.42*b, .41, .41*bz));                       // barriga\n      d = smin(d, ellip(p, V(0, .84, -.01), V(.40*b, .27, .33*bz)), .08);              // bajo vientre y caderas\n      d = smin(d, ellip(p, V(0, 1.27, -.01), V(.41*b, .27, .31*bz)), .09);             // t\u00f3rax\n      d = smin(d, ellip(p, V(0, 1.30, -.09), V(.38*b, .25, .26)), .08);                // espalda\n      d = smin(d, ellip(p, V(0, 1.45, -.04), V(.30*b, .12, .18)), .07);                // trapecios\n      for (const s of [-1, 1]){\n        d = smin(d, ellip(p, V(.155*s, 1.27, .2*bz), V(.15, .135, .11)), .05);          // pectorales ca\u00eddos\n        d = smin(d, ellip(p, V(.155*s, .80, -.19), V(.19, .21, .19)), .06);             // nalgas\n        d = smin(d, ellip(p, V(.3*b*s, 1.0, .02), V(.15, .22, .25*bz)), .08);           // flancos\n      }\n      d = smin(d, cono(p, V(0, 1.42, -.01), V(0, 1.63, 0), .135, .12), .07);            // cuello\n      // piernas\n      let piernas = 1e9;\n      for (const s of [-1, 1]){\n        const k = s > 0 ? 11 : 14;\n        let l = cono(p, P(k), P(k + 1), .22*(.9 + .1*b), .13);\n        l = smin(l, ellip(p, [P(k)[0]*1.05, .64, .02], V(.17*(.9 + .1*b), .2, .19)), .05);  // cu\u00e1driceps\n        l = smin(l, cono(p, P(k + 1), P(k + 2), .12, .07), .04);\n        l = smin(l, ellip(p, [P(k + 1)[0], .32, -.045], V(.1, .13, .1)), .04);          // gemelo\n        const pie = Math.max(cono(p, [P(k + 2)[0], .055, -.05], [P(k + 2)[0]*1.06, .045, .16], .062, .052), -p[1]);\n        l = smin(l, pie, .035);\n        piernas = Math.min(piernas, l);\n      }\n      d = smin(d, piernas, .06);\n      // brazos\n      for (const s of [-1, 1]){\n        const k = s > 0 ? 5 : 8;\n        let a = ellip(p, [P(k)[0]*1.01, 1.405, 0], V(.145, .14, .15));                  // deltoides\n        a = smin(a, cono(p, P(k), P(k + 1), .125, .09), .04);\n        a = smin(a, cono(p, P(k + 1), P(k + 2), .085, .055), .03);\n        const pm = P(k + 2), dir = s;\n        let mano = ellip(p, [pm[0] + .03*dir, pm[1] - .075, pm[2] + .01], V(.036, .085, .058));\n        mano = smin(mano, cono(p, [pm[0] + .01*dir, pm[1] - .03, pm[2] + .04], [pm[0] + .02*dir, pm[1] - .085, pm[2] + .075], .018, .015), .015); // pulgar\n        a = smin(a, mano, .025);\n        d = smin(d, a, .05);\n      }\n      return [d, 0];\n    };\n  }\n\n\n  function campoMawashi(m){\n    const b = m, bz = .85 + .15*m;\n    return function(p){\n      const base = smin(ellip(p, V(0, .84, -.01), V(.40*b, .27, .33*bz)), ellip(p, V(0, .99, .07*bz), V(.42*b, .41, .41*bz)), .08);\n      const nalgas = Math.min(ellip(p, V(.155, .80, -.19), V(.19, .21, .19)), ellip(p, V(-.155, .80, -.19), V(.19, .21, .19)));\n      const flanco = Math.min(ellip(p, V(.3*b, 1.0, .02), V(.15, .22, .25*bz)), ellip(p, V(-.3*b, 1.0, .02), V(.15, .22, .25*bz)));\n      const cad = smin(smin(base, nalgas, .06), flanco, .08) - .024;\n      const yBanda = .865 - .085*clamp(p[2]/.4, -1, 1);   // m\u00e1s baja delante, bajo la barriga\n      const franja = Math.abs(p[1] - yBanda) - .088;\n      const delante = Math.max(Math.abs(p[0]) - .1 - .06*clamp((p[1] - .6)/.2, 0, 1), Math.max(p[1] - yBanda, .6 - p[1]), -p[2] + .05);\n      const detras = Math.max(Math.abs(p[0]) - .05, Math.max(p[1] - yBanda, .66 - p[1]), p[2] + .05);\n      let maw = smax(cad, Math.min(franja, delante, detras), .006);\n      // tira entre las piernas\n      maw = Math.min(maw, smax(cono(p, V(0, .655, -.16), V(0, .63, .19), .075, .075), Math.abs(p[0]) - .075, .005));\n      maw = smin(maw, ellip(p, V(0, .95, -.37*bz), V(.115, .08, .07)), .015);      // nudo trasero\n      return [maw, 1];\n    };\n  }\n\n  /* ---------------- cabezas ---------------- */\n  // tipo 0: rikishi con mo\u00f1o \u014dich\u014d; 1: gy\u014dji de Edo (mo\u00f1o peque\u00f1o); 2: gy\u014dji con eboshi\n  function campoCabeza(tipo, rasgo){\n    rasgo = rasgo || 0;\n    const cara = 1 + .06*rasgo;\n    return function(p){\n      let d = ellip(p, V(0, .135, -.012), V(.104, .118, .116));\n      d = smin(d, ellip(p, V(0, .065, .03), V(.098*cara, .108, .1)), .04);              // cara\n      const g = rasgo < 0 ? .55 : 1;\n      for (const s of [-1, 1]) d = smin(d, ellip(p, V(.058*s, .03, .05), V(.058*cara*g + .02*(1 - g), .058*g + .02*(1 - g), .056*g + .02*(1 - g))), .03); // mofletes\n      d = smin(d, ellip(p, V(0, -.012, .082), V(.046, .036, .04)), .02);               // barbilla\n      if (rasgo >= 0) d = smin(d, ellip(p, V(0, -.032, .04), V(.082*cara, .04, .072)), .03);            // papada\n      d = smin(d, cono(p, V(0, .1, .113), V(0, .064, .132), .011, .019), .012);         // nariz\n      for (const s of [-1, 1]) d = smin(d, ellip(p, V(.017*s, .064, .121), V(.014, .011, .012)), .008); // aletas\n      d = smin(d, ellip(p, V(0, .118, .098), V(.078, .019 /* Sumo · escultura de los cuerpos. Cada figura se esculpe como un campo de distancias con uniones suaves
   (carne que se funde en la barriga, la papada y los muslos) y se convierte en malla con «surface nets».
   Se genera al cargar, sin descargar modelos, y se ata a un esqueleto de 17 huesos para animarla. */
(function(root){
  const V = (x, y, z) => [x, y, z];
  const sub = (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];

    const k0 = Math.sqrt(x*x + y*y + z*z);

  { s: 22, q: { es: '¿Qué hacían los mejores jugadores de cuju?', en: 'What did the best cuju players do?' },
    o: [{ es: 'Vivían del juego', en: 'They lived from it' }, { es: 'Eran oficiales', en: 'They became officers' }, { es: 'Aprobaban sin estudiar', en: 'They passed exams unstudied' }, { es: 'Se hacían monjes', en: 'They became monks' }],
    x: { es: 'Los mejores jugadores llegaron a ser profesionales, que vivían del juego y actuaban en las fiestas y en las ciudades.', en: 'The best players became professionals, who lived from the game and performed at festivals and in the cities.' } },
  { s: 22, q: { es: '¿Quiénes jugaban al cuju en la corte, como los de la pintura?', en: 'Who played cuju at court, like those in the painting?' },
    o: [{ es: 'Funcionarios, soldados e hijos de ricos', en: 'Officials, soldiers and sons of the rich' }, { es: 'Solo los monjes y los acróbatas', en: 'Only monks and acrobats' }, { es: 'Los campesinos en los días de mercado', en: 'Peasants on market days' }, { es: 'Los comerciantes y sus criados de la ciudad', en: 'Merchants and their servants in the city' }],
    x: { es: 'Fue un juego de prestigio en la corte, donde lo practicaban funcionarios, soldados e hijos de ricos, con túnicas y gorros de corte.', en: 'It was a prestige game at court, played by officials, soldiers and sons of the rich, in court robes and hats.' } },
  { s: 23, q: { es: '¿Cuántos jugadores tenía cada equipo en la modalidad de doce porterías semicirculares?', en: 'How many players did each team have in the twelve semicircular goals variant?' },
    o: [{ es: 'Doce, seis defensas y seis delanteros', en: 'Twelve, six defenders and six forwards' }, { es: 'Seis, tres defensas y tres delanteros', en: 'Six, three defenders and three forwards' }, { es: 'Veinticuatro, doce defensas y doce delanteros', en: 'Twenty-four, twelve defenders and twelve forwards' }, { es: 'Cuarenta y cuatro, como las figuras de Mawangdui', en: 'Forty-four, like the Mawangdui figures' }],
    x: { es: 'La modalidad con doce porterías semicirculares se jugaba en un campo cerrado, con doce jugadores por equipo, seis defensas y seis delanteros, y era la más reglamentada.', en: 'The variant with twelve semicircular goals was played on an enclosed field, with twelve players per team, six defenders and six forwards, and it was the most regulated.' } },
  { s: 23, q: { es: '¿Cómo se llamaba la modalidad de cuju con una sola portería?', en: 'What was the single-goal variant of cuju called?' },
    o: [{ es: 'Baida', en: 'Baida' }, { es: 'Jiju', en: 'Jiju' }, { es: 'Wushu', en: 'Wushu' }, { es: 'Polo', en: 'Polo' }],
    x: { es: 'En la modalidad con una sola portería, llamada baida, había que «encestar» el balón a través de un círculo situado a gran altura.', en: 'In the single-goal variant, called baida, the ball had to be “put through” a circle placed high up.' } },
  { s: 23, q: { es: 'En la baida, ¿qué había que hacer con el balón?', en: 'In baida, what had to be done with the ball?' },
    o: [{ es: 'Pasarlo por un círculo alto', en: 'Send it through a high circle' }, { es: 'Meterlo en un hoyo', en: 'Put it in a hole' }, { es: 'Golpearlo con mazas curvas', en: 'Strike it with curved mallets' }, { es: 'Llevarlo a la portería rival', en: 'Carry it to the rival’s goal' }],
    x: { es: 'Había que «encestar» el balón a través de un círculo situado a gran altura.', en: 'The ball had to be “put through” a circle placed high up.' } },
  { s: 23, q: { es: '¿Con qué deporte actual se compara la baida, salvando las distancias?', en: 'Which modern sport is baida compared with, allowing for the differences?' },
    o: [{ es: 'El voleibol', en: 'Volleyball' }, { es: 'El golf', en: 'Golf' }, { es: 'El polo', en: 'Polo' }, { es: 'El rugby escolar', en: 'School rugby' }],
    x: { es: 'Se jugó entre los siglos XII y XVIII d. C., salvando las distancias, como el voleibol actual.', en: 'It was played between the twelfth and eighteenth centuries AD, allowing for the differences, like modern volleyball.' } },
  { s: 23, q: { es: '¿Cómo era el primer balón de cuju?', en: 'What was the first cuju ball like?' },
    o: [{ es: 'De cuero relleno, pesado', en: 'Stuffed leather, heavy' }, { es: 'De madera, muy duro', en: 'Wood, very hard' }, { es: 'Una vejiga sin cuero', en: 'A bare bladder' }, { es: 'De bambú trenzado', en: 'Woven bamboo' }],
    x: { es: 'Al principio era una pelota de cuero relleno de pelo o de plumas, pesada y poco botadora.', en: 'At first it was a leather ball stuffed with hair or feathers, heavy and with little bounce.' } },
  { s: 23, q: { es: '¿Qué permitió el balón con una vejiga hinchada dentro?', en: 'What did the ball with an inflated bladder inside make possible?' },
    o: [{ es: 'Mantenerlo en el aire', en: 'Keeping it in the air' }, { es: 'Jugar de noche', en: 'Playing at night' }, { es: 'Golpearlo con palos de bambú', en: 'Striking it with bamboo sticks' }, { es: 'Que no se mojara con la lluvia', en: 'Keeping it dry in the rain' }],
    x: { es: 'Se fabricó con varias piezas de cuero cosidas y una vejiga de animal hinchada de aire, más ligera, lo que permitió mantenerlo en el aire y lanzarlo a gran altura.', en: 'It was made of several sewn pieces of leather with an inflated animal bladder, lighter, which made it possible to keep it in the air and kick it high.' } },
  { s: 23, q: { es: '¿Dónde se jugaba la modalidad de cuju con dos porterías?', en: 'Where was the two-goal variant of cuju played?' },
    o: [{ es: 'En campo abierto', en: 'On open ground' }, { es: 'En un patio cerrado', en: 'In a closed courtyard' }, { es: 'En Shaolin', en: 'At Shaolin' }, { es: 'En la arena', en: 'On sand' }],
    x: { es: 'Era una modalidad practicada por equipos numerosos, por lo general en campo abierto.', en: 'It was played by large teams, usually on open ground.' } },
  { s: 25, q: { es: '¿Hubo cuju jugado por mujeres?', en: 'Was cuju played by women?' },
    o: [{ es: 'Sí, en algunas épocas', en: 'Yes, in some periods' }, { es: 'No, se prohibió siempre', en: 'No, it was always banned' }, { es: 'Solo en el siglo XX', en: 'Only in the twentieth century' }, { es: 'Solo entre los monjes', en: 'Only among monks' }],
    x: { es: 'Durante algunas épocas hubo también cuju femenino, como muestra la pintura de mujeres jugando de los siglos XIV-XVII d. C. (diapositivas 22 y 25).', en: 'In some periods there was also women’s cuju, as the fourteenth- to seventeenth-century painting of women playing shows (slides 22 and 25).' } },
  // China, introducción y sociedad (diapositivas 6 y 7)
  { s: 6, q: { es: '¿Desde qué dinastía abarca la historia de China más de tres mil años?', en: 'From which dynasty does Chinese history span more than three thousand years?' },
    o: [{ es: 'Shang', en: 'Shang' }, { es: 'Qing', en: 'Qing' }, { es: 'Han', en: 'Han' }, { es: 'Ming', en: 'Ming' }],
    x: { es: 'La historia de China abarca más de tres mil años desde la dinastía Shang, que la tradición situaba en 1766 a. C. y hoy se fecha hacia 1600 a. C.', en: 'Chinese history spans more than three thousand years from the Shang dynasty, traditionally dated to 1766 BC and now to around 1600 BC.' } },
  { s: 6, q: { es: '¿Qué dinastía unificó China bajo un emperador en 221 a. C.?', en: 'Which dynasty unified China under an emperor in 221 BC?' },
    o: [{ es: 'Los Qin', en: 'The Qin' }, { es: 'Los Zhou', en: 'The Zhou' }, { es: 'Los Han', en: 'The Han' }, { es: 'Los Ming', en: 'The Ming' }],
    x: { es: 'En 221 a. C. los Qin unificaron el país bajo un emperador, soberano absoluto que gobernaba como «Hijo del Cielo».', en: 'In 221 BC the Qin unified the country under an emperor, an absolute ruler who governed as “Son of Heaven”.' } },
  { s: 6, q: { es: '¿Qué dinastías dieron a China su etapa de mayor esplendor?', en: 'Which dynasties gave China its most splendid period?' },
    o: [{ es: 'Los Tang y los Song', en: 'The Tang and the Song' }, { es: 'Los Shang y los Zhou', en: 'The Shang and the Zhou' }, { es: 'Los mongoles y los Qing', en: 'The Mongols and the Qing' }, { es: 'Los Qin y los Han', en: 'The Qin and the Han' }],
    x: { es: 'Tras siglos de división, los Tang (618-907) y los Song (960-1279) dieron a China su etapa de mayor esplendor.', en: 'After centuries of division, the Tang (618-907) and the Song (960-1279) gave China its most splendid period.' } },
  { s: 7, q: { es: '¿Qué lugar ocupaban los comerciantes (shang) en la escala confuciana?', en: 'Where did merchants (shang) stand in the Confucian scale?' },
    o: [{ es: 'El último escalón', en: 'The bottom rung' }, { es: 'Justo bajo el emperador', en: 'Just below the emperor' }, { es: 'Sobre los campesinos', en: 'Above the peasants' }, { es: 'En el centro', en: 'In the middle' }],
    x: { es: 'Ocupaban el último escalón, porque se les acusaba de enriquecerse sin producir, aunque muchos fueron más ricos que los letrados.', en: 'They were on the bottom rung, accused of getting rich without producing, although many were richer than the scholars.' } },
  { s: 7, q: { es: '¿De qué dependía el acceso al ejercicio en la China imperial?', en: 'What did access to exercise depend on in imperial China?' },
    o: [{ es: 'Del orden social y de su rango', en: 'On the social order and rank' }, { es: 'De la edad, solo para los jóvenes', en: 'On age, for the young only' }, { es: 'De la religión budista', en: 'On the Buddhist faith' }, { es: 'De vivir en el norte', en: 'On living in the north' }],
    x: { es: 'De este orden dependía el acceso al ejercicio, puesto que caballos, armas y tiempo libre quedaban en manos de la corte, la élite y el ejército.', en: 'Access to exercise depended on this order, since horses, weapons and free time were in the hands of the court, the elite and the army.' } },
  // la mujer (diapositiva 8)
  { s: 8, q: { es: '¿Por qué entró el columpio en el palacio?', en: 'Why did the swing enter the palace?' },
    o: [{ es: 'Su nombre sonaba a «larga vida»', en: 'Its name sounded like “long life”' }, { es: 'Era un regalo de las embajadas persas', en: 'It was a gift from Persian embassies' }, { es: 'Entrenaba a la caballería del emperador', en: 'It trained the emperor’s cavalry' }, { es: 'Lo recomendaba Hua Tuo', en: 'Hua Tuo recommended it' }],
    x: { es: 'Ya en los primeros siglos del Imperio, el columpio entró en el palacio para las concubinas y sus criadas, porque su nombre sonaba como «larga vida».', en: 'In the first centuries of the Empire, the swing entered the palace for concubines and their maids, because its name sounded like “long life”.' } },
  { s: 8, q: { es: '¿De qué dependía el lugar de la mujer en el deporte chino?', en: 'What did women’s place in Chinese sport depend on?' },
    o: [{ es: 'De su rango, más que de su sexo', en: 'On her rank more than her sex' }, { es: 'De la religión de su familia y su aldea', en: 'On the religion of her family and village' }, { es: 'De la dinastía que gobernaba en cada época', en: 'On the dynasty that ruled in each period' }, { es: 'Del permiso del templo', en: 'On the temple’s permission' }],
    x: { es: 'Se aceptó casi siempre que hiciera ejercicio, sobre todo en la corte, de modo que el lugar de la mujer en el deporte chino dependía de su rango más que de su sexo.', en: 'Her exercising was almost always accepted, especially at court, so women’s place in Chinese sport depended on rank more than sex.' } },
  { s: 8, q: { es: '¿Qué ideal de belleza femenina se impuso a partir del siglo X d. C.?', en: 'What ideal of female beauty took hold from the tenth century AD?' },
    o: [{ es: 'Una mujer delicada y contenida', en: 'A delicate, restrained woman' }, { es: 'Una mujer fuerte que jugaba al polo', en: 'A strong woman who played polo' }, { es: 'Una mujer activa como la de las figurillas funerarias', en: 'An active woman like the one in the funerary figurines' }, { es: 'Una mujer guerrera', en: 'A warrior woman' }],
    x: { es: 'A partir del siglo X d. C. la belleza pasó a ser la de una mujer delicada y contenida, y se extendió el vendado de los pies.', en: 'From the tenth century AD beauty became that of a delicate, restrained woman, and foot-binding spread.' } },
  // salud y longevidad (diapositivas 9-15)
  { s: 9, q: { es: '¿Qué es el qi según la medicina china?', en: 'What is qi in Chinese medicine?' },
    o: [{ es: 'La energía vital', en: 'The vital energy' }, { es: 'Un examen civil', en: 'A civil exam' }, { es: 'Una danza', en: 'A dance' }, { es: 'La fuerza física', en: 'Physical force' }],
    x: { es: 'La medicina china sostenía que por el cuerpo corre el qi, la energía vital, y que la persona estaba sana cuando circulaba sin bloqueos.', en: 'Chinese medicine held that qi, the vital energy, flows through the body, and that a person was healthy when it flowed without blockages.' } },
  { s: 9, q: { es: '¿Por qué el ejercicio de salud chino debía ser suave?', en: 'Why did Chinese health exercise have to be gentle?' },
    o: [{ es: 'Porque el esfuerzo excesivo agotaba el qi', en: 'Because excessive effort drained the qi' }, { es: 'Porque lo prohibía la ley de los Qin para los campesinos', en: 'Because Qin law forbade it to the peasants' }, { es: 'Porque los médicos temían las lesiones de las rodillas', en: 'Because doctors feared injuries to the knees' }, { es: 'Porque se hacía después de comer', en: 'Because it was done after meals' }],
    x: { es: 'El ejercicio debía ser suave, porque un esfuerzo excesivo agotaba esa energía, y combinaba respiración, movimiento y calma.', en: 'Exercise had to be gentle, because excessive effort drained that energy, and it combined breathing, movement and calm.' } },
  { s: 9, q: { es: '¿Por qué un cuerpo fuerte no daba prestigio en China, a diferencia del atleta griego?', en: 'Why did a strong body bring no prestige in China, unlike the Greek athlete?' },
    o: [{ es: 'Porque el confucianismo juzgaba a la persona por su virtud', en: 'Because Confucianism judged people by their virtue' }, { es: 'Porque los músculos eran cosa de comerciantes', en: 'Because muscles were for merchants' }, { es: 'Porque el emperador prohibió la lucha en las ciudades', en: 'Because the emperor banned wrestling in cities' }, { es: 'Porque los médicos lo tenían por una enfermedad del qi de los ricos', en: 'Because doctors saw it as a disease of the qi of the rich' }],
    x: { es: 'El taoísmo buscaba una vida larga en armonía con la naturaleza y el confucianismo juzgaba a la persona por su virtud, de modo que un cuerpo fuerte no daba prestigio.', en: 'Taoism sought a long life in harmony with nature and Confucianism judged people by their virtue, so a strong body brought no prestige.' } },
  { s: 12, q: { es: '¿Qué significa daoyin, el nombre de la gimnasia de salud china?', en: 'What does daoyin, the name of Chinese health gymnastics, mean?' },
    o: [{ es: '«Guiar y estirar»', en: '“Guiding and stretching”' }, { es: '«Habilidad lograda con esfuerzo»', en: '“Skill achieved through effort”' }, { es: '«Golpear»', en: '“Striking”' }, { es: '«Cuernos»', en: '“Horns”' }],
    x: { es: 'La gimnasia de salud china recibe el nombre de daoyin, «guiar y estirar», y se practicaba para prevenir la vejez y la enfermedad.', en: 'Chinese health gymnastics is called daoyin, “guiding and stretching”, and it was practised to prevent old age and illness.' } },
  { s: 12, q: { es: '¿Qué animales imita el juego de los cinco animales de Hua Tuo?', en: 'Which animals does Hua Tuo’s five animals game imitate?' },
    o: [{ es: 'Tigre, ciervo, oso, mono y pájaro', en: 'Tiger, deer, bear, monkey and bird' }, { es: 'Dragón, tigre, caballo, grulla y serpiente', en: 'Dragon, tiger, horse, crane and snake' }, { es: 'Buey, asno, caballo, perro y gallo de pelea', en: 'Ox, donkey, horse, dog and fighting cock' }, { es: 'León, elefante y mono', en: 'Lion, elephant and monkey' }],
    x: { es: 'El médico Hua Tuo ordenó esos ejercicios en el juego de los cinco animales, que imita los movimientos del tigre, el ciervo, el oso, el mono y el pájaro.', en: 'The physician Hua Tuo arranged those exercises into the five animals game, which imitates the movements of the tiger, deer, bear, monkey and bird.' } },
  { s: 12, q: { es: '¿Cuántas figuras tiene la pintura de Mawangdui, de una tumba cerrada en 168 a. C.?', en: 'How many figures does the Mawangdui painting, from a tomb closed in 168 BC, have?' },
    o: [{ es: '44', en: '44' }, { es: '12', en: '12' }, { es: '5', en: '5' }, { es: '8', en: '8' }],
    x: { es: 'Su imagen más antigua es una pintura sobre seda de una tumba de Mawangdui, cerrada en 168 a. C., con 44 figuras en posturas de estiramiento y respiración.', en: 'Its oldest image is a silk painting from a Mawangdui tomb, closed in 168 BC, with 44 figures in stretching and breathing postures.' } },
  { s: 14, q: { es: '¿Qué son los ocho brocados (ba duan jin)?', en: 'What are the eight brocades (ba duan jin)?' },
    o: [{ es: 'Ejercicios sencillos para cualquiera', en: 'Simple exercises for anyone' }, { es: 'Las ocho pruebas del examen militar de 702 d. C.', en: 'The eight tests of the AD 702 military exam' }, { es: 'Los uniformes de seda de los equipos oficiales', en: 'The silk uniforms of the official teams' }, { es: 'Ocho porterías', en: 'Eight goals' }],
    x: { es: 'A partir del siglo X d. C. aparecieron ejercicios sencillos que cualquiera podía hacer en cualquier lugar y a cualquier hora, como los ocho brocados, que todavía se practican hoy.', en: 'From the tenth century AD simple exercises appeared that anyone could do anywhere at any time, such as the eight brocades, still practised today.' } },
  { s: 15, q: { es: '¿Qué significa gongfu, de donde viene kung-fu?', en: 'What does gongfu, the source of kung fu, mean?' },
    o: [{ es: '«Habilidad lograda con esfuerzo»', en: '“Skill achieved through effort”' }, { es: '«Guiar y estirar el cuerpo»', en: '“Guiding and stretching the body”' }, { es: '«Puño del monje del monasterio»', en: '“Fist of the monastery monk”' }, { es: '«Trabajo de la energía vital»', en: '“Work of the vital energy”' }],
    x: { es: 'Kung-fu es una palabra que en chino (gongfu) significa «habilidad lograda con esfuerzo» y que en el siglo XX se generalizó en Occidente para nombrar las artes marciales chinas.', en: 'Kung fu is a word that in Chinese (gongfu) means “skill achieved through effort”, and in the twentieth century it spread in the West to name the Chinese martial arts.' } },
  { s: 15, q: { es: 'Según Shahar (2008), ¿de dónde procede la leyenda de Bodhidharma en Shaolin?', en: 'According to Shahar (2008), where does the Bodhidharma legend at Shaolin come from?' },
    o: [{ es: 'De un manual de 1624 con un prefacio falso', en: 'A 1624 manual with a false preface' }, { es: 'De las inscripciones del monasterio del siglo VII', en: 'The monastery’s seventh-century inscriptions' }, { es: 'De la biografía del médico Hua Tuo', en: 'The biography of the physician Hua Tuo' }, { es: 'De las películas de kung-fu del siglo XX', en: 'The kung fu films of the twentieth century' }],
    x: { es: 'La leyenda de Bodhidharma procede de un manual de 1624 d. C. con un prefacio falso, que dio a esas técnicas un origen antiguo y prestigioso (Shahar, 2008).', en: 'The Bodhidharma legend comes from an AD 1624 manual with a false preface, which gave those techniques an ancient and prestigious origin (Shahar, 2008).' } },
  // competición (diapositivas 17-21)
  { s: 17, q: { es: '¿Qué prueba física tenían los exámenes civiles desde el siglo VII d. C.?', en: 'What physical test did the civil examinations include from the seventh century AD?' },
    o: [{ es: 'Ninguna', en: 'None' }, { es: 'Arco', en: 'Bow' }, { es: 'Lanza', en: 'Lance' }, { es: 'Lucha', en: 'Wrestling' }],
    x: { es: 'Los cargos del Estado se ganaban con pruebas sobre los clásicos, sin ninguna prueba física, de modo que el ejercicio quedó para quien quería ser soldado.', en: 'State posts were won with tests on the classics, without any physical test, so exercise was left to those who wanted to be soldiers.' } },
  { s: 17, q: { es: 'Desde 702 d. C., ¿qué pedía el examen militar?', en: 'From AD 702, what did the military exam require?' },
    o: [{ es: 'Arco a pie y a caballo, lanza y fuerza', en: 'Bow on foot and horse, lance and strength' }, { es: 'Recitar los clásicos de Confucio de memoria', en: 'Reciting the Confucian classics by heart' }, { es: 'Ganar un partido de polo ante el emperador', en: 'Winning a polo match before the emperor' }, { es: 'Los cinco animales', en: 'The five animals' }],
    x: { es: 'El examen militar pedía tirar con arco a pie y a caballo, manejar la lanza montado y probar la fuerza, por ejemplo levantando el cerrojo de la puerta de una ciudad.', en: 'The military exam required archery on foot and on horseback, handling the lance mounted and proving strength, for example by lifting the bolt of a city gate.' } },
  { s: 18, q: { es: '¿Por qué los juegos jiaodi se llamaban «juegos de cuernos»?', en: 'Why were the jiaodi games called “horn games”?' },
    o: [{ es: 'Por los cascos con cuernos de los luchadores', en: 'For the wrestlers’ horned helmets' }, { es: 'Porque se tocaban cuernos de caza al empezar', en: 'Because hunting horns were blown at the start' }, { es: 'Porque luchaban bueyes ante la corte del emperador', en: 'Because oxen fought before the emperor’s court' }, { es: 'Porque el premio era un cuerno de marfil labrado', en: 'Because the prize was a carved ivory horn' }],
    x: { es: 'La lucha formaba parte de los juegos jiaodi («juegos de cuernos», por los cascos con cuernos de sus primeros luchadores), que mezclaban fuerza, acrobacia y danza.', en: 'Wrestling was part of the jiaodi games (“horn games”, after the horned helmets of their first wrestlers), which mixed strength, acrobatics and dance.' } },
  { s: 19, q: { es: '¿Qué era el jiju?', en: 'What was jiju?' },
    o: [{ es: 'El polo', en: 'Polo' }, { es: 'Un juego de palo y hoyos', en: 'A stick-and-holes game' }, { es: 'Lucha', en: 'Wrestling' }, { es: 'Danza', en: 'Dance' }],
    x: { es: 'El jiju era el polo: dos equipos de jinetes golpeaban una bola de madera o de hueso con mazas de cabeza curva.', en: 'Jiju was polo: two teams of riders struck a wooden or bone ball with curved-headed mallets.' } },
  { s: 19, q: { es: '¿A lomos de qué animal jugaban al jiju las mujeres, los mayores y la gente menos acomodada?', en: 'On which animal did women, the elderly and the less well-off play jiju?' },
    o: [{ es: 'De asnos', en: 'Donkeys' }, { es: 'De mulas', en: 'Mules' }, { es: 'De ponis', en: 'Ponies' }, { es: 'De yaks', en: 'Yaks' }],
    x: { es: 'Jugaban una versión más tranquila a lomos de asnos, y los huesos hallados en la tumba de una dama del siglo IX d. C. muestran que se criaban para el juego (Hu et al., 2020).', en: 'They played a calmer version on donkeys, and bones found in the tomb of a ninth-century lady show they were bred for the game (Hu et al., 2020).' } },
  { s: 20, q: { es: '¿Qué significa chuiwan?', en: 'What does chuiwan mean?' },
    o: [{ es: '«Golpear la bola»', en: '“Striking the ball”' }, { es: '«Pelota de la corte»', en: '“The court’s ball”' }, { es: '«Cinco animales»', en: '“Five animals”' }, { es: '«Guiar»', en: '“Guiding”' }],
    x: { es: 'El chuiwan («golpear la bola») consistía en llevar una bola de madera hasta unos hoyos golpeándola con palos de madera y bambú.', en: 'Chuiwan (“striking the ball”) consisted of driving a wooden ball into holes by striking it with wooden and bamboo sticks.' } },
  { s: 20, q: { es: '¿Con qué deporte se ha comparado a menudo el chuiwan?', en: 'Which sport has chuiwan often been compared with?' },
    o: [{ es: 'El golf', en: 'Golf' }, { es: 'El voleibol de playa', en: 'Beach volleyball' }, { es: 'El fútbol escolar', en: 'School football' }, { es: 'El polo', en: 'Polo' }],
    x: { es: 'Se pedía jugar con calma y buenos modales, y por eso se ha comparado a menudo con el golf, aunque nada indica que uno derive del otro.', en: 'Players were expected to play calmly and with good manners, which is why it has often been compared with golf, although nothing suggests one derives from the other.' } }

  function consejoRacha(n) {

  async function celebrar() { SND.ovacion(1); ESC.aplauso(1); accion(yo, 'victoria', 1.6); aviso(t('superada'), '', 1500); await espera(1700); }

  /* ---------------- III: la baida ---------------- */
  const AR = ESC.BAIDA;
  /* parábola que sale de S, pasa a la altura hy por el plano de la red (z = AR.z) y termina en L */
  function parabola(S, L, hy, g) {
    const f = (AR.z - S.z) / (L.z - S.z);
    const num = hy - S.y - (L.y - S.y) * f; const T = Math.sqrt(Math.max(.1, num / (.5 * g * f * (1 - f))));
    const vy = (L.y - S.y + .5 * g * T * T) / T;
    return { S: S.clone(), L: L.clone(), T, vy, f, g, t: 0, th: f * T };
  }
  function posParabola(v, tt, out) { const k = tt / v.T; out.set(v.S.x + (v.L.x - v.S.x) * k, v.S.y + v.vy * tt - .5 * v.g * tt * tt, v.S.z + (v.L.z - v.S.z) * k); return out; }
  const PV = new THREE.Vector3();
  function tickVuelo(dt) {
    const v = ST.vuelo; const t0 = v.t; v.t += dt;
    if (v.red && v.t >= v.th) { // choca con la red y cae hacia atrás
      posParabola(v, v.th, PV); ST.bx = PV.x; ST.by = PV.y; ST.bz = AR.z + (v.L.z > v.S.z ? -.15 : .15);
      ST.vx = (v.L.x - v.S.x) / v.T * .2; ST.vy = -1; ST.vz = v.L.z > v.S.z ? -.6 : .6; ST.plano = ST.bz + ST.vz * 1.2;
      ST.vuelo = null; SND.red(); if (v.alRed) v.alRed(); return;
    }
    if (t0 < v.th && v.t >= v.th && v.alPasar) v.alPasar();
    posParabola(v, Math.min(v.t, v.T), PV); ST.bx = PV.x; ST.by = PV.y; ST.bz = PV.z;
    if (v.t >= v.T) { const vyFin = v.vy - v.g * v.T; ST.vuelo = null; if (v.alLlegar) v.alLlegar(vyFin, (v.L.x - v.S.x) / v.T); }
  }
  function posesion() { // de uno a tres toques y el tiro; o falta, o el balón al suelo
    return new Promise(res => {
      ST.toques = 0; ST.permitirTiro = true;
      ST.alTocar = () => { if (ST.toques >= 3) { res({ falta: true }); return false; } return true; };
      ST.alCaer = () => res({ cae: true });
      ST.alTiro = q => res({ tiro: q });
    }).then(r => { ST.alTocar = ST.alCaer = ST.alTiro = null; ST.permitirTiro = false; return r; });
  }
  function tiroNuestro(q) { // el error depende de la calidad del toque, de la calma y de lo lejos que estés del centro
    const err = (.08 + (1 - q) * .62) * (1 - ST.calma * .15) + Math.abs(ST.px) * .06;
    const ex = (Math.random() - .5) * 2 * err, ey = (Math.random() - .5) * 2 * err * .8, pasa = Math.hypot(ex, ey) < AR.radio - .11;
    const rv = rivales[(Math.random() * 3) | 0];
    return new Promise(res => {
      ST.vuelo = Object.assign(parabola(new THREE.Vector3(ST.bx, ST.by, ST.bz), new THREE.Vector3(0, .95, rv.z + .3), AR.aro.y + ey, BOLAS.vejiga.g), { red: !pasa, alRed: () => res({ r: 'red', rv }), alPasar: () => SND.aire(), alLlegar: () => { ST.fase = 'rival'; res({ r: 'pasa', rv }); } });
      const v = ST.vuelo; v.L.x = Math.max(-3.2, Math.min(3.2, (ex - v.S.x * (1 - v.f)) / v.f));
      rv.mov = true; const mv = ticker(dt => { rv.x += Math.sign(v.L.x - rv.x) * Math.min(Math.abs(v.L.x - rv.x), dt * 2.6); if (!ST.vuelo || ST.vuelo !== v) { rv.mov = false; mv(); } });
    });
  }
  async function jugarBaida(tk, Pr, calma) {
    MODO = 'juego'; document.body.classList.add('juego'); mandos(true, true);
    ST.calma = calma; ST.activo = true; ST.guia = t('gBaida');
    const pts = { yo: 0, rival: 0 };
    let saca = 'yo';
    const pintar = () => tanteo(`<span>${t('tu')}</span>${pts.yo}<span>·</span>${pts.rival}<span>${t('rival')}</span><span class="toques">${[1, 2, 3].map(i => `<i class="${ST.toques >= i ? 'on' : ''}"></i>`).join('')}</span>`);
    const mt = ticker(() => { if (tk !== token) { mt(); return; } pintar(); });
    hud(`<b>${L(Pr.titulo)}</b><span>${es() ? 'Primero a 5' : 'First to 5'} · ${t('calma')} <span class="rombos">${'◆'.repeat(ST.calma)}${'◇'.repeat(3 - ST.calma)}</span></span>`);
    const punto = async (quien, txt) => {
      pts[quien]++;
      if (quien === 'yo') { SND.acierto(); ESC.aplauso(.8); accion(yo, 'victoria', 1); } else SND.fallo();
      aviso(txt, quien === 'yo' ? (es() ? 'Punto para ti' : 'Point to you') : (es() ? 'Punto para el rival' : 'Point to the rival'), 1300);
      await esperaJuego(1600);
    };
    while (tk === token && pts.yo < Pr.meta && pts.rival < Pr.meta) {
      ST.vuelo = null; ST.vz = 0; ST.plano = ST.pz + .3 * ST.mira; ST.bz = ST.plano;
      rivales.forEach((c, i) => { c.x = (i - 1) * 2.2; c.mov = false; c.obj = 'listo'; });
      if (saca === 'yo') { ST.fase = 'espera'; guia(t('saque')); }
      else { ST.fase = 'rival'; guia(''); await saqueRival(tk); if (tk !== token) break; }
      // la jugada: posesión nuestra, tiro, respuesta del rival, y otra vez
      for (;;) {
        const r = await posesion(); if (tk !== token) break;
        if (r.falta) { await punto('rival', t('demasiados')); saca = 'rival'; break; }
        if (r.cae) { await punto('rival', t('alSuelo')); saca = 'rival'; break; }
        const tr = await tiroNuestro(r.tiro); if (tk !== token) break;
        if (tr.r === 'red') { await espera(700); await punto('rival', t('red')); saca = 'rival'; break; }

      }
    }

    if (gana) await celebrar(); else { SND.derrota(); await espera(800); }

  }
  /* el rival recibe, da dos toques y tira; si devuelve, el balón cruza el círculo hacia nuestro lado */
  async function rivalJuega(tk, rv, devuelve) {
    const g = BOLAS.vejiga.g;
    rv.x = ST.bx;
    for (let k = 0; k < 2; k++) {
      // toque del rival: el balón sube y vuelve a sus pies
      accion(rv, k ? 'rodD' : 'pieD', .25); SND.pie(true, .7);
      const S = new THREE.Vector3(ST.bx, ST.by, ST.bz), L = new THREE.Vector3(rv.x + (Math.random() - .5) * .2, .45, rv.z + .3);
      await new Promise(res => { ST.vuelo = { S, L, T: .95, vy: (L.y - S.y + .5 * g * .95 * .95) / .95, f: 2, g, t: 0, th: 99, alLlegar: () => res() }; });
      if (tk !== token) return false;
    }
    accion(rv, 'tiro', .35); SND.pie(true, 1);
    const S = new THREE.Vector3(ST.bx, ST.by, ST.bz);
    const Lx = Math.max(-2.2, Math.min(2.2, ST.px + (Math.random() - .5) * 3.4));
    const L = new THREE.Vector3(Lx, 2.1, ST.plano);
    const fallo = !devuelve, ex = fallo ? (Math.random() < .5 ? -1 : 1) * (AR.radio + .15 + Math.random() * .5) : (Math.random() - .5) * .3, ey = fallo ? (Math.random() - .5) * .5 : 0;
    const r = await new Promise(res => {
      ST.vuelo = Object.assign(parabola(S, L, AR.aro.y + ey, g), { red: fallo, alRed: () => { ST.fase = 'aire'; res(false); }, alPasar: () => SND.aire(), alLlegar: (vy, vx) => { ST.vy = Math.max(vy, -3.2); ST.vx = vx * .5; ST.fase = 'aire'; res(true); } });
      const v = ST.vuelo; v.L.x = Math.max(-2.6, Math.min(2.6, (ex - v.S.x * (1 - v.f)) / v.f));
    });
    if (!r) { await espera(900); return false; }
    aviso('', t('devuelve'), 900); ST.plano = ST.pz + .3 * ST.mira; ST.bz = ST.plano;
    return true;
  }
  async function saqueRival(tk) { // el rival saca desde su lado: el balón llega por el círculo
    const rv = rivales[1]; ST.fase = 'rival'; ST.bx = rv.x; ST.by = .5; ST.bz = rv.z + .3; ST.vuelo = null;
    await espera(600); if (tk !== token) return;
    const S = new THREE.Vector3(ST.bx, ST.by, ST.bz), L = new THREE.Vector3(Math.max(-2, Math.min(2, (Math.random() - .5) * 3)), 2.1, ST.plano);
    accion(rv, 'tiro', .35); SND.pie(true, 1);
    await new Promise(res => {
      ST.vuelo = Object.assign(parabola(S, L, AR.aro.y, BOLAS.vejiga.g), { alLlegar: (vy, vx) => { ST.vy = Math.max(vy, -3.2); ST.vx = vx * .5; ST.fase = 'aire'; res(); } });
      const v = ST.vuelo; v.L.x = Math.max(-2.6, Math.min(2.6, (0 - v.S.x * (1 - v.f)) / v.f));
    });

  }
  function tirar() {
    if (!ST.activo || pausado || !ST.permitirTiro || !ST.alTiro || ST.vuelo) return;
    if (ST.fase === 'espera') return toque();
    if (ST.fase !== 'aire' || ST.cool > 0) return;
    if (ST.toques < 1) { aviso('', es() ? 'Primero controla el balón con un toque' : 'Control the ball with a touch first', 1000); return; }
    if (ST.fallida || ST.buffer) return;
    const adel = Math.min(.05, (performance.now() - tUltimo) / 1000), m = mejorZona(adel), W = ventana();
    if (!m || m.k !== 'pie' || m.dt > W + VENT.antes) { if (m && m.dt > W + VENT.pronto) return; return fallo('pronto'); }
    if (m.dt < -W) return fallo('tarde');
    if (!alcanceOk('pie', Math.max(0, m.dt))) return fallo('lejos');
    const q = Math.max(0, 1 - Math.max(0, Math.abs(m.dt) - (m.dt > W ? 0 : 0)) / (W + VENT.antes)) * (1 - Math.min(1, Math.abs(ST.bx - ST.px) / ZONAS.pie.alcance) * .4);
    accion(yo, 'tiro', .35); SND.pie(true, 1); ST.permitirTiro = false; ST.cool = .4;
    const f = ST.alTiro; ST.alTiro = null; f(q);
  }

  }

  window.render_game_to_text = () => JSON.stringify({ coordenadas: 'x a la derecha del jugador que mira a cámara, y hacia arriba, metros', modo: MODO, pausado, fase: ST.fase, bola: { x: +ST.bx.toFixed(2), y: +ST.by.toFixed(2), z: +ST.bz.toFixed(2), vx: +ST.vx.toFixed(2), vy: +ST.vy.toFixed(2), tipo: ST.bolaK }, jugador: { x: +ST.px.toFixed(2) }, zona: ST.activo ? zonaDe() : null, racha: ST.racha, toques: ST.toques, calma: ST.calma, vuelo: !!ST.vuelo, hechas: P.hechas, mejor: P.mejor });
  window.CUJU = { P, ST, prueba, portada, toque, tirar, zona: () => zonaDe(), ZONAS };

  enlazar();
  cargar();
})();
