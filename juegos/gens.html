<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a1606">
<title>Gens · Historiapp</title>
<style>
/* Gens · mapa a pantalla completa, barra de recursos arriba y panel de decisiones (abajo en vertical, a la derecha en horizontal).
   Correcto en azul y error en naranja, siempre con símbolo o texto (daltonismo). */
:root{--gold:#ffd85c;--gold2:#f0a91c;--goldD:#a8650c;--ink:#2a1606;--blue:#2f6fd6;--ok:#2f6fd6;--ko:#d9700f;
  --pbg:#f6ecd2;--ptx:#3a2410;--pmu:#7a6040;--pedge:#c79a3a;--card:#fffaf0;--hbg:rgba(42,22,6,.92);--htx:#fff6e3;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
html.dark{--pbg:#1f170f;--ptx:#fff6e3;--pmu:#cdbb98;--pedge:#8a6a2a;--card:#2c2117;--ok:#5a9cf0;--ko:#f39a3c;--hbg:rgba(14,9,5,.94)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#a9c9db;color:var(--ptx);font-family:"Avenir Next","Trebuchet MS","Segoe UI",system-ui,sans-serif;-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none}
html.dark,html.dark body{background:#16293a}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
button[disabled]{opacity:.45;cursor:not-allowed}
#map{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none}
#map svg{width:100%;height:100%;display:block}
.node{cursor:pointer}
.lbl{font-weight:800;fill:#2a1606;paint-order:stroke;stroke:#fffaf0;stroke-linejoin:round;pointer-events:none}
html.dark .lbl{fill:#fff6e3;stroke:#140e0a}
.node.sel .lbl{fill:#7a1f2b}html.dark .node.sel .lbl{fill:var(--gold)}
/* barra */
#hud{position:fixed;top:0;left:0;right:0;z-index:5;background:var(--hbg);color:var(--htx);padding:calc(var(--st) + 6px) calc(var(--sr) + 10px) 6px calc(var(--sl) + 10px);border-bottom:2px solid var(--goldD);box-shadow:0 4px 14px rgba(0,0,0,.3)}
.hrow{display:flex;align-items:center;gap:8px;min-height:36px}
.hrow.era b{font-family:Georgia,serif;font-size:15px;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.hrow .yr{font-size:13px;font-weight:700;opacity:.85;white-space:nowrap}
.sp{flex:1}
.apb{color:var(--gold);font-size:18px;letter-spacing:2px}.apb i{font-style:normal;opacity:.25}
.ib{min-width:38px;height:36px;border-radius:10px;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,216,92,.4);font-weight:800;padding:0 8px}
.ib.wide{padding:0 12px}
.hrow.res{gap:4px;justify-content:space-between}
.r{display:flex;flex-direction:column;align-items:flex-start;min-width:0;flex:1;line-height:1.1}
.r small{font-size:10px;letter-spacing:.06em;text-transform:uppercase;opacity:.75;font-weight:800}
.r b{font-size:17px;font-variant-numeric:tabular-nums;color:#fff}
.r em{font-style:normal;font-size:10px;color:var(--gold);font-weight:800}
.r:first-child{flex:1.5}
.mini{display:block;width:90%;max-width:70px;height:4px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:2px}
.mini i{display:block;height:100%;background:var(--gold)}.mini.p i{background:#8fc0ff}
.menu{display:none;gap:8px;padding:8px 0 4px;flex-wrap:wrap}.menu.on{display:flex}.menu .btn{flex:1;min-width:120px;margin:0}
.pulse{animation:pu .5s}@keyframes pu{50%{transform:scale(1.25)}}
/* panel */
#panel{position:fixed;z-index:4;left:0;right:0;bottom:0;max-height:52vh;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--pbg);color:var(--ptx);
  border-top:3px solid var(--pedge);border-radius:18px 18px 0 0;padding:16px calc(var(--sr) + 16px) calc(var(--sb) + 14px) calc(var(--sl) + 16px);box-shadow:0 -8px 28px rgba(0,0,0,.35);transition:transform .28s ease;overscroll-behavior:contain}
#panel.tall{max-height:70vh}#panel.short{max-height:40vh}
#panel.out{transform:translateY(110%)}
@media (min-width:700px) and (orientation:landscape){
  #panel,#panel.tall,#panel.short{left:auto;top:var(--hudH,92px);width:400px;max-height:none;border-top:0;border-left:3px solid var(--pedge);border-radius:18px 0 0 0}
  #panel.out{transform:translateX(110%)}
}
@media (min-width:1000px) and (orientation:landscape){#panel,#panel.tall,#panel.short{width:440px}}
#panel h2{font-family:Georgia,"Times New Roman",serif;font-size:22px;margin:4px 0 8px;line-height:1.15}
#panel h3{font-size:16px;margin:12px 0 8px}
#panel p{font-size:15px;line-height:1.45;margin:0 0 10px}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--pmu);border:1.5px solid var(--pedge);border-radius:999px;padding:2px 9px}
.src,#panel p.src{font-size:12.5px;color:var(--pmu);line-height:1.4}
.note,#panel p.note{background:var(--card);border-left:4px solid var(--gold2);border-radius:8px;padding:8px 10px;font-size:14px}
.logo{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:50px;letter-spacing:.2em;color:var(--gold2);text-shadow:0 3px 0 #6a3a0a;text-align:center;line-height:1;margin:2px 0 4px}
.tl{text-align:center;font-weight:700;color:var(--pmu)}
details{margin-top:8px;font-size:14px}summary{cursor:pointer;font-weight:800;color:var(--pmu);padding:6px 0}
.btn{display:block;width:100%;margin:8px 0;padding:13px 14px;border-radius:14px;font-weight:900;font-size:16px;color:var(--ink);background:linear-gradient(#ffe48a,var(--gold2));border:2px solid var(--goldD);box-shadow:0 4px 0 var(--goldD);text-align:center}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--goldD)}
.btn.dark{background:#3a2a1a;color:#fff6e3;border-color:#1b120a;box-shadow:0 4px 0 #1b120a}
.btn.blue{background:linear-gradient(#5a95ef,var(--blue));color:#fff;border-color:#1f4a99;box-shadow:0 4px 0 #1f4a99}
.btn.hint{animation:gl 1.6s infinite}@keyframes gl{50%{box-shadow:0 4px 0 var(--goldD),0 0 0 6px rgba(255,216,92,.45)}}
.row{display:flex;gap:10px}.row>*{flex:1}
.stick{position:sticky;bottom:calc(-14px - var(--sb));background:linear-gradient(transparent,var(--pbg) 30%);padding:12px 0 2px;margin-top:4px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border-radius:12px;background:var(--card);border:2px solid var(--pedge);font-size:15px;line-height:1.35;color:var(--ptx)}
.opt b{display:block}.opt small{display:block;font-size:12.5px;color:var(--pmu);margin-top:3px}
.opt.act{font-weight:800}
.opt.ok{border-color:var(--ok);box-shadow:inset 0 0 0 2px var(--ok)}.opt.ok::before{content:"✔ ";color:var(--ok)}
.opt.ko{border-color:var(--ko);box-shadow:inset 0 0 0 2px var(--ko)}.opt.ko::before{content:"✖ ";color:var(--ko)}
.opt.dim{opacity:.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid2 .opt{text-align:center;margin:0;padding:16px 8px;font-family:Georgia,serif;font-size:17px}
.fb{border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14.5px;line-height:1.4;background:var(--card)}
.fb.ok{border:2px solid var(--ok)}.fb.ko{border:2px solid var(--ko)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--pedge);font-size:15px}
.seg{display:flex;gap:6px;margin:8px 0}.sg{flex:1;padding:8px 4px;border-radius:12px;border:2px solid var(--pedge);background:var(--card);text-align:center;color:var(--ptx)}
.sg b{display:block;font-size:15px}.sg small{display:block;font-size:11px;color:var(--pmu);line-height:1.2;margin-top:2px}
.sg.on{background:linear-gradient(#ffe48a,var(--gold2));color:var(--ink);border-color:var(--goldD)}.sg.on small{color:#5a3a10}
.stepper{display:flex;align-items:center;justify-content:center;gap:18px;margin:10px 0}
.stepper button{width:48px;height:48px;border-radius:50%;font-size:26px;font-weight:900;background:var(--card);border:2px solid var(--pedge);color:var(--ptx)}
.stepper .n{font-size:34px;font-weight:900;font-variant-numeric:tabular-nums;display:block;text-align:center;line-height:1}.stepper .u{font-size:12px;color:var(--pmu);font-weight:800}
.money{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;background:var(--card);border-radius:12px;padding:10px 12px;font-size:14.5px;align-items:center}
.money b{text-align:right;font-variant-numeric:tabular-nums}.money .y{grid-column:1/-1;text-align:right;font-size:12px;color:var(--pmu)}
.delta{font-weight:900;white-space:nowrap}.delta.up{color:var(--ok)}.delta.dn{color:var(--ko)}.delta.z{color:var(--pmu)}
.shout{text-align:center;font-family:Georgia,serif;font-size:28px;font-weight:700;margin:4px 0 10px}
.dec{flex:1;border-radius:14px;padding:12px 8px;text-align:center;border:2px solid;background:var(--card);color:var(--ptx)}
.dec.mis{border-color:var(--ok)}.dec.iug{border-color:var(--ko)}
.dec .t{font-size:18px;font-weight:900}.dec .s{font-size:12px;color:var(--pmu);margin-bottom:6px}.dec .c{font-size:13px;line-height:1.45}
.verdict{text-align:center;font-family:Georgia,serif;font-size:34px;font-weight:700;margin:6px 0}
.chron{padding-left:18px;margin:6px 0 12px;font-size:14px;line-height:1.45}.chron li{margin-bottom:4px}.chron b{color:var(--pmu)}
.quote{font-family:Georgia,serif;font-style:italic;font-size:15px;line-height:1.45;border-left:3px solid var(--gold2);padding:4px 0 4px 12px;margin:10px 0}
/* cartel y aviso */
#banner{position:fixed;z-index:6;left:50%;top:42%;transform:translate(-50%,-50%) scale(.8);opacity:0;pointer-events:none;text-align:center;background:rgba(42,22,6,.92);color:var(--gold);border:2px solid var(--gold2);border-radius:18px;padding:14px 26px;max-width:88vw}
#banner b{display:block;font-family:Georgia,serif;font-size:30px;letter-spacing:.08em}#banner small{display:block;color:#fff6e3;font-weight:700;margin-top:4px}
#banner.on{animation:bn 2.2s ease forwards}
@keyframes bn{0%{opacity:0;transform:translate(-50%,-50%) scale(.8)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}20%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
#toast{position:fixed;z-index:7;left:50%;top:calc(var(--st) + 100px);transform:translateX(-50%) translateY(-10px);opacity:0;transition:.25s;background:#140e0a;color:#fff6e3;border:1.5px solid var(--gold2);border-radius:999px;padding:8px 16px;font-weight:800;font-size:14px;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="map" aria-label="Mapa del Mediterráneo"></div>
<div id="hud"></div>
<div id="banner"></div>
<div id="panel" class="out"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>// ===== Gens · base.js =====
// ===== Editor · enlace con Historiapp y utilidades =====
const IN_APP = (function () { try { if (!/\/juegos\//.test(location.pathname)) return false; for (let i = 0; i < localStorage.length; i++) { if (String(localStorage.key(i)).indexOf('historiapp.') === 0) return true; } } catch (e) {} return false; })();
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function appLang() { try { const v = localStorage.getItem('historiapp.lang'); if (v) { const s = v.replace(/"/g, ''); if (s === 'es' || s === 'en') return s; } } catch (e) {} return null; }
let LANG = (IN_APP ? appLang() : lsGet('gens.lang', null)) || appLang() || (/^es/i.test(navigator.language || 'es') ? 'es' : 'en');
function addXP(n) { if (!IN_APP || !(n > 0)) return; try { const k = 'historiapp.progress'; const p = JSON.parse(localStorage.getItem(k)) || { xp: 0, streak: 0, lastDay: null, seen: {}, badges: {}, gl: {}, daily: {} }; p.xp = (p.xp || 0) + n; localStorage.setItem(k, JSON.stringify(p)); } catch (e) { return; } toast('+' + n + ' XP'); }
function track(path) { try { if (window.goatcounter && goatcounter.count) goatcounter.count({ path: '/juego/gens/' + path, event: true }); } catch (e) {} }
function fmtN(n) { const s = String(Math.round(Math.abs(n))); const r = s.replace(/\B(?=(\d{3})+(?!\d))/g, LANG === 'es' ? '.' : ','); return (n < 0 ? '−' : '') + r; }
function HS(n) { return fmtN(n) + ' HS'; }
function yrs(hs) { let s = (Math.round(hs / 1400 * 10) / 10).toFixed(1); if (s.endsWith('.0')) s = s.slice(0, -2); if (LANG === 'es') s = s.replace('.', ','); return s; }
function yTxt(hs) { const s = yrs(hs); const one = s === '1'; return LANG === 'es' ? ('= ' + s + (one ? ' año' : ' años') + ' de legionario') : ('= ' + s + (one ? ' year' : ' years') + " of a legionary's pay"); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function L(o) { return o ? (o[LANG] || o.es) : ''; }
function md(s) { return String(s).replace(/\*([^*]+)\*/g, '<em>$1</em>'); }
function dl(n) { return '<span class="delta ' + (n > 0 ? 'up' : n < 0 ? 'dn' : 'z') + '">' + (n > 0 ? '▲ +' : n < 0 ? '▼ ' : '= ') + n + '</span>'; }
let toastT = null; function toast(s) { const t = document.getElementById('toast'); if (!t) return; t.textContent = s; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1900); }
function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

// ===== Gens · sound.js =====
// ===== Editor · sonido sintetizado (sin archivos) =====
/* Sonido sintetizado, sin archivos; nada suena hasta el primer toque */
const SND={on:lsGet("gens.sound",true),ctx:null};
function ac(){if(!SND.on)return null;try{if(!SND.ctx)SND.ctx=new (window.AudioContext||window.webkitAudioContext)();if(SND.ctx.state==="suspended")SND.ctx.resume();return SND.ctx}catch(e){return null}}
function tone(f,d,type,vol,when,slide){const c=ac();if(!c)return;const t=c.currentTime+(when||0);const o=c.createOscillator(),g=c.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||.15,t+.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.05)}
function noise(d,vol,freq,q,when){const c=ac();if(!c)return;const t=c.currentTime+(when||0);const len=Math.floor(c.sampleRate*d);const b=c.createBuffer(1,len,c.sampleRate);const x=b.getChannelData(0);for(let i=0;i<len;i++)x[i]=(Math.random()*2-1);const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type="bandpass";f.frequency.value=freq||900;f.Q.value=q||.7;const g=c.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||.2,t+d*.25);g.gain.exponentialRampToValueAtTime(0.0001,t+d);s.connect(f).connect(g).connect(c.destination);s.start(t)}
const SFX={
 tap(){tone(660,.06,"triangle",.06)},
 coin(){tone(1320,.08,"square",.05);tone(1760,.12,"square",.04,.07)},
 good(){tone(523,.12,"triangle",.12);tone(659,.12,"triangle",.12,.1);tone(784,.2,"triangle",.12,.2)},
 bad(){tone(330,.18,"sawtooth",.07,0,250);tone(247,.28,"sawtooth",.06,.16,180)},
 cheer(){noise(1.4,.22,1100,.5);noise(1.1,.12,2400,1,.2)},
 boo(){noise(1.2,.18,380,.9);tone(140,.9,"sawtooth",.04,0,110)},
 tuba(){[196,196,262,330].forEach((f,i)=>tone(f,.22,"sawtooth",.07,i*.2))},
 hoof(){for(let i=0;i<14;i++)noise(.06,.08,300,2,i*.12)},
 fanfare(){[392,523,659,784,1047].forEach((f,i)=>tone(f,.25,"triangle",.11,i*.13))}
};


/* Ambiente de grada: ruido filtrado en bucle, con volumen según el ánimo */
const AMB={g:null,src:null,set(level){const c=ac();if(!c)return;if(!AMB.g){const len=c.sampleRate*2,b=c.createBuffer(1,len,c.sampleRate),x=b.getChannelData(0);let last=0;for(let i=0;i<len;i++){last=last*.97+(Math.random()*2-1)*.03;x[i]=last*6+(Math.random()*2-1)*.04}const s=c.createBufferSource();s.buffer=b;s.loop=true;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=700;f.Q.value=.4;const g=c.createGain();g.gain.value=0;s.connect(f).connect(g).connect(c.destination);s.start();AMB.g=g;AMB.src=s}AMB.g.gain.setTargetAtTime(SND.on?level:0,c.currentTime,.4)}};

// ===== Gens · data.js =====
// ===== Gens · datos, épocas, sucesos y textos (castellano e inglés) =====
// Regla: solo datos que están en pantalla en «TEMA 4. Etruria y Roma - 21 OCT» (Dnn = diapositiva).
// Lo que no está en el tema es convención del juego y se dice en pantalla (CONV).
const CFG = {
  pay: 1400,                              // D36: paga anual de un legionario
  census: 1000000,                        // D84, D115: patrimonio mínimo de un senador
  tier: { s: 2000, m: 7500, c: 50000 },   // D37: día de munus en ciudad pequeña, media (punto medio de 5.000-10.000, CONV) y capital
  glad: { cond: 600, vol: 2000, vet: 12000, top: 15000 }, // D55: precios máximos de 177 d. C.
  // CONV (convenciones del juego)
  start: 400000, rent: 60000, manage: 60000, decay: .85, ap: 2,
  build: { amph: 600000, therm: 150000 },
  fav: { munus: 6, venat: 4, ludi: 5, amphBonus: 3, beasts: 3, mY: 6, mN: -8, iY: 8, iN: -4, sI: 3, sM: 0 },
  glo: { edil: 6, consul: 12, senate: 8, duo: 4, amph: 10, therm: 4, quiz: 3, bigGames: 2 },
  elect: { edil: 35, consul: 55, consulPre: 30 },
  crowdBag: ['m', 'm', 'm', 'i', 'i', 'i', 's', 's'],
  gladBag: ['vol', 'vol', 'vol', 'vet', 'vet', 'vet', 'top', 'top']
};

/* Ciudades y lugares. tier: s/m/c (coste del día de juegos); g: se pueden dar juegos; r: recurso. lon/lat aproximados. */
const CITIES = [
  { id: 'roma', lon: 12.5, lat: 41.9, tier: 'c', g: true, b: { circ: 1 }, n: { es: 'Roma', en: 'Rome' }, src: 'D76, D98' },
  { id: 'capua', lon: 14.25, lat: 41.08, tier: 'm', g: true, r: 'ludus', n: { es: 'Capua', en: 'Capua' }, src: 'D53' },
  { id: 'pompeya', lon: 14.48, lat: 40.75, tier: 's', g: true, b: { amph: 1 }, n: { es: 'Pompeya', en: 'Pompeii' }, src: 'D44, D53' },
  { id: 'fucino', lon: 13.55, lat: 42.0, n: { es: 'Lago Fucino', en: 'Lake Fucinus' }, src: 'D72' },
  { id: 'urso', lon: -5.1, lat: 37.24, tier: 's', g: true, n: { es: 'Urso (Osuna)', en: 'Urso (Osuna)' }, src: 'D37' },
  { id: 'italica', lon: -6.04, lat: 37.44, tier: 'm', g: true, n: { es: 'Itálica', en: 'Italica' }, src: 'D44, D73' },
  { id: 'merida', lon: -6.34, lat: 38.92, tier: 'm', g: true, r: 'horses', n: { es: 'Mérida (Lusitania)', en: 'Mérida (Lusitania)' }, src: 'D80, D84' },
  { id: 'cartago', lon: -0.99, lat: 37.6, tier: 'm', g: true, n: { es: 'Carthago Nova', en: 'Carthago Nova' }, src: 'D73' },
  { id: 'eldjem', lon: 10.7, lat: 35.3, tier: 'm', g: true, n: { es: 'El Djem', en: 'El Djem' }, src: 'D44, D73' },
  { id: 'pula', lon: 13.85, lat: 44.87, tier: 'm', g: true, n: { es: 'Pula', en: 'Pula' }, src: 'D44' },
  { id: 'efeso', lon: 27.34, lat: 37.94, tier: 'm', g: true, n: { es: 'Éfeso', en: 'Ephesus' }, src: 'D64' },

    t: { es: 'I. Los primeros munera', en: 'I. The first munera' },
    rules: { es: 'El primer combate de gladiadores documentado en Roma se fecha en 264 a. C., cuando tres parejas de esclavos combatieron en el Foro Boario, el mercado de ganado junto al Tíber, en el *munus* de un padre difunto. El *munus* era la obligación de un hijo con su padre muerto, mientras que los *ludi* del calendario religioso los pagaba el Estado. En esta época solo puedes dar juegos en Roma.',

  { id: 4, turns: 4, years: ['52 d. C.', '80 d. C.', '107 d. C.', '177 d. C.'], focus: 'all',

    rules: { es: 'Es el apogeo de los combates, con la construcción del Coliseo. En Occidente cualquier ciudad de cierta entidad quería su anfiteatro, pagado por sus élites locales, y por eso fue uno de los símbolos más reconocibles de la romanización. En Roma, en cambio, los grandes espectáculos acabaron en manos del poder imperial, y un particular necesitaba permiso para dar juegos.',

function dayCost(id) { const c = CITY[id]; let d = CFG.tier[c.tier]; if (S.era === 5) d = Math.round(d * 1.5); return d; }

function verdict(id) {
