<script>
/* Puente con Historiapp. Lo inserta hacer_historiapp.py en la versión <juego>-historiapp.html.
   Configuración en window.HAPP_CFG = { tema, volver, orient, fichas, enlaces, barra, barraEn, barraClase, css }.
   1. Idioma: toma historiapp.lang si existe y lo presenta al juego como navigator.language.
   2. Sonido: ningún AudioContext ni <audio> suena hasta el primer toque (iOS lo bloquea).
   3. Dentro de la app (carpeta juegos/ y alguna clave historiapp.* en el mismo origen):
      XP en historiapp.progress, botón para volver, enlaces a fichas.
   4. Aviso de girar el dispositivo cuando el juego necesita la otra orientación (C.orient). */
(function () {
  'use strict';
  var C = window.HAPP_CFG || {};
  var inApp = false, lang = null;
  try {
    if (/\/juegos\//.test(location.pathname)) {
      for (var i = 0; i < localStorage.length; i++) {
        if (String(localStorage.key(i)).indexOf('historiapp.') === 0) { inApp = true; break; }
      }
    }
  } catch (e) {}
  try { lang = localStorage.getItem('historiapp.lang'); } catch (e) {}
  if (lang !== 'es' && lang !== 'en') lang = null;
  if (lang) {
    var tag = lang === 'en' ? 'en-GB' : 'es-ES';
    try {
      Object.defineProperty(Navigator.prototype, 'language', { get: function () { return tag; }, configurable: true });
      Object.defineProperty(Navigator.prototype, 'languages', { get: function () { return [tag]; }, configurable: true });
    } catch (e) {}
    try { document.documentElement.lang = lang; } catch (e) {}
  }
  var EN = (lang || (String(navigator.language || 'es').toLowerCase().indexOf('es') === 0 ? 'es' : 'en')) === 'en';
  var T = EN
    ? { back: 'Historiapp', xp: '+{n} XP in Historiapp', rot: 'Rotate your device to play', ficha: 'Read the study sheet' }
    : { back: 'Historiapp', xp: '+{n} XP en Historiapp', rot: 'Gira el dispositivo para jugar', ficha: 'Leer la ficha' };

  /* ---------- Sonido tras el primer toque ---------- */
  var unlocked = false, ctxs = [], pend = [];
  var AC = window.AudioContext || window.webkitAudioContext;
  var origResume = AC && AC.prototype.resume;
  if (AC) {
    var W = function (o) {
      var c = o === undefined ? new AC() : new AC(o);
      ctxs.push(c);
      if (!unlocked) { try { c.suspend(); } catch (e) {} }
      c.resume = function () { return unlocked ? origResume.call(c) : Promise.resolve(); };
      return c;
    };
    W.prototype = AC.prototype;
    try { window.AudioContext = W; if (window.webkitAudioContext) window.webkitAudioContext = W; } catch (e) {}
  }
  var MP = window.HTMLMediaElement && HTMLMediaElement.prototype, origPlay = MP && MP.play;
  if (origPlay) {
    MP.play = function () {
      if (unlocked) return origPlay.apply(this, arguments);
      if (pend.indexOf(this) < 0) pend.push(this);
      return Promise.resolve();
    };
  }
  function unlock() {
    if (unlocked) return;
    unlocked = true;
    ctxs.forEach(function (c) { try { if (c.state !== 'running' && c.state !== 'closed') origResume.call(c); } catch (e) {} });
    pend.splice(0).forEach(function (el) { try { var p = origPlay.call(el); if (p && p.catch) p.catch(function () {}); } catch (e) {} });
  }
  ['pointerdown', 'touchend', 'mousedown', 'keydown'].forEach(function (ev) {
    addEventListener(ev, unlock, { capture: true, passive: true });
  });

  /* ---------- API para el juego ---------- */
  var H = window.HAPP = { inApp: inApp, lang: lang, EN: EN };
  var toastEl = null, toastT = 0;
  function toast(msg) {
    if (!toastEl) return;
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    clearTimeout(toastT);
    toastT = setTimeout(function () { toastEl.classList.remove('on'); }, 1800);
  }
  H.xp = function (n) {
    n = Math.round(n);
    if (!inApp || !(n > 0)) return;
    try {
      var k = 'historiapp.progress';
      var p = JSON.parse(localStorage.getItem(k)) || { xp: 0, streak: 0, lastDay: null, seen: {}, badges: {}, gl: {}, daily: {} };
      p.xp = (p.xp || 0) + n;
      localStorage.setItem(k, JSON.stringify(p));
    } catch (e) { return; }
    toast(T.xp.replace('{n}', n));
  };
  H.open = function (tema, id) {
    if (!inApp) return;
    try { window.open('../#t' + tema + '/f/' + encodeURIComponent(id), '_blank'); } catch (e) {}
  };
  H.fichaHTML = function (key) {
    var f = C.fichas && C.fichas[key];
    if (!inApp || !f) return '';
    return '<button type="button" class="happ-ficha" onclick="event.stopPropagation();HAPP.open(' + f[0] + ',\'' + f[1] + '\')">📖 ' + T.ficha + ' ' + f[2] + '</button>';
  };

  /* ---------- Interfaz: barra, aviso de girar y avisos de XP ---------- */
  var css = '' +
    '.happ-bar{position:fixed;z-index:2147483000;display:flex;gap:8px;pointer-events:none}' +
    '.happ-bar a,.happ-bar button{pointer-events:auto;display:inline-flex;align-items:center;gap:6px;min-height:44px;min-width:44px;padding:0 14px;border-radius:22px;' +
    'background:rgba(12,10,8,.72);color:#fff;border:1px solid rgba(255,255,255,.4);font:600 15px/1 system-ui,-apple-system,"Segoe UI",sans-serif;text-decoration:none;' +
    'box-shadow:0 4px 14px rgba(0,0,0,.35);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);cursor:pointer;-webkit-tap-highlight-color:transparent}' +
    '.happ-ficha{display:inline-flex;align-items:center;gap:6px;min-height:44px;margin:8px 0 2px;padding:0 14px;border-radius:22px;background:rgba(0,67,121,.9);' +
    'color:#fff;border:1px solid rgba(255,255,255,.45);font:600 14px/1.1 system-ui,-apple-system,"Segoe UI",sans-serif;cursor:pointer;pointer-events:auto}' +
    '.happ-toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;z-index:2147483001;pointer-events:none;' +
    'padding:10px 18px;border-radius:22px;background:#EDAB00;color:#1b1406;font:700 15px/1 system-ui,-apple-system,"Segoe UI",sans-serif;box-shadow:0 6px 18px rgba(0,0,0,.4);' +
    'transition:transform .25s,opacity .25s}' +
    '.happ-toast.on{transform:translate(-50%,0);opacity:1}' +
    '.happ-rot{position:fixed;inset:0;z-index:2147483002;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#0e0b08;color:#f3e6c8;' +
    'font:600 20px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;padding:24px}' +
    '.happ-rot b{font-size:56px;line-height:1;display:block;animation:happrot 2.2s ease-in-out infinite}' +
    '@keyframes happrot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}' +
    '.happ-rot.on{display:flex}';

  function build() {
    var st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
    toastEl = document.createElement('div'); toastEl.className = 'happ-toast'; toastEl.setAttribute('role', 'status'); document.body.appendChild(toastEl);
    // C.barraEn: selector de una barra del propio juego donde colocar el botón de volver (con la clase C.barraClase)
    var dentro = inApp && C.barraEn ? document.querySelector(C.barraEn) : null;
    if (dentro) {
      var av = document.createElement('a'); av.href = C.volver || '../'; av.className = 'happ-volver ' + (C.barraClase || '');
      av.textContent = '‹ ' + T.back; av.setAttribute('aria-label', EN ? 'Back to Historiapp' : 'Volver a Historiapp');
      dentro.insertBefore(av, dentro.firstChild);
    }
    if (inApp && !dentro) {
      var bar = document.createElement('div'); bar.className = 'happ-bar';
      var pos = C.barra || { top: 'max(10px, env(safe-area-inset-top))', left: 'max(10px, env(safe-area-inset-left))' };
      for (var k in pos) bar.style[k] = pos[k];
      var a = document.createElement('a'); a.href = C.volver || '../'; a.textContent = '‹ ' + T.back; a.setAttribute('aria-label', EN ? 'Back to Historiapp' : 'Volver a Historiapp');
      bar.appendChild(a);
      (C.enlaces || []).forEach(function (l) {
        var b = document.createElement('button'); b.type = 'button'; b.textContent = '📖 ' + (EN ? l.en : l.es);
        b.addEventListener('click', function (e) { e.stopPropagation(); H.open(l.tema, l.id); });
        b.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
        bar.appendChild(b);
      });
      document.body.appendChild(bar);
    }
    if (inApp) document.body.classList.add('happ-in');
    if (C.css) { var st2 = document.createElement('style'); st2.textContent = C.css; document.head.appendChild(st2); }
    // Orientación: C.orient = 'h' | 'v' | función que devuelve 'h', 'v' o null (C.landscape = true equivale a 'h')
    var orient = C.orient || (C.landscape ? 'h' : null);
    if (orient) {
      var rot = document.createElement('div'); rot.className = 'happ-rot';
      rot.innerHTML = '<b aria-hidden="true">📱</b><span>' + T.rot + '</span>';
      if (inApp) {
        var rb = document.createElement('div'); rb.className = 'happ-bar'; rb.style.position = 'static';
        var ra = document.createElement('a'); ra.href = C.volver || '../'; ra.textContent = '‹ ' + T.back; rb.appendChild(ra); rot.appendChild(rb);
      }
      document.body.appendChild(rot);
      var coarse = window.matchMedia ? matchMedia('(pointer: coarse)') : null;
      var check = function () {
        var want = null;
        try { want = typeof orient === 'function' ? orient() : orient; } catch (e) {}
        var portrait = innerHeight > innerWidth;
        var on = (!coarse || coarse.matches) && ((want === 'h' && portrait) || (want === 'v' && !portrait));
        rot.classList.toggle('on', on);
      };
      addEventListener('resize', check); addEventListener('orientationchange', check);
      setInterval(check, 500); check();
    }
  }
  if (document.body) build(); else document.addEventListener('DOMContentLoaded', build);
})();
</script>

<body style="margin:0">
<title>Halterios</title>
<style>
/* Una sola escena 16:9 a toda pantalla, estética de cerámica ática de figuras negras */
:root {
  --barro: #c8692f;
  --barro-oscuro: #a9522a;
  --negro: #17110d;
  --blanco: #efe3c8;
  --font-display: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--negro); color: var(--blanco); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
#wrap { position: relative; width: 100%; height: 100%; display: grid; place-items: center; }
#game { display: block; background: var(--barro); cursor: pointer; outline: none; }
#game:focus-visible { box-shadow: 0 0 0 3px var(--blanco); }
#ctrl { position: absolute; display: flex; gap: 8px; }
#ctrl button { min-height: 44px; min-width: 44px; font: 600 13px/1 var(--font-display); letter-spacing: .12em; text-transform: uppercase; color: var(--barro); background: var(--negro); border: 1.5px solid var(--barro); padding: 7px 10px; cursor: pointer; }
#ctrl button:focus-visible { outline: 2px solid var(--blanco); outline-offset: 2px; }
/* móvil en horizontal: botones de 44 px como mínimo y letra legible */
@media (max-height: 540px), (max-width: 700px) { #ctrl { gap: 10px; } #ctrl button { min-height: 44px; min-width: 64px; font-size: 14px; padding: 8px 12px; } }
</style>

<div id="wrap">
  <canvas id="game" tabindex="0" aria-label="Salto de longitud con halterios. Pulsa para correr, para batir y para soltar las pesas."></canvas>
  <div id="ctrl">
    <button id="bSpeed" type="button">100 %</button>
    <button id="bSound" type="button">♪ on</button>
  </div>
</div>

<script>
(() => {
'use strict';

// ---------- Parámetros (todo lo ajustable vive aquí) ----------
const TUNING = {
  S: 80,              // píxeles por metro
  groundY: 585,       // línea del suelo en coordenadas lógicas
  runStart: -15,      // metros antes de la tabla
  vmax: 9.3, accTau: 0.75, stride: 2.25,
  vxKeep: 0.8,        // velocidad horizontal que se conserva en la batida
  vy0: 3.4, hip0: 1.0, hipLand: 0.55, g: 9.81,
  relOpt: 0.68, relHalf: 0.3, relDv: 2.6,  // suelta de las pesas
  reachBase: 0.18, reachRel: 0.42,          // alcance de los talones al caer
  foulTol: 0.06,
  helpJumps: 3, helpSlow: 0.3,
  hitTake: 0.035, hitLand: 0.05,
  camLead: 4.2,
};
const W = 1280, H = 720;
const C = { barro: '#c8692f', barroOsc: '#a9522a', barroClaro: '#d98a55', negro: '#17110d', blanco: '#efe3c8' };

// ---------- Idioma ----------
const ES = (navigator.language || 'en').toLowerCase().startsWith('es');
const TX = ES ? {
  tapRun: 'PULSA PARA CORRER', tapJump: 'PULSA PARA BATIR', tapRel: 'PULSA PARA SOLTAR LAS PESAS',
  best: 'MEJOR', jump: 'SALTO', foul: 'NULO', record: 'NUEVO RÉCORD', again: 'PULSA PARA SALTAR OTRA VEZ',
  bPerfect: 'Pisada perfecta', bGood: 'Buena pisada', bEarly: 'Batida pronto', bVery: 'Batida muy pronto', bHelp: 'Batida ayudada',
  rPerfect: 'Suelta perfecta', rGood: 'Buena suelta', rEarly: 'Suelta pronto', rLate: 'Suelta tarde', rNone: 'Sin soltar las pesas',
  board: 'BATIDA', rel: 'SUELTA', cm: n => `a ${n} cm de la tabla`, stepped: 'Pisaste más allá de la tabla',
  ideal: 'ideal', dec: ',',
} : {
  tapRun: 'TAP TO RUN', tapJump: 'TAP TO JUMP', tapRel: 'TAP TO RELEASE THE WEIGHTS',
  best: 'BEST', jump: 'JUMP', foul: 'FOUL', record: 'NEW RECORD', again: 'TAP TO JUMP AGAIN',
  bPerfect: 'Perfect take-off', bGood: 'Good take-off', bEarly: 'Early take-off', bVery: 'Very early take-off', bHelp: 'Assisted take-off',
  rPerfect: 'Perfect release', rGood: 'Good release', rEarly: 'Early release', rLate: 'Late release', rNone: 'Weights not released',
  board: 'TAKE-OFF', rel: 'RELEASE', cm: n => `${n} cm from the board`, stepped: 'You stepped past the board',
  ideal: 'ideal', dec: '.',
};
const fmt = d => d.toFixed(2).replace('.', TX.dec) + ' m';
const GREEK = ['', 'Α', 'Β', 'Γ', 'Δ', 'Ε', 'Ϛ', 'Ζ', 'Η', 'Θ', 'Ι'];

// ---------- Almacenamiento protegido ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem('halterios.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('halterios.' + k, JSON.stringify(v)); } catch (e) {} },
};

// ---------- SDK del portal (no hace nada si no existe) ----------
const SDK = {
  started: false,
  start() { if (!this.started && window.PokiSDK) { try { PokiSDK.gameplayStart(); } catch (e) {} } this.started = true; },
  stop() { if (this.started && window.PokiSDK) { try { PokiSDK.gameplayStop(); } catch (e) {} } this.started = false; },
};

// ---------- Lienzo ----------
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const ctrl = document.getElementById('ctrl');
let scale = 1, dpr = 1;
// MOB: pantalla pequeña (móvil en horizontal); uiK: cuánto se amplía la tarjeta de resultado
let MOB = false, uiK = 1;
// OX: lo que la escena se extiende a cada lado del 16:9 en pantallas más apaisadas (iPhone en
// horizontal); el 16:9 central, con la interfaz, se encaja en el área segura (sin la muesca)
let OX = 0;
const safeProbe = document.createElement('div');
safeProbe.style.cssText = 'position:fixed;left:0;top:0;visibility:hidden;pointer-events:none;padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left)';
document.body.appendChild(safeProbe);
function safeSide() {
  if (window.__safeTest) return window.__safeTest;
  const s = getComputedStyle(safeProbe);
  return Math.max(parseFloat(s.paddingLeft) || 0, parseFloat(s.paddingRight) || 0);
}
function resize() {
  const vw = innerWidth, vh = innerHeight, side = safeSide();
  scale = Math.min((vw - 2 * side) / W, vh / H);
  OX = Math.max(0, Math.min(W * .3, (vw / scale - W) / 2));
  dpr = Math.min(devicePixelRatio || 1, 2);
  MOB = scale < .75; uiK = MOB ? Math.min(2, .95 / scale) : 1;
  cv.style.width = Math.round((W + 2 * OX) * scale) + 'px';
  cv.style.height = Math.round(H * scale) + 'px';
  cv.width = Math.round((W + 2 * OX) * scale * dpr);
  cv.height = Math.round(H * scale * dpr);
  const left = (vw - W * scale) / 2, top = (vh - H * scale) / 2;
  ctrl.style.right = (left + 12 * scale + 4) + 'px';
  ctrl.style.top = (top + 48 * scale) + 'px';
}
addEventListener('resize', resize); resize();
addEventListener('orientationchange', () => setTimeout(resize, 300));

// Textura de barro cocido
const grain = document.createElement('canvas'); grain.width = grain.height = 256;
{ const g = grain.getContext('2d'); for (let i = 0; i < 2600; i++) { g.fillStyle = Math.random() < .5 ? 'rgba(60,20,5,.07)' : 'rgba(255,220,180,.05)'; g.fillRect(Math.random() * 256, Math.random() * 256, 1 + Math.random() * 2, 1 + Math.random() * 2); } }
const grainPat = ctx.createPattern(grain, 'repeat');

// ---------- Opciones ----------
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const SPEEDS = [1, .75, .5];
let speedIdx = store.get('speed', 0) | 0; if (!SPEEDS[speedIdx]) speedIdx = 0;
let soundOn = store.get('sound', true);
const bSpeed = document.getElementById('bSpeed'), bSound = document.getElementById('bSound');
function paintCtrl() { bSpeed.textContent = Math.round(SPEEDS[speedIdx] * 100) + ' %'; bSound.textContent = soundOn ? '♪ on' : '♪ off'; }
paintCtrl();
bSpeed.addEventListener('click', e => { e.stopPropagation(); speedIdx = (speedIdx + 1) % SPEEDS.length; store.set('speed', speedIdx); paintCtrl(); cv.focus(); });
bSound.addEventListener('click', e => { e.stopPropagation(); soundOn = !soundOn; store.set('sound', soundOn); paintCtrl(); cv.focus(); });
['pointerdown'].forEach(ev => { bSpeed.addEventListener(ev, e => e.stopPropagation()); bSound.addEventListener(ev, e => e.stopPropagation()); });

// ---------- Sonido sintetizado ----------
let ac = null, master = null, noiseBuf = null;
function audioInit() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = .55; master.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { ac = null; }
}
function noise(dur, type, f0, f1, vol, q = 1) {
  if (!ac || !soundOn) return;
  const t = ac.currentTime, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noiseBuf; s.playbackRate.value = .8 + Math.random() * .4;
  f.type = type; f.Q.value = q; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t, Math.random() * .5); s.stop(t + dur + .02);
}
function tone(freq, dur, vol, type = 'sine', drop = 1) {
  if (!ac || !soundOn) return;
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(freq * drop, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .02);
}
// Aulós: dos lengüetas ligeramente desafinadas por un filtro de paso de banda
function aulos(freq, dur, vol = .06, when = 0) {
  if (!ac || !soundOn) return;
  const t = ac.currentTime + when, f = ac.createBiquadFilter(), g = ac.createGain();
  f.type = 'bandpass'; f.frequency.value = freq * 3; f.Q.value = 1.6;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .03); g.gain.setValueAtTime(vol, t + dur * .7); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  [0, 7].forEach(cents => { const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = freq; o.detune.value = cents; o.connect(f); o.start(t); o.stop(t + dur + .02); });
  f.connect(g); g.connect(master);
}
const MODE = [440, 392, 349.2, 329.6]; // tetracordo dorio descendente (la, sol, fa, mi)
const sfx = {
  step(i) { noise(.05, 'lowpass', 900, 300, .25); aulos(MODE[i % 4] * (i % 8 < 4 ? 1 : .75), .2, .05); },
  take() { tone(110, .18, .6, 'sine', .45); noise(.06, 'highpass', 2500, 1200, .2); },
  release() { noise(.28, 'bandpass', 2400, 350, .35, 2.5); },
  land() { noise(.35, 'lowpass', 700, 150, .7); tone(70, .2, .35, 'sine', .6); },
  weight() { noise(.12, 'lowpass', 500, 120, .3); },
  result(rank) { const base = 293.7; [0, 3, 5, 7].slice(0, 2 + rank).forEach((st, i) => aulos(base * Math.pow(2, st / 12) * (rank > 1 ? 1.5 : 1), .22, .07, i * .13)); },
  foul() { aulos(220, .45, .07); aulos(207.7, .45, .05, .05); },
};

// ---------- Estado ----------
const S = TUNING.S;
let best = store.get('best', 0);
let jumps = 0;
let state = 'idle', stateT = 0, hit = 0, timeT = 0;
const A = { x: TUNING.runStart, v: 0, phase: 0, hipY: .95, vx: 0, vy: 0, holding: true, relT: -1, tAir: 0, Tpred: 1, footX: 0, stepIdx: 0, lastStepPhase: 0 };
let J = null;            // datos del salto en curso
let camX = TUNING.runStart - TUNING.camLead, camShake = { x: 0, v: 0 };
let weights = [], dust = [], marks = { last: null, best: best > 0 ? best : null };
let hintT = 0, flash = 0;

function resetRun() {
  A.x = TUNING.runStart; A.v = 0; A.phase = 0; A.hipY = .95; A.holding = true; A.relT = -1; A.tAir = 0; A.stepIdx = 0; A.lastStepPhase = 0;
  weights = []; J = { gap: null, assisted: false, p: null, q: 0, dist: 0, foul: false };
  state = 'run'; stateT = 0;
}
function helpOn() { return jumps < TUNING.helpJumps; }

// ---------- Entrada ----------
function press() {
  audioInit();
  if (state === 'idle') { SDK.start(); resetRun(); return; }
  if (state === 'run') { if (stateT > .25) takeoff(false); return; }
  if (state === 'air') { if (A.holding) release(); return; }
  if (state === 'result' && stateT > .5) { SDK.start(); resetRun(); }
}
cv.addEventListener('pointerdown', e => { e.preventDefault(); cv.focus(); press(); });
addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowUp') { e.preventDefault(); press(); }
});
addEventListener('visibilitychange', () => { if (document.hidden) SDK.stop(); });

function takeoff(auto) {
  let x = A.x;
  if (x > TUNING.foulTol && !auto) return; // ya se gestiona como nulo
  const gap = Math.max(0, -x);
  J.gap = gap; J.assisted = auto;
  A.footX = Math.min(x, 0);
  A.vx = A.v * TUNING.vxKeep; A.vy = TUNING.vy0;
  A.hipY = TUNING.hip0; A.x = A.footX;
  const h = TUNING.hip0 - TUNING.hipLand, vy = TUNING.vy0, g = TUNING.g;
  A.Tpred = (vy + Math.sqrt(vy * vy + 2 * g * h)) / g;
  A.tAir = 0;
  state = 'air'; stateT = 0; hit = TUNING.hitTake;
  shake(5);
  sfx.take();
  for (let i = 0; i < 8; i++) dust.push({ x: A.footX, y: .02, vx: -1 - Math.random() * 2, vy: .5 + Math.random() * 1.5, life: .5, max: .5, r: 2 + Math.random() * 2 });
}
function release() {
  const p = A.tAir / A.Tpred;
  const q = Math.max(0, 1 - Math.abs(p - TUNING.relOpt) / TUNING.relHalf);
  J.p = p; J.q = q;
  A.holding = false; A.relT = 0;
  A.vx += TUNING.relDv * q;
  sfx.release();
  const hy = A.hipY + .15;
  [-.06, .06].forEach(o => weights.push({ x: A.x - .1 + o, y: hy, vx: A.vx - 4.5 - Math.random(), vy: 1.2 + Math.random() * .6, rot: 0, vr: -8 - Math.random() * 4, rest: false }));
}
function land() {
  const reach = TUNING.reachBase + (A.holding ? 0 : TUNING.reachRel * J.q) + (A.holding ? 0 : .04);
  J.dist = A.x + reach;
  if (J.p == null) J.q = 0;
  state = 'land'; stateT = 0; hit = TUNING.hitLand;
  A.vx *= .25; A.hipY = TUNING.hipLand;
  shake(9);
  sfx.land();
  for (let i = 0; i < 26; i++) dust.push({ x: J.dist + (Math.random() - .3) * .4, y: .03, vx: (Math.random() - .2) * 3, vy: 1 + Math.random() * 2.5, life: .8, max: .8, r: 2 + Math.random() * 3 });
}
function finish() {
  if (window.HAPP && !J.foul && J.dist > 0) HAPP.xp(J.dist > best ? 20 : (jumps < 10 ? 5 : 0));
  jumps++;
  const rec = !J.foul && J.dist > best;
  J.record = rec;
  if (!J.foul) { marks.last = J.dist; if (rec) { best = J.dist; marks.best = best; store.set('best', best); flash = 1; } }
  const rank = J.foul ? -1 : (rec ? 3 : (J.dist > best - .25 ? 2 : (J.dist > best - .6 ? 1 : 0)));
  if (rank < 0) sfx.foul(); else sfx.result(rank);
  state = 'result'; stateT = 0;
  SDK.stop();
}
function shake(a) { if (!reduced) camShake.v += a * 60; }

// ---------- Simulación ----------
function update(dt) {
  timeT += dt;
  // Muelle del temblor de cámara (Jonasson y Purho)
  camShake.v += (-camShake.x * 900 - camShake.v * 22) * dt; camShake.x += camShake.v * dt;
  if (hit > 0) { hit -= dt; return; }

  let ts = 1;
  if (state === 'run' && helpOn() && A.x > -2.6) ts = TUNING.helpSlow;
  if (state === 'air' && helpOn() && A.holding) { const p = A.tAir / A.Tpred; if (p > .5 && p < .86) ts = TUNING.helpSlow; }
  const sdt = dt * ts;
  stateT += dt;

  if (state === 'idle') { A.phase += dt * 1.5; }
  if (state === 'run') {
    A.v = TUNING.vmax * (1 - Math.exp(-stateT / TUNING.accTau)) ;
    if (ts < 1) A.v = Math.max(A.v, 8.5);
    A.x += A.v * sdt;
    A.phase += (A.v * sdt / TUNING.stride) * Math.PI * 2;
    const st = Math.floor(A.phase / Math.PI);
    if (st !== A.lastStepPhase) { A.lastStepPhase = st; sfx.step(A.stepIdx++); }
    A.hipY = .95 + .04 * Math.abs(Math.cos(A.phase));
    if (helpOn() && A.x >= 0) takeoff(true);
    else if (A.x > TUNING.foulTol) { J.foul = true; state = 'foul'; stateT = 0; sfx.foul(); }
  }
  if (state === 'air') {
    A.tAir += sdt;
    A.x += A.vx * sdt;
    A.vy -= TUNING.g * sdt; A.hipY += A.vy * sdt;
    if (A.relT >= 0) A.relT += sdt;
    if (A.hipY <= TUNING.hipLand) land();
  }
  if (state === 'land') {
    A.x += A.vx * sdt; A.vx *= Math.pow(.02, sdt);
    if (stateT > .55) finish();
  }
  if (state === 'foul') {
    A.v *= Math.pow(.15, sdt); A.x += A.v * sdt; A.phase += (A.v * sdt / TUNING.stride) * Math.PI * 2;
    if (stateT > .9) finish();
  }
  // Pesas sueltas
  for (const w of weights) {
    if (w.rest) continue;
    w.vy -= TUNING.g * sdt; w.x += w.vx * sdt; w.y += w.vy * sdt; w.rot += w.vr * sdt;
    if (w.y <= .04) { w.y = .04; w.rest = true; sfx.weight(); for (let i = 0; i < 6; i++) dust.push({ x: w.x, y: .03, vx: (Math.random() - .5) * 2, vy: .5 + Math.random(), life: .5, max: .5, r: 2 + Math.random() * 2 }); }
  }
  for (const d of dust) { d.vy -= 6 * sdt; d.x += d.vx * sdt; d.y = Math.max(0, d.y + d.vy * sdt); d.life -= dt; }
  dust = dust.filter(d => d.life > 0);
  if (flash > 0) flash -= dt * .8;

  // Cámara
  let target = A.x - TUNING.camLead;
  if (state === 'idle') target = TUNING.runStart - TUNING.camLead;
  if (state === 'result' || state === 'land') target = Math.max(-3, (J && J.dist ? J.dist : A.x) - 8);
  const k = (state === 'run' || state === 'air') ? 1 : 1 - Math.pow(.02, dt);
  camX += (target - camX) * k;
}

// ---------- Dibujo ----------
const wx = x => (x - camX) * S + camShake.x * .02;
const wy = y => TUNING.groundY - y * S;

function drawBackground() {
  ctx.fillStyle = C.barro; ctx.fillRect(-OX, 0, W + 2 * OX, H);
  ctx.fillStyle = grainPat; ctx.fillRect(-OX, 0, W + 2 * OX, H);
  // Pórtico lejano con parallax
  ctx.fillStyle = 'rgba(80,30,10,.16)';
  const par = .35, sp = 2.6;
  const off = camX * par;
  const more = Math.ceil(OX / (sp * S * .8)), first = Math.floor(off / sp) - 1 - more;
  for (let i = first; i < first + 22 + 2 * more; i++) {
    const x = (i * sp - off) * S * .8;
    ctx.fillRect(x - 14, 300, 28, 210);
    ctx.fillRect(x - 22, 292, 44, 10);
  }
  ctx.fillRect(-OX, 262, W + 2 * OX, 30);
  ctx.beginPath(); ctx.moveTo(-OX, 262); ctx.lineTo(W + OX, 262); ctx.lineTo(W + OX, 250); ctx.lineTo(-OX, 250); ctx.fill();
}

function meander(y, h) {
  ctx.fillStyle = C.negro; ctx.fillRect(-OX, y, W + 2 * OX, h);
  ctx.strokeStyle = C.barro; ctx.lineWidth = 3; ctx.lineCap = 'square';
  const u = (h - 10) / 5, x0 = 4, top = y + 5;
  ctx.beginPath(); ctx.moveTo(-OX, top + 5 * u); ctx.lineTo(W + OX, top + 5 * u); ctx.stroke();
  for (let x = x0 - Math.ceil(OX / (6 * u)) * 6 * u; x < W + OX; x += 6 * u) {
    ctx.beginPath();
    ctx.moveTo(x + u, top + 5 * u); ctx.lineTo(x + u, top); ctx.lineTo(x + 5 * u, top); ctx.lineTo(x + 5 * u, top + 3.6 * u);
    ctx.lineTo(x + 2.6 * u, top + 3.6 * u); ctx.lineTo(x + 2.6 * u, top + 1.6 * u); ctx.lineTo(x + 3.6 * u, top + 1.6 * u);
    ctx.stroke();
  }
}

function rays(y, h) {
  ctx.fillStyle = C.negro;
  ctx.fillRect(-OX, y, W + 2 * OX, 6);
  const w = 26;
  for (let x = -Math.ceil(OX / w) * w; x < W + OX + w; x += w) {
    ctx.beginPath(); ctx.moveTo(x, y + h); ctx.lineTo(x + w / 2, y + 10); ctx.lineTo(x + w, y + h); ctx.fill();
  }
  ctx.fillRect(-OX, y + h, W + 2 * OX, H - y - h);
}

function drawTrack() {
  const gy = TUNING.groundY;
  // Foso de arena: punteado negro
  const x1 = wx(.6), x2 = wx(10.5);
  ctx.save();
  ctx.beginPath(); ctx.rect(x1, gy - 2, x2 - x1, 26); ctx.clip();
  ctx.fillStyle = C.barroClaro; ctx.fillRect(x1, gy - 2, x2 - x1, 26);
  ctx.fillStyle = C.negro;
  for (let m = .6; m < 10.5; m += .05) {
    const h = Math.sin(m * 91.7) * 43758.5; const r = h - Math.floor(h);
    ctx.fillRect(wx(m), gy + 3 + r * 18, 2, 2);
  }
  ctx.restore();
  // Suelo
  ctx.fillStyle = C.negro;
  if (x1 > -OX) ctx.fillRect(-OX, gy, x1 + OX, 5);
  if (x2 < W + OX) ctx.fillRect(x2, gy, W + OX - x2, 5);
  ctx.fillRect(Math.max(-OX, x1), gy + 22, Math.min(W + OX, x2) - Math.max(-OX, x1), 4);
  // Tabla de batida
  ctx.fillStyle = C.blanco; ctx.fillRect(wx(-.2), gy - 3, .2 * S, 9);
  ctx.strokeStyle = C.negro; ctx.lineWidth = 2; ctx.strokeRect(wx(-.2), gy - 3, .2 * S, 9);
  // Marcas de metros con numerales griegos
  ctx.fillStyle = C.negro; ctx.font = `700 22px ${'Palatino Linotype, Palatino, Georgia, serif'}`; ctx.textAlign = 'center';
  for (let m = 1; m <= 10; m++) {
    const x = wx(m); if (x < -OX - 40 || x > W + OX + 40) continue;
    ctx.fillRect(x - 1.5, gy + 26, 3, 12);
    ctx.fillText(GREEK[m] + 'ʹ', x, gy + 62);
  }
}

function stake(x, label, filled) {
  const sx = wx(x), gy = TUNING.groundY;
  if (sx < -OX - 50 || sx > W + OX + 50) return;
  ctx.strokeStyle = C.negro; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(sx, gy + 4); ctx.lineTo(sx, gy - 70); ctx.stroke();
  // banderín: lleno para el récord, hueco para el último salto
  ctx.beginPath(); ctx.moveTo(sx, gy - 70); ctx.lineTo(sx + 26, gy - 62); ctx.lineTo(sx, gy - 54); ctx.closePath();
  if (filled) { ctx.fillStyle = C.negro; ctx.fill(); } else { ctx.fillStyle = C.blanco; ctx.fill(); ctx.stroke(); }
  ctx.fillStyle = C.negro; ctx.font = `700 ${MOB ? 24 : 15}px Palatino Linotype, Palatino, Georgia, serif`; ctx.textAlign = 'left';
  ctx.fillText(label, sx + 6, gy - 78);
}

// Figura: ángulos desde la vertical hacia abajo, positivos hacia delante
function limb(x, y, a1, l1, a2, l2, w1, w2, outline) {
  const kx = x + Math.sin(a1) * l1 * S, ky = y + Math.cos(a1) * l1 * S;
  const ex = kx + Math.sin(a2) * l2 * S, ey = ky + Math.cos(a2) * l2 * S;
  ctx.lineCap = 'round';
  if (outline) {
    ctx.strokeStyle = C.barro;
    ctx.lineWidth = w1 + 3; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(kx, ky); ctx.stroke();
    ctx.lineWidth = w2 + 3; ctx.beginPath(); ctx.moveTo(kx, ky); ctx.lineTo(ex, ey); ctx.stroke();
  }
  ctx.strokeStyle = C.negro;
  ctx.lineWidth = w1; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(kx, ky); ctx.stroke();
  ctx.lineWidth = w2; ctx.beginPath(); ctx.moveTo(kx, ky); ctx.lineTo(ex, ey); ctx.stroke();
  return { kx, ky, ex, ey, a2 };
}
function halter(x, y, ang) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  ctx.fillStyle = C.blanco; ctx.strokeStyle = C.negro; ctx.lineWidth = 2;
  // pesa alargada con extremos abultados, como las de piedra
  ctx.beginPath();
  ctx.moveTo(-11, -6); ctx.quadraticCurveTo(0, -2, 11, -7); ctx.quadraticCurveTo(15, 0, 11, 7); ctx.quadraticCurveTo(0, 2, -11, 6); ctx.quadraticCurveTo(-15, 0, -11, -6);
  ctx.fill(); ctx.stroke();
  ctx.restore();
}
function figure(X, hipY, P, opts = {}) {
  const hx = wx(X), hy = wy(hipY);
  const lean = P.lean;
  const tdx = Math.sin(lean), tdy = -Math.cos(lean);
  const sh = { x: hx + tdx * .5 * S, y: hy + tdy * .5 * S };
  const head = { x: hx + tdx * .66 * S, y: hy + tdy * .66 * S };
  // brazo y pierna lejanos
  const farArm = limb(sh.x, sh.y, P.sh[1], .3, P.sh[1] + P.el[1], .28, 9, 7, false);
  limb(hx, hy, P.th[1], .45, P.th[1] - P.kn[1], .46, 14, 10, false);
  if (opts.holding) halter(farArm.ex, farArm.ey, -farArm.a2 + Math.PI / 2);
  // torso
  ctx.strokeStyle = C.negro; ctx.lineCap = 'round';
  ctx.lineWidth = 22; ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(sh.x, sh.y); ctx.stroke();
  ctx.lineWidth = 26; ctx.beginPath(); ctx.moveTo(hx + tdx * .3 * S, hy + tdy * .3 * S); ctx.lineTo(sh.x, sh.y); ctx.stroke();
  // incisiones del torso
  ctx.strokeStyle = C.barro; ctx.lineWidth = 1.6;
  const nx = -tdy, ny = tdx;
  ctx.beginPath(); ctx.moveTo(hx + tdx * .38 * S + nx * 2, hy + tdy * .38 * S + ny * 2); ctx.quadraticCurveTo(hx + tdx * .43 * S + nx * 9, hy + tdy * .43 * S + ny * 9, hx + tdx * .47 * S + nx * 2, hy + tdy * .47 * S + ny * 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(hx + tdx * .12 * S - nx * 8, hy + tdy * .12 * S - ny * 8); ctx.lineTo(hx + tdx * .14 * S + nx * 9, hy + tdy * .14 * S + ny * 9); ctx.stroke();
  // cabeza
  ctx.fillStyle = C.negro;
  ctx.beginPath(); ctx.arc(head.x, head.y, .105 * S, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(head.x - .1 * S, head.y - .02 * S, .05 * S, 0, Math.PI * 2); ctx.fill(); // moño
  ctx.beginPath(); ctx.moveTo(head.x + .09 * S, head.y - .02 * S); ctx.lineTo(head.x + .14 * S, head.y + .03 * S); ctx.lineTo(head.x + .08 * S, head.y + .04 * S); ctx.fill(); // nariz
  ctx.fillStyle = C.barro; ctx.beginPath(); ctx.arc(head.x + .045 * S, head.y - .015 * S, 2.2, 0, Math.PI * 2); ctx.fill(); // ojo inciso
  ctx.strokeStyle = C.barro; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.arc(head.x - .01 * S, head.y, .075 * S, -2.2, -.7); ctx.stroke(); // diadema
  // pierna y brazo cercanos, con contorno inciso
  limb(hx, hy, P.th[0], .45, P.th[0] - P.kn[0], .46, 14, 10, true);
  const nearArm = limb(sh.x, sh.y, P.sh[0], .3, P.sh[0] + P.el[0], .28, 9, 7, true);
  if (opts.holding) halter(nearArm.ex, nearArm.ey, -nearArm.a2 + Math.PI / 2);
  return { nearArm, farArm };
}

const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < 0 ? 0 : t > 1 ? 1 : t * t * (3 - 2 * t);
function runPose(ph, lean = .22) {
  const s = Math.sin(ph);
  const k = i => .35 + 1.1 * Math.max(0, Math.sin(ph + (i ? Math.PI : 0) - 1.6));
  return { lean, th: [.6 * s, -.6 * s], kn: [k(0), k(1)], sh: [-.85 * s, .85 * s], el: [.7, .7] };
}
function airPose() {
  const p = Math.min(1.2, A.tAir / A.Tpred);
  const e1 = ease(p / .18);
  let shA = lerp(-.6, 2.4, e1);
  if (A.relT >= 0) shA = lerp(shA, -1.2, ease(A.relT / .14));
  const tuck = ease((p - .1) / .35), ext = ease((p - .62) / .3);
  const thF = lerp(lerp(1.0, 1.4, tuck), 1.55, ext), thB = lerp(lerp(-.45, 1.25, tuck), 1.5, ext);
  const knF = lerp(lerp(.5, 1.6, tuck), .25, ext), knB = lerp(lerp(.3, 1.7, tuck), .3, ext);
  const lean = lerp(.3, A.relT >= 0 ? .55 : .05, ease((p - .3) / .5));
  return { lean, th: [thF, thB], kn: [knF, knB], sh: [shA, shA - .15], el: [.25, .25] };
}
function landPose() {
  const t = ease(stateT / .35);
  return { lean: lerp(.55, .85, t), th: [1.5, 1.45], kn: [lerp(.4, 2.0, t), lerp(.4, 2.1, t)], sh: [A.holding ? .9 : lerp(-1.2, .6, t), A.holding ? .8 : lerp(-1.1, .5, t)], el: [.4, .4] };
}

function drawAulete() {
  const X = -1.6, hx = wx(X); if (hx < -OX - 100 || hx > W + OX + 100) return;
  const bob = Math.sin(timeT * 5) * .01;
  const hy = wy(.95 + bob);
  // túnica larga
  ctx.fillStyle = C.negro;
  ctx.beginPath(); ctx.moveTo(hx - 14, hy - 38); ctx.lineTo(hx + 14, hy - 38); ctx.lineTo(hx + 26, wy(0)); ctx.lineTo(hx - 24, wy(0)); ctx.fill();
  ctx.strokeStyle = C.barro; ctx.lineWidth = 1.4;
  for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(hx + i * 5, hy - 10); ctx.lineTo(hx + i * 9, wy(0) - 4); ctx.stroke(); }
  figure(X, .95 + bob, { lean: -.05, th: [0, 0], kn: [0, 0], sh: [1.1, 1.0], el: [.9, 1.0] });
  // doble aulós
  const head = { x: hx - Math.sin(-.05) * 0 + (-.05) * .66 * S, y: hy - .66 * S };
  ctx.strokeStyle = C.negro; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(head.x + 8, head.y + 6); ctx.lineTo(head.x + 46, head.y + 34); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(head.x + 8, head.y + 6); ctx.lineTo(head.x + 50, head.y + 22); ctx.stroke();
}
function drawJudge() {
  const X = 11.6, hx = wx(X); if (hx < -OX - 100 || hx > W + OX + 100) return;
  ctx.fillStyle = C.negro;
  const hy = wy(.95);
  ctx.beginPath(); ctx.moveTo(hx - 16, hy - 40); ctx.lineTo(hx + 12, hy - 40); ctx.lineTo(hx + 20, wy(0)); ctx.lineTo(hx - 26, wy(0)); ctx.fill();
  ctx.strokeStyle = C.barro; ctx.lineWidth = 1.4;
  for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(hx + i * 6, hy - 30); ctx.lineTo(hx + i * 8 - 3, wy(0) - 4); ctx.stroke(); }
  figure(X, .95, { lean: -.1, th: [0, 0], kn: [0, 0], sh: [-.3, .8], el: [.2, 1.3] });
  // vara del juez
  ctx.strokeStyle = C.negro; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(hx - 34, wy(1.85)); ctx.lineTo(hx - 22, wy(0)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(hx - 40, wy(1.85)); ctx.lineTo(hx - 28, wy(1.9)); ctx.stroke();
}

function drawAthlete() {
  let P, holding = A.holding;
  if (state === 'idle') { const b = Math.sin(A.phase) * .05; P = { lean: .05, th: [.08, -.06], kn: [.1, .05], sh: [.15 + b, .05 + b], el: [.4, .4] }; figure(A.x, .95, P, { holding: true }); return; }
  if (state === 'run' || state === 'foul') {
    P = runPose(A.phase, state === 'foul' ? lerp(.22, .9, ease(stateT / .6)) : .22);
    if (state === 'run' && A.x > -1.2) { const t = ease((A.x + 1.2) / 1.2); P.sh = P.sh.map(a => lerp(a, -.8, t)); }
    figure(A.x, A.hipY, P, { holding });
    return;
  }
  if (state === 'air') { figure(A.x, A.hipY, airPose(), { holding }); return; }
  figure(A.x, Math.max(.4, A.hipY - .15 * ease(stateT / .3)), landPose(), { holding });
}

function drawWeights() {
  for (const w of weights) {
    const x = wx(w.x), y = wy(w.y); halter(x, y, w.rot);
  }
}
function drawDust() {
  ctx.fillStyle = C.negro;
  for (const d of dust) { const a = d.life / d.max; ctx.globalAlpha = a; ctx.beginPath(); ctx.arc(wx(d.x), wy(d.y), d.r, 0, Math.PI * 2); ctx.fill(); }
  ctx.globalAlpha = 1;
}
function landMark() {
  if (!(state === 'land' || state === 'result') || !J || J.foul) return;
  const x = wx(J.dist), gy = TUNING.groundY;
  ctx.fillStyle = C.negro;
  ctx.beginPath(); ctx.ellipse(x - 10, gy + 4, 18, 5, 0, 0, Math.PI * 2); ctx.fill();
}

// Texto con tipografía de inscripción
function label(txt, x, y, size, align = 'center', color = C.negro, weight = 700) {
  if (MOB) { const t = ctx.getTransform(); size = Math.max(size, 12.5 * dpr / Math.hypot(t.a, t.b)); }
  ctx.font = `${weight} ${size}px Palatino Linotype, Palatino, "Book Antiqua", Georgia, serif`;
  ctx.textAlign = align; ctx.fillStyle = color;
  if ('letterSpacing' in ctx) ctx.letterSpacing = Math.round(size * .12) + 'px';
  ctx.fillText(txt, x, y);
  if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
}

function hand(x, y) {
  const t = (timeT * 1.6) % 1, dy = Math.sin(t * Math.PI) * -10;
  ctx.save(); ctx.translate(x, y + dy);
  ctx.fillStyle = C.blanco; ctx.strokeStyle = C.negro; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-8, -26, 16, 30, 8) : ctx.rect(-8, -26, 16, 30); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-18, 0, 38, 30, 10) : ctx.rect(-18, 0, 38, 30); ctx.fill(); ctx.stroke();
  ctx.restore();
  ctx.strokeStyle = C.negro; ctx.lineWidth = 3; ctx.globalAlpha = 1 - t;
  ctx.beginPath(); ctx.arc(x, y - 28, 10 + t * 24, 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1;
}

function hud() {
  meander(0, 40);
  // marcador: en el móvil, mayor (unos 16 px reales)
  label(`${TX.jump} ${jumps + (state === 'result' ? 0 : 1)}`, 24, MOB ? 82 : 76, MOB ? 30 : 20, 'left');
  label(`${TX.best} ${best > 0 ? fmt(best) : '—'}`, 24, MOB ? 122 : 104, MOB ? 30 : 20, 'left');

  const helpOn_ = helpOn();
  if (state === 'idle') { label(TX.tapRun, W / 2, 200, 34); hand(W / 2, 250); }
  if (state === 'run' && helpOn_ && A.x > -2.6) { label(TX.tapJump, W / 2, 200, 34); hand(W / 2, 250); }
  if (state === 'air' && helpOn_ && A.holding) { const p = A.tAir / A.Tpred; if (p > .5 && p < .86) { label(TX.tapRel, W / 2, 200, 34); hand(W / 2, 250); } }
  if (state === 'result') {
    // debajo de los botones de arriba (unos 130 de alto en el móvil)
    if (MOB) { const top = 132, hh = 255 + 64, k = Math.min(uiK, (W - 16) / 560, (H - 100 - top) / hh); ctx.save(); ctx.translate(W / 2, top + hh * k / 2); ctx.scale(k, k); ctx.translate(-W / 2, -(120 + hh / 2)); resultCard(); ctx.restore(); }
    else resultCard();
  }
}

function gauge(x, y, w, title, zoneA, zoneB, markV, markLbl, ideal) {
  label(title, x, y - 36, 15, 'left', C.barro);
  ctx.strokeStyle = C.barro; ctx.lineWidth = 2;
  ctx.strokeRect(x, y, w, 18);
  // zona ideal rayada
  ctx.save(); ctx.beginPath(); ctx.rect(x + zoneA * w, y, (zoneB - zoneA) * w, 18); ctx.clip();
  ctx.lineWidth = 2; for (let i = -20; i < w; i += 7) { ctx.beginPath(); ctx.moveTo(x + i, y + 18); ctx.lineTo(x + i + 18, y); ctx.stroke(); }
  ctx.restore();
  label(ideal, x + (zoneA + zoneB) / 2 * w, y + 36, 12, 'center', C.barro, 600);
  if (markV != null) {
    const mx = x + Math.max(0, Math.min(1, markV)) * w;
    ctx.fillStyle = C.blanco;
    ctx.beginPath(); ctx.moveTo(mx, y + 2); ctx.lineTo(mx - 9, y - 12); ctx.lineTo(mx + 9, y - 12); ctx.fill();
    ctx.fillRect(mx - 1.5, y, 3, 18);
  }
  label(markLbl, x, y - 12, 15, 'left', C.blanco, 600);
}

function resultCard() {
  const cw = 560, ch = 255, cx = (W - cw) / 2, cy = 120, gy = 40;
  const pop = reduced ? 1 : ease(stateT / .18);
  ctx.save(); ctx.translate(W / 2, cy + ch / 2); ctx.scale(.9 + .1 * pop, .9 + .1 * pop); ctx.translate(-W / 2, -(cy + ch / 2));
  ctx.globalAlpha = pop;
  ctx.fillStyle = C.negro; ctx.fillRect(cx, cy, cw, ch);
  ctx.strokeStyle = C.barro; ctx.lineWidth = 2; ctx.strokeRect(cx + 6, cy + 6, cw - 12, ch - 12);
  if (J.foul) {
    label(TX.foul, W / 2, cy + 95, 64, 'center', C.blanco);
    label(TX.stepped, W / 2, cy + 140, 20, 'center', C.barro, 600);
  } else {
    if (J.record) label(TX.record, W / 2, cy + 40, 18, 'center', C.blanco);
    label(fmt(J.dist), W / 2, cy + 98, 60, 'center', C.blanco);
    // batida: últimos 50 cm antes de la tabla
    const bLbl = J.assisted ? TX.bHelp : J.gap < .05 ? TX.bPerfect : J.gap < .15 ? TX.bGood : J.gap < .35 ? TX.bEarly : TX.bVery;
    gauge(cx + 30, cy + 150 + gy, 230, TX.board, .9, 1, 1 - Math.min(J.gap, .5) / .5, bLbl, TX.cm(Math.round(J.gap * 100)));
    let rLbl = TX.rNone;
    if (J.p != null) rLbl = J.q > .8 ? TX.rPerfect : J.q > .45 ? TX.rGood : J.p < TUNING.relOpt ? TX.rEarly : TX.rLate;
    gauge(cx + 300, cy + 150 + gy, 230, TX.rel, TUNING.relOpt - .08, TUNING.relOpt + .08, J.p, rLbl, TX.ideal);
  }
  ctx.restore();
  // en el móvil, el aviso va sobre una placa oscura para que no lo tapen las figuras
  if (stateT > .5 && MOB) { ctx.font = `700 22px Palatino Linotype, Palatino, Georgia, serif`; const tw = ctx.measureText(TX.again).width + TX.again.length * 2.6 + 44; ctx.globalAlpha = .9; ctx.fillStyle = C.negro; ctx.fillRect(W / 2 - tw / 2, cy + ch + 20, tw, 36); ctx.globalAlpha = 1; label(TX.again, W / 2, cy + ch + 44, 22, 'center', C.blanco); }
  else if (stateT > .5) label(TX.again, W / 2, cy + ch + 44, 22, 'center', C.negro);
}

function draw() {
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, OX * scale * dpr, 0);
  ctx.save();
  if (!reduced) ctx.translate(0, camShake.x * .02);
  drawBackground();
  drawAulete();
  drawJudge();
  drawTrack();
  if (marks.best) stake(marks.best, TX.best, true);
  if (marks.last && Math.abs(marks.last - (marks.best || 0)) > .05) stake(marks.last, '', false);
  landMark();
  drawWeights();
  drawAthlete();
  drawDust();
  rays(TUNING.groundY + 80, 40);
  ctx.restore();
  hud();
  if (flash > 0 && !reduced) { ctx.fillStyle = `rgba(239,227,200,${flash * .25})`; ctx.fillRect(-OX, 0, W + 2 * OX, H); }
}

// ---------- Bucle ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000) * SPEEDS[speedIdx]; last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
cv.focus();
window.__halterios = { TUNING, A, get state() { return state; }, get J() { return J; }, press };
})();
</script>
