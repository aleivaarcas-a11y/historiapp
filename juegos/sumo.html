<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1c1612">
<title>Sumo · El camino del dohyō</title>
<style>
:root{
  --washi:#f3e9d2; --washi2:#e9dcbf; --sumi:#1c1612; --sumi2:#2b231c; --bermellon:#b8322a; --indigo:#2d4a6b; --oro:#c9a24a;
  --ok:#2d6aa3; --mal:#d9822b; --tit:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","Songti SC",Georgia,"Times New Roman",serif;
  --txt:Calibri,Carlito,"Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0e0b08;color:var(--washi);font-family:var(--txt);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
#lienzo{position:fixed;inset:0;width:100%;height:100%;display:block}
#papel{position:fixed;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.22}
#vineta{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,rgba(0,0,0,0) 55%,rgba(20,12,6,.55) 100%)}
button{font-family:var(--txt);cursor:pointer}
.oculto{display:none!important}

/* ---------- carga ---------- */
#carga{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#14100c;transition:opacity .6s}
#carga .sello{width:84px;height:84px;border-radius:50%;border:3px solid var(--bermellon);display:flex;align-items:center;justify-content:center;font:700 40px/1 var(--tit);color:var(--bermellon);animation:latir 1.6s ease-in-out infinite}
#carga .barra{width:min(320px,70vw);height:4px;background:#3a2e22;border-radius:2px;overflow:hidden}
#carga .barra i{display:block;height:100%;width:0;background:var(--oro);transition:width .25s}
#carga p{margin:0;font:16px var(--txt);color:#cdbd9c;letter-spacing:.04em}
@keyframes latir{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* ---------- paneles ---------- */
.capa{position:fixed;inset:0;z-index:35;display:flex;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.capa.velo{background:rgba(14,10,7,.55);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.hoja{position:relative;background:var(--washi);color:var(--sumi);border-radius:4px;box-shadow:0 18px 50px rgba(0,0,0,.55),inset 0 0 0 1px rgba(60,40,20,.25);padding:22px 26px;max-width:640px;width:100%;max-height:100%;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.hoja::before{content:"";position:absolute;inset:6px;border:1px solid rgba(120,80,40,.35);pointer-events:none;border-radius:2px}
.hoja h2{font:700 26px/1.15 var(--tit);margin:0 0 6px;color:var(--sumi)}
.hoja h3{font:600 14px/1.2 var(--txt);margin:0 0 10px;letter-spacing:.12em;text-transform:uppercase;color:var(--bermellon)}
.hoja p{font:17px/1.42 var(--txt);margin:0 0 12px}
.hoja .cita{font:16px/1.45 var(--txt);border-left:3px solid var(--bermellon);padding:2px 0 2px 12px;margin:6px 0 10px;color:#3a2e24}
.hoja .fuente{font:13px/1.35 var(--txt);color:#6a5a48;margin:0 0 12px}
.fila{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.btn{min-height:46px;padding:0 20px;border-radius:24px;border:0;font:700 17px/1 var(--txt);letter-spacing:.02em;background:var(--sumi);color:var(--washi);box-shadow:0 3px 0 #000}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
.btn.rojo{background:var(--bermellon);color:#fff;box-shadow:0 3px 0 #6a1712}
.btn.claro{background:transparent;color:var(--sumi);box-shadow:inset 0 0 0 2px var(--sumi)}
.btn[disabled]{opacity:.4}

/* ---------- portada ---------- */
#portada{align-items:flex-end;justify-content:flex-start;background:linear-gradient(90deg,rgba(12,8,5,.78) 0%,rgba(12,8,5,.35) 45%,rgba(0,0,0,0) 70%)}
#portada .bloque{max-width:520px;padding:0 0 4vh 2vw}
#portada .kanji{font:800 clamp(64px,13vh,120px)/.9 var(--tit);color:var(--washi);letter-spacing:.04em;text-shadow:0 4px 24px rgba(0,0,0,.6)}
#portada .kanji b{color:var(--bermellon);font-weight:800}
#portada h1{font:700 clamp(26px,5.4vh,44px)/1.05 var(--tit);margin:8px 0 4px;color:var(--washi)}
#portada .sub{font:clamp(14px,2.6vh,18px)/1.35 var(--txt);color:#e3d3b0;margin:0 0 18px;max-width:440px}
#portada .fila{gap:12px}
#portada .btn{min-height:50px;font-size:18px}
#portada .btn.claro{color:var(--washi);box-shadow:inset 0 0 0 2px rgba(243,233,210,.7)}
#esquina{position:fixed;top:max(10px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));z-index:30;display:flex;gap:8px}
.icono{min-width:46px;height:46px;border-radius:23px;border:1px solid rgba(243,233,210,.45);background:rgba(20,14,9,.62);color:var(--washi);font:700 15px/1 var(--txt);padding:0 12px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#copy{position:fixed;left:max(12px,env(safe-area-inset-left));bottom:max(6px,env(safe-area-inset-bottom));z-index:21;font:12px var(--txt);color:rgba(243,233,210,.6);pointer-events:none}

/* ---------- lámina ---------- */
#lamina .hoja{max-width:860px;display:flex;gap:20px;align-items:center}
#lamina img{max-height:min(68vh,520px);max-width:48%;box-shadow:0 6px 18px rgba(0,0,0,.35);border:8px solid #f7efdc;outline:1px solid #6a5a48}
@media (max-aspect-ratio:1/1){#lamina .hoja{flex-direction:column}#lamina img{max-width:100%}}

/* ---------- pregunta ---------- */
#pregunta .hoja{max-width:720px}
.opciones{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 6px}
@media (max-width:560px){.opciones{grid-template-columns:1fr}}
.op{position:relative;min-height:54px;text-align:left;padding:10px 14px 10px 44px;border-radius:6px;border:2px solid #b9a582;background:#fbf5e6;color:var(--sumi);font:600 16px/1.25 var(--txt)}
.op::before{content:attr(data-l);position:absolute;left:12px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;background:var(--sumi);color:var(--washi);font:700 13px/22px var(--txt);text-align:center}
.op.ok{border-color:var(--ok);background:#e3eef8}
.op.ok::before{content:"✓";background:var(--ok)}
.op.mal{border-color:var(--mal);background:#fbeee0}
.op.mal::before{content:"✗";background:var(--mal)}
.op[disabled]{cursor:default}
.explica{display:none;margin-top:8px;padding:10px 12px;border-radius:6px;background:#efe3c8;font:16px/1.4 var(--txt)}
.explica b{font-weight:700}
.explica.on{display:block}
.conc{display:inline-flex;gap:4px;vertical-align:middle;margin-left:6px}

/* ---------- marcador ---------- */
#hud{position:fixed;top:max(8px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));z-index:10;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;gap:10px}
.placa{background:rgba(20,14,9,.66);border:1px solid rgba(243,233,210,.25);border-radius:6px;padding:7px 10px 8px;min-width:170px;max-width:30vw;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.placa .nom{font:700 16px/1.1 var(--tit);color:var(--washi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.placa .kg{font:12px var(--txt);color:#cdbd9c;margin:0 6px}
.barra2{display:flex;align-items:center;gap:6px;margin-top:5px;font:600 11px/1 var(--txt);color:#cdbd9c;letter-spacing:.06em;text-transform:uppercase}
.barra2 .tubo{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden;position:relative;min-width:80px}
.barra2 .tubo i{position:absolute;left:0;top:0;bottom:0;background:var(--washi);border-radius:4px}
.barra2 .tubo.eq i{background:repeating-linear-gradient(90deg,#e7c66a 0 6px,#cfa94a 6px 9px)}
.barra2 .tubo.bajo i{background:var(--mal)}
.pips{display:flex;gap:4px;margin-top:6px}
.pip{width:12px;height:12px;transform:rotate(45deg);border:1.5px solid var(--oro);background:transparent}
.pip.on{background:var(--oro)}
.placa.der{text-align:right}
.placa.der .barra2{flex-direction:row-reverse}
.placa.der .pips{justify-content:flex-end}
#dia{font:700 14px/1.2 var(--tit);color:var(--washi);background:rgba(20,14,9,.6);border-radius:14px;padding:6px 12px;text-align:center;white-space:nowrap}
#dia small{display:block;font:600 11px var(--txt);color:#cdbd9c;letter-spacing:.06em}

/* ---------- mandos ---------- */
#mandos{position:fixed;inset:auto 0 0 0;z-index:11;pointer-events:none;height:0}
#cruceta{position:fixed;left:max(14px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));width:156px;height:156px;pointer-events:auto;touch-action:none}
#cruceta button{position:absolute;width:56px;height:56px;border-radius:10px;border:1px solid rgba(243,233,210,.5);background:rgba(20,14,9,.55);color:var(--washi);font:700 22px/1 var(--txt);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;flex-direction:column}
#cruceta button small{font:600 9px/1 var(--txt);letter-spacing:.04em;margin-top:2px;opacity:.8;text-transform:uppercase}
#cruceta button.on{background:rgba(243,233,210,.85);color:var(--sumi)}
#cruceta .ar{left:50px;top:0}#cruceta .ab{left:50px;bottom:0}#cruceta .iz{left:0;top:50px}#cruceta .de{right:0;top:50px}
#acciones{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));width:210px;height:150px;pointer-events:auto;touch-action:none}
.acc{position:absolute;border-radius:50%;border:2px solid rgba(243,233,210,.65);background:rgba(20,14,9,.6);color:var(--washi);display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 22px/1 var(--tit);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.acc small{font:700 11px/1 var(--txt);margin-top:4px;letter-spacing:.03em}
.acc.on{background:rgba(243,233,210,.9);color:var(--sumi)}
.acc .cd{position:absolute;inset:-2px;border-radius:50%;background:conic-gradient(rgba(0,0,0,.55) var(--p,0%),transparent 0);pointer-events:none}
#bA{width:84px;height:84px;right:0;bottom:30px}
#bB{width:74px;height:74px;right:92px;bottom:0}
#bC{width:64px;height:64px;right:96px;bottom:84px}

/* ---------- avisos y ceremonia ---------- */
#aviso{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);z-index:12;pointer-events:none;text-align:center;opacity:0;transition:opacity .18s,transform .18s}
#aviso.on{opacity:1;transform:translate(-50%,-50%) scale(1.04)}
#aviso b{display:block;font:800 clamp(30px,7vh,56px)/1 var(--tit);color:var(--washi);text-shadow:0 3px 0 #000,0 0 24px rgba(0,0,0,.6)}
#aviso small{display:block;margin-top:6px;font:700 clamp(14px,2.6vh,19px)/1.2 var(--txt);color:#f0dfb8;text-shadow:0 2px 0 #000}
#guia{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:13;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none;width:min(560px,70vw)}
#guia p{margin:0;font:700 clamp(15px,2.8vh,19px)/1.25 var(--txt);text-align:center;background:rgba(20,14,9,.7);padding:8px 14px;border-radius:18px}
#ritmo{width:100%;height:16px;border-radius:8px;background:rgba(20,14,9,.7);border:1px solid rgba(243,233,210,.4);position:relative;overflow:hidden}
#ritmo .zona{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,rgba(201,162,74,.85) 0 5px,rgba(201,162,74,.5) 5px 10px)}
#ritmo .marca{position:absolute;top:-3px;bottom:-3px;width:5px;margin-left:-2px;background:var(--washi);box-shadow:0 0 6px #000}
#tocar{pointer-events:auto;min-width:200px;min-height:60px;border-radius:30px;border:2px solid var(--washi);background:var(--bermellon);color:#fff;font:800 20px/1 var(--txt);box-shadow:0 4px 0 #5a120d}
#tocar:active{transform:translateY(2px)}
#saltar{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));z-index:14}
#pausaBtn{display:none}
.combate #pausaBtn{display:inline-flex;align-items:center;justify-content:center}

#rotar{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#0e0b08;color:var(--washi);font:600 20px/1.3 var(--txt);text-align:center;padding:24px}
#rotar b{font-size:56px;line-height:1;display:block;animation:rot 2.2s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-width:900px){#rotar.activo{display:flex}}
.banzuke{display:flex;gap:8px;margin:10px 0 4px}
.banzuke span{width:30px;height:30px;border-radius:50%;border:2px solid #8a7458;display:flex;align-items:center;justify-content:center;font:800 15px/1 var(--txt);color:#fff}
.banzuke span.g{background:var(--ok);border-color:var(--ok)}
.banzuke span.p{background:var(--mal);border-color:var(--mal)}
.banzuke span.a{border-color:var(--sumi);box-shadow:0 0 0 3px rgba(184,50,42,.35)}
.lista{margin:6px 0 12px;padding-left:20px;font:16px/1.45 var(--txt)}
.lista li{margin-bottom:4px}
.tabla{width:100%;border-collapse:collapse;font:15px/1.3 var(--txt);margin:6px 0 12px}
.tabla td{padding:5px 4px;border-bottom:1px solid rgba(120,80,40,.25)}
.tabla td:last-child{text-align:right;font-weight:700}
.color{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #000}
.color.sel{box-shadow:0 0 0 3px var(--sumi)}
.color[disabled]{opacity:.35}
.happ-in #copy{display:none}
.happ-in .capa.velo{padding-top:max(62px,calc(env(safe-area-inset-top) + 56px))}
.happ-in.combate .happ-bar{display:none!important}
@media (max-height:440px){.hoja{padding:14px 18px}.hoja h2{font-size:21px}.hoja p,.hoja .cita{font-size:15px;margin-bottom:8px}.hoja .fuente{font-size:12px;margin-bottom:6px}.op{min-height:46px;font-size:15px}.btn{min-height:44px;font-size:16px}.banzuke span{width:26px;height:26px}.color{width:34px;height:34px}}
.color[disabled]::after{content:"🔒";font-size:14px}
.combate #copy{display:none}
.lucha #esquina{top:calc(max(8px,env(safe-area-inset-top)) + 50px);right:50%;transform:translateX(50%)}
.lucha #esquina .icono{height:40px;min-width:40px}
#punos{display:flex;align-items:center;gap:10px;background:rgba(20,14,9,.75);padding:6px 14px;border-radius:20px;font:700 15px var(--txt)}
#punos b{width:30px;height:30px;border-radius:50%;border:3px solid var(--washi);display:inline-block}
#punos b.on{background:var(--washi);box-shadow:0 0 14px rgba(255,240,200,.9)}
@media (hover:hover) and (pointer:fine){.acc::after{content:attr(data-tecla);position:absolute;top:-8px;right:-4px;font:700 11px var(--txt);background:var(--washi);color:var(--sumi);border-radius:8px;padding:2px 5px}}
.combate #idiomaBtn{display:none}
</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<div id="papel"></div><div id="vineta"></div>

<div id="carga"><div class="sello">相</div><div class="barra"><i></i></div><p id="cargaTxt">…</p></div>

<div id="esquina">
  <button class="icono" id="pausaBtn" aria-label="Pausa">❚❚</button>
  <button class="icono" id="idiomaBtn">EN</button>
  <button class="icono" id="sonidoBtn" aria-label="Sonido">♪</button>
</div>

<div id="hud" class="oculto">
  <div class="placa" id="placaA"><div><span class="nom" id="nomA"></span><span class="kg" id="kgA"></span></div>
    <div class="barra2"><span data-t="aliento"></span><div class="tubo"><i id="staA"></i></div></div>
    <div class="barra2"><span data-t="equilibrio"></span><div class="tubo eq" id="tbA"><i id="balA"></i></div></div>
    <div class="pips" id="pipsA"></div></div>
  <div id="dia"></div>
  <div class="placa der" id="placaB"><div><span class="kg" id="kgB"></span><span class="nom" id="nomB"></span></div>
    <div class="barra2"><span data-t="aliento"></span><div class="tubo"><i id="staB"></i></div></div>
    <div class="barra2"><span data-t="equilibrio"></span><div class="tubo eq" id="tbB"><i id="balB"></i></div></div>
    <div class="pips" id="pipsB"></div></div>
</div>

<div id="mandos" class="oculto">
  <div id="cruceta">
    <button class="ar" data-k="ar">▲</button><button class="ab" data-k="ab">▼</button>
    <button class="iz" data-k="iz">◀<small data-t="atras"></small></button><button class="de" data-k="de">▶<small data-t="adelante"></small></button>
  </div>
  <div id="acciones">
    <button class="acc" id="bA" data-k="A" data-tecla="J">押<small data-t="empujon"></small><i class="cd"></i></button>
    <button class="acc" id="bB" data-k="B" data-tecla="K">組<small id="tB"></small><i class="cd"></i></button>
    <button class="acc" id="bC" data-k="C" data-tecla="L">躱<small data-t="esquiva"></small><i class="cd"></i></button>
  </div>
</div>

<div id="aviso"><b></b><small></small></div>
<div id="guia" class="oculto"><p id="guiaTxt"></p><div id="punos" class="oculto"></div><div id="ritmo" class="oculto"><div class="zona"></div><div class="marca"></div></div><button id="tocar"></button></div>
<button class="btn claro oculto" id="saltar" style="color:var(--washi);box-shadow:inset 0 0 0 2px rgba(243,233,210,.7)"></button>

<div class="capa oculto" id="portada"><div class="bloque">
  <div class="kanji">相<b>撲</b></div>
  <h1 data-t="titulo"></h1>
  <p class="sub" data-t="subtitulo"></p>
  <div class="fila" id="portadaBtns"></div>
</div></div>

<div class="capa velo oculto" id="panel"><div class="hoja" id="hoja"></div></div>
<div class="capa velo oculto" id="pregunta"><div class="hoja" id="hojaP"></div></div>
<div class="capa velo oculto" id="lamina"><div class="hoja"><img id="laminaImg" alt=""><div id="laminaTxt"></div></div></div>

<div id="rotar"><b aria-hidden="true">📱</b><span data-t="girar"></span></div>
<div id="copy">© Diseñado y Creado por Alejandro Leiva Arcas</div>

<script>window.HAPP_CFG={tema:5,volver:'../',orient:'h',barra:{top:'max(10px, env(safe-area-inset-top))',left:'max(10px, env(safe-area-inset-left))'}};
/* Puente con Historiapp. Lo inserta hacer_historiapp.py en la versión <juego>-historiapp.html.
   Configuración en window.HAPP_CFG = { tema, volver, orient, fichas, enlaces, barra, barraEn, barraClase, css }.
   1. Idioma: toma historiapp.lang si existe y lo presenta al juego como navigator.language.
   2. Sonido: ningún AudioContext ni <audio> suena hasta el primer toque (iOS lo bloquea).
   3. Dentro de la app (carpeta juegos/ y alguna clave historiapp.* en el mismo origen):
      XP en historiapp.progress, botón para volver, enlaces a fichas.
   4. Aviso de girar el dispositivo cuando el juego necesita la otra orientación (C.orient). */
(function () {
  'use strict';
  var C = window.HAPP_CFG || {};
  var inApp = false, lang = null;
  try {
    if (/\/juegos\//.test(location.pathname)) {
      for (var i = 0; i < localStorage.length; i++) {
        if (String(localStorage.key(i)).indexOf('historiapp.') === 0) { inApp = true; break; }
      }
    }
  } catch (e) {}
  try { lang = localStorage.getItem('historiapp.lang'); } catch (e) {}
  if (lang !== 'es' && lang !== 'en') lang = null;
  if (lang) {
    var tag = lang === 'en' ? 'en-GB' : 'es-ES';
    try {
      Object.defineProperty(Navigator.prototype, 'language', { get: function () { return tag; }, configurable: true });
      Object.defineProperty(Navigator.prototype, 'languages', { get: function () { return [tag]; }, configurable: true });
    } catch (e) {}
    try { document.documentElement.lang = lang; } catch (e) {}
  }
  var EN = (lang || (String(navigator.language || 'es').toLowerCase().indexOf('es') === 0 ? 'es' : 'en')) === 'en';
  var T = EN
    ? { back: 'Historiapp', xp: '+{n} XP in Historiapp', rot: 'Rotate your device to play', ficha: 'Read the study sheet' }
    : { back: 'Historiapp', xp: '+{n} XP en Historiapp', rot: 'Gira el dispositivo para jugar', ficha: 'Leer la ficha' };

window.SUMO_CUERPO_SRC="/* Sumo \u00b7 escultura de los cuerpos. Cada figura se esculpe como un campo de distancias con uniones suaves\n   (carne que se funde en la barriga, la papada y los muslos) y se convierte en malla con \u00absurface nets\u00bb.\n   Se genera al cargar, sin descargar modelos, y se ata a un esqueleto de 17 huesos para animarla. */\n(function(root){\n  const V = (x, y, z) => [x, y, z];\n  const sub = (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];\n  const dot = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];\n  const len = a => Math.sqrt(dot(a, a));\n  const clamp = (x, a, b) => x < a ? a : x > b ? b : x;\n  const smoothstep = (a, b, x) => { const t = clamp((x - a)/(b - a), 0, 1); return t*t*(3 - 2*t); };\n\n  // primitivas\n  function ellip(p, c, r){ // aproximaci\u00f3n de distancia a un elipsoide\n    const x = (p[0]-c[0])/r[0], y = (p[1]-c[1])/r[1], z = (p[2]-c[2])/r[2];\n    const k0 = Math.sqrt(x*x + y*y + z*z);\n    const x1 = x/r[0], y1 = y/r[1], z1 = z/r[2];\n    const k1 = Math.sqrt(x1*x1 + y1*y1 + z1*z1);\n    return k1 > 1e-6 ? k0*(k0 - 1)/k1 : -Math.min(r[0], r[1], r[2]);\n  }\n  function cono(p, a, b, ra, rb){ // c\u00e1psula de radio variable (aproximaci\u00f3n)\n    const pa = sub(p, a), ba = sub(b, a);\n    const h = clamp(dot(pa, ba)/dot(ba, ba), 0, 1);\n    const d = [pa[0] - ba[0]*h, pa[1] - ba[1]*h, pa[2] - ba[2]*h];\n    return len(d) - (ra + (rb - ra)*h);\n  }\n  function caja(p, c, h, r){ const qx = Math.abs(p[0]-c[0]) - h[0] + r, qy = Math.abs(p[1]-c[1]) - h[1] + r, qz = Math.abs(p[2]-c[2]) - h[2] + r;\n    return Math.hypot(Math.max(qx, 0), Math.max(qy, 0), Math.max(qz, 0)) + Math.min(Math.max(qx, qy, qz), 0) - r; }\n  function smin(a, b, k){ const h = clamp(.5 + .5*(b - a)/k, 0, 1); return b + (a - b)*h - k*h*(1 - h); }\n  function smax(a, b, k){ return -smin(-a, -b, k); }\n\n  /* ---------------- el cuerpo de un rikishi (sin cabeza) ---------------- */\n  // m: corpulencia (1 normal, 1.2 pesado, .85 joven del sumo antiguo)\n  function esqueleto(m){\n    const sh = .40 + .03*(m - 1);\n    return [\n      { n: 'raiz',     p: -1, o: V(0, 0, 0) },\n      { n: 'pelvis',   p: 0,  o: V(0, .86, 0) },\n      { n: 'lumbar',   p: 1,  o: V(0, 1.04, 0) },\n      { n: 'pecho',    p: 2,  o: V(0, 1.28, 0) },\n      { n: 'cuello',   p: 3,  o: V(0, 1.52, 0) },\n      { n: 'brazoD',   p: 3,  o: V(sh, 1.41, -.02) },  { n: 'codoD', p: 5,  o: V(sh + .21, 1.13, -.02) }, { n: 'manoD', p: 6,  o: V(sh + .37, .88, .0) },\n      { n: 'brazoI',   p: 3,  o: V(-sh, 1.41, -.02) }, { n: 'codoI', p: 8,  o: V(-sh - .21, 1.13, -.02) }, { n: 'manoI', p: 9,  o: V(-sh - .37, .88, .0) },\n      { n: 'musloD',   p: 1,  o: V(.2, .84, 0) },  { n: 'rodillaD', p: 11, o: V(.255, .47, .03) }, { n: 'pieD', p: 12, o: V(.27, .09, 0) },\n      { n: 'musloI',   p: 1,  o: V(-.2, .84, 0) }, { n: 'rodillaI', p: 14, o: V(-.255, .47, .03) }, { n: 'pieI', p: 15, o: V(-.27, .09, 0) }\n    ];\n  }\n\n  function campoCuerpo(m){\n    const H = esqueleto(m), P = i => H[i].o;\n    const b = m, bz = .85 + .15*m;\n    // devuelve [distancia, regi\u00f3n] con regi\u00f3n 0 piel, 1 mawashi\n    return function(p){\n      // tronco\n      let d = ellip(p, V(0, .99, .07*bz), V(.42*b, .41, .41*bz));                       // barriga\n      d = smin(d, ellip(p, V(0, .84, -.01), V(.40*b, .27, .33*bz)), .08);              // bajo vientre y caderas\n      d = smin(d, ellip(p, V(0, 1.27, -.01), V(.41*b, .27, .31*bz)), .09);             // t\u00f3rax\n      d = smin(d, ellip(p, V(0, 1.30, -.09), V(.38*b, .25, .26)), .08);                // espalda\n      d = smin(d, ellip(p, V(0, 1.45, -.04), V(.30*b, .12, .18)), .07);                // trapecios\n      for (const s of [-1, 1]){\n        d = smin(d, ellip(p, V(.155*s, 1.27, .2*bz), V(.15, .135, .11)), .05);          // pectorales ca\u00eddos\n        d = smin(d, ellip(p, V(.155*s, .80, -.19), V(.19, .21, .19)), .06);             // nalgas\n        d = smin(d, ellip(p, V(.3*b*s, 1.0, .02), V(.15, .22, .25*bz)), .08);           // flancos\n      }\n      d = smin(d, cono(p, V(0, 1.42, -.01), V(0, 1.63, 0), .135, .12), .07);            // cuello\n      // piernas\n      let piernas = 1e9;\n      for (const s of [-1, 1]){\n        const k = s > 0 ? 11 : 14;\n        let l = cono(p, P(k), P(k + 1), .22*(.9 + .1*b), .13);\n        l = smin(l, ellip(p, [P(k)[0]*1.05, .64, .02], V(.17*(.9 + .1*b), .2, .19)), .05);  // cu\u00e1driceps\n        l = smin(l, cono(p, P(k + 1), P(k + 2), .12, .07), .04);\n        l = smin(l, ellip(p, [P(k + 1)[0], .32, -.045], V(.1, .13, .1)), .04);          // gemelo\n        const pie = Math.max(cono(p, [P(k + 2)[0], .055, -.05], [P(k + 2)[0]*1.06, .045, .16], .062, .052), -p[1]);\n        l = smin(l, pie, .035);\n        piernas = Math.min(piernas, l);\n      }\n      d = smin(d, piernas, .06);\n      // brazos\n      for (const s of [-1, 1]){\n        const k = s > 0 ? 5 : 8;\n        let a = ellip(p, [P(k)[0]*1.01, 1.405, 0], V(.145, .14, .15));                  // deltoides\n        a = smin(a, cono(p, P(k), P(k + 1), .125, .09), .04);\n        a = smin(a, cono(p, P(k + 1), P(k + 2), .085, .055), .03);\n        const pm = P(k + 2), dir = s;\n        let mano = ellip(p, [pm[0] + .03*dir, pm[1] - .075, pm[2] + .01], V(.036, .085, .058));\n        mano = smin(mano, cono(p, [pm[0] + .01*dir, pm[1] - .03, pm[2] + .04], [pm[0] + .02*dir, pm[1] - .085, pm[2] + .075], .018, .015), .015); // pulgar\n        a = smin(a, mano, .025);\n        d = smin(d, a, .05);\n      }\n      return [d, 0];\n    };\n  }\n\n\n  function campoMawashi(m){\n    const b = m, bz = .85 + .15*m;\n    return function(p){\n      const base = smin(ellip(p, V(0, .84, -.01), V(.40*b, .27, .33*bz)), ellip(p, V(0, .99, .07*bz), V(.42*b, .41, .41*bz)), .08);\n      const nalgas = Math.min(ellip(p, V(.155, .80, -.19), V(.19, .21, .19)), ellip(p, V(-.155, .80, -.19), V(.19, .21, .19)));\n      const flanco = Math.min(ellip(p, V(.3*b, 1.0, .02), V(.15, .22, .25*bz)), ellip(p, V(-.3*b, 1.0, .02), V(.15, .22, .25*bz)));\n      const cad = smin(smin(base, nalgas, .06), flanco, .08) - .024;\n      const yBanda = .865 - .085*clamp(p[2]/.4, -1, 1);   // m\u00e1s baja delante, bajo la barriga\n      const franja = Math.abs(p[1] - yBanda) - .088;\n      const delante = Math.max(Math.abs(p[0]) - .1 - .06*clamp((p[1] - .6)/.2, 0, 1), Math.max(p[1] - yBanda, .6 - p[1]), -p[2] + .05);\n      const detras = Math.max(Math.abs(p[0]) - .05, Math.max(p[1] - yBanda, .66 - p[1]), p[2] + .05);\n      let maw = smax(cad, Math.min(franja, delante, detras), .006);\n      // tira entre las piernas\n      maw = Math.min(maw, smax(cono(p, V(0, .655, -.16), V(0, .63, .19), .075, .075), Math.abs(p[0]) - .075, .005));\n      maw = smin(maw, ellip(p, V(0, .95, -.37*bz), V(.115, .08, .07)), .015);      // nudo trasero\n      return [maw, 1];\n    };\n  }\n\n  /* ---------------- cabezas ---------------- */\n  // tipo 0: rikishi con mo\u00f1o \u014dich\u014d; 1: gy\u014dji de Edo (mo\u00f1o peque\u00f1o); 2: gy\u014dji con eboshi\n  function campoCabeza(tipo, rasgo){\n    rasgo = rasgo || 0;\n    const cara = 1 + .06*rasgo;\n    return function(p){\n      let d = ellip(p, V(0, .135, -.012), V(.104, .118, .116));\n      d = smin(d, ellip(p, V(0, .065, .03), V(.098*cara, .108, .1)), .04);              // cara\n      for (const s of [-1, 1]) d = smin(d, ellip(p, V(.062*s, .028, .052), V(.058*cara, .058, .056)), .03); // mofletes\n      d = smin(d, ellip(p, V(0, -.012, .082), V(.046, .036, .04)), .02);               // barbilla\n      d = smin(d, ellip(p, V(0, -.032, .04), V(.082*cara, .04, .072)), .03);            // papada\n      d = smin(d, cono(p, V(0, .1, .113), V(0, .064, .132), .011, .019), .012);         // nariz\n      for (const s of [-1, 1]) d = smin(d, ellip(p, V(.017*s, .064, .121), V(.014, .011, .012)), .008); // aletas\n      d = smin(d, ellip(p, V(0, .118, .098), V(.078, .019, .03)), .02);                 // arco de las cejas\n      for (const s of [-1, 1]) d = smax(d, -ellip(p, V(.037*s, .094, .124), V(.023, .011, .016)), .012); // cuencas\n      for (const s of [-1, 1]) d = smin(d, ellip(p, V(.037*s, .093, .111), V(.017, .008, .008)), .004); // p\u00e1rpados\n      d = smin(d, ellip(p, V(0, .031, .111), V(.029, .01, .014)), .008);                // labios\n      d = smax(d, -ellip(p, V(0, .031, .124), V(.024, .0025, .008)), .003);             // comisura\n      for (const s of [-1, 1]) d = smin(d, ellip(p, V(.104*s, .085, -.004), V(.016, .034, .024)), .01); // orejas\n      return [d, 0];\n    };\n  }\n\n\n  function campoPelo(tipo){\n    return function(p){\n      const craneo = smin(ellip(p, V(0, .135, -.012), V(.104, .118, .116)), ellip(p, V(0, .065, .03), V(.098, .108, .1)), .04) - .0045;\n      const ang = Math.abs(Math.atan2(p[0], p[2]));\n      const yPelo = .158 - .045*smoothstep(.5, 1.4, ang) - .085*smoothstep(1.9, 2.7, ang);\n      const oreja = Math.min(ellip(p, V(.104, .085, -.004), V(.028, .05, .036)), ellip(p, V(-.104, .085, -.004), V(.028, .05, .036)));\n      let d = smax(smax(craneo, yPelo - p[1], .004), -oreja, .004);\n      if (tipo === 0){\n        let k = ellip(p, V(0, .246, .02), V(.034, .016, .075));                          // hoja de ginkgo (\u014dich\u014d)\n        k = smin(k, cono(p, V(0, .222, -.05), V(0, .246, -.0), .024, .02), .015);\n        k = smin(k, ellip(p, V(0, .155, -.1), V(.074, .07, .05)), .03);                   // recogido de la nuca\n        d = smin(d, k, .02);\n      } else if (tipo === 1){\n        d = smin(d, cono(p, V(0, .232, -.03), V(0, .236, .07), .016, .014), .015);\n        d = smin(d, ellip(p, V(0, .2, -.08), V(.055, .04, .04)), .02);\n      } else {\n        d = Math.max(ellip(p, V(0, .27, -.03), V(.085, .13, .1)), .12 - p[1]);             // eboshi\n        d = smin(d, ellip(p, V(0, .36, -.07), V(.06, .05, .06)), .03);\n      }\n      return [d, tipo === 2 ? 5 : 2];\n    };\n  }\n\n  /* ---------------- rasgos pintados en la cara (en coordenadas de la cabeza) ---------------- */\n  function rasgos(p, tipo){\n    if (p[2] < .07) return -1;\n    const x = Math.abs(p[0]), y = p[1];\n    // cejas espesas en arco, como en Kunisada\n    const cy = .117 + .012*Math.cos((x - .038)/.03*1.2) - .004;\n    if (x > .012 && x < .07 && Math.abs(y - cy) < .0065 + .003*smoothstep(.06, .02, x)) return 3;\n    // ojos rasgados\n    const ey = .093 + .006*Math.cos((x - .037)/.02*1.5);\n    if (x > .02 && x < .056 && Math.abs(y - ey) < .0028 && p[2] > .11) return 3;\n    if (Math.hypot(x - .036, y - .092) < .0045 && p[2] > .115) return 3;\n    // labios\n    if (Math.abs(p[0]) < .026 && Math.abs(y - .031) < .0075 && p[2] > .105) return 4;\n    return -1;\n  }\n\n  /* ---------------- surface nets ---------------- */\n  function mallar(campo, min, max, paso, opciones){\n    opciones = opciones || {};\n    const nx = Math.ceil((max[0] - min[0])/paso) + 1, ny = Math.ceil((max[1] - min[1])/paso) + 1, nz = Math.ceil((max[2] - min[2])/paso) + 1;\n    const F = new Float32Array(nx*ny*nz);\n    const id = (i, j, k) => i + nx*(j + ny*k);\n    const p = [0, 0, 0];\n    // primero una rejilla gruesa: solo se afina cerca de la superficie\n    const C = 4, cx = Math.ceil((nx - 1)/C) + 1, cy = Math.ceil((ny - 1)/C) + 1, cz = Math.ceil((nz - 1)/C) + 1;\n    const G = new Float32Array(cx*cy*cz), gid = (i, j, k) => i + cx*(j + cy*k), margen = C*paso*1.6;\n    for (let k = 0; k < cz; k++) for (let j = 0; j < cy; j++) for (let i = 0; i < cx; i++){\n      p[0] = min[0] + i*C*paso; p[1] = min[1] + j*C*paso; p[2] = min[2] + k*C*paso; G[gid(i, j, k)] = campo(p)[0];\n    }\n    for (let k = 0; k < nz; k++) for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++){\n      const i0 = Math.min((i/C)|0, cx - 2), j0 = Math.min((j/C)|0, cy - 2), k0 = Math.min((k/C)|0, cz - 2);\n      let cerca = false, g = 0;\n      for (let c = 0; c < 8 && !cerca; c++){ g = G[gid(i0 + (c & 1), j0 + ((c >> 1) & 1), k0 + ((c >> 2) & 1))]; if (Math.abs(g) < margen) cerca = true; }\n      if (cerca){ p   function visualLuchador(v, L, O, yaw, S){
    v.base.position.set(L.x, ESC.ALTO + L.y, L.z); v.base.rotation.y = yaw;
    let p;
    if (L.caido || (L.fuera && L.y < -.1)) p = 'caida';
    else if (S.fin && S.fin.gana === (v === VIS.a ? 'a' : 'b')) p = 'erguido';
    else if (L.lanzaT > 0) p = Object.assign({}, FIG.P.agarre, { tro: [.4, (v === VIS.a ? 1 : -1)*.9*(L.lanzaT/.45), 0] });
    else if (L.golpeT > 0) p = L.golpes % 2 ? 'empuje' : 'empujeB';
    else if (L.agarra || O.agarra) p = 'agarre';
    else if (L.empuje < -.2) p = 'aguante';
    else if (S.tachiai) p = 'empuje';
    else if (L.esquiva > 0) p = 'aguante';
    else if (L.prepT > 0 && L.prep === 'C') p = Object.assign({}, FIG.P.aguante, { tro: [.2, (v === VIS.a ? 1 : -1)*.5, .3] });
    else if (L.prepT > 0 && L.prep === 'B') p = Object.assign({}, FIG.P.agarre, { pel: .6, tro: [.7, (v === VIS.a ? 1 : -1)*-.5, 0] });

    if (inc <= 0 && L.recibeT > 0){ v.incl.rotation.set(-L.recibeT*1.1, 0, 0); return; }
    if (inc > 0){
      const dx = L.dirCaida[0], dz = L.dirCaida[1];
      const lx = Math.cos(-yaw)*dx - Math.sin(-yaw)*dz, lz = Math.sin(-yaw)*dx + Math.cos(-yaw)*dz;

    } else v.incl.rotation.set(0, 0, 0);
  }

      f.appendChild(boton(t('seguir'), 'rojo', () => finEpoca()));
    } else {
      f.appendChild(boton(t('siguiente'), 'rojo', () => combateCarrera()));
      f.appendChild(boton(t('menu'), 'claro', () => portada()));
    }
    f.appendChild(boton(t('verRep'), 'claro', async () => { cerrarPanel(); cam.modo = 'combate'; const tk = token; await repeticion(tk, .4); if (tk === token) resultado(S, gana); }));
    h.appendChild(f);
  }
  function consejo(S){
    const es = LANG === 'es', a = S.a, e = est || {};
    if (e.t > 0 && e.avance/e.t < .35) return es ? 'Mantén ▶ para empujar: si no empujas, el rival te saca del círculo.' : 'Hold ▶ to drive: if you do not push, the rival forces you out.';
    if (e.esqFallo > 0) return es ? 'La esquiva solo funciona cuando él carga con fuerza; si no, te deja expuesto.' : 'The sidestep only works when he charges hard; otherwise it leaves you exposed.';
    if (S.fin.causa === 'lanzado') return es ? 'Con el equilibrio bajo te pueden lanzar: retrocede (◀) un instante para recuperarlo, o agarra tú primero.' : 'With low balance you can be thrown: step back (◀) for a moment to recover it, or grip first.';
    if (e.golpesRecibidos > 2) return es ? 'Agarra el mawashi (組): con el agarre sus empujones pierden fuerza.' : 'Grip the belt (組): once you hold him, his thrusts lose force.';
    if (e.staMin < .25) return es ? 'Te quedaste sin aliento: no pulses sin parar, cada toque en recarga cansa.' : 'You ran out of stamina: do not press non-stop, every tap during the recharge tires you.';
    if (e.borde > .5) return es ? 'Cerca del borde, ▲ ▼ te mueven alrededor del círculo para salir de la paja.' : 'Near the edge, ▲ ▼ move you round the circle, away from the straw.';
    return es ? 'Gana la salida: apoya los puños justo cuando él apoye el segundo.' : 'Win the charge: put your fists down just as he puts down his second.';
  }
  function finEpoca(){
    const E = EPOCAS[P.epoca], v = P.res.filter(x => x === 1).length, ok = v >= 3;
    if (ok){ for (let k = 0; k < 5; k++) if (P.res[k] == null) P.res[k] = 1; }
    let html = `<h3>${E.num} · ${L(E.era)}</h3><h2>${ok ? t('epocaSuperada') : t('epocaNo')}</h2>
      <div class="banzuke">${P.res.map(r => `<span class="${r === 1 ? 'g' : 'p'}">${r === 1 ? '✓' : '✗'}</span>`).join('')}</div>`;
    if (ok){
      const ultima = P.epoca === EPOCAS.length - 1;
      if (P.epocasHechas < P.epoca + 1){ P.epocasHechas = P.epoca + 1; xp(50); }
      if (ultima){
        if (!P.yokozuna){ P.yokozuna = true; xp(150); }
        html += `<p class="cita">${LANG === 'es' ? 'Thompson (1998) muestra que el yokozuna, que la tradición remonta al siglo XVII d. C., no fue un rango oficial hasta 1909 d. C. Buena parte del ritual que has vivido se creó en la época Edo para dar prestigio a un espectáculo de pago (Guttmann y Thompson, 2001).' : 'Thompson (1998) shows that the yokozuna, which tradition traces back to the seventeenth century AD, was not an official rank until AD 1909. Much of the ritual you have lived through was created in the Edo period to lend prestige to a paid spectacle (Guttmann & Thompson, 2001).'}</p>
          <h2 style="color:var(--bermellon)">${t('yokozuna')}</h2>`;
      }
    }
    guardar();
    const h = panel(html);
    const f = document.createElement('div'); f.className = 'fila';
    if (ok && P.epoca < EPOCAS.length - 1) f.appendChild(boton(t('siguienteEpoca'), 'rojo', () => { P.epoca++; P.combate = 0; P.res = []; guardar(); epoca(P.epoca); }));
    if (!ok) f.appendChild(boton(t('repetirEpoca'), 'rojo', () => { P.combate = 0; P.res = []; guardar(); epoca(P.epoca); }));
    if (ok && P.epoca === EPOCAS.length - 1) f.appendChild(boton(t('grabado'), 'rojo', () => verGrabado()));
    f.appendChild(boton(t('menu'), 'claro', () => { if (ok && P.epoca === EPOCAS.length - 1){ P.epoca = 0; P.combate = 0; P.res = []; guardar(); } portada(); }));
    h.appendChild(f);
  }

  /* ---------------- pausa ---------------- */
  function pausa(){
    if (MODO !== 'combate' && MODO !== 'ceremonia') return;
    pausado = true; SND.dormir();
    const h = panel(`<h3>${t('pausa')}</h3><h2>${L(EPOCAS[actual.epoca].titulo)}</h2>`);
    const f = document.createElement('div'); f.className = 'fila';
    f.appendChild(boton(t('seguir'), 'rojo', () => { cerrarPanel(); pausado = false; SND.despertar(); }));
    f.appendChild(boton(t('como'), 'claro', () => comoSeJuega(() => { pausa(); })));
    f.appendChild(boton(t('menu'), 'claro', () => { pausado = false; SND.despertar(); portada(); }));
    if (HAPP && HAPP.inApp) f.appendChild(boton(t('guardarSalir'), 'claro', () => salirApp()));
    h.appendChild(f);
  }

  /* ---------------- mandos ---------------- */
  const teclas = { ar: false, ab: false, iz: false, de: false };
  const pulsados = [];
  function soltarTodo(){ for (const k in teclas) teclas[k] = false; document.querySelectorAll('#cruceta button,.acc').forEach(b => b.classList.remove('on')); }
  function enlazarMandos(){
    const cr = $('cruceta'), activos = new Map();
    const tecla = (x, y) => { const el = document.elementFromPoint(x, y); return el && el.closest('#cruceta button') ? el.closest('#cruceta button').dataset.k : null; };
    const refrescar = () => { for (const k in teclas) teclas[k] = false; for (const k of activos.values()) if (k) teclas[k] = true; cr.querySelectorAll('button').forEach(b => b.classList.toggle('on', teclas[b.dataset.k])); };
    cr.addEventListener('pointerdown', e => { e.preventDefault(); SND.init(); cr.setPointerCapture(e.pointerId); activos.set(e.pointerId, tecla(e.clientX, e.clientY)); refrescar(); });
    cr.addEventListener('pointermove', e => { if (!activos.has(e.pointerId)) return; activos.set(e.pointerId, tecla(e.clientX, e.clientY)); refrescar(); });
    const fin = e => { activos.delete(e.pointerId); refrescar(); };
    cr.addEventListener('pointerup', fin); cr.addEventListener('pointercancel', fin); cr.addEventListener('lostpointercapture', fin);
    document.querySelectorAll('.acc').forEach(b => {
      b.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); SND.init(); b.classList.add('on'); if (MODO === 'combate' && !pausado) pulsados.push(b.dataset.k); });
      const up = () => b.classList.remove('on'); b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('pointerleave', up);
    });
    const mapa = { ArrowUp: 'ar', KeyW: 'ar', ArrowDown: 'ab', KeyS: 'ab', ArrowLeft: 'iz', KeyA: 'iz', ArrowRight: 'de', KeyD: 'de' };
    const acc = { KeyJ: 'A', KeyZ: 'A', KeyK: 'B', KeyX: 'B', KeyL: 'C', KeyC: 'C' };
    addEventListener('keydown', e => {
      if (mapa[e.code]){ teclas[mapa[e.code]] = true; e.preventDefault(); }
      if (acc[e.code] && !e.repeat && MODO === 'combate' && !pausado){ pulsados.push(acc[e.code]); SND.init(); }
      if (e.code === 'Escape' || e.code === 'KeyP'){ if (pausado){ cerrarPanel(); pausado = false; SND.despertar(); } else pausa(); }
    });
    addEventListener('keyup', e => { if (mapa[e.code]) teclas[mapa[e.code]] = false; });
    addEventListener('blur', () => { soltarTodo(); });
    document.addEventListener('visibilitychange', () => { if (document.hidden){ soltarTodo(); SND.dormir(); if (MODO === 'combate' && !pausado) pausa(); } else if (!pausado) SND.despertar(); });
    window.HAPP_PAUSA = () => { if (MODO === 'combate' && !pausado) pausa(); };
    window.HAPP_GUARDAR = () => guardar();
    $('pausaBtn').addEventListener('click', e => { e.stopPropagation(); pausa(); });
    $('sonidoBtn').addEventListener('click', e => { e.stopPropagation(); SND.init(); const m = SND.alternar(); $('sonidoBtn').textContent = m ? '✕♪' : '♪'; });
    $('sonidoBtn').textContent = SND.mudo ? '✕♪' : '♪';
    $('idiomaBtn').addEventListener('click', e => {
      e.stopPropagation(); LANG = LANG === 'es' ? 'en' : 'es'; try { localStorage.setItem('sumo.lang', LANG); } catch (er) {} traducirDOM();
      if (MODO === 'portada') portada(); else if (MODO === 'epoca') epoca(P.epoca);
    });
    addEventListener('resize', tamano); addEventListener('orientationchange', () => setTimeout(tamano, 250));
  }

  /* ---------------- ganchos de prueba ---------------- */
  window.render_game_to_text = () => JSON.stringify({
    coordenadas: 'plano del dohyō: origen en el centro, x a la derecha de la salida, z hacia la cámara inicial, metros',
    modo: MODO, pausado, epoca: P.epoca, combate: P.combate, conc,
    jugador: combate ? { x: +combate.a.x.toFixed(2), z: +combate.a.z.toFixed(2), sta: +combate.a.sta.toFixed(2), bal: +combate.a.bal.toFixed(2), agarra: combate.a.agarra, caido: combate.a.caido, fuera: combate.a.fuera } : null,
    rival: combate ? { x: +combate.b.x.toFixed(2), z: +combate.b.z.toFixed(2), sta: +combate.b.sta.toFixed(2), bal: +combate.b.bal.toFixed(2), agarra: combate.b.agarra, caido: combate.b.caido, fuera: combate.b.fuera } : null,
    fin: combate && combate.fin ? combate.fin : null
  });
  window.advanceTime = ms => { const n = Math.ceil(ms/16.67); for (let i = 0; i < n; i++){ if (MODO === 'combate' && combate && !repro) pasoCombate(1/60); } };
  window.SUMO = { P, portada, combateRapido, epoca, accion: k => pulsados.push(k), teclas };

  enlazarMandos();
  cargar();
})();
</script>
</body>
</html>
