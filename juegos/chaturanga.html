<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a110c">
<title>Chaturanga · Los cuatro miembros del ejército</title>
<style>
:root{
  --papel:#f2e6cc; --papel2:#e6d5b2; --tinta:#1f140d; --tinta2:#2e2016; --rubia:#9e2a1e; --indigo:#22385e; --oro:#c9a24a; --azafran:#d98a1e;
  --ok:#2d6aa3; --mal:#d9822b;
  --tit:"Noto Serif Devanagari","Kohinoor Devanagari","Devanagari Sangam MN","Devanagari MT","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --txt:Calibri,Carlito,"Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0f0a07;color:var(--papel);font-family:var(--txt);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
#lienzo{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#vineta{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 52%,rgba(0,0,0,0) 58%,rgba(14,8,4,.5) 100%)}
button{font-family:var(--txt);cursor:pointer}
.oculto{display:none!important}

/* carga */
#carga{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#140d09;transition:opacity .6s}
#carga .sello{width:92px;height:92px;border-radius:50%;border:3px solid var(--oro);display:flex;align-items:center;justify-content:center;font:700 34px/1 var(--tit);color:var(--oro);animation:latir 1.6s ease-in-out infinite}
#carga .barra{width:min(320px,70vw);height:4px;background:#3a2a1c;border-radius:2px;overflow:hidden}
#carga .barra i{display:block;height:100%;width:0;background:var(--oro);transition:width .25s}
#carga p{margin:0;font:16px var(--txt);color:#d8c49c;letter-spacing:.04em}
@keyframes latir{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* paneles */
.capa{position:fixed;inset:0;z-index:35;display:flex;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.capa.velo{background:rgba(12,8,5,.55);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.hoja{position:relative;background:var(--papel);color:var(--tinta);border-radius:6px;box-shadow:0 18px 50px rgba(0,0,0,.55),inset 0 0 0 1px rgba(80,50,20,.25);padding:22px 26px;max-width:660px;width:100%;max-height:100%;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.hoja::before{content:"";position:absolute;inset:6px;border:1px solid rgba(158,42,30,.35);border-radius:3px;pointer-events:none}
.hoja::after{content:"";position:absolute;left:14px;right:14px;top:14px;height:6px;background:repeating-linear-gradient(90deg,rgba(158,42,30,.45) 0 6px,transparent 6px 10px,rgba(34,56,94,.4) 10px 14px,transparent 14px 18px);pointer-events:none;border-radius:2px}
.hoja h2{font:700 26px/1.15 var(--tit);margin:8px 0 6px;color:var(--tinta)}
.hoja h3{font:700 13px/1.2 var(--txt);margin:8px 0 8px;letter-spacing:.14em;text-transform:uppercase;color:var(--rubia)}
.hoja p{font:17px/1.42 var(--txt);margin:0 0 12px}
.hoja .cita{font:16px/1.45 var(--txt);border-left:3px solid var(--rubia);padding:2px 0 2px 12px;margin:6px 0 10px;color:#3a2a1e}
.hoja .fuente{font:13px/1.35 var(--txt);color:#6c5a44;margin:0 0 12px}
.hoja .nota{font:14px/1.4 var(--txt);color:#5a4632;background:#eadbb9;border-radius:6px;padding:8px 10px;margin:0 0 12px}
.fila{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.btn{min-height:46px;padding:0 20px;border-radius:24px;border:0;font:700 17px/1 var(--txt);letter-spacing:.02em;background:var(--tinta);color:var(--papel);box-shadow:0 3px 0 #000}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
.btn.rojo{background:var(--rubia);color:#fff;box-shadow:0 3px 0 #561409}
.btn.claro{background:transparent;color:var(--tinta);box-shadow:inset 0 0 0 2px var(--tinta)}
.btn[disabled]{opacity:.4}
.lista{margin:6px 0 12px;padding-left:20px;font:16px/1.45 var(--txt)}
.lista li{margin-bottom:5px}
.tabla{width:100%;border-collapse:collapse;font:15px/1.3 var(--txt);margin:6px 0 12px}
.tabla td{padding:6px 4px;border-bottom:1px solid rgba(120,80,40,.25);vertical-align:top}
.tabla td:first-child{font-weight:700;white-space:nowrap;padding-right:10px}

/* portada */
#portada{align-items:flex-end;justify-content:flex-start;background:linear-gradient(90deg,rgba(12,7,4,.82) 0%,rgba(12,7,4,.4) 46%,rgba(0,0,0,0) 72%)}
#portada .bloque{max-width:540px;padding:0 0 4vh 2vw}
#portada .deva{font:700 clamp(46px,10vh,96px)/1 var(--tit);color:var(--papel);text-shadow:0 4px 24px rgba(0,0,0,.6);letter-spacing:.01em}
#portada .deva b{color:var(--oro);font-weight:700}
#portada h1{font:700 clamp(24px,5vh,42px)/1.05 var(--tit);margin:8px 0 4px;color:var(--papel)}
#portada .sub{font:clamp(14px,2.6vh,18px)/1.38 var(--txt);color:#e8d6b0;margin:0 0 18px;max-width:460px}
#portada .btn{min-height:50px;font-size:18px}
#portada .btn.claro{color:var(--papel);box-shadow:inset 0 0 0 2px rgba(242,230,204,.7)}
#esquina{position:fixed;top:max(10px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));z-index:30;display:flex;gap:8px}
.icono{min-width:46px;height:46px;border-radius:23px;border:1px solid rgba(242,230,204,.45);background:rgba(20,12,8,.62);color:var(--papel);font:700 15px/1 var(--txt);padding:0 12px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#copy{position:fixed;left:max(12px,env(safe-area-inset-left));bottom:max(6px,env(safe-area-inset-bottom));z-index:21;font:12px var(--txt);color:rgba(242,230,204,.6);pointer-events:none}

/* lámina */
#lamina .hoja{max-width:880px;display:flex;gap:22px;align-items:center}
#lamina img{max-height:min(66vh,480px);max-width:46%;box-shadow:0 6px 18px rgba(0,0,0,.35);border:8px solid #f7efdc;outline:1px solid #6c5a44;image-rendering:auto;background:#fff}
@media (max-aspect-ratio:1/1){#lamina .hoja{flex-direction:column}#lamina img{max-width:100%}}

/* pregunta */
#pregunta .hoja{max-width:740px}
.opciones{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 6px}
@media (max-width:560px){.opciones{grid-template-columns:1fr}}
.op{position:relative;min-height:54px;text-align:left;padding:10px 14px 10px 44px;border-radius:6px;border:2px solid #b9a07a;background:#fbf4e4;color:var(--tinta);font:600 16px/1.25 var(--txt)}
.op::before{content:attr(data-l);position:absolute;left:12px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;background:var(--tinta);color:var(--papel);font:700 13px/22px var(--txt);text-align:center}
.op.ok{border-color:var(--ok);background:#e3eef8}.op.ok::before{content:"✓";background:var(--ok)}
.op.mal{border-color:var(--mal);background:#fbeee0}.op.mal::before{content:"✗";background:var(--mal)}
.op[disabled]{cursor:default}
.explica{display:none;margin-top:8px;padding:10px 12px;border-radius:6px;background:#ecdcba;font:16px/1.4 var(--txt)}
.explica b{font-weight:700}.explica.on{display:block}
.fichas{display:inline-flex;gap:5px;vertical-align:middle}
.ficha{width:14px;height:14px;border-radius:50%;border:2px solid var(--oro);display:inline-block}
.ficha.on{background:var(--oro)}

/* marcador de la partida: columnas a los lados del tablero */
.col{position:fixed;z-index:10;display:flex;flex-direction:column;gap:10px;pointer-events:none;width:min(230px,22vw)}
#izq{left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));bottom:max(10px,env(safe-area-inset-bottom));justify-content:space-between}
#der{right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));align-items:flex-end}
.placa{background:rgba(20,12,8,.7);border:1px solid rgba(242,230,204,.25);border-radius:8px;padding:8px 11px 9px;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);transition:box-shadow .25s,border-color .25s}
.placa.turno{border-color:var(--oro);box-shadow:0 0 0 2px rgba(201,162,74,.55),0 0 18px rgba(201,162,74,.3)}
.placa .quien{display:flex;align-items:center;gap:8px;font:700 16px/1.15 var(--tit);color:var(--papel)}
.placa .quien i{width:16px;height:16px;border-radius:50%;flex:none;box-shadow:0 0 0 2px rgba(242,230,204,.6)}
.placa .quien i.marfil{background:#e7dcc2}.placa .quien i.laca{background:#47100c}
.placa .det{font:13px/1.3 var(--txt);color:#d8c49c;margin-top:3px}
.placa .cap{font:600 13px/1.2 var(--txt);color:#e8d6b0;margin-top:5px;min-height:16px;letter-spacing:.02em}
.placa .estado{font:700 13px/1.2 var(--txt);color:var(--oro);margin-top:5px;letter-spacing:.06em;text-transform:uppercase;min-height:16px}
#info{pointer-events:none}
#info .nom{font:700 17px/1.15 var(--tit);color:var(--papel)}
#info p{margin:4px 0 0;font:14px/1.35 var(--txt);color:#e8d6b0}
.acciones{display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:auto}
.acc{min-height:48px;min-width:150px;padding:0 16px;border-radius:24px;border:1px solid rgba(242,230,204,.55);background:rgba(20,12,8,.7);color:var(--papel);font:700 16px/1 var(--txt);display:flex;align-items:center;justify-content:center;gap:8px;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.acc b{min-width:24px;height:24px;border-radius:12px;background:var(--oro);color:var(--tinta);font:800 14px/24px var(--txt);text-align:center}
.acc[disabled]{opacity:.45}
.acc.brilla{animation:brilla 1.2s ease-in-out 3}
@keyframes brilla{50%{background:rgba(201,162,74,.85);color:var(--tinta)}}
@media (hover:hover) and (pointer:fine){.acc::after{content:attr(data-tecla);font:700 11px var(--txt);background:rgba(242,230,204,.85);color:var(--tinta);border-radius:6px;padding:2px 5px;margin-left:2px}}

/* avisos */
#aviso{position:fixed;left:50%;top:26%;transform:translate(-50%,-50%);z-index:12;pointer-events:none;text-align:center;opacity:0;transition:opacity .2s,transform .2s}
#aviso.on{opacity:1;transform:translate(-50%,-50%) scale(1.04)}
#aviso b{display:block;font:700 clamp(32px,8vh,64px)/1 var(--tit);color:var(--papel);text-shadow:0 3px 0 #000,0 0 26px rgba(0,0,0,.7)}
#aviso small{display:block;margin-top:8px;font:700 clamp(14px,2.6vh,19px)/1.25 var(--txt);color:#f2dfb4;text-shadow:0 2px 0 #000;max-width:min(560px,80vw)}
#guia{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:13;pointer-events:none;max-width:min(520px,48vw)}
#guia p{margin:0;font:700 clamp(14px,2.6vh,18px)/1.3 var(--txt);text-align:center;background:rgba(20,12,8,.74);padding:8px 14px;border-radius:18px}
#pensando{position:fixed;left:50%;top:max(10px,env(safe-area-inset-top));transform:translateX(-50%);z-index:12;pointer-events:none;font:700 14px var(--txt);background:rgba(20,12,8,.7);padding:6px 14px;border-radius:16px;color:#e8d6b0;opacity:0;transition:opacity .3s}
#pensando.on{opacity:1}
#pensando i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--oro);margin-left:4px;animation:pt 1s infinite}
#pensando i:nth-child(2){animation-delay:.15s}#pensando i:nth-child(3){animation-delay:.3s}
@keyframes pt{0%,100%{opacity:.25}50%{opacity:1}}

.lista-cap{display:flex;flex-direction:column;gap:10px;margin:8px 0}
.capi{display:flex;align-items:center;gap:14px;text-align:left;padding:10px 14px;border-radius:8px;border:2px solid #b9a07a;background:#fbf4e4;color:var(--tinta);font:700 17px var(--txt)}
.capi b{font:700 24px var(--tit);color:var(--rubia);min-width:38px;text-align:center}
.capi small{display:block;font:500 13px var(--txt);color:#6c5a44;margin-top:2px}
.capi.cerrada{opacity:.55}
.selector{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}
.selector button{min-height:44px;padding:0 14px;border-radius:22px;border:2px solid #b9a07a;background:#fbf4e4;color:var(--tinta);font:700 15px var(--txt)}
.selector button.sel{background:var(--tinta);color:var(--papel);border-color:var(--tinta)}
.selector button i{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:6px;box-shadow:0 0 0 2px rgba(0,0,0,.35)}

#rotar{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#0f0a07;color:var(--papel);font:600 20px/1.3 var(--txt);text-align:center;padding:24px}
#rotar b{font-size:56px;line-height:1;display:block;animation:rot 2.2s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-width:900px){#rotar{display:flex}}
.happ-in #copy{display:none}
.happ-in .capa.velo{padding-top:max(62px,calc(env(safe-area-inset-top) + 56px))}
.juego #copy{display:none}
.juego #esquina .idi{display:none}
@media (max-height:440px){.hoja{padding:14px 18px}.hoja h2{font-size:21px}.hoja p,.hoja .cita{font-size:15px;margin-bottom:8px}.hoja .fuente{font-size:12px;margin-bottom:6px}.op{min-height:46px;font-size:15px}.btn{min-height:44px;font-size:16px}
  .placa{padding:6px 9px}.placa .quien{font-size:14px}.placa .det,.placa .cap,.placa .estado{font-size:12px}#info p{font-size:12.5px}#info .nom{font-size:15px}.acc{min-height:44px;min-width:128px;font-size:15px}.col{gap:6px}.icono{height:42px;min-width:42px}}
</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<div id="vineta"></div>

<div id="carga"><div class="sello">चतु</div><div class="barra"><i></i></div><p id="cargaTxt">…</p></div>

<div id="esquina">
  <button class="icono" id="pausaBtn" aria-label="Pausa">❚❚</button>
  <button class="icono idi" id="idiomaBtn">EN</button>
  <button class="icono" id="sonidoBtn" aria-label="Sonido">♪</button>
</div>

<div class="col oculto" id="izq">
  <div class="placa" id="pRival"></div>
  <div class="placa oculto" id="info"></div>
  <div class="placa" id="pYo"></div>
</div>
<div class="col oculto" id="der">
  <div class="acciones">
    <button class="acc" id="bConsejo" data-tecla="C"></button>
    <button class="acc" id="bDeshacer" data-tecla="Z"></button>
    <button class="acc" id="bVista" data-tecla="V"></button>
  </div>
</div>
<div id="pensando"></div>
<div id="aviso"><b></b><small></small></div>
<div id="guia" class="oculto"><p id="guiaTxt"></p></div>

<div class="capa oculto" id="portada"><div class="bloque">
  <div class="deva">चतुर<b>ङ्ग</b></div>
  <h1 data-t="titulo"></h1>
  <p class="sub" data-t="subtitulo"></p>
  <div class="fila" id="portadaBtns"></div>
</div></div>

<div class="capa velo oculto" id="panel"><div class="hoja" id="hoja"></div></div>
<div class="capa velo oculto" id="pregunta"><div class="hoja" id="hojaP"></div></div>
<div class="capa velo oculto" id="lamina"><div class="hoja"><img id="laminaImg" alt=""><div id="laminaTxt"></div></div></div>

<div id="rotar"><b aria-hidden="true">📱</b><span data-t="girar"></span></div>
<div id="copy">© Diseñado y Creado por Alejandro Leiva Arcas</div>

<script>window.HAPP_CFG={tema:5,volver:'../',orient:'h'};
/* Puente con Historiapp. Lo inserta hacer_historiapp.py en la versión <juego>-historiapp.html.
   Configuración en window.HAPP_CFG = { tema, volver, orient, fichas, enlaces, barra, barraEn, barraClase, css }.
   1. Idioma: toma historiapp.lang si existe y lo presenta al juego como navigator.language.
   2. Sonido: ningún AudioContext ni <audio> suena hasta el primer toque (iOS lo bloquea).
   3. Dentro de la app (carpeta juegos/ y alguna clave historiapp.* en el mismo origen):
      XP en historiapp.progress, botón para volver, enlaces a fichas.
   4. Aviso de girar el dispositivo cuando el juego necesita la otra orientación (C.orient). */
(function () {
  'use strict';
  var C = window.HAPP_CFG || {};
  var inApp = false, lang = null;
  try {
    if (/\/juegos\//.test(location.pathname)) {
      for (var i = 0; i < localStorage.length; i++) {
        if (String(localStorage.key(i)).indexOf('historiapp.') === 0) { inApp = true; break; }
      }
    }
  } catch (e) {}
  try { lang = localStorage.getItem('historiapp.lang'); } catch (e) {}
  if (lang !== 'es' && lang !== 'en') lang = null;
  if (lang) {
    var tag = lang === 'en' ? 'en-GB' : 'es-ES';
    try {
      Object.defineProperty(Navigator.prototype, 'language', { get: function () { return tag; }, configurable: true });
      Object.defineProperty(Navigator.prototype, 'languages', { get: function () { return [tag]; }, configurable: true });
    } catch (e) {}
    try { document.documentElement.lang = lang; } catch (e) {}
  }
  var EN = (lang || (String(navigator.language || 'es').toLowerCase().indexOf('es') === 0 ? 'es' : 'en')) === 'en';
  var T = EN
    ? { back: 'Historiapp', xp: '+{n} XP in Historiapp', rot: 'Rotate your device to play', ficha: 'Read the study sheet' }
    : { back: 'Historiapp', xp: '+{n} XP en Historiapp', rot: 'Gira el dispositivo para jugar', ficha: 'Leer la ficha' };

  /* ---------- Sonido tras el primer toque ---------- */
  var unlocked = false, ctxs = [], pend = [];
  var AC = window.AudioContext || window.webkitAudioContext;
  var origResume = AC && AC.prototype.resume;
  if (AC) {
    var W = function (o) {
      var c = o === undefined ? new AC() : new AC(o);
      ctxs.push(c);
      if (!unlocked) { try { c.suspend(); } catch (e) {} }
      c.resume = function () { return unlocked ? origResume.call(c) : Promise.resolve(); };
      return c;
    };
    W.prototype = AC.prototype;
    try { window.AudioContext = W; if (window.webkitAudioContext) window.webkitAudioContext = W; } catch (e) {}
  }
  var MP = window.HTMLMediaElement && HTMLMediaElement.prototype, origPlay = MP && MP.play;
  if (origPlay) {
    MP.play = function () {
      if (unlocked) return origPlay.apply(this, arguments);
      if (pend.indexOf(this) < 0) pend.push(this);
      return Promise.resolve();
    };
  }
  function unlock() {
    if (unlocked) return;
    unlocked = true;
    ctxs.forEach(function (c) { try { if (c.state !== 'running' && c.state !== 'closed') origResume.call(c); } catch (e) {} });
    pend.splice(0).forEach(function (el) { try { var p = origPlay.call(el); if (p && p.catch) p.catch(function () {}); } catch (e) {} });
  }
  ['pointerdown', 'touchend', 'mousedown', 'keydown'].forEach(function (ev) {
    addEventListener(ev, unlock, { capture: true, passive: true });
  });

  /* ---------- API para el juego ---------- */
  var H = window.HAPP = { inApp: inApp, lang: lang, EN: EN };
  var toastEl = null, toastT = 0;
  function toast(msg) {
    if (!toastEl) return;
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    clearTimeout(toastT);
    toastT = setTimeout(function () { toastEl.classList.remove('on'); }, 1800);
  }
  H.xp = function (n) {
    n = Math.round(n);
    if (!inApp || !(n > 0)) return;
    try {
      var k = 'historiapp.progress';
      var p = JSON.parse(localStorage.getItem(k)) || { xp: 0, streak: 0, lastDay: null, seen: {}, badges: {}, gl: {}, daily: {} };
      p.xp = (p.xp || 0) + n;
      localStorage.setItem(k, JSON.stringify(p));
    } catch (e) { return; }
    toast(T.xp.replace('{n}', n));
  };
  H.open = function (tema, id) {
    if (!inApp) return;
    try { window.open('../#t' + tema + '/f/' + encodeURIComponent(id), '_blank'); } catch (e) {}
  };
  H.fichaHTML = function (key) {
    var f = C.fichas && C.fichas[key];
    if (!inApp || !f) return '';
    return '<button type="button" class="happ-ficha" onclick="event.stopPropagation();HAPP.open(' + f[0] + ',\'' + f[1] + '\')">📖 ' + T.ficha + ' ' + f[2] + '</button>';
  };

  /* ---------- Interfaz: barra, aviso de girar y avisos de XP ---------- */
  var css = '' +

    '.happ-toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;z-index:2147483001;pointer-events:none;' +
    'padding:10px 18px;border-radius:22px;background:#EDAB00;color:#1b1406;font:700 15px/1 system-ui,-apple-system,"Segoe UI",sans-serif;box-shadow:0 6px 18px rgba(0,0,0,.4);' +

window.MALLAS_SRC="/* Sumo \u00b7 escultura de los cuerpos. Cada figura se esculpe como un campo de distancias con uniones suaves\n   (carne que se funde en la barriga, la papada y los muslos) y se convierte en malla con \u00absurface nets\u00bb.\n   Se genera al cargar, sin descargar modelos, y se ata a un esqueleto de 17 huesos para animarla. */\n(function(root){\n  const V = (x, y, z) => [x, y, z];\n  const sub = (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];\n  const dot = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];\n  const len = a => Math.sqrt(dot(a, a));\n  const clamp = (x, a, b) => x < a ? a : x > b ? b : x;\n  const smoothstep = (a, b, x) => { const t = clamp((x - a)/(b - a), 0, 1); return t*t*(3 - 2*t); };\n\n  // primitivas\n  function ellip(p, c, r){ // aproximaci\u00f3n de distancia a un elipsoide\n    const x = (p[0]-c[0])/r[0], y = (p[1]-c[1])/r[1], z = (p[2]-c[2])/r[2];\n    const k0 = Math.sqrt(x*x + y*y + z*z);\n    const x1 = x/r[0], y1 = y/r[1], z1 = z/r[2];\n    const k1 = Math.sqrt(x1*x1 + y1*y1 + z1*z1);\n    return k1 > 1e-6 ? k0*(k0 - 1)/k1 : -Math.min(r[0], r[1], r[2]);\n  }\n  function cono(p, a, b, ra, rb){ // c\u00e1psula de radio variable (aproximaci\u00f3n)\n    const pa = sub(p, a), ba = sub(b, a);\n    const h = clamp(dot(pa, ba)/dot(ba, ba), 0, 1);\n    const d = [pa[0] - ba[0]*h, pa[1] - ba[1]*h, pa[2] - ba[2]*h];\n    return len(d) - (ra + (rb - ra)*h);\n  }\n  function caja(p, c, h, r){ const qx = Math.abs(p[0]-c[0]) - h[0] + r, qy = Math.abs(p[1]-c[1]) - h[1] + r, qz = Math.abs(p[2]-c[2]) - h[2] + r;\n    return Math.hypot(Math.max(qx, 0), Math.max(qy, 0), Math.max(qz, 0)) + Math.min(Math.max(qx, qy, qz), 0) - r; }\n  function smin(a, b, k){ const h = clamp(.5 + .5*(b - a)/k, 0, 1); return b + (a - b)*h - k*h*(1 - h); }\n  function smax(a, b, k){ return -smin(-a, -b, k); }\n\n  /* ---------------- el cuerpo de un rikishi (sin cabeza) ---------------- */\n  // m: corpulencia (1 normal, 1.2 pesado, .85 joven del sumo antiguo)\n  function esqueleto(m){\n    const sh = .40 + .03*(m - 1);\n    return [\n      { n: 'raiz',     p: -1, o: V(0, 0, 0) },\n      { n: 'pelvis',   p: 0,  o: V(0, .86, 0) },\n      { n: 'lumbar',   p: 1,  o: V(0, 1.04, 0) },\n      { n: 'pecho',    p: 2,  o: V(0, 1.28, 0) },\n      { n: 'cuello',   p: 3,  o: V(0, 1.52, 0) },\n      { n: 'brazoD',   p: 3,  o: V(sh, 1.41, -.02) },  { n: 'codoD', p: 5,  o: V(sh + .21, 1.13, -.02) }, { n: 'manoD', p: 6,  o: V(sh + .37, .88, .0) },\n      { n: 'brazoI',   p: 3,  o: V(-sh, 1.41, -.02) }, { n: 'codoI', p: 8,  o: V(-sh - .21, 1.13, -.02) }, { n: 'manoI', p: 9,  o: V(-sh - .37, .88, .0) },\n      { n: 'musloD',   p: 1,  o: V(.2, .84, 0) },  { n: 'rodillaD', p: 11, o: V(.255, .47, .03) }, { n: 'pieD', p: 12, o: V(.27, .09, 0) },\n      { n: 'musloI',   p: 1,  o: V(-.2, .84, 0) }, { n: 'rodillaI', p: 14, o: V(-.255, .47, .03) }, { n: 'pieI', p: 15, o: V(-.27, .09, 0) }\n    ];\n  }\n\n  function campoCuerpo(m){\n    const H = esqueleto(m), P = i => H[i].o;\n    const b = m, bz = .85 + .15*m;\n    // devuelve [distancia, regi\u00f3n] con regi\u00f3n 0 piel, 1 mawashi\n    return function(p){\n      // tronco\n      let d = ellip(p, V(0, .99, .07*bz), V(.42*b, .41, .41*bz));                       // barriga\n      d = smin(d, ellip(p, V(0, .84, -.01), V(.40*b, .27, .33*bz)), .08);              // bajo vientre y caderas\n      d = smin(d, ellip(p, V(0, 1.27, -.01), V(.41*b, .27, .31*bz)), .09);             // t\u00f3rax\n      d = smin(d, ellip(p, V(0, 1.30, -.09), V(.38*b, .25, .26)), .08);                // espalda\n      d = smin(d, ellip(p, V(0, 1.45, -.04), V(.30*b, .12, .18)), .07);                // trapecios\n      for (const s of [-1, 1]){\n        d = smin(d, ellip(p, V(.155*s, 1.27, .2*bz), V(.15, .135, .11)), .05);          // pectorales ca\u00eddos\n        d = smin(d, ellip(p, V(.155*s, .80, -.19), V(.19, .21, .19)), .06);             // nalgas\n        d = smin(d, ellip(p, V(.3*b*s, 1.0, .02), V(.15, .22, .25*bz)), .08);           // flancos\n      }\n      d = smin(d, cono(p, V(0, 1.42, -.01), V(0, 1.63, 0), .135, .12), .07);            // cuello\n      // piernas\n      let piernas = 1e9;\n      for (const s of [-1, 1]){\n        const k = s > 0 ? 11 : 14;\n        let l = cono(p, P(k), P(k + 1), .22*(.9 + .1*b), .13);\n        l = smin(l, ellip(p, [P(k)[0]*1.05, .64, .02], V(.17*(.9 + .1*b), .2, .19)), .05);  // cu\u00e1driceps\n        l = smin(l, cono(p, P(k + 1), P(k + 2), .12, .07), .04);\n        l = smin(l, ellip(p, [P(k + 1)[0], .32, -.045], V(.1, .13, .1)), .04);          // gemelo\n        const pie = Math.max(cono(p, [P(k + 2)[0], .055, -.05], [P(k + 2)[0]*1.06, .045, .16], .062, .052), -p[1]);\n        l = smin(l, pie, .035);\n        piernas = Math.min(piernas, l);\n      }\n      d = smin(d, piernas, .06);\n      // brazos\n      for (const s of [-1, 1]){\n        const k = s > 0 ? 5 : 8;\n        let a = ellip(p, [P(k)[0]*1.01, 1.405, 0], V(.145, .14, .15));                  // deltoides\n        a = smin(a, cono(p, P(k), P(k + 1), .125, .09), .04);\n        a = smin(a, cono(p, P(k + 1), P(k + 2), .085, .055), .03);\n        const pm = P(k + 2), dir = s;\n        let mano = ellip(p, [pm[0] + .03*dir, pm[1] - .075, pm[2] + .01], V(.036, .085, .058));\n        mano = smin(mano, cono(p, [pm[0] + .01*dir, pm[1] - .03, pm[2] + .04], [pm[0] + .02*dir, pm[1] - .085, pm[2] + .075], .018, .015), .015); // pulgar\n        a = smin(a, mano, .025);\n        d = smin(d, a, .05);\n      }\n      return [d, 0];\n    };\n  }\n\n\n  function campoMawashi(m){\n    const b = m, bz = .85 + .15*m;\n    return function(p){\n      const base = smin(ellip(p, V(0, .84, -.01), V(.40*b, .27, .33*bz)), ellip(p, V(0, .99, .07*bz), V(.42*b, .41, .41*bz)), .08);\n      const nalgas = Math.min(ellip(p, V(.155, .80, -.19), V(.19, .21, .19)), ellip(p, V(-.155, .80, -.19), V(.19, .21, .19)));\n      const flanco = Math.min(ellip(p, V(.3*b, 1.0, .02), V(.15, .22, .25*bz)), ellip(p, V(-.3*b, 1.0, .02   /* pabellón: columnas de fuste facetado y capitel de loto, arcos lobulados y celosías */
  function arcoLobulado(w, h, lobulos) {
    const s = new THREE.Shape(), W = w / 2 + .6;
    s.moveTo(-W, 0); s.lineTo(W, 0); s.lineTo(W, h + 1.6); s.lineTo(-W, h + 1.6); s.lineTo(-W, 0);
    const hueco = new THREE.Path(), r = w / 2;
    hueco.moveTo(-r, 0); hueco.lineTo(-r, h - r * .2);
    const n = lobulos;
    for (let i = 0; i < n; i++) {
      const a0 = Math.PI - i / n * Math.PI, a1 = Math.PI - (i + 1) / n * Math.PI, am = (a0 + a1) / 2;
      const p1 = [Math.cos(a1) * r, h - r * .2 + Math.sin(a1) * r * 1.1], pm = [Math.cos(am) * r * 1.12, h - r * .2 + Math.sin(am) * r * 1.22];
      hueco.quadraticCurveTo(pm[0], pm[1], p1[0], p1[1]);
    }
    hueco.lineTo(r, 0); hueco.lineTo(-r, 0);
    s.holes.push(hueco);
    return new THREE.ExtrudeGeometry(s, { depth: .5, bevelEnabled: true, bevelSize: .05, bevelThickness: .05, bevelSegments: 1, curveSegments: 6 });
  }
  function arquitectura(a) {

    const piedra = mat({ roughness: .78, map: texPiedra(a, 11) });

    const azulejo = (a === AMB.persia || a === AMB.arabe) ? mat({ roughness: .3, map: texAzulejo(a) }) : null;
    TM.arqMats = [piedra, piedraCl, azulejo];
    const R = 13.5, N = 12, alto = 7.5, y0 = -2.62;
    const fuste = new THREE.CylinderGeometry(.42, .5, alto, 12);
    const capitel = new THREE.LatheGeometry([new THREE.Vector2(.42, 0), new THREE.Vector2(.7, .25), new THREE.Vector2(.82, .45), new THREE.Vector2(.6, .55), new THREE.Vector2(.9, .7), new THREE.Vector2(.9, .85), new THREE.Vector2(0, .85)], 16);
    const basa = new THREE.CylinderGeometry(.75, .85, .6, 12);
    const arcoG = arcoLobulado(2 * R * Math.sin(Math.PI / N) - .9, alto - 1.2, a === AMB.europa ? 1 : 7);
    const jaliM = new THREE.MeshStandardMaterial({ color: new THREE.Color(a.piedra2).convertSRGBToLinear(), alphaMap: texJali(a), transparent: true, alphaTest: .5, side: THREE.DoubleSide, roughness: .8 });
    for (let i = 0; i < N; i++) {
      const ang = (i + .5) / N * Math.PI * 2;
      const x = Math.sin(ang) * R, z = Math.cos(ang) * R;
      const f = new THREE.Mesh(fuste, azulejo || piedra); f.position.set(x, y0 + alto / 2 + .6, z); f.castShadow = true; grupoArq.add(f);
      const b = new THREE.Mesh(basa, piedraCl); b.position.set(x, y0 + .3, z); grupoArq.add(b);
      const c = new THREE.Mesh(capitel, piedraCl); c.position.set(x, y0 + alto + .6, z); grupoArq.add(c);
      const am = ang + Math.PI / N, xa = Math.sin(am) * R * Math.cos(Math.PI / N), za = Math.cos(am) * R * Math.cos(Math.PI / N);
      const ar = new THREE.Mesh(arcoG, piedra); ar.position.set(xa, y0 + .6, za); ar.rotation.y = am; ar.translateZ(-.25); grupoArq.add(ar);
      // celosías en los arcos de los lados (no en los que quedan detrás de los jugadores)
      if (Math.abs(Math.cos(am)) < .6) { const j = new THREE.Mesh(new THREE.PlaneGeometry(2 * R * Math.sin(Math.PI / N) - 1, alto - 2.6), jaliM); j.position.set(xa * 1.01, y0 + .6 + (alto - 2.6) / 2, za * 1.01); j.rotation.y = am; grupoArq.add(j); }
    }
    // cornisa y friso con pequeñas almenas
    const corn = new THREE.Mesh(new THREE.CylinderGeometry(R + 1.2, R + 1.2, .6, N * 2, 1, true), piedraCl); corn.position.y = y0 + alto + 2.6; corn.material.side = THREE.DoubleSide; grupoArq.add(corn);

    const laton = mat({ color: 0xc9953e, roughness: .32, metalness: .9 });
    const lamp = new THREE.Mesh(new THREE.SphereGeometry(.5, 16, 12), new THREE.MeshStandardMaterial({ color: 0x3a2412, emissive: new THREE.Color(a.lampara), emissiveIntensity: 1.4, roughness: .5 }));

  }

  { s: 63, q: { es: '¿Qué cuatro divisiones del ejército reproducía el chaturanga?', en: 'Which four army divisions did chaturanga reproduce?' },
    o: [{ es: 'Elefantes, caballería, carros e infantería', en: 'Elephants, cavalry, chariots and infantry' }, { es: 'Arqueros, lanceros, honderos y espadas', en: 'Archers, spearmen, slingers and swordsmen' }, { es: 'Reyes, sacerdotes, guerreros, mercaderes y siervos', en: 'Kings, priests, warriors, merchants and servants' }, { es: 'Barcos, torres, camellos, carros y arqueros', en: 'Ships, towers, camels, chariots and archers on foot' }],
    x: { es: 'Reproducía las cuatro divisiones del ejército indio, los elefantes, la caballería, los carros y la infantería, que mandaba el rey.', en: 'It reproduced the four divisions of the Indian army, elephants, cavalry, chariots and infantry, commanded by the king.' } },
  { s: 63, q: { es: '¿Cómo se ganaba en el chaturanga?', en: 'How was chaturanga won?' },
    o: [{ es: 'Con mate al rey o dejándolo solo', en: 'By mating the king or leaving him bare' }, { es: 'Llevando un peón a la última fila', en: 'By taking a pawn to the last rank' }, { es: 'Sumando más puntos en los dados', en: 'By scoring more points with the dice' }, { es: 'Capturando los cuatro elefantes', en: 'By capturing all four of the elephants' }],
    x: { es: 'Se desconocen con exactitud sus reglas, aunque se ganaba dando mate al rey o dejándolo solo sin el resto de sus piezas.', en: 'Its exact rules are unknown, although it was won by mating the king or leaving him alone without the rest of his pieces.' } },
  { s: 63, q: { es: 'Según Murray (1913), ¿cuál es la forma original del chaturanga?', en: 'According to Murray (1913), what is the original form of chaturanga?' },
    o: [{ es: 'El juego de dos jugadores', en: 'The two-player game' }, { es: 'La variante de cuatro con dados', en: 'The four-player variant with dice' }, { es: 'Un juego de un solo jugador', en: 'A single-player game' }, { es: 'Un juego de equipos de la corte', en: 'A court team game' }],
    x: { es: 'Más tarde se jugó también una variante para cuatro jugadores con dados, si bien Murray (1913) considera que el juego de dos es el original.', en: 'A four-player variant with dice was also played later, although Murray (1913) considers the two-player game to be the original.' } },
  { s: 63, q: { es: '¿Con qué nombre llegó el juego a Persia, en tiempos de Cosroes I?', en: 'Under what name did the game reach Persia, in the time of Khosrow I?' },
    o: [{ es: 'Chatrang', en: 'Chatrang' }, { es: 'Kalarippayattu', en: 'Kalarippayattu' }, { es: 'Kushti', en: 'Kushti' }, { es: 'Weiqi', en: 'Weiqi' }],
    x: { es: 'Según una tradición persa, el juego llegó a Persia en tiempos del rey Cosroes I (531-579) con el nombre de chatrang.', en: 'According to a Persian tradition, the game reached Persia in the time of King Khosrow I (531-579) under the name chatrang.' } },
  { s: 63, q: { es: '¿De qué lengua proceden todavía palabras como «jaque» y «mate»?', en: 'From which language do words such as “check” and “mate” still come?' },
    o: [{ es: 'Del persa', en: 'From Persian' }, { es: 'Del sánscrito', en: 'From Sanskrit' }, { es: 'Del latín', en: 'From Latin' }, { es: 'Del griego', en: 'From Greek' }],
    x: { es: 'Tras la conquista árabe de Persia, los musulmanes lo aprendieron de los persas y lo llevaron a Europa, donde «jaque» y «mate» proceden todavía del persa.', en: 'After the Arab conquest of Persia, the Muslims learnt it from the Persians and took it to Europe, where “check” and “mate” still come from Persian.' } },
  { s: 63, q: { es: '¿Dónde aparecen las primeras alusiones claras al chaturanga?', en: 'Where do the first clear references to chaturanga appear?' },
    o: [{ es: 'En textos sánscritos de comienzos del siglo VII', en: 'In Sanskrit texts of the early seventh century' }, { es: 'En los sellos de Mohenjo-Daro y Harappa', en: 'On the seals of Mohenjo-Daro and Harappa' }, { es: 'En las crónicas persas escritas en tiempos del rey Cosroes I', en: 'In the Persian chronicles written in the time of King Khosrow I' }, { es: 'En los censos británicos del siglo XIX', en: 'In the British censuses of the nineteenth century' }],
    x: { es: 'Las primeras alusiones claras aparecen en textos sánscritos de comienzos del siglo VII d. C.', en: 'The first clear references appear in Sanskrit texts of the early seventh century AD.' } },
  { s: 65, q: { es: '¿Qué prácticas indias llegaron al deporte moderno, según el cuadro comparativo?', en: 'Which Indian practices reached modern sport, according to the comparative table?' },
    o: [{ es: 'El ajedrez y el yoga', en: 'Chess and yoga' }, { es: 'El judo y el kendo', en: 'Judo and kendo' }, { es: 'El cuju y el chuiwan', en: 'Cuju and chuiwan' }, { es: 'El críquet y el polo', en: 'Cricket and polo' }],
    x: { es: 'De la India llegaron al deporte moderno el ajedrez y el yoga, que el nacionalismo recuperó como cultura física.', en: 'From India, chess and yoga reached modern sport, and nationalism revived yoga as physical culture.' } },
  { s: 51, q: { es: '¿Qué grandes ciudades surgieron en el valle del Indo?', en: 'Which great cities arose in the Indus valley?' },
    o: [{ es: 'Mohenjo-Daro y Harappa', en: 'Mohenjo-Daro and Harappa' }, { es: 'Delhi, Panipat y Plassey', en: 'Delhi, Panipat and Plassey' }, { es: 'Plassey, Pune y la costa de Kerala', en: 'Plassey, Pune and the Kerala coast' }, { es: 'Kerala y Manipur', en: 'Kerala and Manipur' }],
    x: { es: 'En el valle del Indo surgieron grandes ciudades, como Mohenjo-Daro y Harappa, cuya escritura todavía no se ha descifrado.', en: 'Great cities such as Mohenjo-Daro and Harappa arose in the Indus valley; their script has still not been deciphered.' } },
  { s: 51, q: { es: '¿Qué fijaron los Vedas, los textos sagrados de los arios?', en: 'What did the Vedas, the sacred texts of the Aryans, lay down?' },
    o: [{ es: 'Los fundamentos del hinduismo y del orden en castas', en: 'The foundations of Hinduism and of the caste order' }, { es: 'Las reglas del chaturanga y de la lucha', en: 'The rules of chaturanga and of wrestling' }, { es: 'La conversión del imperio al budismo', en: 'The conversion of the empire to Buddhism' }, { es: 'El calendario de las fiestas de la cosecha y de los torneos', en: 'The calendar of the harvest festivals and the tournaments' }],
    x: { es: 'Los arios llegaron por el noroeste, y sus textos sagrados, los Vedas, fijaron los fundamentos del hinduismo y del orden en castas.', en: 'The Aryans arrived from the north-west, and their sacred texts, the Vedas, laid down the foundations of Hinduism and of the caste order.' } },
  { s: 51, q: { es: '¿Qué emperador maurya se convirtió al budismo?', en: 'Which Maurya emperor converted to Buddhism?' },
    o: [{ es: 'Ashoka', en: 'Ashoka' }, { es: 'Akbar', en: 'Akbar' }, { es: 'Babur', en: 'Babur' }, { es: 'Drona', en: 'Drona' }],
    x: { es: 'Chandragupta fundó el Imperio maurya, cuyo emperador más célebre, Ashoka, se convirtió al budismo.', en: 'Chandragupta founded the Maurya Empire, whose most famous emperor, Ashoka, converted to Buddhism.' } },
  { s: 51, q: { es: '¿Qué introdujo en la corte el sultanato de Delhi?', en: 'What did the Delhi Sultanate introduce at court?' },
    o: [{ es: 'El islam y la cultura persa', en: 'Islam and Persian culture' }, { es: 'El budismo y la lengua china', en: 'Buddhism and the Chinese language' }, { es: 'El críquet y el polo moderno', en: 'Cricket and modern polo' }, { es: 'El jainismo y el ascetismo', en: 'Jainism and asceticism' }],
    x: { es: 'En 1206 un jefe militar turco, antiguo esclavo, fundó el sultanato de Delhi, que introdujo en la corte el islam y la cultura persa.', en: 'In 1206 a Turkish military leader, a former slave, founded the Delhi Sultanate, which introduced Islam and Persian culture at court.' } },
  { s: 51, q: { es: '¿Qué emperador mogol consolidó el imperio con una política religiosa tolerante?', en: 'Which Mughal emperor consolidated the empire with a tolerant religious policy?' },
    o: [{ es: 'Akbar', en: 'Akbar' }, { es: 'Ashoka', en: 'Ashoka' }, { es: 'Babur', en: 'Babur' }, { es: 'Chandragupta', en: 'Chandragupta' }],
    x: { es: 'Babur fundó el Imperio mogol en 1526, y Akbar lo consolidó con una política religiosa tolerante.', en: 'Babur founded the Mughal Empire in 1526, and Akbar consolidated it with a tolerant religious policy.' } },
  { s: 51, q: { es: '¿Qué deportes llevaron los británicos a la India?', en: 'Which sports did the British take to India?' },
    o: [{ es: 'El críquet, el hockey y el polo moderno', en: 'Cricket, hockey and modern polo' }, { es: 'El kabaddi, el kushti, el yoga y el kalarippayattu', en: 'Kabaddi, kushti, yoga and kalarippayattu' }, { es: 'El chaturanga, el mallakhamb y la gada de piedra', en: 'Chaturanga, mallakhamb and the stone gada' }, { es: 'El kalarippayattu y la gada', en: 'Kalarippayattu and the gada' }],
    x: { es: 'Los británicos llevaron a la India el críquet, el hockey y el polo moderno, y despreciaron como atrasadas muchas de sus prácticas tradicionales.', en: 'The British took cricket, hockey and modern polo to India, and despised many of its traditional practices as backward.' } },
  { s: 52, q: { es: '¿Quiénes eran los únicos con derecho a las armas y a su aprendizaje?', en: 'Who were the only ones entitled to weapons and to training in them?' },
    o: [{ es: 'Los chatrias, reyes y guerreros', en: 'The kshatriyas, kings and warriors' }, { es: 'Los brahmanes, sacerdotes', en: 'The brahmins, priests' }, { es: 'Los vaisias, comerciantes', en: 'The vaishyas, the merchants and traders' }, { es: 'Los sudras, servidores', en: 'The shudras, the servants' }],
    x: { es: 'Los chatrias, reyes y guerreros, eran los únicos con derecho a las armas y a su aprendizaje.', en: 'The kshatriyas, kings and warriors, were the only ones entitled to weapons and to training in them.' } },
  { s: 52, q: { es: 'En el Mahabharata, ¿qué exige el maestro Drona a Ekalavya cuando este lo supera con el arco?', en: 'In the Mahabharata, what does the master Drona demand of Ekalavya when he surpasses him with the bow?' },
    o: [{ es: 'Su pulgar como pago', en: 'His thumb as payment' }, { es: 'Su arco y sus flechas', en: 'His bow and arrows' }, { es: 'Un año de servicio', en: 'A year of service' }, { es: 'Una vaca del rebaño', en: 'A cow from his father’s herd' }],
    x: { es: 'Drona se niega a enseñar el arco a Ekalavya, hijo del jefe de un pueblo del bosque, y cuando este aprende solo y lo supera, le exige como pago el pulgar.', en: 'Drona refuses to teach archery to Ekalavya, son of a forest chief, and when he learns alone and surpasses him, demands his thumb as payment.' } },
  { s: 52, q: { es: '¿A qué debe mucho la clasificación rígida de las jatis, según Dirks (2001)?', en: 'According to Dirks (2001), what does the rigid classification of jatis owe much to?' },
    o: [{ es: 'A los censos británicos del siglo XIX', en: 'To the British censuses of the nineteenth century' }, { es: 'A las leyes de la corte del sultanato de Delhi', en: 'To the court laws and decrees of the Delhi Sultanate' }, { es: 'A los Yogasūtras de Patañjali y sus comentarios', en: 'To the Yogasūtras of Patañjali and their commentaries' }, { es: 'A las reglas del Imperio maurya', en: 'To the rules of the Maurya Empire' }],
    x: { es: 'En la práctica la sociedad se dividía en miles de jatis, cuya clasificación rígida debe mucho a los censos británicos del siglo XIX (Dirks, 2001).', en: 'In practice society was divided into thousands of jatis, whose rigid classification owes much to the British censuses of the nineteenth century (Dirks, 2001).' } },
  { s: 53, q: { es: '¿Qué era el svayamvara de las epopeyas?', en: 'What was the svayamvara of the epics?' },
    o: [{ es: 'Una prueba que decidía una boda', en: 'A contest that decided a marriage' }, { es: 'Una carrera de carros por vacas', en: 'A chariot race for cows' }, { es: 'Un gimnasio con foso de tierra', en: 'A gymnasium with an earth pit' }, { es: 'Un tratado de corte del siglo XII', en: 'A twelfth-century court treatise on wrestling' }],
    x: { es: 'Algunas bodas se decidían en el svayamvara, una prueba de fuerza o destreza fijada por el padre de la novia, de modo que la mujer era el premio de la competición.', en: 'Some marriages were decided in the svayamvara, a test of strength or skill set by the bride’s father, so that the woman was the prize of the contest.' } },
  { s: 54, q: { es: '¿Qué figura nacida de las religiones indias tomará como modelo el luchador?', en: 'Which figure born of the Indian religions would the wrestler take as his model?' },
    o: [{ es: 'El asceta', en: 'The ascetic' }, { es: 'El rey', en: 'The king' }, { es: 'El juez', en: 'The judge' }, { es: 'El auriga', en: 'The charioteer' }],
    x: { es: 'Las religiones indias buscaban la liberación por la disciplina del cuerpo y la mente, de la que nacieron el yoga y la figura del asceta, que el luchador tomará como modelo.', en: 'The Indian religions sought liberation through discipline of body and mind, from which came yoga and the ascetic, whom the wrestler would take as his model.' } },
  { s: 55, q: { es: '¿Cuál es el problema de los tratados de corte como fuente?', en: 'What is the problem with court treatises as a source?' },
    o: [{ es: 'Describen la corte y casi nada del pueblo', en: 'They describe the court and almost nothing of the people' }, { es: 'Los escribieron los británicos del siglo XIX', en: 'They were all written by nineteenth-century British authors' }, { es: 'Son textos religiosos de fecha discutida', en: 'They are religious texts of disputed date' }, { es: 'El nacionalismo los codificó y los inventó', en: 'Nationalism codified and invented them' }],
    x: { es: 'Los tratados de corte, como el Manasollasa del siglo XII, aportan la dieta y la disciplina de los luchadores del rey, aunque describen la corte y casi nada del pueblo.', en: 'Court treatises, such as the twelfth-century Manasollasa, describe the diet and discipline of the king’s wrestlers, but they describe the court and almost nothing of the people.' } },
  { s: 55, q: { es: '¿Qué problema tienen las «tradiciones reinventadas» como el yoga o el kabaddi?', en: 'What problem do “reinvented traditions” such as yoga or kabaddi pose?' },
    o: [{ es: 'El nacionalismo les buscó un origen milenario', en: 'Nationalism gave them a millennial origin' }, { es: 'Solo se conocen por los sellos del Indo', en: 'They are known only from the Indus seals' }, { es: 'Solo las practicaban los brahmanes', en: 'Only the brahmins practised them' }, { es: 'Se perdieron casi del todo con el dominio británico', en: 'They were almost entirely lost under British rule' }],
    x: { es: 'Son prácticas vivas, pero el nacionalismo del siglo XX las codificó y les buscó un origen milenario.', en: 'They are living practices, but twentieth-century nationalism codified them and gave them a millennial origin.' } },
  { s: 57, q: { es: '¿Por qué los reyes y príncipes indios mantenían luchadores en su corte?', en: 'Why did Indian kings and princes keep wrestlers at court?' },
    o: [{ es: 'Como símbolo de su propio poder', en: 'As a symbol of their own power' }, { es: 'Para cobrar entradas al público', en: 'To charge the public for entry' }, { es: 'Para enseñar a luchar al pueblo', en: 'To teach the people to fight' }, { es: 'Para defender los templos', en: 'To defend the temples' }],
    x: { es: 'Los reyes y los príncipes mantuvieron a luchadores en su corte como símbolo de su propio poder.', en: 'Kings and princes kept wrestlers at court as a symbol of their own power.' } },
  { s: 58, q: { es: '¿De qué apenas se ocupan los Yogasūtras de Patañjali?', en: 'What do Patañjali’s Yogasūtras barely deal with?' },
    o: [{ es: 'De la postura', en: 'Posture' }, { es: 'De la meditación', en: 'Meditation' }, { es: 'Del deseo', en: 'Desire' }, { es: 'Del sufrimiento', en: 'Suffering' }],
    x: { es: 'Los Yogasūtras reúnen 195 aforismos y apenas se ocupan de la postura, que se limitaba a un asiento estable para meditar.', en: 'The Yogasūtras gather 195 aphorisms and barely deal with posture, which was limited to a stable seat for meditation.' } },
  { s: 58, q: { es: '¿Qué significa haṭha yoga?', en: 'What does haṭha yoga mean?' },
    o: [{ es: 'Yoga de la fuerza', en: 'Yoga of force' }, { es: 'Yoga del silencio', en: 'Yoga of silence' }, { es: 'Yoga del rey sabio', en: 'Yoga of the wise king' }, { es: 'Yoga de la danza sagrada', en: 'Yoga of sacred dance' }],
    x: { es: 'Las posturas (āsanas) ganaron peso con el haṭha yoga, el «yoga de la fuerza», aunque sus manuales siguieron siendo parcos en ellas.', en: 'Postures (āsanas) gained weight with haṭha yoga, the “yoga of force”, although its manuals remained sparing with them.' } },
  { s: 58, q: { es: '¿Cómo se valora la idea de un yoga de más de cinco mil años por un sello del Indo?', en: 'How is the idea of a yoga over five thousand years old, based on an Indus seal, judged?' },
    o: [{ es: 'Como una lectura especulativa', en: 'As a speculative reading' }, { es: 'Como un hecho demostrado por los arqueólogos', en: 'As a fact proven by the archaeologists' }, { es: 'Como un invento británico', en: 'As a British invention' }, { es: 'Como un error de los copistas de los Vedas', en: 'As a mistake by the copyists of the Vedas' }],
    x: { es: 'Se ha querido remontar el yoga a hace más de cinco mil años por un sello del valle del Indo con una figura sentada, si bien esa lectura es especulativa.', en: 'Some have traced yoga back more than five thousand years from an Indus valley seal with a seated figure, although that reading is speculative.' } },
  { s: 59, q: { es: '¿Qué significa kalari, de donde viene kalarippayattu?', en: 'What does kalari, from which kalarippayattu comes, mean?' },
    o: [{ es: 'Era de trilla y campo de batalla', en: 'Threshing floor and battlefield' }, { es: 'Templo y gimnasio de la aldea', en: 'Temple and village gymnasium' }, { es: 'Espada tan flexible como un látigo', en: 'A sword as flexible as a leather whip' }, { es: 'Pilar del luchador', en: 'The wrestler’s pillar' }],
    x: { es: 'Su nombre procede de kalari, que significa a la vez era de trilla y campo de batalla.', en: 'Its name comes from kalari, which means both threshing floor and battlefield.' } },
  { s: 59, q: { es: '¿Con qué arma empezaba el alumno de kalarippayattu la fase de armas de madera?', en: 'With which weapon did the kalarippayattu student begin the wooden-weapons stage?' },
    o: [{ es: 'Con el bastón largo', en: 'The long staff' }, { es: 'Con la urumi', en: 'The urumi' }, { es: 'Con la gada', en: 'The gada' }, { es: 'Con el puñal', en: 'The dagger' }],
    x: { es: 'Primero hacía ejercicios de control corporal, después combatía con armas de madera, empezando por el bastón largo, y por último con armas de metal.', en: 'First came body-control exercises, then combat with wooden weapons, beginning with the long staff, and finally with metal weapons.' } },
  { s: 60, q: { es: '¿A qué dios estaba dedicado el templo del akhara?', en: 'To which god was the akhara temple dedicated?' },
    o: [{ es: 'A Hanuman, el dios mono de la fuerza', en: 'Hanuman, the monkey god of strength' }, { es: 'A Purusha, el ser primordial de los Vedas', en: 'Purusha, the primordial being of the Vedas' }, { es: 'A Buda, el maestro de la meditación y del ascetismo', en: 'The Buddha, master of meditation and asceticism' }, { es: 'A Drona, el maestro del arco', en: 'Drona, the master of the bow' }],
    x: { es: 'El kushti se practica en el akhara, un gimnasio con foso de tierra, pozo y templo dedicado a Hanuman, el dios mono de la fuerza.', en: 'Kushti is practised in the akhara, a gymnasium with an earth pit, a well and a temple dedicated to Hanuman, the monkey god of strength.' } },
  { s: 60, q: { es: '¿Qué dos tradiciones une el kushti?', en: 'Which two traditions does kushti combine?' },
    o: [{ es: 'Una persa, llegada con los mogoles, y otra hindú', en: 'A Persian one, brought by the Mughals, and a Hindu one' }, { es: 'Una china, llegada por el comercio, y otra jaina', en: 'A Chinese one, brought by trade, and a Jain one' }, { es: 'Una británica, llegada en el siglo XIX con el ejército, y otra budista', en: 'A British one, brought by the army in the nineteenth century, and a Buddhist one' }, { es: 'Una griega, llegada con Alejandro, y otra sij', en: 'A Greek one, brought by Alexander, and a Sikh one' }],
    x: { es: 'El kushti es la lucha tradicional del norte de la India y une una tradición persa, llegada con los mogoles, y otra hindú.', en: 'Kushti is the traditional wrestling of northern India and combines a Persian tradition, brought by the Mughals, with a Hindu one.' } },
  { s: 61, q: { es: '¿Qué recibía el vencedor en los campeonatos de gadas?', en: 'What did the winner receive in gada championships?' },
    o: [{ es: 'Una gada de plata', en: 'A silver gada' }, { es: 'Diez litros de leche', en: 'Ten litres of milk' }, { es: 'Un caballo del rey', en: 'One of the king’s horses' }, { es: 'Un rango en la corte', en: 'A rank at court' }],
    x: { es: 'La gada, una maza de piedra con palo de bambú, es el arma de Hanuman y de los héroes de las epopeyas, y en los campeonatos el vencedor recibía una gada de plata.', en: 'The gada, a stone mace on a bamboo shaft, is the weapon of Hanuman and of the heroes of the epics, and in championships the winner received a silver gada.' } },
  { s: 61, q: { es: 'Según Ganneri (2013), ¿qué es el mallakhamb?', en: 'According to Ganneri (2013), what is mallakhamb?' },
    o: [{ es: 'Una creación del siglo XIX de Deodhar', en: 'A nineteenth-century creation by Deodhar' }, { es: 'Un ejercicio del siglo XII de la corte', en: 'A twelfth-century court exercise' }, { es: 'Una danza de los nayar de Kerala', en: 'A ritual dance of the Nayars of Kerala' }, { es: 'Un juego británico traído a Pune', en: 'A British game brought to Pune' }],
    x: { es: 'Se ha querido remontar al siglo XII (Roy, 2017), si bien Ganneri (2013) lo considera una creación del siglo XIX, obra de Balambhattadada Deodhar, un luchador de Pune.', en: 'It has been traced to the twelfth century (Roy, 2017), although Ganneri (2013) considers it a nineteenth-century creation by Balambhattadada Deodhar, a wrestler from Pune.' } },
  { s: 62, q: { es: '¿Por qué el atacante de kabaddi repite sin parar la palabra «kabaddi»?', en: 'Why does the kabaddi raider keep repeating the word “kabaddi”?' },
    o: [{ es: 'Para demostrar que no respira', en: 'To prove he is not breathing' }, { es: 'Para asustar a los defensores', en: 'To frighten the defenders' }, { es: 'Para invocar a Hanuman', en: 'To invoke Hanuman' }, { es: 'Para contar los puntos', en: 'To count the points' }],
    x: { es: 'El atacante entra en el campo rival y debe tocar a un contrario y volver repitiendo «kabaddi» para demostrar que no respira, mientras los defensores tratan de atraparlo.', en: 'The raider enters the opposing half, must touch an opponent and return while repeating “kabaddi” to prove he is not breathing, as the defenders try to catch him.' } },

  }
  function mostrar(id, si) { $(id).classList.toggle('oculto', !si); }
  let avisoT = 0;
  function aviso(txt, sub, ms) { const a = $('aviso'); a.querySelector('b').textContent = txt || ''; a.querySelector('small').textContent = sub || ''; a.classList.add('on'); clearTimeout(avisoT); avisoT = setTimeout(() => a.classList.remove('on'), ms || 1100); }
  function panel(html, cual) { const h = $(cual === 'p' ? 'hojaP' : 'hoja'); h.innerHTML = html; h.scrollTop = 0; mostrar(cual === 'p' ? 'pregunta' : 'panel', true); return h; }
  function cerrarPanel() { mostrar('panel', false); mostrar('pregunta', false); }
  function boton(txt, clase, fn) { const b = document.createElement('button'); b.className = 'btn ' + (clase || ''); b.textContent = txt; b.addEventListener('click', e => { e.stopPropagation(); SND.init(); SND.toque(); fn(); }); return b; }
  function guia(txt) { mostrar('guia', !!txt); $('guiaTxt').textContent = txt || ''; }

  function pausa() {
    if (MODO !== 'juego') return;
    pausado = true; SND.dormir(); guardar();
    const h = panel(`<h3>${t('pausa')}</h3><h2>${t('titulo')}</h2>${J && !J.escuela && J.activa ? `<p>${es() ? 'La partida queda guardada: puedes continuarla desde la portada.' : 'The game is saved: you can resume it from the title screen.'}</p>` : ''}`);
    const f = document.createElement('div'); f.className = 'fila';
    f.appendChild(boton(t('seguir'), 'rojo', () => { cerrarPanel(); pausado = false; SND.despertar(); }));
    f.appendChild(boton(t('como'), 'claro', () => { comoSeJuega(() => pausa()); }));
    if (J && !J.escuela && J.activa) { const b = boton(t('rendirse'), 'claro', () => { if (!b.dataset.seguro) { b.dataset.seguro = 1; b.textContent = es() ? '¿Seguro? Pulsa otra vez' : 'Sure? Press again'; return; } pausado = false; SND.despertar(); cerrarPanel(); terminar({ fin: 'rendicion', ganador: -J.lado }); }); f.appendChild(b); }
    f.appendChild(boton(t('menu'), 'claro', () => { pausado = false; SND.despertar(); portada(); }));
    if (HAPP && HAPP.inApp) f.appendChild(boton(t('guardarSalir'), 'claro', () => { guardar(); location.href = '../'; }));
    h.appendChild(f);
  }

  /* ---------------- ganchos de prueba ---------------- */
  const LETRA = { 1: 'p', 2: 'e', 3: 'c', 4: 'r', 5: 'm', 6: 'k' };
  function fen() { if (!J) return ''; let s = ''; for (let f = 7; f >= 0; f--) { let v = 0; for (let c = 0; c < 8; c++) { const x = J.st.b[f * 8 + c]; if (!x) { v++; continue; } if (v) { s += v; v = 0; } const l = LETRA[Math.abs(x)]; s += x > 0 ? l.toUpperCase() : l; } if (v) s += v; if (f) s += '/'; } return s; }
  window.render_game_to_text = () => JSON.stringify({ coordenadas: 'casilla = fila*8 + columna; fila 0 la del marfil', modo: MODO, pausado, tablero: fen(), turno: J ? J.st.turno : null, lado: J ? J.lado : null, nivel: J && J.nivel, etapa: J && J.etapa, escuela: J && J.escuela ? J.escuela.i : null, sel: J && J.sel, destinos: J ? J.destinos.map(d => d.s) : [], jugadas: J ? J.movs.length : 0, fin: J && J.fin ? J.fin.fin : null, ganador: J && J.fin ? J.fin.ganador : null, consejos: P.consejos, ocupado: J && J.ocupado, flores: FLORES.map(f => f.s), etapas: P.etapas });
  window.CHATURANGA = { P, J: () => J, pantalla: s => { const v = ESC.casillaPos(s).project(camara); return { x: (v.x + 1) / 2 * innerWidth, y: (1 - v.y) / 2 * innerHeight }; }, empezar, etapa, escuela, portada, intentar: s => intentar(s), seleccionar: s => seleccionar(s), legales: () => J ? M.legales(J.st) : [], jugar: async m => { const tk = token; J.ocupado = true; await mover(m, tk, true); J.ocupado = false; if (J.escuela) return escuelaTras(m); turno(tk); } };

  enlazar();
  cargar();
})();
</script>
</body>
</html>
