  /* ---------- Sonido y pausa (revisión del 13-10-2026) ----------
     - Se anotan todos los AudioContext que crea el juego para poder despertarlos y dormirlos.
     - En iPhone el sonido solo arranca dentro de un toque «completo» (touchend o click), y tras salir de la app
       el contexto queda «interrumpido» y el juego ya no suena: se reanuda en cualquier toque posterior.
     - Con audioSession 'playback' (iPhone con iOS 16.4 o posterior) el juego suena aunque el móvil esté en silencio.
     - Al ocultar la app (bloquear el móvil, cambiar de app) se pausa el juego (HAPP_PAUSA o el evento blur que ya
       escuchan los juegos), se duerme el sonido y se paran las músicas; al volver, se reanudan. */
  var ctxs = [], oculto = false, dormidos = [], parados = [];
  try {
    var AC0 = window.AudioContext || window.webkitAudioContext;
    if (AC0 && !AC0.__happ) {
      var ACW = function (o) { var c = o === undefined ? new AC0() : new AC0(o); ctxs.push(c); return c; };
      ACW.prototype = AC0.prototype; ACW.__happ = true;
      window.AudioContext = ACW; if (window.webkitAudioContext) window.webkitAudioContext = ACW;
    }
  } catch (e) {}
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  function despertar() {
    if (oculto) return;
    ctxs.forEach(function (c) { try { if (c.state === 'suspended' || c.state === 'interrupted') c.resume(); } catch (e) {} });
  }
  ['touchend', 'click', 'pointerup', 'keydown'].forEach(function (ev) { addEventListener(ev, despertar, { capture: true, passive: true }); });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') {
      if (oculto) return; oculto = true;
      try { if (typeof window.HAPP_PAUSA === 'function') window.HAPP_PAUSA(); else window.dispatchEvent(new Event('blur')); } catch (e) {}
      ctxs.forEach(function (c) { try { if (c.state === 'running') { c.suspend(); dormidos.push(c); } } catch (e) {} });
      try { document.querySelectorAll('audio,video').forEach(function (m) { if (!m.paused) { try { m.pause(); parados.push(m); } catch (e) {} } }); } catch (e) {}
    } else {
      oculto = false;
      dormidos.splice(0).forEach(function (c) { try { c.resume(); } catch (e) {} });
      parados.splice(0).forEach(function (m) { try { var r = m.play(); if (r && r.catch) r.catch(function () {}); } catch (e) {} });
    }
  });
  var lang = null;
  try { lang = localStorage.getItem('historiapp.lang'); } catch (e) {}
  if (lang !== 'es' && lang !== 'en') lang = String(document.documentElement.lang || navigator.language || 'es').slice(0, 2) === 'en' ? 'en' : 'es';

  function guardar() { try { if (typeof window.HAPP_GUARDAR === 'function') window.HAPP_GUARDAR(); } catch (e) {} }

  function salir(href) {
    if (yendo) return; yendo = true;

  }
  window.HAPP_SALIR = salir;
  addEventListener('pagehide', guardar);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') guardar(); });

    'background:rgba(12,10,8,.76);color:#fff;border:1px solid rgba(255,255,255,.5);font:600 13px/1 system-ui,-apple-system,"Segoe UI",sans-serif;' +
    'box-shadow:0 3px 10px rgba(0,0,0,.35);cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;white-space:nowrap}' +
    '.hgs.on{display:inline-flex}.hgs:active{transform:translateY(1px)}' +
    '.hgs-ok{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(.9);opacity:0;z-index:2147483003;pointer-events:none;padding:12px 22px;border-radius:24px;' +
    'background:#EDAB00;color:#1b1406;font:700 17px/1 system-ui,-apple-system,"Segoe UI",sans-serif;box-shadow:0 6px 18px rgba(0,0,0,.45);transition:opacity .2s,transform .2s}' +
    '.hgs-ok.on{opacity:1;transform:translate(-50%,-50%) scale(1)}';
  function build() {
    var st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
    aviso = document.createElement('div'); aviso.className = 'hgs-ok'; aviso.setAttribute('role', 'status'); aviso.textContent = '✓ ' + TX.ok; document.body.appendChild(aviso);
    if (C.fijo === false) return;
    var b = document.createElement('button'); b.type = 'button'; b.className = 'hgs';

    var pos = C.pos || { top: 'max(8px, env(safe-area-inset-top))', right: 'max(10px, env(safe-area-inset-right))' };
    for (var k in pos) b.style[k] = pos[k];
    ['pointerdown', 'touchstart', 'mousedown'].forEach(function (ev) { b.addEventListener(ev, function (e) { e.stopPropagation(); }, { passive: true }); });
    b.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); salir(); });

  /* ---------- Giro de pantalla (13-10-2026) ----------
     En algunos Android e iPhone el aviso de girar desaparece pero el juego queda mal dibujado o en blanco:
     el navegador lanza el evento resize antes de dar las medidas definitivas y el juego se dibuja con las viejas.
     1. Se limita la densidad de píxeles a 2 (en pantallas de 3 los lienzos ocupan más del doble de memoria
        y algunos móviles recargan o cuelgan la página al girar).
     2. Tras cada giro se vuelve a avisar al juego del cambio de tamaño cuando las medidas ya son las buenas.
     3. Si el juego se abrió en la orientación equivocada (C.orient 'h' o 'v'), al ponerlo en la buena se recarga
        una vez, con la partida guardada antes, para que arranque con las medidas correctas. */
  try { if ((window.devicePixelRatio || 1) > 2) Object.defineProperty(window, 'devicePixelRatio', { get: function () { return 2; }, configurable: true }); } catch (e) {}

  var avisando = false, giroT = [], ultimo = '';
  function avisar() {
    var m = window.innerWidth + 'x' + window.innerHeight;
    avisando = true;
    try { window.dispatchEvent(new Event('resize')); } catch (e) {}
    try { if (window.visualViewport) window.visualViewport.dispatchEvent(new Event('resize')); } catch (e) {}
    avisando = false;
    ultimo = m;
  }
  function recargarSiHaceFalta() {
    if (!malAlCargar || !buena()) return;
    var k = 'happ.giro.' + location.pathname, ahora = Date.now(), antes = 0;
    try { antes = +sessionStorage.getItem(k) || 0; } catch (e) {}
    if (ahora - antes < 20000) return;
    try { sessionStorage.setItem(k, String(ahora)); } catch (e) {}
    malAlCargar = false; guardar(); location.reload();
  }
  function giro() {
    if (avisando) return;
    giroT.forEach(clearTimeout);
    giroT = [120, 350, 700, 1200].map(function (t, i, a) {
      return setTimeout(function () { avisar(); if (i === a.length - 1) recargarSiHaceFalta(); }, t);
    });
  }

  try { if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', giro); } catch (e) {}
  addEventListener('pageshow', function (e) { if (e.persisted) giro(); });

  /* ---------- Orientación bloqueada y zoom (13-10-2026) ----------
     4. Historiapp instalada en Android hereda la orientación vertical de la app: aunque el alumno gire el móvil,
        la pantalla no gira y el aviso de girar no se va. Dentro de la app instalada, el juego pide su orientación
        con screen.orientation.lock (Android lo permite en apps instaladas; iPhone no lo necesita).
     5. iPhone agranda la letra al poner el móvil en horizontal y amplía la pantalla al tocar un campo de texto

        Se fija el tamaño de letra, los campos pasan a 16 px y el zoom vuelve a 1 al salir del campo o al girar. */
  function bloquear() {
    if (!C.orient) return;
    try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock(C.orient === 'h' ? 'landscape' : 'portrait').catch(function () {}); } catch (e) {}
  }

const CAMP = {"road": [{"km": 8, "day": 1, "place": {"es": "Salida de Élide", "en": "Leaving Elis"}, "fic": "H3·31", "lines": [["judge", {"es": "Vamos a un santuario rural de Zeus. Su culto empieza a finales del siglo XI a. C., mucho antes del primer estadio.", "en": "We are going to a rural sanctuary of Zeus. Its cult begins at the end of the 11th century BC, long before the first stadium."}], ["judge", {"es": "Los griegos nunca se pusieron de acuerdo sobre quién fundó los Juegos. Las versiones más repetidas son la de Heracles, que los instituye en honor de su padre Zeus, y la de Pélope, que gana una carrera de carros al rey de Pisa.", "en": "The Greeks never agreed on who founded the Games. The most repeated versions are Heracles, who founds them in honour of his father Zeus, and Pelops, who wins a chariot race against the king of Pisa."}], ["judge", {"es": "Tantos fundadores tienen una explicación. El santuario tuvo dos dueños que se lo disputaban, Élide y su vecina Pisa, y cada una defendió el relato que le daba la razón.", "en": "So many founders have an explanation. The sanctuary had two owners who fought over it, Elis and its neighbour Pisa, and each defended the story that proved it right."}]], "q": [{"q": {"es": "¿Por qué circulaban tantos relatos de fundación de los Juegos?", "en": "Why were there so many foundation stories for the Games?"}, "o": [{"es": "Porque Élide y Pisa se disputaban el santuario y cada una defendía su relato", "en": "Because Elis and Pisa fought over the sanctuary and each defended its own story"}, {"es": "Porque cada edición tenía un fundador distinto", "en": "Because each edition had a different founder"}, {"es": "Porque los sacerdotes los inventaban para atraer peregrinos", "en": "Because the priests made them up to attract pilgrims"}, {"es": "Porque Homero dio varias versiones en la Ilíada", "en": "Because Homer gave several versions in the Iliad"}], "x": {"es": "Un viajero del siglo II d. C. llegó a enumerar ocho fundadores suce nodikai."}]], "storm": {"lines": [["note", {"es": "Una tormenta retrasa tu barco varios días. Llegas a Élide después de la luna llena y un helanódica te pide explicaciones.", "en": "A storm delays your ship for several days. You reach Elis after the full moon and a Hellanodikes asks you to explain."}]], "q": {"q": {"es": "¿Qué causas de retraso aceptaban los jueces sin multa?", "en": "Which causes of delay did the judges accept without a fine?"}, "o": [{"es": "Una enfermedad, un ataque pirata o un naufragio", "en": "An illness, a pirate attack or a shipwreck"}, {"es": "Cualquier causa si pagabas la estancia", "en": "Any cause if you paid for the stay"}, {"es": "Ninguna, el retraso suponía siempre la expulsión", "en": "None, a delay always meant expulsion"}, {"es": "Solo una guerra en tu ciudad", "en": "Only a war in your city"}], "x": {"es": "Quien llegaba tarde sin probar que lo había retrasado una enfermedad, un ataque pirata o un naufragio era multado o excluido.", "en": "Anyone who arrived late without proving an illness, a pirate attack or a shipwreck had delayed him was fined or excluded."}}}}, "nodes": {"j0": {"who": "judge", "days": 1, "title": {"es": "Inscripción ante los helanódicas", "en": "Registering with the Hellanodikai"}, "fic": "H3·46", "lines": [["judge", {"es": "Bienvenido a Élide. Aquí residirás 30 días con tu entrenador, y la estancia corre a tu cuenta.", "en": "Welcome to Elis. You will live here for 30 days with your trainer, and the stay is at your own expense."}], ["judge", {"es": "Los Juegos se celebran en Olimpia con la segunda luna llena después del solsticio de verano, entre mediados de julio y agosto.", "en": "The Games are held at Olympia at the second full moon after the summer solstice, between mid-July and August."}], ["judge", {"es": "Para inscribirte es imprescindible ser varón y libre. De cada muchacho comprobamos su ciudad, su tribu, su padre, su linaje y, sobre todo, su edad.", "en": "To register you must be male and free. For every boy we check his city, his tribe, his father, his lineage and, above all, his age."}], ["judge", {"es": "Hay dos categorías, la de muchachos, de 12 a 17 años, y la de hombres, desde los 18. Durante este mes dictaremos tus rutinas, tu dieta y tu disciplina.", "en": "There are two categories, boys from 12 to 17 and men from 18. During this month we will set your exercise, your diet and your discipline."}], ["note", {"es": "El mes de Élide servía para filtrar a los aspirantes por edad, capacidad y conducta. Era, oficiosamente, la primera prueba de los Juegos.", "en": "The month at Elis filtered the candidates by age, ability and conduct. It was, unofficially, the first event of the Games."}]], "q": [{"q": {"es": "¿Cuándo se celebraban los Juegos de Olimpia?", "en": "When were the Olympic Games held?"}, "o": [{"es": "En la segunda luna llena después del solsticio de verano", "en": "At the second full moon after the summer solstice"}, {"es": "En la primera luna llena después del solsticio de verano", "en": "At the first full moon after the summer solstice"}, {"es": "En el equinoccio de primavera", "en": "At the spring equinox"}, {"es": "Cada dos años, en invierno", "en": "Every two years, in winter"}], "x": {"es": "La primera luna llena era la fecha de llegada a Élide; los Juegos caían con la segunda.", "en": "The first full moon was the date to arrive at Elis; the Games fell at the second."}}, {"q": {"es": "¿Qué requisito era imprescindible para inscribirse?", "en": "Which requirement was essential to register?"}, "o": [{"es": "Ser varón y libre", "en": "Being male and free"}, {"es": "Ser ciudadano de Élide", "en": "Being a citizen of Elis"}, {"es": "Haber vencido antes en otros juegos", "en": "Having won other games before"}, {"es": "Que tu ciudad pagara la inscripción", "en": "Having your city pay the entry"}], "x": {"es": "Las fuentes coinciden en que era imprescindible ser varón y libre. Si se exigía también ser griego es hoy objeto de debate.", "en": "The sources agree that being male and free was essential. Whether being Greek was also required is still debated."}}, {"q": {"es": "¿Qué categorías de edad había en Olimpia?", "en": "Which age categories were there at Olympia?"}, "o": [{"es": "Muchachos, de 12 a 17 años, y hombres, desde los 18", "en": "Boys, from 12 to 17, and men, from 18"}, {"es": "Infantiles, juveniles y veteranos", "en": "Children, youths and veterans"}, {"es": "Una sola categoría para todos", "en": "A single category for everyone"}, {"es": "Muchachos hasta los 20 y hombres desde los 21", "en": "Boys up to 20 and men from 21"}], "x": {"es": "Se competía en dos categorías, la de muchachos, de 12 a 17 años, y la de hombres, desde los 18.", "en": "There were two categories, boys from 12 to 17 and men from 18."}}]}, "c1": {"who": "coach", "days": 4, "stat": "spd", "title": {"es": "El entrenamiento: los tetras", "en": "Training: the tetrads"}, "fic": "H3·39", "lines": [["coach", {"es": "Tu éxito depende en buena parte de mí, y por eso voy contigo a todas partes.", "en": "Your success depends to a great extent on me, which is why I go everywhere with you."}], ["coach", {"es": "Combinaremos fuerza, resistencia y técnica con halteras, trepa por cuerda, sacos de arena, carga de troncos y carreras por la arena.", "en": "We will combine strength, endurance and technique with halteres, rope climbing, sandbags, carrying logs and running on sand."}], ["coach", {"es": "Seguiremos los tetras, un microciclo rígido de cuatro días. El primero, de preparación, con ejercicios breves para activar el cuerpo.", "en": "We will follow the tetrads, a rigid four-day microcycle. Day one is preparation, with short exercises to wake the body up."}], ["coach", {"es": "El segundo, de esfuerzo total, hasta el agotamiento. El tercero, de relajación, con descanso y masajes. El cuarto, de esfuerzo moderado, para la técnica y la táctica.", "en": "Day two is all-out effort, to exhaustion. Day three is relaxation, with rest and massage. Day four is moderate effort, for technique and tactics."}], ["note", {"es": "Filóstrato, que escribió un tratado de gimnástica hacia 230 d. C., condenó los tetras por excesivos y defendió un entrenamiento pensado para cada atleta, atento a la higiene, a la psicología y al sueño.", "en": "Philostratus, who wrote a treatise on gymnastics around AD 230, condemned the tetrads as excessive and argued for training tailored to each athlete, mindful of hygiene, psychology and sleep."}]], "q": [{"q": {"es": "¿Qué eran los tetras?", "en": "What were the tetrads?"}, "o": [{"es": "Un microciclo de entrenamiento de cuatro días", "en": "A four-day training microcycle"}, {"es": "Las cuatro pruebas de carreras de Olimpia", "en": "The four running events at Olympia"}, {"es": "Los cuatro jueces del pentatlón", "en": "The four judges of the pentathlon"}, {"es": "Un tipo de dieta de cuatro comidas", "en": "A four-meal diet"}], "x": {"es": "Los tetras eran un microciclo rígido de cuatro días: preparación, esfuerzo total, relajación y esfuerzo moderado.", "en": "The tetrads were a rigid four-day microcycle: preparation, all-out effort, relaxation and moderate effort."}}, {"q": {"es": "¿Qué se hacía el tercer día de los tetras?", "en": "What was done on the third day of the tetrads?"}, "o": [{"es": "Descanso y recuperación activa con masajes", "en": "Rest and active recovery with massage"}, {"es": "Esfuerzo total hasta el agotamiento", "en": "All-out effort to exhaustion"}, {"es": "Ejercicios breves para activar el cuerpo", "en": "Short exercises to wake the body up"}, {"es": "Práctica de la técnica y la táctica", "en": "Practice of technique and tactics"}], "x": {"es": "El tercer día era de relajación, con descanso y recuperación activa con masajes.", "en": "Day three was relaxation, with rest and active recovery with massage."}}, {"q": {"es": "¿Qué criticaba Filóstrato de los tetras?", "en": "What did Philostratus criticise about the tetrads?"}, "o": [{"es": "Que eran excesivos y no se adaptaban a cada atleta", "en": "That they were excessive and not adapted to each athlete"}, {"es": "Que eran demasiado suaves para un olímpico", "en": "That they were too soft for an Olympian"}, {"es": "Que no incluían carrera", "en": "That they included no running"}, {"es": "Que los dirigían los jueces y no el entrenador", "en": "That the judges ran them instead of the trainer"}], "x": {"es": "Filóstrato condena los tetras por excesivos, con el ejemplo de un luchador que murió por el ejercicio que le impuso un entrenador empeñado en no romper el ciclo.", "en": "Philostratus condemns the tetrads as excessive, citing a wrestler who died from the exercise imposed by a trainer determined not to break the cycle."}}]}, "c2": {"who": "coach", "days": 4, "stat": "tec", "title": {"es": "Palestra y gimnasio", "en": "Palaestra and gymnasium"}, "fic": "H3·40", "lines": [["coach", {"es": "Las disciplinas de combate se entrenan en la palestra y las atléticas en el gimnasio. Son espacios sobrios, rectangulares, con una explanada en el centro y pórticos en sus cuatro costados.", "en": "Combat events are trained in the palaestra and athletic events in the gymnasium. They are plain rectangular spaces, with an open yard in the middle and porticoes on all four sides."}], ["coach", {"es": "Al cargo está el gimnasiarca, un ciudadano habitualmente adinerado. Yo soy tu paidotriba y te corrijo con esta vara.", "en": "The gymnasiarch is in charge, usually a wealthy citizen. I am your paidotribes and I correct you with this rod."}], ["coach", {"es": "Se entrena desnudo y cubierto de aceite. Gymnasion significa literalmente «lugar de la desnudez».", "en": "You train naked and covered in oil. Gymnasion literally means 'place of nakedness'."}], ["coach", {"es": "El gimnasio solo abre de día y tiene turnos para niños, jóvenes y adultos. En Atenas, una ley atribuida a Solón prohibía a los esclavos ejercitarse en él bajo pena de 50 azotes.", "en": "The gymnasium only opens by day and has turns for children, youths and adults. In Athens a law attributed to Solon barred slaves from exercising there on pain of 50 lashes."}], ["note", {"es": "En Atenas la ley solo dejaba fuera a los esclavos, si bien la barrera real era económica, porque los paidotribas de renombre cobraban mucho.", "en": "In Athens the law only kept slaves out, although the real barrier was economic, because renowned trainers charged a great deal."}]], "q": [{"q": {"es": "¿Dónde se entrenaban las disciplinas de combate?", "en": "Where were combat events trained?"}, "o": [{"es": "En la palestra", "en": "In the palaestra"}, {"es": "En el gimnasio", "en": "In the gymnasium"}, {"es": "En el hipódromo", "en": "In the hippodrome"}, {"es": "En el Helanodiceón", "en": "In the Hellanodikaion"}], "x": {"es": "Las palestras eran para los deportes de combate y los gimnasios para los atléticos.", "en": "Palaestrae were for combat sports and gymnasia for athletic ones."}}, {"q": {"es": "¿Quién estaba al cargo del gimnasio?", "en": "Who was in charge of the gymnasium?"}, "o": [{"es": "El gimnasiarca, un ciudadano habitualmente adinerado", "en": "The gymnasiarch, usually a wealthy citizen"}, {"es": "El paidotriba de cada atleta", "en": "Each athlete's paidotribes"}, {"es": "Un helanódica elegido cada año", "en": "A Hellanodikes chosen every year"}, {"es": "Un mastigóforo", "en": "A mastigophoros"}], "x": {"es": "La persona al cargo era el gimnasiarca; los entrenamientos los dirigía el paidotriba de cada deportista.", "en": "The gymnasiarch was in charge; training was led by each athlete's own paidotribes."}}, {"q": {"es": "¿Qué prohibía la ley ateniense atribuida a Solón?", "en": "What did the Athenian law attributed to Solon forbid?"}, "o": [{"es": "Que los esclavos se ejercitaran en el gimnasio y se untaran de aceite en las palestras", "en": "Slaves exercising in the gymnasium and oiling themselves in the palaestrae"}, {"es": "Que las mujeres entraran en el estadio", "en": "Women entering the stadium"}, {"es": "Que los extranjeros compitieran en Atenas", "en": "Foreigners competing in Athens"}, {"es": "Que se entrenara de noche", "en": "Training at night"}], "x": {"es": "La ley castigaba con 50 azotes al esclavo que se ejercitara en el gimnasio, y al negárselo situaba la gimnasia entre las prácticas honorables.", "en": "The law punished with 50 lashes a slave who exercised in the gymnasium, and by denying it to them it placed gymnastics among honourable pursuits."}}]}, "c3": {"who": "coach", "days": 4, "stat": "str", "title": {"es": "La dieta del atleta", "en": "The athlete's diet"}, "fic": "H3·42", "lines": [["coach", {"es": "La alimentación es un pilar del entrenamiento. En época arcaica los atletas comían como cualquier griego, una dieta ligera de higos secos, queso fresco y harina de trigo.", "en": "Food is a pillar of training. In the Archaic period athletes ate like any other Greek, a light diet of dried figs, fresh cheese and wheat flour."}], ["coach", {"es": "Hacia 500 a. C. se impuso una dieta abundante en carne. Más proteína y un entrenamiento vigoroso dan volumen, y eso es ventaja en la lucha, el pugilato y el pancracio, que no tienen categorías de peso.", "en": "Around 500 BC a meat-rich diet took over. More protein and hard training add bulk, an advantage in wrestling, boxing and pankration, which have no weight classes."}], ["coach", {"es": "Por eso se cuenta que Milón de Crotona comía veinte libras de carne, unos 9 kg, y otras tantas de pan al día. Es un mito, el del atleta glotón.", "en": "That is why people say Milo of Croton ate twenty pounds of meat a day, about 9 kg, and as much bread. It is a myth, the glutton athlete."}], ["coach", {"es": "Los médicos no tardaron en criticarlo, porque comer casi solo carne daba diarrea a algunos atletas. Y nada de agua fría.", "en": "Doctors soon criticised it, because eating almost nothing but meat gave some athletes diarrhoea. And no cold water."}], ["note", {"es": "Comer carne a diario era caro y estaba al alcance de muy pocos griegos. El cuerpo del atleta exhibía ese gasto.", "en": "Eating meat every day was expensive and within reach of very few Greeks. The athlete's body displayed that expense."}]], "q": [{"q": {"es": "¿Por qué se impuso hacia 500 a. C. una dieta rica en carne?", "en": "Why did a meat-rich diet take over around 500 BC?"}, "o": [{"es": "Porque daba volumen corporal, una ventaja en los combates, que no tenían categorías de peso", "en": "Because it added bulk, an advantage in combat events, which had no weight classes"}, {"es": "Porque los helanódicas la imponían en Élide", "en": "Because the Hellanodikai imposed it at Elis"}, {"es": "Porque la carne era el alimento más barato", "en": "Because meat was the cheapest food"}, {"es": "Por una prohibición religiosa de los cereales", "en": "Because of a religious ban on cereals"}], "x": {"es": "Más proteína y un entrenamiento vigoroso aumentaban el volumen corporal, una ventaja en lucha, pugilato y pancracio.", "en": "More protein and hard training increased body bulk, an advantage in wrestling, boxing and pankration."}}, {"q": {"es": "¿Qué comía un atleta de época arcaica?", "en": "What did an Archaic-period athlete eat?"}, "o": [{"es": "Higos secos, queso fresco y harina de trigo", "en": "Dried figs, fresh cheese and wheat flour"}, {"es": "Carne a diario", "en": "Meat every day"}, {"es": "Pan con miel y leche de cabra", "en": "Bread with honey and goat's milk"}, {"es": "Pescado y vino puro", "en": "Fish and neat wine"}], "x": {"es": "En época arcaica la dieta era ligera, la misma de cualquier griego. El pan con miel y la leche de cabra son ya de época romana.", "en": "In the Archaic period the diet was light, the same as any Greek's. Bread with honey and goat's milk belong to the Roman period."}}, {"q": {"es": "¿Qué decía la dieta del atleta sobre su posición social?", "en": "What did the athlete's diet say about his social position?"}, "o": [{"es": "Comer carne a diario era caro, y el cuerpo del atleta exhibía ese gasto", "en": "Eating meat daily was expensive, and the athlete's body displayed that expense"}, {"es": "Nada, porque la dieta la pagaba la ciudad", "en": "Nothing, because the city paid for the diet"}, {"es": "Que los atletas eran pobres y comían poco", "en": "That athletes were poor and ate little"}, {"es": "Que solo los esclavos comían carne", "en": "That only slaves ate meat"}], "x": {"es": "La dieta reflejaba el acceso social al deporte griego: el gasto en carne estaba al alcance de muy pocos.", "en": "The diet reflected social access to Greek sport: spending on meat was within reach of very few."}}]}, "j1": {"who": "judge", "days": 2, "title": {"es": "Quién manda en Olimpia", "en": "Who runs Olympia"}, "fic": "H3·44", "lines": [["judge", {"es": "Olimpia es un santuario abierto a cualquier griego, pero lo administra una sola polis, Élide. Nosotros controlamos la admisión, fijamos el reglamento y nombramos al personal.", "en": "Olympia is a sanctuary open to any Greek, yet a single polis runs it, Elis. We control admission, set the rules and appoint the staff."}], ["judge", {"es": "La dirección se reparte entre sacerdotes, jueces como yo, guardianes de las leyes, un consejo de apelación y heraldos.", "en": "Management is shared between priests, judges like me, guardians of the laws, a council of appeal and heralds."}], ["judge", {"es": "Nuestros heraldos proclaman la ekecheiría, la «detención de manos». Prohíbe la entrada de ejércitos en Élide, garantiza el paso seguro de los peregrinos y veta las armas en el santuario.", "en": "Our heralds proclaim the ekecheiria, the 'holding of hands'. It bars armies from Elis, guarantees safe passage to pilgrims and bans weapons in the sanctuary."}], ["note", {"es": "La tregua no implicaba una paz general. La 75.ª Olimpiada, en 480 a. C., se celebró durante la invasión persa, mientras Leónidas resistía en las Termópilas.", "en": "The truce did not mean a general peace. The 75th Olympiad, in 480 BC, was held during the Persian invasion, while Leonidas held out at Thermopylae."}], ["note", {"es": "Élide sumó 115 vencedores conocidos, el 10,5 % del total. Más que parcialidad, la causa puede ser la cercanía geográfica.", "en": "Elis had 115 known victors, 10.5% of the total. Rather than bias, the cause may be geographical closeness."}]], "q": [{"q": {"es": "¿Qué polis administraba el santuario de Olimpia?", "en": "Which polis ran the sanctuary of Olympia?"}, "o": [{"es": "Élide", "en": "Elis"}, {"es": "Atenas", "en": "Athens"}, {"es": "Esparta", "en": "Sparta"}, {"es": "Corinto", "en": "Corinth"}], "x": {"es": "Élide controlaba la admisión, fijaba el reglamento y nombraba al personal entre sus ciudadanos.", "en": "Elis controlled admission, set the rules and appointed the staff from its citizens."}}, {"q": {"es": "¿Qué establecía la ekecheiría?", "en": "What did the ekecheiria establish?"}, "o": [{"es": "Prohibía la entrada de ejércitos en Élide y garantizaba el paso seguro de los peregrinos", "en": "It barred armies from Elis and guaranteed pilgrims safe passage"}, {"es": "Una paz general en toda Grecia durante los Juegos", "en": "A general peace throughout Greece during the Games"}, {"es": "La suspensión de todas las guerras durante un año", "en": "The suspension of all wars for a year"}, {"es": "La obligación de cada polis de enviar atletas", "en": "Every polis's duty to send athletes"}], "x": {"es": "La ekecheiría no frenaba las guerras en Grecia, y los Juegos no se suspendían por causas bélicas.", "en": "The ekecheiria did not stop wars in Greece, and the Games were not suspended for war."}}, {"q": {"es": "¿Por qué Élide sumó más vencedores que ninguna otra ciudad?", "en": "Why did Elis have more victors than any other city?"}, "o": [{"es": "Puede deberse a la ventaja de la cercanía geográfica", "en": "It may be due to the advantage of geographical closeness"}, {"es": "Está probado que sus jueces hacían trampas", "en": "It is proven that its judges cheated"}, {"es": "Porque solo podían competir los eleos", "en": "Because only Eleans could compete"}, {"es": "Porque Élide pagaba a sus atletas", "en": "Because Elis paid its athletes"}], "x": {"es": "Unos sabios egipcios dudaban de unos Juegos con atletas eleos, aunque la causa puede ser la cercanía más que la parcialidad.", "en": "Some Egyptian sages doubted Games with Elean athletes, although the cause may be closeness rather than bias."}}]}, "j2": {"who": "judge", "days": 2, "title": {"es": "Normas y sanciones", "en": "Rules and penalties"}, "fic": "H3·78", "lines": [["judge", {"es": "Las sanciones son de tres tipos y todas las imponemos los helanódicas. Nuestras decisiones pueden recurrirse ante el Consejo Olímpico.", "en": "There are three kinds of penalty and the Hellanodikai impose them all. Our decisions can be appealed to the Olympic Council."}], ["judge", {"es": "El castigo corporal se aplica en la pista. Los mastigóforos, los «portadores del látigo», azotan a quien hace una salida falsa o un movimiento prohibido en los combates.", "en": "Corporal punishment is applied on the track. The mastigophoroi, the 'whip bearers', flog anyone who makes a false start or an illegal move in combat."}], ["judge", {"es": "La expulsión castiga la trampa flagrante y la mentira a los jueces, porque rompe el juramento que todos prestáis ante Zeus. El expulsado pierde años de preparación.", "en": "Expulsion punishes blatant cheating and lying to the judges, because it breaks the oath you all swear before Zeus. The expelled man loses years of preparation."}], ["judge", {"es": "Las sanciones económicas son las más deshonrosas, sobre todo por soborno. Con las multas se levantan los zanes, estatuas de Zeus en bronce con el nombre del infractor en el pedestal.", "en": "Fines are the most shameful, above all for bribery. The fines pay for the Zanes, bronze statues of Zeus with the offender's name on the base."}], ["judge", {"es": "Y competirás desnudo, como todos desde que Orsipo de Mégara corrió así en 720 a. C. Tu entrenador también entrará desnudo, desde que descubrimos a una madre disfrazada de entrenador.", "en": "And you will compete naked, as everyone has since Orsippos of Megara ran that way in 720 BC. Your trainer will also come in naked, ever since we caught a mother disguised as a trainer."}], ["note", {"es": "Los seis primeros zanes se pagaron en 388 a. C. con las multas al púgil que compró a sus rivales y a los tres que aceptaron su dinero.", "en": "The first six Zanes were paid for in 388 BC with the fines on the boxer who bought his rivals and the three who took his money."}]], "q": [{"q": {"es": "¿Qué tres tipos de sanción había en Olimpia?", "en": "What three kinds of penalty were there at Olympia?"}, "o": [{"es": "Castigo corporal, expulsión y sanciones económicas", "en": "Corporal punishment, expulsion and fines"}, {"es": "Cárcel, destierro y pena de muerte", "en": "Prison, exile and death"}, {"es": "Amonestación, tarjeta y descalificación", "en": "Warning, card and disqualification"}, {"es": "Pérdida de la ciudadanía, multa y destierro", "en": "Loss of citizenship, fine and exile"}], "x": {"es": "Todas las imponían los helanódicas, y podían recurrirse ante el Consejo Olímpico.", "en": "All were imposed by the Hellanodikai and could be appealed to the Olympic Council."}}, {"q": {"es": "¿Qué eran los zanes?", "en": "What were the Zanes?"}, "o": [{"es": "Estatuas de Zeus en bronce pagadas con multas, con el nombre del infractor", "en": "Bronze statues of Zeus paid for with fines, bearing the offender's name"}, {"es": "Los látigos de los mastigóforos", "en": "The whips of the mastigophoroi"}, {"es": "Las tablillas de maldición contra los rivales", "en": "The curse tablets against rivals"}, {"es": "Los asientos de los jueces en el estadio", "en": "The judges' seats in the stadium"}], "x": {"es": "Se levantaban junto a la entrada del estadio y su pedestal recordaba al infractor.", "en": "They stood by the stadium entrance and their base named the offender."}}, {"q": {"es": "¿Qué le ocurría al corredor que hacía una salida falsa?", "en": "What happened to a runner who made a false start?"}, "o": [{"es": "Los jueces lo azotaban en público", "en": "The judges flogged him in public"}, {"es": "Pagaba una multa para un zan", "en": "He paid a fine for a Zan"}, {"es": "Quedaba expulsado de por vida", "en": "He was banned for life"}, {"es": "Se repetía la salida sin castigo", "en": "The start was repeated without punishment"}], "x": {"es": "La salida falsa se castigaba con azotes en la pista.", "en": "A false start was punished with flogging on the track."}}, {"q": {"es": "¿Por qué los entrenadores tuvieron que asistir desnudos?", "en": "Why did trainers have to attend naked?"}, "o": [{"es": "Porque descubrieron a una madre disfrazada de entrenador para ver a su hijo", "en": "Because a mother was caught disguised as a trainer to watch her son"}, {"es": "Por una orden del oráculo de Delfos", "en": "By order of the Delphic oracle"}, {"es": "Para que no escondieran armas", "en": "So that they could not hide weapons"}, {"es": "Porque así lo exigía la ekecheiría", "en": "Because the ekecheiria required it"}], "x": {"es": "La desnudez evitaba la entrada furtiva de mujeres, y se exigió también a los entrenadores tras el caso de Calipátira de Rodas.", "en": "Nakedness kept women from sneaking in, and it was demanded of trainers too after the case of Kallipateira of Rhodes."}}]}, "r0": {"who": "r0", "days": 1, "title": {"es": "Los valores del olimpismo", "en": "The values of Olympism"}, "fic": "H3·50", "lines": [["r0", {"es": "Yo vengo a por el kléos, la gloria eterna que sobrevive a la muerte. Y el kléos se conquista en el agón, la contienda.", "en": "I have come for kleos, the eternal glory that outlives death. And kleos is won in the agon, the contest."}], ["r0", {"es": "Sin un rival que desee la victoria con la misma intensidad, el triunfo no vale nada. La suerte solo cuenta en el sorteo de los emparejamientos.", "en": "Without a rival who wants victory just as much, triumph is worth nothing. Luck only counts in the draw for pairings."}], ["r0", {"es": "Buscamos la kalokagathía, el equilibrio entre lo bello y lo bueno, y la areté, la excelencia. Quien la alcanza se convierte en áristos.", "en": "We seek kalokagathia, the balance of the beautiful and the good, and arete, excellence. Whoever reaches it becomes aristos."}], ["r0", {"es": "Si vences, hazlo con aidós, con compostura y humildad, reconociendo el favor de los dioses para no atraer su envidia.", "en": "If you win, do so with aidos, with composure and humility, acknowledging the gods' favour so as not to draw their envy."}]], "q": [{"q": {"es": "¿Qué significa areté?", "en": "What does arete mean?"}, "o": [{"es": "Excelencia", "en": "Excellence"}, {"es": "Contienda", "en": "Contest"}, {"es": "Gloria eterna", "en": "Eternal glory"}, {"es": "Compostura", "en": "Composure"}], "x": {"es": "Areté es la excelencia, el valor más alto de la sociedad griega; quien la logra se convierte en áristos.", "en": "Arete is excellence, the highest value in Greek society; whoever achieves it becomes aristos."}}, {"q": {"es": "¿Qué es la kalokagathía?", "en": "What is kalokagathia?"}, "o": [{"es": "El equilibrio entre lo bello y lo bueno", "en": "The balance of the beautiful and the good"}, {"es": "La tregua sagrada de Olimpia", "en": "The sacred truce of Olympia"}, {"es": "El premio en aceite de las Panateneas", "en": "The oil prize of the Panathenaia"}, {"es": "La salida de la carrera del estadio", "en": "The start of the stadion race"}], "x": {"es": "Viene de kalos, hermoso, y agathos, bueno, y alude al modelo de conducta ideal de los nobles.", "en": "It comes from kalos, beautiful, and agathos, good, and refers to the ideal conduct of nobles."}}, {"q": {"es": "¿Cómo debía comportarse el vencedor?", "en": "How was the victor expected to behave?"}, "o": [{"es": "Con aidós, con compostura y humildad ante los dioses", "en": "With aidos, with composure and humility before the gods"}, {"es": "Celebrándolo ante los rivales vencidos", "en": "Celebrating in front of the beaten rivals"}, {"es": "Reclamando premios en metálico a los jueces", "en": "Demanding cash prizes from the judges"}, {"es": "Retando de inmediato al segundo clasificado", "en": "Challenging the runner-up at once"}], "x": {"es": "Por eso las imágenes de vencedores coronados los muestran con la mirada baja y una postura modesta.", "en": "That is why images of crowned victors show them looking down in a modest pose."}}]}, "r1": {"who": "r1", "days": 1, "title": {"es": "Lo que vale una corona", "en": "What a crown is worth"}, "fic": "H3·52", "lines": [["r1", {"es": "En Olimpia no hay más premio que una corona de olivo. Y aun así, el que vence aquí se convierte en un héroe.", "en": "At Olympia the only prize is an olive crown. And yet whoever wins here becomes a hero."}], ["r1", {"es": "Al volver a su polis lo reciben con grandes celebraciones y le levantan estatuas. En muchas ciudades come gratis de por vida y tiene asiento de honor en los espectáculos.", "en": "Back in his polis he is welcomed with great celebrations and statues are raised to him. In many cities he eats free for life and gets a seat of honour at the shows."}], ["r1", {"es": "Otros juegos sí pagan. En las Panateneas de Atenas, el vencedor del estadio recibía probablemente 80 ánforas de aceite, unos 2.900 litros, más de un año de jornal de un artesano.", "en": "Other games do pay. At the Athenian Panathenaia the stadion winner probably received 80 amphorae of oil, about 2,900 litres, more than a year's pay for a craftsman."}], ["note", {"es": "Heródoto cuenta que un noble persa, al saber que los griegos competían por una corona de olivo en plena invasión, exclamó: «¿Contra qué clase de hombres nos has traído a luchar, que no compiten por dinero, sino por la excelencia?»", "en": "Herodotus tells how a Persian noble, learning that the Greeks competed for an olive crown in the middle of the invasion, exclaimed: 'What kind of men have you brought us to fight, who compete not for money but for excellence?'"}]], "q": [{"q": {"es": "¿Qué premio daba el santuario de Olimpia al vencedor?", "en": "What prize did the sanctuary of Olympia give the victor?"}, "o": [{"es": "Una corona de olivo", "en": "An olive crown"}, {"es": "80 ánforas de aceite", "en": "80 amphorae of oil"}, {"es": "500 dracmas", "en": "500 drachmas"}, {"es": "Un escudo de bronce", "en": "A bronze shield"}], "x": {"es": "Durante el olimpismo clásico, Olimpia no daba premios materiales más allá de la corona de olivo.", "en": "In the classical period Olympia gave no material prizes beyond the olive crown."}}, {"q": {"es": "¿Qué recibía en muchas ciudades el vencedor olímpico a su regreso?", "en": "What did an Olympic victor receive in many cities on his return?"}, "o": [{"es": "Manutención gratuita de por vida y asiento de honor en los espectáculos", "en": "Free meals for life and a seat of honour at the shows"}, {"es": "Un cargo de helanódica", "en": "A post as Hellanodikes"}, {"es": "La exención del servicio militar en tiempo de guerra", "en": "Exemption from military service in wartime"}, {"es": "Una tierra en Élide", "en": "Land in Elis"}], "x": {"es": "Además le levantaban estatuas, y en época romana quedaba exento de impuestos.", "en": "Statues were also raised to him, and in Roman times he was exempt from taxes."}}, {"q": {"es": "¿Qué recibía probablemente el vencedor del estadio en las Panateneas?", "en": "What did the stadion winner at the Panathenaia probably receive?"}, "o": [{"es": "80 ánforas de aceite, unos 2.900 litros", "en": "80 amphorae of oil, about 2,900 litres"}, {"es": "Una corona de olivo", "en": "An olive crown"}, {"es": "Un caballo de carreras", "en": "A racehorse"}, {"es": "Una estatua en Olimpia", "en": "A statue at Olympia"}], "x": {"es": "Valían unas 1.247 dracmas, más de un año de jornal de un artesano cualificado.", "en": "They were worth some 1,247 drachmas, more than a year's pay for a skilled craftsman."}}]}, "r2": {"who": "r2", "days": 1, "title": {"es": "Quién llega a Olimpia", "en": "Who gets to Olympia"}, "fic": "H3·38", "lines": [["r2", {"es": "A mí no me ha enviado mi ciudad. Aquí cada uno viene por su cuenta, y hasta se puede cambiar de patria deportiva, como hizo el corredor Ástilo.", "en": "My city did not send me. Here everyone comes on his own account, and you can even change sporting homeland, as the runner Astylos did."}], ["r2", {"es": "Competir exige tiempo libre y dinero. Hay que pagar al entrenador, la carne, los masajistas, el aceite, el equipo, el viaje y este mes en Élide.", "en": "Competing takes free time and money. You pay the trainer, the meat, the masseurs, the oil, the kit, the journey and this month at Elis."}], ["r2", {"es": "Un paidotriba corriente cobraba de 10 a 15 dracmas por alumno y año, e Hipómaco llegó a pedir 100. Un artesano cualificado ganaba 2 o 2,5 dracmas al día.", "en": "An ordinary paidotribes charged 10 to 15 drachmas per pupil a year, and Hippomachos asked as much as 100. A skilled craftsman earned 2 or 2.5 drachmas a day."}], ["note", {"es": "Ninguna norma excluía al pobre, si bien en la práctica Olimpia quedaba en manos de las familias acomodadas. En la Atenas clásica, la élite no llegaba al 5 % de los ciudadanos.", "en": "No rule excluded the poor, although in practice Olympia stayed in the hands of well-off families. In classical Athens the elite was under 5% of the citizens."}]], "q": [{"q": {"es": "¿Quién elegía a los atletas que iban a Olimpia?", "en": "Who chose the athletes who went to Olympia?"}, "o": [{"es": "Nadie: cada atleta acudía por iniciativa propia", "en": "Nobody: each athlete came on his own initiative"}, {"es": "La asamblea de cada polis", "en": "Each polis's assembly"}, {"es": "Los helanódicas, por invitación", "en": "The Hellanodikai, by invitation"}, {"es": "El oráculo de Delfos", "en": "The Delphic oracle"}], "x": {"es": "Las ciudades no elegían a sus atletas ni solían costear su viaje ni su entrenamiento.", "en": "Cities did not choose their athletes, nor did they usually pay for their journey or training."}}, {"q": {"es": "¿Por qué Olimpia quedaba en manos de las familias acomodadas?", "en": "Why did Olympia stay in the hands of well-off families?"}, "o": [{"es": "Porque competir exigía tiempo libre, un entrenador y dinero para viajar", "en": "Because competing required free time, a trainer and money to travel"}, {"es": "Porque una ley prohibía competir a los pobres", "en": "Because a law forbade the poor to compete"}, {"es": "Porque solo los nobles sabían correr", "en": "Because only nobles knew how to run"}, {"es": "Porque había que pagar una inscripción a Élide", "en": "Because an entry fee had to be paid to Elis"}], "x": {"es": "Ninguna norma excluía al pobre, pero ninguna ciudad costeaba la preparación.", "en": "No rule excluded the poor, but no city paid for the preparation."}}, {"q": {"es": "¿Cuánto cobraba un paidotriba corriente en Atenas?", "en": "How much did an ordinary paidotribes charge in Athens?"}, "o": [{"es": "De 10 a 15 dracmas por alumno y año", "en": "10 to 15 drachmas per pupil a year"}, {"es": "100 dracmas al mes", "en": "100 drachmas a month"}, {"es": "2 dracmas por sesión", "en": "2 drachmas a session"}, {"es": "Nada, lo pagaba el gimnasiarca", "en": "Nothing, the gymnasiarch paid"}], "x": {"es": "Hipómaco, dueño de una palestra distinguida, llegó a pedir 100 dracmas al año.", "en": "Hippomachos, owner of a distinguished palaestra, asked as much as 100 drachmas a year."}}]}}, "trial": {"intro": [["judge", {"es": "Esta es la prueba de acceso. Los helanódicas vemos a cada aspirante en las cinco pruebas y emparejamos por edad y por nivel.", "en": "This is the entry trial. We Hellanodikai watch every candidate in the five events and pair them by age and level."}], ["judge", {"es": "Después de cada prueba te preguntaré por ella. Quien no alcanza el nivel vuelve a su casa.", "en": "After each event I will ask you about it. Anyone who falls short goes home."}]], "disc": {"fic": "H3·66", "q": [{"q": {"es": "¿Cómo se garantizaba la igualdad en el disco?", "en": "How was fairness guaranteed in the discus?"}, "o": [{"es": "En cada prueba todos lanzaban el mismo disco el mismo día", "en": "In each contest everyone threw the same discus on the same day"}, {"es": "Cada atleta llevaba su disco, pesado por los jueces", "en": "Each athlete brought his own discus, weighed by the judges"}, {"es": "Había un disco oficial único para todos los juegos", "en": "There was a single official discus for all games"}, {"es": "Se lanzaba de tres en tres con discos sorteados", "en": "Throwers went in threes with drawn discuses"}], "x": {"es": "Un viajero del siglo II d. C. vio en Olimpia los tres discos del pentatlón guardados en un edificio de ofrendas.", "en": "A traveller of the 2nd century AD saw the three pentathlon discuses at Olympia, kept in a treasury."}}, {"q": {"es": "¿Qué medían y pesaban los discos conservados?", "en": "What size and weight are the surviving discuses?"}, "o": [{"es": "De 17 a 35 cm y de 1,5 a 6,5 kg, con una media de 2,5 kg", "en": "17 to 35 cm and 1.5 to 6.5 kg, averaging 2.5 kg"}, {"es": "Todos 22 cm y 2 kg, como hoy", "en": "All 22 cm and 2 kg, as today"}, {"es": "De 50 a 60 cm y unos 10 kg", "en": "50 to 60 cm and about 10 kg"}, {"es": "No se ha conservado ninguno", "en": "None has survived"}], "x": {"es": "No había un modelo oficial único, y muchos eran para entrenar en el gimnasio.", "en": "There was no single official model, and many were for training in the gymnasium."}}]}, "jump": {"fic": "H3·64", "q": [{"q": {"es": "¿Qué eran las halteras?", "en": "What were the halteres?"}, "o": [{"es": "Pesos de piedra, plomo o bronce, de 1,4 a 4,5 kg, para el salto", "en": "Weights of stone, lead or bronze, 1.4 to 4.5 kg, for the jump"}, {"es": "Las pesas del lanzamiento de peso", "en": "The shot-put weights"}, {"es": "Unas sandalias para saltar más", "en": "Sandals for jumping further"}, {"es": "Las marcas de madera del foso", "en": "The wooden markers in the pit"}], "x": {"es": "Medían entre 12 y 30 cm, y el saltador las llevaba en las manos.", "en": "They were 12 to 30 cm long, and the jumper held them in his hands."}}, {"q": {"es": "¿Cómo se hacía el salto del pentatlón?", "en": "How was the pentathlon jump performed?"}, "o": [{"es": "Cinco saltos consecutivos desde el bater hasta el skamma, al son de una flauta", "en": "Five consecutive jumps from the bater into the skamma, to the sound of a pipe"}, {"es": "Un solo salto de altura sobre una cuerda", "en": "A single high jump over a rope"}, {"es": "Tres saltos con pértiga", "en": "Three pole vaults"}, {"es": "Un salto largo sin carrera, medido con cuerda", "en": "A standing long jump measured with a rope"}], "x": {"es": "Los griegos no registraban las marcas; la señal se movía solo si alguien superaba la anterior.", "en": "The Greeks did not record marks; the marker only moved if someone beat it."}}]}, "jav": {"fic": "H3·65", "q": [{"q": {"es": "¿Para qué servía la ankýle?", "en": "What was the ankyle for?"}, "o": [{"es": "Era una correa enrollada en el asta que hacía girar la jabalina y alargaba el tiro", "en": "It was a thong wound round the shaft that made the javelin spin and lengthened the throw"}, {"es": "Era la punta metálica de la jabalina", "en": "It was the javelin's metal point"}, {"es": "Era la estaca que marcaba el mejor tiro", "en": "It was the stake that marked the best throw"}, {"es": "Era la línea de lanzamiento", "en": "It was the throwing line"}], "x": {"es": "Era de cuero, de 30 a 45 cm, y al soltarse imprimía una rotación a la jabalina.", "en": "It was leather, 30 to 45 cm long, and as it unwound it set the javelin spinning."}}, {"q": {"es": "¿Cuándo era válido un lanzamiento de jabalina?", "en": "When was a javelin throw valid?"}, "o": [{"es": "Solo si la jabalina se clavaba en el suelo", "en": "Only if the javelin stuck in the ground"}, {" // XP en Historiapp, solo si el juego se abre dentro de la app (mismo origen, carpeta juegos/)
const inHistoriapp = () => {

  camp = { region: null, day: 0, done: {}, stats: { spd: 0, tec: 0, str: 0 }, trial: null, passed: false, mode: 'elis', correct: 0, asked: 0, xp: 0 };

// ---------- motor de diálogo ----------

}

// ---------- viaje y llegada ----------

  if (R.id === 'crotona') {
    items.push(...lines(CAMP.travel.storm.lines), { t: 'q', q: CAMP.travel.storm.q, fic: 'H3·47' });
  }
  runTalk(items, () => { camp.day = 1; doNode('j0', true); });

// ---------- conversaciones ----------
function doNode(id, free) {
  const N = CAMP.nodes[id];
  if (!free) camp.day += N.days; else camp.day += Math.max(0, N.days - 1);
  const items = [...lines(N.lines), ...N.q.map(q => ({ t: 'q', q, fic: N.fic }))];
  runTalk(items, tk => {
    const t = N.q.length, pass = tk.ok >= Math.ceil(t * .6);
    let stat = null;
    if (pass && !camp.done[id]) { camp.done[id] = true; if (N.stat) { camp.stats[N.stat] += 2; stat = fmt(CU().statUp, { s: CU().stat[N.stat] }); } }
    if (id === 'j0') camp.done.j0 = true;
    runTalk([card1(N.title, fmt(pass ? CU().passMod : CU().failMod, { n: tk.ok, t }), { stat, fic: N.fic, pass })], toHub);

}
const __pentKey = 'campana';
function __pentHub() { try { if (camp && !career && camp.region) store.set(__pentKey, { camp: Object.assign({}, camp, { pool: (camp.pool || []).map(a => ATHLETES.indexOf(a)), rivals: null }) }); } catch (e) {} }

function __pentReanudar() { const d = store.get(__pentKey, null); startCampaign(); if (!d || !d.camp) return; const fresh = camp.pool, rv = camp.rivals; Object.assign(camp, d.camp);
  const pool = (d.camp.pool || []).map(i => ATHLETES[i]); if (pool.length && pool.every(Boolean)) { camp.pool = pool; newAgon(pool); camp.rivals = agon.rivals; agon = null; } else { camp.pool = fresh; camp.rivals = rv; } toHub(); }
window.HAPP_GUARDAR = () => { try { if (career) careerSave(); } catch (e) {} };
function toHub() {
  __pentHub();
  state = 'cHub'; stateT = 0; menuFocus = -1; choice = null; agon = null; ev = 'disc';
  if (!camp.passed && camp.day + TRIAL_DAYS > MONTH) {
    runTalk([...lines(CAMP.outro.fail), card1(CU().notAdmitted, CU().outOfDays)], () => { store.set(__pentKey, null); state = 'cEnd'; stateT = 0; });
  }
}
const daysLeft = () => MONTH - camp.day;
const canAfford = d => camp.day + d <= MONTH;

// ---------- prueba de acceso ----------
function startTrial() {
  camp.day += TRIAL_DAYS; camp.trial = { i: 0, ok: 0, n: 0 };
  runTalk(lines(CAMP.trial.intro), trialEvent);
}
function trialEvent() {
  newAgon(camp.pool); agon.trial = true; camp.mode = 'trial';
  ev = EVS[camp.trial.i]; attempt = 0; toIdle();
}
function trialQuestions() {
  const e = ev, T0 = CAMP.trial[e];
  const items = [card1(fmt(CU().trialTag, { e: TX.ev[e] }), J && J.mark != null ? (typeof J.mark === 'number' ? fmtEv(e, J.mark) : J.mark) : TX.foul)];
  T0.q.forEach(q => items.push({ t: 'q', q, fic: T0.fic }));
  if (e === 'wrestle') CAMP.trial.pent.q.forEach(q => items.push({ t: 'q', q, fic: CAMP.trial.pent.fic }));

  else runTalk([...lines(CAMP.outro.fail), card1(CU().notAdmitted, res, { pass: false })], toHub);

// ---------- a Olimpia ----------
// la Vía Sagrada: la procesión camina y se para en cinco puntos a conversar
const WALK_T = 2.8;
function goRoad() {
  camp.mode = 'road'; camp.road = { i: 0, x: 0, walk: 0, km0: 0 };
  runTalk(lines([CAMP.outro.road[0]]), roadWalk);
}
function roadWalk() { state = 'cRoad'; stateT = 0; camp.road.walk = 0; }
function campUpdate(dt) {
  careerUpdate(dt);
  if (state !== 'cRoad') return;
  const r = camp.road; r.walk += dt; r.x += dt * 1.7;
  if (r.walk < WALK_T) return;
  const st = CAMP.road[r.i];
  runTalk([...lines(st.lines), ...st.q.map(q => ({ t: 'q', q, fic: st.fic }))], () => {
    r.km0 = st.km; r.i++;
    if (r.i < CAMP.road.length) roadWalk();
    else runTalk([...lines([CAMP.outro.road[2]]), ...lines(CAMP.outro.rule)], startOlympia);
  });
}
const ROADPOS = { judge: 3.2, coach: .2, you: 1.4, r: [-1.2, -2.4, -3.6] };
function roadKm() {
  const r = camp.road, st = CAMP.road[Math.min(r.i, CAMP.road.length - 1)];
  const k = state === 'cRoad' ? lerp(r.km0, st.km, clamp(r.walk / WALK_T, 0, 1)) : (r.i < CAMP.road.length ? st.km : 60);
  return { k: Math.round(k), d: k > 30 ? 2 : 1, place: r.i < CAMP.road.length && state !== 'cRoad' ? LX(st.place) : '' };
}
function olive(X) {
  const x = wx(X), gy = TUNING.groundY; if (x < -OX - 80 || x > W + OX + 80) return;
  ctx.fillStyle = 'rgba(23,17,13,.55)';
  ctx.fillRect(x - 4, gy - 70, 8, 70);
  for (const [dx, dy, r] of [[-18, -82, 20], [8, -96, 22], [24, -78, 17], [-2, -70, 15]]) { ctx.beginPath(); ctx.arc(x + dx, gy + dy, r, 0, Math.PI * 2); ctx.fill(); }
}
function drawRoadScene() {
  const r = camp.road, moving = state === 'cRoad';
  camX = r.x - 8; Z = 1; S = TUNING.S;
  ground();
  for (let k = Math.floor((r.x - 12) / 7); k < (r.x + 14) / 7; k++) olive(k * 7 + 2.5 + Math.sin(k * 3.1) * 1.5);
  // tumba de Corebo: túmulo con estela inscrita

  }
  // fuente de Pieria en la última parada
  if (r.i === CAMP.road.length - 1 && !moving) {
    const fx = wx(r.x + 5.4), gy = TUNING.groundY;
    ctx.fillStyle = C.negro; ctx.fillRect(fx - 50, gy - 90, 100, 90); ctx.fillRect(fx - 62, gy - 104, 124, 16);
    ctx.fillStyle = C.blanco; ctx.fillRect(fx - 4, gy - 70, 8, 70);
  }

  const walker = (X, i, opts) => {
    const p = ph + i * .37;
    if (!moving) return figure(X, .95, STAND(Math.sin(timeT + i) * .04), opts);
    const g = gaitLegs(X, .93, p, 1.6, .18), a = gaitArms(p, .5);

  walker(r.x + ROADPOS.you, 1, { perizoma: true });
  drawCoach(r.x + ROADPOS.coach);
  drawJudge(r.x + ROADPOS.judge);
  const it = state === 'cTalk' ? curItem() : null, w = it && it.t === 'line' ? it.who : null;
  const sx = w === 'judge' ? ROADPOS.judge : w === 'coach' ? ROADPOS.coach : w && w[0] === 'r' ? ROADPOS.r[+w[1]] : null;
  if (sx != null) {
    const x = wx(r.x + sx), y = wy(2.35) + Math.sin(timeT * 5) * 4;
    ctx.fillStyle = C.negro; ctx.beginPath(); ctx.moveTo(x - 12, y - 14); ctx.lineTo(x + 12, y - 14); ctx.lineTo(x, y); ctx.fill();
  }
