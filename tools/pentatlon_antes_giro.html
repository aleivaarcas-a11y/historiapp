n el pugilato, a cargo de púgiles pagados que animaban sus banquetes y sus funerales.", "en": "Their sport consisted mainly of the chariot and the boar hunt, reserved for the lord, and of boxing, performed by paid boxers who entertained at his banquets and funerals."}], {"q": {"q": {"es": "¿Quién gobernaba los reinos micénicos?", "en": "Who ruled the Mycenaean kingdoms?"}, "o": [{"es": "El wanax", "en": "The wanax"}, {"es": "Los basileis", "en": "The basileis"}, {"es": "Los helanódicas", "en": "The Hellanodikai"}, {"es": "El arconte", "en": "The archon"}], "x": {"es": "El wanax gobernaba desde palacios fortificados como Micenas o Tirinto.", "en": "The wanax ruled from fortified palaces such as Mycenae or Tiryns."}}, "fic": "H3·19"}, {"q": {"q": {"es": "¿Quién practicaba el pugilato en el mundo micénico?", "en": "Who practised boxing in the Mycenaean world?"}, "o": [{"es": "Púgiles pagados que animaban los banquetes y funerales del señor", "en": "Paid boxers who entertained at the lord's banquets and funerals"}, {"es": "Los hijos del wanax en las fiestas de palacio", "en": "The wanax's sons at palace festivals"}, {"es": "Los ciudadanos libres en Olimpia", "en": "Free citizens at Olympia"}, {"es": "El propio wanax ante su pueblo", "en": "The wanax himself before his people"}], "x": {"es": "El deporte micénico que nos ha llegado era el del señor: el carro, la caza del jabalí y los púgiles a sueldo.", "en": "The Mycenaean sport that has come down to us was the lord's: the chariot, the boar hunt and paid boxers."}}, "fic": "H3·19"}, ["note", {"es": "Entre 1200 y 1150 a. C. ardieron los palacios. Cline (2015) habla de una «tormenta perfecta» de terremotos, sequía, gentes desplazadas, revueltas y ataques de los «pueblos del mar». Grecia se quedó cuatro siglos sin escribir.", "en": "Between 1200 and 1150 BC the palaces burned. Cline (2015) speaks of a 'perfect storm' of earthquakes, drought, displaced peoples, revolts and attacks by the 'Sea Peoples'. Greece went four centuries without writing."}], ["note", {"es": "El poder local quedó en manos de los basileis, los hombres influyentes de cada aldea, y el deporte, sin palacio ni calendario fijo, pasó a girar en torno a estos jefes y a sus funerales.", "en": "Local power passed to the basileis, the influential men of each village, and sport, with no palace and no fixed calendar, came to revolve around these chiefs and their funerals."}], ["note", {"es": "En el siglo VIII a. C. regresa la escritura, con el alfabeto fenicio. La enócoe del Dipilón lleva grabada una de las inscripciones griegas más antiguas, que la declara premio del mejor bailarín de un concurso.", "en": "In the 8th century BC writing returns, with the Phoenician alphabet. The Dipylon oinochoe bears one of the oldest Greek inscriptions, which declares it the prize for the best dancer in a contest."}], {"q": {"q": {"es": "¿Qué era la enócoe del Dipilón?", "en": "What was the Dipylon oinochoe?"}, "o": [{"es": "Una jarra que su inscripción declara premio del mejor bailarín", "en": "A jug whose inscription declares it the prize for the best dancer"}, {"es": "La primera lista de vencedores de Olimpia", "en": "The first list of Olympic victors"}, {"es": "Una tablilla en lineal B con un reglamento", "en": "A Linear B tablet with a set of rules"}, {"es": "El trofeo de la carrera de carros de Patroclo", "en": "The trophy of Patroclus's chariot race"}], "x": {"es": "Lleva una de las inscripciones griegas más antiguas, de hacia 740-725 a. C.", "en": "It bears one of the oldest Greek inscriptions, c. 740-725 BC."}}, "fic": "H3·19"}], "homer": [["aedo", {"es": "Escucha el canto 23 de la Ilíada. Aquiles organiza juegos en el funeral de su compañero Patroclo, ocho pruebas en las que compiten casi solo príncipes.", "en": "Listen to Book 23 of the Iliad. Achilles holds games at the funeral of his companion Patroclus, eight contests in which almost only princes compete."}], ["aedo", {"es": "Los premios son calderos, trípodes, caballos, bueyes y mujeres, y la carrera de carros ocupa el lugar preferente. Cuando dos competidores discuten el resultado, Aquiles interviene como juez.", "en": "The prizes are cauldrons, tripods, horses, oxen and women, and the chariot race holds pride of place. When two competitors dispute the result, Achilles steps in as judge."}], ["note", {"es": "Repartir premios exigía ya reglas y un árbitro. La trama se sitúa en el mundo micénico del siglo XIII a. C., pero los poemas se fijaron entre 725 y 675 a. C. y retratan la sociedad de los basileis de los siglos IX y VIII a. C.", "en": "Awarding prizes already required rules and a referee. The plot is set in the Mycenaean world of the 13th century BC, but the poems were fixed between 725 and 675 BC and portray the society of the basileis of the 9th and 8th centuries BC."}], ["note", {"es": "En Lefkandi, en Eubea, hacia 950 a. C., un gran señor fue incinerado y enterrado bajo un túmulo con sus armas y sus caballos sacrificados, como Patroclo. El poema y la tumba retratan a una misma élite.", "en": "At Lefkandi, in Euboea, c. 950 BC, a great lord was cremated and buried under a mound with his weapons and his sacrificed horses, like Patroclus. The poem and the tomb portray the same elite."}], {"q": {"q": {"es": "¿Qué texto narra los juegos fúnebres de Patroclo?", "en": "Which text narrates the funeral games of Patroclus?"}, "o": [{"es": "El canto 23 de la Ilíada", "en": "Book 23 of the Iliad"}, {"es": "La Odisea", "en": "The Odyssey"}, {"es": "Las Historias de Heródoto", "en": "Herodotus's Histories"}, {"es": "Una oda de Píndaro", "en": "An ode by Pindar"}], "x": {"es": "Aquiles organiza ocho pruebas premiadas con calderos, trípodes, caballos, bueyes y mujeres, y actúa como juez.", "en": "Achilles holds eight contests rewarded with cauldrons, tripods, horses, oxen and women, and acts as judge."}}, "fic": "H3·20"}, {"q": {"q": {"es": "¿Qué sociedad retratan los poemas homéricos?", "en": "What society do the Homeric poems portray?"}, "o": [{"es": "La de los basileis de los siglos IX y VIII a. C.", "en": "That of the basileis of the 9th and 8th centuries BC"}, {"es": "La micénica del siglo XIII a. C., tal como fue", "en": "The Mycenaean one of the 13th century BC, as it was"}, {"es": "La Atenas democrática", "en": "Democratic Athens"}, {"es": "La Esparta de los homoioi", "en": "The Sparta of the homoioi"}], "x": {"es": "Los poemas se fijaron entre 725 y 675 a. C.; por eso la Edad Oscura se llama también época homérica.", "en": "The poems were fixed between 725 and 675 BC; that is why the Dark Age is also called the Homeric period."}}, "fic": "H3·20"}, {"q": {"q": {"es": "¿Qué paralelo arqueológico tiene el funeral de Patroclo?", "en": "What archaeological parallel does Patroclus's funeral have?"}, "o": [{"es": "La tumba del gran señor de Lefkandi, hacia 950 a. C.", "en": "The tomb of the great lord of Lefkandi, c. 950 BC"}, {"es": "La enócoe del Dipilón", "en": "The Dipylon oinochoe"}, {"es": "El túmulo de Pélope en Olimpia", "en": "The mound of Pelops at Olympia"}, {"es": "El palacio de Cnoso", "en": "The palace of Knossos"}], "x": {"es": "Fue incinerado con sus armas y sus caballos sacrificados, como Patroclo.", "en": "He was cremated with his weapons and his sacrificed horses, like Patroclus."}}, "fic": "H3·20"}, {"card": {"title": {"es": "El relevo del deporte", "en": "The relay of sport"}, "s": {"es": "Antes de Olimpia el deporte pasa por Micenas y por los juegos de Homero. Al caer los palacios desaparece el pugilato a sueldo, y el deporte cambia de dueño.", "en": "Before Olympia sport passes through Mycenae and the games of Homer. When the palaces fall, paid boxing disappears, and sport changes hands."}, "fic": "H3·21"}}], "polis_a": [["father", {"es": "Ya tienes catorce años. Desde el siglo VIII a. C. las aldeas de los basileis dieron paso a la polis, la ciudad-estado con sus tierras y sus magistraturas. Grecia son cientos de poleis que comparten lengua, dioses y santuarios, y que habitualmente guerrean entre sí.", "en": "You are fourteen now. Since the 8th century BC the villages of the basileis gave way to the polis, the city-state with its lands and its magistracies. Greece is hundreds of poleis that share language, gods and sanctuaries, and that usually make war on each other."}], ["father", {"es": "Grecia nunca fue un Estado unificado. Solo nos unimos en ligas contra un invasor, como la que venció a los persas en Platea, en 479 a. C., y en los santuarios comunes, como Olimpia.", "en": "Greece was never a unified state. We only unite in leagues against an invader, like the one that beat the Persians at Plataea in 479 BC, and in the common sanctuaries, such as Olympia."}], ["father", {"es": "El deporte construye tres identidades a la vez, la del atleta, la de su ciudad y la de todos los griegos frente a los bárbaros. Cuando un atleta vence, vence también su polis.", "en": "Sport builds three identities at once, that of the athlete, that of his city and that of all Greeks against the barbarians. When an athlete wins, his polis wins too."}], ["note", {"es": "Vives en la época clásica, que arranca en 480 a. C. con la derrota de los persas de Jerjes en Salamina y llega hasta 323 a. C. Antes vinieron la Edad Oscura, hacia 1100-700 a. C., y la época arcaica, hacia 700-480 a. C., en la que se configuró casi todo el deporte griego.", "en": "You live in the Classical period, which begins in 480 BC with the defeat of Xerxes's Persians at Salamis and lasts until 323 BC. Before it came the Dark Age, c. 1100-700 BC, and the Archaic period, c. 700-480 BC, when almost all of Greek sport took shape."}], {"q": {"q": {"es": "¿Qué unía a las poleis griegas?", "en": "What united the Greek poleis?"}, "o": [{"es": "La lengua, los dioses y los santuarios comunes", "en": "Language, gods and common sanctuaries"}, {"es": "Un rey común con capital en Olimpia", "en": "A common king with his capital at Olympia"}, {"es": "Un ejército permanente pagado por todas", "en": "A standing army paid for by all"}, {"es": "Una sola ley escrita por Solón", "en": "A single law written by Solon"}], "x": {"es": "Grecia nunca fue un Estado unificado; solo se unía en ligas contra un invasor y en los santuarios comunes.", "en": "Greece was never a unified state; it only united in leagues against an invader and in the common sanctuaries."}}, "fic": "H3·22"}, {"q": {"q": {"es": "¿En qué periodo se configura casi todo el deporte griego?", "en": "In which period did almost all of Greek sport take shape?"}, "o": [{"es": "En la época arcaica, hacia 700-480 a. C.", "en": "In the Archaic period, c. 700-480 BC"}, {"es": "En la Edad Oscura, hacia 1100-700 a. C.", "en": "In the Dark Age, c. 1100-700 BC"}, {"es": "En la época helenística, 323-31 a. C.", "en": "In the Hellenistic period, 323-31 BC"}, {"es": "Bajo Roma, desde 146 a. C.", "en": "Under Rome, from 146 BC"}], "x": {"es": "Entonces se fijan el programa de Olimpia y el circuito de grandes juegos panhelénicos.", "en": "That is when the Olympic programme and the circuit of great Panhellenic games were fixed."}}, "fic": "H3·23"}], "polis_region": {"atenas": [["father", {"es": "Hacia 500 a. C., de unos 175.000 habitantes de Atenas, solo unos 25.000 eran ciudadanos varones adultos. La ley distingue entre ciudadanos, metecos, que son extranjeros residentes, y esclavos, y a estos últimos les veda el deporte.", "en": "Around 500 BC, of some 175,000 inhabitants of Athens, only about 25,000 were adult male citizens. The law distinguishes citizens, metics, who are resident foreigners, and slaves, and it bars the last from sport."}], ["father", {"es": "Entre los ciudadanos, los plousioi no trabajan y son el 4 o 5 % de los hogares. Los penêtes trabajan su tierra parte del año y suman del 30 al 50 %. Los ptôchoi trabajan a diario. Nosotros podemos pagarte el paidotriba.", "en": "Among the citizens, the plousioi do not work and are 4 or 5% of households. The penêtes work their land part of the year and make up 30 to 50%. The ptôchoi work every day. We can pay for your trainer."}], ["father", {"es": "En 508 a. C. llegó la democracia, pero el deporte siguió exigiendo tiempo libre y el pago de un paidotriba. Ni la democracia abrió la palestra a quien trabaja a diario.", "en": "In 508 BC democracy came, but sport still required free time and paying a trainer. Not even democracy opened the palaestra to those who work every day."}], {"q": {"q": {"es": "¿Por qué apenas hacían deporte los ptôchoi atenienses?", "en": "Why did the Athenian ptôchoi hardly do sport?"}, "o": [{"es": "Porque trabajaban a diario y no podían pagar al paidotriba ni perder horas de trabajo", "en": "Because they worked every day and could not pay a trainer or lose working hours"}, {"es": "Porque la ley les prohibía entrar en el gimnasio", "en": "Because the law forbade them to enter the gymnasium"}, {"es": "Porque el gimnasio cobraba entrada", "en": "Because the gymnasium charged admission"}, {"es": "Porque no eran ciudadanos", "en": "Because they were not citizens"}], "x": {"es": "El gimnasio era público y no cobraba entrada, pero el paidotriba cobraba de 10 a 15 dracmas al año cuando una familia de cuatro vivía con media dracma diaria.", "en": "The gymnasium was public and free, but the trainer charged 10 to 15 drachmas a year when a family of four lived on half a drachma a day."}}, "fic": "H3·24"}], "esparta": [["father", {"es": "Somos unos 8.000 ciudadanos, los homoioi o «iguales», y vivimos del trabajo de nuestros esclavos, los hilotas. La ciudad nos educa desde los 7 años y la ley nos obliga a ejercitarnos sin descanso.", "en": "We are some 8,000 citizens, the homoioi or 'equals', and we live from the labour of our slaves, the helots. The city educates us from the age of 7 and the law obliges us to train without rest."}], ["father", {"es": "También tus hermanas entrenan. Aquí el deporte es un instrumento de control, y hasta mediados del siglo VI a. C. nos llevamos buena parte de las victorias de Olimpia.", "en": "Your sisters train too. Here sport is an instrument of control, and until the mid-6th century BC we took a good share of the victories at Olympia."}], {"q": {"q": {"es": "¿Qué daba a los homoioi espartanos tiempo libre para el deporte?", "en": "What gave the Spartan homoioi free time for sport?"}, "o": [{"es": "El trabajo de sus esclavos, los hilotas", "en": "The labour of their slaves, the helots"}, {"es": "Un salario de la ciudad", "en": "A salary from the city"}, {"es": "Los premios de Olimpia", "en": "The prizes of Olympia"}, {"es": "El comercio con las colonias", "en": "Trade with the colonies"}], "x": {"es": "Esparta cerró la ciudadanía a unos pocos y a todos ellos les impuso el deporte.", "en": "Sparta closed citizenship to a few and imposed sport on all of them."}}, "fic": "H3·26"}], "corinto": [["father", {"es": "Aristóteles cuenta que las oligarquías, los gobiernos de unos pocos ricos, multaban al rico que no hacía gimnasia y no al pobre. Así la ley apartaba al pobre sin necesidad de prohibírselo.", "en": "Aristotle tells that oligarchies, governments of a few rich men, fined the rich man who did not exercise and not the poor one. So the law kept the poor out without needing to forbid it."}], ["father", {"es": "En Egina, isla vecina de Atenas, las familias ricas costean el entrenamiento de sus hijos, y muchos han vencido en los juegos. Y muy cerca de aquí, en el istmo de Corinto, se celebran unos de los grandes Juegos de Grecia.", "en": "On Aegina, an island near Athens, rich families pay for their sons' training, and many have won at the games. And very near here, at the Isthmus of Corinth, one of the great Games of Greece is held."}], {"q": {"q": {"es": "¿Cómo apartaban las oligarquías al pobre del deporte, según Aristóteles?", "en": "How did oligarchies keep the poor out of sport, according to Aristotle?"}, "o": [{"es": "Multaban al rico que no hacía gimnasia y no al pobre", "en": "They fined the rich man who did not exercise and not the poor one"}, {"es": "Prohibían por ley la entrada de los pobres", "en": "They banned the poor by law"}, {"es": "Cobraban una entrada en el gimnasio", "en": "They charged admission to the gymnasium"}, {"es": "Enviaban a los pobres a la flota", "en": "They sent the poor to the fleet"}], "x": {"es": "La ley apartaba al pobre sin necesidad de prohibírselo.", "en": "The law kept the poor out without needing to forbid it."}}, "fic": "H3·26"}], "crotona": [["father", {"es": "Crotona, nuestra colonia del sur de Italia, encadenó victorias olímpicas en los siglos VI y V a. C. Hoy los historiadores no saben quién accedía aquí al deporte.", "en": "Croton, our colony in southern Italy, strung together Olympic victories in the 6th and 5th centuries BC. Historians today do not know who had access to sport here."}], ["father", {"es": "En Siracusa, la colonia de Sicilia, fundada en 734 a. C., los propios tiranos compiten y vencen para exhibir su poder.", "en": "In Syracuse, the colony in Sicily founded in 734 BC, the tyrants themselves compete and win to display their power."}], {"q": {"q": {"es": "¿Para qué competían los tiranos de Siracusa?", "en": "Why did the tyrants of Syracuse compete?"}, "o": [{"es": "Para exhibir su poder", "en": "To display their power"}, {"es": "Para pagar sus deudas con los premios", "en": "To pay their debts with the prizes"}, {"es": "Porque la ley de Élide los obligaba", "en": "Because the law of Elis obliged them"}, {"es": "Para entrenar a su ejército", "en": "To train their army"}], "x": {"es": "En oligarquías y tiranías el deporte quedaba en manos de quienes gobernaban.", "en": "In oligarchies and tyrannies sport stayed in the hands of those who governed."}}, "fic": "H3·26"}], "elide": [["father", {"es": "Élide administra el santuario de Olimpia, abierto según Heródoto a «cualquier griego que quisiera acceder». Controlamos la admisión, fijamos el reglamento y nombramos al personal entre nuestros ciudadanos.", "en": "Elis runs the sanctuary of Olympia, open according to Herodotus to 'any Greek who wished to come'. We control admission, set the rules and appoint the staff from our citizens."}], ["father", {"es": "Tú tendrás una ventaja. La estancia del mes en Élide corre a cuenta del atleta, un gasto considerable que solo se ahorran los competidores locales.", "en": "You will have an advantage. The month's stay at Elis is at the athlete's expense, a considerable cost that only local competitors are spared."}], {"q": {"q": {"es": "¿Qué competidores se ahorraban el gasto del mes en Élide?", "en": "Which competitors were spared the cost of the month at Elis?"}, "o": [{"es": "Los competidores locales", "en": "Local competitors"}, {"es": "Los vencedores anteriores", "en": "Previous victors"}, {"es": "Los muchachos", "en": "The boys"}, {"es": "Los que llegaban por mar", "en": "Those who came by sea"}], "x": {"es": "La estancia corría a cuenta del atleta.", "en": "The stay was at the athlete's expense."}}, "fic": "H3·47"}]}, "polis_b": [["coach", {"es": "Soy tu paidotriba. Los gimnasios son instituciones públicas, construidas y mantenidas con fondos públicos y donaciones privadas, y las palestras pueden ser también negocios privados.", "en": "I am your paidotribes. Gymnasia are public institutions, built and kept up with public funds and private donations, and palaestrae can also be private businesses."}], ["coach", {"es": "El gimnasio solo abre de día y tiene turnos por edad, para niños, jóvenes y adultos. Aquí trabajan también músicos, poetas, masajistas y demostradores de técnica, y antes de las sesiones más físicas calentaremos.", "en": "The gymnasium only opens by day and has turns by age, for children, youths and adults. Musicians, poets, masseurs and technique demonstrators work here too, and before the hardest sessions we will warm up."}], ["coach", {"es": "Entrenarás desnudo y cubierto de aceite. Gymnasion significa literalmente «lugar de la desnudez».", "en": "You will train naked and covered in oil. Gymnasion literally means 'place of nakedness'."}], {"q": {"q": {"es": "¿Qué significa literalmente gymnasion?", "en": "What does gymnasion literally mean?"}, "o": [{"es": "Lugar de la desnudez", "en": "Place of nakedness"}, {"es": "Lugar del esfuerzo", "en": "Place of effort"}, {"es": "Casa de los jóvenes", "en": "House of the young"}, {"es": "Campo de Zeus", "en": "Field of Zeus"}], "x": {"es": "Los atletas entrenaban desnudos y cubiertos de aceite.", "en": "Athletes trained naked and covered in oil."}}, "fic": "H3·40"}, {"q": {"q": {"es": "¿Por qué el gimnasio solo abría de día?", "en": "Why did the gymnasium only open by day?"}, "o": [{"es": "Para evitar cualquier conducta impropia", "en": "To prevent any improper conduct"}, {"es": "Porque de noche se celebraban sacrificios", "en": "Because sacrifices were held at night"}, {"es": "Porque el aceite se congelaba", "en": "Because the oil froze"}, {"es": "Porque el gimnasiarca dormía allí", "en": "Because the gymnasiarch slept there"}], "x": {"es": "Las instalaciones tenían además turnos por grupos de edad.", "en": "The facilities also had turns by age group."}}, "fic": "H3·41"}, ["note", {"es": "El paidotriba corriente cobraba de 10 a 15 dracmas por alumno y año, cuando una familia de cuatro vivía con media dracma diaria. A ello se sumaban el aceite para untarse y, sobre todo, las horas sin trabajar.", "en": "An ordinary paidotribes charged 10 to 15 drachmas per pupil a year, when a family of four lived on half a drachma a day. On top of that came the oil and, above all, the hours not worked."}], {"choice": {"title": {"es": "¿Qué paidotriba contrata tu familia?", "en": "Which trainer does your family hire?"}, "opts": [{"label": {"es": "Un paidotriba corriente", "en": "An ordinary trainer"}, "sub": {"es": "De 10 a 15 dracmas al año", "en": "10 to 15 drachmas a year"}, "flag": "coachPlain", "items": [["coach", {"es": "Trabajaremos fuerza, resistencia y técnica con halteras, trepa por cuerda, sacos de arena y carreras por la arena.", "en": "We will work on strength, endurance and technique with halteres, rope climbing, sandbags and runs on sand."}]]}, {"label": {"es": "Un paidotriba de renombre", "en": "A renowned trainer"}, "sub": {"es": "Honorarios elevados", "en": "High fees"}, "flag": "coachRich", "items": [["note", {"es": "Los paidotribas de renombre tenían honorarios elevados. En Atenas la ley solo dejaba fuera del gimnasio a los esclavos, pero la barrera real era económica.", "en": "Renowned trainers charged high fees. In Athens the law only kept slaves out of the gymnasium, but the real barrier was economic."}]]}]}}, ["coach", {"es": "Dentro de un mes se celebran los juegos de la ciudad. Correrás el estadio de los muchachos.", "en": "In a month the city's games are held. You will run the boys' stadion."}]], "polis_c": [["note", {"es": "Los juegos locales, a diferencia de Olimpia, solían entregar premios materiales, como escudos de bronce, copas de plata o mantos de lana, y en ocasiones daban segundos premios para fomentar la participación.", "en": "Local games, unlike Olympia, usually gave material prizes, such as bronze shields, silver cups or woollen cloaks, and sometimes second prizes to encourage participation."}], {"q": {"q": {"es": "¿Qué premios solían dar los juegos locales?", "en": "What prizes did local games usually give?"}, "o": [{"es": "Escudos de bronce, copas de plata o mantos de lana", "en": "Bronze shields, silver cups or woollen cloaks"}, {"es": "Solo una corona de olivo", "en": "Only an olive crown"}, {"es": "Tierras y esclavos", "en": "Land and slaves"}, {"es": "Nada, solo el honor", "en": "Nothing, only honour"}], "x": {"es": "Uno de los premios más cuantiosos era el de las Panateneas de Atenas: probablemente 80 ánforas de aceite para el vencedor del estadio.", "en": "One of the richest was at the Athenian Panathenaia: probably 80 amphorae of oil for the stadion winner."}}, "fic": "H3·52"}], "ol1_intro": [{"card": {"title": {"es": "Cuatro años después", "en": "Four years later"}, "s": {"es": "Tienes dieciocho años y ya compites en la categoría de hombres. Se acerca la 100.ª Olimpiada, en 380 a. C., y decides presentarte por tu cuenta, como hacía cada atleta.", "en": "You are eighteen and now compete among the men. The 100th Olympiad, in 380 BC, is approaching, and you decide to enter on your own account, as every athlete did."}, "fic": "H3·38"}}], "fest_intro": [["coach", {"es": "Tu prueba ha terminado, pero el festival dura cinco días. Desde mediados del siglo V a. C. se consolidó esa duración, y además de las pruebas hay rituales, concursos de heraldos y trompeteros, banquetes y reuniones entre ciudades.", "en": "Your event is over, but the festival lasts five days. That length became fixed in the mid-5th century BC, and besides the events there are rituals, contests of heralds and trumpeters, banquets and meetings between cities."}], ["coach", {"es": "Vamos a verlo todo. Elige adónde ir.", "en": "Let's see it all. Choose where to go."}]], "fest": [{"id": "stadium", "label": {"es": "El estadio", "en": "The stadium"}, "sub": {"es": "Público y carrera del estadio", "en": "Crowd and stadion race"}, "fic": "H3·55", "items": [["coach", {"es": "La palabra stádion designa a la vez una medida de 600 pies, la carrera de esa longitud y el recinto donde se corre. Como el pie varía de una ciudad a otra, la pista de Olimpia mide 192,27 metros.", "en": "The word stadion means at once a measure of 600 feet, the race of that length and the place where it is run. Because the foot varies from city to city, the Olympia track measures 192.27 metres."}], ["coach", {"es": "No hay gradas de piedra. Los taludes de tierra acogen a unos 40.000 espectadores según el cálculo habitual, aunque Scanlon (2002) lo rebaja a unos 28.500. El asiento fijo es para los jueces, en el lado sur, y enfrente para la sacerdotisa de Deméter Cámine.", "en": "There are no stone seats. The earth banks hold some 40,000 spectators by the usual estimate, though Scanlon (2002) lowers it to about 28,500. Fixed seats are for the judges, on the south side, and opposite for the priestess of Demeter Chamyne."}], ["coach", {"es": "El estadio fue la única prueba durante las trece primeras ediciones. Cada Olimpiada se recuerda por el nombre del vencedor del estadio, y los historiadores fechan los acontecimientos por esos nombres.", "en": "The stadion was the only event for the first thirteen editions. Each Olympiad is remembered by the name of the stadion winner, and historians date events by those names."}], {"q": {"q": {"es": "¿Cómo recordaban los griegos cada Olimpiada?", "en": "How did the Greeks remember each Olympiad?"}, "o": [{"es": "Por el nombre del vencedor del estadio", "en": "By the name of the stadion winner"}, {"es": "Por el nombre del helanódica", "en": "By the name of the Hellanodikes"}, {"es": "Por el número de espectadores", "en": "By the number of spectators"}, {"es": "Por el vencedor del pentatlón", "en": "By the pentathlon winner"}], "x": {"es": "Era la prueba por excelencia del programa olímpico.", "en": "It was the event par excellence of the Olympic programme."}}, "fic": "H3·57"}, {"q": {"q": {"es": "¿Quién tenía asiento fijo en el estadio de Olimpia?", "en": "Who had a fixed seat in the stadium at Olympia?"}, "o": [{"es": "Los jueces y, enfrente, la sacerdotisa de Deméter Cámine", "en": "The judges and, opposite, the priestess of Demeter Chamyne"}, {"es": "Los vencedores de ediciones anteriores", "en": "Victors of earlier editions"}, {"es": "Los embajadores de cada polis", "en": "The ambassadors of each polis"}, {"es": "Nadie, todos estaban de pie", "en": "Nobody, everyone stood"}], "x": {"es": "Era un espacio de espectáculo sin arquitectura de espectáculo.", "en": "It was a space for spectacle without the architecture of spectacle."}}, "fic": "H3·55"}]}, {"id": "races", "label": {"es": "Las carreras", "en": "The races"}, "sub": {"es": "Díaulos y dólico", "en": "Diaulos and dolichos"}, "fic": "H3·58", "race": "diaulos", "items": [["coach", {"es": "El díaulos fue la primera prueba añadida, en 724 a. C. Cubre dos longitudes del estadio, 384,56 m, y su nombre, «doble flauta», evoca las dos cañas del instrumento, como la ida y la vuelta.", "en": "The diaulos was the first event added, in 724 BC. It covers two lengths of the stadium, 384.56 m, and its name, 'double pipe', recalls the two reeds of the instrument, like going and returning."}], ["coach", {"es": "La mayoría de los estudios supone que cada corredor rodea su propio poste, el kamptér, en sentido antihorario, y vuelve por la calle contigua.", "en": "Most studies assume that each runner rounds his own post, the kampter, anticlockwise, and comes back along the next lane."}], ["coach", {"es": "El dólico, la carrera de fondo, entró en 720 a. C. y mide entre 20 y 24 estadios, de 3,8 a 4,6 km. Todos giran en torno a un único poste. Está prohibido agarrarse a él, pero se permite levantar una nube de polvo para frenar al rival.", "en": "The dolichos, the long race, came in in 720 BC and measures 20 to 24 stades, 3.8 to 4.6 km. Everyone turns round a single post. Grabbing it is forbidden, but raising a cloud of dust to slow a rival is allowed."}], ["coach", {"es": "Te he inscrito en el díaulos. Corre hasta tu poste, gíralo y vuelve.", "en": "I have entered you in the diaulos. Run to your post, round it and come back."}], {"q": {"q": {"es": "¿Qué estaba permitido en el dólico?", "en": "What was allowed in the dolichos?"}, "o": [{"es": "Levantar una nube de polvo para frenar al rival", "en": "Raising a cloud of dust to slow a rival"}, {"es": "Agarrarse al poste para girar", "en": "Grabbing the post to turn"}, {"es": "Cortar por el centro del estadio", "en": "Cutting across the middle of the stadium"}, {"es": "Correr con calzado", "en": "Running with shoes"}], "x": {"es": "Todos los corredores giraban en torno a un único poste, en sentido antihorario.", "en": "All the runners turned round a single post, anticlockwise."}}, "fic": "H3·59"}, {"q": {"q": {"es": "¿Con qué relacionaba Filóstrato el dólico?", "en": "What did Philostratus link the dolichos to?"}, "o": [{"es": "Con los hemeródromos, mensajeros arcadios de larga distancia", "en": "With the hemerodromoi, Arcadian long-distance messengers"}, {"es": "Con la caza del jabalí", "en": "With the boar hunt"}, {"es": "Con la carga de la falange", "en": "With the charge of the phalanx"}, {"es": "Con el salto del toro", "en": "With bull-leaping"}], "x": {"es": "Otra hipótesis apunta a los bematistas, contadores de pasos profesionales.", "en": "Another hypothesis points to the bematists, professional pace-counters."}}, "fic": "H3·59"}]}, {"id": "combat", "label": {"es": "Los combates", "en": "Combat"}, "sub": {"es": "Pugilato y pancracio", "en": "Boxing and pankration"}, "fic": "H3·67", "items": [["r1", {"es": "Mira el círculo de arena. No hay asaltos ni descansos, ni categorías de peso. En el pugilato y el pancracio se sigue hasta que uno queda incapacitado o levanta el índice en señal de abandono, y el único límite es la caída de la noche.", "en": "Look at the sand circle. There are no rounds, no breaks and no weight classes. In boxing and pankration they go on until one is incapacitated or raises his index finger to give up, and the only time limit is nightfall."}], ["r1", {"es": "Los púgiles se enrollan las manos con himantes, tiras de cuero que protegen la mano del que golpea. Si rehúyen el combate, los jueces reducen el espacio con una barrera, el klímax.", "en": "Boxers wrap their hands in himantes, leather strips that protect the hitter's hand. If they avoid fighting, the judges shrink the space with a barrier, the klimax."}], ["r1", {"es": "El pancracio mezcla golpes, patadas y agarres, y es el más violento. Aquí solo se prohíbe morder y meter los dedos en los ojos. Arriquión murió asfixiado en la final de 564 a. C. mientras dislocaba el pie de su rival, que se rindió, y los jueces coronaron su cadáver.", "en": "Pankration mixes punches, kicks and holds, and is the most violent. Here only biting and gouging the eyes are forbidden. Arrhichion died choking in the final of 564 BC while dislocating his rival's foot; the rival gave up, and the judges crowned his corpse."}], {"myth": 11, "fic": "H3·67"}, {"q": {"q": {"es": "¿Qué era el klímax en el pugilato?", "en": "What was the klimax in boxing?"}, "o": [{"es": "Una barrera con la que los jueces reducían el espacio si los púgiles rehuían el combate", "en": "A barrier the judges used to shrink the space if boxers avoided fighting"}, {"es": "El guante de época romana", "en": "The Roman-era glove"}, {"es": "El golpe final", "en": "The final blow"}, {"es": "La señal de rendición", "en": "The sign of surrender"}], "x": {"es": "Al no haber asaltos, el combate solo acababa con la incapacidad o el abandono de uno de los dos.", "en": "Since there were no rounds, the bout only ended with one man's incapacity or surrender."}}, "fic": "H3·69"}, {"q": {"q": {"es": "¿Qué estaba prohibido en el pancracio de Olimpia?", "en": "What was forbidden in pankration at Olympia?"}, "o": [{"es": "Morder y meter los dedos en los ojos", "en": "Biting and gouging the eyes"}, {"es": "Las patadas", "en": "Kicks"}, {"es": "Los estrangulamientos", "en": "Chokes"}, {"es": "Las luxaciones", "en": "Dislocations"}], "x": {"es": "Filóstrato añade que los espartanos lo permitían en su tierra.", "en": "Philostratus adds that the Spartans allowed it in their own land."}}, "fic": "H3·70"}]}, {"id": "hippo", "label": {"es": "El hipódromo", "en": "The hippodrome"}, "sub": {"es": "Carros y caballos", "en": "Chariots and horses"}, "fic": "H3·72", "items": [["r2", {"es": "El hipódromo está a las afueras del recinto sagrado, y se le calculan unos 600 metros de largo por 200 de ancho. Un viajero del siglo II d. C. contará que la salida era lanzada, en «punta de flecha», con las posiciones sorteadas de antemano.", "en": "The hippodrome lies outside the sacred precinct and is estimated at some 600 metres long by 200 wide. A traveller of the 2nd century AD will tell that the start was a flying one, in an 'arrowhead', with the positions drawn by lot beforehand."}], ["r2", {"es": "La cuadriga entró en 680 a. C. y da 12 vueltas. La carrera de caballos, el kéles, entró en 648 a. C. y da 6 vueltas, montando a pelo, sin estribos, pero con riendas. Las imágenes muestran jinetes muy jóvenes, probablemente niños esclavos.", "en": "The four-horse chariot came in in 680 BC and runs 12 laps. The horse race, the keles, came in in 648 BC and runs 6 laps, ridden bareback, without stirrups but with reins. Images show very young riders, probably slave boys."}], ["r2", {"es": "Un caballo de élite puede costar 1.200 dracmas, y un carro de varios caballos supera los 5.000. En 416 a. C. Alcibíades inscribió siete carros y logró el primer, el segundo y el cuarto puesto.", "en": "An elite horse can cost 1,200 drachmas, and a chariot with several horses over 5,000. In 416 BC Alcibiades entered seven chariots and took first, second and fourth place."}], ["r2", {"es": "En 512 a. C. una yegua llamada Aura derribó a su jinete en la salida y llegó primera. Los jueces dieron la victoria a su dueño.", "en": "In 512 BC a mare called Aura threw her rider at the start and came in first. The judges gave the victory to her owner."}], {"q": {"q": {"es": "¿Cuántas vueltas daba la cuadriga en Olimpia?", "en": "How many laps did the four-horse chariot run at Olympia?"}, "o": [{"es": "12", "en": "12"}, {"es": "8", "en": "8"}, {"es": "6", "en": "6"}, {"es": "24", "en": "24"}], "x": {"es": "La biga, desde 408 a. C., daba 8 vueltas, y el kéles 6.", "en": "The two-horse chariot, from 408 BC, ran 8, and the keles 6."}}, "fic": "H3·74"}, {"q": {"q": {"es": "¿Por qué los aurigas no recibían la corona?", "en": "Why did charioteers not receive the crown?"}, "o": [{"es": "Eran esclavos o profesionales a sueldo de baja condición, y la corona era para el dueño", "en": "They were slaves or hired professionals of low status, and the crown went to the owner"}, {"es": "Porque competían vestidos", "en": "Because they competed clothed"}, {"es": "Porque no eran griegos", "en": "Because they were not Greek"}, {"es": "Porque la cuadriga no era una prueba sagrada", "en": "Because the chariot race was not a sacred event"}], "x": {"es": "El reconocimiento recaía sobre el noble que asumía todos los gastos.", "en": "Recognition went to the noble who bore all the costs."}}, "fic": "H3·73"}]}, {"id": "altis", "label": {"es": "El Altis", "en": "The Altis"}, "sub": {"es": "De dónde salieron los Juegos", "en": "Where the Games came from"}, "fic": "H3·34", "items": [["judge", {"es": "Aquí nació todo. El culto a Zeus empieza a finales del siglo XI a. C., junto a ese túmulo que hoy veneramos como tumba de Pélope. Entre los siglos X y VIII a. C. los fieles ofrecían miles de figurillas de animales y trípodes de bronce.", "en": "This is where it all began. The cult of Zeus starts at the end of the 11th century BC, next to that mound we now honour as the tomb of Pelops. Between the 10th and 8th centuries BC the faithful offered thousands of animal figurines and bronze tripods."}], ["note", {"es": "El túmulo era en realidad prehistórico, de mediados del III milenio a. C., y más de mil años de vacío lo separan del santuario. El primer estadio se levantó hacia 700 a. C., y Homero no menciona Olimpia.", "en": "The mound was in fact prehistoric, from the mid-3rd millennium BC, and more than a thousand years of emptiness separate it from the sanctuary. The first stadium was built c. 700 BC, and Homer does not mention Olympia."}], ["note", {"es": "Sobre el origen de los Juegos hay tres hipótesis sin consenso: la funeraria, como los juegos de Patroclo; la iniciática, que se apoya en los Juegos Hereos; y la de la caza, de Patay-Horváth (2020). Los estudios coinciden en que los primeros Juegos fueron sencillas carreras a pie dentro de una fiesta de Zeus.", "en": "There are three hypotheses on the origin of the Games, with no consensus: the funerary one, like the games of Patroclus; the initiatory one, based on the Heraia; and the hunting one, by Patay-Horváth (2020). Scholars agree that the first Games were simple foot races within a festival of Zeus."}], {"myth": 5, "fic": "H3·34"}, {"q": {"q": {"es": "¿Qué obstáculo tiene la hipótesis funeraria del origen de los Juegos?", "en": "What obstacle does the funerary hypothesis of the Games' origin face?"}, "o": [{"es": "Los cultos funerarios a Pélope son de hacia 600 a. C., posteriores al inicio de las pruebas", "en": "The funerary cults of Pelops date from c. 600 BC, after the events began"}, {"es": "Homero no conocía los funerales", "en": "Homer did not know about funerals"}, {"es": "En Olimpia no había tumbas", "en": "There were no tombs at Olympia"}, {"es": "Los Hereos son más antiguos", "en": "The Heraia are older"}], "x": {"es": "Ninguna de las tres hipótesis se ha impuesto del todo.", "en": "None of the three hypotheses has fully prevailed."}}, "fic": "H3·36"}, {"q": {"q": {"es": "¿En qué orden aparecen las cosas en Olimpia según la arqueología?", "en": "In what order do things appear at Olympia according to archaeology?"}, "o": [{"es": "Primero el rito, después la distinción de las élites y al final el certamen atlético", "en": "First the rite, then elite distinction and finally the athletic contest"}, {"es": "Primero los Juegos y después el santuario", "en": "First the Games and then the sanctuary"}, {"es": "Primero la carrera de carros y después el estadio", "en": "First the chariot race and then the stadion"}, {"es": "Primero el pentatlón y después la lucha", "en": "First the pentathlon and then wrestling"}], "x": {"es": "La arqueología invierte el orden de los relatos de fundación.", "en": "Archaeology reverses the order of the foundation stories."}}, "fic": "H3·34"}]}], "ol1_home": [["note", {"es": "La victoria olímpica convertía al vencedor en un héroe para el resto de la sociedad. Con el tiempo, los gobernantes empezaron además a recompensar económicamente a sus vencedores.", "en": "An Olympic victory turned the victor into a hero for the rest of society. In time, rulers also began to reward their victors with money."}], {"myth": 8, "fic": "H3·52"}], "heraia": [["mother", {"es": "En la polis la mujer libre carece de derechos políticos y depende de los varones. La maternidad y la casa, el oikos, delimitan casi por completo nuestro papel. Jenofonte llega a escribir que las tareas domésticas bastan como ejercicio para la esposa.", "en": "In the polis a free woman has no political rights and depends on the men. Motherhood and the household, the oikos, mark out almost all our role. Xenophon even writes that housework is exercise enough for a wife."}], ["sister", {"es": "Yo puedo correr porque aún no me he casado. Para las chicas el paso a la edad adulta llega entre los 12 y los 14 años, cuando nos consideran listas para casarnos. Una vez casadas, apenas volvemos a competir.", "en": "I can run because I am not married yet. For girls the passage to adulthood comes between 12 and 14, when we are considered ready to marry. Once married, we hardly ever compete again."}], ["mother", {"es": "Las casadas tenemos vetado el festival de Olimpia. La ley de Élide castiga con la muerte a la mujer casada sorprendida en él. Las jóvenes solteras sí pueden asistir.", "en": "We married women are barred from the festival of Olympia. The law of Elis punishes with death any married woman caught there. Unmarried girls may attend."}], ["mother", {"es": "Calipátira de Rodas, hija de un púgil famoso, entró disfrazada de entrenador para ver competir a su hijo. La descubrieron al saltar la valla para celebrar su victoria, y los jueces la perdonaron por ser hija, hermana y madre de vencedores.", "en": "Kallipateira of Rhodes, daughter of a famous boxer, got in disguised as a trainer to watch her son compete. She was found out when she jumped the fence to celebrate his win, and the judges forgave her for being the daughter, sister and mother of victors."}], ["sister", {"es": "Los Juegos Hereos se instituyeron hacia 580 a. C. en honor de Hera, la esposa de Zeus. Corremos 5/6 del estadio, unos 160 m, en tres categorías de edad, con el pelo suelto y una túnica por encima de las rodillas atada a un hombro.", "en": "The Heraia were founded c. 580 BC in honour of Hera, Zeus's wife. We run 5/6 of the stadium, about 160 m, in three age groups, with our hair loose and a tunic above the knee tied at one shoulder."}], ["note", {"es": "En este capítulo corres tú la carrera de tu hermana. Hipótesis como la de Serwint (1993) ven en los Hereos un rito prenupcial, y a la ganadora se le daba una corona de olivo, igual que a los varones.", "en": "In this chapter you run your sister's race. Hypotheses such as Serwint's (1993) see the Heraia as a prenuptial rite, and the winner received an olive crown, just like the men."}]], "heraia_b": [{"myth": 13, "fic": "H3·76"}, {"myth": 12, "fic": "H3·72"}, {"q": {"q": {"es": "¿Qué frontera decidía el lugar de la mujer en el deporte griego?", "en": "What boundary decided a woman's place in Greek sport?"}, "o": [{"es": "El matrimonio", "en": "Marriage"}, {"es": "La riqueza de su familia", "en": "Her family's wealth"}, {"es": "La ciudad de origen", "en": "Her city of origin"}, {"es": "La religión", "en": "Religion"}], "x": {"es": "Dependía de su edad y de su estado civil; casi todo lo que sabemos procede de autores varones.", "en": "It depended on her age and marital status; almost all we know comes from male authors."}}, "fic": "H3·75"}, {"q": {"q": {"es": "¿En qué se diferenciaba Esparta respecto a las muchachas?", "en": "How was Sparta different regarding girls?"}, "o": [{"es": "En época clásica participaban en carreras y pruebas para dar a la ciudad hijos robustos", "en": "In the Classical period they took part in races and contests to give the city strong children"}, {"es": "Competían en Olimpia junto a los hombres", "en": "They competed at Olympia alongside the men"}, {"es": "Tenían derechos políticos", "en": "They had political rights"}, {"es": "Podían entrar casadas en el festival", "en": "They could enter the festival when married"}], "x": {"es": "Practicaban además una modalidad de lucha y una danza de saltos.", "en": "They also practised a form of wrestling and a jumping dance."}}, "fic": "H3·75"}], "circuit_intro": [{"card": {"title": {"es": "El circuito panhelénico", "en": "The Panhellenic circuit"}, "s": {"es": "Además de los Juegos Olímpicos, los más importantes, hubo otros tres Juegos deportivos, en Delfos, en el istmo de Corinto y en Nemea. Vencer en los cuatro otorgaba el título de periodonikes, «vencedor del circuito». El Tema 3 solo estudia Olimpia, así que el juego aplica en los tres las reglas de Olimpia.", "en": "Besides the Olympic Games, the most important, there were three other athletic Games, at Delphi, at the Isthmus of Corinth and at Nemea. Winning all four gave the title of periodonikes, 'circuit victor'. Topic 3 only studies Olympia, so the game applies Olympia's rules at all three."}, "fic": "H3·43"}}], "circuit": [{"id": "isthmia", "label": {"es": "Juegos Ístmicos", "en": "Isthmian Games"}, "sub": {"es": "Istmo de Corinto", "en": "Isthmus of Corinth"}, "fic": "H3·43", "items": [["r2", {"es": "Aquí se recuerda a un pancratista apodado «Dedos», que vencía doblando los dedos del rival. Sumó tres coronas en Olimpia, dos en Delfos y doce en el Istmo y en Nemea.", "en": "Here they remember a pankratiast nicknamed 'Fingers', who won by bending his rival's fingers. He took three crowns at Olympia, two at Delphi and twelve at the Isthmus and Nemea."}], ["r2", {"es": "Y Píndaro, el poeta que componía odas para los vencedores, celebró a un tebano que venció aquí conduciendo su propio carro. Muy pocos propietarios lo hacían.", "en": "And Pindar, the poet who composed odes for victors, celebrated a Theban who won here driving his own chariot. Very few owners did."}], {"q": {"q": {"es": "¿Qué título recibía quien vencía en Olimpia, Delfos, el Istmo y Nemea?", "en": "What title did someone who won at Olympia, Delphi, the Isthmus and Nemea receive?"}, "o": [{"es": "Periodonikes", "en": "Periodonikes"}, {"es": "Áristos", "en": "Aristos"}, {"es": "Helanódica", "en": "Hellanodikes"}, {"es": "Espondóforo", "en": "Spondophoros"}], "x": {"es": "«Vencedor del circuito» panhelénico.", "en": "'Victor of the circuit', the Panhellenic one."}}, "fic": "H3·43"}]}, {"id": "nemea", "label": {"es": "Juegos Nemeos", "en": "Nemean Games"}, "sub": {"es": "Nemea", "en": "Nemea"}, "fic": "H3·78", "items": [["coach", {"es": "Mira lo que he encontrado junto a la pista: una tablilla de plomo enrollada y perforada. Los atletas graban maldiciones contra sus rivales para hechizarlos antes de la prueba.", "en": "Look what I found by the track: a lead tablet, rolled up and pierced. Athletes engrave curses against their rivals to bewitch them before the event."}], ["note", {"es": "En Nemea se han hallado tablillas así. Una reza: «Ato y encadeno los tendones, las partes del cuerpo, la mente y la inteligencia de los corredores para que no tengan fuerza, pasen la noche en vela, vomiten toda la comida para su propio perjuicio, no puedan correr y queden en último lugar».", "en": "Tablets like this have been found at Nemea. One reads: 'I bind and chain the tendons, the body parts, the mind and the intelligence of the runners so that they have no strength, lie awake at night, vomit all their food to their own harm, cannot run and come last.'"}], {"q": {"q": {"es": "¿Para qué grababan los atletas tablillas de plomo?", "en": "Why did athletes engrave lead tablets?"}, "o": [{"es": "Para maldecir a sus rivales antes de la prueba", "en": "To curse their rivals before the event"}, {"es": "Para inscribirse ante los jueces", "en": "To register with the judges"}, {"es": "Para registrar sus marcas", "en": "To record their marks"}, {"es": "Para dar gracias a Zeus", "en": "To thank Zeus"}], "x": {"es": "Aparecieron enrolladas y perforadas.", "en": "They were found rolled up and pierced."}}, "fic": "H3·78"}]}, {"id": "pythia", "label": {"es": "Juegos Píticos", "en": "Pythian Games"}, "sub": {"es": "Delfos", "en": "Delphi"}, "fic": "H3·22", "items": [["r0", {"es": "Aquí, como en Olimpia, se reúnen griegos de cientos de poleis que comparten lengua, dioses y santuarios, aunque habitualmente guerreen entre sí. Olimpia es de todos los griegos aunque la gobierne Élide.", "en": "Here, as at Olympia, Greeks from hundreds of poleis meet, sharing language, gods and sanctuaries even though they usually fight each other. Olympia belongs to all Greeks even though Elis governs it."}], ["r0", {"es": "Y los mejores atletas, además de la gloria, pueden lucrarse y vivir holgadamente gracias a su talento.", "en": "And the best athletes, besides glory, can make money and live comfortably thanks to their talent."}], {"q": {"q": {"es": "¿Qué tres identidades construía a la vez el deporte griego?", "en": "Which three identities did Greek sport build at once?"}, "o": [{"es": "La del atleta, la de su ciudad y la de todos los griegos frente a los bárbaros", "en": "The athlete's, his city's and that of all Greeks against the barbarians"}, {"es": "La del rey, la del sacerdote y la del soldado", "en": "The king's, the priest's and the soldier's"}, {"es": "La del ciudadano, la del meteco y la del esclavo", "en": "The citizen's, the metic's and the slave's"}, {"es": "La de Esparta, la de Atenas y la de Élide", "en": "Sparta's, Athens's and Elis's"}], "x": {"es": "La victoria del atleta era también la victoria de su polis.", "en": "The athlete's victory was also his polis's."}}, "fic": "H3·22"}]}], "ol2_a": [{"card": {"title": {"es": "101.ª Olimpiada", "en": "101st Olympiad"}, "s": {"es": "Has cumplido de nuevo los 30 días en Élide bajo la vigilancia de los helanódicas y has recorrido la Vía Sagrada. Tienes veintidós años.", "en": "You have again done the 30 days at Elis under the eye of the Hellanodikai and walked the Sacred Way. You are twenty-two."}, "fic": "H3·47"}}, ["judge", {"es": "Romper la tregua es un delito político y religioso de primer orden, porque ofende al propio Zeus. En 420 a. C. impusimos a Esparta una multa de 200.000 dracmas, 200 por cada soldado, por enviar tropas al fuerte de Lepreo durante la tregua. No pagó y quedó excluida.", "en": "Breaking the truce is a political and religious crime of the first order, because it offends Zeus himself. In 420 BC we fined Sparta 200,000 drachmas, 200 per soldier, for sending troops to the fort of Lepreon during the truce. It did not pay and was excluded."}], {"q": {"q": {"es": "¿Por qué quedó excluida Esparta de los Juegos de 420 a. C.?", "en": "Why was Sparta excluded from the Games of 420 BC?"}, "o": [{"es": "Por enviar tropas a Lepreo durante la tregua y negarse a pagar la multa", "en": "For sending troops to Lepreon during the truce and refusing to pay the fine"}, {"es": "Porque un espartano sobornó a los jueces", "en": "Because a Spartan bribed the judges"}, {"es": "Porque sus atletas llegaron tarde a Élide", "en": "Because its athletes reached Elis late"}, {"es": "Porque una espartana entró en el estadio", "en": "Because a Spartan woman entered the stadium"}], "x": {"es": "Élide le impuso 200.000 dracmas, 200 por cada soldado.", "en": "Elis fined it 200,000 drachmas, 200 per soldier."}}, "fic": "H3·33"}, ["r1", {"es": "Escúchame bien. Si mañana llegamos a la lucha con dos victorias cada uno, déjate caer. Te pagaré bien. Nadie lo sabrá.", "en": "Listen carefully. If tomorrow we reach the wrestling with two wins each, let yourself fall. I will pay you well. No one will know."}], {"choice": {"title": {"es": "Un rival te ofrece dinero", "en": "A rival offers you money"}, "opts": [{"label": {"es": "Aceptar el dinero", "en": "Take the money"}, "sub": {"es": "Y dejarte caer si llega el caso", "en": "And take a fall if it comes to it"}, "flag": "bribe", "items": [["r1", {"es": "Trato hecho. Ni una palabra.", "en": "Deal. Not a word."}]]}, {"label": {"es": "Rechazarlo", "en": "Refuse"}, "sub": {"es": "Competir limpio", "en": "Compete clean"}, "flag": "clean", "items": [["r1", {"es": "Allá tú. Nos veremos en la arena.", "en": "Suit yourself. See you in the sand."}]]}, {"label": {"es": "Denunciarlo a los helanódicas", "en": "Report him to the Hellanodikai"}, "sub": {"es": "Romper el silencio", "en": "Break the silence"}, "flag": "report", "items": [["judge", {"es": "Lo multaremos. Las sanciones económicas son las más deshonrosas y se imponen sobre todo por intentos de soborno. Nuestras decisiones pueden recurrirse ante el Consejo Olímpico, que ha llegado a multar a jueces parciales.", "en": "We will fine him. Fines are the most shameful penalty and are imposed above all for attempted bribery. Our decisions can be appealed to the Olympic Council, which has even fined biased judges."}]]}]}}], "ol2_bribe": [["judge", {"es": "Lo sabemos todo. Has roto el juramento que prestaste ante Zeus. Pagarás una multa, y con ella se levantará un zan, una estatua de Zeus en bronce junto a la entrada del estadio, con tu nombre grabado en el pedestal.", "en": "We know everything. You have broken the oath you swore before Zeus. You will pay a fine, and with it a Zan will be raised, a bronze statue of Zeus by the stadium entrance, with your name engraved on the base."}], ["note", {"es": "Los seis primeros zanes se pagaron en 388 a. C. con las multas al púgil que compró a sus rivales y a los tres que aceptaron su dinero. Se levantaron al menos dieciséis, y Kyle (2015) y Buraselis (2017) ven en ellos una advertencia pública y duradera.", "en": "The first six Zanes were paid for in 388 BC with the fines on the boxer who bought his rivals and the three who took his money. At least sixteen were raised, and Kyle (2015) and Buraselis (2017) see them as a public and lasting warning."}], {"q": {"q": {"es": "¿Qué se grababa en el pedestal de un zan?", "en": "What was engraved on the base of a Zan?"}, "o": [{"es": "El nombre del infractor", "en": "The offender's name"}, {"es": "El nombre del vencedor", "en": "The victor's name"}, {"es": "Una oración a Hera", "en": "A prayer to Hera"}, {"es": "Las reglas del pentatlón", "en": "The rules of the pentathlon"}], "x": {"es": "Se levantaban junto a la entrada del estadio.", "en": "They stood by the stadium entrance."}}, "fic": "H3·78"}], "ol2_hoplite": [["coach", {"es": "Queda la última prueba del programa, la carrera de hoplitas. Según Filóstrato, simboliza el fin de la tregua. Cubre 2 estadios, 384,56 m, y entró en la 65.ª Olimpiada, en 520 a. C.", "en": "The last event of the programme remains, the hoplite race. According to Philostratus, it symbolises the end of the truce. It covers 2 stades, 384.56 m, and came in at the 65th Olympiad, in 520 BC."}], ["coach", {"es": "Al principio se corría con casco, grebas y escudo; luego se quitaron las grebas y después el casco. El templo de Zeus guarda 25 escudos iguales para que todos carguen el mismo peso. Si se parece al de guerra, de unos 8 kg, llevarás en un brazo más del 10 % de tu peso.", "en": "At first it was run with helmet, greaves and shield; then the greaves were dropped and later the helmet. The temple of Zeus keeps 25 identical shields so that everyone carries the same weight. If it is like a war shield, about 8 kg, you will carry more than 10% of your weight on one arm."}], {"myth": 9, "fic": "H3·60"}], "ol2_end": [{"q": {"q": {"es": "¿Qué homenajeaba la carrera de hoplitas?", "en": "What did the hoplite race pay homage to?"}, "o": [{"es": "La carga de los últimos cincuenta metros antes del choque de las falanges", "en": "The charge of the last fifty metres before the phalanxes clashed"}, {"es": "La huida de los persas en Maratón", "en": "The Persian flight at Marathon"}, {"es": "El correo de los hemeródromos", "en": "The hemerodromoi's messages"}, {"es": "La caza del jabalí", "en": "The boar hunt"}], "x": {"es": "El hoplita era el ciudadano capaz de pagarse la panoplia, de 75 a 100 dracmas.", "en": "The hoplite was the citizen able to pay for his panoply, 75 to 100 drachmas."}}, "fic": "H3·60"}], "ol3_a": [{"card": {"title": {"es": "104.ª Olimpiada", "en": "104th Olympiad"}, "s": {"es": "Tienes treinta y cuatro años. Los arcadios tomaron Olimpia hace un año y presiden ahora los Juegos, mientras Élide trata de recuperar su control.", "en": "You are thirty-four. The Arcadians took Olympia a year ago and now preside over the Games, while Elis tries to regain control."}, "fic": "H3·33"}}, ["r0", {"es": "Los arcadios mandan en el santuario. Dicen que los eleos vendrán armados a recuperarlo.", "en": "The Arcadians are in charge of the sanctuary. They say the Eleans will come armed to take it back."}], ["coach", {"es": "Concéntrate en lo tuyo. Todas las pruebas del pentatlón se hacen el segundo día por la tarde, con tres jueces. Se desconoce el orden exacto, pero la lucha cierra siempre.", "en": "Focus on your own business. All the pentathlon events take place on the second day in the afternoon, with three judges. The exact order is unknown, but wrestling always comes last."}], {"q": {"q": {"es": "¿Qué propuso Gillet en 1971 sobre el pentatlón?", "en": "What did Gillet propose in 1971 about the pentathlon?"}, "o": [{"es": "Un sistema por eliminación, difícil de verificar y que choca con la regla de las tres victorias", "en": "An elimination system, hard to verify and at odds with the three-win rule"}, {"es": "Que se sumaban las marcas de las cinco pruebas", "en": "That the marks of the five events were added up"}, {"es": "Que la lucha abría la competición", "en": "That wrestling opened the contest"}, {"es": "Que el pentatlón duraba tres días", "en": "That the pentathlon lasted three days"}], "x": {"es": "Según Gillet, todos saltaban, los cinco primeros lanzaban la jabalina, cuatro corrían, tres lanzaban el disco y el ganador de la lucha vencía.", "en": "According to Gillet, all jumped, the top five threw the javelin, four ran, three threw the discus and the wrestling winner won."}}, "fic": "H3·63"}], "ol3_battle": [["note", {"es": "En plena prueba del pentatlón estalla una batalla en el recinto sagrado entre los arcadios y Élide, que trata de recuperar su legítimo control.", "en": "In the middle of the pentathlon a battle breaks out in the sacred precinct between the Arcadians and Elis, which is trying to regain its rightful control."}], ["note", {"es": "La pugna se extiende toda la noche. Élide se retira para que puedan concluir los eventos deportivos, con la promesa de la retirada arcadia.", "en": "The fight lasts all night. Elis withdraws so that the sporting events can be completed, on the promise of an Arcadian withdrawal."}], {"myth": 4, "fic": "H3·32"}], "ol3_end": [{"card": {"title": {"es": "La anolimpiada", "en": "The anolympiad"}, "s": {"es": "Tras recuperar la administración, Élide registró esta edición como la anolimpiada, la «no-olimpiada», aunque respetó los triunfos individuales.", "en": "After regaining control, Elis recorded this edition as the anolympiad, the 'non-Olympiad', although it respected the individual victories."}, "fic": "H3·33"}}, {"q": {"q": {"es": "¿Qué fue la anolimpiada?", "en": "What was the anolympiad?"}, "o": [{"es": "La edición de 364 a. C., que Élide no reconoció tras la batalla con los arcadios, aunque respetó los triunfos individuales", "en": "The edition of 364 BC, which Elis did not recognise after the battle with the Arcadians, though it respected individual victories"}, {"es": "La Olimpiada de Nerón", "en": "Nero's Olympiad"}, {"es": "Una edición suspendida por la invasión persa", "en": "An edition suspended by the Persian invasion"}, {"es": "Los Juegos de las muchachas", "en": "The girls' Games"}], "x": {"es": "La 104.ª Olimpiada se celebró en 364 a. C.", "en": "The 104th Olympiad was held in 364 BC."}}, "fic": "H3·33"}], "coach_a": [{"card": {"title": {"es": "Ahora enseñas tú", "en": "Now you teach"}, "s": {"es": "Te has retirado y eres paidotriba. Acompañas siempre a tu alumno, porque su éxito depende en buena parte de ti, y llevas la vara para corregir sus ejercicios.", "en": "You have retired and become a trainer. You always go with your pupil, because his success depends largely on you, and you carry the rod to correct his exercises."}, "fic": "H3·39"}}, ["pupil", {"es": "Maestro, ¿por qué hemos dejado de comer solo carne?", "en": "Master, why have we stopped eating only meat?"}], ["you", {"es": "Hacia 500 a. C. se impuso una dieta abundante en carne, porque más proteína y un entrenamiento vigoroso dan volumen, una ventaja en los combates. Pero a finales del siglo V a. C. los médicos censuraron comer casi solo carne, porque daba diarrea a algunos atletas, y prohibieron el agua fría.", "en": "Around 500 BC a meat-rich diet took over, because more protein and hard training add bulk, an advantage in combat. But at the end of the 5th century BC doctors condemned eating almost only meat, because it gave some athletes diarrhoea, and they banned cold water."}], ["pupil", {"es": "¿Y es verdad que Milón de Crotona comía veinte libras de carne al día?", "en": "And is it true that Milo of Croton ate twenty pounds of meat a day?"}], ["you", {"es": "Es un mito, el del atleta glotón, que se convirtió en un tópico común en Grecia.", "en": "It is a myth, that of the glutton athlete, which became a common cliché in Greece."}], {"choice": {"title": {"es": "¿Cómo vas a entrenarlo?", "en": "How will you train him?"}, "opts": [{"label": {"es": "Con los tetras, sin romper el ciclo", "en": "With the tetrads, never breaking the cycle"}, "sub": {"es": "Cuatro días fijos", "en": "Four fixed days"}, "flag": "tetras", "items": [["note", {"es": "Siglos después, hacia 230 d. C., Filóstrato condenará los tetras por excesivos, con el ejemplo de un luchador egipcio que celebró dos días su victoria olímpica, llegó al tercero con el estómago revuelto y murió por el ejercicio que le impuso un entrenador empeñado en no romper el ciclo.", "en": "Centuries later, around AD 230, Philostratus will condemn the tetrads as excessive, citing an Egyptian wrestler who celebrated his Olympic win for two days, arrived on the third with an upset stomach and died from the exercise imposed by a trainer determined not to break the cycle."}]]}, {"label": {"es": "Adaptado a él", "en": "Adapted to him"}, "sub": {"es": "Atento al sueño y al ánimo", "en": "Mindful of sleep and spirits"}, "flag": "adapt", "items": [["note", {"es": "Es lo que defenderá Filóstrato hacia 230 d. C.: un entrenamiento pensado para cada atleta, atento a la higiene, a la psicología y al sueño, que anime con la palabra en los momentos de flaqueza y se adapte a cada deporte, con sacos ligeros para los púgiles y pesados para los pancratistas.", "en": "It is what Philostratus will argue around AD 230: training designed for each athlete, mindful of hygiene, psychology and sleep, encouraging with words in moments of weakness and adapted to each sport, with light bags for boxers and heavy ones for pankratiasts."}]]}]}}, {"q": {"q": {"es": "¿Qué recomendaba Filóstrato a púgiles y pancratistas?", "en": "What did Philostratus recommend to boxers and pankratiasts?"}, "o": [{"es": "Sacos ligeros a los púgiles para ganar velocidad y pesados a los pancratistas para fortalecer puños y dedos", "en": "Light bags for boxers to gain speed and heavy ones for pankratiasts to strengthen fists and fingers"}, {"es": "Lo mismo a todos: los tetras", "en": "The same for everyone: the tetrads"}, {"es": "Comer solo carne", "en": "Eating only meat"}, {"es": "Entrenar de noche", "en": "Training at night"}], "x": {"es": "Defendía además una vida disciplinada, sin dulces, alcohol ni actividad sexual, para no malgastar energía.", "en": "He also argued for a disciplined life, without sweets, alcohol or sex, so as not to waste energy."}}, "fic": "H3·39"}, ["you", {"es": "En la lucha solo se permiten las llaves reglamentarias. Una ley sagrada de Olimpia parece castigar con azotes al que rompe los dedos del rival. La lucha es una escuela de disciplina y de control de los impulsos.", "en": "In wrestling only regulation holds are allowed. A sacred law of Olympia seems to punish with flogging anyone who breaks a rival's fingers. Wrestling is a school of discipline and self-control."}]], "coach_b": [{"card": {"title": {"es": "Camino de Olimpia", "en": "On the way to Olympia"}, "s": {"es": "Viajas con tu alumno durante el mes sagrado. En el camino coincidís con un ateniense que se llama Frinón.", "en": "You travel with your pupil during the sacred month. On the way you fall in with an Athenian named Phrynon."}, "fic": "H3·33"}}, ["phrynon", {"es": "Unos soldados macedonios me asaltaron en plena tregua, en tiempos del rey Filipo II. El propio rey se disculpó alegando que sus hombres ignoraban la tregua.", "en": "Some Macedonian soldiers attacked me in the middle of the truce, in the time of King Philip II. The king himself apologised, saying his men did not know about the truce."}], {"q": {"q": {"es": "¿Qué protegía la ekecheiría, la tregua sagrada?", "en": "What did the ekecheiria, the sacred truce, protect?"}, "o": [{"es": "El territorio de Élide, el paso de los peregrinos que iban o volvían del festival y el santuario sin armas", "en": "The territory of Elis, the passage of pilgrims to and from the festival and a weapon-free sanctuary"}, {"es": "La paz en toda Grecia durante un año", "en": "Peace throughout Greece for a year"}, {"es": "Solo a los atletas vencedores", "en": "Only the winning athletes"}, {"es": "Las fronteras de cada polis", "en": "The borders of each polis"}], "x": {"es": "Duraba al principio un mes y después tres, para que pudieran llegar los griegos de ultramar.", "en": "At first it lasted a month and later three, so that Greeks from overseas could arrive."}}, "fic": "H3·32"}], "epi": [{"year": {"es": "Siglos IV-III a. C.", "en": "4th-3rd centuries BC"}, "era": "hell", "fic": "H3·79", "items": [["note", {"es": "Desde finales del siglo V function visitNode(N) {

}

// ---------- carreras: estadio de muchachos, Hereos, díaulos y hoplitas ----------
const RACES = {
  boys: { dist: 192, turn: false, mul: 1.1, label: 'raceBoys', honor: 'boys' },
  heraia: { dist: 160, turn: false, mul: .95, label: 'raceHeraia', honor: 'heraia', female: true },
  diaulos: { dist: 384, turn: true, mul: 2.2, label: 'raceDiaulos', honor: 'diaulos' },
  hoplite: { dist: 384, turn: true, mul: 2.42, label: 'raceHoplite', honor: 'hoplite', shield: true, slow: .9 },

function startRace(kind, next) {
  const RC = RACES[kind];
  career.scene = null;
  newAgon(camp.pool);
  agon.solo = { kind, ...RC };
  // los rivales de la prueba: tiempos según la distancia
  agon.rivals.forEach((r, i) => { r.run = +(r.run * RC.mul * (kind === 'boys' ? 1 : 1) * rnd(.99, 1.03)).toFixed(2); if (RC.female) { r.name = r.short = ['Α', 'Β', 'Γ'][i]; } });

    const won = place === 1;
    if (won) addHonor(RC.honor);
    const U = KU(), items = [card1(won ? U.raceWon : fmt(U.racePlace, { n: place }), won ? (kind === 'boys' ? U.prizeCup : kind === 'heraia' ? U.prizeOlive : U[RC.label]) : U[RC.label])];
    state = 'cTalk'; agon = null; career.scene = kind === 'boys' ? 'polis' : 'olympia'; runTalk(items, next);
  };

}
function careerRaceDone() {
  const t = J && J.time != null ? J.time : 999, place = 1 + agon.rivals.filter(r => r.run < t).length;
  const f = career.onRace; career.onRace = null; f(place);

function athletePortrait(cx, cy, r) {
  const u = r / 100;

  ctx.fillStyle = C.barroClaro; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, r - 3, 0, Math.PI * 2); ctx.clip();
  ctx.translate(cx, cy); ctx.scale(u, u);
  ctx.fillStyle = C.negro;
  // hombros y cuello
  ctx.beginPath(); ctx.moveTo(-105, 105); ctx.bezierCurveTo(-95, 52, -52, 40, -22, 34); ctx.lineTo(24, 34); ctx.bezierCurveTo(58, 40, 96, 52, 105, 105); ctx.closePath(); ctx.fill();
  ctx.fillRect(-16, 10, 38, 34);
  // cabeza de perfil mirando a la derecha: cráneo, nariz y mentón
  ctx.beginPath(); ctx.ellipse(0, -10, 37, 44, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(30, -14); ctx.lineTo(51, 6); ctx.lineTo(33, 12); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.ellipse(27, 28, 13, 11, 0, 0, Math.PI * 2); ctx.fill();
  // detalles incisos en el color del barro
  ctx.strokeStyle = C.barroClaro; ctx.fillStyle = C.barroClaro; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.ellipse(19, -6, 5.5, 3, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(-14, 2, 8, -1.2, 1.4); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(22, 20); ctx.quadraticCurveTo(32, 23, 38, 19); ctx.stroke();
  for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.moveTo(-34 + i * 7, -34 + i * 2); ctx.quadraticCurveTo(-26 + i * 7, -22, -30 + i * 7, -10); ctx.stroke(); }
  // corona de olivo: hojas a lo largo del arco que cruza la frente y la nuca
  ctx.fillStyle = C.blanco; ctx.strokeStyle = C.negro; ctx.lineWidth = 1.4;
  for (let i = 0; i < 13; i++) {
    const a = Math.PI * (.82 + i * (1.26 / 12)), px = Math.cos(a) * 41, py = -12 + Math.sin(a) * 47;
    ctx.save(); ctx.translate(px, py); ctx.rotate(a + Math.PI / 2 + (i % 2 ? .35 : -.35)); ctx.beginPath(); ctx.ellipse(0, 0, 11, 3.8, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); ctx.restore();
  }
  ctx.fillStyle = C.negro; for (const a of [1.12, 1.55, 1.95]) { ctx.beginPath(); ctx.arc(Math.cos(Math.PI * a) * 41, -12 + Math.sin(Math.PI * a) * 47 - 4, 2.4, 0, Math.PI * 2); ctx.fill(); }
  ctx.restore();
  ctx.strokeStyle = C.negro; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = C.blanco; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, r - 9, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

function update(dt) {
  timeT += dt;
  camShake.v += (-camShake.x * 900 - camShake.v * 22) * dt; camShake.x += camShake.v * dt;
  if (cheer > 0) cheer -= dt * .5;
  if (flash > 0) flash -= dt * .8;
  for (const d of dust) { d.vy -= 6 * dt; d.x += d.vx * dt; d.y = Math.max(0, d.y + d.vy * dt); d.life -= dt; }
  dust = dust.filter(d => d.life > 0);
  if (hit > 0) { hit -= dt; return; }
  stateT += dt;
  if (CAMP_STATES.includes(state)) campUpdate(dt);
  if (state === 'play') {
    E[ev].update(dt, dt * E[ev].slow());
    const k = camK >= 1 ? 1 : 1 - Math.pow(camK, dt);
    camX += (camTarget - camX) * k;
  }
  if (state === 'play' || state === 'result') {
    Z += (zoomT - Z) * (1 - Math.pow(camK < .001 ? .002 : .05, dt)); S = TUNING.S * Z;
  }
}
function draw() {
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, OX * scale * dpr, 0);
  ctx.save();
  if (!reduced) ctx.translate(0, camShake.x * .02);
  drawBackground();
