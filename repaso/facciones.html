<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Del clan a la arena · Historia del Deporte</title>
<link rel="icon" href="../icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&display=swap" rel="stylesheet">
<style>
@font-face{font-family:Carlito;src:url(../fonts/Carlito-Regular.woff2) format("woff2");font-weight:400}
@font-face{font-family:Carlito;src:url(../fonts/Carlito-Bold.woff2) format("woff2");font-weight:700}
:root{--bg:#07102a;--bg2:#0d1f4a;--azul:#004379;--oro:#EDAB00;--oro2:#FBC93D;--txt:#f4f1e8;--mut:#9fb0cf;--card:rgba(255,255,255,.06);--line:rgba(237,171,0,.35)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(ellipse at 50% -10%,#1b3a7a 0%,var(--bg2) 35%,var(--bg) 75%);color:var(--txt);font-family:Calibri,Carlito,"Segoe UI",sans-serif;font-size:2.1vh;user-select:none}
body:before{content:"";position:fixed;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9vw,rgba(237,171,0,.025) 9vw 9.1vw);pointer-events:none}
.cz{font-family:Cinzel,"Trajan Pro",Georgia,serif;letter-spacing:.04em}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#top{height:7vh;display:flex;align-items:center;justify-content:space-between;padding:0 2.5vw;border-bottom:1px solid var(--line);background:rgba(0,0,0,.25)}
#top .rnd{font-size:2.6vh;color:var(--oro)}
#top .sub{color:var(--mut);font-size:2vh;margin-left:1.2vw}
#top img{height:4.6vh;vertical-align:middle;margin-right:1vw}
#pips{display:flex;gap:.6vw}
.pip{width:1.4vh;height:1.4vh;border-radius:50%;border:2px solid var(--oro);opacity:.5}
.pip.on{background:var(--oro);opacity:1}.pip.done{background:var(--oro);opacity:.45}
#stage{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5vh 4vw;overflow:hidden}
#board{display:flex;gap:1vw;padding:1.2vh 2vw 1.6vh;justify-content:center;background:linear-gradient(0deg,rgba(0,0,0,.45),rgba(0,0,0,.1));border-top:1px solid var(--line)}
.fac{position:relative;flex:1;max-width:16vw;border-radius:1.2vh;padding:.9vh 1vw;display:flex;align-items:center;gap:.8vw;background:var(--card);border:2px solid rgba(255,255,255,.12);cursor:pointer;transition:transform .15s,border-color .2s,background .2s}
.fac:hover{transform:translateY(-3px)}
.fac.can{border-style:dashed;border-color:rgba(237,171,0,.55)}
.fac.got{background:rgba(237,171,0,.22);border:2px solid var(--oro);border-style:solid}
.fac .em{font-size:4.2vh;line-height:1}
.fac .nm{font-weight:700;font-size:2vh;line-height:1.1}
.fac .sc{font-family:Cinzel,Georgia,serif;font-weight:900;font-size:3.4vh;color:var(--oro2)}
.fac .bar{position:absolute;left:0;top:0;bottom:0;width:.6vw;border-radius:1.2vh 0 0 1.2vh}
.fac .combo{position:absolute;top:-1.6vh;right:.6vw;background:var(--oro);color:#1a1200;font-weight:700;font-size:1.6vh;padding:.1vh .6vw;border-radius:2vh;display:none}
.fac .combo.on{display:block;animation:pop .4s}
.fac .adj{position:absolute;right:.4vw;bottom:.3vh;display:none;gap:.3vw}
.fac:hover .adj{display:flex}
.adj b{font-size:1.4vh;background:rgba(255,255,255,.15);padding:0 .4vw;border-radius:.6vh}
.fly{position:absolute;left:50%;top:-1vh;transform:translateX(-50%);font-family:Cinzel,serif;font-weight:900;color:var(--oro2);font-size:3.2vh;pointer-events:none;animation:fly 1.1s forwards;text-shadow:0 0 1vh rgba(0,0,0,.8)}
@keyframes fly{0%{opacity:0;transform:translate(-50%,0) scale(.6)}20%{opacity:1;transform:translate(-50%,-2vh) scale(1.2)}100%{opacity:0;transform:translate(-50%,-8vh) scale(1)}}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(3vh)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{box-shadow:0 0 0 rgba(237,171,0,0)}50%{box-shadow:0 0 4vh rgba(237,171,0,.55)}}
.rise{animation:rise .55s both}
h1.big{font-size:9vh;font-weight:900;color:var(--oro);text-align:center;line-height:1.05;text-shadow:0 .6vh 3vh rgba(0,0,0,.6)}
h2.big{font-size:5vh;font-weight:800;text-align:center;line-height:1.15}
.kicker{color:var(--mut);text-transform:uppercase;letter-spacing:.3em;font-size:1.9vh;margin-bottom:1.5vh;text-align:center}
.lead{font-size:3vh;max-width:70vw;text-align:center;line-height:1.35;color:#e9e4d6}
.q{font-size:4.2vh;font-weight:700;text-align:center;max-width:80vw;line-height:1.25;margin-bottom:3vh}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:1.6vh 1.6vw;width:min(86vw,150vh)}
.opt{display:flex;align-items:center;gap:1.2vw;padding:2vh 1.6vw;border-radius:1.4vh;background:var(--card);border:2px solid rgba(255,255,255,.14);font-size:3vh;line-height:1.2;min-height:11vh;transition:all .35s}
.opt .k{flex:none;width:6vh;height:6vh;border-radius:1vh;display:flex;align-items:center;justify-content:center;font-family:Cinzel,serif;font-weight:900;font-size:3.4vh;color:#06122b}
.k0{background:#EDAB00}.k1{background:#5aa3e6}.k2{background:#f2efe6}.k3{background:#b49ae8}.k4{background:#7fd3e0}
.opt.ok{background:rgba(237,171,0,.25);border-color:var(--oro);transform:scale(1.03);animation:glow 1.6s 2}
.opt.no{opacity:.28}
.opt .tick{margin-left:auto;font-size:4vh;color:var(--oro)}
.explain{margin-top:2.6vh;max-width:78vw;font-size:2.6vh;line-height:1.4;color:#e8e1cf;background:rgba(0,67,121,.35);border-left:.5vw solid var(--oro);padding:1.6vh 1.6vw;border-radius:.8vh}
.explain b{color:var(--oro2)}
#timer{position:absolute;top:1.6vh;right:2.5vw;width:12vh;height:12vh;display:none}
#timer svg{width:100%;height:100%;transform:rotate(-90deg)}
#timer .n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:Cinzel,serif;font-weight:900;font-size:5vh}
#timer.low .n{color:var(--oro);animation:pop .5s infinite}
.tf{display:flex;gap:4vw;margin-top:2vh}
.tfb{width:30vh;height:16vh;border-radius:2vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Cinzel,serif;font-weight:900;font-size:4.4vh;border:3px solid rgba(255,255,255,.2);background:var(--card);transition:all .4s}
.tfb small{font-family:Calibri,Carlito,sans-serif;font-size:2vh;font-weight:400;color:var(--mut);margin-top:.5vh}
.tfb.ok{border-color:var(--oro);background:rgba(237,171,0,.25);transform:scale(1.08);animation:glow 1.6s 2}
.tfb.no{opacity:.25}
.claim{font-size:4vh;font-weight:700;text-align:center;max-width:78vw;line-height:1.3}
/* yacimiento */
.dig{position:relative;display:inline-block;border-radius:1vh;overflow:hidden;box-shadow:0 2vh 6vh rgba(0,0,0,.6);border:3px solid var(--line)}
.dig img{display:block;max-height:56vh;max-width:74vw;min-width:40vh;min-height:30vh;object-fit:contain;background:#000}
.grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(4,1fr)}
.tile{background:linear-gradient(135deg,#6b4f2a,#8a6a3a 40%,#5a4122);border:1px solid rgba(0,0,0,.35);box-shadow:inset 0 0 1.5vh rgba(0,0,0,.45);transition:opacity .5s,transform .5s;cursor:pointer;display:flex;align-items:center;justify-content:center;color:rgba(0,0,0,.25);font-size:2.5vh}
.tile.off{opacity:0;transform:scale(.6) rotate(8deg);pointer-events:none}
.digrow{display:flex;gap:3vw;align-items:center}
.val{text-align:center}
.val .n{font-family:Cinzel,serif;font-weight:900;font-size:9vh;color:var(--oro2);line-height:1}
.val .l{color:var(--mut);font-size:2vh;text-transform:uppercase;letter-spacing:.2em}
.cap{margin-top:2vh;font-size:3.4vh;font-weight:700;text-align:center;color:var(--oro2);max-width:80vw}
.small{color:var(--mut);font-size:2.1vh;margin-top:1.4vh;text-align:center}
/* carrera */
.race{width:min(86vw,150vh);margin-top:2.4vh}
.lane{position:relative;height:5.2vh;border-bottom:1px dashed rgba(237,171,0,.25);background:linear-gradient(90deg,rgba(194,160,96,.08),rgba(194,160,96,.18))}
.lane .tok{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:4vh;transition:left 1.2s cubic-bezier(.3,1.4,.5,1)}
.lane .lb{position:absolute;left:.6vw;top:50%;transform:translateY(-50%);font-size:1.6vh;color:var(--mut)}
.mojon{position:absolute;top:0;bottom:0;width:3px;background:rgba(237,171,0,.5)}
.meta{position:absolute;right:0;top:0;bottom:0;width:.8vh;background:repeating-linear-gradient(0deg,#fff 0 .8vh,#000 .8vh 1.6vh)}
/* emparejar / ordenar */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:3vw;width:min(88vw,160vh)}
.it{display:flex;gap:1vw;align-items:center;padding:1.4vh 1.2vw;margin-bottom:1.2vh;border-radius:1.2vh;background:var(--card);border:2px solid rgba(255,255,255,.12);font-size:2.7vh;line-height:1.25;animation:rise .5s both}
.it .k{flex:none;width:5vh;height:5vh;border-radius:.9vh;display:flex;align-items:center;justify-content:center;font-family:Cinzel,serif;font-weight:900;font-size:2.8vh;color:#06122b;background:var(--oro)}
.it .k.n{background:#5aa3e6}
.it .date{margin-left:auto;color:var(--oro2);font-weight:700;white-space:nowrap;padding-left:1vw}
.it .tag{font-size:1.7vh;background:var(--azul);color:#fff;border-radius:.6vh;padding:.2vh .6vw;margin-left:.6vw}
.it.okk{border-color:var(--oro);background:rgba(237,171,0,.16)}
.list{width:min(80vw,140vh)}
.quote{font-size:3.4vh;font-style:italic;text-align:center;max-width:76vw;line-height:1.35;margin-bottom:2.4vh;color:#f5e9c8}
.quote:before{content:"“";font-family:Cinzel,serif;color:var(--oro);font-size:7vh;line-height:0;vertical-align:-2.4vh;margin-right:.6vw}
.flash img{max-height:44vh;max-width:70vw;border-radius:1vh;border:3px solid var(--line);transition:filter .8s}
.flash.hide img{filter:blur(3vh) brightness(.35)}
/* intro ronda */
.size{display:flex;gap:1.2vw;margin:3vh 0 2vh;justify-content:center}
.pp{font-size:7vh;animation:pop .5s both}
.chip{display:inline-block;background:var(--azul);border:1px solid var(--oro);color:#fff;border-radius:3vh;padding:.6vh 1.6vw;font-size:2.4vh;margin:0 .4vw}
.rules{margin-top:2.6vh;display:flex;gap:2vw;justify-content:center;flex-wrap:wrap;max-width:84vw}
.rule{background:var(--card);border:1px solid var(--line);border-radius:1.2vh;padding:1.4vh 1.4vw;font-size:2.3vh;max-width:26vw;line-height:1.3}
.rule b{color:var(--oro2);display:block;font-family:Cinzel,serif;font-size:2.2vh;margin-bottom:.5vh}
/* setup */
#setup{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 0%,#1b3a7a,var(--bg) 70%)}
.panel{width:min(92vw,130vh);text-align:center}
.panel img{height:13vh;margin-bottom:1vh}
.row{display:flex;gap:1vw;justify-content:center;margin:1.4vh 0;flex-wrap:wrap;align-items:center}
.btn{font-family:inherit;font-size:2.4vh;padding:1.2vh 1.8vw;border-radius:1vh;border:2px solid var(--line);background:var(--card);color:var(--txt);cursor:pointer}
.btn.on{background:var(--oro);color:#1a1200;border-color:var(--oro);font-weight:700}
.btn.go{font-family:Cinzel,serif;font-weight:900;font-size:3.4vh;padding:1.8vh 4vw;background:var(--oro);color:#1a1200;border:none;margin-top:2vh;animation:glow 2s infinite}
.fin{display:flex;align-items:center;gap:.4vw;background:var(--card);border:1px solid rgba(255,255,255,.15);border-radius:1vh;padding:.6vh .8vw}
.fin input{width:12vw;font-family:inherit;font-size:2.2vh;background:transparent;border:none;color:var(--txt);border-bottom:1px solid var(--line);outline:none}
.lab{color:var(--mut);font-size:1.9vh;text-transform:uppercase;letter-spacing:.2em;margin-top:2vh}
#help{position:fixed;right:1vw;bottom:.4vh;font-size:1.4vh;color:rgba(255,255,255,.35);z-index:5}
#nextb{position:fixed;right:2vw;bottom:13vh;z-index:6;font-family:Cinzel,serif;font-weight:900;font-size:2.4vh;padding:1.2vh 1.6vw;border-radius:1vh;border:2px solid var(--oro);background:rgba(0,0,0,.5);color:var(--oro);cursor:pointer}
/* podio */
.podium{display:flex;align-items:flex-end;gap:2vw;margin-top:3vh}
.pod{width:20vw;text-align:center;animation:rise .9s both}
.pod .blk{border-radius:1.4vh 1.4vh 0 0;background:linear-gradient(180deg,var(--oro),#a87a00);display:flex;align-items:flex-start;justify-content:center;padding-top:1.4vh;font-family:Cinzel,serif;font-weight:900;font-size:7vh;color:#2a1d00}
.pod.p2 .blk{background:linear-gradient(180deg,#d8dde6,#8b95a5)}.pod.p3 .blk{background:linear-gradient(180deg,#c98b4f,#7b4f25)}
.pod .em{font-size:9vh}.pod .nm{font-size:3vh;font-weight:700}.pod .sc{font-family:Cinzel,serif;font-size:4vh;color:var(--oro2);font-weight:900}
.laurel{font-size:5vh;display:block;animation:pop .8s 1s both}
canvas#conf{position:fixed;inset:0;pointer-events:none;z-index:30}
.hidden{display:none!important}
.stand{font-size:2.8vh;text-align:center;margin-top:1vh;color:var(--oro2)}
.fingers{display:flex;gap:2vw;justify-content:center;margin-top:1.4vh;color:var(--mut);font-size:2vh}
</style>
</head>
<body>
<div id="setup">
 <div class="panel rise">
  <img src="../icons/emblema_oro.png" alt="">
  <div class="kicker" id="s_k">Historia del Deporte · Repaso</div>
  <h1 class="big cz" id="s_t">Del clan a la arena</h1>
  <div class="lab" id="s_l1">Idioma</div>
  <div class="row" id="langs"><button class="btn on" data-l="es">Castellano</button><button class="btn" data-l="en">English</button></div>
  <div class="lab" id="s_l2">Facciones</div>
  <div class="row" id="nfac"></div>
  <div class="row" id="fnames"></div>
  <div class="lab" id="s_l3">Duración</div>
  <div class="row" id="durs"><button class="btn" data-d="40">40 min</button><button class="btn on" data-d="50">50 min</button><button class="btn" data-d="60">60 min</button></div>
  <button class="btn go" id="go">¡Que empiecen los juegos!</button>
  <div class="small" id="s_h">Espacio o → avanza · 1-6 puntúa a cada facción · P pausa · S sonido · F pantalla completa</div>
 </div>
</div>
<div id="app" class="hidden">
 <div id="top"><div><img src="../icons/emblema_oro.png" alt=""><span class="rnd cz" id="rnd"></span><span class="sub" id="sub"></span></div><div id="pips"></div></div>
 <div id="stage"></div>
 <div id="timer"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" stroke="rgba(255,255,255,.12)" stroke-width="8" fill="none"/><circle id="tc" cx="50" cy="50" r="44" stroke="#EDAB00" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="0"/></svg><div class="n" id="tn"></div></div>
 <div id="board"></div>
</div>
<button id="nextb" class="hidden">▶</button>
<canvas id="conf"></canvas>
<div id="help"></div>
<script>
const D={"t1cards":[{"img":"img/t1/cartel_amsterdam_1928.jpg","caption":{"es":"Cartel de los JJ. OO. de Ámsterdam, 1928","en":"Poster of the Amsterdam Olympic Games, 1928"},"claim":{"es":"En estos Juegos se disputó por primera vez el 800 m lisos femenino.","en":"These Games saw the first ever women's 800 m race."},"answer":true,"explain":{"es":"Ámsterdam 1928 acogió la primera final olímpica de 800 m femeninos. Todas las atletas terminaron y se batió el récord mundial, si bien las crónicas sobre desmayos sirvieron para vetar las pruebas femeninas de más de 200 m hasta Roma 1960.","en":"Amsterdam 1928 hosted the first Olympic women's 800 m final. Every athlete finished and a world record was set, although press stories about fainting were used to ban women's events over 200 m until Rome 1960."}},{"img":"img/t1/switzer_boston_1967.jpg","caption":{"es":"Maratón de Boston, 1967","en":"Boston Marathon, 1967"},"claim":{"es":"La corredora de la imagen fue la primera mujer en terminar el maratón de Boston.","en":"The runner in the picture was the first woman to finish the Boston Marathon."},"answer":false,"explain":{"es":"Es Kathrine Switzer, que corrió con dorsal en 1967 y fue famosa porque un organizador intentó expulsarla de la carrera. Bobbi Gibb ya lo había terminado en 1966, escondida entre unos arbustos hasta la salida.","en":"This is Kathrine Switzer, who ran with a bib in 1967 and became famous when an official tried to drag her off the course. Bobbi Gibb had already finished it in 1966, having hidden in the bushes before the start."}},{"img":"img/t1/dita_pekin_2008.jpg","caption":{"es":"Maratón olímpico, Pekín 2008","en":"Olympic marathon, Beijing 2008"},"claim":{"es":"Esta atleta ganó el maratón olímpico con 38 años.","en":"This athlete won the Olympic marathon at the age of 38."},"answer":true,"explain":{"es":"Constantina Dita-Tomescu venció en Pekín con 2 h 26 min. Comparado con las 4 h 20 min de Switzer en 1967, el dato muestra cuánto cambió el maratón femenino en cuatro décadas.","en":"Constantina Dita-Tomescu won in Beijing in 2 h 26 min. Compared with Switzer's 4 h 20 min in 1967, the figure shows how much women's marathon running changed in four decades."}},{"img":"img/t1/report_amsterdam_1928.jpg","caption":{"es":"Informe oficial de los JJ. OO. de 1928","en":"Official Report of the 1928 Olympic Games"},"claim":{"es":"Este informe es una fuente indirecta.","en":"This report is an indirect source."},"answer":false,"explain":{"es":"Es una fuente directa, porque fue producida por el propio Comité con la intención de registrar lo sucedido. Por su temporalidad es además una fuente primaria.","en":"It is a direct source, since the Committee produced it with the intention of recording what happened. In terms of timing it is also a primary source."}},{"img":"img/t1/tumba_augures.jpg","caption":{"es":"Tumba de los Augures, Tarquinia, h. 530-520 a. C.","en":"Tomb of the Augurs, Tarquinia, c. 530-520 BC"},"claim":{"es":"Esta pintura etrusca es un ejemplo de fuente indirecta.","en":"This Etruscan painting is an example of an indirect source."},"answer":true,"explain":{"es":"La pintura funeraria no se hizo para registrar la historia, de modo que el historiador tiene que interpretarla. Muestra a un hombre corriendo o bailando en la necrópolis de Monterozzi.","en":"The tomb painting was not made to record history, so the historian has to interpret it. It shows a man running or dancing, in the Monterozzi necropolis."}},{"img":"img/t1/jirafa_rekhmire.jpg","caption":{"es":"Tumba de Rekhmire, Egipto, h. 1500 a. C.","en":"Tomb of Rekhmire, Egypt, c. 1500 BC"},"claim":{"es":"Esta pintura egipcia es una fuente secundaria.","en":"This Egyptian painting is a secondary source."},"answer":false,"explain":{"es":"Fue producida por la propia sociedad estudiada, de modo que es una fuente primaria. Según su intención es indirecta, porque no se pintó para registrar la historia.","en":"It was produced by the society under study, so it is a primary source. By intention it is indirect, because it was not painted to record history."}},{"img":"img/t1/libro_juegos_alfonso_x.jpg","caption":{"es":"Libro de los Juegos de Alfonso X, 1283","en":"Book of Games of Alfonso X, 1283"},"claim":{"es":"Es una fuente primaria para el estudio de los juegos medievales.","en":"It is a primary source for the study of medieval games."},"answer":true,"explain":{"es":"El manuscrito fue elaborado en la Castilla del siglo XIII, la misma sociedad que describe. Por eso es primaria, frente a un libro actual sobre el mismo tema, que sería secundaria.","en":"The manuscript was made in thirteenth-century Castile, the same society it describes. That makes it primary, unlike a present-day book on the same topic, which would be secondary."}},{"img":"img/t1/salvador_deporte_occidente.jpg","caption":{"es":"Salvador, J. L. (2004). El deporte en Occidente","en":"Salvador, J. L. (2004). El deporte en Occidente"},"claim":{"es":"Este libro es una fuente primaria.","en":"This book is a primary source."},"answer":false,"explain":{"es":"Se escribió en 2004 sobre épocas muy anteriores, por lo que es una fuente secundaria. Procede de la tesis doctoral de José Luis Salvador y es uno de los compendios más completos en castellano.","en":"It was written in 2004 about much earlier periods, so it is a secondary source. It grew out of José Luis Salvador's doctoral thesis and is one of the most complete surveys in Spanish."}},{"img":"img/t1/tablilla_sumeria.jpg","caption":{"es":"Tablilla sumeria con escritura cuneiforme","en":"Sumerian tablet with cuneiform writing"},"claim":{"es":"La aparición de la escritura marca el paso de la Prehistoria a la Historia.","en":"The appearance of writing marks the passage from Prehistory to History."},"answer":true,"explain":{"es":"La escritura surge en Sumeria a finales del IV milenio a. C. A partir de ahí se abren los cuatro grandes periodos: Edad Antigua, Media, Moderna y Contemporánea.","en":"Writing appears in Sumer at the end of the fourth millennium BC. From then on the four great periods begin: Ancient, Medieval, Modern and Contemporary."}},{"img":"img/t1/moais.jpg","caption":{"es":"Moais, Isla de Pascua, entre 700 y 1600 d. C.","en":"Moai, Easter Island, between 700 and 1600 AD"},"claim":{"es":"La ciencia auxiliar que estudia estos restos es la numismática.","en":"The auxiliary science that studies these remains is numismatics."},"answer":false,"explain":{"es":"Es la arqueología, que investiga las culturas pasadas a través de restos materiales. La numismática estudia monedas y medallas, como el real de a ocho que aparece en la misma diapositiva.","en":"It is archaeology, which investigates past cultures through material remains. Numismatics studies coins and medals, such as the Spanish piece of eight shown on the same slide."}},{"img":"img/t1/moai_excavado.jpg","caption":{"es":"Moai excavado, Isla de Pascua","en":"Excavated moai, Easter Island"},"claim":{"es":"La epigrafía es la ciencia que trabaja con este tipo de restos materiales.","en":"Epigraphy is the science that works with this kind of material remains."},"answer":false,"explain":{"es":"La epigrafía estudia inscripciones sobre materiales duraderos. Las estatuas, edificaciones y artefactos son campo de la arqueología.","en":"Epigraphy studies inscriptions on durable materials. Statues, buildings and artefacts belong to archaeology."}},{"img":"img/t1/homo_ludens.jpg","caption":{"es":"Huizinga, J. Homo ludens","en":"Huizinga, J. Homo ludens"},"claim":{"es":"Para Huizinga, el juego es anterior a la cultura.","en":"For Huizinga, play is older than culture."},"answer":true,"explain":{"es":"Huizinga sostiene que la sociedad nace jugando. El juego se desarrolla dentro de un círculo mágico, un recinto con reglas propias que fuera no valdrían.","en":"Huizinga holds that society is born through play. Play unfolds inside a magic circle, a space with its own rules that would not apply outside it."}},{"img":"img/t1/elias_dunning.jpg","caption":{"es":"Elias, N. y Dunning, E. Deporte y ocio en el proceso de la civilización","en":"Elias, N. & Dunning, E. Quest for Excitement"},"claim":{"es":"Para Elias y Dunning el impulso deportivo es un producto de la sociedad.","en":"For Elias and Dunning the sporting impulse is a product of society."},"answer":true,"explain":{"es":"Justo al revés que Huizinga. A medida que las sociedades europeas rebajaron su tolerancia a la violencia, el deporte se convirtió en un descontrol controlado de las emociones.","en":"The opposite of Huizinga. As European societies lowered their tolerance of violence, sport became a controlled de-controlling of emotions."}},{"img":"img/t1/guttmann_ritual_record.jpg","caption":{"es":"Guttmann, A. (1978). From Ritual to Record","en":"Guttmann, A. (1978). From Ritual to Record"},"claim":{"es":"En esta obra se proponen las tres culturas corporales.","en":"This book proposes the three body cultures."},"answer":false,"explain":{"es":"Guttmann propone los siete rasgos del deporte moderno: secularismo, igualdad, especialización, racionalización, burocratización, cuantificación y récord. Las tres culturas corporales son de Eichberg.","en":"Guttmann proposes the seven characteristics of modern sport: secularism, equality, specialisation, rationalisation, bureaucratisation, quantification and the record. The three body cultures belong to Eichberg."}},{"img":"img/t1/eichberg_body_cultures.jpg","caption":{"es":"Eichberg, H. (1998). Body Cultures","en":"Eichberg, H. (1998). Body Cultures"},"claim":{"es":"Eichberg sostiene que los siete rasgos de Guttmann describen bien la cultura del rendimiento y no ven las otras dos.","en":"Eichberg argues that Guttmann's seven characteristics describe achievement culture well and miss the other two."},"answer":true,"explain":{"es":"Las tres culturas corporales son rendimiento, disciplina y forma física, y fiesta popular. Las tres conviven en cualquier sociedad, y medir el pasado solo con los siete rasgos lo describe siempre por lo que le falta.","en":"The three body cultures are achievement, discipline and fitness, and popular festivity. All three coexist in any society, and measuring the past only with the seven characteristics always describes it by what it lacks."}},{"img":"img/t1/bipedestacion.jpg","caption":{"es":"Surgimiento de la bipedestación","en":"Emergence of bipedalism"},"claim":{"es":"La bipedestación se explica por una única causa adaptativa.","en":"Bipedalism is explained by a single adaptive cause."},"answer":false,"explain":{"es":"Fue un fenómeno multicausal en el que intervinieron varias ventajas adaptativas. Marca el inicio de la Humanidad.","en":"It was a multi-causal phenomenon in which several adaptive advantages played a part. It marks the beginning of humankind."}},{"img":"img/t1/danza_rupestre.jpg","caption":{"es":"Escena de danza en arte rupestre","en":"Dance scene in rock art"},"claim":{"es":"Diem y Popplow consideran la danza la primera expresión de la cultura física.","en":"Diem and Popplow regard dance as the first expression of physical culture."},"answer":true,"explain":{"es":"Es la teoría cultural (Alemania Occidental). Popplow distingue danzas de naturaleza erótica, mágica y guerrera, y sitúa el juego como subsuelo de todas ellas.","en":"This is the cultural theory (West Germany). Popplow distinguishes erotic, magical and warlike dances, and places play as the ground beneath all of them."}},{"img":"img/t1/piramide_maslow.jpg","caption":{"es":"Jerarquía de necesidades de Maslow","en":"Maslow's hierarchy of needs"},"claim":{"es":"Maslow dibujó esta pirámide en su artículo de 1943.","en":"Maslow drew this pyramid in his 1943 article."},"answer":false,"explain":{"es":"La jerarquía es de 1943, pero la representación piramidal se difundió con posterioridad. Sirve para ordenar las teorías sobre el origen del ejercicio, desde la supervivencia hasta lo lúdico.","en":"The hierarchy dates from 1943, but the pyramid diagram spread later. It helps to order the theories on the origin of exercise, from survival to play."}},{"img":"img/t1/blanchard_cheska.jpg","caption":{"es":"Blanchard, K. y Cheska, A. Antropología del deporte","en":"Blanchard, K. & Cheska, A. The Anthropology of Sport"},"claim":{"es":"Blanchard y Cheska aplicaron el método arqueológico al deporte primitivo.","en":"Blanchard and Cheska applied the archaeological method to primitive sport."},"answer":false,"explain":{"es":"Aplicaron el método antropológico: recopilaron en 1985 la información sobre pueblos sin escritura ni Estado para catalogar sus formas de deporte mediante analogía etnográfica.","en":"They applied the anthropological method: in 1985 they gathered the information on peoples without writing or a state to catalogue their forms of sport through ethnographic analogy."}},{"img":"img/t1/inuit_caza_foca.jpg","caption":{"es":"Caza tradicional inuit","en":"Traditional Inuit hunting"},"claim":{"es":"La analogía etnográfica informa de cómo vivía exactamente el hombre prehistórico.","en":"Ethnographic analogy tells us exactly how prehistoric humans lived."},"answer":false,"explain":{"es":"Informa de qué funciones puede desempeñar la actividad física en sociedades sin escritura ni Estado. De ahí salen ejes como la identidad social o la preparación para la supervivencia.","en":"It tells us what functions physical activity can perform in societies without writing or a state. From that come axes such as social identity or preparation for survival."}},{"img":"img/t1/inuit_arco.jpg","caption":{"es":"Arquero inuit","en":"Inuit archer"},"claim":{"es":"Los Juegos Esquimales son un caso de estudio del método antropológico.","en":"The Eskimo Games are a case study of the anthropological method."},"answer":true,"explain":{"es":"Los World Eskimo-Indian Olympics conservan pruebas ligadas a la supervivencia y a las tradiciones culturales, y permiten observar en vivo funciones que el registro arqueológico no muestra.","en":"The World Eskimo-Indian Olympics preserve events linked to survival and cultural tradition, and let us observe functions that the archaeological record does not show."}},{"img":"img/t1/bisonte_hueso.jpg","caption":{"es":"Bisonte tallado en hueso, Rusia, 22.000 a. C.","en":"Bison carved in bone, Russia, 22,000 BC"},"claim":{"es":"Se sabe con certeza que este objeto era un juguete.","en":"We know for certain that this object was a toy."},"answer":false,"explain":{"es":"Podría ser un juguete o un objeto votivo o mágico. El registro arqueológico prehistórico es escaso y los materiales admiten interpretaciones distintas según el historiador.","en":"It could be a toy or a votive or magical object. The prehistoric archaeological record is scarce and the materials allow different interpretations depending on the historian."}},{"img":"img/t1/canicas_orcadas.jpg","caption":{"es":"Bolas de piedra, Islas Orcadas","en":"Carved stone balls, Orkney"},"claim":{"es":"Estas bolas son del Paleolítico.","en":"These balls date from the Palaeolithic."},"answer":false,"explain":{"es":"Son del Neolítico tardío, hacia 3200-2500 a. C. Aparecen por toda Escocia y se han interpretado como canicas, proyectiles o representaciones de cuerpos celestes.","en":"They are Late Neolithic, c. 3200-2500 BC. They appear all over Scotland and have been read as marbles, projectiles or representations of celestial bodies."}},{"img":"img/t1/cueva_arana_miel.jpg","caption":{"es":"Cueva de la Araña, Bicorp (Valencia)","en":"Cueva de la Araña, Bicorp (Valencia)"},"claim":{"es":"La escena representa la recolección de miel.","en":"The scene shows honey gathering."},"answer":true,"explain":{"es":"Es arte rupestre levantino, con una cronología discutida, posiblemente entre el 10.000 y el 5.000 a. C. Muestra el rastro que dejó el trabajo del cuerpo.","en":"It is Levantine rock art, with a disputed chronology, possibly between 10,000 and 5,000 BC. It shows the trace left by the working body."}},{"img":"img/t1/barranco_gomez_miel.jpg","caption":{"es":"Abrigo del Barranco Gómez","en":"Barranco Gómez rock shelter"},"claim":{"es":"Este abrigo está en la provincia de Castellón.","en":"This rock shelter is in the province of Castellón."},"answer":false,"explain":{"es":"Está en Castellote (Teruel). Representa también una recolección de miel, dentro del arte rupestre levantino.","en":"It is in Castellote (Teruel). It also depicts honey gathering, within Levantine rock art."}},{"img":"img/t1/bumeran_oblazowa.jpg","caption":{"es":"Cueva de Obłazowa, Polonia","en":"Obłazowa Cave, Poland"},"claim":{"es":"Es el bumerán más antiguo conocido y está tallado en marfil de mamut.","en":"It is the oldest known boomerang and is carved from mammoth ivory."},"answer":true,"explain":{"es":"La pieza no pudo datarse directamente, de modo que se fechó el nivel en el que apareció, entre 40.300 y 37.300 a. C. (Talamo et al., 2025).","en":"The piece could not be dated directly, so the layer in which it appeared was dated, between 40,300 and 37,300 BC (Talamo et al., 2025)."}},{"img":"img/t1/valltorta_caza.jpg","caption":{"es":"Barranco de la Valltorta (Castellón)","en":"Valltorta gorge (Castellón)"},"claim":{"es":"Esta escena de caza pertenece al arte paleolítico franco-cantábrico.","en":"This hunting scene belongs to Franco-Cantabrian Palaeolithic art."},"answer":false,"explain":{"es":"Es arte rupestre levantino, con figuras humanas en movimiento y cronología discutida, posiblemente entre el 10.000 y el 5.000 a. C.","en":"It is Levantine rock art, with human figures in motion and a disputed chronology, possibly between 10,000 and 5,000 BC."}},{"img":"img/t1/cometa_desierto_1.jpg","caption":{"es":"Cometa del desierto, vista aérea","en":"Desert kite, aerial view"},"claim":{"es":"Las cometas del desierto eran estructuras defensivas frente a invasores.","en":"Desert kites were defensive structures against invaders."},"answer":false,"explain":{"es":"Son trampas de caza: dos muros largos convergentes que funcionan como un embudo para conducir a los animales a un recinto o foso.","en":"They are hunting traps: two long converging walls acting as a funnel to drive animals into an enclosure or pit."}},{"img":"img/t1/cometa_desierto_2.jpg","caption":{"es":"Cometas del desierto, IX-VIII milenio a. C.","en":"Desert kites, 9th-8th millennium BC"},"claim":{"es":"Hay más de 6.000 cometas catalogadas desde Arabia hasta Asia Central.","en":"More than 6,000 kites have been catalogued from Arabia to Central Asia."},"answer":true,"explain":{"es":"Su uso se extendió durante milenios. Las evidencias más antiguas de uso proceden del sureste de Jordania (Tarawneh et al., 2026).","en":"Their use lasted for millennia. The earliest evidence of use comes from south-eastern Jordan (Tarawneh et al., 2026)."}},{"img":"img/t1/femures_ruff.jpg","caption":{"es":"Huesos largos analizados por Ruff et al. (2015)","en":"Long bones analysed by Ruff et al. (2015)"},"claim":{"es":"La resistencia del fémur y la tibia cae a partir del Neolítico y deja de cambiar en época romana.","en":"Femur and tibia strength falls from the Neolithic onwards and stops changing in Roman times."},"answer":true,"explain":{"es":"El estudio de 1.842 esqueletos europeos muestra una caída que arranca entre el 5000 y el 2000 a. C. y se detiene en la Edad del Hierro y época romana, ligada a la adopción de la agricultura.","en":"The study of 1,842 European skeletons shows a decline starting between 5000 and 2000 BC and stopping in the Iron Age and Roman period, linked to the adoption of farming."}},{"img":"img/t1/mujer_neolitica_molino.jpg","caption":{"es":"Mujer neolítica moliendo grano","en":"Neolithic woman grinding grain"},"claim":{"es":"Las mujeres del Neolítico tenían húmeros más resistentes que las remeras de élite actuales.","en":"Neolithic women had stronger humeri than today's elite rowers."},"answer":true,"explain":{"es":"Macintosh et al. (2017) hallaron húmeros entre un 11 y un 16 % más resistentes que los de las remeras de Cambridge, que entrenaban dos veces al día.","en":"Macintosh et al. (2017) found humeri 11 to 16 % stronger than those of Cambridge rowers who trained twice a day."}},{"img":"img/t1/molino_de_mano.jpg","caption":{"es":"Molino de mano neolítico","en":"Neolithic hand mill"},"claim":{"es":"Este útil se asocia al trabajo manual femenino que explica la fuerza de los brazos en el Neolítico.","en":"This tool is linked to the female manual labour that explains arm strength in the Neolithic."},"answer":true,"explain":{"es":"Moler grano a mano durante horas es una de las tareas que Macintosh et al. relacionan con la rigidez del húmero en las mujeres agricultoras centroeuropeas.","en":"Grinding grain by hand for hours is one of the tasks Macintosh et al. link to humeral rigidity in Central European farming women."}},{"img":"img/t1/barranco_gomez_detalle.jpg","caption":{"es":"Recolección de miel. Abrigo del Barranco Gómez (Castellote, Teruel)","en":"Honey gathering. Barranco Gómez rock shelter (Castellote, Teruel)"},"claim":{"es":"Esta escena de arte rupestre levantino tiene una datación exacta y segura.","en":"This Levantine rock-art scene has an exact and secure date."},"answer":false,"explain":{"es":"Su cronología sigue discutida, posiblemente entre el 10.000 y el 5.000 a. C., igual que la del panel de la Cueva de la Araña, que muestra la misma actividad de subsistencia.","en":"Its chronology is still debated, possibly between 10,000 and 5,000 BC, like that of the Cueva de la Araña panel, which shows the same subsistence activity."}},{"img":"img/t1/bumeran_foto.jpg","caption":{"es":"Bumerán de marfil de mamut. Cueva de Obłazowa (Polonia)","en":"Mammoth-ivory boomerang. Obłazowa Cave (Poland)"},"claim":{"es":"La fecha de 40.300-37.300 a. C. se obtuvo datando directamente el bumerán.","en":"The date of 40,300-37,300 BC was obtained by dating the boomerang itself."},"answer":false,"explain":{"es":"La pieza no pudo datarse de forma directa, de modo que la fecha corresponde al estrato arqueológico en que apareció (Talamo et al., 2025). Aun así, es el bumerán más antiguo que se conoce.","en":"The piece could not be dated directly, so the date belongs to the archaeological layer in which it was found (Talamo et al., 2025). Even so, it is the oldest known boomerang."}},{"img":"img/t1/moai_ladera.jpg","caption":{"es":"Moái de la Isla de Pascua excavado hasta la base","en":"Easter Island moai excavated down to its base"},"claim":{"es":"Una estatua como esta es objeto de estudio de la arqueología, una de las ciencias auxiliares de la Historia.","en":"A statue like this is studied by archaeology, one of the auxiliary sciences of History."},"answer":true,"explain":{"es":"La arqueología interroga los restos materiales de sociedades que no dejaron textos sobre sí mismas y, junto a la numismática, la paleografía o la epigrafía, forma parte de las ciencias auxiliares de la Historia.","en":"Archaeology questions the material remains of societies that left no texts about themselves and, together with numismatics, palaeography and epigraphy, is one of the auxiliary sciences of History."}},{"img":"img/t1/report_800m_ganadoras.jpg","caption":{"es":"Report oficial de Ámsterdam 1928. Ganadoras de los 800 m","en":"Official report of Amsterdam 1928. Winners of the 800 m"},"claim":{"es":"La ganadora, Lina Radke, batió el récord del mundo.","en":"The winner, Lina Radke, set a world record."},"answer":true,"explain":{"es":"Las nueve atletas que tomaron la salida terminaron la carrera y Radke batió el récord mundial (Robinson, 2018). El desplome que repitieron durante décadas los manuales lo inventó la prensa de la época.","en":"All nine athletes who started finished the race and Radke set a world record (Robinson, 2018). The collapse repeated for decades in textbooks was invented by the press of the time."}},{"img":"img/t1/report_800m_resultados.jpg","caption":{"es":"Report oficial de Ámsterdam 1928. Resultados de la final de 800 m","en":"Official report of Amsterdam 1928. Results of the 800 m final"},"claim":{"es":"Varias corredoras abandonaron la final exhaustas antes de llegar a la meta.","en":"Several runners dropped out of the final exhausted before reaching the line."},"answer":false,"explain":{"es":"Nueve atletas tomaron la salida y las nueve terminaron. El bulo del desplome, difundido por cronistas como John Tunis, sirvió al COI para vetar las pruebas femeninas de más de 200 m hasta Roma 1960.","en":"Nine athletes started and all nine finished. The collapse hoax, spread by reporters such as John Tunis, was used by the IOC to ban women's events over 200 m until Rome 1960."}},{"img":"img/t1/utiles_pesca.jpg","caption":{"es":"Útiles de pesca prehistóricos. Nasa, arpones y anzuelos","en":"Prehistoric fishing tools. Fish trap, harpoons and hooks"},"claim":{"es":"Está demostrado que en la Prehistoria la caza era cosa de hombres y la pesca, del grupo entero.","en":"It is proven that in Prehistory hunting was for men and fishing for the whole group."},"answer":false,"explain":{"es":"Esa división se dio por supuesta durante décadas, pero no está probada para ninguna de las dos actividades. La investigación reciente documenta muchas más mujeres cazadoras de lo que suponía el modelo del «hombre cazador» (Anderson et al., 2023; Haas et al., 2020).","en":"That division was taken for granted for decades, but it is not proven for either activity. Recent research documents far more women hunters than the “man the hunter” model assumed (Anderson et al., 2023; Haas et al., 2020)."}},{"img":"img/t1/valltorta_calco.jpg","caption":{"es":"Uso del propulsor para lanzar la azagaya","en":"Using a spear-thrower to launch a dart"},"claim":{"es":"El propulsor y la azagaya forman parte de los útiles de caza prehistóricos.","en":"The spear-thrower and dart are among the prehistoric hunting tools."},"answer":true,"explain":{"es":"Junto al arco y la flecha, la jabalina, la honda y el bumerán, y a estrategias como la persecución, el acecho o la emboscada, sitúan en la Prehistoria un adiestramiento corporal ligado a la supervivencia.","en":"Together with the bow and arrow, the javelin, the sling and the boomerang, and strategies such as pursuit, stalking and ambush, they place in Prehistory a bodily training linked to survival."}},{"img":"img/t1/metodo_cientifico.jpg","caption":{"es":"El método científico aplicado a la Historia","en":"The scientific method applied to History"},"claim":{"es":"Para Carr, el método histórico consiste sobre todo en acumular datos verificados.","en":"For Carr, the historical method consists mainly of accumulating verified data."},"answer":false,"explain":{"es":"Carr lo resume en tres operaciones, conocer un hecho, interpretarlo dentro de una pregunta y elaborar con él una conclusión razonada (Carr, 1961/2010, p. 60), y corrige así a Ranke, que creía que los hechos hablan por sí solos.","en":"Carr sums it up in three operations, knowing a fact, interpreting it within a question and drawing a reasoned conclusion from it (Carr, 1961/2010, p. 60), thereby correcting Ranke, who believed that facts speak for themselves."}},{"img":"img/t1/revithi.jpg","caption":{"es":"Stamata Revithi, Atenas 1896","en":"Stamata Revithi, Athens 1896"},"claim":{"es":"Corrió el maratón olímpico y su tiempo quedó registrado de forma oficial.","en":"She ran the Olympic marathon and her time was officially recorded."},"answer":false,"explain":{"es":"Corrió casi todo el recorrido al día siguiente de la carrera masculina, pero no la dejaron entrar al estadio ni se registró su tiempo, de modo que quedó fuera del archivo oficial por decisión ajena.","en":"She ran almost the whole course the day after the men's race, but she was not allowed into the stadium and her time was not recorded, so she was left out of the official record by someone else's decision."}},{"img":"img/t1/greig.jpg","caption":{"es":"Dale Greig, 1964","en":"Dale Greig, 1964"},"claim":{"es":"Muchas organizaciones la consideran la primera mujer en completar un maratón con registro formal de tiempo.","en":"Many organisations regard her as the first woman to complete a marathon with a formally recorded time."},"answer":true,"explain":{"es":"Completó en 1964 el maratón de la Isla de Wight, en Inglaterra, en 3 h 27 min.","en":"In 1964 she completed the Isle of Wight marathon, in England, in 3 h 27 min."}},{"img":"img/t1/gibb.jpg","caption":{"es":"Bobbi Gibb, Boston 1966","en":"Bobbi Gibb, Boston 1966"},"claim":{"es":"Corrió el maratón de Boston con dorsal oficial.","en":"She ran the Boston Marathon with an official bib."},"answer":false,"explain":{"es":"La organización rechazó su inscripción alegando que las mujeres «no estaban fisiológicamente capacitadas» (Jutel, 2003). Corrió escondida entre los arbustos de la salida y sin dorsal, y terminó un año antes que Switzer.","en":"The organisers rejected her entry, claiming that women were “not physiologically able” (Jutel, 2003). She ran after hiding in the bushes at the start, without a bib, and finished a year before Switzer."}},{"img":"img/t1/documento_conservacion.jpg","caption":{"es":"Conservación de un documento antiguo","en":"Conservation of an old document"},"claim":{"es":"Una fuente primaria es la que elabora la propia sociedad que se investiga, en su propio tiempo.","en":"A primary source is one produced by the society under study, in its own time."},"answer":true,"explain":{"es":"La secundaria la interpreta después, a veces siglos más tarde. Este criterio atiende a la cercanía temporal, mientras que el de fuente directa o indirecta atiende a la intención de quien la produjo.","en":"A secondary source interprets it later, sometimes centuries afterwards. This criterion looks at closeness in time, whereas direct and indirect sources are distinguished by the intention of whoever produced them."}},{"img":"img/t1/libro_juegos_pagina.jpg","caption":{"es":"Libro de los juegos de Alfonso X el Sabio, 1283","en":"Alfonso X the Wise's Book of Games, 1283"},"claim":{"es":"Es una fuente secundaria sobre el ocio medieval.","en":"It is a secondary source on medieval leisure."},"answer":false,"explain":{"es":"Se terminó en Sevilla en 1283, en la misma época que documenta, así que es una fuente primaria. Es, además, el tratado europeo más antiguo dedicado al ajedrez.","en":"It was completed in Seville in 1283, in the very period it documents, so it is a primary source. It is also the oldest European treatise devoted to chess."}},{"img":"img/t1/prehistoria_historia.jpg","caption":{"es":"Prehistoria e Historia","en":"Prehistory and History"},"claim":{"es":"La periodización clásica toma la aparición de la escritura como frontera entre la Prehistoria y la Historia.","en":"Classical periodisation takes the appearance of writing as the boundary between Prehistory and History."},"answer":true,"explain":{"es":"Esa frontera se sitúa en Sumeria, a finales del IV milenio a. C., y es la que ilustra la tablilla sumeria con escritura cuneiforme.","en":"That boundary lies in Sumer, at the end of the 4th millennium BC, and it is illustrated by the Sumerian tablet with cuneiform writing."}},{"img":"img/t1/edades_historia.jpg","caption":{"es":"Las edades de la Historia","en":"The ages of History"},"claim":{"es":"Esta división en edades sirve igual para cualquier civilización del mundo.","en":"This division into ages works equally well for any civilisation in the world."},"answer":false,"explain":{"es":"Es una convención europea cómoda de manejar, aunque sus hitos pertenecen a la historia del Mediterráneo y dicen muy poco de sociedades que marchaban con su propio reloj, como China o la América precolombina.","en":"It is a convenient European convention, although its milestones belong to Mediterranean history and say very little about societies that kept their own time, such as China or pre-Columbian America."}},{"img":"img/t1/diacronico.jpg","caption":{"es":"Enfoque diacrónico","en":"Diachronic approach"},"claim":{"es":"El enfoque diacrónico congela un momento concreto y estudia sus conexiones internas.","en":"The diachronic approach freezes a particular moment and studies its internal connections."},"answer":false,"explain":{"es":"Eso es el enfoque sincrónico. El diacrónico sigue un fenómeno a lo largo del tiempo, por ejemplo cómo la lucha pasa del rito de iniciación al deporte reglado.","en":"That is the synchronic approach. The diachronic one follows a phenomenon over time, for example how wrestling moves from initiation rite to regulated sport."}},{"img":"img/t1/sincronico.jpg","caption":{"es":"Enfoque sincrónico","en":"Synchronic approach"},"claim":{"es":"Estudiar qué significaba el gimnasio en la Atenas del siglo V a. C. para su educación, su política y su religión es un análisis sincrónico.","en":"Studying what the gymnasium meant in 5th-century BC Athens for its education, politics and religion is a synchronic analysis."},"answer":true,"explain":{"es":"El enfoque sincrónico se detiene en un momento y analiza sus conexiones internas. Ninguna de las dos miradas basta por sí sola, y el historiador alterna entre ellas según lo que quiera comprender.","en":"The synchronic approach stops at one moment and analyses its internal connections. Neither view is enough on its own, and historians switch between them depending on what they want to understand."}},{"img":"img/t1/grabado_juego_pelota.jpg","caption":{"es":"Grabado antiguo de un juego de pelota con bate","en":"Old engraving of a bat-and-ball game"},"claim":{"es":"La historia de las actividades físicas estudia el deporte en sus relaciones con las culturas pasadas y contemporáneas.","en":"The history of physical activities studies sport in its relations with past and present cultures."},"answer":true,"explain":{"es":"Así la define la asignatura (Pérez y Verdes, 1998), de modo que el deporte se estudia como parte de la cultura de la sociedad que lo practica y no como una simple lista de hechos.","en":"That is how the course defines it (Pérez & Verdes, 1998), so sport is studied as part of the culture of the society that practises it and not as a mere list of events."}},{"img":"img/t1/rae_deporte.jpg","caption":{"es":"Definición de «deporte» en el Diccionario de la Real Academia Española","en":"Definition of “deporte” in the Spanish Royal Academy dictionary"},"claim":{"es":"El diccionario recoge también un sentido de deporte como recreación o pasatiempo, sin competición.","en":"The dictionary also records a sense of sport as recreation or pastime, without competition."},"answer":true,"explain":{"es":"La primera acepción habla de actividad física con competición, entrenamiento y normas, y la segunda, de recreación, pasatiempo o ejercicio al aire libre, la misma tensión que separa el enfoque cerrado del abierto.","en":"The first sense refers to physical activity with competition, training and rules, and the second to recreation, pastime or outdoor exercise, the same tension that separates the narrow and broad approaches."}},{"img":"img/t1/futbol_profesional.jpg","caption":{"es":"Partido de fútbol profesional","en":"Professional football match"},"claim":{"es":"Un partido profesional de fútbol encaja en el enfoque cerrado del deporte.","en":"A professional football match fits the narrow approach to sport."},"answer":true,"explain":{"es":"El enfoque cerrado entiende el deporte como actividad física reglada, competitiva e institucionalizada que busca el máximo rendimiento.","en":"The narrow approach understands sport as regulated, competitive and institutionalised physical activity that seeks maximum performance."}},{"img":"img/t1/ejercicio_mayores.jpg","caption":{"es":"Actividad física para personas mayores","en":"Physical activity for older adults"},"claim":{"es":"Para el enfoque cerrado, esta actividad es deporte.","en":"Under the narrow approach, this activity counts as sport."},"answer":false,"explain":{"es":"Solo cabe en el enfoque abierto de la Carta Europea del Deporte (Consejo de Europa, 1992), que incluye toda actividad, organizada o no, dirigida a la expresión o a la mejora física o psíquica.","en":"It only fits the broad approach of the European Sports Charter (Council of Europe, 1992), which includes any activity, organised or not, aimed at physical or mental expression or improvement."}},{"img":"img/t1/prehistoria_cuadro.jpg","caption":{"es":"Cuadro de las etapas de la Prehistoria","en":"Chart of the stages of Prehistory"},"claim":{"es":"La Prehistoria es la etapa más corta y mejor documentada de la historia humana.","en":"Prehistory is the shortest and best-documented stage of human history."},"answer":false,"explain":{"es":"Es, con enorme diferencia, la más larga y la peor documentada, porque carece de escritura y porque la madera, la fibra o la cuerda se conservan muy raramente (Kretchmar et al., 2017).","en":"It is by far the longest and the worst documented, because it has no writing and because wood, fibre and cord very rarely survive (Kretchmar et al., 2017)."}},{"img":"img/t1/caza_jabalina_rupestre.jpg","caption":{"es":"Escena de caza con lanza","en":"Hunting scene with a spear"},"claim":{"es":"Para Eichel, el lanzamiento de la jabalina está entre los ejercicios corporales más antiguos, de hace unos 70.000 años.","en":"For Eichel, javelin throwing is among the oldest bodily exercises, some 70,000 years old."},"answer":true,"explain":{"es":"Eichel sostiene que el ejercicio corporal nace del trabajo, de modo que al cazador le siguen el arpón del pescador y, hace unos 24.000 años, el arco (Betancor y Vilanou, 1995, p. 37).","en":"Eichel argues that bodily exercise arises from work, so the hunter is followed by the fisherman's harpoon and, some 24,000 years ago, by the bow (Betancor y Vilanou, 1995, p. 37)."}},{"img":"img/t1/mapa_inuit.jpg","caption":{"es":"Territorios inuit de América del Norte","en":"Inuit territories of North America"},"claim":{"es":"Los World Eskimo-Indian Olympics nacieron en 1961 para mantener vivas las prácticas corporales de estas comunidades.","en":"The World Eskimo-Indian Olympics were founded in 1961 to keep these communities' bodily practices alive."},"answer":true,"explain":{"es":"Los fundaron comunidades inuit de Alaska, Canadá y Groenlandia, con pruebas como la sogatira, la patada a un pie o la danza del tambor, frente a la homogeneización del deporte occidental (Kretchmar et al., 2017).","en":"They were founded by Inuit communities from Alaska, Canada and Greenland, with events such as tug-of-war, the one-foot high kick and the drum dance, in response to the homogenisation of Western sport (Kretchmar et al., 2017)."}},{"img":"img/t1/levantino_ciervos.jpg","caption":{"es":"Escena de caza de ciervos. Arte rupestre levantino","en":"Deer-hunting scene. Levantine rock art"},"claim":{"es":"Una escena pintada como esta es siempre un documento fiel de una actividad real.","en":"A painted scene like this is always a faithful record of a real activity."},"answer":false,"explain":{"es":"Hay que distinguir qué documenta una actividad real y qué es convención estilística o símbolo, y además su cronología es discutida, posiblemente entre el 10.000 y el 5.000 a. C.","en":"We must distinguish what records a real activity from what is stylistic convention or symbol, and its chronology is also debated, possibly between 10,000 and 5,000 BC."}}],"t2quiz":[{"q":{"es":"¿Cuál era la disciplina favorita del deporte real egipcio?","en":"What was the favourite discipline of Egyptian royal sport?"},"options":[{"es":"Tiro con arco sobre dianas de cobre","en":"Archery at copper targets"},{"es":"Lucha","en":"Wrestling"},{"es":"Carreras de carros tirados por caballos","en":"Races of horse-drawn chariots"},{"es":"Natación","en":"Swimming"}],"answer":0,"explain":{"es":"Florece en el Imperio Nuevo con el arco compuesto; sirve para que el rey, y nadie más, demuestre que su fuerza sigue intacta.","en":"It flourished in the New Kingdom with the composite bow; it lets the king, and no one else, show that his strength remains intact."}},{"q":{"es":"¿Cada cuánto se repetía el Heb-Sed tras el primer jubileo?","en":"How often was the Heb-Sed repeated after the first jubilee?"},"options":[{"es":"Cada tres años","en":"Every three years"},{"es":"Cada año","en":"Every year"},{"es":"Cada diez años","en":"Every ten years"},{"es":"Cada treinta años","en":"Every thirty years"}],"answer":0,"explain":{"es":"Se celebraba a los treinta años de reinado y luego cada tres. Ramsés II celebró trece o catorce en 66 años.","en":"It was held after thirty years of reign and then every three. Ramesses II held thirteen or fourteen in 66 years."}},{"q":{"es":"¿Qué longitud tenía el circuito completo de la carrera del Heb-Sed en Saqqara?","en":"How long was the full Heb-Sed race circuit at Saqqara?"},"options":[{"es":"140 m","en":"140 m"},{"es":"55 m","en":"55 m"},{"es":"400 m","en":"400 m"},{"es":"1 km","en":"1 km"}],"answer":0,"explain":{"es":"Recta de 55 m con dos mojones semicirculares; el circuito completo sumaba 140 m, corridos de norte a sur y de sur a norte.","en":"A 55 m straight with two semicircular markers; the full circuit was 140 m, run north to south and south to north."}},{"q":{"es":"¿Quién acuñó el concepto de Pharao ludens?","en":"Who coined the concept of Pharao ludens?"},"options":[{"es":"Erik Hornung (1982)","en":"Erik Hornung (1982)"},{"es":"Wolfgang Decker (1992)","en":"Wolfgang Decker (1992)"},{"es":"Johan Huizinga (1938)","en":"Johan Huizinga (1938)"},{"es":"Allen Guttmann (2004)","en":"Allen Guttmann (2004)"}],"answer":0,"explain":{"es":"Siguiendo a Huizinga, describe a un soberano cuya función se ejerce, en parte, jugando.","en":"Following Huizinga, it describes a ruler whose office is exercised, in part, through play."}},{"q":{"es":"¿Cuándo surge el ejército profesional permanente egipcio?","en":"When does the Egyptian standing professional army emerge?"},"options":[{"es":"En el Imperio Nuevo, tras la ocupación hicsa","en":"In the New Kingdom, after the Hyksos occupation"},{"es":"En el Imperio Antiguo, en tiempos de las pirámides","en":"In the Old Kingdom, in the age of the pyramids"},{"es":"En el Imperio Medio, con Beni Hasan","en":"In the Middle Kingdom, with Beni Hasan"},{"es":"Bajo dominio persa","en":"Under Persian rule"}],"answer":0,"explain":{"es":"Levas obligatorias de jóvenes campesinos alojados en campamentos de hasta 5.000 soldados; el Estado premiaba el servicio con tierras.","en":"Compulsory levies of young peasants housed in camps of up to 5,000 soldiers; the state rewarded service with land."}},{"q":{"es":"¿Cuáles son las tres modalidades de combate egipcias?","en":"What are the three Egyptian combat disciplines?"},"options":[{"es":"Lucha, tahtib y boxeo","en":"Wrestling, tahtib and boxing"},{"es":"Lucha, esgrima con espada y tiro","en":"Wrestling, sword fencing and shooting"},{"es":"Boxeo, pancracio y lucha","en":"Boxing, pankration and wrestling"},{"es":"Tahtib, jereed y buzkashi","en":"Tahtib, jereed and buzkashi"}],"answer":0,"explain":{"es":"Decker (1992) las ordena en tres contextos: preparación militar, ceremonias ante el rey y cultos religiosos.","en":"Decker (1992) orders them by three contexts: military training, ceremonies before the king and religious cults."}},{"q":{"es":"¿Qué recoge el relieve de la calzada de Sahure en Abusir?","en":"What does the Sahure causeway relief at Abusir record?"},"options":[{"es":"Tiro con arco, esgrima, lucha y regata de obreros y soldados","en":"Archery, fencing, wrestling and a boat race of workers and soldiers"},{"es":"La carrera del Heb-Sed del rey ante la corte y los sacerdotes","en":"The king's Heb-Sed run before the court and the priests"},{"es":"Una partida de senet","en":"A game of senet"},{"es":"Una justa de pescadores","en":"A fishermen's joust"}],"answer":0,"explain":{"es":"Programa de cuatro modalidades por la inauguración del templo funerario, con premios (collares de oro) y el rey presente. Dinastía V, h. 2490 a. C.","en":"A four-event programme for the inauguration of the funerary temple, with prizes (gold collars) and the king present. 5th Dynasty, c. 2490 BC."}},{"q":{"es":"¿Qué casilla del senet era la Casa del Renacimiento?","en":"Which senet square was the House of Rebirth?"},"options":[{"es":"La 15","en":"Square 15"},{"es":"La 26","en":"Square 26"},{"es":"La 30","en":"Square 30"},{"es":"La 1","en":"Square 1"}],"answer":0,"explain":{"es":"Protegía y permitía reingresar. Las fichas avanzaban en zigzag de la 1 a la 30 en un tablero de tres filas de diez.","en":"It protected and allowed re-entry. Pieces advanced in a zigzag from 1 to 30 on a board of three rows of ten."}},{"q":{"es":"¿Cuántas etapas distingue el tema en la historia de Persia?","en":"How many stages does the unit distinguish in the history of Persia?"},"options":[{"es":"Seis","en":"Six"},{"es":"Dos","en":"Two"},{"es":"Tres","en":"Three"},{"es":"Diez","en":"Ten"}],"answer":0,"explain":{"es":"El imperio aqueménida es solo la primera; lo común a las seis es el mundo equino, el arco y la lucha. Cambia quién practica, para qué y qué significa.","en":"The Achaemenid Empire is only the first; common to all six are the horse world, the bow and wrestling. What changes is who practises, why and what it means."}},{"q":{"es":"¿De qué palabra procede nuestro «paraíso»?","en":"Where does our word 'paradise' come from?"},"options":[{"es":"Del iranio paradeisos, parque de caza cercado","en":"From Iranian paradeisos, an enclosed hunting park"},{"es":"Del egipcio ma'at","en":"From Egyptian ma'at"},{"es":"Del fenicio Qart-ḥadašt","en":"From Phoenician Qart-ḥadašt"},{"es":"Del griego agón, la competición pública entre rivales","en":"From Greek agon, public competition between rivals"}],"answer":0,"explain":{"es":"Jenofonte describe el coto de Ciro. Se cazaba varias veces al mes con arco, espada corta, escudo y dos lanzas.","en":"Xenophon describes Cyrus's reserve. Hunting took place several times a month with bow, short sword, shield and two spears."}},{"q":{"es":"¿Qué cortesano fue decapitado por matar un león antes que el rey?","en":"Which courtier was beheaded for killing a lion before the king?"},"options":[{"es":"Megabizo, con Artajerjes I","en":"Megabyzus, under Artaxerxes I"},{"es":"Mardonio, en tiempos de Darío I","en":"Mardonius, in the time of Darius I"},{"es":"Harpago, con Ciro II","en":"Harpagus, under Cyrus II"},{"es":"Mazeo, con Darío III","en":"Mazaeus, under Darius III"}],"answer":0,"explain":{"es":"En la caza real el rey se reservaba el derecho de cazar primero.","en":"In the royal hunt the king reserved the right to strike first."}},{"q":{"es":"¿Quién construyó la plaza Naqsh-e Jahán de Isfahán como campo de chovgan?","en":"Who built Naqsh-e Jahan square in Isfahan as a chovgan field?"},"options":[{"es":"Abbás I, en 1598","en":"Abbas I, in 1598"},{"es":"Ciro II, en 550 a. C.","en":"Cyrus II, in 550 BC"},{"es":"Darío I, en 500 a. C.","en":"Darius I, in 500 BC"},{"es":"Rostam, en el siglo X","en":"Rostam, in the 10th century"}],"answer":0,"explain":{"es":"Servía a la vez como plaza mayor y campo de juego. Periodo safávida.","en":"It served both as main square and playing field. Safavid period."}},{"q":{"es":"¿Cuál fue la aportación cultural decisiva de los fenicios?","en":"What was the Phoenicians' decisive cultural contribution?"},"options":[{"es":"Fijar y difundir el alfabeto de 22 signos","en":"Fixing and spreading the 22-sign alphabet"},{"es":"Inventar la brújula","en":"Inventing the compass"},{"es":"Crear los Juegos Olímpicos","en":"Creating the Olympic Games"},{"es":"Introducir el caballo en todo el Mediterráneo","en":"Introducing the horse across the Mediterranean"}],"answer":0,"explain":{"es":"El sistema nació hacia 1800 a. C. entre trabajadores semitas del Sinaí; los fenicios lo fijaron en 22 consonantes y lo distribuyeron en sus barcos.","en":"The system arose around 1800 BC among Semitic workers in Sinai; the Phoenicians fixed it at 22 consonants and distributed it in their ships."}},{"q":{"es":"¿Por qué las naves fenicias de los relieves de Sargón II se llamaron hippoi?","en":"Why were the Phoenician ships in Sargon II's reliefs called hippoi?"},"options":[{"es":"Por la cabeza de caballo tallada en la proa","en":"For the horse head carved on the bow"},{"es":"Porque transportaban caballos para el ejército asirio","en":"Because they carried horses for the Assyrian army"},{"es":"Por su velocidad","en":"For their speed"},{"es":"Por el nombre de su puerto","en":"After their home port"}],"answer":0,"explain":{"es":"El mascarón de proa fue una de las principales innovaciones fenicias a la náutica. Transportaban madera de cedro remolcando troncos por la costa.","en":"The figurehead was one of the main Phoenician innovations in seafaring. The ships carried cedar, towing logs along the coast."}},{"q":{"es":"¿Qué porcentaje de las figuritas de Kharayeb representa a niños?","en":"What percentage of the Kharayeb figurines depict children?"},"options":[{"es":"35 %","en":"35 %"},{"es":"22 %","en":"22 %"},{"es":"50 %","en":"50 %"},{"es":"5 %","en":"5 %"}],"answer":0,"explain":{"es":"De 16.400 fragmentos, un 35 % son niños y un 22 % mujeres. Las figuras permiten ordenar una secuencia de juego por edades.","en":"Of 16,400 fragments, 35 % are children and 22 % women. The figures allow a sequence of play by age to be ordered."}},{"q":{"es":"¿Qué lleva a los persas a estatalizar la educación de los jóvenes?","en":"What leads the Persians to place young people's education under the state?"},"options":[{"es":"Gobernar decenas de pueblos con una minoría persa dispersa","en":"Ruling dozens of peoples with a scattered Persian minority"},{"es":"Preparar atletas capaces de competir con los griegos en Olimpia","en":"Preparing athletes able to compete with the Greeks at Olympia"},{"es":"La escasez de caballos","en":"The scarcity of horses"},{"es":"La influencia egipcia","en":"Egyptian influence"}],"answer":0,"explain":{"es":"El imperio se construye en treinta años sobre decenas de pueblos; la educación tiene como fin impedir que los hijos de los persas dejen de serlo.","en":"The empire was built in thirty years over dozens of peoples; education aimed to stop the sons of Persians from ceasing to be Persian."}}],"t3myths":[{"claim":{"es":"Los palacios cretenses no tenían murallas porque Creta fue una isla sin guerras.","en":"The Cretan palaces had no walls because Crete was an island without wars."},"answer":false,"explain":{"es":"Las primeras armas del Egeo son cretenses, había preparación para la guerra y algunos centros tuvieron fortificaciones. La «Pax Minoica» de Evans debe matizarse.","en":"The first weapons of the Aegean are Cretan, there was preparation for war and some centres had fortifications. Evans's 'Pax Minoica' must be qualified."}},{"claim":{"es":"Los minoicos competían por premios, como muestran sus imágenes.","en":"The Minoans competed for prizes, as their images show."},"answer":false,"explain":{"es":"Ningún objeto representa un premio ni una lista de vencedores. El deporte servía para la iniciación, el culto y el prestigio de las grandes casas.","en":"No object shows a prize or a list of victors. Sport served initiation, worship and the prestige of the great houses."}},{"claim":{"es":"Los toros del salto eran uros salvajes.","en":"The bulls in the leap were wild aurochs."},"answer":false,"explain":{"es":"El pelaje moteado de los toros de Cnoso solo se da en animales domésticos, de modo que no eran tan fieros como se ha propuesto.","en":"The spotted coat of the Knossos bulls occurs only in domestic animals, so they were not as fierce as has been suggested."}},{"claim":{"es":"La erupción de Tera puso fin a la Creta de los palacios.","en":"The eruption of Thera ended palatial Crete."},"answer":false,"explain":{"es":"Fue hacia 1628 a. C., unos ciento cincuenta años antes del final. Hoy la tesis más aceptada atribuye la destrucción de hacia 1450 a. C. a las invasiones micénicas.","en":"It happened c. 1628 BC, some 150 years before the end. Today the most accepted thesis attributes the destruction of c. 1450 BC to the Mycenaean invasions."}},{"claim":{"es":"La tregua sagrada detenía todas las guerras de Grecia durante los Juegos.","en":"The sacred truce stopped all wars in Greece during the Games."},"answer":false,"explain":{"es":"Protegía el territorio de Élide y a los peregrinos. La Olimpiada de 480 a. C. se celebró mientras Leónidas resistía en las Termópilas.","en":"It protected the territory of Elis and the pilgrims. The Olympiad of 480 BC was held while Leonidas held out at Thermopylae."}},{"claim":{"es":"Los Juegos de Olimpia continúan los juegos de la época micénica.","en":"The Olympic Games continue the games of the Mycenaean period."},"answer":false,"explain":{"es":"Más de mil años de vacío separan el túmulo prehistórico del santuario de Zeus, nacido a finales del siglo XI a. C. No hubo continuidad.","en":"More than a thousand years separate the prehistoric tumulus from the sanctuary of Zeus, founded at the end of the 11th century BC. There was no continuity."}},{"claim":{"es":"Está probado que los Juegos empezaron en 776 a. C.","en":"It is proven that the Games began in 776 BC."},"answer":false,"explain":{"es":"Es la fecha de una lista de vencedores compilada hacia 400 a. C. y poco fiable en sus primeros siglos. Se han propuesto también 884 (leyenda) y 704 a. C. (arqueología).","en":"It is the date of a list of victors compiled c. 400 BC and unreliable for its first centuries. Dates of 884 (legend) and 704 BC (archaeology) have also been proposed."}},{"claim":{"es":"Las ciudades griegas seleccionaban y pagaban a sus atletas.","en":"Greek cities selected and paid their athletes."},"answer":false,"explain":{"es":"Cada atleta acudía por iniciativa propia y costeaba entrenador, dieta, viaje y el mes en Élide. Ástilo llegó a cambiar de patria deportiva.","en":"Each athlete went on his own initiative and paid for coach, diet, travel and the month at Elis. Astylos even changed his sporting homeland."}},{"claim":{"es":"Como Olimpia solo daba una corona de olivo, el atleta no ganaba dinero.","en":"Since Olympia gave only an olive wreath, the athlete earned no money."},"answer":false,"explain":{"es":"Su ciudad lo recibía con estatuas, manutención y premios: Solón daba 500 dracmas al ateniense vencedor en Olimpia.","en":"His city welcomed him with statues, maintenance and rewards: Solon gave 500 drachmas to any Athenian who won at Olympia."}},{"claim":{"es":"Está demostrado que la carrera de hoplitas preparaba para la guerra.","en":"It is proven that the hoplite race was preparation for war."},"answer":false,"explain":{"es":"Su utilidad militar se discute: Mann (2021) no halla fuentes en ese sentido antes del siglo IV a. C. y Spivey (2021) cree que premiaba al corredor aislado y no la cohesión de la falange.","en":"Its military usefulness is debated: Mann (2021) finds no sources to that effect before the fourth century BC and Spivey (2021) thinks it rewarded the lone runner, not the cohesion of the phalanx."}},{"claim":{"es":"Los griegos medían y registraban las marcas del salto, la jabalina y el disco.","en":"The Greeks measured and recorded the marks in the jump, javelin and discus."},"answer":false,"explain":{"es":"Solo se marcaba con una estaca el mejor intento, que se movía si otro lo superaba. No sabemos si sus marcas eran comparables a las actuales.","en":"Only the best attempt was marked with a stake, moved if someone bettered it. We do not know whether their marks were comparable to today's."}},{"claim":{"es":"Los combates griegos tenían categorías de peso, como el boxeo actual.","en":"Greek combat sports had weight classes, like modern boxing."},"answer":false,"explain":{"es":"Solo había categorías de edad, sin asaltos ni descansos, de ahí que llevaran ventaja el más resistente y el más pesado.","en":"There were only age categories, with no rounds or breaks, which is why the most enduring and heaviest had the advantage."}},{"claim":{"es":"Hubo campeonas olímpicas aunque las mujeres casadas no podían entrar en Olimpia.","en":"There were female Olympic champions although married women could not enter Olympia."},"answer":true,"explain":{"es":"En la hípica la corona era para el dueño de las monturas, y Cinisca de Esparta ganó la cuadriga en 396 a. C.","en":"In the equestrian events the wreath went to the owner, and Kyniska of Sparta won the four-horse chariot race in 396 BC."}},{"claim":{"es":"Ninguna mujer corrió nunca en el estadio de Olimpia.","en":"No woman ever ran in the stadium of Olympia."},"answer":false,"explain":{"es":"En los Juegos Hereos, desde hacia 580 a. C., muchachas solteras corrían unos 160 m en el estadio en honor de Hera.","en":"In the Heraia, from c. 580 BC, unmarried girls ran about 160 m in the stadium in honour of Hera."}},{"claim":{"es":"Teodosio I prohibió los Juegos Olímpicos en 393 d. C.","en":"Theodosius I banned the Olympic Games in AD 393."},"answer":false,"explain":{"es":"Remijsen (2015) comprobó que esa ley no menciona los Juegos; el vínculo lo estableció un cronista del siglo XI. Los Juegos se apagaron porque las élites dejaron de costearlos.","en":"Remijsen (2015) showed that this law does not mention the Games; the link was made by an 11th-century chronicler. The Games faded because the elites stopped paying for them."}}],"t3match":[{"title":{"es":"Las cuatro lecturas del salto del toro","en":"The four readings of bull-leaping"},"pairs":[{"a":{"es":"Lectura ritual","en":"Ritual reading"},"b":{"es":"Ofrenda a los dioses, desde Evans","en":"Offering to the gods, since Evans"}},{"a":{"es":"Lectura iniciática","en":"Initiatory reading"},"b":{"es":"Paso de los jóvenes a la edad adulta","en":"Passage of the young to adulthood"}},{"a":{"es":"Lectura de poder","en":"Power reading"},"b":{"es":"Emblema del palacio de Cnoso","en":"Emblem of the palace of Knossos"}},{"a":{"es":"Lectura atlética","en":"Athletic reading"},"b":{"es":"Exhibición de destreza ante la comunidad","en":"Display of skill before the community"}}]},{"title":{"es":"Quién podía hacer deporte en Atenas","en":"Who could do sport in Athens"},"pairs":[{"a":{"es":"Plousioi","en":"Plousioi"},"b":{"es":"No trabajaban; 4 o 5 % de los hogares","en":"Did not work; 4 to 5% of households"}},{"a":{"es":"Penêtes","en":"Penêtes"},"b":{"es":"Trabajaban su tierra parte del año y podían pagar al paidotriba","en":"Worked their land part of the year and could pay the trainer"}},{"a":{"es":"Ptôchoi","en":"Ptôchoi"},"b":{"es":"Trabajaban a diario y apenas hacían deporte","en":"Worked daily and hardly did sport"}},{"a":{"es":"Esclavos","en":"Slaves"},"b":{"es":"La ley les vedaba el deporte","en":"The law barred them from sport"}}]},{"title":{"es":"Los valores del olimpismo","en":"The values of the Olympic Games"},"pairs":[{"a":{"es":"Kléos","en":"Kleos"},"b":{"es":"Gloria eterna","en":"Eternal glory"}},{"a":{"es":"Agón","en":"Agon"},"b":{"es":"Contienda que exige un adversario","en":"Contest that requires an opponent"}},{"a":{"es":"Kalokagathía","en":"Kalokagathia"},"b":{"es":"Equilibrio entre lo bello y lo bueno","en":"Balance between the beautiful and the good"}},{"a":{"es":"Areté","en":"Arete"},"b":{"es":"Excelencia","en":"Excellence"}},{"a":{"es":"Aidós","en":"Aidos"},"b":{"es":"Compostura y humildad del vencedor","en":"Composure and humility of the victor"}}]},{"title":{"es":"Cada prueba, su año de entrada","en":"Each event, its year of entry"},"pairs":[{"a":{"es":"Estadio","en":"Stadion"},"b":{"es":"776 a. C.","en":"776 BC"}},{"a":{"es":"Díaulos","en":"Diaulos"},"b":{"es":"724 a. C.","en":"724 BC"}},{"a":{"es":"Lucha y pentatlón","en":"Wrestling and pentathlon"},"b":{"es":"708 a. C.","en":"708 BC"}},{"a":{"es":"Pugilato","en":"Boxing"},"b":{"es":"688 a. C.","en":"688 BC"}},{"a":{"es":"Carrera de hoplitas","en":"Hoplite race"},"b":{"es":"520 a. C.","en":"520 BC"}}]},{"title":{"es":"Faltas y castigos en Olimpia","en":"Offences and punishments at Olympia"},"pairs":[{"a":{"es":"Salida falsa","en":"False start"},"b":{"es":"Azotes de los mastigóforos","en":"Flogging by the mastigophoroi"}},{"a":{"es":"Mentir a los jueces","en":"Lying to the judges"},"b":{"es":"Expulsión de los Juegos","en":"Expulsion from the Games"}},{"a":{"es":"Soborno","en":"Bribery"},"b":{"es":"Multa que costeaba un zan","en":"Fine that paid for a Zan"}},{"a":{"es":"Mujer casada en el festival","en":"Married woman at the festival"},"b":{"es":"Pena de muerte desde un monte cercano","en":"Death penalty from a nearby mountain"}}]}],"t3timeline":[{"title":{"es":"Creta y Micenas: del palacio a la aldea","en":"Crete and Mycenae: from palace to village"},"items":[{"label":{"es":"Primeros palacios cretenses","en":"First Cretan palaces"},"year":-1950,"date":{"es":"h. 1950 a. C.","en":"c. 1950 BC"}},{"label":{"es":"Erupción del volcán de Tera","en":"Eruption of the Thera volcano"},"year":-1628,"date":{"es":"h. 1628 a. C.","en":"c. 1628 BC"}},{"label":{"es":"Ritón de los boxeadores de Hagia Triada","en":"Boxer Rhyton of Hagia Triada"},"year":-1550,"date":{"es":"h. 1550-1500 a. C.","en":"c. 1550-1500 BC"}},{"label":{"es":"Los micénicos toman Cnoso","en":"The Mycenaeans take Knossos"},"year":-1450,"date":{"es":"h. 1450 a. C.","en":"c. 1450 BC"}},{"label":{"es":"Arde el palacio de Cnoso","en":"The palace of Knossos burns"},"year":-1375,"date":{"es":"h. 1375 a. C.","en":"c. 1375 BC"}},{"label":{"es":"Arden los palacios micénicos","en":"The Mycenaean palaces burn"},"year":-1200,"date":{"es":"1200-1150 a. C.","en":"1200-1150 BC"}},{"label":{"es":"Tumba del gran señor de Lefkandi","en":"Tomb of the great lord of Lefkandi"},"year":-950,"date":{"es":"h. 950 a. C.","en":"c. 950 BC"}},{"label":{"es":"Enócoe del Dipilón, premio de baile","en":"Dipylon oinochoe, a dancing prize"},"year":-740,"date":{"es":"h. 740-725 a. C.","en":"c. 740-725 BC"}}]},{"title":{"es":"Los periodos de Grecia","en":"The periods of Greece"},"items":[{"label":{"es":"Primeros Juegos de Olimpia, según la tradición","en":"First Olympic Games, according to tradition"},"year":-776,"date":{"es":"776 a. C.","en":"776 BC"}},{"label":{"es":"Fundación de Siracusa","en":"Foundation of Syracuse"},"year":-734,"date":{"es":"734 a. C.","en":"734 BC"}},{"label":{"es":"Reformas de Solón","en":"Reforms of Solon"},"year":-594,"date":{"es":"594/593 a. C.","en":"594/593 BC"}},{"label":{"es":"Reformas de Clístenes","en":"Reforms of Cleisthenes"},"year":-508,"date":{"es":"508 a. C.","en":"508 BC"}},{"label":{"es":"Batalla de Salamina, inicio de la época clásica","en":"Battle of Salamis, start of the Classical period"},"year":-480,"date":{"es":"480 a. C.","en":"480 BC"}},{"label":{"es":"Muerte de Alejandro Magno, inicio de la época helenística","en":"Death of Alexander the Great, start of the Hellenistic period"},"year":-323,"date":{"es":"323 a. C.","en":"323 BC"}},{"label":{"es":"Grecia queda bajo el dominio de Roma","en":"Greece falls under Roman rule"},"year":-146,"date":{"es":"146 a. C.","en":"146 BC"}}]},{"title":{"es":"El programa olímpico crece","en":"The Olympic programme grows"},"items":[{"label":{"es":"Estadio (stádion)","en":"Stadion"},"year":-776,"date":{"es":"776 a. C.","en":"776 BC"}},{"label":{"es":"Díaulos","en":"Diaulos"},"year":-724,"date":{"es":"724 a. C.","en":"724 BC"}},{"label":{"es":"Dólico","en":"Dolichos"},"year":-720,"date":{"es":"720 a. C.","en":"720 BC"}},{"label":{"es":"Pentatlón y lucha","en":"Pentathlon and wrestling"},"year":-708,"date":{"es":"708 a. C.","en":"708 BC"}},{"label":{"es":"Pugilato","en":"Boxing"},"year":-688,"date":{"es":"688 a. C.","en":"688 BC"}},{"label":{"es":"Carrera de cuadrigas","en":"Four-horse chariot race"},"year":-680,"date":{"es":"680 a. C.","en":"680 BC"}},{"label":{"es":"Pancracio y carrera de caballos","en":"Pankration and horse race"},"year":-648,"date":{"es":"648 a. C.","en":"648 BC"}},{"label":{"es":"Carrera de hoplitas","en":"Hoplite race"},"year":-520,"date":{"es":"520 a. C.","en":"520 BC"}},{"label":{"es":"Carrera de bigas","en":"Two-horse chariot race"},"year":-408,"date":{"es":"408 a. C.","en":"408 BC"}},{"label":{"es":"Pancracio de muc
