a lesiones, y a diferencia de la lucha entrenaba también la mente porque obligaba a anticipar los movimientos del rival.","en":"According to Galen, the game moved the whole body with whatever intensity one wished, suited any age, cost hardly any money and rarely caused injuries, and unlike wrestling it also trained the mind because it forced players to anticipate the opponent's movements."}},{"q":{"es":"¿Cuál fue la causa principal del fin de los espectáculos en Occidente?","en":"What was the main cause of the end of the spectacles in the West?"},"options":[{"es":"El dinero, porque las ciudades se empobrecieron y los ricos dejaron de pagar los juegos","en":"Money, because the cities grew poorer and the rich stopped paying for the games"},{"es":"Una ley imperial que los prohibió en un año concreto","en":"An imperial law that banned them in a particular year"},{"es":"La condena de la Iglesia, que obligó a cerrar los recintos","en":"The condemnation of the Church, which forced the venues to close"},{"es":"La caída del Imperio de Occidente en 476 d. C., que acabó con todos los juegos","en":"The fall of the Western Empire in AD 476, which ended all the games"}],"answer":0,"explain":{"es":"Desde el siglo III los ricos que antes pagaban los juegos dedicaron su generosidad a iglesias, hospitales y limosnas, y Jiménez Sánchez (2002) pone por delante el coste, puesto que la gladiatura era el espectáculo más caro, y Stocking (2021) coincide en que el cristianismo no fue la causa principal.","en":"From the 3rd century the rich who had once paid for the games devoted their generosity to churches, hospitals and almsgiving, and Jiménez Sánchez (2002) puts cost first, since gladiatorial combat was the most expensive spectacle, while Stocking (2021) agrees that Christianity was not the main cause."}}],"timelines":{"1":[{"title":{"es":"Rastros del cuerpo en la Prehistoria","en":"Traces of the body in Prehistory"},"items":[{"label":{"es":"Lanzas de Schöningen","en":"Schöningen spears" /* ---------- sonido ---------- */
let AC=null;
function beep(f,d,type='sine',v=.15,when=0){if(!snd)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime+when);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+when+d);o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+when);o.stop(AC.currentTime+when+d+.05)}catch(e){}}
const sfx={tick:()=>beep(880,.06,'square',.05),gong:()=>{beep(110,1.4,'sine',.3);beep(220,1,'triangle',.12)},ok:()=>{beep(660,.12,'triangle',.18);beep(990,.25,'triangle',.18,.1)},rev:()=>{beep(330,.1,'sawtooth',.06);beep(495,.18,'triangle',.12,.08)},dig:()=>beep(160+Math.random()*80,.07,'triangle',.08),

/* ---------- construir la partida ---------- */
function build(){
 const k={40:[3,5,6],50:[4,6,8],60:[5,8,10]}[DUR];
 S=[];
 S.push({k:'intro'});
 // R1
 S.push({k:'rintro',r:0});
 const okCards=D.t1cards.filter(c=>tr(c.caption).length>3);
 pick(okCards,k[0]).forEach((c,i)=>S.push({k:'dig',r:0,c,i,n:k[0]}));
 // R2
 S.push({k:'rintro',r:1});
 pick(D.t2quiz,k[1]).forEach((q,i)=>S.push({k:'quiz',r:1,q:mq(q),i,n:k[1],sec:20,race:true}));
 // R3
 S.push({k:'rintro',r:2});
 const ev=[];
 const my=pick(D.t3myths,2),cards=pick(D.t3cards.filter(c=>c.img),2),src=pick(D.t3sources,2);
 ev.push({k:'tf',ev:'mito',claim:my[0].claim,ans:my[0].answer,ex:my[0].explain,sec:15});
 const m=pick(D.t3match,1)[0];ev.push({k:'match',ev:'match',m:mm(m),sec:60});
 const tl=pick(D.t3timeline.filter(x=>x.items.length>=4),1)[0];ev.push({k:'crono',ev:'crono',items:pickDistinct(tl.items,4),title:tl.title,sec:45});
 ev.push({k:'quiz',ev:'fuente',q:mq(src[0]),quote:src[0].text,sec:30});
 ev.push({k:'flash',ev:'flash',c:cards[0],sec:12});
 if(DUR===60){ev.splice(1,0,{k:'tf',ev:'mito',claim:my[1].claim,ans:my[1].answer,ex:my[1].explain,sec:15});ev.push({k:'flash',ev:'flash',c:cards[1],sec:12})}
 ev.forEach((e,i)=>S.push(Object.assign(e,{r:2,i,n:ev.length})));
 // R4
 S.push({k:'rintro',r:3});
 pick(D.t4quiz,k[2]).forEach((q,i)=>S.push({k:'quiz',r:3,q:mq(q),i,n:k[2],sec:15,munus:true}));
 S.push({k:'missio',r:3});
 // R5 relevo
 S.push({k:'rintro',r:4});
 S.push({k:'crono',r:4,relevo:true,items:relevoItems(),sec:60,i:0,n:1});
 S.push({k:'podium'});
}
function mq(q){const o=q.options.map((x,i)=>({x,ok:i===q.answer}));const s=sh(o);return {q:q.question||q.q,opts:s.map(z=>z.x),ans:s.findIndex(z=>z.ok),ex:q.explain}}
function mm(m){const pr=pick(m.pairs,Math.min(4,m.pairs.length));const right=sh(pr.map((p,i)=>({b:p.b,i})));return {title:m.title,left:pr.map(p=>p.a),right,sol:pr.map((p,i)=>right.findIndex(r=>r.i===i))}}
function pickDistinct(items,n){const seen=new Set();return sh(items).filter(x=>{if(seen.has(x.year))return false;seen.add(x.year);return true}).slice(0,n)}
function relevoItems(){const out=[],years=new Set();[1,2,3,4].forEach(n=>{const all=sh(D.timelines[n].flatMap(tl=>tl.items));const it=all.find(x=>!years.has(x.year));if(it){years.add(it.year);out.push(Object.assign({tema:n},it))}});
 const extraT=[2,3,4][Math.random()*3|0];const ex=sh(D.timelines[extraT].flatMap(tl=>tl.items)).find(x=>!years.has(x.year));if(ex)out.push(Object.assign({tema:extraT},ex));return sh(out)}

/* ---------- fases ---------- */
const PH={intro:['a'],rintro:['a'],dig:['dig','cap','claim','crev'],quiz:['q','rev'],tf:['q','rev'],match:['q','rev'],crono:['q','rev'],flash:['see','q','rev'],missio:['a'],podium:['a']};
function awardVal(s,p){
 if(s.k==='dig'&&p==='cap')return s.val||100;
 if(s.k==='dig'&&p==='crev')return 200;
 if(s.k==='missio')return 500;
 if(p!=='rev')return 0;
 if(s.munus)return 100;
 if(s.relevo)return 500;
 if(s.k==='tf'||s.k==='flash')return 200;
 return 300;
}
function curPh(){return PH[S[si].k][ph]}
function key(){return si+':'+ph}

/* ---------- puntuación ---------- */
function toggle(fi){
 if(fi>=F.length)return;
 const s=S[si],p=curPh(),v=awardVal(s,p);
 if(!v)return;
 const k=key();award[k]=award[k]||{};
 const f=F[fi];
 if(award[k][fi]!=null){const was=award[k][fi];f.score-=was;f.combo=Math.max(0,f.combo-1);if(s.race)f.race--;delete award[k][fi];fly(fi,'-'+was);}
 else{const bonus=(f.combo>=2&&!s.munus&&s.k!=='missio')?100:0;const tot=v+bonus;award[k][fi]=tot;f.score+=tot;f.combo++;if(s.race)f.race++;fly(fi,'+'+tot);sfx.ok()}
 renderBoard();if(s.race)renderRace();
}
function closeScoring(){const s=S[si],p=curPh();if(!awardVal(s,p)||s.munus||s.k==='missio')return;const a=award[key()]||{};F.forEach((f,i)=>{if(a[i]==null)f.combo=0})}
function adj(fi,d){F[fi].score+=d;fly(fi,(d>0?'+':'')+d);renderBoard()}
function fly(fi,txt){if(txt===undefined||txt==='-undefined')return;const el=document.querySelectorAll('.fac')[fi];if(!el)return;const s=document.createElement('div');s.className='fly';s.textContent=txt;el.appendChild(s);setTimeout(()=>s.remove(),1200)}
function renderBoard(){
 const s=S[si],v=s?awardVal(s,curPh()):0,a=award[key()]||{};
 document.getElementById('board').innerHTML=F.map((f,i)=>`<div class="fac ${v?'can':''} ${a[i]!=null?'got':''}" onclick="toggle(${i})"><div class="bar" style="background:${f.col}"></div><div class="em">${f.em}</div><div><div class="nm">${f.name}</div><div class="sc">${f.score}</div></div><div class="combo ${f.combo>=2&&!(s&&s.munus)?'on':''}">🔥 ${t('ronda')==='Ronda'?'racha':'streak'} ${f.combo}</div><div class="adj"><b onclick="event.stopPropagation();adj(${i},-50)">−50</b><b onclick="event.stopPropagation();adj(${i},50)">+50</b></div></div>`).join('');
}

function startTimer(sec){stopTimer();timeLeft=sec;const tot=sec;const el=document.getElementById('timer');el.style.display='block';el.classList.remove('low');
 const draw=()=>{document.getElementById('tn').textContent=timeLeft>0?timeLeft:'0';document.getElementById('tc').style.strokeDashoffset=276.5*(1-timeLeft/tot);el.classList.toggle('low',timeLeft<=5)};draw();
 timerH=setInterval(()=>{if(paused)return;timeLeft--;draw();if(timeLeft<=5&&timeLeft>0)sfx.tick();if(timeLeft<=0){stopTimer(true);sfx.gong();const q=document.querySelector('.q,.claim');const b=document.createElement('div');b.className='kicker rise';b.style.color='#FBC93D';b.style.fontSize='3vh';b.textContent=t('time');document.getElementById('stage').appendChild(b)}},1000)}

  h=`<div class="kicker rise">${tr(m.title)}</div><div class="q rise" style="font-size:3.2vh;margin-bottom:2vh">${t('matchQ')}</div>`;
  if(!rv)h+=`<div class="cols"><div>${m.left.map((a,i)=>`<div class="it" style="animation-delay:${i*.08}s"><div class="k n">${i+1}</div><div>${md(tr(a))}</div></div>`).join('')}</div><div>${m.right.map((r,i)=>`<div class="it" style="animation-delay:${.2+i*.08}s"><div class="k">${LET[i]}</div><div>${md(tr(r.b))}</div></div>`).join('')}</div></div>`;
  else h+=`<div class="list">${m.left.map((a,i)=>`<div class="it okk" style="animation-delay:${i*.15}s"><div class="k n">${i+1}</div><div style="flex:1"><b>${md(tr(a))}</b></div><div class="k">${LET[m.sol[i]]}</div><div style="flex:1.4">${md(tr(m.right[m.sol[i]].b))}</div></div>`).join('')}</div><div class="small">${t('award')} (+300)</div>`;
  if(rv)sfx.rev();
 }
 else if(s.k==='crono'){
  const rv=p==='rev',it=s.items;
  h=`<div class="kicker rise">${s.relevo?T[L].r[4].n:tr(s.title)}</div><div class="q rise" style="font-size:3.4vh;margin-bottom:2.4vh">${s.relevo?t('relevoQ'):t('cronoQ')}</div><div class="list">`;
  if(!rv)h+=it.map((x,i)=>`<div class="it" style="animation-delay:${i*.1}s"><div class="k">${LET[i]}</div><div>${tr(x.label)}</div>${s.relevo?`<span class="tag">${t('tema')} ${x.tema}</span>`:''}</div>`).join('');
  else{const so=it.map((x,i)=>({x,i})).sort((a,b)=>a.x.year-b.x.year);h+=so.map((o,j)=>`<div class="it okk" style="animation-delay:${j*.35}s"><div class="k n">${j+1}</div><div class="k">${LET[o.i]}</div><div>${tr(o.x.label)}</div>${s.relevo?`<span class="tag">${t('tema')} ${o.x.tema}</span>`:''}<div class="date">${tr(o.x.date)}</div></div>`).join('');
   h+=`</div><div class="cap rise" style="animation-delay:${so.length*.35}s">${so.map(o=>LET[o.i]).join(' · ')}</div><div>`;sfx.rev()}
  h+='</div>';
 }
 else if(s.k==='flash'){
  const c=s.c;
  h=`<div class="kicker rise">${p==='see'?t('flashQ'):t('claimQ')}</div><div class="flash ${p==='q'?'hide':''}" id="fl"><img src="${IMG+c.img}" alt=""></div>`+
   (p==='see'?'':`<div class="claim rise" style="margin-top:2vh;font-size:3.4vh">${md(tr(c.claim))}</div><div class="tf">${tfBtns(p==='rev'?c.answer:null)}</div>`)+
   (p==='rev'?`<div class="explain rise"><b>${tr(c.caption)}.</b> ${md(tr(c.explain))}</div>`:'');
  if(p==='rev'){sfx.rev()}
 }
 else if(s.k==='missio'){
  h=`<div class="kicker rise">${t('ronda')} 4 · Munus</div><h1 class="big cz rise">${t('missio')}</h1><div class="size"><span class="pp">⚔️</span><span class="pp" style="animation-delay:.3s">🏛️</span><span class="pp" style="animation-delay:.6s">⚔️</span></div><p class="lead rise">${t('missioL')}</p>`;
 }
 else if(s.k==='podium'){
  const so=F.map((f,i)=>Object.assign({i},f)).sort((a,b)=>b.score-a.score);
  const pos=[so[1],so[0],so[2]].filter(Boolean);
  h=`<div class="kicker rise">${t('podK')}</div><h1 class="big cz rise">${t('podium')}</h1><div class="podium">${pos.map(f=>{const r=so.indexOf(f)+1;return `<div class="pod p${r}" style="animation-delay:${r===1?1.2:r===2?.6:.2}s">${r===1?'<span class="laurel">🌿👑🌿</span>':''}<div class="em">${f.em}</div><div class="nm">${f.name}</div><div class="sc">${f.score}</div><div class="blk" style="height:${r===1?24:r===2?17:12}vh">${r}</div></div>`}).join('')}</div>
  ${so.length>3?`<div class="small" style="margin-top:2vh">${so.slice(3).map((f,j)=>`${j+4}. ${f.em} ${f.name} · ${f.score}`).join('   ')}</div>`:''}
  <div class="cap rise" style="animation-delay:2s">${t('thanks')}</div>`;
  setTimeout(()=>{sfx.fan();confetti()},1300);
 }
 st.innerHTML=h;
 renderBoard();
 if(s.race)renderRace();
 // temporizadores
 const sec=s.sec;
 if(sec&&p==='q'&&s.k!=='flash')startTimer(sec);
 if(s.k==='dig'&&p==='claim')startTimer(15);
 if(s.k==='flash'&&p==='see'){startTimer(5);setTimeout(()=>{if(S[si]===s&&curPh()==='see'){ph=1;render()}},5200)}
 if(s.k==='flash'&&p==='q')startTimer(sec);
}
function tfBtns(ans){const c=x=>ans==null?'':(ans===x?'ok':'no');return `<div class="tfb ${c(true)}">✔<small>${t('tr')}</small></div><div class="tfb ${c(false)}">✘<small>${t('fa')}</small></div>`}
function dig1(el){if(!el||el.classList.contains('off'))return;const s=S[si];if(s.k!=='dig'||curPh()!=='dig')return;el.classList.add('off');s.dug=(s.dug||0)+1;s.val=Math.max(100,500-Math.round(s.dug*400/20/50)*50);const v=$('dv');if(v)v.textContent=s.val;sfx.dig()}
function renderRace(){const el=$('race');if(!el)return;const s=S[si];const n=s.n;
 el.innerHTML=F.map(f=>`<div class="lane"><span class="lb">${f.name}</span>${Array.from({length:n-1},(_,i)=>`<div class="mojon" style="left:${8+(i+1)*84/n}%"></div>`).join('')}<div class="meta"></div><span class="tok" style="left:${8+Math.min(f.race,n)*84/n}%">${f.em}</span></div>`).join('')}

/* ---------- navegación ---------- */
function next(){
 const s=S[si];if(!s)return;
 if(s.k==='podium')return;
 closeScoring();
 if(ph<PH[s.k].length-1)ph++;else{si++;ph=0}
 if(si>=S.length)si=S.length-1;
 render();
}
document.addEventListener('keydown',e=>{
 if($('app').classList.contains('hidden'))return;
 if(e.key===' '||e.key==='ArrowRight'||e.key==='Enter'){e.preventDefault();next()}
 else if(/^[1-6]$/.test(e.key))toggle(+e.key-1);
 else if(e.key==='p'||e.key==='P'){paused=!paused}
 else if(e.key==='s'||e.key==='S'){snd=!snd}
 else if(e.key==='f'||e.key==='F'){fs()}
 else if(e.key==='n'||e.key==='N'){ph=PH[S[si].k].length-1;next()}
});
$('nextb').onclick=next;
function fs(){const d=document.documentElement;if(!document.fullscreenElement)(d.requestFullscreen||d.webkitRequestFullscreen||(()=>{})).call(d);else document.exitFullscreen&&document.exitFullscreen()}

/* ---------- confeti ---------- */
function confetti(){const c=$('conf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const P=Array.from({length:220},()=>({x:Math.random()*c.width,y:-Math.random()*c.height,v:2+Math.random()*4,r:Math.random()*6.28,s:6+Math.random()*8,c:['#EDAB00','#FBC93D','#5aa3e6','#f2efe6','#3d8b3d'][Math.random()*5|0]}));let fr=0;
 (function a(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;p.x+=Math.sin((p.y+p.r*50)/40);p.r+=.05;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++fr<480)requestAnimationFrame(a);else x.clearRect(0,0,c.width,c.height)})()}

/* ---------- configuración ---------- */
function setupUI(){
 $('s_k').textContent=t('kicker');$('s_t').textContent=t('title');$('s_l1').textContent=t('lang');$('s_l2').textContent=t('facs');$('s_l3').textContent=t('dur');$('go').textContent=t('go');$('s_h').textContent=t('help');$('help').textContent=t('help');$('nextb').textContent=t('next');
 $('nfac').innerHTML=[2,3,4,5,6].map(n=>`<button class="btn ${n===NF?'on':''}" onclick="NF=${n};setupUI()">${n}</button>`).join('');
 const old=[...document.querySelectorAll('#fnames input')].map(i=>i.value);
 $('fnames').innerHTML=Array.from({length:NF},(_,i)=>`<div class="fin"><span style="font-size:3vh">${T[L].fac[i][1]}</span><input value="${old[i]&&!T.es.fac.concat(T.en.fac).some(f=>f[0]===old[i])?old[i]:T[L].fac[i][0]}"></div>`).join('');
 document.documentElement.lang=L;document.title=t('title')+' · '+(L==='es'?'Historia del Deporte':'History of Sport');
}
document.querySelectorAll('#langs .btn').forEach(b=>b.onclick=()=>{L=b.dataset.l;document.querySelectorAll('#langs .btn').forEach(x=>x.classList.toggle('on',x===b));setupUI()});
document.querySelectorAll('#durs .btn').forEach(b=>b.onclick=()=>{DUR=+b.dataset.d;document.querySelectorAll('#durs .btn').forEach(x=>x.classList.toggle('on',x===b))});
$('go').onclick=()=>{
 const names=[...document.querySelectorAll('#fnames input')].map(i=>i.value.trim());
 F=Array.from({length:NF},(_,i)=>({name:names[i]||T[L].fac[i][0],em:T[L].fac[i][1],col:FCOL[i],score:0,combo:0,race:0}));
 build();si=0;ph=0;award={};
 $('setup').classList.add('hidden');$('app').classList.remove('hidden');fs();sfx.start();render();
};
setupUI();
</script>
</body>
</html>
