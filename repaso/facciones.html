hachos","en":"Boys' pankration"},"year":-200,"date":{"es":"200 a. C.","en":"200 BC"}}]},{"title":{"es":"Olimpia, del rito al final","en":"Olympia, from rite to end"},"items":[{"label":{"es":"Primer estadio de Olimpia","en":"First stadium at Olympia"},"year":-700,"date":{"es":"h. 700 a. C.","en":"c. 700 BC"}},{"label":{"es":"Primeros zanes, pagados con multas","en":"First Zanes, paid for with fines"},"year":-388,"date":{"es":"388 a. C.","en":"388 BC"}},{"label":{"es":"Tiberio gana la carrera de carros","en":"Tiberius wins the chariot race"},"year":4,"date":{"es":"4 d. C.","en":"AD 4"}},{"label":{"es":"Nerón compite en Olimpia","en":"Nero competes at Olympia"},"year":67,"date":{"es":"67 d. C.","en":"AD 67"}},{"label":{"es":"Ninfeo de Herodes Ático","en":"Nymphaeum of Herodes Atticus"},"year":150,"date":{"es":"h. 150 d. C.","en":"c. AD 150"}},{"label":{"es":"La estatua de Zeus se lleva a Constantinopla","en":"The statue of Zeus is taken to Constantinople"},"year":420,"date":{"es":"h. 420-440 d. C.","en":"c. AD 420-440"}},{"label":{"es":"Constitución de Teodosio II contra los templos","en":"Constitution of Theodosius II against the temples"},"year":435,"date":{"es":"435 d. C.","en":"AD 435"}}]}],"t3sources":[{"text":{"es":"«¿Contra qué clase de hombres nos has traído a luchar, que no compiten por dinero, sino por la excelencia?»","en":"'What kind of men have you brought us to fight against, who compete not for money but for excellence?'"},"question":{"es":"Según Heródoto, ¿quién dijo esta frase y cuándo?","en":"According to Herodotus, who said this and when?"},"options":[{"es":"Un noble persa ante su general, durante la invasión de Jerjes","en":"A Persian noble to his general, during Xerxes's invasion"},{"es":"Un juez de Olimpia al coronar con olivo a un vencedor del estadio","en":"An Olympic judge crowning a stadion victor with olive"},{"es":"Leónidas ante sus 300 espartanos","en":"Leonidas to his 300 Spartans"},{"es":"Un embajador de Élide en Esparta","en":"An ambassador of Elis in Sparta"}],"answer":0,"explain":{"es":"Unos desertores griegos contaron a los persas que sus compatriotas estaban en Olimpia, en 480 a. C., compitiendo por una simple corona de olivo. Los Juegos no se suspendieron por la guerra.","en":"Some Greek deserters told the Persians that their compatriots were at Olympia, in 480 BC, competing for a mere olive wreath. The Games were not suspended because of the war."}},{"text":{"es":"«…abierto a cualquier griego que quisiera acceder».","en":"'…open to any Greek who wished to enter.'"},"question":{"es":"¿A qué se refiere Heródoto con estas palabras?","en":"What does Herodotus refer to with these words?"},"options":[{"es":"Al santuario de Olimpia","en":"The sanctuary of Olympia"},{"es":"Al gimnasio de Atenas","en":"The gymnasium of Athens"},{"es":"A la ciudadanía espartana","en":"Spartan citizenship"},{"es":"Al palacio de Cnoso","en":"The palace of Knossos"}],"answer":0,"explain":{"es":"Olimpia era de todos los griegos, si bien lo administraba una sola polis, Élide, que controlaba la admisión, fijaba el reglamento y nombraba al personal.","en":"Olympia belonged to all Greeks, although a single polis, Elis, administered it, controlling admission, setting the rules and appointing the staff."}},{"text":{"es":"«Poda para poda… hétoimoi… ápite».","en":"'Poda para poda… hetoimoi… apite.'"},"question":{"es":"¿Qué recogen estas tres voces?","en":"What do these three calls record?"},"options":[{"es":"La salida de las carreras a pie en Olimpia","en":"The start of the foot races at Olympia"},{"es":"El juramento de los atletas ante la estatua de Zeus","en":"The athletes' oath before the statue of Zeus"},{"es":"La proclamación de la tregua","en":"The proclamation of the truce"},{"es":"El final del combate de pancracio","en":"The end of the pankration bout"}],"answer":0,"explain":{"es":"«Pie junto a pie», «¡listos!» y «¡partid!». En Olimpia la salida se daba de viva voz hasta el siglo IV a. C.","en":"'Foot by foot', 'ready!' and 'go!'. At Olympia the start was given by voice until the fourth century BC."}},{"text":{"es":"«Los atletas más bellos».","en":"'The most beautiful athletes.'"},"question":{"es":"¿A quiénes llamaba así Aristóteles?","en":"Whom did Aristotle call this?"},"options":[{"es":"A los pentatletas","en":"The pentathletes"},{"es":"A los pancratistas","en":"The pankratiasts"},{"es":"A los aurigas","en":"The charioteers"},{"es":"A los corredores de dólico","en":"The dolichos runners"}],"answer":0,"explain":{"es":"El pentatlón premiaba la versatilidad, puesto que había que dominar cinco pruebas muy distintas. Filóstrato los llamaba «los mejor proporcionados».","en":"The pentathlon rewarded versatility, since one had to master five very different events. Philostratus called them 'the best proportioned'."}},{"text":{"es":"«Nalgas blancas» y «nalgas oscuras».","en":"'White buttocks' and 'dark buttocks'."},"question":{"es":"¿Qué distinguían los griegos con estas expresiones coloquiales?","en":"What did the Greeks distinguish with these colloquial expressions?"},"options":[{"es":"A los cobardes y poco viriles frente a los valientes","en":"Cowards and the unmanly versus the brave"},{"es":"A los atletas de Esparta frente a los de Atenas y Corinto","en":"Athletes from Sparta versus those from Athens and Corinth"},{"es":"A los esclavos frente a los metecos","en":"Slaves versus metics"},{"es":"A los muchachos frente a los hombres","en":"Boys versus men"}],"answer":0,"explain":{"es":"Como se entrenaba desnudo y al sol, el moreno uniforme delataba a quien disponía de ocio. En la palestra el cuerpo decía a qué grupo pertenecía cada uno.","en":"Because training was done naked and in the sun, an even tan revealed who had leisure. In the palaestra the body told which group each man belonged to."}},{"text":{"es":"«Ato y encadeno los tendones, las partes del cuerpo, la mente y la inteligencia de los corredores para que no tengan fuerza […] y queden en último lugar».","en":"'I bind and chain the tendons, the limbs, the mind and the intelligence of the runners so that they have no strength […] and come last.'"},"question":{"es":"¿De dónde procede este texto?","en":"Where does this text come from?"},"options":[{"es":"De unas tablillas de plomo con maldiciones halladas en Nemea","en":"From lead curse tablets found at Nemea"},{"es":"De la inscripción grabada en la base de uno de los zanes de Olimpia","en":"From the inscription carved on the base of one of the Zanes at Olympia"},{"es":"De una oda de Píndaro","en":"From an ode by Pindar"},{"es":"Del reglamento de los helanódicas","en":"From the rules of the Hellanodikai"}],"answer":0,"explain":{"es":"Son del siglo III a. C. y aparecieron enrolladas y perforadas. Los atletas recurrían a la magia para hechizar a sus rivales antes de la prueba.","en":"They date from the third century BC and were found rolled up and pierced. Athletes resorted to magic to bewitch their rivals before the contest."}},{"text":{"es":"«Verbena, mercado, acróbatas, diversión, ladrones».","en":"'Fair, market, acrobats, fun, thieves.'"},"question":{"es":"¿Qué describía así un comediógrafo ateniense a comienzos del siglo III a. C.?","en":"What did an Athenian comic playwright describe in these words in the early third century BC?"},"options":[{"es":"El ambiente de Olimpia durante los Juegos","en":"The atmosphere at Olympia during the Games"},{"es":"El ágora de Atenas en plena mañana de mercado","en":"The Athenian agora on a busy market morning"},{"es":"El circo de Roma","en":"The circus of Rome"},{"es":"Las Panateneas","en":"The Panathenaia"}],"answer":0,"explain":{"es":"En época helenística los valores fundacionales se debilitaron y el festival ganó aire de espectáculo, un proceso que Roma aceleró.","en":"In the Hellenistic period the founding values weakened and the festival took on the air of a spectacle, a process that Rome accelerated."}}],"t3cards":[{"img":"img/t3/mapa_creta.jpg","caption":{"es":"Creta y sus principales palacios minoicos","en":"Crete and its main Minoan palaces"},"claim":{"es":"Creta tuvo varios palacios a la vez, como Cnoso, Festo o Malia.","en":"Crete had several palaces at the same time, such as Knossos, Phaistos and Malia."},"answer":true,"explain":{"es":"La geografía y el relieve fragmentados de la isla le dieron protección natural y propiciaron la convivencia de varios palacios. Es algo inusual en un territorio tan reducido.","en":"The fragmented geography and relief of the island gave it natural protection and allowed several palaces to coexist. This is unusual in such a small territory."}},{"img":"img/t3/cnoso_reconstruccion.jpg","caption":{"es":"Reconstrucción del palacio de Cnoso, hacia 1750-1450 a. C.","en":"Reconstruction of the palace of Knossos, c. 1750-1450 BC"},"claim":{"es":"Los palacios minoicos estaban rodeados de grandes murallas.","en":"The Minoan palaces were surrounded by great walls."},"answer":false,"explain":{"es":"Se organizaban en torno a un gran patio central y carecían de murallas. Esa ausencia llevó a Evans a imaginar una «Pax Minoica», hipótesis que hoy debe matizarse, puesto que las primeras armas del Egeo son cretenses.","en":"They were arranged around a large central court and had no walls. That absence led Evans to imagine a 'Pax Minoica', a hypothesis that must be qualified today, since the first weapons of the Aegean are Cretan."}},{"img":"img/t3/disco_festo.jpg","caption":{"es":"Disco de Festo, Museo Arqueológico de Heraclión","en":"Phaistos Disc, Heraklion Archaeological Museum"},"claim":{"es":"Las escrituras cretenses nos han dejado textos que describen el deporte minoico.","en":"The Cretan scripts have left us texts that describe Minoan sport."},"answer":false,"explain":{"es":"El jeroglífico cretense y el lineal A siguen sin descifrar, y el lineal B se empleó sobre todo para la contabilidad del palacio. Ninguna de las tres ha dejado un solo texto sobre deporte, de ahí que todo lo que sabemos proceda de imágenes.","en":"Cretan hieroglyphic and Linear A remain undeciphered, and Linear B was used mainly for palace accounting. None of the three has left a single text about sport, which is why everything we know comes from images."}},{"img":"img/t3/fresco_procesion.jpg","caption":{"es":"Fresco de la Procesión, Cnoso, hacia 1450-1350 a. C.","en":"Procession Fresco, Knossos, c. 1450-1350 BC"},"claim":{"es":"En Creta el palacio era también el centro religioso de la comunidad.","en":"In Crete the palace was also the religious centre of the community."},"answer":true,"explain":{"es":"Creta no levantó templos monumentales, de modo que el palacio reunía el culto, la residencia y el almacén en torno a un gran patio central.","en":"Crete built no monumental temples, so the palace brought together worship, residence and storage around a large central court."}},{"img":"img/t3/damas_azul.jpg","caption":{"es":"Damas de azul, palacio de Cnoso, hacia 1600-1450 a. C.","en":"Ladies in Blue, palace of Knossos, c. 1600-1450 BC"},"claim":{"es":"La pintura minoica pinta en blanco a la mujer y en rojo al varón.","en":"Minoan painting depicts women in white and men in red."},"answer":true,"explain":{"es":"Es una convención heredada de Egipto y el código más evidente para reconocer a las mujeres en los frescos.","en":"It is a convention inherited from Egypt and the most obvious code for recognising women in the frescoes."}},{"img":"img/t3/danza_arboleda.jpg","caption":{"es":"Danza en la arboleda sagrada, Cnoso, hacia 1600 a. C.","en":"Dance in the sacred grove, Knossos, c. 1600 BC"},"claim":{"es":"La danza de la arboleda sagrada muestra a mujeres que bailan ante una multitud.","en":"The dance in the sacred grove shows women dancing before a crowd."},"answer":true,"explain":{"es":"Los estudios vinculan este acto al culto a la naturaleza, concebida como divinidad femenina, y a los ritos de iniciación.","en":"Scholars link this act to the worship of nature, conceived as a female deity, and to initiation rites."}},{"img":"img/t3/pescador_akrotiri.jpg","caption":{"es":"Pescador de Akrotiri, Tera, anterior a hacia 1628 a. C.","en":"Fisherman of Akrotiri, Thera, before c. 1628 BC"},"claim":{"es":"El arte minoico representa cuerpos pesados y macizos, propios de la fuerza.","en":"Minoan art depicts heavy, massive bodies built for strength."},"answer":false,"explain":{"es":"Muestra figuras gráciles, estilizadas, de cintura estrecha y dinámicas, como este pescador. Esa visión sugiere que la élite cretense valoraba la agilidad, la destreza y la belleza del cuerpo en acción.","en":"It shows graceful, slender, narrow-waisted and dynamic figures, like this fisherman. That vision suggests that the Cretan elite valued agility, skill and the beauty of the body in action."}},{"img":"img/t3/ninos_pugiles_akrotiri.jpg","caption":{"es":"Fresco de los niños púgiles, Akrotiri, finales del siglo XVII a. C.","en":"Boxing Boys fresco, Akrotiri, late 17th century BC"},"claim":{"es":"Los niños púgiles de Akrotiri llevan un guante en cada mano.","en":"The boxing boys of Akrotiri wear a glove on each hand."},"answer":false,"explain":{"es":"Boxean con un solo guante en la mano derecha, con cinturón y taparrabos, y llevan la cabeza rapada salvo algunos mechones, el peinado de los muchachos de familia privilegiada.","en":"They box with a single glove on the right hand, with a belt and loincloth, and their heads are shaved except for a few locks, the hairstyle of boys from privileged families."}},{"img":"img/t3/ninos_pugiles_akrotiri.jpg","caption":{"es":"Fresco de los niños púgiles, Akrotiri, finales del siglo XVII a. C.","en":"Boxing Boys fresco, Akrotiri, late 17th century BC"},"claim":{"es":"El niño con collar, pulseras y pendientes se lee como el vencedor del combate.","en":"The boy wearing a necklace, bracelets and earrings is read as the winner of the bout."},"answer":true,"explain":{"es":"Su rival viste con sencillez. ¿Qué nos dice esa diferencia? Que el juego marcaba ya la jerarquía entre los hijos de la élite.","en":"His opponent is simply dressed. What does that difference tell us? That the game already marked the hierarchy among the children of the elite."}},{"img":"img/t3/riton_boxeadores.jpg","caption":{"es":"Ritón de los boxeadores, Hagia Triada, hacia 1550-1500 a. C.","en":"Boxer Rhyton, Hagia Triada, c. 1550-1500 BC"},"claim":{"es":"El ritón de Hagia Triada es un vaso de piedra para las libaciones decorado con escenas deportivas.","en":"The Hagia Triada rhyton is a stone vessel for libations decorated with sporting scenes."},"answer":true,"explain":{"es":"Mide unos 46 cm, servía para las ofrendas líquidas a los dioses y es el único vaso de su clase con escenas deportivas que se conserva casi entero.","en":"It is about 46 cm high, was used for liquid offerings to the gods and is the only vessel of its kind with sporting scenes that survives almost complete."}},{"img":"img/t3/riton_boxeadores_bandas.jpg","caption":{"es":"Desarrollo de las cuatro bandas del ritón de Hagia Triada","en":"The four registers of the Hagia Triada rhyton"},"claim":{"es":"Los púgiles del ritón son niños que aprenden a combatir.","en":"The boxers on the rhyton are children learning to fight."},"answer":false,"explain":{"es":"Son adultos, esbeltos pero musculados, con la melena del aristócrata minoico. Sus cascos, guantes, botas y vendajes cambian de una banda a otra, señal de un entrenamiento sistemático con reglas para cada modalidad.","en":"They are adults, slender but muscular, with the long hair of the Minoan aristocrat. Their helmets, gloves, boots and bandages change from one band to another, a sign of systematic training with rules for each discipline."}},{"img":"img/t3/fresco_salto_toro.jpg","caption":{"es":"Fresco del salto del toro, Cnoso, hacia 1450-1375 a. C.","en":"Bull-Leaping Fresco, Knossos, c. 1450-1375 BC"},"claim":{"es":"Casi todas las imágenes de taurocatapsia cretense proceden del palacio de Cnoso.","en":"Almost all images of Cretan bull-leaping come from the palace of Knossos."},"answer":true,"explain":{"es":"Proceden de su fresco y de sus sellos oficiales, de ahí que el salto se convirtiera en emblema del poder de ese centro palacial.","en":"They come from its fresco and its official seals, which is why the leap became the emblem of the power of that palatial centre."}},{"img":"img/t3/fresco_salto_toro.jpg","caption":{"es":"Fresco del salto del toro, Cnoso, hacia 1450-1375 a. C.","en":"Bull-Leaping Fresco, Knossos, c. 1450-1375 BC"},"claim":{"es":"Hoy está demostrado que en Cnoso saltaban mujeres.","en":"It is now proven that women leapt at Knossos."},"answer":false,"explain":{"es":"Nueve de los dieciséis saltadores conservados tienen la piel blanca, si bien otras hipótesis leen ese color como una marca de edad o de función social entre varones. La presencia de mujeres no puede afirmarse ni descartarse.","en":"Nine of the sixteen surviving leapers have white skin, although other hypotheses read that colour as a mark of age or social role among men. The presence of women can be neither affirmed nor ruled out."}},{"img":"img/t3/salto_toro_secuencia.jpg","caption":{"es":"Reconstrucción del salto del toro","en":"Reconstruction of the bull-leap"},"claim":{"es":"Evans reconstruyó un salto que empezaba agarrando los cuernos del toro.","en":"Evans reconstructed a leap that began by grasping the bull's horns."},"answer":true,"explain":{"es":"Según Evans (1930), el saltador aprovechaba la embestida para tomar impulso. Younger (1995) propuso después que el salto más frecuente fuera en picado.","en":"According to Evans (1930), the leaper used the bull's charge to gain momentum. Younger (1995) later proposed that the most frequent leap was the diving leap."}},{"img":"img/t3/saltador_marfil.jpg","caption":{"es":"Saltador de marfil del palacio de Cnoso, hacia 1750-1450 a. C.","en":"Ivory leaper from the palace of Knossos, c. 1750-1450 BC"},"claim":{"es":"Según Younger (1995), el salto en picado es el esquema más frecuente del salto del toro.","en":"According to Younger (1995), the diving leap is the most frequent scheme of bull-leaping."},"answer":true,"explain":{"es":"Reúne una treintena de ejemplos frente a las pocas imágenes, más antiguas, que encajan con la reconstrucción de Evans.","en":"He gathers some thirty examples against the few, older images that fit Evans's reconstruction."}},{"img":"img/t3/acrobata_toro_bronce.jpg","caption":{"es":"Acróbata sobre un toro, bronce, hacia 1600-1450 a. C. (British Museum)","en":"Acrobat on a bull, bronze, c. 1600-1450 BC (British Museum)"},"claim":{"es":"En el salto en picado el saltador terminaba sentado sobre el lomo del toro.","en":"In the diving leap the leaper ended up sitting on the bull's back."},"answer":false,"explain":{"es":"Tras apoyar las manos en los hombros del animal y arquear el cuerpo, daba una voltereta hacia atrás y caía de pie detrás del toro.","en":"After placing his hands on the animal's shoulders and arching his body, he made a backward somersault and landed on his feet behind the bull."}},{"img":"img/t3/tazas_vafio.jpg","caption":{"es":"Tazas de oro de Vafio (Laconia), hacia 1750-1450 a. C.","en":"Gold cups from Vapheio (Laconia), c. 1750-1450 BC"},"claim":{"es":"Las tazas de Vafio muestran la captura de toros con una red y con una vaca como señuelo.","en":"The Vapheio cups show bulls being captured with a net and with a cow as a decoy."},"answer":true,"explain":{"es":"El salto era solo la parte más vistosa de un ciclo que empezaba con la captura del toro, una empresa colectiva y peligrosa.","en":"The leap was only the most spectacular part of a cycle that began with the capture of the bull, a collective and dangerous undertaking."}},{"img":"img/t3/tazas_vafio_dibujo.jpg","caption":{"es":"Dibujo de los frisos de las tazas de Vafio","en":"Drawing of the friezes of the Vapheio cups"},"claim":{"es":"Las imágenes minoicas unen el salto con la muerte del toro.","en":"Minoan images link the leap with the death of the bull."},"answer":false,"explain":{"es":"Se especula con que la taurocatapsia terminara en el sacrificio y el banquete, si bien las imágenes minoicas no unen el salto con la muerte del animal.","en":"It has been speculated that bull-leaping ended in sacrifice and a banquet, although Minoan images do not link the leap with the animal's death."}},{"img":"img/t3/riton_cabeza_toro.jpg","caption":{"es":"Ritón en forma de cabeza de toro, Pequeño Palacio de Cnoso, hacia 1550-1500 a. C.","en":"Bull's-head rhyton, Little Palace of Knossos, c. 1550-1500 BC"},"claim":{"es":"Las cuatro lecturas del salto del toro se excluyen entre sí.","en":"The four readings of bull-leaping are mutually exclusive."},"answer":false,"explain":{"es":"El salto pudo ser, a la vez y en el mismo acto, ofrenda a los dioses, paso a la edad adulta, emblema del palacio y exhibición de destreza ante la comunidad.","en":"The leap could be, at once and in the same act, an offering to the gods, a passage to adulthood, an emblem of the palace and a display of skill before the community."}},{"img":"img/t3/patio_gradas_minoico.jpg","caption":{"es":"Patio y graderío del palacio de Festo, Creta","en":"Court and stepped area of the palace of Phaistos, Crete"},"claim":{"es":"Festo tenía un área teatral con una grada para espectadores en pie.","en":"Phaistos had a theatral area with steps for standing spectators."},"answer":true,"explain":{"es":"La grada tiene nueve escalones. Sea cual sea el lugar del salto, el deporte cretense tenía vocación de espectáculo público ligado a los centros del poder.","en":"The steps number nine. Wherever the leap took place, Cretan sport was meant as a public spectacle tied to the centres of power."}},{"img":"img/t3/caldera_santorini.jpg","caption":{"es":"Caldera de Santorini, la antigua Tera","en":"Caldera of Santorini, ancient Thera"},"claim":{"es":"La erupción del volcán de Tera acabó de inmediato con los palacios cretenses.","en":"The eruption of the Thera volcano immediately ended the Cretan palaces."},"answer":false,"explain":{"es":"La erupción se produjo hacia 1628 a. C., unos ciento cincuenta años antes del final de los palacios. Cubrió de ceniza el este de la isla, pero Creta se rehízo y llegó próspera a su última etapa.","en":"The eruption took place c. 1628 BC, some 150 years before the end of the palaces. It covered the east of the island with ash, but Crete recovered and reached its last stage in prosperity."}},{"img":"img/t3/sala_trono_cnoso.jpg","caption":{"es":"Sala del trono del palacio de Cnoso","en":"Throne room of the palace of Knossos"},"claim":{"es":"Hacia 1450-1375 a. C. Cnoso fue el único palacio de Creta, en manos de los micénicos.","en":"C. 1450-1375 BC Knossos was the only palace in Crete, in the hands of the Mycenaeans."},"answer":true,"explain":{"es":"Durante esos setenta y cinco años la taurocatapsia siguió practicándose bajo dominio micénico, hasta que el palacio ardió hacia 1375 a. C.","en":"During those seventy-five years bull-leaping continued under Mycenaean rule, until the palace burned c. 1375 BC."}},{"img":"img/t3/enocoe_dipilon.jpg","caption":{"es":"Enócoe del Dipilón, Atenas, hacia 740-725 a. C.","en":"Dipylon oinochoe, Athens, c. 740-725 BC"},"claim":{"es":"La enócoe del Dipilón lleva una inscripción que la declara premio de un concurso de baile.","en":"The Dipylon oinochoe bears an inscription declaring it the prize of a dancing contest."},"answer":true,"explain":{"es":"Es una de las inscripciones griegas más antiguas, escrita con el alfabeto tomado de los fenicios, y premia al mejor bailarín.","en":"It is one of the oldest Greek inscriptions, written in the alphabet taken from the Phoenicians, and rewards the best dancer."}},{"img":"img/t3/fresco_guerreros_carro.jpg","caption":{"es":"Fresco micénico con guerreros en carro, siglo XIII a. C.","en":"Mycenaean fresco with warriors in a chariot, 13th century BC"},"claim":{"es":"En el mundo micénico el carro y la caza del jabalí estaban reservados al señor.","en":"In the Mycenaean world the chariot and the boar hunt were reserved for the lord."},"answer":true,"explain":{"es":"El pugilato, en cambio, quedaba a cargo de púgiles pagados que animaban los banquetes y los funerales del señor.","en":"Boxing, by contrast, was left to paid boxers who entertained at the lord's banquets and funerals."}},{"img":"img/t3/mapa_grecia_arcaica.jpg","caption":{"es":"El mundo griego en época arcaica, con Olimpia y Élide","en":"The Greek world in the Archaic period, with Olympia and Elis"},"claim":{"es":"Grecia fue un Estado unificado con capital en Olimpia.","en":"Greece was a unified state with its capital at Olympia."},"answer":false,"explain":{"es":"Grecia nunca fue un Estado unificado. Sus cientos de poleis compartían lengua, dioses y santuarios, y Olimpia, en el territorio de Élide, era de todos los griegos aunque la gobernara Élide.","en":"Greece was never a unified state. Its hundreds of poleis shared language, gods and sanctuaries, and Olympia, in the territory of Elis, belonged to all Greeks although Elis governed it."}},{"img":"img/t3/copa_atleta_pozo.jpg","caption":{"es":"Copa ática con atleta sacando agua de un pozo, hacia 500-470 a. C.","en":"Attic cup with an athlete drawing water from a well, c. 500-470 BC"},"claim":{"es":"Hacia 500 a. C. la mayoría de los habitantes de Atenas eran ciudadanos varones adultos.","en":"C. 500 BC most of the inhabitants of Athens were adult male citizens."},"answer":false,"explain":{"es":"De unos 175.000 habitantes, solo unos 25.000 eran ciudadanos varones adultos. La ley distinguía además entre ciudadanos, metecos y esclavos, y a estos últimos les vedaba el deporte.","en":"Of some 175,000 inhabitants, only about 25,000 were adult male citizens. The law also distinguished citizens, metics and slaves, and barred the last from sport."}},{"img":"img/t3/fronton_oriental_zeus.jpg","caption":{"es":"Frontón oriental del templo de Zeus, Olimpia, mediados del siglo V a. C.","en":"East pediment of the temple of Zeus, Olympia, mid-5th century BC"},"claim":{"es":"El frontón muestra los preparativos de la carrera de carros de Pélope y Enómao.","en":"The pediment shows the preparations for the chariot race of Pelops and Oinomaos."},"answer":true,"explain":{"es":"Pélope gana la carrera al rey de Pisa. Los griegos veneraron después como su tumba el túmulo prehistórico junto al que nació el santuario, aunque ese culto solo se organizó hacia 600 a. C.","en":"Pelops wins the race against the king of Pisa. The Greeks later venerated as his tomb the prehistoric tumulus beside which the sanctuary arose, although that cult was only organised c. 600 BC."}},{"img":"img/t3/tumulo_prehistorico.jpg","caption":{"es":"Ejemplo de túmulo prehistórico griego","en":"Example of a prehistoric Greek tumulus"},"claim":{"es":"El túmulo que los griegos veneraban como tumba de Pélope era de época micénica.","en":"The tumulus the Greeks venerated as the tomb of Pelops dated from the Mycenaean period."},"answer":false,"explain":{"es":"Era prehistórico, de mediados del III milenio a. C. De los relatos de fundación solo es cierto el escenario.","en":"It was prehistoric, from the middle of the third millennium BC. Of the foundation stories only the setting is true."}},{"img":"img/t3/olimpia_reconstruccion.jpg","caption":{"es":"Reconstrucción del santuario de Olimpia en su máximo esplendor","en":"Reconstruction of the sanctuary of Olympia at its height"},"claim":{"es":"El primer estadio de Olimpia se levantó siglos después de iniciarse el culto a Zeus.","en":"The first stadium at Olympia was built centuries after the cult of Zeus began."},"answer":true,"explain":{"es":"El culto empieza a finales del siglo XI a. C. y el primer estadio se levantó hacia 700 a. C. Primero fue el rito y al final el certamen atlético.","en":"The cult begins at the end of the 11th century BC and the first stadium was built c. 700 BC. First came the rite and, last, the athletic contest."}},{"img":"img/t3/palestra_olimpia.jpg","caption":{"es":"Restos de una palestra con pórticos","en":"Remains of a palaestra with porticoes"},"claim":{"es":"Las palestras eran espacios rectangulares con una explanada central rodeada de pórticos.","en":"Palaestrae were rectangular spaces with a central open area surrounded by porticoes."},"answer":true,"explain":{"es":"Eran espacios sobrios, con pórticos en sus cuatro costados, dedicados sobre todo a los deportes de combate, mientras el gimnasio acogía las disciplinas atléticas.","en":"They were plain spaces with porticoes on all four sides, used mainly for combat sports, while the gymnasium housed the athletic disciplines."}},{"img":"img/t3/pentatleta_entrenando.jpg","caption":{"es":"Pentatleta entrenando la jabalina, hacia 510-500 a. C. (Boston)","en":"Pentathlete training with the javelin, c. 510-500 BC (Boston)"},"claim":{"es":"Una ley atribuida a Solón permitía a los esclavos entrenar en el gimnasio si pagaban al paidotriba.","en":"A law attributed to Solon allowed slaves to train in the gymnasium if they paid the trainer."},"answer":false,"explain":{"es":"La ley prohibía a los esclavos ejercitarse en el gimnasio y untarse de aceite en las palestras bajo pena de 50 azotes. Según Plutarco, así situaba la gimnasia entre las prácticas honorables.","en":"The law forbade slaves to exercise in the gymnasium and to anoint themselves with oil in the palaestrae on pain of 50 lashes. According to Plutarch, it thus placed gymnastics among honourable practices."}},{"img":"img/t3/milon_crotona_puget.jpg","caption":{"es":"Milón de Crotona por P. Puget (Louvre)","en":"Milo of Croton by P. Puget (Louvre)"},"claim":{"es":"Según una tradición, el luchador Milón de Crotona comía veinte libras de carne al día.","en":"According to one tradition, the wrestler Milo of Croton ate twenty pounds of meat a day."},"answer":true,"explain":{"es":"Unos 9 kg de carne y otros tantos de pan. El mito del atleta glotón se extendió cuando, hacia 500 a. C., se impuso una dieta abundante en carne.","en":"About 9 kg of meat and as much bread. The myth of the gluttonous athlete spread when, c. 500 BC, a meat-rich diet became the norm."}},{"img":"img/t3/corredores_perizoma.jpg","caption":{"es":"Corredores con perizoma, vaso ático de figuras negras","en":"Runners wearing the perizoma, Attic black-figure vase"},"claim":{"es":"En las primeras ediciones de los Juegos los atletas competían con perizoma.","en":"In the first editions of the Games athletes competed wearing the perizoma."},"answer":true,"explain":{"es":"El perizoma era una pequeña túnica atada a modo de cinturón o taparrabos.","en":"The perizoma was a small tunic tied like a belt or loincloth."}},{"img":"img/t3/corredores_desnudos.jpg","caption":{"es":"Corredores desnudos, vaso ático de figuras negras","en":"Naked runners, Attic black-figure vase"},"claim":{"es":"Tras correr Orsipo desnudo en 720 a. C., la desnudez se impuso de inmediato.","en":"After Orsippos ran naked in 720 BC, nudity became the rule at once."},"answer":false,"explain":{"es":"Orsipo de Mégara inició un cambio que tardó más de un siglo en generalizarse y que se mantuvo hasta el final del olimpismo, salvo en las pruebas hípicas.","en":"Orsippos of Megara began a change that took more than a century to become general and lasted until the end of the Games, except in the equestrian events."}},{"img":"img/t3/psicter_oltos.jpg","caption":{"es":"Psictér atribuido a Oltos, hacia 520-510 a. C. (Nueva York)","en":"Psykter attributed to Oltos, c. 520-510 BC (New York)"},"claim":{"es":"En Olimpia el vencedor recibía ánforas de aceite y dinero.","en":"At Olympia the victor received amphorae of oil and money."},"answer":false,"explain":{"es":"El santuario solo daba una corona de olivo. Las recompensas materiales llegaban después, de su ciudad o de otros juegos.","en":"The sanctuary gave only an olive wreath. Material rewards came later, from his city or from other games."}},{"img":"img/t3/anfora_panatenaica.jpg","caption":{"es":"Ánfora panatenaica con corredores, hacia 480-460 a. C.","en":"Panathenaic amphora with runners, c. 480-460 BC"},"claim":{"es":"En las Panateneas el vencedor del estadio recibía probablemente 80 ánforas de aceite.","en":"At the Panathenaia the winner of the stadion probably received 80 amphorae of oil."},"answer":true,"explain":{"es":"Unos 2.900 litros, por valor de unas 1.247 dracmas, más de un año de jornal de un artesano cualificado.","en":"Some 2,900 litres, worth about 1,247 drachmas, more than a year's wages of a skilled craftsman."}},{"img":"img/t3/estadio_olimpia.jpg","caption":{"es":"Estadio de Olimpia, estado de hacia 350 a. C.","en":"Stadium of Olympia, state of c. 350 BC"},"claim":{"es":"El estadio de Olimpia tenía gradas de piedra para todo el público.","en":"The stadium of Olympia had stone stands for the whole crowd."},"answer":false,"explain":{"es":"Olimpia no tuvo gradas de piedra. El público seguía las carreras de pie o sobre la hierba de los taludes, y solo los jueces y la sacerdotisa de Deméter Cámine tenían asiento fijo.","en":"Olympia had no stone stands. The crowd watched the races standing or on the grass of the embankments, and only the judges and the priestess of Demeter Chamyne had fixed seats."}},{"img":"img/t3/balbis_olimpia.jpg","caption":{"es":"Balbís, línea de salida del estadio de Olimpia","en":"Balbis, starting line of the stadium of Olympia"},"claim":{"es":"La balbís era el umbral de piedra de la salida, con dos ranuras para encajar los dedos de los pies.","en":"The balbis was the stone starting sill, with two grooves for the toes."},"answer":true,"explain":{"es":"El corredor se colocaba descalzo y de pie, con un pie algo adelantado y los brazos extendidos, una postura muy distinta de la del velocista actual.","en":"The runner stood barefoot and upright, with one foot slightly forward and arms outstretched, a posture very different from that of today's sprinter."}},{"img":"img/t3/hysplex_reconstruccion.jpg","caption":{"es":"Reconstrucción del hýsplex","en":"Reconstruction of the hysplex"},"claim":{"es":"El hýsplex era una barrera de cuerdas que caía a la vez ante todos los corredores.","en":"The hysplex was a barrier of ropes that dropped at the same moment in front of all the runners."},"answer":true,"explain":{"es":"Se ideó para que la salida no dependiera del ojo del juez. Quien se adelantaba cometía una salida falsa y era azotado en público.","en":"It was devised so that the start would not depend on the judge's eye. Anyone who went early made a false start and was publicly flogged."}},{"img":"img/t3/saltador_halteras.jpg","caption":{"es":"Saltador con halteras en una copa de figuras rojas","en":"Jumper with halteres on a red-figure cup"},"claim":{"es":"Los saltadores griegos usaban pesos de piedra, plomo o bronce llamados halteras.","en":"Greek jumpers used weights of stone, lead or bronze called halteres."},"answer":true,"explain":{"es":"Pesaban de 1,4 a 4,5 kg. Según Minetti y Ardigò (2002), un par de 5 a 6 kg alarga al menos 17 cm un salto de 3 metros sin carrera.","en":"They weighed 1.4 to 4.5 kg. According to Minetti and Ardigò (2002), a pair of 5 to 6 kg lengthens a 3-metre standing jump by at least 17 cm."}},{"img":"img/t3/ankyle_lanzamiento.jpg","caption":{"es":"Lanzamiento de jabalina con la ankýle","en":"Javelin throw with the ankyle"},"claim":{"es":"La ankýle era una correa de cuero que hacía girar la jabalina y alargaba el tiro.","en":"The ankyle was a leather thong that made the javelin spin and lengthened the throw."},"answer":true,"explain":{"es":"Medía de 30 a 45 cm y se enrollaba en el asta. Solo valían los tiros en los que la jabalina se clavaba en el suelo.","en":"It was 30 to 45 cm long and wound round the shaft. Only throws in which the javelin stuck in the ground were valid."}},{"img":"img/t3/disco_asclepiades.jpg","caption":{"es":"Disco de Publio Asclepíades, 241 d. C., Olimpia","en":"Discus of Publius Asclepiades, AD 241, Olympia"},"claim":{"es":"En Olimpia cada atleta lanzaba su propio disco.","en":"At Olympia each athlete threw his own discus."},"answer":false,"explain":{"es":"En cada prueba todos lanzaban el mismo disco el mismo día. Un viajero griego del siglo II d. C. vio en Olimpia los tres discos del pentatlón.","en":"In each contest everyone threw the same discus on the same day. A Greek traveller of the second century AD saw the three pentathlon discuses at Olympia."}},{"img":"img/t3/pugil_rendicion.jpg","caption":{"es":"Púgil que levanta el índice en señal de rendición, hacia 500 a. C.","en":"Boxer raising his index finger in surrender, c. 500 BC"},"claim":{"es":"En el pugilato el combatiente levantaba el dedo índice para abandonar.","en":"In boxing a fighter raised his index finger to concede."},"answer":true,"explain":{"es":"No había asaltos ni descansos, y el combate seguía hasta que uno quedaba incapacitado o se rendía con ese gesto.","en":"There were no rounds or breaks, and the fight went on until one man was incapacitated or surrendered with that gesture."}},{"img":"img/t3/caestus_dibujo.jpg","caption":{"es":"Representación del caestus romano","en":"Depiction of the Roman caestus"},"claim":{"es":"El caestus, reforzado con plomo y hierro, es el guante de los primeros pugilatos olímpicos.","en":"The caestus, reinforced with lead and iron, is the glove of the first Olympic boxing bouts."},"answer":false,"explain":{"es":"Los primeros púgiles se enrollaban las manos con himantes, tiras de cuero. Las correas duras llegaron a mediados del siglo IV a. C. y el caestus en época romana.","en":"The first boxers wrapped their hands with himantes, leather thongs. Hard thongs arrived in the mid-fourth century BC and the caestus in the Roman period."}},{"img":"img/t3/pancratistas_juez.jpg","caption":{"es":"Pancratistas y juez con la vara, hacia 500 a. C. (Nueva York)","en":"Pankratiasts and judge with his rod, c. 500 BC (New York)"},"claim":{"es":"En el pancracio de Olimpia estaba permitido morder al rival.","en":"In the pankration at Olympia biting the opponent was allowed."},"answer":false,"explain":{"es":"Morder y meter los dedos en los ojos eran las únicas prohibiciones en Olimpia, aunque, según Filóstrato, los espartanos lo permitían en su tierra.","en":"Biting and gouging the eyes were the only prohibitions at Olympia, although, according to Philostratus, the Spartans allowed them at home."}},{"img":"img/t3/cuadrigas_museo_britanico.jpg","caption":{"es":"Carrera de cuadrigas, hacia 410-400 a. C. (Museo Británico)","en":"Four-horse chariot race, c. 410-400 BC (British Museum)"},"claim":{"es":"En las pruebas hípicas la corona de olivo era para el auriga.","en":"In the equestrian events the olive wreath went to the charioteer."},"answer":false,"explain":{"es":"La corona era para el dueño de las monturas. Por eso hubo mujeres campeonas olímpicas, como la princesa espartana Cinisca, que ganó la cuadriga en 396 a. C.","en":"The wreath went to the owner of the horses. That is why there were female Olympic champions, such as the Spartan princess Kyniska, who won the four-horse chariot race in 396 BC."}},{"img":"img/t3/mujer_quiton.jpg","caption":{"es":"Mujer con quitón, escultura griega (Musei Capitolini)","en":"Woman in a chiton, Greek sculpture (Musei Capitolini)"},"claim":{"es":"En la polis la maternidad y la casa familiar delimitaban casi por completo el papel de la mujer libre.","en":"In the polis motherhood and the household almost entirely defined the role of the free woman."},"answer":true,"explain":{"es":"Carecía de derechos políticos y pertenecía a la comunidad como madre y esposa. Esparta constituía la excepción en el deporte femenino.","en":"She had no political rights and belonged to the community as mother and wife. Sparta was the exception in women's sport."}},{"img":"img/t3/zanes.jpg","caption":{"es":"Reconstrucción de los zanes","en":"Reconstruction of the Zanes"},"claim":{"es":"Los zanes eran estatuas de Zeus pagadas con las multas de los infractores.","en":"The Zanes were statues of Zeus paid for with the fines of offenders."},"answer":true,"explain":{"es":"Se levantaban junto a la entrada del estadio y su pedestal llevaba grabado el nombre del infractor. Los seis primeros se pagaron en 388 a. C. por un soborno en el pugilato.","en":"They stood by the entrance to the stadium and their pedestal bore the offender's name. The first six were paid for in 388 BC because of a bribe in boxing."}},{"img":"img/t3/tablilla_maldicion.jpg","caption":{"es":"Tablillas de plomo con maldiciones, Nemea, siglo III a. C.","en":"Lead curse tablets, Nemea, third century BC"},"claim":{"es":"Algunos atletas grababan maldiciones contra sus rivales en tablillas de plomo.","en":"Some athletes inscribed curses against their rivals on lead tablets."},"answer":true,"explain":{"es":"Las de Nemea aparecieron enrolladas y perforadas, y piden que los corredores no tengan fuerza y queden en último lugar.","en":"Those from Nemea were found rolled up and pierced, and ask that the runners have no strength and come last."}},{"img":"img/t3/busto_neron.jpg","caption":{"es":"Busto de Nerón (Musei Capitolini)","en":"Bust of Nero (Musei Capitolini)"},"claim":{"es":"Nerón terminó la carrera del carro de diez caballos y ganó en buena lid.","en":"Nero finished the ten-horse chariot race and won fairly."},"answer":false,"explain":{"es":"Se cayó del carro y no terminó la carrera, y aun así fue proclamado vencedor tras pagar con generosidad a los jueces. Tras su muerte, Élide borró aquella Olimpiada de sus registros.","en":"He fell from the chariot and did not finish the race, yet he was proclaimed victor after paying the judges generously. After his death, Elis struck that Olympiad from its records."}},{"img":"img/t3/ninfeo_herodes.jpg","caption":{"es":"Ninfeo de Herodes Ático, Olimpia, hacia 150 d. C.","en":"Nymphaeum of Herodes Atticus, Olympia, c. AD 150"},"claim":{"es":"Bajo Roma, Olimpia vivió su máximo apogeo arquitectónico mientras declinaba su deporte.","en":"Under Rome, Olympia reached its architectural peak while its sport declined."},"answer":true,"explain":{"es":"Herodes Ático costeó un acueducto con su fuente monumental hacia 150, y hacia 170 el santuario alcanzó su máximo esplendor constructivo.","en":"Herodes Atticus paid for an aqueduct with its monumental fountain c. AD 150, and by c. AD 170 the sanctuary reached its greatest architectural splendour."}},{"img":"img/t3/atleta_mosaico_caracalla.jpg","caption":{"es":"Atleta, mosaico de las termas de Caracalla, siglo III d. C.","en":"Athlete, mosaic from the Baths of Caracalla, third century AD"},"claim":{"es":"Desde finales del siglo V a. C. aparece el atleta profesional, que vive de sus premios.","en":"From the late fifth century BC the professional athlete appears, living off his prizes."},"answer":true,"explain":{"es":"Para Durántez (2010), la decadencia de Olimpia empezó antes de la llegada de Roma, y con el profesional llegaron los fraudes.","en":"For Durántez (2010), the decline of Olympia began before the arrival of Rome, and frauds came with the professional athlete."}}],"t4quiz":[{"q":{"es":"¿Cuál es la fuente principal para conocer el deporte etrusco?","en":"What is the main source for our knowledge of Etruscan sport?"},"options":[{"es":"Las imágenes, sobre todo las pinturas de las tumbas","en":"The images, above all the tomb paintings"},{"es":"Los textos griegos y latinos que describen sus juegos","en":"The Greek and Latin texts that describe their games"},{"es":"Los tratados etruscos sobre educación física","en":"Etruscan treatises on physical education"},{"es":"Las inscripciones que recogen los nombres de los vencedores","en":"The inscriptions recording the names of the victors"}],"answer":0,"explain":{"es":"Los etruscos no dejaron ningún texto sobre sus juegos, de modo que su deporte se conoce desde fuera, por unos pocos textos griegos y latinos, por algunas inscripciones escasas y, sobre todo, por las imágenes, que son la fuente principal.","en":"The Etruscans left no text about their games, so their sport is known from the outside, from a few Greek and Latin texts, from a handful of inscriptions and, above all, from images, which are the main source."}},{"q":{"es":"¿Qué representan, según coinciden los estudios, las pinturas de juegos de las tumbas etruscas?","en":"What do the paintings of games in Etruscan tombs depict, as studies agree?"},"options":[{"es":"Los juegos funerarios celebrados en honor del noble difunto","en":"The funeral games held in honour of the noble deceased"},{"es":"Los entrenamientos de los jóvenes de la aristocracia en el gimnasio","en":"The training of aristocratic youths in the gymnasium"},{"es":"Los festivales griegos a los que acudían los etruscos","en":"The Greek festivals that the Etruscans attended"},{"es":"Los juegos de los banquetes de la élite","en":"The games played at the banquets of the elite"}],"answer":0,"explain":{"es":"Se trata de los juegos funerarios en honor del noble que ocupa la tumba, como los de los funerales de Patroclo en la Ilíada, y pintarlos en la pared servía para que el rito se repitiera para siempre y prolongara su eficacia.","en":"They are the funeral games in honour of the noble who occupies the tomb, like those at the funeral of Patroclus in the Iliad, and painting them on the wall ensured that the rite was repeated for ever and prolonged its efficacy."}},{"q":{"es":"¿Qué papel tenía la mujer etrusca en los eventos deportivos que muestran las pinturas?","en":"What role did the Etruscan woman play in the sporting events shown in the paintings?"},"options":[{"es":"Asistía como espectadora, sentada junto a los hombres","en":"She attended as a spectator, seated alongside the men"},{"es":"Competía en el pugilato y en la carrera junto a los hombres","en":"She competed in boxing and running alongside the men"},{"es":"Presenciaba las carreras desde un lugar apartado de las gradas","en":"She watched the races from a place set apart from the stands"},{"es":"Dirigía las competiciones como juez","en":"She ran the competitions as a judge"}],"answer":0,"explain":{"es":"La Tumba de las Bigas de Tarquinia muestra a los espectadores nobles, hombres y mujeres mezclados, en gradas de madera cubiertas con toldos, y en las pinturas nunca se ve a la mujer disputando una competición, por lo que no consta que practicara el deporte reglado.","en":"The Tomb of the Bigae at Tarquinia shows the noble spectators, men and women together, on wooden stands covered with awnings, and in the paintings the woman is never seen taking part in a competition, so there is no evidence that she competed in organised sport."}},{"q":{"es":"¿Por qué se parecen tanto las escenas deportivas etruscas a las de los grandes festivales griegos?","en":"Why do Etruscan sporting scenes so closely resemble those of the great Greek festivals?"},"options":[{"es":"Porque el deporte griego llegó a Italia por el sur, con las colonias y el comercio","en":"Because Greek sport reached Italy from the south, with the colonies and trade"},{"es":"Porque los etruscos conquistaron las ciudades griegas del sur de Italia","en":"Because the Etruscans conquered the Greek cities of southern Italy"},{"es":"Porque Roma transmitió a Etruria el programa de los juegos griegos","en":"Because Rome passed on the programme of the Greek games to Etruria"},{"es":"Porque los atletas etruscos competían habitualmente en Olimpia","en":"Because Etruscan athletes regularly competed at Olympia"}],"answer":0,"explain":{"es":"Desde mediados del siglo VIII a. C. los griegos fundaron ciudades en el sur de Italia y en Sicilia, donde se entrenaba y se competía como en Grecia, y con el comercio llegaron objetos como las ánforas panatenaicas, que abundan en las tumbas etruscas como un lujo importado.","en":"From the mid-8th century BC the Greeks founded cities in southern Italy and in Sicily, where people trained and competed as in Greece, and objects such as Panathenaic amphorae arrived with trade and abound in Etruscan tombs as an imported luxury."}},{"q":{"es":"¿Quién presenciaba las carreras de carros etruscas y qué exhibía la carrera?","en":"Who watched Etruscan chariot races, and what did the race display?"},"options":[{"es":"La aristocracia, y la carrera exhibía la riqueza de quien la costeaba","en":"The aristocracy, and the race displayed the wealth of whoever paid for it"},{"es":"El pueblo llano, y la carrera exhibía la generosidad de los magistrados","en":"The common people, and the race displayed the generosity of the magistrates"},{"es":"Los sacerdotes, y la carrera exhibía la devoción a los dioses","en":"The priests, and the race displayed devotion to the gods"},{"es":"Los mercaderes de la costa, y la carrera exhibía el éxito de su comercio","en":"The merchants of the coast, and the race displayed the success of their trade"}],"answer":0,"explain":{"es":"Mantener caballos y aurigas era muy caro, de ahí que la carrera exhibiera ante un público formado por la aristocracia la riqueza de quien la costeaba.","en":"Keeping horses and charioteers was very expensive, which is why the race displayed to an audience made up of the aristocracy the wealth of whoever paid for it."}},{"q":{"es":"¿Qué recibió Roma, ante todo, del deporte etrusco?","en":"What did Rome receive above all from Etruscan sport?"},"options":[{"es":"La preferencia de la nobleza por mirar mientras competían profesionales a sueldo","en":"The nobility's preference for watching while paid professionals competed"},{"es":"La costumbre de que los nobles compitieran en persona para ganar prestigio","en":"The custom of nobles competing in person to win prestige"},{"es":"La organización de los festivales por ciudades que se turnaban cada cuatro años","en":"The organisation of festivals by cities taking turns every four years"},{"es":"La educación física obligatoria de los jóvenes de la élite","en":"The compulsory physical education of elite youths"}],"answer":0,"explain":{"es":"En Etruria miraba la aristocracia y la competición recaía en profesionales a sueldo, y las élites romanas heredaron esa posición porque compartían el sentimiento de vergüenza de actuar ante el público como atletas profesionales (Thuillier, 2013).","en":"In Etruria the aristocracy watched and the competing fell to paid professionals, and the Roman elites inherited that position because they shared the sense of shame at performing before the public as professional athletes (Thuillier, 2013)."}},{"q":{"es":"¿Cómo se organizaron políticamente los etruscos?","en":"How were the Etruscans organised politically?"},"options":[{"es":"En doce ciudades-estado, sin llegar a formar un Estado unitario","en":"In twelve city-states, without ever forming a unitary state"},{"es":"En un reino unitario con capital en Tarquinia","en":"In a unitary kingdom with its capital at Tarquinia"},{"es":"En una república con dos cónsules elegidos cada año","en":"In a republic with two consuls elected every year"},{"es":"En una confederación de colonias griegas del sur de Italia","en":"In a confederation of Greek colonies in southern Italy"}],"answer":0,"explain":{"es":"Las doce ciudades-estado se gobernaron primero por reyes o grandes señores y después por magistrados salidos de la aristocracia, lo que dio lugar a una sociedad muy polarizada, probablemente sin clases medias.","en":"The twelve city-states were governed first by kings or great lords and later by magistrates drawn from the aristocracy, hence a highly polarised society, probably without middle classes."}},{"q":{"es":"Una vez desaparecidas las asambleas en el siglo I d. C., ¿dónde podía hacerse oír el pueblo?","en":"Once the assemblies had disappeared in the 1st century AD, where could the people make itself heard?"},"options":[{"es":"En el circo, el teatro y el anfiteatro","en":"In the circus, the theatre and the amphitheatre"},{"es":"En el Senado, por medio de los tribunos de la plebe","en":"In the Senate, through the tribunes of the plebs"},{"es":"En las elecciones anuales de los magistrados","en":"In the annual elections of the magistrates"},{"es":"En el consejo local de cada ciudad","en":"In the local council of each city"}],"answer":0,"explain":{"es":"Con Augusto los magistrados pasaron a ser elegidos por el Senado y las asambleas desaparecieron, y así el pueblo dejó de votar y solo pudo hacerse oír en los lugares de espectáculo (Woolf, 2012).","en":"Under Augustus the magistrates came to be elected by the Senate and the assemblies disappeared, so the people stopped voting and could make itself heard only in the venues of spectacle (Woolf, 2012)."}},{"q":{"es":"¿Para qué usaba el derecho la frontera que separaba a los poderosos de los humildes?","en":"What did the law use the boundary between the powerful and the humble for?"},"options":[{"es":"Para graduar las penas, de modo que los castigos más crueles se reservaban a los humildes","en":"To grade punishments, so that the cruellest penalties were reserved for the humble"},{"es":"Para repartir los asientos de los teatros y anfiteatros","en":"To allocate seats in the theatres and amphitheatres"},{"es":"Para decidir quién podía votar en las asambleas","en":"To decide who could vote in the assemblies"},{"es":"Para fijar quién debía pagar los juegos","en":"To determine who had to pay for the games"}],"answer":0,"explain":{"es":"Los castigos más crueles, como la muerte ante las fieras, se reservaban a los humildes, entre los cuales el grupo más numeroso era la plebe, formada por los ciudadanos libres sin fortuna.","en":"The cruellest penalties, such as death before the wild beasts, were reserved for the humble, among whom the largest group was the plebs, made up of free citizens without fortune."}},{"q":{"es":"¿Por qué los textos romanos sobre los espectáculos se contrastan con las inscripciones y las imágenes?","en":"Why are Roman texts on the spectacles checked against inscriptions and images?"},"options":[{"es":"Porque casi todos sus autores pertenecían a la élite y escribían para criticar los espectáculos","en":"Because almost all their authors belonged to the elite and wrote to criticise the spectacles"},{"es":"Porque fueron escritos siglos después de los hechos y son poco fiables","en":"Because they were written centuries after the events and are unreliable"},{"es":"Porque la mayoría de los textos son anónimos y no están fechados","en":"Because most of the texts are anonymous and undated"},{"es":"Porque solo recogen lo que el difunto o su dueño quiso que se recordara","en":"Because they record only what the deceased or his owner wished to be remembered"}],"answer":0,"explain":{"es":"Autores como Juvenal, Séneca o Tácito pertenecían a la élite y criticaban los espectáculos, de ahí que las inscripciones y las imágenes aporten lo que los textos callan, y que se avise cuando un dato procede de una fuente tardía.","en":"Authors such as Juvenal, Seneca or Tacitus belonged to the elite and criticised the spectacles, which is why inscriptions and images supply what the texts leave unsaid, and a warning is given when a piece of data comes from a late source."}},{"q":{"es":"¿Qué distingue al ludus romano del agón griego?","en":"What distinguishes the Roman ludus from the Greek agon?"},"options":[{"es":"El ludus era el juego ofrecido al público y el agón, la contienda con un adversario","en":"The ludus was the game offered to the public and the agon, the contest with an opponent"},{"es":"El ludus era una competición entre aristócratas y el agón, un espectáculo para la plebe","en":"The ludus was a competition between aristocrats and the agon, a spectacle for the plebs"},{"es":"El ludus se celebraba solo en honor de los muertos y el agón, en honor de los dioses","en":"The ludus was held only in honour of the dead and the agon in honour of the gods"},{"es":"El ludus se premiaba con coronas y el agón, con dinero","en":"The ludus was rewarded with crowns and the agon with money"}],"answer":0,"explain":{"es":"Para los griegos clásicos lo importante era la competición entre los participantes, mientras que en Roma primaba el espectáculo, y el deporte romano evolucionó pronto hacia el entretenimiento público y el instrumento del poder político.","en":"For the classical Greeks what mattered was the competition between the participants, whereas in Rome spectacle came first, and Roman sport soon evolved into public entertainment and an instrument of political power."}},{"q":{"es":"¿En qué se diferenciaban los ludi de los munera?","en":"How did the ludi differ from the munera?"},"options":[{"es":"Los ludi eran fiestas públicas con fecha fija y el munus dependía de la voluntad y del bolsillo de quien lo ofrecía","en":"The ludi were public festivals with a fixed date, whereas the munus depended on the will and the purse of whoever offered it"},{"es":"Los ludi eran combates de gladiadores y los munera, carreras de carros","en":"The ludi were gladiatorial combats and the munera were chariot races"},{"es":"Los ludi los pagaba un particular y los munera, el Estado","en":"The ludi were paid for by a private individual and the munera by the State"},{"es":"Los ludi se ofrecían a los muertos y los munera, a los dioses","en":"The ludi were offered to the dead and the munera to the gods"}],"answer":0,"explain":{"es":"Los ludi pertenecían al calendario religioso y los pagaba en origen el Estado, mientras que el munus, que significaba a la vez «deber» y «regalo», designó hacia el comienzo del Imperio el combate que un particular ofrecía al pueblo, como muestran las bolsas de dinero que paga Magerius en su mosaico.","en":"The ludi belonged to the religious calendar and were originally paid for by the State, whereas the munus, which meant both 'duty' and 'gift', came around the beginning of the Empire to designate the combat that a private individual offered to the people, as shown by the bags of money that Magerius pays in his mosaic."}},{"q":{"es":"En el calendario de 354 d. C., que reunía 176 días de juegos públicos, ¿cuántos eran de gladiadores?","en":"In the calendar of AD 354, which brought together 176 days of public games, how many were for gladiators?"},"options":[{"es":"10 días","en":"10 days"},{"es":"64 días","en":"64 days"},{"es":"102 días","en":"102 days"},{"es":"80 días","en":"80 days"}],"answer":0,"explain":{"es":"Unos 102 días eran de teatro y 64 de carreras en el circo, de modo que los gladiadores ocupaban solo 10.","en":"Some 102 days were for theatre and 64 for races in the circus, so gladiators took up only 10."}},{"q":{"es":"Bajo el Imperio, ¿quién seguía pagando los espectáculos en las provincias?","en":"Under the Empire, who continued to pay for the spectacles in the provinces?"},"options":[{"es":"Los magistrados de cada ciudad","en":"The magistrates of each city"},{"es":"El emperador, que los costeaba en todo el territorio","en":"The emperor, who funded them throughout the territory"},{"es":"El Senado, con los impuestos de las provincias","en":"The Senate, with the taxes of the provinces"},{"es":"Los dueños de las facciones del circo","en":"The owners of the circus factions"}],"answer":0,"explain":{"es":"En el Imperio el emperador se convirtió en el gran patrocinador y en Roma buscó reservarse los grandes espectáculos, pero en las provincias siguieron pagándolos los magistrados de cada ciudad (Scheidel et al., 2007).","en":"Under the Empire the emperor became the great sponsor and in Rome he sought to reserve the great spectacles for himself, while in the provinces they continued to be paid for by the magistrates of each city (Scheidel et al., 2007)."}},{"q":{"es":"¿Qué hacía el público aprovechando la presencia del emperador en los juegos?","en":"What did the public do, taking advantage of the emperor's presence at the games?"},"options":[{"es":"Reclamar a gritos lo que necesitaba, como una rebaja del precio del grano o de los impuestos","en":"Clamour for what it needed, such as a reduction in the price of grain or in taxes"},{"es":"Votar a mano alzada las propuestas del Senado","en":"Vote by show of hands on the proposals of the Senate"},{"es":"Elegir a los magistrados de la ciudad","en":"Elect the magistrates of the city"},{"es":"Juzgar a los condenados que salían a la arena","en":"Judge the condemned who entered the arena"}],"answer":0,"explain":{"es":"El emperador tenía que responder allí mismo ante decenas de miles de testigos, y cada respuesta reforzaba o desgastaba su prestigio, de modo que los juegos se convirtieron en un espacio de comunicación política entre el emperador y el pueblo.","en":"The emperor had to answer there and then before tens of thousands of witnesses, and each answer strengthened or wore down his prestige, so the games became a space of political communication between the emperor and the people."}},{"q":{"es":"¿Cómo repartía los asientos del anfiteatro la lex Iulia theatralis de Augusto?","en":"How did Augustus's lex Iulia theatralis allocate the seats of the amphitheatre?"},"options":[{"es":"Por grupos sociales, de modo que la grada reproducía la jerarquía de la ciudad","en":"By social group, so that the stands reproduced the hierarchy of the city"},{"es":"Por el precio de la entrada que pagaba cada espectador","en":"By the price of the ticket each spectator paid"},{"es":"Por el barrio de residencia de cada espectador","en":"By the district where each spectator lived"},{"es":"Por sorteo entre los ciudadanos con toga","en":"By lot among the citizens in togas"}],"answer":0,"explain":{"es":"Los senadores ocupaban las primeras filas junto a la arena, los caballeros las siguientes y detrás el resto de ciudadanos con toga, y las mujeres, los esclavos y los extranjeros quedaban en lo más alto, y los acomodadores impedían que un plebeyo ocupara las filas reservadas.","en":"The senators occupied the front rows next to the arena, the equites the following ones and behind them the rest of the citizens in togas, while women, slaves and foreigners were left at the very top, and the ushers prevented a plebeian from occupying the reserved rows."}},{"q":{"es":"¿Qué carácter tuvieron en un principio los combates de gladiadores en Roma?","en":"What was the original character of gladiatorial combats in Rome?"},"options":[{"es":"Un acto privado y religioso, organizado por la familia del difunto para honrarlo","en":"A private and religious act, organised by the family of the deceased to honour him"},{"es":"Un espectáculo del emperador para celebrar las victorias militares","en":"A spectacle given by the emperor to celebrate military victories"},{"es":"Un arma electoral de los candidatos a las magistraturas","en":"An electoral weapon of the candidates for office"},{"es":"Un entrenamiento de las legiones abierto al público","en":"Training for the legions open to the public"}],"answer":0,"explain":{"es":"Lo organizaba la familia del difunto como munus, la obligación de un hijo con su padre muerto, de ahí su escala reducida, como muestran las tres parejas del primer combate celebrado en Roma, en 264 a. C. Después pasó a exhibir el prestigio del linaje, fue arma electoral en el siglo I a. C. y, con el Imperio, competencia exclusiva del emperador.","en":"It was organised by the family of the deceased as a munus, a son's obligation to his dead father, hence its small scale, as the three pairs of the first combat held in Rome, in 264 BC, show. Later it came to display the prestige of the lineage, was an electoral weapon in the 1st century BC and, under the Empire, the exclusive preserve of the emperor."}},{"q":{"es":"¿Qué consecuencias legales tenía la infamia que compartían todos los gladiadores?","en":"What legal consequences did the infamia shared by all gladiators carry?"},"options":[{"es":"No podían votar, ocupar una magistratura, testificar en un juicio ni contraer un matrimonio legal","en":"They could not vote, hold a magistracy, testify in a trial or contract a legal marriage"},{"es":"Perdían la ciudadanía y pasaban a ser propiedad del lanista","en":"They lost their citizenship and became the property of the lanista"},{"es":"Debían combatir con la cara cubierta y sin derecho a indulto","en":"They had to fight with their faces covered and without the right to a reprieve"},{"es":"Quedaban excluidos de toda asociación y de un entierro digno","en":"They were excluded from every association and from a decent burial"}],"answer":0,"explain":{"es":"La infamia era una mancha legal y moral que el derecho imponía a quienes vendían o exhibían su cuerpo para el disfrute de otros, aunque no estaba reñida con la admiración popular, y el pueblo trataba al gladiador como a un héroe «a la vez famoso e infame» (Bell, 2020).","en":"Infamia was a legal and moral stain that the law imposed on those who sold or displayed their bodies for the enjoyment of others, although it was not at odds with popular admiration, and the people treated the gladiator as a hero 'at once famous and infamous' (Bell, 2020)."}},{"q":{"es":"Según la ley de 177 d. C., ¿qué parte de lo que cobraba el lanista por un combate correspondía al gladiador?","en":"Under the law of AD 177, what share of what the lanista was paid for a combat went to the gladiator?"},"options":[{"es":"La cuarta parte si era libre y la quinta si era esclavo","en":"A quarter if he was free and a fifth if he was a slave"},{"es":"La mitad, fuera libre o esclavo","en":"Half, whether he was free or a slave"},{"es":"Nada, porque todo el dinero era del lanista","en":"Nothing, because all the money belonged to the lanista"},{"es":"Todo, porque el lanista cobraba aparte del editor","en":"All of it, because the lanista was paid separately by the editor"}],"answer":0,"explain":{"es":"Si volvía vivo, el editor pagaba al lanista solo un alquiler, en torno a una quinta parte de lo que valía el gladiador, y de ese dinero la ley reservaba al gladiador la cuarta parte si era libre y la quinta si era esclavo, unos 600-750 sestercios por combate en el caso de uno de primera.","en":"If he came back alive, the editor paid the lanista only a hire fee, around a fifth of what the gladiator was worth, and of that money the law reserved for the gladiator a quarter if he was free and a fifth if he was a slave, some 600-750 sesterces per combat in the case of a first-class gladiator."}},{"q":{"es":"¿Con qué fin último pagaba el editor el coste de un munus?","en":"What was the ultimate aim of the editor in paying for a munus?"},"options":[{"es":"Lograr el reconocimiento del público ofreciéndole ocio y distracción gratuitos","en":"To win the recognition of the public by offering it free leisure and entertainment"},{"es":"Recuperar el gasto con los impuestos de las provincias","en":"To recover the outlay through provincial taxes"},{"es":"Cobrar una parte de los premios de los gladiadores","en":"To collect a share of the gladiators' prizes"},{"es":"Cumplir una ley que le obligaba a dar juegos cada año a toda la plebe","en":"To comply with a law obliging him to give games to the whole plebs every year"}],"answer":0,"explain":{"es":"El dinero salía de la summa honoraria, la cantidad fija que cada magistrado entregaba a la ciudad al tomar posesión de su cargo y que solía gastarse en juegos, de lo que el editor ponía de su bolsillo y, a veces, de los fondos públicos.","en":"The money came from the summa honoraria, the fixed sum that each magistrate paid to the city on taking up office and that was usually spent on games, from what the editor added out of his own pocket and, at times, from public funds."}},{"q":{"es":"¿Quién decidía entre la missio y la iugula al final de un combate de gladiadores?","en":"Who decided between missio and iugula at the end of a gladiatorial combat?"},"options":[{"es":"El editor, atento a la grada","en":"The editor, attentive to the stands"},{"es":"El árbitro, el summa rudis","en":"The referee, the summa rudis"},{"es":"El lanista del gladiador vencido","en":"The lanista of the defeated gladiator"},{"es":"El gladiador vencedor","en":"The victorious gladiator"}],"answer":0,"explain":{"es":"El vencido soltaba el escudo y levantaba el índice para pedir clemencia, y el editor decidía entre la missio, el indulto, y la iugula, el degüello, y el árbitro se limitaba a vigilar el duelo.","en":"The loser dropped his shield and raised his index finger to ask for mercy, and the editor decided between missio, reprieve, and iugula, the cutting of the throat, while the referee merely watched over the duel."}},{"q":{"es":"¿Qué simbolizaba la rudis, la espada de madera que recibía el gladiador?","en":"What did the rudis, the wooden sword received by the gladiator, symbolise?"},"options":[{"es":"La licencia, que lo eximía de seguir combatiendo","en":"Discharge, which exempted him from further fighting"},{"es":"La libertad, que lo convertía en liberto y lo libraba de la infamia","en":"Freedom, which made him a freedman and freed him from infamia"},{"es":"La condena a la escuela de gladiadores","en":"The sentence to the gladiatorial school"},{"es":"El primer combate ganado como profesional","en":"The first fight won as a professional"}],"answer":0,"explain":{"es":"La retirada llegaba con la rudis, que simbolizaba la licencia, o con la libertad, y algunos veteranos siguieron en el mundo de la arena como árbitros, instructores o incluso lanistas, mientras que otros, atraídos por la fama y el dinero, volvían a combatir.","en":"Retirement came with the rudis, which symbolised discharge, or with freedom, and some veterans remained in the world of the arena as referees, instructors or even lanistae, while others, drawn by fame and money, returned to fight."}},{"q":{"es":"Según Coleman (2000), ¿qué escandalizaba a los romanos de las mujeres que combatían en la arena?","en":"According to Coleman (2000), what scandalised the Romans about women fighting in the arena?"},"options":[{"es":"El rango antes que el sexo, ya que los autores antiguos solo condenan a las de familia senatorial o ecuestre","en":"Rank rather than sex, since ancient authors condemn only those of senatorial or equestrian family"},{"es":"El sexo antes que el rango, ya que ninguna mujer libre podía aparecer en público","en":"Sex rather than rank, since no free woman could appear in public"},{"es":"La violencia de sus combates, que superaba la de los hombres","en":"The violence of their fights, which exceeded that of the men"},{"es":"Su origen servil, ya que casi todas eran esclavas","en":"Their servile origin, since almost all were slaves"}],"answer":0,"explain":{"es":"Una norma del año 11 d. C. vetó la arena a las mujeres libres menores de veinte años, y ver actuar a una mujer en público resultaba tan chocante que cada una se exhibía como una rareza.","en":"A rule of AD 11 barred free women under the age of twenty from the arena, and seeing a woman perform in public was so shocking that each one was exhibited as a curiosity."}},{"q":{"es":"¿Con qué se pagó el Anfiteatro Flavio, según los restos de su inscripción?","en":"What was the Flavian Amphitheatre paid for with, according to the remains of its inscription?"},"options":[{"es":"Con el botín de la guerra de Judea y el saqueo del templo de Jerusalén","en":"With the spoils of the Judaean war and the plunder of the Temple in Jerusalem"},{"es":"Con el botín de la conquista de la Dacia","en":"With the spoils of the conquest of Dacia"},{"es":"Con los impuestos de las provincias de Hispania","en":"With the taxes of the Hispanic provinces"},{"es":"Con las cuotas de los magistrados que estrenaban un cargo","en":"With the fees of the magistrates taking up an office"}],"answer":0,"explain":{"es":"Los restos de su inscripción apuntan a ese origen, y por eso el Coliseo fue a la vez un monumento de victoria y un regalo al pueblo, obra que Vespasiano inició y Tito inauguró en 80 d. C. con cien días de juegos.","en":"The remains of its inscription point to that origin, which is why the Colosseum was at once a victory monument and a gift to the people, begun by Vespasian and inaugurated by Titus in AD 80 with a hundred days of games."}},{"q":{"es":"¿Cómo cambiaron las carreras de carros al pasar de Grecia a Roma?","en":"How did chariot races change on passing from Greece to Rome?"},"options":[{"es":"De competición entre aristócratas pasaron a espectáculo que el poder ofrecía al pueblo, con aurigas profesionales","en":"From a competition between aristocrats they became a spectacle offered by those in power to the people, with professional charioteers"},{"es":"De espectáculo público pasaron a competición reservada a aristócratas, con dueños que conducían sus propios caballos","en":"From a public spectacle they became a competition reserved for aristocrats, with owners driving their own horses"},{"es":"Dejaron de celebrarse en recintos construidos y volvieron a las explanadas con taludes de tierra","en":"They ceased to be held in built venues and returned to esplanades with earth embankments"},{"es":"Pasaron de celebrarse al aire libre a hacerlo en el interior de los anfiteatros","en":"They moved from being held in the open air to being held inside amphitheatres"}],"answer":0,"explain":{"es":"En Grecia vencía el dueño de los caballos y en Roma los magistrados, y después el emperador, ofrecían las carreras al pueblo, y para ese público surgió un edificio nuevo, el circo, que rodeó la pista con un graderío construido (Humphrey, 1986).","en":"In Greece the owner of the horses won, whereas in Rome the magistrates, and later the emperor, offered the races to the people, and for that public a new building arose, the circus, which surrounded the track with built stands (Humphrey, 1986)."}},{"q":{"es":"¿Qué eran las facciones del circo?","en":"What were the circus factions?"},"options":[{"es":"Empresas que organizaban los equipos de carreras, cada una con su color","en":"Companies that organised the racing teams, each with its own colour"},{"es":"Grupos de aficionados que apoyaban a cada color en la grada","en":"Groups of fans who supported each colour in the stands"},{"es":"Gremios de aurigas libres que negociaban sus premios","en":"Guilds of free charioteers that negotiated their prizes"},{"es":"Comisiones de magistrados que presidían las carreras","en":"Commissions of magistrates that presided over the races"}],"answer":0,"explain":{"es":"Cada facción se identificaba con un color que vestían sus aurigas, y al frente estaba su dueño, el dominus factionis, un caballero que dirigía a varios cientos de empleados.","en":"Each faction was identified with a colour worn by its charioteers, and at its head was its owner, the dominus factionis, an eques who ran several hundred employees."}},{"q":{"es":"¿Cómo competía una facción en la pista?","en":"How did a faction compete on the track?"},"options":[{"es":"Como un equipo, con hasta tres carros por carrera que se ayudaban entre sí","en":"As a team, with up to three chariots per race that helped one another"},{"es":"Con un solo carro por carrera, sorteado entre sus aurigas","en":"With a single chariot per race, drawn by lot among its charioteers"},{"es":"Con aurigas alquilados a las otras facciones","en":"With charioteers hired from the other factions"},{"es":"Con carros de colores distintos para confundir a los rivales","en":"With chariots of different colours to confuse its rivals"}],"answer":0,"explain":{"es":"Uno de los carros buscaba la victoria y los otros le marcaban el ritmo o cerraban el paso a los rivales en la cuerda y en los giros, y por eso las inscripciones de los aurigas distinguen entre ganar en cabeza, remontar desde atrás o arrebatar la victoria en la última recta.","en":"One of the chariots went for victory and the others set the pace for him or blocked the rivals on the inside line and at the turns, which is why the charioteers' inscriptions distinguish between winning from the front, coming from behind or snatching victory in the final straight."}},{"q":{"es":"¿Quién cobraba el premio de una victoria en el circo y qué recibía el auriga?","en":"Who collected the prize for a victory in the circus, and what did the charioteer receive?"},"options":[{"es":"La facción, dueña de los caballos y del carro, y el auriga solo una parte","en":"The faction, owner of the horses and the chariot, and the charioteer only a share"},{"es":"El auriga, que luego pagaba a la facción por alquilar el equipo","en":"The charioteer, who then paid the faction for hiring the equipment"},{"es":"El organizador de los juegos, que pagaba al auriga un sueldo fijo","en":"The organiser of the games, who paid the charioteer a fixed salary"},{"es":"El emperador, que repartía una parte entre los aurigas ganadores","en":"The emperor, who shared part of it among the winning charioteers"}],"answer":0,"explain":{"es":"Un esclavo podía ahorrar su parte para comprar su libertad, y Vamplew (2023) calcula que a Diocles le quedaron al menos tres millones y medio, una décima parte del total de sus premios.","en":"A slave could save his share in order to buy his freedom, and Vamplew (2023) calculates that Diocles kept at least three and a half million, a tenth of the total of his prizes."}},{"q":{"es":"¿Cuál era la condición social de la mayoría de los aurigas?","en":"What was the social status of most charioteers?"},"options":[{"es":"Esclavos, libertos o romanos de muy baja condición","en":"Slaves, freedmen or Romans of very low status"},{"es":"Caballeros arruinados que buscaban recuperar su fortuna","en":"Ruined equites seeking to recover their fortune"},{"es":"Soldados licenciados de las legiones","en":"Discharged soldiers of the legions"},{"es":"Hijos de senadores que competían por prestigio","en":"Sons of senators competing for prestige"}],"answer":0,"explain":{"es":"De los más de doscientos aurigas que se conocen por sus inscripciones solo uno consta como nacido libre, y los mejores se convertían en ídolos de masas con estatuas en Roma.","en":"Of the more than two hundred charioteers known from their inscriptions only one is recorded as freeborn, and the best became idols of the masses with statues in Rome."}},{"q":{"es":"¿Por qué podía permitirse cualquier romano acudir a las termas?","en":"Why could any Roman afford to go to the baths?"},"options":[{"es":"Porque la entrada costaba un cuadrante, la moneda más pequeña","en":"Because entry cost a quadrans, the smallest coin"},{"es":"Porque el emperador las costeaba y el acceso era gratuito","en":"Because the emperor paid for them and admission was free"},{"es":"Porque solo se pagaba en los días de juegos públicos","en":"Because they were paid for only on the days of public games"},{"es":"Porque cada ciudadano recibía una entrada anual junto con el grano público","en":"Because each citizen received an annual ticket along with the public grain"}],"answer":0,"explain":{"es":"Las termas servían para la higiene, la relajación y la reunión, y el baño era para el romano corriente balneario y lugar de encuentro, abierto a cualquiera por un precio simbólico.","en":"The baths served for hygiene, relaxation and socialising, and for the ordinary Roman the bath was both spa and meeting place, open to anyone for a token price."}},{"q":{"es":"¿Qué defendió Galeno en su tratado sobre el ejercicio con la pelota pequeña?","en":"What did Galen defend in his treatise De parvae pilae exercitio?"},"options":[{"es":"Que el juego de pelota era la mejor actividad corporal, al alcance incluso de los pobres","en":"That ball play was the best bodily activity, within the reach even of the poor"},{"es":"Que la lucha era la mejor actividad corporal, porque entrenaba también la mente","en":"That wrestling was the best bodily activity, because it also trained the mind"},{"es":"Que los juegos de pelota debían reservarse a los niños y a los ancianos","en":"That ball games should be reserved for children and the elderly"},{"es":"Que el ejercicio debía practicarse solo después del baño","en":"That exercise should be taken only after the bath"}],"answer":0,"explain":{"es":"Según Galeno, el juego movía todo el cuerpo con la intensidad que se quisiera, servía a cualquier edad, apenas costaba dinero y rara vez causab
