@keyframes rise{from{opacity:0;transform:translateY(2vh)}to{opacity:1;transform:none}}

.pop{animation:pop .35s both}
@media (prefers-reduced-motion:reduce){.rise,.pop{animation:none}}

const T={en:{title:'Review class',sub:'History of Sport · Topics 1-3',join:'Join from your phone',steps:['Scan the code with your phone camera','Or open Historiapp and tap the review class card','Type your name and wait'],players:'players',open:'Open the room',start:'Start the game',newg:'New game',newgQ:'Start a new game? The current scores will be lost.',closed:'The room is closed',q:'Question',of:'of',ans:'answers',ready:'Get ready',read:'Read the question',time:'Time!',next:'Next ▶',rules:'Scoring',speedR:[['Correct','≤ 1,000','more points if you are fast'],['Streak','+100 → +500','grows with each right answer in a row']],examR:[['Correct','+900',''],['Wrong','−300',''],['Blank','0','do not tap anything']],finalR:[['Correct','+1,800',''],['Wrong','−600',''],['Blank','0',''],['Relay','+450','per event in place']],wordR:[['Correct','≤ 1,000','more points if you answer early'],['Letters','+1','every few seconds']],examTip:'As in the exam test, three wrong answers cancel a right one. If you are not sure, leave it blank.',stand:'Standings after',end:'Final standings',weak:'Worth revising tonight',weakS:'The questions the class found hardest:',pct:'correct',good:'Good luck in the exam!',tf:['True','False'],nobody:'Nobody has joined yet',menu:'Menu',jump:'Go to round',skip:'Skip this question',close:'Close the room',back:'Back to the game',lang:'ES',net:'⚠ Connection to the server lost, retrying…',top:'Top',reveal:'Show answer',order:'Correct order',relayOk:'got the order right',kick:'Tap a name twice to remove it',img:'Image'},
 es:{title:'Clase de repaso',sub:'Historia del Deporte · Temas 1-3',join:'Entra desde el móvil',steps:['Escanea el código con la cámara del móvil','O abre Historiapp y toca la tarjeta de la clase de repaso','Escribe tu nombre y espera'],players:'jugadores',open:'Abrir la sala',start:'Empezar',newg:'Partida nueva',newgQ:'¿Empezar una partida nueva? Se pierden las puntuaciones actuales.',closed:'La sala está cerrada',q:'Pregunta',of:'de',ans:'respuestas',ready:'Atentos',read:'Lee la pregunta',time:'¡Tiempo!',next:'Siguiente ▶',rules:'Puntuación',speedR:[['Acierto','≤ 1.000','más puntos cuanto antes'],['Racha','+100 → +500','crece con cada acierto seguido']],examR:[['Acierto','+900',''],['Fallo','−300',''],['En blanco','0','no toques nada']],finalR:[['Acierto','+1.800',''],['Fallo','−600',''],['En blanco','0',''],['Relevo','+450','por suceso en su sitio']],wordR:[['Acierto','≤ 1.000','más puntos cuanto antes'],['Letras','+1','cada pocos segundos']],examTip:'Como en el test del examen, tres fallos restan un acierto. Si dudas, déjala en blanco.',stand:'Clasificación tras',end:'Clasificación final',weak:'Para repasar esta noche',weakS:'Las preguntas que más le han costado a la clase:',pct:'de acierto',good:'¡Suerte en el examen!',tf:['Verdadero','Falso'],nobody:'Todavía no ha entrado nadie',menu:'Menú',jump:'Ir a la ronda',skip:'Saltar esta pregunta',close:'Cerrar la sala',back:'Volver al juego',lang:'EN',net:'⚠ Sin conexión con el servidor, reintentando…',top:'Primeros',reveal:'Ver solución',order:'Orden correcto',relayOk:'ha acertado el orden',kick:'Toca dos veces un nombre para retirarlo',img:'Imagen'}};

let AC=null;function beep(f,d,ty='sine',v=.12,w=0){if(!SND)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime+w);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+w+d);o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+w);o.stop(AC.currentTime+w+d+.05)}catch(e){}}

const MUS=['audio/m1.mp3','audio/m2.mp3','audio/m3.mp3','audio/m4.mp3','audio/m5.mp3'];let MI=0,MON=true;try{MON=localStorage.getItem('rpENmus')!=='0'}catch(e){}

function ft(u,o,ms){const c=new AbortController(),h=setTimeout(()=>c.abort(),ms||8000);return fetch(u,Object.assign({signal:c.signal},o||{})).finally(()=>clearTimeout(h))}
async function act(accion,extra){if(!PIN){PIN=(prompt(L==='es'?'PIN del profesor':'Teacher PIN')||'').trim();if(!PIN)return null;try{localStorage.setItem('rpPinEN',PIN)}catch(e){}}try{const t0=Date.now();const d=await (await ft(RK_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({accion,sala:SALA,pin:PIN},extra||{}))})).json();if(d&&d.ok){ST=d.st;OFF=d.now-Math.round((t0+Date.now())/2);ERR=0;net();return d}if(d&&d.err==='pin'){PIN='';try{localStorage.removeItem('rpPinEN')}catch(e){}alert(L==='es'?'PIN incorrecto':'Wrong PIN')}}catch(e){ERR++;net()}return null}

 if(r<0)return;const si=stepOf(r),s=STEPS[si];if(isRev(r)&&s){statFor(s,si);showCounts(s,si)}

function seeded(n){let x=n*9301+49297;return()=>((x=(x*9301+49297)%233280)/233280)}
function maskWord(s,i,frac){const w=tx(s.opts[i]),idx=[];for(let k=0;k<w.length;k++)if(/\p{L}/u.test(w[k]))idx.push(k);
 const rr=seeded(STEPS.indexOf(s)*7+i+1),ord=idx.slice().sort(()=>rr()-.5);const show=new Set(ord.slice(0,Math.floor(frac*.72*idx.length)));
 return [...w].map((c,k)=>/\p{L}/u.test(c)?(show.has(k)?c:'_'):(c===' '?'  ':c)).join('')}
/* el detalle: de un recorte de la imagen a la imagen entera */
const CV={img:null};
function drawDet(s,p){const c=$('cv'),im=CV.img;if(!c||!im)return;const W=im.naturalWidth,H=im.naturalHeight;
 const box=c.parentElement.getBoundingClientRect(),maxW=box.width,maxH=window.innerHeight*.58;let cw=maxW,ch=cw*H/W;if(ch>maxH){ch=maxH;cw=ch*W/H}
 if(c.width!==Math.round(cw)){c.width=Math.round(cw);c.height=Math.round(ch)}
 let [x0,y0,x1,y1]=s.crop;x0*=W;x1*=W;y0*=H;y1*=H;let w=x1-x0,h=y1-y0;const ar=W/H;if(w/h>ar){const nh=w/ar;y0-=(nh-h)/2;h=nh}else{const nw=h*ar;x0-=(nw-w)/2;w=nw}
 x0=Math.max(0,Math.min(W-w,x0));y0=Math.max(0,Math.min(H-h,y0));const e=p*p*(3-2*p);
 const sx=x0*(1-e),sy=y0*(1-e),sw=w+(W-w)*e,sh=h+(H-h)*e;const g=c.getContext('2d');g.drawImage(im,sx,sy,sw,sh,0,0,c.width,c.height)}

  const msg=last?(cw>gw?(L==='es'?'¡La clase gana al juego!':'The class beats the game!'):cw<gw?(L==='es'?'El juego gana esta vez':'The game wins this time'):(L==='es'?'Empate':'A draw')):(won==null?'':won?(L==='es'?'Esta pregunta, para la clase':'This one goes to the class'):(L==='es'?'Esta pregunta, para el juego':'This one goes to the game'));
  e.innerHTML=`<div style="display:flex;align-items:center;gap:2vw"><svg viewBox="0 0 220 104" style="height:12vh;flex:none"><polygon points="104,100 116,100 110,26" fill="#EDAB00"/><g style="transform:rotate(${ang}deg);transform-origin:110px 24px;transition:transform 1s"><line x1="20" y1="24" x2="200" y2="24" stroke="#EDAB00" stroke-width="4"/><path d="M20 24 L6 52 L34 52 Z" fill="none" stroke="#f4f1e8" stroke-width="2"/><path d="M200 24 L186 52 L214 52 Z" fill="none" stroke="#f4f1e8" stroke-width="2"/><text x="20" y="72" fill="#fff" font-size="15" text-anchor="middle" font-weight="700">${L==='es'?'Clase':'Class'}</text><text x="200" y="72" fill="#fff" font-size="15" text-anchor="middle" font-weight="700">${L==='es'?'Juego':'Game'}</text></g></svg>
  <div><div class="hd2">⚖️ ${L==='es'?'La clase':'The class'} <b style="font-size:3.4vh">${cw}</b> – <b style="font-size:3.4vh">${gw}</b> ${L==='es'?'el juego':'the game'} <span style="color:var(--mut);font-size:2vh">(${idx.length}/${tot})</span></div><div style="font-size:2.8vh;font-weight:700;color:${last?'var(--oro2)':'#fff'}">${msg}</div><div style="font-size:1.9vh;color:var(--mut)">${L==='es'?'La pregunta es para la clase si acierta la mitad o más':'A question goes to the class if half of you or more get it right'}</div></div></div>`;return}
 if(R.race){const goal=3*STEPS.filter(x=>x.r===s.r).length,pos=j=>Math.min(goal,Math.max(0,(j.x&&j.x.length>3)?j.x[3]:0));
  const arr=ps.slice().sort((a,b)=>pos(b)-pos(a)),top=arr.length?pos(arr[0]):0,lvl={};
  e.innerHTML=`<div class="hd2">🏃 ${L==='es'?'La carrera del Heb-Sed':'The Heb-Sed race'} <span style="color:var(--mut);font-size:2vh">+3 / −1 · ${L==='es'?'meta':'finish'} ${goal}</span></div><div class="track" style="--step:${100/goal}%">${arr.map(j=>{const p=pos(j),k=(lvl[p]=(lvl[p]||0)+1)-1;return `<span class="chip${p===top&&top>0?' lead':''}" style="left:${3+p/goal*94}%;top:${.3+(k%5)*2.4}vh">${esc(String(j.a).slice(0,10))}</span>`}).join('')}</div>`;return}
 if(R.stand){const lv=j=>(j.x&&j.x.length>2)?j.x[2]:3,up=ps.filter(j=>lv(j)>0),down=ps.length-up.length;
  e.innerHTML=`<div class="hd2">🧍 ${L==='es'?'Siguen en pie':'Still standing'}: <b style="font-size:3.2vh">${up.length}</b> / ${ps.length} <span style="color:var(--mut)">🪑 ${down}</span></div><div class="chips">${up.map(j=>`<span>${esc(String(j.a).slice(0,12))} ${'❤️'.repeat(Math.max(0,lv(j)))}</span>`).join('')}</div>`}}

/* excavación de la ronda 5: cada pregunta levanta hasta 3 cuadrículas según el porcentaje de acierto de la clase (vale igual para 30 que para 40 alumnos) */
function digInfo(){const r=ROUNDS.findIndex(R=>R.dig);return r<0?null:Object.assign({r},ROUNDS[r].dig)}
function digLifted(upto){const d=digInfo();if(!d)return 0;let n=0;STEPS.forEach((x,i)=>{if(x.r===d.r&&!x.digq&&i<=upto&&STAT[i]&&STAT[i].n>0)n+=Math.round(3*STAT[i].ok/STAT[i].n)});return Math.min(n,d.cols*d.rows)}
function digHTML(h,lifted){const d=digInfo(),tot=d.cols*d.rows,rr=seeded(99),ord=Array.from({length:tot},(_,i)=>i).sort(()=>rr()-.5),up=new Set(ord.slice(0,lifted));
 return `<div class="dig" style="height:${h}"><img src="${IMG+d.img}" alt=""><div class="dgrid" style="grid-template-columns:repeat(${d.cols},1fr);grid-template-rows:repeat(${d.rows},1fr)">${Array.from({length:tot},(_,i)=>`<i class="${up.has(i)?'up':''}"></i>`).join('')}</div></div>`}
/* confeti */
function confetti(){const c=$('conf'),g=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const P=Array.from({length:160},()=>({x:Math.random()*c.width,y:-Math.random()*c.height,v:2+Math.random()*4,s:4+Math.random()*6,c:['#EDAB00','#fff','#E8710A','#5b8def'][Math.random()*4|0],r:Math.random()*6}));let n=0;(function f(){g.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;p.x+=Math.sin((p.y+p.r)/30);g.fillStyle=p.c;g.fillRect(p.x,p.y,p.s,p.s*.6)});if(++n<400)requestAnimationFrame(f);else g.clearRect(0,0,c.width,c.height)})()}

/* ---------- mandos del profesor ---------- */
function unlock(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}musStart()}
let ARM=0;function goNext(){unlock();if(!ST.open||BUSY)return;const r=ST.r;if(r===-300)return;
 if(isQ(r)&&Date.now()-ARM>1500){ARM=Date.now();const n=$('cNext');n.textContent=L==='es'?'Pulsa otra vez para ver la solución':'Press again to reveal';setTimeout(()=>{n.textContent=t('next')},1500);return}
 setR(nextR(r))}
$('cNext').onclick=goNext;
$('cSnd').onclick=()=>{SND=!SND;$('cSnd').textContent=SND?'🔊':'🔇'};
$('cMus').onclick=()=>{MON=!MON;try{localStorage.setItem('rpENmus',MON?'1':'0')}catch(e){}$('cMus').style.opacity=MON?1:.4;if(MON)musStart()};$('cMus').style.opacity=MON?1:.4;
document.addEventListener('pointerdown',unlock);
$('cFull').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
$('cLang').onclick=()=>{L=L==='en'?'es':'en';$('cLang').textContent=t('lang');$('cNext').textContent=t('next');render()};
$('cMenu').onclick=openMenu;
function openMenu(){const m=$('menu');m.style.display='flex';
 $('mbox').innerHTML=`<div class="cz" style="font-size:3.4vh;color:var(--oro);margin-bottom:1.4vh">${t('menu')}</div>${ROUNDS.map((R,i)=>`<button data-r="${-100-i}">${t('jump')} ${i+1}: ${R.icon} ${tx(R.n)}</button>`).join('')}
 ${isQ(ST.r)||isRev(ST.r)?`<button data-sk="1">⏭ ${t('skip')}</button>`:''}<button data-r="-1">📱 ${L==='es'?'Volver a la sala (QR)':'Back to the lobby (QR)'}</button><button data-r="-300">🏆 ${t('end')}</button><button data-cl="1">🔒 ${t('close')}</button><button data-x="1">✕ ${t('back')}</button>`;
 $('mbox').querySelectorAll('button').forEach(b=>b.onclick=async()=>{m.style.display='none';if(b.dataset.x)return;
  if(b.dataset.cl){if(confirm(t('close')+'?')){await act('rp_cerrar');render()}return}
  if(b.dataset.sk){const r=ST.r;const s=stepOf(r);const nx=isQ(r)?nextR(r+1):nextR(r);setR(nx);return}
  if(+b.dataset.r===-1){try{localStorage.setItem('rpENprev',JSON.stringify({sid:ST.sid,r:ST.r}))}catch(e){}}
  setR(+b.dataset.r)})}
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;
 if(e.key===' '||e.key==='ArrowRight'||e.key==='PageDown'||e.key==='Enter'){e.preventDefault();goNext()}
 else if(e.key==='m'||e.key==='M')openMenu();else if(e.key==='f'||e.key==='F')$('cFull').click();else if(e.key==='s'||e.key==='S')$('cSnd').click();else if(e.key==='Escape')$('menu').style.display='none'});
/* precarga de imágenes */
[...new Set(STEPS.filter(s=>s.img).map(s=>s.img))].forEach(src=>{const i=new Image();i.src=IMG+src});
window.render_game_to_text=()=>JSON.stringify({r:ST.r,open:ST.open,sid:ST.sid,players:players().length,answers:isQ(ST.r)?answersFor(stepOf(ST.r)).length:null,step:ST.r>=0?stepOf(ST.r):null});
$('cLang').textContent=t('lang');$('cNext').textContent=t('next');
(async()=>{await poll();render();pollLoop()})();
</script>
