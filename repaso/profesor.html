 {n:'The Heb-Sed Race',t:'Topic 2',e:'🏃',d:'Like the pharaoh at his jubilee, every right answer on Topic 2 moves you one marker forward and every mistake sends you back.',rules:[['Like the exam','Right +300, wrong −100, blank 0.'],['Markers','One forward for a right answer, one back for a wrong one.']],tip:'In the test, read all four options before choosing: the distractors belong to the same family as the right answer.'},
 {n:'Pentathlon',t:'Topic 3',e:'🏅',d:'Six different events on Topic 3, from the definition to the flash image.',rules:[['Events','Key concept, match, put in order, the source speaks, flash image and hidden word.']],tip:'In essay questions, explain each practice with three ideas: who practised it, what it was for and what it meant.'},
 {n:'Chariot Race',t:'Topic 4',e:'🐎',d:'Each chariot races in the Circus Maximus: right answers on Topic 4 move it forward and mistakes send it back. The top ten are shown here.',rules:[['The lap','Seven stretches; whoever completes the lap earns 500 points.'],['Like the exam','Right +300, wrong −100, blank 0.']],tip:'The glossary of each topic in Historiapp gathers the terms that come up most on the slides, and reviewing it before the exam saves many mistakes.'},
 {n:'Munus',t:'Topic 4',e:'⚔️',d:'The whole class stands up. Each of you faces a rival gladiator: every right answer is a blow to the rival and every mistake a blow taken. Whoever falls sits down.',rules:[['Health','Three blows to fall; the rival can take five.'],['Victory','Defeating the rival is worth 500 points and the missio 200.']],tip:'In part B you choose between two questions, one on a topic and one cross-topic. Read both before you start writing.'},
 {n:'The Relay',t:'Topics 1-4',e:'🏁',d:'Final challenge: put five moments in the history of sport in order, from Prehistory to Rome.',rules:[['Prize','500 points for a perfect order and 200 with three positions right.']],tip:'Cross-topic questions ask you to follow a practice from one culture to the next. This challenge trains exactly that.'}]}};
const t=k=>T[L][k];
const $=id=>document.getElementById(id);
const esc=x=>String(x).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
let ST={sid:'',r:-1,rts:0,open:false,ban:[]},OFF=0,J=[],ERR=0,P=0,SUB=0,thr=-1,clk=null,armed='',armT=null;
const snow=()=>Date.now()+OFF;
function beep(f,d,v=.12,w=0){try{window.AC=window.AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime+w);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+w+d);o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+w);o.stop(AC.currentTime+w+d+.05)}catch(e){}}

/* servidor */
async function act(accion,extra){if(!PIN){askPin();return null}
 try{const d=await (await fetch(RK_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({accion,sala:SALA,pin:PIN},extra||{}))})).json();
  if(d&&d.err==='pin'){PIN='';try{localStorage.removeItem('rpPin')}catch(e){}askPin('PIN incorrecto');return null}
  if(d&&d.ok){ST=d.st;OFF=d.now-Date.now();return d}}catch(e){}return null}
async function poll(){try{const t0=Date.now();const d=await (await fetch(RK_URL+'?accion=rp_get&sala='+SALA+'&_='+t0)).json();if(d&&d.ok){ST=d.st;OFF=d.now-Math.round((t0+Date.now())/2);J=clean(d.j||[]);ERR=0;live()}}catch(e){ERR++;live()}}
function clean(list){const by={};list.forEach(p=>{const k=String(p.a).trim().toLowerCase();if(!by[k]||by[k].ts<p.ts)by[k]=p});return Object.values(by)}
const active=p=>snow()-p.ts<150000;
function askPin(msg){$('pinbox').style.display='flex';$('pinerr').textContent=msg||'';$('pinin').value='';setTimeout(()=>$('pinin').focus(),50)}
$('pingo').onclick=()=>{PIN=$('pinin').value.trim();if(!PIN)return;try{localStorage.setItem('rpPin',PIN)}catch(e){}$('pinbox').style.display='none'};
$('pinin').addEventListener('keydown',e=>{if(e.key==='Enter'){e.stopPropagation();$('pingo').onclick()}});

/* expulsión: dos toques sobre el nombre */
function chipH(p,extra){return `<span data-u="${esc(p.u)}" class="${active(p)?'':'off'} ${armed===p.u?'arm':''}" title="${esc(t('ban'))}">${armed===p.u?'✕ ':''}${esc(p.a)}${extra||''}</span>`}
document.addEventListener('click',e=>{const c=e.target.closest('[data-u]');if(!c)return;const u=c.dataset.u;
 if(armed===u){armed='';clearTimeout(armT);act('rp_ban',{u}).then(()=>{J=J.filter(p=>p.u!==u);live()});beep(200,.3)}else{armed=u;clearTimeout(armT);armT=setTimeout(()=>{armed='';live()},4000);live()}});

/* tablas */
function topN(list,f,n){return list.filter(p=>f(p)>0).sort((a,b)=>f(b)-f(a)).slice(0,n||10)}
function rows(list,f){return list.length?list.map((x,i)=>`<div class="tr ${i<3?'m'+i:''}"><span class="pp">${i<3?['🥇','🥈','🥉'][i]:i+1}</span><span class="aa" data-u="${esc(x.u)}" style="cursor:pointer;${armed===x.u?'background:#fff;color:#002060;border-radius:.6vh;padding:0 .4vw':''}">${armed===x.u?'✕ ':''}${esc(x.a)}</span><b>${f(x).toLocaleString(L)}</b></div>`).join(''):`<div class="k" style="margin-top:2vh">${t('wait')}</div>`}
const rsI=i=>p=>(p.rs||[])[i]||0, xI=i=>p=>(p.x||[])[i]||0;

/* render */
function header(){$('tt').textContent=t('title');$('next').textContent=t('next');$('lng').textContent=L==='es'?'EN':'ES';
 $('pips').innerHTML=Array.from({length:NR},(_,i)=>`<div class="pip ${P-1>i?'done':P-1===i?'on':''}"></div>`).join('')}
function render(){clearInterval(clk);header();const s=$('st');s.style.justifyContent='center';
 if(P===0){
  if(!ST.open){s.innerHTML=`<div class="k rise">${t('sub')}</div><h1 class="cz rise">${t('title')}</h1><p class="lead rise">${t('openS')}</p><button class="btnp" id="bo">${t('open')}</button>`;$('bo').onclick=async()=>{const d=await act('rp_sesion');if(d){beep(523,.2);render()}};return}
  s.innerHTML=`<div class="k rise">${t('sub')}</div><h1 class="cz rise" style="font-size:7vh">${t('title')}</h1><div class="row rise"><div><div id="qr"><img src="${QRIMG}" alt="QR"></div><div class="url">${URLJ.replace('https://','')}</div></div><div class="steps"><div class="k" style="text-align:left">${t('join')}</div>${t('steps').map((x,i)=>`<div>${i+1}. ${x}</div>`).join('')}</div></div><div id="live" style="margin-top:1.4vh;width:90vw"></div><button class="lnk" id="brs">${t('reset')}</button>`;
  $('brs').onclick=async()=>{if(!confirm(t('reset')+'?'))return;await act('rp_sesion');J=[];render()};live();return}
 if(P>=1&&P<=NR){const i=P-1,R=T[L].r[i],opened=ST.r>=i;
  if(opened&&SUB>=2){s.innerHTML=`<div class="k rise">${t('round')} ${i+1} · ${R.t}</div><h1 class="cz rise" style="font-size:6.5vh;margin-bottom:2vh">${SUB===2?t('rankR')+R.n:t('rankG')}</h1><div id="live" style="width:64vw"></div>`;live();return}
  if(opened&&SUB===1){s.style.justifyContent='flex-start';s.innerHTML=`<div class="hd"><span class="em" style="font-size:6vh">${R.e}</span><div style="text-align:left"><div class="k" style="margin:0">${t('round')} ${i+1} · ${R.t}</div><div class="cz" style="font-size:5vh;color:var(--oro);font-weight:900">${R.n}</div></div><div style="margin-left:auto" id="clk"></div></div><div id="live" style="width:92vw"></div>`;tick();live();return}
  s.innerHTML=(i===6?`<div class="k rise" style="color:var(--oro2);font-size:3vh;letter-spacing:.15em">🧍 ${L==='es'?'¡Todos en pie!':'Everyone stand up!'} 🧍</div>`:'')+`<div class="k rise">${t('round')} ${i+1} · ${R.t}</div><div class="em rise">${R.e}</div><h1 class="cz rise">${R.n}</h1><p class="lead rise">${R.d}</p><div class="rules rise">${R.rules.map(r=>`<div class="rule"><b>${r[0]}</b>${r[1]}</div>`).join('')}</div><div class="tip rise"><b>📝 ${t('tipK')}.</b> ${R.tip}</div><div class="k rise" style="margin-top:1.2vh;color:var(--oro2);font-size:2.4vh">⏱ ${Math.round(RDUR[i]/6)/10} min</div><button class="btnp" id="bor">${t('openR')}</button>`;
  $('bor').onclick=()=>openRound(i);return}
 if(P===NR+1){s.innerHTML=`<div class="k rise">${t('fin')}</div><h1 class="cz rise" style="font-size:6vh;margin-bottom:2vh">Top 10</h1><div id="live" style="width:70vw"></div>`;live();return}
 if(P===NR+2){s.innerHTML=`<div class="em rise" style="font-size:6vh">🌿👑🌿</div><h1 class="cz rise" style="font-size:6vh">${t('crown')}</h1><div id="live" style="width:80vw"></div><div class="k rise" style="color:var(--oro2);margin-top:2vh;font-size:2.6vh">${t('thanks')}</div><button class="lnk" id="bcl">${t('close')}</button>`;$('bcl').onclick=async()=>{await act('rp_cerrar');$('st').innerHTML=`<h1 class="cz">${t('closed')}</h1>`};live();[523,659,784,1047].forEach((f,k)=>beep(f,.3,.14,k*.15));confetti();return}
}
async function openRound(i){const d=await act('rp_abrir',{r:i});if(!d)return;SUB=1;[392,523,659,784].forEach((f,k)=>beep(f,.2,.1,k*.1));render()}
function tick(){const i=P-1;let rang=false;const f=()=>{const c=$('clk');if(!c)return;const left=ST.r===i?Math.max(0,RDUR[i]-Math.floor((snow()-ST.rts)/1000)):RDUR[i];c.innerHTML=`<span class="big2" style="color:${left<=20?'#fff':'var(--oro2)'}">⏱ ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}</span>`;if(left<=0&&!rang){rang=true;beep(110,1.2,.25)}};f();clk=setInterval(f,1000)}
function live(){const el=$('live');if(!el)return;
 const conn=ERR>2?`<div class="k" style="color:#fff">${t('noconn')}</div>`:'';
 if(P===0){const act_=J.filter(active);el.innerHTML=`${conn}<div class="cnt">👥 <b>${act_.length}</b> ${t('conn')}${J.length>act_.length?` · ${J.length-act_.length} ${t('inact')}`:''}</div><div class="chips">${J.slice().sort((a,b)=>b.ts-a.ts).map(p=>chipH(p)).join('')}</div><div class="k" style="margin-top:.6vh;font-size:1.5vh">${t('ban')}</div>`;return}
 if(P>=1&&P<=NR){const i=P-1;
  if(SUB>=2){const f=SUB===2?rsI(i):(p=>p.t||0);el.innerHTML=`${conn}<div class="col big">${rows(topN(J,f),f)}</div>`;return}
  const done=J.filter(p=>(p.f||[]).includes(i)),pend=J.filter(p=>!(p.f||[]).includes(i)&&active(p)),inR=pend.filter(p=>p.r===i),tot=done.length+pend.length,pc=tot?Math.round(done.length/tot*100):0;
  let extra='';
  if(i===6){const st=J.filter(p=>(p.r===6||(p.f||[]).includes(6))&&p.v>0).length,w=J.filter(p=>((p.x||[])[6]||0)>=5).length;extra=`<div class="cnt" style="font-size:2.6vh">🧍 ${t('standing')}: <b style="font-size:3.6vh">${st}</b> · 🏆 ${t('winners')}: <b style="font-size:3.6vh">${w}</b></div>`}
  if(i===5){const w=J.filter(p=>((p.x||[])[5]||0)>=7).length;extra=`<div class="cnt" style="font-size:2.6vh">🏁 ${t('lap')}: <b style="font-size:3.6vh">${w}</b></div>`}
  el.innerHTML=`${conn}<div class="lv"><div class="col"><div class="k">${t('prog')}</div><div class="cnt"><b>${done.length}</b> / ${tot} ${t('done')}</div><div class="bar"><i style="width:${pc}%"></i></div><div class="cnt" style="font-size:2.2vh;color:var(--mut)">${inR.length} ${t('now')} · ${pend.length} ${t('left')}</div>${extra}<div class="chips">${inR.slice().sort((a,b)=>b.ts-a.ts).slice(0,30).map(p=>chipH(p,` <small>${p.q}/${p.nq}</small>`)).join('')}</div></div>
  <div class="col"${i===3||i===5?' style="padding:1vh .6vw"':''}>${i===3?`<div class="k">🏃 ${T[L].r[i].n}</div>`+laneH(J,3,6,'🏃'):i===5?`<div class="k">🐎 ${T[L].r[i].n}</div>`+ovalH(J):`<div class="k">🏅 ${t('top')} · ${T[L].r[i].n}</div>${rows(topN(J,rsI(i)),rsI(i))}`}</div>
  <div class="col"><div class="k">👑 ${t('top')} · ${t('overall')}</div>${rows(topN(J,p=>p.t||0),p=>p.t||0)}</div></div>`;return}
 if(P===NR+1){const tt=topN(J,p=>p.t||0,10);el.innerHTML=`<div class="col big">${tt.map((x,k)=>`<div class="tr ${k<3?'m'+k:''}" style="${thr>=0&&k>=tt.length-1-thr?'':'visibility:hidden'}"><span class="pp">${k<3?['🥇','🥈','🥉'][k]:k+1}</span><span class="aa">${esc(x.a)}</span><b>${(x.t||0).toLocaleString(L)}</b></div>`).join('')}</div>`;return}
 if(P===NR+2){const tt=topN(J,p=>p.t||0,3);el.innerHTML=`<div class="podium">${[tt[1],tt[0],tt[2]].map((x,j)=>x?`<div class="pod p${[2,1,3][j]}"><div style="font-size:3.2vh;font-weight:700">${esc(x.a)}</div><div style="font-family:Cinzel,serif;color:var(--oro2);font-size:3.4vh;font-weight:900">${(x.t||0).toLocaleString(L)}</div><div class="blk" style="height:${[15,22,10][j]}vh">${[2,1,3][j]}</div></div>`:'').join('')}</div>`;return}
}
function laneH(list,i,n,em){const tt=topN(list,p=>((p.x||[])[i]||0)+((p.rs||[])[i]||0)/1e5,10);if(!tt.length)return '';
 return `<div class="vis">${tt.map(p=>{const v=Math.min(n,(p.x||[])[i]||0);return `<div class="lane"><span class="lb">${esc(p.a)}</span>${Array.from({length:n-1},(_,k)=>`<div class="mj" style="left:${24+(k+1)*72/n}%"></div>`).join('')}<span class="tk" style="left:${24+v*72/n}%">${em}</span></div>`}).join('')}</div>`}
function ovalH(list){const tt=topN(list,p=>((p.x||[])[5]||0)+((p.rs||[])[5]||0)/1e5,10);if(!tt.length)return '';
 const pos=(v,k)=>{const a=Math.PI/2-v/7*2*Math.PI,rr=1-(k%3)*.07;return {x:50+44*rr*Math.cos(a),y:50+40*rr*Math.sin(a)}};
 return `<div class="vis"><div class="oval"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><ellipse cx="50" cy="50" rx="48" ry="46" fill="rgba(194,160,96,.22)" stroke="rgba(237,171,0,.6)" stroke-width=".6"/><ellipse cx="50" cy="50" rx="30" ry="22" fill="#0d1f4a" stroke="rgba(237,171,0,.6)" stroke-width=".6"/><rect x="28" y="48" width="44" height="4" fill="rgba(237,171,0,.5)"/><line x1="50" y1="72" x2="50" y2="96" stroke="#fff" stroke-width=".8" stroke-dasharray="2 2"/></svg>${tt.map((p,k)=>{const q=pos(Math.min(7,(p.x||[])[5]||0),k);return `<div class="cq" style="left:${q.x}%;top:${q.y}%"><b>🐎</b>${esc(p.a)}</div>`}).join('')}</div></div>`}

/* navegación */
function next(){if(P>=1&&P<=NR){const i=P-1;if(ST.r<i){openRound(i);return}if(SUB<3){SUB=Math.max(SUB,1)+1;beep(500,.15);render();return}}
 if(P===NR+1){if(thr<9){thr++;beep(300+thr*60,.2);live();return}}
 if(P<NR+2){P++;SUB=(P>=1&&P<=NR&&ST.r>=P-1)?1:0;if(P===NR+1)thr=-1;render()}}
function prev(){if(P>=1&&P<=NR&&SUB>=2){SUB--;render();return}if(P===NR+1&&thr>=0){thr--;live();return}if(P>0){P--;SUB=(P>=1&&P<=NR&&ST.r>=P-1)?1:0;render()}}
$('next').onclick=next;$('prev').onclick=prev;
$('lng').onclick=()=>{L=L==='es'?'en':'es';render()};
$('fsb').onclick=()=>{const d=document.documentElement;if(!document.fullscreenElement)d.requestFullscreen&&d.requestFullscreen();else document.exitFullscreen()};
document.addEventListener('keydown',e=>{if($('pinbox').style.display==='flex')return;if(e.key===' '||e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();next()}else if(e.key==='ArrowLeft'||e.key==='PageUp')prev();else if(e.key==='f'||e.key==='F')$('fsb').onclick()});
function confetti(){const c=$('conf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const Pp=Array.from({length:260},()=>({x:Math.random()*c.width,y:-Math.random()*c.height,v:2+Math.random()*4,r:Math.random()*6,s:7+Math.random()*9,c:['#EDAB00','#FBC93D','#5aa3e6','#f2efe6'][Math.random()*4|0]}));let f=0;(function a(){x.clearRect(0,0,c.width,c.height);Pp.forEach(p=>{p.y+=p.v;p.x+=Math.sin(p.y/40);p.r+=.05;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++f<480)requestAnimationFrame(a);else x.clearRect(0,0,c.width,c.height)})()}

/* arranque: si la sala ya estaba abierta, se retoma en la ronda en juego */
(async()=>{if(!PIN)askPin();await poll();if(ST.open&&ST.r>=0){P=ST.r+1;SUB=1}render();setInterval(poll,3000)})();
</script>
