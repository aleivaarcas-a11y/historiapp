// pantallas: 0 portada · 1-6 rondas · 7 ceremonia (umbral 0..n) · 8 último
let SUB=0,P=0,thr=-1,shown={},clk=null,t0=0;
function beep(f,d,v=.12,w=0){try{window.AC=window.AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime+w);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+w+d);o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+w);o.stop(AC.currentTime+w+d+.05)}catch(e){}}
function render(){
 clearInterval(clk);const s=$('st');$('tt').textContent=t('title');$('next').textContent=t('next');$('lng').textContent=L==='es'?'EN':'ES';
 $('pips').innerHTML=Array.from({length:6},(_,i)=>`<div class="pip ${P-1>i?'done':P-1===i?'on':''}"></div>`).join('');
 if(P===0){
  s.innerHTML=`<div class="k rise">${t('sub')}</div><h1 class="cz rise">${t('title')}</h1><div class="row rise"><div><div id="qr"></div><div class="url">${URLJ.replace('https://','')}</div></div><div class="steps"><div class="k" style="text-align:left">${t('join')}</div>${t('steps').map((x,i)=>`<div>${i+1}. ${x}</div>`).join('')}</div></div><div id="live" style="margin-top:2vh;width:90vw"></div>`;live();
  $('qr').innerHTML='<img src="'+QRIMG+'" alt="QR">'
  return}
 if(P>=1&&P<=6&&shown[P-1]&&SUB>=2){const i=P-1,R=T[L].r[i];s.style.justifyContent='center';s.innerHTML=`<div class="k rise">${t('round')} ${i+1} · ${R.t}</div><h1 class="cz rise" style="font-size:6.5vh;margin-bottom:2vh">${SUB===2?(L==='es'?'Clasificación · ':'Standings · ')+R.n:(L==='es'?'Clasificación general':'Overall standings')}</h1><div id="live" style="width:64vw"></div>`;live();return}
 if(P>=1&&P<=6&&shown[P-1]){const i=P-1,R=T[L].r[i];s.style.justifyContent='flex-start';s.innerHTML=`<div class="hd"><span class="em" style="font-size:6vh">${R.e}</span><div style="text-align:left"><div class="k" style="margin:0">${t('round')} ${i+1} · ${R.t}</div><div class="cz" style="font-size:5vh;color:var(--oro);font-weight:900">${R.n}</div></div><div style="margin-left:auto;text-align:right"><div class="k" style="margin:0">${t('key')}</div><div class="clock" id="clk" style="margin:0"></div></div></div><div id="live" style="width:92vw"></div>`;tick();live();return}
 if(P>=1&&P<=6){const i=P-1,R=T[L].r[i];s.style.justifyContent='center';
  s.innerHTML=(i===4?`<div class="k rise" style="color:var(--oro2);font-size:3vh;letter-spacing:.15em">🧍 ${t('stand')} 🧍</div>`:'')+`<div class="k rise">${t('round')} ${i+1} · ${R.t}</div><div class="em rise">${R.e}</div><h1 class="cz rise">${R.n}</h1><p class="lead rise">${R.d}</p><div class="rules rise">${R.rules.map(r=>`<div class="rule"><b>${r[0]}</b>${r[1]}</div>`).join('')}</div><div class="tip rise"><b>📝 ${t('tipK')}.</b> ${R.tip}</div><div class="k rise" style="margin-top:1.4vh;color:var(--oro2);font-size:2.4vh">⏱ ${Math.round(RDUR[i]/60*10)/10} min</div>
  <div class="key" id="kb">${shown[i]?`<div class="k" style="margin:0">${t('key')}</div><div class="kv">${KEYS[i]}</div>`:`<div class="kh" id="kh">🔑 ${t('showKey')}</div>`}</div><div class="clock" id="clk"></div>`;
  if(!shown[i])$('kh').onclick=()=>reveal(i);else tick();
  return}
 if(P===7){s.style.justifyContent='center';s.innerHTML=`<div class="k rise">${t('cer')}</div><h1 class="cz rise" style="font-size:6vh;margin-bottom:2vh">Top 10</h1><div id="live" style="width:90vw"></div>`;live();return}
 if(P===8){s.style.justifyContent='center';s.innerHTML=`<div class="em rise" style="font-size:6vh">🌿👑🌿</div><h1 class="cz rise" style="font-size:6vh">${t('crown')}</h1><div id="live" style="width:80vw"></div><div class="k rise" style="color:var(--oro2);margin-top:2vh;font-size:2.6vh">${t('thanks')}</div>`;live();[523,659,784,1047].forEach((f,i)=>beep(f,.3,.14,i*.15));confetti();return}
}
function reveal(i){shown[i]=Date.now();SUB=1;try{fetch(RK_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({accion:'rp_abrir',sala:SALA,r:i})}).catch(()=>{})}catch(e){}[392,523,659,784].forEach((f,k)=>beep(f,.2,.1,k*.1));render()}
function tick(){const i=P-1;let rang=false;const f=()=>{const left=Math.max(0,RDUR[i]-Math.floor((Date.now()-shown[i])/1000));const c=$('clk');if(c){c.innerHTML=`<span style="font-size:7vh;color:${left<=20?'#fff':'var(--oro2)'}">⏱ ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}</span>`}if(left<=0&&!rang){rang=true;beep(110,1.2,.25)}};f();clk=setInterval(f,1000)}
function next(){if(P>=1&&P<=6){if(!shown[P-1]){reveal(P-1);return}if(SUB<3){SUB=Math.max(SUB,1)+1;beep(500,.15);render();return}SUB=0}if(P===7){if(thr<9){thr++;beep(300+thr*60,.2);live();return}P=8;render();return}if(P<8){P++;if(P===7)thr=-1;render()}}
function prev(){if(P>=1&&P<=6&&SUB>=2){SUB--;render();return}SUB=0;if(P===7&&thr>=0){thr--;live();return}if(P>0){P--;if(P===7)thr=-1;render()}}
$('next').onclick=next;$('prev').onclick=prev;
$('lng').onclick=()=>{L=L==='es'?'en':'es';render()};
$('fsb').onclick=()=>{const d=document.documentElement;if(!document.fullscreenElement)d.requestFullscreen&&d.requestFullscreen();else document.exitFullscreen()};
document.addEventListener('keydown',e=>{if(e.key===' '||e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();next()}else if(e.key==='ArrowLeft'||e.key==='PageUp')prev();else if((e.key==='c'||e.key==='C')&&P>=1&&P<=6&&!shown[P-1])reveal(P-1);else if(e.key==='f'||e.key==='F')$('fsb').onclick()});
function confetti(){const c=$('conf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const Pp=Array.from({length:260},()=>({x:Math.random()*c.width,y:-Math.random()*c.height,v:2+Math.random()*4,r:Math.random()*6,s:7+Math.random()*9,c:['#EDAB00','#FBC93D','#5aa3e6','#f2efe6'][Math.random()*4|0]}));let f=0;(function a(){x.clearRect(0,0,c.width,c.height);Pp.forEach(p=>{p.y+=p.v;p.x+=Math.sin(p.y/40);p.r+=.05;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++f<480)requestAnimationFrame(a);else x.clearRect(0,0,c.width,c.height)})()}
render();
</script>
</body>
</html>
