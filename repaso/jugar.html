»: así registró Élide la edición de 364 a. C., organizada por los arcadios.","en":"'Non-Olympiad': the name Elis gave to the edition of 364 BC, organised by the Arcadians."}},{"term":{"es":"Stádion","en":"Stadion"},"def":{"es":"Medida de 600 pies, la carrera de esa longitud y el recinto donde se corría.","en":"Measure of 600 feet, the race of that length and the venue where it was run."}},{"term":{"es":"Tetras","en":"Tetrad"},"def":{"es":"Microciclo de entrenamiento de cuatro días: preparación, esfuerzo total, relajación y esfuerzo moderado.","en":"Four-day training microcycle: preparation, all-out effort, relaxation and moderate effort."}},{"term":{"es":"Gimnasiarca","en":"Gymnasiarch"},"def":{"es":"Ciudadano, habitualmente adinerado, al cargo del gimnasio.","en":"Citizen, usually wealthy, in charge of the gymnasium."}},{"term":{"es":"Gymnasion","en":"Gymnasion"},"def":{"es":"Literalmente «lugar de la desnudez»; espacio de las disciplinas atléticas.","en":"Literally 'place of nakedness'; space for the athletic disciplines."}},{"term":{"es":"Helanódicas","en":"Hellanodikai"},"def":{"es":"Jueces de los Juegos, ciudadanos de Élide.","en":"Judges of the Games, citizens of Elis."}},{"term":{"es":"Periodonikes","en":"Periodonikes"},"def":{"es":"«Vencedor del circuito», título del que ganaba en Olimpia, Delfos, el Istmo y Nemea.","en":"'Circuit victor', title of whoever won at Olympia, Delphi, the Isthmus and Nemea."}},{"term":{"es":"Victoria «sin polvo»","en":"Victory 'without dust'"},"def":{"es":"Triunfo sin competir cuando todos los rivales abandonaban ante la superioridad de uno.","en":"Victory without competing when all rivals withdrew before one man's superiority."}},{"term":{"es":"Perizoma","en":"Perizoma"},"def":{"es":"Pequeña túnica atada a modo de cinturón o taparrabos de los primeros atletas olímpicos.","en":"Small tunic tied like a belt or loincloth worn by the first Olympic athletes."}},{"term":{"es":"Kléos","en":"Kleos"},"def":{"es":"Gloria eterna que sobrevivía a la muerte del vencedor.","en":"Eternal glory that outlived the victor."}},{"term":{"es":"Agón","en":"Agon"},"def":{"es":"«Contienda»; competición que exige un adversario.","en":"'Contest'; competition that requires an opponent."}},{"term":{"es":"Kalokagathía","en":"Kalokagathia"},"def":{"es":"Equilibrio entre lo bello (kalos) y lo bueno (agathos), modelo de conducta del noble griego.","en":"Balance between the beautiful (kalos) and the good (agathos), the model of conduct of the Greek noble."}},{"term":{"es":"Areté","en":"Arete"},"def":{"es":"«Excelencia», el valor más alto de la sociedad griega.","en":"'Excellence', the highest value of Greek society."}},{"term":{"es":"Aidós","en":"Aidos"},"def":{"es":"Compostura, humildad y reconocimiento del favor de los dioses que se esperaban del vencedor.","en":"Composure, humility and acknowledgement of divine favour expected of the victor."}},{"term":{"es":"Díaulos","en":"Diaulos"},"def":{"es":"Carrera de dos estadios (384,56 m), añadida en 724 a. C.","en":"Two-stadion race (384.56 m), added in 724 BC."}},{"term":{"es":"Dólico","en":"Dolichos"},"def":{"es":"Carrera de fondo de 20 a 24 estadios, añadida en 720 a. C.","en":"Long-distance race of 20 to 24 stadia, added in 720 BC."}},{"term":{"es":"Hoplitódromo","en":"Hoplitodromos"},"def":{"es":"Carrera de dos estadios con armamento de hoplita, desde 520 a. C.","en":"Two-stadion race in hoplite equipment, from 520 BC."}},{"term":{"es":"Balbís","en":"Balbis"},"def":{"es":"Umbral de piedra de la salida, con dos ranuras para los dedos de los pies.","en":"Stone starting sill with two grooves for the toes."}},{"term":{"es":"Hýsplex","en":"Hysplex"},"def":{"es":"Barrera de cuerdas que caía a la vez ante todos los corredores en la salida.","en":"Barrier of ropes that dropped at the same moment before all the runners at the start."}},{"term":{"es":"Kamptér","en":"Kampter"},"def":{"es":"Poste de giro de las carreras.","en":"Turning post in the races."}},{"term":{"es":"Halteras","en":"Halteres"},"def":{"es":"Pesos de piedra, plomo o bronce, de 1,4 a 4,5 kg, para el salto.","en":"Weights of stone, lead or bronze, 1.4 to 4.5 kg, used in the jump."}},{"term":{"es":"Skamma","en":"Skamma"},"def":{"es":"Foso de tierra removida donde caía el saltador.","en":"Pit of dug earth where the jumper landed."}},{"term":{"es":"Ankýle","en":"Ankyle"},"def":{"es":"Correa de cuero de 30 a 45 cm enrollada en el asta de la jabalina.","en":"Leather thong 30 to 45 cm long wound round the javelin shaft."}},{"term":{"es":"Palé","en":"Pale"},"def":{"es":"Lucha de pie; vencía el primero en sumar tres caídas.","en":"Upright wrestling; the first to score three falls won."}},{"term":{"es":"Himantes","en":"Himantes"},"def":{"es":"Tiras de cuero con las que se enrollaban las manos los primeros púgiles.","en":"Leather thongs that the first boxers wrapped round their hands."}},{"term":{"es":"Klímax","en":"Klimax"},"def":{"es":"Barrera con la que los jueces reducían el espacio si los púgiles rehuían el combate.","en":"Barrier with which the judges reduced the space if the boxers avoided fighting."}},{"term":{"es":"Pancracio","en":"Pankration"},"def":{"es":"Combate que mezclaba golpes, patadas y agarres, desde 648 a. C.","en":"Combat mixing blows, kicks and holds, from 648 BC."}},{"term":{"es":"Kéles","en":"Keles"},"def":{"es":"Carrera de caballos montados a pelo, desde 648 a. C.","en":"Horse race ridden bareback, from 648 BC."}},{"term":{"es":"Kálpe","en":"Kalpe"},"def":{"es":"Carrera en la que el jinete corría la última vuelta al lado del caballo.","en":"Race in which the rider ran the last lap beside the horse."}},{"term":{"es":"Oikos","en":"Oikos"},"def":{"es":"Casa familiar, que con la maternidad delimitaba el papel de la mujer libre.","en":"Family household, which with motherhood defined the role of the free woman."}},{"term":{"es":"Juegos Hereos","en":"Heraia"},"def":{"es":"Carrera de muchachas solteras en honor de Hera, instituida hacia 580 a. C.","en":"Race of unmarried girls in honour of Hera, established c. 580 BC."}},{"term":{"es":"Mastigóforos","en":"Mastigophoroi"},"def":{"es":"«Portadores del látigo», que azotaban al atleta infractor.","en":"'Whip-bearers', who flogged offending athletes."}},{"term":{"es":"Zanes","en":"Zanes"},"def":{"es":"Estatuas de Zeus pagadas con las multas, con el nombre del infractor en el pedestal.","en":"Statues of Zeus paid for with fines, with the offender's name on the pedestal."}}],"t4gloss":[{"term":{"es":"Phersu","en":"Phersu"},"def":{"es":"Personaje enmascarado de la Tumba de los Augures de Tarquinia (hacia 530 a. C.) que azuza a un perro contra un hombre encapuchado y cuyo nombre, que probablemente significa «máscara», está emparentado con el latín persona.","en":"Masked figure in the Tomb of the Augurs at Tarquinia (c. 530 BC) who sets a dog on a hooded man, and whose name, which probably means 'mask', is related to the Latin persona."}},{"term":{"es":"Desultor","en":"Desultor"},"def":{"es":"Jinete acróbata que saltaba de un caballo a otro en plena carrera y ocupó el lugar de las carreras de caballos con jinete, de modo que la hípica etrusca pasó de la carrera a la acrobacia.","en":"Acrobatic rider who leapt from one horse to another in mid-race and took the place of ridden horse races, so that Etruscan horsemanship moved from racing to acrobatics."}},{"term":{"es":"Troia (troya)","en":"Troia (Troy game)"},"def":{"es":"Modalidad ecuestre y juego de habilidad a caballo en el que los jinetes recorrían un laberinto de curvas, que Roma conservó de Etruria y programó en el circo.","en":"Equestrian discipline and game of skill on horseback in which the riders followed a labyrinth of curves, which Rome kept from Etruria and staged in the circus."}},{"term":{"es":"Biga, triga y cuadriga","en":"Biga, triga and quadriga"},"def":{"es":"Carros de dos, tres y cuatro caballos respectivamente, de los que los etruscos preferían la biga y usaban también la triga, mientras que en el circo romano corrían casi siempre cuadrigas.","en":"Chariots drawn by two, three and four horses respectively, of which the Etruscans preferred the biga and also used the triga, whereas in the Roman circus quadrigae almost always raced."}},{"term":{"es":"Ascolia","en":"Ascolia"},"def":{"es":"Juego de los banquetes de las clases altas etruscas en el que había que mantenerse en equilibrio sobre un odre engrasado, es decir, un saco de piel de oveja.","en":"Game of the banquets of the Etruscan upper classes in which one had to keep one's balance on a greased wineskin, that is, a sheepskin bag."}},{"term":{"es":"Kottabos","en":"Kottabos"},"def":{"es":"Juego de banquete en el que se lanzaban las últimas gotas de la copa hacia un blanco, como el platillo de un candelabro, y que está documentado también en el banquete griego.","en":"Banquet game in which the last drops in the cup were flung at a target, such as the dish of a candelabrum, and which is also documented at the Greek banquet."}},{"term":{"es":"Princeps","en":"Princeps"},"def":{"es":"«Primer ciudadano», título con el que Augusto ocupó el centro del Estado de por vida, con el mando de todos los ejércitos y los poderes de los tribunos, sin abolir las instituciones republicanas.","en":"'First citizen', the title with which Augustus occupied the centre of the state for life, with command of all the armies and the powers of the tribunes, without abolishing the republican institutions."}},{"term":{"es":"Ediles","en":"Aediles"},"def":{"es":"Magistrados encargados de los mercados, los edificios públicos y las fiestas, que en la República pagaban los juegos del calendario con dinero público al que solían añadir el suyo.","en":"Magistrates in charge of the markets, public buildings and festivals, who under the Republic paid for the games of the calendar with public money to which they usually added their own."}},{"term":{"es":"Caballeros (orden ecuestre)","en":"Equites (equestrian order)"},"def":{"es":"Segundo grupo de la élite romana, llamado así porque en origen sus miembros servían a caballo en el ejército, que con el tiempo reunió a los hombres de negocios y a los altos administradores, con menos fortuna que los senadores y sin acceso al Senado.","en":"Second group of the Roman elite, so called because its members originally served on horseback in the army, which over time brought together businessmen and senior administrators, with a smaller fortune than the senators and no access to the Senate."}},{"term":{"es":"Manumisión (manumissio)","en":"Manumission (manumissio)"},"def":{"es":"Liberación de un esclavo por parte de su amo, que lo convertía en liberto y ciudadano con un rango inferior al de los nacidos libres.","en":"Release of a slave by his master, which turned him into a freedman and a citizen with a lower rank than the freeborn."}},{"term":{"es":"Liberto","en":"Freedman"},"def":{"es":"Esclavo liberado por su amo mediante la manumisión, que pasaba a ser ciudadano con un rango inferior al de los nacidos libres, aunque sus hijos ya nacían libres y sin esa marca.","en":"Slave freed by his master through manumission, who became a citizen with a lower rank than the freeborn, although his children were born free and without that mark."}},{"term":{"es":"Agón","en":"Agon"},"def":{"es":"Contienda con un adversario, en la que para los griegos clásicos residía lo importante del deporte, frente al ludus romano, el juego ofrecido al público.","en":"Contest with an opponent, in which for the classical Greeks lay what mattered in sport, as against the Roman ludus, the game offered to the public."}},{"term":{"es":"Ludus","en":"Ludus"},"def":{"es":"Juego ofrecido al público que caracteriza el deporte romano frente al agón griego, y también la escuela a cargo de un lanista en la que vivían y se entrenaban los gladiadores.","en":"Game offered to the public that characterises Roman sport as against the Greek agon, and also the school run by a lanista in which gladiators lived and trained."}},{"term":{"es":"Ludi","en":"Ludi"},"def":{"es":"Juegos públicos del calendario religioso, ofrecidos a los dioses y pagados en origen por el Estado, que comprendían las carreras de carros del circo (ludi circenses) y las representaciones teatrales (ludi scaenici).","en":"Public games of the religious calendar, offered to the gods and originally paid for by the State, which included the chariot races of the circus (ludi circenses) and theatrical performances (ludi scaenici)."}},{"term":{"es":"Munus (plural munera)","en":"Munus (plural munera)"},"def":{"es":"Palabra que significaba a la vez «deber» y «regalo», en origen la obligación de un hijo con su padre muerto, al que honraba con un combate de gladiadores, y hacia el comienzo del Imperio el combate que un particular ofrecía al pueblo.","en":"Word that meant both 'duty' and 'gift', originally a son's obligation to his dead father, whom he honoured with a gladiatorial combat, and around the beginning of the Empire the combat that a private individual offered to the people."}},{"term":{"es":"Panem et circenses («pan y circo»)","en":"Panem et circenses ('bread and circuses')"},"def":{"es":"Política según la cual los romanos debían tener acceso a alimentos asequibles, como el grano público, y a entretenimientos públicos con los que el poder se ganaba su favor, expresión que Juvenal, en el siglo II d. C., usó como reproche a la plebe.","en":"Policy according to which Romans were to have access to affordable food, such as the public grain, and to public entertainments with which those in power won their favour, an expression that Juvenal, in the 2nd century AD, used as a reproach to the plebs."}},{"term":{"es":"Anfiteatro","en":"Amphitheatre"},"def":{"es":"Edificio público de planta elíptica, con gradas en todo su perímetro alrededor de un espacio central cubierto de arena, que nació de unir dos teatros enfrentados.","en":"Public building with an elliptical plan, with stands all around its perimeter surrounding a central space covered with sand, which arose from joining two theatres facing each other."}},{"term":{"es":"Harena (arena)","en":"Harena (sand)"},"def":{"es":"Arena que cubría el espacio central del anfiteatro y que dio nombre al lugar de los combates.","en":"Sand covering the central space of the amphitheatre, which gave its name to the place of combat."}},{"term":{"es":"Vomitoria","en":"Vomitoria"},"def":{"es":"Arcos abovedados del anfiteatro por los que el público entraba a las gradas.","en":"Vaulted arches of the amphitheatre through which the public entered the stands."}},{"term":{"es":"Velarium","en":"Velarium"},"def":{"es":"Enorme toldo que se tendía sobre las gradas del Coliseo y que manejaban marinos de la flota.","en":"Enormous awning stretched above the stands of the Colosseum, operated by sailors from the fleet."}},{"term":{"es":"Lex Iulia theatralis","en":"Lex Iulia theatralis"},"def":{"es":"Ley de Augusto que repartía los asientos de teatros y anfiteatros por grupos sociales, de modo que la grada reproducía la jerarquía de la ciudad.","en":"Law of Augustus that allocated the seats of theatres and amphitheatres by social group, so that the stands reproduced the hierarchy of the city."}},{"term":{"es":"Dissignatores","en":"Dissignatores"},"def":{"es":"Acomodadores del anfiteatro, que impedían que un plebeyo ocupara las filas reservadas.","en":"Ushers of the amphitheatre, who prevented a plebeian from occupying the reserved rows."}},{"term":{"es":"Lanista","en":"Lanista"},"def":{"es":"Empresario que compraba, entrenaba y alquilaba gladiadores, y a cuyo cargo estaba el ludus en el que vivían.","en":"Entrepreneur who bought, trained and hired out gladiators, and who ran the ludus in which they lived."}},{"term":{"es":"Infamia","en":"Infamia"},"def":{"es":"Mancha legal y moral que el derecho imponía a quienes vendían o exhibían su cuerpo para el disfrute de otros, y que impedía votar, ocupar una magistratura, testificar en un juicio y contraer un matrimonio legal.","en":"Legal and moral stain that the law imposed on those who sold or displayed their bodies for the enjoyment of others, and which barred them from voting, holding a magistracy, testifying in a trial and contracting a legal marriage."}},{"term":{"es":"Armatura","en":"Armatura"},"def":{"es":"Identidad de combate que recibía cada gladiador, con unas armas ofensivas y defensivas determinadas.","en":"Combat identity received by each gladiator, with a specific set of offensive and defensive weapons."}},{"term":{"es":"Editor","en":"Editor"},"def":{"es":"Quien ofrecía los juegos y presidía el munus desde su palco, y a quien correspondía decidir, atento a la grada, la suerte del gladiador vencido.","en":"Whoever gave the games and presided over the munus from his box, and who decided, attentive to the stands, the fate of the defeated gladiator."}},{"term":{"es":"Summa honoraria","en":"Summa honoraria"},"def":{"es":"Cuota que pagaba quien estrenaba un cargo y que, junto con lo que el editor añadía de su bolsillo y los fondos de la ciudad, financiaba el munus.","en":"Fee paid by whoever took up an office which, together with what the editor added out of his own pocket and the city's funds, financed the munus."}},{"term":{"es":"Evergetismo","en":"Euergetism"},"def":{"es":"Intercambio por el que el rico pagaba para divertir a los demás a cambio de reconocimiento, y que tuvo en el munus una de sus formas más costosas.","en":"Exchange by which the rich man paid to entertain others in return for recognition, and which had in the munus one of its costliest forms."}},{"term":{"es":"Edicta munerum","en":"Edicta munerum"},"def":{"es":"Carteles pintados en las paredes de la ciudad con los que se anunciaba un munus con antelación.","en":"Painted notices on the walls of the city with which a munus was announced in advance."}},{"term":{"es":"Cena libera","en":"Cena libera"},"def":{"es":"Gran cena abierta al público que se celebraba la noche previa al combate y en la que los gladiadores podían saltarse el régimen de entrenamiento.","en":"Great dinner open to the public held on the eve of the combat, at which the gladiators could break their diet of training."}},{"term":{"es":"Probatio armorum","en":"Probatio armorum"},"def":{"es":"Comprobación de las armas antes del combate, en la que se revisaba el equipo y se confirmaban las parejas.","en":"Inspection of the weapons before the combat, in which the equipment was checked and the pairs confirmed."}},{"term":{"es":"Summa rudis","en":"Summa rudis"},"def":{"es":"Árbitro del combate de gladiadores, que vigilaba el duelo.","en":"Referee of the gladiatorial combat, who watched over the duel."}},{"term":{"es":"Rudis","en":"Rudis"},"def":{"es":"Espada de madera que simbolizaba la licencia del gladiador que se retiraba.","en":"Wooden sword that symbolised the discharge of a retiring gladiator."}},{"term":{"es":"Rudis","en":"Rudis"},"def":{"es":"Espada de madera que servía para entrenar y que simbolizaba la licencia del gladiador, eximido desde entonces de combatir.","en":"Wooden sword used for training, which symbolised the gladiator's discharge, after which he was exempted from fighting."}},{"term":{"es":"Missio","en":"Missio"},"def":{"es":"Indulto que el editor concedía al gladiador vencido que pedía clemencia, frente al iugula.","en":"Reprieve that the editor granted to the defeated gladiator who asked for mercy, as against the iugula."}},{"term":{"es":"Iugula","en":"Iugula"},"def":{"es":"Degüello del gladiador vencido, que el editor podía decidir en lugar de la missio.","en":"Cutting of the throat of the defeated gladiator, which the editor could decide on in place of the missio."}},{"term":{"es":"Tipos de gladiador","en":"Types of gladiator"},"def":{"es":"Especialidades de combate de la arena (murmillo, tracio, hoplómaco, secutor, reciario, scissor, provocator, eques, esedario, arquero y dimachaerus), cada una con sus armas y con los rivales que le correspondían.","en":"Combat specialities of the arena (murmillo, Thracian, hoplomachus, secutor, retiarius, scissor, provocator, horseman, essedarius, archer and dimachaerus), each with its own weapons and the opponents that suited it."}},{"term":{"es":"Venatio","en":"Venatio"},"def":{"es":"Espectáculo del anfiteatro con animales como ciervos, jabalíes o perros y fieras como leones, elefantes u osos traídos de todos los rincones del imperio, que se presentaba como exhibición, lucha entre fieras, cacería o ejecución.","en":"Amphitheatre spectacle with animals such as deer, wild boar or dogs and wild beasts such as lions, elephants or bears brought from every corner of the empire, presented as a display, a fight between beasts, a hunt or an execution."}},{"term":{"es":"Venator y bestiarius","en":"Venator and bestiarius"},"def":{"es":"Los venatores eran los hombres armados que cazaban a las fieras en la venatio y los bestiarii, los que luchaban contra ellas.","en":"The venatores were the armed men who hunted the beasts in the venatio and the bestiarii, those who fought against them."}},{"term":{"es":"Damnati ad bestias","en":"Damnati ad bestias"},"def":{"es":"Condenados a las fieras, que morían en la arena como ejecución dentro de la venatio.","en":"Those condemned to the beasts, who died in the arena as an execution within the venatio."}},{"term":{"es":"Naumaquia","en":"Naumachia"},"def":{"es":"Combate naval representado con barcos de guerra y miles de combatientes, casi siempre condenados, en lagos o en cuencas excavadas para la ocasión.","en":"Naval battle staged with warships and thousands of combatants, almost always condemned men, on lakes or in basins dug for the occasion."}},{"term":{"es":"Circo","en":"Circus"},"def":{"es":"Recinto de las carreras de carros, de planta muy alargada con un extremo recto y otro curvo, que solo levantaron las principales ciudades del Imperio y que formaba, junto al anfiteatro y al teatro, la tríada de grandes edificios con los que las ciudades entretenían al pueblo.","en":"Venue for chariot races, very elongated, with one straight end and one curved end, which only the main cities of the Empire built and which formed, together with the amphitheatre and the theatre, the triad of great buildings with which cities entertained the people."}},{"term":{"es":"Carceres","en":"Carceres"},"def":{"es":"Cocheras de salida situadas en el extremo recto del circo, dispuestas en arco para que ningún carro partiera con ventaja.","en":"Starting gates at the straight end of the circus, arranged in an arc so that no chariot started with an advantage."}},{"term":{"es":"Spina","en":"Spina"},"def":{"es":"Muro bajo que corría a lo largo del eje del circo y dividía la pista en dos, junto al cual los aurigas buscaban la cuerda, el camino más corto.","en":"Low wall running along the axis of the circus that divided the track in two, beside which the charioteers sought the inside line, the shortest route."}},{"term":{"es":"Metae","en":"Metae"},"def":{"es":"Columnas cónicas que se alzaban en cada extremo de la spina y marcaban los puntos de giro de los carros.","en":"Conical columns that stood at each end of the spina and marked the turning points of the chariots."}},{"term":{"es":"Mappa","en":"Mappa"},"def":{"es":"Pañuelo blanco que dejaba caer, desde una tribuna sobre las carceres, quien pagaba los juegos para dar la salida de la carrera.","en":"White cloth that whoever paid for the games dropped from a platform above the carceres to start the race."}},{"term":{"es":"Factio","en":"Factio (faction)"},"def":{"es":"Empresa que organizaba un equipo de carreras, identificada con un color (blanco, rojo, verde o azul) que vestían sus aurigas.","en":"Company that organised a racing team, identified with a colour (white, red, green or blue) worn by its charioteers."}},{"term":{"es":"Dominus factionis","en":"Dominus factionis"},"def":{"es":"Dueño de una facción, un hombre de negocios del orden de los caballeros, que negociaba con quien pagaba los juegos el precio de cada jornada y alquilaba los caballos, los aurigas y el material.","en":"Owner of a faction, a businessman of the order of the equites, who negotiated with whoever paid for the games the price of each day and hired out the horses, the charioteers and the equipment."}},{"term":{"es":"Miliarios","en":"Miliarii"},"def":{"es":"Aurigas que alcanzaron las mil victorias, un grupo del que apenas se conocen cuatro nombres.","en":"Charioteers who reached a thousand victories, a group of which barely four names are known."}},{"term":{"es":"Apodyterium","en":"Apodyterium"},"def":{"es":"Vestuario de las termas, con pequeños nichos vigilados por un esclavo, en el que el bañista dejaba la ropa.","en":"Changing room of the baths, with small niches watched over by a slave, where the bather left his clothes."}},{"term":{"es":"Palestra","en":"Palaestra"},"def":{"es":"Patio porticado de las termas en el que se hacía ejercicio antes del baño, con pesas, lucha y juegos de pelota.","en":"Porticoed courtyard of the baths where exercise took place before bathing, with weights, wrestling and ball games."}},{"term":{"es":"Laconicum","en":"Laconicum"},"def":{"es":"Sala de vapor de las termas, en la que se sudaba tras el ejercicio.","en":"Steam room of the baths, in which one sweated after exercise."}},{"term":{"es":"Caldarium","en":"Caldarium"},"def":{"es":"Sala de las termas con bañeras de agua caliente.","en":"Room of the baths with tubs of hot water."}},{"term":{"es":"Tepidarium","en":"Tepidarium"},"def":{"es":"Sala de transición de las termas, a la que se volvía desde el caldarium antes de terminar en el frigidarium.","en":"Transitional room of the baths, to which one returned from the caldarium before finishing in the frigidarium."}},{"term":{"es":"Frigidarium","en":"Frigidarium"},"def":{"es":"Sala de las termas con bañeras de agua fría, en la que terminaba el recorrido del bañista.","en":"Room of the baths with tubs of cold water, where the bather's route ended."}},{"term":{"es":"Cuadrante (quadrans)","en":"Quadrans"},"def":{"es":"La moneda más pequeña, que era lo que costaba la entrada a las termas, de modo que cualquiera podía pagarla.","en":"The smallest coin, which was the price of entry to the baths, so that anyone could afford it."}},{"term":{"es":"Pila paganica","en":"Pila paganica"},"def":{"es":"La pelota más común, rellena de plumas, con la que se jugaba evitando que cayera o pasándola con bote o sin bote.","en":"The most common ball, stuffed with feathers, with which people played by keeping it from falling or passing it with or without a bounce."}},{"term":{"es":"Follis","en":"Follis"},"def":{"es":"Pelota grande de piel inflada, muy ligera y propia de niños y ancianos, hecha con una vejiga de cerdo inflada y forrada de cuero, aunque también la usaban los adultos.","en":"Larger ball of inflated skin, very light and suited to children and the elderly, made from an inflated pig's bladder covered with leather, although adults used it too."}},{"term":{"es":"Trigón (pila trigonalis)","en":"Trigon (pila trigonalis)"},"def":{"es":"Juego popular en el que tres jugadores, colocados en triángulo, se pasaban con fuerza una bola pequeña para poner a prueba los reflejos del compañero, que debía cogerla sin que cayera.","en":"Popular game in which three players, standing in a triangle, passed a small ball hard to test the reflexes of a team-mate, who had to catch it without letting it fall."}},{"term":{"es":"Pilicrepus","en":"Pilicrepus"},"def":{"es":"Nombre que recibían los esclavos de las casas ricas que reponían las pelotas y llevaban la cuenta de los tantos en el trigón.","en":"Name given to the slaves in wealthy houses who replaced the balls and kept count of the points in the trigon."}},{"term":{"es":"Strophium","en":"Strophium"},"def":{"es":"Banda en el pecho con la que se cubrían las deportistas, que llevan las muchachas del mosaico de Piazza Armerina junto a un calzón.","en":"Band across the chest with which sportswomen covered themselves, worn by the girls of the Piazza Armerina mosaic together with briefs."}}],"t2cards":[{"img":"img/t2/piedra_rosetta.jpg","caption":{"es":"Piedra Rosetta, 196 a. C. British Museum","en":"Rosetta Stone, 196 BC. British Museum"},"claim":{"es":"La Piedra Rosetta fue descifrada por Champollion en 1822.","en":"The Rosetta Stone was deciphered by Champollion in 1822."},"answer":true,"explain":{"es":"Hallada por las tropas napoleónicas en 1799, contiene el mismo texto en jeroglífico, demótico y griego antiguo: el apoyo de un grupo de sacerdotes al monarca.","en":"Found by Napoleon's troops in 1799, it carries the same text in hieroglyphic, demotic and ancient Greek: a group of priests' support for the king."}},{"img":"img/t2/protesis_dedo.jpg","caption":{"es":"Prótesis de madera, Luxor, h. 600 a. C.","en":"Wooden prosthesis, Luxor, c. 600 BC"},"claim":{"es":"La prótesis perteneció a un soldado que perdió el pie en combate.","en":"The prosthesis belonged to a soldier who lost his foot in battle."},"answer":false,"explain":{"es":"Perteneció a una mujer noble de 50 a 60 años que perdió el dedo gordo del pie, probablemente por complicaciones de la diabetes. Es la prótesis funcional más antigua conocida y se conserva en la Universidad de Basilea.","en":"It belonged to a noblewoman aged 50 to 60 who lost her big toe, probably through complications of diabetes. It is the oldest known functional prosthesis and is kept at the University of Basel."}},{"img":"img/t2/piramide_social_egipto.jpg","caption":{"es":"La pirámide social egipcia","en":"The Egyptian social pyramid"},"claim":{"es":"Los escribas eran la única clase que sabía leer y escribir.","en":"Scribes were the only class that could read and write."},"answer":true,"explain":{"es":"Llevaban cuentas, censos e impuestos. Por encima estaban el faraón y la aristocracia (visir, clero, nomarcas); por debajo, artesanos, ejército y el pueblo llano.","en":"They kept accounts, censuses and taxes. Above them were the pharaoh and the aristocracy (vizier, clergy, nomarchs); below, craftsmen, the army and the common people."}},{"img":"img/t2/musicas_bailarinas.jpg","caption":{"es":"Músicas y bailarinas, pintura mural del Imperio Nuevo","en":"Musicians and dancers, New Kingdom wall painting"},"claim":{"es":"Estas actividades servían para amenizar fiestas sagradas y banquetes de las élites.","en":"These activities served to enliven sacred festivals and elite banquets."},"answer":true,"explain":{"es":"Bailes, música y acrobacias formaban los espectáculos públicos, una de las dos grandes categorías de actividad física egipcia junto a los ejercicios militares. Las ejecutaban profesionales del pueblo llano.","en":"Dance, music and acrobatics formed the public spectacles, one of the two great categories of Egyptian physical activity alongside military exercises. They were performed by professionals from the common people."}},{"img":"img/t2/seti_pilar_djed.jpg","caption":{"es":"Seti I erigiendo un pilar Djed, Abidos, h. 1280 a. C.","en":"Seti I raising a Djed pillar, Abydos, c. 1280 BC"},"claim":{"es":"Esta escena pertenece al ceremonial del Heb-Sed.","en":"This scene belongs to the Heb-Sed ceremonial."},"answer":true,"explain":{"es":"El Heb-Sed es la fiesta de jubileo que renovaba el poder del faraón, celebrada a los treinta años de reinado y repetida después cada tres. Hay 314 testimonios.","en":"The Heb-Sed is the jubilee festival that renewed the pharaoh's power, held after thirty years of reign and repeated every three years thereafter. There are 314 attestations."}},{"img":"img/t2/hatshepsut_hebsed.jpg","caption":{"es":"Capilla roja de Karnak, dinastía XVIII","en":"Red Chapel of Karnak, 18th Dynasty"},"claim":{"es":"La figura que corre junto al toro Apis es un faraón varón.","en":"The figure running beside the Apis bull is a male pharaoh."},"answer":false,"explain":{"es":"Es la reina Hatshepsut realizando la carrera del Heb-Sed en el año 16 de su reinado (h. 1485 a. C.). Las mujeres que gobernaban también debían mostrar su fortaleza física.","en":"It is Queen Hatshepsut performing the Heb-Sed run in year 16 of her reign (c. 1485 BC). Ruling women also had to display their physical strength."}},{"img":"img/t2/saqqara_planta.jpg","caption":{"es":"Planta del complejo funerario de Dyeser, Saqqara","en":"Plan of Djoser's funerary complex, Saqqara"},"claim":{"es":"La zona marcada es el Gran Patio del Sur, con la pista de la carrera del Heb-Sed.","en":"The marked area is the Great South Court, with the Heb-Sed race track."},"answer":true,"explain":{"es":"La pista era una recta de 55 m coronada por dos mojones semicirculares; el circuito completo sumaba 140 m y se corría de norte a sur y de sur a norte, simbolizando la unión de los dos reinos.","en":"The track was a 55 m straight ending in two semicircular markers; the full circuit was 140 m, run north to south and south to north, symbolising the union of the two kingdoms."}},{"img":"img/t2/saqqara_patio_sur.jpg","caption":{"es":"Patio sur de Saqqara con la pirámide escalonada","en":"South court of Saqqara with the Step Pyramid"},"claim":{"es":"En este patio se celebraban carreras de carros.","en":"Chariot races were held in this court."},"answer":false,"explain":{"es":"Aquí corría el faraón a pie durante el Heb-Sed. En Egipto no se atestiguan carreras de carros: el carro se usó para la guerra y la caza.","en":"Here the pharaoh ran on foot during the Heb-Sed. Chariot races are not attested in Egypt: the chariot was used for war and hunting."}},{"img":"img/t2/lingote_cobre.jpg","caption":{"es":"Lingote de cobre, Chipre, h. 1600 a. C. (27,4 kg)","en":"Copper ingot, Cyprus, c. 1600 BC (27.4 kg)"},"claim":{"es":"Piezas como esta servían de diana en el tiro con arco real.","en":"Pieces like this served as targets in royal archery."},"answer":true,"explain":{"es":"Los lingotes de cobre bruto eran mercancía del comercio mediterráneo. El rey disparaba contra ellos para demostrar que su fuerza seguía intacta y el orden del mundo (ma'at) garantizado.","en":"Raw copper ingots were goods traded across the Mediterranean. The king shot at them to show that his strength remained intact and the world order (ma'at) guaranteed."}},{"img":"img/t2/arco_compuesto_tutankamon.jpg","caption":{"es":"Arco compuesto de Tutankhamón, h. 1330 a. C.","en":"Composite bow of Tutankhamun, c. 1330 BC"},"claim":{"es":"El arco compuesto es una invención egipcia del Imperio Antiguo.","en":"The composite bow is an Egyptian invention of the Old Kingdom."},"answer":false,"explain":{"es":"Lo fabricaban los hicsos; los egipcios lo adoptan tras las guerras contra ellos y florece en el Imperio Nuevo. Se elabora con varias partes, frente al arco simple de una sola pieza de madera.","en":"It was made by the Hyksos; the Egyptians adopted it after the wars against them and it flourished in the New Kingdom. It is built from several parts, unlike the single-piece wooden self bow."}},{"img":"img/t2/carro_florencia.jpg","caption":{"es":"Carro egipcio, Museo Arqueológico de Florencia, h. 1400 a. C.","en":"Egyptian chariot, Florence Archaeological Museum, c. 1400 BC"},"claim":{"es":"El carro egipcio se usaba sobre todo en carreras de competición.","en":"The Egyptian chariot was mainly used in competitive races."},"answer":false,"explain":{"es":"Tirado por dos caballos, se usó para la guerra y la caza, nunca en carreras. Pesaba unos 24 kg, alcanzaba 38 km/h y tenía chasis de fresno o acacia, cuerpo de piel de cabra y ruedas de un metro con 4 o 6 radios.","en":"Drawn by two horses, it was used for war and hunting, never for racing. It weighed about 24 kg, reached 38 km/h and had an ash or acacia frame, a goatskin body and one-metre wheels with 4 or 6 spokes."}},{"img":"img/t2/ramses_kadesh.jpg","caption":{"es":"Ramsés II en Kadesh, Abu Simbel, h. 1274 a. C.","en":"Ramesses II at Kadesh, Abu Simbel, c. 1274 BC"},"claim":{"es":"Este relieve documenta una carrera de carros.","en":"This relief documents a chariot race."},"answer":false,"explain":{"es":"Es una escena de batalla. Los faraones dejaron registros extraordinarios de caza y guerra con el carro, pero no hay constancia de carreras.","en":"It is a battle scene. Pharaohs left extraordinary records of hunting and war with the chariot, but there is no evidence of races."}},{"img":"img/t2/caza_marismas.jpg","caption":{"es":"Escena de caza en las marismas, Imperio Nuevo","en":"Marsh hunting scene, New Kingdom"},"claim":{"es":"La caza en las marismas estuvo siempre abierta a todo el pueblo.","en":"Marsh hunting was always open to all the people."},"answer":false,"explain":{"es":"Al principio estaba reservada a la realeza; a partir del Imperio Antiguo se abre a la corte y la alta aristocracia. En las tumbas de los nobles se representa a mayor tamaño que cualquier otra actividad.","en":"At first it was reserved for royalty; from the Old Kingdom it opened to the court and the high aristocracy. In nobles' tombs it is depicted larger than any other activity."}},{"img":"img/t2/bastones_arrojadizos.jpg","caption":{"es":"Bastones arrojadizos de Tutankamón, h. 1325 a. C.","en":"Throwing sticks of Tutankhamun, c. 1325 BC"},"claim":{"es":"Estos objetos se usaban para cazar aves en las marismas.","en":"These objects were used to hunt birds in the marshes."},"answer":true,"explain":{"es":"La caza en las marismas combinaba aves con arco o bastón arrojadizo, mamíferos y arponeo de peces, con perros amaestrados en cotos privados.","en":"Marsh hunting combined birds with bow or throwing stick, mammals and fish spearing, with trained dogs on private reserves."}},{"img":"img/t2/caza_aves_baston.jpg","caption":{"es":"Tumba tebana, Sheikh Abd el-Qurna, h. 1400 a. C.","en":"Theban tomb, Sheikh Abd el-Qurna, c. 1400 BC"},"claim":{"es":"La escena muestra al noble cazando aves con bastón arrojadizo.","en":"The scene shows the noble hunting birds with a throwing stick."},"answer":true,"explain":{"es":"Que la caza aparezca a mayor tamaño que cualquier otra actividad en las tumbas de los nobles indica el valor simbólico que tenía para la aristocracia.","en":"That hunting appears larger than any other activity in nobles' tombs points to its symbolic value for the aristocracy."}},{"img":"img/t2/jeroglifico_natacion.jpg","caption":{"es":"Jeroglífico","en":"Hieroglyph"},"claim":{"es":"Este jeroglífico significa «natación».","en":"This hieroglyph means 'swimming'."},"answer":true,"explain":{"es":"La autobiografía de Khety de Siut afirma que el rey le permitió recibir lecciones de natación junto a sus hijos, lo que acredita una enseñanza reglada con maestro y grupo.","en":"The autobiography of Khety of Siut states that the king allowed him to take swimming lessons with his children, which attests to formal teaching with an instructor and a group."}},{"img":"img/t2/cuchara_nadadora.jpg","caption":{"es":"Cuchara de cosmética, Louvre, h. 1350 a. C.","en":"Cosmetic spoon, Louvre, c. 1350 BC"},"claim":{"es":"Las representaciones egipcias permiten afirmar que ya se nadaba a crol y a braza.","en":"Egyptian depictions prove that crawl and breaststroke were already swum."},"answer":false,"explain":{"es":"Algunos autores han querido reconocer esos estilos, pero otros advierten de que la técnica antigua no puede equipararse a la moderna.","en":"Some authors have tried to identify those strokes, but others warn that ancient technique cannot be equated with modern strokes."}},{"img":"img/t2/hacha_batalla.jpg","caption":{"es":"Hacha de batalla, dinastía XII, Metropolitan Museum","en":"Battle axe, 12th Dynasty, Metropolitan Museum"},"claim":{"es":"Esta arma pertenece al ejército profesional del Imperio Nuevo.","en":"This weapon belongs to the professional army of the New Kingdom."},"answer":false,"explain":{"es":"Es de la dinastía XII, en el Imperio Medio (h. 1981-1802 a. C.). El ejército profesional permanente llega después, con el Imperio Nuevo, tras la ocupación hicsa.","en":"It dates from the 12th Dynasty, in the Middle Kingdom (c. 1981-1802 BC). The permanent professional army came later, with the New Kingdom, after the Hyksos occupation."}},{"img":"img/t2/khopesh.jpg","caption":{"es":"Khopesh de bronce, reinado de Ramsés II, Louvre","en":"Bronze khopesh, reign of Ramesses II, Louvre"},"claim":{"es":"El khopesh es una espada curva de bronce.","en":"The khopesh is a curved bronze sword."},"answer":true,"explain":{"es":"Mide 57,5 cm y formaba parte del equipo del soldado del Imperio Nuevo junto al arco compuesto, la lanza corta y el escudo de madera reforzado con cuero.","en":"It measures 57.5 cm and was part of the New Kingdom soldier's kit, alongside the composite bow, short spear and leather-reinforced wooden shield."}},{"img":"img/t2/escudo_lanzas_modelo.jpg","caption":{"es":"Escudo, estuche y lanzas modelo, dinastía XII","en":"Model shield, case and spears, 12th Dynasty"},"claim":{"es":"Estas piezas proceden del Metropolitan Museum de Nueva York.","en":"These pieces are held in the Metropolitan Museum, New York."},"answer":true,"explain":{"es":"Los modelos funerarios del Imperio Medio son una fuente indirecta sobre el armamento egipcio antes del ejército profesional.","en":"Middle Kingdom funerary models are an indirect source on Egyptian weaponry before the professional army."}},{"img":"img/t2/equipo_soldado_egipcio.jpg","caption":{"es":"Equipo del soldado del Imperio Nuevo","en":"New Kingdom soldier's equipment"},"claim":{"es":"La corona azul la usaban los faraones del Imperio Nuevo en campaña.","en":"The blue crown was worn by New Kingdom pharaohs on campaign."},"answer":true,"explain":{"es":"El equipo incluía túnica de cuero con placas de bronce, protección de tiras de lino, arco compuesto, khopesh, lanza corta y escudos de madera o fibra vegetal.","en":"The kit included a leather tunic with bronze plates, linen strip protection, composite bow, khopesh, short spear and wooden or plant-fibre shields."}},{"img":"img/t2/beni_hasan_lucha.jpg","caption":{"es":"Tumba de Baqet III, Beni Hasan, h. 2000 a. C.","en":"Tomb of Baqet III, Beni Hasan, c. 2000 BC"},"claim":{"es":"Los luchadores de Beni Hasan competían con ropa de soldado y casco.","en":"The Beni Hasan wrestlers competed in soldiers' clothing and helmets."},"answer":false,"explain":{"es":"Competían desnudos salvo por un cinturón de tela, y las 219 parejas se distinguen por el color de la piel, marrón oscuro y claro, con proyecciones sobre el hombro, volteos de cadera y llaves de brazo.","en":"They competed naked except for a cloth belt, and the 219 pairs are told apart by skin colour, dark and light brown, with shoulder throws, hip throws and arm locks."}},{"img":"img/t2/beni_hasan_camara.jpg","caption":{"es":"Cámara pintada de Beni Hasan","en":"Painted chamber at Beni Hasan"},"claim":{"es":"Las tumbas de Beni Hasan pertenecen a nomarcas del Imperio Nuevo.","en":"The Beni Hasan tombs belong to New Kingdom nomarchs."},"answer":false,"explain":{"es":"Son del Imperio Medio (dinastías XI-XII, h. 2000 a. C.), de los príncipes del Nomo del Antílope. La lucha es el deporte más abundante en el registro egipcio.","en":"They date from the Middle Kingdom (11th-12th Dynasties, c. 2000 BC), princes of the Antelope Nome. Wrestling is the most abundant sport in the Egyptian record."}},{"img":"img/t2/tahtib_neferhotep.jpg","caption":{"es":"Tumba de Neferhotep (TT49), Tebas, h. 1330 a. C.","en":"Tomb of Neferhotep (TT49), Thebes, c. 1330 BC"},"claim":{"es":"La esgrima de bastón (tahtib) la practicaban exclusivamente soldados.","en":"Stick fencing (tahtib) was practised exclusively by soldiers."},"answer":true,"explain":{"es":"El faldellín militar aparece en todas las fuentes. Bastones de unos 100 cm con cazoleta, y protectores de cuero en frente, barbilla y antebrazo. También se celebraban combates rituales ante el faraón.","en":"The military kilt appears in every source. Sticks of about 100 cm with a hand guard, and leather protectors on forehead, chin and forearm. Ritual bouts were also held before the pharaoh."}},{"img":"img/t2/boxeo_kheruef.jpg","caption":{"es":"Púgiles, tumba de Kheruef (TT192), h. 1360 a. C.","en":"Boxers, tomb of Kheruef (TT192), c. 1360 BC"},"claim":{"es":"El boxeo está tan documentado en Egipto como la lucha.","en":"Boxing is as well documented in Egypt as wrestling."},"answer":false,"explain":{"es":"Su presencia es marginal: la única evidencia indiscutible son seis parejas de púgiles con los puños sin protección en la tumba de Kheruef, vestidos con faldellín de soldado.","en":"Its presence is marginal: the only indisputable evidence is six pairs of bare-fisted boxers in the tomb of Kheruef, wearing soldiers' kilts."}},{"img":"img/t2/ostracon_esgrima.jpg","caption":{"es":"Ostracon de Deir el-Medina, época ramésida, Louvre","en":"Ostracon from Deir el-Medina, Ramesside period, Louvre"},"claim":{"es":"Este ostracon muestra un combate de esgrima con palos entre dos soldados.","en":"This ostracon shows a stick-fencing bout between two soldiers."},"answer":true,"explain":{"es":"Caliza de 8,7 x 8,7 cm dibujada en negro y rojo, con dos soldados con coraza y faldellín (1295-1069 a. C.).","en":"Limestone, 8.7 x 8.7 cm, drawn in black and red, with two soldiers in cuirass and kilt (1295-1069 BC)."}},{"img":"img/t2/medinet_habu_calco.jpg","caption":{"es":"Calco de Medinet Habu, templo de Ramsés III, h. 1170 a. C.","en":"Tracing from Medinet Habu, temple of Ramesses III, c. 1170 BC"},"claim":{"es":"El relieve recoge tiro con arco, esgrima con palos y lucha.","en":"The relief records archery, stick fencing and wrestling."},"answer":true,"explain":{"es":"Los combates se celebraban en tres contextos: preparación militar, ceremonias en presencia del rey y cultos religiosos (Decker, 1992).","en":"Bouts took place in three contexts: military training, ceremonies in the king's presence and religious cults (Decker, 1992)."}},{"img":"img/t2/taharqa.jpg","caption":{"es":"Estatua de Taharqa, dinastía XXV, Louvre","en":"Statue of Taharqa, 25th Dynasty, Louvre"},"claim":{"es":"La carrera de la estela de Taharqa se corrió de un tirón, sin ningún descanso.","en":"The race on the stela of Taharqa was run in one go, without any rest."},"answer":false,"explain":{"es":"En el año 6 de Taharqa (h. 685 a. C.) las tropas de élite corrieron 50 km nocturnos en 4 horas, tuvieron un descanso reglamentario de 2 horas y cubrieron otros 50 km de vuelta.","en":"In Taharqa's 6th year (c. 685 BC) the elite troops ran 50 km by night in 4 hours, had a compulsory 2-hour rest and covered another 50 km on the way back."}},{"img":"img/t2/justa_pescadores.jpg","caption":{"es":"Mastaba de Niankhkhnum y Khnumhotep, Saqqara, h. 2400 a. C.","en":"Mastaba of Niankhkhnum and Khnumhotep, Saqqara, c. 2400 BC"},"claim":{"es":"Las justas de pescadores tenían reglamento y árbitro.","en":"Fishermen's jousts had rules and a referee."},"answer":false,"explain":{"es":"No había reglamento ni árbitro; las reglas se pactaban sobre la marcha. El objetivo era hacer caer al agua a la tripulación contraria con las pértigas o el agarre directo.","en":"There were no rules or referee; rules were agreed on the spot. The aim was to knock the rival crew into the water with poles or direct grappling."}},{"img":"img/t2/justa_pescadores_calco.jpg","caption":{"es":"Tumba de Ny-ankh-nesut, Saqqara, h. 2350 a. C.","en":"Tomb of Ny-ankh-nesut, Saqqara, c. 2350 BC"},"claim":{"es":"La justa de pescadores era un pasatiempo de la aristocracia.","en":"The fishermen's joust was a pastime of the aristocracy."},"answer":false,"explain":{"es":"Pertenece al pueblo llano y es una de sus pocas prácticas documentadas, con dos a cuatro tripulaciones en canoas de papiro de tres a seis hombres cada una.","en":"It belongs to the common people and is one of their few documented practices, with two to four crews in papyrus canoes of three to six men each."}},{"img":"img/t2/nefertari_senet.jpg","caption":{"es":"Nefertari jugando al senet, QV66, h. 1255 a. C.","en":"Nefertari playing senet, QV66, c. 1255 BC"},"claim":{"es":"El senet solo lo jugaban hombres.","en":"Senet was played only by men."},"answer":false,"explain":{"es":"Lo jugaban las élites de ambos sexos, y es la única práctica egipcia en la que la mujer aparece en igualdad con el hombre. Su nombre viene de snt, «pasar» o «cruzar», y el tablero tenía 30 casillas en tres filas de diez.","en":"It was played by the elites of both sexes, and it is the only Egyptian practice in which women appear on an equal footing with men. Its name comes from snt, “to pass” or “to cross”, and the board had 30 squares in three rows of ten."}},{"img":"img/t2/tablero_senet.jpg","caption":{"es":"Tablero de senet de Amenhotep III, Brooklyn Museum","en":"Senet board of Amenhotep III, Brooklyn Museum"},"claim":{"es":"Para mover las fichas se usaban dados cúbicos.","en":"Cubic dice were used to move the pieces."},"answer":false,"explain":{"es":"Se sacaban palos o huesos de animal marcados con números de un saco. Las fichas avanzaban en zigzag de la casilla 1 a la 30.","en":"Marked sticks or animal bones were drawn from a bag. Pieces advanced in a zigzag from square 1 to 30."}},{"img":"img/t2/ninas_pelota_caballito.jpg","caption":{"es":"Tumba de Baqet III, Beni Hasan, h. 2000 a. C.","en":"Tomb of Baqet III, Beni Hasan, c. 2000 BC"},"claim":{"es":"En la iconografía egipcia los juegos de pelota aparecen practicados casi exclusivamente por mujeres y niñas.","en":"In Egyptian iconography ball games appear almost exclusively played by women and girls."},"answer":true,"explain":{"es":"Juegos malabares, a caballito, pases rítmicos con palmadas o lanzamientos altos con recepciones acrobáticas.","en":"Juggling, piggy-back games, rhythmic passes with clapping or high throws with acrobatic catches."}},{"img":"img/t2/pelotas_egipcias.jpg","caption":{"es":"Pelotas egipcias","en":"Egyptian balls"},"claim":{"es":"Las pelotas egipcias se hacían principalmente de cuerda apretada, cuero y lino.","en":"Egyptian balls were mostly made of tightly wound cord, leather and linen."},"answer":true,"explain":{"es":"Se han hallado numerosas pelotas en tumbas. El British Museum conserva una pelota-sonajero hueca de lino con piedrecillas dentro, de época romana.","en":"Many balls have been found in tombs. The British Museum keeps a hollow linen rattle-ball with pebbles inside, from the Roman period."}},{"img":"img/t2/mapa_imperio_persa.jpg","caption":{"es":"Extensión máxima del imperio persa","en":"Maximum extent of the Persian Empire"},"claim":{"es":"El imperio aqueménida lo fundó Darío I en el 330 a. C.","en":"The Achaemenid empire was founded by Darius I in 330 BC."},"answer":false,"explain":{"es":"Lo fundó Ciro II en el 550 a. C., tras derrotar a los medos, y en tres generaciones se extendió del Egeo al Indo. El 330 a. C. marca, por el contrario, su final.","en":"It was founded by Cyrus II in 550 BC, after defeating the Medes, and within three generations it stretched from the Aegean to the Indus. The year 330 BC marks, on the contrary, its end."}},{"img":"img/t2/jenofonte.jpg","caption":{"es":"Jenofonte","en":"Xenophon"},"claim":{"es":"Del deporte persa antiguo se conservan descripciones escritas por los propios persas.","en":"Descriptions of ancient Persian sport written by Persians themselves survive."},"answer":false,"explain":{"es":"No se conserva ninguna, y las principales fuentes son griegas (Heródoto, Jenofonte y Estrabón). La más extensa sobre la educación persa es la Ciropedia de Jenofonte.","en":"None survive, and the main sources are Greek (Herodotus, Xenophon and Strabo). The longest on Persian education is Xenophon's Cyropaedia."}},{"img":"img/t2/artajerjes_tumba.jpg","caption":{"es":"Tumba de Artajerjes II, Persépolis","en":"Tomb of Artaxerxes II, Persepolis"},"claim":{"es":"En Persia la legitimidad del rey se demostraba con el cuerpo, a través del arco y la caza.","en":"In Persia the king's legitimacy was shown through the body, by means of the bow and the hunt."},"answer":true,"explain":{"es":"Ambas prácticas se ejecutan ante una multitud, exigen años de entrenamiento y su resultado depende solo del rey. Nadie le gana.","en":"Both practices are performed before a crowd, require years of training and their outcome depends on the king alone. Nobody beats him."}},{"img":"img/t2/friso_arqueros_susa.jpg","caption":{"es":"Friso de los arqueros, Susa, h. 510 a. C., Louvre","en":"Frieze of the Archers, Susa, c. 510 BC, Louvre"},"claim":{"es":"Según Heródoto, los jóvenes persas aprendían a montar, disparar el arco y decir la verdad.","en":"According to Herodotus, young Persians learned to ride, shoot the bow and tell the truth."},"answer":true,"explain":{"es":"De los cinco a los veinte años; Estrabón alarga la formación hasta los veinticuatro. Según Jenofonte era masculina y obligatoria, asumida por el Estado.","en":"From the age of five to twenty; Strabo extends training to twenty-four. According to Xenophon it was male and compulsory, run by the state."}},{"img":"img/t2/rostam_pahlavan.jpg","caption":{"es":"El pahlavan Rostam luchando contra un demonio, h. 1595","en":"The pahlavan Rostam fighting a demon, c. 1595"},"claim":{"es":"El pahlavan es un luchador profesional que aparece en el mundo persa a partir del siglo X.","en":"The pahlavan is a professional wrestler who appears in the Persian world from the tenth century."},"answer":true,"explain":{"es":"«El campeón», que se gana la vida con su cuerpo, surge cuando ya no hay rey ni nobleza de a caballo a quienes servir y la vida se organiza en la ciudad y el bazar.","en":"'The champion', who earns his living with his body, emerges once there is no king or mounted nobility to serve and life is organised around the city and the bazaar."}},{"img":"img/t2/zurkhaneh.jpg","caption":{"es":"Zurkhaneh en Kermán, Irán","en":"Zurkhaneh in Kerman, Iran"},"claim":{"es":"La puerta del zurkhaneh es deliberadamente baja para obligar a agacharse al entrar.","en":"The zurkhaneh door is deliberately low so that one must bow to enter."},"answer":true,"explain":{"es":"«La casa de fuerza» es una sala abovedada con foso central de arcilla, sin fachada ni carteles, en los callejones del bazar. La primera lección es de humildad.","en":"'The house of strength' is a vaulted hall with a central clay pit, with no façade or signs, in the bazaar's alleys. The first lesson is humility."}},{"img":"img/t2/mazas_zurkhaneh.jpg","caption":{"es":"Ejercicio con mazas (mil)","en":"Exercise with clubs (mil)"},"claim":{"es":"En el zurkhaneh la sesión se ejecuta al ritmo de música en directo.","en":"In the zurkhaneh the session is performed to live music."},"answer":true,"explain":{"es":"Entre diez y veinte hombres siguen al atleta más consumado desde el centro del foso: calentamiento, tablones, flexiones al compás del tambor y volteo de mazas por detrás de los hombros.","en":"Ten to twenty men follow the most accomplished athlete from the centre of the pit: warm-up, boards, push-ups to the drum and swinging clubs behind the shoulders."}},{"img":"img/t2/jereed_miniatura.jpg","caption":{"es":"Jinetes con jabalinas, miniatura","en":"Riders with javelins, miniature"},"claim":{"es":"El jereed es un deporte de jabalina a caballo para entrenar el ataque y la huida.","en":"Jereed is a mounted javelin sport for training attack and retreat."},"answer":true,"explain":{"es":"Desde el siglo XI. Dos equipos de ocho a diez jinetes; uno lanza y huye al galope mientras los rivales lo persiguen con jabalinas de madera sin punta.","en":"From the eleventh century. Two teams of eight to ten riders; one throws and gallops off while rivals chase him with blunt wooden javelins."}},{"img":"img/t2/jereed_actual.jpg","caption":{"es":"Jereed en la actualidad","en":"Jereed today"},"claim":{"es":"El jereed es el antecesor directo del polo moderno.","en":"Jereed is the direct ancestor of modern polo."},"answer":false,"explain":{"es":"El antecesor del polo es el chovgan, deporte colectivo a caballo con pelota y taco consolidado en el periodo sasánida. El jereed es un juego de jabalina.","en":"Polo's ancestor is chovgan, a mounted team game with ball and mallet consolidated in the Sasanian period. Jereed is a javelin game."}},{"img":"img/t2/mapa_expansion_fenicia.jpg","caption":{"es":"Expansión fenicia por el Mediterráneo","en":"Phoenician expansion across the Mediterranean"},"claim":{"es":"Fenicia llegó a constituir un Estado unificado con un solo rey.","en":"Phoenicia became a unified state under a single king."},"answer":false,"explain":{"es":"Fueron ciudades-estado independientes y a menudo rivales (Biblos, Sidón, Tiro), cada una con su rey, su flota y su moneda, aunque compartían lengua y religión.","en":"They were independent and often rival city-states (Byblos, Sidon, Tyre), each with its own king, fleet and coinage, although they shared language and religion."}},{"img":"img/t2/cartago_aerea.jpg","caption":{"es":"Cartago, Túnez","en":"Carthage, Tunisia"},"claim":{"es":"Cartago significa «ciudad vieja» en fenicio.","en":"Carthage means “old city” in Phoenician."},"answer":false,"explain":{"es":"Qart-ḥadašt significa «ciudad nueva». La fundaron colonos de Tiro, y hacia el 227 a. C. Asdrúbal fundó una segunda en la actual Cartagena, la Carthago Nova de los romanos.","en":"Qart-ḥadašt means “new city”. It was founded by settlers from Tyre, and around 227 BC Hasdrubal founded a second one at present-day Cartagena, the Romans' Carthago Nova."}},{"img":"img/t2/evolucion_alfabeto.jpg","caption":{"es":"Evolución del alfabeto","en":"Evolution of the alphabet"},"claim":{"es":"El alfabeto fue inventado por los fenicios.","en":"The alphabet was invented by the Phoenicians."},"answer":false,"explain":{"es":"Nació hacia 1800 a. C. entre trabajadores semitas de las minas del Sinaí. Los fenicios lo heredaron, lo fijaron en 22 signos consonánticos y lo difundieron por el Mediterráneo.","en":"It arose around 1800 BC among Semitic workers in the Sinai mines. The Phoenicians inherited it, fixed it at 22 consonantal signs and spread it across the Mediterranean."}},{"img":"img/t2/moneda_fenicia_damasco.jpg","caption":{"es":"Moneda fenicia de plata, h. 400 a. C., Damasco","en":"Phoenician silver coin, c. 400 BC, Damascus"},"claim":{"es":"Los fenicios se guiaban en el mar por la Osa Mayor, igual que los griegos.","en":"The Phoenicians steered by the Great Bear, like the Greeks."},"answer":false,"explain":{"es":"Se guiaban por la Osa Menor, más próxima al polo y por tanto más estable que la Osa Mayor que usaban los griegos. La navegación fue su actividad por excelencia, como refleja esta nave de guerra sobre un hipocampo.","en":"They steered by the Little Bear, closer to the pole and therefore steadier than the Great Bear used by the Greeks. Seafaring was their defining activity, as this warship above a hippocamp shows."}},{"img":"img/t2/trirreme_seccion.jpg","caption":{"es":"Sección de un trirreme","en":"Cross-section of a trireme"},"claim":{"es":"El trirreme Olympias reconstruido en 1987 llevaba 170 remeros en tres niveles.","en":"The trireme Olympias, reconstructed in 1987, carried 170 rowers on three levels."},"answer":true,"explain":{"es":"Arqueología experimental para contrastar a Tucídides: remos de 12 kg y turnos de remo y descanso. Tucídides decía que una nave cubría 340 km en 24 h a unos 14 km/h.","en":"Experimental archaeology to test Thucydides: 12 kg oars and rowing and rest shifts. Thucydides said a ship covered 340 km in 24 h at about 14 km/h."}},{"img":"img/t2/mazarron_pecio_fondo.jpg","caption":{"es":"Pecio Mazarrón 2 en el fondo marino","en":"Mazarrón 2 wreck on the seabed"},"claim":{"es":"El pecio Mazarrón 2 se extrajo del agua en 2024, desmontado en 22 piezas.","en":"The Mazarrón 2 wreck was lifted from the water in 2024, dismantled into 22 pieces."},"answer":true,"explain":{"es":"Barco mercante costero de 8,15 m de eslora, fechado entre finales del siglo VII y el primer tercio del VI a. C., a cuarenta minutos de la facultad.","en":"Coastal merchant vessel 8.15 m long, dated between the late seventh and the first third of the sixth century BC, forty minutes from the faculty."}},{"img":"img/t2/mazarron_pecio_extraido.jpg","caption":{"es":"Pecio fenicio de Mazarrón","en":"Phoenician wreck from Mazarrón"},"claim":{"es":"Mazarrón 1 conserva el casco casi entero.","en":"Mazarrón 1 preserves the hull almost complete."},"answer":false,"explain":{"es":"De Mazarrón 1 (1988) se conserva sobre todo la quilla, de casi cuatro metros. El casco casi entero es el de Mazarrón 2 (1995).","en":"Of Mazarrón 1 (1988) mainly the keel survives, nearly four metres long. The almost complete hull is Mazarrón 2 (1995)."}},{"img":"img/t2/kharayeb_figuritas.jpg","caption":{"es":"Figuritas de terracota de Kharayeb, Líbano","en":"Terracotta figurines from Kharayeb, Lebanon"},"claim":{"es":"Kharayeb es el único conjunto que muestra cuerpos fenicios en actividad lúdica.","en":"Kharayeb is the only assemblage showing Phoenician bodies at play."},"answer":true,"explain":{"es":"16.400 fragmentos, con un 35 % de niños y un 22 % de mujeres. Entre los 2 y 4 años juegan con pájaros y perros; entre los 5 y 8 el perro es sustituido por una pelota.","en":"16,400 fragments, 35 % children and 22 % women. Aged 2 to 4 they play with birds and dogs; aged 5 to 8 the dog is replaced by a ball."}},{"img":"img/t2/estrigil.jpg","caption":{"es":"Estrígil","en":"Strigil"},"claim":{"es":"Este objeto servía para lanzar jabalinas.","en":"This object was used to throw javelins."},"answer":false,"explain":{"es":"Es un estrígil, instrumento curvo para raspar el aceite y el sudor del cuerpo tras el ejercicio. Aparece entre los materiales de Kharayeb.","en":"It is a strigil, a curved tool for scraping oil and sweat from the body after exercise. It appears among the Kharayeb material."}},{"img":"img/t2/patera_idalion.jpg","caption":{"es":"Pátera de Idalion, Chipre, siglos VIII-VII a. C.","en":"Idalion patera, Cyprus, 8th-7th centuries BC"},"claim":{"es":"Las prácticas corporales femeninas fenicias están documentadas sobre todo en el ámbito funerario y ritual.","en":"Phoenician women's bodily practices are documented mainly in funerary and ritual contexts."},"answer":true,"explain":{"es":"Músicas, bailarinas y plañideras en procesiones y enterramientos. La pátera muestra una danza ritual femenina ante una diosa.","en":"Musicians, dancers and mourners in processions and burials. The patera shows a female ritual dance before a goddess."}},{"img":"img/t2/beni_hasan_calco.jpg","caption":{"es":"Calcos y vista de la cámara de Baqet III, Beni Hasan","en":"Tracings and view of the chamber of Baqet III, Beni Hasan"},"claim":{"es":"Entre las llaves pintadas en Beni Hasan abundan los puñetazos y los mordiscos.","en":"Punches and bites are common among the holds painted at Beni Hasan."},"answer":false,"explain":{"es":"Aparecen proyecciones sobre el hombro, volteos de cadera, tirones y zancadillas, mientras que faltan de forma sistemática los puñetazos, los mordiscos y las luxaciones severas, lo que apunta a un límite no escrito del combate (Decker, 1992).","en":"The paintings show shoulder throws, hip throws, pulls and trips, whereas punches, bites and severe joint locks are systematically absent, which points to an unwritten limit on the fight (Decker, 1992)."}},{"img":"img/t2/espada_egipcia.jpg","caption":{"es":"Espada egipcia de bronce","en":"Egyptian bronze sword"},"claim":{"es":"Egipto contó con un ejército profesional permanente desde el Imperio Antiguo.","en":"Egypt had a permanent professional army from the Old Kingdom onwards."},"answer":false,"explain":{"es":"El ejército profesional aparece a partir del Imperio Nuevo, tras la ocupación hicsa, y se convierte en el segundo gran productor de imágenes deportivas del registro egipcio después de la corte.","en":"The professional army appears from the New Kingdom onwards, after the Hyksos occupation, and becomes the second great producer of sporting images in the Egyptian record after the court."}},{"img":"img/t2/mazarron_aerea.jpg","caption":{"es":"Playa de la Isla de Mazarrón y situación de los dos pecios","en":"Isla beach at Mazarrón and the position of the two wrecks"},"claim":{"es":"El análisis de carbono-14 sitúa Mazarrón 2 en el primer tercio del siglo VI a. C.","en":"Carbon-14 analysis places Mazarrón 2 in the first third of the 6th century BC."},"answer":true,"explain":{"es":"El barco apareció en 1995 con el casco casi entero y hoy se conserva en el Museo Nacional de Arqueología Subacuática, en Cartagena, mientras que de Mazarrón 1, hallado en 1988, queda sobre todo la quilla.","en":"The boat was found in 1995 with its hull almost intact and is now kept in the National Museum of Underwater Archaeology in Cartagena, whereas mostly the keel survives of Mazarrón 1, found in 1988."}},{"img":"img/t2/mazarron_pecio_planta.jpg","caption":{"es":"Estructura de protección sobre el pecio Mazarrón 2","en":"Protective structure over the Mazarrón 2 wreck"},"claim":{"es":"Está demostrado que el barco lo construyeron carpinteros fenicios.","en":"It is proven that the boat was built by Phoenician carpenters."},"answer":false,"explain":{"es":"La atribución sigue abierta: Negueruela lo lee como fenicio por el ensamblaje de mortaja y lengüeta, mientras que Pomey y Guerrero lo atribuyen a carpinteros locales que conocían esa técnica, de modo que documenta sobre todo un contacto técnico entre tradiciones.","en":"The attribution remains open: Negueruela reads it as Phoenician because of its mortise-and-tenon joinery, whereas Pomey and Guerrero attribute it to local carpenters who knew that technique, so it mainly documents technical contact between traditions."}},{"img":"img/t2/siclo_sidon.jpg","caption":{"es":"Siclo de Sidón con una galera","en":"Shekel of Sidon with a galley"},"claim":{"es":"Las monedas y los cuencos de metal están entre las principales fuentes para conocer a los fenicios.","en":"Coins and metal bowls are among the main sources for knowing the Phoenicians."},"answer":true,"explain":{"es":"No se conserva ninguna descripción de actividad física escrita por un fenicio, y casi todo lo demás llega de griegos y romanos, que eran a la vez sus rivales comerciales.","en":"No description of physical activity written by a Phoenician survives, and almost everything else comes from Greeks and Romans, who were also their commercial rivals."}},{"img":"img/t2/tahtib_relieve_1.jpg","caption":{"es":"Relieve de esgrima de bastón (tahtib)","en":"Relief of stick fencing (tahtib)"},"claim":{"es":"Los bastones de la esgrima egipcia medían unos dos metros y los esgrimistas no llevaban ninguna protección.","en":"Egyptian fencing sticks were about two metres long and fencers wore no protection at all."},"answer":false,"explain":{"es":"Medían alrededor de un metro, con pequeñas guardias para proteger la mano, y los esgrimistas llevaban protectores de cuero en la frente, el mentón y el antebrazo (Decker, 1992).","en":"They were about a metre long, with small guards to protect the hand, and fencers wore leather protectors on the forehead, chin and forearm (Decker, 1992)."}},{"img":"img/t2/tahtib_relieve_2.jpg","caption":{"es":"Combate de esgrima de bastón en relieve","en":"Stick-fencing bout in relief"},"claim":{"es":"Además de servir a la instrucción militar, se celebraban combates rituales de esgrima ante el faraón que simbolizaban su regeneración.","en":"Besides military training, ritual fencing bouts were held before the pharaoh to symbolise his regeneration."},"answer":true,"explain":{"es":"Es el caso del combate que enmarca la erección del pilar Djed en el jubileo de Amenofis III, y Decker (1992) documenta también combates ofrecidos como parte del ceremonial ante embajadores extranjeros.","en":"One example is the bout that frames the raising of the Djed pillar at the jubilee of Amenhotep III, and Decker (1992) also documents bouts staged as part of the ceremonial before foreign ambassadors."}},{"img":"img/t2/zurkhaneh_cadena.jpg","caption":{"es":"Balanceo del kabbadeh en el zurkhaneh","en":"Swinging the kabbadeh in the zurkhaneh"},"claim":{"es":"El kabbadeh es un arco de hierro con anillas que se balancea durante la sesión.","en":"The kabbadeh is an iron bow with rings that is swung during the session."},"answer":true,"explain":{"es":"Forma parte de un orden fijo, con calentamiento, tablones, flexiones al compás del tambor, mazas, giro sobre sí mismo y kabbadeh, y la lucha cerraba la sesión.","en":"It belongs to a fixed sequence of warm-up, boards, push-ups to the drum, clubs, spinning and kabbadeh, and wrestling closed the session."}},{"img":"img/t2/zurkhaneh_flexiones.jpg","caption":{"es":"Flexiones en el zurkhaneh","en":"Push-ups in the zurkhaneh"},"claim":{"es":"En el zurkhaneh cada atleta hace las flexiones a su propio ritmo y sin música.","en":"In the zurkhaneh each athlete does push-ups at his own pace and without music."},"answer":false,"explain":{"es":"Se hacen al compás del tambor, y toda la sesión la dirige desde el centro del foso el atleta más consumado de la casa, al ritmo de la música en directo.","en":"They are done to the beat of the drum, and the whole session is led from the centre of the pit by the most accomplished athlete of the house, to live music."}},{"img":"img/t2/zurkhaneh_tablones.jpg","caption":{"es":"Levantamiento de tablones en el zurkhaneh","en":"Lifting boards in the zurkhaneh"},"claim":{"es":"La lucha que cerraba la sesión se hacía delante de todos para que la derrota fuera pública.","en":"The wrestling that closed the session was held in front of everyone so that defeat would be public."},"answer":false,"explain":{"es":"Se practicaba en parejas apartadas del resto, y a menudo se separaba a los contendientes antes de la proyección decisiva para ahorrar a uno de ellos la humillación de perder (Krawietz, 2013).","en":"It was practised in pairs away from the others, and the contenders were often separated before the decisive throw to spare one of them the humiliation of losing (Krawietz, 2013)."}},{"img":"img/t2/rosetta_reconstruccion.jpg","caption":{"es":"Reconstrucción de la estela completa de la Piedra Rosetta","en":"Reconstruction of the complete Rosetta Stone stela"},"claim":{"es":"La Piedra Rosetta contiene tres textos distintos, uno en cada escritura.","en":"The Rosetta Stone contains three different texts, one in each script."},"answer":false,"explain":{"es":"Reproduce un mismo decreto sacerdotal en jeroglífico, demótico y griego, y esa triple redacción del mismo texto es la que permitió a Champollion descifrar la escritura egipcia en 1822.","en":"It reproduces a single priestly decree in hieroglyphic, Demotic and Greek, and that triple version of the same text is what allowed Champollion to decipher Egyptian writing in 1822."}},{"img":"img/t2/cronologia_egipto.jpg","caption":{"es":"Cronología del deporte egipcio por periodos","en":"Chronology of Egyptian sport by period"},"claim":{"es":"Los egipcios fechaban los acontecimientos con una era continua, como nuestro calendario.","en":"The Egyptians dated events using a continuous era, as our calendar does."},"answer":false,"explain":{"es":"Fechaban por año de reinado del monarca, de modo que la cronología se reconstruye sumando reinados a partir de las listas reales.","en":"They dated by the regnal year of the king, so the chronology is reconstructed by adding up reigns from the king lists."}},{"img":"img/t2/fuentes_egipcias.jpg","caption":{"es":"Tipos de fuente: objetos, pintura y arquitectura","en":"Types of source: objects, painting and architecture"},"claim":{"es":"La iconografía es la fuente más abundante sobre el deporte egipcio.","en":"Iconography is the most abundant source on Egyptian sport."},"answer":true,"explain":{"es":"Reúne cerca de dos mil escenas catalogadas en relieves y pinturas de tumba, aunque casi todas proceden de tumbas de la aristocracia, que decidía qué quedaba registrado.","en":"It comprises some two thousand catalogued scenes in reliefs and tomb paintings, although almost all come from aristocratic tombs, whose owners decided what was recorded."}},{"img":"img/t2/musicas_banquete.jpg","caption":{"es":"Músicas en un banquete, pintura de tumba egipcia","en":"Female musicians at a banquet, Egyptian tomb painting"},"claim":{"es":"El egipcio antiguo tenía una palabra general equivalente a «deporte».","en":"Ancient Egyptian had a general word equivalent to “sport”."},"answer":false,"explain":{"es":"No hay un término general atestiguado, y el más cercano, sejeméj-ib, significa «hacer que el corazón olvide» y designa la diversión (Cannuyer, 2002, citado en Decker, 2021).","en":"No general term is attested, and the closest, sekhemekh-ib, means “to make the heart forget” and refers to amusement (Cannuyer, 2002, cited in Decker, 2021)."}},{"img":"img/t2/boxeo_dibujo.jpg","caption":{"es":"Dibujo de dos púgiles egipcios","en":"Drawing of two Egyptian boxers"},"claim":{"es":"Los púgiles de la tumba de Kheruef visten el faldellín de los soldados.","en":"The boxers in the tomb of Kheruef wear the soldiers' kilt."},"answer":true,"explain":{"es":"Son seis parejas a puño desnudo, y Decker (1992) observa que varias posturas copian a los danzantes pintados enfrente, de lo que deduce que el artista no conocía bien el pugilato.","en":"There are six bare-fisted pairs, and Decker (1992) notes that several postures copy the dancers painted opposite, from which he infers that the artist did not know boxing well."}},{"img":"img/t2/malabares_pelota.jpg","caption":{"es":"Juegos de pelota de muchachas en Beni Hasan","en":"Girls' ball games at Beni Hasan"},"claim":{"es":"Entre los juegos de pelota egipcios se documentan malabares con hasta tres bolas.","en":"Juggling with up to three balls is among the documented Egyptian ball games."},"answer":true,"explain":{"es":"El catálogo incluye también el juego a caballito con lanzamientos entre parejas montadas, los pases rítmicos con palmadas y los lanzamientos altos recogidos en el aire, a veces sobre una sola pierna.","en":"The repertoire also includes piggyback games with throws between mounted const WL=new Set(['Gymnastiké','Deportare','Bipedestación','Racionalización','Burocratización','Cuantificación','Secularismo','Pharao ludens','Victor perpetuus','Paradeisos','Zurkhaneh','Pahlavan','Buzkashi','Khopesh','Ciropedia','Kalokagathía','Taurocatapsia','Ekecheiría','Helanódicas','Periodonikes','Hoplitódromo','Espondóforos','Mastigóforos','Anolimpiada','Gimnasiarca','Paidotriba','Summa rudis','Probatio armorum','Edicta munerum','Evergetismo','Dissignatores','Panem et circenses','Pila paganica','Tepidarium','Frigidarium','Naumaquia','Apodyterium','Pilicrepus','Damnati ad bestias']);
function wq(G){const ok=G.filter(g=>{if(!WL.has(g.term.es.replace(/\s*[\(«].*$/,'').trim()))return false;const w=tr(g.term).replace(/\s*\(.*?\)\s*/g,'').trim();const n=nrm(w).length;return n>=8&&n<=20&&w.split(/\s+/).length<=3&&!usedG.has(tr(g.term))});if(!ok.length)return null;const g=pick(ok,1)[0];usedG.add(tr(g.term));return {k:'word',ev:'word',w:{es:g.term.es.replace(/\s*\(.*?\)\s*/g,'').trim(),en:g.term.en.replace(/\s*\(.*?\)\s*/g,'').trim()},def:g.def,sec:60,pts:500}}
const usedG=new Set();function gq(G,ev){const pool=G.filter(g=>!usedG.has(tr(g.term)));const g=pick(pool,1)[0];usedG.add(tr(g.term));const others=pick(G.filter(x=>tr(x.term)!==tr(g.term)),3);const o=sh([g,...others]);return {ev:ev||'glos',quote:g.def,q:{es:T.es.glosQ,en:T.en.glosQ},opts:o.map(x=>x.term),ans:o.indexOf(g),ex:{es:'**'+g.term.es+'**. '+g.def.es,en:'**'+g.term.en+'**. '+g.def.en}}}

function distinct(items,n){const seen=new Set();return sh(items).filter(x=>{if(seen.has(x.year))return false;seen.add(x.year);return true}).slice(0,n)}
function relevo(){const out=[],ys=new Set();[1,2,3,4].forEach(n=>{const it=sh(D.timelines[n].flatMap(x=>x.items)).find(x=>!ys.has(x.year));if(it){ys.add(it.year);out.push(Object.assign({tema:n},it))}});const e=[2,3,4][Math.random()*3|0];const x=sh(D.timelines[e].flatMap(z=>z.items)).find(z=>!ys.has(z.year));if(x)out.push(Object.assign({tema:e},x));return sh(out)}
