tro de esta competición.","Los griegos lo admiraban porque premiaba la versatilidad y exigía dominar cinco pruebas técnica y biomecánicamente distintas, de ahí que Aristóteles llamara a los pentatletas «los atletas más bellos» y Filóstrato, «los mejor proporcionados»."],"C3":["Que las pruebas se disputaran a la vez o en el orden que se ve, ya que el pintor reúne a varios atletas en una sola escena y se desconoce el orden exacto de las pruebas.","Que el pentatlón fuera una preparación militar, porque esa lectura de Romano (2021) la ponen en duda Mann (2021) y Spivey (2021) y la imagen muestra atletas desnudos sin equipo de guerra.","Que la escena muestre una competición de Olimpia, puesto que la pieza no indica el certamen y su nombre la vincula a las Panateneas, la gran fiesta de Atenas."]},{"id":"I3-n11","tema":3,"pie":"Saltador con halteras · Hacia 470 a. C. · Museo Arqueológico de Palermo, Italia","c2s":["El vaso documenta el salto (halma), una de las disciplinas más técnicas del pentatlón, que se hacía con unos pesos llamados halteras, de piedra, plomo o bronce, de 1,4 a 4,5 kg y de 12 a 30 cm de longitud.","El atleta saltaba en el estadio desde una línea llamada bater hacia un foso de tierra removida, el skamma, y se hacían cinco saltos consecutivos al son de una flauta."],"C3":["Que las marcas de los saltadores griegos fueran comparables a las actuales, ya que los griegos no las registraban y solo movían la señal del mejor salto cuando alguien la superaba.","Que conozcamos la secuencia completa del salto, porque la imagen fija un solo momento de la preparación y el resto debe reconstruirse con otras fuentes.","Que el saltador esté compitiendo en un certamen, puesto que la escena no muestra público, jueces ni foso de caída y puede representar igualmente un entrenamiento."]},{"id":"I3-n12","tema":3,"pie":"Lanzador de jabalina con la correa enrollada en el asta","c2s":["La pieza documenta la jabalina (akon), una práctica muy ligada a la caza y a la guerra y, por ello, muy apreciada por los nobles y la alta jerarquía militar.","Era un asta ligera de madera de saúco, de 1,5 a 2 metros, que se lanzaba con la ankýle, una correa de cuero de 30 a 45 cm enrollada en el asta que, al soltarse, hacía girar la jabalina y alargaba el tiro.","El atleta lanzaba desde la balbís hacia la pista del estadio con tres intentos, solo valían los tiros en los que la jabalina se clavaba en el suelo y el más largo se marcaba con una estaca que solo se movía si otro participante lo superaba."],"C3":["Que conozcamos la distancia que alcanzaban los lanzadores, ya que la imagen muestra el gesto previo al tiro y nada indica dónde cayó la jabalina.","Que la jabalina deportiva fuera la misma arma de caza o de guerra, porque era más fina que la lanza y la escena muestra un ejercicio atlético.","Que se trate de una competición, puesto que el atleta aparece solo, sin jueces ni rivales, y puede representar igualmente un entrenamiento."]},{"id":"I3-n13","tema":3,"pie":"Copia romana del Discóbolo de Mirón · Hacia 140 d. C. · Museo Nacional Romano","c2s":["La escultura documenta el lanzamiento de disco (diskos), una prueba del pentatlón en la que el lanzador se situaba en la balbís, cargaba el peso sobre la pierna derecha y torcía el tronco, tal y como muestra la figura.","Los discos conservados, de bronce, piedra o hierro, miden de 17 a 35 cm y pesan de 1,5 a 6,5 kg, con una media de 2,5 kg, y muchos de ellos se usaban para entrenar en el gimnasio.","No había un modelo oficial único, de modo que en Olimpia se garantizaba la igualdad con los tres discos del pentatlón que se guardaban en el santuario, ya que todos los atletas lanzaban el mismo disco el mismo día."],"C3":["Que el lanzador griego girara además media vuelta como los discóbolos actuales, ya que la estatua fija un solo instante y Miller (2004a) duda de si solo torcía el cuerpo o también giraba.","Que el disco tuviera un peso o un tamaño oficial único, porque los conservados van de 1,5 a 6,5 kg y la escultura no permite medirlo.","Que la estatua reproduzca un lanzamiento observado en una competición concreta, puesto que es una copia romana de hacia 140 d. C. de una obra artística, con la postura que eligió el escultor."]},{"id":"I3-n14","tema":3,"pie":"Púgiles griegos · Museo Metropolitano, Nueva York · Hacia 520 a. C.","c2s":["El vaso documenta el pugilato (pygmé), que entró en Olimpia en 688 a. C. y en sus primeros combates se practicaba con las manos envueltas en tiras de cuero llamadas himantes, como las de estos púgiles, que protegían la mano del que golpeaba.","Los golpes iban sobre todo a la cabeza, con la guardia alta y los puños por encima de los hombros que se ven en la escena.","Al no haber asaltos, si los púgiles rehuían el combate los jueces podían reducir el espacio con una barrera llamada klímax, y con el tiempo las protecciones se endurecieron hasta llegar al caestus romano, reforzado con plomo y hierro."],"C3":["Que la figura del manto sea un juez o un entrenador, porque nada en la escena permite distinguir su función.","Que conozcamos cómo terminó el combate o quién lo ganó, ya que la escena fija un solo momento con los dos púgiles todavía en pie.","Que los púgiles de todas las épocas usaran estas tiras blandas, puesto que a mediados del siglo IV a. C. llegaron las correas duras y en época romana el caestus."]},{"id":"I3-n15","tema":3,"pie":"Pancratistas y juez con la vara · Museo Metropolitano, Nueva York · Hacia 500 a. C.","c2s":["El vaso documenta el pancracio (pankrátion), que entró en Olimpia en 648 a. C. y era el más violento de los combates griegos, puesto que combinaba la lucha y el pugilato y mezclaba golpes, patadas y agarres hasta la rendición o la incapacidad de un rival.","Las únicas prohibiciones en Olimpia eran morder y meter los dedos en los ojos, y la presencia del juez con la vara indica que el combate, pese a su violencia, se disputaba bajo vigilancia.","Además, la corona que los jueces dieron al cadáver de Arriquión en 564 a. C. muestra que en esta disciplina se premiaba una resistencia que llegaba hasta la muerte."],"C3":["Que el pancracio careciera de normas, ya que la escena muestra un juez y en Olimpia estaba prohibido morder y meter los dedos en los ojos.","Que el combate terminara con la muerte de un luchador, porque la imagen fija un solo momento y el final habitual era la rendición o la incapacidad del rival.","Que todos los griegos practicaran el pancracio con las mismas reglas, puesto que la escena retrata un solo combate y Filóstrato señala que los espartanos permitían en su tierra lo que Olimpia prohibía."]},{"id":"I3-n16","tema":3,"pie":"Carrera de cuadrigas · Museo Británico, Londres · Hacia 410-400 a. C.","c2s":["Un caballo de élite podía costar 1.200 dracmas y una carrera de carros superar los 5.000, de modo que las pruebas hípicas estaban asociadas a la nobleza y hacían de Olimpia un escaparate de la riqueza aristocrática.","El auriga, con túnica larga y sin casco como el de la imagen, solía ser un esclavo o un profesional a sueldo, de ahí que la corona de olivo se diera al dueño de las monturas.","Por ese motivo hubo mujeres campeonas olímpicas, como la princesa espartana Cinisca, vencedora en 396 a. C."],"C3":["Que el hombre que conduce sea el vencedor olímpico de la prueba, porque la corona se daba al dueño de las monturas y el auriga solía ser un esclavo o un profesional a sueldo.","Que la escena muestre una carrera concreta de Olimpia, ya que el vaso no identifica el certamen ni a los participantes.","Que las mujeres quedaran fuera de la hípica, puesto que, aunque la imagen solo muestra a un varón, la corona iba al propietario y hubo campeonas como Cinisca."]},{"id":"I3-n17","tema":3,"pie":"Muchacha corriendo o danzando · Hacia 520-500 a. C. · Museo Británico","c2s":["Esta carrera contrasta con la prohibición de Olimpia, ya que la ley de Élide castigaba con la muerte a las mujeres casadas sorprendidas en el festival, mientras que las jóvenes solteras sí podían asistir."],"C3":["Que la figura represente a una corredora de los Juegos Hereos, ya que el pie admite que esté corriendo o danzando y su ropa solo se parece a la que describen los textos.","Que las mujeres griegas compitieran en igualdad con los varones, porque los Hereos estaban reservados a muchachas solteras y la mujer casada tenía vetado incluso presenciar los Juegos.","Que la carrera tuviera una finalidad solo deportiva, puesto que una figura aislada no revela el sentido de la prueba y Serwint (1993) la interpreta ante todo como un rito prenupcial."]},{"id":"I4-n01","tema":4,"pie":"Joven que se arroja al agua, de la Tumba del Nadador · Paestum · Hacia 480-470 a. C. · Museo Arqueológico Nacional de Paestum","c2s":[],"C3":["Que se celebraran competiciones de salto o de natación, porque ningún documento permite hablar de competiciones en el agua y la imagen muestra a un único joven, sin rivales, jueces ni premio.","Que el salto fuera solo un juego de ocio, ya que se pintó en una tumba y los estudios le atribuyen también un sentido religioso o de paso a la edad adulta.","Que toda la juventud de la ciudad practicara este salto, puesto que una tumba pintada recoge el gusto de quien la encargó y la escena retrata a un solo joven."]},{"id":"I4-n02","tema":4,"pie":"Carrera de carros con un accidente · Tumba de las Olimpiadas, Tarquinia · 530-510 a. C.","c2s":["La pintura documenta las carreras de carros, una de las actividades predilectas de los etruscos, aquí con una biga, el carro de dos caballos que más se representa en su arte."],"C3":["Que los accidentes fueran tan frecuentes como sugiere la pintura, porque el arte etrusco elegía el vuelco por ser el momento más emocionante para el público.","Que los aurigas fueran aristócratas que corrían por prestigio, ya que la imagen no dice quién conducía y los estudios los tienen por siervos o por profesionales de bajo rango.","Que el auriga muriera en la caída o quién ganó la carrera, puesto que la pintura fija un solo instante y no muestra el desenlace ni al vencedor."]},{"id":"I4-n03","tema":4,"pie":"Juego del phersu · Tumba de los Augures, Tarquinia · Hacia 530 a. C.","c2s":["La pintura documenta el juego del phersu, un personaje enmascarado que azuza a un perro contra un hombre encapuchado que se defiende con una porra, aunque la cuerda que sujeta el enmascarado le impide salvar la vida."],"C3":["Que el phersu sea el origen de los combates de gladiadores, porque ninguna de las diecisiete pinturas de juegos fúnebres de Tarquinia y Chiusi muestra un gladiador y la gladiatura no llegó a Etruria hasta finales del siglo IV o comienzos del III a. C.","Que la escena retrate una ejecución real, ya que la pintura admite también una lectura religiosa como rito órfico (Avramidou, 2009).","Que el juego se celebrara con regularidad ante un público numeroso, puesto que la imagen muestra solo a los dos protagonistas y al perro, sin espectadores, y una única tumba no basta para medir su frecuencia."]},{"id":"I4-n04","tema":4,"pie":"Gladiador, mosaico de la casa de los gladiadores · Kourion (Chipre) · Siglo III d. C.","c2s":["El mosaico documenta el combate de gladiadores, el espectáculo más prestigioso del anfiteatro y la razón de que este edificio llegara a construirse.","Que en el siglo III d. C. una casa de Kourion, en Chipre, se decorara con la figura de un gladiador fuertemente armado muestra además que el prestigio del espectáculo había llegado a las provincias y a la decoración doméstica."],"C3":["Que el gladiador venciera o muriera en ese combate, porque el mosaico muestra una figura aislada y no el desenlace del duelo.","Que la casa perteneciera a un organizador de juegos o a un gladiador, ya que el mosaico no informa sobre su propietario.","Que el combate conservara en el siglo III d. C. el sentido funerario de sus orígenes, puesto que la pieza es muy posterior al primer combate de Roma, en 264 a. C., y para entonces los grandes combates los ofrecía el emperador."]},{"id":"I4-n05","tema":4,"pie":"Combate de gladiadores, mosaico de la villa de Nennig · Nennig (Alemania) · Siglo II d. C.","c2s":["La escena documenta el combate de gladiadores, el número principal y más caro de la tarde en la jornada de un munus, que se anunciaba con antelación en carteles pintados en las paredes de la ciudad.","Enfrenta a un gladiador con tridente, sin escudo y a cara descubierta, como el reciario, con otro de casco y gran escudo, como el secutor que lo perseguía, una pareja tan habitual que las inscripciones la abreviaban como «contra ret»."],"C3":["Que el combate acabara con la muerte del vencido, porque el mosaico fija el duelo en curso y el veredicto, la missio o el iugula, lo decidía el editor atento a la grada.","Que la villa de Nennig acogiera combates de gladiadores, ya que el mosaico decora una vivienda y no informa de dónde se celebró el espectáculo representado.","Que el reciario y el secutor fueran los únicos tipos de gladiador, puesto que la escena recoge una sola pareja y en la arena lucharon otros, como el murmillo, el tracio o el hoplómaco."]},{"id":"I4-n06","tema":4,"pie":"Relieve de las gladiadoras Amazona y Achillia · Halicarnaso (Bodrum, Turquía) · Siglo II d. C. · Museo Británico, Londres","c2s":[],"C3":["Que las gladiadoras fueran frecuentes en el anfiteatro, porque las fuentes literarias las mencionan menos de diez veces hasta el año 200 d. C. y el relieve recoge un único combate.","Que mujeres de la élite combatieran en la arena, ya que el relieve no informa del rango de las luchadoras y los autores antiguos condenan expresamente a las de familia senatorial o ecuestre.","Que las mujeres combatieran en la arena durante todo el Imperio, puesto que la pieza es del siglo II d. C. y en el año 200 un decreto imperial prohibió combatir a todas las mujeres."]},{"id":"I4-n07","tema":4,"pie":"Venator frente a una leona, pintura del podio del anfiteatro de Mérida hallada en 1979 · Siglo I d. C. · Museo Nacional de Arte Romano, Mérida","c2s":["La pintura documenta las venationes, los espectáculos del anfiteatro con animales, en este caso una cacería en la que un venator, un cazador profesional y bien equipado, se enfrenta con la lanza a una leona.","Pintada en el podio del anfiteatro de Mérida en el siglo I d. C., la escena muestra además que el espectáculo había llegado a Hispania y que se representaba en el mismo edificio en el que se celebraba."],"C3":["Que el venator venciera a la leona, porque la pintura fija el instante previo al choque y no su resultado.","Que todos los que se enfrentaban a las fieras fueran cazadores bien equipados, ya que en la arena había también bestiarii, de menor rango y con menos protección, y condenados que morían ante ellas.","Que en Mérida se exhibieran fieras exóticas en gran número, puesto que la pintura muestra un solo animal y reunirlas en cantidad solo estaba al alcance del emperador y de los más ricos."]},{"id":"I4-n08","tema":4,"pie":"Mosaico de Zliten (Libia) · Hacia 200 d. C. · Museo Arqueológico de Trípoli","c2s":["El mosaico documenta las venationes en varias de sus modalidades a la vez, puesto que reúne cacerías de ciervos y jabalíes, una lucha entre fieras, la del oso y el toro encadenados, y la ejecución de condenados a las fieras (damnati ad bestias).","En la jornada de un munus las cacerías ocupaban la mañana y las ejecuciones el mediodía, y el mosaico, de hacia 200 d. C. y procedente de la actual Libia, muestra que ese orden de menos a más violencia se conocía también en las provincias del norte de África."],"C3":["Que los condenados murieran siempre a manos de las fieras, porque el mosaico fija el momento en que son empujados hacia ellas y no el desenlace.","Que todas estas escenas sucedieran a la vez y en el orden en que aparecen, ya que el mosaico reúne en dos frisos números que en la jornada se repartían entre la mañana y el mediodía.","Que esta pena pudiera aplicarse a cualquier ciudadano, puesto que la imagen no muestra el rango de los condenados y la ley eximía de ella a los poderosos."]},{"id":"I4-n09","tema":4,"pie":"Mosaico de los Aurigas · Siglo IV d. C. · Museo Nacional de Arte Romano, Mérida","c2s":["El mosaico documenta las carreras de carros del circo, que enfrentaban casi siempre cuadrigas como la de la imagen, en las que el caballo más valioso era el de la izquierda, puesto que iba por el lado interior y hacía de eje en cada vuelta a la meta.","El auriga conducía con las riendas atadas a la cintura, de modo que dominaba el carro con el peso del cuerpo, y vestía un equipo que lo protegía de las caídas, con casco acolchado y túnica con bandas de cuero en el pecho, como se aprecia en la figura.","Al primero en cruzar la línea se le entregaba una palma y una corona, y la victoria se apuntaba al auriga y a su color, de ahí que el mosaico lo retrate de frente, con la palma en la mano, como un vencedor."],"C3":["Que el auriga ganara una carrera concreta o cuántas victorias sumó, porque el mosaico lo presenta en una pose de frente que no narra ninguna carrera.","Que el auriga perteneciera a la élite por aparecer en un mosaico, ya que la imagen no informa de su origen social y los aurigas eran esclavos, libertos o romanos de muy baja condición.","Que las carreras de cuadrigas se corrieran sin peligro, puesto que el mosaico muestra al auriga quieto y triunfante, mientras que la carrera se decidía en los giros, donde un giro demasiado cerrado o un roce con otro carro acababa en accidente."]},{"id":"I4-n10","tema":4,"pie":"Aurigas y caballos · Siglo III d. C. · Museo Nacional Romano, Palazzo Massimo, Roma","c2s":["En la pista la facción competía como un equipo, ya que podía inscribir hasta tres carros por carrera, uno que buscaba la victoria y otros que le marcaban el ritmo o cerraban el paso a los rivales."],"C3":["Que solo existieran cuatro colores, porque Domiciano añadió durante un tiempo el dorado y el púrpura, aunque su existencia fue efímera.","Que cada facción contara con un solo auriga y un solo caballo, ya que el mosaico muestra un representante por color y cada una podía inscribir hasta tres carros por carrera con cientos de empleados detrás.","Que los aurigas fueran los dueños de las facciones, puesto que la imagen no muestra la organización de la empresa y al frente de cada una estaba un caballero, el dominus factionis."]},{"id":"I4-n11","tema":4,"pie":"Mosaico de las «muchachas en bikini» · Villa del Casale, Piazza Armerina (Sicilia) · Primera mitad del siglo IV d. C.","c2s":["Las muchachas visten el calzón y el strophium, la banda con la que se cubrían las deportistas, y la escena, que al principio se tomó por un concurso de belleza, hoy se interpreta como una competición atlética (Pensabene y Gallocchio, 2011)."],"C3":["Que el deporte femenino fuera habitual en Roma, porque el mosaico es un testimonio aislado y el ejercicio de la mujer fuera de casa se tenía por impropio.","Que estas competiciones se celebraran en público ante la ciudad, ya que el mosaico decoraba una sala de la parte privada de una villa y no informa del lugar de la prueba.","Que la escena represente un concurso de belleza, puesto que el disco, las halteras y la pelota, junto a la entrega de palmas y coronas, remiten a una competición atlética."]}],"t1quiz":[{"q":{"es":"Según Neuendorff, la primera actividad física exclusivamente humana fue…","en":"According to Neuendorff, the first exclusively human physical activity was…"},"options":[{"es":"El lanzamiento de jabalina","en":"Javelin throwing"},{"es":"La danza ritual en torno al fuego","en":"Ritual dance around the fire"},{"es":"La carrera","en":"Running"},{"es":"La lucha cuerpo a cuerpo entre rivales","en":"Hand-to-hand wrestling between rivals"}],"answer":0,"explain":{"es":"Teoría biológica o del instinto (1930): la lucha por sobrevivir potencia fuerza, velocidad y destreza.","en":"Biological or instinct theory (1930): the struggle to survive develops strength, speed and skill."}},{"q":{"es":"Los tres estímulos de la actividad física según Eppensteiner (1964) son…","en":"Eppensteiner's (1964) three stimuli for physical activity are…"},"options":[{"es":"Defensivo, religioso y social","en":"Defensive, religious and social"},{"es":"Laboral, bélico y lúdico","en":"Labour, war and play"},{"es":"Erótico, mágico, guerrero y festivo","en":"Erotic, magical, warlike and festive"},{"es":"Individual, grupal y tribal","en":"Individual, group and tribal"}],"answer":0,"explain":{"es":"Erótico, mágico y guerrero son los tipos de danza de Popplow, no los estímulos de Eppensteiner.","en":"Erotic, magical and warlike are Popplow's types of dance, not Eppensteiner's stimuli."}},{"q":{"es":"¿Qué teoría sobre el origen del ejercicio se formuló en Estados Unidos?","en":"Which theory on the origin of exercise was formulated in the United States?"},"options":[{"es":"La pedagógica (Van Dalen, Mitchell y Bennett)","en":"The pedagogical one (Van Dalen, Mitchell & Bennett)"},{"es":"La cultural, formulada por Carl Diem en Alemania","en":"The cultural one, put forward by Carl Diem in Germany"},{"es":"La biológica (Neuendorff)","en":"The biological one (Neuendorff)"},{"es":"La marxista (Eichel)","en":"The Marxist one (Eichel)"}],"answer":0,"explain":{"es":"Biológica y marxista proceden de Alemania Oriental; la cultural de Alemania Occidental; la pedagógica de Estados Unidos (1953).","en":"The biological and Marxist theories come from East Germany; the cultural one from West Germany; the pedagogical one from the United States (1953)."}},{"q":{"es":"¿Cuáles son las tres culturas corporales de Eichberg?","en":"What are Eichberg's three body cultures?"},"options":[{"es":"Rendimiento, disciplina y forma física, fiesta popular","en":"Achievement, discipline and fitness, popular festivity"},{"es":"Ritual, récord y espectáculo, con el estadio como escenario","en":"Ritual, record and spectacle, with the stadium as its stage"},{"es":"Juego, ejercicio y deporte","en":"Play, exercise and sport"},{"es":"Élite, masa y escuela","en":"Elite, mass and school"}],"answer":0,"explain":{"es":"Las tres conviven en toda sociedad; los siete rasgos de Guttmann describen bien la primera y no ven las otras dos.","en":"All three coexist in every society; Guttmann's seven characteristics describe the first well and miss the other two."}},{"q":{"es":"El yacimiento de Schöningen es…","en":"The Schöningen site is…"},"options":[{"es":"Neandertal, en la Baja Sajonia, h. 200.000 a. C.","en":"Neanderthal, in Lower Saxony, c. 200,000 BC"},{"es":"Sapiens, en Polonia, h. 40.000 a. C.","en":"Sapiens, in Poland, c. 40,000 BC"},{"es":"Neolítico, en Escocia, h. 3000 a. C.","en":"Neolithic, in Scotland, c. 3000 BC"},{"es":"Paleolítico superior, en Tanzania, h. 17.000 a. C.","en":"Upper Palaeolithic, in Tanzania, c. 17,000 BC"}],"answer":0,"explain":{"es":"Conserva el conjunto de armas de madera más antiguo conocido, junto a restos de una veintena de caballos (Hutson et al., 2025).","en":"It preserves the oldest known set of wooden weapons, alongside the remains of some twenty horses (Hutson et al., 2025)."}},{"q":{"es":"¿En qué país están las huellas de Willandra Lakes?","en":"In which country are the Willandra Lakes footprints?"},"options":[{"es":"Australia","en":"Australia"},{"es":"Tanzania","en":"Tanzania"},{"es":"Sudáfrica","en":"South Africa"},{"es":"Alemania","en":"Germany"}],"answer":0,"explain":{"es":"Nueva Gales del Sur, más de 120 huellas datadas entre 19.000 y 23.000 años (Webb et al., 2006).","en":"New South Wales, more than 120 footprints dated between 19,000 and 23,000 years ago (Webb et al., 2006)."}},{"q":{"es":"Los dos ejes de análisis de la asignatura son…","en":"The two axes of analysis of this course are…"},"options":[{"es":"Función y significado","en":"Function and meaning"},{"es":"Ritual y récord","en":"Ritual and record"},{"es":"Campeones, récords y fechas","en":"Champions, records and dates"},{"es":"Juego y trabajo","en":"Play and work"}],"answer":0,"explain":{"es":"Qué aporta un deporte a la sociedad que lo practica y qué representaba para quienes lo practicaban.","en":"What a sport contributes to the society that practises it and what it meant to those who practised it."}},{"q":{"es":"¿Para qué servían las cometas del desierto?","en":"What were desert kites used for?"},"options":[{"es":"Para cazar animales en masa por emboscada","en":"For mass ambush hunting of animals"},{"es":"Para observar los astros","en":"For observing the stars"},{"es":"Para delimitar los campos de cultivo y los pastos","en":"For marking out fields and pastures"},{"es":"Para carreras rituales","en":"For ritual races"}],"answer":0,"explain":{"es":"Dos muros convergentes conducían a los animales a un recinto cerrado o foso; hay más de 6.000 catalogadas.","en":"Two converging walls drove animals into an enclosure or pit; more than 6,000 have been catalogued."}},{"q":{"es":"¿De qué material está hecho el bumerán de Obłazowa?","en":"What is the Obłazowa boomerang made of?"},"options":[{"es":"Marfil de mamut","en":"Mammoth ivory"},{"es":"Madera de fresno","en":"Ash wood"},{"es":"Hueso de bisonte","en":"Bison bone"},{"es":"Asta de reno","en":"Reindeer antler"}],"answer":0,"explain":{"es":"Es el bumerán más antiguo conocido; se fechó el nivel en que apareció, entre 40.300 y 37.300 a. C.","en":"It is the oldest known boomerang; the layer in which it appeared was dated to 40,300-37,300 BC."}},{"q":{"es":"¿Qué mide Guttmann para saber qué tiene de moderno el deporte moderno?","en":"What does Guttmann compare to find out what is modern about modern sport?"},"options":[{"es":"El deporte de hoy frente al de épocas anteriores","en":"Today's sport against that of earlier periods"},{"es":"El rendimiento de los atletas","en":"Athletes' performance"},{"es":"El número de federaciones","en":"The number of federations"},{"es":"La violencia de cada sociedad a lo largo de los siglos","en":"The violence of each society across the centuries"}],"answer":0,"explain":{"es":"De esa comparación salen los siete rasgos, y con ellos la pregunta por qué el deporte adopta en cada sociedad la forma que adopta.","en":"From that comparison come the seven characteristics, and with them the question of why sport takes the form it does in each society."}},{"q":{"es":"Según Ruff et al. (2015), la resistencia de los huesos largos europeos…","en":"According to Ruff et al. (2015), the strength of European long bones…"},"options":[{"es":"Cae desde el Neolítico y se estabiliza en época romana","en":"Falls from the Neolithic and stabilises in Roman times"},{"es":"Aumenta de forma continua desde el Paleolítico hasta hoy","en":"Rises steadily from the Palaeolithic to the present day"},{"es":"No ha cambiado desde el Paleolítico","en":"Has not changed since the Palaeolithic"},{"es":"Cae solo a partir del siglo XX","en":"Falls only from the twentieth century"}],"answer":0,"explain":{"es":"Análisis de 1.842 esqueletos: la caída arranca entre el 5000 y el 2000 a. C. y se detiene en la Edad del Hierro y época romana.","en":"Analysis of 1,842 skeletons: the decline starts between 5000 and 2000 BC and stops in the Iron Age and Roman period."}}],"t1myths":[{"claim":{"es":"Los antiguos griegos tenían una palabra equivalente a «deporte».","en":"The ancient Greeks had a word equivalent to 'sport'."},"answer":false,"explain":{"es":"Tenían cuatro términos distintos: agón, athlos, gymnastiké y paidiá. La palabra deporte adquiere su significado actual en el siglo XIX.","en":"They had four different terms: agon, athlos, gymnastike and paidia. The word sport acquires its present meaning in the nineteenth century."}},{"claim":{"es":"La palabra «deporte» procede del latín deportare, «llevar fuera».","en":"The word 'deporte' comes from the Latin deportare, 'to carry away'."},"answer":true,"explain":{"es":"En latín tardío el verbo reflexivo se deportare significaba distraerse; pasó al occitano deportar y al francés antiguo desport (Olivera y Torrebadella, 2015).","en":"In late Latin the reflexive se deportare meant to amuse oneself; it passed into Occitan deportar and Old French desport (Olivera & Torrebadella, 2015)."}},{"claim":{"es":"En la Prehistoria existió el deporte reglado.","en":"Regulated sport existed in Prehistory."},"answer":false,"explain":{"es":"Hubo que esperar a la Edad Antigua para el deporte reglado, si bien las actividades físicas con función más allá de lo corpóreo acompañan al ser humano desde su origen.","en":"Regulated sport had to wait until Antiquity, although physical activities with a function beyond the body have accompanied humans since their origin."}},{"claim":{"es":"Está demostrado que en el Paleolítico la caza correspondía a los varones y la pesca al grupo entero.","en":"It is proven that in the Palaeolithic hunting was for men and fishing for the whole group."},"answer":false,"explain":{"es":"Durante décadas se dio por supuesto, pero hoy esa división no está demostrada para ninguna de las dos actividades y el debate sigue abierto (Anderson et al., 2023).","en":"For decades it was assumed, but today that division is not proven for either activity and the debate remains open (Anderson et al., 2023)."}},{"claim":{"es":"Está demostrado que un hombre prehistórico de Willandra corría tan rápido como un finalista olímpico de 100 m.","en":"It is proven that a prehistoric man at Willandra ran as fast as an Olympic 100 m finalist."},"answer":false,"explain":{"es":"Webb estimó en 2007 unos 37 km/h para el rastro T8, pero Ruiz y Torices (2013) cuestionaron la precisión de esas estimaciones a partir de huellas fósiles.","en":"Webb estimated about 37 km/h for track T8 in 2007, but Ruiz and Torices (2013) questioned the accuracy of such estimates from fossil trackways."}},{"claim":{"es":"La Prehistoria ocupa el 99 % de nuestro desarrollo como especie.","en":"Prehistory covers 99 % of our development as a species."},"answer":true,"explain":{"es":"La escasez de fuentes hace difícil describir qué actividades realizaba el ser humano prehistórico, de ahí las tres aproximaciones: teorías, método antropológico y método arqueológico.","en":"The scarcity of sources makes it hard to describe what prehistoric humans did, hence the three approaches: theories, the anthropological method and the archaeological method."}},{"claim":{"es":"Las mujeres del Neolítico tenían menos fuerza en los brazos que las atletas actuales.","en":"Neolithic women had weaker arms than today's athletes."},"answer":false,"explain":{"es":"Sus húmeros eran entre un 11 y un 16 % más resistentes que los de las remeras de élite de Cambridge (Macintosh et al., 2017).","en":"Their humeri were 11 to 16 % stronger than those of elite Cambridge rowers (Macintosh et al., 2017)."}},{"claim":{"es":"Las armas de madera más antiguas conservadas son las lanzas neandertales de Schöningen.","en":"The oldest surviving wooden weapons are the Neanderthal spears from Schöningen."},"answer":true,"explain":{"es":"El yacimiento de la Baja Sajonia conserva 187 artefactos de madera, con al menos veinte armas de caza, fechados hacia 200.000 a. C. (Hutson et al., 2025).","en":"The Lower Saxony site preserves 187 wooden artefacts, with at least twenty hunting weapons, dated to c. 200,000 BC (Hutson et al., 2025)."}},{"claim":{"es":"Para Huizinga, el juego es un producto de la sociedad.","en":"For Huizinga, play is a product of society."},"answer":false,"explain":{"es":"Es al revés: para Huizinga el juego precede a la sociedad. Quienes lo consideran fabricado por la sociedad son Elias y Dunning.","en":"It is the other way round: for Huizinga play precedes society. Elias and Dunning are the ones who regard it as manufactured by society."}}],"t1gloss":[{"term":{"es":"Actividad física","en":"Physical activity"},"def":{"es":"Cualquier movimiento corporal producido por los músculos esqueléticos que conlleva un gasto de energía por encima del nivel basal.","en":"Any bodily movement produced by skeletal muscles that involves energy expenditure above the basal level."}},{"term":{"es":"Ejercicio físico","en":"Physical exercise"},"def":{"es":"Actividad física planeada, estructurada y repetitiva con el objetivo de obtener una mejora física y psicológica.","en":"Planned, structured and repetitive physical activity aimed at physical and psychological improvement."}},{"term":{"es":"Juego","en":"Game / play"},"def":{"es":"Acción libre y generalmente espontánea que se efectúa por entretenimiento conforme a reglas, preestablecidas o improvisadas, y con duración limitada.","en":"Free and usually spontaneous action carried out for entertainment according to rules, pre-set or improvised, and of limited duration."}},{"term":{"es":"Educación física","en":"Physical education"},"def":{"es":"Disciplina que abarca la formación integral del individuo a través del uso de la motricidad humana.","en":"Discipline covering the integral education of the individual through human movement."}},{"term":{"es":"Gimnasia","en":"Gymnastics"},"def":{"es":"Hoy, deporte reglado de secuencias de ejercicios que requieren fuerza, flexibilidad y elegancia; en el siglo XIX, sistemas de ejercicio no competitivos.","en":"Today, a regulated sport of exercise sequences requiring strength, flexibility and elegance; in the nineteenth century, non-competitive exercise systems."}},{"term":{"es":"Deporte (enfoque cerrado)","en":"Sport (narrow approach)"},"def":{"es":"Actividad física reglada, competitiva e institucionalizada que busca el máximo rendimiento.","en":"Regulated, competitive and institutionalised physical activity seeking maximum performance."}},{"term":{"es":"Deporte (enfoque abierto)","en":"Sport (broad approach)"},"def":{"es":"Todas las formas de actividad, organizadas o no, cuyo objetivo es la expresión o la mejora física o psíquica (Carta Europea del Deporte, 1992).","en":"All forms of activity, organised or not, aimed at physical or mental expression or improvement (European Sports Charter, 1992)."}},{"term":{"es":"Deportare","en":"Deportare"},"def":{"es":"Verbo latino, «llevar fuera»; en forma reflexiva pasó a significar distraerse, y de ahí al occitano deportar y al francés antiguo desport.","en":"Latin verb, 'to carry away'; in reflexive form it came to mean to amuse oneself, whence Occitan deportar and Old French desport."}},{"term":{"es":"Agón","en":"Agon"},"def":{"es":"Término griego para el certamen o la competición.","en":"Greek term for the contest or competition."}},{"term":{"es":"Athlos","en":"Athlos"},"def":{"es":"Término griego para la prueba con premio.","en":"Greek term for a trial with a prize."}},{"term":{"es":"Gymnastiké","en":"Gymnastike"},"def":{"es":"Término griego para el ejercicio que se practica desnudo.","en":"Greek term for exercise practised naked."}},{"term":{"es":"Paidiá","en":"Paidia"},"def":{"es":"Término griego para el juego.","en":"Greek term for play."}},{"term":{"es":"Círculo mágico","en":"Magic circle"},"def":{"es":"Según Huizinga, espacio físico o mental que separa el mundo real del mundo del juego y se rige por reglas propias.","en":"According to Huizinga, a physical or mental space separating the real world from the world of play, governed by its own rules."}},{"term":{"es":"Descontrol controlado","en":"Controlled de-controlling"},"def":{"es":"Según Elias y Dunning, función del deporte en sociedades que han rebajado su tolerancia a la violencia: un lugar para emocionarse con permiso.","en":"According to Elias and Dunning, the function of sport in societies that have lowered their tolerance of violence: a place to get excited with permission."}},{"term":{"es":"Secularismo","en":"Secularism"},"def":{"es":"Rasgo de Guttmann: se compite por competir y no para honrar a un dios.","en":"Guttmann characteristic: one competes for its own sake and not to honour a god."}},{"term":{"es":"Racionalización","en":"Rationalisation"},"def":{"es":"Rasgo de Guttmann: reglas escritas y entrenamiento planificado.","en":"Guttmann characteristic: written rules and planned training."}},{"term":{"es":"Burocratización","en":"Bureaucratisation"},"def":{"es":"Rasgo de Guttmann: federaciones que regulan, sancionan y homologan.","en":"Guttmann characteristic: federations that regulate, sanction and certify."}},{"term":{"es":"Cuantificación","en":"Quantification"},"def":{"es":"Rasgo de Guttmann: todo se convierte en número.","en":"Guttmann characteristic: everything becomes a number."}},{"term":{"es":"Récord","en":"Record"},"def":{"es":"Rasgo de Guttmann: competir contra quien no está presente; exige medir con un patrón, archivar y creer en la mejora indefinida.","en":"Guttmann characteristic: competing against someone who is not present; it requires a standard measure, an archive and belief in indefinite improvement."}},{"term":{"es":"Culturas corporales","en":"Body cultures"},"def":{"es":"Según Eichberg, tres formas que conviven en toda sociedad: rendimiento, disciplina y forma física, y fiesta popular.","en":"According to Eichberg, three forms coexisting in every society: achievement, discipline and fitness, and popular festivity."}},{"term":{"es":"Analogía etnográfica","en":"Ethnographic analogy"},"def":{"es":"Método antropológico que usa pueblos sin escritura ni Estado para conocer qué funciones puede tener la actividad física en ese tipo de sociedades.","en":"Anthropological method that uses peoples without writing or a state to learn what functions physical activity can have in such societies."}},{"term":{"es":"Bipedestación","en":"Bipedalism"},"def":{"es":"Marcha erguida cuyo surgimiento, multicausal, marca el inicio de la Humanidad.","en":"Upright walking whose multi-causal emergence marks the beginning of humankind."}},{"term":{"es":"Arte rupestre levantino","en":"Levantine rock art"},"def":{"es":"Pinturas del arco mediterráneo peninsular con figuras humanas en movimiento (caza, recolección de miel); cronología discutida, posiblemente 10.000-5.000 a. C.","en":"Paintings of the Iberian Mediterranean arc with human figures in motion (hunting, honey gathering); disputed chronology, possibly 10,000-5,000 BC."}},{"term":{"es":"Cometa del desierto","en":"Desert kite"},"def":{"es":"Trampa de caza formada por dos muros convergentes en embudo que conducen a los animales a un recinto o foso.","en":"Hunting trap formed by two converging funnel-shaped walls driving animals into an enclosure or pit."}},{"term":{"es":"Teoría biológica o del instinto","en":"Biological or instinct theory"},"def":{"es":"Neuendorff (1930): el ejercicio nace del instinto de supervivencia; el lanzamiento de jabalina sería la primera actividad exclusivamente humana.","en":"Neuendorff (1930): exercise arises from the survival instinct; javelin throwing would be the first exclusively human activity."}},{"term":{"es":"Teoría laboral-bélica o marxista","en":"Labour-war or Marxist theory"},"def":{"es":"Eichel (1969): los ejercicios corporales sirven para mejorar el rendimiento del trabajo (caza) y, tras los asentamientos, para la reunión social.","en":"Eichel (1969): bodily exercises serve to improve work performance (hunting) and, after settlement, social gathering."}},{"term":{"es":"Teoría cultural","en":"Cultural theory"},"def":{"es":"Diem (1966) y Popplow (1973): el ejercicio nace en lo cultural una vez cubierta la supervivencia; la danza es la actividad más trascendente.","en":"Diem (1966) and Popplow (1973): exercise arises within culture once survival is covered; dance is the most significant activity."}},{"term":{"es":"Teoría pedagógica","en":"Pedagogical theory"},"def":{"es":"Van Dalen, Mitchell y Bennett (1953): el ejercicio nace de una educación física que busca la supervivencia del individuo y del grupo.","en":"Van Dalen, Mitchell and Bennett (1953): exercise arises from a physical education seeking the survival of the individual and the group."}}],"t2quiz":[{"q":{"es":"¿Cuál era la disciplina favorita del deporte real egipcio?","en":"What was the favourite discipline of Egyptian royal sport?"},"options":[{"es":"Tiro con arco sobre dianas de cobre","en":"Archery at copper targets"},{"es":"Lucha","en":"Wrestling"},{"es":"Carreras de carros tirados por caballos","en":"Races of horse-drawn chariots"},{"es":"Natación","en":"Swimming"}],"answer":0,"explain":{"es":"Florece en el Imperio Nuevo con el arco compuesto; sirve para que el rey, y nadie más, demuestre que su fuerza sigue intacta.","en":"It flourished in the New Kingdom with the composite bow; it lets the king, and no one else, show that his strength remains intact."}},{"q":{"es":"¿Cada cuánto se repetía el Heb-Sed tras el primer jubileo?","en":"How often was the Heb-Sed repeated after the first jubilee?"},"options":[{"es":"Cada tres años","en":"Every three years"},{"es":"Cada año","en":"Every year"},{"es":"Cada diez años","en":"Every ten years"},{"es":"Cada treinta años","en":"Every thirty years"}],"answer":0,"explain":{"es":"Se celebraba a los treinta años de reinado y luego cada tres. Ramsés II celebró trece o catorce en 66 años.","en":"It was held after thirty years of reign and then every three. Ramesses II held thirteen or fourteen in 66 years."}},{"q":{"es":"¿Qué longitud tenía el circuito completo de la carrera del Heb-Sed en Saqqara?","en":"How long was the full Heb-Sed race circuit at Saqqara?"},"options":[{"es":"140 m","en":"140 m"},{"es":"55 m","en":"55 m"},{"es":"400 m","en":"400 m"},{"es":"1 km","en":"1 km"}],"answer":0,"explain":{"es":"Recta de 55 m con dos mojones semicirculares; el circuito completo sumaba 140 m, corridos de norte a sur y de sur a norte.","en":"A 55 m straight with two semicircular markers; the full circuit was 140 m, run north to south and south to north."}},{"q":{"es":"¿Quién acuñó el concepto de Pharao ludens?","en":"Who coined the concept of Pharao ludens?"},"options":[{"es":"Erik Hornung (1982)","en":"Erik Hornung (1982)"},{"es":"Wolfgang Decker (1992)","en":"Wolfgang Decker (1992)"},{"es":"Johan Huizinga (1938)","en":"Johan Huizinga (1938)"},{"es":"Allen Guttmann (2004)","en":"Allen Guttmann (2004)"}],"answer":0,"explain":{"es":"Siguiendo a Huizinga, describe a un soberano cuya función se ejerce, en parte, jugando.","en":"Following Huizinga, it describes a ruler whose office is exercised, in part, through play."}},{"q":{"es":"¿Cuándo surge el ejército profesional permanente egipcio?","en":"When does the Egyptian standing professional army emerge?"},"options":[{"es":"En el Imperio Nuevo, tras la ocupación hicsa","en":"In the New Kingdom, after the Hyksos occupation"},{"es":"En el Imperio Antiguo, en tiempos de las pirámides","en":"In the Old Kingdom, in the age of the pyramids"},{"es":"En el Imperio Medio, con Beni Hasan","en":"In the Middle Kingdom, with Beni Hasan"},{"es":"Bajo dominio persa","en":"Under Persian rule"}],"answer":0,"explain":{"es":"Levas obligatorias de jóvenes campesinos alojados en campamentos de hasta 5.000 soldados; el Estado premiaba el servicio con tierras.","en":"Compulsory levies of young peasants housed in camps of up to 5,000 soldiers; the state rewarded service with land."}},{"q":{"es":"¿Cuáles son las tres modalidades de combate egipcias?","en":"What are the three Egyptian combat disciplines?"},"options":[{"es":"Lucha, tahtib y boxeo","en":"Wrestling, tahtib and boxing"},{"es":"Lucha, esgrima con espada y tiro","en":"Wrestling, sword fencing and shooting"},{"es":"Boxeo, pancracio y lucha","en":"Boxing, pankration and wrestling"},{"es":"Tahtib, jereed y buzkashi","en":"Tahtib, jereed and buzkashi"}],"answer":0,"explain":{"es":"Decker (1992) las ordena en tres contextos: preparación militar, ceremonias ante el rey y cultos religiosos.","en":"Decker (1992) orders them by three contexts: military training, ceremonies before the king and religious cults."}},{"q":{"es":"¿Qué recoge el relieve de la calzada de Sahure en Abusir?","en":"What does the Sahure causeway relief at Abusir record?"},"options":[{"es":"Tiro con arco, esgrima, lucha y regata de obreros y soldados","en":"Archery, fencing, wrestling and a boat race of workers and soldiers"},{"es":"La carrera del Heb-Sed del rey ante la corte y los sacerdotes","en":"The king's Heb-Sed run before the court and the priests"},{"es":"Una partida de senet","en":"A game of senet"},{"es":"Una justa de pescadores","en":"A fishermen's joust"}],"answer":0,"explain":{"es":"Programa de cuatro modalidades por la inauguración del templo funerario, con premios (collares de oro) y el rey presente. Dinastía V, h. 2490 a. C.","en":"A four-event programme for the inauguration of the funerary temple, with prizes (gold collars) and the king present. 5th Dynasty, c. 2490 BC."}},{"q":{"es":"¿Qué casilla del senet era la Casa del Renacimiento?","en":"Which senet square was the House of Rebirth?"},"options":[{"es":"La 15","en":"Square 15"},{"es":"La 26","en":"Square 26"},{"es":"La 30","en":"Square 30"},{"es":"La 1","en":"Square 1"}],"answer":0,"explain":{"es":"Protegía y permitía reingresar. Las fichas avanzaban en zigzag de la 1 a la 30 en un tablero de tres filas de diez.","en":"It protected and allowed re-entry. Pieces advanced in a zigzag from 1 to 30 on a board of three rows of ten."}},{"q":{"es":"¿Cuántas etapas distingue el tema en la historia de Persia?","en":"How many stages does the unit distinguish in the history of Persia?"},"options":[{"es":"Seis","en":"Six"},{"es":"Dos","en":"Two"},{"es":"Tres","en":"Three"},{"es":"Diez","en":"Ten"}],"answer":0,"explain":{"es":"El imperio aqueménida es solo la primera; lo común a las seis es el mundo equino, el arco y la lucha. Cambia quién practica, para qué y qué significa.","en":"The Achaemenid Empire is only the first; common to all six are the horse world, the bow and wrestling. What changes is who practises, why and what it means."}},{"q":{"es":"¿De qué palabra procede nuestro «paraíso»?","en":"Where does our word 'paradise' come from?"},"options":[{"es":"Del iranio paradeisos, parque de caza cercado","en":"From Iranian paradeisos, an enclosed hunting park"},{"es":"Del egipcio ma'at","en":"From Egyptian ma'at"},{"es":"Del fenicio Qart-ḥadašt","en":"From Phoenician Qart-ḥadašt"},{"es":"Del griego agón, la competición pública entre rivales","en":"From Greek agon, public competition between rivals"}],"answer":0,"explain":{"es":"Jenofonte describe el coto de Ciro. Se cazaba varias veces al mes con arco, espada corta, escudo y dos lanzas.","en":"Xenophon describes Cyrus's reserve. Hunting took place several times a month with bow, short sword, shield and two spears."}},{"q":{"es":"¿Qué cortesano fue decapitado por matar un león antes que el rey?","en":"Which courtier was beheaded for killing a lion before the king?"},"options":[{"es":"Megabizo, con Artajerjes I","en":"Megabyzus, under Artaxerxes I"},{"es":"Mardonio, en tiempos de Darío I","en":"Mardonius, in the time of Darius I"},{"es":"Harpago, con Ciro II","en":"Harpagus, under Cyrus II"},{"es":"Mazeo, con Darío III","en":"Mazaeus, under Darius III"}],"answer":0,"explain":{"es":"En la caza real el rey se reservaba el derecho de cazar primero.","en":"In the royal hunt the king reserved the right to strike first."}},{"q":{"es":"¿Quién construyó la plaza Naqsh-e Jahán de Isfahán como campo de chovgan?","en":"Who built Naqsh-e Jahan square in Isfahan as a chovgan field?"},"options":[{"es":"Abbás I, en 1598","en":"Abbas I, in 1598"},{"es":"Ciro II, en 550 a. C.","en":"Cyrus II, in 550 BC"},{"es":"Darío I, en 500 a. C.","en":"Darius I, in 500 BC"},{"es":"Rostam, en el siglo X","en":"Rostam, in the 10th century"}],"answer":0,"explain":{"es":"Servía a la vez como plaza mayor y campo de juego. Periodo safávida.","en":"It served both as main square and playing field. Safavid period."}},{"q":{"es":"¿Cuál fue la aportación cultural decisiva de los fenicios?","en":"What was the Phoenicians' decisive cultural contribution?"},"options":[{"es":"Fijar y difundir el alfabeto de 22 signos","en":"Fixing and spreading the 22-sign alphabet"},{"es":"Inventar la brújula","en":"Inventing the compass"},{"es":"Crear los Juegos Olímpicos","en":"Creating the Olympic Games"},{"es":"Introducir el caballo en todo el Mediterráneo","en":"Introducing the horse across the Mediterranean"}],"answer":0,"explain":{"es":"El sistema nació hacia 1800 a. C. entre trabajadores semitas del Sinaí; los fenicios lo fijaron en 22 consonantes y lo distribuyeron en sus barcos.","en":"The system arose around 1800 BC among Semitic workers in Sinai; the Phoenicians fixed it at 22 consonants and distributed it in their ships."}},{"q":{"es":"¿Por qué las naves fenicias de los relieves de Sargón II se llamaron hippoi?","en":"Why were the Phoenician ships in Sargon II's reliefs called hippoi?"},"options":[{"es":"Por la cabeza de caballo tallada en la proa","en":"For the horse head carved on the bow"},{"es":"Porque transportaban caballos para el ejército asirio","en":"Because they carried horses for the Assyrian army"},{"es":"Por su velocidad","en":"For their speed"},{"es":"Por el nombre de su puerto","en":"After their home port"}],"answer":0,"explain":{"es":"El mascarón de proa fue una de las principales innovaciones fenicias a la náutica. Transportaban madera de cedro remolcando troncos por la costa.","en":"The figurehead was one of the main Phoenician innovations in seafaring. The ships carried cedar, towing logs along the coast."}},{"q":{"es":"¿Qué porcentaje de las figuritas de Kharayeb representa a niños?","en":"What percentage of the Kharayeb figurines depict children?"},"options":[{"es":"35 %","en":"35 %"},{"es":"22 %","en":"22 %"},{"es":"50 %","en":"50 %"},{"es":"5 %","en":"5 %"}],"answer":0,"explain":{"es":"De 16.400 fragmentos, un 35 % son niños y un 22 % mujeres. Las figuras permiten ordenar una secuencia de juego por edades.","en":"Of 16,400 fragments, 35 % are children and 22 % women. The figures allow a sequence of play by age to be ordered."}},{"q":{"es":"¿Qué lleva a los persas a estatalizar la educación de los jóvenes?","en":"What leads the Persians to place young people's education under the state?"},"options":[{"es":"Gobernar decenas de pueblos con una minoría persa dispersa","en":"Ruling dozens of peoples with a scattered Persian minority"},{"es":"Preparar atletas capaces de competir con los griegos en Olimpia","en":"Preparing athletes able to compete with the Greeks at Olympia"},{"es":"La escasez de caballos","en":"The scarcity of horses"},{"es":"La influencia egipcia","en":"Egyptian influence"}],"answer":0,"explain":{"es":"El imperio se construye en treinta años sobre decenas de pueblos; la educación tiene como fin impedir que los hijos de los persas dejen de serlo.","en":"The empire was built in thirty years over dozens of peoples; education aimed to stop the sons of Persians from ceasing to be Persian."}}],"t3myths":[{"claim":{"es":"Los palacios cretenses no tenían murallas porque Creta fue una isla sin guerras.","en":"The Cretan palaces had no walls because Crete was an island without wars."},"answer":false,"explain":{"es":"Las primeras armas del Egeo son cretenses, había preparación para la guerra y algunos centros tuvieron fortificaciones. La «Pax Minoica» de Evans debe matizarse.","en":"The first weapons of the Aegean are Cretan, there was preparation for war and some centres had fortifications. Evans's 'Pax Minoica' must be qualified."}},{"claim":{"es":"Los minoicos competían por premios, como muestran sus imágenes.","en":"The Minoans competed for prizes, as their images show."},"answer":false,"explain":{"es":"Ningún objeto representa un premio ni una lista de vencedores. El deporte servía para la iniciación, el culto y el prestigio de las grandes casas.","en":"No object shows a prize or a list of victors. Sport served initiation, worship and the prestige of the great houses."}},{"claim":{"es":"Los toros del salto eran uros salvajes.","en":"The bulls in the leap were wild aurochs."},"answer":false,"explain":{"es":"El pelaje moteado de los toros de Cnoso solo se da en animales domésticos, de modo que no eran tan fieros como se ha propuesto.","en":"The spotted coat of the Knossos bulls occurs only in domestic animals, so they were not as fierce as has been suggested."}},{"claim":{"es":"La erupción de Tera puso fin a la Creta de los palacios.","en":"The eruption of Thera ended palatial Crete."},"answer":false,"explain":{"es":"Fue hacia 1628 a. C., unos ciento cincuenta años antes del final. Hoy la tesis más aceptada atribuye la destrucción de hacia 1450 a. C. a las invasiones micénicas.","en":"It happened c. 1628 BC, some 150 years before the end. Today the most accepted thesis attributes the destruction of c. 1450 BC to the Mycenaean invasions."}},{"claim":{"es":"La tregua sagrada detenía todas las guerras de Grecia durante los Juegos.","en":"The sacred truce stopped all wars in Greece during the Games."},"answer":false,"explain":{"es":"Protegía el territorio de Élide y a los peregrinos. La Olimpiada de 480 a. C. se celebró mientras Leónidas resistía en las Termópilas.","en":"It protected the territory of Elis and the pilgrims. The Olympiad of 480 BC was held while Leonidas held out at Thermopylae."}},{"claim":{"es":"Los Juegos de Olimpia continúan los juegos de la época micénica.","en":"The Olympic Games continue the games of the Mycenaean period."},"answer":false,"explain":{"es":"Más de mil años de vacío separan el túmulo prehistórico del santuario de Zeus, nacido a finales del siglo XI a. C. No hubo continuidad.","en":"More than a thousand years separate the prehistoric tumulus from the sanctuary of Zeus, founded at the end of the 11th century BC. There was no continuity."}},{"claim":{"es":"Está probado que los Juegos empezaron en 776 a. C.","en":"It is proven that the Games began in 776 BC."},"answer":false,"explain":{"es":"Es la fecha de una lista de vencedores compilada hacia 400 a. C. y poco fiable en sus primeros siglos. Se han propuesto también 884 (leyenda) y 704 a. C. (arqueología).","en":"It is the date of a list of victors compiled c. 400 BC and unreliable for its first centuries. Dates of 884 (legend) and 704 BC (archaeology) have also been proposed."}},{"claim":{"es":"Las ciudades griegas seleccionaban y pagaban a sus atletas.","en":"Greek cities selected and paid their athletes."},"answer":false,"explain":{"es":"Cada atleta acudía por iniciativa propia y costeaba entrenador, dieta, viaje y el mes en Élide. Ástilo llegó a cambiar de patria deportiva.","en":"Each athlete went on his own initiative and paid for coach, diet, travel and the month at Elis. Astylos even changed his sporting homeland."}},{"claim":{"es":"Como Olimpia solo daba una corona de olivo, el atleta no ganaba dinero.","en":"Since Olympia gave only an olive wreath, the athlete earned no money."},"answer":false,"explain":{"es":"Su ciudad lo recibía con estatuas, manutención y premios: Solón daba 500 dracmas al ateniense vencedor en Olimpia.","en":"His city welcomed him with statues, maintenance and rewards: Solon gave 500 drachmas to any Athenian who won at Olympia."}},{"claim":{"es":"Está demostrado que la carrera de hoplitas preparaba para la guerra.","en":"It is proven that the hoplite race was preparation for war."},"answer":false,"explain":{"es":"Su utilidad militar se discute: Mann (2021) no halla fuentes en ese sentido antes del siglo IV a. C. y Spivey (2021) cree que premiaba al corredor aislado y no la cohesión de la falange.","en":"Its military usefulness is debated: Mann (2021) finds no sources to that effect before the fourth century BC and Spivey (2021) thinks it rewarded the lone runner, not the cohesion of the phalanx."}},{"claim":{"es":"Los griegos medían y registraban las marcas del salto, la jabalina y el disco.","en":"The Greeks measured and recorded the marks in the jump, javelin and discus."},"answer":false,"explain":{"es":"Solo se marcaba con una estaca el mejor intento, que se movía si otro lo superaba. No sabemos si sus marcas eran comparables a las actuales.","en":"Only the best attempt was marked with a stake, moved if someone bettered it. We do not know whether their marks were comparable to today's."}},{"claim":{"es":"Los combates griegos tenían categorías de peso, como el boxeo actual.","en":"Greek combat sports had weight classes, like modern boxing."},"answer":false,"explain":{"es":"Solo había categorías de edad, sin asaltos ni descansos, de ahí que llevaran ventaja el más resistente y el más pesado.","en":"There were only age categories, with no rounds or breaks, which is why the most enduring and heaviest had the advantage."}},{"claim":{"es":"Hubo campeonas olímpicas aunque las mujeres casadas no podían entrar en Olimpia.","en":"There were female Olympic champions although married women could not enter Olympia."},"answer":true,"explain":{"es":"En la hípica la corona era para el dueño de las monturas, y Cinisca de Esparta ganó la cuadriga en 396 a. C.","en":"In the equestrian events the wreath went to the owner, and Kyniska of Sparta won the four-horse chariot race in 396 BC."}},{"claim":{"es":"Ninguna mujer corrió nunca en el estadio de Olimpia.","en":"No woman ever ran in the stadium of Olympia."},"answer":false,"explain":{"es":"En los Juegos Hereos, desde hacia 580 a. C., muchachas solteras corrían unos 160 m en el estadio en honor de Hera.","en":"In the Heraia, from c. 580 BC, unmarried girls ran about 160 m in the stadium in honour of Hera."}},{"claim":{"es":"Teodosio I prohibió los Juegos Olímpicos en 393 d. C.","en":"Theodosius I banned the Olympic Games in AD 393."},"answer":false,"explain":{"es":"Remijsen (2015) comprobó que esa ley no menciona los Juegos; el vínculo lo estableció un cronista del siglo XI. Los Juegos se apagaron porque las élites dejaron de costearlos.","en":"Remijsen (2015) showed that this law does not mention the Games; the link was made by an 11th-century chronicler. The Games faded because the elites stopped paying for them."}}],"t3match":[{"title":{"es":"Las cuatro lecturas del salto del toro","en":"The four readings of bull-leaping"},"pairs":[{"a":{"es":"Lectura ritual","en":"Ritual reading"},"b":{"es":"Ofrenda a los dioses, desde Evans","en":"Offering to the gods, since Evans"}},{"a":{"es":"Lectura iniciática","en":"Initiatory reading"},"b":{"es":"Paso de los jóvenes a la edad adulta","en":"Passage of the young to adulthood"}},{"a":{"es":"Lectura de poder","en":"Power reading"},"b":{"es":"Emblema del palacio de Cnoso","en":"Emblem of the palace of Knossos"}},{"a":{"es":"Lectura atlética","en":"Athletic reading"},"b":{"es":"Exhibición de destreza ante la comunidad","en":"Display of skill before the community"}}]},{"title":{"es":"Quién podía hacer deporte en Atenas","en":"Who could do sport in Athens"},"pairs":[{"a":{"es":"Plousioi","en":"Plousioi"},"b":{"es":"No trabajaban; 4 o 5 % de los hogares","en":"Did not work; 4 to 5% of households"}},{"a":{"es":"Penêtes","en":"Penêtes"},"b":{"es":"Trabajaban su tierra parte del año y podían pagar al paidotriba","en":"Worked their land part of the year and could pay the trainer"}},{"a":{"es":"Ptôchoi","en":"Ptôchoi"},"b":{"es":"Trabajaban a diario y apenas hacían deporte","en":"Worked daily and hardly did sport"}},{"a":{"es":"Esclavos","en":"Slaves"},"b":{"es":"La ley les vedaba el deporte","en":"The law barred them from sport"}}]},{"title":{"es":"Los valores del olimpismo","en":"The values of the Olympic Games"},"pairs":[{"a":{"es":"Kléos","en":"Kleos"},"b":{"es":"Gloria eterna","en":"Eternal glory"}},{"a":{"es":"Agón","en":"Agon"},"b":{"es":"Contienda que exige un adversario","en":"Contest that requires an opponent"}},{"a":{"es":"Kalokagathía","en":"Kalokagathia"},"b":{"es":"Equilibrio entre lo bello y lo bueno","en":"Balance between the beautiful and the good"}},{"a":{"es":"Areté","en":"Arete"},"b":{"es":"Excelencia","en":"Excellence"}},{"a":{"es":"Aidós","en":"Aidos"},"b":{"es":"Compostura y humildad del vencedor","en":"Composure and humility of the victor"}}]},{"title":{"es":"Cada prueba, su año de entrada","en":"Each event, its year of entry"},"pairs":[{"a":{"es":"Estadio","en":"Stadion"},"b":{"es":"776 a. C.","en":"776 BC"}},{"a":{"es":"Díaulos","en":"Diaulos"},"b":{"es":"724 a. C.","en":"724 BC"}},{"a":{"es":"Lucha y pentatlón","en":"Wrestling and pentathlon"},"b":{"es":"708 a. C.","en":"708 BC"}},{"a":{"es":"Pugilato","en":"Boxing"},"b":{"es":"688 a. C.","en":"688 BC"}},{"a":{"es":"Carrera de hoplitas","en":"Hoplite race"},"b":{"es":"520 a. C.","en":"520 BC"}}]},{"title":{"es":"Faltas y castigos en Olimpia","en":"Offences and punishments at Olympia"},"pairs":[{"a":{"es":"Salida falsa","en":"False start"},"b":{"es":"Azotes de los mastigóforos","en":"Flogging by the mastigophoroi"}},{"a":{"es":"Mentir a los jueces","en":"Lying to the judges"},"b":{"es":"Expulsión de los Juegos","en":"Expulsion from the Games"}},{"a":{"es":"Soborno","en":"Bribery"},"b":{"es":"Multa que costeaba un zan","en":"Fine that paid for a Zan"}},{"a":{"es":"Mujer casada en el festival","en":"Married woman at the festival"},"b":{"es":"Pena de muerte desde un monte cercano","en":"Death penalty from a nearby mountain"}}]}],"t3timeline":[{"title":{"es":"Creta y Micenas: del palacio a la aldea","en":"Crete and Mycenae: from palace to village"},"items":[{"label":{"es":"Primeros palacios cretenses","en":"First Cretan palaces"},"year":-1950,"date":{"es":"h. 1950 a. C.","en":"c. 1950 BC"}},{"label":{"es":"Erupción del volcán de Tera","en":"Eruption of the Thera volcano"},"year":-1628,"date":{"es":"h. 1628 a. C.","en":"c. 1628 BC"}},{"label":{"es":"Ritón de los boxeadores de Hagia Triada","en":"Boxer Rhyton of Hagia Triada"},"year":-1550,"date":{"es":"h. 1550-1500 a. C.","en":"c. 1550-1500 BC"}},{"label":{"es":"Los micénicos toman Cnoso","en":"The Mycenaeans take Knossos"},"year":-1450,"date":{"es":"h. 1450 a. C.","en":"c. 1450 BC"}},{"label":{"es":"Arde el palacio de Cnoso","en":"The palace of Knossos burns"},"year":-1375,"date":{"es":"h. 1375 a. C.","en":"c. 1375 BC"}},{"label":{"es":"Arden los palacios micénicos","en":"The Mycenaean palaces burn"},"year":-1200,"date":{"es":"1200-1150 a. C.","en":"1200-1150 BC"}},{"label":{"es":"Tumba del gran señor de Lefkandi","en":"Tomb of the great lord of Lefkandi"},"year":-950,"date":{"es":"h. 950 a. C.","en":"c. 950 BC"}},{"label":{"es":"Enócoe del Dipilón, premio de baile","en":"Dipylon oinochoe, a dancing prize"},"year":-740,"date":{"es":"h. 740-725 a. C.","en":"c. 740-725 BC"}}]},{"title":{"es":"Los periodos de Grecia","en":"The periods of Greece"},"items":[{"label":{"es":"Primeros Juegos de Olimpia, según la tradición","en":"First Olympic Games, according to tradition"},"year":-776,"date":{"es":"776 a. C.","en":"776 BC"}},{"label":{"es":"Fundación de Siracusa","en":"Foundation of Syracuse"},"year":-734,"date":{"es":"734 a. C.","en":"734 BC"}},{"label":{"es":"Reformas de Solón","en":"Reforms of Solon"},"year":-594,"date":{"es":"594/593 a. C.","en":"594/593 BC"}},{"label":{"es":"Reformas de Clístenes","en":"Reforms of Cleisthenes"},"year":-508,"date":{"es":"508 a. C.","en":"508 BC"}},{"label":{"es":"Batalla de Salamina, inicio de la época clásica","en":"Battle of Salamis, start of the Classical period"},"year":-480,"date":{"es":"480 a. C.","en":"480 BC"}},{"label":{"es":"Muerte de Alejandro Magno, inicio de la época helenística","en":"Death of Alexander the Great, start of the Hellenistic period"},"year":-323,"date":{"es":"323 a. C.","en":"323 BC"}},{"label":{"es":"Grecia queda bajo el dominio de Roma","en":"Greece falls under Roman rule"},"year":-146,"date":{"es":"146 a. C.","en":"146 BC"}}]},{"title":{"es":"El programa olímpico crece","en":"The Olympic programme grows"},"items":[{"label":{"es":"Estadio (stádion)","en":"Stadion"},"year":-776,"date":{"es":"776 a. C.","en":"776 BC"}},{"label":{"es":"Díaulos","en":"Diaulos"},"year":-724,"date":{"es":"724 a. C.","en":"724 BC"}},{"label":{"es":"Dólico","en":"Dolichos"},"year":-720,"date":{"es":"720 a. C.","en":"720 BC"}},{"label":{"es":"Pentatlón y lucha","en":"Pentathlon and wrestling"},"year":-708,"date":{"es":"708 a. C.","en":"708 BC"}},{"label":{"es":"Pugilato","en":"Boxing"},"year":-688,"date":{"es":"688 a. C.","en":"688 BC"}},{"label":{"es":"Carrera de cuadrigas","en":"Four-horse chariot race"},"year":-680,"date":{"es":"680 a. C.","en":"680 BC"}},{"label":{"es":"Pancracio y carrera de caballos","en":"Pankration and horse race"},"year":-648,"date":{"es":"648 a. C.","en":"648 BC"}},{"label":{"es":"Carrera de hoplitas","en":"Hoplite race"},"year":-520,"date":{"es":"520 a. C.","en":"520 BC"}},{"label":{"es":"Carrera de bigas","en":"Two-horse chariot race"},"year":-408,"date":{"es":"408 a. C.","en":"408 BC"}},{"label":{"es":"Pancracio de muchachos","en":"Boys' pankration"},"year":-200,"date":{"es":"200 a. C.","en":"200 BC"}}]},{"title":{"es":"Olimpia, del rito al final","en":"Olympia, from rite to end"},"items":[{"label":{"es":"Primer estadio de Olimpia","en":"First stadium at Olympia"},"year":-700,"date":{"es":"h. 700 a. C.","en":"c. 700 BC"}},{"label":{"es":"Primeros zanes, pagados con multas","en":"First Zanes, paid for with fines"},"year":-388,"date":{"es":"388 a. C.","en":"388 BC"}},{"label":{"es":"Tiberio gana la carrera de carros","en":"Tiberius wins the chariot race"},"year":4,"date":{"es":"4 d. C.","en":"AD 4"}},{"label":{"es":"Nerón compite en Olimpia","en":"Nero competes at Olympia"},"year":67,"date":{"es":"67 d. C.","en":"AD 67"}},{"label":{"es":"Ninfeo de Herodes Ático","en":"Nymphaeum of Herodes Atticus"},"year":150,"date":{"es":"h. 150 d. C.","en":"c. AD 150"}},{"label":{"es":"La estatua de Zeus se lleva a Constantinopla","en":"The statue of Zeus is taken to Constantinople"},"year":420,"date":{"es":"h. 420-440 d. C.","en":"c. AD 420-440"}},{"label":{"es":"Constitución de Teodosio II contra los templos","en":"Constitution of Theodosius II against the temples"},"year":435,"date":{"es":"435 d. C.","en":"AD 435"}}]}],"t3sources":[{"text":{"es":"«¿Contra qué clase de hombres nos has traído a luchar, que no compiten por dinero, sino por la excelencia?»","en":"'What kind of men have you brought us to fight against, who compete not for money but for excellence?'"},"question":{"es":"Según Heródoto, ¿quién dijo esta frase y cuándo?","en":"According to Herodotus, who said this and when?"},"options":[{"es":"Un noble persa ante su general, durante la invasión de Jerjes","en":"A Persian noble to his general, during Xerxes's invasion"},{"es":"Un juez de Olimpia al coronar con olivo a un vencedor del estadio","en":"An Olympic judge crowning a stadion victor with olive"},{"es":"Leónidas ante sus 300 espartanos","en":"Leonidas to his 300 Spartans"},{"es":"Un embajador de Élide en Esparta","en":"An ambassador of Elis in Sparta"}],"answer":0,"explain":{"es":"Unos desertores griegos contaron a los persas que sus compatriotas estaban en Olimpia, en 480 a. C., compitiendo por una simple corona de olivo. Los Juegos no se suspendieron por la guerra.","en":"Some Greek deserters told the Persians that their compatriots were at Olympia, in 480 BC, competing for a mere olive wreath. The Games were not suspended because of the war."}},{"text":{"es":"«…abierto a cualquier griego que quisiera acceder».","en":"'…open to any Greek who wished to enter.'"},"question":{"es":"¿A qué se refiere Heródoto con estas palabras?","en":"What does Herodotus refer to with these words?"},"options":[{"es":"Al santuario de Olimpia","en":"The sanctuary of Olympia"},{"es":"Al gimnasio de Atenas","en":"The gymnasium of Athens"},{"es":"A la ciudadanía espartana","en":"Spartan citizenship"},{"es":"Al palacio de Cnoso","en":"The palace of Knossos"}],"answer":0,"explain":{"es":"Olimpia era de todos los griegos, si bien lo administraba una sola polis, Élide, que controlaba la admisión, fijaba el reglamento y nombraba al personal.","en":"Olympia belonged to all Greeks, although a single polis, Elis, administered it, controlling admission, setting the rules and appointing the staff."}},{"text":{"es":"«Poda para poda… hétoimoi… ápite».","en":"'Poda para poda… hetoimoi… apite.'"},"question":{"es":"¿Qué recogen estas tres voces?","en":"What do these three calls record?"},"options":[{"es":"La salida de las carreras a pie en Olimpia","en":"The start of the foot races at Olympia"},{"es":"El juramento de los atletas ante la estatua de Zeus","en":"The athletes' oath before the statue of Zeus"},{"es":"La proclamación de la tregua","en":"The proclamation of the truce"},{"es":"El final del combate de pancracio","en":"The end of the pankration bout"}],"answer":0,"explain":{"es":"«Pie junto a pie», «¡listos!» y «¡partid!». En Olimpia la salida se daba de viva voz hasta el siglo IV a. C.","en":"'Foot by foot', 'ready!' and 'go!'. At Olympia the start was given by voice until the fourth century BC."}},{"text":{"es":"«Los atletas más bellos».","en":"'The most beautiful athletes.'"},"question":{"es":"¿A quiénes llamaba así Aristóteles?","en":"Whom did Aristotle call this?"},"options":[{"es":"A los pentatletas","en":"The pentathletes"},{"es":"A los pancratistas","en":"The pankratiasts"},{"es":"A los aurigas","en":"The charioteers"},{"es":"A los corredores de dólico","en":"The dolichos runners"}],"answer":0,"explain":{"es":"El pentatlón premiaba la versatilidad, puesto que había que dominar cinco pruebas muy distintas. Filóstrato los llamaba «los mejor proporcionados».","en":"The pentathlon rewarded versatility, since one had to master five very different events. Philostratus called them 'the best proportioned'."}},{"text":{"es":"«Nalgas blancas» y «nalgas oscuras».","en":"'White buttocks' and 'dark buttocks'."},"question":{"es":"¿Qué distinguían los griegos con estas expresiones coloquiales?","en":"What did the Greeks distinguish with these colloquial expressions?"},"options":[{"es":"A los cobardes y poco viriles frente a los valientes","en":"Cowards and the unmanly versus the brave"},{"es":"A los atletas de Esparta frente a los de Atenas y Corinto","en":"Athletes from Sparta versus those from Athens and Corinth"},{"es":"A los esclavos frente a los metecos","en":"Slaves versus metics"},{"es":"A los muchachos frente a los hombres","en":"Boys versus men"}],"answer":0,"explain":{"es":"Como se entrenaba desnudo y al sol, el moreno uniforme delataba a quien disponía de ocio. En la palestra el cuerpo decía a qué grupo pertenecía cada uno.","en":"Because training was done naked and in the sun, an even tan revealed who had leisure. In the palaestra the body told which group each man belonged to."}},{"text":{"es":"«Ato y encadeno los tendones, las partes del cuerpo, la mente y la inteligencia de los corredores para que no tengan fuerza […] y queden en último lugar».","en":"'I bind and chain the tendons, the limbs, the mind and the intelligence of the runners so that they have no strength […] and come last.'"},"question":{"es":"¿De dónde procede este texto?","en":"Where does this text come from?"},"options":[{"es":"De unas tablillas de plomo con maldiciones halladas en Nemea","en":"From lead curse tablets found at Nemea"},{"es":"De la inscripción grabada en la base de uno de los zanes de Olimpia","en":"From the inscription carved on the base of one of the Zanes at Olympia"},{"es":"De una oda de Píndaro","en":"From an ode by Pindar"},{"es":"Del reglamento de los helanódicas","en":"From the rules of the Hellanodikai"}],"answer":0,"explain":{"es":"Son del siglo III a. C. y aparecieron enrolladas y perforadas. Los atletas recurrían a la magia para hechizar a sus rivales antes de la prueba.","en":"They date from the third century BC and were found rolled up and pierced. Athletes resorted to magic to bewitch their rivals before the contest."}},{"text":{"es":"«Verbena, mercado, acróbatas, diversión, ladrones».","en":"'Fair, market, acrobats, fun, thieves.'"},"question":{"es":"¿Qué describía así un comediógrafo ateniense a comienzos del siglo III a. C.?","en":"What did an Athenian comic playwright describe in these words in the early third century BC?"},"options":[{"es":"El ambiente de Olimpia durante los Juegos","en":"The atmosphere at Olympia during the Games"},{"es":"El ágora de Atenas en plena mañana de mercado","en":"The Athenian agora on a busy market morning"},{"es":"El circo de Roma","en":"The circus of Rome"},{"es":"Las Panateneas","en":"The Panathenaia"}],"answer":0,"explain":{"es":"En época helenística los valores fundacionales se debilitaron y el festival ganó aire de espectáculo, un proceso que Roma aceleró.","en":"In the Hellenistic period the founding values weakened and the festival took on the air of a spectacle, a process that Rome accelerated."}}],"t3cards":[{"img":"img/t3/mapa_creta.jpg","caption":{"es":"Creta y sus principales palacios minoicos","en":"Crete and its main Minoan palaces"},"claim":{"es":"Creta tuvo varios palacios a la vez, como Cnoso, Festo o Malia.","en":"Crete had several palaces at the same time, such as Knossos, Phaistos and Malia."},"answer":true,"explain":{"es":"La geografía y el relieve fragmentados de la isla le dieron protección natural y propiciaron la convivencia de varios palacios. Es algo inusual en un territorio tan reducido.","en":"The fragmented geography and relief of the island gave it natural protection and allowed several palaces to coexist. This is unusual in such a small territory."}},{"img":"img/t3/cnoso_reconstruccion.jpg","caption":{"es":"Reconstrucción del palacio de Cnoso, hacia 1750-1450 a. C.","en":"Reconstruction of the palace of Knossos, c. 1750-1450 BC"},"claim":{"es":"Los palacios minoicos estaban rodeados de grandes murallas.","en":"The Minoan palaces were surrounded by great walls."},"answer":false,"explain":{"es":"Se organizaban en torno a un gran patio central y carecían de murallas. Esa ausencia llevó a Evans a imaginar una «Pax Minoica», hipótesis que hoy debe matizarse, puesto que las primeras armas del Egeo son cretenses.","en":"They were arranged around a large central court and had no walls. That absence led Evans to imagine a 'Pax Minoica', a hypothesis that must be qualified today, since the first weapons of the Aegean are Cretan."}},{"img":"img/t3/disco_festo.jpg","caption":{"es":"Disco de Festo, Museo Arqueológico de Heraclión","en":"Phaistos Disc, Heraklion Archaeological Museum"},"claim":{"es":"Las escrituras cretenses nos han dejado textos que describen el deporte minoico.","en":"The Cretan scripts have left us texts that describe Minoan sport."},"answer":false,"explain":{"es":"El jeroglífico cretense y el lineal A siguen sin descifrar, y el lineal B se empleó sobre todo para la contabilidad del palacio. Ninguna de las tres ha dejado un solo texto sobre deporte, de ahí que todo lo que sabemos proceda de imágenes.","en":"Cretan hieroglyphic and Linear A remain undeciphered, and Linear B was used mainly for palace accounting. None of the three has left a single text about sport, which is why everything we know comes from images."}},{"img":"img/t3/fresco_procesion.jpg","caption":{"es":"Fresco de la Procesión, Cnoso, hacia 1450-1350 a. C.","en":"Procession Fresco, Knossos, c. 1450-1350 BC"},"claim":{"es":"En Creta el palacio era también el centro religioso de la comunidad.","en":"In Crete the palace was also the religious centre of the community."},"answer":true,"explain":{"es":"Creta no levantó templos monumentales, de modo que el palacio reunía el culto, la residencia y el almacén en torno a un gran patio central.","en":"Crete built no monumental temples, so the palace brought together worship, residence and storage around a large central court."}},{"img":"img/t3/damas_azul.jpg","caption":{"es":"Damas de azul, palacio de Cnoso, hacia 1600-1450 a. C.","en":"Ladies in Blue, palace of Knossos, c. 1600-1450 BC"},"claim":{"es":"La pintura minoica pinta en blanco a la mujer y en rojo al varón.","en":"Minoan painting depicts women in white and men in red."},"answer":true,"explain":{"es":"Es una convención heredada de Egipto y el código más evidente para reconocer a las mujeres en los frescos.","en":"It is a convention inherited from Egypt and the most obvious code for recognising women in the frescoes."}},{"img":"img/t3/danza_arboleda.jpg","caption":{"es":"Danza en la arboleda sagrada, Cnoso, hacia 1600 a. C.","en":"Dance in the sacred grove, Knossos, c. 1600 BC"},"claim":{"es":"La danza de la arboleda sagrada muestra a mujeres que bailan ante una multitud.","en":"The dance in the sacred grove shows women dancing before a crowd."},"answer":true,"explain":{"es":"Los estudios vinculan este acto al culto a la naturaleza, concebida como divinidad femenina, y a los ritos de iniciación.","en":"Scholars link this act to the worship of nature, conceived as a female deity, and to initiation rites."}},{"img":"img/t3/pescador_akrotiri.jpg","caption":{"es":"Pescador de Akrotiri, Tera, anterior a hacia 1628 a. C.","en":"Fisherman of Akrotiri, Thera, before c. 1628 BC"},"claim":{"es":"El arte minoico representa cuerpos pesados y macizos, propios de la fuerza.","en":"Minoan art depicts heavy, massive bodies built for strength."},"answer":false,"explain":{"es":"Muestra figuras gráciles, estilizadas, de cintura estrecha y dinámicas, como este pescador. Esa visión sugiere que la élite cretense valoraba la agilidad, la destreza y la belleza del cuerpo en acción.","en":"It shows graceful, slender, narrow-waisted and dynamic figures, like this fisherman. That vision suggests that the Cretan elite valued agility, skill and the beauty of the body in action."}},{"img":"img/t3/ninos_pugiles_akrotiri.jpg","caption":{"es":"Fresco de los niños púgiles, Akrotiri, finales del siglo XVII a. C.","en":"Boxing Boys fresco, Akrotiri, late 17th century BC"},"claim":{"es":"Los niños púgiles de Akrotiri llevan un guante en cada mano.","en":"The boxing boys of Akrotiri wear a glove on each hand."},"answer":false,"explain":{"es":"Boxean con un solo guante en la mano derecha, con cinturón y taparrabos, y llevan la cabeza rapada salvo algunos mechones, el peinado de los muchachos de familia privilegiada.","en":"They box with a single glove on the right hand, with a belt and loincloth, and their heads are shaved except for a few locks, the hairstyle of boys from privileged families."}},{"img":"img/t3/ninos_pugiles_akrotiri.jpg","caption":{"es":"Fresco de los niños púgiles, Akrotiri, finales del siglo XVII a. C.","en":"Boxing Boys fresco, Akrotiri, late 17th century BC"},"claim":{"es":"El niño con collar, pulseras y pendientes se lee como el vencedor del combate.","en":"The boy wearing a necklace, bracelets and earrings is read as the winner of the bout."},"answer":true,"explain":{"es":"Su rival viste con sencillez. ¿Qué nos dice esa diferencia? Que el juego marcaba ya la jerarquía entre los hijos de la élite.","en":"His opponent is simply dressed. What does that difference tell us? That the game already marked the hierarchy among the children of the elite."}},{"img":"img/t3/riton_boxeadores.jpg","caption":{"es":"Ritón de los boxeadores, Hagia Triada, hacia 1550-1500 a. C.","en":"Boxer Rhyton, Hagia Triada, c. 1550-1500 BC"},"claim":{"es":"El ritón de Hagia Triada es un vaso de piedra para las libaciones decorado con escenas deportivas.","en":"The Hagia Triada rhyton is a stone vessel for libations decorated with sporting scenes."},"answer":true,"explain":{"es":"Mide unos 46 cm, servía para las ofrendas líquidas a los dioses y es el único vaso de su clase con escenas deportivas que se conserva casi entero.","en":"It is about 46 cm high, was used for liquid offerings to the gods and is the only vessel of its kind with sporting scenes that survives almost complete."}},{"img":"img/t3/riton_boxeadores_bandas.jpg","caption":{"es":"Desarrollo de las cuatro bandas del ritón de Hagia Triada","en":"The four registers of the Hagia Triada rhyton"},"claim":{"es":"Los púgiles del ritón son niños que aprenden a combatir.","en":"The boxers on the rhyton are children learning to fight."},"answer":false,"explain":{"es":"Son adultos, esbeltos pero musculados, con la melena del aristócrata minoico. Sus cascos, guantes, botas y vendajes cambian de una banda a otra, señal de un entrenamiento sistemático con reglas para cada modalidad.","en":"They are adults, slender but muscular, with the long hair of the Minoan aristocrat. Their helmets,
