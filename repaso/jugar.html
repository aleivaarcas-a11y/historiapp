<!DOCTYPE html>
<html lang="es">
<head>

<title>Del clan a la arena · Historiapp</title>

<style>
@font-face{font-family:Carlito;src:url(../fonts/Carlito-Regular.woff2) format("woff2");font-weight:400}
@font-face{font-family:Carlito;src:url(../fonts/Carlito-Bold.woff2) format("woff2");font-weight:700}
:root{--bg:#07102a;--azul:#004379;--oro:#EDAB00;--oro2:#FBC93D;--txt:#f4f1e8;--mut:#9fb0cf;--card:rgba(255,255,255,.07);--line:rgba(237,171,0,.35)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:radial-gradient(ellipse at 50% -10%,#1b3a7a 0%,#0d1f4a 40%,var(--bg) 80%) fixed;color:var(--txt);font-family:Calibri,Carlito,"Segoe UI",sans-serif;font-size:17px;line-height:1.35}
.cz{font-family:Cinzel,Georgia,serif;letter-spacing:.03em}
#hud{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:10px 14px calc(10px);padding-top:max(10px,env(safe-area-inset-top));background:rgba(4,10,28,.85);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
#hud .r{font-size:13px;color:var(--oro);font-weight:700;max-width:58%}
#hud .r small{display:block;color:var(--mut);font-weight:400;font-size:12px}
#hud .s{font-family:Cinzel,serif;font-weight:900;font-size:22px;color:var(--oro2);text-align:right}
#hud .s small{display:block;font-family:Calibri,Carlito,sans-serif;font-size:11px;color:var(--mut);font-weight:400}
#tbar{height:6px;background:rgba(255,255,255,.08)}
#tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--oro),var(--oro2));transition:width 1s linear}
#tbar.low i{background:#fff;animation:blink .5s infinite}
@keyframes blink{50%{opacity:.4}}
main{padding:16px 14px 110px;max-width:640px;margin:0 auto}
h1{font-size:34px;color:var(--oro);text-align:center;line-height:1.1;margin:8px 0}
h2{font-size:24px;text-align:center;color:var(--oro);margin:6px 0 10px}
.k{color:var(--mut);text-transform:uppercase;letter-spacing:.2em;font-size:12px;text-align:center}
.lead{text-align:center;margin:10px 0;color:#e8e1cf}
.q{font-size:20px;font-weight:700;margin:6px 0 14px;text-align:center}
.opt{width:100%;display:flex;gap:12px;align-items:center;text-align:left;font:inherit;color:var(--txt);background:var(--card);border:2px solid rgba(255,255,255,.14);border-radius:14px;padding:12px;margin-bottom:10px;min-height:58px;transition:all .25s}
.opt:active{transform:scale(.98)}
.opt .l{flex:none;width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:Cinzel,serif;font-weight:900;color:#06122b}
.l0{background:#EDAB00}.l1{background:#5aa3e6}.l2{background:#f2efe6}.l3{background:#b49ae8}.l4{background:#7fd3e0}
.opt.ok{border-color:var(--oro);background:rgba(237,171,0,.22)}
.opt.ok:after{content:"✔";margin-left:auto;color:var(--oro);font-size:22px}
.opt.bad{border-color:#fff;border-style:dashed;opacity:.8}
.opt.bad:after{content:"✘";margin-left:auto;font-size:20px}
.opt.dim{opacity:.35}
.opt[disabled]{pointer-events:none}
.tf{display:flex;gap:12px;margin:14px 0}
.tf .opt{justify-content:center;font-family:Cinzel,serif;font-weight:900;font-size:20px;min-height:70px}
.ex{margin-top:12px;background:rgba(0,67,121,.4);border-left:5px solid var(--oro);border-radius:8px;padding:12px;font-size:16px}
.fb{font-family:Cinzel,serif;font-weight:900;font-size:22px;text-align:center;margin:10px 0 4px;animation:pop .45s}
.fb.ok{color:var(--oro2)}.fb.no{color:#fff}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.rise{animation:rise .45s both}
.btn{display:block;width:100%;font-family:Cinzel,serif;font-weight:900;font-size:20px;padding:15px;border-radius:14px;border:none;background:var(--oro);color:#1a1200;margin-top:14px;box-shadow:0 6px 24px rgba(237,171,0,.35)}
.btn.sec{background:transparent;color:var(--oro);border:2px solid var(--oro);box-shadow:none}
.foot{position:fixed;left:0;right:0;bottom:0;padding:10px 14px max(12px,env(safe-area-inset-bottom));background:linear-gradient(0deg,rgba(4,10,28,.98),rgba(4,10,28,.7));z-index:6}
.foot .btn{margin:0 auto;max-width:640px}
.dig{position:relative;border-radius:12px;overflow:hidden;border:2px solid var(--line);background:#000;margin-bottom:10px}
.dig img{display:block;width:100%;max-height:38vh;object-fit:contain}
.grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(4,1fr)}
.tile{background:linear-gradient(135deg,#6b4f2a,#8a6a3a 40%,#5a4122);border:1px solid rgba(0,0,0,.35);box-shadow:inset 0 0 10px rgba(0,0,0,.45);transition:opacity .45s,transform .45s}
.tile.off{opacity:0;transform:scale(.5) rotate(10deg)}
.val{text-align:center;font-family:Cinzel,serif;font-weight:900;color:var(--oro2);font-size:26px}
.val small{font-family:Calibri,Carlito,sans-serif;color:var(--mut);font-size:12px;font-weight:400;margin-left:6px}
.flash img{width:100%;max-height:40vh;object-fit:contain;border-radius:12px;border:2px solid var(--line);transition:filter .7s;background:#000}
.flash.hide img{filter:blur(18px) brightness(.3)}
.cap{text-align:center;color:var(--oro2);font-weight:700;margin:6px 0}
.track{position:relative;height:46px;margin:6px 0 14px;border-radius:10px;background:linear-gradient(90deg,rgba(194,160,96,.12),rgba(194,160,96,.28));border:1px solid var(--line)}
.track .m{position:absolute;top:6px;bottom:6px;width:2px;background:rgba(237,171,0,.55)}
.track .tok{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:30px;transition:left 1s cubic-bezier(.3,1.4,.5,1)}
.track .meta{position:absolute;right:0;top:0;bottom:0;width:7px;background:repeating-linear-gradient(0deg,#fff 0 7px,#000 7px 14px)}
.lives{text-align:center;font-size:26px;letter-spacing:6px;margin:4px 0 8px}
.ord .opt .n{margin-left:auto;font-family:Cinzel,serif;font-weight:900;font-size:20px;color:var(--oro2);min-width:24px;text-align:right}
.ord .opt.sel{border-color:var(--oro)}
.date{margin-left:auto;color:var(--oro2);font-weight:700;white-space:nowrap;padding-left:8px;font-size:14px}
.tag{font-size:11px;background:var(--azul);border-radius:5px;padding:1px 6px;margin-left:6px;white-space:nowrap}
.quote{font-style:italic;color:#f5e9c8;text-align:center;font-size:18px;margin:6px 0 12px}
.big{font-family:Cinzel,serif;font-weight:900;font-size:64px;color:var(--oro2);text-align:center;line-height:1;margin:12px 0 4px;animation:pop .7s}
.people{text-align:center;font-size:44px;margin:12px 0;letter-spacing:4px}
.rule{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:15px}
.rule b{color:var(--oro2);font-family:Cinzel,serif}
.pass{background:var(--azul);border:2px solid var(--oro);border-radius:14px;padding:12px;text-align:center;font-weight:700;margin:12px 0}
.brk{display:flex;justify-content:space-between;padding:8px 2px;border-bottom:1px solid rgba(255,255,255,.1)}
.brk b{color:var(--oro2);font-family:Cinzel,serif}
input.nm{width:100%;font:inherit;font-size:18px;padding:12px;border-radius:12px;border:2px solid var(--line);background:rgba(0,0,0,.3);color:var(--txt);margin-top:10px;text-align:center}
.lock{text-align:center;padding-top:18vh}
.lock .e{font-size:64px}
.wd{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:10px 0}.lt{width:26px;height:36px;border-bottom:3px solid var(--oro);display:inline-flex;align-items:center;justify-content:center;font-family:Cinzel,serif;font-weight:900;font-size:22px;color:var(--oro2)}.lt.on{animation:pop .4s}
canvas#conf{position:fixed;inset:0;pointer-events:none;z-index:30}
.streak{display:inline-block;background:var(--oro);color:#1a1200;border-radius:20px;padding:1px 9px;font-weight:700;font-size:13px;animation:pop .4s}
</style>
</head>

<div id="tbar" style="display:none"><i id="ti"></i></div>
<main id="m"></main>

<script>
/* Clase de repaso en el aula. Solo se abre en la franja de la clase del grupo indicado. */
const CLASE={grupo:"1.º A",ini:"2026-11-12T16:15:00+01:00",fin:"2026-11-12T18:35:00+01:00"};
const D={"t1cards":[{"img":"img/t1/cartel_amsterdam_1928.jpg","caption":{"es":"Cartel de los JJ. OO. de Ámsterdam, 1928","en":"Poster of the Amsterdam Olympic Games, 1928"},"claim":{"es":"En estos Juegos se disputó por primera vez el 800 m lisos femenino.","en":"These Games saw the first ever women's 800 m race."},"answer":true,"explain":{"es":"Ámsterdam 1928 acogió la primera final olímpica de 800 m femeninos. Todas las atletas terminaron y se batió el récord mundial, si bien las crónicas sobre desmayos sirvieron para vetar las pruebas femeninas de más de 200 m hasta Roma 1960.","en":"Amsterdam 1928 hosted the first Olympic women's 800 m final. Every athlete finished and a world record was set, although press stories about fainting were used to ban women's events over 200 m until Rome 1960."}},{"img":"img/t1/switzer_boston_1967.jpg","caption":{"es":"Maratón de Boston, 1967","en":"Boston Marathon, 1967"},"claim":{"es":"La corredora de la imagen fue la primera mujer en terminar el maratón de Boston.","en":"The runner in the picture was the first woman to finish the Boston Marathon."},"answer":false,"explain":{"es":"Es Kathrine Switzer, que corrió con dorsal en 1967 y fue famosa porque un organizador intentó expulsarla de la carrera. Bobbi Gibb ya lo había terminado en 1966, escondida entre unos arbustos hasta la salida.","en":"This is Kathrine Switzer, who ran with a bib in 1967 and became famous when an official tried to drag her off the course. Bobbi Gibb had already finished it in 1966, having hidden in the bushes before the start."}},{"img":"img/t1/dita_pekin_2008.jpg","caption":{"es":"Maratón olímpico, Pekín 2008","en":"Olympic marathon, Beijing 2008"},"claim":{"es":"Esta atleta ganó el maratón olímpico con 38 años.","en":"This athlete won the Olympic marathon at the age of 38."},"answer":true,"explain":{"es":"Constantina Dita-Tomescu venció en Pekín con 2 h 26 min. Comparado con las 4 h 20 min de Switzer en 1967, el dato muestra cuánto cambió el maratón femenino en cuatro décadas.","en":"Constantina Dita-Tomescu won in Beijing in 2 h 26 min. Compared with Switzer's 4 h 20 min in 1967, the figure shows how much women's marathon running changed in four decades."}},{"img":"img/t1/report_amsterdam_1928.jpg","caption":{"es":"Informe oficial de los JJ. OO. de 1928","en":"Official Report of the 1928 Olympic Games"},"claim":{"es":"Este informe es una fuente indirecta.","en":"This report is an indirect source."},"answer":false,"explain":{"es":"Es una fuente directa, porque fue producida por el propio Comité con la intención de registrar lo sucedido. Por su temporalidad es además una fuente primaria.","en":"It is a direct source, since the Committee produced it with the intention of recording what happened. In terms of timing it is also a primary source."}},{"img":"img/t1/tumba_augures.jpg","caption":{"es":"Tumba de los Augures, Tarquinia, h. 530-520 a. C.","en":"Tomb of the Augurs, Tarquinia, c. 530-520 BC"},"claim":{"es":"Esta pintura etrusca es un ejemplo de fuente indirecta.","en":"This Etruscan painting is an example of an indirect source."},"answer":true,"explain":{"es":"La pintura funeraria no se hizo para registrar la historia, de modo que el historiador tiene que interpretarla. Muestra a un hombre corriendo o bailando en la necrópolis de Monterozzi.","en":"The tomb painting was not made to record history, so the historian has to interpret it. It shows a man running or dancing, in the Monterozzi necropolis."}},{"img":"img/t1/jirafa_rekhmire.jpg","caption":{"es":"Tumba de Rekhmire, Egipto, h. 1500 a. C.","en":"Tomb of Rekhmire, Egypt, c. 1500 BC"},"claim":{"es":"Esta pintura egipcia es una fuente secundaria.","en":"This Egyptian painting is a secondary source."},"answer":false,"explain":{"es":"Fue producida por la propia sociedad estudiada, de modo que es una fuente primaria. Según su intención es indirecta, porque no se pintó para registrar la historia.","en":"It was produced by the society under study, so it is a primary source. By intention it is indirect, because it was not painted to record history."}},{"img":"img/t1/libro_juegos_alfonso_x.jpg","caption":{"es":"Libro de los Juegos de Alfonso X, 1283","en":"Book of Games of Alfonso X, 1283"},"claim":{"es":"Es una fuente primaria para el estudio de los juegos medievales.","en":"It is a primary source for the study of medieval games."},"answer":true,"explain":{"es":"El manuscrito fue elaborado en la Castilla del siglo XIII, la misma sociedad que describe. Por eso es primaria, frente a un libro actual sobre el mismo tema, que sería secundaria.","en":"The manuscript was made in thirteenth-century Castile, the same society it describes. That makes it primary, unlike a present-day book on the same topic, which would be secondary."}},{"img":"img/t1/salvador_deporte_occidente.jpg","caption":{"es":"Salvador, J. L. (2004). El deporte en Occidente","en":"Salvador, J. L. (2004). El deporte en Occidente"},"claim":{"es":"Este libro es una fuente primaria.","en":"This book is a primary source."},"answer":false,"explain":{"es":"Se escribió en 2004 sobre épocas muy anteriores, por lo que es una fuente secundaria. Procede de la tesis doctoral de José Luis Salvador y es uno de los compendios más completos en castellano.","en":"It was written in 2004 about much earlier periods, so it is a secondary source. It grew out of José Luis Salvador's doctoral thesis and is one of the most complete surveys in Spanish."}},{"img":"img/t1/tablilla_sumeria.jpg","caption":{"es":"Tablilla sumeria con escritura cuneiforme","en":"Sumerian tablet with cuneiform writing"},"claim":{"es":"La aparición de la escritura marca el paso de la Prehistoria a la Historia.","en":"The appearance of writing marks the passage from Prehistory to History."},"answer":true,"explain":{"es":"La escritura surge en Sumeria a finales del IV milenio a. C. A partir de ahí se abren los cuatro grandes periodos: Edad Antigua, Media, Moderna y Contemporánea.","en":"Writing appears in Sumer at the end of the fourth millennium BC. From then on the four great periods begin: Ancient, Medieval, Modern and Contemporary."}},{"img":"img/t1/moais.jpg","caption":{"es":"Moais, Isla de Pascua, entre 700 y 1600 d. C.","en":"Moai, Easter Island, between 700 and 1600 AD"},"claim":{"es":"La ciencia auxiliar que estudia estos restos es la numismática.","en":"The auxiliary science that studies these remains is numismatics."},"answer":false,"explain":{"es":"Es la arqueología, que investiga las culturas pasadas a través de restos materiales. La numismática estudia monedas y medallas, como el real de a ocho que aparece en la misma diapositiva.","en":"It is archaeology, which investigates past cultures through material remains. Numismatics studies coins and medals, such as the Spanish piece of eight shown on the same slide."}},{"img":"img/t1/moai_excavado.jpg","caption":{"es":"Moai excavado, Isla de Pascua","en":"Excavated moai, Easter Island"},"claim":{"es":"La epigrafía es la ciencia que trabaja con este tipo de restos materiales.","en":"Epigraphy is the science that works with this kind of material remains."},"answer":false,"explain":{"es":"La epigrafía estudia inscripciones sobre materiales duraderos. Las estatuas, edificaciones y artefactos son campo de la arqueología.","en":"Epigraphy studies inscriptions on durable materials. Statues, buildings and artefacts belong to archaeology."}},{"img":"img/t1/homo_ludens.jpg","caption":{"es":"Huizinga, J. Homo ludens","en":"Huizinga, J. Homo ludens"},"claim":{"es":"Para Huizinga, el juego es anterior a la cultura.","en":"For Huizinga, play is older than culture."},"answer":true,"explain":{"es":"Huizinga sostiene que la sociedad nace jugando. El juego se desarrolla dentro de un círculo mágico, un recinto con reglas propias que fuera no valdrían.","en":"Huizinga holds that society is born through play. Play unfolds inside a magic circle, a space with its own rules that would not apply outside it."}},{"img":"img/t1/elias_dunning.jpg","caption":{"es":"Elias, N. y Dunning, E. Deporte y ocio en el proceso de la civilización","en":"Elias, N. & Dunning, E. Quest for Excitement"},"claim":{"es":"Para Elias y Dunning el impulso deportivo es un producto de la sociedad.","en":"For Elias and Dunning the sporting impulse is a product of society."},"answer":true,"explain":{"es":"Justo al revés que Huizinga. A medida que las sociedades europeas rebajaron su tolerancia a la violencia, el deporte se convirtió en un descontrol controlado de las emociones.","en":"The opposite of Huizinga. As European societies lowered their tolerance of violence, sport became a controlled de-controlling of emotions."}},{"img":"img/t1/guttmann_ritual_record.jpg","caption":{"es":"Guttmann, A. (1978). From Ritual to Record","en":"Guttmann, A. (1978). From Ritual to Record"},"claim":{"es":"En esta obra se proponen las tres culturas corporales.","en":"This book proposes the three body cultures."},"answer":false,"explain":{"es":"Guttmann propone los siete rasgos del deporte moderno: secularismo, igualdad, especialización, racionalización, burocratización, cuantificación y récord. Las tres culturas corporales son de Eichberg.","en":"Guttmann proposes the seven characteristics of modern sport: secularism, equality, specialisation, rationalisation, bureaucratisation, quantification and the record. The three body cultures belong to Eichberg."}},{"img":"img/t1/eichberg_body_cultures.jpg","caption":{"es":"Eichberg, H. (1998). Body Cultures","en":"Eichberg, H. (1998). Body Cultures"},"claim":{"es":"Eichberg sostiene que los siete rasgos de Guttmann describen bien la cultura del rendimiento y no ven las otras dos.","en":"Eichberg argues that Guttmann's seven characteristics describe achievement culture well and miss the other two."},"answer":true,"explain":{"es":"Las tres culturas corporales son rendimiento, disciplina y forma física, y fiesta popular. Las tres conviven en cualquier sociedad, y medir el pasado solo con los siete rasgos lo describe siempre por lo que le falta.","en":"The three body cultures are achievement, discipline and fitness, and popular festivity. All three coexist in any society, and measuring the past only with the seven characteristics always describes it by what it lacks."}},{"img":"img/t1/bipedestacion.jpg","caption":{"es":"Surgimiento de la bipedestación","en":"Emergence of bipedalism"},"claim":{"es":"La bipedestación se explica por una única causa adaptativa.","en":"Bipedalism is explained by a single adaptive cause."},"answer":false,"explain":{"es":"Fue un fenómeno multicausal en el que intervinieron varias ventajas adaptativas. Marca el inicio de la Humanidad.","en":"It was a multi-causal phenomenon in which several adaptive advantages played a part. It marks the beginning of humankind."}},{"img":"img/t1/danza_rupestre.jpg","caption":{"es":"Escena de danza en arte rupestre","en":"Dance scene in rock art"},"claim":{"es":"Diem y Popplow consideran la danza la primera expresión de la cultura física.","en":"Diem and Popplow regard dance as the first expression of physical culture."},"answer":true,"explain":{"es":"Es la teoría cultural (Alemania Occidental). Popplow distingue danzas de naturaleza erótica, mágica y guerrera, y sitúa el juego como subsuelo de todas ellas.","en":"This is the cultural theory (West Germany). Popplow distinguishes erotic, magical and warlike dances, and places play as the ground beneath all of them."}},{"img":"img/t1/piramide_maslow.jpg","caption":{"es":"Jerarquía de necesidades de Maslow","en":"Maslow's hierarchy of needs"},"claim":{"es":"Maslow dibujó esta pirámide en su artículo de 1943.","en":"Maslow drew this pyramid in his 1943 article."},"answer":false,"explain":{"es":"La jerarquía es de 1943, pero la representación piramidal se difundió con posterioridad. Sirve para ordenar las teorías sobre el origen del ejercicio, desde la supervivencia hasta lo lúdico.","en":"The hierarchy dates from 1943, but the pyramid diagram spread later. It helps to order the theories on the origin of exercise, from survival to play."}},{"img":"img/t1/blanchard_cheska.jpg","caption":{"es":"Blanchard, K. y Cheska, A. Antropología del deporte","en":"Blanchard, K. & Cheska, A. The Anthropology of Sport"},"claim":{"es":"Blanchard y Cheska aplicaron el método arqueológico al deporte primitivo.","en":"Blanchard and Cheska applied the archaeological method to primitive sport."},"answer":false,"explain":{"es":"Aplicaron el método antropológico: recopilaron en 1985 la información sobre pueblos sin escritura ni Estado para catalogar sus formas de deporte mediante analogía etnográfica.","en":"They applied the anthropological method: in 1985 they gathered the information on peoples without writing or a state to catalogue their forms of sport through ethnographic analogy."}},{"img":"img/t1/inuit_caza_foca.jpg","caption":{"es":"Caza tradicional inuit","en":"Traditional Inuit hunting"},"claim":{"es":"La analogía etnográfica informa de cómo vivía exactamente el hombre prehistórico.","en":"Ethnographic analogy tells us exactly how prehistoric humans lived."},"answer":false,"explain":{"es":"Informa de qué funciones puede desempeñar la actividad física en sociedades sin escritura ni Estado. De ahí salen ejes como la identidad social o la preparación para la supervivencia.","en":"It tells us what functions physical activity can perform in societies without writing or a state. From that come axes such as social identity or preparation for survival."}},{"img":"img/t1/inuit_arco.jpg","caption":{"es":"Arquero inuit","en":"Inuit archer"},"claim":{"es":"Los Juegos Esquimales son un caso de estudio del método antropológico.","en":"The Eskimo Games are a case study of the anthropological method."},"answer":true,"explain":{"es":"Los World Eskimo-Indian Olympics conservan pruebas ligadas a la supervivencia y a las tradiciones culturales, y permiten observar en vivo funciones que el registro arqueológico no muestra.","en":"The World Eskimo-Indian Olympics preserve events linked to survival and cultural tradition, and let us observe functions that the archaeological record does not show."}},{"img":"img/t1/bisonte_hueso.jpg","caption":{"es":"Bisonte tallado en hueso, Rusia, 22.000 a. C.","en":"Bison carved in bone, Russia, 22,000 BC"},"claim":{"es":"Se sabe con certeza que este objeto era un juguete.","en":"We know for certain that this object was a toy."},"answer":false,"explain":{"es":"Podría ser un juguete o un objeto votivo o mágico. El registro arqueológico prehistórico es escaso y los materiales admiten interpretaciones distintas según el historiador.","en":"It could be a toy or a votive or magical object. The prehistoric archaeological record is scarce and the materials allow different interpretations depending on the historian."}},{"img":"img/t1/canicas_orcadas.jpg","caption":{"es":"Bolas de piedra, Islas Orcadas","en":"Carved stone balls, Orkney"},"claim":{"es":"Estas bolas son del Paleolítico.","en":"These balls date from the Palaeolithic."},"answer":false,"explain":{"es":"Son del Neolítico tardío, hacia 3200-2500 a. C. Aparecen por toda Escocia y se han interpretado como canicas, proyectiles o representaciones de cuerpos celestes.","en":"They are Late Neolithic, c. 3200-2500 BC. They appear all over Scotland and have been read as marbles, projectiles or representations of celestial bodies."}},{"img":"img/t1/cueva_arana_miel.jpg","caption":{"es":"Cueva de la Araña, Bicorp (Valencia)","en":"Cueva de la Araña, Bicorp (Valencia)"},"claim":{"es":"La escena representa la recolección de miel.","en":"The scene shows honey gathering."},"answer":true,"explain":{"es":"Es arte rupestre levantino, con una cronología discutida, posiblemente entre el 10.000 y el 5.000 a. C. Muestra el rastro que dejó el trabajo del cuerpo.","en":"It is Levantine rock art, with a disputed chronology, possibly between 10,000 and 5,000 BC. It shows the trace left by the working body."}},{"img":"img/t1/barranco_gomez_miel.jpg","caption":{"es":"Abrigo del Barranco Gómez","en":"Barranco Gómez rock shelter"},"claim":{"es":"Este abrigo está en la provincia de Castellón.","en":"This rock shelter is in the province of Castellón."},"answer":false,"explain":{"es":"Está en Castellote (Teruel). Representa también una recolección de miel, dentro del arte rupestre levantino.","en":"It is in Castellote (Teruel). It also depicts honey gathering, within Levantine rock art."}},{"img":"img/t1/bumeran_oblazowa.jpg","caption":{"es":"Cueva de Obłazowa, Polonia","en":"Obłazowa Cave, Poland"},"claim":{"es":"Es el bumerán más antiguo conocido y está tallado en marfil de mamut.","en":"It is the oldest known boomerang and is carved from mammoth ivory."},"answer":true,"explain":{"es":"La pieza no pudo datarse directamente, de modo que se fechó el nivel en el que apareció, entre 40.300 y 37.300 a. C. (Talamo et al., 2025).","en":"The piece could not be dated directly, so the layer in which it appeared was dated, between 40,300 and 37,300 BC (Talamo et al., 2025)."}},{"img":"img/t1/valltorta_caza.jpg","caption":{"es":"Barranco de la Valltorta (Castellón)","en":"Valltorta gorge (Castellón)"},"claim":{"es":"Esta escena de caza pertenece al arte paleolítico franco-cantábrico.","en":"This hunting scene belongs to Franco-Cantabrian Palaeolithic art."},"answer":false,"explain":{"es":"Es arte rupestre levantino, con figuras humanas en movimiento y cronología discutida, posiblemente entre el 10.000 y el 5.000 a. C.","en":"It is Levantine rock art, with human figures in motion and a disputed chronology, possibly between 10,000 and 5,000 BC."}},{"img":"img/t1/cometa_desierto_1.jpg","caption":{"es":"Cometa del desierto, vista aérea","en":"Desert kite, aerial view"},"claim":{"es":"Las cometas del desierto eran estructuras defensivas frente a invasores.","en":"Desert kites were defensive structures against invaders."},"answer":false,"explain":{"es":"Son trampas de caza: dos muros largos convergentes que funcionan como un embudo para conducir a los animales a un recinto o foso.","en":"They are hunting traps: two long converging walls acting as a funnel to drive animals into an enclosure or pit."}},{"img":"img/t1/cometa_desierto_2.jpg","caption":{"es":"Cometas del desierto, IX-VIII milenio a. C.","en":"Desert kites, 9th-8th millennium BC"},"claim":{"es":"Hay más de 6.000 cometas catalogadas desde Arabia hasta Asia Central.","en":"More than 6,000 kites have been catalogued from Arabia to Central Asia."},"answer":true,"explain":{"es":"Su uso se extendió durante milenios. Las evidencias más antiguas de uso proceden del sureste de Jordania (Tarawneh et al., 2026).","en":"Their use lasted for millennia. The earliest evidence of use comes from south-eastern Jordan (Tarawneh et al., 2026)."}},{"img":"img/t1/femures_ruff.jpg","caption":{"es":"Huesos largos analizados por Ruff et al. (2015)","en":"Long bones analysed by Ruff et al. (2015)"},"claim":{"es":"La resistencia del fémur y la tibia cae a partir del Neolítico y deja de cambiar en época romana.","en":"Femur and tibia strength falls from the Neolithic onwards and stops changing in Roman times."},"answer":true,"explain":{"es":"El estudio de 1.842 esqueletos europeos muestra una caída que arranca entre el 5000 y el 2000 a. C. y se detiene en la Edad del Hierro y época romana, ligada a la adopción de la agricultura.","en":"The study of 1,842 European skeletons shows a decline starting between 5000 and 2000 BC and stopping in the Iron Age and Roman period, linked to the adoption of farming."}},{"img":"img/t1/mujer_neolitica_molino.jpg","caption":{"es":"Mujer neolítica moliendo grano","en":"Neolithic woman grinding grain"},"claim":{"es":"Las mujeres del Neolítico tenían húmeros más resistentes que las remeras de élite actuales.","en":"Neolithic women had stronger humeri than today's elite rowers."},"answer":true,"explain":{"es":"Macintosh et al. (2017) hallaron húmeros entre un 11 y un 16 % más resistentes que los de las remeras de Cambridge, que entrenaban dos veces al día.","en":"Macintosh et al. (2017) found humeri 11 to 16 % stronger than those of Cambridge rowers who trained twice a day."}},{"img":"img/t1/molino_de_mano.jpg","caption":{"es":"Molino de mano neolítico","en":"Neolithic hand mill"},"claim":{"es":"Este útil se asocia al trabajo manual femenino que explica la fuerza de los brazos en el Neolítico.","en":"This tool is linked to the female manual labour that explains arm strength in the Neolithic."},"answer":true,"explain":{"es":"Moler grano a mano durante horas es una de las tareas que Macintosh et al. relacionan con la rigidez del húmero en las mujeres agricultoras centroeuropeas.","en":"Grinding grain by hand for hours is one of the tasks Macintosh et al. link to humeral rigidity in Central European farming women."}},{"img":"img/t1/barranco_gomez_detalle.jpg","caption":{"es":"Recolección de miel. Abrigo del Barranco Gómez (Castellote, Teruel)","en":"Honey gathering. Barranco Gómez rock shelter (Castellote, Teruel)"},"claim":{"es":"Esta escena de arte rupestre levantino tiene una datación exacta y segura.","en":"This Levantine rock-art scene has an exact and secure date."},"answer":false,"explain":{"es":"Su cronología sigue discutida, posiblemente entre el 10.000 y el 5.000 a. C., igual que la del panel de la Cueva de la Araña, que muestra la misma actividad de subsistencia.","en":"Its chronology is still debated, possibly between 10,000 and 5,000 BC, like that of the Cueva de la Araña panel, which shows the same subsistence activity."}},{"img":"img/t1/bumeran_foto.jpg","caption":{"es":"Bumerán de marfil de mamut. Cueva de Obłazowa (Polonia)","en":"Mammoth-ivory boomerang. Obłazowa Cave (Poland)"},"claim":{"es":"La fecha de 40.300-37.300 a. C. se obtuvo datando directamente el bumerán.","en":"The date of 40,300-37,300 BC was obtained by dating the boomerang itself."},"answer":false,"explain":{"es":"La pieza no pudo datarse de forma directa, de modo que la fecha corresponde al estrato arqueológico en que apareció (Talamo et al., 2025). Aun así, es el bumerán más antiguo que se conoce.","en":"The piece could not be dated directly, so the date belongs to the archaeological layer in which it was found (Talamo et al., 2025). Even so, it is the oldest known boomerang."}},{"img":"img/t1/moai_ladera.jpg","caption":{"es":"Moái de la Isla de Pascua excavado hasta la base","en":"Easter Island moai excavated down to its base"},"claim":{"es":"Una estatua como esta es objeto de estudio de la arqueología, una de las ciencias auxiliares de la Historia.","en":"A statue like this is studied by archaeology, one of the auxiliary sciences of History."},"answer":true,"explain":{"es":"La arqueología interroga los restos materiales de sociedades que no dejaron textos sobre sí mismas y, junto a la numismática, la paleografía o la epigrafía, forma parte de las ciencias auxiliares de la Historia.","en":"Archaeology questions the material remains of societies that left no texts about themselves and, together with numismatics, palaeography and epigraphy, is one of the auxiliary sciences of History."}},{"img":"img/t1/report_800m_ganadoras.jpg","caption":{"es":"Report oficial de Ámsterdam 1928. Ganadoras de los 800 m","en":"Official report of Amsterdam 1928. Winners of the 800 m"},"claim":{"es":"La ganadora, Lina Radke, batió el récord del mundo.","en":"The winner, Lina Radke, set a world record."},"answer":true,"explain":{"es":"Las nueve atletas que tomaron la salida terminaron la carrera y Radke batió el récord mundial (Robinson, 2018). El desplome que repitieron durante décadas los manuales lo inventó la prensa de la época.","en":"All nine athletes who started finished the race and Radke set a world record (Robinson, 2018). The collapse repeated for decades in textbooks was invented by the press of the time."}},{"img":"img/t1/report_800m_resultados.jpg","caption":{"es":"Report oficial de Ámsterdam 1928. Resultados de la final de 800 m","en":"Official report of Amsterdam 1928. Results of the 800 m final"},"claim":{"es":"Varias corredoras abandonaron la final exhaustas antes de llegar a la meta.","en":"Several runners dropped out of the final exhausted before reaching the line."},"answer":false,"explain":{"es":"Nueve atletas tomaron la salida y las nueve terminaron. El bulo del desplome, difundido por cronistas como John Tunis, sirvió al COI para vetar las pruebas femeninas de más de 200 m hasta Roma 1960.","en":"Nine athletes started and all nine finished. The collapse hoax, spread by reporters such as John Tunis, was used by the IOC to ban women's events over 200 m until Rome 1960."}},{"img":"img/t1/utiles_pesca.jpg","caption":{"es":"Útiles de pesca prehistóricos. Nasa, arpones y anzuelos","en":"Prehistoric fishing tools. Fish trap, harpoons and hooks"},"claim":{"es":"Está demostrado que en la Prehistoria la caza era cosa de hombres y la pesca, del grupo entero.","en":"It is proven that in Prehistory hunting was for men and fishing for the whole group."},"answer":false,"explain":{"es":"Esa división se dio por supuesta durante décadas, pero no está probada para ninguna de las dos actividades. La investigación reciente documenta muchas más mujeres cazadoras de lo que suponía el modelo del «hombre cazador» (Anderson et al., 2023; Haas et al., 2020).","en":"That division was taken for granted for decades, but it is not proven for either activity. Recent research documents far more women hunters than the “man the hunter” model assumed (Anderson et al., 2023; Haas et al., 2020)."}},{"img":"img/t1/valltorta_calco.jpg","caption":{"es":"Uso del propulsor para lanzar la azagaya","en":"Using a spear-thrower to launch a dart"},"claim":{"es":"El propulsor y la azagaya forman parte de los útiles de caza prehistóricos.","en":"The spear-thrower and dart are among the prehistoric hunting tools."},"answer":true,"explain":{"es":"Junto al arco y la flecha, la jabalina, la honda y el bumerán, y a estrategias como la persecución, el acecho o la emboscada, sitúan en la Prehistoria un adiestramiento corporal ligado a la supervivencia.","en":"Together with the bow and arrow, the javelin, the sling and the boomerang, and strategies such as pursuit, stalking and ambush, they place in Prehistory a bodily training linked to survival."}},{"img":"img/t1/metodo_cientifico.jpg","caption":{"es":"El método científico aplicado a la Historia","en":"The scientific method applied to History"},"claim":{"es":"Para Carr, el método histórico consiste sobre todo en acumular datos verificados.","en":"For Carr, the historical method consists mainly of accumulating verified data."},"answer":false,"explain":{"es":"Carr lo resume en tres operaciones, conocer un hecho, interpretarlo dentro de una pregunta y elaborar con él una conclusión razonada (Carr, 1961/2010, p. 60), y corrige así a Ranke, que creía que los hechos hablan por sí solos.","en":"Carr sums it up in three operations, knowing a fact, interpreting it within a question and drawing a reasoned conclusion from it (Carr, 1961/2010, p. 60), thereby correcting Ranke, who believed that facts speak for themselves."}},{"img":"img/t1/revithi.jpg","caption":{"es":"Stamata Revithi, Atenas 1896","en":"Stamata Revithi, Athens 1896"},"claim":{"es":"Corrió el maratón olímpico y su tiempo quedó registrado de forma oficial.","en":"She ran the Olympic marathon and her time was officially recorded."},"answer":false,"explain":{"es":"Corrió casi todo el recorrido al día siguiente de la carrera masculina, pero no la dejaron entrar al estadio ni se registró su tiempo, de modo que quedó fuera del archivo oficial por decisión ajena.","en":"She ran almost the whole course the day after the men's race, but she was not allowed into the stadium and her time was not recorded, so she was left out of the official record by someone else's decision."}},{"img":"img/t1/greig.jpg","caption":{"es":"Dale Greig, 1964","en":"Dale Greig, 1964"},"claim":{"es":"Muchas organizaciones la consideran la primera mujer en completar un maratón con registro formal de tiempo.","en":"Many organisations regard her as the first woman to complete a marathon with a formally recorded time."},"answer":true,"explain":{"es":"Completó en 1964 el maratón de la Isla de Wight, en Inglaterra, en 3 h 27 min.","en":"In 1964 she completed the Isle of Wight marathon, in England, in 3 h 27 min."}},{"img":"img/t1/gibb.jpg","caption":{"es":"Bobbi Gibb, Boston 1966","en":"Bobbi Gibb, Boston 1966"},"claim":{"es":"Corrió el maratón de Boston con dorsal oficial.","en":"She ran the Boston Marathon with an official bib."},"answer":false,"explain":{"es":"La organización rechazó su inscripción alegando que las mujeres «no estaban fisiológicamente capacitadas» (Jutel, 2003). Corrió escondida entre los arbustos de la salida y sin dorsal, y terminó un año antes que Switzer.","en":"The organisers rejected her entry, claiming that women were “not physiologically able” (Jutel, 2003). She ran after hiding in the bushes at the start, without a bib, and finished a year before Switzer."}},{"img":"img/t1/documento_conservacion.jpg","caption":{"es":"Conservación de un documento antiguo","en":"Conservation of an old document"},"claim":{"es":"Una fuente primaria es la que elabora la propia sociedad que se investiga, en su propio tiempo.","en":"A primary source is one produced by the society under study, in its own time."},"answer":true,"explain":{"es":"La secundaria la interpreta después, a veces siglos más tarde. Este criterio atiende a la cercanía temporal, mientras que el de fuente directa o indirecta atiende a la intención de quien la produjo.","en":"A secondary source interprets it later, sometimes centuries afterwards. This criterion looks at closeness in time, whereas direct and indirect sources are distinguished by the intention of whoever produced them."}},{"img":"img/t1/libro_juegos_pagina.jpg","caption":{"es":"Libro de los juegos de Alfonso X el Sabio, 1283","en":"Alfonso X the Wise's Book of Games, 1283"},"claim":{"es":"Es una fuente secundaria sobre el ocio medieval.","en":"It is a secondary source on medieval leisure."},"answer":false,"explain":{"es":"Se terminó en Sevilla en 1283, en la misma época que documenta, así que es una fuente primaria. Es, además, el tratado europeo más antiguo dedicado al ajedrez.","en":"It was completed in Seville in 1283, in the very period it documents, so it is a primary source. It is also the oldest European treatise devoted to chess."}},{"img":"img/t1/prehistoria_historia.jpg","caption":{"es":"Prehistoria e Historia","en":"Prehistory and History"},"claim":{"es":"La periodización clásica toma la aparición de la escritura como frontera entre la Prehistoria y la Historia.","en":"Classical periodisation takes the appearance of writing as the boundary between Prehistory and History."},"answer":true,"explain":{"es":"Esa frontera se sitúa en Sumeria, a finales del IV milenio a. C., y es la que ilustra la tablilla sumeria con escritura cuneiforme.","en":"That boundary lies in Sumer, at the end of the 4th millennium BC, and it is illustrated by the Sumerian tablet with cuneiform writing."}},{"img":"img/t1/edades_historia.jpg","caption":{"es":"Las edades de la Historia","en":"The ages of History"},"claim":{"es":"Esta división en edades sirve igual para cualquier civilización del mundo.","en":"This division into ages works equally well for any civilisation in the world."},"answer":false,"explain":{"es":"Es una convención europea cómoda de manejar, aunque sus hitos pertenecen a la historia del Mediterráneo y dicen muy poco de sociedades que marchaban con su propio reloj, como China o la América precolombina.","en":"It is a convenient European convention, although its milestones belong to Mediterranean history and say very little about societies that kept their own time, such as China or pre-Columbian America."}},{"img":"img/t1/diacronico.jpg","caption":{"es":"Enfoque diacrónico","en":"Diachronic approach"},"claim":{"es":"El enfoque diacrónico congela un momento concreto y estudia sus conexiones internas.","en":"The diachronic approach freezes a particular moment and studies its internal connections."},"answer":false,"explain":{"es":"Eso es el enfoque sincrónico. El diacrónico sigue un fenómeno a lo largo del tiempo, por ejemplo cómo la lucha pasa del rito de iniciación al deporte reglado.","en":"That is the synchronic approach. The diachronic one follows a phenomenon over time, for example how wrestling moves from initiation rite to regulated sport."}},{"img":"img/t1/sincronico.jpg","caption":{"es":"Enfoque sincrónico","en":"Synchronic approach"},"claim":{"es":"Estudiar qué significaba el gimnasio en la Atenas del siglo V a. C. para su educación, su política y su religión es un análisis sincrónico.","en":"Studying what the gymnasium meant in 5th-century BC Athens for its education, politics and religion is a synchronic analysis."},"answer":true,"explain":{"es":"El enfoque sincrónico se detiene en un momento y analiza sus conexiones internas. Ninguna de las dos miradas basta por sí sola, y el historiador alterna entre ellas según lo que quiera comprender.","en":"The synchronic approach stops at one moment and analyses its internal connections. Neither view is enough on its own, and historians switch between them depending on what they want to understand."}},{"img":"img/t1/grabado_juego_pelota.jpg","caption":{"es":"Grabado antiguo de un juego de pelota con bate","en":"Old engraving of a bat-and-ball game"},"claim":{"es":"La historia de las actividades físicas estudia el deporte en sus relaciones con las culturas pasadas y contemporáneas.","en":"The history of physical activities studies sport in its relations with past and present cultures."},"answer":true,"explain":{"es":"Así la define la asignatura (Pérez y Verdes, 1998), de modo que el deporte se estudia como parte de la cultura de la sociedad que lo practica y no como una simple lista de hechos.","en":"That is how the course defines it (Pérez & Verdes, 1998), so sport is studied as part of the culture of the society that practises it and not as a mere list of events."}},{"img":"img/t1/rae_deporte.jpg","caption":{"es":"Definición de «deporte» en el Diccionario de la Real Academia Española","en":"Definition of “deporte” in the Spanish Royal Academy dictionary"},"claim":{"es":"El diccionario recoge también un sentido de deporte como recreación o pasatiempo, sin competición.","en":"The dictionary also records a sense of sport as recreation or pastime, without competition."},"answer":true,"explain":{"es":"La primera acepción habla de actividad física con competición, entrenamiento y normas, y la segunda, de recreación, pasatiempo o ejercicio al aire libre, la misma tensión que separa el enfoque cerrado del abierto.","en":"The first sense refers to physical activity with competition, training and rules, and the second to recreation, pastime or outdoor exercise, the same tension that separates the narrow and broad approaches."}},{"img":"img/t1/futbol_profesional.jpg","caption":{"es":"Partido de fútbol profesional","en":"Professional football match"},"claim":{"es":"Un partido profesional de fútbol encaja en el enfoque cerrado del deporte.","en":"A professional football match fits the narrow approach to sport."},"answer":true,"explain":{"es":"El enfoque cerrado entiende el deporte como actividad física reglada, competitiva e institucionalizada que busca el máximo rendimiento.","en":"The narrow approach understands sport as regulated, competitive and institutionalised physical activity that seeks maximum performance."}},{"img":"img/t1/ejercicio_mayores.jpg","caption":{"es":"Actividad física para personas mayores","en":"Physical activity for older adults"},"claim":{"es":"Para el enfoque cerrado, esta actividad es deporte.","en":"Under the narrow approach, this activity counts as sport."},"answer":false,"explain":{"es":"Solo cabe en el enfoque abierto de la Carta Europea del Deporte (Consejo de Europa, 1992), que incluye toda actividad, organizada o no, dirigida a la expresión o a la mejora física o psíquica.","en":"It only fits the broad approach of the European Sports Charter (Council of Europe, 1992), which includes any activity, organised or not, aimed at physical or mental expression or improvement."}},{"img":"img/t1/prehistoria_cuadro.jpg","caption":{"es":"Cuadro de las etapas de la Prehistoria","en":"Chart of the stages of Prehistory"},"claim":{"es":"La Prehistoria es la etapa más corta y mejor documentada de la historia humana.","en":"Prehistory is the shortest and best-documented stage of human history."},"answer":false,"explain":{"es":"Es, con enorme diferencia, la más larga y la peor documentada, porque carece de escritura y porque la madera, la fibra o la cuerda se conservan muy raramente (Kretchmar et al., 2017).","en":"It is by far the longest and the worst documented, because it has no writing and because wood, fibre and cord very rarely survive (Kretchmar et al., 2017)."}},{"img":"img/t1/caza_jabalina_rupestre.jpg","caption":{"es":"Escena de caza con lanza","en":"Hunting scene with a spear"},"claim":{"es":"Para Eichel, el lanzamiento de la jabalina está entre los ejercicios corporales más antiguos, de hace unos 70.000 años.","en":"For Eichel, javelin throwing is among the oldest bodily exercises, some 70,000 years old."},"answer":true,"explain":{"es":"Eichel sostiene que el ejercicio corporal nace del trabajo, de modo que al cazador le siguen el arpón del pescador y, hace unos 24.000 años, el arco (Betancor y Vilanou, 1995, p. 37).","en":"Eichel argues that bodily exercise arises from work, so the hunter is followed by the fisherman's harpoon and, some 24,000 years ago, by the bow (Betancor y Vilanou, 1995, p. 37)."}},{"img":"img/t1/mapa_inuit.jpg","caption":{"es":"Territorios inuit de América del Norte","en":"Inuit territories of North America"},"claim":{"es":"Los World Eskimo-Indian Olympics nacieron en 1961 para mantener vivas las prácticas corporales de estas comunidades.","en":"The World Eskimo-Indian Olympics were founded in 1961 to keep these communities' bodily practices alive."},"answer":true,"explain":{"es":"Los fundaron comunidades inuit de Alaska, Canadá y Groenlandia, con pruebas como la sogatira, la patada a un pie o la danza del tambor, frente a la homogeneización del deporte occidental (Kretchmar et al., 2017).","en":"They were founded by Inuit communities from Alaska, Canada and Greenland, with events such as tug-of-war, the one-foot high kick and the drum dance, in response to the homogenisation of Western sport (Kretchmar et al., 2017)."}},{"img":"img/t1/levantino_ciervos.jpg","caption":{"es":"Escena de caza de ciervos. Arte rupestre levantino","en":"Deer-hunting scene. Levantine rock art"},"claim":{"es":"Una escena pintada como esta es siempre un documento fiel de una actividad real.","en":"A painted scene like this is always a faithful record of a real activity."},"answer":false,"explain":{"es":"Hay que distinguir qué documenta una actividad real y qué es convención estilística o símbolo, y además su cronología es discutida, posiblemente entre el 10.000 y el 5.000 a. C.","en":"We must distinguish what records a real activity from what is stylistic convention or symbol, and its chronology is also debated, possibly between 10,000 and 5,000 BC."}}],"exam":[{"id":"I2-n01","tema":2,"pie":"Estatua de Amenofis II. 18ª dinastía, reinado de Amenofis II (1428-1397 a. C.). Museo Egipcio de Turín.","c2s":["La estatua documenta la importancia que la monarquía egipcia concedía al cuerpo del rey, que aquí se muestra fuerte y proporcionado.","De ahí el principio de victor perpetuus, según el cual el faraón vence siempre, compite solo, acumula marcas y manda registrarlas, hasta el punto de que en tres milenios no se conserva una sola referencia a una derrota real.","Esa destreza, mostrada en público, indicaba que el rey seguía en condiciones de proteger al pueblo frente a las amenazas humanas y divinas y de mantener el mundo tal y como los dioses lo entregaron."],"C3":["Que Amenofis II tuviera en realidad ese cuerpo, porque la estatua es una imagen oficial que reproduce el ideal del cuerpo regio, sin pretensión de retrato fiel.","Que el faraón compitiera contra otros atletas, ya que la pieza lo muestra solo y existía un tabú que le impedía medirse con iguales en condiciones inciertas.","Que los egipcios corrientes tuvieran prohibida la competición, puesto que el tabú afectaba solo al faraón y una estatua del rey nada dice de las prácticas del resto de la población."]},{"id":"I2-n02","tema":2,"pie":"Hatshepsut corriendo junto al toro Apis en el Heb-Sed. Capilla Roja, Karnak. 18ª dinastía, año 16 de su reinado (hacia 1464 a. C.).","c2s":["El relieve documenta la carrera del faraón en el Heb-Sed, la fiesta del jubileo más importante de Egipto, que servía para renovar el poder del rey y que se celebraba cumplidos los treinta años de reinado y después cada tres.","La carrera era de obligada realización y en ella el soberano, con faldellín, corona y cetro, cubría un recorrido de ida y vuelta que simbolizaba la unión de los dos reinos, a menudo acompañado del toro sagrado Apis.","Hatshepsut lo celebró en el año 16 de su reinado, con 40 años, y la escena muestra que una mujer que reinaba como faraón debía exhibir su fortaleza física del mismo modo que los gobernantes varones.","Un rey debilitado comprometía su papel de garante del orden del mundo, y el rito le devolvía a su estado de plenitud."],"C3":["Que Hatshepsut corriera de verdad la prueba ni a qué ritmo, ya que el relieve es una imagen oficial del rito que no registra marcas ni el desarrollo de la carrera.","Que las mujeres egipcias en general practicaran la carrera, puesto que la escena retrata a una reina que ejercía como faraón y la obligación derivaba de esa función regia.","Que el Heb-Sed se celebrara siempre a los treinta años de reinado, porque Hatshepsut lo adelantó al año 16 y los egiptólogos solo pueden explicar ese adelanto con una hipótesis (la suma de sus años como gran esposa real y regente)."]},{"id":"I2-n03","tema":2,"pie":"Caza de aves con bastón arrojadizo. Tumba tebana de Sheikh Abd el-Qurna, Tebas occidental (Luxor). 18ª dinastía. Hacia 1400 a. C.","c2s":["La pintura documenta la caza en las marismas, que combinaba la captura de aves con arco o bastón arrojadizo, la caza de mamíferos y el arponeo de peces.","En un principio estaba reservada a la realeza y, a partir del Imperio Antiguo, el privilegio se abrió a la corte y a la alta aristocracia, que cazaba en cotos privados acompañada de perros amaestrados.","Que en las tumbas de los nobles estas escenas se representen a mayor tamaño que cualquier otra actividad de su vida es el mejor indicio de la importancia que tuvieron.","La presencia de la esposa con sus mejores galas funciona, además, como imagen de fertilidad y resurrección, de manera que la jornada de caza era a la vez un momento de ocio y un acto que garantizaba la regeneración del difunto en el más allá."],"C3":["Que la escena reproduzca una jornada de caza tal y como ocurrió, dado que es una imagen funeraria con una función simbólica de regeneración del difunto.","Que la caza en las marismas fuera una práctica de toda la población egipcia, porque la tumba es de un noble y la actividad pasó de la realeza solo a la corte y a la alta aristocracia.","Que el noble dedicara a la caza más tiempo que a ninguna otra actividad, ya que el tamaño de la escena expresa la importancia que se le concedía y no mide el tiempo que ocupaba."]},{"id":"I2-n04","tema":2,"pie":"Esgrima de bastón (tahtib). Relieve de la tumba de Neferhotep (TT49), Tebas occidental. 18ª dinastía. Hacia 1330 a. C.","c2s":["El relieve documenta la esgrima con bastones o tahtib, una de las tres modalidades de combate practicadas en Egipto junto a la lucha cuerpo a cuerpo y el boxeo.","La escena muestra, por tanto, una práctica física que tenía cabida a la vez en el adiestramiento del soldado, en el ceremonial regio y en el culto."],"C3":["En cuál de los tres contextos (cuartel, ceremonia ante el rey o culto) se celebraba este combate, porque la escena aislada no muestra el lugar ni el público.","Cuáles eran las reglas o cómo se decidía el vencedor, ya que el relieve fija un solo instante del combate y ningún reglamento lo acompaña.","Que el tahtib fuera la modalidad de combate más practicada en Egipto, puesto que una sola escena no permite medir su frecuencia y la lucha es más abundante en el registro arqueológico."]},{"id":"I2-n05","tema":2,"pie":"Movimientos de lucha. Pinturas murales de la tumba de Baqet III (nº 15), Beni Hasan, Nomo del Antílope. Imperio Medio, dinastías XI-XII. Hacia 2000 a. C.","c2s":["La pintura documenta la lucha, uno de los deportes más abundantes del registro egipcio, en las tumbas de los príncipes de Beni Hasan, nomarcas del Nomo del Antílope, donde aparecen 219 parejas con un amplio repertorio de llaves.","Se aprecian proyecciones sobre el hombro, volteos de cadera, llaves de brazo, tirones, zancadillas y presas a las piernas, y en cambio no hay puñetazos, mordiscos ni luxaciones severas, con solo un 2 % de combate en el suelo.","Se competía desnudo salvo por un pequeño cinturón de tela y está documentada la presencia de árbitros, lo que habla de una práctica con técnica depurada y con límites conocidos por los luchadores.","Que los nomarcas mandaran pintar este repertorio en su tumba informa, además, de la élite provincial que encargó el registro."],"C3":["Cuál era el reglamento de los combates, porque la pintura muestra técnicas y posturas y las reglas exactas se desconocen.","Que la lucha fuera una práctica de todo el pueblo egipcio, ya que las pinturas se hicieron en tumbas de nomarcas y reflejan lo que esa élite quiso registrar.","Que el combate en el suelo fuera una parte habitual de la lucha egipcia, puesto que apenas el 2 % de las parejas aparece en esa posición y lo que prima es el derribo desde pie."]},{"id":"I2-n06","tema":2,"pie":"Calco del bloque de caliza con relieve SC/north/1994/04, procedente de la calzada de acceso a la pirámide de Sahure en Abusir. 5ª dinastía. Hacia 2490 a. C.","c2s":["El relieve documenta un programa de competiciones con cuatro modalidades distintas (tiro con arco, esgrima de bastón, lucha y una regata), organizado para las fiestas por la terminación del templo funerario y la pirámide del rey Sahure.","La competición del pueblo existía, por tanto, cuando el Estado la organizaba y en el momento que le convenía, esto es, al cerrar una obra.","Con ella aparecen de golpe varias pruebas, público, un motivo festivo y recompensas, cuatro elementos básicos para el desarrollo del deporte."],"C3":["Que los obreros egipcios compitieran con regularidad, puesto que el relieve recoge una fiesta concreta, organizada por el Estado con motivo de la inauguración de un monumento.","Que el rey Sahure tomara parte en las pruebas, porque el faraón no figura entre los atletas y, como mucho, asistía como espectador.","Cómo se desarrolló la regata y quién la ganó, dado que su registro está muy dañado y el relieve fija una sola escena de cada prueba."]},{"id":"I2-n07","tema":2,"pie":"Bailarinas y músicas en un banquete. Pintura mural de la capilla funeraria de Nebamun, Tebas occidental. 18ª dinastía. Hacia 1350 a. C. British Museum, Londres.","c2s":["Estas actividades artísticas tenían una marcada función de entretenimiento para las clases altas, aunque las realizaban miembros del pueblo llano.","Gracias a sus habilidades motrices, estas personas podían entrar en los cuerpos de danza, acrobacia, música o malabarismo de templos y palacios, lo que les daba una mejor dieta, hogar y seguridad para ellas y sus familias.","En una sociedad cerrada en la que, fuera de la escritura, apenas había otra vía de ascenso, el cuerpo se convertía así en un oficio y en un medio de promoción social."],"C3":["Que la danza fuera un pasatiempo de las mujeres de la élite, ya que las bailarinas eran profesionales del pueblo llano al servicio del entretenimiento de las clases altas.","Que todas las bailarinas lograran ascender socialmente, dado que la pintura muestra a dos figuras en un banquete y nada dice de su condición ni de su trayectoria.","Que el banquete se celebrara tal y como aparece, porque la escena procede de una capilla funeraria y su sentido está ligado a la resurrección del difunto."]},{"id":"I2-n08","tema":2,"pie":"Nefertari jugando al senet. Pintura mural de su tumba (QV66), Valle de las Reinas, Tebas. 19ª dinastía. Hacia 1255 a. C.","c2s":["La pintura documenta el senet, un juego de mesa para dos jugadores con un tablero de 30 casillas en tres filas de diez, en el que las fichas avanzaban en zigzag tras lanzar palitos o huesos marcados con números.","Lo jugaban las élites de ambos sexos, y por ello es una de las pocas prácticas en las que la mujer aparece en igualdad con el hombre, como muestra aquí la reina Nefertari.","Su presencia en la tumba responde a su valor religioso, ya que el senet aparece en numerosos ajuares funerarios y se menciona en el Libro de los Muertos, en el que el viaje de las fichas simbolizaba la resurrección de los fallecidos.","Documenta, en suma, un juego pausado, propio de los adultos, que unía el entretenimiento con las creencias sobre el más allá."],"C3":["Que las mujeres de todas las clases sociales jugaran al senet, porque la pintura retrata a una reina y el juego era propio de las élites.","Cuáles eran las reglas del juego, ya que la escena solo muestra el tablero y las fichas, sin la manera de mover ni de ganar.","Que Nefertari jugara esta partida en vida, puesto que la escena pertenece a su tumba y el juego tenía allí un sentido de tránsito hacia la resurrección."]},{"id":"I2-n09","tema":2,"pie":"El rey asirio Asurbanipal cazando un león. Relieve del palacio Norte de Nínive, hacia 645-635 a. C. British Museum.","c2s":["El relieve documenta la caza del león, que los reyes asirios habían convertido en una liturgia de Estado y que los persas heredaron al conquistarlos, aunque la transformaron.","En la Persia aqueménida se cazaba en los paradeisos, grandes parques cercados y abastecidos de leones, jabalíes, ciervos, antílopes y gacelas, en una actividad exclusiva del rey y de la nobleza.","El rey, además, se reservaba el derecho de cazar primero, hasta el punto de que Artajerjes I condenó a muerte a Megabizo por abatir un león antes que él."],"C3":["Que la escena muestre una cacería persa, ya que el relieve es asirio y los persas heredaron y transformaron esa práctica más tarde.","Que Asurbanipal matara leones cuerpo a cuerpo tal y como aparece, puesto que es un relieve de palacio hecho para exaltar al rey y escenificar su poder.","Que la caza del león estuviera al alcance de cualquier súbdito, porque la imagen solo retrata al rey y la práctica quedaba reservada al monarca y a la nobleza."]},{"id":"I2-n10","tema":2,"pie":"El pahlavan Rostam luchando contra un demonio. Hacia 1595. Philadelphia Museum of Art.","c2s":["La miniatura documenta la figura del pahlavan, «el campeón», que un texto del siglo X recoge por primera vez como un luchador profesional que se gana la vida con su cuerpo, peleando en público, exhibiéndose y protegiendo a quien lo contrata.","Esta figura surge tras la conquista árabe (651 d. C.), cuando desaparece la corte sasánida y la educación corporal se vincula a la ciudad y al bazar, con combates en fiestas y plazas, muchas veces entre barrios rivales, y entrenamientos en los zurkhaneh.","Los pahlavans formaban gremio, con un jefe que podía despachar en la corte real, y se regían por un código de lealtad, honestidad, humildad y protección del débil.","La imagen de Rostam venciendo a un demonio asocia, además, el título de pahlavan a la fuerza y a la victoria."],"C3":["Que los pahlavans combatieran contra seres sobrenaturales, ya que el adversario es un demonio y la escena es fantástica.","Cómo era el pahlavan del siglo X, dado que la miniatura es de hacia 1595, seis siglos posterior al primer texto que lo documenta.","Que el código de lealtad, honestidad y protección del débil se cumpliera siempre, puesto que con el tiempo muchos pahlavans acabaron viviendo de la pequeña delincuencia y de la matonería, algo que una imagen idealizada no recoge."]},{"id":"I2-n11","tema":2,"pie":"Príncipe de la dinastía Mazaffarid acompañado de un shatir. Hacia 1390 d. C.","c2s":["La miniatura documenta la figura del shatir, el mensajero real o correo de la corte persa, que transportaba mensajes o corría delante del caballo del monarca para alertar de posibles peligros.","Ese día se declaraba fiesta pública y los ciudadanos animaban a los corredores y les ofrecían fruta y agua, de modo que un servicio a la corte se convertía en un espectáculo colectivo.","Según un comerciante francés que lo presenció en 1667, el vencedor de aquel año tardó catorce horas, con un ritmo medio de 4:50 min/km."],"C3":["Cómo era la prueba de selección del shatir, ya que la miniatura es de hacia 1390 y la prueba de Isfahán se documenta en época safávida, casi tres siglos después.","Que el joven que camina fuera un corredor de resistencia excepcional, porque la imagen solo lo muestra acompañando al príncipe y nada dice de su preparación ni de sus marcas.","Que el oficio de shatir estuviera abierto a cualquier persona, puesto que la miniatura retrata un ámbito cortesano y no informa de la procedencia social de sus miembros."]},{"id":"I2-n12","tema":2,"pie":"Partida de chovgan. Miniatura del poema Guy u Chawgan, de Arefi. Tabriz, 1546 d. C.","c2s":["La miniatura documenta el chovgan, el primer deporte colectivo a caballo con pelota y taco, del que deriva el polo moderno, que es posible que practicaran ya los partos y que se consolidó a partir del periodo sasánida.","Se jugaba golpeando la pelota al galope, agachándose por debajo del cuello del caballo porque el mazo era corto, y los tantos se lograban al hacer pasar la bola entre dos pilares de madera o piedra.","Su finalidad era servir de entrenamiento bélico para la agilidad, la destreza y la toma rápida de decisiones en condiciones cambiantes como las de un campo de batalla.","Exigía, además, disponer de caballo propio, con el coste de cría, forraje y cuadra que suponía, de ahí que quedara en manos de la aristocracia y que el cortesano lo jugara para hacerse ver por el rey."],"C3":["Cuál era el reglamento del chovgan, ya que se desconoce, las normas podían ajustarse según el momento y una sola partida no fija el número de jugadores ni el tamaño de la pelota.","Cómo se jugaba en época sasánida, porque la miniatura es de 1546 y las descripciones cambian incluso entre los siglos XVI y XVII.","Que el chovgan fuera un juego al alcance de cualquiera, puesto que exigía caballo propio y la escena muestra un ámbito cortesano con un jinete coronado."]},{"id":"I2-n13","tema":2,"pie":"Partida de jereed.","c2s":["La ilustración documenta el jereed, un deporte hípico de naturaleza militar desarrollado desde el siglo XI y diseñado para entrenar el ataque y la huida durante la guerra.","Dos equipos de ocho a diez jugadores se enfrentaban en campo abierto, y un jinete se acercaba al bando contrario, le lanzaba su jabalina y salía al galope mientras los rivales lo perseguían lanzándole jabalinas de madera sin punta.","Lo practicaba el ejército para adiestrar a su caballería, y su continuidad llega hasta hoy en Turquía, donde se juega como cirit en unos cincuenta clubes."],"C3":["Cuál era el reglamento completo del juego, porque la imagen muestra solo a dos jinetes, sin los equipos de ocho a diez ni el sistema de puntos.","A qué época del jereed corresponde la escena, ya que la ilustración no lleva fecha ni procedencia y el juego se practica desde el siglo XI hasta hoy.","Que el jereed fuera un juego popular abierto a cualquiera, puesto que exigía caballo propio, con su coste, y era una práctica del ejército para adiestrar a la caballería."]},{"id":"I2-n14","tema":2,"pie":"Desembarco de troncos en una expedición en busca de madera del Líbano. Relieve de alabastro del palacio de Sargón II en Dur-Sharrukin (Khorsabad, Irak), reinado de Sargón II, 721-705 a. C. Museo del Louvre, París.","c2s":["El relieve documenta que la actividad física fenicia que sí admite documentación es el trabajo, en este caso el remo de pequeñas embarcaciones que transportaban madera de cedro remolcando los troncos a lo largo de la costa.","La cabeza de caballo tallada en la proa, que llevó a los griegos a llamar hippoi a estas naves, fue una de las principales innovaciones náuticas fenicias, aunque su finalidad no está clara y probablemente servía para distinguir la procedencia de los barcos.","Documenta, por tanto, un esfuerzo físico ligado al oficio y al transporte por mar."],"C3":["Que los fenicios practicaran el remo como competición, dado que el relieve muestra un trabajo de transporte de madera, sin carreras ni premios.","Cómo veían los propios fenicios su trabajo en el mar, porque es un relieve asirio, hecho para el palacio de Sargón II, que los retrata desde fuera.","Para qué servía la cabeza de caballo de la proa, ya que la imagen solo la muestra y la explicación de que distinguía la procedencia de los barcos es únicamente probable."]},{"id":"I2-n15","tema":2,"pie":"Niño con un perro maltés y una pelota. Figurita de terracota del santuario de Kharayeb, en el interior de Tiro (Líbano). Época helenística (el santuario se usó del siglo VII al I a. C.).","c2s":["La figurita procede del santuario de Kharayeb, que ha proporcionado 16.400 fragmentos de terracota y es el único conjunto de objetos que muestra cuerpos fenicios en actividad lúdica, con un 35 % de figuras de niños y un 22 % de mujeres.","Las figuras se han interpretado como ofrendas sagradas que marcaban ritos de paso de la infancia a la adultez, de modo que cada pieza simbolizaba la etapa que el niño dejaba atrás.","Documenta así un juego infantil integrado en el culto y una educación corporal que, en los mayores, se orientaba ya al gimnasio."],"C3":["Que los niños fenicios jugaran así en su vida diaria, porque las figuritas son ofrendas de un santuario con una función ritual de paso a la adultez.","Que esta práctica se diera a lo largo de toda la historia fenicia, ya que la pieza es de época helenística y el santuario se usó entre los siglos VII y I a. C.","Que el juego con pelota tuviera ya reglas fijas, dado que el paso del juego libre al reglado es una interpretación de los especialistas y la figura no muestra ninguna norma."]},{"id":"I2-n16","tema":2,"pie":"Recreación de una pátera fenicia de bronce procedente de Idalion, en el interior de Chipre. Siglos VIII-VII a. C.","c2s":["La pátera documenta las prácticas corporales femeninas en el ámbito fenicio, escasas pero atestiguadas sobre todo en contextos funerarios y religiosos, en este caso una danza ritual de mujeres ante una diosa en torno a un emblema solar.","Las mujeres participaban como músicos o bailarinas en la procesión que acompañaba al difunto hasta la necrópolis y durante el propio enterramiento, y aparecen también como plañideras.","Su presencia abrumadora en la música y la danza se puede entender como el reconocimiento de un papel propio en el espacio funerario, y es probable, asimismo, que en los funerales de las familias de élite participaran músicas profesionales."],"C3":["Que la danza femenina fuera un ocio cotidiano, ya que la escena es ritual, ante una diosa, y las fuentes la sitúan en el culto y los funerales.","Que las mujeres fenicias compitieran en pruebas físicas, porque la pátera muestra una danza en grupo, sin vencedores ni pruebas.","Cómo era con exactitud la decoración original de la pieza, puesto que se trata de una recreación dibujada a la que, además, le falta un sector."]},{"id":"I3-n01","tema":3,"pie":"Fresco de los niños púgiles · Akrotiri, Tera · Finales del siglo XVII a. C. · Museo Arqueológico Nacional de Atenas","c2s":["El fresco documenta que en Akrotiri, una ciudad de cultura minoica en la isla de Tera, los niños practicaban el pugilato a finales del siglo XVII a. C., y su peinado rapado con mechones indica que eran muchachos de familia privilegiada.","Además, la diferencia de adornos entre el vencedor, a la izquierda, y su rival, vestido con sencillez, muestra que el juego marcaba ya la jerarquía entre los hijos de la élite."],"C3":["Que el pugilato infantil se rigiera por un reglamento conocido, ya que desconocemos las reglas de este combate y la pintura solo muestra el gesto de los dos niños.","Que todos los niños de Tera boxearan, porque el peinado identifica a muchachos de familia privilegiada y el fresco retrata únicamente a ese grupo social.","Que el combate buscara herir al rival, puesto que la escena congela un solo instante y los estudios coinciden en leerlo como un ejercicio de aprendizaje."]},{"id":"I3-n02","tema":3,"pie":"Fresco del salto del toro · Palacio de Cnoso · Hacia 1450-1375 a. C. · Museo Arqueológico de Heraclión","c2s":["El fresco documenta la taurocatapsia o salto del toro, la práctica más representada del arte minoico, que consistía en saltar sobre un toro vivo y a la carrera en fiestas que reunían a la comunidad para contemplarlo.","Procede del palacio de Cnoso, del que provienen casi todas las imágenes de este salto, de modo que se convirtió en emblema del poder de ese centro palacial.","Los saltadores eran jóvenes de la élite, a juzgar por sus vestimentas, sus joyas y su melena larga, y la figura de los brazos extendidos suele leerse como alguien que recibe o sujeta al saltador en la caída."],"C3":["Que saltaran mujeres, porque la piel blanca que el arte egeo destinaba a las figuras femeninas admite otras lecturas, como una marca de edad o de función social, y hoy su presencia no puede afirmarse ni descartarse.","Que el salto terminara con la muerte o el sacrificio del toro, ya que la escena no muestra ese final y las imágenes minoicas no unen el salto con la muerte del animal.","Que toda la población de Creta practicara el salto, puesto que los saltadores visten como jóvenes de la élite y la pintura decoraba un palacio."]},{"id":"I3-n03","tema":3,"pie":"Fresco micénico con guerreros en carro · Siglo XIII a. C.","c2s":["La pintura documenta el carro, que junto con la caza del jabalí formaba el núcleo del deporte micénico que nos ha llegado y quedaba reservado al señor, en unos reinos gobernados desde palacios fortificados bajo un rey, el wanax.","Este mundo micénico del siglo XIII a. C. es el escenario en el que la Ilíada sitúa los juegos fúnebres de Patroclo, ocho pruebas en las que competían casi solo príncipes y en las que la carrera de carros ocupaba el lugar preferente.","No obstante, el poema se escribió entre 725 y 675 a. C. y retrata la sociedad de los basileis de los siglos IX y VIII a. C., que hacía del funeral de un jefe la ocasión de exhibir su prestigio."],"C3":["Que la escena represente los juegos fúnebres de Patroclo o una carrera, ya que muestra guerreros con casco y lanza y en ella no hay rivales, meta ni premio.","Que la Ilíada describa con fidelidad el deporte micénico, porque el poema se escribió cinco siglos después de la época en que sitúa su trama y retrata la sociedad de los basileis.","Que el carro estuviera al alcance de cualquier micénico, puesto que quedaba reservado al señor y la pintura solo muestra a dos guerreros, sin indicio alguno del resto de la población."]},{"id":"I3-n04","tema":3,"pie":"Escultura atribuida sin base a Corebo de Élide","c2s":["Atribuida sin fundamento a Corebo de Élide, la escultura apenas informa por sí sola de su figura, aunque remite al primer nombre de la lista de vencedores que Hipias de Élide compiló hacia 400 a. C. a partir de la tradición oral.","Según esa lista, Corebo ganó en 776 a. C. el stádion, la carrera de un estadio, que fue la única prueba durante las trece primeras ediciones.","Se le ha descrito como carnicero, cocinero o quizá oficiante de los sacrificios, y esta última lectura encaja con un testimonio tardío según el cual el vencedor de la carrera encendía el fuego del sacrificio en el altar de Zeus.","Además, su tumba marcaba el límite del territorio de Élide, de modo que el supuesto primer campeón sirvió también para fijar la frontera del espacio sagrado de Olimpia."],"C3":["Que la escultura sea un retrato de Corebo, puesto que la atribución carece de base y nada en la pieza permite identificarlo.","Que los Juegos comenzaran con seguridad en 776 a. C., ya que esa fecha procede de una lista compilada hacia 400 a. C. a partir de la tradición oral, que la mayoría de autores considera poco fiable en sus primeros siglos.","Que Corebo fuera un trabajador humilde o un personaje importante de su sociedad, porque se le ha descrito como carnicero, cocinero u oficiante de los sacrificios y la escultura no dice nada de su oficio."]},{"id":"I3-n05","tema":3,"pie":"Atleta vencedor recibe su premio · Psictér atribuido a Oltos · Metropolitan Museum of Art, Nueva York · Hacia 520-510 a. C.","c2s":["Además, los juegos locales sí entregaban premios económicos, como los 2.900 litros de aceite de las Panateneas, de ahí que los mejores atletas pudieran vivir holgadamente de su talento deportivo."],"C3":["Que la escena represente una victoria en Olimpia, ya que la pieza no indica el certamen y también los juegos locales coronaban y premiaban a sus vencedores.","Que el atleta recibiera solo la corona, porque la imagen muestra un único momento y las polis añadían celebraciones, estatuas, manutención y, en ocasiones, dinero.","Que el vencedor sea un atleta concreto e identificable, puesto que en la parte conservada no aparece ningún nombre y la pintura de un vaso muestra un tipo de vencedor y no un retrato."]},{"id":"I3-n06","tema":3,"pie":"Corredores con perizoma","c2s":["El vaso documenta la indumentaria de las primeras ediciones de los Juegos Olímpicos, en las que los atletas competían con una pequeña túnica atada a modo de cinturón o taparrabos llamada perizoma.","En 720 a. C. el corredor Orsipo de Mégara compitió desnudo y descalzo, y con ello inició un cambio que tardó más de un siglo en generalizarse y se mantuvo hasta el final del olimpismo, salvo en las pruebas hípicas."],"C3":["Que el vaso sea anterior a 720 a. C., ya que la pieza no lleva fecha y la desnudez tardó más de un siglo en generalizarse, de modo que ambas costumbres convivieron durante un tiempo.","Que estos corredores compitieran en Olimpia, porque la escena no identifica el certamen ni el lugar.","Que la perizoma fuera una prenda impuesta por un reglamento, puesto que la imagen muestra cómo vestían estos corredores y nada dice de una norma escrita."]},{"id":"I3-n07","tema":3,"pie":"Corredores del estadio · Vaso de figuras negras atribuido al Pintor de Eufileto · Hacia 530 a. C. · Museo Metropolitano de Nueva York","c2s":["La imagen coincide con la descripción que Filóstrato, autor de un tratado de gimnástica del siglo III d. C., hace de los velocistas como corredores de zancada amplia, con los brazos abiertos y las manos extendidas.","Asimismo, la musculatura marcada que el pintor da a las figuras es un rasgo asociado a la potencia que exige la velocidad explosiva."],"C3":["Que la escena muestre una final olímpica, ya que el vaso no indica el certamen ni la fase y en el stádion se corrían series antes de la final entre sus vencedores.","Que conozcamos el nombre del vencedor o el resultado, porque la escena fija un solo instante con los corredores todavía agrupados.","Que los velocistas corrieran exactamente con esa técnica, puesto que el pintor sigue unas convenciones artísticas y Filóstrato, cuya descripción coincide, escribió muchos siglos después."]},{"id":"I3-n08","tema":3,"pie":"Corredores de dólico · Hacia 500 a. C. · Museo Arqueológico Nacional de Atenas","c2s":["El vaso documenta el dólico, la carrera de fondo del programa olímpico, que entró en 720 a. C. y cubría en Olimpia entre 20 y 24 estadios, esto es, entre 3,8 y 4,6 kilómetros.","Las cerámicas muestran a estos corredores con cuerpos más livianos y menos musculados que los velocistas, en consonancia con el físico de un medio fondista."],"C3":["Que los corredores giraran en torno a un único poste o levantaran polvo para frenar al rival, ya que la escena solo muestra un tramo de carrera y esas normas proceden de los textos.","Que el dólico naciera de los mensajeros arcadios, porque esa es una de las hipótesis sobre su origen y la imagen no aporta nada sobre él.","Que conozcamos la distancia exacta de la prueba, puesto que en Olimpia oscilaba entre 20 y 24 estadios y un vaso no puede mostrar la longitud de una carrera."]},{"id":"I3-n09","tema":3,"pie":"Carrera de hoplitas · Museo del Louvre, París","c2s":["El vaso documenta el hoplitódromo o carrera de hoplitas, que cubría 2 estadios (384,56 m), entró en Olimpia en 520 a. C. y homenajeaba la carga de los últimos cincuenta metros antes del choque de las falanges.","El hoplita era el ciudadano capaz de pagarse la panoplia, que costaba de 75 a 100 dracmas, y la carrera se corría al principio con casco, grebas y escudo, aunque las grebas se eliminaron pronto, como en estas figuras, y después el casco."],"C3":["Que la carrera preparara a los ciudadanos para la guerra, ya que su utilidad militar se discute y premiaba al corredor aislado, sin la cohesión de la falange.","Que el escudo de la carrera pesara lo mismo que el de guerra, porque la imagen no permite medirlo y los 8 kg del escudo de guerra solo son una referencia aproximada.","Que la escena muestre una carrera de Olimpia o el momento exacto del cambio de equipo, puesto que el vaso no indica certamen ni fecha y la retirada de grebas y casco fue paulatina."]},{"id":"I3-n10","tema":3,"pie":"Pruebas del pentatlón en un ánfora panatenaica atribuida al Pintor de Eufileto · Hacia 530-520 a. C. · Museo Británico, Londres","c2s":["El ánfora documenta el pentatlón, que entró en Olimpia en 708 a. C. y reunía cinco pruebas, el salto, la jabalina, el estadio, el disco y la lucha, de las que el salto, la jabalina y el disco solo se disputaban en Olimpia den
