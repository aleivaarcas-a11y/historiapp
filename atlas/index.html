<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Atlas · Historiapp</title>
<style>
:root{
  --mar:#0e2a35;--tierra:#e7d6ab;--tinta:#1c160f;
  --laca:rgba(24,19,14,.94);--laca2:rgba(36,29,21,.97);--linea:rgba(232,210,160,.2);--linea2:rgba(232,210,160,.4);
  --texto:#f0e6cc;--tenue:#bcae8f;--oro:#dcaa45;--oro2:#f2d58c;--bien:#7fb6e8;--mal:#e8a24a;
  --serif:"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --ui:"Gill Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --chron:104px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--mar);color:var(--texto);font-family:var(--ui);overflow:hidden;-webkit-tap-highlight-color:transparent}
button,a.btn{font:inherit;color:inherit;cursor:pointer}
#map{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.pane{background:var(--laca);border:1px solid var(--linea);border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#top{position:fixed;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));display:flex;gap:8px;align-items:stretch;pointer-events:none;z-index:5}
#top>*{pointer-events:auto}
.brand{padding:7px 14px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.brand b{font:400 22px/1 var(--serif);letter-spacing:.14em;color:var(--oro2);white-space:nowrap}
.brand small{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--tenue);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb{min-width:44px;min-height:44px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;border:1px solid var(--linea);background:var(--laca);text-decoration:none;font-weight:700;font-size:14px;color:var(--texto)}
.tb:hover{border-color:var(--linea2)}
.tb.gold{background:linear-gradient(#e7b955,#c8922f);color:var(--tinta);border-color:#c8922f}
.sp{flex:1}
#zoom{position:fixed;left:max(10px,env(safe-area-inset-left));bottom:calc(var(--chron) + 22px);display:flex;flex-direction:column;gap:6px;z-index:4}
#layer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--chron) + 22px);padding:7px 14px;font:italic 14px var(--serif);color:var(--oro2);z-index:4;max-width:min(560px,70vw);text-align:center;pointer-events:none}
#layer small{display:block;font:11px var(--ui);font-style:normal;color:var(--tenue);margin-top:2px}
#chron{position:fixed;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));height:var(--chron);padding:8px 14px 6px;z-index:4;display:flex;flex-direction:column}
#chron .row{display:flex;align-items:center;gap:8px;min-height:30px}
#chron .lbl{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--oro)}
#chron .now{flex:1;font:italic 14px var(--serif);color:var(--texto);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.sm{min-height:30px;min-width:30px;padding:0 10px;border-radius:6px;border:1px solid var(--linea);background:rgba(255,255,255,.04);font-size:12.5px;font-weight:700;color:var(--texto)}
.sm.on{background:var(--oro);color:var(--tinta);border-color:var(--oro)}
#track{position:relative;flex:1;margin:4px 6px 0;touch-action:none;cursor:pointer}
#track .axis{position:absolute;left:0;right:0;top:34px;height:1px;background:var(--linea2)}
#track .tick{position:absolute;top:40px;transform:translateX(-50%);font-size:10.5px;color:var(--tenue);white-space:nowrap}
#track .tick.minor{opacity:.6}
#track .brk{position:absolute;top:28px;width:10px;height:12px;transform:translateX(-50%);border-left:1px solid var(--tenue);border-right:1px solid var(--tenue);opacity:.5;transform:translateX(-50%) skewX(-20deg)}
#track .mk{position:absolute;transform:translate(-50%,-50%);width:16px;height:16px;padding:0;border:0;background:none}
#track .mk svg{display:block}
#track .mk.future{opacity:.3}
#track .ev{position:absolute;top:6px;transform:translateX(-50%);width:9px;height:9px;padding:0;border:1px solid var(--oro2);background:var(--tinta);rotate:45deg;border-radius:1px}
#track .ev.on{background:var(--oro2)}
#cursor{position:absolute;top:0;bottom:12px;width:2px;background:var(--oro2);transform:translateX(-1px);box-shadow:0 0 8px rgba(242,213,140,.7);pointer-events:none}
#cursor::after{content:"";position:absolute;left:-6px;top:-2px;border:7px solid transparent;border-top-color:var(--oro2)}
#panel{position:fixed;z-index:6;display:flex;flex-direction:column;overflow:hidden}
#panel[hidden]{display:none}
#pc{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 18px 20px}
#pclose{position:absolute;right:8px;top:8px;width:40px;height:40px;border-radius:50%;border:1px solid var(--linea);background:var(--laca2);font-size:20px;line-height:1;z-index:2}
@media (min-width:821px){#panel{right:max(10px,env(safe-area-inset-right));top:74px;bottom:calc(var(--chron) + 22px);width:380px}}
@media (max-width:820px){#panel{left:8px;right:8px;bottom:calc(var(--chron) + 18px);max-height:min(58vh,560px)}.brand small{display:none}.brand b{font-size:15px;letter-spacing:.1em}.brand{padding:6px 10px}.tb{padding:0 10px}#play .pl{display:none}#track .tick.minor{display:none}#layer{bottom:calc(var(--chron) + 74px)}.hide-s{display:none}}
@media (min-width:821px){#play .ps{display:none}}
.kick{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--oro);display:flex;align-items:center;gap:8px;margin-right:40px}
h2{font:400 28px/1.1 var(--serif);margin:6px 40px 2px 0;color:var(--oro2)}
.sub{color:var(--tenue);font-size:13.5px;margin-bottom:10px}
.date{display:inline-block;font:italic 15px var(--serif);color:var(--texto);border-bottom:1px solid var(--linea2);padding-bottom:2px;margin-bottom:10px}
.hito{font:16px/1.5 var(--serif);margin:10px 0 8px}
.src{font-size:12.5px;color:var(--tenue);margin:4px 0 12px;line-height:1.45}
.src b{font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:10.5px;margin-right:6px}
.src .Material{color:#d9a184}.src .Iconografía{color:#e7b955}.src .Texto{color:#9cc3e6}
.gal{display:flex;gap:8px;overflow-x:auto;margin:6px -4px 10px;padding:0 4px 4px;scroll-snap-type:x mandatory}
.gal figure{margin:0;flex:0 0 auto;width:min(300px,78vw);scroll-snap-align:start}
.gal img{width:100%;height:170px;object-fit:cover;border-radius:6px;border:1px solid var(--linea);background:#2a221a;cursor:zoom-in}
.gal figcaption{font-size:11.5px;color:var(--tenue);margin-top:3px;line-height:1.3}
.sec{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--oro);margin:16px 0 8px;border-top:1px solid var(--linea);padding-top:12px}
.q{background:rgba(255,255,255,.03);border:1px solid var(--linea);border-radius:8px;padding:12px}
.q p{margin:0 0 10px;font:16px/1.4 var(--serif)}
.q .opt{display:block;width:100%;text-align:left;min-height:44px;margin:6px 0;padding:9px 12px;border-radius:6px;border:1px solid var(--linea2);background:rgba(255,255,255,.04);font-size:14.5px;line-height:1.35;color:var(--texto)}
.q .opt.ok{background:rgba(127,182,232,.22);border-color:var(--bien)}
.q .opt.ko{background:rgba(232,162,74,.22);border-color:var(--mal)}
.q .fb{font-size:13.5px;margin-top:8px;min-height:18px}
.q .nav{display:flex;justify-content:space-between;align-items:center;margin-top:8px;color:var(--tenue);font-size:12.5px}
.links{display:flex;flex-direction:column;gap:6px}
.lk{display:flex;align-items:center;gap:10px;min-height:44px;padding:8px 12px;border-radius:6px;border:1px solid var(--linea);background:rgba(255,255,255,.03);text-decoration:none;color:var(--texto);font-size:14px}
.lk .c{font-size:11px;color:var(--tenue);margin-left:auto;white-space:nowrap}
.lk.gold{background:linear-gradient(#e7b955,#c8922f);color:var(--tinta);border-color:#c8922f;font-weight:700;justify-content:center}
video{width:100%;max-height:360px;border-radius:6px;background:#000;margin:4px 0 8px}
.list .lk{gap:12px}
.list .lk svg{flex:0 0 auto}
.note{font-size:12px;color:var(--tenue);line-height:1.45;margin-top:12px}
.veil{position:fixed;inset:0;background:rgba(8,14,18,.62);display:grid;place-items:center;z-index:20;padding:16px}
.veil[hidden]{display:none}
.card{max-width:560px;width:100%;padding:24px 24px 20px;text-align:center}
.card h1{font:400 44px/1 var(--serif);letter-spacing:.12em;color:var(--oro2);margin:4px 0 8px}
.card .kick{justify-content:center;margin:0}
.card p{font:16px/1.5 var(--serif);margin:10px 0}
.card ul{text-align:left;font-size:14.5px;line-height:1.5;margin:12px 0 18px;padding-left:20px;color:var(--texto)}
.card .row2{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:30;display:grid;place-items:center;padding:12px}
#lb[hidden]{display:none}
#lb img{max-width:100%;max-height:86vh;border-radius:4px}
#lb p{color:var(--tenue);font-size:13px;text-align:center;margin:8px 0 0}
#toast{position:fixed;left:50%;top:78px;transform:translateX(-50%);padding:8px 14px;font-weight:700;color:var(--oro2);z-index:25;pointer-events:none;opacity:0;transition:opacity .3s}
#toast.on{opacity:1}
@media (max-width:480px){.brand b{font-size:0}.brand b::after{content:'AGÓN';font-size:16px;letter-spacing:.16em}}
body.emb #back,body.emb .brand,body.emb #lang{display:none}
body.emb #top{justify-content:flex-end}
#tchips{display:inline-flex;gap:4px}
.sm{white-space:nowrap}
</style>
</head>
<body>
<canvas id="map" aria-label="Mapa"></canvas>

<header id="top">
  <a class="tb" id="back" href="../#t3">‹ <span class="hide-s" data-t="back"></span></a>
  <div class="brand pane"><b>ATLAS</b><small data-t="tag"></small></div>
  <div class="sp"></div>
  <button class="tb" id="lang" aria-label="Idioma">EN</button>
  <a class="tb gold" id="play" href="../juegos/agon.html" target="_top">⚔ <span class="pl" data-t="play"></span><span class="ps">Agón</span></a>

</header>

<div id="zoom">
  <button class="tb" id="zin" aria-label="Acercar">+</button>

</div>

  </div>

</footer>

<div class="veil" id="intro" hidden>
  <div class="card pane">
    <div class="kick" data-t="introKick"></div>
    <h1>ATLAS</h1>
    <p data-t="introP"></p>
    <ul><li data-t="i1"></li><li data-t="i2"></li><li data-t="i3"></li><li data-t="i4"></li></ul>
    <div class="row2"><button class="tb" id="go" data-t="explore"></button><a class="tb gold" href="../juegos/agon.html" target="_top">⚔ <span data-t="play"></span></a></div>
  </div>
</div>
<div id="lb" hidden><div><img alt=""><p></p></div></div>
<div id="toast" class="pane"></div>

<script>
(async()=>{
  const get=u=>fetch(u,{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error(u);return r.json()});
  let M,A,T;
  try{[M,A,T]=await Promise.all([get('../data/atlas_mapa.json'),get('../data/atlas.json'),get('../data/temas.json')])}
  catch(e){document.body.insertAdjacentHTML('beforeend','<div class="veil"><div class="card pane"><p>No se ha podido cargar el Atlas. Comprueba la conexión y vuelve a intentarlo.<br><br>The Atlas could not be loaded. Check your connection and try again.</p></div></div>');return}
  const avail=new Set(T.temas.filter(x=>x.available).map(x=>x.num));
  const S=A.lugares.filter(l=>avail.has(l.tema)).map(l=>({id:l.id,g:l.civ,name:l.name,site:l.place,date:l.date,year:l.year,hito:l.text,ft:l.src.type,fc:l.src.cap,ref:l.ref,qs:l.qs,xy:l.xy,prov:l.prov,tema:l.tema,fichas:l.fichas,imgs:l.imgs,vids:l.vids}));
  const ids=new Set(S.map(s=>s.id));
  const EV=A.acontecimientos.filter(a=>avail.has(a.tema)).map(a=>({y:a.year,date:a.date,t:a.title,d:a.text,tema:a.tema,lugar:ids.has(a.lugar)?a.lugar:null}));
  start({MAP:{W:M.W,H:M.H,land:M.land,lakes:M.lakes,rivers:M.rivers,grat:M.grat,seas:M.seas},EX:{mounts:M.mounts,desert:M.desert,fert:M.fert,rlabels:M.rlabels,rose:M.rose},GEO:{prov:M.prov,layers:M.layers},S,EV,CIVS:A.civs,CREDITS:M.credits});
})();
function start(DATA){'use strict';
const {MAP,EX,GEO,S,EV,CIVS}=DATA;
const $=id=>document.getElementById(id);
/* ---------- idioma y textos ---------- */
const I18N={
 es:{back:'Historiapp',tag:'El deporte antiguo en el mapa',play:'Jugar a Agón',chron:'Crónica',all:'Todas las épocas',
  introKick:'Historiapp · Historia del Deporte',introP:'Los lugares del temario sobre el mapa real, con las fronteras de cada época. El Atlas crece con cada tema que se abre en la app y comparte mapa con el juego Agón.',
  i1:'Toca un lugar para abrir su cartela, con imágenes, fuente, preguntas, vídeos y fichas.',i2:'Toca una provincia para ver qué lugares del temario quedan dentro.',i3:'Arrastra la línea del tiempo de abajo y el mapa político cambia de época.',i4:'Los botones de tema, en la crónica, muestran u ocultan los lugares de cada tema.',
  explore:'Explorar el mapa',close:'Cerrar',src:'Fuente',refs:'Referencias',qs:'Pon a prueba lo que sabes',next:'Siguiente pregunta',qOf:'Pregunta {a} de {b}',ok:'¡Correcto! +5 XP',okNo:'¡Correcto!',ko:'La respuesta correcta está marcada en azul.',
  vids:'Vídeos del tema',fichas:'Fichas de Historiapp',conquer:'⚔ Conquistar este lugar en Agón',tema:'Tema {n}',notYet:'El Tema {n} todavía no está en Historiapp; sus fichas llegarán con él.',
  prov:'Provincia romana',provNote:'Límites hacia el 200 d. C. según el Ancient World Mapping Center (AWMC), a partir del Barrington Atlas. Las islas del Egeo, salvo Creta, figuran en Asia. Los límites entre Britannia Superior e Inferior y entre Galatia y Cappadocia son aproximados, porque no se conocen con precisión o faltan en los datos.',provSites:'Lugares del temario en esta provincia',provNone:'Ningún lugar del temario cae dentro de esta provincia.',outside:'Fuera del Imperio romano',
  ev:'Acontecimiento',goSite:'Ir al lugar',allEp:'Todas las épocas',allS:'Todas',year:'{y}',
  L_persia:'Imperio persa aqueménida',L_persiaS:'Extensión máxima, hacia 500 a. C.',L_alejandro:'Imperio de Alejandro',L_alejandroS:'Hacia 323 a. C.',L_roma60:'Roma hacia el 60 a. C.',L_roma60S:'Territorio bajo control romano',L_prov:'Provincias romanas',L_provS:'Hacia el 200 d. C.',L_none:'Sin fronteras dibujadas',L_noneS:'No hay un mapa político fiable para esta fecha',
  credit:'Fronteras: AWMC, ODbL · Costas y ríos: Natural Earth',
  tshort:'T{n}',bc:'a. C.',ad:'d. C.',xp:'+5 XP en Historiapp',soon:'Agón llega pronto a Historiapp'},
 en:{back:'Historiapp',tag:'Ancient sport on the map',play:'Play Agón',chron:'Chronicle',all:'All periods',
  introKick:'Historiapp · History of Sport',introP:'The places of the syllabus on the real map, with the borders of each period. The Atlas grows with every unit opened in the app and shares its map with the game Agón.',
  i1:'Tap a place to open its card, with images, source, questions, videos and study sheets.',i2:'Tap a province to see which places of the syllabus lie inside it.',i3:'Drag the timeline at the bottom and the political map changes period.',i4:'The unit buttons, in the chronicle, show or hide the places of each unit.',
  explore:'Explore the map',close:'Close',src:'Source',refs:'References',qs:'Test what you know',next:'Next question',qOf:'Question {a} of {b}',ok:'Correct! +5 XP',okNo:'Correct!',ko:'The right answer is marked in blue.',
  vids:'Videos from the unit',fichas:'Historiapp study sheets',conquer:'⚔ Conquer this place in Agón',tema:'Unit {n}',notYet:'Unit {n} is not in Historiapp yet; its study sheets will come with it.',
  prov:'Roman province',provNote:'Borders around AD 200 from the Ancient World Mapping Center (AWMC), based on the Barrington Atlas. The Aegean islands, except Crete, appear in Asia. The borders between Britannia Superior and Inferior and between Galatia and Cappadocia are approximate, because they are not precisely known or are missing from the data.',provSites:'Places of the syllabus in this province',provNone:'No place of the syllabus lies in this province.',outside:'Outside the Roman Empire',
  ev:'Event',goSite:'Go to the place',allEp:'All periods',allS:'All',year:'{y}',
  L_persia:'Achaemenid Persian Empire',L_persiaS:'Greatest extent, c. 500 BC',L_alejandro:'Empire of Alexander',L_alejandroS:'c. 323 BC',L_roma60:'Rome around 60 BC',L_roma60S:'Territory under Roman control',L_prov:'Roman provinces',L_provS:'Around AD 200',L_none:'No borders drawn',L_noneS:'There is no reliable political map for this date',
  credit:'Borders: AWMC, ODbL · Coasts and rivers: Natural Earth',
  tshort:'U{n}',bc:'BC',ad:'AD',xp:'+5 XP in Historiapp',soon:'Agón is coming to Historiapp soon'}};
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let lang=(()=>{try{const a=JSON.parse(localStorage.getItem('atlas.lang'));if(a)return a}catch(e){}try{const h=localStorage.getItem('historiapp.lang');if(h)return JSON.parse(h)||h}catch(e){try{const h=localStorage.getItem('historiapp.lang');if(h)return h}catch(_){}}return (navigator.language||'es').startsWith('es')?'es':'en'})();
if(lang!=='es'&&lang!=='en')lang='es';
const t=(k,v)=>{let s=(I18N[lang][k]??I18N.es[k]??k);if(v)for(const x in v)s=s.replace('{'+x+'}',v[x]);return s};
const L=o=>o==null?'':typeof o==='string'?o:(o[lang]||o.es||'');
function applyLang(){document.documentElement.lang=lang;if($('tchips'))buildChips();document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));if(innerWidth<520)$('tall').textContent=t('allS');$('lang').textContent=lang==='es'?'EN':'ES';$('back').title=t('back');renderChron();renderLayer();if(openState)reopen();dirty=true}
$('lang').onclick=()=>{lang=lang==='es'?'en':'es';ls.set('atlas.lang',lang);applyLang()};
/* ---------- XP en Historiapp (como el Pentatlón) ---------- */
const EMB=(()=>{try{return window.parent!==window&&window.parent.location.origin===location.origin}catch(e){return false}})();
const inHistoriapp=()=>{try{for(let i=0;i<localStorage.length;i++)if(localStorage.key(i).startsWith('historiapp.'))return true}catch(e){}return false};
function goApp(hash){if(EMB)window.parent.postMessage({atlas:'go',hash},location.origin);else location.href='../'+hash}
function hxp(n,key){if(EMB){window.parent.postMessage({atlas:'xp',n,key},location.origin);return true}if(!inHistoriapp())return false;try{const k='historiapp.progress';const p=JSON.parse(localStorage.getItem(k))||{xp:0,streak:0,lastDay:null,seen:{},badges:{},gl:{},daily:{}};p.xp=(p.xp||0)+n;localStorage.setItem(k,JSON.stringify(p));return true}catch(e){return false}}
function toast(s){const e=$('toast');e.textContent=s;e.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('on'),1500)}
/* ---------- grupos (mismos colores y formas que Agón) ---------- */
const GRP={};for(const k in CIVS)GRP[k]={c:CIVS[k].c,s:CIVS[k].s,st:CIVS[k].st};

  const r=siteR();const showNames=k>1.5;const rects=[];
  const ord=S.slice().sort((a,b)=>(a.id===selSite)-(b.id===selSite));
  for(const s of ord){if(!vis(s))continue;const[x,y]=sc(s.xy);if(x<-30||x>VW+30||y<-30||y>VH+30)continue;const G=GRP[s.g];const fut=Y!=null&&s.year>Y;const isSel=s.id===selSite;const isHov=hov==='s:'+s.id;
    ctx.globalAlpha=fut?.28:1;
    if(isSel){ctx.beginPath();ctx.arc(x,y,r*1.9+2*Math.sin(now/240),0,7);ctx.strokeStyle='rgba(246,210,122,.9)';ctx.lineWidth=2.5;ctx.stroke()}
    shapePath(ctx,G.s,x,y,isSel||isHov?r*1.2:r);ctx.fillStyle=G.c;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=G.st||'#ecd9a6';ctx.stroke();
    if(showNames||isSel||isHov){const nm=L(s.name);const fs=isSel?15:13;ctx.font=`600 ${fs}px ${serif}`;const w=ctx.measureText(nm).width;const ly=y+r+11;
      const box=[x-w/2-3,ly-8,x+w/2+3,ly+8];if(isSel||isHov||!rects.some(b=>b[0]<box[2]&&box[0]<b[2]&&b[1]<box[3]&&box[1]<b[3])){rects.push(box);ctx.lineWidth=4;ctx.strokeStyle='rgba(28,22,15,.88)';ctx.lineJoin='round';ctx.strokeText(nm,x,ly);ctx.fillStyle=isSel?'#f6d27a':'#f6eedb';ctx.fillText(nm,x,ly)}}
    ctx.globalAlpha=1}
  if(selSite)dirty=true;
}
const SEAEN={'Mar Mediterráneo':'Mediterranean Sea','Mar Negro':'Black Sea','Mar Caspio':'Caspian Sea','Mar Rojo':'Red Sea','Golfo Pérsico':'Persian Gulf','Océano Atlántico':'Atlantic Ocean','Mar Egeo':'Aegean Sea','Mar Adriático':'Adriatic Sea','Mar Tirreno':'Tyrrhenian Sea'};
const seaName=n=>lang==='en'?(SEAEN[n]||n):n;
function loop(now){draw(now);requestAnimationFrame(loop)}
/* ---------- cartelas ---------- */
let openState=null;const pc=$('pc');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function showPanel(){const was=$('panel').hidden;$('panel').hidden=false;pc.scrollTop=0;if(was)setTimeout(()=>dirty=true,0)}
function closePanel(){$('panel').hidden=true;selSite=null;selProv=null;openState=null;pc.querySelectorAll('video').forEach(v=>v.pause());dirty=true}
$('pclose').onclick=closePanel;
addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('lb').hidden)$('lb').hidden=true;else closePanel()}});
function reopen(){const o=openState;if(!o)return;if(o.t==='s')openSite(o.id,false,true);else if(o.t==='p')openProv(o.id,true);else if(o.t==='e')openEvent(o.i,true)}
const ANS=ls.get('atlas.ans',{});
function openSite(id,fly,keep){const s=SITE[id];if(!s)return;openState={t:'s',id};selSite=id;selProv=null;
  const G=civName(s.g);const temaAvail=true;
  let h=`<div class="kick">${shapeSVG(s.g,16)} ${esc(G)} · ${esc(t('tema',{n:s.tema}))}</div><h2>${esc(L(s.name))}</h2><div class="sub">${esc(L(s.site))}${s.prov?' · '+esc(s.prov):''}</div><div class="date">${esc(L(s.date))}</div>`;
  if(s.imgs.length){h+=`<div class="gal">${s.imgs.map(im=>{const cap=L(im.cap)||ficTitle(s,im.f);return `<figure><img loading="lazy" src="../${esc(im.src)}" alt="${esc(cap)}" data-cap="${esc(cap)}" onerror="this.closest('figure').remove()"><figcaption>${esc(cap)}</figcaption></figure>`}).join('')}</div>`}
  h+=`<div class="hito">${esc(L(s.hito))}</div><div class="src"><b class="${esc(s.ft)}">${esc(srcType(s.ft))}</b>${esc(L(s.fc))}${s.ref?'<br>'+esc(s.ref):''}</div>`;
  h+=`<div class="sec">${esc(t('qs'))}</div><div class="q" id="qbox"></div>`;
  if(s.vids.length&&temaAvail){h+=`<div class="sec">${esc(t('vids'))}</div>`+s.vids.map(v=>`<div class="sub" style="margin:0 0 2px">${esc(L(v.t))}</div><video controls playsinline preload="none" poster="../${esc(L(v.poster))}" src="../${esc(L(v.src))}"></video>`).join('')}
  h+=`<div class="sec">${esc(t('fichas'))}</div>`;
  if(temaAvail&&s.fichas.length)h+=`<div class="links">${s.fichas.map(f=>`<a class="lk" href="../#t${s.tema}/f/${esc(f.id)}" data-go="#t${s.tema}/f/${esc(f.id)}">📖 ${esc(L(f.t))}<span class="c">${esc(f.code||'')}</span></a>`).join('')}</div>`;
  else if(!temaAvail)h+=`<div class="note">${esc(t('notYet',{n:s.tema}))}</div>`;else h+=`<div class="links"><a class="lk" href="../#t${s.tema}/fichas" data-go="#t${s.tema}/fichas">📖 ${esc(t('tema',{n:s.tema}))}</a></div>`;
  h+=`<div class="sec"></div><div class="links"><a class="lk gold" href="../juegos/agon.html" target="_top">${esc(t('conquer'))}</a></div>`;
  pc.innerHTML=h;pc.querySelectorAll('[data-go]').forEach(a=>a.onclick=e=>{e.preventDefault();goApp(a.dataset.go)});showPanel();renderQ(s,keep?(renderQ.cur||0):firstUnanswered(s));
  pc.querySelectorAll('.gal img').forEach(im=>im.onclick=()=>{$('lb').querySelector('img').src=im.src;$('lb').querySelector('p').textContent=im.dataset.cap;$('lb').hidden=false});
  pc.querySelectorAll('video').forEach(v=>v.addEventListener('play',()=>pc.querySelectorAll('video').forEach(o=>{if(o!==v)o.pause()})));
  if(fly)flyTo(s.xy[0],s.xy[1],3.2);else{const r=viewRect(),x=(s.xy[0]-cam.x)*cam.k,y=(s.xy[1]-cam.y)*cam.k;if(x<r.x||x>r.x+r.w||y<r.y||y>r.y+r.h)flyTo(s.xy[0],s.xy[1],cam.k)}
  dirty=true}
$('lb').onclick=()=>$('lb').hidden=true;
const ficTitle=(s,fid)=>{const f=s.fichas.find(x=>x.id===fid);return f?L(f.t):''};
const srcType=ft=>lang==='en'?({Material:'Material',Iconografía:'Iconography',Texto:'Text'}[ft]||ft):ft;
function firstUnanswered(s){for(let i=0;i<s.qs.length;i++)if(ANS[s.id+':'+i]==null)return i;return 0}
function shuffle(n,seed){const a=[...Array(n).keys()];let x=seed;for(let i=n-1;i>0;i--){x=(x*9301+49297)%233280;const j=Math.floor(x/233280*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function renderQ(s,i){renderQ.cur=i;const q=s.qs[i],box=$('qbox');if(!box)return;const opts=L(q.o);const ord=shuffle(opts.length,(s.id.length*31+i*7+s.year)>>>0);
  box.innerHTML=`<p>${esc(L(q.q))}</p>${ord.map(j=>`<button class="opt" data-j="${j}">${esc(opts[j])}</button>`).join('')}<div class="fb"></div><div class="nav"><span>${esc(t('qOf',{a:i+1,b:s.qs.length}))}</span>${s.qs.length>1?`<button class="sm" id="qn">${esc(t('next'))} ›</button>`:''}</div>`;
  box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(box.dataset.done)return;box.dataset.done=1;const j=+b.dataset.j;const ok=j===0;
    box.querySelectorAll('.opt').forEach(o=>{if(+o.dataset.j===0)o.classList.add('ok')});if(!ok)b.classList.add('ko');
    const key=s.id+':'+i;let msg;if(ok){const first=ANS[key]!==1;ANS[key]=1;ls.set('atlas.ans',ANS);const got=first&&hxp(5,key);msg=got?t('ok'):t('okNo');if(got)toast(t('xp'))}else{if(ANS[key]==null)ANS[key]=0;ls.set('atlas.ans',ANS);msg=t('ko')}
    box.querySelector('.fb').textContent=msg;box.querySelector('.fb').style.color=ok?'var(--bien)':'var(--mal)'});
  delete box.dataset.done;const qn=$('qn');if(qn)qn.onclick=()=>renderQ(s,(i+1)%s.qs.length)}
function openProv(id,keep){const p=PBY[id];if(!p)return;openState={t:'p',id};selProv=id;selSite=null;
  const inside=S.filter(s=>s.prov===id&&vis(s)).sort((a,b)=>a.year-b.year);
  let h=`<div class="kick">${esc(t('prov'))}</div><h2>${esc(id)}</h2><div class="sec">${esc(t('provSites'))}</div>`;
  h+=inside.length?`<div class="links list">${inside.map(s=>`<button class="lk" data-s="${s.id}">${shapeSVG(s.g,18)}<span>${esc(L(s.name))}</span><span class="c">${esc(L(s.date))}</span></button>`).join('')}</div>`:`<div class="note">${esc(t('provNone'))}</div>`;
  h+=`<div class="note">${esc(t('provNote'))}</div>`;pc.innerHTML=h;showPanel();
  pc.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>openSite(b.dataset.s,true));
  if(!keep)flyTo(p.lab[0],p.lab[1],Math.max(cam.k,Math.min(5,1.4+60/Math.sqrt(p.area+1))));dirty=true}
function openEvent(i,keep){const v=EV[i];openState={t:'e',i};selProv=null;const sid=v.lugar;selSite=sid||null;
  let h=`<div class="kick">${esc(t('ev'))}</div><h2>${esc(L(v.t))}</h2><div class="date">${esc(L(v.date))}</div><div class="hito">${esc(L(v.d))}</div>`;
  if(sid)h+=`<div class="links"><button class="lk" id="evgo">${shapeSVG(SITE[sid].g,18)}<span>${esc(t('goSite'))}: ${esc(L(SITE[sid].name))}</span></button></div>`;
  pc.innerHTML=h;showPanel();if(sid){$('evgo').onclick=()=>openSite(sid,true);if(!keep)flyTo(SITE[sid].xy[0],SITE[sid].xy[1],2.6)}dirty=true}
/* ---------- arranque ---------- */
$('help').onclick=()=>{$('intro').hidden=false};$('go').onclick=()=>{$('intro').hidden=true;ls.set('atlas.seen',1)};
$('intro').addEventListener('click',e=>{if(e.target.id==='intro'){$('intro').hidden=true;ls.set('atlas.seen',1)}});
$('back').href='../';
if(EMB){document.body.classList.add('emb');const q=new URLSearchParams(location.search).get('lang');if(q==='es'||q==='en')lang=q}
buildChips();
resize();fit(false);applyLang();
if(!ls.get('atlas.seen',0))$('intro').hidden=false;
const h=location.hash.slice(1);if(h&&SITE[h])setTimeout(()=>openSite(h,true),200);
requestAnimationFrame(loop);
window.__atlas={openSite,openProv,setY,cam,fit};
}
