.vplay{width:100%;border-radius:16px;background:#000;max-height:70vh}

<script>
(()=>{try{const th=localStorage.getItem('historiapp.theme')||'auto';let dk=th==='dark';if(th==='auto')dk=matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.classList.toggle('dark',dk)}catch(e){}})();
(async()=>{
  const get=u=>fetch(u,{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error(u);return r.json()});
  let M,A,T;
  try{[M,A,T]=await Promise.all([get('../data/atlas_mapa.json'),get('../data/atlas.json'),get('../data/temas.json')])}

  const avail=new Set(T.temas.filter(x=>x.available).map(x=>x.num));
  const S=A.lugares.filter(l=>avail.has(l.tema)).map(l=>({id:l.id,g:l.civ,name:l.name,site:l.place,date:l.date,year:l.year,hito:l.text,ft:l.src.type,fc:l.src.cap,ref:l.ref,xy:l.xy,prov:l.prov,tema:l.tema,fichas:l.fichas,vids:l.vids,secs:l.secs||[],nodos:l.nodos||[],hitos:l.hitos||[],glos:l.glos||[],preg:l.preg||[]}));

  document.getElementById('loading').remove();
  start({MAP:{W:M.W,H:M.H,land:M.land,lakes:M.lakes,rivers:M.rivers,grat:M.grat,seas:M.seas},EX:{mounts:M.mounts,desert:M.desert,fert:M.fert,rlabels:M.rlabels,rose:M.rose},GEO:{prov:M.prov,layers:M.layers,eras:M.eras||[],ecol:M.ecol||{}},S,EV,CIVS:A.civs,CREDITS:M.credits});
})();
function start(DATA){'use strict';
const {MAP,EX,GEO,S,EV,CIVS}=DATA;
const $=id=>document.getElementById(id);
/* ---------- idioma y textos ---------- */
const I18N={
 es:{back:'Historiapp',tag:'El deporte antiguo en el mapa',play:'Jugar a Agón',chron:'Crónica',all:'Todas las épocas',

  i1:'Toca un lugar para ver qué cuenta de él el temario, con sus fichas, el apartado y el mapa del tema, la línea del tiempo, los conceptos, las preguntas y los vídeos.',i2:'Toca una provincia para ver qué lugares del temario quedan dentro.',i3:'Arrastra la línea del tiempo de abajo y el mapa político cambia de época.',i4:'Los botones de tema, en la crónica, muestran u ocultan los lugares de cada tema.',

  vids:'Vídeos',fichas:'Fichas',inTema:'En el temario',practice:'Practicar el apartado',conceptMap:'Mapa del tema',tline:'En la línea del tiempo',openLine:'Abrir la línea del tiempo',gloss:'Conceptos clave',vfQ:'Verdadero o falso',true:'Verdadero',false:'Falso',tema:'Tema {n}',notYet:'El Tema {n} todavía no está en Historiapp; sus fichas llegarán con él.',
